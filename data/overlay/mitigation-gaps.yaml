# Requirements against EXISTING CoSAI controls, not a second capability taxonomy.
# Assessment scope: D3FEND 1.6.0 and ATLAS 2026.09. See docs/MITRE-CAPABILITY-GAPS.md.
gaps:
  - control: controlModelPrivacyEnhancingTechnologies
    assessment: unmapped
    missing: >-
      No sufficiently explicit capability for differential privacy, secure aggregation,
      privacy-preserving federated training, or evaluated anonymization/synthetic-data privacy.
      Ordinary encryption and access control do not establish these guarantees.
    related: [AML.M0012]
  - control: controlRuntimePrivacyEnhancingTechnologies
    assessment: partial
    missing: >-
      Guardrails cover sensitive-data detection and redaction. Secure multiparty inference,
      homomorphic computation and privacy-preserving query mechanisms are not explicitly
      represented. Message/file encryption does not imply encrypted computation.
    related: [AML.M0020, AML.M0012]
  - control: controlIsolatedConfidentialComputing
    assessment: partial
    missing: >-
      Hardware process isolation is represented. Confidential-memory guarantees, workload
      attestation, measurement-bound key release and side-channel protections require explicit
      implementation evidence beyond that technique.
    related: [D3-HBPI, D3-EI]
  - control: controlUserDataManagement
    assessment: partial
    missing: >-
      Guardrails, inventory, access mediation and memory hardening cover constituent functions.
      End-to-end consent and purpose enforcement, user-data retention/deletion across all
      stores and provider copies, and proving those commitments remain outside these mappings.
      ATLAS Memory Hardening does include retention/deletion for agent memory.
    related: [AML.M0020, AML.M0031, D3-DI, D3-AMED]
  - control: controlTrainingDataManagement
    assessment: partial
    missing: >-
      Dataset provenance and sanitization contribute, but provenance does not establish legal
      authorization, consent or permitted purpose for training/evaluation data. Data-use approval
      and provenance interpretation remain explicit implementation and governance requirements.
    related: [AML.M0025, AML.M0007]
  - control: controlUserTransparencyAndControls
    assessment: unmapped
    missing: >-
      User-facing AI disclosures, consent choices and data-use controls have no sufficiently
      matching capability in this technical profile. Content filtering, authentication and
      human approval of agent actions are not substitutes for those experiences.
    related: []
  - control: controlUserPoliciesAndEducation
    assessment: unmapped
    missing: >-
      Policy publication and user education remain people/process obligations. ATLAS AML.M0018
      User Training is available as a nontechnical mitigation, but is deliberately excluded
      from the technology-capability catalogue.
    related: []
  - control: controlInternalPoliciesAndEducation
    assessment: unmapped
    missing: >-
      Internal policy authoring, publication and employee education remain people/process
      obligations. ATLAS AML.M0018 User Training is related but is not a technical capability.
    related: []
  - control: controlProductGovernance
    assessment: partial
    missing: >-
      Model validation and operational risk assessment support governance. Ownership, policy
      approvals, supplier assurance, release authorization and accountable decisions are not
      implemented merely by deploying those capabilities.
    related: [AML.M0008, D3-ORA]
  - control: controlRiskGovernance
    assessment: partial
    missing: >-
      Operational Risk Assessment provides a standardized concept. Residual-risk acceptance,
      supplier evidence evaluation and ongoing governance workflows still need organizational
      processes and evidence; a tool does not fulfill them automatically.
    related: [D3-ORA]
  - control: controlAgentObservability
    assessment: partial
    missing: >-
      AI telemetry and system-file tampering analysis are represented. Immutable retention,
      non-repudiation and complete audit-chain guarantees need separate implementation evidence.
      Observable execution events do not reveal complete internal model reasoning.
    related: [AML.M0024, D3-SFA]
  - control: controlModelAndDataIntegrityManagement
    assessment: partial
    missing: >-
      Code/artifact signing, verification and integrity monitoring are represented. Signed-media
      provenance interoperability (for example C2PA), watermark semantics and authenticity of
      generated media are not fully specified by these capabilities. Authenticity is not truth.
    related: [AML.M0013, AML.M0014, D3-FIM]
  - control: controlOrchestratorAndRouteIntegrity
    assessment: partial
    missing: >-
      Configuration permissions and integrity monitoring support route protection. Signed route
      manifests, binding responses to the chosen model, and end-to-end route/provenance checks
      must be verified as application-specific implementations.
    related: [D3-SCP, D3-FIM, D3-MAN]
