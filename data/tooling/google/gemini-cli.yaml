      - mitigation: cap-agent-action-policy-enforcement
        coverage: native
        mechanism: Admin-tier policy engine TOML plus BeforeTool hooks in the system settings file
        steps: &a1
          - title: Ship admin policies
            body:
              - "Place [[rule]] files in /etc/gemini-cli/policies (or the macOS / Windows equivalents): admin tier 5
                outranks user and workspace tiers; use commandPrefix / commandRegex for shell, mcpName for
                servers, decision deny with denyMessage."
            url: https://geminicli.com/docs/reference/policy-engine/
          - title: Add a BeforeTool gate
            body:
              - 'A hooks.BeforeTool command in the system settings receives tool_name and tool_input and blocks with
                {"decision": "deny"} or exit code 2. The hooks page ranks project and user settings above
                system settings for hooks, so treat the admin policy tier as the enforced layer and the hook
                as defence in depth.'
            url: https://geminicli.com/docs/hooks/reference/
        note: >-
          The policy engine TOML is deterministic and admin-tiered; BeforeTool hooks are an integration point
          whose logic the organisation writes. Sub-agents and MCP tools pass through the same engine; a remote
          server's own actions are outside it.
        verified: 2026-09-10
