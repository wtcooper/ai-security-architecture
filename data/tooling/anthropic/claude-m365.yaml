                List local sessions whose product_surface is office_agents/excel, office_agents/powerpoint,
                office_agents/word or office_agents/outlook from the Compliance API.
            url: https://platform.claude.com/docs/en/manage-claude/compliance-sessions
        note: >-
          Partial by the rule: enforcement exists (only deployed add-ins once self-install is closed; only
          Owner-enabled connectors) but there is no owner or approval record per add-in or connector.
          Integrated apps shows what administrators deployed, not copies users installed from AppSource while
          the store was open or a third-party manifest pointing the add-in at another gateway; connectors a
          user authorised live only on that user's device. Compliance API session listings cover Claude-account
          Enterprise use only.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAgentRegistry
          reviewRequired: false
          original:
