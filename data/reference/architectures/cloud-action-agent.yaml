id: archActionAgent
surface: surfaceCloud
rank: 1
title: Single agent workflow
abbrev: Single agent

summary:
  - >
    A single agent operating a business process end to end — reading a request, deciding, and
    writing to systems of record in seconds, with no human between the decision and the effect.
    The architecture where the design question is reversibility rather than accuracy.

description:
  - >
    Everything structural here follows from one fact: the agent writes. A retrieval assistant that
    is wrong produces a wrong sentence; this produces a refund, a provisioned account, a cancelled
    order. The controls that matter are the ones that bound what can be done and make it undoable,
    not the ones that improve the odds of being right.
  - >
    The tool services are the primary control, and here they should be a deterministic action
    catalogue. The model chooses among named, parameter-validated actions rather than composing
    arbitrary calls, and each action declares its own blast radius and its own compensating
    transaction. An agent that can
    call an arbitrary API is not an agent with a policy problem; it is an agent with no policy
    surface at all.
  - >
    The attacker is typically an authenticated customer. The request text is supplied by the
    person who benefits from the outcome, and it reaches the same context window as the system
    instruction — indirect prompt injection with a very short path to money. The second injection
    path arrives through retrieval: record content written months earlier, by requesters and by
    staff, re-enters the loop as context. That is why the approval threshold is tied to
    consequence rather than confidence, and why it must be rare — a gate on every action is a
    queue nobody reads, while below the threshold the compensating path, reversal rather than
    review, is what keeps a wrong action survivable.
  - >
    The agent needs an identity of its own. Actions taken as a shared service account are neither
    attributable nor separately revocable, which turns every incident into a full-service outage
    when the response is to disable the credential. And its network calls leave through an AI
    gateway — brokered credentials, budget limits and the audit tap — the same crossing the
    durable multi-agent workflow draws, at single-agent scale. The in-process tool set is the
    drawn exception, and the reason it is drawn.

distinguishedBy:
  - >
    Against the chat agent with tools: same loop, but there a human sits in the thread and
    approves as part of the conversation. Here the trigger is a queue or a timer, nobody is
    between the decision and the effect, and the catalogue, the threshold and the compensating
    transaction carry the weight the human carried there.
  - >
    Against the durable multi-agent workflow: that one is a durable, multi-agent process surviving crashes
    and replay across days. This is one agent on one fast path, deciding in seconds — no
    supervisor, no journal, no replay — and still consequential, which is why the catalogue,
    the threshold and the compensating transaction carry the weight instead of durability
    machinery. The relationship is nesting, not contrast: each of that architecture's subagents
    is this diagram one level down.

exemplars:
  - name: Sierra Agent OS
    note: >
      Goal-oriented service agents that resolve billing disputes, execute returns and update
      subscriptions without a human, escalating above a threshold — the autonomous
      customer-resolution shape this drawing describes, packaged as a platform.
    url: https://sierra.ai
    asOf: "2026-09"
  - name: OpenAI Agents SDK
    note: >
      A build-your-own harness for exactly this loop: typed tools, guardrail hooks and
      handoffs, with the action surface and its bounds supplied by the builder.
    url: https://platform.openai.com/docs/guides/agents
    asOf: "2026-09"
  - name: Claude Agent SDK
    note: >
      The agent loop with parallel tool execution and hooks, run against a tool catalogue the
      deployment defines — the single-agent workflow from the first commit.
    url: https://docs.claude.com/en/api/agent-sdk/overview
    asOf: "2026-09"

zones:
  - id: zoneUser
    owner: user
    note: >
      The requester — usually an authenticated customer, and usually the party who benefits
      from the action. Present at the start and absent for the rest of it.
  - id: zoneCloud
    owner: cloud
    note: >
      Everything we operate: the surface the request arrives on, what triggers the loop when
      nobody sends one, the loop itself, its state, the crossing every call leaves through, and
      our own tool servers and systems of record.
  - id: zoneExternal
    owner: external
    note: Outside the company — the model provider, third-party tool servers, and the services an action lands on.
  - id: zoneGovernance
    owner: governance
    note: >
      Drawn across every band because it governs every band. With no human in the loop, this
      band is the whole of the oversight — there is no in-thread approval to fall back on.

blocks:
  - id: events
    kind: service
    title: Triggers & schedules
    cosaiComponent: componentAgentUserQuery
    zone: zoneCloud
    col: 2
    row: 0
    note: >
      Queue messages, file drops, webhooks and timers that start the loop with no human in the
      room. In many deployments this is the common trigger and the front end is the exception,
      which is the fact that reorganises this architecture's whole control set.
    items:
      - id: schedules
        label: Schedules & events
        icon: clock
        note: The timer or queue message that starts a run nobody asked for interactively.

  - id: entry
    kind: service
    title: Application front end
    cosaiComponent: componentApplication
    zone: zoneCloud
    col: 1
    row: 1
    note: >
      The surface a request arrives on, and where the requester's identity is bound before the
      loop runs. Drawn even though triggers are the common path, because when a human does
      start a run this is the component that decides whose authority it carries.
    items:
      - id: api
        label: App & API endpoint
        icon: globe
        note: The published request surface.
      - id: authn
        label: Identity binding
        icon: shield
        note: Who is asking, bound before the loop runs — the identity the actions are taken on behalf of.

  - id: requester
    kind: actor
    title: Requester
    icon: person
    zone: zoneUser
    col: 0
    row: 1
    note: >
      Usually an authenticated customer, and usually the party who benefits from the action. Both
      the legitimate user and, on a bad day, the attacker.

  - id: localTools
    kind: service
    title: Tool services
    cosaiComponent: componentTools
    zone: zoneCloud
    parent: planner
    col: 0
    row: 1
    note: >
      The tools compiled into the application itself — decorated functions running in the
      loop's own process, under its identity, with its egress and its secrets. This is the
      default and most common way a tool gets attached, and the reason it is drawn: **the
      in-process tool set is invisible to any gateway**. Only what leaves over the network
      shows up at a chokepoint, so whatever lives here is governed by code review or by
      nothing.
    items:
      - id: inProcess
        label: Tool handlers
        icon: code
        note: Functions in the application, holding whatever the application holds.
      - id: connectors
        label: APIs & connectors
        icon: plug
        note: Ordinary outbound calls the application makes itself, without a broker in front.

  - id: planner
    kind: service
    title: Agent harness
    zone: zoneCloud
    col: 2
    row: 1
    cosaiComponent: componentReasoningCore
    note: >
      Chooses the next action from the catalogue, given the request and what it has read. Runs
      under its own workload identity, distinct from both the requester and the service.
    items:
      - id: loop
        label: Agent loop
        icon: agent
        note: Reads context, calls the model, proposes an action. The full cycle completes in seconds.
      - id: context
        label: Context assembly
        icon: doc
        note: Merges the instruction, the memory and the tool results into one prompt.

  - id: stateRetrieval
    kind: service
    title: Memory & state
    zone: zoneCloud
    col: 2
    row: 2
    cosaiComponent: componentDataStorage
    note: >
      The business policy, the customer's history and the working state of this case. Record
      content is the second injection path — written by requesters and staff, re-entering as
      context.
    items:
      - id: retrieval
        label: Vector index
        icon: search
        cosaiComponent: componentRAGContent
        note: Reads scoped to the account under discussion, not to what the service can reach.
      - id: caseState
        label: Case state
        icon: folder
        cosaiComponent: componentMemory
        note: >
          Scoped to one case. Cross-case memory would let one requester's text influence
          another's outcome.

  - id: gateway
    kind: service
    title: AI gateway
    zone: zoneCloud
    col: 3
    row: 1
    note: >
      The one crossing every network-brokered model and tool call leaves through — the
      in-process tool set is the drawn exception. The agent tier holds no standing
      credentials; the gateway brokers them per call, meters spend and writes the audit trail
      as a tap on the crossing. Its items are the traffic classes it brokers — the checks it
      runs are the numbered pins on this block and its edges, and the call-outs beneath.
    pack: aiGatewayTraffic

  - id: internalTools
    kind: service
    title: Tool services
    zone: zoneCloud
    col: 3
    row: 2
    cosaiComponent: componentTools
    items:
      - id: mcpServers
        label: MCP servers
        icon: plug
      - id: apis
        label: APIs & connectors
        icon: plug
      - id: a2a
        label: A2A peer agents
        icon: agent
      - id: sandboxedTools
        label: Sandboxed tools
        icon: shield
        note: >
          Code execution in an isolated runtime, admitted by the registry like any other tool
          — the loop writes code; only the sandbox should run it, and what it installs comes
          from the mirror and nowhere else.
    note: >
      Our own action surface, and this architecture's primary control. Whatever the transport,
      what is admitted here should form a deterministic catalogue — named, parameter-validated
      actions with a declared blast radius and a compensating transaction — rather than
      arbitrary calls. With no human in the loop, this is what stands in for approval.

  - id: provider
    kind: provider
    title: Model provider
    zone: zoneExternal
    col: 5
    row: 0
    cosaiComponent: componentModelServing
    note: The published inference interface. What runs behind it is the provider's and is not drawn.
    items:
      - id: inference
        label: Inference API
        icon: model
        note: Returns the chosen action and its parameters — content the catalogue validates rather than trusts.

  - id: orgData
    kind: external
    title: Enterprise data
    zone: zoneCloud
    col: 3
    row: 3
    cosaiComponent: componentDataSources
    note: >
      The systems where effects land, and where reversal either exists or does not — and the
      source the tool surface reads back into context on the same hop. Record content written
      by requesters and staff is this architecture's second injection path, and it arrives by
      the same edge the writes leave on.
    items:
      - id: transactions
        label: Org data
        icon: db
        note: Orders, accounts and entitlements — the authoritative state the agent changes.
      - id: fileStorage
        label: File storage
        icon: folder
        note: Case documents and attachments, read back into context on a later run.

  - id: extTools
    kind: service
    title: Tool services
    zone: zoneExternal
    col: 5
    row: 2
    cosaiComponent: componentTools
    pack: toolServicesRemote
    items:
      - id: peers
        label: A2A peer agents
        icon: agent
        note: Cross-org delegation over the A2A protocol. A peer's output enters the loop as input.
    note: >
      Third-party servers, connectors and peer agents, out where nobody we contracted with
      operates them. Admitted by assessment at the crossing, or refused there.

  - id: downstream
    kind: external
    title: Downstream services
    cosaiComponent: componentDataSources
    zone: zoneExternal
    col: 5
    row: 3
    pack: downstreamPublic
    note: >
      Where an action lands outside the company — mail sent, tickets moved, calendar entries
      written on the requester's behalf — and where the untrusted content that returns enters
      the next model call.

  - id: govIdentity
    kind: governance
    title: Identity services
    icon: person
    zone: zoneGovernance
    col: 0
    row: 4
    capabilities: [capabilityIga, capabilityNhiManagement]
    note: >
      Issues the agent's workload identity and the requester's, and keeps them distinct. The
      loop runs as itself and acts on the requester's grant — conflating the two is how an
      unattended agent quietly acquires standing authority.

  - id: govSecrets
    kind: governance
    title: Secrets & key management
    icon: key
    zone: zoneGovernance
    col: 1
    row: 4
    capabilities: [capabilitySecretsManagement, capabilityCredentialIsolation]
    note: Short-lived credentials minted per call, so a loop running with nobody watching holds no standing keys.

  - id: govPolicy
    kind: governance
    title: Policy & authorization
    icon: scale
    zone: zoneGovernance
    col: 2
    row: 4
    capabilities: [capabilityToolPermissionScoping, capabilityEgressControl, capabilityRateLimiting, capabilityHitlControls]
    note: >
      The bounds the tool surface enforces per invocation, authored and changed outside the
      loop — because the loop is the thing that may be misbehaving.

  - id: govSupplyChain
    kind: governance
    title: Supply-chain assurance
    icon: db
    zone: zoneGovernance
    col: 4
    row: 4
    capabilities: [capabilityAgentRegistry, capabilityModelEvals, capabilitySystemPromptManagement, capabilityMcpToolSecurity, capabilityAiBom]
    note: >
      Which actions exist at all — admission, not discovery — the behavioural checks in
      front of every model, prompt or catalogue change, and the versioned ownership of the
      system instruction itself.

  - id: govObservability
    kind: governance
    title: Observability & response
    icon: eye
    zone: zoneGovernance
    col: 5
    row: 4
    capabilities: [capabilityAuditLogging, capabilityKillSwitch]
    note: >
      The decision audit and the stop, plus the approval threshold — keyed to irreversibility
      and value rather than model confidence, and rare enough that somebody actually reads it.

  - id: operator
    kind: actor
    title: Operator
    icon: person
    zone: zoneUser
    col: 0
    row: 2
    note: >
      The approver for actions above the threshold — an operator work queue, never the
      requester, because the beneficiary approving their own remedy is no gate at all. Present
      only when a proposal escalates; the loop runs without them the rest of the time.

  - id: registry
    kind: external
    title: Private pkg registry
    cosaiComponent: componentDataSources
    zone: zoneCloud
    col: 4
    row: 2
    note: >
      The organisation-maintained mirror that serves whatever the sandbox installs: a
      dependency the agent's generated code needs, a tool package a step pulls in. Read-only
      to agents, because a writable cache is a message board between sandboxes and an escape
      route — the OpenAI–Hugging Face incident began there.
    items:
      - id: hub
        label: Approved packages
        icon: db

edges:
  - from: events
    to: planner
    path: primary
    label: trigger
    note: >
      A timer, queue message, file drop or webhook starts a run with nobody in the room. In
      many deployments this is the common path and the request surface is the exception.
  - from: operator
    to: entry
    path: primary
    bidir: true
    route: hv
    label: escalation / approval
    note: >
      A proposal above the threshold surfaces here, bound to the exact action, arguments and
      case, with an expiry; the approval returns the same way and is validated against the
      pending proposal before anything executes.
  - from: requester
    to: entry
    path: primary
    bidir: true
    label: request / outcome
    note: >
      When a human does start a run, this is where their identity is bound — and the outcome
      is what they see rather than the reasoning that produced it.
  - from: entry
    to: planner
    path: primary
    bidir: true
    note: The request arrives with the requester's identity attached; the outcome returns the same way.
  - from: planner
    to: stateRetrieval
    path: primary
    bidir: true
    note: >
      Business policy, the customer's history and the working state of this case, read back as
      context and written forward as the run proceeds.
  - from: planner
    to: gateway
    path: primary
    bidir: true
    label: model & tool calls
    note: >
      Every network call out of the loop crosses here on a brokered credential. The agent tier
      holds no standing keys of its own.
  - from: internalTools
    to: registry
    path: primary
    bidir: true
    label: pinned installs
    note: >
      What a sandboxed step installs is pulled straight from the mirror, pinned by digest —
      never from a public registry. The sandbox's network policy is what makes the mirror the
      only place it can fetch from; the AI gateway brokers model and tool calls and is not on
      this path.
  - from: gateway
    to: provider
    path: external
    bidir: true
    route: hv
    note: >
      Inference on the brokered credential. The completion names the action and its parameters
      — content the tool surface validates rather than trusts.
  - from: gateway
    to: internalTools
    path: primary
    bidir: true
    label: internal tool calls
    note: >
      The proposed action, admitted against the catalogue and narrowed to a scoped grant before
      anything executes.
  - from: internalTools
    to: orgData
    path: primary
    bidir: true
    label: scoped reads & writes
    note: >
      Where the effect lands and where reversal either exists or does not — and where record
      content written by requesters and staff is read back into a later run as context.
  - from: gateway
    to: extTools
    route: hv
    path: external
    bidir: true
    label: brokered external calls
    note: Third-party servers and peer agents, reached only through the crossing that admitted them.
  - from: extTools
    to: downstream
    path: external
    bidir: true
    note: >
      Actions landing outside the company, and the untrusted content that returns into the next
      model call with nobody reading it first.

pins:
  risks:
    - risk: riskPromptInjection
      at: requester->entry
      note: >
        The request text is supplied by the person who benefits from the outcome, and it reaches
        the same context window as the system instruction.
    - risk: riskPromptInjection
      at: internalTools->orgData
      note: >
        Record content is the harder injection path — written months earlier, by someone handling
        a different case, re-entering as context now.
    - risk: riskRogueActions
      at: internalTools->orgData
      note: >
        Untrusted request text, a model choosing among real transactions, and a write path into
        records compound here.
    - risk: riskInsecureModelOutput
      at: gateway->provider
      note: The completion names an action and its parameters, and it is unauthenticated content.
    - risk: riskAgenticDelegationConfusedDeputy
      at: planner
      note: >
        The agent acts on a requester's behalf using authority broader than theirs. Keeping the
        requester's context alive through the loop is what closes the gap.
    - risk: riskSensitiveDataDisclosure
      at: internalTools->orgData
      note: Reads not scoped to the account under discussion pull other customers' records into context.
    - risk: riskRunawayAgentToolLoops
      at: planner
      note: A loop that retries and re-plans in seconds can spend and act faster than anyone notices.
    - risk: riskPromptInjection
      at: stateRetrieval
      note: >
        Case memory keyed loosely enough to collide across cases lets one requester's text
        steer another's outcome — memory poisoning by its OWASP name, pinned as prompt
        injection per the recorded deviation.
    - risk: riskRetrievalVectorStorePoisoning
      at: stateRetrieval
      note: >
        The search index grounds every case decision; content planted there by whoever can
        write to the indexed sources returns as trusted context.
    - risk: riskInsecureIntegratedComponent
      at: localTools
      note: >
        Handlers compiled into the loop's process hold whatever the process holds and cross no
        chokepoint — a vulnerable or malicious in-process tool is invisible to every drawn
        control.
    - risk: riskPromptInjection
      at: gateway->extTools
      note: >
        Content returning from actions outside the company was authored by somebody else and
        re-enters the next model call as context.
    - risk: riskToolRegistryTampering
      at: gateway->internalTools
      note: The catalogue is the policy surface; whoever can edit it programs the agent.
    - risk: riskEconomicDenialOfWallet
      at: gateway
      note: Per-token inference behind an open trigger surface makes unbounded requests a spend problem.

    - risk: riskToolSourceProvenance
      at: internalTools->registry
      note: >
        What the sandbox installs is code the agent chose, on a name it read in a task or a tool
        result; the mirror decides which build answers to that name, and whoever can write to
        the mirror programs every sandbox that pulls from it.
  capabilities:
    - capability: capabilityIga
      at: requester->entry
      note: >
        Who is asking, established before the loop runs — the identity every downstream action
        is taken on behalf of, and the thing that bounds the reachable set.
    - capability: capabilityAgentRegistry
      at: govSupplyChain
      note: >
        Actions exist because the catalogue admitted them, not because a model named them.
        Admission is a change-time decision made here; the gateway enforces the resulting
        catalogue per call.
    - capability: capabilityModelEvals
      at: govSupplyChain
      note: >
        Behavioural checks in front of every model, prompt or catalogue change, because with
        nobody watching a run there is no later opportunity to notice the change was wrong.
    - capability: capabilitySystemPromptManagement
      at: govSupplyChain
      note: >
        The system instruction is versioned, reviewed and owned like the catalogue it governs —
        in an unattended workflow, a prompt change is a behaviour change nobody will be present
        to notice.
    - capability: capabilityToolPermissionScoping
      at: gateway->internalTools
      note: >
        Named, parameter-validated actions with declared blast radius and a compensating
        transaction each — the deterministic surface everything else assumes.
    - capability: capabilityHitlControls
      at: internalTools->orgData
      note: >
        An approval gate keyed to irreversibility and value, rare enough to be read; below it,
        reversal rather than review. The approver is the operator on the drawing, reached over
        the front end — never the requester, because the beneficiary approving their own remedy
        is no gate at all. The escalation scenario walks the round trip.
    - capability: capabilityAgentRuntimeEnforcement
      at: gateway->internalTools
      note: >
        A per-invocation policy decision — this action, this record, this value, now — rather
        than a session-time grant.
    - capability: capabilityNhiManagement
      at: planner
      note: A distinct, revocable workload identity per agent, so actions are attributable and separately revocable.
    - capability: capabilityDataAccessGovernance
      at: internalTools->orgData
      note: Entitlement-filtered retrieval scoped to the account under discussion, enforced before fetching.
    - capability: capabilityPromptInjectionDefense
      at: requester->entry
      note: Classify request text before the loop; the caller cannot be trusted about their own request.
    - capability: capabilityMemoryProtection
      at: stateRetrieval
      note: Case-scoped memory with hard boundaries — no cross-case reads, ever.
    - capability: capabilitySecretsManagement
      at: planner->gateway
      note: Brokered, per-workload, expiring model credentials; the agent tier holds no standing key.
    - capability: capabilityRateLimiting
      at: gateway
      note: Quotas and cost ceilings on the crossing, before token spend and action volume are committed.
    - capability: capabilityEgressControl
      at: gateway->extTools
      note: >
        Named destinations only, enforced at the crossing we operate. The catalogue bounds what
        can be done; the egress allowlist bounds where it can land — the last boundary between
        a content-borne injection and an attacker's collection endpoint.
    - capability: capabilityPromptInjectionDefense
      at: gateway
      note: >
        Returned record and external content is classified at the crossing before it re-enters
        the loop's context — the harder injection path gets the same treatment the request
        text does.
    - capability: capabilityCredentialIsolation
      at: gateway->internalTools
      note: >
        Effective authority is the intersection of the requester's grant, the agent's identity,
        the action policy and the target record — never the union, which is what a confused
        deputy runs on.
    - capability: capabilityAuditLogging
      at: govObservability
      note: >
        Every action with reasoning, inputs and identity, written where the agent can append and
        cannot amend.
    - capability: capabilityKillSwitch
      at: govObservability
      note: A halt that also revokes the agent's identity, and does not require a deploy.

    - capability: capabilityRagSecurity
      at: stateRetrieval
      note: >
        Ingest trust on what enters the case index and per-tenant isolation inside it — the
        answer to a poisoned index, distinct from scoping what a read may return.
    - capability: capabilityPromptInjectionDefense
      at: gateway->extTools
      note: >
        Third-party and peer-agent returns are classified at the crossing before they re-enter
        the loop — the widest author set on the drawing.
    - capability: capabilityMcpToolSecurity
      at: govSupplyChain
      note: >
        Admission is change-time; the rug-pull is a tool whose definition changes after
        admission. Content-hash pinning of admitted tool descriptions is what catches it.
    - capability: capabilityAiBom
      at: registry
      note: >
        Digest and signature verification at admission to the mirror, and an inventory of which
        packages a sandbox may pull — the registered embodiment of artifact scanning.
    - capability: capabilityDataAccessGovernance
      at: registry
      note: >
        Read-only to agents. A cache a sandbox can write to is a shared medium between agent
        instances that were meant to be isolated, and a proxying mirror is a road to the
        internet the sandbox was not supposed to have.
    - capability: capabilityEgressControl
      at: internalTools->registry
      note: >
        The sandbox's network policy is what makes the mirror the only place it may fetch from —
        a deny-by-default allowlist with one entry. The AI gateway is not on this path; it never
        was for a package manager.
walkthrough:
  title: A customer asks for a refund
  moves: >-
    A request in, the agent's chosen action out, and the record it changed.
  steps:
    - follow: requester->entry
      note: The request arrives authenticated and bound to an account; the loop starts with that identity intact.
    - follow: entry->planner
      note: The request enters the loop with the requester's identity attached.
    - follow: planner->stateRetrieval
      note: Policy and the customer's history are requested, scoped to this account.
    - follow: stateRetrieval->planner
      note: They come back into the context window.
    - follow: planner->gateway
      note: The context leaves the loop through the gateway, on a brokered credential.
    - follow: gateway->provider
      note: The model proposes an action and parameters from the catalogue.
    - follow: provider->gateway
      note: The proposal comes back across the crossing — unauthenticated content, now the plan.
    - follow: gateway->internalTools
      note: The proposal is validated — well-formed, in policy, under the value threshold.
    - follow: internalTools->orgData
      note: The refund executes, with its compensating transaction on file.
    - follow: orgData->internalTools
      note: The record confirms the change.
    - follow: internalTools->gateway
      note: The result crosses back, logged against the call that caused it.
    - follow: gateway->planner
      note: The loop closes its plan with the outcome.
    - follow: planner->entry
      note: The outcome heads back to the surface.
    - follow: entry->requester
      note: Within seconds; the audit holds the reasoning.

scenarios:
  - title: The request text is the attack
    steps:
      - follow: requester->entry
        note: >
          The text instructs the agent to ignore policy and refund in full; whatever survives
          classification enters the same context window as the system instruction.
      - follow: entry->planner
        note: The text enters the loop as the task.
      - follow: planner->gateway
        note: Whatever survived classification rides out with the context.
      - follow: gateway->provider
        note: A steered model proposes the most generous action available.
      - follow: provider->gateway
        note: The steered proposal comes back as the plan.
      - follow: gateway->internalTools
        note: The catalogue does not care what steered the model — parameters and policy bounds hold.
      - follow: internalTools->orgData
        note: Below the threshold the action is compensable; above it the approval gate fires.
  - title: A timer fires with nobody in the room
    steps:
      - follow: events->planner
        note: >
          The common trigger in many deployments: a queue message or schedule starts the run,
          and there is no requester to return an outcome to.
      - follow: planner->gateway
        note: The unattended run crosses on the same brokered credential an attended one would.
      - follow: gateway->provider
        note: The model proposes an action with nobody watching the proposal.
      - follow: provider->gateway
        note: The proposal comes back with nobody to read it.
      - follow: gateway->extTools
        note: The action reaches outward, admitted by the same catalogue and egress allowlist.
      - follow: extTools->downstream
        note: >
          The effect lands outside the company, and what returns re-enters the next call as
          somebody else's content. With no human anywhere on this path, the catalogue, the
          threshold and the compensating transaction are the whole of the control set.
  - title: The injection was written months ago
    steps:
      - follow: planner->gateway
        note: >
          The loop needs a customer record — and crosses first, because nothing on the agent
          tier reaches a tool surface directly.
      - follow: gateway->internalTools
        note: The lookup is admitted against the catalogue and narrowed to this case.
      - follow: internalTools->orgData
        note: The record is read like any other.
      - follow: orgData->internalTools
        note: A note written into it long ago, in someone else's case, comes back with the content.
      - follow: internalTools->gateway
        note: It crosses back as an ordinary tool result.
      - follow: gateway->planner
        note: And lands in context beside the system instruction.
      - follow: planner->gateway
        note: The assembled context — injected note included — leaves for the model.
      - follow: gateway->provider
        note: The model reads it with nothing marking it apart.
      - follow: provider->gateway
        note: The proposal it produces is the attacker's, in the model's voice.
      - follow: gateway->internalTools
        note: The catalogue and the per-call policy are the controls that were built for exactly this turn.

  - title: A refund above the threshold escalates
    steps:
      - follow: planner->gateway
        note: The loop proposes a refund well above the compensable threshold.
      - follow: gateway->internalTools
        note: The per-call policy trips the threshold; the catalogue refuses to execute and returns a suspension.
      - follow: internalTools->gateway
        note: The suspension comes back as the call's result.
      - follow: gateway->planner
        note: The loop parks the proposal rather than retrying it.
      - follow: planner->entry
        note: The proposal heads to the surface — the action, the amount, the case, an expiry.
      - follow: entry->operator
        note: An operator, never the requester, reads it in a work queue.
      - follow: operator->entry
        note: Approved — this action, these arguments; a blanket "yes" approves nothing in particular.
      - follow: entry->planner
        note: The approval is validated against the parked proposal.
      - follow: planner->gateway
        note: Only then does the action leave again.
      - follow: gateway->internalTools
        note: Admitted now, carrying the approval it lacked before.
      - follow: internalTools->orgData
        note: The refund executes, attributable to both the loop and the approver.

  - title: A dependency arrives with the task
    steps:
      - follow: planner->gateway
        note: A step needs a package its generated code imports, on a name the model chose.
      - follow: gateway->internalTools
        note: The code runs in the sandboxed tools, admitted like any other tool call.
      - follow: internalTools->registry
        note: The sandbox pulls from the mirror directly — the one destination its network policy allows.
      - follow: registry->internalTools
        note: The admitted build comes back, pinned by digest — the hop a poisoned package actually arrives on.
      - follow: internalTools->gateway
        note: The step's result crosses back like any tool result.
      - follow: gateway->planner
        note: >
          And the loop continues. The mirror stays read-only to the sandbox: a cache it could
          write to would be a message board between sandboxes.

deviations:
  - subject: In-process tool handlers are drawn with no edges
    reason: >
      The localTools block warns rather than models: tools compiled into the application run
      in its process, so their calls traverse no drawable path of ours, and drawing edges
      would assert a governed hop that does not exist. The bound is code review at admission,
      which is why the risk is pinned on the block itself.
  - subject: The gateway's Skills broker item has no drawn supply path
    reason: >
      The aiGatewayTraffic pack is byte-identical across the catalogue, and this drawing keeps
      it whole because the tier brokers skills traffic in deployments that use skills. The
      supply chain behind the item — a private package registry and its signing pipeline — is
      deliberately outside this runtime drawing's scope; the endpoint personal agent draws the
      pull path.
  - subject: The application front end absorbs inbound classification
    reason: >
      capabilityPromptInjectionDefense is embodied by the AI gateway, but request text is
      classified where it arrives — the entry tier absorbs the duty in this simple deployment
      shape, mirroring the chat sibling's recorded absorption of the service edge.
  - subject: Memory poisoning is pinned as prompt injection
    reason: >
      OWASP's agentic taxonomy names memory poisoning as a distinct threat; CoSAI's risk set
      has no equivalent, so the cross-case memory risk is pinned as prompt injection — the
      nearest true statement, recorded rather than papered over, matching the multi-agent
      sibling.

