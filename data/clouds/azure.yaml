    differences:
      - at: gateway->api
        text: "API Management sits outside the cluster and KAITO's endpoint is a cluster-only address. You must publish the service on an internal load balancer or ingress and join API Management to the cluster's virtual network; otherwise the cluster has to expose a public endpoint."
        url: https://learn.microsoft.com/en-us/azure/api-management/api-management-kubernetes
      - at: gateway->api
        text: "A Kubernetes network policy cannot name API Management, which is not a pod, and load balancers can rewrite source addresses. As well as default deny, restrict the serving service to the gateway's subnet range, for example with loadBalancerSourceRanges."
        url: https://learn.microsoft.com/en-us/azure/aks/use-network-policies
      - at: storage->runtime
        text: "KAITO does not load from Blob Storage. Its presets pull public container images that already hold the weights, and its custom path downloads from Hugging Face. To serve your own verified release, mount Blob into a vLLM deployment you define, or build a private image."
        url: https://learn.microsoft.com/en-us/azure/aks/ai-toolchain-operator
      - at: runtime
        text: "Microsoft's page says only the Hugging Face runtime supports the KAITO custom-model template. A model outside the preset list therefore does not run on vLLM through KAITO; deploy vLLM as your own Kubernetes workload if you need it."
        url: https://learn.microsoft.com/en-us/azure/aks/kaito-custom-inference-model
      - at: runtime
        text: "KAITO creates a GPU node pool for each workspace by itself, from the instance type in the manifest. Node pools you add and taint by hand for each sensitivity tier are a separate mechanism; decide which one owns the GPU nodes."
        url: https://learn.microsoft.com/en-us/azure/aks/ai-toolchain-operator
      - at: registry->storage
        text: "The registry keeps model files in storage accounts it creates in its own managed resource group, not in your serving Blob account. A release step must copy the promoted version out (az ml model download) into the serving account and record its digest."
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-registry-network-isolation
      - at: gateway
        text: "The gateway does not check content itself. The llm-content-safety policy sends prompts and completions to a separate Azure AI Content Safety resource you must create and connect. On streamed answers it stops the stream instead of returning a 403 error."
        url: https://learn.microsoft.com/en-us/azure/api-management/llm-content-safety-policy
    alsoNeeded:
      - service: "Microsoft Entra Workload ID on AKS"
        role: identity
        why: "Serving pods need their own Entra identity to read weights from Blob once shared keys are disabled."
        url: https://learn.microsoft.com/en-us/azure/aks/workload-identity-overview
      - service: "Virtual network with API Management injection or integration"
        role: network
        why: "Lets the gateway reach the private cluster endpoint; needs Developer, Premium, Standard v2 or Premium v2 tier."
        url: https://learn.microsoft.com/en-us/azure/api-management/virtual-network-concepts
      - service: "AKS internal load balancer (or ingress controller)"
        role: ingress
        why: "Publishes the cluster-only inference service on a private address the gateway can call."
        url: https://learn.microsoft.com/en-us/azure/aks/internal-lb
      - service: "Azure Firewall for AKS egress"
        role: network
        why: "Restricts outbound connections so serving nodes cannot pull weights or images from public hubs."
        url: https://learn.microsoft.com/en-us/azure/aks/limit-egress-traffic
      - service: "Azure AI Content Safety"
        role: other
        why: "Required backend of the llm-content-safety policy; a separate resource the gateway's identity must be granted."
        url: https://learn.microsoft.com/en-us/azure/ai-services/content-safety/overview
      - service: "Azure Blob storage CSI driver"
        role: other
        why: "Mounts the Blob container of promoted weights into the serving pod."
        url: https://learn.microsoft.com/en-us/azure/aks/csi-storage-drivers
      - service: "Azure Container Registry"
        role: registry
        why: "Holds your serving image; Defender for Containers scans it there."
        url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-intro
      - service: "Azure Key Vault"
        role: keys
        why: "Holds the release signing key whose public half the serving image verifies against."
        url: https://learn.microsoft.com/en-us/azure/key-vault/general/overview
      - service: "Log Analytics workspace (Azure Monitor)"
        role: logging
        why: "Destination for gateway and generative AI gateway logs; Microsoft Sentinel reads from it."
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/log-analytics-workspace-overview
      - service: "Microsoft Defender for Cloud"
        role: other
        why: "Parent of the Defender for Storage and Defender for Containers plans the settings rely on."
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-cloud-introduction
    quickstart:
      - title: "Import Language Model API"
        url: https://learn.microsoft.com/en-us/azure/api-management/openai-compatible-llm-api
      - title: "Azure API Management with Microservices in AKS"
        url: https://learn.microsoft.com/en-us/azure/api-management/api-management-kubernetes
    # <<< checked
    reference:
      - title: Deploy an AI model on AKS with the AI toolchain operator add-on
        url: https://learn.microsoft.com/en-us/azure/aks/ai-toolchain-operator
      - title: Architecture pattern for AI workloads (Azure Well-Architected)
        url: https://learn.microsoft.com/en-us/azure/well-architected/ai/architecture-pattern
      - title: AI gateway capabilities in Azure API Management
        url: https://learn.microsoft.com/en-us/azure/api-management/genai-gateway-capabilities
    summary:
      - >-
        Open-weights models served by vLLM on AKS GPU node pools — the shape the AI toolchain
        operator (KAITO) add-on deploys — behind API Management as the one front door for every
        consuming application. Releases come from the Azure Machine Learning registry and load from
        Blob Storage after their signature is checked. With no provider applying content policy, the
        gateway's content-safety checks on prompts and completions are the organisation's own.
    bindings:
      - { block: consumers, service: Your applications and agents, build: true, note: "Each calls the gateway with its own managed identity." }
      - { block: gateway, service: Azure API Management (AI gateway) }
      - { block: api, service: vLLM OpenAI-compatible server, builtWith: vLLM, note: "Reachable only from API Management; the gateway exposes the /v1 operations and nothing else." }
      - { block: runtime, service: vLLM on AKS GPU node pools (KAITO), builtWith: vLLM, note: "KAITO's custom-model template downloads from Hugging Face at start-up; load from your storage instead." }
      - { block: storage, service: Azure Blob Storage (model files) }
      - { block: sources, service: Public model hubs (Hugging Face) }
      - { block: registry, service: Azure Machine Learning registry }
    settings:
      - apimValidateToken
      - apimRateLimitByKey
      - vllmCacheSalt
      - apimContentSafetyCompletions
      - apimWeightedPool
      - vllmRuntimeLora
      - storageSharedKeyAccess
      - defenderMalwareScanning
      - modelLoadVerification
      - servingModelRecord
      - aksGpuNodeTaints
      - aksNetworkPolicy
      - defenderContainerVa
      - apimGatewayLogs

  - architecture: archTrainingPipeline
    asOf: "2026-10"
    # >>> checked against the vendor's documentation
    verified: "2026-11-18"
    sources:
      upstreamArtifacts: https://learn.microsoft.com/en-us/azure/devops/artifacts/concepts/upstream-sources
      pkgRegistry: https://learn.microsoft.com/en-us/azure/devops/artifacts/concepts/feeds
      curation: https://learn.microsoft.com/en-us/azure/machine-learning/concept-ml-pipelines
      corpus: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-create-data-assets
      trainJob: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-create-attach-compute-cluster
      storage: https://learn.microsoft.com/en-us/azure/machine-learning/concept-workspace
      evaluation: https://learn.microsoft.com/en-us/azure/foundry/concepts/ai-red-teaming-agent
      registry: https://learn.microsoft.com/en-us/azure/machine-learning/concept-machine-learning-registries-mlops
    differences:
      - at: upstreamArtifacts->pkgRegistry
        text: "An Azure Artifacts feed with upstream sources is a pull-through cache: any package a Collaborator installs is saved automatically, with no approval step. Give build and training identities the plain Reader role, and admit packages and base checkpoints through a separate reviewed job."
        url: https://learn.microsoft.com/en-us/azure/devops/artifacts/concepts/upstream-sources
      - at: pkgRegistry->trainJob
        text: "The training job does not fetch packages itself. Azure ML installs them when it builds the environment's container image, on a build compute you must nominate when the registry is private, then caches the image in Azure Container Registry. The mirror needs an outbound rule."
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-managed-network
      - at: storage->registry
        text: "Azure adds a step: the candidate is first registered in the training workspace from the job output, then copied to the registry with az ml model share. The registry stores its own copy, so compare digests after the copy, not only before."
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-share-models-pipelines-across-workspaces-with-registries
      - at: storage->registry
        text: "Sharing from a locked-down workspace fails if its storage account has public access disabled. Microsoft's fix is to set the account to selected networks and add the registry as an allowed resource instance, a deliberate exception you must configure."
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-registry-network-isolation
      - at: evaluation->registry
        text: "Azure ML has no built-in approval gate or signing. MLOps v2 puts the human approval in a CI/CD pipeline (Azure Pipelines or GitHub Actions) that promotes the model. You must build that pipeline, and it becomes the identity holding the signing key."
        url: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/guide/machine-learning-operations-v2
      - at: corpus
        text: "A data asset version cannot be edited or deleted, but it only points at a storage path. The files underneath can still change unless you write each corpus version to a new path and turn on Blob versioning or immutability."
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-create-data-assets
      - at: evaluation
        text: "Cloud and portal red teaming runs only target Foundry or Azure OpenAI deployments and Foundry agents. A candidate trained in Azure ML must be tested with the local SDK through a callback to your evaluation endpoint, and still needs a Foundry project."
        url: https://learn.microsoft.com/en-us/azure/foundry/how-to/develop/run-ai-red-teaming-cloud
      - at: curation
        text: "Curation steps that call Azure AI Language or Content Safety send every example to those services. Under approved-outbound isolation each needs its own outbound rule or private endpoint, and the curation identity needs access to them."
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-managed-network
    alsoNeeded:
      - service: "Azure Container Registry"
        role: registry
        why: "Every Azure ML workspace builds and caches training environment images here; training nodes pull from it."
        url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-intro
      - service: "Azure Pipelines (or GitHub Actions) with approvals"
        role: other
        why: "Runs the promotion pipeline and holds the human approval gate that MLOps v2 describes."
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals
      - service: "Azure Key Vault"
        role: keys
        why: "Dedicated signing vault and storage encryption keys; the workspace also needs its own vault for secrets."
        url: https://learn.microsoft.com/en-us/azure/key-vault/general/overview
      - service: "Microsoft Entra managed identities"
        role: identity
        why: "Separate identities for training cluster, evaluation compute and promotion pipeline."
        url: https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/overview
      - service: "Azure Firewall (managed network FQDN rules)"
        role: network
        why: "Azure ML deploys and bills it when you add any outbound rule by host name, such as the package mirror."
        url: https://learn.microsoft.com/en-us/azure/firewall/overview
      - service: "Azure ML managed online endpoint"
        role: other
        why: "Red teaming needs the candidate served somewhere; the setting assumes an isolated evaluation endpoint."
        url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-endpoints-online
      - service: "Microsoft Foundry project"
        role: other
        why: "Prerequisite for the AI Red Teaming Agent, in one of its supported regions."
        url: https://learn.microsoft.com/en-us/azure/foundry/how-to/develop/run-scans-ai-red-teaming-agent
      - service: "Azure AI Language (PII detection) and Azure AI Content Safety"
        role: other
        why: "Called by the curation filters; separate resources to create, secure and reach privately."
        url: https://learn.microsoft.com/en-us/azure/ai-services/language-service/personally-identifiable-information/overview
      - service: "Log Analytics workspace (Azure Monitor)"
        role: logging
        why: "Destination for workspace resource logs; none are collected until a diagnostic setting exists."
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/log-analytics-workspace-overview
      - service: "Microsoft Defender for Cloud (Defender for Storage)"
        role: other
        why: "Provides the on-upload malware scanning used on dataset and model storage."
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-cloud-introduction
    quickstart:
      - title: "Create a secure workspace with a managed virtual network"
        url: https://learn.microsoft.com/en-us/azure/machine-learning/tutorial-create-secure-workspace
      - title: "Share models, components, and environments across workspaces with registries"
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-share-models-pipelines-across-workspaces-with-registries
      - title: "Set up MLOps with Azure DevOps"
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-setup-mlops-azureml
    # <<< checked
    reference:
      - title: Machine learning operations (MLOps) v2
        url: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/guide/machine-learning-operations-v2
      - title: Workspace managed network isolation (Azure Machine Learning)
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-managed-network
      - title: Architecture pattern for AI workloads (Azure Well-Architected)
        url: https://learn.microsoft.com/en-us/azure/well-architected/ai/architecture-pattern
    summary:
      - >-
        Azure Machine Learning end to end: pipeline jobs curate versioned data assets, GPU compute
        clusters train inside a managed virtual network that allows only approved outbound traffic,
        and candidates are registered from the job that produced them. A separate promotion pipeline
        — the only identity that can use the signing key — signs a release into the Azure Machine
        Learning registry after the evaluation gate and a human approval, following MLOps v2's gated
        promotion between workspaces.
    bindings:
      - { block: upstreamArtifacts, service: "Public hubs (Hugging Face, PyPI, conda)" }
      - { block: dataOrigins, service: Your data sources, build: true, note: "Internal records, purchased and scraped sets, and labelling vendors' output." }
      - { block: pkgRegistry, service: Azure Artifacts feed, note: "Universal Packages carry admitted base checkpoints beside the training dependencies." }
      - { block: curation, service: Azure Machine Learning pipeline (data prep) }
      - { block: corpus, service: Azure ML data assets on Blob Storage }
      - { block: trainJob, service: Azure ML GPU compute cluster, note: "In a managed virtual network; RL rollouts go to the agent sandbox drawing." }
      - { block: storage, service: Azure Blob Storage (job outputs) }
      - { block: evaluation, service: Azure ML evaluation job and Foundry red teaming, note: "On separate compute with a read-only identity and no registry or signing access." }
      - { block: registry, service: Azure Machine Learning registry }
    settings:
      - curationFilters
      - amlDataAssetVersions
      - storageSharedKeyAccess
      - artifactsUpstream
      - defenderMalwareScanning
      - kvSigningCryptoUser
      - foundryRedTeaming
      - storageCmk
      - amlModelFromJob
      - amlModelTags
      - amlManagedNetwork
      - amlComputeIdentity
      - aksPodSandboxing
      - amlWorkspaceDiagnostics

  - architecture: archAgentSandbox
    asOf: "2026-10"
    # >>> checked against the vendor's documentation
    verified: "2026-11-18"
    sources:
      graders: https://learn.microsoft.com/en-us/azure/aks/what-is-aks
      platform: https://learn.microsoft.com/en-us/azure/azure-monitor/fundamentals/overview
      orchestrator: https://learn.microsoft.com/en-us/azure/aks/what-is-aks
      sandbox: https://learn.microsoft.com/en-us/azure/aks/use-pod-sandboxing
      harness: https://learn.microsoft.com/en-us/azure/aks/concepts-pod-sandboxing
      localTools: https://learn.microsoft.com/en-us/azure/aks/considerations-pod-sandboxing
      storage: https://learn.microsoft.com/en-us/azure/storage/blobs/storage-blobs-introduction
      inference: https://learn.microsoft.com/en-us/azure/aks/ai-toolchain-operator-monitoring
      registry: https://learn.microsoft.com/en-us/azure/devops/artifacts/start-using-azure-artifacts
    differences:
      - at: sandbox
        text: "A standard AKS cluster has unrestricted outbound internet access by default. Azure Firewall is a wall only if the builder sets the cluster's outbound type to user-defined routing through the firewall, or builds a network-isolated cluster."
        url: https://learn.microsoft.com/en-us/azure/aks/concepts-network-isolated
      - at: localTools->registry
        text: "Azure Artifacts is a public Azure DevOps service. Microsoft's allow list for it includes every Azure Storage address (*.blob.core.windows.net), which opens a data-leak path. Put a package proxy inside the cluster, or accept and monitor that opening."
        url: https://learn.microsoft.com/en-us/azure/devops/organizations/security/allow-list-ip-url
      - at: localTools->platform
        text: "Every pod can reach the node's metadata service (169.254.169.254) by default and may obtain tokens there. Blocking it is a preview feature; the builder must enable it or block the address with network policy."
        url: https://learn.microsoft.com/en-us/azure/aks/imds-restriction
      - at: localTools->platform
        text: "Container logs are collected by the Azure Monitor agent on each node, not sent by the sandbox. The rollout needs no network path to Azure Monitor unless the harness exports its own traces."
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/containers/kubernetes-monitoring-overview
      - at: platform
        text: "Microsoft Defender for Containers does not assess pods that run under the Kata runtime. Threat detection for rollouts must come from the builder's own logs and network flow records."
        url: https://learn.microsoft.com/en-us/azure/aks/use-pod-sandboxing
      - at: platform
        text: "AKS mounts Azure Files with the storage account key by default. With shared-key access turned off, mounts fail unless the storage class uses managed identity (AKS 1.34 or later) or the share sits in a separate account."
        url: https://learn.microsoft.com/en-us/azure/aks/create-volume-azure-files
      - at: localTools->offlineWeb
        text: "FQDN filtering cannot name Kubernetes services. The offline web, inference and other in-cluster targets must be allowed with label-based Cilium policies; the FQDN list covers only names outside the cluster."
        url: https://learn.microsoft.com/en-us/azure/aks/container-network-security-fqdn-filtering-concepts
    alsoNeeded:
      - service: "Azure Container Registry"
        role: registry
        why: "Holds sandbox, harness and grader container images; Azure Artifacts feeds do not store images."
        url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-intro
      - service: "Azure Firewall with route table"
        role: network
        why: "The separate egress point; all node pool outbound traffic is routed through it."
        url: https://learn.microsoft.com/en-us/azure/firewall/overview
      - service: "Advanced Container Networking Services"
        role: network
        why: "Paid AKS add-on that FQDN filtering depends on."
        url: https://learn.microsoft.com/en-us/azure/aks/advanced-container-networking-services-overview
      - service: "Storage private endpoints"
        role: network
        why: "Keeps checkpoint storage reachable only from the orchestrator and inference networks."
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-private-endpoints
      - service: "Microsoft Entra ID with user-assigned managed identities"
        role: identity
        why: "Issues the tokens that Workload ID federates service accounts to."
        url: https://learn.microsoft.com/en-us/azure/aks/workload-identity-overview
      - service: "Azure DevOps organization"
        role: other
        why: "Azure Artifacts feeds live there; rollout identities must be added as users."
        url: https://learn.microsoft.com/en-us/azure/devops/integrate/get-started/authentication/service-principal-managed-identity
      - service: "Azure Key Vault"
        role: secrets
        why: "Secrets and certificates for the orchestrator and graders; the AKS baseline uses it."
        url: https://learn.microsoft.com/en-us/azure/key-vault/general/overview
      - service: "Private AKS cluster"
        role: ingress
        why: "Keeps the cluster API that researchers and the orchestrator use off the public internet."
        url: https://learn.microsoft.com/en-us/azure/aks/private-clusters
      - service: "Log Analytics workspace with Microsoft Sentinel"
        role: logging
        why: "Destination for container logs, traces and the alerts that stop a run."
        url: https://learn.microsoft.com/en-us/azure/sentinel/overview
    quickstart:
      - title: "Limit Network Traffic with Azure Firewall in Azure Kubernetes Service (AKS)"
        url: https://learn.microsoft.com/en-us/azure/aks/limit-egress-traffic
      - title: "Set up FQDN filtering feature for Container Network Security in Advanced Container Networking Services (ACNS)"
        url: https://learn.microsoft.com/en-us/azure/aks/how-to-apply-fqdn-filtering-policies
    # <<< checked
    reference:
      - title: Pod Sandboxing with Azure Kubernetes Service (AKS)
        url: https://learn.microsoft.com/en-us/azure/aks/use-pod-sandboxing
      - title: Baseline architecture for an Azure Kubernetes Service (AKS) cluster
        url: https://learn.microsoft.com/en-us/azure/architecture/reference-architectures/containers/aks/baseline-aks
    summary:
      - >-
        Rollouts run as Kata pods — each in a lightweight VM with its own guest kernel — on dedicated
        AKS node pools, with Cilium network policy and FQDN filtering as the second wall and Azure
        Firewall as the third, following Pod Sandboxing and the AKS baseline's segmentation. The
        orchestrator, graders and offline web are the organisation's own code on separate node pools;
        Container Apps dynamic sessions are the managed alternative for lighter code-execution tasks.
    bindings:
      - { block: graders, service: Your graders on a separate AKS node pool, build: true, note: "Unreachable from rollout pods by network policy; read end state, never write it." }
      - { block: platform, service: "Azure Monitor, Workload ID, Azure Files", note: "Log collection, token issuance and shared storage — each reachable only as far as the rollout needs." }
      - { block: orchestrator, service: Your run orchestrator on AKS, build: true }
      - { block: sandbox, service: AKS Pod Sandboxing (Kata) node pool, note: "One pod per task, deleted after; trust groups placed on separate node pools." }
      - { block: harness, service: Your episode harness in the Kata pod, build: true }
      - { block: localTools, service: "Shell, files, browser in the pod", build: true }
      - { block: storage, service: Azure Blob Storage (checkpoints) }
      - { block: inference, service: vLLM on AKS GPU node pools, builtWith: vLLM}
      - { block: offlineWeb, service: Your offline web snapshot and simulated apps, build: true }
      - { block: registry, service: Azure Artifacts feed }
      - { block: openWeb, service: The live web (crawl source only) }
      - { block: sources, service: "Public registries (PyPI, npm)" }
    settings:
      - aksEntraIdAuthorisation
      - aksPodSandboxing
      - aksNetworkPolicy
      - firewallEgress
      - aksGpuNodeTaints
      - aksFqdnFiltering
      - artifactsFeedReader
      - artifactsUpstream
      - aksWorkloadIdentity
      - storageSharedKeyAccess
      - aksContainerLogs
      - appInsightsOtel
      - monitorAutoStop
      - containmentPenTest

  - architecture: archAgentFederation
    asOf: "2026-10"
    # >>> checked against the vendor's documentation
    verified: "2026-11-18"
    sources:
      idp: https://learn.microsoft.com/en-us/entra/fundamentals/what-is-entra
      entry: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/baseline-microsoft-foundry-chat
      authServer: https://learn.microsoft.com/en-us/entra/agent-id/what-is-microsoft-entra-agent-id
      harness: https://learn.microsoft.com/en-us/agent-framework/hosting/self-hosting/a2a/server
      localTools: https://learn.microsoft.com/en-us/agent-framework/agents/tools/function-tools
      memory: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/what-is-foundry-iq
      gateway: https://learn.microsoft.com/en-us/azure/api-management/agent-to-agent-api
      internalTools: https://learn.microsoft.com/en-us/azure/api-management/mcp-server-overview
      peerVendor: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/what-is-single-sign-on
      provider: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-sold-directly-by-azure
    differences:
      - at: harness->gateway
        text: "Microsoft's baseline has the agent call its model directly on the Foundry endpoint; API Management is optional. The builder must point the agent's model client at API Management, disable Foundry public access and keys, and give model access only to API Management's managed identity."
        url: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/baseline-microsoft-foundry-chat
      - at: gateway
        text: "Microsoft now offers two gateways for Foundry models and tools: Azure API Management and a separate Azure AI Gateway resource type. The settings in this mapping apply to API Management only, so the builder must choose API Management deliberately."
        url: https://learn.microsoft.com/en-us/azure/foundry/configuration/enable-ai-api-management-gateway-portal
      - at: gateway->authServer
        text: "API Management only checks incoming Entra tokens. Exchanging a user's token for the agent's own token is done by the agent, or its auth sidecar, calling Entra directly. So the agent process holds those tokens, not the gateway."
        url: https://learn.microsoft.com/en-us/entra/agent-id/agent-on-behalf-of-oauth-flow
      - at: idp->authServer
        text: "Both blocks are the same Microsoft Entra tenant, so there is no link between them to build or secure. The vendor platform is added as an enterprise application; the partner's authorization server sits outside Entra."
        url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/what-is-single-sign-on
      - at: gateway->peerVendor
        text: "API Management's A2A support covers JSON-RPC agents only, applies policies to the whole agent rather than each skill, and cannot read response bodies. Classifying or redacting artifacts that come back must be done in your agent code."
        url: https://learn.microsoft.com/en-us/azure/api-management/agent-to-agent-api
      - at: gateway->partner
        text: "API Management republishes each imported agent card with its own hostname, JSON-RPC as the only transport and a subscription-key requirement. Peers therefore see an altered card, not the reviewed original; keep the original in API Center."
        url: https://learn.microsoft.com/en-us/azure/api-management/agent-to-agent-api
    alsoNeeded:
      - service: "Azure Key Vault"
        role: secrets
