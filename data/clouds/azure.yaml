  - architecture: archTrainingPipeline
    asOf: "2026-10"
    # >>> checked against the vendor's documentation
    verified: "2026-11-18"
    sources:
      upstreamArtifacts: https://learn.microsoft.com/en-us/azure/devops/artifacts/concepts/upstream-sources
      pkgRegistry: https://learn.microsoft.com/en-us/azure/devops/artifacts/concepts/feeds
      curation: https://learn.microsoft.com/en-us/azure/machine-learning/concept-ml-pipelines
      corpus: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-create-data-assets
      trainJob: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-create-attach-compute-cluster
      storage: https://learn.microsoft.com/en-us/azure/machine-learning/concept-workspace
      evaluation: https://learn.microsoft.com/en-us/azure/foundry/concepts/ai-red-teaming-agent
      registry: https://learn.microsoft.com/en-us/azure/machine-learning/concept-machine-learning-registries-mlops
    differences:
      - at: upstreamArtifacts->pkgRegistry
        text: "An Azure Artifacts feed with upstream sources is a pull-through cache: any package a Collaborator installs is saved automatically, with no approval step. Give build and training identities the plain Reader role, and admit packages and base checkpoints through a separate reviewed job."
        url: https://learn.microsoft.com/en-us/azure/devops/artifacts/concepts/upstream-sources
      - at: pkgRegistry->trainJob
        text: "The training job does not fetch packages itself. Azure ML installs them when it builds the environment's container image, on a build compute you must nominate when the registry is private, then caches the image in Azure Container Registry. The mirror needs an outbound rule."
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-managed-network
      - at: storage->registry
        text: "Azure adds a step: the candidate is first registered in the training workspace from the job output, then copied to the registry with az ml model share. The registry stores its own copy, so compare digests after the copy, not only before."
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-share-models-pipelines-across-workspaces-with-registries
      - at: storage->registry
        text: "Sharing from a locked-down workspace fails if its storage account has public access disabled. Microsoft's fix is to set the account to selected networks and add the registry as an allowed resource instance, a deliberate exception you must configure."
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-registry-network-isolation
      - at: evaluation->registry
        text: "Azure ML has no built-in approval gate or signing. MLOps v2 puts the human approval in a CI/CD pipeline (Azure Pipelines or GitHub Actions) that promotes the model. You must build that pipeline, and it becomes the identity holding the signing key."
        url: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/guide/machine-learning-operations-v2
      - at: corpus
        text: "A data asset version cannot be edited or deleted, but it only points at a storage path. The files underneath can still change unless you write each corpus version to a new path and turn on Blob versioning or immutability."
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-create-data-assets
      - at: evaluation
        text: "Cloud and portal red teaming runs only target Foundry or Azure OpenAI deployments and Foundry agents. A candidate trained in Azure ML must be tested with the local SDK through a callback to your evaluation endpoint, and still needs a Foundry project."
        url: https://learn.microsoft.com/en-us/azure/foundry/how-to/develop/run-ai-red-teaming-cloud
      - at: curation
        text: "Curation steps that call Azure AI Language or Content Safety send every example to those services. Under approved-outbound isolation each needs its own outbound rule or private endpoint, and the curation identity needs access to them."
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-managed-network
    alsoNeeded:
      - service: "Azure Container Registry"
        role: registry
        why: "Every Azure ML workspace builds and caches training environment images here; training nodes pull from it."
        url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-intro
      - service: "Azure Pipelines (or GitHub Actions) with approvals"
        role: other
        why: "Runs the promotion pipeline and holds the human approval gate that MLOps v2 describes."
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals
      - service: "Azure Key Vault"
        role: keys
        why: "Dedicated signing vault and storage encryption keys; the workspace also needs its own vault for secrets."
        url: https://learn.microsoft.com/en-us/azure/key-vault/general/overview
      - service: "Microsoft Entra managed identities"
        role: identity
        why: "Separate identities for training cluster, evaluation compute and promotion pipeline."
        url: https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/overview
      - service: "Azure Firewall (managed network FQDN rules)"
        role: network
        why: "Azure ML deploys and bills it when you add any outbound rule by host name, such as the package mirror."
        url: https://learn.microsoft.com/en-us/azure/firewall/overview
      - service: "Azure ML managed online endpoint"
        role: other
        why: "Red teaming needs the candidate served somewhere; the setting assumes an isolated evaluation endpoint."
        url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-endpoints-online
      - service: "Microsoft Foundry project"
        role: other
        why: "Prerequisite for the AI Red Teaming Agent, in one of its supported regions."
        url: https://learn.microsoft.com/en-us/azure/foundry/how-to/develop/run-scans-ai-red-teaming-agent
      - service: "Azure AI Language (PII detection) and Azure AI Content Safety"
        role: other
        why: "Called by the curation filters; separate resources to create, secure and reach privately."
        url: https://learn.microsoft.com/en-us/azure/ai-services/language-service/personally-identifiable-information/overview
      - service: "Log Analytics workspace (Azure Monitor)"
        role: logging
        why: "Destination for workspace resource logs; none are collected until a diagnostic setting exists."
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/log-analytics-workspace-overview
      - service: "Microsoft Defender for Cloud (Defender for Storage)"
        role: other
        why: "Provides the on-upload malware scanning used on dataset and model storage."
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-cloud-introduction
    quickstart:
      - title: "Create a secure workspace with a managed virtual network"
        url: https://learn.microsoft.com/en-us/azure/machine-learning/tutorial-create-secure-workspace
      - title: "Share models, components, and environments across workspaces with registries"
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-share-models-pipelines-across-workspaces-with-registries
      - title: "Set up MLOps with Azure DevOps"
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-setup-mlops-azureml
    # <<< checked
    reference:
      - title: Machine learning operations (MLOps) v2
        url: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/guide/machine-learning-operations-v2
      - title: Workspace managed network isolation (Azure Machine Learning)
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-managed-network
      - title: Architecture pattern for AI workloads (Azure Well-Architected)
        url: https://learn.microsoft.com/en-us/azure/well-architected/ai/architecture-pattern
    summary:
      - >-
        Azure Machine Learning end to end: pipeline jobs curate versioned data assets, GPU compute
        clusters train inside a managed virtual network that allows only approved outbound traffic,
        and candidates are registered from the job that produced them. A separate promotion pipeline
        — the only identity that can use the signing key — signs a release into the Azure Machine
        Learning registry after the evaluation gate and a human approval, following MLOps v2's gated
        promotion between workspaces.
    bindings:
      - { block: upstreamArtifacts, service: "Public hubs (Hugging Face, PyPI, conda)" }
      - { block: dataOrigins, service: Your data sources, build: true, note: "Internal records, purchased and scraped sets, and labelling vendors' output." }
      - { block: pkgRegistry, service: Azure Artifacts feed, note: "Universal Packages carry admitted base checkpoints beside the training dependencies." }
      - { block: curation, service: Azure Machine Learning pipeline (data prep) }
      - { block: corpus, service: Azure ML data assets on Blob Storage }
      - { block: trainJob, service: Azure ML GPU compute cluster, note: "In a managed virtual network; RL rollouts go to the agent sandbox drawing." }
      - { block: storage, service: Azure Blob Storage (job outputs) }
      - { block: evaluation, service: Azure ML evaluation job and Foundry red teaming, note: "On separate compute with a read-only identity and no registry or signing access." }
      - { block: registry, service: Azure Machine Learning registry }
    # >>> hosting options (compared against the vendor's pages; one is the mapping itself)
    hosting:
      - id: azureMlCompute
        kind: runtime
        name: "Azure Machine Learning compute cluster"
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-create-attach-compute-cluster
        asOf: "2026-11"
        mapped: true
        compare:
          runs: "Azure Machine Learning runs your training code in a container on cluster nodes it creates when a job is submitted and removes when the cluster is idle."
          patching: "Azure updates the node image monthly and nodes pick it up when the cluster scales to zero; you choose and rebuild the environment image the job runs in."
          data: "Training data, checkpoints and outputs stay in your workspace's storage accounts; nodes run in the workspace region by default, in a managed or your own virtual network."
          network: "Nodes can sit in the workspace managed virtual network with approved-outbound rules, or in your virtual network with no public IP."
          identity: "Jobs use the cluster's managed identity, system-assigned or user-assigned, to reach datastores and pull images; a job can be set to use the submitting user's identity."
          accepts: "Any containerised training code in a curated or custom environment, with PyTorch, TensorFlow, MPI and Ray distribution settings for multi-node jobs."
          workload: "A job can run for 21 days, or 7 on low-priority nodes that may be pre-empted; the cluster scales between minimum and maximum nodes and can idle at zero."
          portability: "Training code and its container move as they are; job definitions, data assets, environments and registry references are Azure Machine Learning constructs."
          effort: "Your team owns training code, environments, quota and cluster size limits; there are no nodes or schedulers to operate."
          fits: "Microsoft's compute guide points to it when training outgrows one machine or becomes distributed, as a cluster that scales each time a job is submitted."
        sources:
          - https://learn.microsoft.com/en-us/azure/machine-learning/how-to-create-attach-compute-cluster
          - https://learn.microsoft.com/en-us/azure/machine-learning/concept-compute-target
          - https://learn.microsoft.com/en-us/azure/machine-learning/concept-vulnerability-management
          - https://learn.microsoft.com/en-us/azure/machine-learning/how-to-managed-network
          - https://learn.microsoft.com/en-us/azure/machine-learning/how-to-identity-based-service-authentication
          - https://learn.microsoft.com/en-us/azure/machine-learning/how-to-train-distributed-gpu
          - https://learn.microsoft.com/en-us/azure/machine-learning/reference-yaml-job-command
          - https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-quotas
      - id: aks
        kind: cluster
        name: "Azure Machine Learning Kubernetes compute target on AKS"
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-attach-kubernetes-anywhere
        asOf: "2026-11"
        compare:
          runs: "The Azure Machine Learning extension schedules your training job as pods on an AKS cluster that your own team runs and has attached to the workspace."
          patching: "You patch node operating systems and container images; Microsoft publishes new extension images, which upgrade automatically unless you turn that off."
          data: "Data, checkpoints and outputs stay in the workspace's storage accounts and are processed on your cluster's nodes, which may also be outside Azure through Azure Arc."
          network: "The cluster's own virtual network, firewall or proxy and private endpoints apply; the workspace managed virtual network does not extend to an attached cluster."
          identity: "Jobs use the managed identity given to the Kubernetes compute target when the cluster is attached, system-assigned or user-assigned."
          accepts: "The same Azure Machine Learning job definitions, on x86-64 node pools only; instance types defined in the cluster select nodes and resource limits for each job."
          workload: "Jobs are queued by the Volcano scheduler on nodes you provision; node autoscaling is unsupported for training unless you replace the default Volcano configuration."
          portability: "A job moves between this and other Azure ML compute by changing the compute name; the same extension also attaches clusters on other clouds or on premises."
          effort: "An operations team runs the cluster, GPU node pools, the extension, instance types, networking and troubleshooting, separately from the data science team."
          fits: "Microsoft describes it for teams that prefer Kubernetes and can manage it, that want more control with their own AKS, or whose data must stay on premises."
        sources:
          - https://learn.microsoft.com/en-us/azure/machine-learning/how-to-attach-kubernetes-anywhere
          - https://learn.microsoft.com/en-us/azure/machine-learning/how-to-deploy-kubernetes-extension
          - https://learn.microsoft.com/en-us/azure/machine-learning/how-to-attach-kubernetes-to-workspace
          - https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-kubernetes-instance-types
          - https://learn.microsoft.com/en-us/azure/machine-learning/reference-kubernetes
          - https://learn.microsoft.com/en-us/azure/machine-learning/how-to-access-azureml-behind-firewall
          - https://learn.microsoft.com/en-us/azure/machine-learning/concept-vulnerability-management
          - https://learn.microsoft.com/en-us/azure/machine-learning/reference-yaml-job-command
          - https://learn.microsoft.com/en-us/azure/aks/auto-upgrade-node-os-image
          - https://learn.microsoft.com/en-us/azure/aks/use-network-policies
          - https://learn.microsoft.com/en-us/azure/machine-learning/how-to-troubleshoot-kubernetes-extension
        summary: "The pipeline stays in Azure Machine Learning, but the training job runs as pods on an AKS cluster the organisation operates, attached to the workspace through the Azure Machine Learning extension. The builder now carries what the compute cluster did by itself: node patching, GPU capacity with no autoscaling, the job's network wall, and the identity given to the compute target. The workspace's managed virtual network no longer surrounds the job."
        bindings:
          - { block: trainJob, service: "Azure ML job on AKS (Kubernetes compute target)", note: "The Azure Machine Learning extension, installed with enableTraining=True, runs each job as pods in the namespace named at attach, on GPU node pools you size, patch and isolate.", url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-attach-kubernetes-anywhere }
        dropSettings: [amlComputeIdentity]
        addSettings: [aksNetworkPolicy, aksGpuNodeTaints, firewallEgress, aksNodeOsUpgradeChannel, aksContainerLogs, defenderContainerVa, amlKubernetesComputeIdentity, amlKubernetesInstanceType, amlKubernetesNamespace]
        differences:
          - at: trainJob
            text: "The workspace's managed virtual network isolates compute that Azure Machine Learning creates; an attached AKS cluster is outside it. Microsoft's pattern is an AKS cluster in its own virtual network with private endpoints there for the workspace and its storage, registry and vault, plus whatever firewall and network policy the builder adds."
            url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-attach-kubernetes-anywhere
          - at: pkgRegistry->trainJob
            text: "Behind a firewall, Microsoft lists outbound addresses that training on Kubernetes compute needs beyond the workspace, storage and registry: pypi.org for job environment initialisation and the Ubuntu archive hosts for security patches. Each is an opening beside the private feed that the builder must grant, proxy or replace with an internal mirror."
            url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-access-azureml-behind-firewall
          - at: trainJob
            text: "Microsoft lists node autoscaling as unsupported for training on Kubernetes compute: the extension's Volcano scheduler blocks the AKS cluster autoscaler unless you supply a scheduler configuration without the gang plugin. Otherwise capacity is provisioned ahead and billed while idle. Node patching is the builder's: OS and image vulnerabilities are the customer's responsibility."
            url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-attach-kubernetes-anywhere
          - at: trainJob
            text: "The extension constrains cluster hardening: Azure Machine Learning does not support disabling local accounts on the AKS cluster, does not support service-principal clusters, and needs its control plane address ranges allowed if the API server has authorised IP ranges. The repository's disable-local-accounts setting therefore cannot be applied here."
            url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-deploy-kubernetes-extension
          - at: trainJob->storage
            text: "The job writes its candidate with the managed identity assigned to the compute target, not with a compute cluster identity. One cluster can be attached several times, to several workspaces or namespaces, so the same nodes may serve jobs with different identities unless instance types pin each to its own node pool."
            url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-attach-kubernetes-to-workspace
        alsoNeeded:
          - service: "AKS cluster with GPU node pools"
            role: other
            why: "The compute cluster created and removed nodes for each job; here the nodes exist beforehand, and autoscaling them needs a custom Volcano scheduler configuration."
            url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-attach-kubernetes-anywhere
          - service: "Azure Machine Learning extension (Volcano scheduler, Prometheus operator)"
            role: other
            why: "It is what lets the workspace submit jobs to the cluster; it installs a job scheduler and metrics components that the cluster team then maintains."
            url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-deploy-kubernetes-extension
          - service: "Private endpoints for the workspace, storage, registry and vault in the cluster's network"
            role: network
            why: "The managed virtual network created these for managed compute; an attached cluster needs its own."
            url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-attach-kubernetes-anywhere
          - service: "Azure Firewall or outbound proxy for the cluster"
            role: network
            why: "Outbound control is no longer the workspace's approved-outbound mode; the cluster's outbound path and the extension's required addresses are configured by the builder."
            url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-access-azureml-behind-firewall
          - service: "Azure Monitor Container insights"
            role: logging
            why: "Node and pod logs of training jobs come from the cluster's own monitoring, which is optional on an AKS Standard cluster, alongside the workspace's job records."
            url: https://learn.microsoft.com/en-us/azure/aks/monitor-aks
        quickstart:
          - title: "Introduction to Kubernetes compute target"
            url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-attach-kubernetes-anywhere
          - title: "Deploy Azure Machine Learning extension on Kubernetes cluster"
            url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-deploy-kubernetes-extension
          - title: "Attach a Kubernetes cluster to Azure Machine Learning workspace"
            url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-attach-kubernetes-to-workspace
      - id: foundryFineTuning
        kind: managed
        name: "Microsoft Foundry training (Managed Training and Programmed Training)"
        url: https://learn.microsoft.com/en-us/azure/foundry/fine-tuning/overview
        asOf: "2026-11"
        compare:
          runs: "Foundry runs the training on its own infrastructure from your data and settings; in Programmed Training (preview) your Python driver directs each step it executes."
          patching: "Microsoft operates and patches the training infrastructure; you provision no training GPUs, images or nodes."
          data: "Training files are uploaded to the Foundry resource and stay in its geography at rest; Global and Developer training may copy data and weights to other regions."
          network: "Access is through the Foundry resource, governed by its public network access flag and private endpoints; a training job has no network of its own to configure."
          identity: "You call the service with Microsoft Entra roles on the Foundry resource; the training job does not run as an identity of yours."
          accepts: "Listed base models only, by supervised, preference (DPO) or reinforcement fine-tuning; Programmed Training applies LoRA updates to listed open-weight models."
          workload: "Jobs queue on Standard, Data zone, Global or Developer capacity; Developer jobs may be pre-empted and resumed, and the service keeps the checkpoints."
          portability: "The tuned model or adapter deploys to Foundry serverless or managed compute; the pages read describe no download of tuned weights, so leaving means retraining."
          effort: "Your team prepares datasets and graders, evaluates results and manages deployments and cost; in Programmed Training it also runs the driver and its recovery logic."
          fits: "Microsoft says to start with Managed Training when new to customisation, and to choose Programmed Training when the training loop itself is the research."
        sources:
          - https://learn.microsoft.com/en-us/azure/foundry/fine-tuning/overview
          - https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/fine-tuning
          - https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/fine-tuning-direct-preference-optimization
          - https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reinforcement-fine-tuning
          - https://learn.microsoft.com/en-us/azure/foundry/fine-tuning/programmed-training/overview
          - https://learn.microsoft.com/en-us/azure/foundry/fine-tuning/programmed-training/concepts
          - https://learn.microsoft.com/en-us/azure/foundry/fine-tuning/deploy-fine-tuned-models
          - https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/fine-tuning-safety-evaluation
          - https://learn.microsoft.com/en-us/azure/foundry/fine-tuning/data-generation
          - https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/openai/data-privacy
          - https://learn.microsoft.com/en-us/azure/foundry/how-to/configure-private-link
          - https://learn.microsoft.com/en-us/azure/foundry/concepts/adapter-deployment-overview
        offers:
          - name: "Managed Training: supervised fine-tuning (SFT)"
            what: "You upload JSONL training and validation files, set supported hyperparameters such as epochs, batch size and learning rate multiplier, and Foundry runs the job on a listed base model."
            url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/fine-tuning
          - name: "Managed Training: preference fine-tuning (DPO)"
            what: "Training from JSONL examples that pair a preferred and a non-preferred response to the same input, offered for the models the overview table marks DPO."
            url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/fine-tuning-direct-preference-optimization
          - name: "Managed Training: reinforcement fine-tuning (RFT)"
            what: "Training from prompts and a grader that scores generated responses, offered for the models the overview table marks RFT; some need an invitation."
            url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reinforcement-fine-tuning
          - name: "Programmed Training (preview, access by approval)"
            what: "An API for writing your own post-training loop in Python over listed open-weight models: your driver controls rollouts, rewards, losses and update timing while Foundry runs sampling and LoRA updates on serverless GPUs."
            url: https://learn.microsoft.com/en-us/azure/foundry/fine-tuning/programmed-training/overview
          - name: "Open-weight base models"
            what: "The supported models table lists open-weight models such as Llama-3.3-70B-Instruct, Qwen3-32B, gpt-oss-20b and Ministral-3B beside Azure OpenAI models, each with its own methods, training types and deployment options."
            url: https://learn.microsoft.com/en-us/azure/foundry/fine-tuning/overview
          - name: "Training types"
            what: "Standard trains in the resource's region with data residency, Data zone within a zone (US only), Global on capacity elsewhere with data and weights copied there, and Developer on idle capacity with no residency or latency guarantee."
            url: https://learn.microsoft.com/en-us/azure/foundry/fine-tuning/overview
          - name: "Safety evaluation of fine-tuning (preview)"
            what: "The service screens training data for harmful content before training and evaluates the tuned model before it can be deployed, with thresholds the customer cannot change."
            url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/fine-tuning-safety-evaluation
          - name: "Checkpoints"
