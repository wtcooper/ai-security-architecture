      - { block: planner, service: Your agent on Azure Container Apps, builtWith: Microsoft Agent Framework, note: "Foundry Agent Service is the managed alternative — the API/SDK managed agent runtime drawing." }
      - { block: localTools, service: Container Apps dynamic sessions (code interpreter) }
      - { block: stateRetrieval, service: "Azure Cosmos DB and Foundry IQ (Azure AI Search)" }
      - { block: gateway, service: Azure API Management (AI gateway) }
      - { block: internalTools, service: Your action catalogue as MCP servers and APIs, build: true, note: "Named, parameter-validated actions, each with a compensating transaction, exposed only through API Management." }
      - { block: provider, service: Azure OpenAI in Foundry Models }
      - { block: orgData, service: Your systems of record, build: true, note: "Azure SQL, Blob Storage, line-of-business systems — whatever the actions change." }
      - { block: openWeb, service: Grounding with Bing Search }
      - { block: sources, service: "Public registries (PyPI, npm)" }
      - { block: registry, service: Azure Artifacts feed }
