  - id: toolClaudeDesktop
    name: Claude Desktop (local MCP servers, desktop extensions and device policy)
    family: Claude Desktop
    surfaceClasses:
      - desktopApp
    variants:
      - name: Claude Desktop (macOS PKG/DMG, Windows MSIX, Linux beta) signed in to claude.ai
        class: desktopApp
        url: https://support.claude.com/en/articles/12611117-deploy-claude-desktop-for-macos
        note: >-
          Its chats are claude.ai chats (toolClaudeWeb); this entity covers what the app runs and reaches on
          the device. The Code tab is a variant of toolClaudeCode and the Cowork tab is toolClaudeCowork.
      - name: Claude Desktop on 3P (inference via Bedrock, Vertex, Foundry, a gateway or the Claude API; local history)
        class: desktopApp
        url: https://claude.com/docs/third-party/claude-desktop/overview
        note: >-
          Configured through an MDM profile, a bootstrap server or the Enterprise Admin Console for Desktop 3P
          (Organization settings on claude.ai, generally available); conversation content goes only to your
          endpoint and is stored on the device; users have a local device identity only unless the deployment
          is managed from the admin console.
    architecture: archCodingAgentThirdParty
    status: ga
    asOf: "2026-10"
    summary:
      - >-
        The Claude desktop app for macOS, Windows and Linux (beta), as a program on the managed endpoint. As
        a chat client it shows the same synced claude.ai chats as the browser (toolClaudeWeb), and its Code
        and Cowork tabs are toolClaudeCode and toolClaudeCowork. What it adds on the device is its own reach:
        local MCP servers from claude_desktop_config.json and desktop extensions (.mcpb) that run as host
        processes with the user's permissions and feed tool results into chat, Quick Entry screenshots and
        window sharing on macOS, the connection through which the app drives Claude in Chrome, the bridge
        through which cloud sessions reach the computer's files and browser while the app is online, and the
        app binary and its updater.
        Standard deployments load the web application from claude.ai and send inference to the Anthropic
        API; Claude Desktop on 3P bundles the web application, routes inference to the organisation's
        provider and keeps history on the device.
      - >-
        Administration is split across two planes. Device policy, deployed by MDM to the macOS domain
        com.anthropic.claudefordesktop, the Windows key HKLM\SOFTWARE\Policies\Claude or the root-owned Linux
        file /etc/claude-desktop/managed-settings.json, turns local MCP servers, desktop extensions and the
        extension directory on or off, pins sign-in to the organisation (forceLoginOrgUUID), turns the Code
        and Cowork tabs off, and governs auto-update; device policy overrides the in-app allowlist. The
        claude.ai console holds the desktop extension allowlist (Organization settings > Connectors > Desktop),
        the Computer access capability on Enterprise custom roles and Require trusted devices. Connector
        permissions "don't govern connectors a member runs locally on their own machine", so a local server's
        tools have no administrator policy on standard deployments. Claude Desktop on 3P adds per-tool policy
        for managed MCP servers, signed-extension enforcement, an OTLP export covering Chat, Cowork and Code,
        local retention periods and proxy keys.
    facts:
      - label: Plans
        value: >-
          Every plan for Chat; Code and Cowork on Pro, Max, Team and Enterprise; device policies and the desktop
          extension allowlist for Team and Enterprise administrators; on Claude Desktop on 3P inference is
          billed by the configured provider.
        url: https://support.claude.com/en/articles/10065433-install-claude-desktop
      - label: Inference & routing
        value: >-
          Standard: Anthropic API, web application loaded from claude.ai, conversations stored on Anthropic's
          backend. 3P: the configured provider (gateway, anthropic, bedrock, mantle, vertex or foundry), web
          application bundled in the app, conversations on local disk.
        url: https://claude.com/docs/third-party/claude-desktop/overview
      - label: Data leaving the device
        value: >-
          Prompts, attachments, Quick Entry screenshots and the results of local MCP and extension tool calls
          go to the inference provider with the chat; the app loads code and user content from Anthropic hosts
          (claude.ai, *.claude.com, *.claudeusercontent.com, *.claudemcpcontent.com and others); local MCP
          servers and extensions make their own network calls from the device.
        url: https://code.claude.com/docs/en/desktop
      - label: Retention & training
        value: >-
          Standard: chats follow the claude.ai organisation's retention (toolClaudeWeb). 3P: conversations,
          projects and memory stay on the device, unencrypted (sign-in tokens and saved keys are encrypted
          with the OS secure storage), until chatSessionRetentionDays deletes idle chats.
        url: https://claude.com/docs/third-party/claude-desktop/data-storage
      - label: Docs index
        value: >-
          support.claude.com Claude Desktop collection (Enterprise configuration, deploy for macOS and Windows,
          desktop extensions) plus claude.com/docs/third-party/claude-desktop for 3P and code.claude.com/docs/en/desktop
          for the Code tab and network requirements
        url: https://support.claude.com/en/collections/16163169-claude-desktop
      - label: Updates
        value: >-
          macOS and Windows builds update themselves (Windows checks about every four hours) unless
          disableAutoUpdates is set; a downloaded update forces a restart after autoUpdaterEnforcementHours (72
          by default); Linux updates arrive through Anthropic's apt repository and the app does not update
          itself.
        url: https://support.claude.com/en/articles/12622703-deploy-claude-desktop-for-windows
    items:
      - title: Device policy
        body:
          - "Standard deployments read the keys on the Help Center's Enterprise configuration page from the macOS
            configuration-profile domain com.anthropic.claudefordesktop, the Windows HKLM\\SOFTWARE\\Policies\\Claude
            registry key (machine-level settings take priority over HKCU when both are configured) or the
            root-owned Linux file /etc/claude-desktop/managed-settings.json: isLocalDevMcpEnabled (local MCP
            servers), isDesktopExtensionEnabled and isDesktopExtensionDirectoryEnabled (extensions and the
            directory), forceLoginOrgUUID (one UUID or a JSON array), isClaudeCodeForDesktopEnabled (the Code
            tab), secureVmFeaturesEnabled (Cowork), allowedWorkspaceFolders (Cowork folders), effortLevel,
            disableAutoUpdates and autoUpdaterEnforcementHours. The app reads them at launch, so a change needs
            a quit and reopen; device policy overrides the in-app allowlist."
          - "Claude Desktop on 3P reads a wider key set from the same stores, a bootstrap server or the Enterprise
            Admin Console: managedMcpServers with a per-tool toolPolicy (allow, ask, blocked) enforced in the
            desktop host process, mcpPersistentAlwaysAllowEnabled, allowedPluginMcpServers and
            deniedPluginMcpServers, isDesktopExtensionSignatureRequired, developerModeEnabled (unpacked
            extensions), quickEntryScreenshotsEnabled and quickEntryFileSharingEnabled, disableDeploymentModeChooser,
            disableDeepLinkRegistration, egressProxyUrl (a route, not an access control), otlpEndpoint and
            otlpContentCapture, chatSessionRetentionDays and the telemetry and update keys."
        links:
          - title: Enterprise configuration for Claude Desktop
            url: >-
              https://support.claude.com/en/articles/12622667-enterprise-configuration-for-claude-desktop
          - title: Device management policies (Claude Code Desktop docs)
            url: https://code.claude.com/docs/en/desktop
          - title: Claude Desktop on 3P configuration reference
            url: https://claude.com/docs/third-party/claude-desktop/configuration
      - title: Local MCP servers and desktop extensions
        body:
          - "A server defined in claude_desktop_config.json is available in Desktop chat and local Code tab
            sessions; desktop extensions are .mcpb packages installed from the Anthropic-reviewed directory or
            from a file, run locally with a built-in Node.js runtime, and are available only in Claude Desktop
            and Claude Code, not on the web or mobile. Extension settings marked sensitive are encrypted with the
            OS secure storage, and directory extensions update automatically by default."
          - "The desktop extension allowlist (Team and Enterprise Owners, Organization settings > Connectors >
            Desktop) ships off, so every directory extension is installable until an Owner turns it on; turning
            it on force-deletes installed extensions that are not listed, stops drag-and-drop installs and lets
            Owners upload org-scoped custom .mcpb extensions. It does not guard against tampering with local MCP
            files after installation, and it does not see servers in claude_desktop_config.json."
        links:
          - title: Getting started with local MCP servers on Claude Desktop
            url: >-
              https://support.claude.com/en/articles/10949351-getting-started-with-local-mcp-servers-on-claude-desktop
          - title: Enabling and using the desktop extension allowlist
            url: >-
              https://support.claude.com/en/articles/12592343-enabling-and-using-the-desktop-extension-allowlist
          - title: When to use desktop and web connectors
            url: https://support.claude.com/en/articles/11725091-when-to-use-desktop-and-web-connectors
      - title: What reaches the computer through the app
        body:
          - "Cloud sessions reach a member's local files or browser only through Claude Desktop on that device,
            only for connected folders and only while the app is online; the device keys govern that reach as
            well. On Enterprise the Computer access capability on custom roles decides who may reach their
            computer from scheduled tasks, Claude on the web or Claude Mobile (sessions started in Claude Desktop
            itself are not affected), and Require trusted devices asks for an enrolled device and a recent sign-in.
            isLocalDevMcpEnabled false also skips the setup that connects the app to Claude in Chrome."
          - "Quick Entry on macOS captures screenshots and other apps' windows with Screen Recording and
            Accessibility permissions; claude:// links can open the app with a prefilled prompt that the user
            still sends, and a folder passed in a link is always confirmed before use. Computer use in the Code
            tab is a Pro, Max and Ultra research preview, not offered on Team or Enterprise."
        links:
          - title: Claude Cowork architecture overview (cloud sessions reach devices through the app)
            url: https://support.claude.com/en/articles/14479288-claude-cowork-architecture-overview
          - title: Manage custom roles on Enterprise plans (Computer access)
            url: https://support.claude.com/en/articles/13930452-manage-custom-roles-on-enterprise-plans
          - title: Use quick entry with Claude Desktop on Mac
            url: https://support.claude.com/en/articles/12626668-use-quick-entry-with-claude-desktop-on-mac
          - title: Open Claude Desktop with a link
            url: https://support.claude.com/en/articles/14729294-open-claude-desktop-with-a-link
    riskNotes:
      - risk: riskZombieShadowMCPServers
        note: >-
          Servers a user adds to claude_desktop_config.json run on the device and appear in no console list;
          the extension allowlist does not see them. isLocalDevMcpEnabled false is the only administrator
          control on standard deployments, and EDR or MDM inventory is how they are found.
      - risk: riskToolSourceProvenance
        note: >-
          Until an Owner turns on the allowlist every directory extension is installable, directory extensions
          update themselves, and a .mcpb can be installed from a file; signed-extension enforcement
          (isDesktopExtensionSignatureRequired) is a 3P key.
      - risk: riskSensitiveDataDisclosure
        note: >-
          Local servers and extensions read local files and internal systems with the user's own access and
          return the results into a chat that goes to the inference provider; Quick Entry adds screenshots and
          other apps' windows. Inference hooks see the text that reaches the model, not image bytes.
      - risk: riskShadowAndUnknownAgents
        note: >-
          A personal claude.ai account in the desktop app on a managed device carries the same local reach;
          forceLoginOrgUUID pins sign-in to the organisation, and on 3P disableDeploymentModeChooser stops users
          leaving the managed configuration by signing in to claude.ai.
      - risk: riskPromptInjection
        note: >-
          Tool results from local servers and extensions, and pages reached through Claude in Chrome, enter the
          conversation as content Claude may follow; claude:// links only prefill a prompt and folders passed in
          a link are confirmed before use.
    controls:
      - mitigation: D3-MFA
        coverage: partial
        mechanism: >-
          "Require SSO for Claude" sends every interactive sign-in, the desktop app's included, through the IdP,
          whose MFA policy applies; forceLoginOrgUUID pins Claude Desktop to the organisation on managed devices;
          "Shortened session length" bounds how long a sign-in lasts (Enterprise); "Require trusted devices"
          asks for an enrolled device and a sign-in under 18 hours old before remote sessions reach a computer
        steps:
          - title: Enforce SSO
            body:
              - >-
                After domain verification and IdP setup, toggle on "Require SSO for Claude" under Organization
                settings > Organization and access > Authentication, and require MFA in the IdP.
            url: https://support.claude.com/en/articles/13132885-set-up-single-sign-on-sso
          - title: Pin the desktop app to your organisation
            body:
              - >-
                Deploy forceLoginOrgUUID in com.anthropic.claudefordesktop, HKLM\SOFTWARE\Policies\Claude or
