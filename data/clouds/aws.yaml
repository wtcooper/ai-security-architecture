          workload: "Sessions last up to 8 hours and end after 15 idle minutes by default; 5,000 active sessions per account in two US Regions, 2,500 elsewhere."
          portability: "The sandbox image is a standard container; session creation, command execution and stop calls are AgentCore APIs."
          effort: "Your team owns the sandbox image, execution role, VPC egress controls and quota requests; AWS operates microVM capacity and isolation."
          fits: "AWS presents Runtime for hosting agents and tools that need session isolation, with each session in its own microVM."
        sources:
