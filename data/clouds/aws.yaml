  - architecture: archSelfHostedInference
    asOf: "2026-10"
    # >>> checked against the vendor's documentation
    verified: "2026-11-18"
    sources:
      gateway: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway.html
      api: https://docs.aws.amazon.com/eks/latest/userguide/ml-inference-load-serve-model.html
      runtime: https://docs.aws.amazon.com/eks/latest/userguide/ml-inference.html
      storage: https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html
      sources: https://docs.aws.amazon.com/eks/latest/userguide/ml-inference.html
      registry: https://docs.aws.amazon.com/sagemaker/latest/dg/model-registry.html
    alsoNeeded:
      - service: "OIDC identity provider (for example Amazon Cognito)"
        role: identity
        why: "Issues the tokens the gateway's JWT authorizer checks; must exist before the gateway is created."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-inbound-auth.html
      - service: "AWS IAM with EKS Pod Identity"
        role: identity
        why: "Gives each serving and ingest pod its own role for S3 access."
        url: https://docs.aws.amazon.com/eks/latest/userguide/pod-identities.html
      - service: "Amazon VPC Lattice resource gateway"
        role: network
        why: "The path the gateway uses to reach a private address in your VPC."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/vpc-egress-private-endpoints.html
      - service: "Internal load balancer with a TLS certificate (Elastic Load Balancing, AWS Certificate Manager)"
        role: network
        why: "Gives vLLM the HTTPS address the gateway requires."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/vpc-egress-private-endpoints.html
      - service: "Outbound internet route for the model download job (NAT gateway or egress proxy)"
        role: network
        why: "The Hugging Face download needs internet; serving pods should have none."
        url: https://docs.aws.amazon.com/eks/latest/userguide/ml-inference-load-serve-model.html
      - service: "Interface VPC endpoint for AgentCore Gateway"
        role: ingress
        why: "Lets internal applications reach the gateway without the public internet."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/vpc-interface-endpoints.html
      - service: "AWS KMS"
        role: keys
        why: "Your own keys for the weights bucket and secrets, and the public key that verifies release signatures."
        url: https://docs.aws.amazon.com/kms/latest/APIReference/API_Sign.html
      - service: "AWS Secrets Manager"
        role: secrets
        why: "Holds the vLLM API key; the gateway's API key credential provider reads it from there."
        url: https://docs.aws.amazon.com/bedrock-agentcore-control/latest/APIReference/API_CreateApiKeyCredentialProvider.html
      - service: "Amazon ECR"
        role: registry
        why: "Private copy of the vLLM serving image, scanned before the cluster pulls it."
        url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/image-scanning-enhanced.html
      - service: "Amazon Bedrock Guardrails"
        role: other
        why: "Performs the content checks the gateway policy calls; the gateway role needs permission to invoke it."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/policy-guardrails-in-policies.html
      - service: "AWS Lambda"
        role: other
        why: "Runs the request and response interceptors that set the cache salt and write the log."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-interceptors.html
      - service: "Prometheus and Grafana monitoring stack for the cluster"
        role: logging
        why: "vLLM and GPU metrics live here; CloudTrail does not see inside the cluster."
        url: https://docs.aws.amazon.com/eks/latest/userguide/ml-inference-load-serve-model.html
    quickstart:
      - title: "Load & Serve Models on Amazon EKS"
        url: https://docs.aws.amazon.com/eks/latest/userguide/ml-inference-load-serve-model.html
      - title: "Inference provider targets"
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-inference-provider.html
      - title: "Guidance for Scalable Model Inference and Agentic AI on Amazon EKS"
        url: https://docs.aws.amazon.com/solutions/scalable-model-inference-and-agentic-ai-on-amazon-eks/
    # <<< checked
    reference:
      - title: Guidance for Scalable Model Inference and Agentic AI on Amazon EKS
        url: https://aws.amazon.com/solutions/guidance/scalable-model-inference-and-agentic-ai-on-amazon-eks/
      - title: Run inference on Amazon EKS
        url: https://docs.aws.amazon.com/eks/latest/userguide/ml-inference.html
    summary:
      - >-
        Open-weights models served by an inference server (vLLM in AWS's EKS walkthrough) on Amazon EKS
        GPU node pools, one tainted pool per sensitivity tier, reached only through AgentCore Gateway,
        which authenticates each tenant, meters tokens, salts the prefix cache and applies content
        policy. Weights load from an S3 bucket only the promotion pipeline writes, and only releases
        Approved in SageMaker Model Registry are deployed. AWS's EKS guidance puts LiteLLM in the
        gateway's place; SageMaker AI endpoints are the managed alternative for the serving tier.
    bindings:
      - { block: consumers, service: Your applications and agents, build: true }
      - block: gateway
        service: "Amazon Bedrock AgentCore Gateway"
        note: "An inference provider target pointing at the private vLLM endpoint through gateway VPC egress. AWS's EKS guidance uses LiteLLM here."
        options:
          - { name: "Amazon Bedrock AgentCore Gateway", kind: commercial, url: "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-http-passthrough.html", note: "HTTP passthrough targets front custom inference endpoints behind one governed address; today's mapping.", packs: [awsNative], watch: [{ text: "Its address is an AWS-hosted endpoint outside your network; applications reach it privately through its own interface endpoint (bedrock-agentcore.gateway).", url: "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/vpc-interface-endpoints.html" }, { text: "AWS documents its private route into a VPC for MCP and OpenAPI targets, not inference provider targets: test that an inference provider target accepts a private endpoint, or use an HTTP passthrough target of type INFERENCE.", url: "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/vpc-egress-private-endpoints.html" }, { text: "Calls only HTTPS addresses and trusts a private certificate authority only for MCP, OpenAPI and passthrough targets, so the internal load balancer carries a certificate it trusts (vLLM serves plain HTTP unless given certificates).", url: "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-vpc-egress.html" }] }
          - { name: "LiteLLM Proxy on Amazon EKS", kind: open, url: "https://docs.aws.amazon.com/solutions/scalable-model-inference-and-agentic-ai-on-amazon-eks/", note: "AWS's Scalable Model Inference and Agentic AI on EKS guidance puts LiteLLM in front of vLLM as the model gateway.", packs: [awsEksOpenSource] }
          - { name: "Agent Router (formerly Envoy AI Gateway) on EKS", kind: open, url: "https://awslabs.github.io/ai-on-eks/docs/blueprints/gateways/envoy-gateway", note: "AI on EKS blueprint: one OpenAI-compatible endpoint over self-hosted vLLM and Bedrock, with rate limits." }
          - { name: "Kong AI Gateway (AI Proxy Advanced)", kind: commercial, url: "https://developer.konghq.com/plugins/ai-proxy-advanced/", note: "Commercial gateway with vLLM among its providers, beside Bedrock.", packs: [kongAiGateway], watch: [{ text: "vLLM is among its providers.", url: "https://developer.konghq.com/plugins/ai-proxy-advanced/" }] }
          - { name: "Databricks Unity Gateway", kind: commercial, url: "https://docs.databricks.com/aws/en/ai-gateway/", note: "Governs models, model services and MCP services in Unity Catalog, for models Databricks serves.", packs: [databricksOnAws] }
      - block: api
        service: "vLLM OpenAI-compatible API (internal NLB)"
        builtWith: "vLLM"
        options:
          - { name: "vLLM OpenAI-compatible API (internal NLB)", kind: commercial, url: "https://docs.aws.amazon.com/eks/latest/userguide/network-load-balancing.html", note: "A Service of type LoadBalancer in front of the model server's OpenAI-compatible port; today's mapping.", packs: [awsNative] }
          - { name: "Ray Serve in front of vLLM", kind: open, url: "https://awslabs.github.io/ai-on-eks/docs/blueprints/inference/framework-guides/GPUs/vLLM-rayserve", note: "AI on EKS guide: Ray Serve's HTTP endpoint over autoscaled vLLM replicas.", packs: [awsEksOpenSource] }
          - { name: "NVIDIA Triton Inference Server with the vLLM backend", kind: open, url: "https://awslabs.github.io/ai-on-eks/docs/blueprints/inference/framework-guides/GPUs/vLLM-NVIDIATritonServer", note: "AI on EKS guide: Triton's API in front of vLLM." }
          - { name: "Databricks Model Serving endpoint", kind: commercial, url: "https://docs.databricks.com/aws/en/machine-learning/model-serving/", note: "Serverless endpoint for custom models in MLflow format, in Databricks' serverless compute plane.", packs: [databricksOnAws] }
      - block: runtime
        service: "vLLM on Amazon EKS GPU nodes"
        builtWith: "vLLM"
        note: "SageMaker AI real-time endpoints with the LMI container are the managed alternative."
        options:
          - { name: "vLLM on Amazon EKS GPU nodes", kind: open, url: "https://awslabs.github.io/ai-on-eks/docs/blueprints/inference", note: "Today's mapping; AI on EKS inference charts deploy it on NVIDIA GPUs or Neuron (Inferentia, Trainium).", packs: [awsNative] }
          - { name: "SGLang", kind: open, url: "https://docs.aws.amazon.com/eks/latest/userguide/ml-inference.html", note: "Named with vLLM in Amazon EKS's inference guide as an open-source model server." }
          - { name: "NVIDIA Triton Inference Server", kind: open, url: "https://awslabs.github.io/ai-on-eks/docs/blueprints/inference/framework-guides/GPUs/vLLM-NVIDIATritonServer", note: "NVIDIA's inference server; AI on EKS runs it with the vLLM backend." }
          - { name: "NVIDIA NIM or NVIDIA Dynamo", kind: commercial, url: "https://awslabs.github.io/ai-on-eks/docs/blueprints/inference/framework-guides/GPUs/nvidia-nim-llama3", note: "Per-model NIM containers from NGC, or Dynamo's distributed serving; AI on EKS has guides for both." }
          - { name: "AWS Large Model Inference (LMI) container on SageMaker AI", kind: commercial, url: "https://docs.aws.amazon.com/sagemaker/latest/dg/large-model-inference-container-docs.html", note: "AWS's LLM serving containers with a choice of backend; the managed serving path." }
          - { name: "Databricks Model Serving (custom models)", kind: commercial, url: "https://docs.databricks.com/aws/en/machine-learning/model-serving/", note: "Python models in MLflow format, Hugging Face transformers among them, served on Databricks serverless compute.", packs: [databricksOnAws], watch: [{ text: "Serverless compute runs in Databricks' account, not your VPC.", url: "https://docs.databricks.com/aws/en/machine-learning/model-serving/" }] }
          - { name: "vLLM from the AI on EKS inference charts", kind: open, url: "https://awslabs.github.io/ai-on-eks/docs/blueprints/inference/inference-charts", note: "GPU or Neuron node pools from Karpenter; NIM and Dynamo guides also exist.", packs: [awsEksOpenSource] }
      - block: storage
        service: "Amazon S3 model artifact bucket"
        options:
          - { name: "Amazon S3 model artifact bucket", kind: commercial, url: "https://docs.aws.amazon.com/eks/latest/userguide/ml-inference.html", note: "Today's mapping; vLLM can serve straight from an s3:// path with the Run:ai Model Streamer.", packs: [awsNative, awsEksOpenSource] }
          - { name: "Mountpoint for Amazon S3 CSI driver", kind: commercial, url: "https://docs.aws.amazon.com/eks/latest/userguide/s3-csi.html", note: "Mounts the bucket into the pod as a volume." }
          - { name: "Amazon FSx for Lustre linked to S3", kind: commercial, url: "https://docs.aws.amazon.com/fsx/latest/LustreGuide/create-dra-linked-data-repo.html", note: "A high-throughput file system that imports from and exports to the model bucket." }
      - block: sources
        service: "Hugging Face Hub"
        note: "Weights come in under an identity the serving tier does not hold: a separate ingest job with its own role and outbound route, a copy carried across, or a mirror you run. AWS's EKS walkthrough downloads with the model server's own service account, which does not meet that."
        options:
          - { name: "Hugging Face Hub", kind: commercial, url: "https://huggingface.co/docs/hub/index", note: "The public hub for open weights and datasets; today's mapping.", packs: [awsNative, awsEksOpenSource] }
          - { name: "Amazon SageMaker JumpStart", kind: commercial, url: "https://docs.aws.amazon.com/sagemaker/latest/dg/studio-jumpstart.html", note: "Pretrained models AWS packages for SageMaker AI deployment." }
          - { name: "Amazon Bedrock Marketplace", kind: commercial, url: "https://docs.aws.amazon.com/bedrock/latest/userguide/amazon-bedrock-marketplace.html", note: "More than 100 further models, subscribed to and deployed to endpoints managed by SageMaker AI." }
          - { name: "NVIDIA NGC", kind: commercial, url: "https://awslabs.github.io/ai-on-eks/docs/blueprints/inference/framework-guides/GPUs/nvidia-nim-llama3", note: "Per-model NIM containers pulled with an NGC API key; AI on EKS has NIM guides." }
      - block: registry
        service: "Amazon SageMaker Model Registry"
        options:
          - { name: "Amazon SageMaker Model Registry", kind: commercial, url: "https://docs.aws.amazon.com/sagemaker/latest/dg/model-registry.html", note: "Model groups, versions and approval status that deployments read; today's mapping.", packs: [awsNative], watch: [{ text: "Holds a record that points at an S3 location: it copies no files and deploys nothing, so the promoted release is carried by a deployment pipeline you build, started by the approval event.", url: "https://docs.aws.amazon.com/sagemaker/latest/dg/model-registry-approve.html" }] }
          - { name: "MLflow on Amazon SageMaker AI", kind: commercial, url: "https://docs.aws.amazon.com/sagemaker/latest/dg/mlflow.html", note: "Managed MLflow with its Model Registry; models can register automatically in SageMaker Model Registry." }
          - { name: "MLflow on Amazon EKS", kind: open, url: "https://awslabs.github.io/ai-on-eks/docs/blueprints", note: "AI on EKS uses MLflow for model registry and versioning.", packs: [awsEksOpenSource] }
          - { name: "Models in Unity Catalog (Databricks)", kind: commercial, url: "https://docs.databricks.com/aws/en/machine-learning/manage-model-lifecycle/", note: "Databricks' recommended registry, with lineage and aliases under Unity Catalog permissions.", packs: [databricksOnAws] }
    # >>> hosting options (compared against the vendor's pages; one is the mapping itself)
    hosting:
      - id: eks
        kind: cluster
        name: "Amazon EKS"
        url: https://docs.aws.amazon.com/eks/latest/userguide/ml-inference.html
        asOf: "2026-11"
        mapped: true
        compare:
          runs: "You run the model server as Kubernetes Deployments on GPU nodes in your cluster; AWS runs the Kubernetes control plane."
          patching: "You patch GPU node images, drivers and the server image; with EKS Auto Mode, AWS patches nodes and replaces them within 21 days."
          data: "Prompts and completions are processed on EC2 GPU nodes in your account and VPC; weights sit in your S3 bucket and stream into GPU memory."
          network: "Pods run in your VPC subnets; Kubernetes network policies, security groups and an internal load balancer control traffic in and out."
          identity: "A Kubernetes service account mapped to an IAM role through EKS Pod Identity."
          accepts: "Any containerised model server; AWS's guide names vLLM, SGLang, Triton Inference Server and Text Generation Inference."
          workload: "You choose GPU instance types and node pools and scale pods with HPA or KEDA on model server metrics; nodes are yours while they run."
          portability: "Workloads use standard Kubernetes APIs and open source model servers, which AWS's guide describes as portable across environments."
          effort: "Your team operates the cluster, GPU node pools, drivers, model server, autoscaling, monitoring stack and upgrades."
          fits: "AWS's guide presents EKS for self-hosting models that need low-latency responses, with full control of cluster and GPU configuration."
        sources:
          - https://docs.aws.amazon.com/eks/latest/userguide/ml-inference.html
          - https://docs.aws.amazon.com/eks/latest/userguide/ml-on-eks.html
          - https://docs.aws.amazon.com/eks/latest/userguide/ml-inference-autoscaling.html
          - https://docs.aws.amazon.com/eks/latest/userguide/ml-inference-fast-model-loading.html
          - https://docs.aws.amazon.com/eks/latest/userguide/security.html
          - https://docs.aws.amazon.com/eks/latest/userguide/automode.html
          - https://docs.aws.amazon.com/eks/latest/userguide/pod-identities.html
          - https://docs.aws.amazon.com/eks/latest/userguide/cni-network-policy.html
          - https://docs.aws.amazon.com/eks/latest/userguide/ml-workload-taints.html
      - id: sageMakerEndpoints
        kind: runtime
        name: "Amazon SageMaker AI real-time inference"
        url: https://docs.aws.amazon.com/sagemaker/latest/dg/realtime-endpoints.html
        asOf: "2026-11"
        compare:
          runs: "SageMaker AI runs your serving container on ML instances it provisions and replaces; you supply the container image and the weights."
          patching: "SageMaker AI launches new inference containers when it applies security patches to endpoints; you keep the serving image current."
          data: "Prompts and completions are processed on SageMaker-managed instances in the Region; SageMaker copies weights there from your S3 bucket."
          network: "Containers have internet access by default; VpcConfig attaches them to your subnets and EnableNetworkIsolation blocks all outbound calls."
          identity: "An IAM execution role that SageMaker AI assumes for the model; with network isolation the container receives no AWS credentials."
          accepts: "Any container answering /ping and /invocations on port 8080; AWS provides vLLM and Large Model Inference deep learning containers."
          workload: "You choose GPU instance types and counts; auto scaling adjusts them, and endpoints that host inference components can scale to zero instances."
          portability: "The container and weights stay yours; callers use the SageMaker Runtime API or its OpenAI-compatible path, and endpoint configuration is SageMaker-specific."
          effort: "Your team owns the serving image, endpoint configuration, scaling policies and alarms; AWS operates instances, health checks and deployments."
          fits: "AWS describes real-time inference as suited to interactive, low-latency workloads on fully managed endpoints that support auto scaling."
        sources:
          - https://docs.aws.amazon.com/sagemaker/latest/dg/realtime-endpoints.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/deploy-model.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/realtime-endpoints-deploy-models.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-roles.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/realtime-endpoints-openai-compatible.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/your-algorithms-inference-code.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/host-vpc.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/mkt-algo-model-internet-free.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/endpoint-auto-scaling-zero-instances.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/large-model-inference.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/large-model-inference-hosting.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/realtime-endpoints-privatelink.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/deployment-guardrails.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/deployment-guardrails-blue-green.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/model-registry-deploy.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/realtime-endpoints-test-endpoints.html
          - https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_CreateEndpointConfig.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-inference-provider.html
        summary: "vLLM runs in AWS's vLLM container, or your own, on a SageMaker AI real-time endpoint. SageMaker provisions and patches the instances, copies the weights from S3, health-checks the container and shifts traffic on updates. The model API becomes the regional SageMaker Runtime address, guarded by IAM in place of a load balancer and network policy you own. You give up node-level control: no taints, init containers or pod policies, and the gateway's route to it must be proven."
        bindings:
          - { block: api, service: "SageMaker Runtime endpoint (OpenAI-compatible path)", note: "The path /endpoints/<name>/openai/v1 on runtime.sagemaker.<region>.amazonaws.com, called with a short-lived bearer token; reached privately through a SageMaker Runtime interface endpoint.", url: https://docs.aws.amazon.com/sagemaker/latest/dg/realtime-endpoints-openai-compatible.html, watch: [{ text: "AgentCore Gateway documents IAM outbound authorisation for providers such as Amazon Bedrock and API keys for others, not SageMaker endpoints: test its inference provider target against the OpenAI-compatible path.", url: "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-inference-provider.html" }] }
          - { block: runtime, service: "vLLM container on a SageMaker AI real-time endpoint", builtWith: "vLLM", note: "AWS's SageMaker vLLM Deep Learning Container on GPU ML instances, configured through SM_VLLM_ environment variables; the Large Model Inference container is the alternative.", url: https://docs.aws.amazon.com/sagemaker/latest/dg/realtime-endpoints-openai-compatible.html, watch: [{ text: "The container answers each /invocations request within 60 seconds and passes /ping within 8 minutes of starting; long completions stream with InvokeEndpointWithResponseStream or the OpenAI-compatible path.", url: "https://docs.aws.amazon.com/sagemaker/latest/dg/your-algorithms-inference-code.html" }] }
        dropSettings: [eksPodIdentity, eksGpuTaints, eksNetworkPolicy, vllmApiKey, releaseDigestCheck]
        addSettings: [smNetworkIsolation, smModelExecutionRole, smInvokeEndpointPolicy, smEndpointPerTier, smModelPackageDeploy, smDeploymentGuardrails, smEndpointKms]
        shape:
          - move: { block: runtime, zone: zoneExternal }
            why: "SageMaker AI runs the serving container on fully managed instances outside your serving cluster and copies the weights there from your S3 bucket. VpcConfig only attaches network interfaces in your subnets to the container."
            url: https://docs.aws.amazon.com/sagemaker/latest/dg/host-vpc.html
        alsoNeeded:
          - service: "SageMaker Runtime interface VPC endpoint (AWS PrivateLink)"
            role: network
            why: "Keeps inference traffic inside your VPC now that the model API is a regional AWS address."
            url: https://docs.aws.amazon.com/sagemaker/latest/dg/realtime-endpoints-privatelink.html
          - service: "Application Auto Scaling"
            role: other
            why: "Scaling policies and the CloudWatch alarm that brings an endpoint back from zero instances are yours to define."
            url: https://docs.aws.amazon.com/sagemaker/latest/dg/endpoint-auto-scaling-zero-instances.html
        quickstart:
          - title: "Invoke endpoints with OpenAI-compatible APIs"
            url: https://docs.aws.amazon.com/sagemaker/latest/dg/realtime-endpoints-openai-compatible.html
          - title: "Deploy models for real-time inference"
            url: https://docs.aws.amazon.com/sagemaker/latest/dg/realtime-endpoints-deploy-models.html
          - title: "Model parallelism and large model inference"
            url: https://docs.aws.amazon.com/sagemaker/latest/dg/large-model-inference.html
      - id: bedrockCustomModelImport
        kind: managed
        name: "Amazon Bedrock Custom Model Import"
        url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-customization-import-model.html
        asOf: "2026-11"
        compare:
          runs: "AWS runs the model server; you import weights from Amazon S3 and call the model through the Amazon Bedrock runtime APIs."
          patching: "AWS operates and patches the whole serving stack; you have no image, node or endpoint to maintain."
          data: "Imported models are stored and managed by AWS, encrypted with an AWS owned key or your KMS key; prompts are processed by Amazon Bedrock in the Region."
          network: "Callers use the Amazon Bedrock runtime endpoint, privately through an interface VPC endpoint; import jobs can read S3 through your VPC."
          identity: "An IAM service role lets Amazon Bedrock read the model files during import; callers are authorised by IAM on the imported model."
          accepts: "Hugging Face safetensors weights for Mistral, Mixtral, Flan, Llama, GPTBigCode, Qwen and GPT-OSS architectures, up to 200 GB for text models."
          workload: "Bedrock adds and removes model copies with demand and removes inactive models; a first call can return ModelNotReadyException while one restores."
          portability: "Weights stay in your S3 bucket in an open format; callers use InvokeModel, Converse or OpenAI-compatible request formats."
          effort: "Your team prepares weights in a supported format and handles restore retries; AWS operates capacity, scaling and the serving stack."
          fits: "AWS describes it for models you customised elsewhere, such as in SageMaker AI, and want to serve with on-demand throughput through Bedrock."
        sources:
          - https://docs.aws.amazon.com/bedrock/latest/userguide/model-customization-import-model.html
          - https://docs.aws.amazon.com/bedrock/latest/userguide/custom-model-import-prereq.html
          - https://docs.aws.amazon.com/bedrock/latest/userguide/model-customization-import-model-job.html
          - https://docs.aws.amazon.com/bedrock/latest/userguide/invoke-imported-model.html
          - https://docs.aws.amazon.com/bedrock/latest/userguide/import-model-calculate-cost.html
          - https://docs.aws.amazon.com/bedrock/latest/userguide/encryption-import-model.html
          - https://docs.aws.amazon.com/bedrock/latest/userguide/vpc-interface-endpoints.html
          - https://docs.aws.amazon.com/bedrock/latest/userguide/data-protection.html
        offers:
          - name: "Model import job from Amazon S3"
            what: "An import job reads Hugging Face format files (safetensors weights, config.json and tokenizer files) from an S3 URI and detects the model architecture."
            url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-customization-import-model.html
          - name: "Supported architectures"
            what: "Mistral, Mixtral, Flan, Llama 2 to 3.3 and Mllama, GPTBigCode, Qwen2 to Qwen3 and GPT-OSS, with weights under 200 GB for text and 100 GB for multimodal models; embedding models are not supported."
            url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-customization-import-model.html
          - name: "On-demand inference"
            what: "Imported models are invoked with InvokeModel or InvokeModelWithResponseStream, and with Converse for architectures that support it, using on-demand throughput."
            url: https://docs.aws.amazon.com/bedrock/latest/userguide/invoke-imported-model.html
          - name: "OpenAI-compatible API formats"
            what: "Models imported after 11 November 2025 accept OpenAI Completions and Chat Completions request formats, including structured outputs."
            url: https://docs.aws.amazon.com/bedrock/latest/userguide/invoke-imported-model.html
          - name: "Customer managed key encryption"
            what: "A customer managed KMS key can add a second layer of encryption over the AWS owned key that protects the imported model."
            url: https://docs.aws.amazon.com/bedrock/latest/userguide/encryption-import-model.html
          - name: "Custom Model Units and model copies"
            what: "Bedrock sizes each model copy in Custom Model Units at import, changes the number of running copies with demand and bills them in 5-minute windows."
            url: https://docs.aws.amazon.com/bedrock/latest/userguide/import-model-calculate-cost.html
          - name: "Regions and exclusions"
            what: "Available in eu-central-1, us-east-1, us-east-2 and us-west-2; batch inference and CloudFormation cannot be used with it."
            url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-customization-import-model.html
