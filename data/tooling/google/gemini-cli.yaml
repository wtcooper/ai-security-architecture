      - mitigation: cap-sensitive-data-redaction
        coverage: partial
        mechanism: BeforeModel / AfterModel hooks for redaction; no vendor DLP
        note: >-
          Hooks can rewrite the outbound request and filter the response, and inherited environment variables
          matching TOKEN / SECRET / PASSWORD / KEY patterns are redacted before MCP servers see them; content
          inspection of prompts and uploads is the organisation's own hook or a proxy at
          GOOGLE_GEMINI_BASE_URL.
        steps: &a1
          - title: Wire a redaction hook
            body:
              - Configure hooks.BeforeModel and hooks.AfterModel commands in the system settings file to inspect and
                redact the request and response payloads.
            url: https://geminicli.com/docs/hooks/
        verified: 2026-09-10
        migration:
