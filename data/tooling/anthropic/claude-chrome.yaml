      - mitigation: D3-CR
        coverage: unknown
        mechanism: >-
          Org toggle off, role capability removal, Chrome ExtensionInstallBlocklist (disables an installed
          extension with no user re-enable) or ExtensionSettings installation_mode "removed", user revocation
          of site permissions
        steps:
          - title: Turn it off for the organisation
            body:
              - Disable "Enable for your team" at Organization settings > Claude in Chrome or remove the
                capability from roles.
            url: https://support.claude.com/en/articles/13065128-claude-in-chrome-admin-controls
          - title: Remove it from every browser
            body:
              - Add fcoeoabgfenejglbffodgkkbkcdhcgfn to ExtensionInstallBlocklist; already-installed copies
                are disabled and users cannot re-enable them.
            url: >-
              https://chromium.googlesource.com/chromium/src/+/HEAD/components/policy/resources/templates/policy_definitions/Extensions/ExtensionInstallBlocklist.yaml
        evidence: []
        note: >-
          Capability scope changed: reassess this function. Retained configuration and evidence describe the
          former capability, not verified coverage of every replacement.


