# Claude Managed Agents — one entity per product × reference architecture. Facts are dated (asOf)
# and cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# 2026-09-15: added sandboxing, egress, runtime enforcement, credential isolation and MCP rows after the managed-runtime drawing pinned them; fetched environments, cloud-sandboxes-reference, self-hosted-sandboxes-security, permission-policies, mcp-connector, vaults, tools (all 200).
# 2026-09-25: re-verified all 16 rows (D3-MFA, D3-AA, D3-CH, D3-CTS, D3-EI, AML.M0028, AML.M0029, AML.M0031, cap-agent-tool-registry, cap-staged-rollout-gate, cap-agent-action-policy-enforcement, cap-input-guardrails, cap-ai-vendor-assessment, cap-agent-tracing, cap-agent-kill-switch, cap-agent-egress-control) against the MITRE capability rules; every platform.claude.com and support.claude.com page cited answered 200 with no redirect (read as .md via llms.txt); trust.anthropic.com renders client-side and was read in a browser; the Console login article confirms no Console-native MFA.
vendor: anthropic
family: Claude Managed Agents
tools:
  - id: toolClaudeManagedAgents
    name: Claude Managed Agents
    surfaceClasses:
      - managedRuntime
    variants:
      - name: Managed Agents API (agents, environments, sessions, vaults) on api.anthropic.com
        class: managedRuntime
        url: https://platform.claude.com/docs/en/managed-agents/overview
      - name: Self-hosted sandboxes (your worker polls the environment work queue)
        class: managedRuntime
        url: https://platform.claude.com/docs/en/managed-agents/self-hosted-sandboxes-security
        note: >-
          Control plane stays with Anthropic; sandbox image, egress, service-key custody and session-content
          retention are yours. Environment-variable vault credentials are not yet supported here.
    architecture: archManagedAgentRuntime
    status: beta
    asOf: "2026-09"
    summary:
      - >-
        Anthropic's hosted agent harness (beta, enabled by default for API accounts; Managed Agents endpoints
        take the managed-agents-2026-04-01 beta header, memory store endpoints agent-memory-2026-07-22): you
        define an agent (model, system prompt, toolset, MCP servers, skills), an environment (Anthropic cloud
        sandbox — an isolated Ubuntu container, up to 8 GB / 10 GB — or a self-hosted sandbox), then run
        sessions that stream events over SSE. The sandbox runs bash, file tools and code; web_search and
        web_fetch run on Anthropic's servers. Sessions are stateful: event history persists until you delete
        the session and sandbox state is checkpointed for 30 days, so Managed Agents is not ZDR- or
        HIPAA-BAA-eligible.
      - >-
        Governance is API-native and workspace-scoped: permission_policy always_allow / always_ask per toolset
        or per tool (MCP toolsets default to always_ask), tool enable flags, per-tool allowed_domains /
        blocked_domains, environment networking unrestricted / limited with allowed_hosts, vault credentials
        injected at egress so the agent never sees the secret, hard dollar session budgets, versioned agent
        definitions, memory stores with immutable version history and redaction, signed webhooks and a
        persisted event stream. Also available on Claude Platform on AWS with differences.
    facts:
      - label: Plans
        value: >-
          Any Claude API organisation (beta, on by default); MCP tunnels and dreaming are a limited research
          preview. Billed per model token, $10 per 1,000 web searches and $0.08 per session hour at list
          rates.
        url: https://platform.claude.com/docs/en/managed-agents/budgets
      - label: Inference & routing
        value: >-
          Anthropic API only (plus Claude Platform on AWS); model pinned per agent with optional inference_geo
          "us" or "global", validated against the workspace's allowed_inference_geos when the agent is saved,
          when a session is created and on every turn.
        url: https://platform.claude.com/docs/en/managed-agents/agent-setup
      - label: Data leaving the device
        value: >-
          Everything runs on Anthropic infrastructure: conversation, tool inputs/outputs, files and sandbox
          state; self-hosted sandboxes keep tool execution and files on your side while the transcript still
          passes through Anthropic.
        url: https://platform.claude.com/docs/en/managed-agents/self-hosted-sandboxes-security
      - label: Retention & training
        value: >-
          Commercial terms (no training). Session transcripts persist until you delete the session; sandbox
          checkpoints 30 days; memory versions retained 30 days (recent versions longer); not eligible for ZDR
          or HIPAA BAA.
        url: https://platform.claude.com/docs/en/manage-claude/api-and-data-retention
      - label: Docs index
        value: platform.claude.com/docs/en/managed-agents (overview through reference)
        url: https://platform.claude.com/docs/en/managed-agents/overview
    riskNotes:
      - risk: riskCrossTenantCredentialPropagation
        note: >-
          Vaults and credentials are workspace-scoped: any API key with workspace access can reference them at
          session creation, and the docs recommend separate workspaces and environments per trust boundary for
          self-hosted sandboxes.
      - risk: riskPromptInjection
        note: >-
          Memory stores attach read_write by default and the docs warn a successful injection can write
          content later sessions read as trusted; use read_only for reference stores and limited networking
          with allowed_hosts for production.
      - risk: riskRogueActions
        note: >-
          The built-in agent toolset defaults to always_allow, including bash with unrestricted egress on
          API-created environments; production guidance is limited networking and always_ask on bash or MCP
          tools that write.
      - risk: riskToolSourceProvenance
        note: >-
          MCP servers are declared by URL with no allowlist beyond the agent definition; MCP toolsets default
          to always_ask so newly added server tools do not run unapproved, and per-tool enabled flags can pin
          the set.
      - risk: riskSensitiveDataDisclosure
        note: >-
          Custom tool results, uploaded files and outputs are stored server-side until deleted; OAuth
          exchanges performed inside the sandbox return tokens unredacted, so perform exchanges outside and
          store the result in the vault.
    controls:
      - mitigation: D3-MFA
        coverage: partial
        mechanism: >-
          Require SSO for Console (Authentication section of Identity and access at
          platform.claude.com/settings/identity) sends every interactive Console login to the IdP, whose MFA
          policy supplies the second factor for the people who can change agents, environments, vaults, keys,
          tunnels and federation rules; API key expirations and Workload Identity Federation narrow the
          non-interactive path around that login
        steps:
          - title: Require SSO for the Console
            body:
              - >-
                After verifying your domain on Identity and access (platform.claude.com/settings/identity),
                turn on Require SSO for Console in the Authentication section and enforce MFA on the Claude
                app in your IdP.
            url: https://support.claude.com/en/articles/13132885-set-up-single-sign-on-sso
          - title: Shrink the key path around the login
            body:
              - >-
                Create API keys linked to a service account with a short expiration (an organisation maximum
                expiration policy removes Never), and move production callers to Workload Identity Federation,
                because a key acts without any interactive login.
            url: https://platform.claude.com/docs/en/manage-claude/authentication
        note: >-
          Partial on the MFA rule applied to every vendor (as on toolClaudeCode): the Console has no second
          factor of its own — login is Google, an emailed link or SSO, and no Console password exists (support
          article 13371040) — so MFA is the IdP's, reached only through Require SSO for Console, and that page
          appears only after SSO is enabled through Sales or an organisation merge. Paths around it: personal,
          service-account, legacy workspace and Admin API keys, and federated tokens, act without an
          interactive login, and any Workspace Developer or Limited Developer can create a key, so a key
          holder changes agents, vaults and environments with no MFA. End-user MFA at the front end, which
          decides whom a session runs for, is the deployer's application.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityIga
          reviewRequired: false
          original:
            - capability: capabilityIga
              coverage: native
              mechanism: >-
                Claude Console organisation and workspace membership, roles, SSO/SCIM and API-key or workload
                identity federation credentials gate who can create agents and sessions
              steps:
                - title: Scope operators by workspace
                  body:
                    - Create agents, environments and vaults in a dedicated Console workspace and issue keys
                      (or a WIF service account) scoped to it; Console SSO and SCIM govern the humans.
                  url: https://support.claude.com/en/articles/13133195-set-up-jit-or-scim-provisioning
              verified: 2026-09-10
      - mitigation: D3-AA
        coverage: partial
        mechanism: >-
          No per-agent principal: agent ids and versions identify configuration. The calling application
          authenticates as a service account (svac_) through Workload Identity Federation or a service-account
          key; outbound MCP and API calls carry whatever credential the session's vaults map (vault
          display_name and metadata name the end user); a self-hosted worker holds an environment key and a
          per-session secret
        steps:
          - title: Give each calling application its own service account
            body:
              - >-
                In Settings → Workload identity run Connect workload to create an issuer, a service account
                and a federation rule scoped to the agent's workspace, so the application that drives the
                agent holds short-lived tokens tied to a named non-human identity.
            url: https://platform.claude.com/docs/en/manage-claude/workload-identity-federation
          - title: Map each vault to one end user
            body:
              - >-
                Create one vault per end user with metadata external_user_id and pass only that vault in
                vault_ids at session creation, so the credential an MCP server sees is that user's.
            url: https://platform.claude.com/docs/en/managed-agents/vaults
          - title: Protect self-hosted worker credentials
            body:
              - >-
                Store ANTHROPIC_ENVIRONMENT_KEY in a secrets manager, pass the per-session secret only into
                the sandbox serving that session, and revoke the key on suspicion; revocation is validated on
                every request.
            url: https://platform.claude.com/docs/en/managed-agents/self-hosted-sandboxes-security
        note: >-
          Partial by the agent-identity rule: the runtime mints no identity per agent. What authenticates is
          layered — the application's service account or API key to Anthropic (inventoried under Settings →
          Service accounts and API keys, revocable apart from people), the vault credential to each MCP
          server, and the environment key for a self-hosted worker — and none is bound to an agent id, so
          revoking an agent means archiving it and finding every vault its sessions attached. Any key with
          workspace access can attach any vault, and in a multiagent session every thread uses the session's
          vaults. No agent identity is presented to third parties, and the MCP tunnel does not authenticate to
          the upstream.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityNhiManagement
          reviewRequired: false
          original:
            - capability: capabilityNhiManagement
              coverage: partial
              mechanism: >-
                Agent resources with ids and versions; per-session vault identity (display_name and metadata
                mapping to your user); environment service keys and per-session secrets for self-hosted
                workers; no cryptographic agent identity presented to third parties
              steps:
                - title: Bind each session to an end-user vault
                  body:
                    - Create one vault per end user (metadata external_user_id) and pass vault_ids at session
                      creation so actions on MCP servers are attributable to that user's credentials.
                  url: https://platform.claude.com/docs/en/managed-agents/vaults
                - title: Protect the environment key
                  body:
                    - Store ANTHROPIC_ENVIRONMENT_KEY in a secrets manager, pass the per-session secret only
                      into the sandbox serving that session, and revoke on suspicion (validated on every
                      request).
                  url: https://platform.claude.com/docs/en/managed-agents/self-hosted-sandboxes-security
              note: >-
                The agent id and version identify a configuration, not a principal third parties authenticate;
                vault credentials carry the authority for outbound calls, so the identity a tool sees is
                whatever credential the vault mapped — inventory those as the non-human identities.
              verified: 2026-09-10
      - mitigation: D3-CH
        coverage: native
        mechanism: >-
          Vault credential values are write-only, never returned and stored under Anthropic-managed encryption
          (outside workspace CMEK), rotated in place with running sessions re-resolving; Workload Identity
          Federation tokens (token_lifetime_seconds 60 to 86400, default 3600) and API key expirations for the
          API itself; the MCP tunnel token (Rotate token, archive) and up to two CA certificates (Revoke),
          provisioned over a workspace:manage_tunnels federation rule
        steps:
          - title: Register credentials in a vault and rotate in place
            body:
              - >-
                Add mcp_oauth (with a refresh block), static_bearer or environment_variable credentials;
                update the secret to rotate (running sessions re-resolve without a restart) and archive to
                purge it while keeping the record.
            url: https://platform.claude.com/docs/en/managed-agents/vaults
          - title: Federate the API credential
            body:
              - >-
                Connect the workload under Settings → Workload identity with a workspace:developer rule and a
                short token_lifetime_seconds, unset ANTHROPIC_API_KEY wherever it runs (it shadows
                federation), and delete the old key.
            url: https://platform.claude.com/docs/en/manage-claude/workload-identity-federation
          - title: Provision the tunnel over federation
            body:
              - >-
                Create the tunnel with programmatic access so the setup component fetches the tunnel token and
                registers a locally generated CA over a workspace:manage_tunnels rule; the private key never
                leaves your environment.
            url: https://platform.claude.com/docs/en/agents-and-tools/mcp-tunnels/console
          - title: Rotate and revoke tunnel credentials
            body:
              - >-
                Use Rotate token on the tunnel's detail page, register a new CA certificate beside the old one
                and Revoke the old, and archive the tunnel to invalidate its token; every reveal and rotation
                is recorded in the Compliance API activity log.
            url: https://platform.claude.com/docs/en/agents-and-tools/mcp-tunnels/console
        note: >-
          Native by the credential-hardening rule: an encrypted write-only store for tool credentials,
          federated short-lived credentials for the API, and a scoped, rotatable, revocable tunnel credential.
          Boundaries: nothing refuses static API keys — any Workspace Developer can create one and Never is
          offered unless an organisation maximum expiration policy is set (where that policy is set is not
          documented); static_bearer credentials live as long as the upstream token; an OAuth exchange run
          inside the sandbox leaves the returned token there unredacted. Tunnel (research preview, request
          access): rotating the token does not sever established cloudflared connections, so cutting a
          compromised host means stopping the stack or archiving the tunnel; the tunnel token and TLS private
          key sit on the organisation's host and in its secrets manager.
        verified: "2026-09-25"
        migration:
          from:
            - capabilitySecretsManagement
          reviewRequired: false
          original:
            - capability: capabilitySecretsManagement
              coverage: native
              mechanism: >-
                Vault credentials (mcp_oauth with managed refresh, static_bearer, environment_variable with
                networking.allowed_hosts and injection_location) substituted at egress; secret values are
                write-only; rotate via update, archive purges the secret
              steps:
                - title: Register credentials in a vault
                  body:
                    - Add mcp_oauth or static_bearer credentials keyed by mcp_server_url, or
                      environment_variable credentials keyed by secret_name with networking type limited and
                      allowed_hosts; the agent sees only an opaque placeholder.
                  url: https://platform.claude.com/docs/en/managed-agents/vaults
                - title: Rotate and revoke
                  body:
                    - Update the credential's secret (running sessions re-resolve without restart), archive to
                      purge the secret while keeping the audit record (vaults page), and subscribe to
                      vault_credential.refresh_failed on the webhooks page
                      (platform.claude.com/docs/en/managed-agents/webhooks) for the notification.
                  url: https://platform.claude.com/docs/en/managed-agents/vaults
              note: >-
                Vault substitution keeps values out of the sandbox and the model; it does not scope them per
                requesting user. A credential in a vault is presented for every session that vault is attached
                to, so tenant-scoped delegation — one user's authority, not a shared credential's — is the
                application's to arrange through per-user vaults or mcp_oauth per user. Where no credential
                matches, the connection is attempted unauthenticated.
              verified: 2026-09-10
      - mitigation: cap-agent-tool-registry
        coverage: partial
        mechanism: >-
          Agents, environments, vaults, memory stores and deployments are listable workspace resources (id,
          name, description, metadata, immutable agent version history, archived_at); agent.created / updated
          / archived webhooks and the Compliance API Activity Feed's platform_agent_created / updated /
          archived records; the only gate on writing a definition is workspace membership and role
        steps:
          - title: Treat the agent resource as the register
            body:
              - >-
                Create each agent once with owner and approval metadata, list its versions, and archive
                retired agents so new sessions cannot reference them.
            url: https://platform.claude.com/docs/en/managed-agents/agent-setup
          - title: Record who changed each definition
            body:
              - >-
                Turn on the Compliance API (Console Settings > Security) and pull platform_agent_created,
                platform_agent_updated and platform_agent_archived from the Activity Feed, alongside the
                agent.* webhooks.
            url: https://platform.claude.com/docs/en/api/compliance/activities/list
          - title: Limit who can write definitions
            body:
              - >-
                Give Workspace Developer only to the authors and the pipeline's service account and Workspace
                User to everyone else, since any role that can use the API can create, update and override
                agents.
            url: https://platform.claude.com/docs/en/manage-claude/workspaces
        note: >-
          Partial by the registry rule: the inventory, version history and change record exist, but nothing
          gates a definition before it runs. Any key or token with workspace:developer — the only non-admin
          scope; finer-grained scopes "per resource, or read versus write" are not available — can create or
          update an agent (omitting version makes the update unconditional), and a session created with
          agent_with_overrides replaces model, system, tools, mcp_servers and skills without creating a
          version, so a session can run a configuration the register never saw. Environments are not
          versioned. There is no approval state; ownership is metadata the organisation writes, and
          reconciliation is its pipeline.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAgentRegistry
          reviewRequired: false
          original:
            - capability: capabilityAgentRegistry
              coverage: native
              mechanism: >-
                Agents are first-class workspace resources with id, name, description, metadata, version
                history, archive; environments, vaults, memory stores and deployments likewise; list endpoints
                and lifecycle webhooks
              steps:
                - title: "Treat the agent resource as the registry"
                  body:
                    - "Create agents once with metadata for ownership, list versions, and archive retired agents (new sessions cannot reference them); subscribe to agent.created / updated / archived webhooks."
                  url: https://platform.claude.com/docs/en/managed-agents/agent-setup
              note: >-
                A registry of deployed definitions with ids and versions. Ownership lives in metadata the
                organisation writes, and there is no approval workflow before deploy — the change-gating the
                architecture pins is the organisation's pipeline.
              verified: 2026-09-10
      - mitigation: cap-staged-rollout-gate
        coverage: partial
        mechanism: >-
          Immutable agent versions (version increments on every change; optimistic concurrency through the
          version field, 409 on mismatch; full version history); sessions and scheduled deployments pin agent
          {id, version}; coordinator rosters keep the version pinned when last updated; user.define_outcome
          runs a grader inside one session
        steps:
          - title: Pin sessions to a version
            body:
              - >-
                Create sessions with agent as an object carrying id and version, so your application decides
                which version each session runs and rolling back is changing that pinned number.
            url: https://platform.claude.com/docs/en/managed-agents/sessions
          - title: Update with optimistic concurrency
            body:
              - >-
                Supply version on every update (ant apply does this), list versions to audit, and re-apply an
                earlier configuration to make it the latest again.
            url: https://platform.claude.com/docs/en/managed-agents/agent-setup
          - title: Use outcomes as an in-session check
            body:
              - >-
                Send user.define_outcome with a rubric so a separate grader evaluates each iteration and emits
                span.outcome_evaluation_end.
            url: https://platform.claude.com/docs/en/managed-agents/define-outcomes
        note: >-
          Partial: versioning and pointer-flip rollback are met — a session pinned to a version object keeps
          it, and the docs describe pinning to "stage rollouts of new versions independently" — but
          progressive release is the application's: the runtime has no alias, traffic split or canary
          percentage, and a session created with the bare agent id gets the latest version the moment it is
          saved. No evaluation gate sits in the promotion path: define_outcome grades one session's artifact,
          not a version. Environments are not versioned; agent_with_overrides and mid-session tools updates
          run configurations no version records; rolling the agent back rolls back neither environments,
          vaults nor running sessions. Rated partial on the same rule as the other managed runtimes.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityStagedRollout
            - capabilityModelEvals
          reviewRequired: false
          original:
            - capability: capabilityStagedRollout
              coverage: partial
              mechanism: >-
                Agent version increments on every change with optimistic concurrency (version field, 409 on
                mismatch), full version history, coordinator rosters pinned to a version; sessions keep the
                configuration they started with
              steps:
                - title: Roll forward and back by version
                  body:
                    - Update with the version field for safe concurrent edits, list versions to audit, and re-apply an earlier
                      configuration to roll back; environments are not versioned, so keep your own record.
                  url: https://platform.claude.com/docs/en/managed-agents/agent-setup
              note: >-
                Immutable versions, full history and re-applying an earlier version are the versioning half;
                there is no canary alias, percentage exposure or regression gate, environments are not
                versioned, and rolling back the agent does not roll back credentials or running sessions (they
                keep the configuration they started with). Rated partial on the same rule as the other hosted
                runtimes.
              verified: 2026-09-10
            - capability: capabilityModelEvals
              coverage: partial
              mechanism: Outcome-driven sessions run a grader that evaluates iterations against a defined outcome; no
                release-gate eval harness
              steps:
                - title: Use outcomes as an in-session check
                  body:
                    - Send user.define_outcome so a grader (without web tools) evaluates each iteration and
                      emits span.outcome_evaluation_end with satisfied / needs_revision / failed.
                  url: https://platform.claude.com/docs/en/managed-agents/reference
              note: The outcome grader evaluates iterations within a session against a defined outcome; it is not a
                release-gate regression suite with datasets and results across versions. Anthropic's model
                evaluations are supplier evidence for TPRM.
              verified: 2026-09-10
      - mitigation: AML.M0028
        coverage: native
        mechanism: >-
          agent_toolset_20260401 default_config / configs with enabled and permission_policy per tool;
          mcp_toolset default_config.enabled false plus named configs; web_search / web_fetch allowed_domains
          or blocked_domains; mcp_servers declared by URL on the definition (up to 20); custom tools returned
          to the application
        steps:
          - title: Enable only the tools the agent needs
            body:
              - >-
                Set default_config.enabled false on agent_toolset_20260401 and enable bash, read, write and
                the others individually in configs.
            url: https://platform.claude.com/docs/en/managed-agents/tools
          - title: Switch the vendor's web tools off or bound them
            body:
              - >-
                Set enabled false on web_search and web_fetch, or put allowed_domains or blocked_domains (1 to
                64 each) on their configs entries; environment networking does not govern these tools.
            url: https://platform.claude.com/docs/en/managed-agents/tools
          - title: Enable only the MCP tools you reviewed
            body:
              - >-
                Set default_config.enabled false on each mcp_toolset and list the tools to enable, so tools
                the server operator adds later stay off until reviewed.
            url: https://platform.claude.com/docs/en/managed-agents/mcp-connector
          - title: "Leave MCP toolsets on always_ask"
            body:
              - >-
                Keep the always_ask default on MCP toolsets and per-tool configs so new or consequential tools
                do not run without approval; switch a server to always_allow only after review.
            url: https://platform.claude.com/docs/en/managed-agents/permission-policies
        note: >-
          Native by the tool-permission rule: per-tool enablement plus a per-tool approval policy, and domain
          scoping on the web tools, enforced server-side for the built-in and MCP toolsets. Not covered:
          anything a declared MCP server serves (session creation does not check connectivity or credentials),
          and scoping by principal beyond the vault attached. Every setting is definition content the next
          update undoes, with no tenant restriction on definition changes beyond workspace role; a session
          created with agent_with_overrides replaces tools and mcp_servers wholesale, and an idle session's
          tools can be updated mid-session. Custom tools are the application's to permit. The gateway half of
          this pin — which servers, which tools, whose grant — is the organisation's MCP gateway on the tunnel
          path.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityToolPermissionScoping
            - capabilityMcpToolSecurity
          reviewRequired: false
          original:
            - capability: capabilityToolPermissionScoping
              coverage: native
              mechanism: >-
                agent_toolset_20260401 default_config / configs with enabled false per tool, MCP toolset
                per-tool enabled flags, web_search / web_fetch allowed_domains or blocked_domains,
                permission_policy per tool
              steps:
                - title: Enable only the tools the agent needs
                  body:
                    - Set default_config.enabled false and enable bash, read, write and so on individually; do
                      the same on mcp_toolset entries so server-added tools stay off.
                  url: https://platform.claude.com/docs/en/managed-agents/tools
                - title: Restrict the web tools
                  body:
                    - Put allowed_domains or blocked_domains on the web_search and web_fetch config entries
                      (up to 64 domains each); environment networking does not govern these tools.
                  url: https://platform.claude.com/docs/en/managed-agents/tools
              note: >-
                enabled false hides a tool, permission_policy pre-approves or gates it, domain lists limit web
                tools' arguments. Custom tools are the application's: the runtime returns them to the
                application without applying toolset policy.
              verified: 2026-09-10
            - capability: capabilityMcpToolSecurity
              coverage: partial
              mechanism: mcp_servers declared by name and URL on the agent definition (up to 20, every entry referenced by
                an mcp_toolset); default_config.enabled false plus configs to enable named tools; MCP toolsets
                default to always_ask
              steps:
                - title: Enable only the tools you reviewed
                  body:
                    - Set default_config.enabled false on each mcp_toolset and list the tools to enable, so
                      tools the server operator adds later stay off until reviewed.
                  url: https://platform.claude.com/docs/en/managed-agents/mcp-connector
                - title: Leave MCP toolsets on always_ask
