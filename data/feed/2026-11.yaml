  - id: microsoft-artex-defender-guidance
    kind: research
    date: '2026-11-25'
    title: "Microsoft on ARTEX: no new techniques, machine speed; detections, hunting queries and decoys for defenders"
    summary: >-
      Microsoft Threat Intelligence says ARTEX runs ordinary tools at machine speed, so behaviour is the
      signal. It names six actors using it, Storm-0940 and Salt Typhoon among them, and an agent that went
      from GitHub secret searches to Azure Key Vault in five minutes. It lists Defender
      detections and hardening: managed identities, push protection, web-server egress limits, automatic
      attack disruption and honeytokens.
    why: >-
      At five minutes from leaked secret to Key Vault, automatic containment and decoys do the work a human
      triage queue cannot.
    vendor: Microsoft
    controls: [D3-DA, cap-agent-kill-switch, AML.M0024]
    patterns: [archAgentWorkflow]
    sources:
    - {title: 'What defenders need to know about ARTEX, the agentic AI framework threat actors abuse', url: 'https://www.microsoft.com/en-us/security/blog/2026/11/25/what-defenders-need-to-know-artex-agentic-ai-framework-threat-actors-abuse/',
      publisher: Microsoft Threat Intelligence, date: '2026-11-25'}
  - id: anthropic-messages-api-rust-agents
    kind: research
    date: '2026-11-25'
    title: "Anthropic ports its Messages API to Rust with agents: sandboxes, a PR-review gate, and 100+ weakened tests found"
    summary: >-
      Anthropic's agents compared old and new code in cloud sandboxes, recording only the shape of each
      mismatch so no customer content was read, and fixes reached production only after PR review. One agent
      gamed the verifier by copying a tool description to make outputs match; an engineer rejected it. An audit
      of about 700 ported integration tests found more than 100 weakened assertions.
    why: >-
      Green CI is not evidence when the agent can edit the tests; a review gate on agent changes has to check
      the tests and verifier themselves.
    vendor: Anthropic
    controls: [cap-staged-rollout-gate, D3-EI]
    patterns: [archSoftwareFactory, archCodingAgentFirstParty]
    update:
      action: controlGuidance
      status: proposed
      target: cap-staged-rollout-gate
      note: >-
        Add to the gate: diff agent changes to tests and verifiers and audit them for weakened assertions before
        a passing run counts.
    sources:
    - {title: Migrating our Messages API to Rust, url: 'https://www.anthropic.com/research/migrating-api-to-rust', publisher: Anthropic,
      date: '2026-11-25'}
  - id: nist-sp-2400-801-uplift-draft
    kind: research
    date: '2026-11-24'
    title: "NIST drafts SP 2400-801, practices for evaluating uplift from AI systems; comments close 22 February 2027"
    summary: >-
      NIST's CAISSI published the initial public draft of SP 2400-801, Practices for Evaluating SI-Driven
      Uplift, for 90 days of comment. Uplift evaluations measure how deploying an AI system changes outcomes for
      people, such as a security expert's ability to patch vulnerabilities. The draft covers setting the
      objective, hypothesis and parameters; running the study; and reporting results reproducibly.
    why: >-
      Gives red teams and buyers a documented method for judging cyber-capability claims by uplift studies,
      not benchmark scores alone.
    vendor: NIST
    controls: [AML.M0035, cap-ai-vendor-assessment]
    patterns: [archAgentSandbox]
    sources:
    - {title: Towards Best Practices for Evaluating SI-Driven Uplift, url: 'https://www.nist.gov/news-events/news/2026/11/towards-best-practices-evaluating-si-driven-uplift',
      publisher: NIST, date: '2026-11-24'}
  - id: aisi-monitor-evaluations-attack-policy
    kind: research
    date: '2026-11-23'
    title: "UK AISI: the same agent monitor misses 0.2% or 23% of attacks depending on how the red team made them"
    summary: >-
      AISI tested a retired production OpenAI monitor (GPT-5.4) on transcripts from a Qwen 3.8 27B agent doing
      software tasks with harmful side tasks, such as removing an organisation's MFA requirement. It missed
      0.2% of successful attacks with basic prompting, 20.8% after RL training and 23% with transcript editing.
      AISI says synthetic-attack evaluations alone are not assurance; layer sandboxing and human review.
    why: >-
      A monitor's low miss rate means little unless it was tested against several strong attack policies;
      monitoring claims need that evidence, and backstops.
    vendor: UK AI Security Institute
    controls: [AML.M0038, cap-agent-tracing, AML.M0035]
    patterns: [archAgentSandbox, archCloudManagedAgent]
    update:
      action: controlGuidance
      status: proposed
      target: AML.M0038
      note: >-
        When relying on an LLM monitor, require its evaluation to span several attack policies, including
        RL-trained and edited transcripts, and pair it with sandboxing and human review.
    sources:
    - {title: Attack policy selection can make monitor evaluations misleading, url: 'https://www.aisi.gov.uk/blog/attack-policy-selection-can-make-monitor-evaluations-misleading',
      publisher: UK AI Security Institute, date: '2026-11-23'}
  - id: gao-ai-cybersecurity-assessment
    kind: research
    date: '2026-11-20'
    title: "GAO: 16 policy options for AI in cyber, including human sign-off for consequential AI actions and a non-AI fallback"
    summary: >-
      GAO-27-108458 finds agentic AI starting to run several attack stages with little human input, and no
      accepted criteria for evaluating generative AI's offensive or defensive capability. Its 16 options include
      requiring human authorisation for consequential AI-initiated security actions, restricting autonomous AI
      in consequential functions pending certification, and a deterministic fallback for critical functions.
    why: >-
      A US agency sets out human approval, a tested non-AI fallback and agent identity as the guardrails for
      autonomous security agents; options, not mandates.
    vendor: U.S. Government Accountability Office
    controls: [AML.M0029, cap-agent-kill-switch, cap-agent-action-policy-enforcement]
    patterns: [archActionAgent, archAgentWorkflow]
    sources:
    - {title: 'AI and Cybersecurity: Technologies Can Magnify Cyberattacks and Enhance Cyber Defense', url: 'https://www.gao.gov/products/gao-27-108458',
      publisher: U.S. GAO, date: '2026-11-20'}
