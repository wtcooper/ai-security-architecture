schema_version: "1.1"
name: full-scan
expected_outcome: |
  A dated report exists under docs/research/patterns/ named for today's date. It states the
  window searched, sorts every finding under new pattern, change to an existing pattern, product
  of an existing pattern or watch, gives a dated primary source for each finding, and includes a
  search log covering every lane. No pattern, tooling or incident data was changed.
