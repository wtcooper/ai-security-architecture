  - architecture: archRemoteMcpServer
    asOf: "2026-10"
    reference:
      - title: Host MCP servers on Cloud Run
        url: https://docs.cloud.google.com/run/docs/host-mcp-servers
      - title: Get started with Apigee and MCP
        url: https://docs.cloud.google.com/apigee/docs/api-platform/apigee-mcp/apigee-mcp-quickstart
      - title: Single-agent AI system using ADK and Cloud Run — MCP security considerations
        url: https://docs.cloud.google.com/architecture/single-agent-ai-system-adk-cloud-run
    summary:
      - >-
        Your MCP server on Cloud Run, published only through an Apigee MCP proxy that is also the
        OAuth 2.0 authorization server: clients are registered developer apps whose API products
        name the tools they may see, so every token is bound to this proxy and checked, with its
        app, on each request. Customer callers sign in through their own IdP, federated as an
        Identity Platform tenant. Google's own reference protects Cloud Run MCP servers with IAP
        and Agent Gateway, which serve internal callers rather than a server published to other
        organisations.
    bindings:
      - { block: idp, service: Identity Platform (a tenant per customer), note: "Each customer organisation's IdP federated as its tenant's SAML or OIDC provider; your own staff through your workforce IdP." }
      - { block: gateway, service: Apigee (MCP proxy), note: "ParsePayload reads the JSON-RPC method and tool, so authorization, quotas and logging are per tool." }
      - { block: authServer, service: Apigee OAuth 2.0 token endpoints, note: "Clients are pre-registered as developer apps, so no client-metadata document is fetched; Google Cloud workloads present their own service-account identity, checked by VerifyIAM." }
      - { block: service, service: Your MCP server on Cloud Run, note: "Deployed with --functional-type=mcp-server and invoked only by Apigee's service account." }
      - { block: toolDefs, service: Tool definitions in your repository, build: true, note: "Versioned with the release and pinned by hash where the server loads them." }
      - { block: orgData, service: Your systems of record, build: true, note: "Reached on the service's own identity or a Secret Manager credential for that upstream, never the caller's token." }
    settings:
      - identityPlatformTenants
      - apigeeVerifyAccessToken
      - apigeeKeyApproval
      - apigeeMcpToolAccess
      - apigeeVerifyIam
      - cloudRunServiceIdentity
      - noTokenPassthrough
      - secretManagerSecrets
      - disableSaKeyCreation
      - apigeeRevokeTokens
      - tenantScoping
      - apigeeSpikeArrest
      - toolDefinitionPinning
      - appSecurityTesting
      - containerScanning
      - swpEgress
      - apigeeMessageLogging

