# Cline — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# Excluded: the Cline SDK (@cline/sdk, an embeddable runtime), the Cline API (an OpenAI-compatible inference
# endpoint) and Cline Desktop (an open-weight-model app over the same harness; no admin surface of its own is
# documented and none of the rows below were checked against it). Kanban, ACP, the TUI and the chat connectors
# are CLI features and are covered by the CLI variant.
# 2026-09-25: onboarded toolCline against the MITRE capability rules; every docs.cline.bot page cited answered
# 200 with no redirect (read through its .md variant); trust.cline.bot renders client-side with no readable text;
# www.npmjs.com/package/cline returned 403 and the VS Code Marketplace item page 404 to curl (versions read from
# the npm registry and the Marketplace gallery API); CLINE_NO_AUTO_UPDATE, the extension hook event names and
# the remote-config globalRules / kanbanEnabled fields appear only in the cline/cline source, not in the docs.
# 2026-10-30: settings table added; re-read docs.cline.bot pages (.md variants, all 200). Corrections: telemetry
# is now documented as on by default and the org setting as a lock (extensions only); CLINE_COMMAND_PERMISSIONS
# has left the docs (the CLI reference says there is no command allow/deny list); the remote-configuration
# overview now carries a per-product support table (CLI: rules and workflows only; YOLO and Kanban: none);
# --retries defaults to 3.
vendor: cline
family: Cline
tools:
  - id: toolCline
    name: Cline
    surfaceClasses:
      - ideExtension
      - endpointCli
    variants:
      - name: Cline for VS Code and its forks (Marketplace / Open VSX saoudrizwan.claude-dev, v4.1.21 2026-09-24)
        class: ideExtension
        url: https://docs.cline.bot/getting-started/installing-cline
      - name: Cline for JetBrains IDEs
        class: ideExtension
        url: https://plugins.jetbrains.com/plugin/28247-cline
      - name: Cline CLI (npm cline, v3.0.65), with the TUI, ACP mode, Kanban and chat connectors
        class: endpointCli
        url: https://docs.cline.bot/usage/cli-overview
    architecture: archCodingAgentFirstParty
    status: ga
    asOf: "2026-09"
    summary:
      - "Cline's open-source (Apache-2.0) coding agent — the IDE-extension harness class: a loop over file,
        shell, search, web-fetch and browser tools, MCP servers, rules, skills and hooks, driven by a present
        developer in VS Code, its forks or JetBrains, and from the same core as a CLI with a TUI, an ACP mode,
        a local hub daemon, a Kanban board and chat connectors. The developer brings the model: a pasted
        provider key (30+ providers, local runtimes included) or the Cline provider billed in Cline credits."
      - "Prompts, file contents and tool output go straight to the chosen provider, or through Cline when the
        Cline provider is used. Task history, checkpoints (a shadow Git repository) and provider credentials
        stay under ~/.cline on the device. Usage and error telemetry, identifying the account and organisation
        when signed in, goes to Cline by default until Allow error and usage reporting (telemetryOptOut in the
        CLI) is turned off."
      - "The Open Source tier ships no organisation control plane. Cline Enterprise adds one: SSO through WorkOS
        AuthKit, Owner / Admin / Member roles, and a remote configuration held at app.cline.bot that the client
        applies to members signed in to the organisation — provider and model pinning, yoloModeAllowed, MCP
        server policy (allowedMCPServers, remoteMCPServers, blockPersonalRemoteMCPServers,
        mcpMarketplaceEnabled), telemetry, OpenTelemetry export and Prompt Storage to the organisation's bucket.
        It holds no per-tool rules, sandbox or egress policy, and the docs describe no device-side key that forces
        the organisation sign-in."
    facts:
      - label: Plans
        value: >-
          Open Source (free; bring your own key, the pay-as-you-go Cline provider, or ClinePass at $9.99/month)
          and Enterprise (custom: SSO, role-based access control, centralised billing, config management, provider
          limits, authentication logs, the JetBrains extension; the FAQ adds VPC deployment, SCIM, OIDC and
          OpenTelemetry). No separate Teams tier is listed.
        url: https://cline.bot/pricing
      - label: Inference & routing
        value: >-
          Direct from the device to the configured provider (Anthropic, OpenAI, Bedrock, Vertex, Gemini,
          OpenRouter, OpenAI-compatible, LiteLLM, Ollama, LM Studio and others), or through the Cline provider.
          Enterprise remote configuration can pin the provider and its base URL (openAiBaseUrl, LiteLLM baseUrl,
          Anthropic baseUrl, awsBedrockEndpoint); members signed in to the organisation cannot select another
          provider or switch to a personal account.
        url: https://docs.cline.bot/enterprise-solutions/configuration/remote-configuration/overview
      - label: Data leaving the device
        value: >-
          Prompts, rules, file contents and tool results to the model endpoint; feature, task, token-count and
          error events to Cline, on by default in every product (with the Cline and ClinePass providers they can
          include the prompt and response); remote-config telemetryEnabled (Cline Telemetry) locks the choice in
          the VS Code and JetBrains extensions, while the CLI and Cline Desktop ignore it; on Enterprise,
          optional OTLP export to the organisation's collector and Prompt Storage of each task's full
          conversation to its S3 or R2 bucket.
        url: https://docs.cline.bot/enterprise-solutions/monitoring/telemetry
      - label: Retention & training
        value: >-
          With the developer's own key Cline states it does not collect the request; with Cline-provided keys it
          collects the request to forward it, the upstream provider's terms apply, and some providers may train
          on it unless opted out. The privacy policy (updated 2025-09-24) states no retention period; the
          Enterprise page says code and prompts aren't used for training.
        url: https://cline.bot/privacy
      - label: Docs index
        value: >-
          docs.cline.bot/llms.txt — Config, Auto Approve, Rules, Skills, Plugins, MCP, Checkpoints, CLI
          reference, Connectors, Kanban remote access, Networking and proxies, and the Enterprise section
          (remote configuration, YOLO and MCP controls, SSO, members, telemetry, OpenTelemetry, Prompt Storage).
        url: https://docs.cline.bot/llms.txt
      - label: Distribution & updates
        value: >-
          VS Code Marketplace and Open VSX (extension id saoudrizwan.claude-dev), JetBrains Marketplace (plugin
          28247), npm (cline; Kanban as the kanban package). The extension updates under the editor's own
          auto-update policy; the CLI checks for and installs a new release at startup unless
          CLINE_NO_AUTO_UPDATE=1 (source only). npm releases have been published with OIDC provenance since the
          2026-02 token compromise.
        url: https://docs.cline.bot/getting-started/installing-cline
      - label: Listening ports
        value: >-
          Hub daemon on 127.0.0.1:25463 (CLINE_HUB_ADDRESS), Kanban on 127.0.0.1:3484 (--host or
          KANBAN_RUNTIME_HOST widens it), connector webhook listeners on the port passed with --port.
        url: https://docs.cline.bot/sdk/architecture/hub-spoke
    items:
      - title: Enterprise remote configuration
        body:
          - "Admins edit the organisation's settings at app.cline.bot (Settings → Cline Settings, Enable settings)
            and signed-in members download and apply them. Documented fields: provider settings with allowed
            models and base URLs, yoloModeAllowed, telemetryEnabled, mcpMarketplaceEnabled, allowedMCPServers,
            remoteMCPServers (name, url, headers, alwaysEnabled), blockPersonalRemoteMCPServers, the
            openTelemetry* export fields and enterpriseTelemetry.promptUploading. The schema in the source also
            carries globalRules, globalWorkflows and globalSkills (alwaysEnabled) and kanbanEnabled. The YOLO page
            says the policy cannot be overridden by users; the OpenTelemetry override page says environment
            variables win over it. The overview's support table (re-read 2026-10-30) applies providers, MCP
            policy, telemetry and the no-personal-account lock only in the VS Code and JetBrains extensions, the
            CLI only rules and workflows, Cline Desktop none, and lists Allow YOLO mode and Allow Kanban as
            supported in no product; Admins and Owners can choose Opt out of remote config."
        links:
          - title: Enterprise provider configuration
            url: https://docs.cline.bot/enterprise-solutions/configuration/remote-configuration/overview
          - title: MCP server controls
            url: https://docs.cline.bot/enterprise-solutions/configuration/infrastructure-configuration/control-other-cline-features/mcp-server-controls
          - title: Remote-config schema (source)
            url: https://github.com/cline/cline/blob/main/apps/vscode/src/shared/remote-config/schema.ts
      - title: Local configuration
        body:
          - "Global state lives in ~/.cline (data/settings/providers.json for provider keys, global-settings.json,
            cline_mcp_settings.json, plus rules, hooks, skills, agents, plugins and cron specs) and
            ~/Documents/Cline; project configuration in .cline/ and .clinerules/ travels with the repository.
            Workspace rules win over global ones on conflict. CLINE_DIR, CLINE_DATA_DIR, --config and --data-dir
            relocate the store. CLINE_COMMAND_PERMISSIONS is no longer documented (2026-10-30): the CLI reference
            says the CLI has no allow or deny list for shell commands and points to a PreToolUse hook instead."
        links:
          - title: Config
            url: https://docs.cline.bot/getting-started/config
          - title: Rules
            url: https://docs.cline.bot/customization/cline-rules
    riskNotes:
      - risk: riskPromptInjection
        note: >-
          Repository rules (.clinerules/, .cline/rules/, .cursorrules, .windsurfrules, AGENTS.md), files,
          fetch_web results and MCP output enter context with no vendor screening. Embrace The Red (2025-08)
          exfiltrated .env contents through a markdown image rendered in the chat after an indirect injection,
          unfixed at publication; Clinejection (2026-02) used the same class against Cline's own issue-triage bot
          and reached its publish tokens.
      - risk: riskRogueActions
        note: >-
          The CLI starts with --auto-approve true, "Execute safe commands" trusts the model's own
          requires_approval flag (CVE-2026-52024 bypassed it, and CVE-2026-52025 ran an OS command from a URL
          tile without the dialog), and an Enterprise administrator can withdraw only YOLO, not the per-category
          auto-approve toggles.
      - risk: riskToolSourceProvenance
        note: >-
          The harness itself arrives from npm, the VS Code Marketplace, Open VSX and the JetBrains Marketplace: a
          leaked npm token published cline@2.3.0 with a postinstall that installed openclaw globally
          (GHSA-9ppg-jx86-fqw7). CLI plugins install from any npm package, git repository or HTTPS file URL, and
          MCP servers commonly launch through npx, with no allowlist for either outside Enterprise MCP policy.
      - risk: riskToolRegistryTampering
        note: >-
          MCP server definitions and workspace hooks are plain files the developer, the agent or a cloned
          repository can change; the dashboard WebSocket flaw (CVE-2026-59723) let any web page add a stdio MCP
          server to the settings file. Enterprise remoteMCPServers with blockPersonalRemoteMCPServers and
          mcpMarketplaceEnabled false is the only organisation-held server list.
      - risk: riskSensitiveDataDisclosure
        note: >-
          Provider keys sit in ~/.cline/data/settings/providers.json and MCP tokens in the MCP settings file.
          Prompt Storage copies every file the agent read and every command output into the organisation's
          bucket, so that bucket needs source-code-level access control.
      - risk: riskRunawayAgentToolLoops
        note: >-
          The extension has no turn or spend cap and the CLI's --timeout defaults to 0; hub-hosted sessions and
          scheduled agents keep running with no client attached.
    controls:
      - mitigation: cap-agent-action-policy-enforcement
        coverage: partial
        mechanism: >-
          The per-category Auto Approve toggles, PreToolUse hook scripts that cancel a call (the CLI reference's
          stated replacement for a command allow / deny list), and the Enterprise remote-config yoloModeAllowed
          false; remote steering admitted by cline connect --allowed-user-id or --hook-command
        steps:
          - title: Forbid YOLO mode organisation-wide
            body:
              - >-
                In the app.cline.bot remote configuration set yoloModeAllowed to false (Cline Enterprise); the YOLO
                toggle is disabled for every signed-in member and cannot be re-enabled in local settings.
            url: https://docs.cline.bot/enterprise-solutions/configuration/infrastructure-configuration/control-other-cline-features/yolo-mode
          - title: Add a blocking PreToolUse hook
            body:
              - >-
                Install an executable PreToolUse script in ~/Documents/Cline/Hooks (extension) or ~/.cline/hooks
                (CLI) and check Enable Hooks; returning {"cancel": true, "errorMessage": "..."} stops the tool call
                before it runs.
            url: https://docs.cline.bot/customization/clineignore
          - title: Gate remote steering messages
            body:
              - >-
                Start chat connectors only with --allowed-user-id (Telegram) or a --hook-command script that
                returns {"action": "deny"} for every sender but the owner; without either, every message is run.
            url: https://docs.cline.bot/cli/connectors
        note: >-
          Partial on the tier rule: Cline has no built-in rule language over tool arguments, and nothing
          deterministic can be delivered where the developer cannot change it. CLINE_COMMAND_PERMISSIONS, the
          shell-command glob policy cited here before, is no longer documented — the CLI reference now says the
          CLI has no allow or deny list for shell commands and names a PreToolUse hook as the way to block them
          (re-checked 2026-10-30). Auto Approve is per-category user settings; hooks are user or workspace files
          behind a user toggle, and a repository can ship its own in .clinerules/hooks. The Enterprise remote
          configuration, applied to members signed in to the organisation in the VS Code and JetBrains extensions,
          carries yoloModeAllowed and MCP server policy but no per-tool or per-argument rules, and its support table
          currently lists Allow YOLO mode as supported in no product. File edits, MCP tools and fetches have no rule
          language beyond approve or auto-approve. Remote instructions: connectors admit
          what --allowed-user-id or --hook-command allows and everything by default; the Kanban port admits any
          local client; ACP takes instructions over stdio from the editor that launched it.
        verified: "2026-10-30"
      - mitigation: cap-sensitive-data-redaction
        coverage: partial
        mechanism: >-
          PreToolUse hook scripts that can cancel a tool call whose arguments carry a secret (an attach point at
          user or workspace level); CLI and SDK plugin hooks.beforeModel for request mutation; the Enterprise
          remote-config provider base URL to send inference through an inspecting AI gateway
        steps:
          - title: Route inference through the organisation's gateway
            body:
              - >-
                In app.cline.bot under Settings → Cline Settings enable settings, choose LiteLLM (or OpenAI
                Compatible) as the API Provider and set its Base URL to the AI gateway that runs DLP; signed-in
                members cannot select another provider.
            url: https://docs.cline.bot/enterprise-solutions/configuration/remote-configuration/litellm/admin-configuration
          - title: Block tool calls that carry secrets
            body:
              - >-
                Deploy a PreToolUse hook (extension: ~/Documents/Cline/Hooks/PreToolUse; CLI: ~/.cline/hooks) that
                passes the tool name and parameters to the organisation's detector and returns cancel true on a hit,
                then check Enable Hooks.
            url: https://docs.cline.bot/customization/clineignore
        note: >-
          Partial by the rule applied to every vendor: Cline ships no detector, but its hooks can block a tool call
          on an organisation-written check, and the provider base URL hands the inference path to a gateway that
          can inspect and mask. In the extension the documented blocking hook sees tool arguments before execution,
          not prompts or responses, and a cancel stops the whole task rather than masking the span; hooks are user
          or workspace files behind a user toggle. CLI and SDK plugins add hooks.beforeModel, which can rewrite the
          request, but plugins do not run in the VS Code or JetBrains extension. .clineignore is minimisation and is
          being deprecated — the vendor says it is not an access-control boundary. The base URL holds only for
          members signed in under remote configuration.
        verified: "2026-09-25"
      - mitigation: AML.M0036
        coverage: partial
        mechanism: >-
          CLI -t / --timeout <seconds> (default 0, no timeout) and --retries <count> (consecutive mistakes before
          halting, default 3) per run; no token, turn or cost budget; token and cost counts observable in the OpenTelemetry
          task.tokens event
        steps:
          - title: Bound unattended CLI runs
            body:
              - >-
                Launch CLI runs from the organisation's wrapper or scheduled-job definition with --timeout and
                --retries so a looping run halts on time or repeated failure.
            url: https://docs.cline.bot/cli/cli-reference
          - title: Put the spend ceiling in the gateway
            body:
              - >-
                Pin the organisation's provider to LiteLLM (Base URL of your proxy) in remote configuration and set
                the per-key budgets in the proxy, since Cline itself enforces none.
            url: https://docs.cline.bot/enterprise-solutions/configuration/remote-configuration/litellm/admin-configuration
        note: >-
          Partial: one kind of limit on one surface — the CLI's wall-clock timeout and mistake count, set per
          invocation by whoever launches it. The IDE extension documents no request, turn or spend cap, and neither
          surface has a token or cost budget or a stop for subagents, hub sessions and scheduled runs. Cline
          Enterprise reports usage and cost (task.tokens, the organisation metrics endpoints) but sets no limit. The
          ceiling is the gateway's budget behind the remote-config base URL, or the provider invoice.
        verified: "2026-09-25"
      - mitigation: AML.M0028
        coverage: partial
        mechanism: >-
          Auto Approve toggles split by scope (Read / Edit project files versus all files, Execute safe versus all
          commands, Use the browser, Use MCP servers), Plan mode (no edits or commands), per-server MCP autoApprove
          and disabled, and the Enterprise MCP policy (mcpMarketplaceEnabled, allowedMCPServers,
          blockPersonalRemoteMCPServers)
        steps:
          - title: Keep auto-approval inside the working tree
            body:
              - >-
                In Cline Settings → Auto Approve leave Read all files, Edit all files, Execute all commands, Use the
                browser and Use MCP servers off, so anything outside the workspace or beyond reads needs a click.
            url: https://docs.cline.bot/features/auto-approve
          - title: Limit the MCP tool set organisation-wide
            body:
              - >-
                In remote configuration set allowedMCPServers to the approved server ids and
                blockPersonalRemoteMCPServers to true (Cline Enterprise).
            url: https://docs.cline.bot/enterprise-solutions/configuration/infrastructure-configuration/control-other-cline-features/mcp-server-controls
        note: >-
          Partial on the tier rule: the workspace boundary is real but governs auto-approval, not access — a call
          outside the working tree still runs once the developer approves it — and every toggle is a user setting
          the organisation cannot lock (remote configuration reaches only YOLO and MCP servers). The extension has
          no per-tool deny that removes a built-in tool; toolPolicies enabled false exists only in the SDK. The
          decision is made by the harness outside the model, but every grant is the developer's own OS authority,
          and the CLI starts with --auto-approve true.
        verified: "2026-09-25"
      - mitigation: D3-EI
        coverage: external
        mechanism: >-
          None in product: commands run in the editor's terminal or the CLI's shell as the user; CLINE_SANDBOX and
          --data-dir isolate only Cline's state directory; Kanban's git worktrees separate working copies, not
          processes. Credential paths: nothing keeps credentials out of reach — reads outside the workspace need an
          approval unless Read all files is on, and a PreToolUse guard hook can refuse file and shell tool calls whose
          arguments match listed paths; a dev container or secretless credential broker is the boundary
        evidence:
          - title: CLI reference (CLINE_SANDBOX, CLINE_SANDBOX_DATA_DIR)
            url: https://docs.cline.bot/cli/cli-reference
          - title: CLI source — configureSandboxEnvironment redirects data directories only
            url: https://github.com/cline/cline/blob/main/apps/cli/src/utils/helpers.ts
          - title: Tools reference (bash, editor, fetch_web built-ins)
            url: https://docs.cline.bot/tools-reference/all-cline-tools
          - title: .clineignore and the PreToolUse guard hook
            url: https://docs.cline.bot/customization/clineignore
          - title: Deprecations (.clineignore is not an access-control boundary)
            url: https://docs.cline.bot/resources/deprecations
          - title: Auto Approve (Read all files)
            url: https://docs.cline.bot/features/auto-approve
        note: >-
          External: Cline has no OS or container sandbox the organisation could require. CLINE_SANDBOX ("Enable
          sandbox mode" in the CLI reference) points Cline's data directory at $CLINE_SANDBOX_DATA_DIR or
          /tmp/cline-sandbox — state isolation, not execution isolation — and Kanban worktrees separate branches, not
          processes. Isolation comes from a VM or dev container the organisation supplies: run the extension in a VS
          Code Dev Container or remote workspace, or the CLI inside a container. Shell commands, stdio MCP servers,
          hooks and plugins otherwise run with the developer's full authority. Credential paths: Cline has no sandbox
          and no environment scrub, so an approved command reads ~/.ssh, ~/.aws, the git credential helper, cloud CLI
          configuration and browser profiles as the developer. Credited contributions: the approval gate for reads
          outside the workspace, and the vendor's PreToolUse_ClineignoreGuard.sh, which cancels read_files, editor,
          apply_patch and shell calls whose path arguments match .clineignore patterns — a pattern match on arguments
          that a command reaching the file indirectly passes, living in user or workspace files behind a user toggle.
          MCP servers receive tokens from their env and headers entries; organisation headers in remoteMCPServers go
          only to that server's URL. Keep credentials outside the agent's filesystem with a dev container or a
          credential broker.
        verified: "2026-09-25"
      - mitigation: AML.M0031
        coverage: partial
        mechanism: >-
          Per-rule and per-skill toggles, Enterprise remote-config globalRules / globalSkills with alwaysEnabled
          (source schema), Checkpoints (a shadow-Git snapshot after every tool use), edit approval for writes to rule
          and memory-bank files, and the Enable Hooks switch that keeps workspace hooks from running
        steps:
          - title: Keep workspace hooks from running
            body:
              - >-
                Leave Enable Hooks unchecked in Cline's feature settings unless the organisation supplies the hooks;
                when checked, scripts in the repository's .clinerules/hooks run as code.
            url: https://docs.cline.bot/customization/clineignore
          - title: Review repository rules before they load
            body:
              - >-
                In the Rules panel toggle off workspace rules (.clinerules/, .cline/rules/, .cursorrules,
                .windsurfrules, AGENTS.md) that did not come from a trusted author.
            url: https://docs.cline.bot/customization/cline-rules
          - title: Keep writes gated and revertible
            body:
              - >-
                Leave Enable Checkpoints on (the default) and Edit project files off in Auto Approve, so every write
                to a rule or memory-bank file is approved and can be restored.
            url: https://docs.cline.bot/core-workflows/checkpoints
          - title: Push always-on organisation rules
            body:
              - >-
                On Cline Enterprise add globalRules entries with alwaysEnabled true to the remote configuration; the
                schema says members cannot turn them off (the field is in the source, not yet in the docs).
            url: https://github.com/cline/cline/blob/main/apps/vscode/src/shared/remote-config/schema.ts
        note: >-
          Partial: the agent's writes to memory and rule files are gated by edit approval and revertible through
          checkpoints, and an Enterprise organisation can add always-on rules, but no instruction source can be
          locked out. Cline auto-loads repository rules and global ones, workspace rules win over global rules on
          conflict, and each is only a user toggle; the docs describe no trust prompt for a newly opened repository.
          Memory Bank is a convention written into a rules file, not a product memory store, so there is nothing to
          switch off beyond that rule. Workspace hooks execute once the developer enables hooks. Checkpoints are
          local snapshots, not integrity protection, and auto-approved edits skip the gate.
        verified: "2026-09-25"
      - mitigation: cap-input-guardrails
        coverage: partial
        mechanism: >-
          Extension hook scripts (PreToolUse, PostToolUse, UserPromptSubmit and task events) returning cancel, and
          CLI / SDK plugin hooks.beforeModel, as attach points for an organisation classifier; no vendor injection
          screening
        steps:
          - title: Enable hooks and install the organisation's scripts
            body:
              - >-
                Place the organisation's hook scripts in ~/Documents/Cline/Hooks (extension, named exactly after the
                event, executable) or ~/.cline/hooks (CLI) and check Enable Hooks in Cline's feature settings.
            url: https://docs.cline.bot/customization/clineignore
          - title: Screen tool results in PostToolUse
            body:
              - >-
                Have the PostToolUse script send the tool result to the injection classifier and return {"cancel":
                true, "errorMessage": "..."} on a hit, which aborts the task before the model continues.
            url: https://github.com/cline/cline/blob/main/apps/vscode/src/core/hooks/templates.ts
        note: >-
          Partial by the rule applied to every vendor: Cline does no injection screening of its own, and hooks are
          attach points the organisation must fill. A cancel aborts the task rather than stripping the flagged block,
          contextModification only adds text, and the hooks are user or workspace files behind a user toggle; the
          PostToolUse and UserPromptSubmit event names come from the extension source, as the docs now document only
          PreToolUse. No documented hook covers rule files or MCP tool descriptions. CLI and SDK plugins add
          hooks.beforeModel, which can rewrite the request before inference. Beyond that, screening belongs to the AI
          gateway behind the remote-config base URL.
        verified: "2026-09-25"
      - mitigation: D3-CH
        coverage: partial
        mechanism: >-
          Provider credentials in ~/.cline/data/settings/providers.json; short-lived options through a Bedrock AWS
          CLI profile (SSO), Vertex application default credentials, Azure identity authentication (azureIdentity)
          and the Cline provider's OAuth sign-in; Enterprise remote configuration pins the provider so members cannot
          choose another
        steps:
          - title: Pin the organisation's provider
            body:
              - >-
                In app.cline.bot remote configuration select the provider (LiteLLM, OpenAI Compatible, Bedrock,
                Vertex or Anthropic) and its base URL; signed-in members cannot select other providers or switch to
                personal Cline accounts.
            url: https://docs.cline.bot/enterprise-solutions/configuration/remote-configuration/litellm/admin-configuration
          - title: Use short-lived cloud credentials
            body:
              - >-
                For Bedrock have members select the AWS Profile option with an SSO profile (aws sso login --profile
                <name>) instead of an API key or IAM access keys.
            url: https://docs.cline.bot/provider-config/aws-bedrock/cli-profile
        note: >-
          Partial: short-lived paths exist and an Enterprise organisation can pin the provider, but storage is not
          hardened and a pasted key cannot be forbidden. The Config page places API keys in
          ~/.cline/data/settings/providers.json with no keychain or encryption documented (the LiteLLM member page
          says keys are "stored locally in VS Code"); the CLI also takes -k / --key and ACP CLINE_API_KEY. Under
          remote configuration members still supply their own credential for Anthropic, OpenAI-compatible and keyed
          LiteLLM providers, and a LiteLLM Master Key set in the console is one long-lived key used by every member's
          client. MCP tokens sit in plain env and headers entries. The drawing's control — the key vaulted in the
          gateway, the developer holding a short-lived gateway token — is external, reached through the
          remote-config base URL.
        verified: "2026-09-25"
      - mitigation: cap-mcp-tool-integrity
        coverage: partial
        mechanism: >-
          Enterprise remote configuration mcpMarketplaceEnabled false (all locally configured servers blocked),
          allowedMCPServers (local servers admitted by id), remoteMCPServers pushed by URL with alwaysEnabled, and
          blockPersonalRemoteMCPServers; no version or hash pinning; the CLI self-updates at startup unless
          CLINE_NO_AUTO_UPDATE=1
        steps:
          - title: Admit only organisation-defined servers
            body:
              - >-
                On Cline Enterprise set mcpMarketplaceEnabled false, list the approved servers in remoteMCPServers
                (name, url, headers, alwaysEnabled) and set blockPersonalRemoteMCPServers true.
            url: https://docs.cline.bot/enterprise-solutions/configuration/infrastructure-configuration/control-other-cline-features/mcp-server-controls
          - title: Stop the CLI updating itself
            body:
              - >-
                Set CLINE_NO_AUTO_UPDATE=1 in the CLI's environment so the startup check installs nothing, and
                install pinned versions from the organisation's package mirror.
            url: https://github.com/cline/cline/blob/main/apps/cli/src/commands/update.ts
        note: >-
          Partial by the rule applied to every vendor: the organisation can admit servers, but nothing pins what they
          serve. allowedMCPServers matches the server name in the member's own mcpServers entry, so the command
          behind an approved name is the developer's (the schema comment calls the id the server's GitHub URL, the
          docs page the local name); remote servers are admitted by URL with no version or hash, and nothing scans
          tool descriptions or re-approves a changed tool list. Harness integrity: the extension updates through the
          Marketplace or Open VSX under the editor's own auto-update and allowed-extensions policy, not a Cline key;
          the CLI installs updates at startup unless CLINE_NO_AUTO_UPDATE=1 (source only). The compromised
          cline@2.3.0 npm release went out through that channel; releases now carry npm OIDC provenance.
        verified: "2026-09-25"
      - mitigation: AML.M0029
        coverage: partial
        mechanism: >-
          Approval prompts on every file edit and command in the IDE extension by default, the Auto Approve toggles,
          and the Enterprise remote-config yoloModeAllowed false; the CLI starts with --auto-approve true, ACP with
          approval on
        steps:
          - title: Forbid YOLO mode
            body:
              - >-
                Set yoloModeAllowed to false in the app.cline.bot remote configuration (Cline Enterprise).
            url: https://docs.cline.bot/enterprise-solutions/configuration/infrastructure-configuration/control-other-cline-features/yolo-mode
          - title: Keep writes and commands on approval
            body:
              - >-
                Leave Edit project files, Execute safe commands and Execute all commands off in Cline Settings →
                Auto Approve, so each edit and command shows its diff or command line for approval.
            url: https://docs.cline.bot/features/auto-approve
          - title: Turn CLI auto-approval off
            body:
              - >-
                Launch the CLI with --auto-approve false (it defaults to true) from the organisation's wrapper, and
                leave the Auto-approve tools toggle off in ACP clients.
            url: https://docs.cline.bot/cli/cli-reference
        note: >-
          Partial on the tier rule: a present developer approves each edit and command with its current arguments in
          the extension, but the organisation can remove only YOLO. The per-category toggles — Edit all files and
          Execute all commands together approximate YOLO — stay user settings, and Execute safe commands lets the
          model's own requires_approval flag decide (CVE-2026-52024 bypassed it). The CLI auto-approves by default
          and, per the remote-configuration support table, honours no remote setting but rules and workflows; scheduled runs, connectors (the /yolo command)
          and Kanban tasks run with whatever approval the launcher set. Approval is per call with no expiry or
          identity binding; checkpoints revert, they do not approve.
        verified: "2026-09-25"
      - mitigation: cap-agent-tool-registry
        coverage: partial
        mechanism: >-
          Enterprise remote configuration held at app.cline.bot: remoteMCPServers (organisation-pushed servers,
          alwaysEnabled), allowedMCPServers (also filters the MCP marketplace), blockPersonalRemoteMCPServers and
          mcpMarketplaceEnabled
        steps:
          - title: Publish the approved server set
            body:
              - >-
                List the organisation's servers in remoteMCPServers with alwaysEnabled where they must stay on, and
                set blockPersonalRemoteMCPServers true so no other remote server can be added.
            url: https://docs.cline.bot/enterprise-solutions/configuration/infrastructure-configuration/control-other-cline-features/mcp-server-controls
          - title: Restrict local servers and the marketplace
            body:
              - >-
                Set allowedMCPServers to the approved ids; unlisted local servers are blocked and unlisted
                marketplace entries are hidden.
            url: https://docs.cline.bot/enterprise-solutions/configuration/infrastructure-configuration/control-other-cline-features/mcp-server-controls
        note: >-
          Partial by the rule: the list is held in the vendor console and enforced by the client for signed-in
          members, not in the config file it governs, but it carries no owner, version or approval record, admits
          local servers by name, and covers neither CLI plugins, hooks and skills nor the agent installs themselves
          (the member list is the only inventory, and only of members who sign in). Nothing reconciles discovered
          servers against it.
        verified: "2026-09-25"
      - mitigation: cap-agent-tracing
        coverage: partial
        mechanism: >-
          Enterprise remote-config OpenTelemetry export (openTelemetryEnabled, OTLP endpoint, protocol, headers;
          events such as task.tool_used with auto_approved, task.mcp_tool_called, task.terminal_execution,
          hooks.execution and task.yolo_mode_toggled) and Prompt Storage (enterpriseTelemetry.promptUploading)
          syncing each task's api_conversation_history.json to the organisation's S3 or R2 bucket; CLINE_OTEL_*
          environment variables override the OpenTelemetry settings
        steps:
          - title: Turn on OpenTelemetry from the dashboard
            body:
              - >-
                In app.cline.bot organisation settings enable OpenTelemetry with the collector's OTLP endpoint,
                protocol and authentication headers, and enable logs as well as metrics.
            url: https://docs.cline.bot/enterprise-solutions/monitoring/opentelemetry
          - title: Upload full task transcripts
            body:
              - >-
                Under Settings → Enterprise Telemetry enable Prompt Uploading to an S3 or R2 bucket (intervalMs,
                batchSize, backfillEnabled) so each task's conversation, with tool inputs and outputs, reaches the
                organisation's store.
            url: https://docs.cline.bot/enterprise-solutions/monitoring/prompt-storage
        note: >-
          Partial on the same rule as Gemini CLI: the export is admin-configured, but the OpenTelemetry override page
          says environment variables take priority over remote configuration, so a developer can repoint or disable
          it (CLINE_OTEL_TELEMETRY_ENABLED, CLINE_OTEL_EXPORTER_OTLP_ENDPOINT). OTel events carry tool name, success
          and auto_approved but no arguments (terminal commands only as a hash). Prompt Storage carries the full
          content with no documented user opt-out, but it syncs from the local task file every 30 seconds, evicts
          beyond maxQueueSize and drops failed items after seven days, and the page describes only the extension's
          storage path. Both apply only to members signed in under remote configuration. Capture only: tamper
          resistance belongs to the collector and the bucket.
        verified: "2026-09-25"
      - mitigation: cap-shadow-ai-discovery
        coverage: external
        mechanism: >-
          None in product; EDR / MDM software inventory and SSE / CASB find installs and personal-account use
        evidence:
          - title: Installing Cline (Marketplace, Open VSX, JetBrains, npm, npx kanban)
            url: https://docs.cline.bot/getting-started/installing-cline
          - title: Managing members (verified domains, member list)
            url: https://docs.cline.bot/enterprise-solutions/team-management/managing-members
          - title: Hub-spoke architecture (hub on 127.0.0.1:25463)
            url: https://docs.cline.bot/sdk/architecture/hub-spoke
        note: >-
          External: Cline offers no discovery of unmanaged use; Enterprise lists only its own members, and
          verified-domain joining governs who may join, not who runs Cline outside the organisation. Inventory
          points: the extension id saoudrizwan.claude-dev (VS Code, Cursor, Windsurf, VSCodium via Open VSX), the
          JetBrains plugin 28247, the npm packages cline and kanban (also run through npx kanban), the ~/.cline
          directory, and listeners on 127.0.0.1:25463 and 3484. On the network, api.cline.bot and app.cline.bot mark
          the Cline provider and account; bring-your-own-key installs call the provider directly.
        verified: "2026-09-25"
      - mitigation: D3-PA
        coverage: external
        mechanism: >-
          EDR on the endpoint; Cline analyses no process behaviour
        evidence:
          - title: Hub-spoke architecture (hub daemon, spoke workers, log path)
            url: https://docs.cline.bot/sdk/architecture/hub-spoke
          - title: OpenTelemetry events reference (task.terminal_execution)
            url: https://docs.cline.bot/enterprise-solutions/monitoring/opentelemetry-events
          - title: Kanban remote access (port 3484)
            url: https://docs.cline.bot/kanban/remote-access
        note: >-
          External (EDR): integration points are the editor's extension host and the terminals it opens for
          commands, the CLI's node process with its hub daemon (cline hub; 127.0.0.1:25463,
          ~/.cline/logs/hub-daemon.log) and spoke workers, the Kanban server on 127.0.0.1:3484, connector webhook
          listeners (--port), stdio MCP servers spawned through npx or uv, and hook scripts. OTel
          task.terminal_execution carries only a command hash, so correlate on time and task_id; a PreToolUse hook
          can call a local EDR agent and cancel on its verdict, an attach point the user can disable. Detections from
          the advisories: browser-origin WebSocket connections to the Kanban and dashboard ports (CVE-2026-44211,
          CVE-2026-59723) and an install script that installs another global package (cline@2.3.0).
        verified: "2026-09-25"
      - mitigation: cap-agent-kill-switch
        coverage: partial
        mechanism: >-
          Remove from Organization in app.cline.bot Members (or deprovisioning in the IdP) and remote-config changes
          that apply to connected clients (mcpMarketplaceEnabled false, blockPersonalRemoteMCPServers,
          yoloModeAllowed false); on the device, cline hub stop, cline connect --stop and the connector /abort
        steps:
          - title: Remove the member
            body:
              - >-
                In app.cline.bot open Members, choose Remove from Organization; the user loses access to the
                organisation immediately, and removal in the IdP revokes access at the next sign-in attempt.
            url: https://docs.cline.bot/enterprise-solutions/team-management/managing-members
          - title: Switch MCP off organisation-wide
            body:
              - >-
                Set mcpMarketplaceEnabled false and blockPersonalRemoteMCPServers true, and remove remoteMCPServers
                entries; the page says these take effect immediately for all team members.
            url: https://docs.cline.bot/enterprise-solutions/configuration/infrastructure-configuration/control-other-cline-features/mcp-server-controls
        note: >-
          Partial: an Enterprise administrator can revoke organisation access and cut MCP for connected clients, but
          nothing documented stops a running local session. Removal withdraws organisation resources (the Cline
          provider, remote configuration); a session on the developer's own provider key keeps working, and whether a
          running task on the organisation's provider stops is not documented (delay not documented). Background work
          outlives the editor: hub sessions keep executing when a client disconnects and scheduled agents run with no
          client attached, so the stop is cline hub stop or cline connect --stop on the device, an EDR process kill,
          and revocation of the brokered credential at the gateway.
        verified: "2026-09-25"
      - mitigation: cap-agent-egress-control
        coverage: external
        mechanism: >-
          None in product: no domain allowlist or network sandbox; the extension follows the editor's proxy settings
          (VS Code proxy, JetBrains HTTP Proxy) and the CLI honours https_proxy / http_proxy and NODE_EXTRA_CA_CERTS
        evidence:
          - title: Networking and proxies
            url: https://docs.cline.bot/troubleshooting/networking-and-proxies
          - title: Tools reference (bash, fetch_web)
            url: https://docs.cline.bot/tools-reference/all-cline-tools
        note: >-
          External: Cline cannot restrict where its tools connect. Proxy settings route Cline's own provider traffic
          but enforce nothing — shell commands, stdio MCP servers, the browser tool and fetch_web reach whatever the
          host network allows, and the CLI supports only plain HTTP proxies (no PAC or SOCKS). There is not even a
          documented on/off for the network tools — Use the browser in Auto Approve decides approval, not
          availability, and a "Cline web tools" setting appears only as a telemetry event. The remote-config
          provider base URL fixes where inference goes, not where tools go. The endpoint egress allowlist enforced by
          device management or an SSE agent is the control: admit the AI gateway, the package mirror and the named
          services an approved server calls.
        verified: "2026-09-25"
      - mitigation: D3-FA
        coverage: external
        mechanism: >-
          Package mirror or artifact repository with malware scanning; Cline scans nothing it installs
        evidence:
          - title: Plugins (install from npm, git, HTTPS file URL or local path)
            url: https://docs.cline.bot/customization/plugins
          - title: MCP overview (stdio servers by command)
            url: https://docs.cline.bot/mcp/mcp-overview
          - title: MCP server controls (mcpMarketplaceEnabled, remoteMCPServers)
            url: https://docs.cline.bot/enterprise-solutions/configuration/infrastructure-configuration/control-other-cline-features/mcp-server-controls
        note: >-
          External: Cline does no file analysis on anything it installs — marketplace MCP servers and npx / uvx
          server commands, CLI plugins from npm, git or any HTTPS file URL (the installer runs npm install for their
          dependencies), skills and hooks copied into ~/.cline or the repository, or packages its commands fetch.
          Integration points for the mirror: the npm and pip registry configuration the shell inherits,
          mcpMarketplaceEnabled false with remoteMCPServers pointing at organisation-hosted servers, and the
          Marketplace or Open VSX source the editor may install the extension from. Model weights load only when a
          local runtime (Ollama, LM Studio) is chosen, and that runtime loads them.
        verified: "2026-09-25"
    # The security-relevant settings, each with the baseline value (data/tooling/BASELINE.md).
    # Organisation policy is Cline Enterprise remote configuration, which only the VS Code and JetBrains
    # extensions fully apply (the CLI takes rules and workflows only); everything else is a per-device
    # extension setting, a CLI flag or a file the developer controls. Verified 2026-10-30.
    settings:
      - id: sso
        name: SSO
        where: WorkOS dashboard › AuthKit › Connections › Add Connection
        setVia: [identityProvider, adminConsole]
        area: identity
        recommended: The corporate IdP connected, with MFA enforced on the Cline app in the IdP
        why: Members reach the organisation only through the IdP and its MFA, and only verified-domain addresses can join.
        mitigations: []
        requires: Enterprise
        url: https://docs.cline.bot/enterprise-solutions/sso-setup
        verified: "2026-10-30"
      - id: jitProvisioning
        name: just-in-time provisioning
        where: IdP assignment of the Cline app (through WorkOS); roles mapped from the IdP
        setVia: [identityProvider]
        area: identity
        default: On (the only mode documented)
        recommended: Access granted by one IdP group; leavers removed there
        why: Removal in the IdP revokes Cline at the next sign-in and Members › Remove from Organization does it at once; a session on a personal provider key keeps running either way.
        mitigations: [cap-agent-kill-switch]
        requires: Enterprise
        url: https://docs.cline.bot/enterprise-solutions/onboarding
        verified: "2026-10-30"
      - id: memberRoles
        name: Member, Admin and Owner roles
        where: app.cline.bot › Members › role dropdown
        setVia: [adminConsole, identityProvider]
        area: identity
        recommended: Member for everyone; Admin for the few who run remote configuration; Owner for one or two
        why: Admins and Owners can choose Opt out of remote config on the Account page, so the role is also the way out of every organisation policy.
        mitigations: []
        requires: Enterprise
        url: https://docs.cline.bot/enterprise-solutions/team-management/managing-members
        verified: "2026-10-30"
      - id: apiProvider
        name: API Provider
        where: app.cline.bot › Settings › Cline Settings › Enable settings › API Provider (with its Base URL)
        setVia: [adminConsole]
        area: data
        default: Enable settings off (members choose any provider)
        recommended: LiteLLM or OpenAI Compatible, Base URL set to the organisation's AI gateway
        why: In the VS Code and JetBrains extensions members can't pick another provider or a personal account, so prompts and code reach only the gateway's DLP, screening and budgets; the CLI and Cline Desktop don't enforce it.
        mitigations: [D3-CH, cap-sensitive-data-redaction, cap-input-guardrails, AML.M0036]
        requires: Enterprise
        url: https://docs.cline.bot/enterprise-solutions/configuration/remote-configuration/litellm/admin-configuration
        verified: "2026-10-30"
      - id: litellmMasterKey
        name: Master Key
        where: app.cline.bot › Settings › Cline Settings › API Provider (LiteLLM) › Master Key
        setVia: [adminConsole]
        area: identity
        default: Unset (optional)
        recommended: Unset — each member authenticates to the gateway with their own key
        why: The master key is one long-lived credential with full proxy access used by every member's client; per-member keys keep attribution and can be revoked one at a time.
        mitigations: [D3-CH]
        requires: Enterprise
        url: https://docs.cline.bot/enterprise-solutions/configuration/remote-configuration/litellm/admin-configuration
        verified: "2026-10-30"
      - id: yoloModeAllowed
        name: yoloModeAllowed
        where: app.cline.bot remote configuration → yoloModeAllowed
        setVia: [adminConsole]
        area: tools
        default: Unset (members may turn YOLO Mode on)
        recommended: "false"
        why: Withdraws the one switch that auto-approves every edit, command and MCP call; the remote-configuration support table currently marks Allow YOLO mode unsupported in every product, so keep YOLO Mode off locally as well.
        mitigations: [AML.M0029, cap-agent-action-policy-enforcement]
        requires: Enterprise
        url: https://docs.cline.bot/enterprise-solutions/configuration/infrastructure-configuration/control-other-cline-features/yolo-mode
        verified: "2026-10-30"
      - id: yoloMode
        name: YOLO Mode
        where: Cline Settings › Features › YOLO Mode
        setVia: [configFile]
        area: tools
        default: "Off"
        recommended: "Off"
        why: YOLO approves file changes anywhere on the system, every terminal command, browser and MCP actions and Plan-to-Act switches with no prompt.
        mitigations: [AML.M0029]
        url: https://docs.cline.bot/features/auto-approve
        verified: "2026-10-30"
      - id: autoApproveEditProjectFiles
        name: Edit project files
        where: Cline Settings › Auto Approve › Edit project files
        setVia: [configFile]
        area: tools
        recommended: "Off"
        why: Each edit shows its diff for approval before it lands; a team that turns it on relies on checkpoints to revert.
        mitigations: [AML.M0029]
        url: https://docs.cline.bot/features/auto-approve
        verified: "2026-10-30"
      - id: autoApproveSafeCommands
        name: Execute safe commands
        where: Cline Settings › Auto Approve › Execute safe commands
        setVia: [configFile]
        area: tools
        recommended: "Off"
        why: What counts as safe is the model's own requires_approval flag, not an allowlist, and CVE-2026-52024 bypassed it.
        mitigations: [AML.M0029]
        url: https://docs.cline.bot/features/auto-approve
        verified: "2026-10-30"
      - id: autoApproveAllCommands
        name: Execute all commands
        where: Cline Settings › Auto Approve › Execute all commands
        setVia: [configFile]
        area: tools
        recommended: "Off"
        why: Runs commands the model itself flagged as needing approval, such as installs and deletions, without a prompt.
        mitigations: [AML.M0029, AML.M0028]
        url: https://docs.cline.bot/features/auto-approve
        verified: "2026-10-30"
      - id: autoApproveReadAllFiles
        name: Read all files
        where: Cline Settings › Auto Approve › Read all files
        setVia: [configFile]
        area: tools
        recommended: "Off"
        why: Reads outside the workspace — ~/.ssh, ~/.aws, other clients' repositories — keep needing a click.
        mitigations: [AML.M0028]
        url: https://docs.cline.bot/features/auto-approve
        verified: "2026-10-30"
      - id: autoApproveEditAllFiles
        name: Edit all files
        where: Cline Settings › Auto Approve › Edit all files
        setVia: [configFile]
        area: tools
        recommended: "Off"
        why: Writes outside the workspace, shell profiles and other repositories included, keep needing a click.
        mitigations: [AML.M0028]
        url: https://docs.cline.bot/features/auto-approve
        verified: "2026-10-30"
      - id: autoApproveMcp
        name: Use MCP servers
        where: Cline Settings › Auto Approve › Use MCP servers
        setVia: [configFile]
        area: tools
        recommended: "Off"
        why: Each MCP tool call, including writes to the systems behind the server, shows its arguments for approval.
        mitigations: [AML.M0029]
        url: https://docs.cline.bot/features/auto-approve
        verified: "2026-10-30"
      - id: mcpMarketplaceEnabled
        name: mcpMarketplaceEnabled
        where: app.cline.bot remote configuration → mcpMarketplaceEnabled (Enable MCP Marketplace)
        setVia: [adminConsole]
        area: tools
        default: Unset (local servers allowed)
        recommended: Unset — restrict local servers with allowedMCPServers instead
        why: false blocks every locally configured server; the allowlist keeps vetted ones usable, and regulated teams set false and serve only organisation servers.
        mitigations: [cap-agent-tool-registry, cap-mcp-tool-integrity]
        requires: Enterprise
        url: https://docs.cline.bot/enterprise-solutions/configuration/infrastructure-configuration/control-other-cline-features/mcp-server-controls
        verified: "2026-10-30"
      - id: allowedMcpServers
        name: allowedMCPServers
        where: app.cline.bot remote configuration → allowedMCPServers
        setVia: [adminConsole]
        area: tools
        default: Unset (no local allowlist)
        recommended: The approved server ids
        why: Unlisted local servers are blocked and unlisted marketplace entries hidden; the id matches the member's own server name, so the command behind an approved name is still the member's.
        mitigations: [cap-agent-tool-registry, cap-mcp-tool-integrity, AML.M0028]
        requires: Enterprise
        url: https://docs.cline.bot/enterprise-solutions/configuration/infrastructure-configuration/control-other-cline-features/mcp-server-controls
        verified: "2026-10-30"
      - id: remoteMcpServers
        name: remoteMCPServers
        where: app.cline.bot remote configuration → remoteMCPServers (Organization MCP servers)
        setVia: [adminConsole]
        area: tools
        default: Unset
        recommended: The organisation's internal servers, alwaysEnabled where they must stay on, auth headers held centrally
        why: The organisation, not each developer, decides which remote endpoints Cline talks to and with what credential.
        mitigations: [cap-agent-tool-registry]
        requires: Enterprise
        url: https://docs.cline.bot/enterprise-solutions/configuration/infrastructure-configuration/control-other-cline-features/mcp-server-controls
        verified: "2026-10-30"
      - id: blockPersonalRemoteMcpServers
        name: blockPersonalRemoteMCPServers
        where: app.cline.bot remote configuration → blockPersonalRemoteMCPServers
        setVia: [adminConsole]
        area: tools
        default: Unset (members add their own remote servers)
        recommended: "true"
        why: Only the servers in remoteMCPServers are reachable, so no developer wires client code to an unvetted hosted server.
        mitigations: [cap-agent-tool-registry, cap-mcp-tool-integrity]
        requires: Enterprise
        url: https://docs.cline.bot/enterprise-solutions/configuration/infrastructure-configuration/control-other-cline-features/mcp-server-controls
        verified: "2026-10-30"
      - id: clineTelemetryOrg
        name: Cline Telemetry
        where: app.cline.bot remote configuration → telemetryEnabled
        setVia: [adminConsole]
        area: data
        default: Unset (telemetry on, each member's choice)
        recommended: "false"
        why: Usage and error events identifying the account and organisation stop going to Cline, and members can't turn them back on; the CLI and Cline Desktop ignore it.
        mitigations: []
        requires: Enterprise
        url: https://docs.cline.bot/enterprise-solutions/monitoring/telemetry
        verified: "2026-10-30"
      - id: telemetryOptOut
        name: telemetryOptOut
        where: ~/.cline/data/settings/global-settings.json → telemetryOptOut
        setVia: [configFile, mdm]
        area: data
        default: Unset (telemetry on)
        recommended: "true"
        why: One per-computer setting turns telemetry off for the CLI and Cline Desktop too, which ignore the organisation setting.
        mitigations: []
        url: https://docs.cline.bot/enterprise-solutions/monitoring/telemetry
        verified: "2026-10-30"
      - id: openTelemetry
        name: OpenTelemetry
        where: app.cline.bot › organization settings › OpenTelemetry (OTLP endpoint, protocol, headers; logs and metrics)
        setVia: [adminConsole]
        area: audit
        default: "Off"
        recommended: On, logs and metrics to the organisation's collector over TLS
        why: Task, tool and error events reach the SIEM for signed-in members; CLINE_OTEL_* environment variables still override it on a member's machine.
        mitigations: [cap-agent-tracing]
        requires: Enterprise
        url: https://docs.cline.bot/enterprise-solutions/monitoring/opentelemetry
        verified: "2026-10-30"
      - id: promptUploading
        name: Prompt Uploading
        where: app.cline.bot › Settings › Enterprise Telemetry › Prompt Uploading (enterpriseTelemetry.promptUploading)
        setVia: [adminConsole]
        area: audit
        default: "Off"
        recommended: "Off"
        why: It copies every task's full conversation, files read and command output included, to an S3 or R2 bucket; turn it on only where an audit duty needs transcripts, then gitignore .cline/remote-config, whose settings copy can hold the bucket keys.
        mitigations: [cap-agent-tracing]
        requires: Enterprise
        url: https://docs.cline.bot/enterprise-solutions/monitoring/prompt-storage
        verified: "2026-10-30"
      - id: enableHooks
        name: Enable Hooks
        where: Cline settings › Features › Enable Hooks
        setVia: [configFile]
        area: tools
        recommended: "Off"
        why: Once on, scripts in a cloned repository's .clinerules/hooks run as code; turn it on only with the organisation's own global PreToolUse guard, accepting that workspace hooks then run too.
        mitigations: [AML.M0031]
        url: https://docs.cline.bot/customization/clineignore
        verified: "2026-10-30"
      - id: enableCheckpoints
        name: Enable Checkpoints
        where: Cline settings › Feature Settings › Enable Checkpoints
        setVia: [configFile]
        area: tools
        default: "On"
        recommended: "On"
        why: Every agent write, to rules and memory-bank files included, can be rolled back from the shadow-Git snapshot.
        mitigations: [AML.M0031]
        url: https://docs.cline.bot/core-workflows/checkpoints
        verified: "2026-10-30"
      - id: cliAutoApprove
        name: --auto-approve
        where: cline CLI flag --auto-approve <boolean>
        setVia: [apiCli]
        area: tools
        default: "true (false in ACP mode)"
        recommended: false, set in the organisation's wrapper and job definitions
        why: The CLI otherwise approves every tool call, so a headless run gets no prompt at all.
        mitigations: [AML.M0029]
        url: https://docs.cline.bot/cli/cli-reference
        verified: "2026-10-30"
      - id: cliTimeout
        name: --timeout
        where: cline CLI flag -t, --timeout <seconds>
        setVia: [apiCli]
        area: tools
        default: 0 (no timeout)
        recommended: A ceiling on every unattended run, for example 3600
        why: A looping headless or scheduled run stops on time; the extension has no equivalent and the spend cap stays at the gateway.
        mitigations: [AML.M0036]
        url: https://docs.cline.bot/cli/cli-reference
        verified: "2026-10-30"
      - id: connectorAllowedUserId
        name: --allowed-user-id
        where: cline connect telegram --allowed-user-id (--hook-command for the other connectors)
        setVia: [apiCli]
        area: sharing
        default: Unset (every message is run)
        recommended: The owner's own user id, and no connector unless a team has a reason
        why: Without it or a --hook-command, anyone who can message the bot drives a Cline instance with the developer's authority.
        mitigations: [cap-agent-action-policy-enforcement]
        url: https://docs.cline.bot/cli/connectors
        verified: "2026-10-30"
      - id: kanbanHost
        name: --host
        where: kanban --host (or KANBAN_RUNTIME_HOST)
        setVia: [apiCli]
        area: sharing
        default: 127.0.0.1
        recommended: 127.0.0.1
        why: Kanban gives full access to the repository and terminal, so binding 0.0.0.0 hands both to the network (CVE-2026-44211 reached it from a browser even on loopback).
        mitigations: []
        url: https://docs.cline.bot/kanban/remote-access
        verified: "2026-10-30"
      - id: cliNoAutoUpdate
        name: CLINE_NO_AUTO_UPDATE
        where: environment variable CLINE_NO_AUTO_UPDATE (source only)
        setVia: [mdm]
        area: tools
        default: Unset (the CLI installs a new release at startup)
        recommended: 1, with the CLI installed at a fixed version from the organisation's mirror
        why: A compromised npm release, as cline@2.3.0 was, does not reach every developer at their next launch.
        mitigations: [cap-mcp-tool-integrity]
        url: https://raw.githubusercontent.com/cline/cline/main/apps/cli/src/commands/update.ts
        verified: "2026-10-30"
