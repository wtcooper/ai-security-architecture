  - architecture: archAgentFederation
    asOf: "2026-10"
    reference:
      - title: Single-agent AI system using ADK and Cloud Run — A2A security considerations
        url: https://docs.cloud.google.com/architecture/single-agent-ai-system-adk-cloud-run
      - title: Multi-tenant agentic AI system
        url: https://docs.cloud.google.com/architecture/multi-tenant-agentic-ai-system
      - title: ADK with Agent2Agent (A2A) Protocol
        url: https://adk.dev/a2a/
    summary:
      - >-
        Your ADK agent on Cloud Run speaking A2A both ways through Apigee: outbound it presents a
        Google-signed ID token to each peer platform and, where a vendor federates with Google,
        a SAML assertion for the user; inbound, peers are registered Apigee apps whose tokens,
        skills and quotas the gateway checks, with Model Armor screening every artifact in and
        de-identifying every payload out. Google's references name Agent Registry for admitted
        A2A agents and Agent Gateway for the crossing; Agent Gateway is Google-managed only for
        agents on Agent Runtime.
    bindings:
      - { block: idp, service: Cloud Identity (Google as IdP), note: "Custom SAML apps decide which groups' identity may travel to which vendor platform." }
      - { block: entry, service: Cloud Run front end with IAP }
      - { block: authServer, service: Apigee OAuth 2.0 token endpoints, note: "Issues our agent's tokens to registered peer apps; outbound, our agent's identity is a Google-signed ID token rather than a secret." }
      - { block: harness, service: Your A2A agent on Cloud Run (ADK), note: "ADK publishes the Agent Card and calls peers over A2A; Agent Runtime is the managed alternative." }
      - { block: localTools, service: ADK function tools }
      - { block: memory, service: Agent Platform Sessions }
      - { block: gateway, service: Apigee (A2A and model proxies), note: "Agent Gateway governs A2A natively for agents on Agent Runtime; early preview for Cloud Run." }
      - { block: internalTools, service: "Your MCP servers on Cloud Run, via Apigee" }
      - { block: orgData, service: Your systems of record, build: true }
      - { block: peerVendor, service: A vendor platform's agent, note: "Under an agreement and a SAML or OIDC federation with Cloud Identity." }
      - { block: provider, service: Gemini on Agent Platform }
      - { block: partner, service: A partner's A2A agent, note: "Agent identity only; no user federation." }
    settings:
      - serviceAccountIdTokens
      - workspaceSamlAppAccess
      - noTokenPassthrough
      - agentRegistry
      - modelArmorSanitizeApi
      - a2aSkillAuthorization
      - apigeeQuota
      - peerVendorAssessment
      - agentCardSignatures
      - sessionsTtl
      - adkCloudTrace
      - apigeeRevokeApp
