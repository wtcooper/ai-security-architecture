  - architecture: archSelfHostedInference
    asOf: "2026-11"
    verified: "2026-11-18"
    reference:
      - title: "AI gateway, for example LiteLLM Proxy: Production Best Practices"
        url: https://docs.litellm.ai/docs/proxy/prod
      - title: "Inference server, for example vLLM: Security"
        url: https://docs.vllm.ai/en/latest/usage/security.html
      - title: "AI gateway, for example LiteLLM Proxy: Outbound Requests and Offline Mode"
        url: https://docs.litellm.ai/docs/proxy/outbound_requests
    summary:
      - "Applications call a self-hosted AI gateway with a credential per team; it applies quotas, guardrails and logging, then calls an inference server on dedicated GPU nodes that only the gateway can reach. Weights come in from the public hub through a promotion step that pins the revision, scans, signs and records each release in the model registry and writes it to versioned storage; the serving pod starts offline and loads only promoted files, verified at load by a check you add. Data, prompts and weights stay in the data centre, and you carry what a cloud provider would otherwise run; each box lists example products."
    bindings:
      - { block: consumers, service: "Your applications and agents", build: true, note: "Each calls the gateway with its own credential. None holds the inference server's key or has a network path to the serving Service." }
      - block: gateway
        service: "Self-hosted AI gateway"
        options:
          - { name: "LiteLLM Proxy", kind: open, url: "https://docs.litellm.ai/docs/proxy/virtual_keys", note: "Virtual keys, budgets and routing; MIT licence, with JWT/OIDC sign-in in the paid Enterprise licence", packs: [upstreamOpenSource], watch: [{ text: "MIT licence; JWT or OIDC sign-in of callers needs a LiteLLM Enterprise licence.", url: "https://docs.litellm.ai/docs/proxy/virtual_keys" }, { text: "Needs PostgreSQL for keys, teams and spend, and Redis when more than one instance runs. Run LITELLM_OFFLINE_MODE=true.", url: "https://docs.litellm.ai/docs/proxy/deploy/helm" }, { text: "JWT or OIDC sign-in of callers, the built-in HashiCorp Vault secret manager, key regeneration and scheduled rotation, allowed_routes and audit logs need an Enterprise licence; the open-source build uses virtual keys, secrets synced from your vault and path rules at the ingress instead.", url: "https://docs.litellm.ai/docs/proxy/token_auth" }] }
          - { name: "Agent Router (formerly Envoy AI Gateway)", kind: open, url: "https://aigateway.envoyproxy.io/docs/", note: "Envoy and Gateway API based; renamed on moving to the Agentic AI Foundation, same code and maintainers" }
          - { name: "Red Hat OpenShift AI Models-as-a-Service", kind: commercial, url: "https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/3.5/pdf/govern_llm_access_with_models-as-a-service/Red_Hat_OpenShift_AI_Self-Managed-3.5-Govern_LLM_access_with_Models-as-a-Service-en-US.pdf", note: "Subscriptions, token limits and API keys on Connectivity Link (Kuadrant, Authorino); llm-d models GA", packs: [redHatOpenShiftAi], watch: [{ text: "GA for llm-d models since 3.4; vLLM-runtime models, external models and multi-tenancy are Technology Preview.", url: "https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/3.5/pdf/govern_llm_access_with_models-as-a-service/Red_Hat_OpenShift_AI_Self-Managed-3.5-Govern_LLM_access_with_Models-as-a-Service-en-US.pdf" }] }
          - { name: "Kong AI Gateway", kind: commercial, url: "https://developer.konghq.com/ai-gateway/", note: "Kong Gateway with AI routing and policies; Konnect-managed control plane or an on-prem install", packs: [kongAiGateway] }
          - { name: "VMware Private AI Services ML API gateway", kind: commercial, url: "https://techdocs.broadcom.com/us/en/vmware-cis/vcf/vcf-9-0-and-later/9-1/design/design-library/private-ai-platform-detailed-design/private-ai-services.html", note: "Built into VCF Private AI Services; OIDC or VCF Automation sign-in", packs: [vmwarePrivateAi], watch: [{ text: "Validates every request against OIDC, VCF Automation or local auth; local auth is for evaluation only.", url: "https://techdocs.broadcom.com/us/en/vmware-cis/vcf/vcf-9-0-and-later/9-1/design/design-library/private-ai-platform-detailed-design/private-ai-services.html" }] }
          - { name: "NeMo Helix Inference Gateway", kind: open, url: "https://docs.nvidia.com/nemo-helix/latest/documentation/models-and-inference/virtual-models", note: "Virtual models with guardrail and routing middleware; part of a 0.x control plane" }
          - { name: "LiteLLM (NVIDIA's Inference Hub reference implementation) or NeMo Helix Inference Gateway", kind: open, url: "https://docs.nvidia.com/enterprise-reference-architectures/ai-factory-inference-hub-reference-design/latest/inference-hub-reference-implementation.html", note: "NVIDIA's reference names LiteLLM with NeMo Switchyard routing; the Helix gateway is 0.x.", packs: [nvidiaAiEnterprise] }
          - { name: "Istio ingress gateway checking Keycloak tokens, with per-endpoint access and API tokens", kind: commercial, url: "https://support.hpe.com/hpesc/public/docDisplay?docId=a00aie112hen_us&page=Security/identity-management.html", note: "No token budgets in the 1.12 docs; HPE's developer blog says LiteLLM is a default framework from AI Essentials 1.13.", packs: [hpePrivateCloudAi] }
      - block: api
        service: "OpenAI-compatible inference endpoint"
        options:
          - { name: "vLLM OpenAI-compatible server", kind: open, url: "https://docs.vllm.ai/en/latest/serving/online_serving/", note: "The engine's own HTTP server; --api-key covers only some paths, so keep it behind the gateway", packs: [upstreamOpenSource], watch: [{ text: "Reached only through the gateway; KServe and llm-d can publish it under their own routes.", url: "https://docs.vllm.ai/en/latest/serving/online_serving/" }, { text: "--api-key protects only the /v1, /v2, /inference and /cohere paths; network policy must keep every other caller out.", url: "https://docs.vllm.ai/en/latest/serving/online_serving/" }, { text: "No authentication unless --api-key is set, and the key then covers only /v1, /v2, /inference and /cohere; /invocations, /pooling, /classify, /score, /rerank, /tokenize and /metrics stay open, and vLLM's own guide says not to rely on the key alone. Treat network rules as the control and the key as a second lock.", url: "https://docs.vllm.ai/en/latest/usage/security.html" }] }
          - { name: "KServe InferenceService or LLMInferenceService", kind: open, url: "https://kserve.github.io/website/docs/model-serving/generative-inference/overview", note: "Declared model resources with routes under /openai/v1; LLMInferenceService is v1alpha1, built on llm-d", packs: [canonicalCharmedKubeflow, hpePrivateCloudAi], watch: [{ text: "Programmatic tokens are ServiceAccount tokens that cannot be revoked before they expire.", url: "https://documentation.ubuntu.com/charmed-kubeflow/latest/how-to/use/perform-inference-isvc-tokens/" }, { text: "Admin-issued API tokens last 30 days by default; user Auth tokens (JWT) last 30 minutes.", url: "https://support.hpe.com/hpesc/public/docDisplay?docId=a00aie112hen_us&page=pcai/GenAI/model-endpoints.html" }] }
          - { name: "llm-d router (Gateway API Inference Extension)", kind: open, url: "https://llm-d.ai/docs/architecture", note: "llm-d 1.0: KV-cache-aware endpoint picking, flow control and InferencePool routing" }
          - { name: "Red Hat OpenShift AI model serving", kind: commercial, url: "https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/3.5/html/deploying_models/deploying_models", note: "KServe and llm-d with Authorino token authentication and canary rollouts", packs: [redHatOpenShiftAi], watch: [{ text: "OpenAI-compatible; token authentication through Authorino.", url: "https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/3.5/pdf/release_notes/Red_Hat_OpenShift_AI_Self-Managed-3.5-Release_notes-en-US.pdf" }] }
          - { name: "NVIDIA NIM", kind: commercial, url: "https://docs.nvidia.com/nim/large-language-models/latest/reference/architecture.html", note: "Container with an OpenAI-compatible proxy, readiness probes and TLS in front of its engine", packs: [nvidiaAiEnterprise], watch: [{ text: "NIM's proxy adds readiness, routing and TLS; caller identity comes from the gateway in front.", url: "https://docs.nvidia.com/nim/large-language-models/latest/reference/architecture.html" }] }
          - { name: "VMware Private AI Services Model Runtime endpoint", kind: commercial, url: "https://techdocs.broadcom.com/us/en/vmware-cis/vcf/vcf-9-0-and-later/9-1/design/design-library/private-ai-platform-detailed-design/private-ai-services.html", note: "OpenAI-compatible endpoints created from the Model Gallery", packs: [vmwarePrivateAi], watch: [{ text: "/chat/completions, /completions and /embeddings.", url: "https://techdocs.broadcom.com/us/en/vmware-cis/vcf/vcf-9-0-and-later/9-1/design/design-library/private-ai-platform-detailed-design/private-ai-services.html" }] }
      - block: runtime
        service: "Inference engine on GPU nodes"
        options:
          - { name: "vLLM", kind: open, url: "https://docs.vllm.ai/en/latest/deployment/k8s.html", note: "Open engine with an OpenAI-compatible server; NVIDIA, AMD, Intel Gaudi and IBM Spyre builds ship in OpenShift AI", packs: [upstreamOpenSource], watch: [{ text: "A Deployment per model, or managed by KServe or llm-d.", url: "https://docs.vllm.ai/en/latest/deployment/k8s.html" }, { text: "One Deployment per model on a tainted GPU pool, started with HF_HUB_OFFLINE=1 and a local model path.", url: "https://docs.vllm.ai/en/latest/deployment/k8s.html" }, { text: "Loads whatever is at the model path; its security guide describes no signature or digest check, so verification before load is a check you add.", url: "https://docs.vllm.ai/en/latest/usage/security/" }] }
          - { name: "SGLang", kind: open, url: "https://docs.sglang.io/", note: "Open engine with RadixAttention prefix caching; also a NIM backend" }
          - { name: "NVIDIA NIM", kind: commercial, url: "https://docs.nvidia.com/nim/large-language-models/latest/reference/architecture.html", note: "Packaged per-model containers that bundle vLLM or SGLang with validated profiles", packs: [nvidiaAiEnterprise], watch: [{ text: "NIM Operator support for Kata Containers and Dynamo CRDs is experimental.", url: "https://docs.nvidia.com/nim-operator/latest/index.html" }] }
          - { name: "NVIDIA Dynamo", kind: open, url: "https://docs.nvidia.com/dynamo/latest/index.html", note: "Disaggregated prefill/decode and KV-aware routing over vLLM, SGLang or TensorRT-LLM" }
          - { name: "Red Hat AI Inference", kind: commercial, url: "https://docs.redhat.com/en/documentation/red_hat_ai_inference/3.5", note: "Red Hat's supported vLLM build (3.5 packages vLLM v0.24.0); supported fast releases begin with 3.6", packs: [redHatOpenShiftAi], watch: [{ text: "NVIDIA, AMD, Intel Gaudi and IBM Spyre runtimes; NIM can be added as a serving platform.", url: "https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/3.5/html/deploying_models/deploying_models" }] }
          - { name: "Triton Inference Server", kind: open, url: "https://docs.nvidia.com/deeplearning/triton-inference-server/user-guide/docs/index.html", note: "Multi-framework server (TensorRT, ONNX, PyTorch, Python); offered in VMware and Canonical guides" }
          - { name: "Model Runtime with vLLM, llama.cpp or Infinity on VKS", kind: commercial, url: "https://techdocs.broadcom.com/us/en/vmware-cis/private-ai/foundation-with-nvidia/9-1/private-ai-release-notes/vmware-private-ai-services-release-notes.html", note: "The bundled llama.cpp image is CPU-only; a CUDA image can be supplied.", packs: [vmwarePrivateAi] }
          - { name: "KServe runtimes: Triton Inference Server, or NVIDIA NIM", kind: commercial, url: "https://documentation.ubuntu.com/charmed-kubeflow/latest/how-to/use/deploy-nvidia-nims/", packs: [canonicalCharmedKubeflow] }
          - { name: "HPE MLIS serving NVIDIA NIM, vLLM or BentoML models", kind: commercial, url: "https://support.hpe.com/hpesc/public/docDisplay?docId=a00aie112hen_us&page=pcai/Reference/support-matrices-aie.html", note: "AI Essentials 1.12 ships vLLM v0.12.0 (only models compatible with v0.8.5 allowed) and NVIDIA AI Enterprise NIM models.", packs: [hpePrivateCloudAi] }
      - block: storage
        service: "Versioned model weight storage"
        note: "Written only by the release job. The inference server reads a read-only volume filled from it, or streams from it (with vLLM, --load-format runai_streamer)."
        options:
          - { name: "Ceph Object Gateway", kind: open, url: "https://docs.ceph.com/en/latest/radosgw/", note: "S3- and Swift-compatible gateway on Ceph, with STS web identity for short-lived credentials", packs: [upstreamOpenSource] }
          - { name: "Red Hat OpenShift Data Foundation", kind: commercial, url: "https://docs.redhat.com/en/documentation/red_hat_openshift_data_foundation/4.20", note: "Red Hat's storage for OpenShift, with an S3 Multicloud Object Gateway and external Ceph mode" }
          - { name: "OCI registry as model store (KServe modelcars)", kind: open, url: "https://kserve.github.io/website/docs/model-serving/storage/providers/oci", note: "Weights packaged as OCI images to cut start-up downloads; Harbor or Quay hold them", packs: [vmwarePrivateAi] }
          - { name: "NIM Operator NIMCache", kind: commercial, url: "https://docs.nvidia.com/nim-operator/latest/index.html", note: "Pre-caches NGC model profiles onto network storage, including for air-gapped clusters", packs: [nvidiaAiEnterprise], watch: [{ text: "Pre-populated caches serve air-gapped clusters with no NGC or Hugging Face access.", url: "https://docs.nvidia.com/nim-operator/latest/air-gap.html" }] }
          - { name: "MinIO", kind: open, url: "https://github.com/minio/minio", note: "Community repository archived 25 April 2026: source only, no new binaries", packs: [canonicalCharmedKubeflow], watch: [{ text: "The upstream MinIO community repository was archived on 25 April 2026.", url: "https://documentation.ubuntu.com/charmed-kubeflow/latest/how-to/manage/integrate-minio/" }] }
          - { name: "S3-compatible store, OCI model image or PVC", kind: commercial, url: "https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/3.5/html/deploying_models/deploying_models", note: "OpenShift Data Foundation provides the S3 endpoint on-premises.", packs: [redHatOpenShiftAi] }
          - { name: "MLIS S3 registries and a shared model-cache PVC", kind: commercial, url: "https://support.hpe.com/hpesc/public/docDisplay?docId=a00aie112hen_us&page=MLIS/registries/registries.html", note: "Any S3 store can be a registry; Ezmeral Data Fabric Object Store is built in, MinIO or AWS S3 can be connected.", packs: [hpePrivateCloudAi] }
      - block: sources
        service: "Public model hub, outside the boundary"
        note: "Stays outside. Weights come in from it however that is carried: a promotion job that downloads a pinned revision (for example hf download --revision <commit>) through the egress proxy, a repository manager that proxies the hub, or files carried across an air gap. Each is scanned and recorded before promotion, and serving loads only promoted files; whether serving nodes have any route to the hub is your choice, and keeping them off it is a common one."
        options:
          - { name: "Hugging Face Hub", kind: commercial, url: "https://huggingface.co/docs/hub/security", note: "The largest open-weights hub; runs malware, pickle and secrets scanning on uploads", packs: [upstreamOpenSource] }
          - { name: "NVIDIA NGC Catalog", kind: commercial, url: "https://docs.nvidia.com/nim/large-language-models/latest/reference/model-signature-verification.html", note: "NVIDIA-published models signed with OpenSSF Model Signing", packs: [nvidiaAiEnterprise, vmwarePrivateAi, canonicalCharmedKubeflow], watch: [{ text: "NVIDIA signs NGC models with OpenSSF Model Signing; model_signing verify checks them.", url: "https://docs.nvidia.com/nim/large-language-models/latest/reference/model-signature-verification.html" }] }
          - { name: "Red Hat AI validated models", kind: commercial, url: "https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/3.5/pdf/release_notes/Red_Hat_OpenShift_AI_Self-Managed-3.5-Release_notes-en-US.pdf", note: "Benchmarked and garak-scanned by Red Hat, published with scores on Hugging Face", packs: [redHatOpenShiftAi], watch: [{ text: "Validated models are benchmarked and scanned with garak by Red Hat.", url: "https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/3.5/html/managing_model_registries/overview-of-model-registries_managing-model-registries" }] }
          - { name: "NVIDIA NGC (NIM) and Hugging Face, through MLIS registries", kind: commercial, url: "https://support.hpe.com/hpesc/public/docDisplay?docId=a00aie112hen_us&page=pcai/GenAI/model-catalog.html", packs: [hpePrivateCloudAi] }
      - block: registry
        service: "Model registry with signed releases"
        note: "Holds the version, digest, scan result and approval for each release, whether trained in-house or taken from the Hub."
        options:
          - { name: "MLflow Model Registry", kind: open, url: "https://mlflow.org/docs/latest/ml/model-registry/", note: "Versions, aliases and lineage; authentication and permissions are opt-in and needed for separate approvers", packs: [upstreamOpenSource, canonicalCharmedKubeflow, hpePrivateCloudAi], watch: [{ text: "Kubeflow Hub (formerly Kubeflow Model Registry) is the Kubeflow-native alternative.", url: "https://mlflow.org/docs/latest/ml/model-registry/" }, { text: "Model Catalog is admin-only by default; no approval or signing workflow is described.", url: "https://support.hpe.com/hpesc/public/docDisplay?docId=a00aie112hen_us&page=MLflow/mlflow.html" }] }
          - { name: "Kubeflow Hub (formerly Kubeflow Model Registry)", kind: open, url: "https://www.kubeflow.org/docs/components/model-registry/overview/", note: "Registry plus a read-only model catalog, native to Kubeflow and KServe" }
          - { name: "Red Hat OpenShift AI model registry and catalog", kind: commercial, url: "https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/3.5/html/managing_model_registries/overview-of-model-registries_managing-model-registries", note: "Kubeflow Model Registry with a curated catalog; artifact signing is Technology Preview", packs: [redHatOpenShiftAi], watch: [{ text: "Artifact signing and verification in the registry is Technology Preview.", url: "https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/3.5/html/managing_model_registries/overview-of-model-registries_managing-model-registries" }] }
          - { name: "NeMo Helix model entities", kind: open, url: "https://docs.nvidia.com/nemo-helix/latest/documentation/models-and-inference", note: "Model and provider entities in the Helix Entity Store; 0.x" }
          - { name: "NGC Private Registry", kind: commercial, url: "https://docs.nvidia.com/ngc/gpu-cloud/ngc-private-registry-user-guide/index.html", note: "NGC-hosted private store for containers, models and Helm charts, outside your boundary" }
          - { name: "VMware Model Gallery", kind: commercial, url: "https://techdocs.broadcom.com/us/en/vmware-cis/vcf/vcf-9-0-and-later/9-1/design/design-library/private-ai-platform-detailed-design/private-ai-services.html", note: "Harbor-based store that feeds the Model Runtime", packs: [vmwarePrivateAi], watch: [{ text: "Broadcom calls it a step towards model governance; approval and signing are not described.", url: "https://blogs.vmware.com/cloud-foundation/2025/06/19/private-ai-services-new-in-vmware-private-ai-foundation-with-nvidia-in-vcf-9-0/" }] }
          - { name: "NeMo Helix model entities, or NGC Private Registry", kind: commercial, url: "https://docs.nvidia.com/nemo-helix/latest/documentation/models-and-inference", note: "NGC Private Registry is a hosted NVIDIA service, outside your boundary.", packs: [nvidiaAiEnterprise] }
      - block: govIdentity
        service: "Identity provider and workload identity"
        options:
          - { name: "Keycloak", kind: open, url: "https://www.keycloak.org/securing-apps/token-exchange", note: "People and service clients in one realm, with token exchange for hand-offs.", packs: [upstreamOpenSource] }
          - { name: "Red Hat build of Keycloak", kind: commercial, url: "https://access.redhat.com/products/red-hat-build-keycloak/", note: "Supported Keycloak build from Red Hat.", packs: [redHatOpenShiftAi] }
          - { name: "Kubernetes ServiceAccount tokens", kind: open, url: "https://kubernetes.io/docs/concepts/security/service-accounts/", note: "Short-lived projected tokens give each workload an identity the IdP and vault can verify.", packs: [upstreamOpenSource] }
          - { name: "SPIFFE and SPIRE", kind: open, url: "https://spiffe.io/docs/latest/spire-about/", note: "Attested workload identities and trust-domain federation, an alternative to keys per client." }
          - { name: "Red Hat zero trust workload identity manager", kind: commercial, url: "https://www.redhat.com/en/blog/zero-trust-workload-identity-manager-11-generally-available-red-hat-openshift", note: "Red Hat's SPIRE operator, GA 1.1 (July 2026), with Vault and cert-manager as upstream authorities.", packs: [redHatOpenShiftAi] }
          - { name: "Gravitee Access Management", kind: commercial, url: "https://documentation.gravitee.io/am/4.11/guides/developer-contributions/using-oauth-2.0-token-exchange", note: "Gravitee's IdP and authorisation server, with delegated token exchange." }
      - block: govSecrets
        service: "Secrets manager with a hardware root"
        options:
          - { name: "HashiCorp Vault", kind: commercial, url: "https://developer.hashicorp.com/vault/docs/deploy/kubernetes/vso", note: "Dynamic credentials, transit keys and the Vault Secrets Operator; HSM auto-unseal needs Vault Enterprise.", packs: [upstreamOpenSource] }
          - { name: "OpenBao", kind: open, url: "https://openbao.org/docs/configuration/seal/pkcs11/", note: "Open-source fork of Vault under the Linux Foundation's OpenSSF; documents a PKCS#11 HSM seal.", packs: [upstreamOpenSource] }
          - { name: "External Secrets Operator", kind: open, url: "https://external-secrets.io/latest/", note: "Syncs secrets from an external store into Kubernetes Secrets; pairs with any vault here." }
          - { name: "External Secrets Operator for Red Hat OpenShift", kind: commercial, url: "https://developers.redhat.com/articles/2025/11/11/introducing-external-secrets-operator-openshift", note: "Red Hat-supported ESO, GA for OpenShift 4.20+, syncing from Vault or CyberArk Conjur.", packs: [redHatOpenShiftAi] }
          - { name: "Idira Secrets Manager, self-hosted (Palo Alto Networks)", kind: commercial, url: "https://www.paloaltonetworks.com/idira/machine/secrets-management", note: "The former CyberArk line now under Palo Alto's Idira brand; SaaS or self-hosted for air-gapped sites." }
      - block: govPolicy
        service: "Network, admission and guardrail policy"
        options:
          - { name: "Kubernetes", kind: open, url: "https://kubernetes.io/docs/concepts/overview/", note: "The container platform each platform pack here runs on, upstream or as a distribution (OpenShift, VKS, Canonical Kubernetes).", packs: [upstreamOpenSource, redHatOpenShiftAi, nvidiaAiEnterprise, vmwarePrivateAi, canonicalCharmedKubeflow, hpePrivateCloudAi] }
          - { name: "Cilium", kind: open, url: "https://docs.cilium.io/en/stable/security/policy/", packs: [upstreamOpenSource] }
          - { name: "Squid outbound proxy", kind: open, url: "https://www.squid-cache.org/Doc/config/access_log/", note: "The single exit for search and page fetches, with an access log for review.", packs: [upstreamOpenSource] }
      - block: govSupplyChain
        service: "Mirrors, scanners and signing in the pipeline"
        options:
          - { name: "Harbor", kind: open, url: "https://goharbor.io/docs/2.16.0/administration/configure-proxy-cache/", note: "Image registry with a proxy cache and Trivy scanning; images, not PyPI or npm.", packs: [upstreamOpenSource] }
          - { name: "Trivy", kind: open, url: "https://trivy.dev/docs/latest/guide/scanner/vulnerability/", packs: [upstreamOpenSource] }
          - { name: "ModelScan", kind: open, url: "https://github.com/protectai/modelscan", packs: [upstreamOpenSource] }
          - { name: "OpenSSF Model Signing", kind: open, url: "https://github.com/sigstore/model-transparency", packs: [upstreamOpenSource] }
      - block: govObservability
        service: "Logs, traces and SIEM off the workload's path"
        options:
          - { name: "OpenTelemetry Collector", kind: open, url: "https://opentelemetry.io/docs/collector/", note: "Vendor-neutral pipeline that receives gateway logs and traces and forwards them to stores the agent cannot write.", packs: [upstreamOpenSource] }
          - { name: "Grafana Loki", kind: open, url: "https://grafana.com/docs/loki/latest/", note: "Log store; turn retention on, or logs are kept for ever.", packs: [upstreamOpenSource] }
          - { name: "Langfuse (self-hosted)", kind: open, url: "https://langfuse.com/self-hosting", note: "Self-hosted LLM tracing and evaluation, with a documented LiteLLM integration.", packs: [upstreamOpenSource] }
          - { name: "MLflow Tracing", kind: open, url: "https://mlflow.org/docs/latest/genai/tracing/", note: "Agent and LLM tracing; GA in OpenShift AI 3.5, where the visual agent-trace view is Technology Preview.", packs: [redHatOpenShiftAi] }
          - { name: "Elastic Security", kind: commercial, url: "https://www.elastic.co/docs/solutions/security", note: "SIEM and detection engine; one example of where detections on gateway, egress and audit logs run." }
    sources:
      consumers: https://docs.litellm.ai/docs/proxy/virtual_keys
    alsoNeeded:
      - service: "The container platform's control plane, operated by you"
        role: other
        why: "A cloud runs the control plane for you. Here you run at least three control plane machines, a load balancer in front of the API server, regular backups of its datastore (etcd on Kubernetes) and every upgrade."
        url: https://kubernetes.io/docs/setup/production-environment/
      - service: "GPU servers with their drivers, container toolkit and device plugin"
        role: other
        why: "Drivers, container toolkit and device plugin are yours to install and patch (for example with the NVIDIA GPU Operator). If the serving network has no route out, their images and packages come from your own registry and package mirror."
        url: https://docs.nvidia.com/datacenter/cloud-native/gpu-operator/latest/install-gpu-operator-air-gapped.html
      - service: "Private container registry with scanning"
        role: registry
        why: "The image source the nodes pull from: gateway, inference server and operator images arrive through it, are scanned there and are pulled by digest (for example Harbor with Trivy and proxy cache projects)."
        url: https://goharbor.io/docs/latest/administration/configure-proxy-cache/
      - service: "Identity provider for administrators and workloads"
        role: identity
        why: "Sign-in for the people who administer the gateway, registry and cluster, and the OpenID Connect provider the object store trusts when it issues temporary credentials (for example Keycloak)."
        url: https://www.keycloak.org/docs/latest/server_admin/
      - service: "Secrets manager with a protected root key"
        role: secrets
        why: "Holds every secret and key the platform needs and must itself be unsealed, backed up and audited (for example HashiCorp Vault or OpenBao). PKCS11 auto-unseal needs Vault Enterprise; OpenBao offers a pkcs11 seal through its KMS plugin."
        url: https://developer.hashicorp.com/vault/docs/configuration/seal/pkcs11
      - service: "Certificate issuance and renewal from an internal authority"
        role: keys
        why: "Issues and renews the TLS certificates for every service inside the boundary, with no public certificate service to lean on (for example cert-manager with your internal CA)."
        url: https://cert-manager.io/docs/
      - service: "Network policy enforcement and egress control"
        role: network
        why: "A network plugin enforces the policies, and outbound traffic, needed only by the step that brings weights in, leaves only to approved destinations and is recorded (for example Cilium with a Squid forward proxy). Firewalls, routing and internal DNS around them are also yours."
        url: https://docs.cilium.io/en/stable/security/policy/index.html
      - service: "Ingress that ends TLS and routes consumers to the gateway"
        role: ingress
        why: "Terminates TLS and routes consumers to the gateway's inference paths only (for example Envoy Gateway). Ingress NGINX was retired in March 2026 and receives no further fixes, so do not build on it."
        url: https://gateway.envoyproxy.io/docs/
      - service: "The gateway's database and cache"
        role: other
        why: "If you use LiteLLM: virtual keys, teams, budgets and spend live in PostgreSQL, and Redis 7 or newer is needed once more than one proxy instance runs. Both need patching, TLS and backup."
        url: https://docs.litellm.ai/docs/proxy/prod
      - service: "Log collection, a log store and the SIEM"
        role: logging
        why: "Nothing collects logs unless you run it: a collector gathers gateway, cluster audit and workload records, a store keeps them, and the SIEM holds the detections (for example the OpenTelemetry Collector and Loki)."
        url: https://opentelemetry.io/docs/collector/
      - service: "Cluster and volume backup, off site"
        role: other
        why: "Backs up cluster resources and persistent volumes (for example Velero); the buckets, databases and the vault need their own backup and restore tests."
        url: https://velero.io/docs/main/
      - service: "Time sync, power, cooling and physical security"
        role: other
        why: "Token expiry, certificates and log order depend on synchronised clocks (for example chrony). Access to the halls, hardware disposal and spare capacity are now part of protecting the model."
        url: https://chrony-project.org/
    quickstart:
      - title: "AI gateway, for example LiteLLM Proxy: Deploy with Helm"
        url: https://docs.litellm.ai/docs/proxy/deploy/helm
      - title: "Inference server, for example vLLM: Using Kubernetes"
        url: https://docs.vllm.ai/en/latest/deployment/k8s.html
      - title: "GPU servers, for example the NVIDIA GPU Operator: Install in Air-Gapped Environments"
        url: https://docs.nvidia.com/datacenter/cloud-native/gpu-operator/latest/install-gpu-operator-air-gapped.html
    # >>> hosting options (compared against the vendor's pages; one is the mapping itself)
    hosting:
      - id: kubernetes
        kind: cluster
        name: "Kubernetes"
        url: https://docs.vllm.ai/en/latest/deployment/k8s.html
        asOf: "2026-11"
        mapped: true
        compare:
          runs: "vLLM runs as a Deployment that you write, one per model, on GPU nodes of a cluster your organisation operates."
          patching: "Your organisation patches the nodes, GPU drivers and Kubernetes, and mirrors or rebuilds the vLLM image for each release."
          data: "Prompts and completions are processed in your vLLM pods and weights sit in your own bucket and node volumes, all in your data centre."
          network: "Pods accept and send all traffic by default; NetworkPolicy limits callers to the gateway and blocks outbound traffic from the serving pods."
          identity: "Each pod runs as a Kubernetes ServiceAccount with a short-lived projected token, which your secret and object stores can exchange for credentials."
          accepts: "Whatever your image serves: vLLM loads Hugging Face model architectures behind an OpenAI-compatible server, and any other engine can be packaged the same way."
          workload: "Pods request nvidia.com/gpu and hold their GPUs while they run; the replica count is fixed unless you add and tune an autoscaler yourself."
          portability: "The image, flags and manifests are standard Kubernetes objects that move to any conformant cluster with GPU nodes."
          effort: "Your team writes and maintains the manifests, probes, rollouts and scaling, and is on call for the model server, the GPUs and the cluster."
          fits: "vLLM's own guide documents a plain Deployment and Service on Kubernetes first and lists Helm, KServe, LWS, llm-d and others as alternatives."
        sources:
          - https://docs.vllm.ai/en/latest/deployment/k8s.html
          - https://docs.vllm.ai/en/latest/
          - https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
          - https://kubernetes.io/docs/concepts/services-networking/network-policies/
          - https://kubernetes.io/docs/concepts/security/service-accounts/
          - https://kubernetes.io/docs/concepts/workloads/autoscaling/horizontal-pod-autoscale/
      - id: kserve
        kind: runtime
        name: "KServe"
        url: https://kserve.github.io/website/
        asOf: "2026-11"
        compare:
          runs: "KServe's controller, installed by your platform team, creates the model server pods from an InferenceService or LLMInferenceService that you declare."
          patching: "Your organisation patches nodes, drivers, Kubernetes and KServe; the Hugging Face runtime image, which embeds vLLM, is published by the KServe project."
          data: "Prompts, completions and weights stay in your cluster; a storage initialiser copies weights into each pod from your bucket or the Hub, and a PVC is mounted directly."
          network: "Standard mode creates an Ingress or Gateway API route for each service unless that is switched off; outbound limits remain NetworkPolicy."
          identity: "Predictor pods run as the ServiceAccount named in the spec; S3 credentials come from a Secret attached to it and read through KServe annotations."
          accepts: "The Hugging Face runtime serves generation, embedding and rerank models on vLLM with OpenAI-style routes; LLMInferenceService runs a vLLM image you name."
          workload: "Each replica requests nvidia.com/gpu; in Standard mode KEDA can scale on vLLM metrics but scale from zero is not supported; node caches can pre-load weights."
          portability: "Models and the vLLM engine are unchanged; KServe resources have to be rewritten as Deployments and Services, and the /openai route prefix may change."
          effort: "Your team operates the cluster and also KServe, cert-manager, a gateway or ingress controller and optionally KEDA, and is on call for them and the GPUs."
          fits: "KServe recommends Standard deployment for generative models, and LLMInferenceService for large models, multi-GPU inference or high throughput."
        sources:
          - https://kserve.github.io/website/
          - https://kserve.github.io/website/docs/model-serving/generative-inference/overview
          - https://kserve.github.io/website/docs/model-serving/generative-inference/llmisvc/llmisvc-overview
          - https://kserve.github.io/website/docs/model-serving/generative-inference/llmisvc/llmisvc-configuration
          - https://kserve.github.io/website/docs/admin-guide/kubernetes-deployment-llmisvc
          - https://kserve.github.io/website/docs/admin-guide/overview
          - https://kserve.github.io/website/docs/admin-guide/kubernetes-deployment
          - https://kserve.github.io/website/docs/admin-guide/configurations
          - https://kserve.github.io/website/docs/getting-started/genai-first-isvc
          - https://kserve.github.io/website/docs/getting-started/genai-first-llmisvc
          - https://kserve.github.io/website/docs/model-serving/storage/providers/s3
          - https://kserve.github.io/website/docs/model-serving/storage/storage-containers
          - https://kserve.github.io/website/docs/model-serving/generative-inference/autoscaling
          - https://kserve.github.io/website/docs/model-serving/generative-inference/modelcache/localmodel
          - https://kserve.github.io/website/docs/model-serving/generative-inference/llmisvc/llmisvc-envoy-ai-gateway
          - https://docs.vllm.ai/en/latest/deployment/integrations/kserve.html
          - https://kubernetes.io/docs/concepts/services-networking/network-policies/
          - https://kserve.github.io/website/docs/model-serving/storage/providers/pvc
          - https://kserve.github.io/website/docs/reference/crd-api
        summary: "The inference server is no longer a Deployment you write: you declare an InferenceService that uses KServe's Hugging Face runtime (vLLM backend) in Standard deployment mode; KServe creates the Deployment, Service, route and autoscaler and injects a storage initialiser that copies the weights from your object store. The AI gateway stays in front. You gain a declared model resource and metric-based scaling; you also operate KServe, cert-manager and a gateway controller, and must close the route KServe opens per service."
        bindings:
          - { block: api, service: "KServe InferenceService (OpenAI-style routes)", note: "Routes are served under /openai/v1 unless KSERVE_OPENAI_ROUTE_PREFIX is changed. KServe's guide calls the endpoint without an API key, so network rules keep other callers out.", url: https://kserve.github.io/website/docs/model-serving/generative-inference/overview, watch: [{ text: "KServe's guide for the Hugging Face runtime says the service does not require API key authentication, and its client example passes a placeholder key. The OpenAI routes sit under /openai/v1, not /v1, so the gateway's api_base carries the prefix or KSERVE_OPENAI_ROUTE_PREFIX is emptied.", url: "https://kserve.github.io/website/docs/getting-started/genai-first-isvc" }] }
          - { block: runtime, service: "KServe Hugging Face runtime on GPU nodes", note: "One InferenceService per model in Standard mode on the tainted GPU pool. The runtime uses its vLLM backend and falls back to the Hugging Face backend for models vLLM does not support.", url: https://kserve.github.io/website/docs/getting-started/genai-first-isvc, watch: [{ text: "In Standard mode scale from zero is not supported for HTTP requests, and KEDA, which is optional, scales on custom metrics such as vLLM's, so an idle model keeps at least one replica and its GPU.", url: "https://kserve.github.io/website/docs/admin-guide/kubernetes-deployment" }, { text: "LLMInferenceService, the resource for large models and multi-GPU or multi-node serving, is an alpha API (serving.kserve.io/v1alpha1). It needs Kubernetes 1.32 or later, Gateway API with its Inference Extension, Envoy Gateway and, for multi-node, LeaderWorkerSet, and it manages an HTTPRoute per service.", url: "https://kserve.github.io/website/docs/admin-guide/kubernetes-deployment-llmisvc" }] }
        dropSettings: [modelSigningVerify]
        addSettings: [kserveStandardDeploymentMode, kserveIngressCreationOff, kserveStorageContainerVerify, kserveS3StorageSecret, kserveAutoMountToken, kserveEndpointAuth]
        alsoNeeded:
          - service: "KServe controller and its custom resources"
            role: other
            why: "Installed and upgraded by your platform team with Helm or Kustomize; the Standard mode guide asks for Kubernetes 1.32 or later."
            url: https://kserve.github.io/website/docs/admin-guide/kubernetes-deployment
          - service: "cert-manager"
            role: keys
            why: "KServe's Standard mode guide lists Cert Manager 1.15.0 or later for the webhook certificates."
            url: https://kserve.github.io/website/docs/admin-guide/kubernetes-deployment
          - service: "A Gateway API or Ingress controller for KServe"
            role: ingress
            why: "The Standard mode guide requires a network controller, Gateway API (recommended) or Ingress, even if every model is kept cluster-local."
            url: https://kserve.github.io/website/docs/admin-guide/kubernetes-deployment
          - service: "KEDA"
            role: other
            why: "Needed only to scale on vLLM metrics such as vllm:num_requests_running; without it KServe creates a HorizontalPodAutoscaler."
            url: https://kserve.github.io/website/docs/model-serving/generative-inference/autoscaling
        quickstart:
          - title: "Deploy Your First LLM with InferenceService"
            url: https://kserve.github.io/website/docs/getting-started/genai-first-isvc
          - title: "Standard Kubernetes Deployment (administrator guide)"
            url: https://kserve.github.io/website/docs/admin-guide/kubernetes-deployment
          - title: "Hugging Face runtime overview"
            url: https://kserve.github.io/website/docs/model-serving/generative-inference/overview
