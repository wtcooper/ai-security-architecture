                  url: https://claude.com/docs/office-agents/overview
              verified: 2026-09-10
      - mitigation: AML.M0024
        coverage: native
        mechanism: >-
          Compliance API local session endpoints (GET /v1/compliance/apps/sessions/local and
          /{session_id}/messages, product_surface office_agents/*, scope read:compliance_user_data) return
          Enterprise add-in transcripts with prompts, responses, tool calls and results; a custom OpenTelemetry
          collector (otlp_endpoint and otlp_headers at Organization settings > Office agents, or the same keys
          in the manifest, Entra attributes or bootstrap) receives agent.query, agent.stream and
          agent.tool_execution spans
        steps:
          - title: Pull add-in transcripts from the Compliance API
            body:
              - >-
                With a Compliance Access Key holding read:compliance_user_data, list GET
                /v1/compliance/apps/sessions/local with updated_at.gte, keep sessions whose product_surface
                starts with office_agents, and fetch each session's /messages transcript.
            url: https://platform.claude.com/docs/en/manage-claude/compliance-sessions
          - title: Stream spans to a collector you run
            body:
              - >-
                Set otlp_endpoint (and otlp_headers) at Organization settings > Office agents on Enterprise, or
                as a configuration key on third-party platforms, pointing at an OpenTelemetry Collector with a
                CORS-enabled OTLP/HTTP receiver; raise otlp_attr_max_chars if 4,000-character truncation loses
                evidence.
            url: https://claude.com/docs/office-agents/opentelemetry
        note: >-
          Native by the rule: programmatic export of conversation content and tool events. Boundaries: the
          Compliance API covers Claude-account Enterprise sign-in only (the add-in pages call this coverage
          public beta, the Compliance API reference calls it stable), not Pro, Max, Team or third-party-platform
          deployments, and HIPAA-ready or ZDR organisations capture no local sessions. Add-in activity is not in
          Enterprise audit logs or data exports, and deleting a conversation in the add-in does not remove the
          session. OpenTelemetry spans are posted from each user's browser, so a user who controls the client
          can suppress them — telemetry, not tamper resistance; they omit assistant response text, record
          connector tools as mcp_tool, and on third-party platforms carry no user identity (correlate
          session.id with Entra or gateway logs). On the third-party path the organisation's gateway log is the
          record to fuse with.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAuditLogging
          reviewRequired: false
          original:
            - capability: capabilityAuditLogging
              coverage: partial
              mechanism: >-
                Custom OpenTelemetry collector receives the full span trail per user (CORS required);
                Compliance API M365 session transcripts (beta); excluded from Enterprise audit logs and data
                exports
              steps:
                - title: Configure a custom collector
                  body:
                    - Point the add-in at an OpenTelemetry Collector you run with a CORS-enabled OTLP HTTP
                      receiver; the collector, not the browser, authenticates to your backend.
                  url: https://claude.com/docs/office-agents/enterprise-readiness
              verified: 2026-09-10
      - mitigation: cap-agent-kill-switch
        coverage: partial
        mechanism: >-
          Remove the add-in (or its assignment) in Integrated apps; deny addin.access through access_policies
          or disabled_features ("Kill switch: the add-in refuses to run") in custom-manifest or bootstrap
          deployments; disable the Claude for Office enterprise app (Enabled for users to sign-in? = No) and
          revoke its admin consent in Entra; no claude.ai setting disables the add-ins
        steps:
          - title: Remove the add-in deployment
            body:
              - >-
                In Settings > Integrated apps select the Claude add-in and remove it (or remove users under
                Users); a removed add-in is not accessible to any user.
            url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/manage-addins-in-the-admin-center
          - title: Make the add-in refuse to run
            body:
              - >-
                Deliver disabled_features=addin.access, or an access_policies deny for addin.access, through the
                manifest, Entra extension attributes or a bootstrap endpoint; the add-in reads it when it loads.
            url: https://claude.com/docs/office-agents/third-party-platforms
          - title: Stop token issuance in Entra
            body:
              - >-
                In Entra ID > Enterprise apps > Claude for Office > Properties set Enabled for users to sign-in?
                to No, which prevents all tokens being issued for the app, and revoke its admin-consented
                permissions.
            url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/disable-user-sign-in-portal
        note: >-
          Partial by the rule: each stop blocks the next load or the next token, not a task pane already
          running, and the delay is not documented (Microsoft gives 24 to 72 hours for deployments to appear;
          removal timing is not stated). Configuration keys are read when the add-in loads — only served
          settings, which are re-read while it runs, are documented as applying mid-session, and they are
          preview. Disabling the Entra app stops new tokens; cached Graph access tokens run to expiry. Connector
          grants on each device cannot be revoked in bulk, and copies users installed themselves from AppSource
          are not removed by Integrated apps. No claude.ai control disables the add-ins; removing a member's
          seat or revoking the gateway token at your gateway is the practical stop for inference, though the
          add-in pages do not document its effect. Local history, skills and credentials persist until the
          device profile is wiped.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityKillSwitch
          reviewRequired: false
          original:
            - capability: capabilityKillSwitch
              coverage: native
              mechanism: >-
                Remove the add-in deployment in the M365 Admin Center, disable cross-app mode, remove the
                user's Claude seat; local data persists until the profile is wiped
              steps:
                - title: Withdraw the add-in
                  body:
                    - Remove or block the add-ins in the M365 Admin Center and turn off "Let Claude work across apps"; wipe the
                      device profile to remove local history and credentials.
                  url: https://claude.com/docs/office-agents/data-storage
              note: >-
                Withdrawing the add-in applies at the client's next add-in catalogue refresh, and seat removal
                at the next request; the docs state no delay, so measure it.
              verified: 2026-09-10
