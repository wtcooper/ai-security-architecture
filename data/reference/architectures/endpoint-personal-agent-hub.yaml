  - title: "Hermes Agent — security model and stated threat boundaries"
    url: https://hermes-agent.nousresearch.com/docs/user-guide/security
  - title: "Docker Sandboxes — microVM isolation, egress proxy and credential handling"
    url: https://docs.docker.com/ai/sandboxes/
  - title: "Model Context Protocol — security best practices"
    url: https://modelcontextprotocol.io/specification/2026-07-28/basic/security_best_practices
  - title: "OWASP Top 10 for Agentic Applications 2026 — ASI01, ASI02, ASI06"
    url: https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/
