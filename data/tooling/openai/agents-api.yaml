# OpenAI Agents API — one entity per product × reference architecture. Facts are dated (asOf)
# and cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# Added 2026-09-17: public beta announced 2026-09-10 (date from secondary coverage; the
# announcement page shows none). Fetched overview, architecture, environments (openai-hosted,
# self-hosted, lifecycle, security), tools (mcp, vaults, functions), observability, tracing,
# your-data. Not verified: an MCP approval gate for this API (documented for Responses only),
# trace retention, EU residency, sandbox isolation technology.
vendor: openai
family: OpenAI Agents API
tools:
  - id: toolOpenaiAgentsApi
    name: OpenAI Agents API
    surfaceClasses:
      - managedRuntime
    variants:
      - name: Agents API with OpenAI-hosted sandboxes
        class: managedRuntime
        url: https://developers.openai.com/api/docs/guides/agents-api/overview
      - name: Agents API with a self-hosted executor (codex exec-server on your infrastructure or a partner sandbox)
        class: managedRuntime
        url: https://developers.openai.com/api/docs/guides/agents-api/environments/self-hosted
        note: >-
          The harness and inference stay at OpenAI; shell, files and local MCP run where the
          executor runs. Outbound-only connection; the executor key can only connect environments.
    architecture: archManagedAgentRuntime
    status: beta
    asOf: "2026-09"
    summary:
      - >-
        OpenAI's managed Codex harness behind an API (header OpenAI-Beta agents=v1): you define
        an agent (model, instructions, tools, MCP servers, skills, plugins), optionally an
        environment (OpenAI-hosted Linux sandbox, or none, or a self-hosted executor), and run
        sessions that stream events; the vendor runs the loop, compaction, recovery, subagents
        and the sandbox. Function tools invert the loop — the session pauses with
        requires_action until your code returns the result — which is the general
        human-approval checkpoint. Hosted sandboxes have network enabled by default, a
        "restricted" mode of up to 100 exact hostnames, and expire after an hour idle; files
        under /workspace/outputs survive as artifacts.
      - >-
        Governance is API-native and thin: allowed_tools per MCP server, vaults that hold MCP
        bearer tokens and OAuth grants the agent never receives, a restricted executor key, a
        dashboard log and trace view with no external exporter, and no policy language, session
        budget or per-agent principal. Sessions persist until deleted; the API supports US data
        residency only and is not eligible for zero data retention, self-hosting included.
    facts:
      - label: Plans
        value: Any API organisation; public beta. Billed at model API rates plus standard container rates for hosted sandboxes.
        url: https://developers.openai.com/api/docs/guides/agents-api/overview
      - label: Inference & routing
        value: OpenAI models only, called inside OpenAI's runtime; no BYO model or customer gateway.
        url: https://developers.openai.com/api/docs/guides/agents-api/configuration
      - label: Data leaving the environment
        value: >-
          Instructions, input, tool inputs and outputs, and the sandbox's files go to OpenAI; with a
          self-hosted executor the shell and files stay on your side while tool inputs and
          outputs still cross to the harness.
        url: https://developers.openai.com/api/docs/guides/agents-api/environments/self-hosted
      - label: Retention & training
        value: >-
          /v1/agents state is retained until deleted and is not ZDR-eligible; data residency is
          United States only; business terms do not train on API data.
        url: https://developers.openai.com/api/docs/guides/your-data
      - label: Docs index
        value: developers.openai.com Agents API guide (overview, architecture, environments, tools, sessions, observability)
        url: https://developers.openai.com/api/docs/guides/agents-api/overview
    items:
      - title: Choose the network mode per environment template
        body:
          - Hosted sandboxes default to network enabled. Set restricted with an explicit
            allowed_domains list (exact hostnames, no wildcards) in the environment template;
            session overrides cannot broaden a template's policy.
        links:
          - title: OpenAI-hosted environments
            url: https://developers.openai.com/api/docs/guides/agents-api/environments/openai-hosted
      - title: Keep credentials in vaults and out of the sandbox
        body:
          - Attach vaults for MCP bearer tokens and OAuth grants; keep the API key outside the
            sandbox (reserved environment names are rejected) and give executors only the
            restricted environment key.
        links:
          - title: Vaults
            url: https://developers.openai.com/api/docs/guides/agents-api/tools/vaults
    riskNotes:
      - risk: riskPromptInjection
        note: >-
          Web search and MCP results enter the hosted loop unclassified; the sandbox's default
          network policy is enabled, so a fetched page is instruction until restricted.
      - risk: riskSensitiveDataDisclosure
        note: >-
          Sessions and sandbox files persist on OpenAI's side until deleted, US-only, with no
          ZDR; environment variables are readable by the model.
      - risk: riskToolSourceProvenance
        note: Plugins, skills and MCP servers are named in the definition and fetched or connected by the harness; nothing verifies what a declared server serves.
