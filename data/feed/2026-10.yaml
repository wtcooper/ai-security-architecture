  - id: manus-email-hijack
    date: 2026-10-01
    title: "Manus: one encoded email runs code in the agent's sandbox, beside the user's connector tokens"
    summary: >
      Salt Labs emailed a Gmail account connected to Manus. Asked only to check the inbox, Manus decoded the
      email's JSFuck payload with Node.js, which ran it in its cloud sandbox, and a reverse shell reached the
      Gmail OAuth token and other connectors' tokens in environment variables. Salt Labs showed it on its own
      test account, reported it through Meta's bug bounty programme and says it is resolved.
    category: promptInjection
    perspective: target
    evidence: demonstrated
    patterns: [archPersistentManagedAgents]
    incident: manus-email-hijack
