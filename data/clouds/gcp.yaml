    summary:
      - >-
        Your own ADK agent on Cloud Run started only by authenticated Pub/Sub pushes and
        schedules, reaching Gemini and a catalogue of MCP tools through Apigee, with the tool
        surface filtered per agent by API product and high-value actions parked for an operator.
        Google's references deploy the agent on Cloud Run with Agent Runtime as the managed
        alternative; that runtime is the API/SDK managed agent runtime drawing.
    bindings:
      - { block: events, service: Pub/Sub push and Cloud Scheduler, note: "Eventarc for file drops; an operator's approval returns as a message that resumes the parked step." }
      - { block: localTools, service: Your function tools and Code Execution, builtWith: Agent Development Kit (ADK), note: "Tools compiled into the agent run in its container; generated code runs in an Agent Platform Code Execution sandbox." }
      - { block: planner, service: Your agent on Cloud Run, builtWith: Agent Development Kit (ADK), note: "Google's reference names Agent Runtime on Gemini Enterprise Agent Platform as the alternative — the managed runtime." }
      - { block: stateRetrieval, service: Firestore and Agent Search, note: "Google's reference keeps case state in Agent Platform Sessions or Cloud Storage; Agent Search was Vertex AI Search." }
      - { block: gateway, service: Apigee (AI gateway), note: "Agent Gateway is the Agent Platform's own gateway — Google-managed for agents on Agent Runtime, early preview for Cloud Run." }
      - { block: internalTools, service: "Your MCP servers on Cloud Run, via Apigee", note: "MCP Toolbox for Databases in front of Cloud SQL, as Google's reference uses." }
      - { block: provider, service: Gemini on Agent Platform, note: "Gemini Enterprise Agent Platform, formerly Vertex AI." }
      - { block: orgData, service: Your systems of record, build: true, note: "Cloud SQL, applications on Compute Engine, systems outside Google Cloud." }
      - { block: openWeb, service: Grounding with Google Search }
