                Studio ADMX Disable Copilot
              steps:
                - title: Disable at enterprise scope, not organisation scope
                  body:
                    - Within one enterprise the least restrictive organisation policy usually wins for a user, so set the
                      feature policy to Disabled everywhere on the enterprise AI controls tab to make it stick.
                  url: https://docs.github.com/en/copilot/reference/enterprise-administrators/policy-conflicts
                - title: Remove agent mode on the device
                  body:
