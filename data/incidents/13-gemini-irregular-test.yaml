id: gemini-irregular-test
title: "Gemini breaks into three real companies during a capture-the-flag test"
subtitle: >
  A Gemini model in Irregular's cyber evaluation was meant to attack a fictional company. The
  test had internet access by mistake, the fictional name matched a real one, and the model got
  into three real companies' systems before it stopped.
date: 2026-09
dateRange: May 2026 (disclosed 18–19 September 2026)
category: breakout
perspective: weapon
archetype: archAgentSandbox
breaks:
  - capability: cap-agent-egress-control
    how: "An evaluation network with an enumerated set of hosts has no route to a real company, whatever it is called."
  - capability: D3-EI
    how: "A sandbox whose network the run cannot widen; here the internet connection was a configuration slip."
  - capability: D3-SYSVA
    how: "Test the containment before each run by trying to break it; a red team reaching for the internet finds the open route first."
  - capability: cap-agent-tracing
    how: "Watch evaluation runs live, so an intrusion on a real system is caught when it happens, not in review."
summary:
  - >
    Irregular runs cyber-capability evaluations for frontier labs. In May, a Gemini model in one
    of its capture-the-flag exercises was told to retrieve information from software run by a
    fictional company. Two things were wrong: the environment had internet access it was never
    meant to have, and the fictional company shared its name with a real one.
  - >
    The model went to the real company. In one run it guessed passwords until it reached a
    protected system; in two others it searched the web for the name, found other companies'
    credentials in public repositories, and used them. Each time, Google says, it recognised it
    was on a real company's system and stopped.
  - >
    Irregular told Google at the end of July. Google disclosed only after the Wall Street
    Journal asked, saying the model caused no harm and that this was not misalignment. Meta,
    OpenAI and Anthropic have disclosed similar Irregular-linked incidents — the same failure
    as the evaluation-containment case, at a different lab.
risks:
  - riskRogueActions
  - riskSensitiveDataDisclosure
steps:
  - n: 1
    title: A fictional target with a real name, and a live connection
    phase: introduced
    narrative: >
      The capture-the-flag exercise runs on Irregular's infrastructure. The task: retrieve
      information from software run by a fictional company. Internet access was unintentionally
      available, and the fictional company's name matched a real one on the public internet.
    path: [orchestrator->harness, localTools, openWeb]
    risks:
      - riskRogueActions
    sources:
      - title: "Google confirms Gemini AI breached three firms"
        url: https://www.securityweek.com/google-confirms-gemini-ai-breached-three-firms/
        publisher: SecurityWeek
        date: 2026-09-21
  - n: 2
    title: Guessing its way into a real system
    phase: exposed
    narrative: >
      In the first run the model guessed passwords until it reached a protected system — a real
      company's, not the exercise's.
    path: [localTools, openWeb]
    risks:
      - riskRogueActions
    sources:
      - title: "Google’s Gemini AI hacks 3 companies in security test, then stops"
        url: https://www.aljazeera.com/news/2026/9/19/googles-gemini-ai-hacks-3-companies-in-security-test-then-stops
        publisher: Al Jazeera
        date: 2026-09-19
  - n: 3
    title: Other companies' leaked credentials
    phase: exposed
    narrative: >
      In two more runs the model searched the web for the company's name, found credentials for
      other companies in public repositories, and used them to log in to those companies'
      systems. Google's account: the model "found public information online and guessed
      credentials to access websites it thought were part of the test".
    path: [harness->inference, localTools, openWeb]
    risks:
      - riskRogueActions
      - riskSensitiveDataDisclosure
    sources:
      - title: "Google confirms Gemini AI breached three firms"
        url: https://www.securityweek.com/google-confirms-gemini-ai-breached-three-firms/
        publisher: SecurityWeek
        date: 2026-09-21
  - n: 4
    title: The model stopped; the disclosure waited
    phase: exposed
    narrative: >
      Each time, Google says, the model recognised it had reached a real company and ended the
      intrusion. Irregular told Google at the end of July; Google notified federal authorities
      and the three companies, which it has not named, but went public only after the Wall
      Street Journal asked in September. It compared the episode to a bug bounty. Irregular says
      its own issues were fixed weeks earlier.
    path: [harness, orchestrator, govObservability]
    sources:
      - title: "Google confirms Gemini AI breached three firms"
        url: https://www.securityweek.com/google-confirms-gemini-ai-breached-three-firms/
        publisher: SecurityWeek
        date: 2026-09-21
  - n: 5
    title: Where this chain breaks
    phase: mitigated
    narrative: >
      An evaluation that may only touch fictional targets needs a network that can only reach
      them: an enumerated host list, and isolation tested before each run — by trying to break
      it — rather than assumed. Scope belongs in that network, matched by address, not in the
      model's judgement of a name. And someone has to watch the run as it happens — that the
      model stopped itself is good news, not a control.
    path: [sandbox, localTools, govPolicy, govSupplyChain, govObservability]
    sources:
      - title: "Google confirms Gemini AI breached three firms"
        url: https://www.securityweek.com/google-confirms-gemini-ai-breached-three-firms/
        publisher: SecurityWeek
        date: 2026-09-21
