      - mitigation: cap-agent-tracing
        coverage: native
        mechanism: >-
          Action Recording (Enterprise, off by default) exported through Team Settings → OpenTelemetry Export as
          the grok_bot_agent_actions family, tagged cursor.surface=grok_bot; opt-in conversation content
        steps:
          - title: Turn on Action Recording
            body:
              - Turn Action Recording on in the Grok Bot page of the dashboard (or actionRecording true through
                /grok-bot/capabilities); it is off by default and Privacy Mode (Legacy) forces it off.
            url: https://cursor.com/docs/grok-bot/teams
          - title: Export the per-step trace
            body:
              - In Team Settings → OpenTelemetry Export keep the grok_bot_agent_actions and model_usage families
                on, and join rows on cursor.grok_bot.turn.id, tool_call.id and decision.id, ordered by
                event.sequence.
            url: https://cursor.com/docs/enterprise/opentelemetry-export
          - title: Add prompts and responses
            body:
              - Turn on Allow conversation content export for the team and Conversation content on the
                destination to add scrubbed user prompts and final assistant responses.
            url: https://cursor.com/docs/enterprise/opentelemetry-export
          - title: Stream control-plane events
            body:
              - Filter the Audit Log by the Grok Bot application and stream it to your SIEM for Bot, routine,
                Team Setup and computer changes.
            url: https://cursor.com/docs/enterprise/compliance-and-monitoring
        note: >-
