      - mitigation: AML.M0031
        coverage: partial
        verified: "2026-09-10"
        mechanism: >-
          desktopSessionCleanupPeriodDays for local transcripts; cloud sessions deletable by users; Compliance
          API retention follows custom periods; skills and memory managed in Customize
        steps:
          - title: Bound local transcripts
            body:
              - Set desktopSessionCleanupPeriodDays in managed settings; Desktop and Cowork transcripts are
                otherwise exempt from cleanupPeriodDays.
            url: https://code.claude.com/docs/en/settings-reference
          - title: Append organisation instructions
            body:
              - Set organizationInstructions in the com.anthropic.claudefordesktop profile or
                HKLM\SOFTWARE\Policies\Claude; the docs state it is guidance the model follows, not an
                enforced control.
            url: https://claude.com/docs/third-party/claude-desktop/configuration
          - title: Lock instruction sources to admin-provisioned plugins
            body:
              - Set skillCreationEnabled, userPluginMarketplacesEnabled and userPluginUploadsEnabled false and
                deliver skills and hooks through allowedPluginMarketplaces or org-plugins/ so only reviewed
                instructions load.
            url: https://claude.com/docs/third-party/claude-desktop/extensions
          - title: Scan skills and plugins (Enterprise)
            body:
              - Turn on skill scanning so skills and plugins are checked for malicious content; classifiers
                separately flag injections in untrusted content entering context.
            url: https://support.claude.com/en/articles/13364135-use-claude-cowork-safely
        evidence: []
        note: >-
          Retention only: cleanup periods and deletion bound how long transcripts and memory persist. Nothing
          validates memory writes or restores a known-good state.


