  - id: agentPlatformVendorReview
    name: "Agent Platform assurance review (launch stages, security controls and data residency)"
    where: "Your third-party risk process, before rollout and on a schedule, using Google's security controls, data residency and release notes pages"
    setVia: [adminConsole]
    area: sharing
    recommended: "Record each feature's launch stage (Managed Agents API, revisions, ReasoningEngine custom constraints and the gateway's Cloud Trace integration are Preview), which tools lack VPC-SC or CMEK, and that global endpoints give no residency."
    value: "Launch stages, control gaps and residency recorded"
    why: "The runtime sits in a Google tenant you cannot inspect, and Pre-GA features carry separate terms. Access Transparency lists Agent Runtime as supported, but not Agent Gateway or Grounding with Google Search."
    mitigations: [cap-ai-vendor-assessment]
