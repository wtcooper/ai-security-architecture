    # >>> hosting options (compared against the vendor's pages; one is the mapping itself)
    hosting:
      - id: agentCoreRuntime
        kind: runtime
        name: "Amazon Bedrock AgentCore Runtime"
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agents-tools-runtime.html
        asOf: "2026-11"
        mapped: true
        compare:
          runs: "AWS creates a dedicated microVM for each session and terminates it when the session ends; the microVM isolates one run from another."
          patching: "AWS patches the OS kernel, and language runtimes for direct code deployments; you rebuild container images from a patched base image."
          data: "Code, files and results live in the session microVM in the Region and are destroyed with it unless a persistent file system is configured."
          network: "PUBLIC or VPC network mode; in VPC mode outbound traffic leaves through network interfaces in your subnets under your security groups."
          identity: "The runtime's IAM execution role, whose credentials code in a session obtains from the microVM metadata service."
          accepts: "ARM64 container images up to 2 GB, or 10 GB on platform version V2, or direct code packages; shell commands run through the API."
          workload: "Sessions last up to 8 hours and end after 15 idle minutes by default; 5,000 active sessions per account in two US Regions, 2,500 elsewhere."
          portability: "The sandbox image is a standard container; session creation, command execution and stop calls are AgentCore APIs."
          effort: "Your team owns the sandbox image, execution role, VPC egress controls and quota requests; AWS operates microVM capacity and isolation."
          fits: "AWS presents Runtime for hosting agents and tools that need session isolation, with each session in its own microVM."
        sources:
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agents-tools-runtime.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-how-it-works.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-sessions.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-lifecycle-settings.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-security-best-practices.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-vpc.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/bedrock-agentcore-limits.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-permissions.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-shell-execution.html
      - id: eks
        kind: cluster
        name: "Amazon EKS isolated pods (Nitro Sandboxes)"
        url: https://docs.aws.amazon.com/eks/latest/userguide/sandboxing.html
        asOf: "2026-11"
        compare:
          runs: "You create and delete a pod per run through the Kubernetes API; with runtimeClassName isolated-sandbox each pod runs in its own Firecracker microVM."
          patching: "AWS patches the control plane and, on EKS Auto Mode, the nodes; on your own node groups you update GPU AMIs and drivers. Operators and training images are yours."
          data: "Code, files and results stay in the pod's sandbox on EC2 nodes in your account, on scratch disk or on EBS and EFS volumes you attach."
          network: "Network policies and security groups are enforced on the node, outside the sandbox; an annotation removes the pod's network device entirely."
          identity: "A Kubernetes service account mapped to an IAM role through EKS Pod Identity, served inside the sandbox; IMDS returns no IAM credentials."
          accepts: "Standard container images with no code changes; GPU and device passthrough, host networking and user namespaces are not supported."
          workload: "No session limit, but Auto Mode replaces nodes within 21 days; a node holds at most 5 sandboxes per vCPU, and AWS's blueprint reports a pod Ready in about 5 seconds."
          portability: "Pods are standard Kubernetes resources and images; the isolated-sandbox runtime class and its annotations exist only on Amazon EKS."
          effort: "Your team operates the cluster, sandbox lifecycle controller, warm pools, egress policy and enough node capacity for peak parallel runs."
          fits: "AWS presents isolated pods for running untrusted container images where the node and other pods must be protected from a compromised pod."
        sources:
          - https://docs.aws.amazon.com/eks/latest/userguide/sandboxing.html
          - https://docs.aws.amazon.com/eks/latest/userguide/sandboxing-isolated-setup.html
          - https://docs.aws.amazon.com/eks/latest/userguide/sandboxing-limitations.html
          - https://docs.aws.amazon.com/eks/latest/userguide/sandboxing-network-isolation.html
          - https://docs.aws.amazon.com/eks/latest/userguide/sandboxing-metadata-credentials.html
          - https://docs.aws.amazon.com/eks/latest/userguide/sandboxing-security-model.html
          - https://docs.aws.amazon.com/eks/latest/userguide/sandboxing-storage.html
          - https://docs.aws.amazon.com/eks/latest/userguide/sandboxing-observability.html
          - https://docs.aws.amazon.com/eks/latest/userguide/sandboxing-resource-isolation.html
          - https://docs.aws.amazon.com/eks/latest/userguide/automode.html
          - https://docs.aws.amazon.com/eks/latest/userguide/security.html
          - https://awslabs.github.io/ai-on-eks/docs/infra/agents/agent-sandbox
        summary: "Each rollout runs in its own pod on Amazon EKS with runtimeClassName isolated-sandbox, so the pod gets a Nitro Sandbox, a Firecracker microVM with its own kernel. AWS's blueprint manages the pods with the kubernetes-sigs agent-sandbox controller and warm pools. You now carry what Runtime sessions did: creating and deleting sandboxes, time budgets, node capacity, egress filtering on the node, per-run identity and who may write a pod spec. The default pod runtime still shares the node kernel."
        bindings:
          - { block: sandbox, service: "Isolated pod on Amazon EKS (Nitro Sandbox)", note: "One pod per rollout with runtimeClassName isolated-sandbox, on EKS Auto Mode or node groups with the Nitro Sandbox AMI. Something must create and delete each pod: for example the kubernetes-sigs agent-sandbox controller with a SandboxTemplate and warm pool, as in AWS's blueprint.", url: https://docs.aws.amazon.com/eks/latest/userguide/sandboxing.html }
          - { block: harness, service: "Your episode loop in the pod", build: true, note: "The orchestrator starts it by creating the pod or a SandboxClaim and reads the trajectory over the pod network, kubectl exec or logs.", url: https://awslabs.github.io/ai-on-eks/docs/infra/agents/agent-sandbox, watch: [{ text: "Amazon GuardDuty's runtime agent cannot observe activity inside a Nitro Sandbox; the CloudWatch Observability agent still collects container logs and metrics, and kubectl logs works, so trajectories are recorded from the orchestrator side.", url: "https://docs.aws.amazon.com/eks/latest/userguide/sandboxing-observability.html" }] }
          - { block: localTools, service: "Pod shell and files; AgentCore Browser", note: "Shell and files are inside the sandboxed pod. The browser stays a separate AgentCore Browser session in VPC mode, driven through the AgentCore API with the pod's role.", url: https://docs.aws.amazon.com/eks/latest/userguide/sandboxing-isolated-setup.html }
        dropSettings: [runtimeExecutionRole, runtimeIsolatedSessions, runtimeVpcMode, runtimeStopSession]
        addSettings: [eksIsolatedPods, eksAppNetworkPolicy, eksNetworkPolicy, eksAgentQuarantine, eksControlPlaneLogs, eksPrivateEndpoint, eksImdsHopLimit, eksClusterAccessEntries, eksSandboxNodes, eksSandboxNetworkIsolated, eksSandboxPodSpecRbac]
        alsoNeeded:
          - service: "kubernetes-sigs agent-sandbox controller"
            role: other
            why: "Manages Sandbox, SandboxTemplate, SandboxWarmPool and SandboxClaim resources in AWS's blueprint, in place of Runtime's session lifecycle."
            url: https://awslabs.github.io/ai-on-eks/docs/infra/agents/agent-sandbox
          - service: "EKS Auto Mode or Karpenter node pools"
            role: other
            why: "Supply and scale the sandbox-capable nodes; Runtime supplied microVM capacity on demand."
            url: https://docs.aws.amazon.com/eks/latest/userguide/sandboxing-isolated-setup.html
          - service: "ApplicationNetworkPolicy (Auto Mode) or Cilium FQDN filtering"
            role: network
            why: "Limits each rollout's egress to approved destinations; AWS's blueprint ships egress enforcement as a separate example."
            url: https://awslabs.github.io/ai-on-eks/docs/infra/agents/agent-sandbox
          - service: "Amazon CloudWatch Observability agent"
            role: logging
            why: "Collects container logs and metrics from sandboxed pods through the standard kubelet location."
            url: https://docs.aws.amazon.com/eks/latest/userguide/sandboxing-observability.html
        quickstart:
          - title: "Sandboxing on Amazon EKS with isolated and confidential pods"
            url: https://docs.aws.amazon.com/eks/latest/userguide/sandboxing.html
          - title: "Run a pod in isolated mode"
            url: https://docs.aws.amazon.com/eks/latest/userguide/sandboxing-isolated-setup.html
          - title: "AI on EKS: Agent Sandbox on EKS"
            url: https://awslabs.github.io/ai-on-eks/docs/infra/agents/agent-sandbox
      - id: lambdaMicroVms
        kind: runtime
        name: "AWS Lambda MicroVMs"
        url: https://docs.aws.amazon.com/lambda/latest/dg/lambda-microvms-guide.html
        asOf: "2026-11"
        compare:
          runs: "Your orchestrator calls run-microvm and terminate-microvm; Lambda runs each sandbox as its own Firecracker microVM restored from a snapshot."
          patching: "Lambda publishes patched base images on a deprecation schedule; you rebuild your MicroVM images on each new base version."
          data: "Code, files and results live in the MicroVM's memory and disk in the Region, are kept across suspension and released on termination."
          network: "Outbound traffic has public internet access by default or goes through a VPC egress connector; inbound is token-authenticated HTTPS or none."
          identity: "An optional IAM execution role that Lambda uses at run time; without one the MicroVM cannot reach other AWS services or write logs."
          accepts: "A Dockerfile built on a Lambda-managed Amazon Linux 2023 base image, for ARM64 or x86_64, with full operating system capabilities."
          workload: "A MicroVM lives at most 8 hours, starts from a snapshot and can suspend when idle keeping memory and disk; an account memory quota caps parallel runs."
          portability: "Images are built from a standard Dockerfile; the lifecycle hooks, network connectors, auth tokens and run API are Lambda-specific."
          effort: "Your team owns image builds, lifecycle hooks, the VPC egress connector and quota requests; AWS operates capacity and isolation."
          fits: "AWS lists AI code execution sandboxes and reinforcement learning environments, with a fresh environment per run, among its typical use cases."
        sources:
          - https://docs.aws.amazon.com/lambda/latest/dg/lambda-microvms-guide.html
          - https://docs.aws.amazon.com/lambda/latest/dg/microvms-how-it-works.html
          - https://docs.aws.amazon.com/lambda/latest/dg/microvms-images.html
          - https://docs.aws.amazon.com/lambda/latest/dg/microvms-launching.html
          - https://docs.aws.amazon.com/lambda/latest/dg/microvms-networking.html
          - https://docs.aws.amazon.com/lambda/latest/dg/microvms-security.html
          - https://docs.aws.amazon.com/lambda/latest/dg/microvms-best-practices.html
          - https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html
        summary: "Each rollout runs in its own AWS Lambda MicroVM, a Firecracker microVM that Lambda restores from a snapshot of your image when the orchestrator calls run-microvm and releases on terminate-microvm. Lambda still operates capacity and isolation. What changes: you build the image from a Dockerfile, egress is the public internet until you attach a VPC egress connector, access is by port-scoped tokens instead of the AgentCore API, and idle sandboxes suspend with their state rather than end."
        bindings:
          - { block: sandbox, service: "AWS Lambda MicroVM (one per rollout)", note: "Run from a versioned MicroVM image with a VPC egress network connector on the sandbox subnets and --maximum-duration-in-seconds set to the task budget.", url: https://docs.aws.amazon.com/lambda/latest/dg/lambda-microvms-guide.html, watch: [{ text: "Parallel MicroVMs are capped by the memory allocated in an account and Region, 800 GB by default and 2,048 GB in some Regions, and a MicroVM lasts at most 8 hours, suspended time included.", url: "https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html" }] }
          - { block: harness, service: "Your episode loop in the MicroVM", build: true, note: "Started by the /run lifecycle hook with a payload of up to 16 KB, or called on the MicroVM's HTTPS endpoint with a port-scoped auth token.", url: https://docs.aws.amazon.com/lambda/latest/dg/microvms-launching.html }
          - { block: localTools, service: "MicroVM shell and files; AgentCore Browser", note: "Shell and files are inside the MicroVM, which has full operating system capabilities. The browser stays a separate AgentCore Browser session in VPC mode.", url: https://docs.aws.amazon.com/lambda/latest/dg/microvms-how-it-works.html }
        dropSettings: [runtimeExecutionRole, runtimeIsolatedSessions, runtimeVpcMode, runtimeStopSession]
        addSettings: [microVmPerRollout, microVmVpcEgress, microVmExecutionRole, microVmIngressTokens, microVmTerminate]
        alsoNeeded:
          - service: "Amazon S3 bucket for MicroVM image sources"
            role: registry
            why: "Lambda builds each image from a zip of your Dockerfile and artefacts uploaded to S3, in place of an ECR image."
            url: https://docs.aws.amazon.com/lambda/latest/dg/microvms-how-it-works.html
          - service: "Lambda network connector and its operator role"
            role: network
            why: "Routes MicroVM egress through your VPC; Runtime's VPC mode did this from the runtime's own configuration."
            url: https://docs.aws.amazon.com/lambda/latest/dg/microvms-networking.html
          - service: "Build role and execution role"
            role: identity
            why: "Without them Lambda writes no build or runtime logs to CloudWatch and the MicroVM cannot reach AWS services."
            url: https://docs.aws.amazon.com/lambda/latest/dg/microvms-security.html
        quickstart:
          - title: "AWS Lambda MicroVMs"
            url: https://docs.aws.amazon.com/lambda/latest/dg/lambda-microvms-guide.html
          - title: "Running and using MicroVMs"
            url: https://docs.aws.amazon.com/lambda/latest/dg/microvms-launching.html
          - title: "Networking"
            url: https://docs.aws.amazon.com/lambda/latest/dg/microvms-networking.html
      - id: agentCoreCodeInterpreter
        kind: managed
        name: "Amazon Bedrock AgentCore Code Interpreter"
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/code-interpreter-tool.html
        asOf: "2026-11"
        compare:
          runs: "AWS creates and tears down each session and supplies its runtime; each session runs in a dedicated microVM."
          patching: "AWS maintains the pre-built runtimes and their pre-installed libraries; you have no image to build or patch."
          data: "Code and files live in the session and are cleaned up when it ends; session data has a 30-day retention policy."
          network: "Sandbox mode allows limited access to AWS services such as Amazon S3; Public mode reaches the internet; VPC mode connects to your VPC."
          identity: "A custom code interpreter takes an IAM execution role that defines which AWS resources code in its sessions can reach."
          accepts: "Pre-built runtimes for Python, JavaScript and TypeScript with common libraries; inline files up to 100 MB and S3 files up to 5 GB."
          workload: "Sessions default to 15 minutes and extend to 8 hours, with 2 vCPU, 8 GB memory and 10 GB disk; 1,000 concurrent sessions per account by default."
          portability: "Code runs as ordinary Python, JavaScript or TypeScript; session start, code execution and stop calls are AgentCore APIs."
          effort: "Your team configures the network mode, execution role and session timeouts; AWS operates the runtimes, capacity and isolation."
          fits: "AWS presents it for agents that must execute generated code and analyse data in a sandbox with pre-built runtimes."
        sources:
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/code-interpreter-tool.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/code-interpreter-session-characteristics.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/code-interpreter-resource-management.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/code-interpreter-resource-session-management.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/code-interpreter-s3-integration.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/bedrock-agentcore-limits.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-vpc.html
        offers:
          - name: "Pre-built code runtimes"
            what: "A fully managed default mode with pre-built runtimes for Python, JavaScript and TypeScript and common libraries pre-installed."
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/code-interpreter-tool.html
          - name: "Isolated sessions"
            what: "Each tool session runs in a dedicated microVM with isolated CPU, memory and file system; the microVM is terminated and its memory sanitised when the session completes."
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/code-interpreter-session-characteristics.html
          - name: "Network settings"
            what: "Custom code interpreters choose Sandbox mode (limited access to AWS services such as Amazon S3), Public network mode or VPC mode."
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/code-interpreter-resource-management.html
          - name: "Session timeout"
            what: "Sessions end after 900 seconds by default; the timeout is set when a session starts and can be up to 8 hours."
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/code-interpreter-session-characteristics.html
          - name: "File operations and Amazon S3"
            what: "Files up to 100 MB are uploaded inline, and terminal commands under an execution role move files of up to 5 GB to and from Amazon S3."
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/code-interpreter-tool.html
          - name: "Session resources and quotas"
            what: "Each session has 2 vCPU, 8 GB of memory and 10 GB of disk; an account has 1,000 concurrent active sessions by default, adjustable by support request."
