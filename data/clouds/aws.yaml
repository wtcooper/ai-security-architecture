  # >>> managed agent service mapping (checked against the vendor's pages by two people)
  - architecture: archCloudManagedAgent
    asOf: "2026-11"
    verified: "2026-11-18"
    reference:
      - title: "AWS Security Reference Architecture for generative AI: Capability 5, secure access, usage and implementation of generative AI agents"
        url: https://docs.aws.amazon.com/prescriptive-guidance/latest/security-reference-architecture-generative-ai/gen-auto-agents.html
    summary:
      - "On AWS the managed runtime is the AgentCore harness: AWS runs the agent loop in a microVM per session on AgentCore Runtime, under an IAM execution role you own. Your application invokes it with IAM or a user JWT through AgentCore interface VPC endpoints. Tools sit behind AgentCore Gateway with Policy in AgentCore, and state sits in AgentCore Memory under your KMS key. Service control policies, AWS Config rules, CloudTrail and CloudWatch give the floor and the record."
    bindings:
      - block: entry
        service: "Your app behind ALB or API Gateway, on its IAM role"
        build: true
        note: "Signs users in, then calls InvokeHarness through the bedrock-agentcore interface endpoint with SigV4 on its own role, or forwards the user's JWT to a harness with a JWT authoriser."
        options:
          - { name: "Your app behind ALB or API Gateway, on its IAM role", kind: commercial, url: "https://aws.amazon.com/blogs/security/securely-exposing-amazon-bedrock-agentcore-runtime/", packs: [awsNative] }
          - { name: "Application Load Balancer with authenticate-cognito or authenticate-oidc, plus AWS WAF", kind: commercial, url: "https://docs.aws.amazon.com/elasticloadbalancing/latest/application/listener-authenticate-users.html", note: "The load balancer signs users in through a Cognito user pool or any OIDC IdP before a request reaches your code; today's mapping." }
          - { name: "Amazon API Gateway with a Cognito user pool or JWT authorizer", kind: commercial, url: "https://docs.aws.amazon.com/apigateway/latest/developerguide/http-api-jwt-authorizer.html", note: "The API checks the user's token itself: Cognito authorizers on REST APIs, JWT authorizers on HTTP APIs, before the integration runs." }
          - { name: "Amazon CloudFront and API Gateway with Cognito (Generative AI Application Builder)", kind: commercial, url: "https://docs.aws.amazon.com/solutions/generative-ai-application-builder-on-aws/", note: "AWS's reference solution: web UI on CloudFront and S3, a WebSocket API whose Lambda authorizer maps the user's Cognito group to an IAM policy." }
      - { block: agentDef, service: "Harness configuration (CreateHarness, harness.yaml)", build: true, note: "Model, system prompt, tools, allowedTools, memory, limits, network mode and execution role, held in source control and deployed by your pipeline with the AgentCore CLI or the control API." }
      - { block: memory, service: "AgentCore Memory, plus EFS or S3 Files mounts", note: "Conversations and long-term records sit in an AgentCore Memory resource in your account under your KMS key. Files persist on EFS or S3 Files access points that you own." }
      - block: aiGateway
        service: "AgentCore Gateway with Policy in AgentCore"
        note: "An AWS-run MCP gateway that is a resource in your account: IAM or JWT inbound, a Cedar policy engine, guardrails, Lambda interceptors and CloudTrail data events."
        options:
          - { name: "AgentCore Gateway with Policy in AgentCore", kind: commercial, url: "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-tools.html", note: "Referenced by ARN; every tool on the gateway becomes available under its policy; today's mapping.", packs: [awsNative], watch: [{ text: "Supports PrivateLink ingress and VPC Lattice egress but keeps a public endpoint active, so access rests on the authorizer, a resource-based policy with aws:SourceVpce and AWS WAF.", url: "https://aws.amazon.com/blogs/security/securely-exposing-amazon-bedrock-agentcore-runtime/" }] }
          - { name: "Kong AI MCP Proxy as a remote MCP server", kind: commercial, url: "https://developer.konghq.com/plugins/ai-mcp-proxy/", note: "The harness connects to any remote MCP endpoint by URL, so a commercial gateway can carry the tool policy.", packs: [kongAiGateway] }
          - { name: "MCP Gateway & Registry as a remote MCP server", kind: open, url: "https://agentic-community.github.io/mcp-gateway-registry/", note: "An open-source gateway named in the harness by URL, with OAuth against your IdP.", packs: [awsEksOpenSource] }
      - { block: internalTools, service: "Lambda, API Gateway and private MCP servers", build: true, note: "Gateway targets: Lambda functions, API Gateway stages, and OpenAPI or MCP servers in your VPC reached over VPC Lattice private endpoints." }
      - { block: orgData, service: "Bedrock Knowledge Bases, S3 and your databases", note: "Systems of record behind the tools. A Managed Knowledge Base is a built-in gateway connector with ACL-aware retrieval; a customer-managed one keeps the vector store in your account." }
      - { block: managedRuntime, service: "AgentCore harness (on AgentCore Runtime)", note: "AWS runs the Strands-based loop in a Firecracker microVM per session and calls the model on the execution role you supply. Generally available.", watch: [{ text: "A harness takes one inbound type: with SigV4 it carries no per-user identity into downstream tool calls, and with a JWT authorizer there is no IAM principal, so the endpoint policy allows Principal * and the network path becomes the gate.", url: "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-security.html" }] }
      - { block: nativeTools, service: "Harness built-ins, Code Interpreter, Browser", note: "Shell and file tools run inside the session microVM; AWS does not state where web_fetch or subagent run. Code Interpreter and Browser are separate resources, each with its own network mode." }
      - { block: vendorTools, service: "Remote MCP servers and gateway connectors", note: "remote_mcp servers named in the harness, called from the session microVM, and AWS connectors on the gateway such as Web Search Tool, Web Answer and integration templates." }
      - block: openWeb
        service: "Web Search Tool index and pages via web_fetch"
        note: "Web search is a gateway connector answered from an Amazon-operated index inside AWS. web_fetch and Browser reach live pages through the network mode you set."
        options:
          - { name: "Web Search Tool index and pages via web_fetch", kind: commercial, url: "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-connector-web-search-tool.html", packs: [awsNative] }
          - { name: "AgentCore Web Search Tool connector", kind: commercial, url: "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-connector-web-search-tool.html", note: "Answered from an Amazon-operated index inside AWS; target-level domain include and exclude lists." }
          - { name: "AgentCore Web Answer connector", kind: commercial, url: "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-tools.html", note: "Cited answers to questions that need current web information, as a gateway tool; us-east-1 only." }
          - { name: "Exa hosted MCP server", kind: commercial, url: "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-tools.html", note: "AWS's harness examples attach Exa's remote MCP endpoint with an API key from the token vault." }
          - { name: "Brave Search integration template", kind: commercial, url: "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-integrations.html", note: "AgentCore Gateway template calling Brave's API with your key; today's mapping." }
    sources:
      entry: https://aws.amazon.com/blogs/security/securely-exposing-amazon-bedrock-agentcore-runtime/
      agentDef: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-models.html
      memory: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-memory.html
      aiGateway: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway.html
      internalTools: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-vpc-egress.html
      orgData: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base.html
      managedRuntime: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness.html
      nativeTools: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-tools.html
      vendorTools: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-connectors.html
      openWeb: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-connector-web-search-tool.html
    differences:
      - at: nativeTools->openWeb
        text: "Web search is not a native tool here: it is the Web Search Tool connector behind your gateway, so gateway policy and CloudTrail apply and an Amazon index answers inside AWS. AgentCore Browser reaches live pages on its own network mode, PUBLIC by default, and the web_fetch path is undocumented, so site lists at the network level need a firewall."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-connector-web-search-tool.html
    alsoNeeded:
      - service: "AWS IAM"
        role: identity
        why: "Holds the application role that may invoke, the pipeline role that may deploy and one execution role per harness."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/security_iam_service-with-iam.html
      - service: "Amazon Cognito or your OIDC identity provider"
        role: identity
        why: "Issues the user JWT that the harness and gateway authorisers validate when sessions must carry the signed-in user."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/inbound-jwt-authorizer.html
      - service: "AWS PrivateLink (interface VPC endpoints)"
        role: network
        why: "Private path to the AgentCore data plane, control plane and gateway, and to ECR, S3, CloudWatch Logs and Bedrock for a harness in VPC mode."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/vpc-interface-endpoints.html
      - service: "Amazon VPC Lattice"
        role: network
        why: "Carries gateway calls to MCP servers and APIs inside your VPC through a managed or self-managed resource gateway."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/vpc-egress-private-endpoints.html
      - service: "AWS Network Firewall and Route 53 Resolver DNS Firewall"
        role: network
        why: "why: Limits a VPC-mode harness, Browser or Code Interpreter to named internet domains at network level; AgentCore's own controls are browser-level only (Chromium enterprise policies and proxies on a custom Browser)."
        url: https://aws.amazon.com/blogs/machine-learning/control-which-domains-your-ai-agents-can-access/
      - service: "Application Load Balancer or API Gateway with AWS WAF"
        role: ingress
        why: "Your front door: signs users in, filters requests and relays them to the harness through the interface endpoint."
        url: https://aws.amazon.com/blogs/security/securely-exposing-amazon-bedrock-agentcore-runtime/
      - service: "AWS KMS"
        role: keys
        why: "Customer managed keys for AgentCore Memory, the gateway, the Identity token vault, log groups and the file systems you mount."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/storage-encryption.html
      - service: "AWS Secrets Manager"
        role: secrets
        why: "Holds credential provider client secrets for AgentCore Identity, under your key where configured."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/identity-data-encryption.html
      - service: "Amazon ECR"
        role: registry
        why: "A VPC-mode harness pulls its managed container from a private ECR repository at session start; custom environments are your own images."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-security.html
      - service: "AWS Agent Registry"
        role: registry
        why: "why: Catalogue of agents, tools, skills and MCP servers; its approval workflow decides which records are discoverable. It does not block deployment of an unlisted agent."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/registry.html
      - service: "AWS CloudTrail and Amazon CloudWatch (Transaction Search, X-Ray)"
        role: logging
        why: "Management and data events for harness calls, and the traces, logs and metrics every invocation emits, all in your account."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-operations.html
      - service: "AWS Organizations (service control policies)"
        role: other
        why: "Holds the deny rules a builder cannot lower: Regions, models, VPC mode, authoriser type and keys."
        url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
      - service: "AWS Config and Security Hub CSPM"
        role: other
        why: "Managed rules that flag public network mode, missing gateway authorisers and resources without a customer managed key."
        url: https://docs.aws.amazon.com/securityhub/latest/userguide/bedrockagentcore-controls.html
    quickstart:
      - title: "AgentCore harness: Get started"
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-get-started.html
      - title: "AgentCore harness: Security and access controls"
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-security.html
      - title: "Use interface VPC endpoints (AWS PrivateLink) with Amazon Bedrock AgentCore"
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/vpc-interface-endpoints.html
