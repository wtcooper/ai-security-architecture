# The Enable tab's first step, and the control catalogue's rows: every control sorted into the
# NIST CSF 2.0 category that owns it.
#
#   1. enterprise controls   the controls a pattern pins, under their CSF category, in CSF
#                            order (Govern, Identify, Protect, Detect, Respond, Recover)
#   2. tool settings         each product's (or cloud's) own settings, from data/tooling/ and
#                            data/clouds/, every row naming the controls it delivers
#
# `groups` is keyed by CSF category id. The category's name and function come from
# data/frameworks/nist-csf.yaml; only the blurb is written here, with an optional blurb per
# surface where the same category reads differently on a device than in a cloud. A group shows
# on a pattern when the pattern pins at least one of its controls.
#
# NIST publishes no mapping from CSF to MITRE D3FEND or ATLAS. Which category a control sits in
# is this repository's judgement, and the build copies it into the CSF crosswalk on the
# Frameworks page so the two can never disagree.
#
# `baseline` marks the controls every AI deployment needs, whatever the pattern: set up once,
# reused everywhere. They are tagged on their rows.
#
# The build fails unless every control in the catalogue sits in exactly one group, every group
# id is a CSF category, and every baseline control applies on every surface.
framework: nist-csf
# `plain` is the heading a reader sees on Enable: what the category is for, in everyday words.
# The CSF category's own name is shown beside it as the reference.
groups:
  - id: GV.SC
    plain: Check your suppliers
    blurb: >-
      Check each supplier, tool server, model, package and dataset before it is trusted, and
      keep the evidence that it is what it claims to be.
    mitigations:
      - cap-ai-vendor-assessment
      - cap-mcp-tool-integrity
      - AML.M0014
      - AML.M0013
      - AML.M0023
      - AML.M0025

  - id: ID.AM
    plain: Know what you have
    blurb: >-
      Know which AI is in use, sanctioned or not: every agent, tool server, model and data
      store has an owner and a record.
    mitigations: [cap-agent-tool-registry, cap-shadow-ai-discovery, cap-model-documentation, D3-DI, D3-AI, D3-CI]

  - id: ID.RA
    plain: Find the weak points first
    blurb: >-
      Find the weaknesses before an attacker does: threat-model the system, test the model,
      and scan what it runs on.
    mitigations: [cap-ai-threat-modeling, D3-ORA, AML.M0035, AML.M0008, D3-SYSVA, D3-AVE]

  - id: PR.AA
    plain: Control who and what gets in
    blurb: >-
      Every person, agent and workload signs in and holds only the access it needs; what an
      agent may do is decided by policy, enforced on every action, and approved by a person
      where it matters.
    mitigations:
      - D3-MFA
      - D3-APA
      - D3-AA
      - D3-CH
      - D3-CTS
      - D3-CR
      - D3-CRO
      - D3-TB
      - D3-AMED
      - D3-SCP
      - AML.M0028
      - cap-agent-action-policy-enforcement
      - AML.M0029
      - AML.M0030
      - AML.M0037

  - id: PR.DS
    plain: Protect the data
    blurb: >-
      Screen what goes into the model and what comes out, catch sensitive data before it
      leaves, let the AI reach only what its user is entitled to, and protect models and data
      where they are stored and sent.
    mitigations:
      - cap-input-guardrails
      - cap-output-guardrails
      - AML.M0020
      - AML.M0021
      - AML.M0033
      - cap-sensitive-data-redaction
      - cap-data-access-governance
      - cap-retrieval-grounding-checks
      - AML.M0031
      - AML.M0005
      - AML.M0012
      - AML.M0007
      - D3-MAN
      - D3-MENCR

  - id: PR.PS
    plain: Lock down what it runs on
    blurb: >-
      Contain what the AI executes and keep the platform it runs on hardened, current and
      released through a gate that can roll a change back.
    surfaces:
      surfaceEndpoint:
        blurb: >-
          Agents on managed devices act with the user's own files, shell and credentials, so
          the device has to contain what they run.
      surfaceCloud:
        blurb: >-
          Agents and models you operate need what any production service has: isolated
          execution, hardened hosts, and releases through a gate that can roll back.
      surfaceSaas:
        blurb: >-
          The vendor runs the agent, so the isolation is theirs to provide and yours to
          require and verify.
    mitigations:
      - D3-EI
      - D3-HBPI
      - D3-ACH
      - AML.M0011
      - D3-SU
      - cap-output-encoding
      - AML.M0003
      - AML.M0022
      - cap-staged-rollout-gate

  - id: PR.IR
    plain: Limit what it can reach and use
    blurb: >-
      Segment the network, allow-list where agents may connect, and cap how much a model or
      agent can be used or can consume.
    mitigations: [D3-NI, cap-agent-egress-control, D3-OTF, AML.M0004, AML.M0036]

  - id: DE.CM
    plain: Watch what it does
    blurb: >-
      Record what every agent did, end to end, and watch the processes, files and sessions
      it touches for signs of misuse.
    mitigations:
      - cap-agent-tracing
      - AML.M0024
      - AML.M0038
      - D3-PA
      - D3-FA
      - D3-SFA
      - D3-FIM
      - D3-DA
      - D3-RAPA
      - D3-WSAA

  - id: RS.MI
    plain: Be able to stop it
    blurb: >-
      Be able to stop an agent or model immediately and contain what it was holding.
    mitigations: [cap-agent-kill-switch, D3-PT]

  - id: RC.RP
    plain: Be able to recover
    blurb: >-
      Restore configuration, software and data to a known-good state after an incident.
    mitigations: [D3-RC, D3-RS, D3-RD]

baseline:
  - D3-MFA
  - D3-APA
  - D3-AA
  - D3-CH
  - D3-CTS
  - cap-input-guardrails
  - cap-sensitive-data-redaction
  - cap-agent-egress-control
  - AML.M0004
  - cap-agent-tool-registry
  - cap-shadow-ai-discovery
  - cap-ai-vendor-assessment
  - cap-agent-tracing
  - cap-agent-kill-switch
