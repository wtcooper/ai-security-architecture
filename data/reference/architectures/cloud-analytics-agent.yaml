id: archAnalyticsAgent
surface: surfaceCloud
title: Text-to-SQL analytics agent
abbrev: Analytics agent

summary:
  - >
    A natural-language interface over a data warehouse that generates and runs queries against
    live records. The semantic layer is the security control, the query runs as the asking user,
    and treating either as a convenience is the characteristic mistake.

description:
  - >
    This is the one archetype where the model composes executable code against production data
    as its normal mode of operation. Retrieval assistants read a pre-built index; this one
    writes a query and runs it. That makes the question not "what was indexed" but "what can be
    expressed" — and filtering generated SQL is not a viable control, because a language rich
    enough to be useful is rich enough to evade a filter. The semantic layer is the constraint
    instead: a curated set of tables, columns, joins and metrics the generator may reference,
    with row-level policy attached. What cannot be named cannot be queried.
  - >
    The second control is the execution identity. The query runs as the asking user, not as a
    service account with warehouse-wide read, so the platform's row-level security and column
    masking apply automatically and the access-control question becomes one the data platform
    already answers. A service account anywhere on the path turns every generated query into a
    potential entitlement bypass, and voids every other control on this page. The execution role
    is read-only, and the cost ceiling is per query, because a generated query can scan the
    warehouse and the person who asked did not know they were asking for that.
  - >
    Two quieter surfaces round out the archetype. Result rows re-enter the model for
    summarisation — which sends live records to the provider and carries customer-entered free
    text back into the model as context, making the warehouse itself an injection path. And
    aggregation has no clean preventive answer: a user entitled to aggregates can reconstruct
    individuals by asking enough narrow questions, each individually legitimate, so the
    realistic control is detective — query logging and pattern detection over a session.

distinguishedBy:
  - >
    Against the embedded retrieval assistant: that one retrieves from an index built earlier;
    this one composes a query against live data. The control moves from index-time permissions
    to the semantic layer and the execution identity.
  - >
    Against an AI-augmented API backend: both produce structured output consumed by code, but
    here the output is executed rather than validated and stored. Schema validation does not
    help when the schema is "a valid query".

exemplars:
  - name: Warehouse-native analytics agents
    note: >
      Natural-language querying built into a data platform, executing against a curated semantic
      model with the platform's own row-level security applied.
    asOf: "2026-08"
  - name: BI assistant layers
    note: >
      Conversational front ends over an existing BI semantic model, which is the best case: the
      constraint layer already exists and was built for a different reason.
    asOf: "2026-08"

blocks:
  - id: analyst
    kind: actor
    title: Analyst
    icon: person
    col: 0
    row: 1
    note: >
      Asks in natural language. Their entitlements should be the whole of what the answer can
      contain, which is only true if the query runs as them.

  - id: assistant
    kind: service
    title: Question interface
    col: 1
    row: 1
    cosaiComponent: componentApplication
    note: >
      The conversational surface, and the session every query is attributed to. The identity
      established here has to reach the execution engine intact.
    items:
      - id: chat
        label: Conversation UI
        icon: chat
        note: Where a question becomes a request, and the answer returns as prose.
      - id: session
        label: Session attribution
        icon: key
        note: Binds every generated query to the asking user — the identity the warehouse will enforce.

  - id: generation
    kind: service
    title: Query generation
    col: 2
    row: 1
    cosaiComponent: componentReasoningCore
    note: >
      Turns the question into a query, given the semantic layer's description of what exists,
      and turns result rows back into prose. Composes executable code against production data
      as its normal operation.
    items:
      - id: generator
        label: SQL generator
        icon: code
        note: Prompted with the curated schema and the question — never the full warehouse.
      - id: guard
        label: Constraint check
        icon: shield
        note: >
          Confirms the query references only the semantic layer, is read-only, and is bounded.
          A safety net over the constraint, not a filter — filtering a query language is a game
          the filter loses.
      - id: summariser
        label: Result summarisation
        icon: doc
        note: >
          Rows become prose here. Row content re-enters the model, which is the injection path
          that starts in a customer-entered field.

  - id: provider
    kind: provider
    title: Model provider
    col: 2
    row: 0
    cosaiComponent: componentModelServing
    note: >
      The published inference interface. It receives the schema description and the question,
      and later the result rows for summarisation — both directions carry data worth accounting
      for.
    items:
      - id: inference
        label: Inference API
        icon: model
        note: The generated query it returns is executable code from an unauthenticated content channel.

  - id: semanticLayer
    kind: service
    title: Semantic layer
    cosaiComponent: componentDataFilteringAndProcessing
    col: 3
    row: 1
    note: >
      The curated tables, joins, metrics and row policies the generator may reference — the
      security control of the archetype. What cannot be named cannot be queried, and adding a
      table here is granting access to it.
    items:
      - id: model
        label: Curated tables & metrics
        icon: doc
        note: The whole of what the generator is told exists. Curation is authorisation in disguise.
      - id: policies
        label: Row policies & masking
        icon: shield
        note: Attached here, enforced by the platform when the query runs as the user.
      - id: readOnly
        label: Read-only views
        icon: eye
        note: A generated write would be unrecoverable; the execution role cannot express one.

  - id: warehouse
    kind: service
    title: Warehouse & engine
    col: 4
    row: 1
    cosaiComponent: componentDataStorage
    note: >
      The execution engine and the live records, including everything outside the semantic layer
      that should stay unnameable. Most of this archetype's security is the data platform's
      existing machinery, used properly.
    items:
      - id: engine
        label: Query execution as the user
        icon: gear
        note: >
          Runs the query under the analyst's own identity, so row-level security and column
          masking apply without the application re-implementing them.
      - id: records
        label: Live records
        icon: db
        note: Production data, including free-text columns holding customer and partner input.
      - id: limits
        label: Scan & runtime limits
        icon: clock
        note: Per query, enforced by the platform — by the time the query runs, the cost is committed.

  - id: upstreamAuthors
    kind: actor
    title: Upstream authors
    icon: people
    col: 4
    row: 2
    note: >
      Customers and partners whose free text lands in warehouse columns. Their content is
      returned in results and summarised back into the model — the injection arrives through
      data collection, not through the assistant.

  - id: governance
    kind: governance
    title: Governance plane
    col: 5
    row: 0
    rowSpan: 3
    note: >
      Curation, identity propagation, aggregation monitoring and cost ceilings — the decisions
      that happen away from any single query.
    items:
      - id: curation
        label: Semantic-layer curation
        icon: gear
        note: >
          Deciding what is exposed and what stays out. A security review disguised as a
          data-modelling task, and usually staffed as the latter.
      - id: identity
        label: Identity & entitlements
        icon: key
        note: >
          Carries the analyst's identity through to execution. One substitution for a service
          account anywhere on the path voids the entire model.
      - id: aggWatch
        label: Aggregation monitoring
        icon: eye
        note: >
          Watching sequences of individually legitimate queries that together reconstruct
          individuals. Detective, because there is no preventive answer at query granularity.
      - id: costGuard
        label: Query cost ceiling
        icon: scale
        note: >
          Per-query scan and runtime limits. A generated query can scan the warehouse, and the
          person who asked did not know they were asking for that.

edges:
  - from: analyst
    to: assistant
    path: primary
    bidir: true
    label: question / answer
    note: >
      The identity established here has to reach the execution engine intact. Everything about
      this archetype's access control depends on that one property.
  - from: assistant
    to: generation
    path: primary
    bidir: true
    label: question / summary
    note: The question goes forward with its session identity; the summarised answer comes back.
  - from: generation
    to: provider
    path: primary
    bidir: true
    label: schema & question / generated SQL
    note: >
      The curated schema and question go out; executable code comes back from an unauthenticated
      content channel. Later, result rows make the same trip for summarisation — the leg most
      often left out of disclosure accounting.
  - from: generation
    to: semanticLayer
    path: primary
    bidir: true
    label: schema out / constrained query in
    note: >
      The layer describes only what the generator may use, and the generated query is checked
      against it before execution. Describing the full warehouse and hoping the model behaves is
      the failure this boundary exists to prevent.
  - from: semanticLayer
    to: warehouse
    path: primary
    bidir: true
    label: query as the asking user
    note: >
      Executed under the analyst's identity, so the platform's row-level security and column
      masking apply. A service account here turns every query into an entitlement bypass. The
      rows that return are exactly what the analyst was entitled to see.
  - from: upstreamAuthors
    to: warehouse
    path: primary
    label: free-text content
    note: >
      Customer-entered text lands in columns that will be returned and summarised. The injection
      arrives through data collection, long before any question is asked.
  - from: governance
    to: warehouse
    path: governance
    label: identity, audit & cost limits
    note: >
      Identity propagation, the per-session query log and the per-query cost ceiling are all
      enforced at the platform, where the query actually runs.

pins:
  risks:
    - risk: riskInsecureModelOutput
      at: generation
      note: >
        The model composes executable code against production data as its normal operation.
        The constraint check, not a SQL filter, is what stands between output and execution.
    - risk: riskAgenticDelegationConfusedDeputy
      at: semanticLayer->warehouse
      note: >
        The analyst's identity has to survive from the question to the engine. One substitution
        for a service account voids every other control on the page.
    - risk: riskPromptInjection
      at: upstreamAuthors->warehouse
      note: >
        The injection path starts in a customer-entered field and ends in an analyst's answer,
        via rows returned and summarised.
    - risk: riskPromptInjection
      at: generation->provider
      note: >
        Result rows re-enter the model at summarisation, carrying whatever free text the
        warehouse collected.
    - risk: riskSensitiveDataDisclosure
      at: generation->provider
      note: >
        Three disclosures ride this edge: what the schema reveals about the business, the
        question, and the live result rows sent for summarisation. Only the first is usually
        accounted for.
    - risk: riskExcessiveDataHandling
      at: semanticLayer
      note: >
        Adding a table to the semantic model is granting access to it. Treating curation as
        data modelling rather than authorisation is the characteristic mistake.
    - risk: riskInferredSensitiveData
      at: warehouse
      note: >
        A sequence of legitimate aggregate queries can reconstruct individuals. No single query
        is wrong, so the control is detective and operates over the session.
    - risk: riskEconomicDenialOfWallet
      at: warehouse
      note: >
        A generated query can scan the warehouse. The cost ceiling is per query, because by the
        time it is running the spend is committed.
    - risk: riskRogueActions
      at: semanticLayer->warehouse
      note: >
        A generated write would be unrecoverable. The execution role is read-only so the model
        cannot express one, whatever it generates.

  capabilities:
    - capability: capabilityDataAccessGovernance
      at: semanticLayer
      note: >
        Curate the semantic layer as an authorisation surface: what the generator may reference,
        with row policies attached. What cannot be named cannot be queried.
    - capability: capabilityIga
      at: semanticLayer->warehouse
      note: >
        Propagate the analyst's identity to execution so row-level security and column masking
        apply — the single most important control on the diagram.
    - capability: capabilityOutputEncoding
      at: generation
      note: >
        A constraint check on every generated query: references only the semantic layer,
        read-only, bounded. A verification of the boundary, not a SQL filter.
    - capability: capabilityRateLimiting
      at: warehouse
      note: >
        Per-query scan and runtime ceilings enforced by the platform, sized so one generated
        query cannot become a financial event.
    - capability: capabilityPromptInjectionDefense
      at: warehouse->semanticLayer
      note: >
        Classify returned row content before it re-enters the model for summarisation — the
        rows carry customer-entered text.
    - capability: capabilityAiDlp
      at: generation->provider
      note: >
        Redact result rows before they leave for summarisation; this leg sends live records to
        the provider and is frequently overlooked.
    - capability: capabilityAuditLogging
      at: governance
      note: >
        Log every generated query per session, attributed to the asking user — the record the
        aggregation analysis runs over.
    - capability: capabilityBehavioralDriftDetection
      at: governance
      note: >
        Detect aggregation patterns across a session — sequences of legitimate queries that
        together reconstruct individuals.
    - capability: capabilityDspm
      at: warehouse
      note: >
        Know where the sensitive columns are and whether masking covers them — the semantic
        layer's exclusions are only as good as the classification behind them.
    - capability: capabilityGroundednessChecking
      at: assistant
      note: >
        Check the summarised answer against the returned rows before it ships — the summary is
        the one artifact the analyst will actually read.

scenarios:
  - title: An analyst asks a question
    steps:
      - follow: analyst->assistant
        note: The question arrives; the session binds it to the analyst's identity.
      - follow: assistant->generation
        note: The question goes to the generator with that identity attached.
      - follow: semanticLayer->generation
        note: The generator is shown only the curated schema — the full warehouse stays unnameable.
      - follow: generation->provider
        note: Schema and question out; a generated query back, from an unauthenticated channel.
      - follow: generation->semanticLayer
        note: The constraint check confirms the query stays inside the layer, read-only and bounded.
      - follow: semanticLayer->warehouse
        note: The query runs as the analyst; row-level security and masking apply automatically.
      - follow: warehouse->semanticLayer
        note: The rows that return are exactly what the analyst was entitled to see.
      - follow: generation->provider
        note: Those rows make a second trip to the provider for summarisation.
      - follow: assistant->analyst
        note: The answer lands as prose, grounded in the returned rows.
  - title: An injection rides a customer record
    steps:
      - follow: upstreamAuthors->warehouse
        note: Hostile free text was collected months ago, through an ordinary application.
      - follow: warehouse->semanticLayer
        note: A legitimate query returns the row among thousands of others.
      - follow: semanticLayer->generation
        note: The row content heads for summarisation as untrusted context.
      - follow: generation->provider
        note: The hostile text enters the model alongside the instruction to summarise.
      - follow: assistant->analyst
        note: A steered summary is the payoff — unless row content was classified before the trip.
  - title: Aggregation reconstructs an individual
    steps:
      - follow: analyst->assistant
        note: A sequence of narrow, individually legitimate questions begins.
      - follow: semanticLayer->warehouse
        note: Each query passes every check — the entitlements genuinely allow it.
      - follow: governance->warehouse
        note: Session-level monitoring is the only control that can see the pattern.

sources:
  - title: "OWASP Top 10 for LLM Applications 2026 — LLM10 improper output handling, LLM02 sensitive information disclosure"
    url: https://genai.owasp.org/resource/owasp-genai-llm-top-10-2026/
  - title: "Databricks — AI security framework and agent guidance"
    url: https://docs.databricks.com/aws/en/lakehouse-architecture/well-architected
  - title: "Google Cloud — agentic AI for data science and analytics"
    url: https://docs.cloud.google.com/architecture/agentic-ai-data-science
  - title: "NIST AI 600-1 — generative AI profile, information security actions"
    url: https://www.nist.gov/itl/ai-risk-management-framework
