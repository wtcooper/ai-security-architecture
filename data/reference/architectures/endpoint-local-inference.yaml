id: archLocalInference
surface: surfaceEndpoint
rank: 4
title: Local model runtime
abbrev: Local runtime

summary:
  - >
    An open-weights model served on the user's own machine, listening on a local port so other
    local processes can call it. Chosen to keep data off a vendor's infrastructure, which succeeds
    — and moves every control the vendor was providing onto the device.

description:
  - >
    The reason people run this is sound: prompts and documents never leave the machine, there is
    no per-token cost, and it works offline. The architectural consequence is that the guardrails,
    rate limiting, abuse monitoring and content policy a hosted API applies on the way in and out
    are simply absent, and nothing replaces them by default. Guardrails here are a control the
    device owner deploys on the request path, not a component the runtime ships — in the common
    install nothing sits on that path, and raw model output goes straight back to the caller.
  - >
    The runtime is a local network service. It binds a port, speaks an HTTP API, and historically
    ships without authentication because the assumed caller is a process on the same machine. That
    assumption fails in two directions: any local process — including a browser tab, through a
    permissive CORS policy — can call it, and a runtime bound to a routable interface rather than
    loopback is reachable from the network. Who may bind the port and who may call it are the
    admission decisions of this architecture, and by default nobody makes them.
  - >
    The supply chain is the axis specific to this archetype. Weights are large binaries fetched
    from public hubs, and several serialization formats execute code on load — on that
    load-time-execution axis alone, a safe-by-construction tensor format from an unknown
    publisher beats a pickle-based one from a known publisher. It is one gate among several,
    not a ranking: format policy, publisher provenance, scanner results and behavioural
    evaluation are independent checks, and passing one buys nothing at the others.
    Safe-by-construction has limits of its own: the formats that cannot execute on load are
    still opened by fast-moving native parsers whose memory bugs are a code-execution class of
    their own, and one popular format embeds chat templates that execute at inference time,
    past every static scan. The target sequencing is fetch-to-quarantine: the artifact is
    acquired without being loaded, verified and scanned at rest, then promoted to approved
    local storage the runtime loads from — never fetched and opened in one step.
  - >
    The common install has no governance at all: no model inventory, no weight scanning
    pipeline, no policy on binding or sources. The target state adds exactly what this page's
    governance band draws — artifact assurance, inventory, evaluation and response — and every
    control named here presumes someone first learns the runtime exists, because it is
    installed by one person in an afternoon and appears in no inventory.

distinguishedBy:
  - >
    Against self-hosted inference in a datacentre: identical software, entirely different
    operational reality. There the runtime has a network policy, an identity, a scanner in the
    pipeline and someone on call. Here its port is protected by the assumption that nothing else
    on the machine is hostile.
  - >
    Against the other endpoint archetypes: this one is not an agent. It has no loop, no tools and
    no autonomy — it is a dependency the others consume. It earns its own architecture because its
    risks are supply chain and local exposure rather than agency.

exemplars:
  - name: Ollama
    note: >
      The flagship daemon of the class: pulls open weights by name, serves an
      OpenAI-compatible API on a local port with no authentication by default, and is the
      runtime the exposure scans keep finding on routable interfaces. Its cloud models and web
      search forward the prompt to the vendor through the same local API — "never leaves the
      machine" is a model-name suffix away from false.
    url: https://docs.ollama.com
    asOf: "2026-09"
  - name: vLLM
    note: >
      The serving stack of the cloud sibling, run on a workstation: loads hub repositories
      directly, and with remote code trusted executes the repository's own loader — the
      custom-code axis, distinct from the pickle one.
    url: https://docs.vllm.ai/en/latest/usage/security.html
    asOf: "2026-09"
  - name: llama.cpp server
    note: >
      The engine underneath much of the category, served directly: a native HTTP server over
      GGUF artifacts, whose fast-moving parser is its own memory-safety bug class.
    url: https://github.com/ggml-org/llama.cpp
    asOf: "2026-09"
  - name: LM Studio
    note: >
      The desktop-application shape: a GUI over the same engines with a local server mode a
      click away — the install that most reliably appears in no inventory.
    url: https://lmstudio.ai
    asOf: "2026-09"

zones:
  - id: zoneEndpoint
    owner: endpoint
    note: >
      The machine and everything the runtime puts on it: the local API, the process that loads
      the weights, and the artifacts on disk. The whole architecture lives here, which is why
      the one band that matters is the boundary around it.
  - id: zoneExternal
    owner: external
    note: >
      Outside the company: the public hubs the weights come from — and, when the bind is
      routable, whoever finds the port. The intended callers are all on the machine already;
      the drawn origin is the unintended class the exposure scans keep documenting.
  - id: zoneGovernance
    owner: governance
    note: >
      Sparse here by comparison with the agent architectures, and deliberately so — there is
      no gateway, no vendor and no identity on the data path, so what governance can do is
      decide which artifacts are allowed and notice the runtimes nobody registered.

blocks:
  - id: localApps
    kind: service
    title: Local applications
    icon: code
    zone: zoneEndpoint
    col: 0
    row: 1
    note: >
      Everything on the machine that can open a socket to the port. The consumers the runtime was
      installed for — editors, agents and tools calling the local API instead of a hosted one,
      usually built expecting a hosted API's safety floor — and the browser, which is local
      software too, and which a visited web page can drive through a permissive cross-origin
      policy. Nothing on the path tells the two apart.

  - id: api
    kind: service
    title: Inference API
    zone: zoneEndpoint
    col: 1
    row: 1
    cosaiComponent: componentModelServing
    note: >
      In the target state this is an authenticated policy wrapper: the raw runtime endpoint —
      unauthenticated by design in the flagship runtimes, whose vendors point at VPNs and
      reverse proxies rather than shipping auth — sits private behind it, and caller identity,
      per-caller ceilings and origin policy are enforced here. Which interface it binds and
      who may call it are this architecture's admission decisions, and exposure scans keep
      finding the installs that made neither.
    items:
      - id: endpoint
        label: Completion endpoint
        icon: plug
        note: The published local interface every consumer on the machine shares.
      - id: binding
        label: Interface binding
        icon: gear
        note: >
          Loopback is an assumption, not a policy. Bound to a routable interface, the runtime is
          reachable from the network.
      - id: cors
        label: Cross-origin policy
        icon: globe
        note: >
          Origin policy decides who may read a reply; a simple cross-origin POST is acted on
          regardless, and a DNS-rebinding page reads as well. The control is Host and Origin
          validation plus caller authentication, not CORS alone.

  - id: runtime
    kind: service
    title: Inference runtime
    zone: zoneEndpoint
    col: 2
    row: 1
    cosaiComponent: componentModelServing
    note: >
      Loads weights, batches requests, serves completions — from approved local storage only,
      never straight from a fetch. Whatever safety behaviour exists is whatever the weights
      carry.
    items:
      - id: loader
        label: Weight loader
        icon: gear
        note: >
          Where a pickle-based format turns file opening into code execution — and where a
          malformed file in a "safe" format exercises the native parser, a different bug class
          with the same outcome.
      - id: model
        label: Loaded model
        icon: model
        note: Open weights with no provider-side guardrail, abuse monitoring or content policy.

  - id: weights
    kind: external
    title: Storage
    zone: zoneEndpoint
    col: 2
    row: 2
    cosaiComponent: componentModelStorage
    note: >
      Quarantine and approved storage in one tier: artifacts land here on fetch, are scanned
      and verified at rest, and only promoted files are loadable. Format determines whether
      loading is deserialization or execution — a more useful question than who published
      them. Public base weights are not secret; the confidentiality case is the
      organisation's own fine-tunes and adapters stored beside them.
    items:
      - id: files
        label: Model files
        icon: db
        note: >
          Readable by any process with the user's privileges, and swappable by the same —
          including any org-tuned adapters, which are the part worth stealing.

  - id: govSupplyChain
    kind: governance
    title: Supply-chain assurance
    icon: db
    zone: zoneGovernance
    col: 1
    row: 4
    capabilities: [capabilityModelScanning, capabilityAiBom]
    note: >
      The whole governance story of this archetype, and the reason the scan sits in front of
      the fetch rather than after it: the runtime is the thing doing the fetching, and for
      several formats opening the file is the execution event.

  - id: govObservability
    kind: governance
    title: Observability & response
    icon: eye
    zone: zoneGovernance
    col: 2
    row: 4
    capabilities: [capabilityShadowAiDiscovery, capabilityAiGovernancePlatform, capabilityModelEvals]
    note: >
      Every control named on this page presumes someone first learns the runtime exists. It is
      installed by one person in an afternoon and appears in no inventory, so discovery is not
      a supporting control here — it is the precondition for all the others.

  - id: callers
    kind: origin
    title: Callers
    zone: zoneExternal
    col: 3
    row: 0
    note: >
      Deliberately unnamed: whoever finds the port when the bind is routable. Not a supported
      caller — the drawn reminder that loopback is an assumption, not a policy.

  - id: hub
    kind: external
    title: Public model hub
    cosaiComponent: componentModelStorage
    zone: zoneExternal
    col: 3
    row: 2
    note: >
      Distribution for open weights. Publisher identity ranges from verified to arbitrary, and
      neither transport security nor a signature says anything about what the artifact does when
      the runtime opens it.
    items:
      - id: catalogue
        label: Open-weights catalogue
        icon: db
        note: Declared behaviour and actual behaviour are separate facts.

edges:
  - from: localApps
    to: api
    path: primary
    bidir: true
    label: completion request
    note: >
      Local software calls the local API the way it would a hosted one — usually assuming a safety
      floor that is not there. The same unauthenticated request, on the same port, whether it came
      from the editor the runtime was installed for or from a web page driving the browser.
      Locality is standing in for authorization.
  - from: api
    to: runtime
    label: request / completion
    path: primary
    bidir: true
    note: >
      Prompts in, raw completions back. Input and output classification is a control deployed on
      this path — in the common install it is a straight pipe.
  - from: weights
    to: runtime
    path: primary
    label: load
    note: >
      Only promoted, integrity-checked artifacts load, and never in the same step as a fetch.
      For several formats the load is an execution event, which makes this the supply chain's
      last gate.
  - from: hub
    to: weights
    path: external
    label: weight fetch
    note: >
      The artifact is pulled to quarantine without being opened — by the management tooling in
      the target state, by the runtime's own downloader in the common install, where fetch and
      load collapse into one step and the whole promotion story disappears. Transport is
      authenticated and the publisher may be verifiable; neither says anything about what the
      artifact does when the loader opens it.
  - from: callers
    to: api
    path: external
    label: found port
    route: hv
    note: >
      The path that should not exist: a routable bind, and the endpoint is reachable from the
      network with whatever authentication it shipped — usually none.

pins:
  risks:
    - risk: riskMaliciousLoaderDeserialization
      at: weights->runtime
      note: >
        Pickle-class formats execute code on load. The risk is a property of the artifact format,
        not of the publisher.
    - risk: riskModelSourceTampering
      at: hub->weights
      note: Publisher identity at publish time, nothing at load time — and a hub account is a takeover target.
    - risk: riskDenialOfMLService
      at: localApps->api
      note: Any local process can saturate the runtime; a browser tab can do it from a web page.
    - risk: riskModelExfiltration
      at: weights
      note: The artifacts sit on disk with the user's file permissions — readable by anything running as the user.
    - risk: riskInsecureIntegratedComponent
      at: runtime
      note: >
        The serving stack itself is fast-moving native code with its own CVE history, running
        unsandboxed — and patched over an auto-update channel that is part of the attack surface.
    - risk: riskInsecureModelOutput
      at: api->runtime
      note: >
        Where no classifier sits on this path — the common case — raw model output goes straight
        to callers built expecting a hosted API's floor.
    - risk: riskDenialOfMLService
      at: callers->api
      note: >
        When the bind is routable, anyone who finds the port consumes the machine — free
        inference, and on some runtimes the management surface too. The headline exposure
        class the scans keep documenting.
    - risk: riskModelEvasion
      at: runtime
      note: >
        With no provider-side safety layer, whatever refusal behaviour the weights carry is the
        whole of the defence, and it is removable by fine-tune.

    - risk: riskExcessiveDataHandlingDuringInference
      at: runtime
      note: >
        A model-name suffix or a search flag routes the prompt to the vendor's cloud through the
        same local API, and nothing on the drawing governs the runtime process's own egress.
    - risk: riskModelDeploymentTampering
      at: weights->runtime
      note: >
        What the runtime serves is whatever sits in its model directory; a swap there — by a
        stranger on an exposed port or by any local process — is served on the next request with
        nothing to notice.
    - risk: riskMaliciousLoaderDeserialization
      at: runtime
      note: >
        The chat template embedded in the weights runs on every request — past the load gate and
        every static scan.
  capabilities:
    - capability: capabilityModelScanning
      at: hub->weights
      note: >
        Format and content inspection at quarantine, before promotion — a scan that runs after
        the runtime opens the file has documented an incident, not prevented one.
    - capability: capabilityIga
      at: api
      note: >
        Caller identity at the wrapper rather than locality as authorization — a browser tab
        is local too. Absorbed by the API wrapper per the recorded deviation.
    - capability: capabilityModelGuardrails
      at: api->runtime
      note: Deploy the input and output classification a hosted API would have applied — nothing supplies it here by default.
    - capability: capabilityRateLimiting
      at: api
      note: Bound what any single caller can consume, because the callers share one unmetered port.
    - capability: capabilityTransportSecurity
      at: api
      note: >
        The bind, the origin policy and the auth flag treated as security settings with a
        reviewed baseline — loopback only, Host and Origin validated, authenticated transport
        on — enforced by device management rather than hoped from defaults.
    - capability: capabilityModelWeightProtection
      at: weights
      note: Restrictive file permissions and integrity checks on the artifacts, so a swap is detectable.
    - capability: capabilityAiGovernancePlatform
      at: govObservability
      note: >
        The system of record for whether local inference may run at all, from which sources,
        on which machines — the policy the device-level settings enforce.
    - capability: capabilityEdr
      at: runtime
      note: >
        Endpoint telemetry over the serving process: vulnerable-version discovery, port and
        process visibility, and the containment that isolates a machine serving something it
        should not.
    - capability: capabilityAiBom
      at: govSupplyChain
      note: Which models, at which versions, from which sources, on which machines — the precondition for every response.
    - capability: capabilityShadowAiDiscovery
      at: runtime
      note: Find the runtimes nobody registered, derived from the machine rather than self-reported.
    - capability: capabilityModelEvals
      at: govObservability
      note: >
        Evaluate what the weights actually do before promoting them for other software to call
        — a gate on change, run from the governance band; there is no provider evaluation to
        inherit.

walkthrough:
  title: An application asks for a completion
  moves: >-
    A prompt from local software into weights on the same machine, and the completion back.
  steps:
    - follow: localApps->api
      note: A local tool calls the OpenAI-compatible endpoint as if it were hosted.
    - follow: api->runtime
      note: >
        The request crosses whatever classification the owner deployed — often none — and the
        model serves the completion with whatever behaviour the weights carry.
    - follow: runtime->api
      note: The completion leaves the runtime — raw model output, nothing between it and the caller.
    - follow: api->localApps
      note: The response returns with no provider floor under it.

scenarios:
  - title: A poisoned checkpoint
    steps:
      - follow: hub->weights
        note: >
          A well-reviewed model name, a compromised artifact — the download verifies transport,
          not behaviour. It lands in quarantine unopened, which is the step the common install
          skips.
      - follow: weights->runtime
        note: >
          Only after scan and promotion does the runtime open the file. In a pickle-class
          format the load is the execution event; in a safe format, a malformed header
          exercises the parser instead — either way, with the user's privileges.
  - title: The port is on the internet
    steps:
      - follow: callers->api
        note: >
          An exposure scan finds the bind that was never meant to be routable — tens of
          thousands of them, in the published counts.
      - follow: api->runtime
        note: >
          Free inference for whoever arrived, and on some runtimes the management surface too:
          models pulled, deleted or swapped by a stranger, on a machine that appears in no
          inventory.
      - follow: weights->runtime
        note: >
          The stranger's pull lands weights straight on disk and the runtime loads them — the
          common-install collapse the deviation admits; a path-traversal flaw in that pull
          turned it into remote code execution once already.
  - title: A browser tab finds the port
    steps:
      - follow: localApps->api
        note: >
          A visited web page fires a simple-request POST at the local endpoint through the
          browser; the server acts on it whether or not the origin is allowed, and a rebinding
          page reads the answer too. The caller is local software; nobody chose to serve it.
      - follow: api->runtime
        note: >
          Nothing distinguishes this caller from the intended ones. The page now drives local
          inference — for free, and invisibly to the user.

deviations:
  - subject: Quarantine, scanning and rate limiting are absorbed rather than drawn
    reason: >
      The scanning embodiment (the private package registry) and a separate quarantine tier
      are not drawn: the storage block carries quarantine and promotion state, the management
      tooling runs the scan, and the API wrapper absorbs caller identity and per-caller
      ceilings. Recorded here because each is an inline duty a simple endpoint drawing folds
      into the nearest real tier.
  - subject: The runtime's own distribution channel is not drawn
    reason: >
      The serving binary updates itself over its vendor's channel — attack surface the
      insecure-component risk note names, but a single outbound updater hop that a standing
      edge would overstate. The same process's cloud-model offload and web-search calls ride
      the same undrawn egress. An organisation that mirrors the runtime binary through its
      package registry closes the first at the mirror; the device firewall closes the rest
      in the target state.
  - subject: Guardrails are a control on the request path, not a block
    reason: >
      Input and output classification is something the device owner deploys, not a component of
      the runtime — so it is pinned as a numbered control on the API-to-runtime path rather than
      drawn as a service that does not exist in the common install.

