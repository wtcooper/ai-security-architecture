      - mitigation: D3-OTF
        coverage: partial
        mechanism: >-
          IP allowlisting (Enterprise, CIDR ranges enabled by Anthropic support) and tenant restrictions
          (anthropic-allowed-org-ids header injected by a TLS-inspecting proxy)
        steps:
          - title: Restrict where Claude can be used from
            body:
              - Compile CIDR ranges and have Anthropic enable IP allowlisting; every authenticated request
                outside the ranges is denied (Anthropic-hosted cloud sessions then need an exemption).
            url: https://support.claude.com/en/articles/13200993-restrict-access-to-claude-with-ip-allowlisting
          - title: Block other tenants at the proxy
            body:
              - Inject anthropic-allowed-org-ids with your org UUIDs for claude.ai, api.anthropic.com,
                claude.com and anthropic.com (up to 500 UUIDs across numbered headers).
            url: https://support.claude.com/en/articles/13198485-enforce-network-level-access-control-with-tenant-restrictions
          - title: Allowlist the documented hosts
            body:
              - Permit anthropic.com, claude.ai, claude.com, platform.claude.com, downloads.claude.ai,
                *.claudeusercontent.com and *.claudemcpcontent.com (plus optional CDN hosts for artifacts) and
                route through egressProxyUrl on managed devices.
            url: https://code.claude.com/docs/en/desktop
        note: >-
          IP allowlisting is enforced by Anthropic; the tenant-restriction header is enforced by a
          TLS-inspecting proxy the organisation operates. Neither is an SSE service: inline inspection of
          prompts and uploads is the customer's SSE, and its completeness depends on which paths it sees.


          [capabilityEgressControl] The product documents its destinations and offers proxy keys; it enforces
          no destination policy of its own. Connector traffic egresses from Anthropic's MCP proxy, outside the
