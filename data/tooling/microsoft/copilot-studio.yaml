# Microsoft Copilot Studio — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# Exclusions: Agent Builder agents inside Microsoft 365 Copilot and the Microsoft 365 admin center Agent Registry
# are recorded on toolM365Copilot (they also appear in the Power Platform inventory but carry no Entra agent
# identity). Classic chatbots (Power Virtual Agents V1) are legacy, outside the inventory and the quarantine API.
# Microsoft Foundry agents, Power Automate cloud flows, Dynamics 365 Customer Service and Agent 365 as a
# standalone control plane are other products. The Copilot Studio for Microsoft Teams plan (classic
# orchestration in Dataverse for Teams) is recorded as a plan, not a variant: transcripts are not written there.
# Many governance pages are marked "standard harness"; the GitHub Copilot harness is kept as a variant until its
# own governance pages diverge.
# 2026-09-25: onboarded toolCopilotStudio against the MITRE capability rules; data-integration/gateway/service-gateway-tenant-level-admin -> power-platform/admin/onpremises-data-gateway-management; 404: power-platform/admin/inventory-schema-copilot-studio-agents (the agent schema is at microsoft-copilot-studio/admin-agent-inventory), data-integration/gateway/service-gateway-data-sources; msrc.microsoft.com/update-guide renders client-side (CVE titles and dates read from api.msrc.microsoft.com). Microsoft identity, Purview DLP-location and Service Trust Portal facts reused from toolM365Copilot (verified the same day).
vendor: microsoft
family: Microsoft Copilot Studio
tools:
  - id: toolCopilotStudio
    name: Microsoft Copilot Studio (agents, knowledge, tools and connectors, autonomous triggers, computer use)
    surfaceClasses:
      - saasAgentPlatform
    variants:
      - name: Agents on the standard harness (topics, generative orchestration, agent flows)
        class: saasAgentPlatform
        url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/agents-experience/switch-experiences
        note: >-
          The harness most governance pages are written for (Entra Agent ID, tools, connectors, computer use);
          publishes to Teams and Microsoft 365, SharePoint, Direct Line websites, WhatsApp, Facebook and Dynamics 365
          Customer Service.
      - name: Agents on the GitHub Copilot harness (goal-driven, multi-step, files, skills, memory, sandbox)
        class: saasAgentPlatform
        url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/harnesses-overview
        note: >-
          A Copilot Studio runtime, not the GitHub Copilot service; customer data is not sent to GitHub Copilot and
          Copilot Studio's privacy, compliance and residency commitments apply. Runs each task in a sandbox governed
          by Copilot Studio.
      - name: Agents on the Copilot chat harness (extend Microsoft 365 Copilot Chat)
        class: saasAgentPlatform
        url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/microsoft-365-copilot-extend-with-agents
        note: >-
          Published to internal teams only; billed by consumption or included in the Microsoft 365 Copilot licence.
          Conversation transcripts are not written to Dataverse for Microsoft 365 Copilot agents.
    architecture: archLowCodeAgentBuilder
    status: ga
    asOf: "2026-09"
    summary:
      - >-
        Microsoft's low-code agent builder: makers author agents from instructions, knowledge sources (SharePoint,
        OneDrive, uploaded files, public websites, Dataverse, connectors), tools (Power Platform connectors, agent
        flows, MCP servers, REST APIs, prompts, computer use) and event triggers, then publish them to Teams and
        Microsoft 365 Copilot, SharePoint, websites and messaging channels. Agents run in Microsoft's cloud on Azure
        OpenAI models by default, with Anthropic, Mistral and xAI models available per environment once an
        administrator allows them; connectors reach third-party services from Microsoft's cloud, and on-premises
        systems through the on-premises data gateway.
      - >-
        The administrator is the Power Platform administrator: data policies and advanced connector policies,
        environment and environment-group settings (Product > Features > Copilot Studio agents), Managed
        Environments sharing limits, Manage > Inventory with Block and the quarantine API, Security > Threat
        detection and Security > Identity and access > Agent access channels. Each new agent gets a Microsoft
        Entra Agent ID; maker and user activity is audited in Microsoft Purview; conversation transcripts land in
        the environment's Dataverse.
    facts:
      - label: Plans
        value: >-
          Standalone Copilot Studio subscription (any supported channel, premium connectors, Copilot Credits);
          Copilot Studio for Microsoft Teams plan in select Microsoft 365 subscriptions (classic orchestration,
          Teams only); the Copilot chat harness is billed by consumption or included in Microsoft 365 Copilot. The
          free trial cannot publish.
        url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/requirements-licensing-subscriptions
      - label: Inference & routing
        value: >-
          Generative AI features draw on Azure OpenAI Service and Bing Search. External models (Anthropic, Mistral,
          xAI) need access allowed in the Microsoft 365 admin center and then Enable External Models per environment
          or environment group; Anthropic is a Microsoft subprocessor under the DPA since 2026-01-07 but is excluded
          from the EU Data Boundary, and xAI is US-only.
        url: https://learn.microsoft.com/en-us/power-platform/admin/allow-llm-generative-responses
      - label: Data leaving the device
        value: >-
          A vendor-hosted platform: prompts, knowledge, tool calls and model calls are processed in Microsoft's
          cloud. In some geographies outside the United States, generative AI features move data across regional
          boundaries once a Global or Power Platform administrator allows it; Bing-powered features fall under the
          Microsoft Services Agreement and Privacy Statement. A configured external threat-detection provider
          receives the prompt, recent history, prior tool outputs and proposed tool inputs.
        url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/manage-data-movement-outside-us
      - label: Retention & training
        value: >-
          Transcripts are saved to the environment's Dataverse (a bulk-delete job removes them after 30 days unless
          changed) and held in Copilot Studio storage for up to 28 days; administrators can stop saving per
          environment or environment group. Purview retention covers interactions under Microsoft Copilot
          Experiences. The tenant setting Data sharing for Dynamics 365 Copilot and Power Platform Copilot AI
          Features (human review and model improvement) is disabled by default.
        url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/admin-transcript-controls
      - label: Docs index
        value: learn.microsoft.com/microsoft-copilot-studio (Security and governance overview)
        url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/
      - label: Admin planes
        value: >-
          Power Platform admin center (Security > Data and privacy > Data policy; environment Settings > Product >
          Features > Copilot Studio agents; Managed Environments; Manage > Inventory and Manage > Copilot Studio;
          Security > Threat detection; Security > Identity and access > Agent access channels; Tenant settings),
          Microsoft Entra admin center (agent identities), Microsoft Purview (Audit, DSPM for AI, DLP) and the Teams
          or Microsoft 365 admin center for org-catalogue approval.
        url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/security-and-governance
      - label: Network requirements
        value: >-
          The on-premises data gateway opens outbound connections to Azure Service Bus on TCP 443 (default), 5671,
          5672 and 9350-9354; no inbound port is required.
        url: https://learn.microsoft.com/en-us/power-platform/admin/wp-onpremises-gateway
    items:
      - title: Where each control lives
        body:
          - >-
            Power Platform admin center: Security > Data and privacy > Data policy (Copilot Studio connectors for
            authentication, knowledge, HTTP, skills, triggers and channels; Configure connector > Connector actions
            and Connector endpoints); environment Settings > Product > Features > Copilot Studio agents (Control
            maker credential options, transcript settings, Enable External Models); Edit Managed Environments >
            Manage sharing; Manage > Inventory (Block, Download); Security > Threat detection > Additional threat
            detection; Security > Identity and access > Agent access channels; Copilot > Settings (Connected Agents
            Copilot Studio); Settings > Tenant settings (Publish Copilots with AI features, Environment routing);
            Manage > Data (preview) for gateways. Microsoft Entra admin center: agent identities. Microsoft Purview:
            Audit, DSPM for AI, DLP on the Microsoft 365 Copilot and Copilot Chat location.
        links:
          - title: Security and governance in Copilot Studio
            url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/security-and-governance
          - title: Configure data policies for agents
            url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/admin-data-loss-prevention
          - title: Power Platform inventory
            url: https://learn.microsoft.com/en-us/power-platform/admin/power-platform-inventory
      - title: Whose credentials a tool runs on
        body:
          - >-
            Each tool's Authentication is End user (the default for connectors and flows) or Maker-provided; computer
            use defaults to Maker-provided. The automatic security scan warns the maker before publishing when
            Maker-provided is chosen, the inventory records connectionProvider Maker or User per connector operation,
            and Control maker credential options lets the administrator remove the Maker-provided choice per
            environment or environment group, at the cost of autonomous and scheduled runs, which then fail.
        links:
          - title: Control maker-provided credentials for authentication
            url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/configure-no-maker-authentication
          - title: Automatic security scan in Copilot Studio
            url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/security-scan
    riskNotes:
      - risk: riskAgenticDelegationConfusedDeputy
        note: >-
          Both End-user and Maker-provided credentials are enabled by default, and computer use defaults to the
          maker's. A tool on maker credentials lends the maker's access to every consumer; the inventory's
          connectionProvider field finds them and Control maker credential options removes the choice.
      - risk: riskShadowAndUnknownAgents
        note: >-
          Any licensed user can build in the default environment unless environment routing sends makers to
          personal developer environments; the inventory lists drafts and Agent Builder agents but not classic
          chatbots.
      - risk: riskPromptInjection
        note: >-
          Knowledge sources, connector and MCP results and web pages re-enter the orchestrator. Built-in UPIA and
          XPIA blocking is vendor-run and always on; the admin-configured external threat detection (preview) sees
          proposed tool calls only and allows them by default if it does not answer within one second.
      - risk: riskSensitiveDataDisclosure
        note: >-
          No authentication lets anyone with the link chat with the agent unless a data policy blocks Chat without
          Microsoft Entra ID authentication in Copilot Studio; locally uploaded knowledge files are served to anyone
          who can use the agent, whatever the source file's permissions.
      - risk: riskRogueActions
        note: >-
          Event triggers and computer use act with no person present; Ask the end user before running is off by
          default on every tool, and computer use can operate on any website or application unless the maker turns
          on access control.
      - risk: riskRetrievalVectorStorePoisoning
        note: >-
          SharePoint and OneDrive files and folders added through Upload files are synchronised into a Dataverse
          index, so whoever can write the folder writes what every agent grounded on it reads.
      - risk: riskExcessiveDataHandlingDuringInference
        note: >-
          Anthropic models sit outside the EU Data Boundary, Bing-powered features fall under the Microsoft Services
          Agreement, and an external threat-detection provider receives conversation and tool data under its own
          terms.
    controls:
      - mitigation: cap-sensitive-data-redaction
        coverage: partial
        mechanism: >-
          Purview DLP policy on the Microsoft 365 Copilot and Copilot Chat location with Content contains >
          Sensitivity labels, which Microsoft documents as restricting Copilot Studio agents in Teams, SharePoint and
          Microsoft 365 Copilot from processing labelled SharePoint knowledge; encrypting labels without EXTRACT
          withhold content; sensitivity labels shown on responses; SIT classification of prompts and responses in
          DSPM for AI (detect only); data policies block knowledge-source types (Knowledge source with documents /
          SharePoint and OneDrive / public websites in Copilot Studio)
        steps:
          - title: Keep labelled SharePoint content out of agents
            body:
              - >-
                In the Purview portal create a DLP policy on the Microsoft 365 Copilot and Copilot Chat location with
                Content contains > Sensitivity labels and Prevent Copilot from processing content; Microsoft applies
                it to Copilot Studio agents grounded on SharePoint in Teams, SharePoint and Microsoft 365 Copilot.
            url: https://learn.microsoft.com/en-us/purview/ai-copilot-studio
          - title: Configure the label rule
            body:
              - >-
                Use Data Loss Prevention > Policies > Custom policy with the Microsoft 365 Copilot and Copilot Chat
                location, one rule per label condition (SIT and label conditions cannot share a rule).
            url: https://learn.microsoft.com/en-us/purview/dlp-microsoft365-copilot-location-learn-about
          - title: Detect sensitive data in agent conversations
            body:
              - >-
                In DSPM for AI (classic) > Recommendations run Detect unethical behavior in AI, which detects
                sensitive information in prompts and responses of Copilot Studio agents; review in activity explorer.
            url: https://learn.microsoft.com/en-us/purview/ai-copilot-studio
        note: >-
          Partial on the redaction rule (core rule 5): the enforcing control is label-based, not content inspection.
          Purview lists only the SharePoint-knowledge label restriction as the DLP capability for Copilot Studio
          agents, and only for agents in Teams, SharePoint and Microsoft 365 Copilot; files a maker uploads, public
          websites, connector payloads and tool calls are not inspected, nothing masks a span, and SIT detection in
          DSPM for AI raises findings without blocking. Blocking knowledge-source connectors in a data policy
          (Knowledge source with documents in Copilot Studio) is minimisation, not detection. Encrypted and
          password-protected files are never grounded. Agents on non-Microsoft channels need Purview pay-as-you-go
          billing. The toolM365Copilot prompt-level SIT block is not documented for Copilot Studio agents.
        verified: "2026-09-25"
      - mitigation: D3-APA
        coverage: native
        mechanism: >-
          Data policy blocking the connector Chat without Microsoft Entra ID authentication in Copilot Studio (No
          authentication becomes unavailable and Require users to sign in cannot be turned off); environment or
          environment-group setting Product > Features > Copilot Studio agents > Control maker credential options
          (End-user credentials / Maker-provided credentials); Managed Environments agent sharing rules (Let people
          grant Viewer permissions, Only share with individuals, Limit number of viewers; bot-limitSharingMode,
          bot-maxLimitUserSharing, bot-authoringSharingDisabled); Agent access channels (preview)
        steps:
          - title: Require authentication on every channel
            body:
              - >-
                In Security > Data and privacy > Data policy, in a policy scoped to all environments, block Chat
                without Microsoft Entra ID authentication in Copilot Studio so only Authenticate with Microsoft or
                Authenticate manually can be published.
            url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/admin-data-loss-prevention
          - title: Remove maker-provided credentials
            body:
              - >-
                In Manage > Environment groups (or Environments) > Settings > Product > Features > Copilot Studio
                agents, set Control maker credential options to End-user credentials only.
            url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/configure-no-maker-authentication
          - title: Limit who an agent can be shared with
            body:
              - >-
                In Edit Managed Environments > Manage sharing, clear Let people grant Viewer permissions when agents
                are shared, or select Only share with individuals and set Limit number of viewers.
            url: https://learn.microsoft.com/en-us/power-platform/admin/managed-environment-sharing-limits
          - title: Restrict the publishing channels
            body:
              - >-
                In Security > Identity and access > Agent access channels, clear the channels an environment group
                may not publish to (preview; published agents on a blocked channel fail at runtime).
            url: https://learn.microsoft.com/en-us/power-platform/admin/security/configure-channel-connected-agent-publishing
        note: >-
          Native on the authorisation rule: the administrator can enforce authentication on every channel, remove
          maker credentials (the confused-deputy case) and cap who may use or co-author an agent, tenant-wide through
          data-policy scope and environment groups. Defaults to change: new agents start on Authenticate with
          Microsoft, but makers may pick No authentication until the data policy blocks it; both credential modes
          are allowed by default, and computer use defaults to maker credentials. Costs and gaps: with maker
          credentials removed, scheduled and autonomous runs fail for lack of a live user; sharing rules need
          Managed Environments, apply only to new shares (non-compliant agents can only be unshared) and take up to
          an hour; Generic OAuth agents cannot restrict which users chat. Policy administration is not the
          enforcement path: Entra and the connector runtime enforce it.
        verified: "2026-09-25"
      - mitigation: D3-AA
        coverage: partial
        mechanism: >-
          A Microsoft Entra Agent ID created automatically for every new agent since May 2026 (no opt-out), a child of
          the Microsoft-owned Microsoft Copilot Studio agent identity blueprint, with the owner as sponsor, connector
          API permissions attached at publish (Operations.Execute.All or per-operation scopes) and deletion with the
          agent; legacy agents keep app registrations until migrated (Actions > Recommendations > Migrate Copilot
          Studio agents to Microsoft Entra Agent ID, preview)
        steps:
          - title: Find each agent's identity
            body:
              - >-
                Read the GUID at agent Settings > Advanced > Metadata > Entra Agent ID, or the entraAgentId field in
                the inventory, and review the identity, its sponsor and its API permissions in the Entra admin center.
            url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/admin-use-entra-agent-identities
          - title: Migrate legacy app-registration agents
            body:
              - >-
                In Actions > Recommendations open Migrate Copilot Studio agents to Microsoft Entra Agent ID for
                enhanced agent governance, migrate a pilot batch, and validate before the next.
            url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/govern-migrate-api-entra-agent-identity
          - title: Put Conditional Access on connector scopes
            body:
              - >-
                Target the connector permissions on agent identities with Conditional Access (network location, device
                compliance, risk); today it is evaluated only when the agent runs in Microsoft Teams.
            url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/govern-agents-identities-overview
          - title: Give agent access an expiry
            body:
              - >-
                Assign agent identities access through Entra ID Governance access packages with an end date so access
                lapses unless the sponsor extends it.
            url: https://learn.microsoft.com/en-us/entra/id-governance/agent-id-governance-overview
        note: >-
          Partial on the agent-identity rule, the same word as toolM365Copilot: a directory principal is minted per
          agent, inventoried with a sponsor and deleted with the agent, and no one in the tenant can mint tokens for
          it. But what the agent does in connected systems is authenticated as the end user or the maker through the
          Power Platform connection, not as the agent identity; Conditional Access on the agent identity is evaluated
          only in Teams (other channels use the existing connector authentication flow); custom connectors, MCP
          servers and REST API tools add no permissions to it; agents created before May 2026 run on app
          registrations until migrated; Agent Builder agents have no identity. Disabling the agent identity as a
          revocation path is not documented; deleting the agent is.
        verified: "2026-09-25"
      - mitigation: cap-agent-tool-registry
        coverage: native
        mechanism: >-
          Power Platform inventory (Manage > Inventory and Manage > Copilot Studio; Power Platform API inventory,
          Azure Resource Graph, Power Platform for Admins V2 connector): every Copilot Studio and Agent Builder agent,
          drafts included, with ownerId, createdBy, environment, lastPublishedAt, authentication, channels,
          sharedWithViewers (entireTenant), entraAgentId, isQuarantined, and powerPlatformConnectors[].operations[]
          with connectionProvider (Maker or User) and connectionIdSharedByMaker; Block in the command bar and the
          quarantine API
        steps:
          - title: Query the inventory for maker-credential agents
            body:
              - >-
                In Manage > Inventory filter Copilot Studio agents, add the Connectors column, and query
                powerPlatformConnectors operations where connectionProvider is Maker through Azure Resource Graph or
                the inventory API; export to CSV for reconciliation.
            url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/admin-agent-inventory
          - title: Find public and tenant-wide agents
            body:
              - >-
                Filter on authentication None and sharedWithViewers.entireTenant true, and on owners who have left, to
                reassign or block.
            url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/admin-agent-inventory
          - title: Block what should not run
            body:
              - >-
                Select a published agent in Manage > Inventory or Manage > Copilot Studio and choose Block; unblock
                once remediated.
            url: https://learn.microsoft.com/en-us/power-platform/admin/power-platform-inventory
        note: >-
          Native on the registry rule: the platform itself keeps an authoritative, queryable record of every agent
          with owner, channels, authentication mode and, per connector operation, whether it runs on the maker's or
          the user's connection, and the administrator can block or quarantine from it. Limits: most configuration
          fields are preview; capabilities reflect the published version only; detailed capability data covers
          Power Platform connectors and a web-search flag, not HTTP nodes, REST API tools, computer use or other
          knowledge sources; at most 200 resources of each type per agent; changes appear within 15 to 20 minutes;
          classic chatbots are listed separately. The inventory records agents after the fact rather than admitting
          them, so the publication gate is a separate row.
        verified: "2026-09-25"
      - mitigation: cap-staged-rollout-gate
        coverage: partial
        mechanism: >-
          Solutions as the versioned unit; Power Platform pipelines with delegated deployments (approval before
          deploying as a service principal or pipeline owner), stages the same exported artifact must pass in order,
          and redeploy of previous solution versions; Settings > Tenant settings > Environment routing to personal
          developer environments and Publish Copilots with AI features; Submit for admin approval to list an agent
          in the org catalogue of Teams and Microsoft 365
        steps:
          - title: Route makers out of the default environment
            body:
              - >-
                Turn on Environment routing in Settings > Tenant settings so makers land in managed personal developer
                environments governed by environment-group rules.
            url: https://learn.microsoft.com/en-us/power-platform/admin/default-environment-routing
          - title: Promote through an approved pipeline
            body:
              - >-
                Build a pipeline (development, test, production) in the Deployment Pipeline Configuration app with
                delegated deployments so a named approver releases each stage.
            url: https://learn.microsoft.com/en-us/power-platform/alm/pipelines
          - title: Keep a way back
            body:
              - >-
                Turn on the pipeline setting that allows redeploying previous solution versions from the run history.
            url: https://learn.microsoft.com/en-us/power-platform/alm/pipelines
          - title: Approve org-wide listing
            body:
              - >-
                Review agents submitted with Show to everyone in my org in the Teams admin center Manage apps page
                before they appear in Built for your org.
            url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/publication-add-bot-to-microsoft-teams
        note: >-
          Partial on the rollout rule. Met: versioning (solutions, managed layers), a promotion gate a person approves
          (delegated deployments) that cannot skip a stage, and rollback by redeploying an earlier version. Not met:
          nothing forces a maker to use the pipeline, since anyone with maker rights in an environment can publish
          straight to its channels; the org-catalogue approval covers the listing and its details only, and content
          changes republish without re-approval; no canary or percentage release, and no evaluation gate. Publish
          Copilots with AI features is an all-or-nothing switch. Pipeline targets must be Managed Environments.
        verified: "2026-09-25"
      - mitigation: cap-input-guardrails
        coverage: partial
        mechanism: >-
          Built-in user prompt-injection (UPIA) and cross-domain prompt-injection (XPIA) blocking on every published
          agent, always on, with blocked-message counts in the maker's Protection status and Security analytics;
          admin-configured external threat detection (preview) at Security > Threat detection > Additional threat
          detection per environment (Microsoft Defender or a partner webhook) that allows or blocks each proposed
          tool call, with Set error behavior; content moderation level set per agent by the maker
        steps:
          - title: Connect runtime threat detection
            body:
              - >-
                Register the Entra app with the provider's federated credential, then in Security > Threat detection
                > Additional threat detection select the environment, choose Set up and Allow Copilot Studio to share
                data with a threat detection provider.
            url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/external-security-provider
          - title: Fail closed
            body:
              - >-
                Change Set error behavior from Allow the agent to respond to Block the query, so a provider timeout
                (one second) or error blocks the tool call.
            url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/external-security-provider
          - title: Review blocked prompt attacks
            body:
              - >-
                Ask makers to review Protection status > See details > Security analytics (Reason for block) for their
                agents.
            url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/security-agent-runtime-view
        note: >-
          Partial on the input-screening rule: the injection classifiers that screen prompts and knowledge are
          vendor-internal, always on and not admin-tunable, and their detections surface in a per-agent maker view
          rather than an administrator event stream. External threat detection is an attach point where a Defender or
          partner classifier can block, but it judges proposed tool calls (with the prompt, history and prior tool
          outputs as context) rather than screening each knowledge chunk before context assembly; it is preview,
          generative orchestration only, set per environment or environment group with no tenant-wide, PowerShell or
          API setting (new environments start without it), and allows the call by default when the provider is
          slow. Content moderation is a maker setting. Our gateway's classification of grounding it returns is the
          other half of this pin.
        verified: "2026-09-25"
      - mitigation: cap-ai-vendor-assessment
        coverage: external
        mechanism: >-
          Copilot Studio compliance offerings (HIPAA BAA, HITRUST, FedRAMP, SOC, ISO, PCI DSS, CSA STAR) and the
          Service Trust Portal audit reports feed the organisation's TPRM platform; external-model and threat-detection
          provider terms assessed separately
        evidence:
          - title: Copilot Studio compliance offerings
            url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/admin-certification
          - title: Get started with the Microsoft Service Trust Portal
            url: https://learn.microsoft.com/en-us/compliance/assurance/stp-get-started
          - title: Allow external language models (Anthropic subprocessor, EU Data Boundary and FedRAMP exclusions)
            url: https://learn.microsoft.com/en-us/power-platform/admin/allow-llm-generative-responses
        note: >-
          External: the assessment, evidence expiry and reassessment trigger live in the organisation's TPRM platform,
          as for every vendor. Copilot Studio is an Online Service covered by HIPAA (BAA), HITRUST, FedRAMP, SOC, ISO,
          PCI DSS and CSA STAR, but Anthropic models are outside the EU Data Boundary, FedRAMP and PCI DSS, xAI is
          US-only, and an external threat-detection provider handles data under its own terms. Re-assess when
          external models are enabled, when a threat-detection provider is connected and when harnesses change. The
          Service Trust Portal renders client-side and was not read.
        verified: "2026-09-25"
      - mitigation: AML.M0028
        coverage: native
        mechanism: >-
          Power Platform data policies (Security > Data and privacy > Data policy): every connector classified
          Business, Non-business or Blocked, connectors in different groups cannot be combined, Copilot Studio
          connectors for HTTP, skills, event triggers (Microsoft Copilot Studio), knowledge and channels; Configure
          connector > Connector actions (per-action allow or deny, default for new actions); Connector endpoints
          (preview); advanced connector policies (default-deny allowlist, MCP server-level blocking); enforced in real
          time with the Publish button unavailable on violation; exemptions no longer supported
        steps:
          - title: Classify connectors tenant-wide
            body:
              - >-
                In Security > Data and privacy > Data policy create a policy with Add all environments, move each
                connector to Business, Non-business or Blocked, and block HTTP, Skills with Copilot Studio and the
                Microsoft Copilot Studio (event triggers) connector where they are not needed.
            url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/admin-data-loss-prevention
          - title: Allow only the actions you need
            body:
              - >-
                On a blockable connector choose Configure connector > Connector actions, deny write actions you do not
                accept, and set Default connector action settings to block new actions.
            url: https://learn.microsoft.com/en-us/power-platform/admin/connector-action-control
          - title: Pin connectors to known endpoints
            body:
              - >-
                Use Configure connector > Connector endpoints on HTTP and the SharePoint and public-website knowledge
                connectors to allow only approved URLs (preview).
            url: https://learn.microsoft.com/en-us/power-platform/admin/connector-endpoint-filtering
          - title: Move to default-deny
            body:
              - >-
                In an environment group's Rules tab add Advanced connector policies with only the approved certified
                and MCP connectors; new connectors are blocked automatically.
            url: https://learn.microsoft.com/en-us/power-platform/admin/advanced-connector-policies
        note: >-
          Native on the tool-permission rule: a tenant policy classifies connectors, refuses violating combinations
          at authoring and publish and again at runtime, and restricts individual operations and endpoints; blocking a
          connector also blocks MCP tools that rely on it, and tools on end-user credentials keep the caller's
          authority. Limits: in classic data policies new connectors land in Non-business by default, so unclassified
          is blocked only under advanced connector policies; ACP does not cover custom connectors, HTTP or the Copilot
          Studio virtual connectors and is runtime-only in Copilot Studio until its design-time enforcement ships;
          action control excludes custom and unblockable connectors and handles triggers only in PowerShell; endpoint
          filtering is preview; scoping is per environment, not per user; computer use's website and app allowlist is
          a maker setting, off by default.
        verified: "2026-09-25"
      - mitigation: D3-CH
        coverage: partial
        mechanism: >-
          On-premises data gateway: data-source credentials encrypted with asymmetric encryption before storage in the
          gateway cloud service and decrypted only on the gateway host; outbound-only relay; administrator-assigned
          recovery key; Manage > Data (preview) for gateway users, members, clusters and Manage gateway installers;
          maker OAuth connections held in the Power Platform connection store; computer-use stored credentials in
          internal storage or the customer's Azure Key Vault
        steps:
          - title: Restrict who can install gateways
            body:
              - >-
                In Manage > Data (preview) turn on Tenant administration and use Manage gateway installers to name the
                users allowed to register gateways.
            url: https://learn.microsoft.com/en-us/power-platform/admin/onpremises-data-gateway-management
          - title: Control gateway use and remove members
            body:
              - >-
                Use Manage users on each gateway cluster to limit Can use and Can use + share (and the data-source
                types they may create), and Remove members or clusters that should no longer relay.
            url: https://learn.microsoft.com/en-us/power-platform/admin/onpremises-data-gateway-management
          - title: Hold the recovery key
            body:
              - >-
                Keep the recovery key assigned at install where administrators can find it; it is required to
                restore, migrate or take over the gateway.
            url: https://learn.microsoft.com/en-us/power-platform/admin/wp-onpremises-gateway
          - title: Keep computer-use passwords in your vault
            body:
              - >-
                Under the computer use tool's Stored credentials choose the Azure Key Vault option (subscription,
                resource group, vault and secret name) instead of internal storage.
            url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/computer-use
        note: >-
          Partial on the credential rule, the same word as toolM365Copilot: Microsoft ships the gateway, the relayed
          credential is encrypted to the host and never reaches the model, nothing is opened inbound, and gateway
          access and installation are administrator-controlled. But the gateway uses one stored standing credential
          per data source for every caller, rotation is a manual edit of that connection, no short-lived issuance or
          rotation of the gateway key pair is documented, and maker OAuth connections sit in Microsoft's connection
          store with lifetimes set by the target service and no documented bulk revocation; removing the
          Maker-provided choice (D3-APA) stops their use rather than revoking them. The gateway can also carry
          standard connectors straight to on-premises sources, bypassing our gateway (a recorded deviation).
        verified: "2026-09-25"
      - mitigation: cap-data-access-governance
        coverage: native
        mechanism: >-
          SharePoint and OneDrive knowledge retrieved on behalf of the signed-in user (Authenticate with Microsoft by
          default) with sensitivity-label permission trimming; synced Upload files > SharePoint/OneDrive items check
          the user's permission before answering; connector tools default to end-user credentials; administrator
          control of attachable sources through data-policy knowledge connectors (documents, SharePoint and OneDrive,
          public websites), Connector endpoints filtering and Control maker credential options
        steps:
          - title: Stop uploads that bypass source permissions
            body:
              - >-
                Block Knowledge source with documents in Copilot Studio in the data policy; locally uploaded files are
                answered to anyone who can use the agent.
            url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/admin-data-loss-prevention
          - title: Allow only governed sites as knowledge
            body:
              - >-
                On Knowledge source with SharePoint and OneDrive in Copilot Studio and on the public-websites connector
                use Configure connector > Connector endpoints to allow only approved site URLs (preview).
            url: https://learn.microsoft.com/en-us/power-platform/admin/connector-endpoint-filtering
          - title: Keep every read on the user's entitlement
            body:
              - >-
                Set Control maker credential options to End-user credentials so connector knowledge and tools run as
                the invoking user.
            url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/configure-no-maker-authentication
        note: >-
          Native on the retrieval rule, the same word as toolM365Copilot: SharePoint, OneDrive and synced knowledge is
          retrieved with the invoking user's permissions and label trimming, and the administrator decides which
          source types and sites makers may attach and can remove maker credentials. Outside it: locally uploaded
          documents are not identity-scoped (block the connector), public websites are public, content already
          overshared in SharePoint is returned (remediate with the DSPM and SharePoint Advanced Management reports on
          toolM365Copilot), No-authentication agents cannot use SharePoint, encrypted files are not grounded at all,
          and endpoint filtering is preview. Restricted SharePoint Search, where still on, blocks SharePoint knowledge.
        verified: "2026-09-25"
      - mitigation: cap-agent-tracing
        coverage: partial
        mechanism: >-
          Purview unified audit log: maker events (BotCreate, BotUpdateOperation-BotPublish, -BotShare,
          -BotAuthUpdate, BotComponentUpdate, AIPluginOperationUpdate, BotDelete) and CopilotInteraction per user turn
          with the channel in AppHost and the transcript thread ID, readable through the Office 365 Management
          Activity API; conversation transcripts in the environment's Dataverse ConversationTranscript table (Content
          JSON of every activity; node-level nodeTraceData only with the maker's enhanced-transcripts toggle); per-agent
          Application Insights set by the maker; Entra sign-in logs for agent identities
        steps:
          - title: Keep transcripts in Dataverse
            body:
              - >-
                In the environment group rule Accessing transcripts from conversations in Copilot Studio agents (or
                environment Settings > Product > Features > Copilot Studio agents) keep Allow conversation transcripts
                and their associated metadata to be saved in Dataverse on.
            url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/admin-transcript-controls
          - title: Retain and export transcripts
            body:
              - >-
                Cancel the Bulk Delete Conversation Transcript Records Older Than 1 Month job, create one with your
                retention, and ingest the ConversationTranscript table into your store.
            url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/analytics-transcripts-powerapps
          - title: Stream maker and usage audit events
            body:
              - >-
                Filter Copilot Studio activities in Purview Audit and collect them through the Office 365 Management
                Activity API for the SIEM.
            url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/admin-logging-copilot-studio
        note: >-
          Partial on the tracing rule: run and maker records land where we can query them (our Dataverse, Purview,
          the Management Activity API), but per-step capture of tool and connector calls with arguments is not
          documented as part of the default transcript; node-level trace and Application Insights are maker toggles
          per agent that the administrator cannot floor. Transcripts are not written for Dataverse for Teams
          environments, developer environments or Microsoft 365 Copilot agents; SharePoint-grounded answers are
          REDACTED; records are written after 30 minutes of inactivity; audit records carry the transcript thread ID,
          not the text; some channels are excluded from logging, and non-Microsoft channels need Purview pay-as-you-go
          billing. Capture is not tamper resistance: the SIEM copy is the record.
        verified: "2026-09-25"
      - mitigation: cap-agent-kill-switch
        coverage: partial
        mechanism: >-
          Block on a published agent in Manage > Inventory or Manage > Copilot Studio (reversible); Power Platform API
          POST .../copilotstudio/environments/{EnvironmentId}/bots/{BotId}/api/botQuarantine/SetAsQuarantined; org-wide
          levers: data-policy blocks on channels and connectors (enforced in real time), Agent access channels
          (preview), Publish Copilots with AI features, Control maker credential options; deleting an agent deletes
          its Entra Agent ID
        steps:
          - title: Block one agent
            body:
              - >-
                In Manage > Inventory select the published agent and choose Block; makers can still test it, but no
                other channel can use it.
            url: https://learn.microsoft.com/en-us/power-platform/admin/power-platform-inventory
          - title: Quarantine by API
            body:
              - >-
                As an AI, Power Platform or Global administrator call botQuarantine/SetAsQuarantined with a token
                carrying CopilotStudio.AdminActions.Invoke, and check isBotQuarantined.
            url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/admin-api-quarantine
          - title: Cut maker-credential connections
            body:
              - >-
                Set Control maker credential options to End-user credentials on the environment group; every tool
                switches to end-user sign-in immediately.
            url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/configure-no-maker-authentication
          - title: Close channels org-wide
            body:
              - >-
                Clear channels in Agent access channels, or block the channel connectors in the data policy; agents
                already published there fail at runtime.
            url: https://learn.microsoft.com/en-us/power-platform/admin/security/configure-channel-connected-agent-publishing
        note: >-
          Partial on the kill-switch rule: the administrator can block or quarantine a specific agent and close
          channels or connectors for all agents, but whether a conversation or autonomous run already in progress
          stops is not documented, no delay is published for block or quarantine (the maker-credential switch may
          take a minute to propagate), and revoking the OAuth connections a maker authorised is not a documented
          bulk action; the maker-credential switch stops their use for tools. Quarantine and block do not cover
          classic chatbots. Deleting the agent removes its Entra Agent ID.
        verified: "2026-09-25"
