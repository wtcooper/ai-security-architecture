id: archVendorActionAgent
surface: surfaceSaas
title: In-app agent acting on vendor records
abbrev: Vendor action agent

summary:
  - >
    An agent built into a SaaS product, acting on the records that product holds — resolving
    tickets, updating opportunities, issuing refunds. It writes, the writes land on your system of
    record, and what the vendor's agent may do is a tenant configuration you own.

description:
  - >
    The distinction from a vendor assistant that answers questions is the write path, and it
    changes everything downstream. A wrong answer is a wrong answer; a wrong write is a changed
    record, an email that went out, a refund that was issued. Reversibility, not accuracy, is the
    property to design for — and it is a property of the vendor's action catalogue rather than of
    anything you build.
  - >
    The attacker is frequently your own authenticated customer. The agent reads ticket text, form
    submissions and uploaded documents — content supplied by whoever opened the case — and acts on
    the tenant's records with the tenant's authority. Injection here does not require a breach; it
    requires filling in a text field. This is the archetype where indirect prompt injection has
    the shortest path from untrusted input to consequential action.
  - >
    Your control surface is the action catalogue and the identity the agent runs as. Which actions
    it may take, on which record types, under which conditions, and whether a human approves the
    consequential ones are all vendor-exposed settings — usually generous by default, because the
    product is sold on autonomy. What you cannot do is insert a policy decision point into the
    vendor's loop: there is no place between the model's decision and the record write. Every
    control is therefore upstream of the loop — scoping what it may reach — or downstream of it,
    in review and reversal, which is why the governance column here is configuration, identity,
    outcome monitoring and a disable control rather than any runtime enforcement.

distinguishedBy:
  - >
    Against the tenant-wide assistant: that one reads across your corpus and answers; this one
    acts within one product's data model and writes. The read archetype's central question is
    permissions; this one's is reversibility.
  - >
    Against an autonomous action agent you build: identical shape, opposite ownership. There you
    design the action allowlist, the approval threshold and the compensating transaction. Here you
    choose from a menu, and what is not on the menu is not available.

exemplars:
  - name: Customer service and support agents
    note: >
      Vendor agents that resolve tickets end to end — reading the customer's message, searching
      knowledge, and issuing refunds or account changes without a human in between.
    asOf: "2026-08"
  - name: CRM and ITSM in-app agents
    note: >
      Agents inside sales and service platforms acting on opportunities, cases and change records
      under a configurable action catalogue.
    asOf: "2026-08"
  - name: Line-of-business SaaS with bolted-on agents
    note: >
      Agent features added to products bought for something else. Same architecture, usually a
      thinner control catalogue and no separate agent identity.
    asOf: "2026-08"

blocks:
  - id: customer
    kind: actor
    title: Customer
    icon: people
    col: 2
    row: 0
    note: >
      The author of the text the agent reads — ticket bodies, form fields, uploads, email replies.
      By construction, someone with an interest in the outcome.

  - id: reviewer
    kind: actor
    title: Service staff
    icon: person
    col: 0
    row: 1
    note: >
      Approves the actions the catalogue gates, and reverses the ones nobody gated. The threshold
      between those two is this archetype's central configuration decision.

  - id: edge
    kind: service
    title: Identity & network edge
    col: 1
    row: 1
    note: >
      How staff reach the vendor and who they are asserted to be. The same channel supervises the
      agent and configures it, so it deserves privileged-access treatment.
    items:
      - id: idp
        label: Identity provider
        icon: key
        note: Authenticates staff, and — where the vendor supports it — anchors a distinct identity for the agent instead of a shared service account.
      - id: inspection
        label: Network inspection
        icon: shield
        note: What is being sent to the vendor, and what its callbacks bring back.

  - id: vendor
    kind: provider
    title: Vendor agent platform
    col: 2
    row: 1
    note: >
      The loop runs here and no policy decision point can be inserted into it. Only the published
      surfaces are drawn — the decision to act and the act itself both happen inside the boundary.
    items:
      - id: agentSurface
        label: In-app agent
        icon: agent
        note: The agent feature as users and customers meet it. Reads case text as context; acts on records with the tenant's authority.
      - id: recordApis
        label: Record & case APIs
        icon: db
        note: The product's published interfaces over your records — where the agent's writes land first.
      - id: integrations
        label: Integration framework
        icon: plug
        note: How the agent reaches beyond the vendor's data model, on service principals you issued — scoped per integration, not per action.

  - id: downstream
    kind: external
    title: Your downstream systems
    col: 3
    row: 2
    note: >
      Billing, entitlements, directory — reached through integrations the agent can invoke, and
      the point where a wrong action stops being reversible by editing a record. Frequently the
      real blast radius, and frequently forgotten.
    items:
      - id: billing
        label: Billing & entitlements
        icon: db
        note: Where a refund or an account change becomes money and access.
      - id: directory
        label: Directory & downstream apps
        icon: people
        note: Systems the integration credential can touch that no single action needed.

  - id: governance
    kind: governance
    title: Tenant governance
    col: 4
    row: 0
    rowSpan: 3
    note: >
      Everything here is configuration the vendor enforces or telemetry you collect — the control
      plane collapses to the edges you own, because the loop itself cannot be instrumented.
    items:
      - id: catalogue
        label: Action catalogue & thresholds
        icon: gear
        note: Which actions, on which record types, and where a human is required. Generous by default, because autonomy is what the product is sold on.
      - id: agentIdentity
        label: Agent identity
        icon: key
        note: A distinct, revocable principal for the agent. Without it, nothing it does is separately attributable or revocable.
      - id: monitoring
        label: Outcome monitoring
        icon: eye
        note: Refund rates, escalation rates, records touched — measured from first-party systems, because the vendor's view of its own agent is the vendor's.
      - id: disable
        label: Disable control
        icon: stop
        note: Turning the agent off without a vendor support ticket. Confirm it exists during evaluation, not during an incident.

  - id: admin
    kind: actor
    title: Administrator
    icon: person
    col: 4
    row: 3
    note: >
      Authors the tenant configuration. Administering the agent is administering everything it may
      do, so this role is the privileged one on the diagram.

edges:
  - from: customer
    to: vendor
    path: external
    label: case text & attachments
    note: >
      Untrusted content enters the agent's context directly. The vendor's guardrail on it is
      configurable and not verifiable, which is why the catalogue and the reversal path carry the
      real weight.
  - from: reviewer
    to: edge
    path: primary
    bidir: true
    label: supervision / approvals
    note: >
      Approval requests come out to staff and decisions go back. Only actions the catalogue marks
      as gated ever appear here — everything else has already happened by the time anyone looks.
  - from: edge
    to: vendor
    path: primary
    bidir: true
    note: >
      Authenticated staff sessions for supervision and administration. Privileged access to this
      console is privileged access to the agent's entire permission set.
  - from: vendor
    to: downstream
    path: external
    bidir: true
    label: integration writes
    note: >
      The agent writes to your systems of record on integration credentials scoped per system,
      not per action — it inherits everything the credential can do.
  - from: downstream
    to: governance
    path: governance
    label: outcome telemetry
    note: >
      First-party records of what actually changed, measured outside the provider boundary —
      which is what makes them reliable.
  - from: governance
    to: vendor
    path: governance
    label: catalogue / identity / disable
    note: >
      You author the configuration, the provider enforces it, and neither can verify the other —
      the canonical shared-responsibility edge on this surface.
  - from: admin
    to: governance
    path: governance
    label: tenant configuration
    note: The catalogue, thresholds and identity settings are authored here, once, and rarely revisited against a product sold on autonomy.

pins:
  risks:
    - risk: riskPromptInjection
      at: customer->vendor
      note: >
        The shortest path in this catalogue from untrusted input to consequential action — no
        breach required, just a text field.
    - risk: riskModelEvasion
      at: customer
      note: The author of the input has a stake in the outcome, and unlimited retries at steering the agent's decision.
    - risk: riskRogueActions
      at: vendor->downstream
      note: Consequential writes with no human present, decided inside a loop nobody outside the vendor can observe.
    - risk: riskAgenticDelegationConfusedDeputy
      at: vendor->downstream
      note: >
        The agent acts through integration credentials issued for a system, not for a decision.
        Its authority is the union of every integration.
    - risk: riskExcessiveDataHandling
      at: vendor
      note: The connector grants set the reach and the action catalogue sets the intent, and neither is scoped by the other.
    - risk: riskInsecureIntegratedComponent
      at: vendor
      note: The loop is entirely unobservable and untestable — the whole platform is one integrated component your assurance programme has to stand in for.
    - risk: riskSensitiveDataDisclosure
      at: edge->vendor
      note: Record contents and case data flow to the vendor's boundary, visible to you only at the network path.
    - risk: riskStaleAgentIdentityBinding
      at: governance
      note: Where the agent shares a service account, its access outlives any single configuration decision and cannot be individually revoked.

  capabilities:
    - capability: capabilityToolPermissionScoping
      at: governance->vendor
      note: >
        Author the action catalogue deliberately — which actions, on which record types, under
        which conditions. The defaults are generous; the catalogue is your allowlist.
    - capability: capabilityHitlControls
      at: vendor->downstream
      note: Set approval thresholds so consequential and irreversible writes escalate to staff before they land, sized to blast radius.
    - capability: capabilityNhiManagement
      at: governance
      note: Give the agent a distinct, revocable principal and scope each integration credential to what the agent actually needs.
    - capability: capabilityKillSwitch
      at: governance->vendor
      note: Verify the disable control exists and test it during evaluation — on this surface it is a product feature, not something you can build.
    - capability: capabilityPromptInjectionDefense
      at: customer->vendor
      note: Enable and verify the vendor's guardrails on customer-supplied text, and treat every case field as adversarial in your catalogue decisions.
    - capability: capabilityIga
      at: edge
      note: Treat admin-console access as privileged access — it is the agent's entire permission set.
    - capability: capabilityBehavioralDriftDetection
      at: downstream->governance
      note: Watch outcome rates — refunds, escalations, records touched — from first-party data; behavioural monitoring substitutes for runtime enforcement you cannot install.
    - capability: capabilityAuditLogging
      at: downstream
      note: Keep first-party records of what changed — often the only trustworthy account of what the agent did, because the provider does not write it.
    - capability: capabilityAiTprm
      at: vendor
      note: Assess the platform as a supply-chain dependency — its loop, guardrails and tenancy cannot be tested directly.
    - capability: capabilityVendorAssurance
      at: vendor
      note: Contractual commitments on the agent's behaviour, incident notice and your right to telemetry — the only control that crosses the boundary.
    - capability: capabilityAiGovernancePlatform
      at: admin->governance
      note: Manage the tenant configuration as governed policy with review cycles, not a console someone set once.
    - capability: capabilitySse
      at: edge
      note: Inspect the vendor path inline — what is sent, and what callbacks return.

scenarios:
  - title: A customer's ticket steers the agent
    steps:
      - follow: customer->vendor
        note: Instructions embedded in a case field enter the agent's context as it reads the ticket.
      - follow: vendor->downstream
        note: The steered decision becomes a write — a refund issued through an integration credential scoped to the whole billing system.
      - follow: downstream->governance
        note: Outcome monitoring flags the refund-rate anomaly from first-party data.
      - follow: governance->vendor
        note: The catalogue is tightened or the agent disabled — the only interventions the surface offers.
  - title: A gated action escalates to a human
    steps:
      - follow: customer->vendor
        note: A request lands above the threshold the catalogue marks as gated.
      - follow: vendor->edge
        note: The approval request leaves the vendor — the one moment the loop waits.
      - follow: edge->reviewer
        note: Staff see the proposed action and its context.
      - follow: reviewer->edge
        note: The decision goes back; everything below the threshold never appears here at all.
      - follow: vendor->downstream
        note: The approved write lands on the system of record.
  - title: Tenant configuration is the control plane
    steps:
      - follow: admin->governance
        note: The catalogue, thresholds, agent identity and disable control are authored — each one a vendor-exposed setting.
      - follow: governance->vendor
        note: The provider enforces what you authored. There is no independent way to verify the enforcement, which is what assurance compensates for.

