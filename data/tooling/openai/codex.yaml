              - In Codex Cloud > Settings > Connectors revoke the service-account token and generate a new one; a saved
                token is encrypted and never shown again.
            url: https://learn.chatgpt.com/docs/third-party/gitlab
          - title: Scope the tunnel credential
            body:
              - Grant Tunnels Read + Use only to the identity running tunnel-client, keep its runtime API key in a
                secret store, and add control-plane mTLS where required.
            url: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels
        note: >-
          Partial by the rule applied to every vendor: environment secrets are encrypted and setup-only, but whether a
          saved secret can be read back is not documented, and environment variables are plain values visible to the
          agent and to everyone sharing the environment. The GitLab connector token is encrypted, never shown again and
          admin-rotatable, but it is an api-scoped personal access token whose lifetime the org sets in GitLab; how
          the GitHub credential is held and how long it lives is not documented. A vendor tunnel exists: Secure MCP
          Tunnel serves ChatGPT, Codex and the Responses API, tunnel-client authenticates to OpenAI with a runtime
          Platform API key and optional control-plane mTLS, access is scoped by Platform RBAC (Tunnels Read, Use,
          Manage) and tunnel changes appear in Platform audit logs, but the tunnel page documents no rotation or
          revocation procedure for that key, and it does not say whether Codex cloud sessions can call a
          tunnel-backed server.
        verified: "2026-09-25"
