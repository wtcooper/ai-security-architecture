id: identity            # the key feed items and deep dives carry in `category`
slug: stolen-ai-credentials         # its address: /incidents/stolen-ai-credentials/
order: 3
name: "Stolen AI credentials and LLMjacking"
short: "Keys, tokens and accounts that reach AI systems are stolen, resold and spent, often on someone else's bill."
since: 2026-11-25
overview: >-
  A provider key, gateway key or OAuth token is the whole authentication: whoever holds it calls
  the model or reads the data, with no password or MFA prompt in the path. Infostealers copy such
  credentials, platforms that call models for their customers hold them in bulk, and forgotten
  integrations and datasets keep them. In 2026 GTIG described crews that test stolen keys with
  one-token calls and resell the access; one service passed nearly $1 million in token costs to
  one victim. Breaches at Fireworks, Railway, OpenCode's Console and Andromeda put customers' keys
  and data in others' hands. Short-lived, scoped keys behind your own gateway, with caps and logs,
  limit what a stolen one is worth.
howItWorks:
  - "A key, token or account that reaches an AI system is taken: from an infostealer log, a platform that stores customers' keys, or a forgotten integration."
  - "The holder proves it with one-token calls, then sells it or spends it; some crews lift a gateway key to admin through a flaw in the gateway."
  - "The access is resold through gateways that pool stolen keys, and the spend lands on the victim's provider account."
  - "Where the credential opens data rather than models, it reads datasets, traces or prompts, and the credentials inside them lead further."
signs:
  - "Model charges or token use nobody ran up, on models or in regions the team does not use."
  - "Sweeps of calls with max_tokens=1, key regeneration, or models enabled that nobody asked for."
  - "Your data read under a vendor's own identity, which your alerts do not watch."
stops:
  - control: D3-CH
    how: "Short-lived keys scoped by model, environment and spend, kept in your own gateway's vault, so a leaked or resold key opens little and expires."
  - control: D3-AA
    how: "Callers and jobs present a workload identity checked on every request, not a bearer key, so a key bought from the crew that stole it stops working."
  - control: AML.M0004
    how: "Per-key quotas and spending caps put a ceiling on what a stolen key can run up in a day."
  - control: AML.M0024
    how: "Log every key's use and every vendor identity's access: one-token sweeps are a tell, and Uber's alerts never fired for an intruder who came as Fireworks."
  - control: cap-agent-tool-registry
    how: "An inventory of AI integrations and their grants, so a forgotten prototype token or an OAuth grant to a small AI tool is known before someone finds it."
  - control: cap-agent-kill-switch
    how: "With keys behind your gateway, revoking a tool's access there cuts it off at once, without rotating at the provider and in every tool."
risks: [riskCrossTenantCredentialPropagation, riskEconomicDenialOfWallet, riskStaleAgentIdentityBinding, riskShadowAndUnknownAgents, riskSensitiveDataDisclosure]
owasp: [ASI03, MCP01:2025, LLM06:2026, LLM02:2026]
atlas: [AML.T0012, AML.T0055, AML.T0083, AML.T0091.000, AML.T0034, AML.T0008.005]
notSameAs:
  - pattern: exploitedSoftware
    why: "When a flaw hands over the tokens, as in Mittwald's MCP server, the chain started with exploited software; here it starts with a key already taken."
  - pattern: aiMadeExposure
    why: "A key an agent committed or saved to a shared file is AI-made exposure, even when someone then spends it; the leak is where the chain started."
  - pattern: aiAttacker
    why: "Attackers' agents that hunt exposed gateways for keys themselves, as ARTEX's did, are filed as AI-run intrusions."
