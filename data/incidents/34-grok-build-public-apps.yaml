id: grok-build-public-apps
title: "Grok Build: anyone with the link preselected, and 35,578 of 37,571 apps open without sign-in"
subtitle: >
  Grok's Build mode writes an app from a chat and hosts it at its own grok.me address, and in the
  account Claroc tested the publish step had "Anyone with the link" already selected. Passive DNS
  gave the researchers the addresses; 94.7% of the live apps opened for anyone, 24 of them built by
  SpaceXSI and X staff.
date: 2026-11
dateRange: 8 – 12 November 2026 (published 10 November)
category: aiMadeExposure
perspective: target
# Build mode in Grok writes the app and SpaceXSI publishes and hosts it on grok.me: the vendor runs the agent, the publish step and the hosting, so the hosted app builder; the Grok Build command-line tool, a coding agent, plays no part.
archetype: archHostedAppBuilder
caveat: >
  Claroc, which sells security tools for AI-built apps, is the only first-hand account, and the
  press repeats it. Its figures for apps with private data (roughly 650 to 800, about one in ten)
  are its own estimate from a sample, and it gives both 43,601 and 43,551 for the addresses it
  tried. It tested from one paid account: SpaceXSI says employee accounts default to "Only you",
  and a company representative told Ars Technica, as The Next Web reports, that apps are private
  by default. Claroc does not say whether anyone else opened the apps.
breaks:
  - control: D3-APA
    how: "A default audience of the maker or the workspace, with only admins able to publish to anyone with the link, makes the preselected choice the safe one."
  - control: AML.M0029
    how: "An app published beyond the workspace waits for an admin who sees its audience and its data; here the maker's click was the only decision."
  - control: D3-AVE
    how: "A blocking scan that flags an app with a database and no sign-in, the warning Claroc asked Grok to add, stops both test apps at publish."
  - control: D3-AI
    how: "A list of every published app with its owner and audience finds apps like the 24 staff apps before a researcher does."
  - control: cap-shadow-ai-discovery
    how: "Searching passive DNS for the organisation's own apps on builder domains, Claroc's advice to organisations, uses the same records the researchers did."
  - control: cap-agent-kill-switch
    how: "An admin who can unpublish any app at once does not wait on the vendor, which took down its own staff's apps and left everyone else's up."
summary:
  - >
    In Grok's Build mode people describe an app in the chat, Grok writes it, and the app is
    published at its own hostname under grok.me. In the paid account Claroc used, the publish
    panel offered "Anyone with the link", "Invited users" and "Only you", with "Anyone with the
    link" already selected. Claroc's two test apps showed what that let through: a contact list
    with a database and no sign-in, which a stranger could write to, and a customer list whose
    generated Continue with Google added whoever signed in to the team before checking.
  - >
    Each app's hostname is findable in passive DNS. Claroc listed the names under grok.me and
    opened each app's first page once, signed in to nothing: of 37,571 still online, 35,578
    (94.7%) opened. About one in ten held internal business or personal data by Claroc's
    estimate, among them 24 apps built by SpaceXSI and X staff, a hospital group's roster of
    more than 3,500 staff and an ICU patient's briefing.
  - >
    Claroc reported on 8 November and published on 10 November. SpaceXSI took down its staff's
    24 apps but not other users' and organisations' apps, and said Grok apps are private until
    their creator shares one. The lesson is the default: when the publish step proposes the
    internet, every maker who accepts it publishes there, whatever the app holds.
patterns:
  - Open Audience by Default
  - Hostname Discovery through Passive DNS
  - Generated Sign-in That Always Passes
risks:
  - riskSensitiveDataDisclosure
  - riskInsecureModelOutput
  - riskShadowAndUnknownAgents
steps:
  - n: 1
    title: Build mode writes the app, its database and its sign-in
    phase: introduced
    narrative: >
      In Grok's Build mode people describe an app in the chat and Grok writes it. Claroc built two
      test apps. A contact list "got a database and no sign-in". A customer list with Continue
      with Google and Continue with X got code that adds whoever signs in to the team before it
      checks whether they are on it, so the check always passes.
    path: [maker->builder, builder->appData]
    risks:
      - riskInsecureModelOutput
    sources:
      - title: "GhostShares 2: Grok Apps Exposed xAI's Business Secrets and People's Private Data"
        url: https://blog.claroc.io/ghostshares-grok-build-apps/
        publisher: Claroc Research
        date: 2026-11-10
  - n: 2
    title: "Publish: the audience is already set to anyone with the link"
    phase: introduced
    narrative: >
      In the paid account Claroc used, the publish panel offered "Anyone with the link", "Invited
      users" and "Only you", with "Anyone with the link" already selected, and the researchers
      published their test apps with what Grok proposed. Claroc describes no warning at publish
      for an app with a database and no sign-in, and recommends one. SpaceXSI said employee
      accounts are set to "Only you" by default.
    path: [maker->publish, publish->appHosting]
    risks:
      - riskSensitiveDataDisclosure
    sources:
      - title: "GhostShares 2: Grok Apps Exposed xAI's Business Secrets and People's Private Data"
        url: https://blog.claroc.io/ghostshares-grok-build-apps/
        publisher: Claroc Research
        date: 2026-11-10
      - title: "No Login Needed: Over 35,000 Grok Apps Were Publicly Accessible"
        url: https://www.esecurityplanet.com/artificial-intelligence/news-grok-ai-apps-accessible-without-login/
        publisher: eSecurity Planet
        date: 2026-11-12
  - n: 3
    title: Passive DNS gives out the addresses
    phase: exposed
    narrative: >
      Each Grok app gets its own hostname, and passive DNS services, which collect lookups from
      the resolvers they run or buy data from, let anyone with an account search them by pattern.
      Using common subdomain discovery techniques, Claroc listed 43,601 names under grok.me (its
      key points give 43,551 addresses tried). Nothing had to be guessed.
    path: [visitors->browser, browser->openWeb, openWeb->browser]
    risks:
      - riskSensitiveDataDisclosure
    sources:
      - title: "GhostShares 2: Grok Apps Exposed xAI's Business Secrets and People's Private Data"
        url: https://blog.claroc.io/ghostshares-grok-build-apps/
        publisher: Claroc Research
        date: 2026-11-10
      - title: "SpaceXSI's Grok Build left 35,000 apps open, security firm Claroc says"
        url: https://thenextweb.com/news/grok-build-apps-exposed-claroc-spacexsi
        publisher: The Next Web
        date: 2026-11-12
  - n: 4
    title: 35,578 of 37,571 live apps open with no sign-in
    phase: exposed
    narrative: >
      The researchers opened the first page of each app once, from the public internet, signed in
      to nothing. Of 37,571 apps still online, 35,578 (94.7%) opened and 1,993 returned HTTP 401.
      Claroc estimates that about one in ten held sensitive material, internal business data or
      personal data, roughly 650 to 800 apps with private data. The 24 open apps built by
      SpaceXSI and X staff included a confidential onboarding plan, a sales territory map of 594
      accounts and an advertising proposal to a US federal agency marked confidential. Others held
      a hospital group's roster of more than 3,500 staff, an ICU patient's briefing with labs and
      ventilator status, and the data of 30 other organisations Claroc could identify, six of
      them in the Fortune 500.
    path: [browser->appHosting]
    risks:
      - riskSensitiveDataDisclosure
      - riskShadowAndUnknownAgents
    sources:
      - title: "GhostShares 2: Grok Apps Exposed xAI's Business Secrets and People's Private Data"
        url: https://blog.claroc.io/ghostshares-grok-build-apps/
        publisher: Claroc Research
        date: 2026-11-10
      - title: "SpaceXSI's Grok Build left 35,000 apps open, security firm Claroc says"
        url: https://thenextweb.com/news/grok-build-apps-exposed-claroc-spacexsi
        publisher: The Next Web
        date: 2026-11-12
  - n: 5
    title: The page and the database answer a stranger
    phase: exposed
    narrative: >
      A contractor's timesheet app held 18 accounts with plain-text passwords in a script that
      every visitor's browser downloads. On their own test apps the researchers, in an incognito
      window and signed in to nothing, added a row to the contact list that the next visitor saw,
      and a Google account that was not the owner's and had never been invited could read, edit
      and delete every customer record.
    path: [browser, browser->appData]
    risks:
      - riskSensitiveDataDisclosure
      - riskInsecureModelOutput
    sources:
      - title: "GhostShares 2: Grok Apps Exposed xAI's Business Secrets and People's Private Data"
        url: https://blog.claroc.io/ghostshares-grok-build-apps/
        publisher: Claroc Research
        date: 2026-11-10
  - n: 6
    title: The staff apps come down, the rest stay up
    phase: exposed
    narrative: >
      Claroc reported the counts, its two test apps and four proposed fixes to SpaceXSI on 8
      November and the other 22 staff apps on 9 November. By 10 November SpaceXSI had taken down
      the 24 apps its staff had built, but not other users' and organisations' apps, so Claroc
      began notifying affected organisations itself. SpaceXSI said Grok apps are private until
      their creator chooses to share one; Claroc answered that the access step still preselects
      "Anyone with the link".
    path: [appHosting]
    sources:
      - title: "GhostShares 2: Grok Apps Exposed xAI's Business Secrets and People's Private Data"
        url: https://blog.claroc.io/ghostshares-grok-build-apps/
        publisher: Claroc Research
        date: 2026-11-10
      - title: "SpaceXSI's Grok Build left 35,000 apps open, security firm Claroc says"
        url: https://thenextweb.com/news/grok-build-apps-exposed-claroc-spacexsi
        publisher: The Next Web
        date: 2026-11-12
  - n: 7
    title: Where this chain breaks
    phase: mitigated
    narrative: >
      Make the workspace's default audience the maker or the workspace, let only admins publish
      to anyone with the link, and require an admin's approval for any app published outside the
      workspace, so the choice the publish step proposes is not the internet. Make the publish
      scan blocking, and have it flag an app with a database and no sign-in, as Claroc proposed.
      Keep a list of every published app with its owner and audience, search passive DNS for the
      organisation's own apps on the builders' domains and open them signed out, and be able to
      unpublish any of them at once rather than wait on the vendor.
    path: [govIdentity, govPolicy, govSupplyChain, govObservability, appHosting, publish->appHosting, maker->publish, admin->publish]
    sources:
      - title: "GhostShares 2: Grok Apps Exposed xAI's Business Secrets and People's Private Data"
        url: https://blog.claroc.io/ghostshares-grok-build-apps/
        publisher: Claroc Research
        date: 2026-11-10
alsoSeen:
  - title: "Base44: a sign-in bypass lets anyone with an app's id into any private app"
    date: July 2025
    note: >
      Wiz found that Base44's register and verify-OTP endpoints needed no authentication, so
      anyone with an app's id, visible in its URL, could register and verify an account on a
      private app, SSO-only apps included. The platform's own gate in front of every app was the
      flaw: reported on 9 July 2025, fixed in less than 24 hours, and Base44 found no evidence that
      any customer was affected.
    sources:
      - title: "Wiz Research Uncovers Critical Vulnerability in AI Vibe Coding platform Base44 Allowing Unauthorized Access to Private Applications"
        url: https://www.wiz.io/blog/critical-vulnerability-base44
        publisher: Wiz Research
        date: 2025-07-29
  - title: "Lovable: a regression opens public projects' chats and code to any user with a link"
    date: February – April 2026
    note: >
      From 3 February to 20 April 2026, backend regressions let any Lovable user with a project
      link read the chat history and source code of public projects. Reports from 22 February were
      closed without escalation, because the triage team's documentation still called it intended.
      Lovable fixed it within two hours of a public report and made historically public projects
      private. The researcher said database credentials sat in the exposed code; Lovable's post
      does not mention credentials.
    sources:
      - title: "Our response to the April 2026 incident"
        url: https://lovable.dev/blog/our-response-to-the-april-2026-incident
        publisher: Lovable
        date: 2026-04-22
      - title: "Vibe coding upstart Lovable denies data leak, cites 'intentional behavior,' then throws HackerOne under the bus"
        url: https://www.theregister.com/2026/04/20/lovable_denies_data_leak/
        publisher: The Register
        date: 2026-04-21
