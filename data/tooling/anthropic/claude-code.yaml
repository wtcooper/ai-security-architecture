  - id: toolClaudeCodeWeb
    name: Claude Code on the web (cloud sessions)
    surfaceClasses:
      - cloudAgent
    variants:
      - name: claude.ai/code and the Claude mobile app
        class: cloudAgent
        url: https://code.claude.com/docs/en/claude-code-on-the-web
      - name: claude --cloud from the CLI and cloud sessions from Claude Desktop
        class: cloudAgent
        url: https://code.claude.com/docs/en/desktop
      - name: Routines (scheduled cloud sessions), Code Review and Ultrareview
        class: cloudAgent
        url: https://code.claude.com/docs/en/routines
        note: Features of the same cloud runtime; Code Review is Team/Enterprise only.
      - name: Self-hosted environments (runners on your infrastructure, public beta)
        class: cloudAgent
        url: https://code.claude.com/docs/en/self-hosted-environments
        note: >-
          Execution moves to your network; orchestration, queueing, the transcript and inference
          stay with Anthropic. Not routable through Bedrock/Vertex/Foundry or an LLM gateway.
    architecture: archManagedAgentRuntime
    status: preview
    asOf: "2026-09"
    summary:
      - >-
        Claude Code sessions that run on Anthropic-managed VMs (research preview for Pro, Max,
        Team and Enterprise premium / Chat + Claude Code seats) rather than on the developer's
        machine. The VM clones the GitHub repository, works on a branch, and can open pull
        requests; a security proxy carries git and MCP traffic with scoped credentials so the
        user's GitHub token never enters the sandbox. Sessions persist after the browser closes,
        can be driven from the mobile app, Slack (Claude Tag) or the CLI, and are reclaimed after
        inactivity. Organisations that need execution on their own network run self-hosted
        environments; inference still goes to api.anthropic.com with a session-scoped OAuth token.
      - >-
        Admin control is server-side only: device managed-settings files and MDM policies do not
        reach cloud sessions, so policy comes from server-managed settings (claude.ai Admin
        Settings > Claude Code > Managed settings), organisation-shared cloud environments
        (network access level, environment variables, setup script) and the Claude Code admin
        toggles (Code in the web, allow_remote_sessions, Quick web setup, Remote Control,
        Routines). Prompts, code and outputs follow the account's retention policy; ZDR
        organisations cannot use cloud sessions at all, and the Compliance API does not return
        Claude Code web transcripts.
    facts:
      - label: Plans
        value: >-
          Research preview on Pro, Max and Team; Enterprise with premium or Chat + Claude Code
          seats. Not available through Console API keys, Bedrock, Vertex, Foundry or ZDR
          organisations. Repositories must be on GitHub (GHES supported on Team/Enterprise);
          non-GitHub repos can be sent as a bundle but cannot push back.
        url: https://code.claude.com/docs/en/claude-code-on-the-web
      - label: Inference & routing
        value: >-
          Anthropic API from Anthropic-managed infrastructure (so organisation IP allowlists
          block it unless Anthropic-hosted services are exempted); self-hosted environments call
          the API from your network with a session-scoped OAuth token and cannot route through a
          cloud provider or gateway.
        url: https://code.claude.com/docs/en/self-hosted-environments
      - label: Data leaving the device
        value: >-
          The repository is cloned into an isolated VM; all outbound traffic passes a security
          proxy for audit logging; GitHub credentials stay outside the sandbox; with network access
          "No access" the VM can still reach the Anthropic API, which the docs note may allow data
          to exit.
        url: https://code.claude.com/docs/en/security
      - label: Retention & training
        value: >-
          Same commercial policy as local Claude Code (no training on Team/Enterprise/API, 30-day
          retention); session event data is deleted when a user deletes the session; ZDR
          organisations have cloud sessions disabled at the backend.
        url: https://code.claude.com/docs/en/data-usage
      - label: Docs index
        value: code.claude.com/docs (Claude Code on the web, Cloud environments, Self-hosted environments)
        url: https://code.claude.com/docs/en/claude_code_docs_map.md
    riskNotes:
      - risk: riskSensitiveDataDisclosure
        note: >-
          A cloud session can reach any repository the connecting GitHub account can see, not just
          repositories the Claude GitHub App is installed on; restrict at GitHub. Shared
          environments' variables are readable by every member's sessions, so secrets must not go
          there (API credentials that stay outside the sandbox exist only on Pro/Max today).
      - risk: riskRogueActions
        note: >-
          Auto-fix replies to PR comments and pushes fixes under the user's GitHub account and can
          trigger comment-driven automation such as Atlantis; git push is restricted to the working
          branch.
      - risk: riskPromptInjection
        note: >-
          Sessions started from Slack read the whole thread as context; the earlier Claude Code in
          Slack docs warn Claude may follow directions from other messages. Network egress in
          Anthropic-hosted environments defaults to Trusted (package registries and GitHub), which
          bounds exfiltration.
      - risk: riskShadowAndUnknownAgents
        note: >-
          Any member with a seat can start cloud sessions once "Code in the web" is on; Routines
          run unattended on a schedule. Admin toggles and organisation-default environments are
          the inventory levers.
    controls:
      - capability: capabilityIga
        coverage: native
        mechanism: >-
          claude.ai organisation login with SSO/SCIM; per-role Claude Code capability on Enterprise;
          Owner-only admin toggles at claude.ai/admin-settings/claude-code
        steps:
          - title: Gate cloud sessions by seat and role
            body:
              - Assign Claude Code seats and, on Enterprise, grant the Claude Code capability to
                custom roles under Organization settings > Roles; sessions always use the
                subscription login (API keys cannot start them).
            url: https://support.claude.com/en/articles/13930458-set-up-role-based-permissions-on-enterprise-plans
          - title: Decide whether the web surface exists
            body:
              - Owners turn "Code in the web", the allow_remote_sessions policy, Remote Control and
                Quick web setup on or off at claude.ai/admin-settings/claude-code.
            url: https://code.claude.com/docs/en/desktop
        verified: "2026-09-10"
      - capability: capabilityNhiManagement
        coverage: partial
        mechanism: >-
          Sessions run under the user's account with proxy-issued scoped git credentials; self-hosted
          runners register with an environment key and receive runner tokens; Claude Tag channel
          sessions run under an agent identity
        steps:
          - title: Treat the environment key as a workload credential
            body:
              - The environment secret shown once at creation authenticates every runner; store it
                in a secrets manager and rotate it from the Cloud environments admin page.
            url: https://code.claude.com/docs/en/self-hosted-environments
        note: >-
          Anthropic-hosted sessions have no distinct agent identity: GitHub actions appear as the
          user (or the Claude GitHub App). Session identity can be verified by your own services in
          self-hosted environments.
        verified: "2026-09-10"
      - capability: capabilitySecretsManagement
        coverage: partial
        mechanism: >-
          GitHub proxy keeps git credentials and signing keys outside the sandbox; API credentials
          attached by the agent proxy per host (Pro/Max only); environment variables are readable
          by the session
        steps:
          - title: Never put secrets in environment variables
            body:
              - Every session in a shared environment can read its variables and setup script;
                on Pro/Max store keys as API credentials with allowed hosts instead. Team and
                Enterprise do not have API credentials yet.
            url: https://code.claude.com/docs/en/cloud-environments
          - title: Supply git credentials from your own store in self-hosted environments
            body:
              - Configure per-session minted credentials or the Anthropic git proxy in the runner
                deployment rather than baking tokens into the runner image.
            url: https://code.claude.com/docs/en/self-hosted-environments
        verified: "2026-09-10"
      - capability: capabilityEncryptionKeyManagement
        coverage: partial
        mechanism: Anthropic infrastructure-level AES-256 disk encryption and TLS in transit; no CMEK for cloud sessions
        note: >-
          The data-usage page documents infrastructure encryption at rest for the Anthropic API;
          customer-managed keys are an Enterprise chat feature and are not offered for cloud
          session storage.
        steps:
          - title: Confirm the encryption posture
            body:
              - >-
                Review the encryption-at-rest table (Anthropic API: AES-256 infrastructure
                encryption; ZDR removes server-side persistence but disables cloud sessions).
            url: https://code.claude.com/docs/en/data-usage
        verified: "2026-09-10"
      - capability: capabilityAgentRegistry
        coverage: partial
        mechanism: >-
          Session list at claude.ai/code with Team visibility on Team/Enterprise; organisation-shared
          and self-hosted environments managed by Owners on the Cloud environments admin page;
          Routines listed per user
        steps:
          - title: Centralise environments
            body:
              - Owners create organisation-shared environments and set the organisation default on
                the Cloud environments page; Admins cannot open it. Members' own environments are
                personal to their account.
            url: https://code.claude.com/docs/en/cloud-environments
        note: There is no approval workflow or owner record for sessions or routines beyond the user who created them.
        verified: "2026-09-10"
      - capability: capabilityStagedRollout
        coverage: none
        note: >-
          Cloud environments are not versioned and sessions pick up the current settings; the
          docs advise keeping your own change record. No canary or rollback of environment or
          policy changes is offered.
        verified: "2026-09-10"
      - capability: capabilityToolPermissionScoping
        coverage: native
        mechanism: >-
          Server-managed settings (permissions.allow/ask/deny, allowManagedPermissionRulesOnly,
          disableAutoMode) apply to cloud sessions; permission mode is chosen per session from the
          web UI; connectors filtered by allowedMcpServers / deniedMcpServers
        steps:
          - title: Deliver the same permission policy as the desktop fleet
            body:
              - Configure permissions.deny, disableBypassPermissionsMode and
                allowManagedPermissionRulesOnly under Admin Settings > Claude Code > Managed
                settings; endpoint-managed files do not reach Anthropic-hosted sessions.
            url: https://code.claude.com/docs/en/server-managed-settings
          - title: Filter connectors in cloud sessions
            body:
              - Connectors are passed to the cloud VM and filtered by the organisation's
                allowedMcpServers / deniedMcpServers patterns; disableSideloadFlags drops servers
                the server delivered through --mcp-config.
            url: https://code.claude.com/docs/en/managed-mcp
        verified: "2026-09-10"
      - capability: capabilityHitlControls
        coverage: native
        mechanism: >-
          Per-session permission mode picker (Accept edits, Plan, Auto; Bypass unavailable in cloud
          sessions), permissions.ask rules from server-managed settings, MCP connector tool
          approvals that pause the session
        steps:
          - title: Force prompts on named actions
            body:
              - Add permissions.ask rules such as Bash(git push *) in server-managed settings; the
                session waits for the user (and expires if it waits too long) rather than
                auto-approving.
            url: https://code.claude.com/docs/en/auto-mode-config
          - title: Review before merge
            body:
              - Sessions produce a diff and a PR rather than merging; auto-fix acts only on PRs
                where the toggle is on, and the docs recommend disabling it where a PR comment can
                deploy infrastructure.
            url: https://code.claude.com/docs/en/claude-code-on-the-web
        verified: "2026-09-10"
      - capability: capabilityPromptInjectionDefense
        coverage: partial
        mechanism: >-
          Same built-in safeguards as local Claude Code plus the auto-mode classifier and a
          default-limited network egress; Enterprise Inference hooks apply to Claude Code sessions
        steps:
          - title: Keep egress at Trusted or Custom
            body:
              - Set the environment's network access level to Trusted (default) or a Custom
                allowlist so an injected instruction cannot reach arbitrary hosts.
            url: https://code.claude.com/docs/en/cloud-environments
          - title: Add inline prompt inspection (Enterprise, beta)
            body:
              - Configure Inference hooks so every governed Claude Code prompt is sent to your AI
                security server for an allow/deny verdict before inference.
            url: https://platform.claude.com/docs/en/manage-claude/inference-hooks
        verified: "2026-09-10"
      - capability: capabilityAiTprm
        coverage: external
        mechanism: Anthropic Trust Center artifacts (SOC 2 Type 2, ISO 27001) into the buyer's TPRM platform
        note: Vendor evidence is published; cadence and reassessment are the organisation's own TPRM process.
        steps:
          - title: Attach vendor evidence
            body:
              - Pull the Trust Center reports linked from the Claude Code security page into the
                vendor record; the cloud execution section documents the isolation claims to assess.
            url: https://code.claude.com/docs/en/security
        verified: "2026-09-10"
      - capability: capabilityAgentObservability
        coverage: partial
        mechanism: >-
          Session transcript and diff view at claude.ai/code; all outbound traffic through the
          security proxy is logged for audit; self-hosted runners expose metrics and a health
          endpoint and forward OTel from sessions
        steps:
          - title: Read the session record
            body:
              - Each session keeps the full conversation, tool activity and per-file diffs, visible
                to the user and (with Team visibility) the organisation.
            url: https://code.claude.com/docs/en/claude-code-on-the-web
          - title: Export runner and session telemetry when self-hosting
            body:
              - The runner honours the OpenTelemetry variables from network-config and sessions
                inherit them; the reference lists runner metrics and the health endpoint.
            url: https://code.claude.com/docs/en/self-hosted-environments
        note: >-
          Anthropic-hosted sessions do not expose an OTLP export to the organisation's collector
          and the Compliance API does not return Claude Code web transcripts.
        verified: "2026-09-10"
      - capability: capabilityAuditLogging
        coverage: partial
        mechanism: >-
          Anthropic logs all cloud-session operations and proxy traffic for compliance; admin
          console changes appear in the Enterprise audit log / Compliance API Activity Feed;
          session transcripts are not exported
        steps:
          - title: Export admin and settings events
            body:
              - Enterprise Owners export audit logs (180 days) from Organization settings > Data and
                privacy or query the Compliance API Activity Feed; server-managed settings changes
                are audited there.
            url: https://support.claude.com/en/articles/9970975-access-audit-logs
        note: >-
          The Compliance API session endpoints explicitly exclude Claude Code on the web; the
          vendor's own operation logs are not customer-accessible.
        verified: "2026-09-10"
      - capability: capabilityModelGuardrails
        coverage: partial
        mechanism: >-
          Anthropic's model-side safety systems, the auto-mode classifier, and organisation model
          restrictions / effort caps enforced server-side for claude.ai members
        steps:
          - title: Restrict models and effort for the organisation
            body:
              - On Enterprise, disable individual models and cap effort per role from the
                organisation admin settings; these are enforced server-side for claude.ai sign-ins.
            url: https://code.claude.com/docs/en/admin-setup
        note: No admin-configurable topic or content filter exists for cloud sessions.
        verified: "2026-09-10"
      - capability: capabilityMemoryProtection
        coverage: partial
        mechanism: >-
          Session VMs are reclaimed after inactivity and conversation history is restored on
          reopen; users can delete sessions permanently; auto memory follows the repository's
          settings
        steps:
          - title: Delete sessions and bound the VM lifetime
            body:
              - Users delete sessions (event data removed permanently) from the sidebar; VMs are
                automatically reclaimed after inactivity and background work is not restored.
            url: https://code.claude.com/docs/en/claude-code-on-the-web
        verified: "2026-09-10"
      - capability: capabilityModelEvals
        coverage: none
        note: >-
          No evaluation harness or release gate is exposed for cloud sessions; the vendor's own
          model evaluations are published in system cards, not as a customer control.
        verified: "2026-09-10"
      - capability: capabilityAiGovernancePlatform
        coverage: external
        mechanism: Claude Code analytics dashboard and Enterprise Analytics API feed the organisation's governance system of record
        steps:
          - title: Pull adoption data into your governance platform
            body:
              - Use the analytics dashboard at claude.ai/analytics/claude-code or the Enterprise
                Analytics API (read:analytics key) for per-user engagement and cost reports.
            url: https://code.claude.com/docs/en/analytics
        verified: "2026-09-10"
      - capability: capabilityRateLimiting
        coverage: partial
        mechanism: >-
          Cloud sessions share the account's rate limits; organisation and per-user spend limits in
          the admin console; no per-session budget or time cap
        steps:
          - title: Set organisation, group and user spend limits
            body:
              - Configure limits under Organization settings > Usage (org default, by group, per
                user); Claude Code, Cowork and chat draw from the same consumption pool.
            url: https://support.claude.com/en/articles/14782391-claude-enterprise-consumption-guide
        note: Sessions stop only when the account's limits are exhausted; there is no turn or wall-clock cap for a cloud session.
        verified: "2026-09-10"
      - capability: capabilityKillSwitch
        coverage: partial
        mechanism: >-
          Owner toggles (Code in the web, allow_remote_sessions, Remote Control, Allow self-hosted
          environments), seat removal, session archive/delete, runner --retire-at and SIGTERM drain
        steps:
          - title: Turn the surface off
            body:
              - Owners disable "Code in the web" and allow_remote_sessions at
                claude.ai/admin-settings/claude-code; new cloud sessions then fail with a policy
                error.
            url: https://code.claude.com/docs/en/claude-code-on-the-web
          - title: Stop runners cleanly
            body:
              - Self-hosted runners drain on SIGTERM or at --retire-at, releasing sessions so they
                resume elsewhere; revoking the environment key stops new claims.
            url: https://code.claude.com/docs/en/self-hosted-environments
        note: Running Anthropic-hosted sessions are not remotely terminable by an admin; they end at inactivity.
        verified: "2026-09-10"
      - capability: capabilityVendorAssurance
        coverage: partial
        mechanism: >-
          Compliance API organisation settings endpoint and Activity Feed expose effective settings
          and admin actions to posture tooling; server-managed settings are readable by Owners
        steps:
          - title: Read effective settings programmatically
            body:
              - Use the Compliance API directory endpoints (organizations, users, roles, groups and
                each organisation's effective settings) with a Compliance Access Key to evidence the
                configuration.
            url: https://platform.claude.com/docs/en/manage-claude/compliance-api
        verified: "2026-09-10"
