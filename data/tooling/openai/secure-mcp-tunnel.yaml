# Secure MCP Tunnel — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
#
# Verified 2026-09-10 against developers.openai.com/api/docs/guides/secure-mcp-tunnels and the
# openai/tunnel-client repository. Placed on archEnterpriseAiChat because its job is to let
# ChatGPT connectors (and the Responses API and Codex) reach private MCP servers.
# 2026-09-25: re-verified toolOpenaiMcpTunnel against the MITRE capability rules; tunnel-client docs read through the GitHub API at master (release v0.0.15, published 2026-09-25; no published security advisories); developers.openai.com .../organization/subresources/audit_logs/methods/list and .../projects/subresources/api_keys/methods/delete redirect to .../admin/subresources/organization/...; learn.chatgpt.com/docs/enterprise/secure-mcp-tunnels 404 and no learn.chatgpt.com admin page mentions tunnels; platform.openai.com settings pages 403 (sign-in); help.openai.com developer-mode article 403 (plan policy unverified); trust.openai.com read from its server-rendered HTML.
vendor: openai
family: Secure MCP Tunnel
tools:
  - id: toolOpenaiMcpTunnel
    name: Secure MCP Tunnel (tunnel-client)
    surfaceClasses:
      - chatIntegration
    variants:
      - name: tunnel-client (binary and ghcr.io/openai/tunnel-client container)
        class: chatIntegration
        url: https://github.com/openai/tunnel-client
    architecture: archEnterpriseAiChat
    status: ga
    asOf: "2026-09"
    summary:
      - >-
        Secure MCP Tunnel lets a private or localhost MCP server serve ChatGPT developer-mode apps, the
        Responses API and Codex without inbound exposure: a customer-run tunnel-client polls api.openai.com
        (or mtls.api.openai.com) over outbound HTTPS, forwards each request to the local stdio or HTTP MCP
        server, and returns the response through the same tunnel.
      - >-
        The tunnel itself carries no inference; it is the connectivity leg between OpenAI's hosted chat and
        the organisation's tool server, which is why it sits on the enterprise-chat architecture. Tunnels are
        created, edited and deleted in Platform tunnel settings and associated with one or more Platform
        organisations or ChatGPT workspaces; tunnel-client authenticates with a Restricted runtime API key
        (CONTROL_PLANE_API_KEY, Tunnels Read + Use) created and revoked on the Platform API keys page,
        optionally adds control-plane mTLS, can present its own mTLS certificate to the MCP server, and
        supports outbound proxies and custom CA bundles.
      - >-
        Audit is split: tunnel.created / updated / deleted appear in Platform audit logs, but control-plane
        tunnel traffic is not emitted as Compliance Platform app events; app-level invocation and
        auth-lifecycle logging still applies when ChatGPT reaches the app through the tunnel.
    facts:
      - label: Plans
        value: >-
          Platform organisation permissions (Tunnels Read / Read + Manage / Read + Use); ChatGPT
          developer-mode access is granted separately by workspace admins.
        url: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels
      - label: Inference & routing
        value: >-
          No inference; requests are polled from api.openai.com:443 or mtls.api.openai.com:443 and forwarded
          to the private MCP server.
        url: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels
      - label: Data leaving the device
        value: >-
          MCP requests and responses transit OpenAI's control plane; the MCP server address stays private to
          the tunnel-client environment.
        url: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels
      - label: Retention & training
        value: >-
          Tunnel traffic is not emitted as Compliance Platform app events; app-level logs apply. API data is
          not used for training by default.
        url: https://developers.openai.com/api/docs/guides/your-data
      - label: Docs index
        value: developers.openai.com/api/docs/guides/secure-mcp-tunnels
        url: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels
    riskNotes:
      - risk: riskCrossTenantCredentialPropagation
        note: >-
          A tunnel can be associated with several organisations or workspaces; every association is a tenant
          that can reach the private server.
      - risk: riskAgenticDelegationConfusedDeputy
        note: >-
          The tunnel presents one runtime key; per-user authorization has to happen in the MCP server or the
          app's auth flow.
      - risk: riskStaleAgentIdentityBinding
        note: >-
          The runtime key is a Platform API key that expires only if it was created with an expiry or the
          organisation enforces a maximum key lifetime; a forgotten tunnel keeps polling until its key is
          revoked or the tunnel is deleted.
    controls:
      - mitigation: D3-MFA
        coverage: notApplicable
        mechanism: >-
          Not applicable — the tunnel has no human sign-in; the people who manage and attach it sign in to the
          OpenAI Platform organisation and the ChatGPT workspace
        evidence:
          - title: Secure MCP Tunnel — Permissions and access (checked 2026-09-25)
            url: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels
          - title: Manage permissions in the OpenAI platform (roles, groups, SCIM)
            url: https://developers.openai.com/api/docs/guides/rbac
        note: >-
          tunnel-client authenticates as a workload (runtime API key, optional control-plane mTLS; see D3-CH
          and D3-AA), never as a person, so there is no login to put a second factor on. The pin's objective —
          an employee landing in the corporate tenant — is the ChatGPT workspace's sign-in (toolChatgptDesktop).
          The humans who create tunnels, mint runtime keys and attach tunnels to apps sign in to the OpenAI
          Platform organisation and the ChatGPT workspace; require MFA there (the Platform's groups can be
          SCIM-synced from the IdP). Nothing binds a tunnel to the corporate organisation: the guide supports
          tunnels in personal Platform organisations, which is a discovery question (cap-shadow-ai-discovery).
        verified: "2026-09-25"
        migration:
          from:
            - capabilityIga
          reviewRequired: false
          original:
            - capability: capabilityIga
              coverage: native
              mechanism: >-
                Organisation-level Platform permissions Tunnels Read, Read + Manage, Read + Use;
                developer-mode grant in the ChatGPT workspace
              steps:
                - title: Separate managing from using
                  body:
                    - Read + Manage creates, edits and deletes tunnels; Read + Use runs tunnel-client or
                      selects the tunnel in a connector.
                  url: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels
              verified: 2026-09-10
      - mitigation: D3-APA
        coverage: partial
        mechanism: >-
          Platform RBAC: Tunnels Read, Use and Manage (api.organization.tunnel.read / use / write) in custom
          organisation roles assigned to groups; ChatGPT developer-mode access granted separately by the
          workspace admin
        steps:
          - title: Split managing from using
            body:
              - >-
                Under Organization settings create a tunnel-managers role (Tunnels Read + Manage) and a
                tunnel-runtime-users role (Tunnels Read + Use), assign each to a group — SCIM-synced from the IdP
                where possible — and allow up to 30 minutes for changes to propagate.
            url: https://developers.openai.com/api/docs/guides/rbac
          - title: Gate who can build on a tunnel
            body:
              - >-
                Grant ChatGPT developer mode only to the app creators who should attach tunnels (a workspace
                admin grants it on Enterprise/Edu; the user then enables it in Settings → Security and login).
            url: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels
        note: >-
          Partial by the rule (both halves needed for native): the product administers group-based
          authorisation over the tunnel itself — who creates and deletes it, who runs or attaches it, which
          organisations and workspaces see it — but documents no target-side admin-consent path. On this path
          the target is our own MCP server, and consent there is its OAuth authorisation server's: the tunnel
          preserves protected-resource and authorisation-server metadata so the flow works, but sets none of
          its policy. Plan-specific developer-mode policy is in a Help Center article that returned 403 to
          automated fetch, so it is unverified here.
        verified: "2026-09-25"
