id: archLowCodeAgentBuilder
surface: surfaceSaas
rank: 2
title: UI/low-code managed agent runtime
abbrev: UI/low-code runtime

summary:
  - >
    A vendor platform where non-engineers assemble agents from prompts, connectors and triggers.
    The agents are real, the authors are not engineers, and there is no code review between an
    afternoon's work and something that acts on production data.

description:
  - >
    The builder is a self-service surface, and that is both the product and the problem. A
    business user can create an agent, grant it connectors, give it a trigger and publish it to
    colleagues without any of the checkpoints a software delivery pipeline would impose — no pull
    request, no staged rollout, no security sign-off unless the platform enforces one. The result
    is a population problem rather than an instance problem: individual agents are simple; the
    risk is four hundred of them, each with connector grants, each authored by someone who has
    left, and no way to list which reach customer data.
  - >
    Credential inheritance is the specific technical trap. A low-code agent typically runs on
    connections authorised by its author, so a published agent lends its author's access to every
    colleague who uses it. A user who could not read a table directly can often read it through an
    agent someone else built, and neither party intended that. Whether the platform supports
    per-invoker authorisation rather than author-credential execution is the single question worth
    asking during evaluation.
  - >
    The authoring surface is also an injection surface: instructions, knowledge sources and
    connector descriptions are assembled by someone who is not thinking about untrusted input, and
    a shared agent's knowledge source is frequently a folder anyone can write to. Because no
    sandbox or runtime enforcement can be inserted into a vendor's execution, every control drawn
    here is a population control — inventory, publication gating, connector policy, and audit that
    can retire what nobody uses.

distinguishedBy:
  - >
    Against the API/SDK managed agent runtime: same hosting model, different author. There
    engineers define agents in code and the delivery pipeline still applies; here the builder UI
    replaces that pipeline with a publish button, and the unit of concern moves from the
    definition of one agent to the governance of a population.
  - >
    Against an internal AI platform you operate: same intent — a paved road for many builders —
    with the paving done by a vendor. You inherit their guardrails and their environment model,
    and you cannot add a deployment gate they did not build.

exemplars:
  - name: Suite-embedded agent builders
    note: >
      Low-code agent authoring bundled with a productivity or CRM suite, available to any licensed
      user by default unless an administrator turns it off.
    asOf: "2026-08"
  - name: Standalone agent-building platforms
    note: >
      Vendor platforms whose product is the builder itself, with connector marketplaces and
      publication to internal or external audiences.
    asOf: "2026-08"

zones:
  - id: zoneUser
    owner: user
    note: >
      Two populations, and the distinction is the archetype: the people who build agents
      without being engineers, and the colleagues who then use what they published.
  - id: zoneVendor
    owner: vendor
    note: >
      The vendor's authoring, hosting and execution surface, under an enterprise agreement.
      Makers work entirely inside it — drawn to the left of our own band because on this
      archetype the platform is reached first and our systems second.
  - id: zoneCloud
    owner: cloud
    note: >
      What we still own: the gateway that decides what a published agent may reach in our
      systems, and the data behind it.
  - id: zoneGovernance
    owner: governance
    note: >
      Drawn across every band because it governs every band. On a self-service platform this
      band is the only thing standing between "anyone can build an agent" and an inventory
      nobody has.

blocks:
  - id: builder
    kind: actor
    title: Citizen builder
    icon: person
    zone: zoneUser
    col: 0
    row: 0
    note: >
      Authors the instructions, attaches the connectors, and publishes. Not operating under code
      review, and frequently no longer at the company by the time the agent matters.

  - id: consumer
    kind: actor
    title: Agent consumers
    icon: people
    zone: zoneUser
    col: 0
    row: 1
    note: >
      Colleagues — and sometimes customers — using an agent built by someone else. Rarely aware of
      whose credentials it runs on.

  - id: orgData
    kind: external
    title: Enterprise data
    cosaiComponent: componentDataSources
    zone: zoneCloud
    col: 3
    row: 1
    note: >
      Folders, sites and documents attached to an agent as grounding. Often writable by more
      people than the agent's audience, which turns a shared drive into an instruction channel.
    items:
      - id: sources
        label: Grounding sources
        icon: folder
        note: Whoever can write to the attached folder writes instructions the agent will follow for every one of its users.

  - id: platform
    kind: provider
    title: Agent builder platform
    cosaiComponent: componentApplication
    zone: zoneVendor
    col: 1
    row: 1
    note: >
      Authoring, hosting and execution are all the vendor's — only the published surfaces are
      drawn, and no deployment gate can be added that the vendor did not build.
    items:
      - id: authoring
        label: Authoring surface
        icon: code
        note: Prompt, connectors, triggers, publication — every one a security decision made by someone who was not asked to make one.
      - id: runtime
        label: Agent runtime
        icon: agent
        note: >
          Where the population of agents executes. One diagram stands for hundreds of
          near-identical instances — and on several platforms agents discover and call each
          other by default, so one steered agent borrows a teammate's stronger connectors.
      - id: connectorFramework
        label: Connector framework
        icon: plug
        note: The vendor's integration layer. Its authorisation model — author or invoker credentials — decides whether publishing an agent is also a privilege grant.

  - id: aiGateway
    kind: service
    title: AI gateway
    zone: zoneCloud
    col: 2
    row: 1
    note: >
      The customer-operated crossing between the vendor's connector framework and the
      organisation's systems — internal APIs and data fronted by the organisation's own
      gateway tier, so platform connectors arrive as governed, scoped calls rather than
      direct reach.
    pack: aiGatewayTraffic

  - id: connectedData
    kind: service
    title: Connected systems
    zone: zoneCloud
    col: 2
    row: 2
    cosaiComponent: componentDataSources
    note: >
      Whatever the connectors reach. The union across all published agents is the platform's real
      data footprint, and no single agent's author can see it.
    items:
      - id: records
        label: Business data
        icon: db
        note: Tables, files and records reached by agents nobody reviewed.
      - id: mailAndActions
        label: Mail & action paths
        icon: mail
        note: Connectors that send and write. A source of confidential data plus a path to send mail is the pairing worth banning outright.

  - id: govIdentity
    kind: governance
    title: Identity services
    icon: person
    zone: zoneGovernance
    col: 1
    row: 5
    capabilities: [capabilityIga, capabilityNhiManagement]
    note: >
      Whose credentials a published agent runs on — the maker's, the consumer's, or a service
      identity. On this platform that is a configuration choice, and it is the choice that
      decides the blast radius.

  - id: govPolicy
    kind: governance
    title: Policy & authorization
    icon: scale
    zone: zoneGovernance
    col: 2
    row: 5
    capabilities: [capabilityToolPermissionScoping, capabilityEgressControl]
    note: >
      Which connectors a maker may attach at all, decided at our gateway rather than left to
      whoever is building. The default connector set is the real policy.

  - id: govSupplyChain
    kind: governance
    title: Supply-chain assurance
    icon: db
    zone: zoneGovernance
    col: 3
    row: 5
    capabilities: [capabilityAgentRegistry, capabilityAiTprm]
    note: >
      The inventory and the publication gate — an agent nobody registered is an agent nobody
      can revoke, and on a self-service platform that is the normal case rather than the
      exception.

  - id: govObservability
    kind: governance
    title: Observability & response
    icon: eye
    zone: zoneGovernance
    col: 4
    row: 5
    capabilities: [capabilityAuditLogging, capabilityShadowAiDiscovery, capabilityKillSwitch]
    note: >
      Run history and the discovery of agents built outside any process. The population is the
      thing being observed here, not a single deployment.

edges:
  - from: builder
    to: platform
    path: external
    bidir: true
    label: authors & publishes
    note: >
      A person who is not an engineer builds and ships an agent inside the vendor's surface.
      No deployment pipeline is involved, which is why there is no place to insert a review
      that the platform does not itself provide.
  - from: consumer
    to: platform
    path: external
    bidir: true
    label: uses a published agent
    note: >
      Colleagues run what a maker published — often not knowing who built it or whose
      credentials it acts on.
  - from: platform
    to: aiGateway
    path: external
    bidir: true
    label: connector read / write
    note: >
      The zone-3 crossing: a vendor-hosted agent reaching into our systems. This is the hop we
      own, and the only one where a control we operate can apply.
  - from: aiGateway
    to: orgData
    path: primary
    bidir: true
    label: grounding & records
    note: >
      Folders, sites and systems of record attached as grounding or reached as actions. What a
      maker attaches here inherits their access, not the agent's.
  - from: aiGateway
    to: connectedData
    path: primary
    bidir: true
    label: scoped reach
    note: Business systems reached on scoped, recorded grants rather than a maker's standing access.

pins:
  risks:
    - risk: riskAgenticDelegationConfusedDeputy
      at: platform->aiGateway
      note: >
        An agent running on its author's credentials lends that access to every colleague who
        invokes it — publishing becomes a privilege grant nobody intended.
    - risk: riskRogueActions
      at: aiGateway->connectedData
      note: Agents with write connectors act on production data with no review between authoring and effect.
    - risk: riskShadowAndUnknownAgents
      at: platform
      note: >
        Creation is self-service and retirement is nobody's job. The population grows by default,
        and organisations discover it by counting — including the sharing modes that publish an
        agent to anyone with the link, on the vendor's own domain, where exposure research keeps
        finding them by the thousands.
    - risk: riskExcessiveDataHandling
      at: connectedData
      note: Each connector grant is defensible alone; the union across hundreds of agents authored by people who never met is nobody's decision and nobody's picture.
    - risk: riskPromptInjection
      at: aiGateway->orgData
      note: A shared agent's knowledge source is frequently a folder anyone can write to — an instruction channel wearing a grounding label.
    - risk: riskRetrievalVectorStorePoisoning
      at: orgData
      note: Grounding sources are attacker-writable at the fidelity of ordinary file permissions, and poisoned content persists across every future invocation.
    - risk: riskStaleAgentIdentityBinding
      at: platform
      note: Grants authorised by a departed author keep executing for everyone still using the agent.
    - risk: riskZombieShadowMCPServers
      at: govObservability
      note: Agents and their connector grants outlive their projects and their authors; only inventory and usage audit notice.

  capabilities:
    - capability: capabilityEgressControl
      at: aiGateway
      note: >
        Which connectors a maker may attach at all. The default set is the real policy on a
        platform where anybody can build — a permissive default is a decision nobody remembers
        making.
    - capability: capabilityShadowAiDiscovery
      at: platform
      note: >
        Agents built outside any process, by people who do not think of themselves as
        shipping software. On a self-service platform this is the normal case, not the
        exception.
    - capability: capabilityKillSwitch
      at: aiGateway
      note: >
        Revocation at our own boundary, because an agent we cannot delete from their platform
        is one we can at least cut off from our systems.
    - capability: capabilityAgentRegistry
      at: govObservability
      note: >
        Build the inventory first — every agent, author, connector set, audience and last use.
        Every other population control depends on it.
    - capability: capabilityIga
      at: platform
      note: Restrict who may build, and demand per-invoker authorisation so a published agent cannot lend its author's access.
    - capability: capabilityToolPermissionScoping
      at: platform->aiGateway
      note: Author connector policy — which connectors may combine, which environments may publish. Banning a pairing scales where per-agent review cannot.
    - capability: capabilityHitlControls
      at: platform
      note: Turn on the publication gate so review stands between an author and an audience — the nearest available thing to code review.
    - capability: capabilityNhiManagement
      at: aiGateway
      note: Treat every connection an agent holds as a managed non-human identity — owned, scoped, expiring, and revocable as a class.
    - capability: capabilityDataAccessGovernance
      at: connectedData
      note: Govern what connectors may reach by classification, so the platform's aggregate footprint is a decision rather than an accident.
    - capability: capabilityPromptInjectionDefense
      at: aiGateway->orgData
      note: Treat grounding sources as untrusted input; restrict attachable locations to ones with governed write access.
    - capability: capabilityAiGovernancePlatform
      at: platform->aiGateway
      note: Run maker governance as a programme — environments, licensing, lifecycle and ownership transfer when authors leave.
    - capability: capabilityDspm
      at: connectedData
      note: Find the sensitive data inside connector reach before four hundred agents do.
    - capability: capabilityAuditLogging
      at: govObservability
      note: Keep run history per agent and per consumer — the basis for retiring what nobody uses and investigating what someone did.
    - capability: capabilityAiTprm
      at: platform
      note: Assess the platform vendor's execution, isolation and guardrail claims — none of them are testable from your side.

flows:
  - id: F1
    title: A colleague builds an agent
    moves: An agent authored and published by someone who is not an engineer.
    path: [builder->platform]
    threats: [No pipeline, so no place to insert a review, An agent published to more people than intended, Whose credentials it runs on decided by a default]
    controls: [capabilityAgentRegistry, capabilityIga]
    note: >
      There is no deployment step to hook into, which is why governance here is population
      management rather than change review.
  - id: F2
    title: A colleague uses it
    moves: Somebody runs what a maker published, usually without knowing who built it.
    path: [consumer->platform]
    threats: [Acting on the maker's access rather than the user's, An agent nobody registered and nobody can revoke]
    controls: [capabilityNhiManagement, capabilityShadowAiDiscovery]
    note: >
      The gap between who built an agent and who runs it is where this archetype's incidents
      live.
  - id: F3
    title: The agent reaches our systems
    moves: Connector reads and writes from a vendor-hosted agent into org data.
    path: [platform->aiGateway, aiGateway->orgData, aiGateway->connectedData]
    threats: [Grounding content inheriting the maker's access, Connectors attached by default rather than by decision, Business systems reached on standing rather than scoped grants]
    controls: [capabilityToolPermissionScoping, capabilityEgressControl, capabilityAuditLogging]
    note: >
      The zone-3 crossing and the only hop we own. Which connectors a maker may attach at all
      is the real policy, and a permissive default is a decision nobody remembers making.

scenarios:
  - title: An afternoon's agent reaches production data
    steps:
      - follow: builder->platform
        note: A business user signs in with the same role they use to open documents.
      - follow: platform->aiGateway
        note: Prompt written, connectors attached on the author's own grants, trigger set, published to the team.
      - follow: platform->aiGateway
        note: The publication gate reviews it — if the platform offers one and an administrator turned it on.
      - follow: consumer->platform
        note: A colleague invokes the shared agent.
      - follow: platform->aiGateway
        note: The connector call crosses the vendor boundary — and the gateway can see whose credentials it carries.
      - follow: aiGateway->connectedData
        note: On author-delegated grants the consumer just read a table they were never entitled to; per-invoker grants are what stop it here.
  - title: A shared drive becomes an instruction channel
    steps:
      - follow: aiGateway->orgData
        note: Someone writes a document with embedded instructions into the folder an agent uses as grounding.
      - follow: platform->aiGateway
        note: The injected instruction exercises the agent's connectors — reading what it can reach, sending what it can send.
      - follow: aiGateway->platform
        note: Retrieved data flows back into the agent's response, for every user who asks.
  - title: The author leaves
    steps:
      - follow: platform->aiGateway
        note: Inventory shows agents whose author has departed — still published, still triggered, still holding grants.
      - follow: platform->aiGateway
        note: Author-delegated connections keep executing until ownership is transferred or the grants are revoked as a class — at the gateway, in one place.

