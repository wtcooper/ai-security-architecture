            url: https://code.claude.com/docs/en/agent-sdk/hosting
          - &a2
            title: Control where transcripts persist
            body:
              - Configure a SessionStore adapter (S3, Redis, Postgres) and alert on mirror_error messages; do not
                share a store across tenants.
            url: https://code.claude.com/docs/en/agent-sdk/hosting
