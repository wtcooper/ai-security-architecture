  - title: "Anthropic — MCP tunnels for claude.ai custom connectors: Enterprise research preview, outbound-only, OAuth still required"
    url: https://claude.com/docs/connectors/mcp-tunnels/overview
  - title: "OWASP Top 10 for LLM Applications 2026 — LLM02 sensitive information disclosure"
    url: https://genai.owasp.org/resource/owasp-genai-llm-top-10-2026/
  - title: "EchoLeak (CVE-2025-32711) — zero-click prompt-injection exfiltration through an enterprise copilot"
    url: https://thehackernews.com/2025/06/zero-click-ai-vulnerability-exposes.html
  - title: "ShadowLeak — service-side zero-click exfiltration via a chat agent's connectors"
    url: https://thehackernews.com/2025/09/shadowleak-zero-click-flaw-leaks-gmail.html
  - title: "CoSAI Shared Responsibility Framework V1.0 — AI-enabled SaaS operating model"
    url: https://www.coalitionforsecureai.org/wp-content/uploads/2026/05/CoSAI-Shared-Responsibility-Framework.pdf
  - title: "CSA AI Controls Matrix v1.1 — data governance and third-party controls"
    url: https://cloudsecurityalliance.org/artifacts/ai-controls-matrix-v1-1
  - title: "NIST AI 600-1 — generative AI profile, information security actions"
    url: https://www.nist.gov/itl/ai-risk-management-framework
