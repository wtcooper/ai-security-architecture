          patching: "Microsoft owns the serving runtimes, base container images and security patches, and applies updates to live deployments without a redeploy."
          data: "Prompts and completions are processed in a region, a data zone or globally, by deployment type; Microsoft holds the weights; stored data stays in the resource geography."
          network: "The Foundry resource has a public network access flag and private endpoints; managed compute deployments need no outbound access to Hugging Face."
          identity: "Callers use Microsoft Entra ID with the Foundry User role, or an account key; the model server runs as Microsoft's service, not as an identity of yours."
