id: archCodingAgentFirstParty
surface: surfaceEndpoint
rank: 2
title: First-party coding & desktop agents
abbrev: First-party agents
summary:
  - >
    The same engine as the vendored coding agents without the vendor: an open-source harness a
    developer installs from a community registry and runs with their own keys. The interaction
    model is identical; what is missing is every control the vendor column supplied — session
    credentials, managed settings, audit export — and nothing replaces them by default.

description:
  - >
    Architecturally this is the vendored coding agent with the vendor service column deleted.
    The harness, the tool surface, the memory layer and the untrusted-content ingress are the
    same drawing; the differences are custody and supply chain. Credentials are pasted,
    long-lived keys that sit in plaintext configuration in most of the harnesses; governance
    is files on the same disk the agent can edit; and the binary itself arrives through
    community package registries and marketplaces — the category's landmark incident is a
    compromised harness release published with stolen publisher tokens.
  - >
    The target state routes every model and remote call through an AI gateway the organisation
    operates — the credential broker that vaults the key the user would otherwise paste, the
    egress allowlist, the audit tap. The common state has nothing at that crossing: the
    harness calls the provider directly and the only record is the provider's bill. The
    gateway is drawn because this catalogue draws architectures as they should be built; the
    deviation records the distance.
  - >
    Remote steering of a first-party harness — relays, chat bridges, exposed serve ports — is
    not part of this reference. The harnesses ship serve modes whose auth ranges from a
    shared secret down to none, so serve ports stay bound to localhost.
  - >
    The software ships no governance of its own: no managed settings tier, no session audit
    export. The governance band this drawing carries is therefore entirely the
    organisation's — services the target state adds around the
    harness, none of them supplied by the thing being governed. Where enterprise controls
    exist for this category they are bolt-on — managed configuration paths and enterprise
    policy services a team must adopt deliberately — and the sanctioned posture is something
    the organisation publishes, not something the software ships.

distinguishedBy:
  - >
    Against the vendored coding agents: the same loop, the same tool surface, the same
    human-present default. What changes is custody — pasted keys instead of expiring session
    credentials, community registries instead of signed vendor channels — and the absence of
    any control plane an administrator could switch on.
  - >
    Against the personal autonomous agent: this one is still invoked by a present developer
    and scoped to a workspace, with no heartbeat and no ambient senders. But the drift is
    real and one-directional — server modes, chat bridges, scheduled recipes — and a deployed
    OSS harness that listens on channels and runs unattended has become the personal agent
    and should be read on that page.

exemplars:
  - name: OpenCode
    note: >
      An open-source coding harness run locally with a selected model provider. The
      bring-your-own-provider configuration illustrates the customer-operated harness and
      credential-routing choices in this architecture.
    url: https://opencode.ai/docs/
    asOf: "2026-10"
  - name: Cline
    note: >
      An open-source coding agent available through IDE and CLI surfaces. Its bring-your-own-key
      mode illustrates local file and tool execution with separately selected inference.
    url: https://docs.cline.bot/cline-overview
    asOf: "2026-10"

zones:
  - id: zoneUser
    owner: user
    note: >
      The developer at the keyboard. Steering the harness from elsewhere is not part of this
      reference.
  - id: zoneEndpoint
    owner: endpoint
    note: >
      The managed device, running a harness the developer installed themselves: the loop, its
      tool surface and its memory. Ours to manage and nobody's to support — its outbound
      routes are the brokered crossing and, in the common install, whatever the harness dials
      itself.
  - id: zoneCloud
    owner: cloud
    note: >
      Infrastructure we operate — the AI gateway that brokers every model and remote call, and
      the systems and data it admits the agent into. With no vendor column, this band holds
      every control the developer running the agent cannot override.
  - id: zoneExternal
    owner: external
    note: Outside the company with no agreement — package registries, the open web, public repositories.
  - id: zoneGovernance
    owner: governance
    note: >
      Drawn across every band because it governs every band — including the external
      connections, whose reachability is itself a governed decision.

blocks:
  - id: developer
    kind: actor
    title: Developer
    icon: person
    zone: zoneUser
    col: 0
    row: 1
    note: >
      Present, watching, and the approval gate for what matters — the property the whole
      archetype's posture rests on, and the one that unattended modes quietly remove.

  - id: harness
    kind: service
    title: Agent harness
    cosaiComponent: componentReasoningCore
    zone: zoneEndpoint
    col: 1
    row: 1
    rowSpan: 2
    note: >
      The installed application — the loop behind the terminal, editor or chat window, running
      as the user, with its built-in tools nested inside it. Unlike the vendor products it
      commonly does open a port of its own, which this reference keeps bound to localhost.
    items:
      - id: apiServer
        label: Local API server
        icon: plug
        note: >
          The serve mode: a listening port with auth ranging from a mandatory shared secret to
          none at all. Bound to localhost here; bound wider, it is this archetype's defining
          exposure.
      - id: loop
        label: Agent loop
        icon: agent
        note: Decides the next edit, command or screen action from everything it has read.
      - id: context
        label: Context assembly
        icon: doc
        note: Merges the instruction, the memory and the tool results into one prompt.

      - id: mcpClient
        label: MCP client
        icon: plug
        note: >
          The harness's own MCP client — the party that connects out: to local servers in its
          native tools, and through the gateway's MCP brokerage to remote ones.
  - id: memory
    kind: service
    title: Memory & state
    cosaiComponent: componentDataStorage
    zone: zoneEndpoint
    col: 1
    row: 3
    note: >
      Agent-written notes and the rules files merged into every later session — on by default
      in several products, and repo-committed in all of them.
    items:
      - id: memoryFiles
        label: Memory files
        icon: folder
        note: Agent-written notes loaded at the start of every session.
      - id: rules
        label: Rules & instructions
        icon: doc
        note: The AGENTS.md-class files — the repo-committed ones authored by whoever last committed.
      - id: hooks
        label: Hooks & settings
        icon: gear
        note: >
          Session-start hooks, permission rules and editor tasks that run as code when the
          project opens — the persistence a self-propagating package worm writes into an
          agent's configuration, not prose the loop reads but commands it executes.

  - id: toolPlane
    kind: service
    title: Native tools
    cosaiComponent: componentTools
    zone: zoneEndpoint
    parent: harness
    col: 0
    row: 0
    note: >
      The application's built-in tools, nested because the loop calling them is not a hop:
      file and edit tools, the shell, the local MCP servers it spawns or attaches to, the
      sandbox for builds and tests, skills and computer use — running as the user on a machine
      that also holds their SSH keys, cloud credentials and browser sessions. What these tools
      reach is drawn: memory files, the package mirror, the gateway's API brokerage, our source
      control over git, and the open web and public repositories directly, under the
      endpoint's egress allowlist.
    items:
      - id: editTools
        label: File & edit tools
        icon: folder
        note: Read and write across the working tree and the user's documents.
      - id: shell
        label: Shell commands
        icon: code
        note: Command execution with the user's authority when it runs outside the sandbox.
      - id: mcp
        label: Local MCP servers
        icon: code
        note: >
          Local MCP servers: child processes the harness spawns through npx or uv, or servers
          already running on the machine, holding the user's privileges and, often, their own API
          tokens in a config dotfile. Remote MCP servers are a different thing on this catalogue —
          reached through the gateway, drawn in Tool services — and the industry names them apart.
      - id: sandboxedTools
        label: Sandboxed tools
        icon: shield
        note: Where builds, tests and driven desktops run when isolation is on.
      - id: skills
        label: Installed skills
        icon: gear
        note: >
          Packaged instructions and helpers, delivered from the mirror through the crossing —
          content that executes as instruction, versioned and pinned like code.
      - id: computerUse
        label: Computer use
        icon: eye
        note: >
          The sharpest tool the harness can switch on: the agent drives the GUI and inherits
          every application already signed in.

  - id: aiGateway
    kind: service
    title: AI gateway
    zone: zoneCloud
    col: 2
    row: 1
    note: >
      The organisation-operated crossing that replaces the missing vendor column, and the tier
      that holds the controls the developer cannot edit: the vault for the key the developer
      would otherwise paste, the registry of MCP servers, APIs and connectors it will broker,
      per-call policy and the screening of what comes back. Which build of the agent runs is
      the mirror's decision, reached by the native tools directly. Its items are the traffic classes it brokers; the checks are the
      numbered pins on this block and its edges, and the call-outs beneath.
    pack: aiGatewayTraffic

  - id: hostedTools
    kind: service
    title: Tool services
    cosaiComponent: componentTools
    zone: zoneCloud
    col: 3
    row: 1
    note: >
      Our own tool servers and service APIs — the same component as the endpoint's local
      surface, at a different band. What the agent is actually meant to reach, and what the
      gateway in front of it decides it may.
    items:
      - id: internalMcp
        label: Remote MCP servers
        icon: plug
        note: Our own servers, listed in the catalogue the gateway enforces.
      - id: internalApis
        label: APIs & connectors
        icon: plug
        note: Service APIs reached on grants the gateway issues, scoped to the developer.

  - id: orgData
    kind: external
    title: Enterprise data
    cosaiComponent: componentDataSources
    zone: zoneCloud
    col: 4
    row: 1
    note: >
      The documents and systems of record behind our own tool servers. Ours, and still
      untrusted as input — many hands wrote the content, and none of them are authenticated.
    items:
      - id: records
        label: Org data
        icon: db
        note: Business systems reached under the developer's scope, never a standing service account.
      - id: fileStorage
        label: File storage
        icon: folder
        note: Governed content stores reached through our connectors rather than the device's mounts.

  - id: sourceControl
    kind: service
    title: Source control
    cosaiComponent: componentDataSources
    zone: zoneCloud
    col: 2
    row: 3
    note: >
      Our GitHub Enterprise: the code bases the agent clones, reads and changes. Code,
      instruction files and threads enter the session as instruction; a branch and a pull
      request go back for a person to review. The agent reaches it from the endpoint with git
      and the developer's own credentials — not through the AI gateway — so nothing scopes it
      to one repository or one branch; branch protection, review and CODEOWNERS on the agent's
      configuration at the host are the gate.
    items:
      - id: repos
        label: Repositories & instruction files
        icon: code
        note: >
          The code, and the rules files, hooks and tool-server declarations committed beside it
          — content that executes as instruction and is versioned like code because it is code.
      - id: threads
        label: Issues & PR threads
        icon: chat
        note: Writable by anyone the repository admits, read by the agent as instruction.
      - id: prs
        label: Pull requests & CI
        icon: shield
        note: The branch the agent pushes, the review a person gives, and the workflows it would fire.

  - id: registry
    kind: external
    title: Private pkg registry
    cosaiComponent: componentDataSources
    zone: zoneCloud
    col: 3
    row: 3
    note: >
      Where the vendor column used to be. This archetype's supply chain includes the agent
      itself: the harness, its extensions and its skills all arrive through community channels
      on publisher self-attestation, and a compromised release of a harness has already
      shipped once. The organisation-maintained mirror moves the review earlier; it does not
      remove the risk.
    items:
      - id: hub
        label: Approved packages
        icon: db
        note: Harness releases, extensions and skills — reviewed, pinned and mirrored before installation.

  - id: provider
    kind: provider
    title: Model provider
    cosaiComponent: componentModelServing
    zone: zoneExternal
    col: 5
    row: 0
    note: >
      The inference API the gateway brokers directly — no vendor service stands between. The
      completion drives writes, commands and clicks.
    items:
      - id: inference
        label: Inference API
        icon: model
        note: Receives code, documents and screenshots; returns the plan.

  - id: publicRepos
    kind: service
    title: Source control
    cosaiComponent: componentDataSources
    zone: zoneExternal
    col: 5
    row: 1
    note: >
      Public source control: open repositories the agent clones read-only, for reference or to
      build against. Nobody vouches for what they ship, which in this archetype includes rules
      files, hooks and tool-server declarations the harness reads as its own configuration.
    items:
      - id: publicRepositories
        label: Public repositories
        icon: code
        note: Cloned read-only and never pushed to; untrusted like any page.

  - id: openWeb
    kind: external
    title: Open web
    cosaiComponent: componentDataSources
    zone: zoneExternal
    col: 5
    row: 2
    note: >
      What the native tools search and fetch — documentation, issue threads, answers. Every page
      is authored by someone else and re-enters the loop as context, and a request out can carry
      whatever the shell can read.
    items:
      - id: search
        label: Web search
        icon: search
        note: Results and snippets written by strangers, read straight into context.
      - id: pages
        label: Arbitrary pages
        icon: globe
        note: Attacker-writable text that re-enters the loop, and the exfiltration path out.

  - id: sources
    kind: external
    title: Public package sources
    zone: zoneExternal
    col: 5
    row: 3
    note: >
      Where the mirror gets what it serves: the public package registries and the skill and
      extension hubs it proxies and admits from. Nothing here is ours, which is why admission
      happens at the mirror and not at the tool that asked.
    items:
      - id: registries
        label: Package registries
        icon: db
        note: PyPI, npm and their kind — mirrored, never reached by a tool directly in the target state.
      - id: hubs
        label: Skill & extension hubs
        icon: gear
        note: Community catalogues of skills, extensions and images, admitted through the same door.

  - id: govIdentity
    kind: governance
    title: Identity services
    icon: person
    zone: zoneGovernance
    col: 0
    row: 7
    note: >
      The IdP and device-posture plane deciding who may open a session at all, and on what
      machine — the binding the gateway's per-developer grants rest on.

  - id: govSecrets
    kind: governance
    title: Secrets & key management
    icon: key
    zone: zoneGovernance
    col: 1
    row: 7
    mitigations: [ D3-CH ]
    note: >
      Vaulted, short-lived, connector-scoped grants on our own keys, so no standing provider
      key sits in a dotfile the agent can read.

  - id: govPolicy
    kind: governance
    title: Policy & authorization
    icon: scale
    zone: zoneGovernance
    col: 2
    row: 7
    mitigations: [ cap-agent-action-policy-enforcement, cap-agent-egress-control, cap-sensitive-data-redaction, AML.M0036, AML.M0028, AML.M0031, cap-input-guardrails, AML.M0029 ]
    note: >
      The decisions the one crossing enforces per call — what may be reached, what may leave,
      and what it may cost. With no vendor console above it, this is the only tier where a
      policy can be made non-overridable by the developer running the agent.

  - id: govSupplyChain
    kind: governance
    title: Supply-chain assurance
    icon: db
    zone: zoneGovernance
    col: 4
    row: 7
    mitigations: [ cap-agent-tool-registry, cap-mcp-tool-integrity, D3-FA ]
    note: >
      Which agents, connectors and servers are admitted, and pinned to which versions. This
      call-out carries more weight here than in any other drawing: the supply chain delivers
      the harness itself, through channels that have already shipped a compromised release.

  - id: govObservability
    kind: governance
    title: Observability & response
    icon: eye
    zone: zoneGovernance
    col: 6
    row: 7
    mitigations: [ cap-agent-tracing, cap-shadow-ai-discovery, cap-agent-kill-switch, D3-PA ]
    note: >
      Our gateway tap joined to endpoint telemetry — no vendor export exists to fuse with
      either — plus the discovery that finds the installs which never enrolled, and the stop.


edges:
  - from: developer
    to: harness
    path: primary
    bidir: true
    label: local session
    note: >
      The direct path, and the one most developers use: the CLI, editor or desktop app on the
      machine, authorised by holding the machine. The same shape as the personal agent's local
      session — proximity is the authorisation, so device posture carries it.
  - from: toolPlane
    to: memory
    label: read & write / context
    path: primary
    bidir: true
    note: >
      The file tools are how the loop reads and writes what it learns — memory files written
      by the agent, rules and instructions read back on the next task. Context assembly loads
      the same rules at session start, through the same files.
  - from: harness
    to: aiGateway
    path: primary
    bidir: true
    label: inference, MCP & skills
    note: >
      The one general-purpose crossing: every model call and every remote tool call leave the
      endpoint here — in the target state. In the common install the model call goes straight
      out on a pasted key and never sees this tier.
  - from: toolPlane
    to: aiGateway
    path: primary
    bidir: true
    label: API & MCP calls via gateway
    note: >
      A local server's or tool's own calls to our remote MCP servers, APIs and connectors,
      brokered here on the gateway's registry of destinations and on credentials it injects.
      Package installs go to the mirror; web search, fetches and public clones go direct,
      under the endpoint's egress allowlist.
  - from: aiGateway
    to: provider
    label: inference / completion
    path: external
    outbound: true
    route: vhv
    note: >
      Inference on a credential the gateway brokers, rather than the long-lived key the
      developer would otherwise paste into a dotfile. With no vendor between them, this is the
      whole model path — and in the common install it does not cross the gateway at all.
  - from: toolPlane
    to: registry
    path: primary
    bidir: true
    label: pinned installs
    note: >
      Harness, extension and skill releases pulled straight from the mirror, pinned by digest — never from a community channel.
      The endpoint's egress allowlist is what makes the mirror the only place the sandbox can
      fetch from; the AI gateway brokers model and tool calls and is not on this path.
  - from: toolPlane
    to: openWeb
    path: external
    outbound: true
    route: hvh
    label: web search & fetch
    note: >
      The native tools search and fetch the web themselves — a fetch tool, a shell command —
      with no gateway and no record on our side. Pages come back as context; a request out can
      carry a token, a file or a key. What bounds it is the endpoint's egress policy, pinned on
      the native tools.
  - from: toolPlane
    to: publicRepos
    path: external
    outbound: true
    route: hvh
    label: clone public repos
    note: >
      Public repositories cloned read-only under the endpoint's egress allowlist. What arrives
      is untrusted input — and its rules files, hooks and tool-server declarations are
      configuration the harness will read unless review stops it.
  - from: toolPlane
    to: sourceControl
    path: primary
    bidir: true
    label: clone, push & PRs as the developer
    note: >
      git and the host's CLI from the shell, straight to our GitHub Enterprise on the
      developer's own credentials — source control is not behind the AI gateway. Code, threads
      and instruction files come in as context; a branch and a pull request go out, with every
      repository the developer can write within reach.
  - from: aiGateway
    to: hostedTools
    path: primary
    bidir: true
    label: internal tool calls
    note: >
      The path the deployment exists for: our own servers and APIs, admitted by the catalogue
      and reached on grants scoped to the developer.
  - from: hostedTools
    to: orgData
    path: primary
    bidir: true
    label: scoped reads & writes
    note: >
      Document reads and business-system calls — recorded on our side of the boundary.

  - from: sources
    to: registry
    path: external
    label: mirrored & admitted
    note: >
      The mirror's own supply chain: public packages proxied in, scanned, pinned and admitted
      before anything inside can pull them. Build pipelines publish the organisation's own
      artifacts beside them.
pins:
  risks:
    - risk: riskPromptInjection
      at: toolPlane->sourceControl
      note: >
        Source files, manifests, issue text and review threads are unrelated paths into the
        same context window, none of which is the developer's instruction — and most are
        writable by people with no commit access.
    - risk: riskRogueActions
      at: toolPlane->sourceControl
      note: >
        A push or a pull request on the developer's own credentials, which reach every
        repository they can write — branch protection and review at the host are what stop it
        landing.
    - risk: riskPromptInjection
      at: hostedTools->orgData
      note: Documents, tickets and records come back as tool results with the same standing as the task.
    - risk: riskPromptInjection
      at: memory
      note: >
        Memory files and rules are prose a later session treats as instruction — including
        rules committed by whoever last touched the repo, and the settings hooks the worm
        incidents wrote their persistence into.
    - risk: riskToolRegistryTampering
      at: toolPlane
      note: >-
        The tool-server configuration decides which local servers join the native tools, and it can
        arrive with the clone. Injecting into it and swapping it after approval are the disclosed paths.
    - risk: riskInsecureModelOutput
      at: harness
      note: >
        The completion is unauthenticated content, and this is where it becomes the plan —
        file writes, commands and clicks all start as text the model returned.
    - risk: riskExcessiveDataHandlingDuringInference
      at: aiGateway->provider
      note: >
        Code, documents and screenshots leave the company here — usually more than the
        developer pictured sharing, and with no vendor tenancy in between, whatever the
        provider's default retention happens to be is the retention policy.
    - risk: riskInsecureIntegratedComponent
      at: toolPlane->registry
      note: >
        The mirror decides which build of the agent runs. A tampered or unpinned release is
        code execution as the developer, on a machine that also holds their keys — the
        category's landmark incident, not a hypothetical.
    - risk: riskToolSourceProvenance
      at: toolPlane->publicRepos
      note: >
        A public repository arrives on nobody's attestation, and the tool-server declarations
        and instruction files it ships are read as configuration and model input.
    - risk: riskRogueActions
      at: hostedTools->orgData
      note: Writes into systems of record from a loop whose plan nobody reviewed.
    - risk: riskInsecureIntegratedComponent
      at: harness
      note: >
        The serve mode is an agent-control transport listening on the machine: bound wider
        than localhost with a guessable or absent secret, whoever reaches the port drives the
        loop directly, on a path that traverses nothing we operate — which is why serve ports
        stay bound to localhost here.
    - risk: riskShadowAndUnknownAgents
      at: harness
      note: >
        A binary a developer can fetch without asking anyone. Unmanaged, it has no policy, no
        audit and no inventory entry — and that is the common case.

    - risk: riskInsecureIntegratedComponent
      at: aiGateway
      note: >
        The gateway is a third-party tier with its own CVE stream — the LiteLLM backdoor shipped
        in a release — and here there is no vendor console to notice a gateway that has gone
        quiet.
    - risk: riskRunawayAgentToolLoops
      at: harness
      note: >
        A scheduled or unattended run has no human to notice it looping; the gateway's spend
        ceiling bounds the brokered calls, and local iterations run until something stops the
        process.
    - risk: riskInsecureIntegratedComponent
      at: memory
      note: >
        Hooks and settings are executed, not read: a session-start hook or folder-open task
        written into the agent's configuration is code execution as the developer on every
        launch — the persistence the CHAINDROP worm chose.
    - risk: riskSensitiveDataDisclosure
      at: toolPlane->openWeb
      note: >
        The path a phone-home takes: a fetch or a shell command bundles a token, a file or a key
        into a request to a page the attacker controls. Nothing of ours is on this hop unless
        the endpoint's egress policy is.
    - risk: riskPromptInjection
      at: toolPlane->openWeb
      note: >-
        Search results and fetched pages come back as context with the same standing as the task —
        documentation, issue threads and answers written by strangers.
  mitigations:
    - mitigation: cap-agent-action-policy-enforcement
      at: aiGateway
      note: >-
        Per-call policy on every brokered tool call — from the harness and from the native tools alike —
        evaluated at the gateway, outside the application being governed.
    - mitigation: cap-sensitive-data-redaction
      at: toolPlane->openWeb
      note: >-
        DLP on the direct web path, where a search query, a URL or a form post can carry repository content
        or a key out — the endpoint's own inspection, since no gateway is on the hop.
    - mitigation: AML.M0036
      at: harness->aiGateway
      note: >-
        Spend ceilings at the crossing, because the only native meter in this category is the provider's
        invoice — there is no vendor console showing seat usage or session counts.
    - mitigation: AML.M0028
      at: toolPlane
      note: >-
        Per-tool grants scoped to the working tree and the task, instead of the developer's full authority on
        the machine — enforced where the tools run, inside the application.
    - mitigation: D3-EI
      at: toolPlane
      note: >-
        Make sandboxed tools the default path for commands and computer use, with SSH keys, cloud credentials
        and browser profiles outside the filesystem the sandbox can reach — so the approval gate fires only
        for actions that leave the box.
    - mitigation: AML.M0031
      at: toolPlane->memory
      note: >-
        Scope writes: the agent writes its own memory files and nothing else. Rules, hooks and settings are
        configuration managed as code — reviewed on change, diffed on clone, never executed from a package a
        dependency dropped in. Keep memory under version history so a poisoned note can be traced to the
        session that wrote it and rolled back, and treat everything read back as untrusted input.
    - mitigation: cap-input-guardrails
      at: aiGateway
      note: >-
        Classify tool results and retrieved documents for injection at the gateway, before anything returns to
        the endpoint. Working-tree files never cross here; they stay untrusted input, bounded by the tool
        permissions rather than screened.
    - mitigation: D3-CH
      at: aiGateway
      note: >-
        The provider key lives in the gateway's vault, never pasted into a dotfile — and org access rides
        short-lived, connector-scoped grants the crossing issues per call.
    - mitigation: cap-mcp-tool-integrity
      at: toolPlane->registry
      note: >-
        Provenance and behavioural review before a server is admitted, and harness, extension and skill
        versions pinned against the mirror: an update is a decision, because the update channel is this
        category's proven attack path.
    - mitigation: AML.M0029
      at: hostedTools->orgData
      note: Non-overridable approval on consequential writes, kept rare enough that each prompt is read.
    - mitigation: cap-agent-tool-registry
      at: aiGateway
      note: >-
        A managed allowlist of connectors and tool servers, enforced from our gateway rather than from the
        configuration file it governs.
    - mitigation: cap-agent-tracing
      at: aiGateway
      note: >-
        The gateway tap records every brokered call. With no vendor console anywhere, local tool work and
        direct egress are on record only through the endpoint telemetry joined to it.
    - mitigation: cap-shadow-ai-discovery
      at: harness
      note: Find the installs that never enrolled, because this archetype spreads one developer at a time.
    - mitigation: D3-PA
      at: harness
      note: >-
        The device tooling that sees what no crossing can: which harness processes run, which ports they listen
        on and what their child processes execute.
    - mitigation: cap-agent-kill-switch
      at: govObservability
      note: >-
        The stop is enforced from outside the agent: device management ends the harness and its child processes,
        and the gateway revokes the brokered credential — there is no vendor console to do either.
    - mitigation: cap-agent-egress-control
      at: toolPlane
      note: >-
        The endpoint's egress allowlist, enforced by device management, decides where the direct path
        may go: the AI gateway, the package mirror, our source control, web search and fetch, and public
        repositories read-only — nothing else. Shell commands, fetches and browser traffic are bounded
        here — not at the gateway, which brokers model, MCP and API calls and sees nothing else.
    - mitigation: D3-FA
      at: sources->registry
      note: >-
        Admission scanning at the mirror: malware and typosquat checks on everything proxied in from a
        public source, before anything inside can pull it. The registered embodiment of artifact
        scanning, on the one edge where it applies.

walkthrough:
  title: The developer asks for a change
  moves: >-
    A task stated at the machine, inference, and the approved edits and calls it produces.
  steps:
    - follow: developer->harness
      label: task stated
      note: The task is stated by a human who will stay for the session.
    - follow: harness->aiGateway
      label: model call, brokered
      note: >
        The turn's model call crosses on a brokered credential — or, in the common install,
        does not cross here at all and goes straight out on a pasted key.
    - follow: aiGateway->provider
      label: inference on vaulted key
      note: Inference on the vaulted key, against an allowlisted provider.
    - follow: provider->aiGateway
      label: completion
      note: The completion comes back across the same brokered crossing.
    - follow: aiGateway->harness
      label: plan into loop
      note: And into the loop — unauthenticated content, now the plan.
    - follow: toolPlane->openWeb
      label: docs searched & fetched
      note: >
        The plan calls for a library's documentation. The native tools search and fetch it
        directly, under the endpoint's egress allowlist — nothing of ours brokers it.
    - follow: openWeb->toolPlane
      label: pages into context
      note: >
        What returns is authored by somebody else and read as context, with the same standing
        as the task.
    - follow: harness->developer
      label: approval prompt
      note: >
        Consequential actions surface for approval before they run — the only gate there is,
        kept rare enough that each prompt is read.
    - follow: developer->harness
      label: approved (bound)
      note: Approved — this action, these arguments, not a blanket yes.
    - follow: toolPlane->aiGateway
      label: brokered tool call
      note: >
        Edits and commands run locally in the native tools, on the working tree, with whatever
        scope the permission model granted — they never touch this tier. What crosses here is a
        local tool's call to one of our servers or connectors, brokered on a credential the
        gateway injects.
    - follow: aiGateway->hostedTools
      label: admitted internal server
      note: Our own server or connector, admitted by the catalogue on a scoped credential.
    - follow: hostedTools->aiGateway
      label: classified result
      note: >
        The result crosses back, classified before anything on the endpoint reads it.
    - follow: aiGateway->toolPlane
      label: tool result into context
      note: >
        Into the native tools as a tool result, and from there into context.
    - follow: harness->developer
      label: the change, for review
      note: >
        The change lands in the working tree for the developer to review — the loop's output is a diff, never a merge.
    - follow: developer->harness
      label: approved to push
      note: Pushing is a consequential action, approved like any other.
    - follow: toolPlane->sourceControl
      label: branch & pull request
      note: >
        The native tools push a branch and open a pull request on our GitHub Enterprise, on the
        developer's own credentials and straight from the shell — not through the gateway.
        Branch protection and a person's review decide whether it merges.

scenarios:
  - title: A poisoned document phones home
    steps:
      - follow: harness->aiGateway
        label: document request
        note: The loop asks for a document — a ticket, a wiki page, a shared file — through the crossing.
      - follow: aiGateway->hostedTools
        label: brokered to connector
        note: Brokered to the connector that can read it.
      - follow: hostedTools->orgData
        label: document with hidden instruction
        note: A hidden instruction in the document is read along with the document.
      - follow: orgData->hostedTools
        label: content as tool result
        note: The content comes back as a tool result.
      - follow: hostedTools->aiGateway
        label: back across crossing
        note: Across the crossing, where the injection screen runs — and a well-phrased instruction passes it.
      - follow: aiGateway->harness
        label: into context
        note: And into context, where the loop cannot tell the instruction from the task.
      - follow: harness->aiGateway
        label: poisoned context for inference
        note: The poisoned context goes up for inference.
      - follow: aiGateway->provider
        label: inference
        note: Nothing on this hop knows the context is hostile.
      - follow: provider->aiGateway
        label: attacker's plan
        note: The completion carries the attacker's instruction as the plan.
      - follow: aiGateway->harness
        label: next step
        note: The loop treats it as the next step.
      - follow: toolPlane->openWeb
        label: exfil on direct egress
        note: >
          A fetch or a shell command bundles a token, a file or a key into a request to a page
          the attacker controls — the direct path, where the endpoint's egress allowlist and DLP
          are the last controls standing, and on the common install there are none.
  - title: The harness updates itself
    steps:
      - follow: toolPlane->registry
        label: release pull (pinned)
        note: >
          A new release of the harness or one of its extensions is requested — the package manager
          runs as the developer, in the application's own tools, on the supply chain's proven path,
          straight to the mirror: the one destination the egress allowlist permits, and where a
          version is pinned and a review has happened.
      - follow: registry->toolPlane
        label: approved build
        note: >
          The approved build comes back, digest-checked against the pin — the hop a compromised
          release actually arrives on — and loads into the running process with everything the
          agent has. A compromised release is code execution as the developer.
  - title: A public repository is cloned
    steps:
      - follow: toolPlane->publicRepos
        label: clone a public repo
        note: >
          The task needs a public project to build against. The native tools clone it
          read-only, under the egress allowlist.
      - follow: publicRepos->toolPlane
        label: its rules & tool config arrive
        note: >
          The clone brings its own rules files, hooks and tool-server declarations, on nobody's
          attestation — configuration the harness will load unless review stops it first.
deviations:
  - subject: The AI gateway is drawn although the common install lacks it
    reason: >
      This catalogue draws target states. The gateway is the organisation's replacement for
      the missing vendor column — key vault, egress policy, per-call policy and audit — and the
      common state, a pasted key calling the provider directly, is recorded here rather than
      drawn as a second model path.
  - subject: The private package registry is drawn in the enterprise band, not as a tool source
    reason: >
      In this archetype the registry delivers the agent itself, not merely what the agent
      calls. Drawing it in the enterprise band rather than out among the public sources
      says the thing that matters: which build of the harness is permitted to run is a
      decision the organisation makes at its own mirror, which the native tools reaches directly
      under the endpoint's egress allowlist.
  - subject: The sandbox is a Sandboxed tools item, not a frame
    reason: >
      Of the ontology's three canonical sandbox forms, this one is a contained execution path
      inside one application: the harness and shell run as the user, and only tool execution
      is contained — conditionally, when isolation is on. A boundary frame would claim a
      containment the drawing's own notes deny. The personal agent, whose whole loop lives
      inside the container, draws the frame; here the item form is the honest one.

