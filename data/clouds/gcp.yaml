        made resumable, with its event history in Agent Platform Sessions so a stopped workflow
        picks up at its invocation and waits for an operator's confirmation. Each subagent calls
        on its own service account's short-lived token, and every model and tool call crosses
        Apigee. Google's reference also lets agents run as separate services that talk A2A, or on
        Agent Runtime — the managed runtime, which is a different drawing.
