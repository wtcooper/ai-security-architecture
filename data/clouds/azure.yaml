    summary:
      - >-
        Your own agent on Azure Container Apps, started by a Service Bus queue message rather than a
        person, reaching models and tools through API Management and leaving the virtual network only
        through Azure Firewall. Azure's orchestration guide calls this a single agent with tools —
        the right default before any multiagent pattern. Approvals above the threshold go to an
        operator queue; below it, the action's compensating transaction is the safety net.
