  - id: toolCodexSdk
    name: Codex SDK
    surfaceClasses:
      - managedRuntime
    variants:
      - name: "@openai/codex-sdk (TypeScript)"
        class: managedRuntime
        url: https://learn.chatgpt.com/docs/codex-sdk
      - name: openai-codex (Python)
        class: managedRuntime
        url: https://learn.chatgpt.com/docs/codex-sdk
    architecture: archAgentWorkflow
    status: ga
    asOf: "2026-09"
    summary:
      - >-
        The SDK embeds the Codex agent in customer-hosted automation: it drives a local Codex runtime (the
        Python package pins its own) over JSON-RPC with a thread/turn API, sandbox presets (read_only,
        workspace_write, full_access) settable per thread or per turn, and model selection. Inference is at
        OpenAI; execution is wherever the host runs.
      - >-
        Because it is the same app-server, the host's config.toml and any requirements.toml apply — the SDK
        page says an omitted sandbox falls back to the app-server's configured default. Unattended runs
        authenticate with CODEX_API_KEY, a service-account CODEX_ACCESS_TOKEN or workload identity federation,
        which is the credential story that distinguishes this entity from the interactive shells.
    facts:
      - label: Plans
        value: >-
          API-key usage bills at API rates; ChatGPT sign-in and service-account tokens use the workspace plan.
        url: https://learn.chatgpt.com/docs/pricing
      - label: Inference & routing
        value: >-
          The SDK controls a local runtime that calls OpenAI; model_provider / base_url overrides in
          config.toml apply.
        url: https://learn.chatgpt.com/docs/codex-sdk
      - label: Data leaving the device
        value: Prompts, file contents the agent reads and command output go to OpenAI as with the CLI.
        url: https://learn.chatgpt.com/docs/enterprise/chatgpt-work-local-security
      - label: Docs index
        value: learn.chatgpt.com/docs/codex-sdk
        url: https://learn.chatgpt.com/docs/codex-sdk
      - label: Data retention / training
        value: >-
          API-key traffic falls under the API data policy — not used for training by default, 30-day
          abuse-monitoring logs, ZDR by approval.
        url: https://developers.openai.com/api/docs/guides/your-data
    riskNotes:
      - risk: riskRunawayAgentToolLoops
        note: >-
          agents.max_concurrent_threads_per_session is the only vendor bound on subagent fan-out; task
          duration and spend are yours to cap.
      - risk: riskRogueActions
        note: >-
          full_access is one argument away in the SDK; pin allowed_sandbox_modes on the host so the preset is
          rejected.
      - risk: riskAgenticDelegationConfusedDeputy
        note: >-
          Runs act as whichever token the host holds; use a service account so actions attribute to the
          automation, not an engineer.
      - risk: riskToolSourceProvenance
        note: >-
          MCP servers and plugins configured on the host are inherited by SDK threads; allowlist them in
          requirements.toml.
