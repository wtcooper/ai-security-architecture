    verified: "2026-11-21"
  - id: deployRequireApproval
    name: "Require approval (requireApproval), Cloud Deploy Approver granted per target"
    product: "Cloud Deploy"
    where: "Cloud Deploy › (app's production target) › requireApproval: true; delivery pipeline IAM › roles/clouddeploy.approver with a condition on clouddeploy.googleapis.com/rolloutTarget"
    setVia: [configFile, cloudPolicy]
    area: sharing
    default: "No approval required"
    recommended: "Set requireApproval on the production target and grant Cloud Deploy Approver on that app's pipeline only to its named owner, conditioned on that target. Never grant it to the requester or to the pipeline."
