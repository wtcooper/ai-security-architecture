# Gemini Enterprise — one entity per product × reference architecture. Facts are dated (asOf) and cite the
# vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# Two entities share this family because they share one admin surface (the Gemini Enterprise app's
# Configurations in the Google Cloud console, Discovery Engine IAM, data stores and org-policy constraints):
# toolGeminiEnterprise (the employee chat and search assistant, enterprise AI chat) and
# toolGeminiEnterpriseWorkflowBuilder (employee-made chat agents and workflows, low-code agent builder).
# Excluded: the Business edition (administered from the Google Workspace Admin console; its own Help Center);
# Gemini Notebook Enterprise, Deep Research, Co-Scientist and AlphaEvolve (agents or products inside the app,
# not separate admin surfaces); custom agents hosted on Agent Runtime (toolVertexAgentEngine); AI developer
# tools settings (Gemini Code Assist); Agent Designer (the pre-GA name of Workflow Builder's agent editor).
# 2026-10-30: onboarded both entities against the MITRE capability rules. Every docs.cloud.google.com/gemini/
# enterprise/docs page was read with ?hl=en (without it some fetches bounce to a machine-translated locale) and
# answered 200; connectors/introduction-to-connectors-and-data-stores is the live path (the /introduction-...
# path in older links redirects). Rename found: the agents overview still says "turning on the Enable Workflow
# Builder toggle in the End user features control page"; the Feature Management tab now lists separate
# "Enable chat agents" and "Enable workflows" toggles. No admin page read states the model-training term for the
# app; it is in Google Cloud's service terms, so confirm it contractually.
vendor: google
family: Gemini Enterprise
tools:
  - id: toolGeminiEnterprise
    name: Gemini Enterprise app (assistant, search and connected-data actions)
    surfaceClasses:
      - saasChat
    variants:
      - name: Gemini Enterprise web app (Standard, Plus, Pay-as-you-go and Frontline editions)
        class: saasChat
        url: https://docs.cloud.google.com/gemini/enterprise/docs/manage-web-app-features
      - name: Gemini Enterprise in the Chrome address bar (Enterprise search aggregator policy)
        class: saasChat
        url: https://docs.cloud.google.com/gemini/enterprise/docs/configure-chrome
    architecture: archEnterpriseAiChat
    status: ga
    asOf: "2026-10"
    summary:
      - >-
        Google Cloud's employee assistant: chat and enterprise search grounded in connected data stores (Google
        Workspace, Microsoft 365, Jira, Confluence, ServiceNow, BigQuery and many more, federated live or
        ingested into the app's index), web grounding, actions that create or send in connected systems, and an
        Agent Gallery of Google-made, employee-made and registered custom agents. Inference is Google's (Gemini,
        and Anthropic Claude models when the admin enables them), in global, US, EU or selected in-country
        locations; the app and its data stores live in the customer's Google Cloud project.
      - >-
        Administration is Google Cloud's: Discovery Engine IAM roles (project, app and data-store level),
        licences, the app's Configurations (Feature Management, Assistant, Observability), managed org-policy
        constraints that restrict connector data sources, egress domains and custom MCP data stores, Model Armor
        templates on prompts, responses and data-store content, Sensitive Data Protection content policies on
        ingestion and uploads, VPC Service Controls, CMEK and Access Transparency, and Cloud Logging for usage
        audit logs and OpenTelemetry traces. Retrieval honours source ACLs through the configured identity
        provider. Actions present a draft the user edits and sends; no admin setting forces or removes that
        step.
    facts:
      - label: Plans
        value: >-
          Business (1–500 users, administered from the Workspace Admin console), Standard, Plus, Pay-as-you-go and
          Frontline editions; seat licences are per project and location and assigned manually or automatically on
          first sign-in. Sensitive Data Protection content policies are not available on Business.
        url: https://docs.cloud.google.com/gemini/enterprise/docs/editions
      - label: Inference & routing
        value: >-
          Gemini models chosen per app (some GA models cannot be turned off) and, if enabled, Claude Opus 5.5 and
          Sonnet 5.5 billed per token; app locations global, us, eu or in-country, with a warning before a model is
          routed to the global endpoint from an unsupported in-country region. Web grounding uses Google Search or
          the data-residency-compliant Enterprise web search.
        url: https://docs.cloud.google.com/gemini/enterprise/docs/manage-web-app-features
      - label: Data leaving the device
        value: >-
          Prompts, uploads and conversation content go to the Gemini Enterprise app in Google Cloud; federated
          connectors query the source live, ingestion connectors copy content into the app's index; third-party
          connectors call public endpoints outside Google, restricted by the egress-FQDN constraint and VPC
          firewall rules.
        url: https://docs.cloud.google.com/gemini/enterprise/docs/connectors/introduction-to-connectors-and-data-stores
      - label: Retention & training
        value: >-
          Assistant chat sessions are deleted after the admin's chat history retention period (1, 30, 60, 90, 120 or
          180 days; default 60, counted from creation); user-requested deletions complete within 60 days. Prompt and
          response text reaches Cloud Logging only if the admin enables it. The training term is not stated on the
          admin pages read — confirm it in the Google Cloud service terms.
        url: https://docs.cloud.google.com/gemini/enterprise/docs/configure-assistant
      - label: Docs index
        value: >-
          docs.cloud.google.com/gemini/enterprise/docs — Administrator guide (apps, feature management, identity,
          licences, connectors, agents, Model Armor, Sensitive Data Protection, VPC-SC, CMEK, observability, audit
          logging) and the release notes.
        url: https://docs.cloud.google.com/gemini/enterprise/docs/release-notes
      - label: Compliance scope
        value: >-
          Standard and Plus editions list HIPAA, FedRAMP, ISO 27001/27017/27018/27701, SOC 1/2/3, PCI DSS and BSI
          C5:2020 among their certifications; CMEK (US and EU multi-regions only) and Access Transparency are not
          supported in the global location.
        url: https://docs.cloud.google.com/gemini/enterprise/docs/compliance-security-controls
    items:
      - title: Who can reach which app
        body:
          - "Project-level Gemini Enterprise User (roles/discoveryengine.agentspaceUser) opens every app in the
            project and overrides app-level policy. To scope users to one app, grant Gemini Enterprise Restricted
            User at the project and Gemini Enterprise User on the app; to scope data stores as well, bind both the
            app and the data store, since a user needs both to get answers from it."
        links:
          - title: Configure access controls for apps
            url: https://docs.cloud.google.com/gemini/enterprise/docs/iam-policy-for-apps
          - title: Granular access controls for apps and data stores
            url: https://docs.cloud.google.com/gemini/enterprise/docs/iam-policy-for-apps-and-data-stores
      - title: Org-policy constraints on connectors
        body:
          - "Three managed constraints shape what admins can connect: discoveryengine.managed.allowedDataSources
            (Restrict allowed data sources for data connectors), discoveryengine.managed.allowedEgressFqdns (Restrict
            egress domains for data connectors) and a constraint that blocks custom MCP data stores by default. Under
            VPC Service Controls, new data stores are blocked until the sources and egress domains are listed."
        links:
          - title: Restrict allowed data sources
            url: https://docs.cloud.google.com/gemini/enterprise/docs/connectors/configure-allowed-data-sources
          - title: Restrict egress domains
            url: https://docs.cloud.google.com/gemini/enterprise/docs/connectors/configure-allowed-egress-fqdns
    riskNotes:
      - risk: riskPromptInjection
        note: >-
          Include cross-domain documents lets users search Drive documents from outside the organisation, which
          the vendor flags as raising prompt-injection exposure; Model Armor screens data-store content with the
          user-prompt template only when the admin enables it.
      - risk: riskAgenticDelegationConfusedDeputy
        note: >-
          Actions run with each user's own authorisation of the connected service (one Google connection covers
          both Calendar and Gmail), so a prompt-injected draft is sent with the user's authority once they click
          Send.
      - risk: riskRetrievalVectorStorePoisoning
        note: >-
          Ingestion connectors copy source content into the app's index; Sensitive Data Protection content policies
          can refuse matched content at ingestion, but nothing validates the rest.
      - risk: riskShadowAndUnknownAgents
        note: >-
          Employee-made agents start Private and are visible to admins with discoveryengine.agents.manage, but with
          agent sharing without admin approval on they reach colleagues without review.
    controls:
      - mitigation: D3-OTF
        coverage: partial
        mechanism: >-
          AllowedDomainsForApps / X-GoogApps-Allowed-Domains on managed Chrome or the proxy, binding Google sign-in
          to corporate domains; VPC Service Controls perimeter around the app; the allowed-egress-FQDN constraint
          for connector traffic
        steps:
          - title: Pin Google sign-in to your domains
            body:
              - Set the Chrome policy AllowedDomainsForApps (or inject X-GoogApps-Allowed-Domains at the proxy) with
                your Workspace domains, so other Google accounts are refused on managed devices and the network.
            url: https://chromeenterprise.google/policies/allowed-domains-for-apps/
          - title: Put the app inside a perimeter
            body:
              - Add the Gemini Enterprise project to a VPC Service Controls perimeter with Access Context Manager
                levels for your corporate network and devices.
            url: https://docs.cloud.google.com/gemini/enterprise/docs/use-vpc-service-controls
          - title: List the egress domains connectors may reach
            body:
              - Enforce discoveryengine.managed.allowedEgressFqdns with the FQDNs of each approved third-party
                connector's instance, authorisation and token URLs.
            url: https://docs.cloud.google.com/gemini/enterprise/docs/connectors/configure-allowed-egress-fqdns
        note: >-
          Partial on the browser-pin rule applied to every vendor: Google honours a domain-allowlist header the
          organisation's managed browser or proxy injects and enforces it server-side at sign-in, and VPC-SC with
          access levels keeps the API surface to approved contexts. Boundaries: the header binds only traffic
          through managed Chrome or the proxy; with Workforce Identity Federation sign-in the third-party IdP's
          conditional access is the pin; a separate Gemini Enterprise project created by staff is not refused by
          the header.
        verified: "2026-10-30"
      - mitigation: cap-sensitive-data-redaction
        coverage: native
        mechanism: >-
          Model Armor templates (with Sensitive Data Protection filters) on user prompts and responses; Sensitive
          Data Protection content policies on connectors and on files uploaded to the assistant
        steps:
          - title: Screen prompts and responses
            body:
              - In Gemini Enterprise > (app) > Configurations > Assistant, click Enable Model Armor and enter the
                resource names of templates for user prompts and response outputs, with Inspect and block.
            url: https://docs.cloud.google.com/gemini/enterprise/docs/enable-model-armor
          - title: Refuse sensitive content at ingestion and upload
            body:
              - Create a Sensitive Data Protection content policy and apply it to each connector and to assistant
                uploads, so matched content is not indexed and violating files are not uploaded.
            url: https://docs.cloud.google.com/gemini/enterprise/docs/protect-sensitive-data
        note: >-
          Native on the redaction rule applied to Microsoft 365 Copilot: a vendor tenant control inspects prompts
          and responses for sensitive data types and blocks the turn server-side, and content policies keep matched
          source content out of the index. Boundaries: block only — Model Armor "does not remove or alter PII or
          mask sensitive data"; content policies need Standard edition or higher and don't apply to the older type
          of data store; federated sources are screened at serving, not ingestion.
        verified: "2026-10-30"
      - mitigation: cap-input-guardrails
        coverage: native
        mechanism: >-
          Model Armor on the app: prompt-injection and jailbreak, malicious-URI and responsible-AI filters on user
          prompts, responses and out-of-the-box data-store content; Allow user interactions during Model Armor
          processing failure toggle
        steps:
          - title: Turn Model Armor on for the app
            body:
              - Enable Model Armor under Configurations > Assistant with templates whose enforcement type is Inspect
                and block (the console default); data-store content is screened with the user-prompt template.
            url: https://docs.cloud.google.com/gemini/enterprise/docs/enable-model-armor
        note: >-
          Native on the input-screening rule: an administrator-configured classifier screens prompts and retrieved
          content and blocks the turn, and its verdicts are in our Model Armor logs. Boundaries: "out-of-the-box
          data stores" are named, so custom MCP data stores and registered custom agents are not stated to be
          screened; latency rises; with the failure toggle on (the mode that keeps the service up), interactions
          pass unscreened while Model Armor is unavailable.
        verified: "2026-10-30"
      - mitigation: AML.M0029
        coverage: partial
        mechanism: >-
          Actions create a draft (calendar event, email) that the user edits and sends; per-service authorisation
          before the first action
        steps:
          - title: Enable only reviewed actions
            body:
              - In Gemini Enterprise > Data Stores > (data store) > Actions enable only the actions a team needs;
                each produces a draft the user must send.
            url: https://docs.cloud.google.com/gemini/enterprise/docs/connectors/manage-actions
        note: >-
          Partial on the human-approval rule: a present person sees and sends each Google action's draft, but the
          admin can neither require approval for an action class nor see that it was given, and registered custom
          agents carry their own approval behaviour. Approval is per draft, not per tool call.
        verified: "2026-10-30"
      - mitigation: D3-DI
        coverage: partial
        mechanism: >-
          The app's Data Stores list (source, federation or ingestion, owner); Sensitive Data Protection content
          policies inspecting ingested content
        steps:
          - title: Inspect what is ingested
            body:
              - Apply a Sensitive Data Protection content policy to each ingestion connector, so content is
                inspected for your information types as it is indexed.
            url: https://docs.cloud.google.com/gemini/enterprise/docs/protect-sensitive-data
        note: >-
          Partial on the inventory rule applied to ChatGPT: the product lists every connected source and can
          inspect ingested content against detectors, but it does not inventory or classify the content behind
          federated sources or report oversharing; Google Cloud Sensitive Data Protection discovery or the
          source's own DSPM supplies that.
        verified: "2026-10-30"
      - mitigation: D3-CH
        coverage: partial
        mechanism: >-
          Connector OAuth and service credentials held by the app (re-authenticate per data store); per-user action
          authorisation; Workforce Identity Pool admin roles restricted; CMEK for the app and connectors
        steps:
          - title: Restrict who can change identity mappings
            body:
              - Grant IAM Workforce Identity Pool Admin and Workforce Pool Editor only to named administrators,
                through Privileged Access Manager, and alert on attribute-mapping changes.
            url: https://docs.cloud.google.com/gemini/enterprise/docs/security-overview
        note: >-
          Partial on the credential rule: connector and user tokens are held by the service rather than the model,
          and the admin re-authenticates a data store's credential, but no page documents rotation, expiry or
          scope review of stored connector credentials, and a mis-set workforce pool mapping lets one user
          impersonate another.
        verified: "2026-10-30"
      - mitigation: AML.M0028
        coverage: native
        mechanism: >-
          Admin-created data stores with per-action enablement; allowedDataSources constraint; custom MCP data
          stores blocked by default; app- and data-store-level IAM
        steps:
          - title: Enable actions one by one
            body:
              - In Data Stores > (data store) > Actions select only the actions to enable; disable the rest.
            url: https://docs.cloud.google.com/gemini/enterprise/docs/connectors/manage-actions
          - title: Restrict connector types
            body:
              - Enforce discoveryengine.managed.allowedDataSources with the approved source values (for example jira,
                box), leaving custom_mcp out except in projects that need it.
            url: https://docs.cloud.google.com/gemini/enterprise/docs/connectors/configure-allowed-data-sources
        note: >-
          Native on the tool-permission rule applied to ChatGPT: only admins create data stores, each action is
          enabled individually, and org-policy constraints refuse unapproved source types and custom MCP servers,
          enforced server-side. Boundaries: a custom MCP data store admits the tools its server ships; registered
          custom agents' own tools are outside these lists.
        verified: "2026-10-30"
      - mitigation: cap-agent-tool-registry
        coverage: native
        mechanism: >-
          The app's Agents page (every Google-made, employee-made and custom agent with state Private, Enabled,
          Suspended or Disabled, owner and identity); Agent Registry import for A2A agents and MCP servers; skill
          and agent sharing approval
        steps:
          - title: Review the agent inventory
            body:
              - In Gemini Enterprise > (app) > Agents review each agent's state, owner and identity; register custom
                A2A agents and MCP servers through Agent Registry.
            url: https://docs.cloud.google.com/gemini/enterprise/docs/agents-overview
          - title: Keep sharing reviewed
            body:
              - In Feature Management leave Enable skill sharing without admin approval and Enable agent sharing
                without admin approval off, so new shares queue for an admin.
            url: https://docs.cloud.google.com/gemini/enterprise/docs/manage-web-app-features
        note: >-
          Native on the registry rule: the platform keeps an authoritative list of every agent in the app with owner,
          state and identity, and the admin approves sharing and can disable any agent. Boundaries: approval covers
          the first share only; a registered custom agent's SPIFFE ID shows only if its publisher published it.
        verified: "2026-10-30"
      - mitigation: cap-agent-tracing
        coverage: native
        mechanism: >-
          Usage audit logs and OpenTelemetry traces in Cloud Logging and Trace (Configurations > Observability,
          optional prompt and response logging); Cloud Audit Logs for discoveryengine.googleapis.com
        steps:
          - title: Turn observability on
            body:
              - In Configurations > Observability turn on Enable instrumentation of OpenTelemetry traces and logs;
                decide Enable logging of prompt inputs and response outputs per your policy.
            url: https://docs.cloud.google.com/gemini/enterprise/docs/manage-observability-settings
          - title: Enable Data Access audit logs
            body:
              - Enable Data Access audit logs for discoveryengine.googleapis.com and route them to your SIEM.
            url: https://docs.cloud.google.com/gemini/enterprise/docs/audit-logging
        note: >-
          Native on the telemetry rule: interactions, the sources used for grounding and the actions triggered are
          exported to our project's logging, where a sink sends them on. Limits: sensitive fields are logged only
          with prompt logging on (otherwise <elided>); Workflow Builder and Deep Research agents have their own
          per-agent toggle.
        verified: "2026-10-30"
      - mitigation: cap-shadow-ai-discovery
        coverage: external
        mechanism: >-
          SSE / CASB generative-AI category and Google Cloud organisation inventory (projects with the Discovery
          Engine API enabled)
        evidence:
          - title: Gemini Enterprise security overview (no report of unmanaged use)
            url: https://docs.cloud.google.com/gemini/enterprise/docs/security-overview
        note: >-
          External on the discovery rule: Gemini Enterprise reports on the apps in our projects, not on staff using
          consumer Gemini or a Gemini Enterprise app in a project outside the organisation. Use Cloud Asset
          Inventory for discoveryengine.googleapis.com across the organisation and the SSE for the rest.
        verified: "2026-10-30"
      - mitigation: cap-data-access-governance
        coverage: native
        mechanism: >-
          ACL-respecting retrieval through the configured identity provider (Google Identity or Workforce Identity
          Federation); app- and data-store-level IAM; the Include cross-domain documents toggle
        steps:
          - title: Configure the identity provider
            body:
              - Configure Google Identity (or Workforce Identity Federation for Microsoft 365 ingestion) so the app
                identifies each user and checks source permissions on every result.
            url: https://docs.cloud.google.com/gemini/enterprise/docs/configure-identity-provider
          - title: Scope data stores to the people who need them
            body:
              - Bind users to specific apps and data stores with resource-level IAM, and don't grant project-level
                predefined roles, which override them.
            url: https://docs.cloud.google.com/gemini/enterprise/docs/iam-policy-for-apps-and-data-stores
        note: >-
          Native on the retrieval rule applied to every vendor: retrieval honours source ACLs for the requesting user
          and the administrator decides which apps and data stores a user can reach. Limits: an ingested source's
          ACLs are as fresh as the last sync; changing identity provider loses chat history.
        verified: "2026-10-30"
      - mitigation: D3-APA
        coverage: native
        mechanism: >-
          Discovery Engine IAM (Gemini Enterprise Admin, User and Restricted User; app- and data-store-level
          bindings); licence assignment
        steps:
          - title: Scope users to apps
            body:
              - Grant Gemini Enterprise Restricted User at the project and Gemini Enterprise User on each app.
            url: https://docs.cloud.google.com/gemini/enterprise/docs/iam-policy-for-apps
          - title: Assign licences deliberately
            body:
              - In Gemini Enterprise > Manage users, assign licences to named users rather than Assign licenses
                automatically.
            url: https://docs.cloud.google.com/gemini/enterprise/docs/licenses
        note: >-
          Native on the authorisation rule: IAM administers who uses which app, data store and admin function, and
          licences gate access per user. Project-level predefined roles override resource-level bindings.
        verified: "2026-10-30"
      - mitigation: cap-agent-kill-switch
        coverage: partial
        mechanism: >-
          Agent state Disabled or Suspended; Feature Management toggles; removing app IAM or licences; disabling the
          Discovery Engine API (destructive)
        steps:
          - title: Disable a misbehaving agent
            body:
              - In Agents set the agent to Disabled (hidden, unusable) or Suspended (visible with a notice); users
                can no longer interact with it.
            url: https://docs.cloud.google.com/gemini/enterprise/docs/agents-overview
        note: >-
          Partial on the kill-switch rule: the admin can stop an agent or a feature org-wide without the user, but
          no delay is documented and, for workflows, Google states runs already in progress continue to completion.
          Disabling the Discovery Engine API turns everything off but may delete the app's resources.
        verified: "2026-10-30"
      - mitigation: cap-ai-vendor-assessment
        coverage: external
        mechanism: >-
          The organisation's TPRM platform, consuming the Gemini Enterprise compliance and security controls page and
          Google Cloud's compliance reports
        evidence:
          - title: Compliance certifications and security controls for Gemini Enterprise
            url: https://docs.cloud.google.com/gemini/enterprise/docs/compliance-security-controls
        note: >-
          External on the rule applied to every vendor. Note for the assessment: CMEK and Access Transparency are not
          available in the global location, and partner (Claude) models are an additional processor path when
          enabled.
        verified: "2026-10-30"
    # The security-relevant settings, each with the baseline value (data/tooling/BASELINE.md).
    # App settings are in Google Cloud console › Gemini Enterprise › (app) › Configurations (Feature Management,
    # Assistant, Observability); connector limits are managed org-policy constraints; identity and access are IAM.
    # Verified 2026-10-30.
    settings:
      - id: identityProvider
        name: Identity provider (Google Identity or Workforce Identity Federation)
        where: Gemini Enterprise identity configuration — Google Identity, or a Workforce Identity Federation pool
        setVia: [identityProvider, adminConsole]
        area: identity
        recommended: Google Identity federated to your corporate IdP (SAML or OIDC); Workforce Identity Federation only for Microsoft 365 ingestion
        why: Every answer is checked against source permissions for an identified user; changing provider later loses users' chat history.
        mitigations: [cap-data-access-governance]
        url: https://docs.cloud.google.com/gemini/enterprise/docs/configure-identity-provider
        verified: "2026-10-30"
      - id: appLevelIam
        name: Gemini Enterprise Restricted User / Gemini Enterprise User on the app
        where: IAM — roles/discoveryengine.agentspaceRestrictedUser at the project, roles/discoveryengine.agentspaceUser on each app
        setVia: [cloudPolicy, apiCli]
        area: identity
        default: Project-level User role opens every app in the project
        recommended: Restricted User at the project, User granted per app to the groups that need it
        why: An HR or deal-team app isn't reachable by everyone holding a licence in the same project.
        mitigations: [D3-APA, cap-data-access-governance]
        url: https://docs.cloud.google.com/gemini/enterprise/docs/iam-policy-for-apps
        verified: "2026-10-30"
      - id: licenseAssignment
        name: Assign licenses automatically
        where: Google Cloud console › Gemini Enterprise › Manage users
        setVia: [adminConsole]
        area: identity
        recommended: "Off — licences assigned to named users from your IdP group"
        why: Automatic assignment licenses anyone with project access on first sign-in; manual assignment keeps the user list an access decision.
        mitigations: [D3-APA]
        url: https://docs.cloud.google.com/gemini/enterprise/docs/licenses
        verified: "2026-10-30"
      - id: workforcePoolAdmins
        name: IAM Workforce Identity Pool Admin / Workforce Pool Editor holders
        where: IAM — roles/iam.workforcePoolAdmin and roles/iam.workforcePoolEditor, through Privileged Access Manager
        setVia: [cloudPolicy]
        area: identity
        default: Granted as you assign them
        recommended: A named few, as time-bound Privileged Access Manager entitlements, with mapping changes alerted in the SIEM
        why: Whoever edits attribute mappings can make one user appear as another and read their documents.
        mitigations: [D3-CH, D3-APA]
        url: https://docs.cloud.google.com/gemini/enterprise/docs/security-overview
        verified: "2026-10-30"
      - id: allowedDomainsForApps
        name: AllowedDomainsForApps (X-GoogApps-Allowed-Domains)
        where: Chrome policy on managed browsers, or the header injected by your proxy
        setVia: [mdm, cloudPolicy]
        area: network
        default: Unset
        recommended: Your Workspace domains
        why: Google sign-in on managed devices and the corporate network accepts only corporate accounts.
        mitigations: [D3-OTF]
        url: https://chromeenterprise.google/policies/allowed-domains-for-apps/
        verified: "2026-10-30"
      - id: vpcServiceControls
        name: VPC Service Controls perimeter
        where: Access Context Manager › perimeter around the Gemini Enterprise project
        setVia: [cloudPolicy]
        area: network
        default: No perimeter
        recommended: The project inside a perimeter with access levels for your corporate network and managed devices
        why: The app's APIs and connected data can't be reached or copied from outside approved contexts; new data stores then need the source and egress constraints set.
        mitigations: [D3-OTF, cap-data-access-governance]
        url: https://docs.cloud.google.com/gemini/enterprise/docs/use-vpc-service-controls
        verified: "2026-10-30"
      - id: allowedEgressFqdns
        name: Restrict egress domains for data connectors (discoveryengine.managed.allowedEgressFqdns)
        where: Organization Policies › discoveryengine.managed.allowedEgressFqdns
        setVia: [cloudPolicy]
        area: network
        default: Not enforced
        recommended: Enforced, listing each approved connector's instance, authorisation and token domains
        why: A connector can't be pointed at an arbitrary host to pull data in or send it out.
        mitigations: [D3-OTF, AML.M0028]
        url: https://docs.cloud.google.com/gemini/enterprise/docs/connectors/configure-allowed-egress-fqdns
        verified: "2026-10-30"
      - id: allowedDataSources
        name: Restrict allowed data sources for data connectors (discoveryengine.managed.allowedDataSources)
        where: Organization Policies › discoveryengine.managed.allowedDataSources
        setVia: [cloudPolicy]
        area: tools
        default: Not enforced
        recommended: Enforced, listing the connector types your firm has approved
        why: An admin can't add a data store for an unreviewed SaaS source, so the connected estate stays the reviewed one.
        mitigations: [AML.M0028, cap-agent-tool-registry]
        url: https://docs.cloud.google.com/gemini/enterprise/docs/connectors/configure-allowed-data-sources
        verified: "2026-10-30"
      - id: customMcpConstraint
        name: Custom MCP data store constraint
        where: Organization Policies › managed constraint blocking custom MCP data stores (override per project)
        setVia: [cloudPolicy]
        area: tools
        default: Custom MCP data stores blocked
        recommended: Blocked, overridden only for projects whose MCP servers are registered and reviewed
        why: An MCP server's tools reach the assistant only after someone has approved the server.
        mitigations: [AML.M0028, cap-agent-tool-registry]
        url: https://docs.cloud.google.com/gemini/enterprise/docs/connectors/custom-mcp-server/override-constraint-for-custom-mcp-data-stores
        verified: "2026-10-30"
      - id: dataStoreActions
        name: Actions (Enable actions / Disable actions)
        where: Google Cloud console › Gemini Enterprise › Data Stores › (data store) › Actions
        setVia: [adminConsole]
        area: tools
        default: None until enabled
        recommended: Only the actions a team needs — read and draft-creating actions first; delete actions off
        why: Each write the assistant can make in a connected system is one an admin chose; the user still sends each draft.
        mitigations: [AML.M0028, AML.M0029]
        url: https://docs.cloud.google.com/gemini/enterprise/docs/connectors/manage-actions
        verified: "2026-10-30"
      - id: modelArmor
        name: Enable Model Armor
        where: Google Cloud console › Gemini Enterprise › (app) › Configurations › Assistant
        setVia: [adminConsole]
        area: tools
        default: "Off"
        recommended: On, with Inspect and block templates for user prompts and response outputs, including Sensitive Data Protection filters
        why: Injected instructions in prompts or retrieved content, malicious URLs and sensitive data in responses are blocked before the user sees them.
        mitigations: [cap-input-guardrails, cap-sensitive-data-redaction]
        url: https://docs.cloud.google.com/gemini/enterprise/docs/enable-model-armor
        verified: "2026-10-30"
      - id: modelArmorFailureMode
        name: Allow user interactions during Model Armor processing failure
        where: Google Cloud console › Gemini Enterprise › (app) › Configurations › Assistant
        setVia: [adminConsole]
        area: tools
        default: On (allow)
        recommended: "On"
        why: The assistant keeps working through a screening outage; regulated teams turn it off so nothing passes unscreened.
        mitigations: [cap-input-guardrails]
        url: https://docs.cloud.google.com/gemini/enterprise/docs/enable-model-armor
        verified: "2026-10-30"
      - id: sensitiveDataContentPolicies
        name: Sensitive Data Protection content policies
        where: Sensitive Data Protection › content policy, applied to each connector and to assistant uploads
        setVia: [cloudPolicy, adminConsole]
        area: data
        default: None
        recommended: A policy for your detectors (credentials, national IDs, client account numbers) on every ingestion connector and on uploads
        why: Matched content is never indexed and violating files never reach the assistant.
        mitigations: [cap-sensitive-data-redaction, D3-DI]
        requires: Standard edition or higher (not Business)
        url: https://docs.cloud.google.com/gemini/enterprise/docs/protect-sensitive-data
        verified: "2026-10-30"
      - id: crossDomainDocuments
        name: Include cross-domain documents
        where: Google Cloud console › Gemini Enterprise › (app) › Configurations › Feature Management
        setVia: [adminConsole]
        area: data
        recommended: "Off"
        why: Drive documents from outside the organisation stay out of results, which the vendor names as a prompt-injection path.
        mitigations: [cap-input-guardrails, cap-data-access-governance]
        url: https://docs.cloud.google.com/gemini/enterprise/docs/manage-web-app-features
        verified: "2026-10-30"
      - id: webGrounding
        name: Enable web grounding
        where: Google Cloud console › Gemini Enterprise › (app) › Configurations › Assistant
        setVia: [adminConsole]
        area: data
        recommended: On — Enterprise web search (Data Residency compliant)
        why: Web answers stay available without sending generated queries to the standard Google Search index; regulated teams turn grounding off.
        mitigations: []
        url: https://docs.cloud.google.com/gemini/enterprise/docs/configure-assistant
        verified: "2026-10-30"
      - id: chatHistoryRetention
        name: Chat history retention period
        where: Google Cloud console › Gemini Enterprise › (app) › Configurations › Assistant
        setVia: [adminConsole]
        area: data
        default: 60 days (from creation)
        recommended: 30 days
        why: Conversations holding client material are deleted sooner; tell users, since age counts from creation, not last use.
        mitigations: []
        url: https://docs.cloud.google.com/gemini/enterprise/docs/configure-assistant
        verified: "2026-10-30"
      - id: sessionSharing
        name: Enable session sharing
        where: Google Cloud console › Gemini Enterprise › (app) › Configurations › Feature Management
        setVia: [adminConsole]
        area: sharing
        recommended: "On"
        why: Colleagues can share conversations inside the organisation; anyone shared with sees every prompt and response in it, generated content included.
        mitigations: []
        url: https://docs.cloud.google.com/gemini/enterprise/docs/manage-web-app-features
        verified: "2026-10-30"
      - id: skillSharingWithoutApproval
        name: Enable skill sharing without admin approval
        where: Google Cloud console › Gemini Enterprise › (app) › Configurations › Feature Management
        setVia: [adminConsole]
        area: sharing
        recommended: "Off"
        why: A custom skill reaches colleagues only after an admin approves the share request.
        mitigations: [cap-agent-tool-registry]
        url: https://docs.cloud.google.com/gemini/enterprise/docs/manage-web-app-features
        verified: "2026-10-30"
      - id: agentState
        name: Agent state (Enabled / Suspended / Disabled)
        where: Google Cloud console › Gemini Enterprise › (app) › Agents
        setVia: [adminConsole]
        area: audit
        recommended: Disabled is your incident runbook's first step for a misbehaving agent
        why: Stops one agent for everyone without touching the assistant; runs already in progress are not documented to stop.
        mitigations: [cap-agent-kill-switch, cap-agent-tool-registry]
        url: https://docs.cloud.google.com/gemini/enterprise/docs/agents-overview
        verified: "2026-10-30"
      - id: observability
        name: Enable instrumentation of OpenTelemetry traces and logs
        where: Google Cloud console › Gemini Enterprise › (app) › Configurations › Observability
        setVia: [adminConsole, apiCli]
        area: audit
        recommended: On, with a log sink to your SIEM
        why: Each request, the sources used and the actions it triggered are traced in your project instead of nowhere.
        mitigations: [cap-agent-tracing]
        url: https://docs.cloud.google.com/gemini/enterprise/docs/manage-observability-settings
        verified: "2026-10-30"
      - id: promptLogging
        name: Enable logging of prompt inputs and response outputs
        where: Google Cloud console › Gemini Enterprise › (app) › Configurations › Observability
        setVia: [adminConsole, apiCli]
        area: audit
        recommended: "Off; turned on for an investigation, with log access restricted"
        why: Usage audit logs still record who did what with prompt text elided; turning it on puts full prompts, PII included, into Cloud Logging.
        mitigations: [cap-agent-tracing]
        url: https://docs.cloud.google.com/gemini/enterprise/docs/manage-observability-settings
        verified: "2026-10-30"
      - id: dataAccessAuditLogs
        name: Data Access audit logs (discoveryengine.googleapis.com)
        where: Google Cloud console › IAM & Admin › Audit Logs › Discovery Engine API
        setVia: [cloudPolicy]
        area: audit
        recommended: DATA_READ and DATA_WRITE on for the Gemini Enterprise project, routed to your SIEM
        why: A server-side record of every search, answer and data-store read by principal, beside the admin-activity record of configuration changes.
        mitigations: [cap-agent-tracing]
        url: https://docs.cloud.google.com/gemini/enterprise/docs/audit-logging
        verified: "2026-10-30"
    sources:
      - title: Manage web app features
        url: https://docs.cloud.google.com/gemini/enterprise/docs/manage-web-app-features
      - title: Configure the assistant
        url: https://docs.cloud.google.com/gemini/enterprise/docs/configure-assistant
      - title: Enable Model Armor for Gemini Enterprise
        url: https://docs.cloud.google.com/gemini/enterprise/docs/enable-model-armor
      - title: Protect sensitive data with Sensitive Data Protection
        url: https://docs.cloud.google.com/gemini/enterprise/docs/protect-sensitive-data
      - title: Gemini Enterprise security overview
        url: https://docs.cloud.google.com/gemini/enterprise/docs/security-overview
      - title: Configure granular access controls for apps and data stores
        url: https://docs.cloud.google.com/gemini/enterprise/docs/iam-policy-for-apps-and-data-stores
      - title: Manage observability settings
        url: https://docs.cloud.google.com/gemini/enterprise/docs/manage-observability-settings
      - title: Agents overview
        url: https://docs.cloud.google.com/gemini/enterprise/docs/agents-overview
      - title: Compliance certifications and security controls
        url: https://docs.cloud.google.com/gemini/enterprise/docs/compliance-security-controls

  - id: toolGeminiEnterpriseWorkflowBuilder
    name: Gemini Enterprise Workflow Builder (chat agents and workflows)
    surfaceClasses:
      - saasAgentPlatform
    variants:
      - name: Chat agents (conversational, single or multi-step)
        class: saasAgentPlatform
        url: https://docs.cloud.google.com/gemini/enterprise/docs/workflow-builder/chat-agents
      - name: Workflows (steps, triggers, schedules, human-in-the-loop steps, MCP steps)
        class: saasAgentPlatform
        url: https://docs.cloud.google.com/gemini/enterprise/docs/workflow-builder/workflows
    architecture: archLowCodeAgentBuilder
    status: ga
    asOf: "2026-10"
    summary:
      - >-
        The no-code / low-code builder inside the Gemini Enterprise web app (GA 2026-09-03): employees create chat
        agents and workflows from natural language or a visual editor, wire them to the app's connectors, MCP
        servers and other agents, simulate them, version them, schedule them or start them from connector events,
        and share them with colleagues or groups. Agents run in Google's service under the Gemini Enterprise app;
        scheduled and event-triggered runs use the author's delegated user credentials, which expire every 14
        days.
      - >-
        Governance is the Gemini Enterprise app's: the Feature Management toggles (Enable chat agents, Enable
        workflows, agent sharing with or without admin approval, sharing with groups), the connectors, actions and
        MCP data stores the administrator provisions (the only tools an agent can use), the Agents page with its
        Enabled / Suspended / Disabled states, per-agent observability, and Model Armor on the app. There is no
        separate agent identity, no approval gate on new versions after the first share, and turning a workflow off
        lets in-progress runs finish.
    facts:
      - label: Plans
        value: >-
          Part of the Gemini Enterprise editions administered in the Google Cloud console; schedules are
          multi-region only.
        url: https://docs.cloud.google.com/gemini/enterprise/docs/workflow-builder
      - label: Inference & routing
        value: >-
          Gemini agent steps run on the app's Gemini models in Google's service; MCP and connector steps call the
          systems the administrator connected.
        url: https://docs.cloud.google.com/gemini/enterprise/docs/workflow-builder/connect-mcp-servers
      - label: Data leaving the device
        value: >-
          Workflow definitions, run inputs and outputs and connector data stay in the Gemini Enterprise app;
          connector and MCP steps send data to those systems with the running user's (or, for schedules, the
          author's) authorisation.
        url: https://docs.cloud.google.com/gemini/enterprise/docs/workflow-builder/share-workflows
      - label: Retention & training
        value: >-
          As for the Gemini Enterprise app; workflow runs are listed in the Runs tab, and per-agent observability
          decides whether traces and prompt text reach Cloud Logging.
        url: https://docs.cloud.google.com/gemini/enterprise/docs/manage-observability-settings
      - label: Docs index
        value: >-
          docs.cloud.google.com/gemini/enterprise/docs/workflow-builder — create, share, publish, versions, triggers,
          human-in-the-loop steps, MCP servers, quotas and known issues.
        url: https://docs.cloud.google.com/gemini/enterprise/docs/workflow-builder
      - label: Execution identity
        value: >-
          Scheduled agents execute using the author's delegated user credentials, valid 14 days and refreshed
          manually; shared users run with their own authorisation to data stores and connectors.
        url: https://docs.cloud.google.com/gemini/enterprise/docs/workflow-builder/quotas-and-limits
    riskNotes:
      - risk: riskAgenticDelegationConfusedDeputy
        note: >-
          A scheduled or event-triggered workflow acts with its author's delegated credentials, so its output, shared
          with others, can carry data only the author could read.
      - risk: riskShadowAndUnknownAgents
        note: >-
          By default workflow owners share with any user in the organisation without admin approval; only the
          initial share is ever reviewed, so a later version changes what colleagues run without a second look.
      - risk: riskRogueActions
        note: >-
          Mutative connector actions (create, send, delete) and MCP tools in a Gemini agent step are chosen by the
          model at runtime; approval steps exist only where the author adds them.
      - risk: riskPromptInjection
        note: >-
          Event triggers start workflows from new emails, calendar events or files, so outside content reaches a
          Gemini agent step without a person in the loop.
    controls:
      - mitigation: D3-APA
        coverage: native
        mechanism: >-
          Feature Management toggles (Enable chat agents, Enable workflows, Enable agent sharing, Enable agent sharing
          without admin approval, Enable End Users to share with Groups); IAM allow policies on each shared agent;
          app-level IAM
        steps:
          - title: Turn the builder on for the right app
            body:
              - In Gemini Enterprise > (app) > Configurations > Feature Management turn on Enable chat agents and
                Enable workflows only in apps whose users are cleared to build agents.
            url: https://docs.cloud.google.com/gemini/enterprise/docs/manage-web-app-features
          - title: Require review of shares
            body:
              - Keep Enable agent sharing without admin approval off so first shares queue for an app administrator.
            url: https://docs.cloud.google.com/gemini/enterprise/docs/workflow-builder/share-workflows
        note: >-
          Native on the authorisation rule applied to Copilot Studio: the administrator decides who may build, whether
          sharing needs approval and whether groups can be targets, and each share is an IAM allow policy (up to 1,500
          members). Boundary: approval covers the first share only.
        verified: "2026-10-30"
      - mitigation: D3-AA
        coverage: none
        mechanism: No agent identity for employee-made agents; runs use the running user's or, for schedules, the author's delegated credentials
        evidence:
          - title: Workflow Builder quotas and limits — credential validity window
            url: https://docs.cloud.google.com/gemini/enterprise/docs/workflow-builder/quotas-and-limits
          - title: Agents overview — agent identity (SPIFFE ID for registered custom agents only)
            url: https://docs.cloud.google.com/gemini/enterprise/docs/agents-overview
        note: >-
          None on the agent-identity rule applied to Copilot Studio: an employee-made agent has no principal of its
          own — interactive runs authenticate as the user and scheduled runs as the author, with delegated credentials
          that expire after 14 days. Downstream systems see a person, not the agent. Where a workflow needs its own
          identity, build it as an Agent Runtime agent with agent identity and register it in the app.
        verified: "2026-10-30"
      - mitigation: cap-agent-tool-registry
        coverage: native
        mechanism: >-
          The app's Agents page listing employee-made agents with owner and state; admin approval of first shares;
          administrators can transfer ownership
        steps:
          - title: Review employee-made agents
            body:
              - In Gemini Enterprise > (app) > Agents review employee-made agents by state and owner; Private agents
                are visible to holders of discoveryengine.agents.manage.
            url: https://docs.cloud.google.com/gemini/enterprise/docs/agents-overview
        note: >-
          Native on the registry rule: the platform keeps an authoritative list of every employee-made agent with
          owner and state, and admins approve sharing, transfer ownership and disable agents.
        verified: "2026-10-30"
      - mitigation: cap-staged-rollout-gate
        coverage: partial
        mechanism: >-
          Draft and live versions, version history and restore, simulation in the Preview tab; admin approval of the
          initial share
        steps:
          - title: Gate the first release
            body:
              - Keep Enable agent sharing without admin approval off so a workflow's first share is reviewed before it
                reaches colleagues.
            url: https://docs.cloud.google.com/gemini/enterprise/docs/manage-web-app-features
        note: >-
          Partial on the rollout rule applied to Copilot Studio. Met: versioning with a draft separate from the live
          version, simulation before turning on, restore of an earlier version. Not met: "subsequent workflow
          revisions don't need re-approval", so an author can turn on any new version for everyone already shared
          with; there is no percentage rollout.
        verified: "2026-10-30"
      - mitigation: AML.M0028
        coverage: native
        mechanism: >-
          Agents can use only the connectors, actions and MCP data stores the administrator provisioned; per-action
          enablement on data stores; allowedDataSources and the custom MCP constraint
        steps:
          - title: Provision only approved tools
            body:
              - Enable on each data store only the actions agents may call, and keep custom MCP data stores blocked
                except for reviewed servers.
            url: https://docs.cloud.google.com/gemini/enterprise/docs/connectors/manage-actions
        note: >-
          Native on the tool-permission rule applied to Copilot Studio: the actions and tools available to any agent
          "are limited to the data connectors, tools, and permissions provisioned by the Gemini Enterprise
          administrator", enforced by the service; an author cannot add a tool the admin didn't provision.
          Boundary: an MCP connector admits every tool its server ships.
        verified: "2026-10-30"
      - mitigation: D3-CH
        coverage: partial
        mechanism: >-
          Delegated OAuth per user, with author credentials for schedules valid 14 days; admin-registered OAuth client
          and scopes for custom MCP servers
        steps:
          - title: Narrow MCP OAuth scopes
            body:
              - When registering Gemini Enterprise as an OAuth client for a custom MCP server, grant only the scopes
                its tools need.
            url: https://docs.cloud.google.com/gemini/enterprise/docs/connectors/custom-mcp-server/set-up-custom-mcp-server
        note: >-
          Partial on the credential rule applied to Copilot Studio: credentials are held by the service and expire
          (14 days for schedules), but the agent borrows a person's authority rather than holding a scoped credential
          of its own, and no rotation or scope review is documented beyond the manual refresh.
        verified: "2026-10-30"
      - mitigation: cap-input-guardrails
        coverage: partial
        mechanism: Model Armor on the Gemini Enterprise app (Configurations > Assistant)
        steps:
          - title: Turn Model Armor on for the app
            body:
              - Enable Model Armor with Inspect and block templates on the app the builder runs in.
            url: https://docs.cloud.google.com/gemini/enterprise/docs/enable-model-armor
        note: >-
          Partial on the input-screening rule: Model Armor is admin-configured for the app, but its page names the
          assistant's prompts and responses and out-of-the-box data-store content, not Workflow Builder agent steps,
          event-trigger payloads or MCP tool results; confirm coverage in the Model Armor logs before relying on it.
        verified: "2026-10-30"
      - mitigation: cap-data-access-governance
        coverage: native
        mechanism: >-
          Shared agents read data stores and connectors with each user's own authorisation; source ACLs preserved;
          app- and data-store-level IAM
        steps:
          - title: Scope data stores
            body:
              - Bind users to the apps and data stores they need with resource-level IAM; shared agents then return
                only what each user can read.
            url: https://docs.cloud.google.com/gemini/enterprise/docs/iam-policy-for-apps-and-data-stores
        note: >-
          Native on the retrieval rule applied to Copilot Studio: a shared agent run by a user retrieves with that
          user's permissions and ACLs are preserved. Boundary: scheduled and event-triggered runs use the author's
          credentials, so their outputs carry the author's view of the data.
        verified: "2026-10-30"
      - mitigation: cap-agent-tracing
        coverage: partial
        mechanism: >-
          Per-agent observability toggle (OpenTelemetry traces and logs, optional prompt logging) for Workflow Builder
          agents; the Runs tab
        steps:
          - title: Turn observability on per agent
            body:
              - In Gemini Enterprise > (app) > Agents > (agent) > Configuration turn on Enable instrumentation of
                OpenTelemetry traces and logs for each shared or scheduled agent.
            url: https://docs.cloud.google.com/gemini/enterprise/docs/manage-observability-settings
        note: >-
          Partial on the tracing rule applied to Copilot Studio: traces land in our project when enabled, but the
          toggle is per agent, not an app-wide default, so a new agent is untraced until someone turns it on.
        verified: "2026-10-30"
      - mitigation: cap-agent-kill-switch
        coverage: partial
        mechanism: >-
          Agent state Disabled or Suspended; turning a workflow off (removes schedules and triggers); Enable chat
          agents / Enable workflows off
        steps:
          - title: Disable the agent
            body:
              - In Agents set the agent to Disabled; for a workflow, also turn its live version off so no new run
                starts.
            url: https://docs.cloud.google.com/gemini/enterprise/docs/workflow-builder/publish-workflows
        note: >-
          Partial on the kill-switch rule: the admin can stop new use and new runs without the author, but Google
          states that runs already in progress, simulations included, continue until they complete.
        verified: "2026-10-30"
      - mitigation: cap-ai-vendor-assessment
        coverage: external
        mechanism: The organisation's TPRM platform, consuming the Gemini Enterprise compliance page
        evidence:
          - title: Compliance certifications and security controls for Gemini Enterprise
            url: https://docs.cloud.google.com/gemini/enterprise/docs/compliance-security-controls
        note: >-
          External on the rule applied to every vendor; assessed with toolGeminiEnterprise, since Workflow Builder is a
          feature of the same app and service.
        verified: "2026-10-30"
    # The security-relevant settings, each with the baseline value (data/tooling/BASELINE.md).
    # The builder is governed from the Gemini Enterprise app's Configurations › Feature Management and Agents pages,
    # plus the app's connectors and IAM (rows on toolGeminiEnterprise apply too). Verified 2026-10-30.
    settings:
      - id: enableChatAgents
        name: Enable chat agents
        where: Google Cloud console › Gemini Enterprise › (app) › Configurations › Feature Management
        setVia: [adminConsole]
        area: tools
        recommended: On in apps whose users are cleared to build agents
        why: Who can build conversational agents on the firm's connected data is a per-app decision; off removes building and use of custom chat agents.
        mitigations: [D3-APA, cap-agent-kill-switch]
        url: https://docs.cloud.google.com/gemini/enterprise/docs/manage-web-app-features
        verified: "2026-10-30"
      - id: enableWorkflows
        name: Enable workflows
        where: Google Cloud console › Gemini Enterprise › (app) › Configurations › Feature Management
        setVia: [adminConsole]
        area: tools
        recommended: On in apps whose users are cleared to build agents
        why: Workflows run on schedules and connector events with the author's credentials; enabling them is the decision to allow unattended automation.
        mitigations: [D3-APA, cap-agent-kill-switch]
        url: https://docs.cloud.google.com/gemini/enterprise/docs/manage-web-app-features
        verified: "2026-10-30"
      - id: enableAgentSharing
        name: Enable agent sharing
        where: Google Cloud console › Gemini Enterprise › (app) › Configurations › Feature Management
        setVia: [adminConsole]
        area: sharing
        recommended: "On"
        why: Useful agents can reach colleagues inside the organisation through a reviewed share.
        mitigations: [D3-APA]
        url: https://docs.cloud.google.com/gemini/enterprise/docs/manage-web-app-features
        verified: "2026-10-30"
      - id: agentSharingWithoutApproval
        name: Enable agent sharing without admin approval
        where: Google Cloud console › Gemini Enterprise › (app) › Configurations › Feature Management
        setVia: [adminConsole]
        area: sharing
        default: Workflow owners can share with any user without approval (per the share-workflows page)
        recommended: "Off — first shares go to an app administrator for review"
        why: An agent reaches colleagues only after someone accountable has seen what it does; later versions still need no re-approval.
        mitigations: [cap-agent-tool-registry, cap-staged-rollout-gate, D3-APA]
        url: https://docs.cloud.google.com/gemini/enterprise/docs/workflow-builder/share-workflows
        verified: "2026-10-30"
      - id: shareWithGroups
        name: Enable End Users to share with Groups
        where: Google Cloud console › Gemini Enterprise › (app) › Configurations › Feature Management
        setVia: [adminConsole]
        area: sharing
        default: "Off"
        recommended: On, with admin approval kept on
        why: Group shares stay manageable and under IAM's 1,500-member limit per policy; approval still applies.
        mitigations: [D3-APA]
        url: https://docs.cloud.google.com/gemini/enterprise/docs/workflow-builder/share-workflows
        verified: "2026-10-30"
      - id: agentObservability
        name: Enable instrumentation of OpenTelemetry traces and logs (agent level)
        where: Google Cloud console › Gemini Enterprise › (app) › Agents › (agent) › Configuration
        setVia: [adminConsole, apiCli]
        area: audit
        recommended: On for every shared, scheduled or event-triggered agent; prompt logging off
        why: Each run's steps and tool calls are traced in your project; the toggle is per agent, so add it to the share-approval checklist.
        mitigations: [cap-agent-tracing]
        url: https://docs.cloud.google.com/gemini/enterprise/docs/manage-observability-settings
        verified: "2026-10-30"
      - id: agentState
        name: Agent state (Enabled / Suspended / Disabled)
        where: Google Cloud console › Gemini Enterprise › (app) › Agents
        setVia: [adminConsole]
        area: audit
        recommended: Disabled is your incident runbook's first step for a misbehaving employee-made agent
        why: Users can no longer run it; turn its workflow version off as well, and note in-progress runs continue to completion.
        mitigations: [cap-agent-kill-switch]
        url: https://docs.cloud.google.com/gemini/enterprise/docs/agents-overview
        verified: "2026-10-30"
      - id: dataStoreActions
        name: Actions (Enable actions / Disable actions)
        where: Google Cloud console › Gemini Enterprise › Data Stores › (data store) › Actions
        setVia: [adminConsole]
        area: tools
        default: None until enabled
        recommended: Only the actions agents need; delete and permission-changing actions off
        why: Mutative steps a workflow's model can choose are limited to the ones an admin enabled.
        mitigations: [AML.M0028]
        url: https://docs.cloud.google.com/gemini/enterprise/docs/connectors/manage-actions
        verified: "2026-10-30"
      - id: customMcpConstraint
        name: Custom MCP data store constraint
        where: Organization Policies › managed constraint blocking custom MCP data stores (override per project)
        setVia: [cloudPolicy]
        area: tools
        default: Custom MCP data stores blocked
        recommended: Blocked, overridden only for projects whose MCP servers are registered and reviewed
        why: MCP tools that a Gemini agent step can call at runtime come only from servers someone has approved.
        mitigations: [AML.M0028, cap-agent-tool-registry]
        url: https://docs.cloud.google.com/gemini/enterprise/docs/connectors/custom-mcp-server/override-constraint-for-custom-mcp-data-stores
        verified: "2026-10-30"
      - id: mcpOAuthScopes
        name: OAuth scopes for the Gemini Enterprise client app (custom MCP server)
        where: Your identity provider › OAuth client registered for https://vertexaisearch.cloud.google.com/oauth-redirect
        setVia: [identityProvider]
        area: identity
        recommended: Only the scopes the server's approved tools need
        why: Agents calling the server on a user's behalf can't use more of that user's authority than the tools require.
        mitigations: [D3-CH, AML.M0028]
        url: https://docs.cloud.google.com/gemini/enterprise/docs/connectors/custom-mcp-server/set-up-custom-mcp-server
        verified: "2026-10-30"
      - id: modelArmor
        name: Enable Model Armor
        where: Google Cloud console › Gemini Enterprise › (app) › Configurations › Assistant
        setVia: [adminConsole]
        area: tools
        default: "Off"
        recommended: On, with Inspect and block templates
        why: Prompts and responses in the app are screened for injection and malicious URLs; check the logs for Workflow Builder steps before relying on it there.
        mitigations: [cap-input-guardrails]
        url: https://docs.cloud.google.com/gemini/enterprise/docs/enable-model-armor
        verified: "2026-10-30"
      - id: dataStoreIam
        name: Resource-level IAM on apps and data stores
        where: IAM bindings on the app and on each data store, with no broad project-level predefined roles
        setVia: [cloudPolicy, apiCli]
        area: identity
        default: Project-level roles apply to every app and data store
        recommended: Users bound to the apps and data stores their work needs
        why: A shared agent returns only what each user is entitled to; project-level roles would override the scoping.
        mitigations: [cap-data-access-governance, D3-APA]
        url: https://docs.cloud.google.com/gemini/enterprise/docs/iam-policy-for-apps-and-data-stores
        verified: "2026-10-30"
