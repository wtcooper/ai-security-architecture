      - mitigation: cap-agent-egress-control
        coverage: native
        mechanism: >-
          Network Controls (Enterprise) with No policy, Allow all network access, Defaults plus team allowlist and
          Team allowlist only, domains and IP ranges with ports, directory-group policies and a lock;
          /grok-bot/network (egressMode, locked); Allow Local Egress
        steps:
          - title: Set Team allowlist only and lock it
            body:
              - In Network Controls on the Grok Bot page choose Team allowlist only, list the domains and IP ranges
                Bots need, and lock the team policy so group policies cannot replace it; running computers apply
                changes within about a minute.
            url: https://cursor.com/docs/grok-bot/security
          - title: Keep desktop routes and networking clients inside the policy
            body:
              - Turn Allow Local Egress off unless members need Route egress through this desktop, and add a Team
                Setup networking client's coordination servers, relays and gateways to the allowlist.
            url: https://cursor.com/docs/grok-bot/private-networks
          - title: Manage the policy as code
            body:
              - PUT /grok-bot/network with egressMode network_settings_only and locked true.
            url: https://cursor.com/docs/account/teams/admin-api
        note: >-
          Native on the hosted rule: an admin-authored allowlist, lockable over directory-group policies,
          enforced by Cursor on all traffic from the Bot computer and applied to running computers within about a
          minute. Enterprise only; teams without a policy allow all destinations. Bypasses: connector calls run
          from Cursor's connector backend outside the computer's policy (blocking a plugin and blocking its
          website are separate controls), delegated Cloud Agents follow Cloud Agent network settings, and
          inference is outside. Traffic leaves from static ranges shared across Grok Bot customers unless routed
          through a member's desktop or your networking client.
        verified: "2026-09-25"
