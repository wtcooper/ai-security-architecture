# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
#
# Verified 2026-09-10 against learn.chatgpt.com/docs (developers.openai.com/codex/* now redirects
# there) and the GitHub advisory database. help.openai.com returns 403 to automated fetch, so
# the Help Center links kept in the migrated items: blocks are unverified today.
# Excluded: Agent Builder —
# scheduled shutdown 2026-11-30 (developers.openai.com/api/docs/guides/agent-builder); ChatGPT
# Workspace Agents — no official page resolved today (openai.com 403, learn.chatgpt.com 404), only
# a "Workspace Agents" access-token scope confirms it exists, so no control row could be verified.
# 2026-09-17: toolCodexCloud re-homed to archHostedAgentSessions (the hosted coding sessions drawing); the OpenAI Agents API (public beta 2026-09-10) is its own entity in agents-api.yaml.
# 2026-09-25: re-verified toolCodex, toolCodexCloud against the MITRE capability rules; developers.openai.com/codex/* still 200-redirects to learn.chatgpt.com/docs/*; learn.chatgpt.com/docs/enterprise/workload-identity 404 (workload identity now only on config-file/environment-variables); help.openai.com, chatgpt.com/public/admin/api-reference and openai.com/security-and-privacy 403; trust.openai.com 200 (SafeBase); Secure MCP Tunnel read at developers.openai.com/api/docs/guides/secure-mcp-tunnels.
# 2026-09-15: toolCodexCloud gained sandboxing, egress, runtime enforcement, credential isolation and MCP rows after the managed-runtime drawing pinned them; fetched cloud/internet-access, environments/cloud-environment, enterprise/chatgpt-work-cloud-security, enterprise/apps-and-connectors, enterprise/plugin-management, extend/mcp (all 200; learn.chatgpt.com/docs/mcp 404).
vendor: openai
family: Codex
tools:
  - id: toolCodex
    name: Codex
    surfaceClasses:
      - endpointCli
      - ideExtension
      - desktopApp
      - ciIntegration
    variants:
      - name: Codex CLI
        class: endpointCli
        url: https://learn.chatgpt.com/docs/cli
      - name: Codex IDE extension (openai.chatgpt)
        class: ideExtension
        url: https://learn.chatgpt.com/docs/ide
      - name: Codex app (ChatGPT desktop, macOS / Windows / Linux)
        class: desktopApp
        url: https://learn.chatgpt.com/docs/use-chatgpt
      - name: Codex Remote (phone controls the local app)
        class: desktopApp
        url: https://learn.chatgpt.com/docs/remote
      - name: Codex GitHub Action (openai/codex-action)
        class: ciIntegration
        url: https://learn.chatgpt.com/docs/github-action
      - name: Codex Security (AppSec plugin and CLI)
        class: endpointCli
        url: https://learn.chatgpt.com/docs/security
    architecture: archCodingAgentThirdParty
    status: ga
    asOf: "2026-09"
    summary:
      - "One agent across the CLI, the IDE extension and the ChatGPT desktop app, configured through TOML with
        a documented precedence chain and a genuine enterprise enforcement layer: an admin-authored
        requirements.toml that constrains approval policies, sandbox profiles, network, MCP servers and
        feature flags, and that users cannot override."
      - >-
        Inference runs at OpenAI; the local runtime executes commands inside an OS sandbox (Seatbelt on macOS,
        bubblewrap plus seccomp on Linux, a native Windows sandbox) and sends prompts, file excerpts, command
        output and — when browser or computer use is on — screenshots and page content to OpenAI services.
        Work Local is explicit that "local execution does not mean offline or device-only model inference".
        Structured OTel export is opt-in; a separate anonymous usage and health ping to OpenAI is on by
        default.
      - >-
        Policy arrives by four channels with a fixed precedence (macOS MDM com.openai.codex, the cloud-managed
        requirements bundle assigned at chatgpt.com, /etc/codex/requirements.toml or
        %ProgramData%\OpenAI\Codex\requirements.toml, then managed_config.toml defaults). A cloud bundle that
        cannot be fetched and has no cache stops the client rather than starting unmanaged. Codex Remote, the
        GitHub Action and Codex Security are shells of the same runtime; Codex cloud and the SDK are separate
        entities below.
    facts:
      - label: Plans
        value: >-
          Codex is in Free, Go, Plus, Pro, Business, Enterprise and Edu; API-key sign-in pays per token and
          loses cloud features (GitHub reviews, Slack). Business, Enterprise and Edu add admin controls,
          Compliance API audit and spend limits.
        url: https://learn.chatgpt.com/docs/pricing
      - label: Inference & routing
        value: >-
          Model calls go to OpenAI; chatgpt_base_url and model_providers.<id>.base_url can redirect to a
          proxy, and "Codex respects workspace residency settings when you sign in with ChatGPT".
        url: https://learn.chatgpt.com/docs/config-file/config-reference
      - label: Data leaving the device
        value: >-
          Prompts, relevant file excerpts, screenshots, browser content and tool results may be sent to OpenAI
          to complete a task; not every local file operation, screenshot or browser action appears in the
          Compliance API.
        url: https://learn.chatgpt.com/docs/enterprise/chatgpt-work-local-security
      - label: Docs index
        value: learn.chatgpt.com/docs (Codex, configuration, enterprise, security sections)
        url: https://learn.chatgpt.com/docs
      - label: Data retention / training
        value: >-
          Workspace audit records are retained up to 30 days for the Compliance API; the BAA does not cover
          Codex cloud. API-key usage falls under the API data policy (no training by default, 30-day
          abuse-monitoring logs, ZDR by approval).
        url: https://learn.chatgpt.com/docs/hipaa-configuration
    items:
      - title: Admin-enforced requirements.toml
        body:
          - Requirements arrive by system file (/etc/codex/requirements.toml on Unix,
            %ProgramData%\OpenAI\Codex\requirements.toml on Windows), as a cloud-managed policy bundle
            assigned from chatgpt.com and delivered at sign-in, or via macOS MDM under com.openai.codex
            (base64-encoded TOML; the highest-precedence channel). If the cloud policy fetch fails with no
            valid cache, the client refuses to start unmanaged rather than failing open.
          - 'Enforceable keys cover the surfaces that matter: allowed_approval_policies and
            allowed_permission_profiles with default_permissions (e.g. pin ":workspace" and allow only
            read-only and workspace profiles), filesystem deny_read patterns for secrets paths, prefix command
            rules, managed hooks with allow_managed_hooks_only, experimental network domain allow/deny lists,
            and feature pins that disable computer use and browser surfaces org-wide.'
        links:
          - title: Codex managed configuration
            url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
          - title: Codex admin setup and rollout
            url: https://learn.chatgpt.com/docs/enterprise/admin-setup
      - title: Sandbox, approvals and network posture
        body:
          - Sandboxing is OS-enforced (Seatbelt on macOS, bwrap plus seccomp on Linux, a native Windows
            sandbox) with permission profiles from read-only through workspace-write to an explicit
            danger-full-access escape hatch. The agent runs with network access off by default; enabling it
            can route through a domain-filtering proxy, and .git, .codex and .agents stay read-only inside
            writable roots. Codex cloud blocks internet access during the agent phase by default, with
            per-environment allowlists and method restrictions.
        links:
          - title: Codex approvals and security
            url: https://learn.chatgpt.com/docs/agent-approvals-security
          - title: Codex cloud internet access
            url: https://learn.chatgpt.com/docs/cloud/internet-access
      - title: Workspace gating and compliance export
        body:
          - Workspace admins gate Codex Local (desktop app, CLI and IDE extension together) and Codex cloud
            separately, assign access by role with SCIM-synced groups, and set starting model defaults —
            enforced requirements still win. Codex usage, including the local clients, exports through the
            Compliance API and the immutable Compliance Logs Platform alongside workspace audit and
            authentication logs.
        links:
          - title: Using Codex with your ChatGPT plan
            url: https://help.openai.com/en/articles/11369540-using-codex-with-your-chatgpt-plan
          - title: Compliance API
            url: https://learn.chatgpt.com/docs/enterprise/compliance-api
    riskNotes:
      - risk: riskPromptInjection
        note: >-
          The vendor's own guidance says prompt injection can make the agent fetch and follow untrusted
          instructions when network access or web search is on; the 2026 web.run research chained exactly that
          into out-of-sandbox execution on Windows.
      - risk: riskRogueActions
        note: >-
          --dangerously-bypass-approvals-and-sandbox (--yolo) removes both boundaries; the admin answer is
          allowed_approval_policies and allowed_sandbox_modes in requirements.toml, which users cannot loosen.
      - risk: riskToolSourceProvenance
        note: >-
          Plugins bundle MCP servers, skills and hooks from Git marketplaces; without
          marketplaces.restrict_to_allowed_sources and an [mcp_servers] identity allowlist any developer can
          add a tool source.
      - risk: riskInsecureIntegratedComponent
        note: >-
          Three 2026 sandbox findings (git show allowlist, Docker socket, ProgramData config trust) were
          escapes through components the sandbox trusted, not model failures.
      - risk: riskSensitiveDataDisclosure
        note: >-
          File excerpts, screenshots and browser content leave the device on every task; deny_read globs and
          shell_environment_policy are the only in-product data minimisation.
    controls:
      - mitigation: D3-MFA
        coverage: partial
        mechanism: >-
          allowed_login_methods = ["chatgpt"] and allowed_chatgpt_workspaces in the system requirements.toml or
          macOS MDM (cloud-managed values are ignored); MFA itself is enforced by the organisation's SSO IdP
        steps:
          - title: Pin every client to the org workspace
            body:
              - In /etc/codex/requirements.toml, %ProgramData%\OpenAI\Codex\requirements.toml or MDM
                com.openai.codex requirements_toml_base64, set allowed_login_methods = ["chatgpt"] and
                allowed_chatgpt_workspaces = ["<workspace-uuid>"]; Codex ignores both keys in cloud-managed
                requirements and refuses to start when no permitted login remains.
            url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
          - title: Enforce MFA in the identity provider
            body:
              - ChatGPT has no workspace-wide MFA enforcement, so require SSO with MFA at the IdP and manage SSO in
                the Global Admin Console.
            url: https://learn.chatgpt.com/docs/enterprise/work-admin-faq
          - title: Bound the token paths that skip the IdP
            body:
              - In Workspace settings > Permissions & roles grant "Allow users to create personal access tokens" only
                to named owners and set "Access token expiration limit"; revoke tokens at
                chatgpt.com/admin/access-tokens.
            url: https://learn.chatgpt.com/docs/enterprise/access-tokens
          - title: Leave device-code login off unless needed
            body:
              - codex login --device-auth works only after a workspace admin enables device code login in ChatGPT
                workspace permissions.
            url: https://learn.chatgpt.com/docs/auth
        note: >-
          Partial by the rule applied to every vendor: Codex pins the local client to the org's ChatGPT workspace, so
          the IdP's MFA policy governs each interactive browser sign-in, but MFA is configured in the IdP, not the
          product — the admin FAQ states ChatGPT doesn't provide workspace-wide MFA enforcement (Codex cloud requires
          MFA only for email-and-password accounts). Paths that skip the IdP prompt: Platform API keys (blocked by
          allowed_login_methods = ["chatgpt"]; "api" also admits Amazon Bedrock), Codex access tokens and
          service-account tokens (bounded by the expiration limit for new tokens only; the page warns an earlier
          dialog can offer No expiration), cached ChatGPT credentials that refresh automatically (lifetime not
          documented), device-code login (admin-enabled) and workload identity. Personal accounts are refused by
          allowed_chatgpt_workspaces, which also applies to access tokens. The pin holds only on machines that carry
          the system file or MDM payload; whether SSO-only sign-in can be enforced is on Help Center pages that
          returned 403.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityIga
          reviewRequired: false
          original:
            - capability: capabilityIga
              coverage: native
              mechanism: >-
                requirements.toml forced_login_method / forced_chatgpt_workspace_id (config) and
                allowed_login_methods / allowed_chatgpt_workspaces (managed), plus workspace roles and SCIM
                groups
              steps:
                - title: Pin the sign-in method and workspace
                  body:
                    - Set forced_login_method = "chatgpt" and forced_chatgpt_workspace_id = "<uuid>" so the
                      client cannot run on a personal account or an API key.
                  url: https://learn.chatgpt.com/docs/auth
                - title: Enforce it from the managed bundle
                  body:
                    - In requirements.toml use allowed_login_methods = ["chatgpt"] and
                      allowed_chatgpt_workspaces as the UUID allowlist; deliver by MDM, cloud policy or the
                      system path.
                  url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
                - title: Gate Codex Local by role
                  body:
                    - In Workspace settings > Permissions & roles, set the Codex Local / Work Local permission
                      per role; an explicit Off in any role denies even when another grants.
                  url: https://learn.chatgpt.com/docs/enterprise/roles-and-workspace-permissions
              verified: 2026-09-10
      - mitigation: cap-agent-action-policy-enforcement
        coverage: partial
        mechanism: >-
          requirements.toml [rules] prefix_rules (decision "prompt" or "forbidden") and a managed [hooks]
          PreToolUse hook with allow_managed_hooks_only = true and [features].hooks = true
        steps:
          - title: Enforce restrictive command rules
            body:
              - In requirements.toml add [rules] prefix_rules with decision "forbidden" or "prompt" (requirements rules
                can't allow); they merge with .rules files and the most restrictive decision wins.
            url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
          - title: Deploy a managed PreToolUse hook
            body:
              - Define [[hooks.PreToolUse]] in requirements.toml with hooks.managed_dir, set allow_managed_hooks_only =
                true and [features].hooks = true, and ship the script by MDM (Codex doesn't distribute it).
            url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
          - title: Deny from the hook
            body:
              - Return permissionDecision "deny" (or exit code 2); matchers cover Bash, apply_patch, MCP tool names and
                other local function tools, not hosted tools such as WebSearch.
            url: https://learn.chatgpt.com/docs/hooks
          - title: Test the rule set
            body:
              - Run codex execpolicy check --rules <file> -- <command> to see the strictest decision and the matching
                rules before deploying.
            url: https://learn.chatgpt.com/docs/agent-configuration/rules
        note: >-
          Partial: the declarative [rules] layer covers shell command prefixes only (the Rules page frames it as
          controlling commands run outside the sandbox), and the only per-call gate over files and MCP tools is the
          organisation's own hook script. The vendor says hosted tools skip the hook path, "some specialized tool
          paths can opt out" and hooks are "a useful guardrail, not a complete enforcement boundary"; a PreToolUse
          "ask" is not supported and fails open (the call continues), so escalate-to-human exists only through prompt
          rules for shell prefixes.
          Enforced on the device by the Codex runtime from requirements.toml, which users can't override; decisions
          reach the org's collector as codex.tool_decision only when OTel export is configured. The Guardian
          auto-review is a classifier, not a rule. What an allowed MCP server does downstream is outside.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAgentRuntimeEnforcement
          reviewRequired: false
          original:
            - capability: capabilityAgentRuntimeEnforcement
              coverage: native
              mechanism: >-
                requirements.toml [rules] (forbidden / prompt) and managed [hooks] with
                allow_managed_hooks_only
              steps:
                - title: Write managed command rules
                  body:
                    - Add [rules] entries in requirements.toml with decision "forbidden" or "prompt" for command prefixes; users
                      cannot weaken them.
                  url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
                - title: Add a PreToolUse or PermissionRequest hook
                  body:
                    - A managed hook returning permissionDecision "deny" (or exit code 2) blocks the call; set
                      allow_managed_hooks_only = true so user, project and plugin hooks are ignored.
                  url: https://learn.chatgpt.com/docs/hooks
              note: >-
                [rules] forbidden entries are deterministic; managed hooks are an integration point. The
                Guardian reviewer is a classifier, not a rule. MCP tool calls pass the rules; a server's own
                actions are outside them.
              verified: 2026-09-10
      - mitigation: cap-ai-vendor-assessment
        coverage: external
        mechanism: Vendor evidence from the OpenAI trust portal consumed by the organisation's TPRM platform
        evidence:
          - title: OpenAI Trust Portal (SafeBase) — SOC 2, ISO, pen-test and subprocessor artifacts (2026-09-25)
            url: https://trust.openai.com/
          - title: OpenAI Trust Portal — Security Whitepaper, linked from the Codex docs as the Codex security white paper
            url: https://trust.openai.com/?itemUid=382f924d-54f3-43a8-a9df-c39e6c959958&source=click
        note: >-
          External: the assessment runs in the organisation's TPRM platform. The trust portal lists a SOC 2 Type 2
          report (described as covering the ChatGPT and API products), ISO 27001, 27017, 27018 and 27701 and ISO/IEC
          42001:2023 certifications, a Pentest Report, CSA STAR Level 1, the subprocessor list and a Security
          Whitepaper; most reports require an access request. Codex is not named as its own SOC 2 scope, so the
          assessment inherits the ChatGPT scope. API-key sign-in moves Codex under the API organisation's data
          terms instead of the workspace's.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAiTprm
          reviewRequired: false
          original:
            - capability: capabilityAiTprm
              coverage: external
              mechanism: Vendor evidence from trust.openai.com consumed by the organisation's TPRM platform
              note: >-
                OpenAI publishes SOC 2 Type 2 (scope includes API Platform, ChatGPT Enterprise, Edu and Team),
                ISO 27001/27017/27018/27701/42001, pen-test reports and the subprocessor list on the trust
                portal; Codex is not named separately, so the assessment inherits the ChatGPT Enterprise
                scope.
              steps:
                - title: Pull vendor evidence
                  body:
                    - Request the SOC 2 report, pen-test summary and subprocessor list from the trust portal and load them into
                      the TPRM record.
                  url: https://trust.openai.com/
              verified: 2026-09-10
      - mitigation: cap-sensitive-data-redaction
        coverage: partial
        mechanism: >-
          Prisma AIRS under Codex Data controls > External guardrails (prompt scanning, Block mode) and managed
          UserPromptSubmit / PreToolUse hooks; deny_read and shell_environment_policy are minimisation only
        steps:
          - title: Connect Prisma AIRS as the prompt inspector
            body:
              - In Codex Data controls (chatgpt.com/codex/cloud/settings/data) > External guardrails > Prisma AIRS,
                save the key, security profile and endpoint, choose Enforcement mode Block and On AIRS failure Block
                prompts, then turn on Enable Prisma AIRS.
            url: https://learn.chatgpt.com/docs/enterprise/prisma-airs
          - title: Close the uncovered sign-in path
            body:
              - Set allowed_login_methods = ["chatgpt"] and allowed_chatgpt_workspaces in the system
                requirements.toml or MDM, because sessions signed in with a Platform API key are not scanned.
            url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
          - title: Inspect prompts and tool arguments in managed hooks
            body:
              - A managed UserPromptSubmit hook can block a prompt and a PreToolUse hook can deny a Bash, apply_patch
                or MCP call after the org's own detector reads it.
            url: https://learn.chatgpt.com/docs/hooks
        note: >-
          Partial by the rule applied to every vendor: Codex hands content to an inspector the organisation runs
          rather than detecting it itself. Prisma AIRS scans newly submitted prompt text across the desktop app,
          CLI, IDE extension and cloud when users sign in to the configured workspace; it does not scan assistant
          responses, tool calls, tool results, files or images, access must be enabled by the OpenAI account team,
          and the default On AIRS failure is Allow prompts. Hooks are an attach point that sees prompts and local
          tool arguments, not hosted tools. Codex itself only redacts secrets from generated memory fields.
          [permissions.filesystem] deny_read and shell_environment_policy keep named paths and variables away from
          the agent (data minimisation, credited here) but inspect nothing; endpoint DLP or an AI gateway covers the
          rest.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAiDlp
          reviewRequired: false
          original:
            - capability: capabilityAiDlp
              coverage: partial
              mechanism: permissions.filesystem.deny_read globs and shell_environment_policy in requirements.toml
              note: >-
                These stop the agent reading named paths and environment variables; nothing in the product
                inspects prompt or upload content. Endpoint DLP is external.
              steps:
                - title: Deny reads of secret paths
                  body:
                    - Set [permissions.filesystem] deny_read globs (SSH keys, cloud credentials, .env); full-access profiles are
                      rejected while deny-read rules exist.
                  url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
                - title: Strip secrets from the shell environment
                  body:
                    - Set shell_environment_policy.inherit = "core" and exclude patterns so tokens in the developer's
                      environment never reach subprocesses.
                  url: https://learn.chatgpt.com/docs/config-file/config-reference
              verified: 2026-09-10
      - mitigation: cap-input-guardrails
        coverage: partial
        mechanism: >-
          Managed PostToolUse hook (attach point), Prisma AIRS prompt scanning, and allowed_web_search_modes in
          requirements.toml
        steps:
          - title: Screen tool output in a managed PostToolUse hook
            body:
              - A PostToolUse hook returning decision "block" (or continue false) replaces the tool result with the
                hook's feedback before the model continues; it covers Bash, apply_patch, MCP and local function tools.
            url: https://learn.chatgpt.com/docs/hooks
          - title: Scan submitted prompts with Prisma AIRS
            body:
              - Under Codex Data controls > External guardrails, a Prisma AIRS security profile with prompt injection
                detection in Block mode stops flagged prompts before they reach the model.
            url: https://learn.chatgpt.com/docs/enterprise/prisma-airs
          - title: Keep web search on the cached index
            body:
              - Set allowed_web_search_modes = ["cached"] (or [] to allow only disabled) so live web search is
                unavailable even in full-access sessions.
            url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
        note: >-
          Partial by the rule applied to every vendor: the product-side path is a post-tool hook that can replace a
          tool result before the model reasons over it — an attach point whose classifier the organisation supplies
          — plus Prisma AIRS, which screens user prompts only, not tool results, files or fetched pages. Hosted web
          search skips the hook path. The Guardian auto-review judges proposed actions (credited under action
          policy) and GPT-6 safety monitoring pauses a task after the fact; neither screens input before it enters
          context. Cached web search reduces exposure to live content without classifying it. An AI or MCP gateway
          classifier on the brokered path covers the rest.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityPromptInjectionDefense
          reviewRequired: false
          original:
            - capability: capabilityPromptInjectionDefense
              coverage: partial
              mechanism: >-
                Guardian automatic review (allowed_approvals_reviewers, guardian_policy_config) and the
                browser sign-in review model
              note: >-
                The vendor ships a reviewing model for out-of-sandbox requests and for browser sign-in pages,
                and warns that refusal is probabilistic; no admin-tunable classifier on inputs.
              steps:
                - title: Decide whether automatic review may replace the human
                  body:
                    - allowed_approvals_reviewers controls whether ["auto_review"] is permitted; guardian_policy_config
                      overrides the review policy text.
                  url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
                - title: Keep web access off where it is not needed
                  body:
                    - Network access defaults off in workspace-write; the docs say prompt injection can make the agent fetch and
                      follow untrusted instructions once it is on.
                  url: https://learn.chatgpt.com/docs/agent-approvals-security
              verified: 2026-09-10
      - mitigation: AML.M0028
        coverage: native
        mechanism: >-
          requirements.toml [allowed_permission_profiles] with managed default_permissions and profile filesystem
          rules, [permissions.filesystem] deny_read, [rules] prefix_rules, [mcp_servers] identity allowlist,
          apps.<id> requirements and [features] / [browser_use] / [computer_use] pins
        steps:
          - title: Fix the permission profile set
            body:
              - Set default_permissions = ":workspace" (or a managed custom profile) and [allowed_permission_profiles]
                without ":danger-full-access"; omitted profiles are denied (Codex 0.138.0 or later).
            url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
          - title: Scope paths inside the managed profile
            body:
              - In [permissions.<name>.filesystem] mark globs such as "**/*.env" = "deny", and add
                [permissions.filesystem] deny_read for paths no profile may read.
            url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
          - title: Scope commands, MCP servers and app tools
            body:
              - Use [rules] prefix_rules (prompt or forbidden), the [mcp_servers.<id>] identity allowlist, and
                apps.<id>.enabled = false or apps.<id>.tools.<tool>.approval_mode in requirements.toml.
            url: https://learn.chatgpt.com/docs/config-file/config-reference
          - title: Pin high-agency surfaces off
            body:
              - Set [features] computer_use, browser_use, browser_use_external, browser_use_full_cdp_access and
                in_app_browser = false, or restrict sites with [browser_use.origins] policies.
            url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
        note: >-
          Native: shell commands (by prefix), filesystem paths, MCP servers, app tools and the browser and
          computer-use surfaces are all scoped in requirements.toml, which users can't loosen, and Full access is
          removable. Enforced by the Codex runtime on the device; principal scoping comes from assigning
          cloud-managed requirements to groups. Limits: per-tool deny within an allowlisted MCP server is not a
          requirements key (enabled_tools / disabled_tools live in user config.toml), so use a managed PreToolUse
          matcher such as mcp__server__tool; [rules] can only restrict; on native Windows managed deny_read covers
          direct file tools but not shell subprocess reads; [[remote_sandbox_config]] can widen sandbox modes by
          hostname, which is not authenticated device proof; clients older than 0.138.0 ignore profile allowlists.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityToolPermissionScoping
