# Controls guidance for the first-party coding & desktop agents archetype — harnesses the
# organisation assembles and runs itself rather than buying. Audience: admins,
# architects and security teams. Individuals install these harnesses themselves, so governing
# the archetype means a sanctioned posture, a governed supply chain, and finding the installs
# that never asked. The build's derivation check fails this document if its cited capabilities
# stop being pinned on the architecture.
archetype: archCodingAgentFirstParty
mode: hybrid
status: draft
attribution: >-
  Authored in this repository. Pattern-level by design; harness products are named only in
  cited sources, not in the items.

overview:
  - >-
    A first-party coding harness is the third-party product with the vendor column deleted: the
    same loop and tool surface, with pasted long-lived keys instead of session credentials,
    community registries instead of a signed channel, configuration files instead of a
    control plane, and — increasingly — serve modes, relay tunnels and chat bridges instead
    of an owner-bound remote relay. Nothing here can be governed from a vendor console,
    which puts every control on the organisation's side.
  - >-
    Two facts anchor the policy. The supply chain includes the agent itself: the category's
    landmark incident was a compromised harness release published through a community
    channel, whose payload installed further agents. And the remote surfaces ship weak: auth
    on the serve ports ranges from a mandatory shared secret down to none, and chat bridges
    put messaging-platform identity in front of a loop that runs with the developer's
    credentials.

  - >-
    The mode is hybrid because the organisation genuinely builds part of this: the AI gateway,
    the private mirror and the governance band are tiers we stand up and operate, while the
    harness itself is upstream software we configure and pin. The items below say which side
    of that line each control lives on.

items:
  - title: Sanction specific harnesses, and pin their supply chain
    capabilities: [capabilityMcpToolSecurity, capabilityShadowAiDiscovery, capabilityAiBom]
    body:
      - >-
        Take a position on which harnesses are acceptable, and mirror them: harness releases,
        extensions and skills reviewed, version-pinned and served from the organisation's
        registry, with public marketplaces blocked on managed machines. An update is a
        decision — the update channel is the category's proven attack path. Pair the
        position with discovery built from package-manager and process telemetry, because
        these harnesses arrive one developer at a time and appear in no procurement record.

  - title: Vault the keys and route the calls through your gateway
    capabilities: [capabilitySecretsManagement, capabilityEgressControl, capabilityRateLimiting]
    body:
      - >-
        The common state is a provider key in plaintext configuration, readable by the agent,
        its tools, and any repository script they run. The sanctioned state brokers
        credentials at the organisation's AI gateway — keychain-backed locally where the
        harness supports it, vaulted behind the gateway where it does not — with
        deny-by-default egress naming providers, registries and remote tool servers, and
        spend ceilings at the crossing, because the only native meter is the provider's
        invoice. Assessment probe: grep a sanctioned install's configuration for key
        material; anything found fails.

  - title: Lock the remote surfaces or turn them off
    capabilities: [capabilityAgentRuntimeEnforcement, capabilityHitlControls, capabilityIga, capabilityKillSwitch]
    body:
      - >-
        Serve modes, web UIs, relay tunnels and chat bridges are admission decisions, not
        conveniences: off by default on managed machines, and where a team has a stated
        need, admitted deliberately — mandatory shared secret, pinned transport, loopback or
        VPN binding, and a named allowlist for any chat bridge, because platform identity is
        the personal agent's admission model wearing a developer tool's clothes. Keep the
        local approval gate real at the same time: dangerous-command detection on and
        auto-approve flags banned on managed machines — it is the only gate there is.

  - title: The engine disciplines still apply — nobody else will apply them
    capabilities: [capabilityToolPermissionScoping, capabilityAgentSandboxing, capabilityCredentialIsolation, capabilityMemoryProtection, capabilityPromptInjectionDefense, capabilitySystemPromptManagement]
    body:
      - >-
        Everything the vendored guidance requires of the engine holds here with no managed
        tier to enforce it: per-tool permission scoping configured outside the repository the
        agent works on; sandboxed execution treated as a harness-selection criterion, because
        the category default is bare-host; SSH keys, cloud credentials and browser profiles
        kept outside the agent's reach; memory and rules files treated as untrusted input,
        with a repo-committed rules change reviewed like a code change; and repository
        content treated as instruction-bearing input, because it is.

  - title: Bind identity, and log at the only tier that can
    capabilities: [capabilityIga, capabilityAuditLogging]
    body:
      - >-
        Built controls, both: who may open a session, on what machine, is decided by our IdP
        and device posture — nothing in the harness asks — and the gateway tap is the only
        session record that exists, because there is no vendor console and no audit export.
        What does not cross the gateway was never logged; that sentence is the argument for
        routing everything through it.

  - title: Inventory the fleet and inspect what leaves
    capabilities: [capabilityAgentRegistry, capabilityAiDlp, capabilityEdr]
    body:
      - >-
        The approved-harness inventory is enforced from the gateway and the mirror — which
        builds run, which connectors and servers they may reach — not from the config files
        the agent can edit. Content inspection sits on the arbitrary-destination path, where
        fetches and pushes reach registries and the open web. And the device tooling closes
        the gap no crossing sees: which harnesses are installed, which ports they listen on,
        and the containment that isolates a steered machine.

sources:
