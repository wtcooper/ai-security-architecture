# The owner's answers to the site updates feed items propose (the "Proposed site updates" panel
# on /feed/ lists them, each with its line). One line per item, by its id:
#
#   - { id: xai-private-inference, decision: approve }
#   - { id: some-other-item, decision: decline, note: "Not a pattern of its own." }
#
# The daily run carries out at most one approved onboard or control change a run, then sets the
# item's update to applied (or declined) and removes its line here. `npm run data` checks that each
# id is an item that proposes an update, and that each is decided once.
