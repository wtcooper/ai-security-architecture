  - id: toolCodexCloud
    name: Codex cloud
    surfaceClasses:
      - cloudAgent
      - ciIntegration
      - chatIntegration
    variants:
      - name: Codex cloud (web, chatgpt.com/codex)
        class: cloudAgent
        url: https://learn.chatgpt.com/docs/cloud
      - name: Codex GitHub connector and code review (@codex review, security review preview)
        class: ciIntegration
        url: https://learn.chatgpt.com/docs/third-party/github
      - name: Codex GitLab connector (Beta)
        class: ciIntegration
        url: https://learn.chatgpt.com/docs/third-party/gitlab
      - name: Codex in Slack
        class: chatIntegration
        url: https://learn.chatgpt.com/docs/third-party/slack
      - name: Codex in Linear
        class: chatIntegration
        url: https://learn.chatgpt.com/docs/third-party/linear
      - name: Scheduled tasks (automations)
        class: cloudAgent
        url: https://learn.chatgpt.com/docs/automations
    architecture: archHostedAgentSessions
    status: ga
    asOf: "2026-09"
    summary:
      - >-
        Codex cloud runs coding tasks in OpenAI-hosted containers built from the universal image plus a
        per-environment setup script, checked out from a GitHub or GitLab repository and started from the web,
        the IDE extension, Slack, Linear, a pull request comment or a schedule. The same hosted harness is
        what ChatGPT Work calls Work Cloud, which the vendor describes as VM-backed sandboxes on OpenAI
        infrastructure.
      - >-
        Inference and execution are both at OpenAI: the repository, environment variables and the prompt leave
        the organisation, and the agent's output returns as a diff or pull request for a human to merge.
        Internet access during the agent phase is off by default and is set per environment (Off, or On
        restricted by a domain allowlist and GET/HEAD/OPTIONS-only methods); secrets are encrypted, exposed
        only to setup scripts and removed before the agent phase.
      - >-
        Admin gating is by workspace setting (Codex cloud chats, GitHub connector), by environment
        (internet, repositories, secrets) and by connector setting (the Slack posting toggle, Codex for
        Linear). Compliance API records are retained 30 days; the BAA does not cover Codex cloud.
    facts:
      - label: Plans
        value: >-
          Cloud features require Plus, Pro, Business, Enterprise or Edu; not available on Free, Go or API-key
          sign-in.
        url: https://learn.chatgpt.com/docs/pricing
      - label: Inference & routing
        value: >-
          Tasks run in OpenAI-hosted containers behind an HTTP/HTTPS proxy; caches are shared across users
          with access to the environment on Business and Enterprise.
        url: https://learn.chatgpt.com/docs/environments/cloud-environment
      - label: Data leaving the device
        value: >-
          The repository checkout, environment variables, uploaded context, Slack thread history or Linear
          issue content are sent to create the cloud chat.
        url: https://learn.chatgpt.com/docs/third-party/slack
      - label: Docs index
        value: learn.chatgpt.com/docs/cloud
        url: https://learn.chatgpt.com/docs/cloud
      - label: Data retention / training
        value: >-
          Conversations follow workspace retention with deletion scheduled within 30 days; execution snapshots
          and Library files follow separate lifecycles; Compliance Logs Platform keeps records 30 days.
        url: https://learn.chatgpt.com/docs/enterprise/chatgpt-work-cloud-security
    riskNotes:
      - risk: riskPromptInjection
        note: >-
          The internet-access page shows hidden instructions in fetched web content driving secret
          exfiltration; the default Off and GET-only controls are the mitigation.
      - risk: riskSensitiveDataDisclosure
        note: >-
          Cached containers are shared across every user with access to the environment for up to 12 hours, so
          anything a setup script writes is visible to the next user's task.
      - risk: riskRogueActions
        note: >-
          Output is a diff or PR, but automatic reviews and Slack posting act without a prompt; scope the
          GitHub app and the "post answers" toggle.
      - risk: riskToolSourceProvenance
        note: >-
          Environments and setup scripts are editable by anyone with access; they run with internet on.
    controls:
      - mitigation: D3-APA
        coverage: partial
        mechanism: >-
          Codex cloud chats workspace setting, Codex for Linear and the Slack posting toggle in admin
          settings, the "Allow event-triggered scheduled tasks" permission, and per-repository code review settings
        steps:
          - title: Turn on Codex cloud chats deliberately
            body:
              - In ChatGPT workspace settings (chatgpt.com/admin/settings) turn on Codex cloud chats only once hosted
                sessions are approved, and enable Codex for Linear in connector settings only where wanted.
            url: https://learn.chatgpt.com/docs/third-party/linear
          - title: Keep Slack answers inside the chat
            body:
              - Clear "Allow Codex Slack app to post answers on task completion" in ChatGPT workspace settings so Slack
                receives only a link to the chat.
            url: https://learn.chatgpt.com/docs/third-party/slack
          - title: Gate event triggers
            body:
              - Grant the "Allow event-triggered scheduled tasks" permission only to roles that should start runs from
                Gmail, Slack or GitHub events.
            url: https://learn.chatgpt.com/docs/automations
          - title: Decide which repositories review automatically
            body:
              - In Codex settings > Code review turn on Code review and Automatic reviews per repository; changing them
                needs GitHub push or admin permission on the repository.
            url: https://learn.chatgpt.com/docs/third-party/github
        note: >-
          Partial: hosted sessions are switched on in the vendor's admin settings and per integration (the rollout
          guide says to grant Codex cloud access to the intended audience through workspace controls; per-role
          granularity is on Help Center pages that returned 403), but who may start or steer a session is not
          documented as configurable — the docs do not restrict an @codex mention in a GitHub pull request or GitLab merge request, a Linear assignment or a Slack mention to
          people with write access, and no setting excludes Apps, bots or non-collaborators (GitLab's Review my, team
          or all MRs policy scopes automatic reviews, not invocation). Widening switches are partly admin-owned:
          personal access tokens are a workspace permission and device remote control is a local requirement
          (allow_remote_control); Codex cloud requires MFA only for email-and-password accounts.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityIga
          reviewRequired: false
          original:
            - capability: capabilityIga
              coverage: native
              mechanism: Workspace roles (Work Cloud / Codex cloud permission) and SCIM groups
              steps:
                - title: Gate cloud execution by role
                  body:
                    - Workspace settings > Permissions & roles carries Work Cloud and Work Local as distinct
                      toggles; enable Work Cloud selectively.
                  url: https://learn.chatgpt.com/docs/enterprise/chatgpt-work-cloud-security
                - title: Provision membership from the IdP
                  body:
                    - SCIM provisions membership and group assignment; groups need explicit role grants and an
                      Off in any role denies.
                  url: https://learn.chatgpt.com/docs/enterprise/groups-and-provisioning
              verified: 2026-09-10
      - mitigation: D3-AA
        coverage: partial
        mechanism: >-
          Sessions act as the requesting ChatGPT user through that user's GitHub or GitLab connection; self-managed
          and Dedicated GitLab can use an admin-managed "ChatGPT Codex Connector" service account
        steps:
          - title: Give self-managed GitLab its own connector identity
            body:
              - In Codex Cloud > Settings > Connectors choose Set up service account > Create a service account with
                Selected groups or Selected projects only; admins revoke the token and generate a new one there.
            url: https://learn.chatgpt.com/docs/third-party/gitlab
          - title: Limit what the GitHub connection reaches
            body:
              - When connecting GitHub, choose only the repositories Codex can access.
            url: https://learn.chatgpt.com/docs/cloud
        note: >-
          Partial: a cloud session runs on the requesting user's workspace identity and that user's source-system
          connection, so attribution is to the user rather than to an inventoried agent identity. Service accounts
          and access tokens are documented for local headless automation (CODEX_ACCESS_TOKEN), not for cloud
          sessions. The self-managed or Dedicated GitLab path adds a distinct connector service account that an admin
          can revoke and regenerate, but it is shared by every user of the connection and holds an api-scoped token
          with Developer access. The identity and credential GitHub sees for a cloud session is not documented on the
          pages fetched.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityNhiManagement
          reviewRequired: false
          original:
            - capability: capabilityNhiManagement
              coverage: partial
              mechanism: Service accounts (SCIM userType ServiceAccount) and the GitLab service-account token
              note: Runs attribute to a service account; the GitHub App identity itself is vendor-owned.
              steps:
                - title: Create a non-human workspace identity
                  body:
                    - Owners and admins create service accounts with their own plugins, role and tokens;
                      disabling the account revokes every token.
                  url: https://learn.chatgpt.com/docs/enterprise/service-accounts
                - title: Scope the GitLab connector
                  body:
                    - Use an existing service account with Developer access to selected groups or projects;
                      admins can revoke and regenerate its token in Codex Cloud settings.
                  url: https://learn.chatgpt.com/docs/third-party/gitlab
              verified: 2026-09-10
      - mitigation: cap-agent-tool-registry
        coverage: partial
        mechanism: >-
          Codex settings pages for environments, connectors and code review, and the Scheduled list; no org-wide
          admin inventory with owners
        steps:
