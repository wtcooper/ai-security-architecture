  - architecture: archCloudManagedAgent
    asOf: "2026-11"
    verified: "2026-11-18"
    reference:
      - title: "Baseline Microsoft Foundry chat reference architecture (Azure Architecture Center)"
        url: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/baseline-microsoft-foundry-chat
    summary:
      - "On Azure the pattern is Microsoft Foundry Agent Service in standard setup with private networking. Agents live in a Foundry project; conversations, files and vectors sit in your Azure Cosmos DB, Storage and Foundry IQ (Azure AI Search); the Foundry endpoint is closed to a private endpoint and agent traffic leaves through a subnet you delegate. Tool calls reach your MCP servers through Azure API Management. Microsoft Entra ID gives each agent its own identity; Key Vault, Azure Policy and Azure Monitor supply keys, guard rails and logs."
    bindings:
      - { block: entry, service: "Your web app on Azure App Service", build: true, note: "Signs users in with Microsoft Entra ID and calls the agent's Responses endpoint through the Foundry private endpoint as its managed identity. It must check who owns each conversation." }
      - { block: agentDef, service: "Foundry project: agent versions, deployed by pipeline", build: true, note: "Prompt agent definitions, or hosted agent code and azure.yaml, in source control. Bicep or Terraform sets network, keys and stores. The pipeline must run inside the virtual network." }
      - { block: memory, service: "Azure Cosmos DB, Blob Storage, Foundry IQ (Azure AI Search)", note: "Standard setup only: conversations in Cosmos DB, files in Blob Storage, vector stores in Foundry IQ (Azure AI Search). Basic setup keeps all three in Microsoft-managed storage." }
      - { block: aiGateway, service: "Azure API Management (MCP servers), internal", note: "Fronts your MCP servers on a private address and validates the agent's Entra token. Azure AI Gateway is a newer preview alternative, in two regions only." }
      - { block: internalTools, service: "Your MCP servers and APIs in the virtual network", build: true, note: "Workload-owned MCP servers, OpenAPI tools and A2A agents on a subnet of their own, accepting traffic from the gateway only. Container Apps is the tested private MCP host; Functions is not validated." }
      - { block: orgData, service: "Your Azure data services behind private endpoints", build: true, note: "Systems of record and knowledge indexes reached by your tool servers, or by Foundry IQ knowledge bases with the user's token so source permissions apply." }
      - { block: managedRuntime, service: "Microsoft Foundry Agent Service", note: "Prompt agents: Microsoft runs the loop. Hosted agents: your code in a VM sandbox per session. Models are deployments in the same Foundry resource. Tool calls leave by a data proxy per project." }
      - { block: nativeTools, service: "Foundry built-in tools (file search, code interpreter)", note: "File search reaches your stores by private endpoint. Code interpreter runs in a Microsoft sandbox on the backbone network. Computer use and image generation are not supported when network isolated." }
      - { block: vendorTools, service: "Foundry tool catalogue and remote MCP servers", note: "Catalogue MCP servers, SharePoint grounding and public MCP servers the definition names, with credentials in project connections. Work IQ is not supported in a network-isolated project." }
      - { block: openWeb, service: "Web search (Web IQ) and Grounding with Bing", note: "Runs from Microsoft's side over public endpoints, outside the agent subnet. Data sent to Bing leaves the Azure compliance and geographic boundary and the Data Protection Addendum does not apply." }
    sources:
      entry: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/baseline-microsoft-foundry-chat
      agentDef: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/virtual-networks
      memory: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/standard-agent-setup
      aiGateway: https://learn.microsoft.com/en-us/azure/api-management/mcp-server-overview
      internalTools: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/baseline-microsoft-foundry-chat
      orgData: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/foundry-iq-connect
      managedRuntime: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/agents-networking-deep-dive
      nativeTools: https://learn.microsoft.com/en-us/azure/foundry/how-to/configure-private-link
      vendorTools: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/toolbox-overview
      openWeb: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/web-search
    differences:
      - at: managedRuntime->aiGateway
        text: "Nothing forces tool calls through your gateway. Foundry does not register or rewrite an MCP endpoint: each tool or connection must be given the gateway-routed address by hand, and a direct address keeps working. Hold it with the approved-tools policy (preview) listing only gateway endpoints, and with network rules on the agent subnet."
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/governance
      - at: nativeTools->memory
        text: "State is in your account only with standard setup, chosen when the project is created and not changeable afterwards. Agent Service reaches Cosmos DB, Storage and Foundry IQ as the project's managed identity, shared by every agent in the project, not as each agent's own identity. Memory stores (preview) stay in managed storage with no virtual network support."
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/standard-agent-setup
      - at: memory
        text: "A customer-managed key on the Foundry resource does not cover prompt agent state in Microsoft-managed storage. You bring the three stores and set your key on each one separately. A hosted agent's per-session $HOME volume sits on platform storage, is not encrypted with your key, is kept for 30 days and cannot be switched off."
        url: https://learn.microsoft.com/en-us/azure/foundry/concepts/customer-managed-keys
      - at: entry->managedRuntime
        text: "A new Foundry resource is fully public: any caller with a valid credential can reach the endpoint. Private endpoints and the public access flag apply to the whole resource, not to one project. Network injection for outbound traffic must be chosen when the resource is created and cannot be added or changed later."
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/networking-options
      - at: nativeTools->openWeb
        text: "Web search, Bing grounding and SharePoint grounding use public endpoints even in a network-isolated project, and web search bypasses the agent subnet, so Azure Firewall never sees it. Bing data leaves the Azure compliance and geographic boundary. The limits are the definition, the tool policies, or a subscription-wide block on web search."
        url: https://learn.microsoft.com/en-us/azure/foundry/how-to/configure-private-link
      - at: managedRuntime
        text: "Two runtimes sit behind one endpoint. For a prompt agent Microsoft runs the loop. For a hosted agent you supply the loop as a container or source code; it runs in a VM-isolated sandbox per session attached to your delegated subnet, and its own outbound traffic leaves directly through that subnet while its tool calls still use the data proxy."
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/agents-networking-deep-dive
      - at: aiGateway
        text: "API Management policies apply to a whole MCP server, not to one tool, and the documented policies are token validation, rate limits, IP filtering and caching: approval checks and screening of tool results must be built or left to Foundry guardrails. Foundry no longer links API Management; a gateway it created earlier is public. Azure AI Gateway is preview, in two regions."
        url: https://learn.microsoft.com/en-us/azure/api-management/mcp-server-overview
      - at: agentDef->managedRuntime
        text: "Built-in Azure Policy can deny public network access, key access, missing customer-managed keys and unapproved models. The agent and tool definitions are preview, and the agent content-filter ones only audit. No built-in definition was found that requires standard setup or network injection; that needs a custom definition."
        url: https://learn.microsoft.com/en-us/azure/governance/policy/samples/built-in-policies
    alsoNeeded:
      - service: "Microsoft Entra ID with Microsoft Entra Agent ID"
        role: identity
        why: "Signs in users, the front end's managed identity and each agent's own identity. Conditional Access and risk features for agents need Microsoft Agent 365 licences."
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/agent-identity
      - service: "Azure Virtual Network with private DNS zones"
        role: network
        why: "A subnet delegated to Microsoft.App/environments (at least /27, one per Foundry resource) for agent traffic, a private endpoint subnet, and the privatelink zones for Foundry and each store."
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/virtual-networks
      - service: "Azure Firewall"
        role: network
        why: "Filters traffic leaving the delegated agent subnet by name. Must allow the Microsoft Entra sign-in endpoints the agent runtime needs, without TLS inspection."
        url: https://learn.microsoft.com/en-us/azure/foundry/how-to/configure-private-link
      - service: "Azure Application Gateway with Web Application Firewall"
        role: ingress
        why: "why: The single public entry to your front end; the agent endpoint itself refuses traffic from public networks."
        url: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/baseline-microsoft-foundry-chat
      - service: "Azure Key Vault or Managed HSM"
        role: keys
        why: "Holds the customer-managed keys for the Foundry resource and the three stores. Soft delete and purge protection are required, in the same region as the Foundry resource."
        url: https://learn.microsoft.com/en-us/azure/foundry/concepts/encryption-keys-portal
      - service: "Azure Key Vault (connection secrets)"
        role: secrets
        why: "Standard setup uses a Key Vault for the secrets and connection strings of the agent infrastructure; a Microsoft-managed vault is used unless you connect your own."
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/standard-agent-setup
      - service: "Azure Container Registry"
        role: registry
        why: "Holds hosted agent images. A registry with public access disabled works only for projects created after 25 June 2026."
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/virtual-networks
      - service: "Application Insights and a Log Analytics workspace"
        role: logging
        why: "Tracing is off until an Application Insights resource is connected to the project. Diagnostic settings, the activity log and the gateway log go to the same workspace."
        url: https://learn.microsoft.com/en-us/azure/foundry/observability/concepts/trace-data
      - service: "Azure Policy"
        role: other
        why: "Assigns the built-in definitions that refuse public network access, key access, unapproved models and unapproved tools before a resource exists."
        url: https://learn.microsoft.com/en-us/azure/governance/policy/samples/built-in-policies
      - service: "Build agents or a jump box inside the virtual network"
        role: other
        why: "With public access disabled, deployments and the Foundry portal's project pages work only from a machine that can reach the private endpoint."
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/virtual-networks
    quickstart:
      - title: "Set up your environment for Foundry Agent Service"
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/environment-setup
      - title: "Set up private networking for Foundry Agent Service"
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/virtual-networks
      - title: "Networking options for Foundry Agent Service"
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/networking-options
