# EXAMPLE enterprise layer. Per capability (data/overlay/capabilities.yaml ids), per surface, the
# technology the organisation deploys around its AI tools and whether it is in place. This is
# the text-file home for what the Capabilities tab's "Assess your posture" drawer collects; the
# drawer's browser edits still win over it. Statuses: inPlace | partial | gap | needsAssessment.
# (This file is the shipped example; replace it in data/org/local/.)
capabilities:
  capabilityAiDlp:
    surfaceEndpoint: { status: inPlace, technology: Example endpoint DLP agent, note: Inspects prompts and uploads in the browser and the desktop apps. }
    surfaceSaas: { status: partial, technology: Example CASB, note: Inline for sanctioned vendors; shadow AI only discovered, not blocked. }
  capabilityEgressControl:
    surfaceEndpoint: { status: inPlace, technology: Example SSE / secure web gateway, note: Deny-by-default egress with named AI providers allowed. }
    surfaceCloud: { status: inPlace, technology: Cloud network policy }
  capabilityAgentSandboxing:
    surfaceEndpoint: { status: gap, note: No fleet-wide sandbox packaging yet; relies on each product's own sandbox. }
  capabilityIga:
    surfaceEndpoint: { status: inPlace, technology: Example IdP with SSO and MFA }
    surfaceSaas: { status: inPlace, technology: Example IdP with SCIM }
  capabilityAuditLogging:
    surfaceEndpoint: { status: partial, technology: Example SIEM, note: OTel export from a pilot group only. }
  capabilityMcpToolSecurity:
    surfaceEndpoint: { status: partial, technology: MDM-pushed allowlists, note: Allowlists per product; no central MCP registry yet. }
  capabilityPromptInjectionDefense:
    surfaceEndpoint: { status: gap, note: No runtime guardrail in front of the endpoint agents. }
    surfaceCloud: { status: partial, technology: Example AI gateway guardrails }
