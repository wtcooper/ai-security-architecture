      - mitigation: AML.M0029
        coverage: partial
        mechanism: >-
          Channel sessions run in auto mode: Claude's permission checker (a model) reviews each action and Owners
          pre-approve actions per scope with Auto mode allow rules; no per-action human prompt. Personal-connector
          tasks ask the requester before starting and, under Allow with review or an Owner's Require review,
          hold each result for approval before it posts; Claude's pull requests wait for a human merge
        steps:
          - title: Keep allow rules narrow
            body:
              - >-
                Add Auto mode allow rules only on the narrowest scope (scope > Advanced > Auto mode allow rules)
                and name the tool, action and environment; rules on a workspace or Default Slack reach every
                channel beneath.
            url: https://claude.com/docs/claude-tag/admins/customize
          - title: Require review of delegated results (Enterprise)
            body:
              - >-
                Set the scope's Advanced > Delegated task results to Require review so the requester approves
                every result of a personal-connector task before it posts.
            url: https://claude.com/docs/claude-tag/concepts/personal-connectors
          - title: Require a second approval on Claude's pull requests
            body:
              - >-
                Require two approving reviews, or a status check only claude[bot] pull requests must pass, with
                stale approvals dismissed on new commits.
            url: https://claude.com/docs/claude-tag/admins/configure-github
          - title: Stop proactive work where it is not wanted
            body:
              - >-
                Turn off a channel's Respond automatically setting so Claude only starts work when tagged.
            url: https://claude.com/docs/claude-tag/admins/set-spend-limit
        note: >-
          Partial by the rule: no person approves an individual channel action; the permission checker is a model
          and never counts as human approval, and allow rules pre-approve actions with nobody present. Result
          review approves what posts to the channel, and a pull-request merge approves the output, not the
          actions taken to produce them. Guests can never approve. Routines and channel watches run unattended.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityHitlControls
          reviewRequired: false
          original:
            - capability: capabilityHitlControls
              coverage: partial
              mechanism: >-
                Sessions run in auto mode (classifier); Owners add narrow auto-mode allow rules per scope;
                pull requests are drafts for humans to merge; "Respond automatically" per channel
              steps:
                - title: Keep allow rules narrow
                  body:
                    - Add auto-mode allow rules only on the narrowest scope (up to 50 per scope, 1,024
                      characters each) and name the tool, action and environment; everything else stays under
                      the classifier.
                  url: https://claude.com/docs/claude-tag/admins/customize
                - title: Stop proactive work where it is not wanted
                  body:
                    - Turn off a channel's Respond automatically setting so Claude only works when tagged;
                      proactive sessions bill under Proactive.
                  url: https://claude.com/docs/claude-tag/admins/set-spend-limit
              note: >-
                There is no per-action approval prompt in a channel; the classifier and deny-by-egress are the
                gates.
              verified: 2026-09-10
      - mitigation: D3-AA
        coverage: native
        mechanism: >-
          Channel sessions act as an Owner-provisioned agent identity: the Claude app in Slack, the Claude
          GitHub App, a dedicated service account per connected tool, or a federated identity whose
          Anthropic-signed 10-minute token names the organisation and agent; the Access bundles page lists every
          connection with its status and last use, with Rotate secret and Delete; the Activity Feed records
          ccr_agent_* and Agent Proxy credential events
        steps:
          - title: Provision a dedicated identity per tool
            body:
              - >-
                Create a service account or a claude@ mailbox in each tool with the narrowest role, add its
                credential to an Access bundle, and never connect a person's login.
            url: https://claude.com/docs/claude-tag/admins/add-connections
          - title: Prefer federated identity tokens
            body:
              - >-
                Under Federated cloud access connect a gateway, AWS role, Google Cloud identity or authorisation
                server that checks the token's subject against your organisation's Subject prefix.
            url: https://claude.com/docs/claude-tag/admins/federated-access/overview
          - title: Review and prune the inventory
            body:
              - >-
                Expand each bundle on the Access bundles page, check Active, Not active, Approval needed and
                Used or Never used, and delete connections nobody uses.
            url: https://claude.com/docs/claude-tag/admins/add-connections
        note: >-
          Native by the rule: each connector grant is a non-human identity with its own lifecycle, provisioned by
          an Owner in the organisation's own tools, inventoried with last use in the tenant's console and revoked
          there; federated connections expire by design (tokens last 10 minutes, a removed gateway stops at once
          and a removed cloud role or authorisation server within about a minute; exchanged AWS credentials live
          up to an hour). Compare a vendor-owned agent identity, rated partial. Static credentials such as API
          keys have no expiry in the product, so their lifetime is the issuing tool's; channel managers can add,
          rotate and delete credentials in their channel's bundle. DMs and personal connectors act as the member
          and end when the member leaves the organisation or selects Disconnect in the app's Home tab.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityNhiManagement
          reviewRequired: false
          original:
            - capability: capabilityNhiManagement
              coverage: native
              mechanism: >-
                Claude acts under provisioned service accounts (Slack app, Claude GitHub App, one dedicated
                account per connected tool) so actions are attributable in each tool's audit log; DMs use the
                member's identity
              steps:
                - title: Provision a dedicated identity per tool
                  body:
                    - Create a mailbox such as claude@yourcompany, add it to each tool with the narrowest
                      role, and paste that account's API key on the setup page; rotate or delete from the
                      bundle's Credentials tab.
                  url: https://claude.com/docs/claude-tag/admins/setup-overview
              note: >-
                Compared with Copilot cloud: the service accounts are provisioned in the organisation's own
                tools, so the organisation owns their scopes and can revoke them there — which is why this is
                native while a vendor-owned app identity is partial. Actions in connected tools carry the
                service account's authority; DMs carry the member's.
              verified: 2026-09-10
      - mitigation: D3-DI
        coverage: partial
        mechanism: >-
          Each scope's panel on the Slack tab lists the Connectors, Repositories and Plugins a channel gets, with
          origin lines; View memory files and the Audit page Memory tab show what Claude saved per scope; no
          classification of what the service accounts can reach
        steps:
          - title: List what each channel can reach
            body:
              - >-
                At claude.ai/admin-settings/claude-tag select each scope on the Slack tab and read its Connectors,
                Repositories and Plugins sections, including rows inherited from the workspace or Default Slack.
            url: https://claude.com/docs/claude-tag/admins/attach-to-scope
          - title: Review and prune memory
            body:
              - >-
                Open the Audit page Memory tab (or a scope's View memory files) to read, edit or delete what
                Claude saved; workspace memory from public channels is shared workspace-wide.
            url: https://claude.com/docs/claude-tag/admins/audit
        note: >-
          Partial by the rule: the console lists the sources each channel reaches and the memory Claude kept,
          without classification or an oversharing view of what sits behind each service account. Transcripts are
          kept with no automatic retention period during the beta and cannot be exported; deletion (scope
          removal, workspace disconnect) is lifecycle, not inventory. Classifying the data behind the connections
          is the organisation's DSPM.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityDspm
          reviewRequired: false
          original:
            - capability: capabilityDspm
              coverage: partial
              mechanism: >-
                Memory files viewable, editable and deletable per scope by Owners; data lifecycle table for
                every deletion action; no retention window during beta
              steps:
                - title: Review and prune memory
                  body:
                    - Open a scope's View memory files (or the Audit page Memory tab) to read, edit or delete
                      what Claude saved; workspace memory from public channels is shared workspace-wide.
                  url: https://claude.com/docs/claude-tag/users/memory
                - title: Delete data deliberately
                  body:
                    - Removing a channel scope deletes its sessions, memory, routines and artifacts;
                      disconnecting the workspace deletes everything for that workspace; version Off deletes
                      nothing.
                  url: https://claude.com/docs/claude-tag/concepts/data-lifecycle
              note: >-
                Memory review and deletion are lifecycle controls; nothing classifies what was saved or
                assesses who can read it beyond the scope model, so discovery and posture assessment remain
                the customer's DSPM.
              verified: 2026-09-10
      - mitigation: D3-CH
        coverage: native
        mechanism: >-
          Access bundle credentials sit in a write-only store and Agent Proxy injects them at the network
          boundary, only to the connection's allowed hosts (narrowable by path and HTTP method), so neither the
          sandbox nor the model holds them; Rotate secret and Delete per connection; "Copy link for another
          admin" with Owner approval; federated cloud access replaces stored secrets with 10-minute
          Anthropic-signed tokens; no tunnel
        steps:
          - title: Store credentials only as connections
            body:
              - >-
                On a bundle's Credentials tab connect each service with its allowed hosts, then Edit the
                connection to restrict it to a path prefix and read-only methods; never put a credential in an
                environment variable.
            url: https://claude.com/docs/claude-tag/admins/add-connections
          - title: Rotate or remove a credential
            body:
              - >-
                Use Rotate secret or Delete from the connection's menu on the Credentials tab; have the secret's
                owner submit it through Copy link for another admin and approve it under Review.
            url: https://claude.com/docs/claude-tag/admins/add-connections
          - title: Replace stored keys with federated tokens
            body:
              - >-
                Connect your gateway, AWS role, Google Cloud identity or authorisation server under Federated
                cloud access so Claude presents a short-lived signed token and Anthropic stores no key.
            url: https://claude.com/docs/claude-tag/admins/federated-access/overview
        note: >-
          Native by the rule: custody is outside the sandbox and model, each credential is scoped to named hosts
          and methods, the administrator rotates or revokes it in the console, and lifetime is bounded where the
          target accepts federated tokens. Boundaries: static SaaS keys are long-lived until rotated (no expiry or
          rotation schedule in the product); environment variables on a scope's pinned cloud environment are
          readable by every session and by Claude, which is why the docs say credentials never go there; running
          sessions may keep a revoked credential for a short, unbounded window. Tunnel: none; a connected service
          must accept internet traffic from Anthropic's egress range 160.79.104.0/21 (PrivateLink and VPC
          peering unsupported), and self-hosted environments cannot use Access bundles yet.
        verified: "2026-09-25"
        migration:
          from:
            - capabilitySecretsManagement
          reviewRequired: false
          original:
            - capability: capabilitySecretsManagement
              coverage: native
              mechanism: >-
                Access bundle credentials (Bearer, Basic, AWS SigV4, GCP service account, OAuth client
                credentials, MCP Connector sign-in) injected by Agent Proxy; rotate secret and setup links for
                another admin to submit a secret
              steps:
                - title: Add and rotate credentials in bundles
                  body:
                    - On the bundle's Credentials tab connect each service, set Allowed hosts, restrict by
                      HTTP method or path, and use Rotate secret; use "Copy link for another admin" so the
                      secret owner submits it directly.
                  url: https://claude.com/docs/claude-tag/admins/add-connections
              note: >-
                Bundle credentials are injected at the proxy and never reach the sandbox or the model. They
                are the bundle's shared credentials, presented for every session in the scope, not
                per-requester; rotation is manual through the rotate flow.
              verified: 2026-09-10
      - mitigation: AML.M0028
        coverage: native
        mechanism: >-
          Per-scope Access bundles (Default Slack, workspace, channel) that only Owners, or a channel's managers
          for its own bundle, fill with connections, repositories and plugins; each connection limited to allowed
          hosts, a path prefix and HTTP methods; Agent Proxy blocks every other host; Channel only strips
          inherited access while a guest is present
        steps:
          - title: Attach access per channel
            body:
              - >-
                Create bundles such as data-readonly or github-write and attach each to the narrowest scope that
                needs it, keeping sensitive bundles on private channels only.
            url: https://claude.com/docs/claude-tag/admins/attach-to-scope
          - title: Narrow each connection to read where reading is enough
            body:
              - >-
                On the bundle's Credentials tab choose Edit on a connection and restrict it to specific hosts,
                a path prefix and GET-only methods.
            url: https://claude.com/docs/claude-tag/admins/add-connections
          - title: Confirm what a channel ends up with
            body:
              - >-
                Check the channel's Connectors, Repositories and Plugins sections on the Slack tab, whose origin
                lines show what it inherits.
            url: https://claude.com/docs/claude-tag/concepts/security-and-data
        note: >-
          Native by the rule: an administrator allowlist of connections with read/write (method) scoping per
          channel scope, locked against channel members and enforced by Agent Proxy outside the model. Boundaries:
          scoping is per channel or workspace, not per requesting person, so everyone in a scope gets the same
          reach; an MCP Connector connection is one endpoint, so path and method rules cannot pick its individual
          tools; a bundle on Default Slack reaches every channel; auto-mode allow rules pre-approve actions; DMs
          and personal-connector tasks use the member's claude.ai connectors, outside the bundles.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityToolPermissionScoping
          reviewRequired: false
          original:
            - capability: capabilityToolPermissionScoping
              coverage: native
              mechanism: >-
                Per-scope Access bundles (credentials, repositories, plugins, instructions) with inheritance
                from Default Slack to workspace to channel; connection host/path/method restrictions; plugin
                enable toggles per bundle
              steps:
                - title: Compose access by capability and channel
                  body:
                    - Create bundles such as data-readonly, github-write and monitoring, attach only what a
                      channel needs, and keep sensitive bundles on private channels.
                  url: https://claude.com/docs/claude-tag/admins/add-connections
                - title: Narrow each connection
                  body:
                    - Edit a connection to restrict it to specific hosts, a path prefix and read-only methods,
                      and scope the underlying service account to the projects it needs.
                  url: https://claude.com/docs/claude-tag/admins/add-connections
              note: >-
                Bundles decide which credentials, repositories and plugins a scope has (hiding); host, path
                and method restrictions on connections limit arguments; auto-mode allow rules pre-approve.
                Inheritance means a broad Default Slack bundle reaches every channel unless overridden.
              verified: 2026-09-10
      - mitigation: cap-data-access-governance
        coverage: partial
        mechanism: >-
          In channels, retrieval uses the service account's access, scoped by what the organisation shares with
          that account and by the connection's hosts and paths; "Channels Claude can search" narrows Slack search
          to channels Claude is in; guest channels lose workspace search; DMs and personal-connector tasks run
          with the member's own permissions
        steps:
          - title: Scope the service account, not just the connection
            body:
              - >-
                Share only the folders, spaces or projects Claude should see with its dedicated account; host and
                path rules limit endpoints, not records.
            url: https://claude.com/docs/claude-tag/admins/add-connections
          - title: Limit Slack search to channels Claude is in
            body:
              - >-
                At claude.ai/admin-settings/claude-tag > Claude Tag's access > Slack > the scope > Advanced set
                Channels Claude can search to Only channels Claude is in.
            url: https://claude.com/docs/claude-tag/admins/restrict-access
        note: >-
          Partial by the rule: the administrator scopes the corpus (what the service account can open, which
          Slack channels search covers), but channel retrieval does not carry the requester's entitlements —
          every member of a scope reaches what the account can, and by default Claude searches every public
          channel, including ones it has not been added to. Requester entitlements apply only in DMs and in
          personal-connector tasks, which are available to a limited number of organisations.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityDataAccessGovernance
          reviewRequired: false
          original:
            - capability: capabilityDataAccessGovernance
              coverage: partial
              mechanism: >-
                Reach inside a tool equals what the service account can access; account-level scoping is the
                control; DMs run as the user
              steps:
                - title: Scope the service account, not just the connection
                  body:
                    - Share only the folders, spaces or projects Claude should see with its dedicated account; host and path
                      rules limit endpoints, not records.
                  url: https://claude.com/docs/claude-tag/admins/add-connections
              note: >-
                Service-owned in channels: retrieval carries the service account's access, so every member of
                a scope reaches what that account can, regardless of their own entitlements. Delegated in DMs,
                which run as the member.
              verified: 2026-09-10
      - mitigation: cap-agent-tool-registry
        coverage: partial
        mechanism: >-
          The Access bundles page lists every connection with status (including Approval needed for credentials
          submitted by link) and last use; each scope's panel lists what a channel gets; the Audit page Scheduled
          work tab lists every routine with Created by, Pause/Resume and Delete; a session can use only the
          bundles attached to its scope
        steps:
          - title: Use the bundles page as the register
            body:
              - >-
                Review the Access bundles page and approve or reject credentials another admin submitted through
                a setup link before they become active.
            url: https://claude.com/docs/claude-tag/admins/add-connections
          - title: Review unattended work
            body:
              - >-
                On the Scheduled work tab at claude.ai/admin-settings/claude-tag/audit filter by scope and pause
                or delete routines nobody owns.
            url: https://claude.com/docs/claude-tag/admins/audit
        note: >-
          Partial by the rule: connections are an enforced register with an approval state for link-submitted
          credentials, but they carry no owner field, and routines, which run unattended with the channel's
          credentials, are created by any channel member without approval and appear only after creation.
          Personal connectors used in DMs and channel tasks are the member's and are not listed; a Claude app
          installed in another Slack workspace is found in Slack's app management.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAgentRegistry
          reviewRequired: false
          original:
            - capability: capabilityAgentRegistry
              coverage: partial
              mechanism: >-
                Scopes and bundles are the registry of where Claude runs and with what; Scheduled work tab
                lists every routine with Created by
              steps:
                - title: List where Claude operates and what is scheduled
                  body:
                    - The Slack tab under Claude Tag's access lists workspaces and channels with their bundles; the Audit page
                      Scheduled work tab lists routines with pause and delete.
                  url: https://claude.com/docs/claude-tag/admins/audit
              note: >-
                Scopes, bundles and the routine list are approved configuration and use within Slack; there is
                no owner or approval record per routine beyond Created by.
              verified: 2026-09-10
      - mitigation: cap-shadow-ai-discovery
        coverage: external
        mechanism: >-
          Claude Tag lists no personal accounts or unsanctioned installs; Slack's app management (Manage apps,
          App requests), the claude.ai organisation's domain claiming and SSE/CASB find them; "Restrict to your
          verified domains" and blocked channel patterns prevent rather than discover
        evidence:
          - title: What the Claude Slack app can access (Slack administrator's view)
            url: https://claude.com/docs/claude-tag/admins/for-slack-admins
          - title: Restrict where Claude Tag operates
            url: https://claude.com/docs/claude-tag/admins/restrict-access
        note: >-
          External by the rule: the product has no view of Claude used outside the organisation's pairing — a
          workspace paired to another Claude organisation, personal claude.ai accounts, or members' own
          connectors. Slack administration (app installs and approval requests), the claude.ai organisation's
          Enterprise domain claiming (recorded on toolClaudeDesktop) and SSE/CASB find those. Inside the
          sanctioned deployment the Scheduled work tab inventories member-created routines, and Restrict to your
          verified domains stops verified-domain Slack users linking to outside organisations — prevention,
          credited here only.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityShadowAiDiscovery
          reviewRequired: false
          original:
            - capability: capabilityShadowAiDiscovery
              coverage: external
              mechanism: >-
                Blocked and auto-join channel name patterns; Claude responds only where added; per-scope
                version Off; Slack app inventory
              steps:
                - title: Fence channels by name
                  body:
                    - Add Blocked channel patterns (for example *-confidential-*) under Default Slack access > Advanced so
                      Claude stays silent even if invited.
                  url: https://claude.com/docs/claude-tag/admins/restrict-access
              note: >-
                Channel patterns and version Off are prevention; the Slack app inventory that would reveal an
                unsanctioned Claude install belongs to Slack administration, not this product.
              verified: 2026-09-10
      - mitigation: AML.M0024
        coverage: partial
        mechanism: >-
          The Compliance API Activity Feed records control-plane events (ccr_agent_* bindings and Slack access
          scopes, Agent Proxy credential creation, rotation and deletion, proxy rules, channel managers, workspace
          pairings); the Audit page Network events tab exports hourly JSON of Agent Proxy calls (no git or MCP
          traffic); Inference hooks (Enterprise, beta) can push each governed transcript to an organisation
          endpoint; session transcripts are not in the Compliance API or data exports during the beta
        steps:
          - title: Stream control-plane events (Enterprise)
            body:
              - >-
                Poll /v1/compliance/activities with a read:compliance_activities key and keep the ccr_agent_*,
                slack_workspace_* and inference_hooks_* events in the SIEM.
            url: https://platform.claude.com/docs/en/api/compliance/activities/list
          - title: Download network events
            body:
              - >-
                Export each hour's Network events JSON from claude.ai/admin-settings/claude-tag/audit and
                correlate with the service accounts' entries in each tool's audit log.
            url: https://claude.com/docs/claude-tag/admins/audit
          - title: Archive transcripts through a hook (Enterprise, beta)
            body:
              - >-
                Point Inference hooks at an endpoint that stores each transcript and always returns allow.
            url: https://platform.claude.com/docs/en/manage-claude/inference-hooks
        note: >-
          Partial by the rule: the vendor's exports are control-plane events and network metadata; conversation
          content and tool calls leave only through an archival hook the organisation builds, which misses
          requests while the circuit breaker is tripped, those outside the rollout percentage and system prompts,
          or not at all on Team. The network export is a per-hour console download without git or MCP traffic,
          there is no per-action log of who asked, and a member's Home tab Disconnect or a deletion started in
          Slack is not in the audit log.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAuditLogging
          reviewRequired: false
          original:
            - capability: capabilityAuditLogging
              coverage: partial
              mechanism: >-
                Audit page (routines, memory, hourly Network events JSON export of Agent Proxy calls,
                excluding git and MCP), attribution under service accounts in each tool's logs, organisation
                audit log via Compliance API for channel-manager and deletion events
              steps:
                - title: Download network events and read tool-side logs
                  body:
                    - Export hourly Network events from claude.ai/admin-settings/claude-tag/audit and
                      correlate with the service account's entries in GitHub, Datadog and other tools.
                  url: https://claude.com/docs/claude-tag/admins/audit
              note: >-
                Session transcripts are not exportable and the Compliance API does not list Claude Tag
                sessions during the beta.
              verified: 2026-09-10
      - mitigation: cap-agent-kill-switch
        coverage: native
        mechanism: >-
          "Enable Claude Tag for your organization" toggle (top of claude.ai/admin-settings/claude-tag, turns off
          DMs too), per-scope Claude Tag version Off or the Team Enable Claude Tag switch, bundle Delete (revokes
          its credentials everywhere, running sessions included), federated connection removal, Scheduled work
          Pause/Delete, spend limits, workspace Disconnect or app uninstall
        steps:
          - title: Turn Claude Tag off for the organisation
            body:
              - >-
                Turn off Enable Claude Tag for your organization at the top of claude.ai/admin-settings/claude-tag;
                it stops channels and direct messages.
            url: https://claude.com/docs/claude-tag/admins/workspaces
          - title: Revoke the credentials in bulk
            body:
              - >-
                Delete each Access bundle, which revokes its credentials in every scope it was attached to, and
                remove federated connections under Federated cloud access.
            url: https://claude.com/docs/claude-tag/admins/restrict-access
          - title: Stop unattended work
            body:
              - >-
                Pause or delete routines on the Scheduled work tab at claude.ai/admin-settings/claude-tag/audit.
            url: https://claude.com/docs/claude-tag/admins/audit
          - title: Decommission a workspace
            body:
              - >-
                Select Disconnect on the workspace in Connected workspaces to delete its sessions, memory,
                routines, artifacts, scopes and account links.
            url: https://claude.com/docs/claude-tag/admins/workspaces
        note: >-
          Native by the rule: an Owner can disable the product organisation-wide, revoke every credential a
          bundle holds in one action per bundle, and the docs say running sessions lose a revoked credential
          after "a short window" (no bound published) and that a removed federated gateway stops at once and a
          removed cloud role or authorisation server within about a minute, with tokens already issued valid up
          to 10 minutes (exchanged AWS credentials up to an hour). Not documented: whether the organisation toggle
          or version Off ends a thread already running, so work that needs no credential may continue until it
          finishes (delay not documented). Members removed from the organisation lose access within minutes;
          personal connectors are revoked per member (Home tab Disconnect) or with the workspace disconnect;
          the Claude GitHub App is uninstalled at GitHub.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityKillSwitch
          reviewRequired: false
          original:
            - capability: capabilityKillSwitch
              coverage: native
              mechanism: >-
                Enable Claude Tag for your organization toggle, per-scope Claude Tag version Off, Allow direct
                messages off, /remove @Claude, bundle deletion (revokes credentials everywhere), workspace
                disconnect, app uninstall, spend limit reached
              steps:
                - title: Stop responding and revoke credentials
                  body:
                    - Set the scope's version to Off (or the org toggle), then delete the bundle to revoke its credentials;
                      running sessions may hold a revoked credential briefly.
                  url: https://claude.com/docs/claude-tag/admins/restrict-access
                - title: Decommission the data
                  body:
                    - Disconnect the workspace at claude.ai/admin-settings/claude-tag to delete its sessions, memory, routines,
                      artifacts and account links.
                  url: https://claude.com/docs/claude-tag/concepts/data-lifecycle
              note: >-
                Setting a scope Off stops new sessions; a running session may hold a revoked credential
                briefly, and the docs give no bound for that window — measure it.
              verified: 2026-09-10
