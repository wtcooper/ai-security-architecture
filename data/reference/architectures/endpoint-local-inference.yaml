id: archLocalInference
surface: surfaceEndpoint
rank: 4
title: Local model runtime
abbrev: Local runtime

summary:
  - >
    An open-weights model served on the user's own machine, listening on a local port so other
    local processes can call it. Chosen to keep data off a vendor's infrastructure, which succeeds
    — and moves every control the vendor was providing onto the device.

description:
  - >
    The reason people run this is sound: prompts and documents never leave the machine, there is
    no per-token cost, and it works offline. The architectural consequence is that the guardrails,
    rate limiting, abuse monitoring and content policy a hosted API applies on the way in and out
    are simply absent, and nothing replaces them by default. Guardrails here are a control the
    device owner deploys on the request path, not a component the runtime ships — in the common
    install nothing sits on that path, and raw model output goes straight back to the caller.
  - >
    The runtime is a local network service. It binds a port, speaks an HTTP API, and historically
    ships without authentication because the assumed caller is a process on the same machine. That
    assumption fails in two directions: any local process — including a browser tab, through a
    permissive CORS policy — can call it, and a runtime bound to a routable interface rather than
    loopback is reachable from the network. Who may bind the port and who may call it are the
    admission decisions of this architecture, and by default nobody makes them.
  - >
    The supply chain is the axis specific to this archetype. Weights are large binaries fetched
    from public hubs, and several serialization formats execute code on load — the format matters
    more than the source, because a safe-by-construction tensor format from an unknown publisher
    beats a pickle-based one from a known publisher. Safe-by-construction has limits of its own:
    the formats that cannot execute on load are still opened by fast-moving native parsers whose
    memory bugs are a code-execution class of their own, and one popular format embeds chat
    templates that execute at inference time, past every static scan. The scan has to sit in
    front of the fetch, because the runtime is usually the thing doing the fetching.
  - >
    There is no governance column, and that absence is the finding: no model inventory, no weight
    scanning pipeline, no policy on binding or sources exists anywhere in the default deployment.
    This runtime is installed by one person in an afternoon and appears in no inventory — every
    control named on this page presumes someone first learns it exists.

distinguishedBy:
  - >
    Against self-hosted inference in a datacentre: identical software, entirely different
    operational reality. There the runtime has a network policy, an identity, a scanner in the
    pipeline and someone on call. Here its port is protected by the assumption that nothing else
    on the machine is hostile.
  - >
    Against the other endpoint archetypes: this one is not an agent. It has no loop, no tools and
    no autonomy — it is a dependency the others consume. It earns its own architecture because its
    risks are supply chain and local exposure rather than agency.

exemplars:
  - name: Local inference servers
    note: >
      Desktop applications and daemons that download open-weights models and expose an
      OpenAI-compatible HTTP API on a loopback port for other local software to call.
    asOf: "2026-08"
  - name: OS and vendor-provided local runtimes
    note: >
      Platform-level local inference offered as a system service, with a managed model catalogue.
      Narrower supply chain, same local-service exposure.
    asOf: "2026-08"
  - name: Public model hubs
    note: >
      Where the weights come from. Publisher identity is verifiable to varying degrees; what the
      artifact does on load is a property of its format, not its publisher.
    asOf: "2026-08"

zones:
  - id: zoneEndpoint
    owner: endpoint
    note: >
      The machine and everything the runtime puts on it: the local API, the process that loads
      the weights, and the artifacts on disk. The whole architecture lives here, which is why
      the one band that matters is the boundary around it.
  - id: zoneCloud
    owner: cloud
    note: >
      Infrastructure we operate. Only one component sits here, and it is the only thing
      standing between a multi-gigabyte artifact from a public hub and a process that will
      execute it on load.
  - id: zoneExternal
    owner: external
    note: >
      Outside the company: the public hubs the weights come from, and the callers nobody
      intended who find a port that was assumed to be private.
  - id: zoneGovernance
    owner: governance
    note: >
      Sparse here by comparison with the agent architectures, and deliberately so — there is
      no gateway, no vendor and no identity on the data path, so what governance can do is
      decide which artifacts are allowed and notice the runtimes nobody registered.

blocks:
  - id: unexpectedCallers
    kind: actor
    title: Unexpected callers
    icon: globe
    zone: zoneExternal
    col: 4
    row: 0
    note: >
      Anything on the machine that can open a socket — including a browser tab, where the runtime
      allows cross-origin requests. Not the caller the API was designed for, and nothing tells
      them apart.

  - id: localApps
    kind: service
    title: Local applications
    icon: code
    zone: zoneEndpoint
    col: 0
    row: 1
    note: >
      The intended consumers: editors, agents and tools on the same machine, calling the local API
      instead of a hosted one — and often built expecting a hosted API's safety floor.

  - id: api
    kind: service
    title: Local HTTP API
    zone: zoneEndpoint
    col: 1
    row: 1
    cosaiComponent: componentModelServing
    note: >
      An OpenAI-compatible endpoint on a local port, unauthenticated by design in the flagship
      runtimes — the vendors point at VPNs and reverse proxies rather than shipping auth. Which
      interface it binds and who may call it are this architecture's admission decisions, and
      exposure scans keep finding the runtimes that made neither.
    items:
      - id: endpoint
        label: Completion endpoint
        icon: plug
        note: The published local interface every consumer on the machine shares.
      - id: binding
        label: Interface binding
        icon: gear
        note: >
          Loopback is an assumption, not a policy. Bound to a routable interface, the runtime is
          reachable from the network.
      - id: cors
        label: Cross-origin policy
        icon: globe
        note: A permissive CORS policy lets any web page the user visits drive local inference.

  - id: runtime
    kind: service
    title: Inference runtime
    zone: zoneEndpoint
    col: 2
    row: 1
    cosaiComponent: componentTheModel
    note: >
      Loads weights, batches requests, serves completions. Also the process that fetches the
      weights, which is why the supply-chain control has to sit in front of the fetch. Whatever
      safety behaviour exists is whatever the weights carry.
    items:
      - id: loader
        label: Weight loader
        icon: gear
        note: >
          Where a pickle-based format turns file opening into code execution — and where a
          malformed file in a "safe" format exercises the native parser, a different bug class
          with the same outcome.
      - id: model
        label: Loaded model
        icon: model
        note: Open weights with no provider-side guardrail, abuse monitoring or content policy.

  - id: weights
    kind: external
    title: Storage
    zone: zoneEndpoint
    col: 2
    row: 2
    cosaiComponent: componentModelStorage
    note: >
      Multi-gigabyte artifacts whose format determines whether loading them is deserialization or
      execution — a more useful question than who published them.
    items:
      - id: files
        label: Model files
        icon: db
        note: Readable by any process with the user's privileges, and swappable by the same.

  - id: egress
    kind: service
    title: Egress control
    zone: zoneCloud
    col: 3
    row: 2
    note: >
      The organisation's proxy and firewall tier — the only customer-operated component this
      architecture has, and the only place the weight fetch can be admitted, scanned and
      recorded. A public hub is an arbitrary destination, so the job here is admission *and*
      inspection, not the destination admission a contracted vendor would get. Target state:
      the common install fetches straight from the hub and nothing sees it.
    items:
      - id: outbound
        label: Outbound connector
        icon: plug
        note: Where the fetch is admitted by destination and the artifact is scanned before it reaches a loader.

  - id: govSupplyChain
    kind: governance
    title: Supply-chain assurance
    icon: db
    zone: zoneGovernance
    col: 1
    row: 4
    capabilities: [capabilityModelScanning, capabilityAiBom]
    note: >
      The whole governance story of this archetype, and the reason the scan sits in front of
      the fetch rather than after it: the runtime is the thing doing the fetching, and for
      several formats opening the file is the execution event.

  - id: govObservability
    kind: governance
    title: Observability & response
    icon: eye
    zone: zoneGovernance
    col: 2
    row: 4
    capabilities: [capabilityShadowAiDiscovery, capabilityAiGovernancePlatform, capabilityModelEvals]
    note: >
      Every control named on this page presumes someone first learns the runtime exists. It is
      installed by one person in an afternoon and appears in no inventory, so discovery is not
      a supporting control here — it is the precondition for all the others.

  - id: hub
    kind: external
    title: Public model hub
    cosaiComponent: componentModelStorage
    zone: zoneExternal
    col: 4
    row: 2
    note: >
      Distribution for open weights. Publisher identity ranges from verified to arbitrary, and
      neither transport security nor a signature says anything about what the artifact does when
      the runtime opens it.
    items:
      - id: catalogue
        label: Open-weights catalogue
        icon: db
        note: Declared behaviour and actual behaviour are separate facts.

edges:
  - from: localApps
    to: api
    path: primary
    bidir: true
    label: completion request
    note: >
      Local software calls the local API the way it would a hosted one — usually assuming a safety
      floor that is not there.
  - from: unexpectedCallers
    to: api
    path: primary
    label: unauthenticated request
    note: >
      The same endpoint, reached by callers nobody intended: a browser tab through CORS, or the
      network if the binding is routable. Locality is standing in for authorization.
  - from: api
    to: runtime
    path: primary
    bidir: true
    note: >
      Prompts in, raw completions back. Input and output classification is a control deployed on
      this path — in the common install it is a straight pipe.
  - from: runtime
    to: weights
    path: primary
    bidir: true
    label: fetch / load
    note: >
      The runtime fetches artifacts to disk and loads them at start. For several formats the load
      is an execution event, which makes this the supply chain's last step.
  - from: runtime
    to: egress
    path: primary
    bidir: true
    label: weight fetch
    note: >
      The runtime asks for the artifact — which is why the scan has to sit in front of this
      hop rather than after it. It is also the process that will open the file, and for several
      formats opening it is the execution event.
  - from: egress
    to: hub
    path: external
    bidir: true
    label: admitted & scanned
    note: >
      Transport is authenticated and the publisher may be verifiable. Neither says what the
      artifact does when opened, which is why the crossing scans the format rather than
      checking the source.

pins:
  risks:
    - risk: riskMaliciousLoaderDeserialization
      at: runtime->weights
      note: >
        Pickle-class formats execute code on load. The risk is a property of the artifact format,
        not of the publisher.
    - risk: riskModelSourceTampering
      at: egress->hub
      note: Publisher identity at publish time, nothing at load time — and a hub account is a takeover target.
    - risk: riskDenialOfMLService
      at: unexpectedCallers->api
      note: Any local process can saturate the runtime; a browser tab can do it from a web page.
    - risk: riskModelExfiltration
      at: weights
      note: The artifacts sit on disk with the user's file permissions — readable by anything running as the user.
    - risk: riskShadowAndUnknownAgents
      at: runtime
      note: >
        Installed by one person in an afternoon, in no inventory. Responding to a bad model
        release presumes someone knows this runtime exists.
    - risk: riskInsecureIntegratedComponent
      at: runtime
      note: >
        The serving stack itself is fast-moving native code with its own CVE history, running
        unsandboxed — and patched over an auto-update channel that is part of the attack surface.
    - risk: riskInsecureModelOutput
      at: api->runtime
      note: >
        Where this block is absent — the common case — raw model output goes straight to callers
        built expecting a hosted API's floor.
    - risk: riskModelEvasion
      at: runtime
      note: >
        With no provider-side safety layer, whatever refusal behaviour the weights carry is the
        whole of the defence, and it is removable by fine-tune.

  capabilities:
    - capability: capabilityModelScanning
      at: egress->hub
      note: >
        Format and content inspection in front of the fetch — a scan that runs after the runtime
        opens the file has documented an incident, not prevented one.
    - capability: capabilityTransportSecurity
      at: localApps->api
      note: Authenticate local callers rather than treating locality as authorization; a browser tab is local too.
    - capability: capabilityModelGuardrails
      at: api->runtime
      note: Deploy the input and output classification a hosted API would have applied — nothing supplies it here by default.
    - capability: capabilityRateLimiting
      at: api
      note: Bound what any single caller can consume, because the callers share one unmetered port.
    - capability: capabilityAiGovernancePlatform
      at: api
      note: >
        A device-enforced policy on whether local inference may run at all, from which sources,
        and bound to loopback only.
    - capability: capabilityModelWeightProtection
      at: weights
      note: Restrictive file permissions and integrity checks on the artifacts, so a swap is detectable.
    - capability: capabilityAiBom
      at: runtime
      note: Which models, at which versions, from which sources, on which machines — the precondition for every response.
    - capability: capabilityShadowAiDiscovery
      at: runtime
      note: Find the runtimes nobody registered, derived from the machine rather than self-reported.
    - capability: capabilityModelEvals
      at: runtime
      note: >
        Evaluate what the weights actually do before serving them to other software — there is no
        provider evaluation to inherit.

flows:
  - id: F1
    title: The intended call
    moves: Prompts and documents from local software; raw completions back.
    path: [localApps->api, api->runtime]
    threats: [Raw output returned with no classification, No per-caller quota on a shared local service]
    controls: [capabilityModelGuardrails, capabilityRateLimiting]
    note: >
      The flow the runtime exists for. Everything a hosted API would have applied on the way in
      and out is absent unless the device owner deploys it here.
  - id: F2
    title: The call nobody intended
    moves: The same completion request, from a caller the deployment never meant to serve.
    path: [unexpectedCallers->api]
    threats: [Runtime bound to a routable interface, Permissive CORS letting a web page drive inference, Locality standing in for authorization]
    controls: [capabilityTransportSecurity, capabilityRateLimiting]
    note: >
      Same endpoint, same lack of authentication, different caller — and nothing on the path
      tells them apart. This is the flow the exposure scans keep finding.
  - id: F3
    title: Weights arrive and are loaded
    moves: Multi-gigabyte artifacts from a public hub, onto disk, and into a process.
    path: [runtime->egress, egress->hub, runtime->weights]
    threats: [Serialization format that executes on load, Native parser bug in a safe-by-construction format, Chat template that executes at inference time]
    controls: [capabilityModelScanning, capabilityAiBom, capabilityModelWeightProtection]
    note: >
      The archetype's defining flow. The scan sits in front of the fetch because the runtime is
      the thing doing the fetching, and for several formats opening the file *is* the execution
      event — so a control placed after the download has already been bypassed.

scenarios:
  - title: An application asks for a completion
    steps:
      - follow: localApps->api
        note: A local tool calls the OpenAI-compatible endpoint as if it were hosted.
      - follow: api->runtime
        note: >
          The request crosses whatever classification the owner deployed — often none — and the
          model serves the completion with whatever behaviour the weights carry.
      - follow: api->localApps
        note: The response returns with no provider floor under it.
  - title: A poisoned checkpoint
    steps:
      - follow: egress->hub
        note: A well-reviewed model name, a compromised artifact — the download verifies transport, not behaviour.
      - follow: weights->runtime
        note: >
          The runtime opens the file. In a pickle-class format the load is the execution event;
          in a safe format, a malformed header exercises the parser instead — either way, with
          the user's privileges.
  - title: A browser tab finds the port
    steps:
      - follow: unexpectedCallers->api
        note: A visited web page calls the local endpoint through a permissive cross-origin policy.
      - follow: api->runtime
        note: >
          Nothing distinguishes this caller from the intended ones. The page now drives local
          inference — for free, and invisibly to the user.

deviations:
  - subject: Guardrails are a control on the request path, not a block
    reason: >
      Input and output classification is something the device owner deploys, not a component of
      the runtime — so it is pinned as a numbered control on the API-to-runtime path rather than
      drawn as a service that does not exist in the common install.

