  - id: buildSessionPerTask
    name: "Isolated sessions (runtimeSessionId) and lifecycleConfiguration (maxLifetime)"
    where: "AgentCore Runtime › microVM compute; your dispatcher's InvokeAgentRuntime call with a new runtimeSessionId; StopRuntimeSession at the end"
    setVia: [apiCli, code]
    area: tools
    default: "A reused session ID returns to the same session and its files"
    recommended: "Start every build with a new session ID on microVM compute, set maxLifetime to the build's budget, stop the session when the branch is pushed, and attach no session storage or shared S3 Files or EFS mount to the build runtime."
    value: "New microVM session per build, stopped at the end"
    why: "Generated code and its packages run here before any check has looked at them, so each build gets a machine of its own that is destroyed afterwards."
    mitigations: [D3-EI]
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-sessions.html
    verified: "2026-11-21"
  - id: agentRoleNoDeployScp
    name: "Service control policy on the factory OU (deny deploy, approval and direct model calls)"
    where: "AWS Organizations › Policies › Service control policies › attached to the factory account, condition aws:PrincipalArn on the runtime's execution role"
    setVia: [cloudPolicy]
    area: identity
    recommended: "Deny that role sts:AssumeRole into app accounts, codepipeline:PutApprovalResult and UpdatePipeline, codebuild:UpdateProject, ecs:*, iam:* and bedrock:InvokeModel*; leave it gateway invoke, AgentCore Identity token calls and its own logs."
    value: "No deploy, approval or direct model rights"
