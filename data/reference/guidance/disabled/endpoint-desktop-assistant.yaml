# Controls guidance for the desktop AI assistant archetype — deliberately thin for now: the
# two dated tool entries carry most of the content, and the audit lists the pinned
# capabilities not yet addressed here as the work list.
archetype: archDesktopAssistant
mode: use
status: draft
attribution: >-
  Authored in this repository. Vendor and product facts are confined to the dated tool
  entries and their cited documentation, verified at authoring time.

overview:
  - >-
    Consumer-shaped desktop assistants reach the enterprise through the same door as any
    desktop software — someone installs one — but they connect to mail, files, calendars and
    internal services through per-user connector grants that no one sums. The governing move
    is the same as for the coding agents: deploy the app managed, and use the vendor's
    device policies and organisation-level connector controls rather than trusting each
    user's settings screen.

items:
  - title: Deploy managed and govern connectors at the organisation, not the user
    capabilities: [capabilityIga, capabilityToolPermissionScoping]
    tools: [toolClaudeDesktop, toolChatgptDesktop]
    body:
      - >-
        Both major desktop assistants now ship enterprise installers and honour device-level
        policy (MDM configuration profiles and policy registries), and both have org-level
        admission controls for what the assistant may connect to — allowlists for desktop
        extensions and role-scoped app and plugin enablement. The defaults differ in a way
        that matters: one vendor's extension allowlist ships disabled (everything available
        until an admin turns it on) while the other disables plugins by default on
        enterprise workspaces. Check the default, don't assume it.
      - >-
        Where managed connector authorization through the IdP is available, prefer it over
        per-user OAuth grants: it makes the connector's scope an administered decision and
        keeps revocation in the directory rather than in each employee's settings.

  - title: Contain what the assistant can reach from the device
    capabilities: [capabilityAiDlp, capabilityEgressControl]
    tools: [toolClaudeDesktop, toolChatgptDesktop]
    body:
      - >-
        Device policies can turn off the highest-risk local surfaces — local MCP server
        connections, computer-use and record modes, unmanaged workspace folders — and pin
        updates to managed channels. What the policies cannot see is content leaving through
        sanctioned chat, which is why this archetype pairs the vendor controls with
        interaction-level data loss prevention and network egress telemetry; the compliance
        export APIs both vendors ship are the hook for that monitoring, with source
        retention short enough that continuous export is part of the deployment, not an
        afterthought.

sources:
  - title: Enterprise configuration for Claude Desktop
    url: https://support.claude.com/en/articles/12622667-enterprise-configuration-for-claude-desktop
  - title: ChatGPT desktop Windows deployment
    url: https://learn.chatgpt.com/docs/enterprise/windows-deployment
  - title: Apps and plugin controls for ChatGPT workspaces
    url: https://help.openai.com/en/articles/11509118
