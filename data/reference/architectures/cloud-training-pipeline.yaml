id: archTrainingPipeline
surface: surfaceCloud
rank: 6
title: Fine-tuning and model registry pipeline
abbrev: Training pipeline

summary:
  - >
    A build system whose artifact is a model. Curated data goes in, a tuned checkpoint comes
    out, and everything that is true of a compiler and its supply chain is true here — except
    that the output cannot be diffed and the defects cannot be found by reading it.

description:
  - >
    Treating this as a build pipeline is the whole of the correct framing. It has source inputs,
    a build environment, dependencies, an artifact, a registry and a promotion path, and it
    deserves the controls a software pipeline gets: reproducibility, provenance, signed
    artifacts, and a promotion gate nothing bypasses. Where the analogy breaks is inspection: a
    compiled binary can be decompiled and diffed; a tuned checkpoint cannot be read for
    backdoors in any practical sense. Input control and evaluation are the substitutes for code
    review — what went into the training set and how the result behaves are the only two things
    anyone can actually examine.
  - >
    Poisoning is therefore the primary risk and it is durable. A poisoned example influences
    every inference the model ever makes, survives redeployment, and is not removable without
    retraining — and the dose is small: published results show a near-constant few hundred
    poisoned documents backdoor models regardless of scale, so poisoning needs a foothold, not
    a percentage. A targeted poisoning that only activates on a trigger phrase is invisible to
    accuracy metrics and to any evaluation that does not know what to look for — which is why
    curation is the last place a bad example can be removed rather than baked in, and why
    lineage from every promoted model back to its exact dataset is what makes a discovered
    poisoning scopeable at all.
  - >
    Training data is also a disclosure surface in a way inference data is not. Memorised
    examples can be extracted from the model afterwards, so restricted-access content in the
    corpus becomes part of an artifact served far more widely than the dataset ever was. The two
    access questions to settle early: who may promote a checkpoint to production, and who may
    read the corpus. Both default to a broad platform-team role, and both are higher-privilege
    than they look — which is why promotion is a separated human decision and the signing key
    lives outside the training environment, so a compromised job cannot sign its own output.

distinguishedBy:
  - >
    Against an ordinary data or software build pipeline: same trust properties, different
    artifact. A dataset or binary can be corrected in place and diffed; a model cannot — which
    is why the evaluation gate and the promotion decision carry the weight code review carries
    elsewhere.
  - >
    Against self-hosted inference: that consumes artifacts, this produces them. They meet at the
    model registry this drawing now shows, and the promotion gate in front of it is where both
    archetypes' supply-chain controls concentrate.

exemplars:
  - name: Axolotl
    note: >
      Self-operated adapter and full fine-tuning on the organisation's own accelerators — the
      training-job tier of this drawing, run against a corpus and base checkpoint the
      organisation curates itself.
    url: https://github.com/axolotl-ai-cloud/axolotl
    asOf: "2026-09"
  - name: MLflow Model Registry
    note: >
      Versioned artifacts with lineage, stage transitions, approvals and rollback — the
      registry-and-promotion tier, operated beside whatever produced the checkpoint.
    url: https://mlflow.org/docs/latest/model-registry.html
    asOf: "2026-09"
  - name: Hugging Face PEFT
    note: >
      Lightweight tuning producing an adapter rather than a full checkpoint. Smaller artifact,
      same supply-chain questions, and an additional one — who may load an adapter at serve
      time — that this page pins at the registry. Provider-hosted managed tuning is a
      different custody model and is deliberately not an exemplar here.
    url: https://huggingface.co/docs/peft
    asOf: "2026-09"

zones:
  - id: zoneExternal
    owner: external
    note: >
      Where the two inputs come from — the corpora we did not author and the base checkpoint we
      did not train. Drawn on the left because this is an ingest architecture: the outside
      world is its source, not its destination.
  - id: zoneCloud
    owner: cloud
    note: >
      The build system end to end: the mirror that admits upstream artifacts, the curation
      stage, the assembled dataset, the GPU pool, the candidate store, and the evaluation and
      registry tiers that stand between a new checkpoint and anything that serves it.
  - id: zoneGovernance
    owner: governance
    note: >
      Sparse, and deliberately. The dataset's provenance and the output's signature are the two
      things that make a run auditable six months later; the rest of an MLOps platform is a
      different architecture.

blocks:
  - id: upstreamArtifacts
    kind: external
    title: Base model & deps
    cosaiComponent: componentModelStorage
    zone: zoneExternal
    col: 0
    row: 0
    note: >
      The starting checkpoint and the frameworks around it, pulled from a public hub or an
      internal mirror. One of the run's two inputs, and the one whose format decides whether
      loading it is deserialization or execution.
    items:
      - id: baseCheckpoint
        label: Base checkpoint
        icon: model
        note: The weights the run starts from — open, or one of our own earlier outputs.
      - id: frameworks
        label: Frameworks & dependencies
        icon: code
        note: The training stack itself, and an ordinary software supply chain with model-shaped consequences.

  - id: dataOrigins
    kind: external
    title: Training content origins
    cosaiComponent: componentDataSources
    zone: zoneExternal
    col: 0
    row: 1
    note: >
      Scraped, purchased, internal and human-labelled content. The other input, and the one
      that carries the most sensitivity: it is usually proprietary, it is read by every worker
      in the job, and it is the point where poisoning enters.
    items:
      - id: scraped
        label: Scraped & purchased sets
        icon: globe
        note: Content authored by people who did not know it would train a model.
      - id: internal
        label: Internal records
        icon: db
        note: Our own data, and the reason the dataset store is the most sensitive thing on this page.
      - id: labels
        label: Human labels & preferences
        icon: person
        note: >
          Labels and preference judgements steer behaviour directly, and the workforce that
          writes them typically gets no scrutiny relative to that influence.

  - id: pkgRegistry
    kind: external
    title: Private pkg registry
    cosaiComponent: componentDataSources
    zone: zoneCloud
    col: 1
    row: 0
    note: >
      The organisation-maintained mirror where base checkpoints and training frameworks are
      admitted before any job may pull them — format policy and scanning run here, by a tier
      the job cannot bypass, which is what makes the intake control independent of the thing
      it protects.
    items:
      - id: approvedPackages
        label: Approved packages
        icon: db
        note: The base weights and dependencies a run may use — admitted, scanned, and pinned by digest.

  - id: curation
    kind: service
    title: Curation & filtering
    cosaiComponent: componentDataFilteringAndProcessing
    zone: zoneCloud
    col: 1
    row: 1
    note: >
      The processing tier between raw origins and the versioned corpus — the last point at
      which a poisoned or improperly sourced example is a deletion rather than a retraining
      decision.
    items:
      - id: qualityFilters
        label: Quality & safety filters
        icon: search
        note: What a pipeline calls "curation" — filtering jobs somebody runs and tunes.
      - id: sensitiveRemoval
        label: Sensitive-content removal
        icon: shield
        note: Restricted-access content removed before it can be memorised into a wider-served artifact.
      - id: provenanceCapture
        label: Provenance capture
        icon: doc
        note: Per-example source and licence, recorded at ingest because it cannot be reconstructed later.

  - id: corpus
    kind: service
    title: Training corpus
    cosaiComponent: componentTrainingData
    zone: zoneCloud
    col: 2
    row: 1
    note: >
      The assembled, versioned dataset the run actually reads — an object-storage bucket or a
      shared filesystem, mounted by every worker. Access control and provenance here matter
      more than anything else in the drawing.
    items:
      - id: datasetVersions
        label: Dataset versions
        icon: db
        note: The exact bytes a given run consumed, addressable after the fact or the run is unreproducible.

  - id: trainJob
    kind: service
    title: Training job
    cosaiComponent: componentModelTrainingTuning
    zone: zoneCloud
    col: 2
    row: 0
    note: >
      The GPU pool and the framework running on it. The technique decides the shape more than
      anything else does: a quantized low-rank run fits on a single node, while a full
      fine-tune needs sharded optimizer state across nodes and a high-bandwidth interconnect.
      Everything the job holds — the dataset, the base weights, the credentials it was handed —
      is in one blast radius for the hours it runs.
    items:
      - id: gpuPool
        label: GPU compute
        icon: gear
        note: One node or many, gang-scheduled; the interconnect is what decides whether multi-node is viable.
      - id: tuningRun
        label: Tuning run
        icon: gear
        note: >
          Full fine-tune, or the low-rank techniques that collapse the same job onto far less
          hardware. RL and agentic recipes execute model-generated actions inside the job, so
          the sandbox is part of the build environment, not an afterthought.
      - id: reproRecord
        label: Reproducibility record
        icon: doc
        note: Which data, which base, which code, which seed — recorded during the run, not reconstructed later.

  - id: storage
    kind: external
    title: Storage
    cosaiComponent: componentModelStorage
    zone: zoneCloud
    col: 3
    row: 0
    note: >
      Where the candidate lands, unsigned. For a low-rank run that is an adapter directory of
      megabytes rather than a model; for a full fine-tune it is a complete checkpoint. Nothing
      serves from here: a candidate becomes loadable only by passing the gate and being signed
      at promotion. Encryption over these bytes is our keys, managed from the governance band.
    items:
      - id: modelFiles
        label: Model files
        icon: db
        note: The new weights, or the adapter that layers over the base — candidates until promoted.

  - id: evaluation
    kind: service
    title: Evaluation & red teaming
    cosaiComponent: componentModelEvaluation
    zone: zoneCloud
    col: 4
    row: 0
    note: >
      The blocking gate in front of promotion — candidates flow through it, which is why it is
      a block here and a governance item on the agent drawings. With an artifact that cannot
      be read, how the result behaves is one of only two things anyone can examine; the
      benchmarks themselves are custody-controlled, because a gate whose answer key the
      candidate's authors can edit gates nothing.
    items:
      - id: capabilityEvals
        label: Capability & safety evals
        icon: scale
        note: Task performance and the safety regressions benign fine-tuning measurably causes.
      - id: backdoorProbing
        label: Backdoor probing
        icon: eye
        note: Trigger-phrase hunting — the only chance to catch a poisoning accuracy metrics cannot see.
      - id: memorisationTesting
        label: Memorisation testing
        icon: search
        note: Whether restricted corpus content can be extracted back out of the artifact.

  - id: registry
    kind: service
    title: Model registry
    cosaiComponent: componentModelStorage
    zone: zoneCloud
    col: 4
    row: 1
    note: >
      Version, lineage, stage, approval, signature and rollback — the promotion semantics the
      title promises, operated as its own tier. The artifact bytes stay in the store behind
      it; what lives here is the decision record that makes one of them loadable. This is
      where this drawing meets self-hosted inference.
    items:
      - id: candidates
        label: Candidate checkpoints
        icon: model
        note: Every artifact the pipeline produced, promoted or not.
      - id: lineage
        label: Lineage metadata
        icon: doc
        note: Which data, which base, which run — the record that scopes a discovered poisoning.
      - id: signedReleases
        label: Signed releases
        icon: shield
        note: >
          Signed at promotion, by an identity the training job never holds, so the serving
          tier's load-time verification proves the gate was passed.

  - id: govSupplyChain
    kind: governance
    title: Supply-chain assurance
    icon: db
    zone: zoneGovernance
    col: 3
    row: 3
    capabilities: [capabilityDataProvenance, capabilityAiBom, capabilityModelScanning]
    note: >
      What went in and what came out: the provenance of every example, the format check on the
      base checkpoint before a loader opens it, and the record tying an artifact to the run
      that produced it.

  - id: govPolicy
    kind: governance
    title: Policy & authorization
    icon: scale
    zone: zoneGovernance
    col: 2
    row: 3
    capabilities: [capabilityDataAccessGovernance, capabilityHitlControls]
    note: >
      Who may read the dataset and who may authorise a run against it. The dataset is the
      sensitive asset here, not the model.

  - id: govSecrets
    kind: governance
    title: Secrets & key management
    icon: key
    zone: zoneGovernance
    col: 1
    row: 3
    capabilities: [capabilityModelWeightProtection, capabilityEncryptionKeyManagement]
    note: Signing keys for the output, and the credentials the job holds for its whole run.

  - id: govObservability
    kind: governance
    title: Observability & response
    icon: eye
    zone: zoneGovernance
    col: 4
    row: 3
    capabilities: [capabilityAuditLogging, capabilityModelDocumentation, capabilityKillSwitch]
    note: >
      The lineage record and the documentation that travel with an artifact — the only reason a
      question asked long after the run has an answer.

  - id: govIdentity
    kind: governance
    title: Identity services
    icon: person
    zone: zoneGovernance
    col: 0
    row: 3
    capabilities: [capabilityNhiManagement]
    note: >
      A workload identity per run, minted for the dataset version it was approved against and
      structurally unable to sign — the identity is what makes the promotion gate independent
      of the thing it gates.

edges:
  - from: dataOrigins
    to: curation
    path: external
    label: content in
    note: >
      Raw material from outside, entering the one stage where a bad example is still a
      deletion. Everything after this hop is versioned and, eventually, learned.
  - from: curation
    to: corpus
    path: primary
    label: filtered set
    note: >
      What survives filtering, with provenance stamped per example, assembled into the named,
      versioned set the run will read.
  - from: upstreamArtifacts
    to: pkgRegistry
    path: external
    label: base weights & deps in
    note: >
      The starting checkpoint and its frameworks arrive at the mirror, where format policy and
      scanning gate admission. For several formats opening the file is itself the execution
      event, which is why this check runs at a tier the job cannot skip.
  - from: pkgRegistry
    to: trainJob
    path: primary
    label: approved artifacts
    note: The job pulls only what the mirror admitted, pinned by digest.
  - from: corpus
    to: trainJob
    path: primary
    bidir: true
    label: dataset read
    note: Every worker in the job reads the same set, which is what makes its access control load-bearing.
  - from: trainJob
    to: storage
    path: primary
    label: candidate out
    note: >
      The output artifact — a full checkpoint, or an adapter of a few megabytes — lands
      unsigned. The job holds no signing identity; what it writes is a candidate, not a
      release.
  - from: storage
    to: evaluation
    path: primary
    label: candidate under test
    note: The gate loads the candidate the way a serving tier would, and probes what cannot be read.
  - from: storage
    to: registry
    path: primary
    route: vh
    label: artifact digest
    note: >
      The registry records the digest of the bytes the store holds; the signed release points
      at exactly that artifact and nothing else.
  - from: evaluation
    to: registry
    path: primary
    label: promotion
    note: >
      A passing candidate is promoted: a separated human decision, a signature from an
      identity the job never held, and a registry entry tying artifact to data, base and run.

pins:
  risks:
    - risk: riskDataPoisoning
      at: dataOrigins->curation
      note: >
        A poisoned example entering the pipeline. The injection point of the whole
        architecture, and the reason curation and provenance stand between origins and the
        corpus rather than being assumed.
    - risk: riskUnauthorizedTrainingData
      at: corpus
      note: Content that was never licensed, consented to, or cleared for this use, learned irreversibly.
    - risk: riskExcessiveDataHandling
      at: corpus
      note: >
        The most sensitive artifact in the drawing, mounted by every worker in the job. Its
        access control matters more than anything else on this page.
    - risk: riskModelSourceTampering
      at: upstreamArtifacts->pkgRegistry
      note: >
        A base checkpoint whose format executes on load, or a framework dependency that does.
        Publisher identity says nothing about what the artifact does when opened — which is
        what admission at the mirror exists to decide.
    - risk: riskInsecureIntegratedComponent
      at: trainJob
      note: >
        The job holds the dataset, the base weights and its own credentials at once, for hours.
        Whatever compromises the training container gets all three.
    - risk: riskModelExfiltration
      at: storage
      note: >
        The output is the expensive thing and it is small — an adapter is megabytes. Egress from
        the artifact store deserves the attention a model-sized file would not attract.
    - risk: riskEvaluationBenchmarkManipulation
      at: evaluation
      note: >
        A gate whose benchmarks the candidate's authors can read or edit gates nothing — and a
        targeted poisoning is invisible to any evaluation that does not know what to look for.
        Benchmark custody is the control the gate itself depends on.
    - risk: riskInferredSensitiveData
      at: evaluation
      note: >
        Memorised examples can be extracted from the artifact afterwards, so restricted corpus
        content becomes part of something served far more widely than the dataset ever was.
        Memorisation testing here is where that surfaces before promotion does.
    - risk: riskAdapterPEFTInjection
      at: registry
      note: >
        An adapter layers over a clean, verified base at serve time — a trojaned one rides the
        base's reputation. Who may register an adapter, and which base it is approved against,
        is decided here.

    - risk: riskInsecureIntegratedComponent
      at: pkgRegistry
      note: >
        The mirror is third-party software with its own CVE stream, sitting between the job and
        the internet — the artifact server whose remote-repository proxying became the escape in
        the OpenAI–Hugging Face incident.
    - risk: riskMaliciousLoaderDeserialization
      at: pkgRegistry->trainJob
      note: >
        Format policy at the mirror is what makes this leg a deserialization: a digest-pinned
        pickle is still pickle, and the loader opens it as the job.
  capabilities:
    - capability: capabilityDataSanitization
      at: curation
      note: >
        Quality, safety and sensitive-content filtering at the drawn stage — the last point at
        which a bad example is removable rather than learned.
    - capability: capabilityDataProvenance
      at: curation
      note: Where every example came from, recorded at ingest, because it cannot be reconstructed after training.
    - capability: capabilityPetTooling
      at: curation
      note: >
        Where sensitive records are in scope, de-identification and privacy-preserving
        transforms run here — applicability is a data-classification decision, not a default.
    - capability: capabilityDataAccessGovernance
      at: corpus
      note: Who may read the set, enforced at the store rather than trusted to the job.
    - capability: capabilityModelScanning
      at: pkgRegistry
      note: >
        Format and content inspection gating admission to the mirror — before any loader in
        the job opens the file, and independent of the job it protects.
    - capability: capabilityHitlControls
      at: corpus->trainJob
      note: >
        An approved run specification names the dataset version a job may read — a person
        per run is not the target state on a pipeline-launched platform; the approval is on
        the spec, and the identity enforces it.
    - capability: capabilityModelHardening
      at: trainJob
      note: >
        Adversarial training and safety-preserving recipes where the tune's use is
        safety-critical — the one stage where robustness can be built in rather than bolted
        on, with the evaluation gate measuring whether it held.
    - capability: capabilityHitlControls
      at: evaluation->registry
      note: >
        Promotion is a separated human decision — a different person, and a different
        credential, from anything the run itself held.
    - capability: capabilityModelWeightProtection
      at: evaluation->registry
      note: >
        Sign at promotion, with the OpenSSF Model Signing spec and a Sigstore bundle, using an
        identity the training job never possesses — so a signature proves the gate was passed,
        not merely that a job finished.
    - capability: capabilityModelEvals
      at: evaluation
      note: >
        The behavioural half of what substitutes for code review: capability, safety,
        backdoor and memorisation checks, blocking promotion rather than advising it.
    - capability: capabilityDataAccessGovernance
      at: storage
      note: >
        Reads from the candidate store are scoped and logged like corpus reads — the answering
        control for exfiltration of an artifact small enough to walk out unnoticed.
    - capability: capabilityEncryptionKeyManagement
      at: govSecrets
      note: >
        Our keys over the candidate store and the checkpoints the run wrote on the way —
        managed here, enforced as storage encryption from this service.
    - capability: capabilityAiBom
      at: govSupplyChain
      note: The record tying this artifact to this data, this base and this run.
    - capability: capabilityAuditLogging
      at: govObservability
      note: Who ran what against which data, retained long enough to answer a question nobody has asked yet.
    - capability: capabilityModelDocumentation
      at: govObservability
      note: What the artifact is and what it was trained on, travelling with it rather than living in a wiki.

    - capability: capabilityDataAccessGovernance
      at: pkgRegistry
      note: >
        Read-only to jobs. Writes come from admission only, so a compromised run cannot use the
        mirror as a message board or a staging area.
    - capability: capabilityEgressControl
      at: trainJob
      note: >
        Deny-by-default egress from the job: the mirror, the corpus store and the artifact store
        are the whole allowlist. Absorbed by the compute platform's network policy per the
        recorded deviation.
    - capability: capabilityNhiManagement
      at: corpus->trainJob
      note: >
        The run's own workload identity, scoped to the approved dataset version and denied the
        promotion identity — the separation the whole drawing rests on.
    - capability: capabilityKillSwitch
      at: registry
      note: >
        A release withdrawn here fails load-time verification everywhere it serves — the lineage
        query names the artifacts, and the registry's stage transition is the stop.
    - capability: capabilityAgentSandboxing
      at: trainJob
      note: >
        Rollouts in an RL or agentic recipe execute what the model generates; that execution is
        contained inside the job's environment — absorbed by the compute platform per the
        recorded deviation.
walkthrough:
  title: A tuning run produces a promoted adapter
  moves: >-
    Curated data and an admitted base checkpoint through GPU compute, evaluation and
    promotion, into a signed registry entry.
  steps:
    - follow: dataOrigins->curation
      note: Raw content enters the filtering stage — the last point a bad example is a deletion.
    - follow: curation->corpus
      note: What survives is assembled into a named, versioned set with provenance per example.
    - follow: corpus->trainJob
      note: Every worker reads the same set, on a grant that is checked at the store.
    - follow: pkgRegistry->trainJob
      note: >
        The job pulls the base checkpoint and frameworks from the mirror, pinned by digest —
        only what was scanned and admitted when it arrived from upstream, which the
        base-checkpoint scenario walks.
    - follow: trainJob->storage
      note: The candidate lands, unsigned — the job holds no signing identity.
    - follow: storage->evaluation
      note: The gate loads the candidate and probes what cannot be read.
    - follow: evaluation->registry
      note: >
        A human promotes; the artifact is signed by an identity the job never held, and the
        registry entry ties it to its data, base and run.

scenarios:
  - title: A poisoning is discovered months later
    steps:
      - follow: dataOrigins->curation
        note: The provenance record maps the poisoned examples back to the batch they arrived in.
      - follow: curation->corpus
        note: And to the dataset version they were assembled into.
      - follow: corpus->trainJob
        note: And forward to every run that read that version — which is why versioning is not bookkeeping.
      - follow: trainJob->storage
        note: Every candidate those runs wrote is now suspect.
      - follow: storage->evaluation
        note: Including the ones that passed the gate — a behavioural backdoor is what the probes may have missed.
      - follow: evaluation->registry
        note: The lineage metadata identifies every artifact those runs promoted, and they are withdrawn.
  - title: The base checkpoint is the attack
    steps:
      - follow: upstreamArtifacts->pkgRegistry
        note: >
          A tampered checkpoint arrives — a format that executes on load, or weights carrying
          a trained-in backdoor. Format policy and scanning refuse the first class here.
      - follow: pkgRegistry->trainJob
        note: A behavioural backdoor survives scanning — the mirror admits bytes, not behaviour.
      - follow: trainJob->storage
        note: The candidate carries the backdoor forward; tuning does not remove it.
      - follow: storage->evaluation
        note: >
          Backdoor probing is the last control with a chance — and only if the probes do not
          come from a benchmark set the attacker could study.
  - title: A compromised job tries to promote its own output
    steps:
      - follow: trainJob->storage
        note: The job writes a candidate it would like the world to serve. It cannot sign it.
      - follow: storage->evaluation
        note: The only road to promotion runs through a gate the job has no credentials for.
      - follow: evaluation->registry
        note: >
          Signature and registry entry happen here, on a human approval — a candidate that
          skipped the gate has no signature, and the serving tier's load-time verification
          refuses it.

deviations:
  - subject: The external band is drawn on the left
    reason: >
      Band order is left-to-right by convention; this drawing reverses it because it is an
      ingest architecture — the outside world is its source, not its destination, and the
      read order should follow the data.
  - subject: Evaluation is drawn inline
    reason: >
      Everywhere else in the catalogue evaluation is a governance item, because it gates
      change rather than data. Here candidates flow through the gate, so it is a block — the
      ontology's own canonical example of a locus that legitimately differs by architecture.
  - subject: Mixed-custody origins are drawn as one external block
    reason: >
      Internal records reach the corpus beside scraped and purchased sets, and a self-trained
      base checkpoint can arrive beside an open one. Both are drawn entering from the external
      band because the ingest treatment — curation, provenance, admission — is identical
      regardless of custody; splitting the origins by owner would double the ingest chain to
      say nothing new. The custody difference is carried in the item notes.

  - subject: Job egress and rollout containment are absorbed by the compute platform
    reason: >
      Deny-by-default egress from the training job and containment of the actions an RL or
      agentic recipe executes are both delivered by the platform the job runs on — its network
      policy and its execution environment — rather than by any block the drawing could name.
      The pins sit on the job because that is what they bound.

