    url: https://learn.microsoft.com/en-us/entra/workload-id/workload-identity-federation-create-trust-user-assigned-managed-identity
    verified: "2026-11-21"
  - id: appRevisionTrafficSplit
    name: "Multiple revision mode with traffic weights (generated app)"
    where: "Container Apps › (generated app) › Revision management; az containerapp ingress traffic set --revision-weight or --label-weight"
    setVia: [apiCli, configFile]
    area: tools
    default: "Single revision mode; all traffic to the latest revision"
    recommended: "Deploy each approved release as a new revision at a small weight and raise it in steps while the last good revision stays active under a label; on failure move all traffic back. Weights split requests, not named users."
    value: "Multiple; new revision small share, last good kept"
