  - architecture: archTrainingPipeline
    asOf: "2026-11"
    verified: "2026-11-18"
    reference:
      - title: "Training jobs, for example Kubeflow Trainer"
        url: https://trainer.kubeflow.org/en/latest/
      - title: "Model registry, for example MLflow Model Registry"
        url: https://mlflow.org/docs/latest/ml/model-registry/
      - title: "Container platform, for example Kubernetes: Production environment"
        url: https://kubernetes.io/docs/setup/production-environment/
    summary:
      - "A pipeline curates and redacts data into a versioned dataset store. Training runs on GPU nodes under a per-run identity, with outbound access limited to the package and image mirrors. Candidates land in a separate store, are tested behind a pipeline gate, approved in the model registry and signed by a release step whose key the training job never holds. Data and weights stay in the data centre, and you carry what a cloud provider would otherwise run; each box lists example products."
    bindings:
      - block: upstreamArtifacts
        service: "Public model hubs and package and image registries"
        note: "Stay outside. Packages, images and weights come in from them through a step that pins, scans and records each one, through your egress control or carried across an air gap; whether training nodes have any route to them is your choice, and keeping them off it is a common one."
        options:
          - { name: "Hugging Face Hub", kind: commercial, url: "https://huggingface.co/docs/hub/security", note: "Base weights and datasets; scans uploads but publisher identity is the only assurance", packs: [upstreamOpenSource] }
          - { name: "NVIDIA NGC Catalog", kind: commercial, url: "https://docs.nvidia.com/ngc/gpu-cloud/ngc-catalog-user-guide/index.html", note: "Containers, pretrained models and Helm charts curated by NVIDIA", packs: [nvidiaAiEnterprise] }
          - { name: "Red Hat Python index and validated models", kind: commercial, url: "https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/3.5/html/customize_models_for_gen_ai_and_agentic_ai_applications/set-up-your-working-environment_custom-models", note: "A maintained Python index with disconnected mirroring, plus scanned models", packs: [redHatOpenShiftAi] }
          - { name: "NVIDIA NGC and Hugging Face", kind: commercial, url: "https://support.hpe.com/hpesc/public/docDisplay?docId=a00aie112hen_us&page=pcai/GenAI/model-catalog.html", packs: [hpePrivateCloudAi] }
      - { block: dataOrigins, service: "Your datasets and labelling tools", build: true, note: "Each source is logged with its origin and digest when it is brought in, so later versions trace back to it." }
      - block: pkgRegistry
        service: "Internal mirror for packages, images and weights"
        options:
          - { name: "Sonatype Nexus Repository", kind: commercial, url: "https://help.sonatype.com/en/nexus-repository-tiers-and-feature-availability.html", note: "Free CE capped at 40,000 components; Pro+ adds automated malware quarantine; Hugging Face proxy repos", watch: [{ text: "Community Edition is capped at 40,000 components and 100,000 requests a day, and automated malware quarantine and policy gates are in the paid editions only, so the mirror admits by routing rule and by your own scans. Hugging Face proxy repositories are available in Community Edition.", url: "https://help.sonatype.com/en/nexus-repository-tiers-and-feature-availability.html" }] }
          - { name: "JFrog Artifactory", kind: commercial, url: "https://docs-redirect.jfrog.com/help/r/jfrog-artifactory-documentation/remote-repositories", note: "Remote (caching) repositories for PyPI, npm, Docker and more" }
          - { name: "Pulp", kind: open, url: "https://pulpproject.org/", note: "Sync-based mirrors for Python, npm, Maven, containers, RPM and Debian content" }
          - { name: "Harbor", kind: open, url: "https://goharbor.io/docs/latest/administration/configure-proxy-cache/", note: "Image and OCI artifact registry with proxy-cache projects", packs: [vmwarePrivateAi] }
          - { name: "Red Hat Quay", kind: commercial, url: "https://docs.redhat.com/en/documentation/red_hat_quay/3.16", note: "Red Hat's image registry for OpenShift estates", packs: [redHatOpenShiftAi], watch: [{ text: "Red Hat documents copying the index into your hosting service; the mirror and its admission rules are yours.", url: "https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/3.5/html/customize_models_for_gen_ai_and_agentic_ai_applications/set-up-your-working-environment_custom-models" }] }
          - { name: "devpi", kind: open, url: "https://devpi.net/docs/devpi/devpi/latest/+doc/index.html", note: "MIT-licensed PyPI-compatible server and mirror" }
          - { name: "Sonatype Nexus Repository and a Harbor proxy cache", kind: open, url: "https://help.sonatype.com/en/nexus-repository-tiers-and-feature-availability.html", note: "Community Edition: 40,000 components and 100,000 requests a day; automated malware quarantine is Pro+.", packs: [upstreamOpenSource], watch: [{ text: "Nexus proxies PyPI and Hugging Face, Harbor proxies images, and scanned base weights sit in a mirror bucket.", url: "https://help.sonatype.com/en/nexus-repository-tiers-and-feature-availability.html" }] }
      - block: curation
        service: "Data curation and redaction jobs"
        note: "Filtering and redaction run as pipeline steps and write a new dataset version; the run is recorded in your experiment tracking (for example MLflow)."
        options:
          - { name: "Presidio", kind: open, url: "https://data-privacy-stack.github.io/presidio/", note: "PII detection and anonymisation, including batch structured data; now community-owned" }
          - { name: "NVIDIA NeMo Curator", kind: open, url: "https://docs.nvidia.com/nemo/curator/latest/", note: "Filtering, deduplication and classification across text, image and other modalities", packs: [nvidiaAiEnterprise], watch: [{ text: "NeMo Curator v1.4.0 (26.09).", url: "https://docs.nvidia.com/nemo/curator/latest/" }] }
          - { name: "Docling", kind: open, url: "https://docling-project.github.io/docling/", note: "Document conversion to structured text; shipped with GPU images in OpenShift AI" }
          - { name: "Kubeflow Pipelines", kind: open, url: "https://www.kubeflow.org/docs/components/pipelines/overview/", note: "The step runner that records each curation run; Red Hat ships it as AI Pipelines", packs: [canonicalCharmedKubeflow, hpePrivateCloudAi] }
          - { name: "Kubeflow Pipelines steps with Presidio", kind: open, url: "https://www.kubeflow.org/docs/components/pipelines/overview/", note: "Presidio has moved to the community-owned Data Privacy Stack project.", packs: [upstreamOpenSource] }
          - { name: "AI Pipelines (Kubeflow Pipelines) with Docling", kind: commercial, url: "https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/3.5/html/customize_models_for_gen_ai_and_agentic_ai_applications/overview-of-the-model-customization-workflow_custom-models", packs: [redHatOpenShiftAi] }
      - block: corpus
        service: "Versioned dataset storage"
        note: "Written only by the curation identity; each training run may read only the version it was approved for."
        options:
          - { name: "Ceph Object Gateway", kind: open, url: "https://docs.ceph.com/en/latest/radosgw/", note: "Versioned, lockable S3 buckets with per-run STS credentials", packs: [upstreamOpenSource] }
          - { name: "lakeFS", kind: open, url: "https://docs.lakefs.io/", note: "Git-like branches and commits over object storage; Enterprise and Cloud editions paid" }
          - { name: "Red Hat OpenShift Data Foundation", kind: commercial, url: "https://docs.redhat.com/en/documentation/red_hat_openshift_data_foundation/4.20", note: "S3 object storage for OpenShift clusters", packs: [redHatOpenShiftAi] }
          - { name: "NeMo Helix Files", kind: open, url: "https://docs.nvidia.com/nemo-helix/latest/documentation/kubernetes-deployment/setup/helm/file-storage", note: "FileSets on a PVC or an S3 bucket you provision", packs: [nvidiaAiEnterprise], watch: [{ text: "You provision the bucket and credentials; Helix does not create them.", url: "https://docs.nvidia.com/nemo-helix/latest/documentation/kubernetes-deployment/setup/helm/file-storage" }] }
          - { name: "MinIO", kind: open, url: "https://github.com/minio/minio", note: "Default object store of the Kubeflow charms; community repository archived April 2026", packs: [canonicalCharmedKubeflow] }
          - { name: "HPE Ezmeral Data Fabric Object Store", kind: commercial, url: "https://support.hpe.com/hpesc/public/docDisplay?docId=a00aie112hen_us&page=ManageClusters/connect-object-stores.html", note: "S3 store built into HPE AI Essentials; users reach it through a proxy with their JWT" }
          - { name: "HPE Ezmeral Data Fabric Object Store, or a connected S3 store (MinIO, AWS S3)", kind: commercial, url: "https://support.hpe.com/hpesc/public/docDisplay?docId=a00aie112hen_us&page=ManageClusters/connect-object-stores.html", note: "Clients reach connected stores through an AI Essentials proxy with JWTs, without holding the keys.", packs: [hpePrivateCloudAi] }
      - block: trainJob
        service: "Training jobs on a GPU cluster"
        options:
          - { name: "Kubeflow Trainer", kind: open, url: "https://www.kubeflow.org/docs/components/trainer/overview/", note: "TrainJob API with platform-owned runtimes for PyTorch, DeepSpeed, JAX, MLX and more", packs: [upstreamOpenSource, redHatOpenShiftAi, canonicalCharmedKubeflow], watch: [{ text: "Platform admins own the ClusterTrainingRuntimes; with Kueue, 3.5 needs Red Hat Build of Kueue 1.3 (known issue).", url: "https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/3.5/html/working_with_distributed_workloads/running-kubeflow-trainerv2_distributed-workloads" }, { text: "Runs from a ClusterTrainingRuntime the platform team owns, with a service account per run and no route out of the cluster.", url: "https://trainer.kubeflow.org/en/latest/" }] }
          - { name: "Ray on Kubernetes (KubeRay)", kind: open, url: "https://docs.ray.io/en/latest/cluster/kubernetes/index.html", note: "Ray clusters and jobs; used for distributed fine-tuning in OpenShift AI", packs: [hpePrivateCloudAi] }
          - { name: "Slurm", kind: open, url: "https://slurm.schedmd.com/overview.html", note: "Open-source cluster job scheduler; the alternative hosting option this mapping already compares" }
          - { name: "NeMo Helix Customizer", kind: open, url: "https://docs.nvidia.com/nemo-helix/latest/documentation/customizer-reference", note: "SFT, LoRA, DPO and GRPO jobs whose output is deployed with NIM; 0.x", packs: [nvidiaAiEnterprise], watch: [{ text: "Full fine-tunes create a new model entity; LoRA jobs attach an adapter.", url: "https://docs.nvidia.com/nemo-helix/latest/documentation/customizer-reference" }] }
          - { name: "NVIDIA Run:ai", kind: commercial, url: "https://run-ai-docs.nvidia.com/self-hosted/", note: "GPU pooling, quotas and fair-share scheduling, self-hosted" }
          - { name: "VMware deep learning VMs and GPU VKS clusters", kind: commercial, url: "https://techdocs.broadcom.com/content/dam/broadcom/techdocs/us/en/pdf/vmware/private-ai/private-ai-nvidia/vmware-private-ai-foundation-with-nvidia-9-1.pdf", note: "Pre-built GPU VMs for prototyping and fine-tuning on VCF", packs: [vmwarePrivateAi], watch: [{ text: "For prototyping and fine-tuning; no training orchestrator is included.", url: "https://techdocs.broadcom.com/content/dam/broadcom/techdocs/us/en/pdf/vmware/private-ai/private-ai-nvidia/vmware-private-ai-foundation-with-nvidia-9-1.pdf" }] }
      - block: storage
        service: "Storage for unsigned candidate checkpoints"
        note: "Unsigned candidates only. The serving identity has no read access here; releases are copied to a separate bucket."
        options:
          - { name: "Ceph Object Gateway", kind: open, url: "https://docs.ceph.com/en/latest/radosgw/", note: "Separate candidate bucket the serving identity cannot read", packs: [upstreamOpenSource] }
          - { name: "Red Hat OpenShift Data Foundation", kind: commercial, url: "https://docs.redhat.com/en/documentation/red_hat_openshift_data_foundation/4.20", note: "S3 buckets on OpenShift" }
          - { name: "OCI images (modelcars)", kind: open, url: "https://kserve.github.io/website/docs/model-serving/storage/providers/oci", note: "Candidates as OCI artifacts referenced by digest" }
          - { name: "NeMo Helix FileSets", kind: open, url: "https://docs.nvidia.com/nemo-helix/latest/documentation/kubernetes-deployment/setup/helm/file-storage", note: "Customizer outputs on PVC or S3", packs: [nvidiaAiEnterprise] }
          - { name: "MinIO", kind: open, url: "https://github.com/minio/minio", note: "Charm-managed in Charmed Kubeflow; upstream community repository archived", packs: [canonicalCharmedKubeflow] }
          - { name: "OpenShift Data Foundation S3 bucket or OCI image", kind: commercial, url: "https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/3.5/html/deploying_models/deploying_models", packs: [redHatOpenShiftAi] }
          - { name: "Model Gallery on Harbor", kind: commercial, url: "https://techdocs.broadcom.com/us/en/vmware-cis/vcf/vcf-9-0-and-later/9-1/design/design-library/private-ai-platform-detailed-design/private-ai-services.html", packs: [vmwarePrivateAi] }
          - { name: "Ezmeral Data Fabric Object Store (MLflow artifacts)", kind: commercial, url: "https://support.hpe.com/hpesc/public/docDisplay?docId=a00aie112hen_us&page=MLflow/mlflow.html", packs: [hpePrivateCloudAi] }
      - block: evaluation
        service: "Evaluation and red-team gate"
        options:
          - { name: "garak", kind: open, url: "https://docs.garak.ai/garak", note: "LLM vulnerability scanner backed by NVIDIA; used by OpenShift AI and NeMo Helix", packs: [upstreamOpenSource], watch: [{ text: "Serves the candidate on a short-lived vLLM, runs garak and the organisation's own tests, and feeds the gate.", url: "https://docs.garak.ai/garak" }] }
          - { name: "lm-evaluation-harness", kind: open, url: "https://github.com/EleutherAI/lm-evaluation-harness", note: "EleutherAI benchmark harness with vLLM and OpenAI-compatible backends; LM-Eval in OpenShift AI" }
          - { name: "Inspect", kind: open, url: "https://inspect.aisi.org.uk/", note: "UK AISI evaluation framework with sandboxed tools in Docker or Kubernetes" }
          - { name: "promptfoo", kind: open, url: "https://www.promptfoo.dev/docs/intro/", note: "Open-source CLI and library for LLM evaluation and red teaming; agreed to be acquired by OpenAI (March 2026) and says it stays open source" }
          - { name: "Red Hat EvalHub", kind: commercial, url: "https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/3.5/html/evaluating_ai_systems/overview-evaluating-ai-systems_evaluate", note: "Evaluation orchestration with Kueue, MLflow tracking and EvalCards; GA in 3.5", packs: [redHatOpenShiftAi], watch: [{ text: "EvalHub and Automated Red Teaming are GA in 3.5, including disconnected clusters.", url: "https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/3.5/html/evaluating_ai_systems/overview-evaluating-ai-systems_evaluate" }] }
          - { name: "NeMo Helix Evals", kind: open, url: "https://docs.nvidia.com/nemo-helix/latest/documentation/evaluate-models", note: "Dataset, LLM-judge and agent task evaluations as platform jobs; 0.x" }
          - { name: "NeMo Helix Evals and NeMo garak", kind: open, url: "https://docs.nvidia.com/nemo-helix/latest/documentation/vulnerability-scanning", note: "NeMo garak is early access with limited support; Helix Evals is part of the 0.x control plane.", packs: [nvidiaAiEnterprise] }
      - block: registry
        service: "Model registry and release signing"
        options:
          - { name: "MLflow Model Registry", kind: open, url: "https://mlflow.org/docs/latest/ml/model-registry/", note: "Separate approvers need its auth app and a restrictive default_permission", packs: [upstreamOpenSource, canonicalCharmedKubeflow, hpePrivateCloudAi], watch: [{ text: "Run with authentication on and default_permission = NO_PERMISSIONS, so only approvers can change a model's status.", url: "https://mlflow.org/docs/latest/ml/model-registry/" }] }
          - { name: "Kubeflow Hub (formerly Kubeflow Model Registry)", kind: open, url: "https://www.kubeflow.org/docs/components/model-registry/overview/", note: "Registry and catalog with Kubeflow-native deployment" }
          - { name: "Red Hat OpenShift AI model registry", kind: commercial, url: "https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/3.5/html/managing_model_registries/overview-of-model-registries_managing-model-registries", note: "Per-registry permissions; signing in the Python client is Technology Preview", packs: [redHatOpenShiftAi] }
          - { name: "NeMo Helix model entities", kind: open, url: "https://docs.nvidia.com/nemo-helix/latest/documentation/models-and-inference", note: "Customizer writes adapters or new entities here; 0.x", packs: [nvidiaAiEnterprise] }
          - { name: "VMware Model Gallery", kind: commercial, url: "https://techdocs.broadcom.com/us/en/vmware-cis/vcf/vcf-9-0-and-later/9-1/design/design-library/private-ai-platform-detailed-design/private-ai-services.html", note: "Harbor-based versions; no approval workflow described", packs: [vmwarePrivateAi] }
      - block: govIdentity
        service: "Identity provider and workload identity"
        options:
          - { name: "Keycloak", kind: open, url: "https://www.keycloak.org/securing-apps/token-exchange", note: "People and service clients in one realm, with token exchange for hand-offs.", packs: [upstreamOpenSource] }
          - { name: "Red Hat build of Keycloak", kind: commercial, url: "https://access.redhat.com/products/red-hat-build-keycloak/", note: "Supported Keycloak build from Red Hat.", packs: [redHatOpenShiftAi] }
          - { name: "Kubernetes ServiceAccount tokens", kind: open, url: "https://kubernetes.io/docs/concepts/security/service-accounts/", note: "Short-lived projected tokens give each workload an identity the IdP and vault can verify.", packs: [upstreamOpenSource] }
          - { name: "SPIFFE and SPIRE", kind: open, url: "https://spiffe.io/docs/latest/spire-about/", note: "Attested workload identities and trust-domain federation, an alternative to keys per client." }
          - { name: "Red Hat zero trust workload identity manager", kind: commercial, url: "https://www.redhat.com/en/blog/zero-trust-workload-identity-manager-11-generally-available-red-hat-openshift", note: "Red Hat's SPIRE operator, GA 1.1 (July 2026), with Vault and cert-manager as upstream authorities.", packs: [redHatOpenShiftAi] }
          - { name: "Gravitee Access Management", kind: commercial, url: "https://documentation.gravitee.io/am/4.11/guides/developer-contributions/using-oauth-2.0-token-exchange", note: "Gravitee's IdP and authorisation server, with delegated token exchange." }
      - block: govSecrets
        service: "Secrets manager with a hardware root"
        options:
          - { name: "HashiCorp Vault", kind: commercial, url: "https://developer.hashicorp.com/vault/docs/deploy/kubernetes/vso", note: "Dynamic credentials, transit keys and the Vault Secrets Operator; HSM auto-unseal needs Vault Enterprise.", packs: [upstreamOpenSource] }
          - { name: "OpenBao", kind: open, url: "https://openbao.org/docs/configuration/seal/pkcs11/", note: "Open-source fork of Vault under the Linux Foundation's OpenSSF; documents a PKCS#11 HSM seal.", packs: [upstreamOpenSource] }
          - { name: "External Secrets Operator", kind: open, url: "https://external-secrets.io/latest/", note: "Syncs secrets from an external store into Kubernetes Secrets; pairs with any vault here." }
          - { name: "External Secrets Operator for Red Hat OpenShift", kind: commercial, url: "https://developers.redhat.com/articles/2025/11/11/introducing-external-secrets-operator-openshift", note: "Red Hat-supported ESO, GA for OpenShift 4.20+, syncing from Vault or CyberArk Conjur.", packs: [redHatOpenShiftAi] }
          - { name: "Idira Secrets Manager, self-hosted (Palo Alto Networks)", kind: commercial, url: "https://www.paloaltonetworks.com/idira/machine/secrets-management", note: "The former CyberArk line now under Palo Alto's Idira brand; SaaS or self-hosted for air-gapped sites." }
      - block: govPolicy
        service: "Network, admission and guardrail policy"
        options:
          - { name: "Kubernetes", kind: open, url: "https://kubernetes.io/docs/concepts/overview/", note: "The container platform each platform pack here runs on, upstream or as a distribution (OpenShift, VKS, Canonical Kubernetes).", packs: [upstreamOpenSource, redHatOpenShiftAi, nvidiaAiEnterprise, vmwarePrivateAi, canonicalCharmedKubeflow, hpePrivateCloudAi] }
          - { name: "Cilium", kind: open, url: "https://docs.cilium.io/en/stable/security/policy/", packs: [upstreamOpenSource] }
          - { name: "Squid outbound proxy", kind: open, url: "https://www.squid-cache.org/Doc/config/access_log/", note: "The single exit for search and page fetches, with an access log for review.", packs: [upstreamOpenSource] }
          - { name: "nftables", kind: open, url: "https://wiki.nftables.org/wiki-nftables/index.php/Configuring_chains", packs: [upstreamOpenSource] }
      - block: govSupplyChain
        service: "Mirrors, scanners and signing in the pipeline"
        options:
          - { name: "Trivy", kind: open, url: "https://trivy.dev/docs/latest/guide/scanner/vulnerability/", packs: [upstreamOpenSource] }
          - { name: "ModelScan", kind: open, url: "https://github.com/protectai/modelscan", packs: [upstreamOpenSource] }
          - { name: "OpenSSF Model Signing", kind: open, url: "https://github.com/sigstore/model-transparency", packs: [upstreamOpenSource] }
      - block: govObservability
        service: "Logs, traces and SIEM off the workload's path"
        options:
          - { name: "OpenTelemetry Collector", kind: open, url: "https://opentelemetry.io/docs/collector/", note: "Vendor-neutral pipeline that receives gateway logs and traces and forwards them to stores the agent cannot write.", packs: [upstreamOpenSource] }
          - { name: "Grafana Loki", kind: open, url: "https://grafana.com/docs/loki/latest/", note: "Log store; turn retention on, or logs are kept for ever.", packs: [upstreamOpenSource] }
          - { name: "Langfuse (self-hosted)", kind: open, url: "https://langfuse.com/self-hosting", note: "Self-hosted LLM tracing and evaluation, with a documented LiteLLM integration.", packs: [upstreamOpenSource] }
          - { name: "MLflow Tracing", kind: open, url: "https://mlflow.org/docs/latest/genai/tracing/", note: "Agent and LLM tracing; GA in OpenShift AI 3.5, where the visual agent-trace view is Technology Preview.", packs: [redHatOpenShiftAi] }
          - { name: "Elastic Security", kind: commercial, url: "https://www.elastic.co/docs/solutions/security", note: "SIEM and detection engine; one example of where detections on gateway, egress and audit logs run." }
    sources:
      dataOrigins: https://mlflow.org/docs/latest/ml/dataset/
    alsoNeeded:
      - service: "The container platform's control plane, operated by you"
        role: other
        why: "A cloud runs the control plane for you. Here you run at least three control plane machines, a load balancer in front of the API server, regular backups of its datastore (etcd on Kubernetes) and every upgrade."
        url: https://kubernetes.io/docs/setup/production-environment/
      - service: "GPU servers with their drivers, container toolkit and device plugin"
        role: other
        why: "Drivers, container toolkit and device plugin are yours to install and patch (for example with the NVIDIA GPU Operator). If training nodes have no route out, their images and packages come from your own registry and package mirror."
        url: https://docs.nvidia.com/datacenter/cloud-native/gpu-operator/latest/install-gpu-operator-air-gapped.html
      - service: "Private container registry with scanning"
        role: registry
        why: "The image source training nodes pull from: framework and pipeline images arrive through it, are scanned there and are pulled by digest (for example Harbor with Trivy and proxy cache projects)."
        url: https://goharbor.io/docs/latest/administration/configure-proxy-cache/
      - service: "Identity provider for administrators and workloads"
        role: identity
        why: "Sign-in for the people who administer the pipeline, registry and cluster, and the OpenID Connect provider the object store trusts when it issues temporary credentials (for example Keycloak)."
        url: https://www.keycloak.org/docs/latest/server_admin/
      - service: "Secrets manager and signing keys with a protected root"
        role: secrets
        why: "Holds every secret and key the platform needs, the release signing key among them, and must itself be unsealed, backed up and audited (for example HashiCorp Vault or OpenBao). PKCS11 auto-unseal needs Vault Enterprise; OpenBao offers a pkcs11 seal through its KMS plugin."
        url: https://developer.hashicorp.com/vault/docs/configuration/seal/pkcs11
      - service: "Certificate issuance and renewal from an internal authority"
        role: keys
        why: "Issues and renews the TLS certificates for every service inside the boundary, with no public certificate service to lean on (for example cert-manager with your internal CA)."
        url: https://cert-manager.io/docs/
      - service: "Network policy enforcement and egress control"
        role: network
        why: "A network plugin enforces the policies, and outbound traffic, needed only by the steps that bring artefacts in, leaves only to approved destinations and is recorded (for example Cilium with a Squid forward proxy). Firewalls, routing and internal DNS around them are also yours."
        url: https://docs.cilium.io/en/stable/security/policy/index.html
      - service: "Databases behind the pipeline and the model registry"
        role: other
        why: "Run records, lineage and approvals live in databases you operate (for example those behind MLflow and Kubeflow Pipelines). They are the decision record, so they need patching, access control and tested backups."
        url: https://www.kubeflow.org/docs/components/pipelines/overview/
      - service: "Log collection, a log store and the SIEM"
        role: logging
        why: "Nothing collects logs unless you run it: a collector gathers cluster audit and workload records, a store keeps them, and the SIEM holds the detections (for example the OpenTelemetry Collector and Loki)."
        url: https://opentelemetry.io/docs/collector/
      - service: "Cluster and volume backup, off site"
        role: other
        why: "Backs up cluster resources and persistent volumes (for example Velero); the buckets, databases and the vault need their own backup and restore tests."
        url: https://velero.io/docs/main/
      - service: "Time sync, power, cooling and physical security"
        role: other
        why: "Token expiry, certificates and log order depend on synchronised clocks (for example chrony). Access to the halls, hardware disposal and spare capacity are now part of protecting the model."
        url: https://chrony-project.org/
    quickstart:
      - title: "Training jobs, for example Kubeflow Trainer: Runtime Guide"
        url: https://trainer.kubeflow.org/en/latest/operator-guides/runtime.html
      - title: "Pipelines, for example Kubeflow Pipelines: Object Store Configuration"
        url: https://www.kubeflow.org/docs/components/pipelines/operator-guides/configure-object-store/
      - title: "Model registry, for example MLflow: Authentication with Username and Password"
        url: https://mlflow.org/docs/latest/self-hosting/security/basic-http-auth/
    # >>> hosting options (compared against the vendor's pages; one is the mapping itself)
    hosting:
      - id: kubernetes
        kind: cluster
        name: "Kubernetes"
        url: https://www.kubeflow.org/docs/components/trainer/overview/
        asOf: "2026-11"
        mapped: true
        compare:
          runs: "Kubeflow Trainer turns your TrainJob into pods that run your training code on GPU nodes of a cluster your organisation operates."
          patching: "Your organisation patches the nodes, GPU drivers, Kubernetes and Kubeflow Trainer, and rebuilds the runtime and training images."
          data: "Training data, checkpoints and candidate weights stay in your own buckets and on your nodes, held by your organisation."
          network: "Pods accept and send all traffic by default; NetworkPolicy and Cilium rules limit a job to the mirrors and buckets it needs."
          identity: "A TrainJob's pods run as a Kubernetes ServiceAccount and receive a short-lived projected token that storage and secret services can verify."
          accepts: "Any container image; Trainer ships runtimes for PyTorch, DeepSpeed, JAX, MLX and XGBoost, and TorchTune runtimes for fine-tuning LLMs."
          workload: "A TrainJob runs until it finishes or reaches activeDeadlineSeconds; suspending it ends its pods, and its lifecycle guide describes no checkpoint mechanism."
          portability: "TrainJob and runtime objects are Kubernetes APIs that move to any conformant cluster with Kubeflow Trainer installed; the training image is unchanged."
          effort: "Your team operates the cluster, the GPU operator, Kubeflow Trainer, its runtimes and any queueing add-on, and is on call for failed jobs and nodes."
          fits: "Kubeflow describes Trainer as a Kubernetes-native platform for LLM fine-tuning and distributed training, from a single machine to large clusters."
        sources:
          - https://www.kubeflow.org/docs/components/trainer/overview/
          - https://trainer.kubeflow.org/en/latest/operator-guides/runtime.html
          - https://trainer.kubeflow.org/en/latest/user-guides/trainjob-lifecycle.html
          - https://kubernetes.io/docs/concepts/services-networking/network-policies/
          - https://kubernetes.io/docs/concepts/security/service-accounts/
      - id: slurm
        kind: cluster
        name: "Slurm Workload Manager"
        url: https://slurm.schedmd.com/overview.html
        asOf: "2026-11"
        compare:
          runs: "slurmd on each compute node starts your batch script, or an OCI container named with --container, under the Linux account that submitted the job."
          patching: "Your organisation patches the node operating systems, GPU drivers, the OCI runtime and Slurm itself, which has a major release every six months."
          data: "Training data, checkpoints and weights sit on storage that your nodes mount or reach; Slurm itself keeps only job records in its accounting database."
          network: "Slurm has no network policy and its containers use the host network, so outbound limits come from node firewalls and the data centre network."
          identity: "A job carries the submitter's UID and GID, which MUNGE or auth/slurm authenticates between hosts; a job gets no workload token of its own."
          accepts: "Any program or script; unprivileged OCI containers through runc, crun or nvidia-container-runtime, and Apptainer, Enroot or Charliecloud images."
          workload: "Queues jobs with time limits and GPUs requested as GRES; preemption cancels, requeues or suspends a job, and Slurm documents requeue, not checkpointing."
          portability: "Batch scripts and sbatch options are specific to Slurm; the training code and its container move unchanged if they were built as OCI images."
          effort: "Your team operates slurmctld, slurmdbd and its database, slurmd on every node, the shared user directory and keys, and the nodes themselves."
          fits: "Slurm describes itself as a cluster management and job scheduling system for Linux clusters that allocates nodes and queues contended work."
        sources:
          - https://slurm.schedmd.com/overview.html
          - https://slurm.schedmd.com/containers.html
          - https://slurm.schedmd.com/oci.conf.html
          - https://slurm.schedmd.com/gres.html
          - https://slurm.schedmd.com/preempt.html
          - https://slurm.schedmd.com/authentication.html
          - https://slurm.schedmd.com/cgroup.conf.html
          - https://slurm.schedmd.com/sbatch.html
          - https://slurm.schedmd.com/accounting.html
          - https://slurm.schedmd.com/job_container.conf.html
          - https://slurm.schedmd.com/rest.html
          - https://slurm.schedmd.com/quickstart_admin.html
          - https://slurm.schedmd.com/upgrades.html
          - https://slurm.schedmd.com/jwt.html
          - https://slurm.schedmd.com/pam_slurm_adopt.html
          - https://slurm.schedmd.com/slurm.conf.html
          - https://wiki.nftables.org/wiki-nftables/index.php/Configuring_chains
          - https://www.kubeflow.org/docs/components/trainer/overview/
        summary: "The training step leaves Kubernetes. A pipeline step submits a batch job to a Slurm cluster through slurmrestd or sbatch, and slurmd runs the training image as an unprivileged OCI container on GPU nodes. Curation, evaluation, the registry and signing stay as mapped. Slurm brings queueing, accounting and GPU scheduling; it brings no network policy, no per-job service account and no image pull, so node firewalls, Unix accounts, cgroup limits and staging of the image become yours to set up."
        bindings:
          - { block: trainJob, service: "Slurm batch job in an OCI container on GPU nodes", note: "Submitted with sbatch --container or through slurmrestd; GPUs are requested with --gpus, and each pipeline submits under its own Unix account.", url: https://slurm.schedmd.com/containers.html }
        dropSettings: [kubeflowTrainJobServiceAccount, k8sRuntimeClassSandbox]
        addSettings: [slurmAuthPlugin, slurmRestdJwt, slurmAccountingEnforce, slurmCgroupConstraints, slurmOciContainers, slurmNamespaceTmpfs, slurmPamAdopt, computeNodeEgressFirewall, slurmBundleDigestProlog, slurmPerRunStorageCredentials]
        differences:
          - at: pkgRegistry->trainJob
            text: "Slurm does not pull or copy images: the OCI bundle must already exist on the execution node, and without oci.conf --container has no effect. A staging step unpacks the approved image, at its digest, onto every GPU node or shared storage before the job is submitted, and nothing verifies it again at start unless you add a check."
            url: https://slurm.schedmd.com/containers.html
            change: "Slurm option only: insert a 'bundle staging' step on pkgRegistry->trainJob (mirror, then unpack onto the nodes or shared storage, then the job)."
        alsoNeeded:
          - service: "SlurmDBD with MySQL or MariaDB"
            role: logging
            why: "Holds the job and step accounting records; Slurm recommends SlurmDBD in front of the database."
            url: https://slurm.schedmd.com/accounting.html
          - service: "A directory with uniform UIDs and GIDs (for example LDAP)"
            role: identity
            why: "Slurm requires a uniform user and group name space, UIDs and GIDs included, across the cluster."
            url: https://slurm.schedmd.com/quickstart_admin.html
          - service: "MUNGE or auth/slurm key distribution"
            role: keys
            why: "Every host in the cluster must hold the shared authentication key, which you distribute, protect and rotate."
            url: https://slurm.schedmd.com/authentication.html
          - service: "An OCI runtime and bundle staging on the GPU nodes"
            role: registry
            why: "Slurm does not transfer bundles to compute nodes, so images are unpacked onto the nodes or shared storage with tools such as skopeo and umoci."
            url: https://slurm.schedmd.com/containers.html
          - service: "A TLS proxy in front of slurmrestd"
            role: ingress
            why: "Slurm says the REST API is not designed to be internet facing and recommends TLS 1.3 or later, and where possible an authenticating proxy, in front of it."
            url: https://slurm.schedmd.com/rest.html
        quickstart:
          - title: "Quick Start Administrator Guide"
            url: https://slurm.schedmd.com/quickstart_admin.html
          - title: "Containers Guide"
            url: https://slurm.schedmd.com/containers.html
          - title: "Generic Resource (GRES) Scheduling"
            url: https://slurm.schedmd.com/gres.html
