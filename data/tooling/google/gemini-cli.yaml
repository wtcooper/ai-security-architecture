      - mitigation: AML.M0028
        coverage: native
        verified: "2026-09-10"
        mechanism: >-
          tools.core allowlist, tools.confirmationRequired, per-server includeTools / excludeTools,
          mcp.allowed / mcp.excluded in the system settings file
        steps:
          - title: Allowlist built-in tools
            body:
              - Set tools.core in the system settings (for example ReadFileTool, GlobTool, ShellTool(ls));
                tools.exclude is deprecated in favour of the allowlist.
            url: https://geminicli.com/docs/cli/enterprise/
          - title: Scope MCP tools
            body:
              - Define mcpServers centrally and set mcp.allowed to the same names, or users can add their own;
                trim each server with includeTools / excludeTools and keep trust unset so calls still confirm.
            url: https://geminicli.com/docs/tools/mcp-server/
          - title: Keep confirmation on specific tools
            body:
              - tools.confirmationRequired forces approval for named tools even when tools.allowed would skip
                it.
            url: https://geminicli.com/docs/reference/configuration/
        evidence: []
