# Illustrative organization data, not a deployment claim about a real company.
# Map each organization capability once; MITRE and CoSAI links roll up automatically.
# Re-authored from the pre-migration records preserved in archive/ (migration.original[]).
organisation:
  name: Example Corp
  shortName: EX
capabilities:
  - id: EX-DLP
    title: Example endpoint DLP agent
    capability: tech-dlp
    surfaces:
      surfaceEndpoint:
        status: enabled
        note: Inspects prompts and uploads in the browser and the desktop apps.
  - id: EX-CASB
    title: Example CASB
    capability: tech-casb
    surfaces:
      surfaceSaas:
        status: inProgress
        note: Inline for sanctioned vendors; shadow AI only discovered, not blocked.
  - id: EX-GUARDRAILS
    title: Example AI gateway guardrails
    capability: tech-llm-guardrails
    surfaces:
      surfaceEndpoint:
        status: gap
        note: No runtime guardrail in front of the endpoint agents.
      surfaceCloud:
        status: inProgress
        note: Example AI gateway guardrails on the hosted inference path.
  - id: EX-SWG
    title: Example SSE / secure web gateway
    capability: tech-swg
    surfaces:
      surfaceEndpoint:
        status: enabled
        note: Deny-by-default egress with named AI providers allowed.
  - id: EX-FIREWALL
    title: Cloud network policy
    capability: tech-firewalls
    surfaces:
      surfaceCloud:
        status: enabled
        note: Cloud network policy around hosted AI workloads.
  - id: EX-SANDBOX
    title: Agent execution sandbox
    capability: tech-sandbox
    surfaces:
      surfaceEndpoint:
        status: gap
        note: No fleet-wide sandbox packaging yet; relies on each product's own sandbox.
  - id: EX-AUTH
    title: Example IdP with SSO and MFA
    capability: tech-authentication
    surfaces:
      surfaceEndpoint:
        status: enabled
        note: Example IdP enforces SSO and MFA for AI tools on managed devices.
  - id: EX-IGA
    title: Example IdP with SCIM
    capability: tech-iga
    surfaces:
      surfaceSaas:
        status: enabled
        note: Example IdP provisions and deprovisions AI SaaS seats through SCIM.
  - id: EX-ACCESS
    title: AI access policy service
    capability: tech-access
    surfaces: {}
  - id: EX-SIEM
    title: Example SIEM
    capability: tech-siem
    surfaces:
      surfaceEndpoint:
        status: inProgress
        note: OTel export from a pilot group only.
  - id: EX-AGENT
    title: Agent tool allowlists and action policy
    capability: tech-agentic-security
    surfaces:
      surfaceEndpoint:
        status: inProgress
        note: MDM-pushed allowlists per product; no central MCP registry yet.
  - id: EX-PAM
    title: Agent credential broker
    capability: tech-pam
    surfaces: {}
  - id: EX-AISPM
    title: AI asset posture management
    capability: tech-ai-spm
    surfaces: {}
  - id: EX-EDR
    title: Endpoint detection and response
    capability: tech-endpoint
    surfaces: {}
  - id: EX-TPRM
    title: AI vendor risk (TPRM) platform
    capability: tech-vendor-risk
    surfaces: {}
  - id: EX-GRC
    title: AI governance register
    capability: tech-audit
    surfaces: {}
  - id: EX-KMS
    title: Encryption and key management
    capability: tech-encryption
    surfaces: {}
  - id: EX-EVALS
    title: Agent evaluation harness
    capability: tech-llm-benchmarking
    surfaces: {}
