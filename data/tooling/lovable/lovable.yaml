    controls:
      - mitigation: D3-APA
        coverage: native
        mechanism: >-
          Default published app access (Anyone or Workspace), External viewer invites, Restrict publishing
          externally in Block mode, External project collaborators, IdP group restriction, SCIM and the Third-party
          MCP clients switch, enforced by Lovable at publish and sign-in
        steps:
          - title: Default new apps to the workspace
            body:
              - >-
                In Workspace settings › Security › Privacy & security › Publishing set Default published app access
                to Workspace and External viewer invites to Specific email domains only.
            url: https://docs.lovable.dev/features/privacy-and-security-settings#default-published-app-access
          - title: Keep public publishing with owners
            body:
              - >-
                Turn on the Restrict publishing externally policy in Block mode with Who can publish externally set
                to Owners only, or in Require approval mode where most apps go public after a check.
            url: https://docs.lovable.dev/features/workspace-policies#restrict-publishing-externally
          - title: Let only approved groups build
            body:
              - >-
                Map the IdP groups allowed to build under Identity › Provisioning groups, enable Group restriction,
                set External project collaborators to None allowed and turn on SCIM.
            url: https://docs.lovable.dev/features/business/sso#map-idp-groups-to-workspace-roles
        note: >-
          Native on the rule applied to the three builders onboarded on 2026-11-25: an admin sets the default
          audience of new apps and stops non-admins publishing beyond the workspace, and the platform enforces both
          at publish. Boundaries: the Workspace audience needs Business and the policy needs Enterprise; neither
          changes apps already published; preview links bypass the audience until disabled (Enterprise); a visitor
          removed from an audience keeps an open app for up to an hour; the audience check is not on the
          browser-to-database path, where the row rules decide.
        verified: "2026-11-25"
      - mitigation: D3-AVE
        coverage: partial
        mechanism: >-
          Automatic checks (database rules, public MCP tools, vulnerable dependencies) run when the publish dialog
          opens; Block publishing with critical issues and the sensitive data publishing policy make findings
          blocking; scheduled advanced checks (Enterprise)
        steps:
          - title: Block publishing on critical findings
            body:
              - >-
                Enable Block publishing with critical issues under Privacy & security › Publishing; it applies to
                the dialog, the chat, Slack, the API and the MCP server.
            url: https://docs.lovable.dev/features/privacy-and-security-settings#block-publishing-with-critical-issues
          - title: Block publishing with unreviewed personal data
            body:
              - >-
                Enable Sensitive data scanning, then the Restrict publishing with unresolved sensitive data
                findings policy in Block mode.
            url: https://docs.lovable.dev/features/workspace-policies#restrict-publishing-with-unresolved-sensitive-data-findings
          - title: Rescan published apps on a schedule
            body:
              - >-
                In Security center › Security automation set Projects to Published projects and Cadence to Weekly.
            url: https://docs.lovable.dev/features/security-center#schedule-security-scans-enterprise-only
        note: >-
          Partial on the rule applied to every builder on this drawing: native would need a block on scan findings
          that only someone other than the maker can clear. Here a finding can be ignored from the project's Security
          view with a reason (who and when are recorded), and ignored findings no longer block; the block uses the latest results even when
          stale; the publish dialog runs only the automatic checks, not the advanced code review; and Lovable states
          that passing the block does not prove the app is secure. Off by default outside new Enterprise
          workspaces.
        verified: "2026-11-25"
      - mitigation: cap-data-access-governance
        coverage: partial
        mechanism: >-
          Row-level security policies the agent writes per table, the Database security check for missing and
          permit-all rules, Block public storage buckets, and app user connectors that make each visitor sign in
          with their own account
        steps:
          - title: Read every table's policies
            body:
              - >-
                Open More › Database › Manage › Policies in each project with real data and check that each rule
                limits rows to their owner or role, not to anyone signed in.
            url: https://docs.lovable.dev/features/database-access#row-level-security-rls-policies
          - title: Keep storage private
            body:
              - Leave Block public storage buckets enabled under Privacy & security › Data protection.
            url: https://docs.lovable.dev/features/privacy-and-security-settings#block-public-storage-buckets
          - title: Reach systems of record as the visitor
            body:
              - >-
                Set Who can create connections and clients to No one for app + chat connectors to systems of record
                and offer them as app user connectors.
            url: https://docs.lovable.dev/integrations/admin-controls#who-can-create-connections-and-clients
        note: >-
          Partial on the rule for this drawing: native would need the platform to refuse publishing while a table
          lacks a rule limiting rows to the visitor, and connectors that can only read as the visitor. Lovable's
          check flags a table without per-row rules and a rule that lets everyone in, and with the publishing
          block on its critical findings stop a publish unless ignored, but the rules are the agent's output and
          the check reports common mistakes rather than intent. Connection-level sharing on a connector is not
          enforced after publishing, and projects on their own Supabase are outside these settings.
        verified: "2026-11-25"
      - mitigation: D3-CH
        coverage: partial
        mechanism: >-
          Project Secrets (write-only, injected into edge functions, VITE_ names refused), keys pasted in the chat
          offered as connectors, connector credentials held in the connector gateway, Build secrets, IP allowlists
          on workspace API keys and the GitHub app limited to selected repositories
        steps:
          - title: Keep build tokens out of projects
            body:
              - Put private-registry and build tokens in Workspace settings › Build & deploy › Build secrets.
            url: https://docs.lovable.dev/features/build-secrets
          - title: Allowlist workspace API keys
            body:
              - Enable IP allowlists required under Privacy & security › Access › Public API keys.
            url: https://docs.lovable.dev/features/privacy-and-security-settings#ip-allowlists-required
          - title: Sync only to named repositories
            body:
              - >-
                Install the Lovable GitHub app with Only select repositories from Workspace settings › Build &
                deploy › Git.
            url: https://docs.lovable.dev/integrations/github
        note: >-
          Partial on the rule for this drawing: the platform keeps outside keys in a server-side store and the scan
          flags keys in client code, but no admin setting refuses a publish while the front end holds a key, and
          each connector's grant sits in the vendor's gateway, where nobody can read it back and a leaked grant is
          replaced by reconnecting at the provider. The pages read do not say a key pasted into the chat is removed from the chat history,
          so rotate it. The LOVABLE_API_KEY rotation leaves the old key valid for up to an hour.
        verified: "2026-11-25"
      - mitigation: cap-staged-rollout-gate
        coverage: partial
        mechanism: >-
          Drafts with their own backend and example data (optional, per change), Preview link sharing (disable on
          Enterprise), version history for code, daily database backups kept about 14 days
        steps:
          - title: Turn off preview links
            body:
              - Disable Preview link sharing under Privacy & security › Access › Sharing (Enterprise).
            url: https://docs.lovable.dev/features/privacy-and-security-settings#preview-link-sharing
          - title: Change data structure in a draft
            body:
              - >-
                Build changes that touch the database in a draft that has its own backend, and export the database
                before accepting it.
            url: https://docs.lovable.dev/features/drafts
          - title: Know what restore covers
            body:
              - >-
                Restore data from More › Database › Manage › Backups; a version revert restores code only.
            url: https://docs.lovable.dev/features/database-backups
        note: >-
          Partial on the rule for this drawing: native where the agent cannot change the live app's data and live
          data can be restored apart from code. In Lovable the main version of a project works on the live backend,
          a draft gets its own backend only on some projects and only when the maker uses one, accepting a draft
          changes the live structure at once, secrets and connected services use live values in drafts, and
          backups are daily rather than point in time.
        verified: "2026-11-25"
      - mitigation: D3-MFA
        coverage: partial
        mechanism: >-
          Enforce SSO with a session duration for the workspace, Require two-factor authentication (Enterprise),
          and App login methods limiting apps' own sign-in to SSO and Lovable workspace identity
        steps:
          - title: Enforce SSO for the builder
            body:
              - >-
                In Workspace settings › Access › Identity enable Enforce SSO with a Session duration, and require MFA
                in your identity provider.
            url: https://docs.lovable.dev/features/business/sso#enforce-sso
          - title: Limit app sign-in methods
            body:
              - >-
                Under Privacy & security › Publishing › App login methods allow only SSO and Lovable workspace
                identity in workspaces for internal apps.
            url: https://docs.lovable.dev/features/privacy-and-security-settings#app-login-methods
          - title: Require 2FA from external collaborators
            body:
              - Set Require two-factor authentication to External collaborators.
            url: https://docs.lovable.dev/features/privacy-and-security-settings#require-two-factor-authentication
        note: >-
          Partial on this drawing's rule: native where the admin can make the identity provider the only sign-in for
          makers and for visitors of workspace apps, the second factor being the identity provider's as the pin
          states. Enforce SSO covers makers, and App login methods covers apps' own sign-in; but visitors of an app
          published to the workspace sign in to Lovable, the SSO page does not say Enforce SSO gates them, and the
          2FA requirement explicitly does not. Enforce SSO is per workspace: Require SSO for the domain and Block
          workspace creation are set by Lovable support.
        verified: "2026-11-25"
      - mitigation: AML.M0029
        coverage: partial
        mechanism: >-
          Workspace policies (Enterprise): Restrict publishing externally, Require approval to publish apps that use
          connectors, Restrict publishing by external collaborators and Restrict Lovable backend services, decided in
          the Action center by an admin or owner other than the requester
        steps:
          - title: Require approval to go public
            body:
              - >-
                Turn on Restrict publishing externally in Require approval mode, Who publishes without approval set
                to Owners only, and the shortest Approval lasts.
            url: https://docs.lovable.dev/features/workspace-policies#restrict-publishing-externally
          - title: Require approval for apps with connectors
            body:
              - Turn on Require approval to publish apps that use connectors with All connector types.
            url: https://docs.lovable.dev/features/workspace-policies#require-approval-to-publish-apps-that-use-connectors
          - title: Decide in the Action center
            body:
              - >-
                Review each request's audience change, connectors and screenshot in the Action center before
                approving.
            url: https://docs.lovable.dev/features/action-center
        note: >-
          Partial on the rule for this drawing: native where an admin's approval is required for each publish
          beyond the workspace and the maker cannot approve their own. Lovable's approval covers the app, not a
          version: later updates publish without a new request until the audience, connectors or role change, or
          (for public apps only) Approval lasts runs out. Workspace admins and owners are exempt, and the request
          dialog lists the audience change and connectors but no scan results.
        verified: "2026-11-25"
      - mitigation: AML.M0028
        coverage: native
        mechanism: >-
          Per-connector Who can create connections and clients (No one, Admins, Editors & admins) for app + chat
          and app user connectors, chat connectors enabled one by one, Custom MCP, Local desktop MCP servers,
          Connector requests and approval to publish apps with connectors
        steps:
          - title: Allow only approved connectors
            body:
              - >-
                In Connectors › Admin settings set every connector you have not approved to No one and the rest to
                Admins.
            url: https://docs.lovable.dev/integrations/admin-controls#who-can-create-connections-and-clients
          - title: Close custom and local MCP
            body:
              - >-
                Disable Custom MCP under Chat connectors and Local desktop MCP servers under Privacy & security ›
                Integrations.
            url: https://docs.lovable.dev/integrations/admin-controls#chat-connector-controls
          - title: Route requests to admins
            body:
              - Enable the Connector requests policy so editors ask instead of pasting keys.
            url: https://docs.lovable.dev/features/workspace-policies#connector-requests
        note: >-
          Native on the rule for this drawing: an admin allows or blocks each connector for the workspace and the
          platform enforces it. Boundaries: scopes are those of the account that made the connection ("access
          mirrors the connected account"), so least privilege is the grant at the service; who may use a connection
          is chosen by its creator and is not enforced after publishing; a key the maker stores as a project secret
          calls an API without any connector.
        verified: "2026-11-25"
      - mitigation: D3-AI
        coverage: native
        mechanism: >-
          Security insights (owner, publish status, connectors, secrets, activity, findings; CSV export), the Action
          center's Missing owners finding, project events, and the workspace security project inventory API
          (Enterprise)
        steps:
          - title: Export the project inventory
            body:
              - >-
                In Security center › Security insights filter to published projects and export the table to CSV for
                your inventory.
            url: https://docs.lovable.dev/features/security-insights
          - title: Reassign apps whose owner left
            body:
              - Use Assign owners on the Missing owners finding in the Action center.
            url: https://docs.lovable.dev/features/action-center
          - title: Stream project events
            body:
              - Send project.published, project.deleted and project.workspace_transferred to your inventory from Events & Hooks.
            url: https://docs.lovable.dev/api-reference/events-and-hooks
        note: >-
          Native on the rule for this drawing: the admin console lists every project with its owner, audience and
          connectors and exports the list. Boundaries: Business or Enterprise; personal-data columns need
          Enterprise; projects in members' personal or other workspaces are not listed.
        verified: "2026-11-25"
      - mitigation: cap-shadow-ai-discovery
        coverage: external
        mechanism: >-
          Nothing in the product lists Lovable accounts or workspaces on the organisation's domain outside the
          company workspace; Block workspace creation, Require SSO for the domain, Workspace discovery and Editor
          project transfers are prevention
        evidence:
          - title: Restrict a domain to SSO (domain lock)
            url: https://docs.lovable.dev/features/workspace-identity#restrict-a-domain-to-sso-domain-lock
          - title: Privacy & security settings (Workspace discovery, Editor project transfers)
            url: https://docs.lovable.dev/features/privacy-and-security-settings
        note: >-
          External by the rule applied to every vendor: the product lists no accounts or apps made outside the
          workspace. Prevention, credited here only: Block workspace creation and Require SSO (Enterprise, enabled
          by Lovable support or an org admin) stop new personal workspaces and password accounts on the domain,
          though existing accounts keep working. Discovery is the SSE or CASB's (lovable.app and lovable.dev in
          proxy logs) and certificate-transparency searches for your name on lovable.app.
        verified: "2026-11-25"
      - mitigation: cap-agent-kill-switch
        coverage: partial
        mechanism: >-
          Unpublish from project settings, the dashboard's bulk action or the API; Pause database; delete a
          connection (its secrets are removed and apps stop working); rotate LOVABLE_API_KEY
        steps:
          - title: Take the app offline
            body:
              - >-
                Select the projects on the dashboard and choose Unpublish, or call DELETE
                /v1/projects/{project_id}/publish with a projects:write key.
            url: https://docs.lovable.dev/features/publish#unpublish-your-project
          - title: Stop its data
            body:
              - Pause the database under More › Database › Manage › Settings so the app can no longer read or write.
            url: https://docs.lovable.dev/features/database-pause-remove#pause-a-database-youre-not-using
          - title: Cut its connectors
            body:
              - Delete the app's connections, which removes their secrets at once, and rotate LOVABLE_API_KEY.
            url: https://docs.lovable.dev/integrations/security#data-retention-and-deletion-policy
        note: >-
          Partial on the rule for this drawing: native where one admin action outside the agent takes any app and
          its data path offline, documented. Unpublishing makes the live URL inaccessible, but the database keeps
          answering the publishable key until paused, a separate action; admins cannot unpublish a Restricted
          project they were not invited to (owners can); a rotated project key stays valid up to an hour; and an app
          outside the workspace needs Lovable's abuse route.
        verified: "2026-11-25"
      - mitigation: AML.M0024
        coverage: native
        mechanism: >-
          Workspace audit logs (Enterprise, 13 weeks) covering publishes with audience and commit_sha, membership,
          SSO, SCIM, secrets, connectors and prompts, exported every hour or three hours to Splunk, Azure Log
          Analytics, Amazon S3, Google Cloud Storage or Azure Blob Storage
        steps:
          - title: Export audit logs to your SIEM
            body:
              - In Workspace settings › Security › Data exports create an hourly export of Audit logs to your SIEM or bucket.
            url: https://docs.lovable.dev/features/data-exports
          - title: Alert on audience changes
            body:
              - >-
                Alert on Project published externally, policy changes and SSO changes in the exported events.
            url: https://docs.lovable.dev/features/audit-logs
        note: >-
          Native on the rule for this drawing: an admin sends the publish, audience and connector events to the
          organisation's own store. Boundaries: Enterprise only; connector request records (method, path, status;
          no bodies) are viewable per project for 90 days and are not in the export source list.
        verified: "2026-11-25"
      - mitigation: cap-ai-vendor-assessment
        coverage: external
        mechanism: >-
          SOC 2 Type II, ISO 27001:2022 and AIUC-1 evidence and the subprocessor list on the trust portal feed the
          organisation's third-party risk platform
        evidence:
          - title: Lovable for Enterprise (compliance)
            url: https://docs.lovable.dev/introduction/lovable-for-enterprise
          - title: "Lovable: Our response to the April 2026 incident"
            url: https://lovable.dev/blog/our-response-to-the-april-2026-incident
          - title: Using npm packages
            url: https://docs.lovable.dev/tips-tricks/npm-packages
        note: >-
          External, as for every vendor: the assessment, its evidence and the reassessment trigger live in the
          organisation's third-party risk platform. Questions this product raises: isolation of public and private
          projects (the 2026 regression exposed public projects' code and chats for 11 weeks and the bug-bounty
          triage closed the reports), the shared sign-in and connector gateway every app depends on, how builds
          choose and check npm packages (Lovable installs any public package), and the zero-retention model list.
          The trust portal renders client-side and was not read.
        verified: "2026-11-25"
    advisories:
      - title: "CVE-2025-48757: generated apps query Supabase with the anon key and missing row-level security policies allow reads and writes (Matt Palmer)"
