        coverage: partial
        mechanism: >-
          allowedWorkspaceFolders and Read deny rules limit what can be read; connector write permissions can
          be removed; Inference hooks (Enterprise) inspect prompts inline; coworkEgressAllowedHosts limits
          where data can go
        steps: &a1
          - title: Fence data paths
            body:
              - Combine allowedWorkspaceFolders, disabledBuiltinTools Read rules for secret paths and connector read-only
                permissions; add Inference hooks for inline DLP on Enterprise.
            url: https://claude.com/docs/third-party/claude-desktop/configuration
        note: >-
          Folder scoping, deny rules and the egress allowlist restrict paths; Inference hooks are the only
          content-inspection path and only for prompts the organisation's server governs. File contents read
          inside the VM are not scanned.
        verified: 2026-09-10
