# Microsoft Azure: the first-party cloud architectures as built on Azure, and the security-relevant
# settings that secure them. One settings library per cloud, so a setting used by several
# architectures is one row with one status in data/status.yaml; each implementation binds the
# drawing's blocks to services and lists the settings that apply to it.
#
# Every row follows data/tooling/BASELINE.md: the setting's name as Microsoft's page gives it, a
# url that resolved on its verified date, the baseline value, and the capabilities on the drawing
# it delivers. setVia "code" marks a control no Azure setting provides: the organisation builds it
# into its own agent.
id: cloudAzure
name: Microsoft Azure
short: Azure

settings:
  # --- Identity & access ---------------------------------------------------------------
  - id: entraAssignmentRequired
    name: Assignment required
    where: Microsoft Entra admin center › Enterprise applications › (your app) › Properties
    setVia: [identityProvider]
    area: identity
    default: "No"
    recommended: "Yes — assigned to the groups that use the app"
    why: Only assigned users and groups can get a token for the app at all, so access is a group decision rather than every account in the tenant.
    mitigations: [D3-APA]
    url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/application-properties
    verified: "2026-10-30"
  - id: appServiceRequireAuth
    name: App Service authentication — Require authentication
    where: App Service › Authentication › Restrict access
    setVia: [cloudPolicy]
    area: identity
    default: Unauthenticated access allowed
    recommended: Require authentication, Microsoft Entra ID as the provider
    why: The front end rejects every unauthenticated request before your code runs, and binds each session to an Entra identity.
    mitigations: [D3-APA]
    url: https://learn.microsoft.com/en-us/azure/app-service/overview-authentication-authorization
    verified: "2026-10-30"
  - id: agentManagedIdentity
    name: Managed identity on the agent's container app
    where: Container Apps › (agent app) › Identity
    setVia: [cloudPolicy]
    area: identity
    default: None
    recommended: System-assigned, granted only the roles the agent needs
    why: The agent authenticates to the gateway, the model and its stores with a platform-issued identity — no secret in its configuration to steal.
    mitigations: [D3-AA, D3-CH]
    url: https://learn.microsoft.com/en-us/azure/container-apps/managed-identity
    verified: "2026-10-30"
  - id: foundryDisableLocalAuth
    name: disableLocalAuth
    where: Foundry (Azure AI services) resource property, via Bicep, ARM, Terraform or PowerShell
    setVia: [cloudPolicy, apiCli]
    area: identity
    default: "false (API keys allowed)"
    recommended: "true"
    why: Model calls need an Entra token; an API key copied from a config file opens nothing. Enforce it fleet-wide with Azure Policy.
    mitigations: [D3-CH]
    url: https://learn.microsoft.com/en-us/azure/ai-services/disable-local-auth
    verified: "2026-10-30"
  - id: apimValidateToken
    name: validate-azure-ad-token policy
    where: API Management › APIs and MCP servers › Inbound processing
    setVia: [cloudPolicy]
    area: identity
    default: No policy
    recommended: "On every model API, MCP server and A2A agent API, checking the caller's identity and a required role. On an MCP server the policy covers all tools at once, so check the role each tool needs in the tool server's own handlers"
    why: "The gateway verifies who is calling before any model or tool call goes through. It cannot refuse a single tool that the caller's role does not cover; that check belongs in the tool server."
    mitigations: [D3-AA, AML.M0028]
    url: https://learn.microsoft.com/en-us/azure/api-management/validate-azure-ad-token-policy
    verified: "2026-11-18"
  - id: apimCredentialManager
    name: Credential manager (user-delegated connections)
    where: API Management › Credential manager
    setVia: [cloudPolicy]
    area: identity
    default: Not configured
    recommended: Downstream OAuth tokens held by API Management per user; the agent never holds them
    why: Calls to SaaS tools run with the signed-in user's own grant, exchanged at the gateway, so the agent cannot reuse one user's access for another.
    mitigations: [D3-CTS]
    url: https://learn.microsoft.com/en-us/azure/api-management/credentials-overview
    verified: "2026-10-30"
  - id: serviceBusSenderRole
    name: Azure Service Bus Data Sender
    where: Service Bus namespace › (trigger queue) › Access control (IAM)
    setVia: [cloudPolicy]
    area: identity
    recommended: Assigned at the queue scope, only to the identities allowed to start a run; nothing at namespace scope
    why: Who can put work on the agent's queue is a named role assignment on that one queue, so starting a run is itself an authorization decision.
    mitigations: [D3-APA]
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/authenticate-application
    verified: "2026-10-30"
  - id: serviceBusDisableLocalAuth
    name: Local Authentication (disableLocalAuth)
    where: Service Bus namespace › Overview › Local Authentication; disableLocalAuth in Bicep or ARM
    setVia: [cloudPolicy, apiCli]
    area: identity
    default: "Enabled (SAS keys accepted)"
    recommended: Disabled
    why: Only an Entra identity holding the sender role can start a run; a SAS connection string copied from a config file starts nothing.
    mitigations: [D3-APA]
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/disable-local-authentication
    verified: "2026-10-30"
  - id: entraAgentIdentity
    name: Agent identities (Microsoft Entra Agent ID)
    where: "Microsoft Entra admin center › Entra ID › Agents › Agent identities › New agent identity (Preview); or Microsoft Graph"
    setVia: [identityProvider, apiCli]
    area: identity
    recommended: One agent identity per agent, created from a blueprint whose credential is a managed identity, each with an owner and a sponsor
    why: Every agent is a separately attributable, separately revocable principal in the directory — not one service account the whole system acts as.
    mitigations: [D3-AA]
    url: https://learn.microsoft.com/en-us/entra/agent-id/create-delete-agent-identities
    verified: "2026-11-18"
  - id: entraAgentObo
    name: On-behalf-of flow (agent identities)
    where: Agent code, through Microsoft.Identity.Web or the Microsoft Entra ID Auth SDK (sidecar)
    setVia: [identityProvider, code]
    area: identity
    default: Not configured
    recommended: Each agent exchanges the user's token for its own token, scoped to its task's resource; no token is handed from one agent to the next
    why: Authority narrows at each hop — a specialist holds a token for its own step, never the caller's or the supervisor's.
    mitigations: [D3-CTS]
    url: https://learn.microsoft.com/en-us/entra/agent-id/agent-on-behalf-of-oauth-flow
    verified: "2026-10-30"
  - id: entraApplicationIdUri
    name: "Application ID URI"
    where: "Microsoft Entra admin center › App registrations › (MCP server) › Expose an API"
    setVia: [identityProvider]
    area: identity
    recommended: "An Application ID URI that uniquely identifies the server, repeated exactly as the resource value in the server's protected resource metadata. Microsoft's guidance supports v2.0 access tokens only"
    why: "The server accepts only tokens whose audience is this URI, so one minted for another resource is refused. The same metadata names the authorization server, https://login.microsoftonline.com/<tenant>/oauth21/2026-08."
    mitigations: [D3-CTS]
    url: https://learn.microsoft.com/en-us/entra/agent-id/secure-mcp-server-with-entra-id
    verified: "2026-11-18"
  - id: entraApiScopes
    name: Scopes (Expose an API › Add a scope)
    where: Microsoft Entra admin center › App registrations › (MCP server) › Expose an API
    setVia: [identityProvider]
    area: identity
    recommended: "Expose only the delegated scopes MCP clients need; Microsoft's example is a single mcp.access scope. Splitting scopes per class of operation and who may consent are your own design choices, and the server must check the scp claim before it runs a tool"
    why: "A client is granted only the scopes it asked for and was consented to, and the server checks the scope before it runs a tool."
    mitigations: [AML.M0028]
    url: https://learn.microsoft.com/en-us/entra/agent-id/secure-mcp-server-with-entra-id
    verified: "2026-11-18"
  - id: entraAppRoles
    name: "App roles (Allowed member types set to Applications)"
    where: "Microsoft Entra admin center › Entra ID › App registrations › (your API) › App roles › Create app role; assigned to each calling application under its API permissions › Add a permission › My APIs, then Grant admin consent, or with Microsoft Graph"
    setVia: [identityProvider]
    area: identity
    recommended: "A narrow role per autonomous caller, assigned individually, and defined only if the server supports app-only access; no tenant-wide application permission"
    why: "A workload with no user behind it gets only the roles assigned to its own identity, carried in the token's roles claim, with no borrowed user authority."
    mitigations: [D3-AA]
    url: "https://learn.microsoft.com/en-us/entra/identity-platform/howto-add-app-roles-in-apps"
    verified: "2026-11-18"
  - id: entraCertificateCredentials
    name: Certificate credentials (client assertion)
    where: Microsoft Entra admin center › App registrations › (client) › Certificates & secrets › Certificates
    setVia: [identityProvider]
    area: identity
    recommended: A certificate credential on every non-interactive client; no client secrets
    why: The client proves possession of a private key (private_key_jwt) rather than presenting a shared secret that can be copied.
    mitigations: [D3-AA]
    url: https://learn.microsoft.com/en-us/entra/identity-platform/certificate-credentials
    verified: "2026-10-30"
  - id: entraObo
    name: On-behalf-of (OBO) flow
    where: Your server code, through MSAL or Microsoft.Identity.Web
    setVia: [code]
    area: identity
    default: Not used
    recommended: A handler that calls an upstream API exchanges the inbound token for a downstream token; the inbound token is never forwarded
    why: The caller's token stops at this server, so it cannot be replayed against another API, and each downstream call is a logged delegation step.
    mitigations: [D3-CTS]
    url: https://learn.microsoft.com/en-us/entra/identity-platform/v2-oauth2-on-behalf-of-flow
    verified: "2026-10-30"
  - id: entraRevokeSessions
    name: Revoke-MgUserSignInSession (revoke refresh tokens)
    where: Microsoft Graph PowerShell, or Microsoft Entra admin center › Users › (user) › Revoke sessions
    setVia: [identityProvider, apiCli]
    area: identity
    default: Access tokens last 1 hour
    recommended: Part of the leaver and incident runbook, with the default 1-hour access-token lifetime as the measured revocation delay
    why: Refresh tokens stop at once and issued access tokens expire within the hour, so a revoked grant cannot keep calling the server.
    mitigations: [D3-CR]
    url: https://learn.microsoft.com/en-us/entra/identity/users/users-revoke-access
    verified: "2026-10-30"
  - id: keyVaultReferences
    name: Key Vault references
    where: App Service or Functions › Environment variables › "@Microsoft.KeyVault(...)"; the app's managed identity holds Key Vault Secrets User
    setVia: [cloudPolicy]
    area: identity
    recommended: Every upstream credential a handler uses held in Key Vault, one per upstream, referenced without a version so rotation is picked up
    why: No upstream secret sits in app settings or code, and rotating one in Key Vault reaches the server without a redeploy.
    mitigations: [D3-CH]
    url: https://learn.microsoft.com/en-us/azure/app-service/app-service-key-vault-references
    verified: "2026-10-30"
  - id: amlComputeIdentity
    name: Compute cluster managed identity (identity-based data access)
    where: Azure Machine Learning › Compute › (training cluster) › Managed identity; datastores set to identity-based access
    setVia: [cloudPolicy, apiCli]
    area: identity
    recommended: A user-assigned identity per training workload, granted read on its approved dataset and write on its own output container — never the registry or the signing key
    why: The run reads and writes as its own identity, checked by each store, and holds nothing that could promote or sign what it produced.
    mitigations: [D3-AA]
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-identity-based-service-authentication
    verified: "2026-10-30"
  - id: kvSigningCryptoUser
    name: Key Vault Crypto User (on a dedicated signing vault)
    where: Key Vault (signing vault, Azure RBAC permission model) › Access control (IAM)
    setVia: [cloudPolicy]
    area: identity
    recommended: Assigned only to the promotion pipeline's identity, which runs after a separate human approval
    why: Only the promotion step can produce a release signature, so a signed model proves the gate was passed — the training job cannot sign its own output.
    mitigations: [AML.M0013]
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-guide
    verified: "2026-10-30"
  - id: aksWorkloadIdentity
    name: Microsoft Entra Workload ID (AKS)
    where: "AKS cluster OIDC issuer and workload identity; a Kubernetes service account per trust group or namespace, federated to its own user-assigned identity"
    setVia: [cloudPolicy, configFile]
    area: identity
    recommended: "Every rollout pod runs under its trust group's service account, federated to a narrowly scoped identity; no credential in the image. A managed identity takes at most 20 federated identity credentials and a new one takes a few seconds to propagate, so do not create a service account and credential per rollout"
    why: "A rollout presents a short-lived projected token that each platform service verifies, so a token stolen from one sandbox opens nothing outside its own trust group."
    mitigations: [D3-AA]
    url: https://learn.microsoft.com/en-us/azure/aks/workload-identity-overview
    verified: "2026-11-18"

  # --- Data & retention ----------------------------------------------------------------
  - id: cosmosConversationTtl
    name: DefaultTimeToLive on the conversation container
    where: Azure Cosmos DB › (container) › Settings › Time to Live
    setVia: [cloudPolicy, apiCli]
    area: data
    default: Off (items never expire)
    recommended: 30 days
    why: Conversation state ages out instead of accumulating client material indefinitely in the agent's memory.
    mitigations: [AML.M0031]
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/time-to-live
    verified: "2026-10-30"
  - id: searchDocumentAccess
    name: Document-level access control (permission filters)
    where: "Foundry IQ (Azure AI Search) › index definition › permission filter fields; queries carry the user's token in x-ms-query-source-authorization"
    setVia: [apiCli, code]
    area: data
    default: "Off"
    recommended: "On for every index that holds permissioned content, using REST API 2026-10-01. The filter needs a signed-in user's delegated token, which an unattended run does not have; give an unattended agent an index holding only content it may read, or apply security filters in your own code"
    why: "Retrieval returns only documents the asking user may read, so the index cannot become a way round the source system's permissions. An application or managed identity is not a supported permission subject, so runs without a user are not covered."
    mitigations: [cap-data-access-governance, cap-retrieval-grounding-checks]
    url: https://learn.microsoft.com/en-us/azure/search/search-document-level-access-overview
    verified: "2026-11-18"
  - id: groundednessDetection
    name: "Groundedness detection (retires 30 April 2027)"
    where: Azure AI Content Safety API, called on answers drawn from retrieved documents
    setVia: [apiCli, code]
    area: data
    default: Not called
    recommended: "On for answers built from retrieval until the feature retires on 30 April 2027. Before then, move the check to Microsoft Foundry evaluation tooling or to your own grounding check that uses an LLM or a system prompt"
    why: "An answer that strays from its sources, or was steered away from them, is flagged before the user acts on it. Microsoft retires this feature on 30 April 2027 and it supports English content only, so plan the replacement now."
    mitigations: [cap-retrieval-grounding-checks]
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-safety/concepts/groundedness
    verified: "2026-11-18"
  - id: piiRedaction
    name: "PII detection (Azure Language)"
    where: "Azure Language API (Azure Language in Foundry Tools), called before a turn is written to memory"
    setVia: [apiCli, code]
    area: data
    default: Not called
    recommended: Redact before storing conversation turns
    why: Personal data a user pasted is not kept in the thread for every later turn — and every later reader — to see.
    mitigations: [cap-sensitive-data-redaction]
    url: https://learn.microsoft.com/en-us/azure/ai-services/language-service/personally-identifiable-information/overview
    verified: "2026-11-18"
  - id: dtsAutopurge
    name: Autopurge retention policies
    where: Durable Task Scheduler › retention policies (applies to every task hub in the scheduler)
    setVia: [cloudPolicy, apiCli]
    area: data
    default: "Enabled, 30 days"
    recommended: "Enabled, 30 days (keep the default)"
    why: Finished runs' journals — every payload a step returned — are deleted on a schedule instead of building up as a second store of client data.
    mitigations: [AML.M0031]
    url: https://learn.microsoft.com/en-us/azure/durable-task/scheduler/durable-task-scheduler-auto-purge
    verified: "2026-10-30"
  - id: tenantClaimValidation
    name: Validate the tenant (tid) and subject claims
    where: Your server's handlers — every read and write keyed by the token's tid and oid
    setVia: [code]
    area: data
    default: Not enforced by the protocol or the platform
    recommended: Every record access filtered to the caller's tenant and delegation; never data from one tenant served to another
    why: MCP has no notion of a tenant, so the token's tenant claim checked in the handler is the only thing keeping one customer's records from another's caller.
    mitigations: [cap-data-access-governance]
    url: https://learn.microsoft.com/en-us/entra/identity-platform/claims-validation
    verified: "2026-10-30"
  - id: storageSharedKeyAccess
    name: AllowSharedKeyAccess
    where: Storage account property, via Bicep, ARM, Azure CLI or Azure Policy
    setVia: [cloudPolicy, apiCli]
    area: data
    default: "null (Shared Key and SAS permitted)"
    recommended: "false — every read and write authorized by Entra RBAC, the writer and reader roles held by named identities"
    why: Weights and datasets can be read only by identities granted a role on the account; an account key or SAS token copied out of a pipeline opens nothing.
    mitigations: [AML.M0005, D3-CH]
    url: https://learn.microsoft.com/en-us/azure/storage/common/shared-key-authorization-prevent
    verified: "2026-10-30"
  - id: defenderMalwareScanning
    name: On-upload malware scanning (Defender for Storage)
    where: Microsoft Defender for Cloud › Defender for Storage plan (subscription or storage account) › Malware scanning add-on
    setVia: [cloudPolicy]
    area: data
    default: "Off"
    recommended: "On for every storage account that receives model files or training data, with malicious blobs soft-deleted. Blobs over 50 GB are not scanned and long scans can time out, so treat any result other than No threats found as unscanned and check large weight, checkpoint and dataset files in your own promotion step"
    why: "An artifact carrying known malware is caught on arrival, before any promotion step or loader opens it. Very large files can pass unscanned."
    mitigations: [D3-FA]
    requires: Microsoft Defender for Storage plan
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/introduction-malware-scanning
    verified: "2026-11-18"
  - id: modelLoadVerification
    name: Verify the release signature before load
    where: Your serving image's init step — hash the files, verify the release signature with the signing key's public half
    setVia: [code]
    area: data
    default: Weights load without verification
    recommended: The runtime starts only if every file matches the signed release; a hub artifact only if it matches the digest in its promotion record
    why: A file replaced in storage — even with a new digest written beside it — fails verification and never loads.
    mitigations: [AML.M0014]
    url: https://learn.microsoft.com/en-us/azure/key-vault/keys/about-keys-details
    verified: "2026-10-30"
  - id: servingModelRecord
    name: Deploy by registry model name and version
    where: "Your deployment manifests, where each serving workload carries the Azure Machine Learning registry model name and version it loads and your release pipeline checks it"
    setVia: [code]
    area: data
    default: Deployments point at a path
    recommended: "Every serving deployment references a registered model version, never a bare path or a hub ID. This is your own convention; nothing in AKS or KAITO resolves or enforces a registry reference, so have the release pipeline reject a manifest without one"
    why: "The question of what is running has an answer, because each instance maps to a registry entry with its publisher, format, scan and lineage."
    mitigations: [AML.M0023]
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-models
    verified: "2026-11-18"
  - id: amlDataAssetVersions
    name: Data asset versions (Azure Machine Learning)
    where: Azure Machine Learning › Data › (asset) — referenced as azureml:<name>:<version>, with source and licence recorded as tags
    setVia: [apiCli, code]
    area: data
    recommended: Every training input registered as a data asset version with its source and licence; jobs read assets by version, never by raw path
    why: A version is immutable, so the exact bytes a run consumed — and where they came from — can be named after the fact.
    mitigations: [AML.M0025]
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-create-data-assets
    verified: "2026-10-30"
  - id: curationFilters
    name: Data-preparation components (Azure Machine Learning pipeline)
    where: Your curation pipeline — filtering components that call Azure AI Language PII detection and Azure AI Content Safety on each example
    setVia: [code]
    area: data
    default: Whatever the pipeline author runs
    recommended: Quality, safety and sensitive-content filters as required pipeline steps before a corpus version is registered
    why: A poisoned, harmful or restricted example is removed while it is still a deletion, not something the model has learned.
    mitigations: [AML.M0007]
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-ml-pipelines
    verified: "2026-10-30"
  - id: storageCmk
    name: Customer-managed keys for Azure Storage encryption
    where: Storage account › Encryption — key held in Key Vault
    setVia: [cloudPolicy, apiCli]
    area: data
    default: Microsoft-managed keys
    recommended: A customer-managed key in Key Vault on the dataset and model storage accounts
    why: The organisation can revoke the key and with it every read of the corpus and the checkpoints, independent of any role assignment.
    mitigations: [AML.M0012]
    url: https://learn.microsoft.com/en-us/azure/storage/common/customer-managed-keys-overview
    verified: "2026-10-30"
  - id: amlModelFromJob
    name: Register a model from a job output (azureml://jobs)
    where: Azure Machine Learning studio › Models › Register, from a job output; or az ml model create --path azureml://jobs/...
    setVia: [apiCli, code]
    area: data
    recommended: Every candidate registered from the run that produced it, never from a local file
    why: The registered model carries its lineage to the job — and through it the data asset versions, code and environment — so a discovered poisoning can be scoped.
    mitigations: [AML.M0023]
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-models
    verified: "2026-10-30"
  - id: amlModelTags
    name: Model description and tags (tags.stage)
    where: Azure Machine Learning registry › Models › (version) — the only mutable properties of a model version
    setVia: [apiCli, code]
    area: data
    recommended: Description and a model-card link on every version; tags.stage moved to Prod only by the promotion pipeline
    why: What the artifact is, what it was trained on and whether it was approved travel with it in the registry, not in someone's notes.
    mitigations: [cap-model-documentation]
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-models
    verified: "2026-10-30"
  - id: a2aPayloadRedaction
    name: "PII redaction on A2A payloads (send-request to Azure Language)"
    where: "API Management › APIs › (A2A agent API) › A2A › Policies, with send-request to Azure Language PII detection on each task request; artifacts in responses are redacted in your agent code"
    setVia: [cloudPolicy, code]
    area: data
    default: Payloads cross unchanged
    recommended: "Redact every task request that leaves for a peer, vendor or partner alike. API Management cannot deserialize outgoing response bodies on A2A agent APIs, so redact each artifact we return in your agent code before it is sent"
    why: "Personal data in a delegated task is removed at the boundary, not trusted to the peer's handling. Returned artifacts are out of the gateway's reach, so the agent must redact them itself."
    mitigations: [cap-sensitive-data-redaction]
    url: https://learn.microsoft.com/en-us/azure/api-management/send-request-policy
    verified: "2026-11-18"

  # --- Tools & extensions --------------------------------------------------------------
  - id: apimContentSafety
    name: llm-content-safety policy with shield-prompt
    where: API Management › model APIs › Inbound processing
    setVia: [cloudPolicy]
    area: tools
    default: No policy
    recommended: shield-prompt="true" on every model API
    why: Prompt Shields screen each request for jailbreak and injected instructions at the gateway, before the model sees it.
    mitigations: [cap-input-guardrails]
    url: https://learn.microsoft.com/en-us/azure/api-management/llm-content-safety-policy
    verified: "2026-10-30"
  - id: apimTokenLimit
    name: llm-token-limit policy
    where: API Management › model APIs › Inbound processing
    setVia: [cloudPolicy]
    area: tools
    default: No limit
    recommended: Tokens-per-minute and a token quota per subscription
    why: A looping turn hits a ceiling at the gateway before it runs up cost or volume.
    mitigations: [AML.M0036]
    url: https://learn.microsoft.com/en-us/azure/api-management/llm-token-limit-policy
    verified: "2026-10-30"
  - id: apimMcpServers
    name: MCP servers in API Management
    where: API Management › MCP servers
    setVia: [cloudPolicy]
    area: tools
    default: Agents call MCP servers directly
    recommended: "Every MCP server exposed only through API Management, with authentication and policies. Policies apply to all tools of an MCP server, not per tool, so put tools that need different rules on separate MCP servers or check the tool in the tool server"
    why: "Each tool call crosses one gateway that authenticates it, applies policy and logs it, with no direct path from agent to server."
    mitigations: [cap-mcp-tool-integrity, cap-agent-action-policy-enforcement]
    url: https://learn.microsoft.com/en-us/azure/api-management/mcp-server-overview
    verified: "2026-11-18"
  - id: apiCenterInventory
    name: MCP server inventory in API Center
    where: "Azure API Center › Inventory › Assets › + Register an asset › MCP server"
    setVia: [adminConsole]
    area: tools
    default: Not registered
    recommended: "Every MCP server and API the agent can call, registered as an asset. The registration form has no owner field, so record the owner in a custom metadata property you define in API Center"
    why: The list of tools an agent may be given is a governed registry, not whatever someone wired in.
    mitigations: [cap-agent-tool-registry]
    url: https://learn.microsoft.com/en-us/azure/api-center/register-discover-mcp-server
    verified: "2026-11-18"
  - id: agentToolApproval
    builtWith: Microsoft Agent Framework
    name: Tool Approval (human in the loop)
    where: Your agent code — Microsoft Agent Framework tool approval on write tools
    setVia: [code]
    area: tools
    default: Tools run without approval
    recommended: Approval required on every tool that writes to a system of record
    why: A person confirms each consequential action in the conversation before it happens.
    mitigations: [AML.M0029]
    url: https://learn.microsoft.com/en-us/agent-framework/agents/tools/
    verified: "2026-10-30"
  - id: agentOperatorApproval
    name: "Tool approval (ApprovalRequiredAIFunction in C#, approval_mode on the @tool decorator in Python)"
    where: Your agent code — the approval request is routed to an operator work queue and the session resumes on the answer
    setVia: [code]
    area: tools
    default: Tools run without approval
    recommended: "Required on every action above the value or irreversibility threshold, by wrapping the function in ApprovalRequiredAIFunction (C#) or setting approval_mode to always_require on the @tool decorator (Python); the approver is an operator, never the requester"
    why: A consequential write waits for someone other than its beneficiary; below the threshold the action's compensating transaction, not review, is the safety net.
    mitigations: [AML.M0029]
    url: https://learn.microsoft.com/en-us/agent-framework/agents/tools/tool-approval
    verified: "2026-11-18"
  - id: workflowRequestPort
    builtWith: Microsoft Agent Framework
    name: Human-in-the-loop request and response (RequestPort)
    where: Your workflow code — Agent Framework workflow, made durable with the Durable Extension
    setVia: [code]
    area: tools
    default: Steps run without approval
    recommended: A request port in front of every consequential write; the step suspends and resumes only on the operator's response to that request
    why: The approval is bound to the exact pending step and its checkpointed state, so a step resumed days later cannot run a different action than the one approved.
    mitigations: [AML.M0029]
    url: https://learn.microsoft.com/en-us/agent-framework/workflows/human-in-the-loop
    verified: "2026-10-30"
  - id: outputSanitisation
    name: Sanitise rendered model output
    where: Your front-end code
    setVia: [code]
    area: tools
    default: Depends on your renderer
    recommended: Render as text or sanitised markdown; strip HTML, block external images, set a Content Security Policy
    why: A model-written image link or script cannot carry the conversation to an attacker the moment it renders.
    mitigations: [cap-output-encoding]
    url: https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
    verified: "2026-10-30"
  - id: sessionPoolEgress
    name: Session pool network status
    where: Container Apps session pool › --network-status
    setVia: [cloudPolicy, apiCli]
    area: tools
    default: EgressDisabled
    recommended: EgressDisabled
    why: Code the agent writes runs in a Hyper-V-isolated session with no outbound network, so it cannot fetch or send anything.
    mitigations: [D3-EI, cap-agent-egress-control]
    url: https://learn.microsoft.com/en-us/azure/container-apps/session-pool
    verified: "2026-10-30"
  - id: containerAppsTrafficSplit
    name: Multiple revision mode with traffic splitting
    where: Container Apps › (agent app) › Revisions and replicas
    setVia: [cloudPolicy, apiCli]
    area: tools
    default: Single revision mode (all traffic to the latest)
    recommended: Multiple revision mode; a new agent, prompt or model revision takes a small share of traffic after its evaluation passes
    why: A change that behaves badly reaches a few users and rolls back by moving traffic, not by redeploying.
    mitigations: [cap-staged-rollout-gate]
    url: https://learn.microsoft.com/en-us/azure/container-apps/traffic-splitting
    verified: "2026-10-30"
  - id: artifactsUpstream
    name: Azure Artifacts upstream sources (externally sourced versions blocked)
    where: Azure Artifacts › (feed) › Upstream sources; package upstream behavior
    setVia: [adminConsole]
    area: tools
    default: "Public versions are blocked only for a package name that already has a private version in the feed"
    recommended: "Keep the default, but do not rely on it to limit what enters the feed. Packages that are entirely public are still saved automatically when a Collaborator installs them, so give the Collaborator role only to a reviewed admission pipeline and everyone else Reader"
    why: "A public package cannot shadow an internal one of the same name. That is a dependency-confusion guard only; which public packages enter the feed is decided by who holds the Collaborator role."
    mitigations: [D3-FA]
    url: https://learn.microsoft.com/en-us/azure/devops/artifacts/concepts/upstream-behavior
    verified: "2026-11-18"
  - id: apimRateLimitByKey
    name: rate-limit-by-key policy
    where: "API Management › the MCP server's or model API's policies › Inbound processing"
    setVia: [cloudPolicy]
    area: tools
    default: No limit
    recommended: "Per-client and per-tenant counters (counter-key on the token's azp and tid claims; azp is the v2.0 claim, appid the v1.0 one), sized for callers that retry and parallelise. Not available in the Consumption tier; v2 tiers use a token bucket algorithm"
    why: "One looping or hostile client hits its own ceiling at the gateway instead of exhausting the service for every tenant."
    mitigations: [AML.M0004]
    url: https://learn.microsoft.com/en-us/azure/api-management/rate-limit-by-key-policy
    verified: "2026-11-18"
  - id: toolDefinitionPinning
    name: Pin tool definitions to a reviewed version
    where: Your server's loader — definitions shipped with the release and checked against the hash recorded at review
    setVia: [code]
    area: tools
    default: No integrity check in the protocol
    recommended: Refuse to serve any definition whose hash differs from the reviewed release; a wording change goes through the release gate
    why: A description edited outside the pipeline never reaches a caller's model, so the server cannot be turned into a tool-poisoning vector.
    mitigations: [cap-mcp-tool-integrity]
    url: https://microsoft.github.io/mcp-azure-security-guide/mcp/mcp03-tool-poisoning/
    verified: "2026-10-30"
  - id: ghazdoCodeScanning
    name: Code scanning (GitHub Advanced Security for Azure DevOps)
    where: Azure DevOps › Project settings › Repos › Repositories › (repo) › Advanced Security; code scanning default setup or CodeQL pipeline tasks
    setVia: [adminConsole, configFile]
    area: tools
    default: "Off"
    recommended: On for every repository that ships the server, with high-severity alerts blocking the release
    why: The handlers behind the protocol are tested like any published application before they serve callers.
    mitigations: [D3-SYSVA]
    requires: GitHub Advanced Security for Azure DevOps, or GitHub Code Security for Azure DevOps
    url: https://learn.microsoft.com/en-us/azure/devops/repos/security/github-advanced-security-code-scanning
    verified: "2026-10-30"
  - id: ghazdoDependencyScanning
    name: Dependency scanning (GitHub Advanced Security for Azure DevOps)
    where: Azure DevOps › repository dependency scanning default setup, or the AdvancedSecurity-Dependency-Scanning@1 pipeline task
    setVia: [adminConsole, configFile]
    area: tools
    default: "Off"
    recommended: On for every repository that ships the service, alerts triaged by exposure
    why: The SDK and every dependency are enumerated against vulnerability advisories, so an advisory maps to the release it affects.
    mitigations: [D3-AVE]
    requires: GitHub Advanced Security for Azure DevOps, or GitHub Code Security for Azure DevOps
    url: https://learn.microsoft.com/en-us/azure/devops/repos/security/github-advanced-security-dependency-scanning
    verified: "2026-10-30"
  - id: apimContentSafetyCompletions
    name: llm-content-safety policy with enforce-on-completions
    where: API Management › model APIs › Inbound processing
    setVia: [cloudPolicy]
    area: tools
    default: No policy
    recommended: enforce-on-completions="true" on every model API with no provider-side content filter
    why: With open weights and no provider applying policy, the gateway checks completions as well as prompts and blocks harmful output before it is returned.
    mitigations: [cap-output-guardrails]
    url: https://learn.microsoft.com/en-us/azure/api-management/llm-content-safety-policy
    verified: "2026-10-30"
  - id: apimWeightedPool
    name: Load-balanced pool — Weighted
    where: API Management › Backends › (pool); the model API routes to the pool
    setVia: [cloudPolicy, apiCli]
    area: tools
    default: One backend
    recommended: The new model version's backend takes a small weight after its evaluation passes; the previous version stays in the pool
    why: A new checkpoint serves a slice of traffic before everyone, and rollback is a weight change rather than a re-download.
    mitigations: [cap-staged-rollout-gate]
    url: https://learn.microsoft.com/en-us/azure/api-management/backends
    verified: "2026-10-30"
  - id: vllmRuntimeLora
    builtWith: vLLM
    name: VLLM_ALLOW_RUNTIME_LORA_UPDATING
    where: vLLM server environment, in the serving deployment
    setVia: [configFile]
    area: tools
    default: Not set (runtime adapter loading off)
    recommended: Not set; adapters load only from a promoted release at start-up
    why: Nobody who can reach the server can load an adapter that changes the model's behaviour through /v1/load_lora_adapter.
    mitigations: [D3-ACH]
    url: https://docs.vllm.ai/en/stable/usage/security/
    verified: "2026-10-30"
  - id: vllmCacheSalt
    builtWith: vLLM
    name: cache_salt (set per tenant at the gateway)
    where: API Management set-body policy on the model API — overwrites any cache_salt the caller sent
    setVia: [cloudPolicy, code]
    area: tools
    default: No salt (all requests share cached prefixes)
    recommended: A secret per tenant, derived at the gateway from the caller's identity
    why: Only requests from the same tenant can share prefix-cache blocks, closing the cache-timing path to another tenant's prompts.
    mitigations: [D3-ACH]
    url: https://docs.vllm.ai/en/stable/usage/security/
    verified: "2026-10-30"
  - id: aksGpuNodeTaints
    name: Node taints on dedicated GPU node pools
    where: "AKS › az aks nodepool add --node-taints, on node pools you create yourself; tolerations on each tier's workload"
    setVia: [apiCli, configFile]
    area: tools
    default: Pods can share any node
    recommended: "A separate GPU node pool per sensitivity tier, tainted NoSchedule, so a tier's models run only on its own VMs and GPUs. KAITO provisions its own GPU node pool per workspace and Microsoft does not document taints on those, so check them, or run vLLM as your own workload on the pools you tainted"
    why: Tiers that must not share memory never share a host or an accelerator — the separation is the VM boundary, not the scheduler's goodwill.
    mitigations: [D3-HBPI]
    url: https://learn.microsoft.com/en-us/azure/aks/use-node-taints
    verified: "2026-11-18"
  - id: defenderContainerVa
    name: Container vulnerability assessment (Defender for Containers)
    where: Microsoft Defender for Cloud › Environment settings › Defender for Containers; registry and runtime scanning
    setVia: [cloudPolicy]
    area: tools
    default: "Off"
    recommended: On for the registry and every cluster that runs serving or training images
    why: The serving stack's known vulnerabilities are mapped to the images actually running, so each advisory points at the instances it affects.
    mitigations: [D3-AVE]
    requires: Microsoft Defender for Containers (or Defender CSPM for supported scenarios)
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/agentless-vulnerability-assessment-azure
    verified: "2026-10-30"
  - id: foundryRedTeaming
    name: AI Red Teaming Agent (Microsoft Foundry)
    where: "Azure AI Evaluation SDK run locally (preview), with a callback to the candidate on your isolated evaluation endpoint; portal and cloud runs only target Foundry and Azure OpenAI deployments and Foundry agents"
    setVia: [apiCli, code]
    area: tools
    default: Not run
    recommended: "Run on every candidate before promotion, its attack success rate a blocking threshold beside your capability, backdoor and memorisation tests. Needs a Foundry project in a supported region, and the local run is still in preview"
    why: A candidate that a fine-tune made unsafe fails the gate before it is signed, not after it serves.
    url: "https://learn.microsoft.com/en-us/azure/foundry/how-to/develop/run-scans-ai-red-teaming-agent"
    mitigations: [AML.M0008]
    verified: "2026-11-18"
  - id: aksPodSandboxing
    name: Pod Sandboxing (Kata Containers)
    where: "AKS Azure Linux node pool created with --workload-runtime KataVmIsolation; runtimeClassName kata-vm-isolation on each untrusted pod"
    setVia: [apiCli, configFile]
    area: tools
    default: Pods share the host kernel
    recommended: "Every pod that runs model-generated code uses the Kata runtime class, one pod per task, deleted after. This is an AKS setting on Azure Linux node pools only: in a training pipeline it covers steps that run model-generated code, such as RL rollouts, which belong on the agent sandbox's AKS node pools and not on the Azure Machine Learning compute cluster. Microsoft Defender for Containers cannot assess Kata pods, so detection for them must come from your own logs and network flow records"
    why: Generated code runs in a lightweight VM with its own guest kernel, so a container escape lands in that VM rather than on the host or beside other pods.
    mitigations: [D3-EI]
    url: https://learn.microsoft.com/en-us/azure/aks/use-pod-sandboxing
    verified: "2026-11-18"
  - id: artifactsFeedReader
    name: Feed Reader (feed permission)
    where: Azure Artifacts › (feed) › Feed settings › Permissions
    setVia: [adminConsole]
    area: tools
    default: Build services hold Feed and Upstream Reader (Collaborator)
    recommended: Feed Reader for every rollout and agent identity; only the admission pipeline saves packages from upstream
    why: A rollout can install what was admitted but cannot write to the feed or make it fetch a new package from upstream — the cache cannot become a channel or a proxy.
    mitigations: [AML.M0028]
    url: https://learn.microsoft.com/en-us/azure/devops/artifacts/feeds/feed-permissions
    verified: "2026-10-30"
  - id: containmentPenTest
    name: Containment red teaming (penetration testing under the Rules of Engagement)
    where: Your pre-run security testing — agents attack the sandbox, the cluster network and the platform services
    setVia: [code]
    area: tools
    default: Not run
    recommended: Before every run that changes the sandbox, tools or egress list; findings block the run until fixed
    why: Escape routes through the sandbox, the host network and shared services are found by testing them, not assumed closed.
    mitigations: [D3-SYSVA]
    url: https://learn.microsoft.com/en-us/azure/security/fundamentals/pen-testing
    verified: "2026-10-30"
  - id: apimA2aApis
    name: A2A agent APIs in API Management
    where: "API Management › APIs › + Add API › A2A Agent; policies under A2A › Policies apply to the whole agent API"
    setVia: [cloudPolicy]
    area: tools
    default: Agents call peers directly
    recommended: "Our published agent and every peer we call imported as A2A agent APIs, with token validation on each. Only JSON-RPC agents are supported and policies apply to the whole agent API, not to single skills, so authorize each skill in your own agent code"
    why: "Every task in either direction crosses one gateway that authenticates the peer and logs the call. The gateway admits a caller to the agent as a whole; the per-skill authorization A2A leaves to us has to be enforced in the agent."
    mitigations: [cap-agent-action-policy-enforcement]
    url: https://learn.microsoft.com/en-us/azure/api-management/agent-to-agent-api
    verified: "2026-11-18"
  - id: apiCenterAgents
    name: Agent registration in API Center
    where: Azure API Center › Inventory › Assets › + Register an asset › Agent (from the agent card JSON)
    setVia: [adminConsole, apiCli]
    area: tools
    default: Not registered
    recommended: Every admitted peer agent and every agent we publish registered from its reviewed card, with an owner
    why: An agent that is not in the registry is not a peer — the list of who our agent may delegate to is governed, not discovered.
    mitigations: [cap-agent-tool-registry]
    url: https://learn.microsoft.com/en-us/azure/api-center/register-manage-agents
    verified: "2026-10-30"
  - id: agentCardPinning
    name: Agent cards from your registry (AgentCard.AsAIAgent)
    where: Your agent code — build each peer client from the card held in the registry, after verifying its signature and hash
    setVia: [code]
    area: tools
    default: Card fetched live with A2ACardResolver
    recommended: Never resolve a peer's card live in production; a changed card is re-reviewed before the registry entry changes
    why: A peer that alters its card — new skills, new endpoint, new security scheme — is not trusted until someone has decided to trust the change.
    mitigations: [cap-mcp-tool-integrity]
    url: https://learn.microsoft.com/en-us/agent-framework/integrations/by-component/agent-services/a2a
    verified: "2026-10-30"
  - id: apimQuotaByKey
    name: quota-by-key policy
    where: "API Management › APIs › (A2A agent API) › A2A › Policies, inbound section; forward-request timeout on the backend call"
    setVia: [cloudPolicy]
    area: tools
    default: No quota
    recommended: "Call and bandwidth quotas per peer and per task, with a timeout on every streamed task. The policy page's tier list names only the classic tiers (Developer, Basic, Standard, Premium); on a v2 tier confirm the policy is accepted, and if it is not, use rate-limit-by-key and enforce longer budgets in your agent"
    why: One partner task that retries, fans out or streams without end hits its own ceiling instead of our budget.
    mitigations: [AML.M0036]
    url: https://learn.microsoft.com/en-us/azure/api-management/quota-by-key-policy
    verified: "2026-11-18"

  # --- Network -------------------------------------------------------------------------
  - id: firewallEgress
    name: Azure Firewall application rules (via user-defined routes)
    where: "Route table on the workload's subnet (the Container Apps environment subnet, or the AKS node subnet with outbound type userDefinedRouting) → Azure Firewall › Application rules"
    setVia: [cloudPolicy]
    area: network
    default: Direct outbound internet
    recommended: "All outbound from the agent or sandbox subnet through Azure Firewall, with an FQDN allowlist. On AKS, follow \"Limit network traffic with Azure Firewall in AKS\", which sets the cluster's outbound type to userDefinedRouting, routes 0.0.0.0/0 to the firewall and allows the AzureKubernetesService FQDN tag"
    why: The agent and its tools reach only the hosts you list; anything else is dropped and logged.
    mitigations: [cap-agent-egress-control]
    url: https://learn.microsoft.com/en-us/azure/container-apps/use-azure-firewall
    verified: "2026-11-18"
  - id: foundryPublicNetworkAccess
    name: Public network access
    where: Foundry, Azure AI Search and Azure Cosmos DB › Networking
    setVia: [cloudPolicy]
    area: network
    default: Enabled
    recommended: Disabled, private endpoints only
    why: The model, the index and the memory store are reachable only from your virtual network, not from the internet.
    mitigations: []
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/configure-private-link
    verified: "2026-10-30"
  - id: wafRateLimit
    name: WAF rate limit rule
    where: "Application Gateway WAF v2 policy › Custom rules › rate limit rule"
    setVia: [cloudPolicy]
    area: network
    default: No rate limit
    recommended: "Per-client rate limit on the chat endpoint, grouped by client address. Needs the latest WAF engine (select CRS 3.2 for the default rule set); thresholds are not enforced exactly, so keep exact per-user limits at the API gateway"
    why: A runaway client or scripted abuse is throttled at the edge, before it spends tokens or triggers actions.
    mitigations: [AML.M0004]
    url: "https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/rate-limiting-overview"
    verified: "2026-11-18"
  - id: appServiceRouteAll
    name: outboundVnetRouting.allTraffic
    where: App Service › Networking › Virtual network integration; set with the Azure CLI, subnet routed to Azure Firewall
    setVia: [cloudPolicy, apiCli]
    area: network
    default: Application traffic uses the default route
    recommended: "true, with the integration subnet's route table sending outbound traffic through Azure Firewall"
    why: Every outbound call the server makes leaves through the firewall's allowlist, so a handler or fetch steered to an internal or metadata address is dropped.
    mitigations: [D3-OTF]
    url: https://learn.microsoft.com/en-us/azure/app-service/configure-vnet-integration-routing
    verified: "2026-10-30"
  - id: aksNetworkPolicy
    name: Network policy engine (Azure CNI Powered by Cilium)
    where: AKS cluster network profile; a default-deny Kubernetes network policy in each serving or training namespace
    setVia: [cloudPolicy, configFile]
    area: network
    default: All pods can send and receive traffic without limitations
    recommended: Cilium, with default deny; only the gateway reaches the serving pods, and inter-node serving traffic stays inside the namespace
    why: The serving plane's unauthenticated job and inter-node channels are reachable from nothing else in the cluster.
    mitigations: [D3-NI]
    url: https://learn.microsoft.com/en-us/azure/aks/use-network-policies
    verified: "2026-10-30"
  - id: amlManagedNetwork
    name: Managed virtual network isolation mode
    where: Azure Machine Learning workspace › Networking › Workspace managed outbound access
    setVia: [cloudPolicy, apiCli]
    area: network
    recommended: Allow only approved outbound (Private with Approved Outbound in the portal), with the package mirror and the dataset and model storage as the only added rules
    why: The training job can reach the stores it needs and nothing else, so a compromised dependency or a run holding the corpus has no route out.
    mitigations: [D3-NI]
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-managed-network
    verified: "2026-10-30"
  - id: aksFqdnFiltering
    name: FQDN filtering (Advanced Container Networking Services)
    where: AKS with Azure CNI Powered by Cilium and Advanced Container Networking Services; a Cilium network policy listing the allowed FQDNs
    setVia: [cloudPolicy, configFile]
    area: network
    default: All pods can send and receive traffic without limitations
    recommended: The offline web, the package feed and the platform services as the rollout's whole list; every other DNS request refused
    why: DNS requests are checked against the policy before they are answered, so a rollout cannot resolve — or tunnel through — a name that is not on its list.
    mitigations: [cap-agent-egress-control]
    requires: Advanced Container Networking Services
    url: https://learn.microsoft.com/en-us/azure/aks/container-network-security-fqdn-filtering-concepts
    verified: "2026-10-30"

  # --- Audit & monitoring --------------------------------------------------------------
  - id: appInsightsOtel
    name: "OpenTelemetry in Application Insights (Microsoft OpenTelemetry Distro)"
    where: "Agent code with the Microsoft OpenTelemetry Distro (Python package microsoft-opentelemetry; the Azure Monitor OpenTelemetry Distro stays for Java and for apps that already use it); Log Analytics workspace connected to Microsoft Sentinel"
    setVia: [code, cloudPolicy]
    area: audit
    default: Not instrumented
    recommended: On, tracing every agent turn and tool call, exported to Log Analytics and Sentinel
    why: Each tool call, its arguments and its result are traceable per user and conversation when something goes wrong.
    mitigations: [cap-agent-tracing]
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/opentelemetry-enable
    verified: "2026-11-18"
  - id: apimSubscriptionState
    name: Subscription state (suspend)
    where: API Management › Subscriptions › (agent's subscription)
    setVia: [cloudPolicy, apiCli]
    area: audit
    default: Active
    recommended: Active, with suspend as the first step of your incident runbook
    why: Suspending the agent's subscription cuts its model and tool access at the gateway at once, without redeploying anything.
    mitigations: [cap-agent-kill-switch]
    url: https://learn.microsoft.com/en-us/azure/api-management/api-management-subscriptions
    verified: "2026-10-30"
  - id: dtsTerminate
    name: Terminate orchestration instances
    where: Durable Task client API (DurableTaskClient), or the Durable Task Scheduler dashboard
    setVia: [apiCli, code]
    area: audit
    default: Runs continue until they complete
    recommended: A runbook step that queries the workflow's running and suspended instances and terminates each, with a reason
    why: The stop reaches a workflow parked on a timer or an approval for days, not only one that is executing now.
    mitigations: [cap-agent-kill-switch]
    url: https://learn.microsoft.com/en-us/azure/durable-task/common/durable-task-instance-management
    verified: "2026-10-30"
  - id: entraAgentDisable
    name: Disable agent identity
    where: Microsoft Entra admin center › Entra ID › Agents › Agent identities (or Agent blueprints) › Disable
    setVia: [identityProvider]
    area: audit
    default: Enabled
    recommended: Enabled, with Disable as an incident-runbook step held by Agent ID Administrators
    why: A disabled agent identity receives no new tokens, so one agent is cut off without touching the others or redeploying.
    mitigations: [cap-agent-kill-switch]
    url: https://learn.microsoft.com/en-us/entra/agent-id/disable-agent-identities
    verified: "2026-10-30"
  - id: apimGatewayLogs
    name: Diagnostic setting — Logs related to ApiManagement Gateway
    where: API Management › Monitoring › Diagnostic settings; resource-specific ApiManagementGatewayLogs table in Log Analytics
    setVia: [cloudPolicy]
    area: audit
    default: Not collected
    recommended: On, sent to the Log Analytics workspace connected to Microsoft Sentinel, with the generative AI gateway logs where model APIs pass through
    why: Every call through the gateway is recorded with its caller and operation, where an incident can query it.
    mitigations: [AML.M0024]
    url: https://learn.microsoft.com/en-us/azure/api-management/monitor-api-management
    verified: "2026-10-30"
  - id: amlWorkspaceDiagnostics
    name: Diagnostic setting — Azure Machine Learning workspace resource logs
    where: Azure Machine Learning workspace › Diagnostic settings (portal, API or Azure Policy); AmlComputeJobEvent and AmlComputeClusterEvent tables in Log Analytics
    setVia: [cloudPolicy]
    area: audit
    default: Not collected (resource logs are stored only once a diagnostic setting routes them)
    recommended: On, with the job and cluster event categories sent to the Log Analytics workspace the security team queries
    why: Which job ran on which cluster, and how it ended, is recorded by Azure outside the job's own outputs, where an investigation can query it.
    mitigations: [AML.M0024]
    url: https://learn.microsoft.com/en-us/azure/machine-learning/monitor-azure-machine-learning
    verified: "2026-11-15"
  - id: aksContainerLogs
    name: Container log collection (Azure Monitor)
    where: AKS › Monitoring — Azure Monitor agent collecting stdout/stderr and Kubernetes events to a Log Analytics workspace
    setVia: [cloudPolicy]
    area: audit
    default: Not collected
    recommended: On for every sandbox node pool, to a workspace no rollout identity can read or write
    why: Trajectories and host telemetry leave the node as they happen, so a rollout that disables what it can touch cannot erase what was already shipped.
    mitigations: [cap-agent-tracing]
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/containers/kubernetes-monitoring-overview
    verified: "2026-10-30"
  - id: monitorAutoStop
    name: Alert rule with an action group (automated stop)
    where: Azure Monitor › Alerts › Action groups — an Azure Function or Automation Runbook that tells the orchestrator to halt the run
    setVia: [cloudPolicy, code]
    area: audit
    default: No automated action
    recommended: Serious-risk detections stop the run and cordon its node pool automatically; resuming is a person's decision
    why: The stop is enforced from outside every sandbox the moment a monitor fires, without waiting for someone to read the alert.
    mitigations: [cap-agent-kill-switch]
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/action-groups
    verified: "2026-10-30"
  - id: entraAppSignInDisable
    name: Enabled for users to sign-in?
    where: Microsoft Entra admin center › Enterprise applications › (peer platform or peer agent) › Properties
    setVia: [identityProvider]
    area: audit
    default: "Yes"
    recommended: Yes, with No as the first step of the peer cut-off runbook
    why: Setting it to No stops every new token for that application at once, so a peer is cut off in one action alongside dropping its registry entry.
    mitigations: [cap-agent-kill-switch]
    url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/disable-user-sign-in-portal
    verified: "2026-10-30"
  - id: mdaAppRiskScore
    name: Cloud app catalog risk score (Defender for Cloud Apps)
    where: Microsoft Defender portal › Cloud apps › Cloud app catalog › (peer platform)
    setVia: [adminConsole]
    area: sharing
    recommended: Reviewed for every peer platform before the agreement is signed, alongside the questions A2A leaves open — tenant isolation, card signing, audit export
    why: A peer is admitted on an assessment of how it handles our users' identity and data, not only on its card.
    mitigations: [cap-ai-vendor-assessment]
    requires: Microsoft Defender for Cloud Apps
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/risk-score
    verified: "2026-10-30"
  - id: aksEntraIdAuthorisation
    name: "Microsoft Entra ID authorization for the Kubernetes API (Azure RBAC for Kubernetes authorization)"
    where: "AKS cluster › az aks update --enable-azure-rbac (needs --enable-aad); AKS cluster › Access control (IAM) › Add role assignment, scoped to <cluster resource ID>/namespaces/<namespace>"
    setVia: [apiCli, cloudPolicy, identityProvider]
    area: identity
    default: "Preconfigured on AKS Automatic; optional on AKS Standard, enabled with --enable-azure-rbac"
    recommended: "On. Assign the built-in Azure Kubernetes Service RBAC Writer role to each research group's Microsoft Entra group, scoped to that group's run namespace, and to nobody else. Runs defined as custom resources need a custom role as well."
    why: "Every Kubernetes API call is checked against Azure role assignments, so membership of the Entra group decides who can create, change or delete run workloads, and leaving the group ends the access."
    mitigations: [D3-APA]
    url: https://learn.microsoft.com/en-us/azure/aks/entra-id-authorization
    verified: "2026-11-18"
  # >>> hosting rows (settings used only by a hosting variant)
  - id: aksKedaTriggerAuth
    name: "KEDA add-on with workload identity (TriggerAuthentication)"
    where: "AKS › az aks create or update --enable-keda (preconfigured on AKS Automatic); a KEDA TriggerAuthentication with podIdentity provider azure-workload, referenced by the ScaledJob's azure-servicebus trigger"
    setVia: [apiCli, configFile]
    area: identity
    default: "Not enabled on AKS Standard; preconfigured on AKS Automatic"
    recommended: "On, with the TriggerAuthentication naming a user-assigned identity federated to system:serviceaccount:kube-system:keda-operator and used for nothing else. Microsoft's tutorial shares one identity between KEDA and the workload and grants it Azure Service Bus Data Owner (full access) on the namespace; give the agent's service account its own identity with Azure Service Bus Data Receiver on the trigger queue only, and keep SAS keys off with disableLocalAuth"
    why: "KEDA's operator reads the trigger queue with a standing identity of its own to decide when a run starts, a step Container Apps performed inside the platform. Keeping that identity apart from the agent's stops the trigger path widening what a run can do."
    mitigations: [D3-APA]
    url: https://learn.microsoft.com/en-us/azure/aks/keda-workload-identity
    verified: "2026-11-18"
  - id: aksCanaryRollout
    name: "Canary deployment strategy (Kubernetes manifest task)"
    where: "Azure Pipelines › KubernetesManifest@1 task › action deploy with strategy canary and a percentage; then action promote or reject, behind an approval on the pipeline environment"
    setVia: [configFile]
    area: tools
    default: "strategy none (the new version replaces the stable one in one step)"
    recommended: "strategy canary with a small percentage for every new agent image, prompt or model version, promoted only after its evaluation passes and an approver signs off. With trafficSplitMethod pod the percentage sets the share of replicas given to the -canary variant, which Microsoft documents for Deployment workloads; it does not document a canary for KEDA ScaledJob resources, so test how your trigger objects behave first"
    why: "Container Apps split traffic between revisions for you. On AKS a new version reaches every pod unless the pipeline holds it at a canary share and waits for a promote or reject decision."
    mitigations: [cap-staged-rollout-gate]
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/ecosystems/kubernetes/canary-demo?view=azure-devops
    verified: "2026-11-18"
  - id: aksImdsRestriction
    name: "Block pod access to the IMDS endpoint (preview)"
    where: "AKS › az aks create or update --enable-imds-restriction, then a node image upgrade; or a NetworkPolicy in every user namespace that excludes 169.254.169.254/32 from egress"
    setVia: [apiCli, configFile]
    area: identity
    default: "All pods can reach the IMDS endpoint"
    requires: "aks-preview Azure CLI extension and the IMDSRestrictionPreview feature flag"
    recommended: "Enabled where the cluster's add-ons allow it. Microsoft lists Container Insights, Azure Policy and application routing among the add-ons that cannot run with it; on those clusters apply the network policy from the AKS cluster security best practices that blocks pod egress to 169.254.169.254/32 in every user namespace"
    why: "A pod that reaches the node's metadata service can request tokens for the node's managed identity. Blocking it leaves the agent and the sandbox with only the federated workload identity you gave them."
    mitigations: [D3-CH]
    url: https://learn.microsoft.com/en-us/azure/aks/imds-restriction
    verified: "2026-11-18"
  - id: aksNodeOsUpgradeChannel
    name: "Node OS auto-upgrade channel"
    where: "AKS › az aks create or update --node-os-upgrade-channel; planned maintenance configuration aksManagedNodeOSUpgradeSchedule"
    setVia: [apiCli]
    area: tools
    default: "NodeImage on new AKS Standard clusters (API version 2023-06-01 and later) and always on AKS Automatic"
    recommended: "NodeImage or SecurityPatch, never None, with a planned maintenance window, and a cluster auto-upgrade channel set alongside it"
    why: "Container Apps patches its hosts for you. On AKS Standard node patching is a shared responsibility: Microsoft publishes patched node images and you choose how and when they are applied."
    mitigations: []
    url: https://learn.microsoft.com/en-us/azure/aks/auto-upgrade-node-os-image
    verified: "2026-11-18"
  - id: aksDisableLocalAccounts
    name: "Local accounts (disableLocalAccounts)"
    where: "AKS cluster › az aks create or update --disable-local-accounts, on a cluster with Microsoft Entra integration (--enable-aad); properties.disableLocalAccounts on the managed cluster resource"
    setVia: [apiCli]
    area: identity
    default: "Local accounts are enabled by default; AKS Standard lists them as the default way to authenticate, and AKS Automatic preconfigures Azure RBAC for Kubernetes authorization"
    requires: "Microsoft Entra integration on the cluster"
    recommended: "Disabled, so that az aks get-credentials --admin fails and every Kubernetes API call is made with a Microsoft Entra identity. On an existing cluster, rotate the cluster certificates afterwards to revoke credentials already issued."
    why: "Container Apps has no Kubernetes API to sign in to. On AKS, Microsoft describes the local admin credential as a non-auditable backdoor, and whoever holds it can change or reach the agent's pods."
    mitigations: [D3-APA]
    url: https://learn.microsoft.com/en-us/azure/aks/local-accounts
    verified: "2026-11-18"
  - id: aksInternalLoadBalancer
    name: "Internal load balancer (azure-load-balancer-internal annotation)"
    where: "Kubernetes Service of type LoadBalancer › annotation service.beta.kubernetes.io/azure-load-balancer-internal: \"true\"; the Gateway of the application routing add-on takes annotations for the same purpose"
    setVia: [configFile]
    area: network
    default: "Not set; Microsoft's Gateway API examples create an external load balancer that is reachable from outside the cluster"
    recommended: "Set on the Service or Gateway in front of the agent, so that it gets a private IP address from the cluster's virtual network and no public IP. Let only the front end and API Management reach it, and give the agent no public Service."
    why: "A Container Apps internal environment has no public endpoint. On AKS each Service or Gateway decides this for itself, so the path from the front end and the gateway to the agent is private only where the annotation is set."
    mitigations: [D3-NI]
    url: https://learn.microsoft.com/en-us/azure/aks/internal-lb
    verified: "2026-11-18"
  - id: entraSidecarWorkloadIdentity
    name: "SignedAssertionFilePath credential source (Microsoft Entra ID Auth SDK sidecar with Microsoft Entra Workload ID)"
    where: "Sidecar container in the agent's pod › env AzureAd__ClientCredentials__0__SourceType; pod label azure.workload.identity/use: \"true\" and a service account annotated with the managed identity's client ID"
    setVia: [configFile, identityProvider]
    area: identity
    requires: "AKS cluster with the OIDC issuer and workload identity enabled; a user-assigned managed identity with a federated credential for the pod's service account"
    recommended: "SignedAssertionFilePath, so the sidecar reads the service account token that the workload identity webhook projects into the pod and no client secret or certificate is stored. Keep the sidecar on localhost and never publish it through a LoadBalancer or Ingress."
    why: "The sidecar that gets the agents' tokens needs a credential of its own. On AKS that is the projected, automatically refreshed service account token, not the managed identity credential type used on VMs or App Service."
    mitigations: [D3-AA, D3-CH]
    url: https://learn.microsoft.com/en-us/entra/msidweb/agent-id-sdk/scenarios/managed-identity
    verified: "2026-11-18"
  # <<< hosting rows

implementations:
  - architecture: archChatAgent
    asOf: "2026-10"
    # >>> checked against the vendor's documentation
    verified: "2026-11-18"
    sources:
      entry: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/baseline-microsoft-foundry-chat
      events: https://learn.microsoft.com/en-us/azure/azure-functions/functions-overview
      agent: https://learn.microsoft.com/en-us/azure/container-apps/overview
      localTools: https://learn.microsoft.com/en-us/azure/container-apps/sessions
      memory: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/what-is-foundry-iq
      gateway: https://learn.microsoft.com/en-us/azure/api-management/genai-gateway-capabilities
      provider: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-sold-directly-by-azure
      internalTools: https://learn.microsoft.com/en-us/azure/api-management/mcp-server-overview
      openWeb: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/bing-tools
      registry: https://learn.microsoft.com/en-us/azure/devops/artifacts/start-using-azure-artifacts
    differences:
      - at: agent->gateway
        text: "Microsoft's baseline has the agent call its model directly on the Foundry endpoint; API Management is optional. The builder must point the agent's model client at API Management, disable Foundry public access and keys, and give model access only to API Management's managed identity."
        url: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/baseline-microsoft-foundry-chat
      - at: gateway
        text: "Microsoft now offers two gateways for Foundry models and tools: Azure API Management and a separate Azure AI Gateway resource type. The settings in this mapping apply to API Management only, so the builder must choose API Management deliberately."
        url: https://learn.microsoft.com/en-us/azure/foundry/configuration/enable-ai-api-management-gateway-portal
      - at: gateway->openWeb
        text: "Web search runs inside Foundry as a tool of the model platform. Its traffic uses public egress, bypasses API Management and Azure Firewall, and leaves Azure's compliance boundary. Only pages your own code fetches can be forced through your network controls."
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/bing-tools
      - at: localTools
        text: "The code sandbox is a separate service, not part of the agent process. The agent calls a session pool over HTTPS at a dynamicsessions.io address using an Entra token and the Session Executor role. Allow that address through Azure Firewall."
        url: https://learn.microsoft.com/en-us/azure/container-apps/sessions-usage
      - at: localTools->registry
        text: "With egress disabled (the default) sandbox sessions cannot reach the package feed or the memory stores. The agent passes files in and out through the pool API; packages beyond the preinstalled set need a custom container pool."
        url: https://learn.microsoft.com/en-us/azure/container-apps/session-pool
      - at: agent
        text: "Azure adds a separate way out that the generic drawing lacks: the agent's outbound traffic is routed to Azure Firewall with user-defined routes. This works only in a workload profiles Container Apps environment and needs an allow rule per outside address."
        url: https://learn.microsoft.com/en-us/azure/container-apps/use-azure-firewall
      - at: events->agent
        text: "Event Grid delivers events, not schedules. A scheduled run on Azure is an Azure Functions timer trigger with a cron-style expression. The builder adds a timer-triggered function that calls the agent."
        url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-timer
      - at: sources->registry
        text: "Azure Artifacts has no review step for public packages: when anyone with the Collaborator role installs through the feed, the package is saved automatically. Give that role only to a curation pipeline and everyone else Reader."
        url: https://learn.microsoft.com/en-us/azure/devops/artifacts/concepts/upstream-sources
    alsoNeeded:
      - service: "Microsoft Entra ID"
        role: identity
        why: "Signs in users and issues tokens for the managed identities used on every hop."
        url: https://learn.microsoft.com/en-us/entra/fundamentals/what-is-entra
      - service: "Azure Virtual Network with private endpoints and private DNS zones"
        role: network
        why: "Keeps Foundry, Cosmos DB, search and API Management reachable only from inside the network."
        url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
      - service: "Azure Firewall"
        role: network
        why: "The single controlled way out for the agent subnet, with an address allowlist."
        url: https://learn.microsoft.com/en-us/azure/firewall/overview
      - service: "Azure Key Vault"
        role: secrets
        why: "Holds Application Gateway TLS certificates and any secrets for connections that cannot use Entra ID."
        url: https://learn.microsoft.com/en-us/azure/key-vault/general/overview
      - service: "Azure Container Registry"
        role: registry
        why: "Stores the agent and tool-server container images that Container Apps pulls; Azure Artifacts cannot."
        url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-intro
      - service: "Azure Monitor: Application Insights and a Log Analytics workspace"
        role: logging
        why: "Receives traces and diagnostics from the agent, API Management and data stores."
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/log-analytics-workspace-overview
      - service: "Azure AI Content Safety resource"
        role: other
        why: "The llm-content-safety policy sends prompts to it; it must exist as an API Management backend."
        url: https://learn.microsoft.com/en-us/azure/ai-services/content-safety/overview
      - service: "Azure Language resource (PII detection)"
        role: other
        why: "The PII redaction step calls this service; it is a separate resource to deploy."
        url: https://learn.microsoft.com/en-us/azure/ai-services/language-service/personally-identifiable-information/overview
      - service: "Azure API Center"
        role: other
        why: "Holds the inventory of MCP servers and APIs the agent may call."
        url: https://learn.microsoft.com/en-us/azure/api-center/register-discover-mcp-server
      - service: "Azure Blob Storage"
        role: other
        why: "Holds files users upload in chat; Microsoft's baseline uses a storage account for this."
        url: https://learn.microsoft.com/en-us/azure/storage/blobs/storage-blobs-introduction
      - service: "Azure DDoS Protection"
        role: ingress
        why: "Microsoft's baseline puts a DDoS plan on the Application Gateway public address."
        url: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/baseline-microsoft-foundry-chat
    quickstart:
      - title: "Get started with Agent Framework"
        url: https://learn.microsoft.com/en-us/agent-framework/get-started/
      - title: "Import a Microsoft Foundry API"
        url: https://learn.microsoft.com/en-us/azure/api-management/azure-ai-foundry-api
    # <<< checked
    reference:
      - title: Baseline Microsoft Foundry chat reference architecture
        url: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/baseline-microsoft-foundry-chat
      - title: AI gateway capabilities in Azure API Management
        url: https://learn.microsoft.com/en-us/azure/api-management/genai-gateway-capabilities
    summary:
      - >-
        Your own agent on Azure Container Apps behind App Service, reaching models and tools through
        API Management, inside a virtual network whose outbound traffic leaves through Azure
        Firewall. Azure's baseline puts Foundry Agent Service in the harness's place; that managed
        runtime is the API/SDK managed agent runtime drawing, so this one keeps the loop in your code.
    bindings:
      - { block: entry, service: App Service behind Application Gateway with WAF }
      - { block: events, service: Azure Functions with Event Grid triggers }
      - { block: agent, service: Your agent on Azure Container Apps, builtWith: Microsoft Agent Framework, note: "Azure's baseline uses Foundry Agent Service here — the managed alternative." }
      - { block: localTools, service: Container Apps dynamic sessions (code interpreter) }
      - { block: memory, service: "Azure Cosmos DB and Foundry IQ (formerly Azure AI Search)", note: "Microsoft's documentation now calls Azure AI Search Foundry IQ; its role here is unchanged." }
      - { block: gateway, service: Azure API Management (AI gateway) }
      - { block: provider, service: Azure OpenAI in Foundry Models }
      - { block: internalTools, service: "Your MCP servers and APIs, exposed through API Management", build: true }
      - { block: orgData, service: Your systems of record, build: true, note: "Azure SQL, Blob Storage, SharePoint — whatever the tools act on." }
      - { block: openWeb, service: Grounding with Bing Search }
      - { block: sources, service: "Public registries (PyPI, npm)" }
      - { block: registry, service: Azure Artifacts feed }
    # >>> hosting options (compared against the vendor's pages; one is the mapping itself)
    hosting:
      - id: containerApps
        kind: runtime
        name: "Azure Container Apps"
        url: https://learn.microsoft.com/en-us/azure/container-apps/overview
        asOf: "2026-11"
        mapped: true
        compare:
          agentLoop: "Your code runs the loop inside your container; Container Apps runs that container as an app or a job and takes no part in the loop."
          patching: "Microsoft updates and patches the hosts and the control plane; you rebuild your own container image when its base image or dependencies need patches."
          data: "Prompts, tool results and state stay in your container and the stores you choose in your subscription; replica storage is ephemeral unless you mount Azure Files."
          network: "A workload profiles environment in your own virtual network supports private endpoints and user-defined routes to Azure Firewall; network policies are not supported."
          identity: "A system-assigned or user-assigned managed identity that you enable on the app or job and grant roles to through Azure role-based access control."
          framework: "Any runtime, language or framework packaged as a Linux x86-64 container image; privileged containers are not allowed."
          longRunning: "Apps run continuously and scale on KEDA rules; jobs start manually, on a cron schedule or per event such as a queue message, each bounded by a replica timeout."
          portability: "The agent is a standard container image; app, job, scale rule and revision settings are Container Apps resources, and the Kubernetes API is not exposed."
          effort: "Your team operates the agent code, image builds, scale rules, revisions and the virtual network; there is no cluster, node pool or Kubernetes upgrade to run."
          fits: "Microsoft's guidance: one workload with a single shared security boundary, built as containers, that does not need direct access to the Kubernetes API."
        sources:
          - https://learn.microsoft.com/en-us/azure/container-apps/overview
          - https://learn.microsoft.com/en-us/azure/container-apps/compare-options
          - https://learn.microsoft.com/en-us/azure/container-apps/jobs
          - https://learn.microsoft.com/en-us/azure/container-apps/containers
          - https://learn.microsoft.com/en-us/azure/container-apps/networking
          - https://learn.microsoft.com/en-us/azure/container-apps/use-azure-firewall
          - https://learn.microsoft.com/en-us/azure/container-apps/managed-identity
          - https://learn.microsoft.com/en-us/azure/container-apps/planned-maintenance
          - https://learn.microsoft.com/en-us/azure/container-apps/sandboxes-overview
          - https://learn.microsoft.com/en-us/azure/architecture/guide/choose-azure-container-service
          - https://learn.microsoft.com/en-us/azure/architecture/guide/container-service-general-considerations
          - https://learn.microsoft.com/en-us/azure/container-apps/storage-mounts
      - id: aks
        kind: cluster
        name: "Azure Kubernetes Service (AKS)"
        url: https://learn.microsoft.com/en-us/azure/aks/what-is-aks
        asOf: "2026-11"
        compare:
          agentLoop: "Your code runs the loop in pods that you deploy; AKS runs the Kubernetes control plane and takes no part in the loop."
          patching: "Microsoft publishes node images and Kubernetes versions, which you apply or schedule on AKS Standard and Azure applies on AKS Automatic; you rebuild your own image."
          data: "Prompts, tool results and state stay in your pods and the stores you choose; nodes, disks and logs sit in your subscription, and Microsoft Support has limited access."
          network: "Nodes sit in your virtual network; outbound type, Azure Firewall routes, network policies and FQDN filtering are yours to configure, and outbound is open by default."
          identity: "Microsoft Entra Workload ID: a Kubernetes service account federated to a managed identity through the cluster's OIDC issuer, which you enable on AKS Standard."
          framework: "Any Kubernetes workload: any language or framework in a container image, on Linux or Windows node pools, with direct access to the Kubernetes API."
          longRunning: "Deployments run continuously, Kubernetes Jobs and CronJobs cover run-to-completion and scheduled work, and the KEDA add-on starts work from events such as queue messages."
          portability: "The agent is a container image deployed through the Kubernetes API of a CNCF-certified service; workload identity, AKS add-ons and Azure networking are Azure-specific."
          effort: "Your team operates cluster configuration, node pools, upgrades, network policy, add-ons and the workloads; AKS Automatic moves node management and upgrades to Azure."
          fits: "Microsoft's guidance: when you need the Kubernetes API, network policy between colocated workloads or several workloads on one host, and have the skills to run a cluster."
        sources:
          - https://learn.microsoft.com/en-us/azure/aks/what-is-aks
          - https://learn.microsoft.com/en-us/azure/aks/intro-aks-automatic
          - https://learn.microsoft.com/en-us/azure/aks/support-policies
          - https://learn.microsoft.com/en-us/azure/aks/workload-identity-overview
          - https://learn.microsoft.com/en-us/azure/aks/egress-outboundtype
          - https://learn.microsoft.com/en-us/azure/aks/outbound-rules-control-egress
          - https://learn.microsoft.com/en-us/azure/aks/use-network-policies
          - https://learn.microsoft.com/en-us/azure/aks/container-network-security-fqdn-filtering-concepts
          - https://learn.microsoft.com/en-us/azure/aks/keda-about
          - https://learn.microsoft.com/en-us/azure/aks/auto-upgrade-node-os-image
          - https://learn.microsoft.com/en-us/azure/aks/keda-workload-identity
          - https://learn.microsoft.com/en-us/azure/service-bus-messaging/authenticate-application
          - https://learn.microsoft.com/en-us/azure/container-apps/compare-options
          - https://learn.microsoft.com/en-us/azure/architecture/guide/choose-azure-container-service
          - https://learn.microsoft.com/en-us/azure/architecture/guide/container-service-general-considerations
          - https://learn.microsoft.com/en-us/azure/architecture/best-practices/background-jobs
          - https://learn.microsoft.com/en-us/azure/aks/agent-sandbox-cluster-extension
          - https://learn.microsoft.com/en-us/agent-framework/hosting/self-hosting/
        summary: "The agent runs as a Deployment of pods on AKS nodes in your virtual network, reached from App Service through an internal load balancer or Gateway that you create; model-written code runs in separate Kata-isolated sandbox pods. Front end, gateway, models, memory and firewall stay as mapped. On AKS Standard the builder carries node and Kubernetes upgrades, workload identity federation, ingress, network policy, outbound routing, logging add-ons and rollout tooling."
        bindings:
          - { block: agent, service: "Your agent in pods on Azure Kubernetes Service", builtWith: "Microsoft Agent Framework", note: "Runs as a Deployment behind an internal Service, under a Kubernetes service account federated to its own managed identity. Agent Framework's prerelease self-hosting packages cover your container.", url: https://learn.microsoft.com/en-us/agent-framework/hosting/self-hosting/ }
          - { block: localTools, service: "AKS Pod Sandboxing (Kata Containers)", note: "Each sandbox pod runs in its own Kata pod VM on an Azure Linux node pool. The Agent Sandbox extension (preview) adds a Sandbox resource per session but needs the preview v2 runtime and AKS Standard.", url: https://learn.microsoft.com/en-us/azure/aks/agent-sandbox-cluster-extension }
        dropSettings: [agentManagedIdentity, sessionPoolEgress, containerAppsTrafficSplit]
        addSettings: [aksWorkloadIdentity, aksPodSandboxing, aksNetworkPolicy, aksFqdnFiltering, aksContainerLogs, aksCanaryRollout, aksImdsRestriction, aksNodeOsUpgradeChannel, aksDisableLocalAccounts, aksInternalLoadBalancer]
        differences:
          - at: agent->gateway
            text: "By default an AKS cluster has unrestricted outbound internet access, so the agent's pods can reach hosts other than the gateway. The drawing holds only once the outbound type is userDefinedRouting through Azure Firewall, and the firewall must then also allow the outbound network rules and FQDNs that the cluster itself requires."
            url: https://learn.microsoft.com/en-us/azure/aks/outbound-rules-control-egress
          - at: agent
            text: "By default every pod can reach the node's metadata service at 169.254.169.254, which Microsoft says can be exploited to obtain tokens, so the agent is not limited to its own workload identity. IMDS restriction is in preview and excludes add-ons such as Container Insights, Azure Policy and application routing; the alternative is a network policy in each namespace."
            url: https://learn.microsoft.com/en-us/azure/aks/imds-restriction
          - at: entry->agent
            text: "Container Apps gives the agent HTTPS ingress without other infrastructure. On AKS you build the path from App Service: a Service or Gateway that is internal only where you annotate it, since Microsoft's Gateway API examples create a load balancer reachable from outside the cluster. The add-on's managed NGINX ingress loses Azure support after November 2026."
            url: https://learn.microsoft.com/en-us/azure/aks/app-routing-gateway-api
          - at: localTools
            text: "Pod Sandboxing gives each sandbox pod its own VM and guest kernel, but Microsoft states that this boundary is compute isolation only. A Container Apps session blocks outbound requests by default; a pod on AKS can send and receive traffic without limitation until a network policy engine and a default-deny policy for the sandbox namespace are in place."
            url: https://learn.microsoft.com/en-us/azure/aks/concepts-pod-sandboxing
          - at: events->agent
            text: "The Kubernetes API is another way to reach or change the agent with no user in the thread: anyone who can edit workloads in its namespace acts outside the front end and the scheduled-run path. Local accounts are enabled by default and Microsoft describes their admin access as a non-auditable backdoor, so disable them and authorise the API with Microsoft Entra ID."
            url: https://learn.microsoft.com/en-us/azure/aks/local-accounts
        alsoNeeded:
          - service: "Microsoft Entra Workload ID and the cluster OIDC issuer"
            role: identity
            why: "Container Apps attaches a managed identity to the app. On AKS Standard you enable the OIDC issuer and workload identity, then federate a Kubernetes service account to a user-assigned identity; AKS Automatic preconfigures the cluster side."
            url: https://learn.microsoft.com/en-us/azure/aks/workload-identity-overview
          - service: "Microsoft Entra ID access to the Kubernetes API"
            role: identity
            why: "Container Apps is managed only through Azure Resource Manager. AKS adds a Kubernetes API server whose local accounts are enabled by default, so you disable them and control access with Microsoft Entra ID."
            url: https://learn.microsoft.com/en-us/azure/aks/local-accounts
          - service: "Internal load balancer or the application routing add-on (Gateway API)"
            role: ingress
            why: "Container Apps has HTTPS ingress built in. On AKS you create the Service or Gateway that the front end and API Management call. Azure support for the add-on's managed NGINX ingress ends after November 2026, with the Gateway API as its successor."
            url: https://learn.microsoft.com/en-us/azure/aks/app-routing-gateway-api
          - service: "Network policy engine (Azure CNI Powered by Cilium)"
            role: network
            why: "A Container Apps environment is the network boundary and exposes no Kubernetes API. On AKS all pods can send and receive traffic without limitation until you have a policy engine and write default-deny policies per namespace."
            url: https://learn.microsoft.com/en-us/azure/aks/use-network-policies
          - service: "Outbound type and route table for the node subnet"
            role: network
            why: "AKS Standard uses a Standard Load Balancer for egress by default, AKS Automatic a managed NAT gateway. Azure Firewall egress means outbound type userDefinedRouting, a route table and the cluster's required FQDN rules."
            url: https://learn.microsoft.com/en-us/azure/aks/egress-outboundtype
          - service: "Azure Monitor container logging and managed Prometheus"
            role: logging
            why: "Container Apps stores console and system logs in Log Analytics by default. On AKS Standard, Container insights and managed Prometheus are optional features you enable for the cluster; AKS Automatic turns them on by default."
            url: https://learn.microsoft.com/en-us/azure/azure-monitor/containers/kubernetes-monitoring-enable
          - service: "Azure Key Vault provider for Secrets Store CSI Driver"
            role: secrets
            why: "Container Apps has a built-in secret store that can reference Key Vault. On AKS the CSI driver add-on mounts Key Vault secrets, keys and certificates into pods."
            url: https://learn.microsoft.com/en-us/azure/aks/csi-secrets-store-driver
          - service: "Azure Container Registry attached to the cluster"
            role: registry
            why: "Container Apps pulls images with a managed identity set on the app. On AKS the kubelet's managed identity needs the AcrPull role on the registry, which az aks --attach-acr assigns."
            url: https://learn.microsoft.com/en-us/azure/aks/cluster-container-registry-integration
          - service: "Node pools with cluster and node OS auto-upgrade"
            role: other
            why: "Container Apps patches its hosts and control plane. On AKS Standard you size the node pools and apply or schedule Kubernetes version and node image upgrades; AKS Automatic manages nodes and upgrades for you."
            url: https://learn.microsoft.com/en-us/azure/aks/auto-upgrade-node-os-image
        quickstart:
          - title: "Secure access to Azure OpenAI from Azure Kubernetes Service (AKS)"
            url: https://learn.microsoft.com/en-us/azure/aks/open-ai-secure-access-quickstart
          - title: "Self-host Agent Framework applications"
            url: https://learn.microsoft.com/en-us/agent-framework/hosting/self-hosting/
          - title: "Limit network traffic with Azure Firewall in Azure Kubernetes Service (AKS)"
            url: https://learn.microsoft.com/en-us/azure/aks/limit-egress-traffic
      - id: foundryAgentService
        kind: managed
        name: "Microsoft Foundry Agent Service"
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
        asOf: "2026-11"
        pattern: archManagedAgentRuntime
        tool: toolFoundryAgentService
        compare:
          agentLoop: "Microsoft runs the loop for prompt agents; for hosted agents your code runs the loop in a container on Foundry-managed compute, one VM-isolated sandbox per session."
          patching: "Microsoft operates the runtime and its compute; a prompt agent has no code or container to maintain, while a hosted agent's code and container image remain yours."
          data: "Conversations, agent definitions and files sit in Microsoft storage or your own Cosmos DB, Storage and AI Search; hosted session files stay Microsoft-managed."
          network: "Public by default; add a private endpoint inbound any time; set your own or a managed virtual network outbound at account creation only; hosted agents add egress rules."
          identity: "A Microsoft Entra agent identity that Foundry creates and manages for each agent, with no secret for you to hold; it has no resource permissions until you assign roles."
          framework: "Prompt agents are configuration only; hosted agents take Python or C# code built with Agent Framework, LangGraph, OpenAI Agents SDK, Anthropic Agent SDK or your own code."
          longRunning: "Routines start an agent on a timer, a schedule or a GitHub or Teams event; hosted agents add background mode, crash recovery and session state kept through idle periods."
          portability: "A prompt agent is a definition held in Foundry; a hosted agent is your own container, but its endpoint, identity, conversations and Toolbox tools are Foundry services."
          effort: "Your team operates agent definitions or agent code and the Foundry configuration; Microsoft runs the container, scaling, session lifecycle and platform integration."
          fits: "Microsoft's guidance: when you want Microsoft-managed agent hosting; prompt agents without custom orchestration, hosted agents when the agent calls into your own code."
        sources:
          - https://learn.microsoft.com/en-us/azure/foundry/agents/overview
          - https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/prompt-agents
          - https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/hosted-agents
          - https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/routines
          - https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/long-running-agent-resilience
          - https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/networking-options
          - https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/virtual-networks
          - https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/add-hosted-agent-guardrails
          - https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/agent-identity
          - https://learn.microsoft.com/en-us/azure/foundry/agents/environment-setup
          - https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/standard-agent-setup
          - https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/agents/data-privacy-security
          - https://learn.microsoft.com/en-us/agent-framework/hosting/
          - https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/baseline-microsoft-foundry-chat
          - https://learn.microsoft.com/en-us/azure/foundry/concepts/customer-managed-keys
          - https://learn.microsoft.com/en-us/azure/foundry/how-to/configure-private-link
        offers:
          - name: "Prompt agents"
            what: "Agents defined entirely by configuration (model, instructions, tools) in the Foundry portal, SDK, REST API or Azure Developer CLI, which Foundry runs with no code or compute for you to manage."
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/prompt-agents
          - name: "Prompt agents with the Microsoft Copilot harness (preview)"
            what: "An optional Foundry-operated harness, chosen when the prompt agent is created, that adds built-in file-system, shell, web-fetch and subagent tools for multi-step work; in public preview."
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/use-tools-skills-copilot-harness
          - name: "Voice-based prompt agents"
            what: "Real-time spoken agents defined by configuration, with Foundry managing the voice orchestration through Voice Live over a WebSocket; generally available, with GPT-Live, SIP, campaigns and some other features in preview."
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/quickstarts/prompt-voice-agent
          - name: "Hosted agents"
            what: "Your own Python or C# agent code, in any framework, shipped as a container image or a .zip of source that Foundry builds, and run by Foundry in a per-session VM-isolated sandbox with a managed endpoint and a dedicated Entra agent identity; generally available."
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/hosted-agents
          - name: "Responses API (ephemeral agents)"
            what: "Agent code you run elsewhere calls the Responses API on the Foundry project endpoint for models and tools, with the agent definition kept in your application and no agent resource saved in Foundry."
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/quickstarts/responses-api
          - name: "Routines"
            what: "A project-level trigger with one action: a one-time timer, a recurring schedule, or a GitHub issue or Teams message event invokes one prompt agent or hosted agent; customer-managed keys are not supported and the C# SDK support is in beta packages."
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/routines
          - name: "Workflows (preview, retiring 1 December 2026)"
            what: "A visual, declarative builder in the portal that sequences several agents with branching and human-in-the-loop steps; it is in preview and Microsoft retires it on 1 December 2026, pointing new work to Microsoft Agent Framework workflows deployed as hosted agents or to Azure Logic Apps."
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/workflow
          - name: "Agent-to-agent (A2A) endpoints"
            what: "A Foundry agent can be exposed as an A2A endpoint that other agents discover and call, and can call remote A2A agents as a tool; A2A protocol version 1.0 is generally available and version 0.3 is in preview."
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/enable-agent-to-agent-endpoint
          - name: "Multi-agent orchestration in the Responses API (preview)"
            what: "A model creates and coordinates subagents in parallel within one response and combines their work; documented under Azure OpenAI in Foundry, in preview and limited to GPT-5.6 models."
            url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/responses-multi-agent
          - name: "Autopilots"
            what: "Agents with their own Entra agent user account (mailbox, Teams presence, manager) that act as themselves in Microsoft 365, created as instances of a blueprint published from a hosted agent; the quickstart requires enrolment in the Microsoft Agent 365 Frontier preview programme."
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/autopilot-overview
          - name: "Microsoft Foundry Canvas (preview)"
            what: "A GitHub Copilot app extension that opens a side panel for creating, configuring, testing and deploying hosted agents and harness-based prompt agents from a prompt gallery; in preview."
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/foundry-canvas
