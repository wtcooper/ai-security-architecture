  - id: toolClaudeCoworkCloud
    name: Claude Cowork in the cloud
    surfaceClasses:
      - cloudAgent
    variants:
      - name: Cowork on web, mobile and the Chrome side panel (sessions on Anthropic servers)
        class: cloudAgent
        url: >-
          https://support.claude.com/en/articles/15520349-use-claude-cowork-on-web-desktop-and-mobile
      - name: Cowork in Claude Desktop with "Cloud" selected
        class: cloudAgent
        url: https://claude.com/docs/cowork/overview
      - name: Scheduled tasks
        class: cloudAgent
        url: https://support.claude.com/en/articles/13854387-schedule-recurring-tasks-in-claude-cowork
        note: >-
          Unattended runs on the same cloud runtime, owned by the person who scheduled them. Dispatch, listed
          here before 2026-09-25, runs its tasks on the desktop and belongs to the desktop entity.
    architecture: archHostedAgentSessions
    status: beta
    asOf: "2026-09"
    summary:
      - >-
        The Cowork engine run on Anthropic's servers instead of the device: the agent loop and code execution
        run in a per-session ephemeral sandbox, sessions and files are saved to the account and keep working
        with every device offline, and the session can only touch local folders while the desktop app on that
        device is open, over an Anthropic-brokered connection. Every byte leaving the sandbox passes a
        mandatory proxy the sandbox cannot reconfigure; the network policy is the organisation's existing
        network-access setting ("no access" by default on Enterprise). Connector tokens never enter the
        sandbox — calls are made server-side.
      - >-
        Modelled as a vendor-hosted agent session because the loop has left the machine: the doors are the web
        and mobile apps, the Chrome side panel, the desktop app and the scheduler, and the admin plane is
        the claude.ai console only — device managed configuration (allowedWorkspaceFolders,
        coworkEgressAllowedHosts, disabledBuiltinTools) reaches local sessions and not these. Organisation
        settings > Cowork carries "Run Cowork in the cloud" (Team on by default; Enterprise off by default and
        granted through custom roles), the network-access policy under Capabilities, the "Automatically
        approve" and "Always allow for connector tools" toggles, trusted-device enrolment and the OTLP
        collector; the Compliance API captures remote Cowork sessions, including agent-owned scheduled runs.
        Cowork is not covered by zero data retention.
    facts:
      - label: Plans
        value: >-
          Web and mobile in beta for Pro, Max and Team, and for Enterprise where an owner or a custom role
          enables it; the desktop Cloud option follows the same setting.
        url: >-
          https://support.claude.com/en/articles/15520349-use-claude-cowork-on-web-desktop-and-mobile
      - label: Inference & routing
        value: >-
          Anthropic API only. Cloud sessions run on Anthropic infrastructure and are not available when Claude
          Desktop is configured for Bedrock, Vertex, Foundry or a gateway.
        url: https://support.claude.com/en/articles/14479288-claude-cowork-architecture-overview
      - label: Data leaving the device
        value: >-
          Prompts, connector data, browser page content and the session's files live in the account; a
          device's local folders are reachable only while the desktop app is open on it, through the brokered
          connection.
        url: https://support.claude.com/en/articles/14479288-claude-cowork-architecture-overview
      - label: Retention & training
        value: >-
          Cloud sessions are saved to the account (remote transcripts 6 years unless deleted) and captured by
          the Compliance API; Cowork is not covered by ZDR. Commercial terms: no training.
        url: https://platform.claude.com/docs/en/manage-claude/compliance-sessions
      - label: Docs index
        value: >-
          claude.com/docs/cowork plus the Help Center architecture overview and Team/Enterprise admin article
        url: https://claude.com/docs/cowork/overview
    items:
      - title: Enable cloud sessions per role, not per organisation
        body:
          - Organization settings > Cowork > "Run Cowork in the cloud" is off by default on Enterprise; grant
            it through custom roles to the groups that need unattended or device-independent sessions, and
            leave "Enable for your organization" scoped the same way.
        links:
          - title: Use Claude Cowork on Team and Enterprise plans
            url: >-
              https://support.claude.com/en/articles/13455879-use-claude-cowork-on-team-and-enterprise-plans
      - title: Set the network-access policy before the first session
        body:
          - Cloud sandboxes inherit the organisation's network-access setting under Organization settings >
            Capabilities; the Enterprise default is no access. Device keys such as coworkEgressAllowedHosts do
            not reach cloud sessions.
        links:
          - title: Claude Cowork architecture overview
            url: https://support.claude.com/en/articles/14479288-claude-cowork-architecture-overview
    riskNotes:
      - risk: riskPromptInjection
        note: >-
          Documents, connector results and browser pages enter an unattended session as instruction; the
          network-access policy and the connector approval toggles are the containment, and "Automatically
          approve" removes the per-tool prompt.
      - risk: riskShadowAndUnknownAgents
        note: >-
          Scheduled tasks run with no device and no person present; the Compliance API's list of remote
          sessions, including agent-owned scheduled runs, is the inventory.
      - risk: riskSensitiveDataDisclosure
        note: >-
          Sessions and their files are saved to the account and retained for years unless deleted; the session
          can reach a device's folders whenever the desktop app is open there.
    controls:
      - mitigation: D3-APA
        coverage: partial
        mechanism: >-
          "Run Cowork in the cloud" at Organization settings > Cowork plus the "Cowork in the cloud (beta)"
          custom-role capability on Enterprise; only the signed-in account owner starts or steers a session; a
          trusted-device and recent-sign-in requirement for cloud sessions; the built-in browser and Claude in
          Chrome toggles govern the reach-back into devices
        steps:
          - title: Gate cloud sessions by role
            body:
              - On Enterprise turn on "Run Cowork in the cloud" at Organization settings > Cowork and grant the
                Cowork in the cloud capability to groups through custom roles; on Team it is on by default, so
                turn it off there deliberately.
            url: >-
              https://support.claude.com/en/articles/13455879-use-claude-cowork-on-team-and-enterprise-plans
          - title: Require trusted devices for cloud sessions
            body:
              - In the organisation's cloud-session controls require trusted-device enrollment and a recent
                sign-in; it then applies to every cloud session in the organisation.
            url: https://support.claude.com/en/articles/14479288-claude-cowork-architecture-overview
          - title: Decide the reach-back into devices
            body:
              - Toggle the built-in browser at Organization settings > Cowork and Claude in Chrome at Organization
                settings > Claude in Chrome.
            url: >-
              https://support.claude.com/en/articles/16635803-set-up-browser-use-in-claude-cowork-for-team-and-enterprise-plans
        note: >-
          Partial by the rule: enablement is per role on Enterprise (organisation-wide only on Team) and there is
          no repository, bot or channel trigger, but the trigger condition is fixed by the vendor (the account
          owner, from any of their devices), scheduled tasks, which start sessions with nobody present, have no
          switch of their own on standard deployments (scheduledTasksEnabled is a 3P key), and the trusted-device
          requirement is described without a named toggle. Sessions cannot be shared with other members.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityIga
          reviewRequired: false
          original:
            - capability: capabilityIga
              coverage: native
              mechanism: >-
                "Run Cowork in the cloud" per custom role; trusted-device enrolment; SSO at the account layer
              steps:
                - title: Gate cloud sessions by role
                  body:
                    - On Enterprise the cloud toggle is off by default and granted through custom roles; Team
                      turns it on by default, so turn it off there deliberately.
                  url: >-
                    https://support.claude.com/en/articles/13455879-use-claude-cowork-on-team-and-enterprise-plans
              verified: 2026-09-17
      - mitigation: D3-EI
        coverage: native
        mechanism: >-
          An isolated, temporary sandbox per session on Anthropic-managed infrastructure, created when the
          session starts and destroyed when it ends, sharing no state with other sessions or organisations and
          unable to reach private, internal, link-local or cloud-metadata addresses; always on
        steps:
          - title: Record the isolation claim
            body:
              - The architecture overview states one sandbox per session, destroyed at the end, with no state
                shared across sessions or organisations; there is no setting to change.
            url: https://support.claude.com/en/articles/14479288-claude-cowork-architecture-overview
        note: >-
          Native by the rule: one sandbox per session, reclaimed after it, documented by the vendor, with
          assurance through assessment rather than a setting. Outside it: the reach-back to a member's device
          (local files, the built-in browser and Claude in Chrome run there, only while the desktop app is
          online and only for connected folders), connector calls and web fetch or web search, which run on
          Anthropic's servers.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAgentSandboxing
          reviewRequired: false
          original:
            - capability: capabilityAgentSandboxing
              coverage: native
              mechanism: Per-session ephemeral sandbox on Anthropic servers; always on, no toggle
              note: >-
                Vendor-internal isolation with no administrator setting; the architecture overview is the
                claim, assurance is the evidence.
              steps:
                - title: Read the architecture overview
                  body:
                    - Each cloud session runs in its own ephemeral sandbox with no access to the
                      organisation's network by default; local folders are reachable only through the desktop
                      app's brokered connection.
                  url: https://support.claude.com/en/articles/14479288-claude-cowork-architecture-overview
              verified: 2026-09-17
      - mitigation: cap-agent-egress-control
        coverage: native
        mechanism: >-
          The organisation's network-access policy (Organization settings > Capabilities, Code execution and file
          creation, "Allow network egress") enforced by a mandatory proxy outside the sandbox that it cannot
          reconfigure or bypass; no network access by default on Enterprise; applied when a session is created
        steps:
          - title: Choose the network-access level
            body:
              - At Organization settings > Capabilities keep "Allow network egress" off or choose package managers
                and specific domains, listing only the hosts sessions need.
            url: https://support.claude.com/en/articles/12111783-create-and-edit-files-with-claude
          - title: Confirm cloud sessions inherit it
            body:
              - Cloud sessions use the same network-access setting as local Cowork and chat, enforced by the
                mandatory egress proxy.
            url: https://support.claude.com/en/articles/14479288-claude-cowork-architecture-overview
        note: >-
          Native by the rule: an admin-authored allowlist members cannot change, enforced around the sandbox.
          The setup and agent phases are not separated, every allowlist preset keeps public package managers,
          and changes reach new sessions only. Outside it: connector calls and web fetch or web search (server
          side; web search can be turned off at Organization settings > Capabilities), the built-in browser and
          Claude in Chrome on the member's device, and the inference API. Device egress keys do not apply.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityEgressControl
          reviewRequired: false
          original:
            - capability: capabilityEgressControl
              coverage: native
              mechanism: Organisation network-access policy enforced by a mandatory sandbox proxy
              note: >-
                The policy is set at Organization settings > Capabilities and applies to every cloud session;
                device egress keys do not apply.
              steps:
                - title: Choose the network-access level
                  body:
                    - Enterprise defaults to no access; widen to an allowlist only for the groups whose sessions need the web.
                  url: https://support.claude.com/en/articles/14479288-claude-cowork-architecture-overview
              verified: 2026-09-17
      - mitigation: D3-CTS
        coverage: native
        mechanism: >-
          Connector authorisation tokens never enter the sandbox and connector calls are made on the server
          side; the sandbox holds only session-scoped tokens that expire within hours; there is no repository
          credential
        steps:
          - title: Record the credential boundary
            body:
              - The architecture overview states the sandbox holds only session-scoped tokens that expire within
                hours and that connector tokens never enter it; nothing is configured.
            url: https://support.claude.com/en/articles/14479288-claude-cowork-architecture-overview
          - title: Narrow what connector grants reach
            body:
              - At Organization settings > Connectors set up Managed authorization for supported connectors with
                chosen Scopes and Applied roles, so the IdP issues and revokes the grant.
            url: https://support.claude.com/en/articles/15537633-authorize-mcp-connectors-for-your-entire-organization
        note: >-
          Native by the rule: the credentials that matter stay outside the sandbox and what is inside is
          session-scoped and short-lived. What remains in the member's authority: connector calls carry the
          member's full grant (no on-behalf-of exchange; managed authorisation narrows scopes for the listed
          connectors, Okta only), a session that reaches the member's desktop acts in their Chrome sessions
          through Claude in Chrome, and files saved to the account, secrets included, are readable by the model.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityCredentialIsolation
          reviewRequired: false
          original:
            - capability: capabilityCredentialIsolation
              coverage: native
              mechanism: Connector tokens held server-side; never present in the sandbox
              steps:
                - title: Confirm connector calls are server-side
                  body:
                    - The architecture overview states connector tokens never enter sandboxes and calls are
                      made server-side; no per-session credential is exposed to the model.
                  url: https://support.claude.com/en/articles/14479288-claude-cowork-architecture-overview
              verified: 2026-09-17
