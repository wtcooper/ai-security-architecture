    where: "Kubeflow Pipelines › pipeline definition: the registration and signing tasks placed inside dsl.If on the evaluation task's output"
    setVia: [code]
    area: tools
    recommended: "Capability, safety, backdoor and memorisation results must pass thresholds before the registration task runs; benchmark data is read from a bucket the run's authors cannot write"
