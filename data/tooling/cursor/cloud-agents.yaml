      - mitigation: AML.M0028
        coverage: native
        verified: "2026-09-10"
        mechanism: >-
          GitHub App scope (Selected repositories; access never wider than the triggering user); Protected Git
          Scopes; Repository Blocklist; Team feature settings (Long running agents, Computer use);
          per-automation tool enablement; MCP allowlist
        steps:
          - title: Scope repository reach
            body:
              - Install the GitHub App on Selected repositories, keep the Repository Blocklist for sensitive
                repos, and rely on the rule that a Cloud Agent can only reach repositories the triggering user
                could.
            url: https://cursor.com/docs/cloud-agent/security
          - title: Manage the blocklist by API
            body:
              - Read and update repository blocklist glob patterns through /settings/repo-blocklists/repos.
            url: https://cursor.com/docs/account/teams/admin-api
          - title: Switch off tools the team does not need
            body:
              - In Cloud Agent dashboard settings disable Computer use and Long running agents, and set Team
                follow-ups to Disabled or Service accounts only.
            url: https://cursor.com/docs/cloud-agent/settings
          - title: Keep the MCP allowlist in force
            body:
              - The Enterprise MCP Configuration applies to cloud runs; Automations only get the tools (PRs,
                Slack, MCP, memory, computer use) you enable per automation.
            url: https://cursor.com/docs/enterprise/model-and-integration-management
          - title: Commit fail-closed command hooks
            body:
              - Cloud agents run command-based hooks from the repository (prompt-based hooks are not supported
                there); set failClosed true on beforeShellExecution and beforeMCPExecution so a crashed or
                timed-out hook blocks rather than allows.
            url: https://cursor.com/docs/hooks
          - title: Restrict MCP tools centrally
            body:
              - Use the Tools field per server in the Enterprise MCP Configuration to name the tools a server
                may run; it applies to Cloud Agents as well as the IDE.
            url: https://cursor.com/docs/enterprise/model-and-integration-management
          - title: Allowlist servers for cloud runs
            body:
              - Add each permitted server by command string or URL pattern in the Enterprise MCP Configuration
                and give local servers an Allowlist or Deny all network mode; the configuration applies to
                Cloud Agents and Bugbot as well as the IDE.
            url: https://cursor.com/docs/enterprise/model-and-integration-management
        evidence: []
        note: >-
          Repository scope, blocklists and Protected Git Scopes limit resources; per-automation tool
          enablement hides tools; there is no pre-approval layer because runs are unattended. MCP tools follow
          the MCP allowlist.


