    setVia: [configFile]
    area: network
    default: "Off: the proxy fetches the model cost map and other catalogues from raw.githubusercontent.com, looks up the latest release at docs.litellm.ai and api.github.com, checks api.pwnedpasswords.com and downloads tokenisers from huggingface.co"
    recommended: "LITELLM_OFFLINE_MODE=true, with LITELLM_TELEMETRY_DISABLED=true, NO_REDOC=True and CHECKPOINT_DISABLE=1; callback packages built into the image; LITELLM_LICENSE set only if licensed, since the proxy then contacts license.litellm.ai when it cannot verify the key locally"
    value: "LITELLM_OFFLINE_MODE=true, telemetry disabled"
    why: "A gateway with no route out, or only an allowlisted one, should not try to leave. These switches stop the start-up fetches, so a blocked request is never a silent fallback or a reason to open the firewall."
    mitigations: [D3-ACH]
    url: https://docs.litellm.ai/docs/proxy/outbound_requests
    verified: "2026-11-18"
  - id: litellmPassThroughOff
    name: "pass_through_endpoints and route exposure"
    product: "LiteLLM"
    where: "LiteLLM Proxy › general_settings.pass_through_endpoints; environment DISABLE_ADMIN_UI, NO_DOCS; path rules on the ingress in front"
    setVia: [configFile]
    area: network
    default: "All proxy routes are exposed on the one port (allowed_routes unset)"
    requires: "general_settings.allowed_routes, admin_only_routes and auth on pass-through endpoints need a LiteLLM Enterprise licence, so the open-source build restricts paths at the ingress"
    recommended: "No pass_through_endpoints defined; tenants reach only the inference paths through the ingress route, key management and the admin UI are reachable only from the platform network, and DISABLE_ADMIN_UI and NO_DOCS are set on tenant-facing instances"
    value: "None defined; tenants reach inference paths only"
    why: "Callers get the inference API and nothing else: no route that forwards to an arbitrary target and no management endpoint to probe."
    mitigations: [D3-ACH]
    url: https://docs.litellm.ai/docs/proxy/public_routes
    verified: "2026-11-18"
  - id: vllmOfflineMode
    name: "HF_HUB_OFFLINE"
    product: "vLLM"
    where: "vLLM pod › environment; vllm serve given a local path (or an s3:// URL) as the model"
    setVia: [configFile]
    area: network
    default: "Off: given a Hub model id, vllm serve downloads the weights at start"
    recommended: "HF_HUB_OFFLINE=1, the model argument a local path on a read-only volume filled from the weights bucket (or an s3:// URL with --load-format runai_streamer and AWS_ENDPOINT_URL set to the object gateway), and no HF_TOKEN in the pod"
    value: "HF_HUB_OFFLINE=1, local weights, no HF_TOKEN"
    why: "The serving pod loads only the promoted files already inside the boundary and never asks the public hub for anything at start."
    mitigations: [D3-ACH]
    url: https://huggingface.co/docs/huggingface_hub/package_reference/environment_variables
    verified: "2026-11-18"
  - id: vllmUsageStatsOff
    name: "VLLM_NO_USAGE_STATS"
    product: "vLLM"
    where: "vLLM pod › environment"
    setVia: [configFile]
    area: network
    default: "On: vLLM sends anonymous usage data to its maintainers (VLLM_USAGE_STATS_SERVER defaults to https://stats.vllm.ai) unless VLLM_NO_USAGE_STATS or DO_NOT_TRACK is set, or a ~/.config/vllm/do_not_track file exists"
    recommended: "VLLM_NO_USAGE_STATS=1 and DO_NOT_TRACK=1 on every serving pod, whether or not the serving network has a route out"
    value: "VLLM_NO_USAGE_STATS=1 and DO_NOT_TRACK=1"
    why: "Nothing about the deployment (model architecture, GPU type, version) is reported outside the data centre."
    mitigations: [D3-ACH]
    url: https://docs.vllm.ai/en/latest/usage/usage_stats.html
    verified: "2026-11-24"
  - id: harborProxyCache
    name: "Proxy Cache project"
    product: "Harbor"
    where: "Harbor › New Project › Proxy Cache, with a registry endpoint"
    setVia: [adminConsole]
    area: network
    recommended: "One proxy cache project per upstream registry the platform needs; nodes pull only from Harbor, by digest, and no node has a route to a public registry"
    value: "One per upstream; nodes pull only from Harbor"
    why: "Public images arrive through one door you control and are scanned there, so the cluster needs no direct path to the internet."
    mitigations: [D3-NI]
    url: https://goharbor.io/docs/latest/administration/configure-proxy-cache/
    verified: "2026-11-18"
  - id: ciliumHostFirewall
    name: "Host firewall (host network policy)"
    product: "Cilium"
    where: "Cilium › Helm value hostFirewall.enabled=true; CiliumClusterwideNetworkPolicy with spec.nodeSelector"
    setVia: [clusterPolicy]
    area: network
    default: "Off until hostFirewall.enabled is set"
    recommended: "On for the sandbox node pools: a host policy that admits only the control plane, the kubelet and the telemetry collector, with no rule from one sandbox node to another; proved in policy audit mode first"
    value: "On for sandbox nodes, proved in audit mode first"
    why: "If a rollout breaks out of its sandbox it lands on a node that cannot open a connection to any other node."
    mitigations: [D3-NI]
    url: https://docs.cilium.io/en/stable/security/host-firewall/
    verified: "2026-11-18"
  # --- Logging & audit -----------------------------------------------------------------
  - id: langfuseTracing
    name: "Self-hosted Langfuse (model and agent traces)"
    product: "Langfuse"
    where: "Langfuse on Kubernetes (Helm) with its own PostgreSQL, ClickHouse, Valkey and S3-compatible bucket; LiteLLM success_callback: [\"langfuse\"] with LANGFUSE_HOST, LANGFUSE_PUBLIC_KEY and LANGFUSE_SECRET_KEY"
    setVia: [configFile]
    area: audit
    default: "LANGFUSE_HOST defaults to https://cloud.langfuse.com, so the LiteLLM callback sends to Langfuse Cloud unless it is set"
    requires: "Langfuse audit logs, data retention policies and server-side masking need an Enterprise licence key; tracing does not"
    recommended: "LANGFUSE_HOST set to the Langfuse instance in your own data centre; the gateway, not the agents, holds the Langfuse keys; one trace per session, run or task carrying the agent identity and the user or trigger it acts for; operators can read traces while the work is still running"
    value: "LANGFUSE_HOST set to your own instance"
    why: "Which agent did what, on whose behalf, with which prompt, tool calls and result is one readable trace in the organisation's own store, which the agents have no credentials for."
    mitigations: [cap-agent-tracing]
    url: https://langfuse.com/self-hosting
    verified: "2026-11-18"
  - id: litellmLoggingCallbacks
    name: "Logging callbacks (callbacks, success_callback, failure_callback)"
    product: "LiteLLM"
    where: "LiteLLM Proxy › config.yaml › litellm_settings: callbacks, success_callback, failure_callback, s3_callback_params (s3_endpoint_url), global_disable_no_log_param, turn_off_message_logging; callback_settings; OTEL_EXPORTER and OTEL_ENDPOINT"
    setVia: [configFile]
    area: audit
    default: "No callback is configured, and a caller can skip logging for a request with no-log. Message content is logged unless turn_off_message_logging is set; Langfuse logging goes to Langfuse Cloud unless LANGFUSE_HOST is set"
    recommended: "callbacks: [\"otel\"] to your OpenTelemetry Collector, plus s3_v2 to a bucket only the gateway can write or langfuse to your own instance; failure_callback set too; global_disable_no_log_param: true; turn_off_message_logging only where content must not be kept; redact_user_api_key_info left off"
    value: "otel to your own collector; no-log param disabled"
    why: "Every model and tool call that crosses the gateway is recorded with the key and team it belongs to, in stores the organisation runs, and a caller cannot ask for a request to be left out."
    mitigations: [cap-agent-tracing, AML.M0024]
    url: https://docs.litellm.ai/docs/proxy/logging
    verified: "2026-11-18"
  - id: lokiRetentionImmutability
    name: "Compactor retention (retention_enabled, retention_period)"
    product: "Grafana Loki"
    where: "Grafana Loki › compactor: retention_enabled, delete_request_store; limits_config: retention_period; chunks in an object store bucket that only Loki's identity can write"
    setVia: [configFile]
    area: audit
    default: "Retention is off until the compactor enables it: logs sent to Loki are kept indefinitely"
    recommended: "retention_enabled: true with a retention_period that meets the organisation's record-keeping rule; chunks in a bucket with object lock that only Loki can write; only the collector writes to Loki, and no workload holds credentials for Loki, its delete API or the bucket"
    value: "retention_enabled: true, object-locked bucket"
    why: "The record of what the workloads did is kept for a set time, outlives the run, and cannot be edited or deleted by the workloads it describes."
    mitigations: [cap-agent-tracing, AML.M0024]
    url: https://grafana.com/docs/loki/latest/operations/storage/retention/
    verified: "2026-11-18"
  - id: otelCollectorPipeline
    name: "Collector pipelines (receivers, processors, exporters)"
    product: "OpenTelemetry Collector"
    where: "OpenTelemetry Collector › config.yaml › receivers, processors, exporters, service.pipelines for traces, metrics and logs"
    setVia: [configFile]
    area: audit
    recommended: "An OTLP receiver for the gateway, the services and the node agents, exporters to Loki, Prometheus and the SIEM, and the collector in its own namespace that workloads can send to but not read from or change"
    value: "OTLP in; Loki, Prometheus and SIEM out"
    why: "Each tool call, agent step and host event leaves the place it happened as it happens and lands where it can be searched in an incident."
    mitigations: [AML.M0024, cap-agent-tracing]
    url: https://opentelemetry.io/docs/collector/configuration/
    verified: "2026-11-18"
  - id: mlflowModelRegistryStages
    name: "Model Registry aliases and tags"
    product: "MLflow"
    where: "MLflow › Model Registry › registered model version: alias (for example @champion), tags, description"
    setVia: [apiCli, adminConsole]
    area: audit
    recommended: "Each release registered as a version linked to the run that produced it, with a description and tags for the weights digest, base model or publisher, format and scan result; an approver who is not the author moves the alias, and deployment reads the version by alias"
    value: "Versioned and tagged; alias moved by a non-author"
    why: "The registry is the record of which model file is serving, where it came from and who approved it."
    mitigations: [AML.M0023, cap-model-documentation, cap-staged-rollout-gate]
    url: https://mlflow.org/docs/latest/ml/model-registry/
    verified: "2026-11-18"
  - id: mlflowDatasetTracking
    name: "MLflow Dataset Tracking (mlflow.log_input)"
    product: "MLflow"
    where: "MLflow › an mlflow.data dataset with its source and digest, logged with mlflow.log_input(dataset, context=\"training\") in every run"
    setVia: [code]
    area: audit
    recommended: "Each curation run logs the dataset version it produced with its source and digest, and each training run logs the dataset it read with context training and the base model as a tag"
    value: "Every curation and training run logs its dataset"
    why: "A model version can be traced to its run, the exact data it was trained on and where that data came from."
    mitigations: [AML.M0025, AML.M0023]
    url: https://mlflow.org/docs/latest/ml/dataset/
    verified: "2026-11-18"
  - id: k8sAuditLogging
    name: "Audit policy (--audit-policy-file)"
    product: "Kubernetes"
    where: "Kubernetes › kube-apiserver flags: --audit-policy-file, --audit-log-path (or the webhook backend)"
    setVia: [configFile]
    area: audit
    default: "No events are logged when the flag is omitted"
    recommended: "A policy that records at least Metadata for every request and RequestResponse for job, pipeline, Sandbox, SandboxClaim, role and RoleBinding resources; Secrets at Metadata only, never RequestResponse; events shipped off the control plane nodes to the log store and the SIEM"
    value: "Metadata for all, RequestResponse for key resources"
    why: "The platform itself records who started each run, under which identity, and who created, changed or deleted a workload, a role or a secret, outside the cluster the run could touch."
    mitigations: [AML.M0024, cap-agent-tracing]
    url: https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
    verified: "2026-11-18"
  - id: tetragonTracingPolicy
    name: "TracingPolicy"
    product: "Tetragon"
    where: "Tetragon › TracingPolicy custom resource (kprobes, tracepoints, selectors, Signal and Override actions); events exported from each node"
    setVia: [clusterPolicy]
    area: audit
    recommended: "Process, file and network events from every sandbox node exported off the node, with a TracingPolicy that sends SIGKILL on a short, reviewed list of serious-risk actions"
    value: "Events exported; SIGKILL on a reviewed risk list"
    why: "The host under the sandboxes is watched from the kernel, outside anything a rollout controls, and the worst actions are stopped where they happen."
    mitigations: [cap-agent-tracing, cap-agent-kill-switch]
    url: https://tetragon.io/docs/concepts/tracing-policy/
    verified: "2026-11-18"
  - id: trivyK8sCompliance
    name: "Kubernetes compliance reports (trivy k8s --compliance)"
    product: "Trivy"
    where: "Trivy › trivy k8s --compliance k8s-nsa-1.0 or k8s-cis-1.23, with the node collector on"
    setVia: [apiCli]
    area: audit
    recommended: "Run against the sandbox cluster before each run and after every platform change; failed checks on the sandbox nodes or namespaces block the run until fixed"
    value: "Before each run and after every platform change"
    why: "The cluster's own hardening is checked against a published benchmark before a model is given a foothold in it."
    mitigations: [D3-SYSVA]
    url: https://trivy.dev/docs/latest/target/kubernetes/
    verified: "2026-11-18"
  - id: litellmAgentTraceId
    name: "require_trace_id_on_calls_to_agent"
    product: "LiteLLM"
    where: "LiteLLM Proxy › agent litellm_params: require_trace_id_on_calls_to_agent, require_trace_id_on_calls_by_agent"
    setVia: [apiCli, adminConsole]
    area: audit
    recommended: "true on every registered agent, with the A2A task id sent as x-litellm-trace-id and X-LiteLLM-Agent-Id forwarded on the agent's own model calls"
    value: "true on every registered agent"
    why: "A task cannot cross the gateway without a trace identifier, so your record and the partner's record of the same task can be matched."
    mitigations: [cap-agent-tracing]
    url: https://docs.litellm.ai/docs/a2a
    verified: "2026-11-18"
  # --- Sharing -------------------------------------------------------------------------
  - id: nexusProxyAllowlist
    name: "Routing Rules"
    product: "Nexus Repository"
    where: "Sonatype Nexus Repository › Settings › Routing Rules (BLOCK or ALLOW mode, path matchers); assigned in each proxy repository's Routing Rule field"
    setVia: [adminConsole]
    area: sharing
    default: "No rule: a proxy repository fetches any requested component from its remote, the public registry"
    requires: "Routing rules are in Community Edition and match on the request path only. Malware and look-alike-name detection and quarantine is Sonatype Repository Firewall, a separate paid product (Pro+ or Enterprise). Community Edition is capped at 40,000 components and 100,000 requests a day; a large fleet needs the Pro edition or Pulp"
    recommended: "On each proxy repository (PyPI, npm, Hugging Face), an ALLOW rule listing only the approved package and model paths, or a BLOCK rule covering every in-house package name and namespace so it is never fetched from outside; all installs go through the mirror (pip index-url), pinned by hash"
    value: "ALLOW approved paths, or BLOCK in-house names"
    why: "A package or model reaches a workload only if the mirror was told to admit it, and an internal name cannot be answered by a public look-alike."
    mitigations: [D3-FA, AML.M0028]
    url: https://help.sonatype.com/en/routing-rules.html
    verified: "2026-11-18"
  - id: trivyScanPipeline
    name: "Vulnerability scanning of images and dependencies"
    product: "Trivy"
    where: "Trivy › pipeline steps trivy image <ref> and trivy fs <project or lock file> with --severity HIGH,CRITICAL --exit-code 1; Trivy's vulnerability databases mirrored in your own registry"
    setVia: [apiCli]
    area: sharing
    default: "Vulnerability and secret scanning are on; Trivy exits with code 0 even when it finds issues unless --exit-code is set. Trivy pulls its databases from mirror.gcr.io and ghcr.io and contacts check.trivy.dev, which a cluster with no route out cannot reach"
    recommended: "On every change and nightly build, trivy image and trivy fs with --severity HIGH,CRITICAL --exit-code 1 on each image and lock file before it is pushed to the registry or promoted to the package mirror; Trivy's databases mirrored inside the data centre. Trivy finds known flaws, not malicious or look-alike packages: that check is a row of its own"
    value: "HIGH,CRITICAL with --exit-code 1, databases mirrored"
    why: "Known flaws and embedded secrets in the images and packages you run are found before they are admitted and again as new advisories appear, and a failing scan stops the build instead of producing a report nobody reads."
    mitigations: [D3-FA, D3-AVE, D3-SYSVA]
    url: https://trivy.dev/docs/latest/guide/scanner/vulnerability/
    verified: "2026-11-18"
  - id: packageMalwareCheck
    name: "Malicious-package and name-similarity check before promotion"
    where: "Your package mirror's admission step › a malware and look-alike-name check on every package proxied in from a public registry, run before it is promoted to the repository workloads install from"
    setVia: [code, adminConsole]
    area: sharing
    default: "None out of the box: mirror routing rules match request paths and vulnerability scanners match known flaws, so neither stops a malicious or look-alike package"
    recommended: "Every package from a public registry passes a malicious-package and name check before promotion, with a quarantine repository for what fails. Ways to do it: a repository firewall in the mirror (Sonatype Repository Firewall's Security-Malicious policy and namespace confusion protection; JFrog Curation), OSV's malicious-package advisories from the OpenSSF Malicious Packages feed matched by osv-scanner, or a heuristic scanner such as GuardDog; names close to your approved or in-house packages held for review"
    value: "Malware and look-alike check before promotion"
    why: "A package that runs harmful code when installed, or impersonates a popular or in-house name, is stopped before an agent or a workload can install it."
    mitigations: [D3-FA]
    url: https://google.github.io/osv.dev/data/
    verified: "2026-11-24"
  - id: packageMinReleaseAge
    name: "Minimum release age (npm min-release-age, pip --uploaded-prior-to)"
    where: "The package client in the app template and the build image: npm config min-release-age (days) with min-release-age-exclude; pip install --uploaded-prior-to P<n>D (PIP_UPLOADED_PRIOR_TO); or an age policy in the mirror's repository firewall"
    setVia: [configFile]
    area: sharing
    default: "Off: npm's min-release-age defaults to null, and pip considers every upload unless --uploaded-prior-to is set"
    requires: "pip's --uploaded-prior-to works only with an index that provides upload-time metadata, which a mirror may not serve"
    recommended: "A hold of several days on new versions: in the mirror where its firewall evaluates a version's age (JFrog Curation weighs immaturity), or else in the client, with min-release-age in the template's .npmrc and PIP_UPLOADED_PRIOR_TO in the build image; urgent fixes let through by a reviewed min-release-age-exclude entry"
    value: "New versions held for several days"
    why: "A name an agent invented and an attacker registered last week, or a hijacked release, is not installed before it has a history."
    mitigations: [D3-FA]
    url: https://docs.npmjs.com/cli/v11/using-npm/config
    verified: "2026-11-24"
  - id: peerPlatformReview
    name: "Assess the peer platform before federation"
    where: "Your vendor risk process › a recorded assessment per peer platform, renewed yearly and attached to its agent record"
    setVia: [code]
    area: sharing
    recommended: "Before any federation is configured: how the platform handles the identity assertions you send, how it separates customers, whether it signs its Agent Cards, what audit records it exports and whether it honours CancelTask"
    value: "Before any federation is configured"
    why: "Your users' identities travel to this platform, so the decision to federate rests on evidence of how it will treat them."
    mitigations: [cap-ai-vendor-assessment]
    url: https://a2a-protocol.org/latest/specification/
    verified: "2026-11-18"
  # >>> hosting rows (settings used only by a hosting variant)
  - id: knativeScaleBounds
    name: "Scale bounds (min-scale, max-scale)"
    product: "Knative Serving"
    where: "Knative Serving › Service spec.template.metadata.annotations: autoscaling.knative.dev/min-scale, autoscaling.knative.dev/max-scale; ConfigMap config-autoscaler (knative-serving): max-scale-limit, enable-scale-to-zero"
    setVia: [apiCli]
    area: tools
    default: "max-scale is 0, which means unlimited; min-scale is 0 with the default autoscaler (KPA) and scale to zero enabled, so an idle Revision has no pod"
    recommended: "max-scale on every agent Service, set to the replicas your GPU and gateway budgets can serve, and max-scale-limit in config-autoscaler so no new Revision exceeds it; min-scale 1 only where a cold start is not acceptable"
    value: "max-scale within your GPU and gateway budgets"
    why: "Knative adds pods as requests arrive and has no upper bound by default, so a burst of events or turns would otherwise become a burst of agent pods all calling the gateway."
    mitigations: [AML.M0036]
    url: https://knative.dev/docs/serving/autoscaling/scale-bounds/
    verified: "2026-11-18"
  - id: knativeRequestLimits
    name: "containerConcurrency and timeoutSeconds"
    product: "Knative Serving"
    where: "Knative Serving › Service spec.template.spec: containerConcurrency, timeoutSeconds, responseStartTimeoutSeconds, idleTimeoutSeconds; ConfigMap config-defaults (knative-serving): max-revision-timeout-seconds"
    setVia: [apiCli]
    area: tools
    default: "containerConcurrency is 0 (no limit); timeoutSeconds defaults to 300 and cannot exceed max-revision-timeout-seconds, which defaults to 600"
    recommended: "containerConcurrency set to the runs one pod can hold (extra requests are queued), and timeoutSeconds set to the longest run or stream you accept; raise max-revision-timeout-seconds only as far as that needs, together with the activator's terminationGracePeriodSeconds"
    value: "Concurrency per pod and timeout to the longest run"
    why: "With max-scale this fixes how many runs can be in flight at once and how long one may last, so a stuck loop is cut off by the platform as well as by the gateway's budget."
    mitigations: [AML.M0036]
    url: https://knative.dev/docs/serving/configuration/config-defaults/
    verified: "2026-11-18"
  - id: knativeGatewayApiIngress
    name: "Gateway API networking layer (config-gateway)"
    product: "Knative Serving"
    where: "Knative Serving › ConfigMap config-network (knative-serving): ingress-class gateway-api.ingress.networking.knative.dev; ConfigMap config-gateway: external-gateways, local-gateways (class, gateway, service, supported-features)"
    setVia: [apiCli]
    area: network
    default: "Not installed: Knative needs a networking layer and you choose one. If config-gateway is left out, net-gateway-api falls back to Istio-oriented gateway names"
    requires: "net-gateway-api is in beta; Knative tests it against the Istio, Contour and Envoy Gateway implementations of Gateway API"
    recommended: "external-gateways names the Gateway that your front door's sign-in and rate-limit policies target (with Envoy Gateway, the Gateway its OIDC SecurityPolicy and rate-limit BackendTrafficPolicy attach to), so every route Knative generates is covered; local-gateways names a separate Gateway, reachable only by the callers you admit. Both list HTTPRouteRequestTimeout in supported-features"
    value: "external-gateways names the front door's Gateway"
    why: "Knative writes the routes, not you, so the sign-in and the rate limit hold only if their policies target the Gateway named in config-gateway; that keeps one front door for people and the entry controls of the mapped option in force. On Envoy Gateway, without HTTPRouteRequestTimeout every request ends after 15 seconds."
    mitigations: [D3-NI]
    url: https://knative.dev/docs/serving/config-network-adapters/
    verified: "2026-11-18"
  - id: knativeTrafficSplit
    name: "Traffic splitting between Revisions (traffic)"
    product: "Knative Serving"
    where: "Knative Serving › Service spec.traffic[]: revisionName, percent, tag, latestRevision; annotation serving.knative.dev/rollout-duration on the Service or Route"
    setVia: [apiCli]
    area: tools
    default: "No traffic block: when a new Revision is ready, 100% of traffic shifts to it immediately"
    recommended: "Pin traffic to a named Revision; add each new Revision at percent 0 with a tag, run the evaluation gate against its tagged address, then raise percent in steps. Move percent back to the previous Revision to roll back"
    value: "Pinned; new Revisions at 0%, raised in steps"
    why: "A new prompt, tool list or agent build then takes production traffic only after it passed the gate, and the previous Revision is kept ready to take the traffic back."
    mitigations: [cap-staged-rollout-gate]
    url: https://knative.dev/docs/serving/traffic-management/
    verified: "2026-11-18"
  # <<< hosting rows
  # >>> more hosting rows (settings used only by a hosting variant of the server, inference, training and sandbox patterns)
  - id: gvisorRunscPlatform
    name: "runsc platform (--platform: systrap or kvm)"
    product: "gVisor"
    where: "gVisor › /etc/containerd/runsc.toml › [runsc_config] platform = \"kvm\" or \"systrap\"; containerd config.toml, runsc runtime options: TypeUrl io.containerd.runsc.v1.options and ConfigPath"
    setVia: [configFile]
    area: tools
    default: "systrap"
    requires: "The KVM platform needs KVM and access to /dev/kvm on the node; gVisor recommends it on bare metal only"
    recommended: "On bare-metal sandbox nodes set platform = \"kvm\", which gVisor advises there for performance and which uses virtualisation for address-space isolation; keep systrap on nodes that are virtual machines. Leave network at its default (the sandbox's own stack) and do not enable host networking."
    value: "kvm on bare metal, systrap on virtual machines"
    why: "The default platform, systrap, traps system calls with seccomp on the host kernel. gVisor recommends KVM on bare metal for performance and systrap inside virtual machines, and says virtualisation hardware does not by itself add security."
    mitigations: [D3-EI, D3-HBPI]
    url: https://gvisor.dev/docs/user_guide/platforms/
    verified: "2026-11-18"
  - id: gvisorRuntimeMonitoring
    name: "Runtime monitoring trace points (--pod-init-config)"
    product: "gVisor"
    where: "gVisor › runsc flag pod-init-config=<file>, set under [runsc_config] in runsc.toml on every gVisor node; a monitoring process on the node receives the stream"
    setVia: [configFile]
    area: audit
    requires: "runsc release-20220704.0 or newer. Falco can be the receiver only at 0.33.1 to 0.43.x: Falco 0.44.0 removed its gVisor engine"
    recommended: "Pass runsc a trace-point file on every sandbox node so each new sandbox streams its events to a monitoring process there: Falco 0.43.x or earlier, which generates the file with --gvisor-generate-config, or a receiver of your own. Forward alerts to the collector and the orchestrator's stop handler."
    value: "Trace points streamed on every sandbox node"
    why: "gVisor handles a sandbox's system calls in its own kernel instead of passing them to the host, so a record of what a rollout did has to come from gVisor's trace points. gVisor's guide uses Falco, which dropped this support in 0.44.0."
    mitigations: [cap-agent-tracing]
    url: https://gvisor.dev/docs/tutorials/falco/
    verified: "2026-11-18"
  - id: knativeClusterLocalVisibility
    name: "Private Services (networking.knative.dev/visibility: cluster-local)"
    product: "Knative Serving"
    where: "Knative Serving › Service metadata.labels: networking.knative.dev/visibility: cluster-local (kubectl label kservice <name> networking.knative.dev/visibility=cluster-local)"
    setVia: [configFile, apiCli]
    area: network
    default: "Services use the .svc.cluster.local domain until a domain is configured for the cluster or the Service"
    recommended: "Label every Knative Service that nothing outside the cluster should reach directly cluster-local (an MCP server reached through the AI gateway, the factory's agent loop, an internal tool service), so that it is never published on the external gateway and only its drawn caller reaches it through the cluster-local address; only the Service the front door publishes stays external."
    value: "cluster-local unless the front door publishes it"
    why: "Once a domain name is configured, Knative publishes every Service on the external gateway unless it carries the label. The label keeps a server behind the AI gateway, where the per-tool rules are applied, instead of giving it a second way in."
    mitigations: [AML.M0028]
    url: https://knative.dev/docs/serving/services/private-services/
    verified: "2026-11-18"
  - id: knativeTagDigestResolution
    name: "Tag resolution (registries-skipping-tag-resolving)"
    product: "Knative Serving"
    where: "Knative Serving › ConfigMap config-deployment (knative-serving): registries-skipping-tag-resolving; controller Deployment: SSL_CERT_DIR or SSL_CERT_FILE with your registry's CA certificate"
    setVia: [configFile]
    area: tools
    default: "Tags are resolved to digests when a Revision is created"
    recommended: "Keep tag resolution on for your container registry: leave it out of registries-skipping-tag-resolving and mount the registry's CA certificate into the Knative controller, which needs a network path to it, so that every Revision records the image digest."
    value: "On for your registry, so every Revision has a digest"
    why: "Knative resolves the image tag to a digest when it creates a Revision, so the reviewed image, with the tool definitions baked in, is the one every replica of that Revision runs; a new tool-definition release reaches callers only as a new Revision, which can take a share of traffic first."
    mitigations: [cap-mcp-tool-integrity]
    url: https://knative.dev/docs/serving/tag-resolution/
    verified: "2026-11-18"
  - id: kserveStandardDeploymentMode
    name: "Default deployment mode (defaultDeploymentMode)"
    product: "KServe"
    where: "KServe › ConfigMap inferenceservice-config (namespace kserve) › deploy.defaultDeploymentMode; per service, the annotation serving.kserve.io/deploymentMode"
    setVia: [configFile, apiCli]
    area: tools
    default: "Knative: an InferenceService runs as a Knative Service, not a plain Deployment, unless Standard is chosen explicitly"
    recommended: "Set defaultDeploymentMode to Standard (Helm value kserve.controller.deploymentMode) so that each model runs as a plain Deployment and Service, and annotate each InferenceService with serving.kserve.io/deploymentMode: Standard."
    value: "Standard"
    why: "KServe recommends Standard deployment for generative models. The default mode, Knative, adds a serverless layer with its own ingress and scale to zero that this mapping does not describe."
    mitigations: [D3-ACH]
    url: https://kserve.github.io/website/docs/admin-guide/configurations
    verified: "2026-11-18"
  - id: kserveIngressCreationOff
    name: "disableIngressCreation and the cluster-local visibility label"
    product: "KServe"
    where: "KServe › ConfigMap inferenceservice-config › ingress.disableIngressCreation; per service, the label networking.kserve.io/visibility: cluster-local"
    setVia: [configFile, apiCli]
    area: network
    default: "false: an ingress is created for each InferenceService"
    recommended: "Set disableIngressCreation to true, or label every InferenceService networking.kserve.io/visibility: cluster-local, so that a model server has no route of its own and is reached only through the AI gateway, which the network rules alone admit."
    value: "true, or every InferenceService cluster-local"
    why: "In Standard mode KServe creates an ingress for each InferenceService. That route is a second way in that skips the gateway's keys, quotas, guardrails and logging."
    mitigations: [D3-NI]
    url: https://kserve.github.io/website/docs/admin-guide/configurations
    verified: "2026-11-18"
  - id: kserveStorageContainerVerify
    name: "ClusterStorageContainer (custom storage initialiser)"
    product: "KServe"
    where: "KServe › ClusterStorageContainer (serving.kserve.io/v1alpha1) › spec.container (image, env, resources) and spec.supportedUriFormats (prefix or regex)"
    setVia: [configFile, code]
    area: data
    default: "A ClusterStorageContainer named default handles s3://, hf:// and the other built-in schemes"
    recommended: "Register your own storage initialiser image for the released-weights URI prefix. It copies the release to the model directory, runs model_signing verify with the release key and exits non-zero on a mismatch. Let only one ClusterStorageContainer match that prefix, and use s3:// or pvc:// URIs for released weights only: an hf:// URI makes the pod download from the public hub."
    value: "Your own initialiser that verifies the signature"
    why: "KServe injects the init container that downloads the weights, and its storage pages describe no checksum, signature or digest check, so verification at load has to live in a storage container you supply."
    mitigations: [AML.M0014]
    url: https://kserve.github.io/website/docs/model-serving/storage/storage-containers
    verified: "2026-11-18"
  - id: kserveS3StorageSecret
    name: "S3 credentials for the storage initialiser (ServiceAccount and Secret annotations)"
    product: "KServe"
    where: "KServe › Secret annotations serving.kserve.io/s3-endpoint, s3-usehttps and s3-region; the Secret listed under the ServiceAccount's secrets; InferenceService spec.predictor.serviceAccountName"
    setVia: [configFile, apiCli]
    area: identity
    default: "S3 settings in the inferenceservice ConfigMap are used when the annotations are missing. The ServiceAccount role annotation KServe recommends is AWS's IAM role for service accounts; on your own object store the credentials come from the Secret"
    recommended: "Give each model its own ServiceAccount and a Secret that holds a read-only key for the released-weights bucket only, with s3-endpoint set to your object store (for example the Ceph Object Gateway) and s3-usehttps set to 1. Rotate the key from your secrets manager."
    value: "Per-model ServiceAccount, read-only released-weights key"
    why: "KServe hands the storage initialiser S3 credentials from a Secret attached to the ServiceAccount. A key that can only read one bucket keeps the serving identity away from candidates and other models."
    mitigations: [AML.M0005, D3-CH]
    url: https://kserve.github.io/website/docs/model-serving/storage/providers/s3
    verified: "2026-11-18"
  - id: kserveAutoMountToken
    name: "security.autoMountServiceAccountToken"
    product: "KServe"
    where: "KServe › ConfigMap inferenceservice-config › security.autoMountServiceAccountToken; overridden per service in the InferenceService spec"
    setVia: [configFile]
    area: identity
    default: "true"
    recommended: "Set security.autoMountServiceAccountToken to false so that predictor pods carry no Kubernetes API token, and switch it on only for a service that needs one."
    value: "false"
    why: "A model server has no reason to call the Kubernetes API, and KServe mounts a service account token into its pods by default."
    mitigations: [D3-CH]
    url: https://kserve.github.io/website/docs/admin-guide/configurations
    verified: "2026-11-18"
  - id: kserveEndpointAuth
    name: "Authenticate calls to the InferenceService"
    product: "KServe"
    where: "In front of the InferenceService's predictor: a service-mesh authorisation policy on its Service that admits only the gateway's identity, or an authenticating proxy that checks a key or token before a request reaches the model server"
    setVia: [clusterPolicy, code]
    area: identity
    default: "None: KServe's guide for the Hugging Face runtime says the service does not require API key authentication, and its client example passes a placeholder key"
    recommended: "Only the AI gateway can call the predictor, checked by identity as well as at the network, with the gateway holding the only credential; the gateway's api_base carries the /openai/v1 prefix, or KSERVE_OPENAI_ROUTE_PREFIX is emptied"
    value: "Only the gateway's identity is accepted"
    why: "Network rules are the first lock and, until you add one, the only one; a check of the caller's identity means a pod that finds a route still gets no answer."
    mitigations: [D3-ACH]
    url: https://kserve.github.io/website/docs/getting-started/genai-first-isvc
    verified: "2026-11-24"
  - id: slurmAuthPlugin
    name: "AuthType (auth/slurm or auth/munge)"
    product: "Slurm"
    where: "Slurm › slurm.conf and slurmdbd.conf: AuthType=auth/slurm with slurm.key (or slurm.jwks) owned by SlurmUser, or AuthType=auth/munge with the same munge.key on every host"
    setVia: [configFile]
    area: identity
    default: "auth/munge"
    recommended: "Use one authentication plugin on every host, keep its key readable only by SlurmUser (or the munge user), give each pipeline its own Unix account with the same UID and GID on all nodes, and rotate the key on a schedule."
    value: "One plugin on every host, key rotated"
    why: "Slurm identifies a job by the UID and GID of the request, which the plugin vouches for between hosts. A leaked key, or UIDs that differ between nodes, lets one account's job run as another."
    mitigations: [D3-AA]
    url: https://slurm.schedmd.com/authentication.html
    verified: "2026-11-18"
  - id: slurmRestdJwt
    name: "slurmrestd with JWT authentication (AuthAltTypes=auth/jwt)"
    product: "Slurm"
    where: "Slurm › slurm.conf and slurmdbd.conf: AuthAltTypes=auth/jwt and AuthAltParameters=jwks=<file> (or jwt_key=<file>); slurmrestd run as its own unprivileged user behind a TLS proxy"
    setVia: [configFile, identityProvider]
    area: identity
    default: "scontrol token issues tokens with a lifespan of 1800 seconds"
    recommended: "Let the pipeline submit jobs only through slurmrestd with short-lived tokens: RS256 tokens from Keycloak checked against its JWKS file, or scontrol token with a short lifespan. Run slurmrestd as a dedicated unprivileged user behind a TLS 1.3 proxy."
    value: "Submit only via slurmrestd, short-lived tokens"
    why: "The submitting step runs outside the Slurm cluster and needs an identity Slurm can check. Slurm says slurmrestd is not designed to face the internet and should not run as root or SlurmUser."
    mitigations: [D3-AA]
    url: https://slurm.schedmd.com/rest.html
    verified: "2026-11-18"
  - id: slurmAccountingEnforce
    name: "AccountingStorageEnforce and SlurmDBD accounting"
    product: "Slurm"
    where: "Slurm › slurm.conf: AccountingStorageType=accounting_storage/slurmdbd, AccountingStorageEnforce=associations,limits,qos, JobAcctGatherType=jobacct_gather/cgroup; associations created with sacctmgr"
    setVia: [configFile, apiCli]
    area: audit
    default: "No enforcement: jobs run under each cluster's local policies"
    recommended: "Store accounting through SlurmDBD and enforce associations, so that only accounts registered for a pipeline can run jobs and every job and step is recorded with its user, account and resources. Ship the records to your log store."
    value: "SlurmDBD, associations enforced"
    why: "Without enforcement any authenticated user can submit to the GPU partition. The accounting records are the audit trail of who trained what, when and on which nodes."
    mitigations: [D3-AA, AML.M0024]
    url: https://slurm.schedmd.com/accounting.html
    verified: "2026-11-18"
  - id: slurmCgroupConstraints
    name: "cgroup.conf constraints (ConstrainCores, ConstrainDevices, ConstrainRAMSpace)"
    product: "Slurm"
    where: "Slurm › cgroup.conf: ConstrainCores=yes, ConstrainDevices=yes, ConstrainRAMSpace=yes; slurm.conf: ProctrackType=proctrack/cgroup, TaskPlugin=task/cgroup,task/affinity"
    setVia: [configFile]
    area: tools
    default: "no for each Constrain option"
    recommended: "Set all three to yes so that a job can use only the cores, memory and GPU devices it was allocated, and submit training jobs with --exclusive when a node must not be shared with another job."
    value: "yes for all three"
    why: "Every Constrain option defaults to no. Until they are set, the cgroup plugins do not hold a job on a shared node to the cores, memory and devices it was allocated."
    mitigations: [D3-EI]
    url: https://slurm.schedmd.com/cgroup.conf.html
    verified: "2026-11-18"
  - id: slurmOciContainers
    name: "OCI containers (oci.conf and --container)"
    product: "Slurm"
    where: "Slurm › oci.conf beside slurm.conf on every compute node: RunTimeRun (or RunTimeCreate, RunTimeStart, RunTimeQuery, RunTimeKill, RunTimeDelete), RunTimeEnvExclude; sbatch --container=<bundle path>"
    setVia: [configFile, apiCli]
    area: tools
    default: "No oci.conf: container support is off and --container has no effect"
    recommended: "Configure a rootless runtime (crun, runc or nvidia-container-runtime) in oci.conf on every GPU node and run training only as --container jobs, from bundles unpacked from a signed, scanned image in your registry at a pinned digest. Set RunTimeEnvExclude to keep submit-host variables out."
    value: "Rootless runtime; training only as --container jobs"
    why: "Without oci.conf Slurm ignores the requested container and runs the script directly on the node. A rootless container holds the job to the file system of the approved image."
    mitigations: [D3-EI]
    url: https://slurm.schedmd.com/oci.conf.html
    verified: "2026-11-18"
  - id: slurmNamespaceTmpfs
    name: "namespace/tmpfs (private /tmp and /dev/shm for each job)"
    product: "Slurm"
    where: "Slurm › slurm.conf: NamespaceType=namespace/tmpfs and PrologFlags=Contain; job_container.conf: BasePath, AutoBasePath"
    setVia: [configFile]
    area: data
    recommended: "Enable the plugin on every compute node so that each job gets its own /tmp and /dev/shm in a private mount namespace, removed when the job ends."
    value: "Enabled on every compute node"
    why: "Scratch directories shared across a node let one job read what another left behind. The plugin gives each job a private view and deletes it afterwards."
    mitigations: [D3-EI]
    url: https://slurm.schedmd.com/job_container.conf.html
    verified: "2026-11-18"
  - id: slurmPamAdopt
    name: "pam_slurm_adopt"
    product: "Slurm"
    where: "Compute nodes › the sshd PAM stack: pam_slurm_adopt.so; slurm.conf: PrologFlags=contain, TaskPlugin=task/cgroup, ProctrackType=proctrack/cgroup"
    setVia: [configFile]
    area: identity
    recommended: "Install the module on every compute node so that a user can open an SSH session only on a node where that user has a running job, and the session is adopted into that job's extern step."
    value: "Installed on every compute node"
    why: "Compute nodes are ordinary Linux hosts. Without the module an account holder can log in to a GPU node at any time, outside any job's limits and accounting."
    mitigations: [D3-EI]
    url: https://slurm.schedmd.com/pam_slurm_adopt.html
    verified: "2026-11-18"
  - id: computeNodeEgressFirewall
    name: "nftables output chain with policy drop (compute nodes)"
    product: "nftables"
    where: "Compute nodes › nftables ruleset: a base chain of type filter on hook output with policy drop, and accept rules for the Slurm daemons, mirrors, buckets, shared storage and log collector"
    setVia: [configFile]
    area: network
    default: "accept when a chain is given no policy"
    recommended: "Drop outbound traffic from GPU nodes by default and allow only the Slurm daemons, the package and image mirrors, the object store, shared storage and the log collector. Apply the same limits again in the data centre network."
    value: "policy drop, named services allowed"
    why: "Slurm has nothing like a network policy: its container guide says custom container networks are unsupported and containers use host networking, so a training job can reach whatever its node can. The node firewall and the data centre network take the place of the default-deny NetworkPolicy."
    mitigations: [D3-NI]
    url: https://wiki.nftables.org/wiki-nftables/index.php/Configuring_chains
    verified: "2026-11-18"
  - id: slurmBundleDigestProlog
    name: "Prolog that verifies the staged bundle (Prolog, PrologFlags=Alloc)"
    product: "Slurm"
    where: "Slurm › slurm.conf on every GPU node: Prolog=<script> and PrologFlags=Alloc; the script compares the staged OCI bundle with the hash the staging step recorded for it"
    setVia: [configFile]
    area: tools
    default: "No check: Slurm does not pull or copy images, and runs the bundle it finds on the node or on shared storage"
    recommended: "The staging step unpacks the approved image at its digest into a path only the staging account can write and records a hash of the bundle; a Prolog run at allocation (PrologFlags=Alloc) recomputes it and exits non-zero on a mismatch, which drains the node and requeues the job"
    value: "Prolog checks the staged bundle at allocation"
    why: "The image that runs is the one that was approved, even if the staged copy on a node or on shared storage changed after staging."
    mitigations: [D3-FA]
    url: https://slurm.schedmd.com/prolog_epilog.html
    verified: "2026-11-24"
  - id: slurmPerRunStorageCredentials
    name: "Per-run storage credentials minted by the submitting step"
    product: "Slurm"
    where: "Your submitting pipeline step › before sbatch or the slurmrestd call: a token exchange at the object store (for Ceph, STS AssumeRoleWithWebIdentity with DurationSeconds no longer than the job's time limit), the credentials handed to the job in a file only the job's account can read"
    setVia: [code]
    area: identity
    default: "None: a Slurm job has no service account and no workload token; it runs with the submitter's UID, and Slurm's JWTs authenticate clients to slurmctld and slurmdbd only"
    recommended: "The submitting step, which has a workload identity, exchanges it for credentials limited to this run's dataset version (read) and candidate prefix (write), lasting no longer than the job; no static storage key on the GPU nodes or in the job script"
    value: "Short-lived, per-run credentials from the submitter"
    why: "The training job reaches only its own inputs and outputs, and only while it runs, without a long-lived key that any job on the node could copy."
    mitigations: [D3-AA]
    url: https://slurm.schedmd.com/jwt.html
    verified: "2026-11-24"
  # <<< more hosting rows
  # >>> software factory rows (the settings that build and guard the factory and the apps it makes)
  - id: gitlabAgentProjectToken
    name: "Project access tokens (role and scopes)"
    product: "GitLab"
    where: "GitLab › the app's project › Settings › Access tokens: role, scopes, expiry date; minted per app by the Backstage action gitlab:projectAccessToken:create"
    setVia: [apiCli, adminConsole]
    area: identity
    default: "Expiry is 365 days from today if none is entered; gitlab:projectAccessToken:create defaults to accessLevel 40 (Maintainer) and read_repository unless set"
    requires: "Project access tokens are in every licence on GitLab Self-Managed; they reach one project only"
    recommended: "One token per app project for the agent: role Developer, scope write_repository only (no api, registry or runner scopes), an expiry of days rather than a year, readable only by that app's builds; merge requests opened with the merge_request.create push option."
    value: "Developer, write_repository only, days to expiry"
    why: "The token reaches one project and can push branches but cannot merge to the protected branch or call the API, so whatever the agent is talked into stays on a branch."
    mitigations: [AML.M0028]
    url: https://docs.gitlab.com/user/project/settings/project_access_tokens/
    verified: "2026-11-21"
  - id: gitlabProtectedBranch
    name: "Protected branches and Pipelines must succeed"
    product: "GitLab"
    where: "GitLab › project › Settings › Repository › Protected branches (Allowed to merge, Allowed to push and merge, Allowed to force push); Settings › Merge requests › Merge checks › Pipelines must succeed"
    setVia: [adminConsole, apiCli]
    area: tools
    default: "The default branch is protected automatically; Pipelines must succeed is off until selected. There is no per-branch token: a Developer token with write_repository can push any unprotected branch and send push options such as ci.skip"
    recommended: "Default branch: Allowed to push and merge No one; Allowed to merge Maintainers, held only by the factory's merge bot, never the agent's Developer token; force push off; Pipelines must succeed on, and Skipped pipelines are considered successful left off so a push with ci.skip cannot merge."
    value: "Push: No one; merge: Maintainers; pipeline must pass"
    why: "Code reaches the default branch only through a merge request whose pipeline passed, merged by the factory and never by the agent that wrote it."
    mitigations: [AML.M0028, D3-SYSVA]
    url: https://docs.gitlab.com/user/project/repository/branches/protected/
    verified: "2026-11-21"
  - id: gitlabExternalCiConfig
    name: "CI/CD configuration file (stored in another project)"
    product: "GitLab"
    where: "GitLab › the app's project › Settings › CI/CD › General pipelines › CI/CD configuration file: <file>@<platform group>/<pipeline project>"
    setVia: [adminConsole, apiCli]
    area: tools
    default: ".gitlab-ci.yml in the app's own repository, which anyone who can push to it may change"
    recommended: "Every app project points at the platform team's pipeline file in a project only the platform team can write; deploy and signing credentials kept in protected variables, which pipelines on unprotected branches do not receive."
    value: "Platform-owned file in another project"
    why: "The agent can push code but cannot change the jobs that build, scan and sign it, so it cannot skip a scan by editing the pipeline."
    mitigations: [D3-SYSVA, AML.M0028]
    url: https://docs.gitlab.com/ci/pipelines/settings/#specify-a-custom-cicd-configuration-file
    verified: "2026-11-21"
  - id: sandboxClaimLifecycle
    name: "SandboxClaim lifecycle (shutdownTime, ttlSecondsAfterFinished, shutdownPolicy)"
    product: "agent-sandbox"
    where: "agent-sandbox › SandboxClaim (extensions.agents.x-k8s.io) › spec.lifecycle: shutdownTime, ttlSecondsAfterFinished, shutdownPolicy"
    setVia: [code]
    area: tools
    default: "No scheduled expiry when neither field is set; shutdownPolicy Retain"
    recommended: "Your orchestrator creates one claim per build with a shutdownTime at the build's hard deadline, ttlSecondsAfterFinished of a few minutes at most and shutdownPolicy Delete; no volume outlives the build; leftover claims are swept and alerted on."
    value: "Deadline per build, short ttl, Delete"
    why: "Each build's sandbox is made for that build and destroyed after it, so nothing one build installed or wrote is there for the next."
    mitigations: [D3-EI]
    url: https://agent-sandbox.sigs.k8s.io/docs/api/
    verified: "2026-11-21"
  - id: argocdOwnerSync
    name: "Manual sync, with the sync action granted per app to its owner"
    product: "Argo CD"
    where: "Argo CD › Application spec.syncPolicy with no automated block; argocd-rbac-cm policy.csv: p, <role>, applications, sync, <project>/<app>, allow and g, <owner group>, <role>; argocd-cm application.sync.requireOverridePrivilegeForRevisionSync"
    setVia: [configFile]
    area: sharing
    default: "No approval step: the owner approves by syncing, and the history shows who synced which revision, not a separate approval. Automated sync is opt-in; a user with sync may pass any revision, because requireOverridePrivilegeForRevisionSync defaults to 'false'"
    recommended: "No automated sync on production Applications; one role per app whose only group is that app's owner group from your identity provider, holding sync on that app alone; requireOverridePrivilegeForRevisionSync 'true' and override granted to nobody; policy.default role:readonly at most."
    value: "Manual; sync for the owner's group only"
    why: "A release reaches real data only when the app's named owner, signed in with a second factor, syncs the revision the pipeline committed, and the requester cannot do it for them."
    mitigations: [AML.M0029]
    url: https://argo-cd.readthedocs.io/en/stable/operator-manual/rbac/
    verified: "2026-11-21"
  - id: argocdAppProject
    name: "AppProject per app, with sync impersonation (destinationServiceAccounts)"
    product: "Argo CD"
    where: "Argo CD › AppProject › spec.sourceRepos, destinations (server, namespace), clusterResourceWhitelist, namespaceResourceBlacklist, destinationServiceAccounts; argocd-cm application.sync.impersonation.enabled"
    setVia: [configFile]
    area: identity
    default: "The default project permits any source repository, any cluster and all resource kinds; impersonation is off, so syncs use the controller's cluster-admin-level role"
    requires: "Sync impersonation is a beta feature, since Argo CD v3.5.0"
    recommended: "One project per app: its environment repository only, its namespace only, no cluster-scoped kinds, SecurityPolicy, NetworkPolicy, ResourceQuota and RBAC kinds blacklisted; impersonation on, with a per-app ServiceAccount limited to that namespace; nothing in the default project."
    value: "One repository, one namespace, per-app account"
    why: "The deploy identity of one app can change only that app's namespace and cannot loosen its own sign-in, network policy or quota, so one release cannot touch another app."
    mitigations: [D3-NI, D3-ACH]
    url: https://argo-cd.readthedocs.io/en/stable/operator-manual/app-sync-using-impersonation/
    verified: "2026-11-21"
  - id: argoRolloutsCanary
    name: "Canary strategy (setWeight, pause), abort and rollbackWindow"
    product: "Argo Rollouts"
    where: "Argo Rollouts › Rollout spec.strategy.canary: steps (setWeight, pause), trafficRouting, analysis; spec.rollbackWindow.revisions; the abort command"
    setVia: [configFile]
    area: sharing
    default: "With no steps a canary behaves like a rolling update; without a traffic router, weights are approximated by replica count"
    requires: "Exact percentages need trafficRouting; Gateway API routing is a traffic router plugin, and Argo Rollouts calls its plugin system alpha"
    recommended: "Every app as a Rollout: setWeight 10, then pause with no duration until the owner promotes, analysis on error rate, then full; rollbackWindow.revisions of 2 or more; on-call may abort, which reverts the steps and makes the previous ReplicaSet active."
    value: "10% first, pause for the owner, abort to stable"
    why: "A release that misbehaves with real data reaches few people first and is undone in one step, without a new build."
    mitigations: [cap-staged-rollout-gate]
    url: https://argoproj.github.io/argo-rollouts/features/canary/
    verified: "2026-11-21"
  - id: keycloakRequired2fa
    name: "Conditional 2FA sub-flow with OTP default"
    product: "Keycloak"
    where: "Keycloak › Authentication › a copy of the browser flow › Browser - Conditional 2FA (OTP Form, WebAuthn Authenticator, Recovery Authentication Code Form) and Condition - credential; bound as the realm's browser flow"
    setVia: [identityProvider]
    area: identity
    default: "The default browser flow asks for a second factor only from users who have set one up; WebAuthn and recovery codes are Disabled"
    recommended: "In the realm of the factory and its apps, a copied browser flow in which a user with no second factor must set up OTP before continuing; WebAuthn Authenticator Alternative; Condition - credential kept so a passkey counts; used by the intake, Argo CD and every app client."
    value: "Second factor required for every user"
    why: "A stolen password alone then opens no generated app and approves no release, including for users who never set up a factor."
    mitigations: [D3-MFA]
    url: https://www.keycloak.org/docs/latest/server_admin/index.html#twofa-conditional-workflow-examples
    verified: "2026-11-21"
  - id: envoyGatewayOidcDefault
    name: "SecurityPolicy OIDC authentication (Gateway and HTTPRoute targets)"
    product: "Envoy Gateway"
    where: "Envoy Gateway › SecurityPolicy › spec.targetRefs (Gateway or HTTPRoute), spec.oidc: provider.issuer, clientID, clientSecret, redirectURL, logoutPath"
    setVia: [clusterPolicy]
    area: identity
    default: "No SecurityPolicy: a route on the Gateway is served without sign-in. A route-level policy, which lives in the route's own namespace, replaces the Gateway-level one entirely unless mergeType is set, so an app that may deploy one can switch its own sign-in off"
    recommended: "A Gateway-level OIDC policy against your identity provider, so no route on the apps Gateway is ever anonymous; for each app and preview a platform-owned route policy with that app's own client; SecurityPolicy kept outside what an app's deploy identity can create (its deploy project's blacklist and an admission policy)."
    value: "OIDC on the Gateway, plus one per app route"
    why: "Every generated app and preview sits behind the identity provider whatever the agent wrote, and only the platform can change the policy in front of it."
    mitigations: [D3-APA]
    url: https://gateway.envoyproxy.io/docs/tasks/security/oidc/
    verified: "2026-11-21"
  - id: previewAccessGroup
    name: "Per-preview access: only its requester and the app's owner"
    where: "Your identity provider › a group (or client role) per preview holding its requester and the app's owner, created and removed with the preview; the front door › an authorisation rule on the preview's route that admits only that group"
    setVia: [identityProvider, clusterPolicy]
    area: identity
    default: "Previews sit behind the same sign-in as apps, so anyone who may sign in at the apps front door can open any preview"
    recommended: "Each preview's route admits only its group, deny by default (with Envoy Gateway, a SecurityPolicy authorization rule on the token's groups claim with defaultAction: Deny, beside JWT authentication in the same policy; with Keycloak, a client per preview whose flow denies users without its role); the group is emptied and removed when the merge request closes"
    value: "Requester and owner only, removed with the preview"
    why: "A preview runs generated code nobody has reviewed yet, so only the person who asked for it and the owner who will approve it can open it."
    mitigations: [D3-APA]
    url: https://gateway.envoyproxy.io/docs/tasks/security/jwt-claim-authorization/
    verified: "2026-11-24"
  - id: semgrepScanPipeline
    name: "semgrep scan with --error, local rules and --metrics off"
    product: "Semgrep Community Edition"
    where: "Semgrep Community Edition › pipeline step semgrep scan --config <rules directory> --error --metrics off --sarif-output <file>"
    setVia: [apiCli]
    area: tools
    default: "Exit code 0 even with findings unless --error is passed; --metrics auto sends metrics when rules are pulled from the Semgrep Registry"
    recommended: "On every push, semgrep scan with --error against a rules directory kept in the platform's pipeline project (registry rules reviewed and copied in), --metrics off, ERROR-severity findings stopping the release, and the SARIF kept with the release."
    value: "--error, local rules, metrics off"
    why: "Nobody reads this code, so a static scan that fails the build on serious findings is part of the only review it gets, and it runs without leaving the data centre."
    mitigations: [D3-SYSVA]
    url: https://docs.semgrep.dev/cli-reference
    verified: "2026-11-21"
  - id: gitleaksScanPipeline
    name: "gitleaks git (fails on any leak)"
    product: "gitleaks"
    where: "gitleaks › pipeline step gitleaks git with --log-opts set to the merge request's commit range, --redact and the platform's config (--config); --exit-code"
    setVia: [apiCli]
    area: data
    default: "Exits 1 when leaks are found; uses its default rules when no config is given"
    requires: "gitleaks is feature complete and now receives security patches only; its maintainer has moved to Betterleaks"
    recommended: "Every push scans the merge request's commits with gitleaks git and --redact, using a platform-owned config that extends the default rules (useDefault = true); any finding fails the pipeline, and a found secret is rotated in Vault, not just deleted."
    value: "Every commit scanned; any leak fails"
    why: "Agents paste keys into code, and a commit that holds one is stopped before it is merged, built into a release or copied by other tools."
    mitigations: [D3-CH]
    url: https://github.com/gitleaks/gitleaks
    verified: "2026-11-21"
  - id: syftSbomRelease
    name: "SBOM for every release (syft -o cyclonedx-json)"
    product: "Syft"
    where: "Syft › pipeline step syft <image> -o cyclonedx-json=<file> (or spdx-json), kept and signed with the release candidate"
    setVia: [apiCli]
    area: tools
    recommended: "For every release candidate, an SBOM of the built image in CycloneDX or SPDX JSON, stored with the release; the factory writes the coding agent's version and the models used, taken from the build's trace, into the release record beside it."
    value: "CycloneDX SBOM with every release"
    why: "When a package turns out to be harmful, every app that contains it, and the agent and model that wrote it, is found by searching the SBOMs and release records."
    mitigations: [AML.M0023]
    url: https://github.com/anchore/syft
    verified: "2026-11-21"
  - id: kyvernoAppBaseline
    name: "ValidatingPolicy (validationActions: Deny) for app and preview namespaces"
    product: "Kyverno"
    where: "Kyverno › ValidatingPolicy (policies.kyverno.io/v1): matchConstraints, validations (CEL expression, message), validationActions; the same policies run in the pipeline with the Kyverno CLI"
    setVia: [clusterPolicy, apiCli]
    area: tools
    default: "No policy: anything the Kubernetes API accepts is admitted"
    requires: "ValidatingPolicy is stable in Kyverno v1.20.0"
    recommended: "Deny in every app and preview namespace, and checked in the pipeline before release: no LoadBalancer or NodePort Service, no SecurityPolicy, HTTPRoutes only on the apps Gateway, restricted pod security, no hostPath, images from Harbor by digest, egress only to approved connectors."
    value: "Deny, checked in the pipeline and at admission"
    why: "A setting the agent chose can open an app to the world even when its code is clean, so manifests are held to the baseline before release and again at the cluster."
    mitigations: [D3-ACH]
    url: https://kyverno.io/docs/policy-types/validating-policy/
    verified: "2026-11-21"
  - id: vsoAppSecrets
    name: "VaultAuth with VaultStaticSecret and VaultDynamicSecret (Vault Secrets Operator)"
    product: "Vault Secrets Operator"
    where: "Vault Secrets Operator › in the app's namespace: VaultAuth (method: kubernetes, kubernetes.role, kubernetes.serviceAccount), VaultStaticSecret (mount, type kv-v2, path, refreshAfter, destination), VaultDynamicSecret; Vault › auth/kubernetes/role/<app>"
    setVia: [clusterPolicy, apiCli]
    area: data
    default: "The operator writes each secret into a Kubernetes Secret in the namespace"
    recommended: "Per app: a Vault role bound to its ServiceAccount and namespace with a policy for its own path only; a VaultAuth using that ServiceAccount; database credentials as a VaultDynamicSecret; the agent and the pipeline hold no Vault access to app paths."
    value: "Per-app role and path, delivered at run time"
    why: "Each app receives its secrets at run time under its own identity, so no secret is written into a repository or seen by the agent that built the app."
    mitigations: [D3-CH]
    url: https://developer.hashicorp.com/vault/docs/deploy/kubernetes/vso/sources/vault
    verified: "2026-11-21"
  - id: cnpgAppDatabase
    name: "Cluster per app on an encrypted StorageClass (ceph-csi encrypted)"
    product: "CloudNativePG"
    where: "CloudNativePG › Cluster in the app's namespace (storage.storageClass); ceph-csi RBD StorageClass parameters encrypted and encryptionKMSID, with encryptionKMSType vault in the KMS configuration"
    setVia: [clusterPolicy]
    area: data
    default: "CloudNativePG delegates encryption at rest to the storage class, and ceph-csi encryption is disabled by default"
    recommended: "One CloudNativePG Cluster per app in its own namespace, on a StorageClass with encrypted \"true\" and Vault as the KMS; NetworkPolicy admitting that app's pods, the cluster's own instances and the operator on 8000 and 5432; backups to the app's own bucket; removed with the app."
    value: "One database per app, encrypted volumes"
    why: "Each app's records sit in a store no other app can reach, encrypted on disk, and are removed or archived when the app is retired."
    mitigations: [D3-NI]
    url: https://cloudnative-pg.io/docs/1.30/security
    verified: "2026-11-21"
  - id: appQuarantineRunbook
    name: "Quarantine an app: deny policy, client disabled, leases revoked, deny sync window"
    product: "Cilium"
    where: "Cilium › CiliumNetworkPolicy with ingressDeny for the app's namespace; Keycloak › the app's client › Enabled; Vault › sys/leases/revoke-prefix/<app path>; Argo CD › AppProject syncWindows (kind: deny)"
    setVia: [clusterPolicy, identityProvider, apiCli]
    area: network
    recommended: "A runbook on-call can run without the factory or the owner: a prepared deny policy for the app's namespace (deny overrides every allow), its Keycloak client disabled, its Vault leases revoked by prefix, a deny sync window so nothing redeploys it; drilled and timed."
    value: "Offline in minutes, without the factory"
    why: "An app leaking data stops at once and its credentials stop working, even when its owner cannot be reached and the factory itself is down."
    mitigations: [cap-agent-kill-switch]
    url: https://docs.cilium.io/en/stable/security/policy/deny/
    verified: "2026-11-21"
  - id: backstageAppRegister
    name: "Component entity with spec.owner, spec.lifecycle and an end-date annotation"
    product: "Backstage"
    where: "Backstage › Software Catalog › catalog-info.yaml (kind: Component): spec.owner, spec.lifecycle, spec.dependsOn (its database and connectors as Resources), metadata.annotations (your own end-date key); registered by catalog:register"
    setVia: [code]
    area: audit
    recommended: "Every app registered at creation by the Backstage template: owner the named app owner, never the requester alone; lifecycle; its data and connectors as dependsOn Resources; an end date under your own annotation prefix; a scheduled job retires or asks to renew apps past it."
    value: "Owner, data, connectors and end date per app"
    why: "Every generated app has a named owner, a list of what it touches and a date it ends unless renewed. Backstage holds the record; the retirement job is yours to build."
    mitigations: [D3-AI, AML.M0043]
    url: https://backstage.io/docs/features/software-catalog/descriptor-format
    verified: "2026-11-21"
  - id: squidAiAccessLog
    name: "access_log filtered to requests for AI services"
    product: "Squid"
    where: "Squid › squid.conf: acl <name> dstdomain <AI model API and app-builder domains>; access_log daemon:<file> <format> <acl>"
    setVia: [configFile]
    area: audit
    default: "One access log of every request, in the squid format"
    recommended: "A separate log of requests to AI model APIs and AI app-building services that did not come from LiteLLM or the mirror, sent to the SIEM and reviewed each week against the Backstage register; each source host is brought into the factory or shut down."
    value: "Logged, reviewed against the register weekly"
    why: "Apps built with AI outside the factory reach AI services through the same outbound proxy, so its log shows which hosts they run on."
    mitigations: [cap-shadow-ai-discovery]
    url: https://www.squid-cache.org/Doc/config/access_log/
    verified: "2026-11-21"
  - id: factoryAppTraceId
    name: "One app id from request to release (Langfuse sessionId and labels)"
    product: "Langfuse"
    where: "Your intake and factory code › the app id as the Langfuse sessionId, in the branch and merge request, as a CI/CD variable and image label, and as a label on the Argo CD Application"
    setVia: [code]
    area: audit
    recommended: "The intake mints an app id and a request id; every agent trace carries them as its Langfuse session, and every merge request, pipeline, SBOM and Argo CD sync names them, so one report shows who asked, what the agent did, what the checks found and who synced."
    value: "One id across trace, pipeline and sync"
    why: "When an app misbehaves, who asked for it, what built it and who let it run are found from one id, not by matching timestamps across five tools."
    mitigations: [cap-agent-tracing]
    url: https://langfuse.com/docs/observability/features/sessions
    verified: "2026-11-21"
  - id: knativeActivatorIngress
    name: "Ingress from the activator (knative-serving namespace)"
    product: "Kubernetes"
    where: "Kubernetes › NetworkPolicy in the namespace of the Knative Service (the agent, the MCP server or the factory's agent loop): ingress from the knative-serving namespace (namespaceSelector) and from the networking layer's gateway only"
    setVia: [clusterPolicy]
    area: network
    default: "A rule that admits only the caller's pods no longer matches: at low or zero traffic a request reaches the Service through the shared activator in the knative-serving namespace, and always through the networking layer and the queue-proxy beside the container"
    recommended: "Beside default deny, ingress from the knative-serving namespace (activator, autoscaler) and from the networking layer's gateway, through which the front door's, the AI gateway's or the intake's calls arrive, and nothing else; egress only to the flows drawn from the Service (in the factory: the AI gateway, the sandbox router and source control)."
    value: "Ingress: activator and networking layer only"
    why: "Knative routes requests through its shared activator when the Service is scaled down, so the namespace must admit that hop and the networking layer, and no other caller."
    mitigations: [D3-NI]
    url: https://knative.dev/docs/serving/request-flow/
    verified: "2026-11-24"
  - id: knativeLocalGatewayAccess
    name: "Who may reach the cluster-local gateway (local-gateways in config-gateway)"
    product: "Knative Serving"
    where: "Knative Serving › ConfigMap config-gateway (knative-serving): local-gateways names the Gateway for cluster-local traffic; Kubernetes › NetworkPolicy (or a service-mesh authorisation policy) on the pods of that Gateway"
    setVia: [clusterPolicy]
    area: network
    default: "Knative serves every Service on a cluster-local address through the local gateway, which is for internal traffic only and carries no front-door sign-in: any pod that can reach it can call the Service"
    recommended: "Ingress to the local gateway's pods only from the callers drawn to come that way (the scheduler or event triggers for the chat agent, nothing for an agent that peers and people reach through the front door), deny for every other namespace; the agent treats a call that arrives there as a run with no user."
    value: "Only the drawn internal callers reach the local gateway"
    why: "The local gateway is a second way into the agent that does not pass the front end, so who may start a run there is decided by a rule, not by who happens to share the cluster."
    mitigations: [D3-APA]
    url: https://knative.dev/docs/serving/config-network-adapters/
    verified: "2026-11-24"
  # <<< software factory rows

implementations:
  - architecture: archChatAgent
    asOf: "2026-11"
    verified: "2026-11-18"
    reference:
      - title: "AI gateway, for example LiteLLM Proxy: Production Best Practices"
        url: https://docs.litellm.ai/docs/proxy/prod
      - title: "Inference server, for example vLLM: Security"
        url: https://docs.vllm.ai/en/latest/usage/security/
      - title: "Container platform, for example Kubernetes: Production environment"
        url: https://kubernetes.io/docs/setup/production-environment/
    summary:
      - "Your chat agent runs on infrastructure you operate in your own data centre. People sign in at your identity provider through the front end. Every model and tool call passes a self-hosted AI gateway that holds the agent's credential, its tool grants and reviewed tool descriptions, guardrails and limits, and calls the models you serve in the data centre or an approved external model API through your egress control. Generated code runs in a fresh sandbox per task, and network rules keep traffic on the drawn paths. You carry everything a cloud provider would otherwise run; each box lists example products."
    bindings:
      - block: events
        service: "Scheduler and event triggers"
        note: "A scheduled run starts with no user in the thread, so any write it proposes waits in the approval queue."
        options:
          - { name: "Kubernetes CronJobs", kind: open, url: "https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/", note: "Built-in Kubernetes timers that start scheduled runs." }
          - { name: "Argo Events", kind: open, url: "https://argoproj.github.io/argo-events/", note: "Turns webhooks, Kafka messages and calendars into Kubernetes or workflow starts." }
          - { name: "Temporal Schedules", kind: open, url: "https://docs.temporal.io/schedule", note: "Schedules held by Temporal itself, starting workflows on a calendar or an interval." }
          - { name: "Knative Eventing (OpenShift Serverless)", kind: open, url: "https://knative.dev/docs/eventing/", note: "Brokers and triggers route events from sources to services; OpenShift Serverless is Red Hat's build.", packs: [redHatOpenShiftAi], watch: [{ text: "OpenShift Serverless is included with OpenShift Container Platform.", url: "https://www.redhat.com/en/technologies/cloud-computing/openshift/serverless" }] }
          - { name: "Apache Kafka", kind: open, url: "https://kafka.apache.org/documentation/", note: "Durable event log with per-topic ACLs, so producers and consumers can be scoped." }
          - { name: "Kubernetes CronJobs and Argo Events", kind: open, url: "https://argoproj.github.io/argo-events/", packs: [upstreamOpenSource] }
      - block: entry
        service: "Front door with single sign-on"
        options:
          - { name: "Envoy Gateway", kind: open, url: "https://gateway.envoyproxy.io/docs/tasks/security/oidc/", note: "Gateway API implementation; a SecurityPolicy with oidc signs users in at any OIDC provider (its docs show Google, Keycloak, Entra).", packs: [upstreamOpenSource], watch: [{ text: "A SecurityPolicy with oidc sends every request to your identity provider first. Do not build on ingress-nginx: it was retired in March 2026.", url: "https://gateway.envoyproxy.io/docs/" }] }
          - { name: "Red Hat Connectivity Link (Kuadrant)", kind: commercial, url: "https://developers.redhat.com/articles/2026/02/12/build-zero-trust-environment-red-hat-connectivity-link", note: "OIDC and auth policies enforced by Authorino on Gateway API routes, shown with a Red Hat build of Keycloak realm.", packs: [redHatOpenShiftAi], watch: [{ text: "Kuadrant and Authorino enforce sign-in on Gateway API routes against a Keycloak realm.", url: "https://developers.redhat.com/articles/2026/02/12/build-zero-trust-environment-red-hat-connectivity-link" }] }
          - { name: "Kong Gateway OpenID Connect plugin", kind: commercial, url: "https://developer.konghq.com/plugins/openid-connect/", note: "Enterprise plugin: authorization code sign-in with a session cookie, and RFC 8693 token exchange from 3.14.", packs: [kongAiGateway], watch: [{ text: "Enterprise plugin with authorization code sign-in; works with your IdP (Kong's how-tos use Keycloak or Okta).", url: "https://developer.konghq.com/plugins/openid-connect/" }] }
          - { name: "OAuth2 Proxy", kind: open, url: "https://oauth2-proxy.github.io/oauth2-proxy/", note: "Small reverse proxy or auth service that adds OIDC sign-in in front of an ingress that lacks it." }
      - block: localTools
        service: "Tool handlers and a sandbox for generated code"
        options:
          - { name: "agent-sandbox with gVisor", kind: open, url: "https://agent-sandbox.sigs.k8s.io/", note: "Kubernetes SIG Apps controller (v1beta1 API) for per-task sandboxes and warm pools; gVisor intercepts system calls in user space." }
          - { name: "Kata Containers", kind: open, url: "https://katacontainers.io/", note: "RuntimeClass giving each sandbox pod its own lightweight VM and kernel; works under agent-sandbox or plain pods." }
          - { name: "Red Hat build of Agent Sandbox with OpenShift sandboxed containers", kind: commercial, url: "https://www.redhat.com/en/blog/whats-new-red-hat-openshift-confidential-computing-and-sandboxing", note: "Downstream agent-sandbox, Technology Preview (Aug 2026), with Kata VMs from sandboxed containers 1.13.", packs: [redHatOpenShiftAi], watch: [{ text: "Agent Sandbox is Technology Preview (Aug 2026); sandboxed containers 1.13 run each pod in its own Kata VM.", url: "https://www.redhat.com/en/blog/whats-new-red-hat-openshift-confidential-computing-and-sandboxing" }] }
          - { name: "NVIDIA OpenShell", kind: open, url: "https://docs.nvidia.com/openshell/about/overview", note: "Open-source agent runtime that wraps the sandbox in a declarative YAML policy; early 0.1.x releases." }
          - { name: "agent-sandbox with gVisor, or Kata Containers", kind: open, url: "https://agent-sandbox.sigs.k8s.io/", packs: [upstreamOpenSource], watch: [{ text: "In-process handlers stay in the agent's pod; generated code runs in a Sandbox pod of its own. Kata Containers is the alternative runtime.", url: "https://agent-sandbox.sigs.k8s.io/" }] }
      - block: agent
        service: "Your agent on your container platform"
        build: true
        note: "Any framework. A turn waiting for the user's approval is held by a durable workflow engine (for example Temporal) or in state your agent persists, so the wait survives a restart."
        options:
          - { name: "Kubernetes Deployment", kind: open, url: "https://kubernetes.io/docs/setup/production-environment/", note: "Your agent as an ordinary workload on a cluster you run; any framework.", packs: [upstreamOpenSource], watch: [{ text: "Any framework; a Temporal workflow can hold a turn that waits for the user's approval.", url: "https://kubernetes.io/docs/setup/production-environment/" }] }
          - { name: "Knative Serving", kind: open, url: "https://knative.dev/docs/serving/", note: "Request-driven scaling down to zero; OpenShift Serverless is Red Hat's Knative-based product." }
          - { name: "OGX on Red Hat OpenShift AI", kind: commercial, url: "https://access.redhat.com/articles/rhoai-supported-configs", note: "Server-side agent loop behind the Responses API; GA in OpenShift AI 3.5 but supported only through 3.5 Full Support." }
          - { name: "kagent", kind: open, url: "https://kagent.dev/", note: "CNCF Sandbox project to deploy and govern agents on Kubernetes, reached over A2A or MCP, with gVisor sandboxes." }
          - { name: "Your agent on OpenShift, or OGX behind the Responses API", kind: commercial, url: "https://access.redhat.com/articles/rhoai-supported-configs", note: "OGX is GA in OpenShift AI 3.5 and supported only through 3.5 Full Support (ends 2027-03-27), not EUS.", packs: [redHatOpenShiftAi] }
      - block: memory
        service: "Conversation memory and retrieval index"
        options:
          - { name: "PostgreSQL with pgvector", kind: open, url: "https://github.com/pgvector/pgvector", note: "Rows and vectors in one database, so PostgreSQL row security also applies to vector queries." }
          - { name: "Valkey", kind: open, url: "https://valkey.io/", note: "BSD-licensed key/value store, compatible with Redis OSS, for sessions and short-lived task state." }
          - { name: "Milvus", kind: open, url: "https://milvus.io/docs/overview.md", note: "Apache-2.0 vector database under the LF AI & Data Foundation, for large indexes kept apart from row data." }
          - { name: "Redis Software", kind: commercial, url: "https://redis.io/docs/latest/operate/rs/", note: "Self-managed commercial Redis with vendor support, for session and cache state." }
          - { name: "EDB Postgres AI for CloudNativePG", kind: commercial, url: "https://www.enterprisedb.com/docs/postgres_for_kubernetes/latest/", note: "EDB's supported build of the CloudNativePG operator, for PostgreSQL and pgvector with a support contract." }
          - { name: "OGX vector stores (OpenShift AI)", kind: commercial, url: "https://www.redhat.com/en/blog/red-hat-ai-35-scaling-and-governing-ai-agents-production", note: "Built-in RAG through OGX is GA in Red Hat AI 3.5; the database behind it is one you run.", packs: [redHatOpenShiftAi], watch: [{ text: "Built-in RAG through OGX is GA in Red Hat AI 3.5; AutoRAG pgvector support is TP. The session cache is yours.", url: "https://www.redhat.com/en/blog/red-hat-ai-35-scaling-and-governing-ai-agents-production" }] }
          - { name: "PostgreSQL with pgvector; Valkey for sessions", kind: open, url: "https://github.com/pgvector/pgvector", packs: [upstreamOpenSource], watch: [{ text: "Row security and a partition for each tenant in PostgreSQL; an ACL user and an expiry on every session key in Valkey.", url: "https://github.com/pgvector/pgvector" }] }
      - block: gateway
        service: "Self-hosted AI gateway for models and tools"
        options:
          - { name: "LiteLLM Proxy", kind: open, url: "https://docs.litellm.ai/docs/simple_proxy", note: "Models, MCP servers and A2A agents behind one proxy with per-key and per-team grants; some features need its Enterprise licence.", packs: [upstreamOpenSource], watch: [{ text: "Models, MCP servers and search tools behind per-agent virtual keys.", url: "https://docs.litellm.ai/docs/simple_proxy" }, { text: "Needs its own PostgreSQL and Redis. Reading keys from Vault needs an Enterprise licence, so mount the master key and salt key from a Kubernetes Secret.", url: "https://docs.litellm.ai/docs/simple_proxy" }, { text: "Checking your identity provider's tokens itself (JWT auth) needs an Enterprise licence. In the open-source build the agent presents its own virtual key, so the gateway takes the user's identity on the agent's word: limit a call to the user with the token exchanged for each tool server.", url: "https://docs.litellm.ai/docs/proxy/token_auth" }] }
          - { name: "Kong Gateway Enterprise with AI Gateway", kind: commercial, url: "https://developer.konghq.com/plugins/ai-mcp-proxy/", note: "Plugins on Services and Routes: AI Proxy Advanced (lists vLLM), AI MCP Proxy with per-tool ACLs, AI A2A Proxy from 3.14.", packs: [kongAiGateway], watch: [{ text: "AI Gateway Enterprise; per-tool ACLs from 3.13; the MCP plugin does not apply AI Guardrails to MCP traffic.", url: "https://developer.konghq.com/plugins/ai-mcp-proxy/" }] }
          - { name: "Gravitee API Management (Agent Management)", kind: commercial, url: "https://documentation.gravitee.io/apim/4.10/agent-mesh", note: "LLM, MCP and A2A proxy API types on one gateway, fully self-hostable; Enterprise licence for the AI features.", packs: [graviteeAgentMesh], watch: [{ text: "Enterprise licence; routes to OpenAI, Gemini, Bedrock or any OpenAI-compatible endpoint you host.", url: "https://documentation.gravitee.io/apim/ai-agent-management/llm-proxy/proxy-your-llms" }] }
          - { name: "OpenShift AI Models-as-a-Service with the Connectivity Link MCP gateway", kind: commercial, url: "https://www.redhat.com/en/blog/model-context-protocol-gateway-red-hat-openshift-now-generally-available", note: "Kuadrant-based; MCP gateway GA in Connectivity Link 1.5 (Oct 2026), MaaS GA since OpenShift AI 3.4; MCP workflows in OpenShift AI 3.5 are TP; no A2A gateway.", packs: [redHatOpenShiftAi], watch: [{ text: "MaaS GA (showback TP). MCP gateway GA in Connectivity Link 1.5; OpenShift AI 3.5 MCP workflows through it are TP. No A2A or web-search gateway.", url: "https://www.redhat.com/en/blog/model-context-protocol-gateway-red-hat-openshift-now-generally-available" }] }
          - { name: "agentgateway", kind: open, url: "https://agentgateway.dev/", note: "Linux Foundation project donated by Solo.io: one data plane for LLM, MCP and A2A traffic with JWT, OIDC, ext_authz and tool scoping." }
          - { name: "Agent Router (formerly Envoy AI Gateway)", kind: open, url: "https://theagentrouter.ai/", note: "Envoy-based, now an Agentic AI Foundation project: LLM routing and one MCP tool catalogue; A2A is not listed." }
      - block: provider
        service: "Open-weight models you host, or a hosted model API"
        note: "Either open-weight models served on GPU servers you run, or a hosted model API under your agreement with its provider. The pattern reaches it through the gateway either way."
        options:
          - { name: "vLLM", kind: open, url: "https://docs.vllm.ai/en/latest/", note: "Open-source inference server with an OpenAI-compatible API.", packs: [upstreamOpenSource], watch: [{ text: "Called by LiteLLM as a hosted_vllm provider; KServe is the common alternative.", url: "https://docs.litellm.ai/docs/providers/vllm" }, { text: "Your own open-weights models, in the same data centre. Tool calling needs --enable-auto-tool-choice and a --tool-call-parser. KServe is the alternative.", url: "https://docs.vllm.ai/en/latest/" }, { text: "No authentication unless --api-key is set, and the key then covers only /v1, /v2, /inference and /cohere: /invocations, /tokenize and other paths answer without it, so only the gateway should reach it at the network.", url: "https://docs.vllm.ai/en/latest/usage/security/" }, { text: "Sends anonymous usage data to its maintainers unless VLLM_NO_USAGE_STATS=1 or DO_NOT_TRACK=1 is set on every serving pod; the self-hosted inference pattern lists the serving settings.", url: "https://docs.vllm.ai/en/latest/usage/usage_stats/" }] }
          - { name: "KServe", kind: open, url: "https://kserve.github.io/website/", note: "Kubernetes model serving through InferenceService resources, with vLLM and llm-d backends." }
          - { name: "llm-d", kind: open, url: "https://llm-d.ai/", note: "Distributed inference on Kubernetes (router plus vLLM); GA inside OpenShift AI 3.5." }
          - { name: "Red Hat AI Inference (vLLM)", kind: commercial, url: "https://www.redhat.com/en/products/ai/inference", note: "Red Hat's supported vLLM build, GA in OpenShift AI 3.5." }
          - { name: "NVIDIA NIM", kind: commercial, url: "https://docs.nvidia.com/nim/large-language-models/about-nim-llm/overview", note: "NVIDIA's prebuilt, optimised inference containers for LLMs on NVIDIA GPUs." }
          - { name: "SGLang", kind: open, url: "https://docs.sglang.io/", note: "Open-source high-throughput serving framework for language and multimodal models." }
          - { name: "A hosted model API, via the gateway", kind: commercial, url: "https://docs.litellm.ai/docs/providers", note: "A model provider's API, reached only from the gateway, which holds the key." }
          - { name: "Red Hat AI Inference (vLLM), with KServe or llm-d", kind: commercial, url: "https://access.redhat.com/articles/rhoai-supported-configs", note: "All three GA in OpenShift AI 3.5 per Red Hat's supported-configurations list.", packs: [redHatOpenShiftAi] }
      - { block: internalTools, service: "Your MCP tool servers, behind the gateway", build: true, note: "Registered on the gateway. Each verifies the exchanged token and its audience itself, and accepts calls from the gateway only." }
      - { block: orgData, service: "Your systems of record", build: true, note: "Yours to run. Enforce who may read which row in the store itself, for example with PostgreSQL row security." }
      - block: openWeb
        service: "Web search through the outbound proxy"
        options:
          - { name: "SearXNG", kind: open, url: "https://docs.searxng.org/admin/settings/settings_outgoing.html", note: "Self-hosted metasearch; its outgoing settings can send every engine request through your proxy." }
          - { name: "A commercial search API via the gateway (for example Brave Search API)", kind: commercial, url: "https://docs.litellm.ai/docs/search/", note: "Gateways list many providers (LiteLLM lists 20, including Brave, Tavily and Exa); queries leave your network." }
          - { name: "Squid outbound proxy", kind: open, url: "https://www.squid-cache.org/Doc/config/access_log/", note: "The single exit for search and page fetches, with an access log for review." }
          - { name: "SearXNG through the Squid outbound proxy", kind: open, url: "https://docs.searxng.org/admin/settings/settings_outgoing.html", packs: [upstreamOpenSource], watch: [{ text: "SearXNG runs inside and is registered on LiteLLM as a tool; it and page fetches leave only through the proxy.", url: "https://docs.searxng.org/" }] }
      - { block: sources, service: "Public package registries", note: "Outside the organisation. Only the package mirror may reach them, through your egress control." }
      - block: registry
        service: "Internal package mirror"
        options:
          - { name: "Sonatype Nexus Repository", kind: commercial, url: "https://help.sonatype.com/en/ce-onboarding.html", note: "PyPI and npm proxies with routing rules; Community Edition is free but stops adding components past 40,000 or 100,000 requests a day.", packs: [upstreamOpenSource], watch: [{ text: "PyPI and npm proxy repositories; Pulp is the open-source alternative.", url: "https://help.sonatype.com/en/pypi-repositories.html" }, { text: "Proxy and hosted repositories for PyPI and npm. Community Edition has usage caps; Pulp is the alternative.", url: "https://help.sonatype.com/en/sonatype-nexus-repository.html" }, { text: "Routing rules allow or block by request path only and detect no malicious or look-alike package; Sonatype's separate, paid Repository Firewall quarantines those. Without it, a quarantine repository and your own check come before promotion.", url: "https://help.sonatype.com/en/routing-rules.html" }] }
          - { name: "JFrog Artifactory", kind: commercial, url: "https://docs.jfrog.com/artifactory/docs/remote-repositories", note: "Remote repositories cache npm, PyPI and others on demand; self-managed or SaaS; Curation can block risky packages." }
          - { name: "Pulp", kind: open, url: "https://pulpproject.org/", note: "Open-source content manager: npm pull-through cache, PyPI by syncing from a remote, containers and RPMs." }
          - { name: "GitLab package registry", kind: commercial, url: "https://docs.gitlab.com/user/packages/pypi_repository/", note: "Hosts your own packages; PyPI requests it lacks go to pypi.org by default; no npm or PyPI caching proxy.", packs: [gitlabUltimate] }
          - { name: "GitHub Packages on Enterprise Server", kind: commercial, url: "https://docs.github.com/en/enterprise-server@3.22/packages/learn-github-packages/introduction-to-github-packages", note: "Hosts npm, Maven, NuGet, RubyGems and container packages; no PyPI and no documented proxying of public registries." }
      - block: govIdentity
        service: "Identity provider and workload identity"
        options:
          - { name: "Keycloak", kind: open, url: "https://www.keycloak.org/securing-apps/token-exchange", note: "People and service clients in one realm, with token exchange for hand-offs.", packs: [upstreamOpenSource] }
          - { name: "Red Hat build of Keycloak", kind: commercial, url: "https://access.redhat.com/products/red-hat-build-keycloak/", note: "Supported Keycloak build from Red Hat.", packs: [redHatOpenShiftAi], watch: [{ text: "ZTWIM 1.1 GA July 2026; SPIRE in OpenShift Service Mesh 3.5 is GA in sidecar mode, not yet in ambient mode.", url: "https://www.redhat.com/en/blog/zero-trust-workload-identity-manager-11-generally-available-red-hat-openshift" }] }
          - { name: "Kubernetes ServiceAccount tokens", kind: open, url: "https://kubernetes.io/docs/concepts/security/service-accounts/", note: "Short-lived projected tokens give each workload an identity the IdP and vault can verify.", packs: [upstreamOpenSource] }
          - { name: "SPIFFE and SPIRE", kind: open, url: "https://spiffe.io/docs/latest/spire-about/", note: "Attested workload identities and trust-domain federation, an alternative to keys per client." }
          - { name: "Red Hat zero trust workload identity manager", kind: commercial, url: "https://www.redhat.com/en/blog/zero-trust-workload-identity-manager-11-generally-available-red-hat-openshift", note: "Red Hat's SPIRE operator, GA 1.1 (July 2026), with Vault and cert-manager as upstream authorities.", packs: [redHatOpenShiftAi] }
          - { name: "Gravitee Access Management", kind: commercial, url: "https://documentation.gravitee.io/am/4.11/guides/developer-contributions/using-oauth-2.0-token-exchange", note: "Gravitee's IdP and authorisation server, with delegated token exchange.", packs: [graviteeAgentMesh], watch: [{ text: "Token exchange with delegation (act claim) in AM 4.11; federates to your directory.", url: "https://documentation.gravitee.io/am/4.11/guides/developer-contributions/using-oauth-2.0-token-exchange" }] }
      - block: govSecrets
        service: "Secrets manager with a hardware root"
        options:
          - { name: "HashiCorp Vault", kind: commercial, url: "https://developer.hashicorp.com/vault/docs/deploy/kubernetes/vso", note: "Dynamic credentials, transit keys and the Vault Secrets Operator; HSM auto-unseal needs Vault Enterprise.", packs: [upstreamOpenSource] }
          - { name: "OpenBao", kind: open, url: "https://openbao.org/docs/configuration/seal/pkcs11/", note: "Open-source fork of Vault under the Linux Foundation's OpenSSF; documents a PKCS#11 HSM seal.", packs: [upstreamOpenSource] }
          - { name: "External Secrets Operator", kind: open, url: "https://external-secrets.io/latest/", note: "Syncs secrets from an external store into Kubernetes Secrets; pairs with any vault here." }
          - { name: "External Secrets Operator for Red Hat OpenShift", kind: commercial, url: "https://developers.redhat.com/articles/2025/11/11/introducing-external-secrets-operator-openshift", note: "Red Hat-supported ESO, GA for OpenShift 4.20+, syncing from Vault or CyberArk Conjur.", packs: [redHatOpenShiftAi], watch: [{ text: "GA for OpenShift 4.20+; it syncs from a vault you run, such as HashiCorp Vault or CyberArk Conjur.", url: "https://developers.redhat.com/articles/2025/11/11/introducing-external-secrets-operator-openshift" }] }
          - { name: "Idira Secrets Manager, self-hosted (Palo Alto Networks)", kind: commercial, url: "https://www.paloaltonetworks.com/idira/machine/secrets-management", note: "The former CyberArk line now under Palo Alto's Idira brand; SaaS or self-hosted for air-gapped sites." }
      - block: govPolicy
        service: "Network, admission and guardrail policy"
        options:
          - { name: "Kubernetes", kind: open, url: "https://kubernetes.io/docs/concepts/overview/", note: "The container platform each platform pack here runs on, upstream or as a distribution (OpenShift, VKS, Canonical Kubernetes).", packs: [upstreamOpenSource, redHatOpenShiftAi] }
          - { name: "Presidio", kind: open, url: "https://data-privacy-stack.github.io/presidio/", note: "PII detection and anonymisation, including batch structured data; now community-owned", packs: [upstreamOpenSource] }
          - { name: "LLM Guard", kind: open, url: "https://protectai.github.io/llm-guard/input_scanners/prompt_injection/", packs: [upstreamOpenSource] }
          - { name: "Cilium", kind: open, url: "https://docs.cilium.io/en/stable/security/policy/", packs: [upstreamOpenSource] }
          - { name: "Temporal (self-hosted)", kind: open, url: "https://docs.temporal.io/self-hosted-guide", note: "MIT-licensed server that journals each step as Event History and replays it after a crash; you run its database.", packs: [upstreamOpenSource] }
      - block: govSupplyChain
        service: "Mirrors, scanners and signing in the pipeline"
        options:
          - { name: "promptfoo", kind: open, url: "https://www.promptfoo.dev/docs/intro/", note: "Open-source CLI and library for LLM evaluation and red teaming; agreed to be acquired by OpenAI (March 2026) and says it stays open source", packs: [upstreamOpenSource] }
          - { name: "Trivy", kind: open, url: "https://trivy.dev/docs/latest/guide/scanner/vulnerability/", packs: [upstreamOpenSource] }
          - { name: "Harbor", kind: open, url: "https://goharbor.io/docs/2.16.0/administration/configure-proxy-cache/", note: "Image registry with a proxy cache and Trivy scanning; images, not PyPI or npm.", packs: [upstreamOpenSource] }
      - block: govObservability
        service: "Logs, traces and SIEM off the agent's path"
        options:
          - { name: "OpenTelemetry Collector", kind: open, url: "https://opentelemetry.io/docs/collector/", note: "Vendor-neutral pipeline that receives gateway logs and traces and forwards them to stores the agent cannot write.", packs: [upstreamOpenSource] }
          - { name: "Grafana Loki", kind: open, url: "https://grafana.com/docs/loki/latest/", note: "Log store; turn retention on, or logs are kept for ever.", packs: [upstreamOpenSource] }
          - { name: "Langfuse (self-hosted)", kind: open, url: "https://langfuse.com/self-hosting", note: "Self-hosted LLM tracing and evaluation, with a documented LiteLLM integration.", packs: [upstreamOpenSource] }
          - { name: "MLflow Tracing", kind: open, url: "https://mlflow.org/docs/latest/genai/tracing/", note: "Agent and LLM tracing; GA in OpenShift AI 3.5, where the visual agent-trace view is Technology Preview.", packs: [redHatOpenShiftAi], watch: [{ text: "MLflow is GA in OpenShift AI 3.5; the visual agent-trace view is Technology Preview. The SIEM is yours.", url: "https://www.redhat.com/en/blog/red-hat-ai-35-scaling-and-governing-ai-agents-production" }] }
          - { name: "Elastic Security", kind: commercial, url: "https://www.elastic.co/docs/solutions/security", note: "SIEM and detection engine; one example of where detections on gateway, egress and audit logs run." }
    sources:
      internalTools: https://docs.litellm.ai/docs/mcp
      orgData: https://www.postgresql.org/docs/current/ddl-rowsecurity.html
      sources: https://pypi.org/
    differences:
      - at: gateway->provider
        text: "Where the organisation serves its own models (the self-hosted inference pattern), the model provider sits inside the data centre and prompts and completions do not leave it. Where it calls an external model API instead, the provider stays outside and the call leaves through the organisation's egress control."
        change: "Conditional on the organisation's choice, not on the platform: when models are self-hosted, move the provider box from the external zone into the Enterprise data centre boundary and link it to archSelfHostedInference, so gateway->provider no longer crosses the boundary; when an external model API is used, leave the drawing as it is."
    alsoNeeded:
      - service: "Identity provider and authorisation server, highly available"
        role: identity
        why: "The sign-in service and the OAuth authorization server for people, services and token exchange (for example Keycloak, with its own database). A cloud would have run it for you."
        url: https://www.keycloak.org/documentation
      - service: "Secrets manager with a protected root key"
        role: secrets
        why: "It holds the gateway's master key, database credentials and signing keys (for example HashiCorp Vault or OpenBao). Protect its root key so that no one person or file unseals it: an HSM seal (PKCS#11 auto-unseal needs Vault Enterprise; OpenBao has an open-source pkcs11 seal) or key shares held by several people."
        url: https://openbao.org/docs/configuration/seal/pkcs11/
      - service: "Certificate issuance and renewal from an internal authority"
        role: keys
        why: "Every service-to-service connection needs a certificate that is issued and renewed without a person, from a private authority you control (for example cert-manager with your internal CA)."
        url: https://cert-manager.io/docs/
      - service: "Network policy enforcement and egress control"
        role: network
        why: "A network plugin enforces the policies, and outbound traffic leaves only to approved destinations and is recorded (for example Cilium with a Squid forward proxy, or an egress gateway). Without both, every pod can reach every other pod and the internet."
        url: https://docs.cilium.io/en/stable/security/policy/
      - service: "Private container registry that scans and serves signed images"
        role: registry
        why: "The cluster pulls the agent, gateway, inference and sandbox images from a registry inside the data centre, scanned and signed, not from the internet (for example Harbor with Trivy and Cosign)."
        url: https://goharbor.io/docs/
      - service: "Log, trace and agent-trace stores the agent cannot write"
        role: logging
        why: "They receive the gateway's logs and traces and keep them where the agent cannot write (for example the OpenTelemetry Collector, Grafana Loki and self-hosted Langfuse). Loki keeps logs for ever unless retention is turned on."
        url: https://opentelemetry.io/docs/collector/
      - service: "Your SIEM, fed by the collector and the platform's audit logs"
        role: logging
        why: "Detections on blocked calls, denied egress and key use have to run somewhere. On Kubernetes the API server logs nothing until an audit policy file is set."
        url: https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
      - service: "The container platform's control plane on your own servers"
        role: other
        why: "You build and run the highly available control plane, its datastore and its certificates that a managed service would have provided (on Kubernetes, the API servers and etcd)."
        url: https://kubernetes.io/docs/setup/production-environment/
      - service: "GPU servers with their drivers, container toolkit and device plugin"
        role: other
        why: "Where you serve your own models, the hardware and its drivers, container toolkit and device plugin are yours to buy, install and keep working (for example with the NVIDIA GPU Operator). Capacity is what you own."
        url: https://docs.nvidia.com/datacenter/cloud-native/gpu-operator/latest/index.html
      - service: "Cluster and volume backup with tested restores"
        role: other
        why: "Cluster resources and the volumes behind the databases, the identity provider, the secrets manager and the logs need tested backups in a second location you run (for example Velero)."
        url: https://velero.io/docs/
      - service: "Patching and upgrades of the platform and every component"
        role: other
        why: "Nobody else patches the cluster, the nodes, the gateway, the inference servers or the identity provider for you. Plan regular upgrades and a way to roll them back."
        url: https://kubernetes.io/docs/tasks/administer-cluster/cluster-upgrade/
    quickstart:
      - title: "AI gateway, for example LiteLLM Proxy: Deploy with Helm"
        url: https://docs.litellm.ai/docs/proxy/deploy/helm
      - title: "Inference server, for example vLLM: Using Kubernetes"
        url: https://docs.vllm.ai/en/latest/deployment/k8s/
      - title: "Front door, for example Envoy Gateway: OIDC Authentication"
        url: https://gateway.envoyproxy.io/docs/tasks/security/oidc/
    # >>> hosting options (compared against the vendor's pages; one is the mapping itself)
    hosting:
      - id: kubernetes
        kind: cluster
        name: "Kubernetes"
        url: https://kubernetes.io/docs/concepts/overview/
        asOf: "2026-11"
        mapped: true
        compare:
          runs: "Your own code runs the loop in pods you deploy; Kubernetes schedules and restarts the pods and provides no application-level services."
          patching: "You do: you upgrade the control plane, drain and upgrade each node, and keep the node operating system and third-party plugins current."
          data: "Prompts, tool results and state stay in your pods and the stores you run on your own servers; Secrets sit unencrypted in etcd unless you configure encryption."
          network: "Pods accept and open all connections by default; NetworkPolicy isolates them only if your network plugin enforces it, and it cannot log or do anything TLS related."
          identity: "Each pod runs as a ServiceAccount, the namespace's default unless you set one, and gets a short-lived, rotating token mounted as a projected volume."
          accepts: "Any language or framework that runs in a container; the project says it does not limit the types of application supported."
          workload: "Deployments keep pods running, Jobs run to completion and CronJobs run on a schedule; durable waits need an engine you run yourself, such as Temporal."
          portability: "The agent is a container image plus Kubernetes manifests on a platform the project calls portable; your stores, plugins and policies move separately."
          effort: "You operate and are on call for the control plane, etcd backups, certificates, nodes, the network plugin, upgrades, logging, monitoring and every add-on."
          fits: "The project says any application that can run in a container should run on it, naming stateless, stateful and data-processing workloads."
        sources:
          - https://kubernetes.io/docs/concepts/overview/
          - https://kubernetes.io/docs/concepts/workloads/
          - https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/
          - https://kubernetes.io/docs/concepts/security/service-accounts/
          - https://kubernetes.io/docs/concepts/services-networking/network-policies/
          - https://kubernetes.io/docs/tasks/administer-cluster/cluster-upgrade/
          - https://kubernetes.io/docs/setup/production-environment/
          - https://kubernetes.io/docs/concepts/security/secrets-good-practices/
          - https://docs.temporal.io/workers
          - https://docs.temporal.io/workflow-execution
          - https://docs.temporal.io/production-deployment/worker-deployments
      - id: knative
        kind: runtime
        name: "Knative Serving"
        url: https://knative.dev/docs/serving/
        asOf: "2026-11"
        compare:
          runs: "Your own code runs the loop in a container that Knative Serving starts and scales on HTTP requests, on a cluster you operate; Knative runs no agent logic."
          patching: "You do: the cluster and its nodes as before, plus Knative Serving, Eventing and the networking layer, which you upgrade one minor version at a time."
          data: "Processed in your pods on your own servers; Knative expects little or no state in an instance and may reclaim idle ones, so state lives in stores you run."
          network: "Services are private on the cluster domain until you configure a domain name; Knative relies on the cluster, so outbound control stays your NetworkPolicy and proxy."
          identity: "A Revision's pods run as the namespace's default ServiceAccount unless serviceAccountName is set; tokens and RBAC are those of Kubernetes, which you manage."
          accepts: "Any language or framework, provided the container accepts HTTP requests; Knative describes its target as stateless, request-triggered containers."
          workload: "A request must finish within timeoutSeconds (default 300, at most 600 unless you raise it); idle Revisions scale to zero; PingSource sends events on a cron schedule."
          portability: "The agent stays an ordinary HTTP container; moving off means replacing the Knative Service, its routing and autoscaling with Kubernetes objects you write."
          effort: "You still operate everything: the cluster, Knative Serving with its activator and autoscaler, a networking layer, Eventing if used, and all their upgrades."
          fits: "Knative's docs list API development, event-driven applications, inference services and microservices as use cases; Serving targets stateless HTTP services."
        sources:
          - https://knative.dev/docs/
          - https://knative.dev/docs/serving/
          - https://knative.dev/docs/serving/request-flow/
          - https://knative.dev/docs/serving/autoscaling/scale-to-zero/
          - https://knative.dev/docs/serving/autoscaling/scale-bounds/
          - https://knative.dev/docs/serving/autoscaling/autoscaler-types/
          - https://knative.dev/docs/serving/autoscaling/concurrency/
          - https://knative.dev/docs/serving/configuration/config-defaults/
          - https://knative.dev/docs/serving/configuration/feature-flags/
          - https://knative.dev/docs/serving/services/private-services/
          - https://knative.dev/docs/serving/deploying-from-private-registry/
          - https://knative.dev/docs/serving/tag-resolution/
          - https://knative.dev/docs/serving/config-network-adapters/
          - https://knative.dev/docs/serving/traffic-management/
          - https://knative.dev/docs/serving/rolling-out-latest-revision/
          - https://knative.dev/docs/serving/istio-authorization/
          - https://knative.dev/docs/reference/security/threat-model/
          - https://knative.dev/docs/install/upgrade/upgrade-installation/
          - https://knative.dev/docs/install/yaml-install/serving/install-serving-with-yaml/
          - https://knative.dev/docs/eventing/
          - https://knative.dev/docs/eventing/sources/ping-source/
          - https://github.com/knative/specs/blob/main/specs/serving/runtime-contract.md
          - https://github.com/knative/serving/blob/main/pkg/apis/serving/fieldmask.go
          - https://knative.dev/blog/articles/gateway-api-ingress-with-knative-operator/
          - https://gateway.envoyproxy.io/docs/tasks/security/oidc/
          - https://gateway.envoyproxy.io/docs/tasks/traffic/global-rate-limit/
          - https://docs.temporal.io/workers
          - https://docs.temporal.io/production-deployment/worker-deployments/serverless-workers
          - https://docs.temporal.io/serverless-workers
        summary: "The chat agent is a Knative Service on your cluster. Your front door stays in front, wired in through Knative's networking layer (the Gateway API plugin is beta), and Serving scales the agent's pods with the turns in flight, to zero when nobody is chatting. The first turn after idle waits for a pod, each reply must finish within the request timeout, and a worker that polls for approval waits, if the design uses one, runs as a Deployment of its own. You install and upgrade Knative, and you still operate everything."
        bindings:
          - { block: agent, service: "Your agent as a Knative Service (Knative Serving)", build: true, note: "Any framework that serves HTTP. Pods scale with the turns in flight and to zero when idle. A worker that polls for approval waits, if the design uses a durable workflow engine, is a separate Deployment, because it serves no requests.", url: https://knative.dev/docs/serving/, watch: [{ text: "A streamed reply is one request and ends at timeoutSeconds (default 300, at most 600 unless max-revision-timeout-seconds is raised). An idle instance may be reclaimed, so nothing may live only in the pod's memory; a component that polls for work instead of serving requests, such as a durable-workflow worker that holds approval waits, runs as an ordinary Deployment beside it.", url: "https://knative.dev/docs/serving/configuration/config-defaults/" }] }
          - { block: entry, service: "Front door with single sign-on, wired in through Knative's networking layer", note: "Knative generates the routes on the Gateway named in config-gateway, so the sign-in and rate-limit policies target that Gateway (with Envoy Gateway, its OIDC SecurityPolicy). The Gateway API plugin is beta; Knative tests it against the Istio, Contour and Envoy Gateway implementations.", url: https://knative.dev/docs/serving/config-network-adapters/ }
        addSettings: [k8sRbacLeastPrivilege, harborProxyCache, knativeScaleBounds, knativeRequestLimits, knativeTrafficSplit, knativeGatewayApiIngress, knativeClusterLocalVisibility, knativeActivatorIngress, knativeLocalGatewayAccess]
        # Drawn, not described: a turn passes Knative's own hop between the front door and the agent.
        shape:
          - insert:
              id: knativeActivator
              title: "Knative activator"
              summary: "Shared hop at low traffic, then the queue-proxy beside the agent"
              on: entry->agent
            why: "At low or zero traffic Knative routes each turn through the activator, a component every Knative Service shares in the knative-serving namespace, and always through the queue-proxy beside the agent. Default-deny policy must admit that namespace, and the first turn after idle waits for a pod to start."
            url: https://knative.dev/docs/serving/request-flow/
        differences:
          - at: events->agent
            text: "Knative also serves each Service on a cluster-local address through the shared local gateway, with no front-door sign-in. A scheduled run arrives that way, and so can any pod that can reach the local gateway. Limit which workloads reach it; the agent treats such a call as a run with no user (as the events->agent arrow already says)."
            url: https://knative.dev/docs/serving/services/private-services/
            change: "Knative option only: insert the 'Knative local gateway' on events->agent, and mark it as a second way into the agent that does not pass the front end."
        alsoNeeded:
          - service: "Knative Serving (controller, autoscaler, activator)"
            role: other
            why: "Runs and scales the agent's Service. You install it on your cluster and upgrade it one minor version at a time; the activator and autoscaler are shared by every Service."
            url: https://knative.dev/docs/install/yaml-install/serving/install-serving-with-yaml/
          - service: "A Knative networking layer that keeps your front door"
            role: ingress
            why: "Knative routes every request through one networking layer (Kourier, Contour, Istio or the Gateway API plugin); the Gateway API plugin is beta and lets an existing front door such as Envoy Gateway stay in front, with the external and local Gateways named in config-gateway."
            url: https://knative.dev/blog/articles/gateway-api-ingress-with-knative-operator/
          - service: "A Deployment for any worker that polls, such as a durable-workflow worker"
            role: other
            why: "A worker that polls a task queue gets no HTTP requests, which Knative scales on, so it stays a Deployment. Temporal's Serverless Workers (preview), for example, cover only AWS Lambda, Cloud Run and AgentCore Runtime."
            url: https://docs.temporal.io/production-deployment/worker-deployments/serverless-workers
          - service: "Your container registry, reachable and trusted by the Serving controller"
            role: registry
            why: "Serving resolves image tags to digests when it creates a Revision, so its controller must reach your registry, trust its certificate and use your proxy settings."
            url: https://knative.dev/docs/serving/tag-resolution/
        quickstart:
          - title: "Install Serving with YAML"
            url: https://knative.dev/docs/install/yaml-install/serving/install-serving-with-yaml/
          - title: "Configure Knative networking"
            url: https://knative.dev/docs/serving/config-network-adapters/
          - title: "Managing Gateway API ingress with the Knative Operator"
            url: https://knative.dev/blog/articles/gateway-api-ingress-with-knative-operator/
