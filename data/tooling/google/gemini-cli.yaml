      - mitigation: cap-agent-egress-control
        coverage: partial
        mechanism: >-
          tools.sandboxNetworkAccess (on/off); *-proxied SEATBELT_PROFILE with GEMINI_SANDBOX_PROXY_COMMAND for
          an organisation-written domain allowlist; agents.browser.allowedDomains for the browser agent;
          GOOGLE_GEMINI_BASE_URL / GOOGLE_VERTEX_BASE_URL for model traffic
        steps:
          - title: Deny sandbox network
            body:
              - Keep tools.sandboxNetworkAccess false (the default) in the system settings.
            url: https://geminicli.com/docs/reference/configuration/
          - title: Proxy the macOS sandbox
            body:
              - Set SEATBELT_PROFILE to a *-proxied profile (permissive-proxied, restrictive-proxied or
                strict-proxied) so sandboxed network traffic goes through a proxy.
            url: https://geminicli.com/docs/cli/sandbox/
          - title: Allowlist destinations in the proxy
            body:
              - Point GEMINI_SANDBOX_PROXY_COMMAND at a proxy script that admits only the AI gateway, the
                package mirror and approved hosts; the example admits HTTPS to listed domains and declines the
                rest.
            url: https://geminicli.com/docs/examples/proxy-script/
          - title: Route the model calls
            body:
              - Set GOOGLE_GEMINI_BASE_URL (API-key auth) or GOOGLE_VERTEX_BASE_URL (Vertex auth) to the
                organisation's AI gateway and deny direct egress to the Google endpoints.
            url: https://geminicli.com/docs/reference/configuration/
        note: >-
          Partial: the sandbox has network on/off, and a domain allowlist exists only as an
          organisation-written proxy script or for the browser agent (agents.browser.allowedDomains). None of it
          is admin-lockable: SEATBELT_PROFILE, GEMINI_SANDBOX_PROXY_COMMAND and GEMINI_SANDBOX are environment
          variables and the sandbox yields to them (see D3-EI). Bypasses: unsandboxed runs, remote MCP servers,
          web_fetch (it blocks private and internal addresses and asks for confirmation, but retrieves through
          the Gemini API's urlContext) and the CLI's own API traffic; the base-URL overrides cover API-key and
          Vertex auth only. The endpoint egress allowlist enforced by device management is the control the
          drawing pins; Code Assist supports VPC Service Controls on the service side.
        verified: "2026-09-25"
