# Sourced categories; all implementation and cross-framework relationships are authored here.
attribution: OWASP provides the primary AI solution categories, supplemented by ENISA and ECSO technology
  categories. CISA TIC functions and NIST CSF outcomes are supplementary mappings. All tech-* identifiers and
  category-entry slugs are repository keys, not official IDs. CoSAI remains the core taxonomy. Descriptions
  and crosswalk rationales are authored here.
capabilities:
  - id: tech-llm-firewall
    title: LLM Firewall
    category: AI security
    description: Enforces policies at LLM request and response boundaries. Input inspection, output filtering, and
      exfiltration prevention require separate feature verification.
    primarySource:
      framework: owasp-solutions
      entry: llm-firewall
    frameworkMappings:
      - framework: owasp-solutions
        entry: llm-firewall
        relationship: same-category
        rationale: Uses the published category; the display name may expand an acronym or normalize spelling.
      - framework: nist-csf
        entry: PR.DS
        relationship: supports
        rationale: Sensitive-content filtering can contribute to data protection.
      - framework: nist-csf
        entry: DE.CM
        relationship: supports
        rationale: Inspection telemetry can contribute to runtime monitoring.
    mitigationMappings:
      - mitigation: AML.M0020
        rationale: Can implement input/output guardrail checks at a model boundary.
      - mitigation: D3-OTF
        rationale: Can restrict outbound content where the firewall mediates that path.
  - id: tech-llm-benchmarking
    title: LLM Automated Benchmarking
    category: AI security
    description: Automated security evaluation, including vulnerability scanning. This category does not imply
      that automated tests replace an independent red team.
    primarySource:
      framework: owasp-solutions
      entry: llm-benchmarking
    frameworkMappings:
      - framework: owasp-solutions
        entry: llm-benchmarking
        relationship: same-category
        rationale: Uses the published category; the display name may expand an acronym or normalize spelling.
      - framework: nist-csf
        entry: ID.RA
        relationship: supports
        rationale: Security testing identifies weaknesses.
      - framework: nist-csf
        entry: ID.IM
        relationship: supports
        rationale: Test findings inform improvement.
      - framework: ecso-market
        entry: vulnerability
        relationship: narrower
        rationale: AI model testing contributes to broader vulnerability management.
    mitigationMappings:
      - mitigation: AML.M0008
        rationale: Evaluations can test model behavior against defined expectations.
      - mitigation: AML.M0035
        rationale: Adversarial test automation can assist a scoped AI red-team exercise.
  - id: tech-llm-guardrails
    title: LLM Guardrails
    category: AI security
    description: Runtime policies for model inputs, context, and outputs. Overlaps with LLM firewalls; these are
      alternative source categories and should not be counted as independent protection.
    primarySource:
      framework: owasp-solutions
      entry: llm-guardrails
    frameworkMappings:
      - framework: owasp-solutions
        entry: llm-guardrails
        relationship: same-category
        rationale: Uses the published category; the display name may expand an acronym or normalize spelling.
      - framework: nist-csf
        entry: PR.DS
        relationship: supports
        rationale: Data-handling guardrails can protect sensitive content.
    mitigationMappings:
      - mitigation: AML.M0020
        rationale: Implements selected runtime guardrail functions; each boundary must be assessed.
      - mitigation: AML.M0033
        rationale: Validation components can constrain agent inputs and outputs.
  - id: tech-ai-spm
    title: AI Security Posture Management (AI-SPM)
    category: AI security
    description: Discovers AI assets and assesses their configuration, exposure, and vulnerabilities. The category
      does not imply runtime blocking.
    primarySource:
      framework: owasp-solutions
      entry: ai-spm
    frameworkMappings:
      - framework: owasp-solutions
        entry: ai-spm
        relationship: same-category
        rationale: Uses the published category; the display name may expand an acronym or normalize spelling.
      - framework: nist-csf
        entry: ID.AM
        relationship: supports
        rationale: Discovery supports AI asset management.
      - framework: nist-csf
        entry: ID.RA
        relationship: supports
        rationale: Findings support risk assessment.
      - framework: cisa-tic
        entry: 3.UNI.INVENT
        relationship: supports
        rationale: Asset discovery contributes to inventory.
      - framework: cisa-tic
        entry: 3.UNI.CMANA
        relationship: supports
        rationale: Configuration assessment detects posture deviations.
    mitigationMappings:
      - mitigation: D3-AI
        rationale: Discovery can maintain an AI asset inventory.
      - mitigation: D3-CI
        rationale: Posture assessment inventories AI configuration.
      - mitigation: D3-AVE
        rationale: Assessments enumerate vulnerabilities in AI assets.
  - id: tech-agentic-security
    title: Agentic AI App Security
    category: AI security
    description: An emerging umbrella for agent identity, action authorization, and runtime oversight. Assess the
      actual functions supplied by each implementation.
    primarySource:
      framework: owasp-solutions
      entry: agentic-security
    frameworkMappings:
      - framework: owasp-solutions
        entry: agentic-security
        relationship: same-category
        rationale: Uses the published category; the display name may expand an acronym or normalize spelling.
      - framework: nist-csf
        entry: PR.AA
        relationship: supports
        rationale: Agent authorization supports controlled access.
      - framework: nist-csf
        entry: DE.CM
        relationship: supports
        rationale: Agent behavior monitoring contributes to detection.
    mitigationMappings:
      - mitigation: AML.M0028
        rationale: Permission enforcement can restrict tools available to agents.
      - mitigation: AML.M0037
        rationale: Authority checks can constrain delegated privilege expansion.
      - mitigation: AML.M0038
        rationale: Agent monitoring can detect scope drift.
      - mitigation: AML.M0029
        rationale: Action policy can route high-impact actions for human approval.
  - id: tech-dlp
    title: Data Loss Prevention (DLP)
    category: Data security
    description: Detects sensitive data and restricts its transfer. AI coverage depends on inspecting the relevant
      prompt, upload, response, or tool channel.
    primarySource:
      framework: enisa-ecsmaf
      entry: dlp
    frameworkMappings:
      - framework: enisa-ecsmaf
        entry: dlp
        relationship: same-category
        rationale: Uses the published category; the display name may expand an acronym or normalize spelling.
      - framework: ecso-market
        entry: dlp
        relationship: same-category
        rationale: Same technology category under ECSO terminology.
      - framework: cisa-tic
        entry: 3.PEP.FI.DLPRE
        relationship: supports
        rationale: File inspection can enforce file DLP policies.
      - framework: cisa-tic
        entry: 3.PEP.WE.DLPRE
        relationship: supports
        rationale: Web inspection can enforce web DLP policies.
      - framework: nist-csf
        entry: PR.DS
        relationship: supports
        rationale: Leakage prevention contributes to data confidentiality.
    mitigationMappings:
      - mitigation: AML.M0020
        rationale: Sensitive-data screening can implement the data-leakage subset of AI guardrails; it does not imply
          injection defense.
      - mitigation: D3-OTF
        rationale: Egress enforcement can block sensitive outbound content.
  - id: tech-casb
    title: Cloud Access Security Brokers (CASB)
    category: Cloud security
    description: Applies security policy around cloud-service access and usage. API-based and inline
      implementations expose different enforcement boundaries.
    primarySource:
      framework: enisa-ecsmaf
      entry: casb
    frameworkMappings:
      - framework: enisa-ecsmaf
        entry: casb
        relationship: same-category
        rationale: Uses the published category; the display name may expand an acronym or normalize spelling.
      - framework: ecso-market
        entry: casb
        relationship: same-category
        rationale: Same technology category under ECSO terminology.
      - framework: nist-csf
        entry: PR.AA
        relationship: supports
        rationale: Cloud access enforcement supports authorization.
      - framework: nist-csf
        entry: DE.CM
        relationship: supports
        rationale: Cloud-session analysis supports monitoring.
    mitigationMappings:
      - mitigation: D3-AMED
        rationale: Brokered cloud access can enforce authorization decisions.
      - mitigation: D3-WSAA
        rationale: Session analysis can identify suspicious cloud usage.
      - mitigation: D3-OTF
        rationale: Inline enforcement can restrict cloud-bound traffic.
  - id: tech-cspm
