# GitHub Copilot Chat on github.com — one entity per product × reference architecture. Facts are
# dated (asOf) and cite the vendor's own documentation; re-verify before enforcing. Schema:
# data/tooling/README.md. Excluded: knowledge bases (replaced by Spaces), GitHub Models (retired
# 2026-07-30), Copilot Extensions (retired 2025-11-10), Copilot Memory (not used by Chat on github.com
# per the supported-surfaces table and the Memory page, 2026-09-25; recorded on toolCopilotCloudAgent).
# 2026-09-25: re-verified toolCopilotChatGithub against the MITRE capability rules; no URL in the file
# redirected; copilot.github.trust.page renders client-side (read in a browser); docs.github.com pages read
# through /api/article/body.
vendor: github
family: GitHub Copilot Chat
tools:
  - id: toolCopilotChatGithub
    name: GitHub Copilot Chat on github.com
    surfaceClasses:
      - saasChat
    variants:
      - name: Copilot Chat on github.com (immersive and panel)
        class: saasChat
        url: >-
          https://docs.github.com/en/copilot/how-tos/copilot-on-github/chat-with-copilot/chat-in-github
      - name: Copilot Chat in GitHub Mobile
        class: saasChat
        url: https://docs.github.com/en/copilot/concepts/chat
      - name: Copilot Spaces (curated context, organisation-owned or personal)
        class: saasChat
        url: https://docs.github.com/en/copilot/concepts/context/spaces
    architecture: archEnterpriseAiChat
    status: ga
    asOf: "2026-09"
    summary:
      - "Copilot Chat on github.com and Mobile answers over repositories, issues and PRs the user can see,
        attaches images and PDFs, searches the web when the policy allows, and calls a fixed GitHub MCP server
        to do a limited set of tasks (branches, merges) on request; a chat can hand off into a cloud agent
        session. Spaces bundle repositories, files, issues and uploads as reusable context."
      - "Inference runs on the Copilot API with enterprise-enabled models; retrieval runs with the user's own
        permissions (viewers of a Space only see sources they can access). Conversations are stored by GitHub:
        today 100 conversations with 28-day message retention, moving to life-of-account no earlier than
        2026-09-28 when chat, Mobile chat and the cloud agent merge under one policy. Business and Enterprise
        prompts are not used for training."
      - "Admin levers are the \"Copilot in GitHub.com\" policy (soon the unified policy), the web search and
        models policies, content exclusion, and, for Enterprise Managed Users, the enterprise access-restriction
        header. Spaces have no dedicated policy on the pages fetched; the MCP and Memory policies do not apply
        to Chat in GitHub."
    facts:
      - label: Plans
        value: >-
          All plans; Business and Enterprise gate it with Copilot in GitHub.com and, no earlier than 2026-09-28,
          a single policy (set under "Copilot cloud agent (coming soon)") shared with Mobile chat and the cloud
          agent.
        url: >-
          https://github.blog/changelog/2026-08-28-upcoming-changes-to-github-copilot-policies-and-billing/
      - label: Inference & routing
        value: >-
          Copilot API; models selectable per conversation within the enterprise Configure models policy;
          enterprise BYOK custom models appear in Chat; data-resident routing under the data residency policy.
        url: >-
          https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-enterprise/enable-custom-models
      - label: Data leaving the browser
        value: >-
          Prompts, attached files, repository context and (when enabled) web search results to the Copilot
          API; nothing runs on the device.
        url: https://docs.github.com/en/copilot/responsible-use/chat
      - label: Data retention / training
        value: >-
          Up to 100 recent conversations, messages kept 28 days — changing to retention for the life of the
          account no earlier than 2026-09-28; Business and Enterprise data is not used for training.
        url: >-
          https://docs.github.com/en/copilot/how-tos/copilot-on-github/chat-with-copilot/chat-in-github
      - label: Docs index
        value: "Copilot Chat concepts and Spaces."
        url: https://docs.github.com/en/copilot/concepts/chat
    items:
      - title: Policies that reach chat on github.com
        body:
          - "Copilot in GitHub.com (feature toggle; opt-in preview features and feedback collection hang off
            it), Copilot can search the web, Configure models and Configure custom models, content exclusion —
            all honoured by Chat in GitHub per the supported-surfaces table. MCP servers in Copilot, the
            registry restriction and Copilot Memory are not: chat's GitHub MCP server is fixed, and Memory is
            used by the cloud agent, code review, the CLI and agentic autofix. Across a user's organisations
            the least restrictive setting wins for most policies, including web search and Copilot in
            GitHub.com; public-code matching is among the exceptions that follow the most restrictive."
        links:
          - title: Supported surfaces for policies
            url: https://docs.github.com/en/copilot/reference/supported-surfaces-for-policies
          - title: Policy conflicts
            url: https://docs.github.com/en/copilot/reference/enterprise-administrators/policy-conflicts
      - title: The unified Copilot experience (no earlier than 2026-09-28)
        body:
          - "GitHub relaunches Copilot Chat on github.com, Chat in GitHub Mobile and the cloud agent as one
            experience under one policy, set under \"Copilot cloud agent (coming soon)\" in Copilot settings;
            chat retention becomes life-of-account, and administrators who opt out lose Copilot on github.com
            and Mobile for their users."
        links:
          - title: Upcoming changes to Copilot policies and billing
            url: >-
              https://github.blog/changelog/2026-08-28-upcoming-changes-to-github-copilot-policies-and-billing/
    riskNotes:
      - risk: riskPromptInjection
        note: >-
          CamoLeak (2025) turned hidden PR-description comments into silent exfiltration through GitHub's own
          Camo image proxy; the fix was to stop rendering images in chat. Chat still reads every issue and PR
          the user can see, and can now act through the GitHub MCP server.
      - risk: riskSensitiveDataDisclosure
        note: >-
          Retention moves from 28 days to life-of-account no earlier than 2026-09-28; Spaces accept uploads and
          free text that are then shareable to organisation members or publicly.
      - risk: riskExcessiveDataHandlingDuringInference
        note: >-
          Web search and image/PDF attachments widen the inference input beyond repository data; both are
          policy-controlled (web search) or user-controlled (attachments) rather than inspected.
      - risk: riskRetrievalVectorStorePoisoning
        note: >-
          Spaces and the repositories themselves are the retrieval stores (a repository is indexed
          automatically once a chat has its context); anyone with editor access to an organisation Space, or
          push access to a repository, can shape what the model reads.
    controls:
      - mitigation: D3-MFA
        coverage: native
        mechanism: >-
          GitHub's own second-factor requirement (Enterprise > Settings > Authentication security > "Require
          two-factor authentication for the enterprise and all of its organizations", optionally "Only allow
          secure two-factor methods"); with Enterprise Managed Users the IdP's MFA instead (OIDC with Entra ID
          Conditional Access)
        steps:
          - title: Require two-factor authentication for every organization
            body:
              - >-
                Enterprise > Settings > Authentication security: select "Require two-factor authentication for
                the enterprise and all of its organizations" and "Only allow secure two-factor methods"
                (passkeys, security keys, authenticator apps, GitHub Mobile); members without it cannot reach
                organization resources until they enable it.
            url: >-
              https://docs.github.com/en/enterprise-cloud@latest/admin/enforcing-policies/enforcing-policies-for-your-enterprise/enforcing-policies-for-security-settings-in-your-enterprise
          - title: With Enterprise Managed Users, put MFA in Entra ID
            body:
              - >-
                The 2FA policy is not available to managed users; use OIDC SSO so GitHub applies the Entra ID
                Conditional Access Policy, knowing GitHub enforces its IP conditions but MFA only at IdP
                sign-in.
            url: >-
              https://docs.github.com/en/enterprise-cloud@latest/admin/managing-iam/configuring-authentication-for-enterprise-managed-users/about-support-for-your-idps-conditional-access-policy
        note: >-
          Native by the D3-MFA rule applied to every vendor on this drawing: GitHub's identity layer requires a
          second factor for every organization member, enforced server-side, and the same account signs in to
          Chat on github.com and GitHub Mobile. Boundary: the requirement covers organization members, billing
          managers and outside collaborators; the page does not say whether it binds a user licensed directly by
          the enterprise (user or enterprise-team assignment) who belongs to no organization. It is unavailable
          under Enterprise Managed Users, where MFA is the IdP's and, per GitHub, enforced only at IdP sign-in
          (CAP IP conditions are re-checked on web use and token authentication, web-session protection in
          preview; device compliance is not enforced). What skips a fresh second factor: a signed-in session —
          SAML SSO re-authentication is every 24 hours unless the IdP sets otherwise, and the GitHub Mobile
          session lifetime is not documented on the pages fetched. A personal account is not an organization member, so personal-plan Copilot is outside
          the requirement; keeping people in the corporate account is the D3-OTF header's job.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityIga
          reviewRequired: false
          original:
            - capability: capabilityIga
              coverage: native
              mechanism: >-
                Copilot seat assignment (enterprise teams, IdP-synced under EMU), Copilot in GitHub.com
                policy, SAML SSO
              steps:
                - title: Assign seats and enable the feature
                  body:
                    - Grant licences from Enterprise > Billing and licensing > Licensing > Copilot (users,
                      enterprise teams or organisations); enable Copilot in GitHub.com under AI controls >
                      Copilot > Configure features & clients.
                  url: >-
                    https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-enterprise/manage-access/grant-access
                - title: Confirm the unified policy before 2026-09-28
                  body:
                    - Review the single policy replacing Copilot Chat on github.com, Chat in Mobile and the
                      cloud agent; opting out removes chat on github.com and Mobile.
                  url: >-
                    https://github.blog/changelog/2026-08-28-upcoming-changes-to-github-copilot-policies-and-billing/
              verified: 2026-09-10
      - mitigation: D3-APA
        coverage: partial
        mechanism: >-
          Copilot licences by user, enterprise team (IdP-synced under Enterprise Managed Users) or
          organization; enterprise Copilot policies set once or delegated to organizations (AI controls >
          Copilot > Configure features & clients); no connector apps of its own — OAuth app access restrictions
          and GitHub App installation are GitHub's target-tenant path for other products' GitHub connectors
        steps:
          - title: Assign licences by group
            body:
              - >-
                Enterprise > Billing and licensing > Licensing > Copilot > Manage > Enterprise Teams > Assign
                licenses; with Enterprise Managed Users sync the team to an IdP group so joining or leaving the
                group grants or removes Copilot.
            url: >-
              https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-enterprise/manage-access/grant-access
          - title: Set feature policies at enterprise level
            body:
              - >-
                Enterprise > AI controls > Copilot > Configure features & clients: enable or disable each policy
                for the enterprise instead of letting organizations decide, because a user seated by several
                organizations gets the least restrictive setting.
            url: >-
              https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-enterprise/manage-enterprise-policies
          - title: As the target tenant, gate other vendors' GitHub connectors
            body:
              - >-
                Keep OAuth app access restrictions enabled on each organization (the default for new
                organizations) and approve OAuth apps and GitHub App installations one by one, which decides
                whether another chat product's GitHub connector can reach organization data.
            url: >-
              https://docs.github.com/en/organizations/managing-oauth-access-to-your-organizations-data/about-oauth-app-access-restrictions
        note: >-
          Partial by the D3-APA rule on this drawing: GitHub administers group-based authorization over the chat
          feature (licences by user, enterprise team or organization; policies per enterprise or delegated per
          organization, enforced server-side), but Chat on github.com has no connector apps whose consent a
          target tenant grants — its one connector is GitHub's own MCP server acting within the user's
          permissions — and inside the product authorization is feature on/off per organization, not per group
          or per tool. The consent path GitHub does document runs the other way: as the target tenant for other
          vendors' GitHub connectors (OAuth app access restrictions, bypassed by privileged OAuth apps; GitHub
          App installation with selected repositories; fine-grained token approval) — the other products'
          control seen from their side. No documented setting lets an organization refuse Chat on github.com to
          someone licensed elsewhere who can read its repositories. Policy configuration is not the runtime
          decision; the decision is GitHub's server-side check of licence and policy on each request.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityIga
            - capabilityDataAccessGovernance
          reviewRequired: false
          original:
            - capability: capabilityIga
              coverage: native
              mechanism: >-
                Copilot seat assignment (enterprise teams, IdP-synced under EMU), Copilot in GitHub.com
                policy, SAML SSO
              steps:
                - title: Assign seats and enable the feature
                  body:
                    - Grant licences from Enterprise > Billing and licensing > Licensing > Copilot (users,
                      enterprise teams or organisations); enable Copilot in GitHub.com under AI controls >
                      Copilot > Configure features & clients.
                  url: >-
                    https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-enterprise/manage-access/grant-access
                - title: Confirm the unified policy before 2026-09-28
                  body:
                    - Review the single policy replacing Copilot Chat on github.com, Chat in Mobile and the
                      cloud agent; opting out removes chat on github.com and Mobile.
                  url: >-
                    https://github.blog/changelog/2026-08-28-upcoming-changes-to-github-copilot-policies-and-billing/
              verified: 2026-09-10
            - capability: capabilityDataAccessGovernance
              coverage: partial
              mechanism: >-
                Retrieval runs as the user; Space viewers only see sources they have access to; no remediation
                of over-shared repositories
              steps:
                - title: Rely on repository permissions and Space visibility
                  body:
                    - Organisation-owned Spaces grant admin / editor / viewer or No access; viewers only see
                      sources they can already access — fix repository over-sharing first.
                  url: https://docs.github.com/en/copilot/concepts/context/spaces
              note: >-
                Delegated: retrieval carries the user's own repository permissions, so an over-shared
                repository is retrievable by everyone who can already see it; nothing here narrows scope below
                the user's entitlements.
              verified: 2026-09-10
      - mitigation: D3-OTF
        coverage: partial
        mechanism: >-
          Enterprise access restrictions: the sec-GitHub-allowed-enterprise header, injected by the
          organisation's break-and-inspect proxy on github.com, api.github.com and *.githubcopilot.com, makes
          GitHub refuse accounts outside the enterprise (Enterprise Managed Users only); Copilot
          subscription-based network routing by plan endpoint; the web-search policy for GitHub's own egress
        steps:
          - title: Enable enterprise access restrictions
            body:
              - >-
                Enterprise > Settings > Authentication security > Enterprise access restrictions: select
                "Enable enterprise access restrictions" and copy the header value shown for the enterprise.
            url: >-
              https://docs.github.com/en/enterprise-cloud@latest/admin/configuring-settings/hardening-security-for-your-enterprise/restricting-access-to-githubcom-using-a-corporate-proxy
          - title: Inject the header at the proxy
            body:
              - >-
                Have the TLS-inspecting proxy overwrite sec-GitHub-allowed-enterprise: ENTERPRISE-ID (up to 20
                IDs) on all traffic to github.com/*, api.github.com/* and *.githubcopilot.com; other accounts get
                a 403 and the audit log records business.proxy_security_header_unsatisfied.
            url: >-
              https://docs.github.com/en/enterprise-cloud@latest/admin/configuring-settings/hardening-security-for-your-enterprise/restricting-access-to-githubcom-using-a-corporate-proxy
          - title: Route Copilot by plan
            body:
              - >-
                Allow *.business.githubcopilot.com and/or *.enterprise.githubcopilot.com and block
                *.individual.githubcopilot.com; GitHub lists Copilot Chat on GitHub and GitHub Mobile among the
                features this routing affects.
            url: >-
              https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-organization/manage-access/manage-network-access
          - title: Turn web search off where exfiltration risk matters
            body:
              - >-
                Set Copilot can search the web to disabled at enterprise level; it applies to Chat in GitHub,
                and across a user's organizations the least restrictive setting wins.
            url: https://docs.github.com/en/copilot/reference/supported-surfaces-for-policies
        note: >-
          Partial by the D3-OTF rule on this drawing: GitHub honours a documented tenant-restriction header that
          the organisation's proxy injects and enforces the block server-side (web sign-in, API and OAuth or
          GitHub App tokens, Copilot endpoints); the organisation's SSE does the injection. Boundary: Enterprise
          Managed Users only (data-residency enterprises are already separated by their GHE.com subdomain); it
          needs a break-and-inspect proxy on every path, so devices off the proxy are not covered. Enterprises
          with personal accounts have no header, only the plan-based endpoint routing, which blocks personal
          Copilot plans but not a personal GitHub account. A customer proxy does not control GitHub's own
          egress: web search queries go to Bing from GitHub's side, and a cloud agent session started from chat
          egresses from GitHub-hosted runners under its own firewall (toolCopilotCloudAgent); keeping web search
          off is the only chat-side lever.
        verified: "2026-09-25"
        migration:
          from:
            - capabilitySse
            - capabilityEgressControl
          reviewRequired: false
          original:
            - capability: capabilitySse
              coverage: external
              mechanism: No vendor feature; github.com chat traffic is ordinary HTTPS to github.com
              note: >-
                An SSE or CASB can only see the browser session; the model traffic originates from GitHub's
                side. Tenancy enforcement must rely on SSO and seat assignment.
              evidence:
                - title: Vendor docs index, reviewed for the integration point (2026-09-10)
                  url: https://docs.github.com/en/copilot/concepts/chat
              verified: 2026-09-10
            - capability: capabilityEgressControl
              coverage: partial
              mechanism: Web-search policy; image rendering disabled in chat (post-CamoLeak); GitHub MCP server limited to a
                fixed task set
              note: The model's reach is GitHub data plus web search; there is no domain allowlist for chat, and the
                vendor's remaining lever is to keep web search off.
              steps:
                - title: Turn web search off where exfiltration risk matters
                  body:
                    - Disable Copilot can search the web; it applies to IDEs and Chat in GitHub.
                  url: https://docs.github.com/en/copilot/reference/supported-surfaces-for-policies
              verified: 2026-09-10
      - mitigation: cap-sensitive-data-redaction
        coverage: external
        mechanism: >-
          No content inspection in the product; content exclusion (path filter) and the web-search policy are
          data minimisation; an SSE or browser security product inspecting the github.com and
          *.githubcopilot.com session is the integration point
        evidence:
          - title: Content exclusion for GitHub Copilot (website and Mobile support, public preview)
            url: >-
              https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/content-exclusion
          - title: Asking Copilot questions in GitHub (attachments on by default, no policy)
            url: >-
              https://docs.github.com/en/copilot/how-tos/copilot-on-github/chat-with-copilot/chat-in-github
          - title: Copilot network routing (plan endpoints an SSE can see)
            url: >-
              https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-organization/manage-access/manage-network-access
          - title: Audit log events for agents (Copilot API usage records, EMU and data residency, preview)
            url: https://docs.github.com/en/copilot/reference/enterprise-administrators/agentic-audit-log-events
        note: >-
          External by the rule applied to every vendor on this drawing: GitHub detects nothing in chat prompts,
          attachments, Space uploads or answers, offers no inline hook, and applies no sensitivity labels.
          Content exclusion (Enterprise > AI controls > Copilot > Content exclusion; public preview on the
          website and Mobile) keeps named paths out of Copilot's context, and the web-search policy limits what
          leaves in search queries — path and feature minimisation, not detection. Image and PDF attachments
          (JPEG, PNG, GIF, WEBP, PDF, HEIC, HEIF) are on for every plan with no policy to turn them off.
          Integration point: an SSE or browser security product that TLS-inspects the github.com and
          *.githubcopilot.com session and blocks pastes and uploads before they leave. Copilot Usage Records
          (request and response bodies, Enterprise Managed Users and data-residency enterprises, preview) would
          allow detection after the fact, but its documented client list does not name Chat on github.com.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAiDlp
            - capabilityBrowserDetectionResponse
          reviewRequired: false
          original:
            - capability: capabilityAiDlp
              coverage: partial
              mechanism: >-
                Content exclusion (honoured by Chat on GitHub and Mobile) and the web-search policy; no
                inspection of prompts or uploads
              steps:
                - title: Exclude sensitive paths at enterprise scope
                  body:
                    - 'Enterprise > AI controls > Copilot > Content exclusion: fnmatch patterns per repository or "*" — applied
                      to chat on the GitHub website and Mobile, not to third-party agents.'
                  url: >-
                    https://docs.github.com/en/copilot/how-tos/configure-content-exclusion/exclude-content-from-copilot
                - title: Decide on web search
                  body:
                    - Set Copilot can search the web at enterprise level; across a user's organisations it resolves to the least
                      restrictive organisation setting, so an enterprise-level lockdown is the only way to guarantee
                      it is off.
                  url: https://docs.github.com/en/copilot/reference/enterprise-administrators/policy-conflicts
              note: >-
                Content exclusion is a context filter on what the model may read; nothing inspects the prompt,
                the uploads or the answer for sensitive content.
              verified: 2026-09-10
            - capability: capabilityBrowserDetectionResponse
              coverage: external
              mechanism: No vendor feature; paste and upload controls belong to a browser security product
              note: Chat accepts JPEG, PNG, GIF, WEBP, PDF, HEIC and HEIF attachments; only a browser control can stop
                uploads of classified documents.
              evidence:
                - title: Vendor docs index, reviewed for the integration point (2026-09-10)
                  url: https://docs.github.com/en/copilot/concepts/chat
              verified: 2026-09-10
      - mitigation: cap-input-guardrails
        coverage: none
        mechanism: >-
          No documented screening of the content Chat on github.com reads; GitHub-side content filters on
          prompts and outputs cover harmful content, and image rendering was disabled after CamoLeak
        evidence:
          - title: Application card — Copilot Chat (content filtering; context sources on GitHub.com)
            url: https://docs.github.com/en/copilot/responsible-use/chat
          - title: Risks and mitigations (hidden-character filtering is for the cloud agent)
            url: >-
              https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/risks-and-mitigations
          - title: CamoLeak write-up (image rendering disabled in Copilot Chat, 2025-08-14)
            url: >-
              https://www.legitsecurity.com/blog/camoleak-critical-github-copilot-vulnerability-leaks-private-source-code
        note: >-
          None by the input-screening rule on this drawing: GitHub documents no injection screening of the
          repository files, issues, pull requests, Space sources, attachments or web results that Chat on
          github.com reads, nothing an administrator can switch on or tune, and no event. What exists is
          adjacent: prompts and outputs pass GitHub's content filters for harmful, offensive or off-topic
          content (a harm filter, not injection classification); hidden characters and HTML comments are
          filtered only before input reaches the Copilot cloud agent; and disabling image rendering in chat on
          2025-08-14 closed the CamoLeak exfiltration channel on the output side. No product class can sit on
          GitHub's internal retrieval path. What stands in: web search off, the Allow confirmation and rulesets
          for writes, and GitHub's defences questioned in the vendor assessment.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityPromptInjectionDefense
          reviewRequired: false
          original:
            - capability: capabilityPromptInjectionDefense
              coverage: partial
              mechanism: >-
                Vendor-side mitigations (image rendering disabled after CamoLeak; hidden-character filtering
                for agent hand-offs); no customer configuration
              steps:
                - title: Know what the vendor changed
                  body:
                    - Image rendering in Copilot Chat was disabled on 2025-08-14 to close the Camo exfiltration channel; hidden
                      HTML comments in issues and PRs are filtered before agent prompts.
                  url: >-
                    https://www.legitsecurity.com/blog/camoleak-critical-github-copilot-vulnerability-leaks-private-source-code
              note: >-
                Vendor-operated mitigations on specific input paths (rendered images, hidden characters in
                hand-offs); nothing the customer can tune, and repository content the chat reads is not
                classified.
              verified: 2026-09-10
      - mitigation: cap-ai-vendor-assessment
        coverage: external
        mechanism: >-
          No product feature; the organisation's TPRM platform assesses GitHub from the GitHub Copilot Trust
          Center artefacts and the per-provider model-hosting terms
        evidence:
          - title: GitHub Copilot Trust Center (compliance list and resources, checked 2026-09-25)
            url: https://copilot.github.trust.page/
          - title: Hosting of models for GitHub Copilot (per-provider training and retention terms)
            url: https://docs.github.com/en/copilot/reference/ai-models/model-hosting
          - title: Application card — Copilot Chat (Bing web search under Microsoft's privacy statement)
            url: https://docs.github.com/en/copilot/responsible-use/chat
        note: >-
          External by rule: the assessment belongs to the organisation's TPRM platform. The GitHub Copilot Trust
          Center overview lists SOC 1, SOC 2, SOC 3, ISO 27001:2013, CSA STAR Level 2, TISAX and ISO/IEC
          42001:2023, with SOC 1 Type 2 and SOC 2 Type 2 reports, a SOC 3 report, bridge letters, the 2026
          ISO/IEC 42001 certificate, a 2026 CAIQ, a PCI DSS attestation and bug-bounty letters, most behind
          Request access; the overview shows no penetration-test summary. The model-hosting page names the
          processors chat can route to — OpenAI (OpenAI and GitHub's Azure), Anthropic (Amazon Bedrock,
          Anthropic, Google Cloud; Claude Fable 5 and 5.1 retained by Anthropic by default unless a ZDR
          exemption is granted), Google, xAI, Microsoft (Azure AI Foundry) and Moonshot models on Foundry or
          Fireworks — and web search sends queries to Bing. Re-assess when the unified experience launches (no
          earlier than 2026-09-28: one policy, life-of-account chat retention). Policy state in the UI and the
          audit log are the read points a TPRM or SSPM tool can use.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAiTprm
            - capabilityAiGovernancePlatform
            - capabilityVendorAssurance
          reviewRequired: false
