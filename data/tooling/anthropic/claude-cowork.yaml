                capability on Enterprise); members can view, edit and delete entries.
            url: >-
              https://support.claude.com/en/articles/11817273-use-claude-s-chat-search-and-memory-to-build-on-previous-context
          - title: Lock instruction sources to reviewed skills and plugins
