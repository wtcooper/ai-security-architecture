              verified: 2026-09-10
      - mitigation: AML.M0029
        coverage: partial
        mechanism: >-
          Channel sessions run in auto mode: Claude's permission checker (a model) reviews each action and Owners
          pre-approve actions per scope with Auto mode allow rules; no per-action human prompt. Personal-connector
          tasks ask the requester before starting and, under Allow with review or the Enterprise Require human
          review of every message switch, hold each result for approval before it posts; Claude's pull requests
          wait for a human merge
        steps:
          - title: Keep allow rules narrow
            body:
              - >-
                Add Auto mode allow rules only on the narrowest scope (scope > Advanced > Auto mode allow rules)
                and name the tool, action and environment; rules on a workspace or the Slack page reach every
                channel beneath.
            url: https://claude.com/docs/claude-tag/admins/customize
          - title: Require review of every personal-connector result (Enterprise)
            body:
              - >-
                Turn on Require human review of every message in the Personal connectors dialog at
                claude.ai/admin-settings/claude-tag so the requester approves every result before it posts.
            url: https://claude.com/docs/claude-tag/concepts/personal-connectors
          - title: Require a second approval on Claude's pull requests
            body:
              - >-
                Require two approving reviews, or a status check only claude[bot] pull requests must pass, with
                stale approvals dismissed on new commits.
            url: https://claude.com/docs/claude-tag/admins/configure-github
          - title: Stop proactive work where it is not wanted
            body:
              - >-
                Turn off a channel's Respond automatically setting so Claude only starts work when tagged.
            url: https://claude.com/docs/claude-tag/admins/customize
        note: >-
          Partial by the rule: no person approves an individual channel action; the permission checker is a model
          and never counts as human approval, and allow rules pre-approve actions with nobody present. Result
          review approves what posts to the channel, and a pull-request merge approves the output, not the
          actions taken to produce them. Guests can never approve. Routines and channel watches run unattended.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityHitlControls
          reviewRequired: false
          original:
            - capability: capabilityHitlControls
              coverage: partial
              mechanism: >-
                Sessions run in auto mode (classifier); Owners add narrow auto-mode allow rules per scope;
                pull requests are drafts for humans to merge; "Respond automatically" per channel
              steps:
                - title: Keep allow rules narrow
                  body:
                    - Add auto-mode allow rules only on the narrowest scope (up to 50 per scope, 1,024
                      characters each) and name the tool, action and environment; everything else stays under
                      the classifier.
                  url: https://claude.com/docs/claude-tag/admins/customize
                - title: Stop proactive work where it is not wanted
                  body:
                    - Turn off a channel's Respond automatically setting so Claude only works when tagged;
                      proactive sessions bill under Proactive.
                  url: https://claude.com/docs/claude-tag/admins/set-spend-limit
              note: >-
                There is no per-action approval prompt in a channel; the classifier and deny-by-egress are the
                gates.
              verified: 2026-09-10
      - mitigation: D3-DI
        coverage: external
        mechanism: >-
          No inventory or classification setting: each scope's page on the Channels tab lists the Connectors,
          Repositories and Plugins a channel gets, with origin lines, and the Activity page Memory tab (or a
          scope's View memory files) shows what Claude saved, as read-only views; what sits behind each service
          account is classified by the organisation's DSPM
        evidence:
          - title: Configure per-channel access (Check or remove what a place has)
            url: https://claude.com/docs/claude-tag/admins/attach-to-scope
          - title: Review what Claude Tag has done (Activity page Memory tab)
            url: https://claude.com/docs/claude-tag/admins/audit
          - title: Data lifecycle and deletion (transcripts not in data exports or the Compliance API)
            url: https://claude.com/docs/claude-tag/concepts/data-lifecycle
        note: >-
          External, lowered from partial on 2026-10-30 when the settings table was written: no Claude Tag setting
          delivers data inventory. The per-scope access lists and memory views are pages an Owner reads, not a
          control an administrator switches on, and they carry no classification or oversharing view of the
          drives, projects or repositories behind each service account. Transcripts are kept with no automatic
          retention period during the beta and are excluded from data exports and the Compliance API, so no
          DSPM product can consume them; deletion (scope removal, workspace disconnect) is lifecycle, not
          inventory. Inventory and classification of the sources behind the connections is the organisation's
          DSPM.
        verified: "2026-10-30"
        migration:
          from:
            - capabilityDspm
          reviewRequired: false
          original:
            - capability: capabilityDspm
              coverage: partial
              mechanism: >-
                Memory files viewable, editable and deletable per scope by Owners; data lifecycle table for
                every deletion action; no retention window during beta
              steps:
                - title: Review and prune memory
                  body:
                    - Open a scope's View memory files (or the Audit page Memory tab) to read, edit or delete
                      what Claude saved; workspace memory from public channels is shared workspace-wide.
                  url: https://claude.com/docs/claude-tag/users/memory
                - title: Delete data deliberately
                  body:
                    - Removing a channel scope deletes its sessions, memory, routines and artifacts;
                      disconnecting the workspace deletes everything for that workspace; version Off deletes
                      nothing.
                  url: https://claude.com/docs/claude-tag/concepts/data-lifecycle
              note: >-
                Memory review and deletion are lifecycle controls; nothing classifies what was saved or
                assesses who can read it beyond the scope model, so discovery and posture assessment remain
                the customer's DSPM.
              verified: 2026-09-10
      - mitigation: D3-CH
        coverage: native
        mechanism: >-
          Connector credentials (on the Connectors tab, or held by a bundle) sit in a write-only store and Agent
          Proxy injects them at the network boundary, only to the credential's allowed websites (narrowable by
          path and HTTP method), so neither the sandbox nor the model holds them; Rotate secret and Remove
          credential per credential; "Copy setup link for another admin" with approval on the Notifications
          Requests tab; Federated agent access replaces stored secrets with 10-minute Anthropic-signed tokens; no
          tunnel
        steps:
          - title: Store credentials only as connections
            body:
              - >-
                On the Connectors tab add each service with its Allowed websites, then Edit the credential in the
                connector's Access from table to restrict it to a path prefix and read-only methods; never put a
                credential in an environment variable.
            url: https://claude.com/docs/claude-tag/admins/add-connections
          - title: Rotate or remove a credential
            body:
              - >-
                Use Rotate secret or Remove credential from the row's menu in the connector's Access from table;
                have the secret's owner submit it through Copy setup link for another admin and approve it with
                Review on the Approval needed row of the Notifications Requests tab.
            url: https://claude.com/docs/claude-tag/admins/add-connections
          - title: Replace stored keys with federated tokens
            body:
              - >-
                Connect your gateway, AWS role, Google Cloud identity or authorisation server under Federated
                agent access so Claude presents a short-lived signed token and Anthropic stores no key.
            url: https://claude.com/docs/claude-tag/admins/federated-access/overview
        note: >-
          Native by the rule: custody is outside the sandbox and model, each credential is scoped to named hosts
          and methods, the administrator rotates or revokes it in the console, and lifetime is bounded where the
          target accepts federated tokens. Boundaries: static SaaS keys are long-lived until rotated (no expiry or
          rotation schedule in the product); environment variables on a scope's pinned cloud environment are
          readable by every session and by Claude, which is why the docs say credentials never go there; running
          sessions may keep a revoked credential for a short, unbounded window. Tunnel: none; a connected service
          must accept internet traffic from Anthropic's egress range 160.79.104.0/21 (PrivateLink and VPC
          peering unsupported), and sessions in self-hosted environments can't use the connectors an admin adds.
        verified: "2026-09-25"
        migration:
          from:
            - capabilitySecretsManagement
          reviewRequired: false
          original:
            - capability: capabilitySecretsManagement
              coverage: native
              mechanism: >-
                Access bundle credentials (Bearer, Basic, AWS SigV4, GCP service account, OAuth client
                credentials, MCP Connector sign-in) injected by Agent Proxy; rotate secret and setup links for
                another admin to submit a secret
              steps:
                - title: Add and rotate credentials in bundles
                  body:
                    - On the bundle's Credentials tab connect each service, set Allowed hosts, restrict by
                      HTTP method or path, and use Rotate secret; use "Copy link for another admin" so the
                      secret owner submits it directly.
                  url: https://claude.com/docs/claude-tag/admins/add-connections
              note: >-
                Bundle credentials are injected at the proxy and never reach the sandbox or the model. They
                are the bundle's shared credentials, presented for every session in the scope, not
                per-requester; rotation is manual through the rotate flow.
              verified: 2026-09-10
      - mitigation: AML.M0028
        coverage: native
        mechanism: >-
          Per-scope bundles (the Slack page, a workspace, a channel) that only Owners and Claude Tag admins, or a
          channel's managers for its own bundle, fill with connectors, domains, repositories and plugins; each
          credential limited to allowed websites, a path prefix and HTTP methods; Agent Proxy blocks every other host; Channel only strips
          inherited access while a guest is present
        steps:
          - title: Attach access per channel
            body:
              - >-
                Create bundles such as data-readonly or github-write and attach each to the narrowest scope that
                needs it, keeping sensitive bundles on private channels only.
            url: https://claude.com/docs/claude-tag/admins/attach-to-scope
          - title: Narrow each connection to read where reading is enough
            body:
              - >-
                In the connector's Access from table (or under What's in it on the bundle's page) choose Edit on
                a credential and restrict it to specific hosts, a path prefix and GET-only methods.
            url: https://claude.com/docs/claude-tag/admins/add-connections
          - title: Confirm what a channel ends up with
            body:
              - >-
                Open the channel's page from the Channels tab under Claude's access and check its Claude's access
                table, which shows what it inherits.
            url: https://claude.com/docs/claude-tag/concepts/security-and-data
        note: >-
          Native by the rule: an administrator allowlist of connections with read/write (method) scoping per
          channel scope, locked against channel members and enforced by Agent Proxy outside the model. Boundaries:
          scoping is per channel or workspace, not per requesting person, so everyone in a scope gets the same
          reach; an MCP Connector connection is one endpoint, so path and method rules cannot pick its individual
          tools; a bundle on the Slack page reaches every channel; auto-mode allow rules pre-approve actions; DMs
          and personal-connector tasks use the member's claude.ai connectors, outside the bundles.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityToolPermissionScoping
          reviewRequired: false
          original:
            - capability: capabilityToolPermissionScoping
              coverage: native
              mechanism: >-
                Per-scope Access bundles (credentials, repositories, plugins, instructions) with inheritance
                from Default Slack to workspace to channel; connection host/path/method restrictions; plugin
                enable toggles per bundle
              steps:
                - title: Compose access by capability and channel
                  body:
                    - Create bundles such as data-readonly, github-write and monitoring, attach only what a
                      channel needs, and keep sensitive bundles on private channels.
                  url: https://claude.com/docs/claude-tag/admins/add-connections
                - title: Narrow each connection
                  body:
                    - Edit a connection to restrict it to specific hosts, a path prefix and read-only methods,
                      and scope the underlying service account to the projects it needs.
                  url: https://claude.com/docs/claude-tag/admins/add-connections
              note: >-
                Bundles decide which credentials, repositories and plugins a scope has (hiding); host, path
                and method restrictions on connections limit arguments; auto-mode allow rules pre-approve.
                Inheritance means a broad Default Slack bundle reaches every channel unless overridden.
              verified: 2026-09-10
      - mitigation: cap-data-access-governance
        coverage: partial
        mechanism: >-
          In channels, retrieval uses the service account's access, scoped by what the organisation shares with
          that account and by the connection's hosts and paths; "Channels Claude can search" narrows Slack search
          to channels Claude is in; guest channels lose workspace search; DMs and personal-connector tasks run
          with the member's own permissions
        steps:
          - title: Scope the service account, not just the connection
            body:
              - >-
                Share only the folders, spaces or projects Claude should see with its dedicated account; host and
                path rules limit endpoints, not records.
            url: https://claude.com/docs/claude-tag/admins/add-connections
          - title: Limit Slack search to channels Claude is in
            body:
              - >-
                At claude.ai/admin-settings/claude-tag > Claude's access > Channels > the Slack page (or a workspace
                or channel) > Advanced set Channels Claude can search to Only channels Claude is in.
            url: https://claude.com/docs/claude-tag/admins/restrict-access
        note: >-
          Partial by the rule: the administrator scopes the corpus (what the service account can open, which
          Slack channels search covers), but channel retrieval does not carry the requester's entitlements —
          every member of a scope reaches what the account can, and by default Claude searches every public
          channel, including ones it has not been added to. Requester entitlements apply only in DMs and in
          personal-connector tasks, which are available to a limited number of organisations.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityDataAccessGovernance
          reviewRequired: false
          original:
            - capability: capabilityDataAccessGovernance
              coverage: partial
              mechanism: >-
                Reach inside a tool equals what the service account can access; account-level scoping is the
                control; DMs run as the user
              steps:
                - title: Scope the service account, not just the connection
                  body:
                    - Share only the folders, spaces or projects Claude should see with its dedicated account; host and path
                      rules limit endpoints, not records.
                  url: https://claude.com/docs/claude-tag/admins/add-connections
              note: >-
                Service-owned in channels: retrieval carries the service account's access, so every member of
                a scope reaches what that account can, regardless of their own entitlements. Delegated in DMs,
                which run as the member.
              verified: 2026-09-10
      - mitigation: cap-agent-tool-registry
        coverage: partial
        mechanism: >-
          The Connectors and Bundles tabs under Claude's access list every connector and bundle, each
          connector's credentials in its Access from table, and credentials submitted by setup link wait as
          Approval needed on the Notifications Requests tab; each scope's page lists what a channel gets; the
          Activity page Scheduled work tab lists every routine with Created by, Pause/Resume and Delete; a
          session can use only the bundles and connectors that apply to its scope
        steps:
          - title: Use the Connectors and Bundles tabs as the register
            body:
              - >-
                Review the Connectors and Bundles tabs, and approve or reject credentials a teammate submitted
                through a setup link on the Notifications Requests tab before they become active.
            url: https://claude.com/docs/claude-tag/admins/add-connections
          - title: Review unattended work
            body:
              - >-
                On the Scheduled work tab at claude.ai/admin-settings/claude-tag/audit filter by scope and pause
                or delete routines nobody owns.
            url: https://claude.com/docs/claude-tag/admins/audit
        note: >-
          Partial by the rule: connections are an enforced register with an approval state for link-submitted
          credentials, but they carry no owner field, and routines, which run unattended with the channel's
          credentials, are created by any channel member without approval and appear only after creation.
          Personal connectors used in DMs and channel tasks are the member's and are not listed; a Claude app
          installed in another Slack workspace is found in Slack's app management. Channel sessions act as an
          Owner-provisioned identity per tool — a dedicated service account, the Claude Slack or GitHub app, or a
          federated identity — so the register lists non-human principals rather than people's logins.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAgentRegistry
          reviewRequired: false
          original:
            - capability: capabilityAgentRegistry
              coverage: partial
              mechanism: >-
                Scopes and bundles are the registry of where Claude runs and with what; Scheduled work tab
                lists every routine with Created by
              steps:
                - title: List where Claude operates and what is scheduled
                  body:
                    - The Slack tab under Claude Tag's access lists workspaces and channels with their bundles; the Audit page
                      Scheduled work tab lists routines with pause and delete.
                  url: https://claude.com/docs/claude-tag/admins/audit
              note: >-
                Scopes, bundles and the routine list are approved configuration and use within Slack; there is
                no owner or approval record per routine beyond Created by.
              verified: 2026-09-10
      - mitigation: cap-shadow-ai-discovery
        coverage: external
        mechanism: >-
          Claude Tag lists no personal accounts or unsanctioned installs; Slack's app management (Manage apps,
          App requests), the claude.ai organisation's domain claiming and SSE/CASB find them; "Restrict to your
          verified domains" and blocked channel patterns prevent rather than discover
        evidence:
          - title: What the Claude Slack app can access (Slack administrator's view)
            url: https://claude.com/docs/claude-tag/admins/for-slack-admins
          - title: Restrict where Claude Tag operates
            url: https://claude.com/docs/claude-tag/admins/restrict-access
        note: >-
          External by the rule: the product has no view of Claude used outside the organisation's pairing — a
          workspace paired to another Claude organisation, personal claude.ai accounts, or members' own
          connectors. Slack administration (app installs and approval requests), the claude.ai organisation's
          Enterprise domain claiming (recorded on toolClaudeDesktop) and SSE/CASB find those. Inside the
          sanctioned deployment the Scheduled work tab inventories member-created routines, and Restrict to your
          verified domains stops verified-domain Slack users linking to outside organisations — prevention,
          credited here only.
        verified: "2026-09-25"
