              steps: *a1
              note: >-
                Detection is pattern-based and aimed at credentials; personal or business data in prompts to
                the model provider is not inspected — enforce that at the provider or a proxy in front of it.
              verified: 2026-09-10
      - mitigation: D3-MFA
        coverage: unknown
        mechanism: >-
          Gateway user allowlists and DM pairing in ~/.hermes/.env and config.yaml (default deny),
          username/password auth on a non-loopback dashboard, API_SERVER_KEY bearer on the API server; no MFA
          or IdP integration
        steps:
          - title: Keep the gateway on explicit allowlists
            body:
              - Set GATEWAY_ALLOWED_USERS and per-platform lists such as TELEGRAM_ALLOWED_USERS or
                DISCORD_ALLOWED_USERS in ~/.hermes/.env; with no allowlist configured every user is denied,
                and the docs say never to set GATEWAY_ALLOW_ALL_USERS=true on a machine you care about.
            url: https://hermes-agent.nousresearch.com/docs/user-guide/security
          - title: Approve new senders through DM pairing
            body:
              - "Leave unauthorized_dm_behavior: pair in config.yaml (or ignore to drop unknown DMs silently),
                approve codes with hermes pairing approve <platform> <code> and remove access with hermes
                pairing revoke <platform> <user-id>; codes expire after one hour and five failed approvals
                lock the platform for an hour."
            url: https://hermes-agent.nousresearch.com/docs/user-guide/security
          - title: Protect a remotely reachable dashboard
            body:
              - A dashboard bound off loopback fails closed unless HERMES_DASHBOARD_BASIC_AUTH_USERNAME,
                HERMES_DASHBOARD_BASIC_AUTH_PASSWORD and HERMES_DASHBOARD_BASIC_AUTH_SECRET are set in .env;
                --insecure no longer bypasses the gate.
            url: https://hermes-agent.nousresearch.com/docs/user-guide/features/web-dashboard
          - title: Key the OpenAI-compatible API server
            body:
              - Enable it only with API_SERVER_ENABLED=true and a strong API_SERVER_KEY in ~/.hermes/.env;
                every request must carry it as a bearer token and the server binds 127.0.0.1 by default.
            url: https://hermes-agent.nousresearch.com/docs/user-guide/features/api-server
        evidence: []
        note: >-
          Capability scope changed: reassess this function. Retained configuration and evidence describe the
          former capability, not verified coverage of every replacement.


