# On-premises data centre: the hosted patterns as run on infrastructure the organisation owns and
# operates itself. Nothing here is a provider's to run, and no product is the answer: each box names
# its role, and its options list the software that realistically plays it, open source and
# commercial, none ranked, each with the packs below it belongs to. The settings are those of that
# software, each tagged with the product it belongs to ("if you use X"); a row with no product
# applies whatever is chosen. An organisation records what it runs in data/org/products.yaml.
#
# Rows follow data/tooling/BASELINE.md, as the cloud files do: the setting as the project's own
# documentation names it, a url that resolved on its verified date, the baseline value, and the
# controls on the drawing it delivers. setVia "code" marks a control no product setting provides.
#
# 2026-11-21: temporalPayloadCodec no longer claims cap-sensitive-data-redaction, whose pin on the multi-agent
# workflow asks for sensitive data to be removed from the journal; the codec encrypts it. It delivers
# Encrypt Sensitive Information (AML.M0012) once that control is pinned on the workflow's state.
#
# 2026-11-24: the difference notes moved to where each belongs. A product's limit, edition or quirk
# is a watch note on its option (or on a hosting option's box) or its row's requires; a setting is a
# row (ten added, each checked on the vendor's page that day); an opinion is options in a box's note.
# What stays under differences is a change of shape on this platform's drawing, and its `change`
# says what to draw. Summaries, also-needed services and links name roles, with products as examples.
id: cloudOnPrem
name: On-premises data centre
short: On-premises
selfManaged: true
boundary: Enterprise data centre

notOffered:
  - architecture: archCloudManagedAgent
    why: "A managed agent service is run by a cloud provider. In your own data centre nobody runs the agent loop for you, so you build and host the agent yourself."
    instead: archChatAgent

# Technology packs: sets of products their vendor or project documents as working together,
# researched 2026-11-24. A platform pack fills most roles; an add-on replaces some roles of any
# platform pack. None is ranked. A pack's product for a box is the box's option that lists the pack.
packs:
  - id: upstreamOpenSource
    name: "Upstream open source on Kubernetes"
    kind: open
    scope: platform
    vendor: "Community projects (CNCF, Apache, Linux Foundation and others)"
    asOf: "2026-11"
    status: mixed
    summary: "The stack this mapping drew before it offered a choice: upstream Kubernetes with Envoy Gateway, Keycloak, LiteLLM, vLLM (optionally under KServe or llm-d), Temporal, Kafka, PostgreSQL, Valkey, Ceph Object Gateway, MLflow, Kubeflow Pipelines and Trainer, Harbor, Nexus or Pulp, agent-sandbox on gVisor or Kata, Vault or OpenBao, and Argo, GitLab and Backstage for the factory. Your platform team assembles, runs, patches and supports every piece."
    fits: "When a strong Kubernetes platform team wants no vendor licence or single-vendor dependency on the critical path, and accepts owning the integration, upgrades and support of every piece."
    compare:
      licence: "Open source per project (for example Temporal server and GitLab core MIT, Valkey BSD); LiteLLM is MIT with a paid Enterprise licence for some features such as JWT sign-in; Nexus Community Edition is free with usage caps; OpenBao and Pulp are open alternatives to Vault and Nexus."
      support: "Community support per project, or paid support bought separately where a project offers it (for example LiteLLM Enterprise, Sonatype, HashiCorp); nobody supports the whole stack."
      covers: "Every role in every pattern mapped on-premises, as this mapping drew them."
      bringYourOwn: "Hardware and GPUs, an HSM, the SIEM, release signing, the integration work between projects, and on-call ownership of each one."
      integration: "Pairwise only: each project documents its link to the next (LiteLLM to vLLM, Langfuse and SearXNG; vLLM on KServe and llm-d; Envoy Gateway, Argo CD and GitLab to Keycloak; agent-sandbox to gVisor or Kata)."
      effort: "Highest: roughly twenty components, each on its own release cycle, whose bill of materials, version compatibility and upgrades you own."
    integrations:
      - { between: ["LiteLLM Proxy", vLLM], what: "LiteLLM routes to a vLLM OpenAI-compatible server through its hosted_vllm provider", url: "https://docs.litellm.ai/docs/providers/vllm" }
      - { between: [vLLM, KServe], what: "vLLM runs under KServe's Hugging Face runtime or an LLMInferenceService built on llm-d", url: "https://docs.vllm.ai/en/latest/deployment/integrations/kserve.html" }
      - { between: [KServe, "llm-d"], what: "LLMInferenceService (v1alpha1) is built on llm-d for distributed and prefill/decode serving", url: "https://kserve.github.io/website/docs/model-serving/generative-inference/llmisvc/llmisvc-overview" }
      - { between: ["Kubeflow Pipelines", "Ceph Object Gateway"], what: "KFP stores artifacts on any S3 store; SeaweedFS is the default since 2.15", url: "https://www.kubeflow.org/docs/components/pipelines/operator-guides/configure-object-store/" }
      - { between: ["Kubeflow Trainer", "PyTorch, JAX and other runtimes"], what: "ClusterTrainingRuntimes owned by the platform team define how TrainJobs run", url: "https://trainer.kubeflow.org/en/latest/operator-guides/runtime.html" }
      - { between: ["agent-sandbox", "Kata Containers or gVisor"], what: "The Sandbox API is runtime-agnostic; isolation is chosen by RuntimeClass", url: "https://agent-sandbox.sigs.k8s.io/docs/" }
      - { between: [Inspect, Kubernetes], what: "The k8s_sandbox package runs Inspect evaluation sandboxes as pods", url: "https://k8s-sandbox.aisi.org.uk/" }
      - { between: ["Ceph Object Gateway", "OIDC provider"], what: "STS AssumeRoleWithWebIdentity gives a workload short-lived bucket credentials", url: "https://docs.ceph.com/en/latest/radosgw/STS/" }
      - { between: [LiteLLM, vLLM], what: "LiteLLM calls self-hosted vLLM models as hosted_vllm providers.", url: "https://docs.litellm.ai/docs/providers/vllm" }
      - { between: [LiteLLM, Keycloak], what: "LiteLLM exchanges the caller's token at an RFC 8693 endpoint, such as Keycloak's, for each MCP server.", url: "https://docs.litellm.ai/docs/mcp_obo_auth" }
      - { between: ["Envoy Gateway", Keycloak], what: "A SecurityPolicy with oidc signs users in at a Keycloak realm before traffic reaches the agent.", url: "https://gateway.envoyproxy.io/docs/tasks/security/oidc/" }
      - { between: [LiteLLM, Langfuse], what: "LiteLLM sends traces of model and tool calls to self-hosted Langfuse.", url: "https://docs.litellm.ai/docs/observability/langfuse_integration" }
      - { between: [LiteLLM, SearXNG], what: "SearXNG is one of LiteLLM's built-in search tool providers.", url: "https://docs.litellm.ai/docs/search/" }
      - { between: ["agent-sandbox", "gVisor / Kata Containers"], what: "Sandbox pods take a gVisor or Kata RuntimeClass for isolation.", url: "https://agent-sandbox.sigs.k8s.io/" }
      - { between: ["Argo Events", "Apache Kafka"], what: "A Kafka event source turns topic messages into triggered runs.", url: "https://argoproj.github.io/argo-events/eventsources/setup/kafka/" }
      - { between: ["HashiCorp Vault", Kubernetes], what: "The Vault Secrets Operator syncs secrets into Kubernetes Secrets for pods.", url: "https://developer.hashicorp.com/vault/docs/deploy/kubernetes/vso" }
      - { between: ["Argo CD", Keycloak], what: "Argo CD's docs configure Keycloak as its OIDC sign-in.", url: "https://argo-cd.readthedocs.io/en/stable/operator-manual/user-management/keycloak/" }
      - { between: [GitLab, Keycloak], what: "GitLab documents Keycloak as an OpenID Connect sign-in provider.", url: "https://docs.gitlab.com/administration/auth/oidc/" }
      - { between: [Harbor, Trivy], what: "Harbor scans images with Trivy before the cluster pulls them.", url: "https://goharbor.io/docs/2.16.0/administration/vulnerability-scanning/" }
      - { between: [Temporal, Kubernetes], what: "Temporal documents running Workers as Kubernetes deployments.", url: "https://docs.temporal.io/production-deployment/worker-deployments" }
    sources:
      - https://docs.litellm.ai/docs/proxy/virtual_keys
      - https://docs.litellm.ai/docs/proxy/token_auth
      - https://docs.vllm.ai/en/latest/serving/online_serving/
      - https://docs.vllm.ai/en/latest/deployment/integrations/kserve.html
      - https://kserve.github.io/website/docs/model-serving/generative-inference/llmisvc/llmisvc-overview
