id: archShadowAi
surface: surfaceSaas
title: Shadow AI services and extensions
abbrev: Shadow AI

summary:
  - >
    AI services in use that nobody sanctioned: consumer accounts on enterprise-grade tools,
    browser extensions with page access, and API keys expensed to a team card. You do not operate
    the vendor at all, so the target state drawn here is the discovery, brokering and DLP mesh
    around the unsanctioned use — not the use itself.

description:
  - >
    This architecture is drawn because the alternative is pretending it does not exist. Every
    other architecture in this catalogue assumes someone decided to build or buy it; this one
    assembles itself from individually reasonable choices — a person with a deadline, a free
    tier, and a browser. The diagram is the environment as discovered, with the mesh you build
    around it drawn as the target state.
  - >
    Three distinct paths carry data out, and they need different detection. A consumer account on
    a web service moves data through the browser under a personal login. A browser extension with
    host permissions reads pages continuously with no login at all. A direct API key on a
    corporate card moves data from a script or a server, never touches a browser, and shows up in
    expense data long before it shows up in network logs. Discovery is the whole control: there
    is no configuration to harden and no vendor to negotiate with, because the relationship was
    never formed — and the signals live in four systems owned by three different teams.
  - >
    The outcome that matters is not blocking. Blocking a service without a sanctioned equivalent
    moves the traffic somewhere harder to see. The productive path is discovery, then a
    sanctioned tenant of the same class of tool, then enforcement that makes the sanctioned path
    the easy one — which is why this architecture's natural terminus is the enterprise chat
    architecture, and why they are a pair.

distinguishedBy:
  - >
    Against the enterprise AI chat architecture: the same traffic, on the wrong side of every
    control. That one has a tenant, terms, an admin console and an audit export. This one has
    none, and the work is finding it rather than configuring it.
  - >
    Against every other architecture here: those describe systems someone designed. This one
    describes what is discovered, and it is the only diagram in the catalogue where the
    governance column is the architecture rather than a plane beside it.

exemplars:
  - name: Consumer accounts on enterprise tools
    note: >
      A personal login to the same vendor the organisation may already pay for, with consumer
      retention and training terms and no administrative visibility.
    asOf: "2026-08"
  - name: AI browser extensions
    note: >
      Extensions requesting host permissions across all sites, installed in one click and updated
      silently. They read pages continuously rather than when invoked.
    asOf: "2026-08"
  - name: Direct API keys on expense
    note: >
      A provider key paid for on a team card and used from a script or a server. Invisible to
      browser controls and usually the largest single data volume of the three paths.
    asOf: "2026-08"

blocks:
  - id: employee
    kind: actor
    title: Employee
    icon: person
    col: 0
    row: 1
    note: >
      Solving a real problem with the tool that was available. Treating this as misconduct rather
      than unmet demand pushes the next attempt somewhere harder to see.

  - id: extensionStore
    kind: external
    title: Extension distribution
    col: 1
    row: 0
    note: >
      Install and silent update for extensions holding page-read permissions — a supply chain
      with no enrolment step. The extension that was reviewed is not necessarily the extension
      that runs next week.

  - id: browser
    kind: service
    title: Browser & extensions
    col: 1
    row: 1
    note: >
      Carries two of the three paths — the consumer login and the extension — and is the single
      most valuable place to instrument on this diagram.
    items:
      - id: sessions
        label: Web sessions
        icon: globe
        note: Personal logins to AI services from a corporate device. The tenant they land in is a cookie, not a policy.
      - id: extension
        label: Installed extensions
        icon: plug
        note: Read pages whether or not they are being used. The permission grant was one click, and updates need none.

  - id: scripts
    kind: service
    title: Scripts & services
    col: 1
    row: 2
    note: >
      Code calling a provider directly — no browser, no login, no user identity, and frequently
      the largest volume of data leaving.
    items:
      - id: code
        label: Scripts & servers
        icon: code
        note: Server-to-server API traffic, invisible to every browser control on this diagram.
      - id: keys
        label: Unregistered keys
        icon: key
        note: Expensed, shared and long-lived. Expense data finds these months before network analysis does, which makes finance a security telemetry source.

  - id: sse
    kind: service
    title: Secure service edge
    col: 2
    row: 1
    note: >
      The vantage point that sees destinations for every path, and content where inspection
      terminates. The backstop when device controls are absent or bypassed.
    items:
      - id: inspection
        label: Inline inspection
        icon: shield
        note: Content visibility where TLS is terminated; destination visibility everywhere else.
      - id: allowlist
        label: Destination control
        icon: stop
        note: The containment instrument once discovery finds regulated data already in transit — blunt, and right at that point.

  - id: consumerService
    kind: external
    title: Consumer AI services
    col: 3
    row: 0
    note: >
      Reached with a personal login. Consumer retention and training terms apply, no contract
      governs anything sent, and no administrator can see the account exists.

  - id: providerApi
    kind: external
    title: Direct provider APIs
    col: 3
    row: 2
    note: >
      Model APIs reached with keys nobody registered. The highest-volume path and the least
      visible to anything watching browsers.

  - id: governance
    kind: governance
    title: Discovery & response
    col: 4
    row: 0
    rowSpan: 3
    note: >
      In this architecture the control plane is the architecture. Everything else on the diagram
      is what it is trying to find.
    items:
      - id: discovery
        label: Discovery correlation
        icon: search
        note: Network telemetry, browser inventory, identity logs and expense records — four signals in four systems, and no one of them sees all three paths.
      - id: inventory
        label: AI service inventory
        icon: doc
        note: What discovery found, triaged into sanction, replace or block. The artifact that turns a scan result into a programme.
      - id: sanctioned
        label: Sanctioned alternative
        icon: scale
        note: A supported tenant of the same class of tool. Drawn as a control because it is one — blocking without it relocates traffic rather than stopping it.
      - id: response
        label: Detection & response
        icon: eye
        note: What happens when discovery finds regulated data already moving — the part that is an incident rather than a policy conversation.

edges:
  - from: employee
    to: browser
    path: primary
    label: uses what is available
    note: The path of least resistance runs through whatever tool was reachable when the deadline hit.
  - from: extensionStore
    to: browser
    path: external
    label: install & silent update
    note: >
      One click grants page access across all sites, permanently — the broadest standing grant in
      this catalogue, and the least deliberated.
  - from: browser
    to: sse
    path: primary
    bidir: true
    note: >
      Consumer-login and extension traffic both leave this way. An unmanaged or personal device
      carries the same traffic with none of this visibility, which is why discovery cannot rely
      on the endpoint alone.
  - from: sse
    to: consumerService
    path: external
    label: personal-account traffic
    note: >
      Authenticated to the provider and anonymous to the organisation. Where inspection is absent
      this crossing simply succeeds, and no contract governs what happens next.
  - from: scripts
    to: providerApi
    path: external
    label: direct API traffic
    note: >
      Server to server, no browser, no user identity — invisible to every browser control drawn
      here, and often the largest volume of the three paths.
  - from: scripts
    to: sse
    path: secondary
    label: network telemetry
    note: Where server egress transits the edge, destination telemetry is the one signal this path gives up voluntarily.
  - from: governance
    to: sse
    path: governance
    bidir: true
    label: discovery signal / containment
    note: >
      Destination telemetry feeds discovery correlation, and containment flows back as
      destination policy once something regulated is found in transit.

pins:
  risks:
    - risk: riskShadowAndUnknownAgents
      at: scripts->providerApi
      note: >
        The least visible path — no browser, no login, no enrolment. This architecture is the
        risk drawn as a diagram, and this edge is its purest form.
    - risk: riskSensitiveDataDisclosure
      at: sse->consumerService
      note: Consumer retention and training terms apply to whatever is sent, and no relationship exists to negotiate anything better.
    - risk: riskExcessiveDataHandling
      at: sse->consumerService
      note: No scope, no grant, no minimisation — whatever the user pastes is what the service holds.
    - risk: riskInsecureIntegratedComponent
      at: extensionStore->browser
      note: Third-party code with page access, installed in one click and updated silently, with no assurance behind it because no relationship was ever formed.
    - risk: riskToolSourceProvenance
      at: extensionStore->browser
      note: Declared behaviour and shipped behaviour are separate facts, and the update channel can change the second without touching the first.
    - risk: riskSensitiveDataDisclosure
      at: browser
      note: An extension with host permissions reads every page — the exfiltration needs no prompt and no user action.
    - risk: riskEconomicDenialOfWallet
      at: scripts
      note: Unregistered keys have no budget ceiling anyone set; the first control to notice runaway spend is the corporate card statement.
    - risk: riskExcessiveDataHandlingDuringInference
      at: providerApi
      note: What the provider retains and trains on is governed by default consumer terms nobody read on the organisation's behalf.

  capabilities:
    - capability: capabilityShadowAiDiscovery
      at: governance
      note: >
        Correlate network telemetry, browser inventory, identity logs and expense records — the
        only signal set that covers all three paths, and the precondition for every other
        control.
    - capability: capabilitySse
      at: sse
      note: Destination visibility for every path and content visibility where inspection terminates — the backstop the endpoint cannot be.
    - capability: capabilityBrowserDetectionResponse
      at: browser
      note: Extension inventory and in-browser inspection — the only signal that finds an extension reading pages it was never invoked on.
    - capability: capabilityAiDlp
      at: browser->sse
      note: Content inspection on what leaves through the browser — prompts, pastes and page reads alike.
    - capability: capabilityEgressControl
      at: scripts->providerApi
      note: Destination allowlists on server egress — the only inline control that sees the no-browser path at all.
    - capability: capabilitySecretsManagement
      at: scripts
      note: Replace keys on cards with registered, brokered, expiring credentials so the direct-API path becomes governed rather than invisible.
    - capability: capabilityAiGateway
      at: scripts
      note: Route legitimate script and service API use through a governed gateway — the sanctioned path for the builders who created this traffic.
    - capability: capabilityAiGovernancePlatform
      at: governance
      note: Triage the inventory into sanction, replace or block, and stand up the sanctioned alternative — enforcement without it relocates traffic instead of reducing it.
    - capability: capabilityAiTprm
      at: sse->consumerService
      note: For services that stay, form the relationship discovery revealed was already in place — assessment, contract, tenant.
    - capability: capabilityAiDetectionResponse
      at: governance->sse
      note: Treat regulated data already in transit as an incident, with containment flowing back to the edge as destination policy.
    - capability: capabilityAuditLogging
      at: sse
      note: Keep the first-party traffic record — for these services it is the only audit trail that will ever exist.

scenarios:
  - title: Discovery finds the consumer account
    steps:
      - follow: employee->browser
        note: A personal login to an AI service, from a corporate device, solving a real problem.
      - follow: browser->sse
        note: Destination telemetry names the service even where content inspection is absent.
      - follow: sse->consumerService
        note: Until enforcement exists this crossing succeeds, under consumer terms, invisibly to any administrator.
      - follow: governance->sse
        note: Discovery correlates the traffic with identity logs; the inventory triages the service into sanction, replace or block.
  - title: The extension nobody invoked
    steps:
      - follow: extensionStore->browser
        note: One click grants page access across all sites; updates arrive silently thereafter.
      - follow: browser->sse
        note: Page content leaves attached to ordinary browsing — the traffic looks like the page loads it rides on.
      - follow: governance->sse
        note: Browser inventory, not network telemetry, is the signal that finds it — correlation is what turns two weak signals into one finding.
  - title: The key on the card
    steps:
      - follow: scripts->providerApi
        note: Server-to-server traffic on an expensed key — no browser control ever sees it.
      - follow: scripts->sse
        note: Where the route transits the edge, destination telemetry is the only voluntary signal; expense correlation usually finds the key first.
      - follow: governance->sse
        note: Once found, the key is registered or revoked, spend is capped, and the traffic moves to a brokered, governed path.

