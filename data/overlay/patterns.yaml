# What the pattern finder says about each pattern: one line on when it applies, in the
# reader's words, and the search words a reader might type that the pattern's own text does
# not contain. Keyed by architecture id; every architecture must have an entry.
#
# A pattern's URL slug is its file name under data/reference/architectures/; it is not authored
# here.
patterns:
  archCodingAgentThirdParty:
    useWhen: Your people run a vendor's coding or desktop agent (CLI, IDE extension or desktop app) on their own machines.
    keywords: [coding assistant, AI coding, IDE, CLI, developer tools, copilot, desktop app, vibe coding]
  archCodingAgentFirstParty:
    useWhen: Developers install an open-source coding agent and run it with their own model keys, with no vendor admin console behind it.
    keywords: [open source agent, bring your own key, BYOK, coding assistant, IDE, CLI]
  archAgenticBrowser:
    useWhen: People use an AI browser, or an AI extension in the browser they already have, that reads pages and clicks for them.
    keywords: [browser agent, AI browser, extension, computer use, web agent]
  archLocalInference:
    useWhen: Someone runs an open-weights model on their own laptop or workstation.
    keywords: [local model, local LLM, offline, on-device, open weights]
  archPersonalAgent:
    useWhen: Someone runs an always-on personal agent on their device that acts on messages and schedules while they are away.
    keywords: [autonomous agent, personal assistant, daemon, always-on, self-hosted agent]
  archEnterpriseAiChat:
    useWhen: You are rolling out a vendor's AI chat assistant to the workforce, connected to business data.
    keywords: [chatbot, assistant, workforce AI, M365, Microsoft 365, copilot, ChatGPT, Gemini, Claude, connectors, enterprise search]
  archHostedAgentSessions:
    useWhen: People hand a coding or desktop task to an agent that runs in the vendor's cloud and returns a result to review.
    keywords: [cloud agent, background agent, async coding, hosted coding agent, remote session]
  archLowCodeAgentBuilder:
    useWhen: Business or technical teams build their own agents in a vendor's low-code studio.
    keywords: [low-code, no-code, agent builder, citizen developer, copilot studio, automation]
  archManagedAgentRuntime:
    useWhen: Your application calls a provider-hosted agent through an API or SDK instead of running the agent loop itself.
    keywords: [agents API, managed agents, hosted harness, agent platform, SDK]
  archPersistentManagedAgents:
    useWhen: People set up a vendor-hosted agent that keeps its memory and logins and works across tasks on its own schedule.
    keywords: [always-on agent, long-running agent, digital worker, scheduled agent]
  archChatAgent:
    useWhen: You are building a chat assistant or copilot with tools, where a person is present for every turn.
    keywords: [chatbot, RAG, retrieval, copilot, assistant, conversational, customer service bot]
  archActionAgent:
    useWhen: You are building a single agent that runs a business process end to end, with no person between the decision and the effect.
    keywords: [automation, autonomous agent, workflow automation, straight-through processing]
  archAgentWorkflow:
    useWhen: You are building a system of several agents that plan, delegate and work over business records for longer than one request.
    keywords: [multi-agent, orchestration, subagents, agentic workflow, long-running]
  archAgentFederation:
    useWhen: Your agent has to work with agents run by another organisation or platform.
    keywords: [A2A, agent-to-agent, partner agents, cross-organisation, interoperability]
  archCloudManagedAgent:
    useWhen: Your cloud provider runs the agent loop for you as a service inside your own cloud account, and your application calls it.
    keywords: [Foundry, AgentCore, Agent Engine, Agent Runtime, managed agent, hosted agent, prompt agent, Azure AI Foundry, Bedrock agents, Vertex]
  archAgentSandbox:
    useWhen: You run a model's actions at scale in sandboxes, to train it with reinforcement learning or to evaluate what it does.
    keywords: [evals, evaluation, reinforcement learning, RL, red team, sandbox]
  archRemoteMcpServer:
    useWhen: You are publishing a tool server (MCP) for other people's agents to call.
    keywords: [MCP, tool server, API for agents, connector, OAuth]
  archSelfHostedInference:
    useWhen: You serve an open-weights model on infrastructure you operate.
    keywords: [model serving, GPU, open weights, LLM hosting, inference server, private model]
  archTrainingPipeline:
    useWhen: You train or fine-tune models and release them to a registry.
    keywords: [fine-tuning, training, MLOps, model registry, tuning]
