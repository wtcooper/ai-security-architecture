      - id: gke
        kind: cluster
        name: "Google Kubernetes Engine (GKE)"
        url: https://docs.cloud.google.com/architecture/choose-agentic-ai-architecture-components
        asOf: "2026-11"
        compare:
          runs: "Your MCP server runs as Pods of a Deployment on a GKE cluster in your project; you define and scale the workload and Google runs the control plane."
          patching: "Google upgrades the control plane; node auto-upgrade is on by default and cannot be turned off in Autopilot; you rebuild and roll out your server image."
          data: "Requests and tool results are processed in your Pods on your cluster's nodes; Pods are ephemeral, so anything kept goes to a store you attach."
          network: "A GKE Gateway exposes it through an internal or external Application Load Balancer; you add network policies and an egress path such as Secure Web Proxy."
          identity: "Pods use a Kubernetes ServiceAccount that Workload Identity Federation for GKE maps to IAM; Agent Registry also documents an Agent Identity annotation."
          accepts: "Any containerised MCP server, in any language or framework; the transport is whatever your container serves over HTTP behind the Gateway."
          workload: "GKE supports stateless and stateful applications; you set replicas, autoscaling, timeouts and any session routing on the Deployment and the Gateway."
          portability: "Kubernetes manifests and the image move to other Kubernetes clusters; GKE Gateway classes, Workload Identity bindings and add-ons are specific to Google Cloud."
          effort: "You manage the cluster: node configuration, networking, scaling and upgrades, plus the Gateway, policies and the server; Autopilot mode takes over the nodes."
          fits: "Google suggests GKE for complex systems that need granular control, or when you already run on GKE and want agent tools beside existing applications."
        sources:
          - https://docs.cloud.google.com/architecture/choose-agentic-ai-architecture-components
          - https://docs.cloud.google.com/agent-registry/register-mcp-servers
          - https://docs.cloud.google.com/kubernetes-engine/docs/concepts/gateway-api
          - https://docs.cloud.google.com/kubernetes-engine/docs/concepts/gke-and-cloud-run
          - https://docs.cloud.google.com/kubernetes-engine/docs/concepts/workload-identity
          - https://docs.cloud.google.com/kubernetes-engine/docs/how-to/node-auto-upgrades
          - https://docs.cloud.google.com/kubernetes-engine/docs/concepts/autopilot-overview
          - https://docs.cloud.google.com/kubernetes-engine/docs/how-to/ambient-agent-gateway
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/gateways/agent-gateway-overview
          - https://docs.cloud.google.com/apigee/docs/api-platform/architecture/southbound-networking-patterns-endpoints
          - https://docs.cloud.google.com/secret-manager/docs/secret-manager-managed-csi-component
          - https://docs.cloud.google.com/kubernetes-engine/ai-ml/agent-gateway
        summary: "The MCP server runs as a Deployment on a GKE cluster in your project, behind an internal GKE Gateway that Apigee reaches through a Private Service Connect endpoint attachment. Apigee remains the gateway and the authorization server. You now carry the cluster, node upgrades, the Gateway, network policy, the outbound path and secret mounting, which Cloud Run handled as service settings; in return Pods can hold sessions and long streams."
        bindings:
          - { block: service, service: "Your MCP server on GKE", note: "A Deployment behind an internal GKE Gateway; the label registry.gke.io/functional-type: MCP_SERVER lists it in Agent Registry.", url: https://docs.cloud.google.com/agent-registry/register-mcp-servers }
        dropSettings: [cloudRunServiceIdentity, secretManagerSecrets, swpEgress]
        addSettings: [workloadIdentityGke, gkeSwpExplicitProxy, gkeNetworkPolicy, gkeNodeServiceAccount, gkeSecretManagerAddOn]
        differences:
          - at: gateway->service
            text: "A GKE Service has no IAM invoker check like Cloud Run's, so nothing built in stops a caller inside the network from going round Apigee. Expose the server only on an internal Gateway, publish that through a Private Service Connect service attachment that Apigee reaches with an endpoint attachment, and restrict the Pods' ingress with network policy."
            url: https://docs.cloud.google.com/apigee/docs/api-platform/architecture/southbound-networking-patterns-endpoints
          - at: service
            text: "GKE auto-registers the server in Agent Registry only if its Deployment carries the registry.gke.io/functional-type: MCP_SERVER label; the modelcontextprotocol.info annotations let it discover the tools. Google's GKE guidance then governs MCP servers with Agent Gateway, a Preview feature whose ambient Layer 7 set-up is limited to us-central1 and europe-west1, not with Apigee."
            url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/ambient-agent-gateway
          - at: service->orgData
            text: "There is no per-service egress setting as on Cloud Run. What a Pod can reach is decided by the cluster: private nodes, network policies you write, and Secure Web Proxy used as an explicit proxy, which filters only clients that honour the proxy setting. Upstream credentials are mounted by the Secret Manager add-on, which is off until you enable it."
            url: https://docs.cloud.google.com/secret-manager/docs/secret-manager-managed-csi-component
        alsoNeeded:
          - service: "GKE Gateway (gke-l7-rilb, internal Application Load Balancer)"
            role: ingress
            why: "Gives the Pods the single internal entry point that the run.app address and ingress setting gave on Cloud Run."
            url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/gateway-api
          - service: "Private Service Connect service attachment and Apigee endpoint attachment"
            role: network
            why: "Apigee reaches a backend in your VPC privately through an endpoint attachment to a service attachment that you create."
            url: https://docs.cloud.google.com/apigee/docs/api-platform/architecture/southbound-networking-patterns-endpoints
          - service: "Workload Identity Federation for GKE"
            role: identity
            why: "Gives the server's Pods their own IAM principal in place of the Cloud Run service identity."
            url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/workload-identity
          - service: "Secret Manager add-on for GKE"
            role: secrets
            why: "Mounts Secret Manager secrets into Pods as volumes; Cloud Run did this with a secret reference."
            url: https://docs.cloud.google.com/secret-manager/docs/secret-manager-managed-csi-component
        quickstart:
          - title: "Register MCP servers"
            url: https://docs.cloud.google.com/agent-registry/register-mcp-servers
          - title: "About Gateway API"
            url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/gateway-api
          - title: "Southbound networking patterns"
            url: https://docs.cloud.google.com/apigee/docs/api-platform/architecture/southbound-networking-patterns-endpoints
      - id: apigeeMcp
        kind: managed
        name: "MCP in Apigee (MCP Discovery Proxy)"
        url: https://docs.cloud.google.com/apigee/docs/api-platform/apigee-mcp/apigee-mcp-overview
        asOf: "2026-11"
        compare:
          runs: "Apigee hosts the MCP endpoint behind an MCP Discovery Proxy; you run no MCP server, only the existing APIs that the generated tools call."
          patching: "Google runs and patches the MCP endpoint on Apigee; on Apigee hybrid the MCP data plane runs in your own cluster and you manage its Pods."
          data: "Apigee turns each tool call into a request to your API, which holds the data; Apigee Analytics records usage per tool for Apigee-hosted endpoints."
          network: "Clients reach /mcp on your Apigee environment group hostname over HTTPS; tool calls go to the API operations served on that same hostname."
          identity: "The endpoint supports OAuth 2.1 and OpenID Connect; an OAuthV2 policy and API products tie each client app to the tools it may list and call."
          accepts: "An OpenAPI 3.0.x description of existing APIs, each operation becoming a tool; tools only, with no resources or prompts and no SSE streams."
          workload: "Stateful MCP versions use initialize and Mcp-Session-Id; a stateless 2026-07-28 mode exists on Apigee but not hybrid; up to 1,000 tools per organisation."
          portability: "The tools come from your OpenAPI specification and your APIs, which you keep; the proxy, its policies and the API products are Apigee constructs."
          effort: "You maintain the OpenAPI specification, the proxy's policies, the API products and the underlying APIs; there is no server process to operate."
          fits: "Google presents it for exposing APIs you already manage in Apigee as tools, without installing or managing local or remote MCP servers."
        sources:
          - https://docs.cloud.google.com/apigee/docs/api-platform/apigee-mcp/apigee-mcp-overview
          - https://docs.cloud.google.com/apigee/docs/api-platform/apigee-mcp/apigee-mcp-quickstart
          - https://docs.cloud.google.com/apigee/docs/api-platform/apigee-mcp/manage-mcp-tool-access
          - https://docs.cloud.google.com/apigee/docs/api-platform/apigee-mcp/enable-mcp
          - https://docs.cloud.google.com/apigee/docs/apihub/register-mcp-apis
          - https://docs.cloud.google.com/architecture/choose-agentic-ai-architecture-components
        offers:
          - name: "MCP Discovery Proxy"
            what: "A proxy template that turns the operations of an OpenAPI 3.0.x specification into MCP tools served at the /mcp base path, with no MCP server to deploy."
            url: https://docs.cloud.google.com/apigee/docs/api-platform/apigee-mcp/apigee-mcp-quickstart
          - name: "MCP tool access with API products"
            what: "The ParsePayload policy reads the JSON-RPC operation so that API products, OAuthV2 or VerifyAPIKey and Quota policies apply per tool and filter tools/list responses."
            url: https://docs.cloud.google.com/apigee/docs/api-platform/apigee-mcp/manage-mcp-tool-access
          - name: "API hub registration"
            what: "API hub imports MCP proxies from the attached Apigee organisation, registers them with the MCP API style and parses their specifications into MCP tools."
            url: https://docs.cloud.google.com/apigee/docs/apihub/register-mcp-apis
          - name: "MCP in Apigee hybrid"
            what: "From Apigee hybrid 1.17.0 the MCP data plane runs inside your own Kubernetes cluster and supports the stateful protocol versions only."
            url: https://docs.cloud.google.com/apigee/docs/api-platform/apigee-mcp/enable-mcp
          - name: "Apigee Analytics for MCP"
            what: "For Apigee-hosted endpoints, Apigee Analytics separates MCP traffic from other API traffic and shows usage of each tool."
            url: https://docs.cloud.google.com/apigee/docs/api-platform/apigee-mcp/apigee-mcp-overview
    # <<< hosting options
    settings:
      - identityPlatformTenants
      - apigeeVerifyAccessToken
      - apigeeKeyApproval
      - apigeeMcpToolAccess
      - apigeeVerifyIam
      - cloudRunServiceIdentity
      - noTokenPassthrough
      - secretManagerSecrets
      - disableSaKeyCreation
      - apigeeRevokeTokens
      - tenantScoping
      - apigeeSpikeArrest
      - toolDefinitionPinning
      - appSecurityTesting
      - containerScanning
      - swpEgress
      - apigeeMessageLogging

  - architecture: archSelfHostedInference
    asOf: "2026-10"
    # >>> checked against the vendor's documentation
    verified: "2026-11-18"
    sources:
      consumers: https://docs.cloud.google.com/vpc/docs/private-service-connect
      gateway: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-gke-inference-gateway
      api: https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/serve-with-gke-inference-gateway
      runtime: https://docs.cloud.google.com/architecture/networking-for-ai-inference-gke
      storage: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/cloud-storage-fuse-csi-driver
      sources: https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/serve-gemma-gpu-vllm
      registry: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/model-registry/introduction
    differences:
      - at: gateway
        text: "The gateway is not one product. A regional internal load balancer runs GKE Inference Gateway and calls Apigee and Model Armor as side checks. The builder must attach both extensions and set them to block traffic when a check fails or times out."
        url: https://docs.cloud.google.com/architecture/networking-for-ai-inference-gke
      - at: gateway->api
        text: "Google's walkthrough has Apigee check API keys, not Google identities. On this callout path Apigee message logging is unsupported and one Apigee proxy handles all traffic. The builder must plan tenant identity, quotas and logging within those limits."
        url: https://docs.cloud.google.com/apigee/docs/api-platform/service-extensions/extension-processor-overview
      - at: api->runtime
        text: "The load balancer first asks an in-cluster endpoint picker which vLLM replica to use, then sends the request to that pod. The picker is an extra component in the path; network policy must let only the gateway and picker reach vLLM."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-gke-inference-gateway
      - at: sources->storage
        text: "Google's GKE tutorials have vLLM download weights directly from Hugging Face at start-up, using a token kept in the cluster. To match the drawing, the builder must add an intake job that copies vetted weights into the bucket and block Hugging Face from serving nodes."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/serve-with-gke-inference-gateway
      - at: registry->storage
        text: "Model Registry does not push weights into the bucket, and vLLM on GKE does not read its aliases. The registry only records a bucket path. The builder's promotion job must copy the weights and point the deployment at the aliased version."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/model-registry/import-model
      - at: storage->runtime
        text: "Mounting the bucket with Cloud Storage FUSE hands the pod whatever files are there; the mount does not check a digest or signature. The builder must add a start-up check before vLLM opens the weights and grant the pod read-only access."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/cloud-storage-fuse-csi-driver
      - at: runtime
        text: "Google's reference draws no outbound exit. GKE nodes with only internal addresses cannot reach the internet unless Cloud NAT is added. The builder should keep it that way and serve the vLLM image from a private registry."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/network-isolation
    alsoNeeded:
      - service: "Apigee instance and Apigee Operator for Kubernetes"
        role: other
        why: "The Apigee callout needs a same-region Apigee instance and the operator installed in the cluster."
        url: https://docs.cloud.google.com/apigee/docs/api-platform/apigee-kubernetes/apigee-apim-operator-overview
      - service: "Workload Identity Federation for GKE"
        role: identity
        why: "Gives vLLM pods a keyless identity to read the weights bucket; only named inside the bucket-access row."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/workload-identity
      - service: "Cloud KMS"
        role: keys
        why: "Customer-managed key for the weights bucket; in the component note but has no settings row."
        url: https://docs.cloud.google.com/storage/docs/encryption/customer-managed-keys
      - service: "Secret Manager"
        role: secrets
        why: "Holds the Hugging Face token for the intake job and other credentials, instead of plain cluster secrets."
        url: https://docs.cloud.google.com/secret-manager/docs/overview
      - service: "Artifact Registry"
        role: registry
        why: "Private home for the vLLM serving image; Settings cover only scanning of images."
        url: https://docs.cloud.google.com/artifact-registry/docs/overview
      - service: "Cloud NAT (only if egress is allowed)"
        role: network
        why: "Private nodes have no internet without NAT; decide explicitly whether any outbound path exists."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/network-isolation
      - service: "Cloud Logging (HTTP access logging through GCPBackendPolicy)"
        role: logging
        why: "Per-InferencePool access logs; replaces the Apigee MessageLogging row, which does not work on this path."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/customize-gke-inference-gateway-configurations
      - service: "Cloud Armor"
        role: ingress
        why: "Google's reference lists it as optional edge protection in front of the gateway."
        url: https://docs.cloud.google.com/architecture/networking-for-ai-inference-gke
      - service: "llm-d Endpoint Picker"
        role: other
        why: "Runs in the cluster and picks the replica for every request; needs its own network policy."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-gke-inference-gateway
    quickstart:
      - title: "Serve an LLM with GKE Inference Gateway"
        url: https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/serve-with-gke-inference-gateway
      - title: "Serve Gemma open models using GPUs on GKE with vLLM"
        url: https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/serve-gemma-gpu-vllm
    # <<< checked
    reference:
      - title: Networking for AI inference model serving on GKE
        url: https://docs.cloud.google.com/architecture/networking-for-ai-inference-gke
      - title: About GKE Inference Gateway
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-gke-inference-gateway
    summary:
      - >-
        An inference server (vLLM in Google's tutorial) on GKE GPU node pools behind GKE Inference
        Gateway, reached through a Private Service Connect endpoint, with Apigee called from the load
        balancer for authentication and quotas and Model Armor screening prompts and responses: the
        shape Google's reference draws. Weights live in a Cloud Storage bucket only the serving identity
        reads, and Agent Platform Model Registry's aliases say which version serves.
    bindings:
      - { block: consumers, service: Internal apps via Private Service Connect }
      - block: gateway
        service: "GKE Inference Gateway with Apigee"
        note: "Apigee's Extension Processor called through a Service Extensions traffic extension; Model Armor called from the same load balancer."
        options:
          - { name: "GKE Inference Gateway with Apigee", kind: commercial, url: "https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-gke-inference-gateway", note: "Model-aware routing by llm-d's endpoint picker; Apigee called through a Service Extension for keys and quotas.", packs: [googleCloudNative] }
          - { name: "GKE Inference Gateway with Model Armor", kind: commercial, url: "https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-gke-inference-gateway", note: "The same gateway without Apigee, with Model Armor or NVIDIA NeMo Guardrails as its security extension." }
          - { name: "agentgateway with the Inference Extension", kind: open, url: "https://gateway-api-inference-extension.sigs.k8s.io/implementations/gateways/", note: "A conformant Gateway API Inference Extension gateway that can run with llm-d; also an LLM, MCP and A2A gateway.", packs: [openSourceOnGke] }
          - { name: "LiteLLM Proxy on GKE or Cloud Run", kind: open, url: "https://docs.litellm.ai/docs/proxy/deploy/cloud/gcp", note: "Virtual keys, budgets and logs in front of the vLLM service; LiteLLM documents its GKE Helm layout." }
          - { name: "Kong AI Gateway", kind: commercial, url: "https://developer.konghq.com/ai-gateway/ai-providers/vllm/", note: "AI Gateway's vLLM provider in front of your model servers, from Konnect Dedicated Cloud Gateways or self-managed.", packs: [kongAiGateway] }
      - block: api
        service: "vLLM OpenAI-compatible server"
        builtWith: "vLLM"
        options:
          - { name: "vLLM OpenAI-compatible server", kind: open, url: "https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/serve-gemma-gpu-vllm", note: "The OpenAI-compatible server Google's GKE serving and Inference Gateway tutorials use.", packs: [googleCloudNative, openSourceOnGke] }
          - { name: "SGLang server", kind: open, url: "https://docs.sglang.io/", note: "High-throughput serving with RadixAttention and prefix caching, compatible with OpenAI APIs." }
          - { name: "NVIDIA NIM endpoint", kind: commercial, url: "https://docs.nvidia.com/nim/large-language-models/deployment/csp-deployment/google-cloud", note: "NVIDIA's container per model, serving on its OpenAI port; licensed as a runtime under NVIDIA AI Enterprise.", packs: [nvidiaNim] }
      - block: runtime
        service: "vLLM on GKE GPU node pools"
        note: "One InferencePool per model; multi-node replicas talk over the backend RDMA network."
        options:
          - { name: "vLLM on GKE GPU node pools", kind: open, url: "https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/serve-gemma-gpu-vllm", note: "One InferencePool per model; Google's tutorials also run vLLM on TPU Trillium.", packs: [googleCloudNative] }
          - { name: "llm-d with vLLM", kind: open, url: "https://llm-d.ai/", note: "llm-d 1.0's tested recipes for prefix-cache-aware and latency-predicted routing; GKE Inference Gateway is built on its router.", packs: [openSourceOnGke] }
          - { name: "SGLang on GKE", kind: open, url: "https://docs.sglang.io/", note: "Serving framework for language and multimodal models, run as your own Deployment; no Google GKE tutorial." }
          - { name: "NVIDIA NIM on GKE", kind: commercial, url: "https://docs.nvidia.com/nim/cloud/gke/overview", note: "From the Google Cloud Marketplace app or NVIDIA's Terraform and Helm; a vLLM or SGLang engine inside each image.", packs: [nvidiaNim] }
          - { name: "Ray Serve on the GKE Ray operator", kind: open, url: "https://docs.cloud.google.com/kubernetes-engine/docs/add-on/ray-on-gke/concepts/overview", note: "The KubeRay-based Ray operator Google recommends for Ray on GKE; Google's tutorials serve LLMs with Ray on GPUs and TPUs." }
      - block: storage
        service: "Cloud Storage (model weights bucket)"
        note: "Mounted read-only through Cloud Storage FUSE; CMEK keys in Cloud KMS."
        options:
          - { name: "Cloud Storage (model weights bucket)", kind: commercial, url: "https://docs.cloud.google.com/kubernetes-engine/docs/concepts/cloud-storage-fuse-csi-driver", note: "Mounted read-only through the Cloud Storage FUSE CSI driver.", packs: [googleCloudNative] }
          - { name: "Hyperdisk ML", kind: commercial, url: "https://docs.cloud.google.com/kubernetes-engine/docs/how-to/persistent-volumes/hyperdisk-ml", note: "Read-only-many volumes that Google says load weights up to 11.9 times faster than from a model registry." }
          - { name: "Managed Lustre", kind: commercial, url: "https://docs.cloud.google.com/managed-lustre/docs/overview", note: "Parallel file system built with DDN, mounted on GKE and synchronised from Cloud Storage." }
      - { block: sources, service: "Public model hubs (Hugging Face)" }
      - block: registry
        service: "Agent Platform Model Registry"
        options:
          - { name: "Agent Platform Model Registry", kind: commercial, url: "https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/model-registry/introduction", note: "Versions with aliases such as default say which model is ready for production.", packs: [googleCloudNative] }
          - { name: "MLflow Model Registry", kind: open, url: "https://mlflow.org/docs/latest/ml/model-registry/", note: "Self-run; MLflow's Google Cloud guide puts its server on Cloud Run with Cloud SQL and Cloud Storage.", packs: [openSourceOnGke] }
    # >>> hosting options (compared against the vendor's pages; one is the mapping itself)
    hosting:
      - id: gke
        kind: cluster
        name: "GKE with GKE Inference Gateway"
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-gke-inference-gateway
        asOf: "2026-11"
        mapped: true
        compare:
          runs: "You run the model server, such as vLLM, as Pods on GPU node pools in your cluster; GKE Inference Gateway, an extension of the GKE Gateway, routes requests to them."
          patching: "Google upgrades the control plane and, with node auto-upgrade, the nodes; you maintain the model server image and the gateway resources in the cluster."
          data: "Prompts and completions are processed on your cluster's nodes; weights sit in your own Cloud Storage bucket and are mounted into the Pods."
          network: "The gateway is a Google Cloud Application Load Balancer created from Gateway resources; private nodes and network policies are yours to configure."
          identity: "Pods run as Kubernetes ServiceAccounts that Workload Identity Federation for GKE maps to IAM; the nodes have a service account of their own."
          accepts: "Any model server image and weight format you package, vLLM among them; the gateway routes by the model name in OpenAI API requests."
          workload: "GPUs and TPUs on node pools you size; the Horizontal Pod Autoscaler scales on model server metrics, and nodes are billed until they are scaled down."
          portability: "Manifests and the model server image move to other Kubernetes clusters; GKE gateway classes and the Model Armor and Apigee integrations are Google-specific."
          effort: "You operate the cluster, GPU node pools, model server, autoscaling, gateway resources and upgrades, and are on call for all of them."
          fits: "Google's guidance picks GKE for deep control, portability, very large models or minimal latency, and cost control with Spot or flex-start VMs."
        sources:
          - https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-gke-inference-gateway
          - https://docs.cloud.google.com/kubernetes-engine/docs/concepts/machine-learning
          - https://docs.cloud.google.com/kubernetes-engine/docs/concepts/workload-identity
          - https://docs.cloud.google.com/kubernetes-engine/docs/how-to/node-auto-upgrades
          - https://docs.cloud.google.com/kubernetes-engine/docs/how-to/confidential-gke-nodes
          - https://docs.cloud.google.com/kubernetes-engine/docs/concepts/gke-and-cloud-run
      - id: agentPlatformEndpoints
        kind: runtime
        name: "Gemini Enterprise Agent Platform online inference endpoints (self-deployed models)"
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/open-models/choose-serving-option
        asOf: "2026-11"
        compare:
          runs: "You deploy a model and its serving container to an endpoint; Agent Platform provisions, runs and scales the serving nodes for that deployed model."
          patching: "Google manages the serving nodes and maintains its prebuilt serving containers; a custom container image, such as your own vLLM build, is yours to rebuild."
          data: "Prompts and completions are processed on the deployed model's nodes; creating a Model copies its artefacts into a Cloud Storage bucket that Agent Platform manages."
          network: "Dedicated public endpoints, or private ones over Private Service Connect; the service keeps Google-managed internet access unless a service perimeter blocks it."
          identity: "The container runs as a service account managed by Agent Platform that can only read the model artefacts, or as a custom service account set at deployment."
          accepts: "Model Garden one-click models, prebuilt vLLM, Hex-LLM, SGLang, TGI or TensorRT-LLM containers, custom containers, and custom weights (Preview)."
          workload: "You choose machine type and GPUs or TPUs per deployed model; replicas autoscale between a minimum and a maximum, and Scale To Zero is in Preview."
          portability: "A custom vLLM image and your weights move elsewhere; the Model and Endpoint resources, the rawPredict route and IAM-based access are specific to the platform."
          effort: "You operate the model version, container settings, replica limits and access to the endpoint; there is no cluster or node pool for you to run."
          fits: "Google suggests self-deployment for custom or fine-tuned weights, predictable high-volume traffic, hardware control and strict residency or compliance needs."
        sources:
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/open-models/choose-serving-option
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/model-garden/self-deployed-models
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/open-models/deploy-model-garden
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/open-models/deploy-custom-vllm
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/predictions/choose-endpoint-type
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/predictions/private-service-connect
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/predictions/autoscaling
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/predictions/configure-compute
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/predictions/custom-container-requirements
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/predictions/online-prediction-logging
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/general/custom-service-account
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/general/vpc-service-controls
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/general/deployment
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/model-registry/introduction
          - https://docs.cloud.google.com/model-armor/model-armor-vertex-integration
          - https://docs.cloud.google.com/apigee/docs/api-platform/reference/policies/sanitize-llm-response-policy
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/predictions/using-dedicated-endpoints
        summary: "vLLM runs in a serving container on a dedicated Agent Platform endpoint, reached privately over Private Service Connect, with Apigee in front as the gateway. Model Registry deploys the version directly and the endpoint splits traffic between versions. Google now carries nodes, GPU drivers, autoscaling and the load balancer. You give up GKE Inference Gateway routing, Kubernetes network policy and Confidential GKE Nodes, and must call Model Armor from Apigee."
        bindings:
          - { block: gateway, service: "Apigee model proxy with Model Armor policies", note: "No GKE Inference Gateway: Apigee fronts the endpoint and screens with the SanitizeUserPrompt and SanitizeModelResponse policies.", url: https://docs.cloud.google.com/apigee/docs/api-platform/reference/policies/sanitize-llm-response-policy }
          - { block: api, service: "vLLM OpenAI-compatible server on an endpoint", builtWith: "vLLM", note: "note: Called with a raw inference request (rawPredict); Google lists the Chat Completions API on dedicated endpoints for Model Garden deployments only.", url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/open-models/deploy-custom-vllm }
          - { block: runtime, service: "Agent Platform online inference endpoint (dedicated)", note: "A deployed model with its own machine type, GPUs and replica range; Agent Platform runs and scales the nodes.", url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/predictions/choose-endpoint-type }
          - { block: storage, service: "Cloud Storage bucket, copied by Agent Platform at upload", note: "Creating the Model copies the artefact directory to a bucket Agent Platform manages; the container reads the copy named in AIP_STORAGE_URI.", url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/predictions/custom-container-requirements }
        dropSettings: [modelArmorInferenceGateway, inferencePoolRollout, confidentialGpuNodes, gkeNetworkPolicy]
        addSettings: [apigeeSanitizeUserPrompt, apigeeSanitizeModelResponse, endpointPscPrivate, endpointTrafficSplit, endpointDedicatedResources, endpointServiceAccount, endpointAccessLogging]
        differences:
          - at: gateway
            text: "No gateway comes with an endpoint: any principal holding aiplatform.endpoints.predict can call it. To keep the drawing, put Apigee in front and grant that permission only to its service account. Model Armor's built-in integration covers only Gemini generateContent, so prompts and responses are screened by Apigee's SanitizeUserPrompt and SanitizeModelResponse policies."
            url: https://docs.cloud.google.com/model-armor/model-armor-vertex-integration
          - at: gateway->api
            text: "vLLM's server speaks the OpenAI protocol, not Agent Platform's request and response format, so Google's guide calls it with a raw inference request; dedicated endpoints list the Chat Completions API for Model Garden deployments only. Only dedicated endpoints stream and allow timeouts up to one hour; a shared public endpoint stops at 60 seconds and does not stream."
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/open-models/deploy-custom-vllm
          - at: registry->storage
            text: "Creating a Model copies the artefact directory into a bucket that Agent Platform manages, and the container reads that copy through AIP_STORAGE_URI, not your weights bucket. The copy cannot be changed; new weights mean a new Model. Signature and digest checks therefore run before upload and again in the container's start-up."
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/predictions/custom-container-requirements
          - at: runtime
            text: "The managed environment that hosts the endpoint keeps Google's default internet access unless the project is inside a VPC Service Controls perimeter, and a Private Service Connect endpoint gives the container no private route into your VPC. Dedicated public endpoints do not support VPC Service Controls, so use the private endpoint type."
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/general/vpc-service-controls
          - at: sources->storage
            text: "Google's custom vLLM guide lets the container download weights from Hugging Face when it is given an access token, and Model Garden deploys open models with one click. To match the drawing, upload vetted weights to your bucket, create the Model from that path and give the container no Hugging Face token."
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/open-models/deploy-custom-vllm
        alsoNeeded:
          - service: "Private Service Connect forwarding rule in the gateway's VPC"
            role: network
            why: "The private endpoint is reached through a forwarding rule you create in each consuming VPC."
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/predictions/private-service-connect
          - service: "Model Armor template"
            role: other
            why: "Called from Apigee's SanitizeUserPrompt and SanitizeModelResponse policies; the load balancer extension of the GKE mapping is gone."
            url: https://docs.cloud.google.com/apigee/docs/api-platform/reference/policies/sanitize-llm-response-policy
          - service: "VPC Service Controls perimeter"
            role: network
            why: "The only control that removes the serving environment's default internet access."
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/general/vpc-service-controls
        quickstart:
          - title: "Open models overview"
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/open-models/choose-serving-option
          - title: "Deploy open models with a custom vLLM container"
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/open-models/deploy-custom-vllm
          - title: "Use dedicated private endpoints based on Private Service Connect for online inference"
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/predictions/private-service-connect
      - id: cloudRun
        kind: runtime
        name: "Cloud Run with GPUs"
        url: https://docs.cloud.google.com/run/docs/configuring/services/gpu
        asOf: "2026-11"
        compare:
          runs: "Your model server container, for example vLLM or Ollama, runs as a Cloud Run service with one GPU per instance; Google runs the instances."
          patching: "Google manages the infrastructure and pre-installs the GPU drivers; you rebuild the serving image, which Google advises basing on maintained ML images."
          data: "Prompts and completions are processed in your service's instances; weights load at start from your Cloud Storage bucket, the container image or the internet."
          network: "Ingress settings and IAM gate callers; Google's stated way to load weights from Cloud Storage is Direct VPC egress with all traffic sent to the VPC."
          identity: "Each revision runs as the service account set as its service identity; if you set none it uses the Compute Engine default service account."
          accepts: "Whatever is in your container image or, with sandbox templates, in up to 10 other images; processes can add tools with apt, pip or npm; headless browsers are documented."
          workload: "One NVIDIA L4 (24 GB) or RTX PRO 6000 Blackwell (96 GB) per instance; instances scale to zero and start in about 5 seconds before the model loads."
          portability: "The same container image runs on GKE; the Cloud Run settings for GPU, concurrency, probes and volume mounts are rewritten as Kubernetes manifests there."
          effort: "You operate the image, model loading, concurrency and maximum instances, and manage GPU quota; there are no nodes or drivers for you to run."
          fits: "Google positions Cloud Run for containerised inference that can scale to zero, event-driven applications and serving smaller models cost-effectively."
        sources:
          - https://docs.cloud.google.com/run/docs/configuring/services/gpu
          - https://docs.cloud.google.com/run/docs/configuring/services/gpu-best-practices
          - https://docs.cloud.google.com/run/docs/run-gemma-on-cloud-run
          - https://docs.cloud.google.com/run/docs/tutorials/autoscale-vllm-with-gpu-metrics
          - https://docs.cloud.google.com/run/docs/securing/security
          - https://docs.cloud.google.com/run/docs/securing/ingress
          - https://docs.cloud.google.com/run/docs/configuring/services/service-identity
          - https://docs.cloud.google.com/run/docs/configuring/vpc-direct-vpc
          - https://docs.cloud.google.com/run/docs/configuring/execution-environments
          - https://docs.cloud.google.com/run/docs/configuring/services/cloud-storage-volume-mounts
          - https://docs.cloud.google.com/run/docs/rollouts-rollbacks-traffic-migration
          - https://docs.cloud.google.com/kubernetes-engine/docs/concepts/machine-learning
          - https://docs.cloud.google.com/kubernetes-engine/docs/concepts/gke-and-cloud-run
          - https://docs.cloud.google.com/apigee/docs/api-platform/reference/policies/sanitize-llm-response-policy
          - https://docs.cloud.google.com/run/docs/securing/service-identity
          - https://docs.cloud.google.com/run/docs/configuring/jobs/sandboxes
        summary: "vLLM runs as a Cloud Run service with one GPU per instance, loading weights from the Cloud Storage bucket at start, with Apigee in front as the gateway. Google carries the hosts, GPU drivers and scaling, down to zero when idle. You give up GKE Inference Gateway routing, multi-GPU and multi-node serving, Kubernetes network policy and Confidential GKE Nodes, and you add Direct VPC egress, ingress restriction and Model Armor calls from Apigee yourself."
        bindings:
          - { block: gateway, service: "Apigee model proxy with Model Armor policies", note: "No GKE Inference Gateway: Apigee calls the service with its own identity and screens with the two Model Armor policies.", url: https://docs.cloud.google.com/apigee/docs/api-platform/reference/policies/sanitize-llm-response-policy }
          - { block: api, service: "vLLM OpenAI-compatible server on Cloud Run", builtWith: "vLLM", note: "Google's guide serves Gemma through vLLM as an OpenAI API endpoint on the service's HTTPS address.", url: https://docs.cloud.google.com/run/docs/run-gemma-on-cloud-run }
          - { block: runtime, service: "vLLM on a Cloud Run service with a GPU", note: "One NVIDIA L4 or RTX PRO 6000 Blackwell per instance, instance-based billing, scaling to zero when idle.", url: https://docs.cloud.google.com/run/docs/configuring/services/gpu }
        dropSettings: [modelArmorInferenceGateway, inferencePoolRollout, confidentialGpuNodes, gkeNetworkPolicy]
        addSettings: [apigeeSanitizeUserPrompt, apigeeSanitizeModelResponse, cloudRunServiceIdentity, cloudRunIngress, cloudRunTrafficSplit, cloudRunDirectVpcFirewall, cloudRunGen2Isolation]
        differences:
          - at: runtime
            text: "An instance has exactly one GPU, an NVIDIA L4 with 24 GB or an RTX PRO 6000 Blackwell with 96 GB, in a short list of regions. There is no multi-GPU or multi-node serving, and the GPU pages describe no Confidential Computing option, so very large models and the confidential tier of the GKE mapping do not fit here."
            url: https://docs.cloud.google.com/run/docs/configuring/services/gpu
          - at: gateway->api
            text: "By default a service's run.app address and ingress setting let any resource on the internet reach it, subject to IAM. Set ingress to internal, disable the default URL and grant the Cloud Run Invoker role only to the gateway's service account, so that callers cannot go round Apigee."
            url: https://docs.cloud.google.com/run/docs/securing/ingress
          - at: storage->runtime
            text: "Weights are downloaded or mounted every time an instance starts, including each scale-out from zero. Google's guidance for loading them from Cloud Storage requires Direct VPC egress with all traffic plus Private Google Access. A Cloud Storage volume mount checks no digest or signature, so the start-up check stays the builder's own step."
            url: https://docs.cloud.google.com/run/docs/configuring/services/gpu-best-practices
          - at: registry->storage
            text: "Model Registry deploys to Agent Platform endpoints, not to Cloud Run, and Cloud Run does not read its aliases. The promotion job must copy the aliased version to the bucket path the service loads and roll out a new revision; Cloud Run traffic splitting between revisions then acts as the staged gate."
            url: https://docs.cloud.google.com/run/docs/rollouts-rollbacks-traffic-migration
          - at: gateway
            text: "Nothing here routes by model name or cache state as GKE Inference Gateway does. Cloud Run autoscales on CPU utilisation and concurrency by default; to scale on vLLM queue metrics you deploy the Cloud Run External Metrics Autoscaling service from Google's tutorial and run it yourself."
            url: https://docs.cloud.google.com/run/docs/tutorials/autoscale-vllm-with-gpu-metrics
        alsoNeeded:
          - service: "Direct VPC egress subnet with Private Google Access"
            role: network
            why: "Google's guidance for loading model weights from Cloud Storage; also the path on which outbound traffic can be limited."
            url: https://docs.cloud.google.com/run/docs/configuring/services/gpu-best-practices
          - service: "Model Armor template"
            role: other
            why: "Called from Apigee's SanitizeUserPrompt and SanitizeModelResponse policies; the load balancer extension of the GKE mapping is gone."
            url: https://docs.cloud.google.com/apigee/docs/api-platform/reference/policies/sanitize-llm-response-policy
          - service: "Cloud Run External Metrics Autoscaling (CREMA)"
            role: other
            why: "Optional autoscaler service that you deploy to scale on vLLM's own metrics."
            url: https://docs.cloud.google.com/run/docs/tutorials/autoscale-vllm-with-gpu-metrics
        quickstart:
          - title: "Run agents with Gemma 4 models on Cloud Run"
            url: https://docs.cloud.google.com/run/docs/run-gemma-on-cloud-run
          - title: "Best practices: AI inference on Cloud Run services with GPUs"
            url: https://docs.cloud.google.com/run/docs/configuring/services/gpu-best-practices
          - title: "Autoscale vLLM model serving with GPU metrics"
            url: https://docs.cloud.google.com/run/docs/tutorials/autoscale-vllm-with-gpu-metrics
      - id: modelGardenMaas
        kind: managed
        name: "Model Garden open models as Model as a Service (MaaS)"
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/open-models/use-maas
        asOf: "2026-11"
        compare:
          runs: "Google serves a curated list of open models as serverless managed APIs; you provision nothing and send requests to Agent Platform endpoints."
          patching: "Google operates and maintains the whole serving stack, including GPU or TPU provisioning, scaling and maintenance."
          data: "Prompts and responses go to Google's service and are not shared with third parties; data at rest stays in the selected region, processing location may vary."
          network: "Requests go to the Agent Platform API, reachable privately through Private Service Connect for Google APIs or Private Google Access; you control no outbound traffic."
          identity: "Callers authenticate with IAM and need the aiplatform.endpoints.predict permission, which the Agent Platform User role includes; no workload of yours runs."
          accepts: "Only the listed managed models, such as Llama 4, gpt-oss 120B, Gemma 4, DeepSeek and GLM, through the Chat Completions API; you cannot bring weights."
          workload: "Serverless pay-as-you-go on dynamic shared quota, streaming over server-sent events; Provisioned Throughput for open models is in Preview and covers only some models."
          portability: "Applications use the OpenAI chat completions format, so they can point at another endpoint that serves the same open model; nothing is deployed to move."
          effort: "You manage enabling models in Model Garden, IAM, quota and spend; there is no serving infrastructure to operate or be on call for."
          fits: "Google suggests MaaS for rapid prototyping, minimal operational overhead, variable or bursty traffic and standard models that need no customisation."
        sources:
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/open-models/use-maas
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/maas/use-open-models
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/maas/call-open-model-apis
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/maas/grant-access-open-models
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/open-models/choose-serving-option
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/standard-paygo
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/provisioned-throughput/overview
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/general/vpc-service-controls
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/provisioned-throughput/supported-models
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/maas/zaiorg/glm-52
        offers:
          - name: "Managed open models"
            what: "A curated list of open models is offered as serverless managed APIs: gpt-oss 120B and Llama 4 are GA, DeepSeek-V4.1-Flash and GLM 5.2 are in Preview and Gemma 4 26B A4B IT is Experimental."
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/maas/use-open-models
          - name: "Chat Completions API"
            what: "The models are called through the Agent Platform Chat Completions API in the OpenAI format, with optional streaming over server-sent events."
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/maas/call-open-model-apis
          - name: "Model enablement and access"
            what: "A model is enabled from its API Service model card in Model Garden; users need the Consumer Procurement Entitlement Manager and Agent Platform User roles."
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/maas/grant-access-open-models
          - name: "Context caching (Preview)"
            what: "Implicit context caching is on by default for some open models on pay-as-you-go traffic and discounts cached input tokens."
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/maas/use-open-models
    # <<< hosting options
    settings:
      - apigeeVerifyIam
      - apigeeSpikeArrest
