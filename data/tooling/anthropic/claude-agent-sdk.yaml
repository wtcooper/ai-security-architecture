      - mitigation: cap-agent-action-policy-enforcement
        coverage: native
        mechanism: >-
          Programmatic PreToolUse hooks (permissionDecision allow/deny/ask/defer) and deny rules run before
          every permission mode, including bypassPermissions; filesystem hooks from settings also apply
        steps: &a1
          - title: Gate every tool call in a hook
            body:
              - Register hooks.PreToolUse callbacks (with matcher patterns) that return permissionDecision "deny" or
                "ask"; hooks run first in the evaluation order and a deny holds even in bypassPermissions.
            url: https://code.claude.com/docs/en/agent-sdk/hooks
          - title: Add declarative deny rules
            body:
              - Pass disallowedTools (bare names remove the tool; Bash(rm *) scopes it) and, when the project source is
                enabled, permissions.deny in .claude/settings.json.
            url: https://code.claude.com/docs/en/agent-sdk/permissions
        note: >-
          The hook API is the enforcement point; the policy is code the application writes. Deny rules are
          deterministic; a canUseTool decision is whatever the application implements. Subagents inherit
          hooks; custom tools the application registers are covered only if the hook logic addresses them.
        verified: 2026-09-10
