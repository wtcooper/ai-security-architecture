        evidence:
          - title: Claude Cowork architecture overview (EDR cannot inspect the VM or cloud sessions)
            url: https://support.claude.com/en/articles/14479288-claude-cowork-architecture-overview
          - title: Monitor Claude Cowork activity with OpenTelemetry
