# Grok Bot — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# 2026-09-15: added sandboxing, egress, runtime enforcement, credential isolation and MCP rows after the managed-runtime drawing pinned them; fetched grok-bot/teams, security, security-faq, private-networks (all 200).
vendor: cursor
family: Grok Bot
tools:
  - id: toolGrokBot
    name: Grok Bot
    surfaceClasses:
      - managedRuntime
      - chatIntegration
    variants:
      - name: Grok Bot in Cursor (macOS, Windows, Linux, iOS)
        class: managedRuntime
        url: https://cursor.com/docs/grok-bot
      - name: Grok Bot in Slack
        class: chatIntegration
        url: https://cursor.com/docs/grok-bot/teams
    architecture: archHostedAgentSessions
    status: beta
    asOf: "2026-09"
    summary:
      - >-
        Grok Bot gives each member named, persistent AI teammates ("Bots") that keep memory, files,
        browser sessions and preferences across sessions and run on a hosted cloud computer — a
        dedicated Firecracker microVM per user that every Bot belonging to that user shares. Bots
        sign into web apps, run shell commands, use the browser and terminal, message each other,
        learn routines by demonstration and rerun them on a schedule; work continues when the
        laptop or phone is closed. It launched in early beta on 2026-08-11 as a joint Cursor /
        SpaceXAI product and is bundled with paid Cursor and SuperGrok plans; Cursor operates it.
      - >-
        Inference is on Cursor's hosted providers and computers run in the United States only, with
        no per-customer data residency by default. Most of what a Bot touches lives on the cloud
        computer rather than the member's device, though an Execution on Local Computer setting
        (default Always allow) can let a Bot run commands on the member's own machine unless an
        admin or the member sets it to Ask every time or Never allow; connector OAuth tokens stay on
        Cursor's backend and are never written to the computer, while login, two-factor and payment
        steps are handed back to the member. Egress uses shared static IP ranges across all Grok Bot
        customers; private networks are reached by installing the organisation's own VPN or
        zero-trust client through Team Setup.
      - >-
        Enterprise admins get an organisation-wide enable switch with Manage Group Access, Network
        Controls (four modes; teams without a policy default to allow-all, separate from the Cloud
        Agent policy), Team Setup manifests, Action Recording (off by default), Enforce Auto-review
        (off by default), computer management with termination, SCIM and audit logs of Bot
        control-plane events. Auto-review is the only action gate: it evaluates shell commands,
        plugin calls, computer use, automation writes and delegation, and the docs say it does not
        review all side effects such as memory writes.
    facts:
      - label: Plans
        value: >-
          Early beta from 2026-08-11 for Cursor Ultra, SuperGrok Heavy and Cursor Teams Premium,
          widened on 2026-08-26/27 to all SuperGrok, Cursor Pro and Cursor Teams plans (Cursor's docs
          say paid individual plans, Cursor Teams or a linked SuperGrok subscription with weekly usage
          resets). All organisational controls are Enterprise only.
        url: https://x.ai/news/grok-bot-more-plans
      - label: Inference & routing
        value: Cursor's hosted providers; Privacy Mode terms apply uniformly, including to Grok 4.5. Computers run in the United States today; custom residency requires the account team.
        url: https://cursor.com/docs/grok-bot/security
      - label: Data leaving the device
        value: >-
          Mostly nothing runs locally: files, browser sessions, memory and shell state live on the
          cloud computer, except when Execution on Local Computer (default Always allow) lets a Bot
          run commands on the member's machine; connector tokens stay on Cursor's backend and are
          never stored on the computer; internet egress uses shared ranges that identify Grok Bot
          traffic rather than your team.
        url: https://cursor.com/docs/grok-bot/private-networks
      - label: Data retention / training
        value: >-
          Deletion follows the DPA — data is deleted or returned within 30 days of written direction
          after the service ends; Bot memory and files persist across sessions by design. Privacy Mode
          means code is not used for training.
        url: https://cursor.com/docs/grok-bot/security
      - label: Docs index
        value: Grok Bot documentation (overview, Teams and Enterprise, security, security FAQ, private networks, settings).
        url: https://cursor.com/docs/grok-bot
      - label: Isolation
        value: A dedicated Firecracker microVM with its own kernel, memory and virtual devices per user; all of one user's Bots share that computer, so separate credentials need separate Cursor user accounts.
        url: https://cursor.com/docs/grok-bot/security-faq
      - label: Vendor ownership
        value: Grok Bot is the first joint product after SpaceX's acquisition of Anysphere (closed 2026-08-14); the SpaceXAI docs mirror Cursor's and state that Anysphere operates the service.
        url: https://docs.x.ai/grok-bot/security
    riskNotes:
      - risk: riskPromptInjection
        note: >-
          A Bot browses arbitrary sites while signed into the member's SaaS accounts and reads Slack
          and group-chat messages as instructions; Auto-review is an LLM reviewer, and Network
          Controls default to allow-all until an Enterprise admin sets a policy.
      - risk: riskAgenticDelegationConfusedDeputy
        note: >-
          Bots act with the member's connector tokens held on Cursor's backend and can delegate to
          Cloud Agents and subagents; the docs' guarantee is that a Bot never holds more access than
          its owner, so the member's own SaaS entitlements are the blast radius.
      - risk: riskSensitiveDataDisclosure
        note: >-
          Persistent memory, files and browser sessions accumulate on a US-hosted computer that all
          of the user's Bots share; Action Recording is off by default, so what a Bot did with that
          data is not recorded unless an admin turns it on.
      - risk: riskShadowAndUnknownAgents
        note: >-
          Grok Bot is bundled with individual paid plans, so members with personal accounts get it
          outside the organisation's switch; AllowedTeamId on managed devices and the org-wide
          switch with Manage Group Access are the containment.
    controls:
      - capability: capabilityIga
        coverage: native
        mechanism: Organisation-wide switch on the Grok Bot page with Manage Group Access; SSO and SCIM 2.0 (Enterprise)
        steps:
          - title: Decide who gets Bots
            body:
              - Use the organisation-wide switch on the Grok Bot dashboard page and Manage Group Access to enable it for specific groups; provision and deprovision through SCIM 2.0.
            url: https://cursor.com/docs/grok-bot/teams
        verified: "2026-09-10"
      - capability: capabilityNhiManagement
        coverage: partial
        mechanism: Named Bots bound to a member's identity; every action attributable to a named member; Bot creation and access changes in the audit log
        steps:
          - title: Keep Bots attributable
            body:
              - Bots inherit their owner's identity and can never hold more access than that member; use separate Cursor user accounts where workloads need distinct credentials.
            url: https://cursor.com/docs/grok-bot/security-faq
        note: Bots have no credentials or keys of their own to inventory or rotate; identity governance is the member's.
        verified: "2026-09-10"
      - capability: capabilitySecretsManagement
        coverage: partial
        mechanism: Connector OAuth tokens held on Cursor's backend, never on the computer; login, 2FA and payment handed to the member
        steps:
          - title: Rely on backend-held connector tokens
            body:
              - Bots invoke connector tools without receiving OAuth tokens and tokens are never stored on the computer; credentials typed during browser sessions are outside this model, so hand those steps to the member.
            url: https://cursor.com/docs/grok-bot/security
        note: No vault or just-in-time issuance for secrets the Bot uses inside its shell or browser sessions.
        verified: "2026-09-10"
      - capability: capabilityEncryptionKeyManagement
        coverage: partial
        mechanism: >-
          Vendor-managed encryption across Cursor infrastructure (TLS 1.2+ in transit, AES-256 at rest
          per the privacy and data governance page); no customer-managed key for Grok Bot data — CMEK
          is documented for Cloud Agent data only
        steps:
          - title: Record the key owner
            body:
              - >-
                Cursor holds the keys for Bot computers and transcripts; the CMEK section of the privacy and
                data governance page names Cloud Agent data only, so record a CMEK requirement as a gap on
                this product, not as absent encryption.
            url: https://cursor.com/docs/enterprise/privacy-and-data-governance
        note: >-
          Lack of a customer-managed key is not absence of encryption: the vendor encrypts, the vendor
          holds the keys. Assets: Bot computer storage and transcripts (vendor keys); the member's
          local machine (host disk encryption).
        verified: "2026-09-15"
      - capability: capabilityAgentRegistry
        coverage: partial
        mechanism: Computer management (look up any member's computer, creation and last-active times); audit log of Bot creation and member access changes
        steps:
          - title: Inventory computers and Bots
            body:
              - Organisation admins can look up any member's computer, see when it was created and last active, and read Bot creation and access-change events in the audit log.
            url: https://cursor.com/docs/grok-bot/teams
        note: No approval step or declared-capability record per Bot.
        verified: "2026-09-10"
      - capability: capabilityStagedRollout
        coverage: none
        mechanism: Not offered
        note: Team Setup manifests push install scripts to every computer but no versioning, staged release or rollback of Bots, routines or manifests is documented.
        evidence:
          - title: Vendor docs index, reviewed; no setting for this control (2026-09-10)
            url: https://cursor.com/docs/grok-bot
        verified: "2026-09-10"
      - capability: capabilityToolPermissionScoping
        coverage: native
        mechanism: Network Controls (four modes, team allowlist); Team Setup; Auto-review Ask first / Allow automatically rules; Execution on Local Computer (Always allow / Ask every time / Never allow); Bot access bounded by its owner
        steps:
          - title: Set a network policy
            body:
              - Pick one of the four Network Controls modes; teams without a policy default to allow-all, and the policy is separate from Cloud Agent network settings and applies when a computer is created or recreated.
            url: https://cursor.com/docs/grok-bot/security
          - title: Write Auto-review rules
            body:
              - Ask first rules always stop matching actions and Allow automatically rules let them proceed when the reviewer finds no safety concern; admins set team rules and members may only add stricter personal ones.
            url: https://cursor.com/docs/grok-bot/security-faq
          - title: Restrict execution on the member's own machine
            body:
              - Set Execution on Local Computer to Ask every time or Never allow; the default is Always allow, and the more restrictive of the admin and member setting wins.
            url: https://cursor.com/docs/grok-bot/teams
        note: >-
          Network Controls limit destinations, Ask first and Allow automatically rules pre-approve or
          gate actions, and the local-execution setting caps what a Bot may run on a member's machine.
          Tools are not individually hidden; a Bot's reach is its owner's.
        verified: "2026-09-10"
      - capability: capabilityHitlControls
        coverage: native
        mechanism: Team-wide Ask first rules (the human gate); Enforce Auto-review (Enterprise, off by default, an AI reviewer); local-execution ceiling; login, 2FA and payment always handed to the member
        steps:
          - title: Add team-wide Ask first rules
            body:
              - On the Grok Bot page add Ask first rules for the actions a person must approve; they apply to every member's Bots and win over Allow automatically when rules conflict. This is the human gate — Auto-review can allow an action without anyone seeing it.
            url: https://cursor.com/docs/grok-bot/teams
          - title: Enforce Auto-review
            body:
              - Turn on Enforce Auto-review so members cannot switch the AI reviewer off; it evaluates shell commands, plugin calls, computer use, automation writes and delegation and can allow, require approval or deny. An allow verdict is automatic, not human, review.
            url: https://cursor.com/docs/grok-bot/teams
          - title: Set the local-execution ceiling
            body:
              - Always allow, Ask every time or Never allow for local execution on the Grok Bot page is the team's ceiling; a member's own stricter setting still applies, so the ceiling is not every member's effective default.
            url: https://cursor.com/docs/grok-bot/teams
        note: Enforce Auto-review guarantees automatic review, not human review; the docs state Auto-review does not review all side effects, such as memory writes.
        verified: "2026-09-15"
      - capability: capabilityPromptInjectionDefense
        coverage: partial
        mechanism: Auto-review LLM reviewer over actions; Network Controls allowlist
        steps:
          - title: Combine the reviewer with an allowlist
            body:
              - Enforce Auto-review and set a team allowlist in Network Controls so an injected instruction cannot both act and exfiltrate.
            url: https://cursor.com/docs/grok-bot/security
        note: No classifier on the web pages or messages a Bot reads.
        verified: "2026-09-10"
      - capability: capabilityAiTprm
        coverage: external
        mechanism: Vendor evidence (Cursor trust portal, ISO 27001/42001, DPA) consumed by the organisation's TPRM platform
        steps:
          - title: Assess the new surface
            body:
              - Record US-only hosting, shared egress ranges, the DPA's 30-day deletion term, the SpaceXAI co-branding and Anysphere's ISO 27001 / 42001 certifications.
            url: https://docs.x.ai/grok-bot/security
        verified: "2026-09-10"
      - capability: capabilityAgentObservability
        coverage: native
        mechanism: Action Recording (Enterprise, off by default) plus OpenTelemetry Export tagged cursor.surface=grok_bot
        steps:
          - title: Record Bot actions
            body:
              - Turn on Action Recording on the Grok Bot page to capture Bot actions including scrubbed shell commands, then enable OpenTelemetry Export so shell, browser, tool-call and computer-use events reach your collector.
            url: https://cursor.com/docs/grok-bot/teams
          - title: Export the events
            body:
              - Configure Team Settings → OpenTelemetry Export; Grok Bot actions arrive as logs with no prompt content.
            url: https://cursor.com/docs/enterprise/opentelemetry-export
        note: >-
          Action Recording captures what the Bot did on its computer; OTel export carries lifecycle
          and tool events. Neither is detection — the recordings and events feed a tool the
          organisation runs.
        verified: "2026-09-10"
      - capability: capabilityAuditLogging
        coverage: native
        mechanism: Enterprise audit log covering Grok Bot control-plane events; SIEM streaming
        steps:
          - title: Stream Grok Bot audit events
            body:
              - Audit logs cover admin, security and authentication events plus Bot creation, member access changes, Team Setup manifests, MCP authentication, Slack account links and routines.
            url: https://cursor.com/docs/grok-bot/teams
        note: >-
          Control-plane events only — Bot actions are in Action Recording, not the audit log.
          Retention and tamper evidence are not stated; the SIEM stream is the durable record.
        verified: "2026-09-10"
      - capability: capabilityModelGuardrails
        coverage: none
        mechanism: Not offered
        note: >-
          No organisation-defined content or topic filter, and Cursor operates no content safeguard of
          its own on Bot inputs or outputs; whatever the upstream model provider applies is the
          provider's, not this product's. Auto-review gates actions, not content.
        evidence:
          - title: Vendor docs index, reviewed; no setting for this control (2026-09-10)
            url: https://cursor.com/docs/grok-bot
        verified: "2026-09-10"
      - capability: capabilityMemoryProtection
        coverage: partial
        mechanism: Per-user microVM; admin computer termination; separate user accounts for separate credentials
        steps:
          - title: Terminate a computer to reset state
            body:
              - Organisation admins can terminate any member's computer; provision separate Cursor user accounts where workloads must not share memory, files or browser sessions.
            url: https://cursor.com/docs/grok-bot/teams
        note: Memory persists by design and Auto-review does not evaluate memory writes; there is no validation, expiry or rollback.
        verified: "2026-09-10"
      - capability: capabilityModelEvals
        coverage: none
        mechanism: Not offered
        note: No evaluation harness for Bots or routines.
        evidence:
          - title: Vendor docs index, reviewed; no setting for this control (2026-09-10)
            url: https://cursor.com/docs/grok-bot
        verified: "2026-09-10"
      - capability: capabilityAiGovernancePlatform
        coverage: external
        mechanism: Audit log and computer management as feeds to the organisation's governance platform
        note: No catalogue with owners, risk tiers or intake; Bots are created by members without an approval workflow.
        evidence:
          - title: Vendor docs index, reviewed for the integration point (2026-09-10)
            url: https://cursor.com/docs/grok-bot
        verified: "2026-09-10"
      - capability: capabilityRateLimiting
        coverage: partial
        mechanism: Weekly usage allowances per plan; Cursor team spend limits
        steps:
          - title: Cap spend through the team
            body:
              - Grok Bot usage draws on plan allowances that reset weekly with on-demand billing beyond them; team and per-member spend limits in the Cursor dashboard bound the cost.
            url: https://cursor.com/docs/grok-bot
        note: No limit on routine frequency, action count or task duration is documented.
        verified: "2026-09-10"
      - capability: capabilityKillSwitch
        coverage: native
        mechanism: Organisation-wide switch; Manage Group Access; computer termination by admins; SCIM deprovisioning
        steps:
          - title: Stop a Bot or the whole feature
            body:
              - Terminate the member's computer from computer management, remove the group in Manage Group Access, or flip the organisation-wide switch off.
            url: https://cursor.com/docs/grok-bot/teams
        note: >-
          Terminating a member's computer stops active work on it; the organisation-wide switch and
          group removal block future work and the docs state no propagation delay, so measure it.
        verified: "2026-09-10"
      - capability: capabilityVendorAssurance
        coverage: external
        mechanism: Dashboard-only settings verified manually or through an SSPM product
        note: Network Controls, Enforce Auto-review and Action Recording have no documented API; posture checks must read the dashboard.
        evidence:
          - title: Vendor docs index, reviewed for the integration point (2026-09-10)
            url: https://cursor.com/docs/grok-bot
        verified: "2026-09-10"
      - capability: capabilityAgentSandboxing
        coverage: native
        mechanism: >-
          Firecracker microVM per member with its own kernel, memory and virtual devices; all of a
          member's Bots share that computer; durable disk across sessions; admin termination
          from computer management
        steps:
          - title: Treat the computer as the member's boundary
            body:
              - >-
                One member cannot reach another member's computer, but every Bot a member runs
                shares one; Bots isolate personalities and workspaces, not compute, so give
                separate people separate accounts rather than sharing a member login.
            url: https://cursor.com/docs/grok-bot/teams
          - title: Terminate a computer to reset it
            body:
              - >-
                Local files, browser sessions and anything saved in the browser persist on the disk
                across sessions; an admin terminates the computer from the dashboard and the next
                session starts fresh.
            url: https://cursor.com/docs/grok-bot/security
        note: >-
          Per member, not per Bot, and persistent, not ephemeral. Execution on the member's own
          machine (Execution on Local Computer) runs outside the microVM entirely; set it to Never
          allow if the boundary must hold.
        verified: "2026-09-15"
      - capability: capabilityEgressControl
        coverage: native
        mechanism: >-
          Network Controls (Enterprise): No policy, Allow all, Defaults plus team allowlist, Team
          allowlist only, with domains and IP ranges with ports; directory-group policies with a
          lock; private networks through desktop routing or Team Setup networking clients
        steps:
          - title: Set Team allowlist only and lock it
            body:
              - >-
                Pick Team allowlist only on the Grok Bot page, list the domains and IP ranges Bots
                need, and lock the policy so directory groups cannot override it; the policy applies
                when a computer is created or recreated.
            url: https://cursor.com/docs/grok-bot/security
          - title: Keep private-network routes inside the allowlist
            body:
              - >-
                Desktop routing and Team Setup clients (Tailscale, Cloudflare Tunnel) give reach into
                private networks but do not replace the destination allowlist; add coordination
                servers, relays and gateways to it.
            url: https://cursor.com/docs/grok-bot/private-networks
        note: >-
          Enterprise only; teams without a policy allow all destinations. Covers all traffic from the
          Bot computer, which egresses through Cursor's shared static ranges unless routed through
          a member's desktop. Connector calls run from Cursor's backend, outside the computer's
          policy.
        verified: "2026-09-15"
      - capability: capabilityAgentRuntimeEnforcement
        coverage: native
        mechanism: >-
          Team-wide Ask first rules always stop matching actions; Never allow for Execution on
          Local Computer; Auto-review (an AI reviewer) evaluates everything else and can allow,
          require approval or deny; login, 2FA and payment always handed to the member
        steps:
          - title: Write Ask first rules for the actions that must stop
            body:
              - >-
                Ask first rules always stop matching actions and win over Allow automatically when
                rules conflict; admins set team rules and members may add only stricter ones.
            url: https://cursor.com/docs/grok-bot/security-faq
          - title: Deny local execution where the microVM must hold
            body:
              - >-
                Set Execution on Local Computer to Never allow; the default Always allow delegates
                the decision to the member.
            url: https://cursor.com/docs/grok-bot/teams
        note: >-
          The deterministic part is Ask first and Never allow; Auto-review is a classifier that the
          docs say does not review all side effects, such as memory writes. Rules match actions,
          not shell commands individually, and the MCP allowlist decides which connector tools exist
          at all.
        verified: "2026-09-15"
      - capability: capabilityCredentialIsolation
        coverage: native
        mechanism: >-
          Connector OAuth tokens stay on Cursor's backend and are never stored on the computer;
          Bots invoke tools without receiving tokens; a secure secret request masks an entered
          value and keeps it out of the transcript
        steps:
          - title: Keep credentials off the computer
            body:
              - >-
                Connect tools through connectors so tokens stay on the backend, and enter one-off
                secrets through the secure secret request rather than in chat.
            url: https://cursor.com/docs/grok-bot/security
        note: >-
          Covers connector tokens. The member's logged-in browser sessions on the durable disk are
          inside the boundary — a Bot acts with them — so web credentials are isolated only by
          terminating the computer. A Bot acts as its owner; there is no on-behalf-of exchange.
        verified: "2026-09-15"
      - capability: capabilityMcpToolSecurity
        coverage: native
        mechanism: >-
          Enterprise MCP allowlist under the team's connector policy; a blocked connector shows
          as Disabled by team admin on every Bot
        steps:
          - title: Allowlist connectors and MCP servers for the team
            body:
              - >-
                Set the connector policy and MCP allowlist on the Grok Bot page; any permitted
                connector is available to every Bot a member runs and a blocked one is disabled
                for all of them.
            url: https://cursor.com/docs/grok-bot/teams
        note: >-
          Enterprise only. Rated native on the same rule as Cursor: admission by identity,
          organisation-wide. Admission is not integrity — nothing pins what a permitted server
          serves.
        verified: "2026-09-15"
