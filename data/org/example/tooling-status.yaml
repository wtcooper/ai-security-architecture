# Per-tool assessments reference organization capability IDs, never MITRE or CoSAI IDs directly.
# Regenerated by scripts/specialize-capabilities.mts from the pre-migration records in archive/.
tools:
  - tool: toolClaudeCode
    available: true
    note: Approved for engineering on managed laptops; managed settings pushed by MDM.
    capabilities:
      EX-D3-MFA:
        status: enabled
        note: Require SSO for Claude on, with MFA enforced on the Claude app in the IdP; forceLoginMethod claudeai
          and forceLoginOrgUUID pinned in managed-settings.json. Console logins and setup-token are not blocked by
          the client pin and are watched in the Domain memberships export
      EX-AGENT-ACTION-POLICY-ENFORCEMENT:
        status: enabled
        note: permissions.deny rules for destructive shell commands and force-push in managed settings; a PreToolUse
          hook blocks commands that leave the repository
      EX-AI-VENDOR-ASSESSMENT:
        status: enabled
        note: Anthropic assessed in the TPRM platform against the SOC 2 Type 2 and ISO 27001 artifacts; annual
          re-review
        evidence: TPRM-0417
      EX-SENSITIVE-DATA-REDACTION:
        status: inProgress
        note: Read() deny rules cover .env and ~/.aws; sandbox credential masking waits on the sandbox rollout
      EX-INPUT-GUARDRAILS:
        status: inProgress
        note: Managed PostToolUse hook for WebFetch and mcp__ results piloted against the gateway's injection
          classifier; Inference hooks not yet allowed for the organisation
      EX-AML-M0028:
        status: enabled
        note: permissions.deny and allowManagedPermissionRulesOnly in managed-settings.json
        evidence: CHG-1042
      EX-D3-EI:
        status: gap
        note: sandbox.enabled pending bubblewrap packaging for the Linux fleet
      EX-D3-CTS:
        status: gap
        note: sandbox.credentials deny entries for ~/.ssh and ~/.aws and CLAUDE_CODE_SUBPROCESS_ENV_SCRUB wait on the
          sandbox rollout; until then agent commands run with the developer's SSH agent and cloud CLI config
      EX-AML-M0031:
        status: inProgress
        note: Managed CLAUDE.md pushed org-wide; autoMemoryDirectory not yet pinned to a per-user path
      EX-D3-CH:
        status: inProgress
        note: claude.ai sign-in only, so forceLoginOrgUUID refuses ANTHROPIC_API_KEY and apiKeyHelper; the
          credential sits in the macOS Keychain, while the Linux fleet keeps the 0600 credentials file and
          setup-token one-year tokens cannot be refused
      EX-MCP-TOOL-INTEGRITY:
        status: enabled
        note: allowedMcpServers allowlist and managed-mcp.json as the only server set — admission of servers by
          identity; tool-definition integrity is not covered and is accepted as a residual
      EX-AML-M0014:
        status: gap
        note: Vendor offers nothing; the inventory is kept by hand in the governance register
      EX-AML-M0029:
        status: enabled
        note: disableBypassPermissionsMode set; permissions.ask on git push and package publish
      EX-AGENT-TOOL-REGISTRY:
        status: inProgress
        note: Seats assigned per role in the admin console; agent teams disabled until the inventory is complete
      EX-SHADOW-AI-DISCOVERY:
        status: inProgress
        note: Domain memberships export reviewed monthly for personal accounts on our domains; the proxy's
          tenant-restriction header blocks other organisations (prevention); the EDR inventory of the claude binary
          is not yet reconciled against seat assignments
      EX-AML-M0024:
        status: inProgress
        note: OTel export to the SIEM from a pilot group
      EX-AGENT-KILL-SWITCH:
        status: inProgress
        note: SCIM deprovisioning removes the seat and requiredMinimumVersion forces upgrades (future access);
          stopping a session already running on a device is untested and the cessation delay has not been
          measured
      EX-D3-PT:
        status: enabled
        note: EDR agent on every managed laptop with the documented process exclusions
      EX-D3-PA:
        status: enabled
        note: EDR agent on every managed laptop with the documented process exclusions
      EX-AGENT-EGRESS-CONTROL:
        status: inProgress
        note: Gateway enforced for inference; sandbox network policy not yet rolled out
  - tool: toolCursor
    available: true
    note: Pilot with one team; Privacy Mode enforced, MCP allowlist under evaluation.
    capabilities:
      EX-D3-MFA:
        status: enabled
        note: SSO through the team dashboard; MDM AllowedTeamId pins the tenant
      EX-AGENT-ACTION-POLICY-ENFORCEMENT:
        status: inProgress
        note: Team hooks with failClosed drafted (preToolUse deny on force-push and credential paths); meanwhile
          Run Mode is Auto-review, a classifier rather than a policy decision point
      EX-AI-VENDOR-ASSESSMENT:
        status: enabled
        note: Cursor assessed in the TPRM platform; ownership change flagged for re-review
        evidence: TPRM-0522
      EX-SENSITIVE-DATA-REDACTION:
        status: inProgress
        note: beforeReadFile hook denies .env files (a deny, not a redaction); no beforeSubmitPrompt hook yet
      EX-INPUT-GUARDRAILS:
        status: inProgress
        note: No postToolUse or beforeReadFile screening hook deployed yet; Auto-review judges actions, not the
          content entering context
      EX-AML-M0028:
        status: inProgress
        note: MCP Configuration allowlist with per-server tool lists drafted; argument-level denies need team hooks,
          since permissions.json carries only auto-run allowlists
      EX-D3-EI:
        status: gap
        note: Agent Sandbox Mode not enforced org-wide in the dashboard; developers run in the default mode
      EX-D3-CTS:
        status: gap
        note: beforeReadFile hook denies .env only; ~/.ssh stays readable even in the sandbox and terminal commands
          run with the developer's own credentials
      EX-AML-M0031:
        status: inProgress
        note: .cursor Directory Protection on and Team Rules enforced; Workspace Trust policy pending
      EX-D3-CH:
        status: inProgress
        note: Personal API keys blocked in Team Settings → Models; tool credentials in the developer's shell are not
          vaulted and .env files are readable by terminal tools
      EX-MCP-TOOL-INTEGRITY:
        status: inProgress
        note: MCP Configuration allowlist under evaluation with the pilot team
      EX-AML-M0014:
        status: gap
        note: Vendor offers nothing; kept by hand in the governance register
      EX-AML-M0029:
        status: inProgress
        note: Run Everything removed at team level, but Auto-review lets a classifier approve most actions; hooks
          returning ask on git push and package publish planned
      EX-AGENT-TOOL-REGISTRY:
        status: gap
        note: Team Marketplaces not yet configured; plugins are open
      EX-SHADOW-AI-DISCOVERY:
        status: inProgress
        note: MDM AllowedTeamId blocks personal logins (prevention); endpoint inventory of Cursor installs is not yet
          reconciled against team membership
      EX-AML-M0024:
        status: inProgress
        note: Enterprise Audit Log enabled; SIEM streaming not yet connected
      EX-AGENT-KILL-SWITCH:
        status: inProgress
        note: SCIM deprovisioning and Model Access Control cut future access; there is no fleet-wide stop for a
          running local session, so the runbook relies on device isolation through the EDR — untested
      EX-D3-PT:
        status: enabled
        note: EDR agent with the documented process exclusions
      EX-D3-PA:
        status: enabled
        note: EDR agent with the documented process exclusions
      EX-AGENT-EGRESS-CONTROL:
        status: gap
        note: Team sandbox networking allowlist not configured; the corporate proxy is the only control
  - tool: toolClaudeManagedAgents
    available: true
    note: Design partner programme; vault scoping under review.
    capabilities:
      EX-D3-MFA:
        status: enabled
        note: Console organisation on SSO; one workspace per team
      EX-D3-AA:
        status: inProgress
        note: Vault display_name mapped to the owning service; no lifecycle review yet
      EX-D3-CH:
        status: inProgress
        note: Vault credentials with managed OAuth refresh for MCP; static bearer tokens still in two vaults
      EX-AGENT-TOOL-REGISTRY:
        status: enabled
        note: Agents are workspace resources with metadata naming the owner
      EX-STAGED-ROLLOUT-GATE:
        status: inProgress
        note: Agent versions bumped through the deployment pipeline and pinned per environment (versioning); no canary
          exposure, and rollback to an earlier version has not been rehearsed
      EX-AML-M0008:
        status: gap
        note: No release-gate evaluation before an agent version goes live
      EX-AML-M0028:
        status: inProgress
        note: Toolsets default to enabled false; per-tool review in progress
      EX-AML-M0029:
        status: enabled
        note: permission_policy always_ask on write tools
      EX-INPUT-GUARDRAILS:
        status: inProgress
        note: Read-only memory stores and limited networking; no inline classifier
      EX-AI-VENDOR-ASSESSMENT:
        status: enabled
        note: Covered by the Anthropic TPRM assessment
        evidence: TPRM-0417
      EX-D3-ORA:
        status: inProgress
        note: Agent and vault listings pulled into the governance register weekly by script
      EX-AGENT-TRACING:
        status: enabled
        note: Session event stream shipped to the observability platform
      EX-AML-M0024:
        status: inProgress
        note: Session events retained; export to the SIEM not yet automated
      EX-AML-M0031:
        status: enabled
        note: Memory stores attached read_only except the agent's own
      EX-AGENT-KILL-SWITCH:
        status: enabled
        note: Agent archive and session delete runbook; on-call can interrupt a session
      EX-D3-EI:
        status: enabled
        note: Cloud environments only; no self-hosted sandbox yet
      EX-AGENT-EGRESS-CONTROL:
        status: inProgress
        note: networking type limited with allowed_hosts on the production environment; two development environments
          still unrestricted, and web_fetch domain lists not yet set
      EX-AGENT-ACTION-POLICY-ENFORCEMENT:
        status: enabled
        note: permission_policy always_ask on bash and on every MCP toolset; evaluated_permission kept from each tool
          event in the SIEM
      EX-D3-CTS:
        status: inProgress
        note: Vault credentials substituted at egress; one shared vault per agent, so per-user vaults for tenant
          scoping are still to be built
  - tool: toolClaudeDesktop
    available: true
    note: Enterprise plan; connector directory restricted to approved connectors.
    capabilities:
      EX-D3-MFA:
        status: enabled
        note: Require SSO for Claude; SCIM provisioning with groups
      EX-D3-APA:
        status: inProgress
        note: Custom roles scope connectors per group on the role's Connectors tab; Entra admin consent granted for
          the Microsoft 365 connector client IDs; Google Workspace connector trust still pending
      EX-D3-OTF:
        status: enabled
        note: IP allowlisting to the corporate egress ranges; tenant restrictions header on the proxy
      EX-SENSITIVE-DATA-REDACTION:
        status: inProgress
        note: Endpoint DLP covers the desktop app; Inference hooks (Data and privacy, Enforce verdicts) wait on the
          AI security server
      EX-INPUT-GUARDRAILS:
        status: inProgress
        note: Inference hooks not yet allowed; connector tool restrictions limit exposure but screen nothing
      EX-D3-ORA:
        status: inProgress
        note: Compliance API pulled into the governance register; usage exports still manual
      EX-AI-VENDOR-ASSESSMENT:
        status: enabled
        note: Covered by the Anthropic TPRM assessment
        evidence: TPRM-0417
      EX-AML-M0029:
        status: enabled
        note: Tool policy Needs approval on every write tool at Organization settings > Connectors and on each
          role's Connectors tab
      EX-D3-AA:
        status: inProgress
        note: Managed authorization on the Okta-supported connectors; other per-user grants tracked from
          integration_user_connected and _disconnected Activity Feed events, with no admin revoke per grant
      EX-D3-DI:
        status: inProgress
        note: Retention set to 90 days and Compliance API delete on legal request (lifecycle); discovery and
          classification of sensitive content in chats and projects not yet connected to the DSPM product
      EX-D3-CH:
        status: inProgress
        note: Managed authorization where the connector supports it; Compliance keys never expire, so a quarterly
          rotation runbook stands in; no MCP tunnel deployed
      EX-AML-M0028:
        status: enabled
        note: Connector directory restricted; write tools off for the organisation
      EX-DATA-ACCESS-GOVERNANCE:
        status: inProgress
        note: Connectors act as the user; managed authorisation scoping under review
      EX-AGENT-TOOL-REGISTRY:
        status: enabled
        note: Connector catalogue and extension allowlist in the console
      EX-SHADOW-AI-DISCOVERY:
        status: enabled
        note: Domain claiming reviewed monthly and Migrate accounts using your domain on; personal accounts on the
          verified domain pulled in
      EX-AML-M0024:
        status: enabled
        note: Compliance API chats/messages and /v1/compliance/activities pulled to the SIEM daily
      EX-AGENT-KILL-SWITCH:
        status: inProgress
        note: SCIM deprovisioning and a connector Remove / Blocked runbook; whether a running research task stops
          is untested
  - tool: toolM365Copilot
    available: true
    note: Microsoft 365 tenant, so Copilot Chat is on by default for every Entra user; Microsoft 365 Copilot add-on
      licences held by a pilot group. Governed as default-on chat until the Purview and SharePoint Advanced
      Management work completes.
    capabilities:
      EX-D3-MFA:
        status: enabled
        note: Conditional Access policy "Require MFA for all users" (All users, All resources, Multifactor
          authentication strength) on, break-glass accounts excluded; Copilot inherits it
      EX-D3-OTF:
        status: inProgress
        note: Tenant restrictions v2 default blocks external tenants and the Microsoft account tenant;
          sec-Restrict-Tenant-Access-Policy injected by the proxy on the four Microsoft sign-in domains (auth plane
          only); Global Secure Access for data-plane coverage not yet deployed
      EX-SENSITIVE-DATA-REDACTION:
        status: inProgress
        note: Purview DLP policy on the Microsoft 365 Copilot and Copilot Chat location excludes Highly Confidential
          labelled files and email; the Processing prompts SIT rule is in simulation mode while the preview rolls
          out; uploaded files are not scanned and are covered by Endpoint DLP only
      EX-AI-VENDOR-ASSESSMENT:
        status: enabled
        note: Microsoft assessed in the TPRM platform against the Service Trust Portal SOC 2 and ISO 27001/42001
          reports; reassessment triggered by subprocessor changes (Anthropic, outside the EU Data Boundary)
      EX-AML-M0029:
        status: gap
        note: No admin setting forces approval; federated connector write tools (from October 2026) default to
          Needs approval but users can choose Always allow; user guidance issued and Cowork limited to the pilot
          spending policy
      EX-INPUT-GUARDRAILS:
        status: inProgress
        note: Vendor XPIA and jailbreak classifiers are always on and not configurable; XPIADetected and
          JailbreakDetected audit fields alert in the SIEM; DLP rule excluding external email from grounding
          piloted; Defender for Office 365 Plan 2 prompt-injection verdicts quarantined
      EX-D3-AA:
        status: inProgress
        note: Agent identities reviewed in Entra with sponsors; ownerless-agent rules run monthly; per-user
          federated connector grants cannot be listed or expired by the admin, so connectors stay limited to
          approved groups
      EX-D3-DI:
        status: inProgress
        note: DSPM default weekly data risk assessment reviewed; SharePoint data access governance reports (site
          permissions, EEEU) run quarterly; mailboxes and connector content not covered by the assessments
      EX-D3-CH:
        status: enabled
        note: Graph connector agent uses a certificate; ServiceNow connector on Entra ID OpenID Connect (no stored
          secret); third-party OAuth tokens for federated connectors are vendor-held and accepted as a residual
      EX-AML-M0028:
        status: enabled
        note: Allowed agent types restricted so federated connectors are off until enabled; each connector staged to
          named Entra groups; no per-tool scoping is available, so write-capable connectors are reviewed before
          enablement
      EX-AGENT-TOOL-REGISTRY:
        status: enabled
        note: Agent Registry is the record of truth; every published agent approved through Requests; Sharing set
          to Specific users; registry export reconciled monthly against the governance register
      EX-AML-M0024:
        status: inProgress
        note: CopilotInteraction records streamed to the SIEM through the Management Activity API (Audit.General);
          prompt and response export through getAllEnterpriseInteractions not yet built
      EX-SHADOW-AI-DISCOVERY:
        status: inProgress
        note: Vendor offers nothing in Copilot; Defender for Cloud Apps Generative AI category reviewed monthly and
          unsanctioned apps tagged; Multiple account access to Copilot for work documents disabled (prevention)
      EX-DATA-ACCESS-GOVERNANCE:
        status: inProgress
        note: Retrieval runs as the user; Restricted Content Discovery on the Finance and HR sites while permissions
          are reviewed; DLP label exclusion for Highly Confidential in place
      EX-D3-APA:
        status: enabled
        note: Copilot licences and agent User access scoped to Entra groups; admin consent granted only through the
          agent publishing review; connector apps registered in each target system by its owner
      EX-AGENT-KILL-SWITCH:
        status: inProgress
        note: Runbook blocks the agent in Agents > All agents, sets connectors to No users and revokes sessions with
          Revoke-MgUserSignInSession; stopping in-flight Cowork or Researcher runs is untested and the delay
          unmeasured
