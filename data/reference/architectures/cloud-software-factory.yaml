id: archSoftwareFactory
surface: surfaceCloud
rank: 10
title: Agentic software factory
abbrev: Software factory

overview: >-
  A factory your platform team runs in your own cloud: someone who is not a developer describes
  an app in a chat, an agent writes it, a pipeline tests and scans it, a named owner approves it
  and the factory hosts it. Unlike hosted coding sessions, where an engineer reviews a pull
  request to an existing repository, the result is a new running app with its own users and
  data, for someone who cannot read its code.

summary:
  - >
    People describe an application in a chat, and an agentic factory your platform team runs in
    your own cloud builds it, tests it, deploys it and hosts it for them. The requester is usually
    not a developer. The factory produces a second application with its own users, data, identity
    and lifetime, so the drawing is about two things: the gate between "the agent wrote it" and
    "it runs against real data", and who owns the app once it is live.

description:
  - >
    An agentic software factory turns a request typed in a chat into a running application: an
    agent writes it, a pipeline builds, tests and scans it, and it is deployed and hosted in your
    own cloud. What sets it apart is that it produces a second application, with its own users,
    data, identity and lifetime, for someone who cannot read its code. The question is the gate
    between written and running, and who owns the app afterwards.
  - >
    The gate drawn here is the one most organisations can staff. Automated checks run first:
    tests, static and dependency scanning, secret scanning, and a policy check of the app's
    settings (who can sign in, what it stores, which connectors it asks for). Then the app's
    owner, the requester's accountable manager or a named business owner, approves the release
    after trying it on a preview. No engineer reads the code by default; the owner approves what
    the app does and what it may reach, not how it is written. A team that removes the owner as
    well runs a "dark factory", walked as a scenario below, and should know what that takes away.
  - >
    The agent never deploys and never meets real data. It works in a sandbox made for one task,
    reaches only the AI gateway, the package mirror and its app's repository, and can push a
    branch and nothing more. Only the pipeline builds and deploys. Previews run on test data with
    no route to enterprise systems, and the app's secrets are given to it at run time from the
    vault, so neither the agent nor the repository ever holds one.
  - >
    Each generated app is a tenant of its own: its own network and cloud account, its own
    identity, its own data store, and our identity provider in front of it by default. It reaches
    enterprise data only through connectors approved for it, and returns only what the signed-in
    user may see. If the app itself calls a model, those calls leave through the same AI gateway
    and the app is then also a chat agent or an action agent, with that pattern's controls.
  - >
    An app outlives the conversation that made it, and often the people. Every app is recorded
    with its owner, the data it may touch and an end date; at the end date the owner renews it or
    it is taken offline, its credentials cancelled and its data archived. Apps built with AI
    outside the factory are looked for and brought in or shut down, because the factory only
    governs what is built inside it.

distinguishedBy:
  - >
    Against the coding & desktop session managed agent runtime: there an engineer hands a task on
    an existing repository to a vendor's agent and reviews the pull request it returns. The
    reviewer reads code, and the result is a change to software that already has an owner. Here
    the requester is not a developer, the repository is new, nobody reads the code, and the result
    is a running app with users of its own. The gate moves from the pull request to the release,
    and from an engineer to an accountable owner.
  - >
    Against the agent sandbox for RL & evaluation: both contain an agent's code in a sandbox made
    for one task. There the output of a run is a score and a checkpoint; here it is software that
    will run against real data, so the drawing carries on past the sandbox to a pipeline, a gate
    and a hosted app.
  - >
    Against the chat agent with tools: the chat is the same kind of front door, but this agent
    does not act on records during the conversation. It writes software that acts on them later,
    under its own identity, long after the conversation has ended.
  - >
    Against prompt-to-app products such as Lovable, Vercel v0, Replit and Bolt: the same request,
    built and hosted in the vendor's tenancy, where the code, the data and the app's users sit with
    the vendor and the controls become tenant settings and an agreement. That is a subscribed
    pattern, not this one.

exemplars:
  - name: Claude Code (Agent SDK)
    fills: harness
    note: >
      Runs the Claude Code agent loop without a person at the terminal, from the command line or
      from Python and TypeScript, with the tools it may use listed per run. One way to build the
      factory's agent inside a sandbox you run.
    url: https://code.claude.com/docs/en/headless
    asOf: "2026-11"
  - name: OpenHands
    fills: harness
    note: >
      An open-source coding agent with a software agent SDK and a self-hostable sandbox server
      that creates the environments its agents run in. Another way to build the agent and its
      build sandbox on your own infrastructure.
    url: https://docs.openhands.dev/
    asOf: "2026-11"
  - name: GitHub Copilot cloud agent on your own runners
    fills: harness
    note: >
      Its sessions can run on self-hosted GitHub Actions runners, so the sandbox sits on machines
      you run, one repository per session. GitHub still starts and orchestrates the agent, so this
      is nearer the hosted coding sessions pattern; check where its model calls go.
    url: https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-organization/configure-runner-for-coding-agent
    asOf: "2026-11"
  - name: GitHub Actions environments
    fills: deployGate
    note: >
      Required reviewers on a production environment, with self-review prevented, and
      environment secrets a job cannot read until a reviewer approves. One way to build the
      owner's approval into the deploy gate.
    url: https://docs.github.com/en/actions/reference/workflows-and-actions/deployments-and-environments
    asOf: "2026-11"
  - name: Argo CD and Argo Rollouts
    fills: deployGate
    note: >
      Argo CD deploys from Git and can roll back to any configuration committed there; Argo
      Rollouts adds canary and blue-green releases with automated rollback. The release and
      rollback half of the deploy gate.
    url: https://argo-cd.readthedocs.io/en/stable/
    asOf: "2026-11"
  - name: Argo CD pull request generator
    fills: previews
    note: >
      Creates an application for each open pull request and removes it when the pull request
      closes. A common way to build preview environments.
    url: https://argo-cd.readthedocs.io/en/stable/operator-manual/applicationset/Generators-Pull-Request/
    asOf: "2026-11"
  - name: OAuth2 Proxy
    fills: appHosting
    note: >
      A reverse proxy that signs people in through your identity provider before a request reaches
      the application, checking group or domain membership. One way to put sign-in in front of
      every generated app by default.
    url: https://oauth2-proxy.github.io/oauth2-proxy/
    asOf: "2026-11"
  - name: JFrog Curation
    fills: registry
    note: >
      Blocks packages from public registries at the mirror, including an immature-package policy
      that refuses versions younger than a set age. The age rule is what catches a package name an
      agent invented and an attacker registered last week.
    url: https://academy.jfrog.com/how-to-use-curation-time-delay-policies-to-block-package-hijacks
    asOf: "2026-11"
  - name: Backstage Software Catalog
    fills: govSupplyChain
    note: >
      Keeps track of ownership and metadata for all the software in an organisation. One way to
      build the register of generated apps, with an owner, a data class and an end date for each.
    url: https://backstage.io/docs/features/software-catalog/
    asOf: "2026-11"

zones:
  - id: zoneUser
    owner: user
    note: >
      Three groups of people, and they are rarely the same: the requester who describes the app
      and tries the preview, the owner who approves it for production and answers for it after,
      and the people who use the finished app.
  - id: zoneCloud
    owner: cloud
    gloss: "our cloud: the factory and its apps"
    note: >
      Everything here is ours: on the left and top the factory (intake, the agent and its sandbox,
      the gateway, the repository, the pipeline, previews and the deploy gate), and in the frame at
      the bottom one of the apps it has made, with its own data, beside the enterprise data it may
      reach through approved connectors.
  - id: zoneExternal
    owner: external
    note: >
      The model provider the gateway calls, and the public package registries the mirror admits
      from. Nothing here connects in.
  - id: zoneGovernance
    owner: governance
    note: >
      Drawn across every band. On this pattern it also holds the register of every generated app,
      with its owner and end date, because that is what decides how long an app may run.

blocks:
  - id: requester
    kind: actor
    title: Requester
    summary: "asks for the app; cannot read its code"
    icon: person
    zone: zoneUser
    col: 0
    row: 0
    note: >
      Usually not a developer: a marketer, an analyst, a product manager, sometimes an engineer in
      a hurry. Describes what they need, uploads the files it should work from, and tries the
      preview. They are the author of the agent's instructions and cannot judge the code it writes.

  - id: appOwner
    kind: actor
    title: App owner
    summary: "approves the release; answers for the app"
    icon: person
    zone: zoneUser
    col: 0
    row: 1
    note: >
      The requester's accountable manager or a named business owner, recorded against the app.
      Approves each release to production after the automated checks, renews the app at its end
      date, and is who the platform team calls when it misbehaves. Never the requester approving
      their own app.

  - id: appUsers
    kind: actor
    title: App users
    summary: "use the finished app, signed in"
    icon: people
    zone: zoneUser
    col: 0
    row: 2
    note: >
      The people the app was built for, who may never have heard of the factory. They sign in
      through our identity provider and see what the app shows them; what it may show is decided by
      its connectors, not by them.

  - id: intake
    kind: service
    title: Intake & spec
    summary: "the factory's chat: request and uploads turned into a spec"
    cosaiComponent: componentAgentUserQuery
    zone: zoneCloud
    col: 1
    row: 0
    note: >
      The chat front end of the factory. It signs the requester in, takes the request and any
      uploaded files, asks the questions a spec needs (who will use it, what data, which systems),
      and writes the spec the agent works from. The spec is kept with the app, so later changes are
      made against it and the trace can show what was asked for.
    items:
      - id: identity
        label: Identity binding
        icon: shield
        note: Who is asking, bound before anything is built; the requester's name stays on the app.
      - id: uploads
        label: File upload
        icon: doc
        note: >
          Spreadsheets, screenshots and documents the app should work from. Written by anyone,
          and read by the agent as instruction.
      - id: spec
        label: App spec
        icon: doc
        cosaiComponent: componentAgentSystemInstruction
        note: >
          The versioned description of the app: purpose, users, data, connectors and end date.
          It is the agent's task, and the record of what was asked for.

  - id: previews
    kind: service
    title: Preview environments
    summary: "a running copy per branch, on test data, behind sign-in"
    zone: zoneCloud
    col: 1
    row: 1
    note: >
      A copy of the app for each branch, deployed by the pipeline so the requester can try it and
      the owner can see it before approving. Previews run on test data in a network with no route
      to enterprise systems, and only the requester and the owner can sign in.
    items:
      - id: previewApp
        label: App & API endpoint
        icon: globe
        note: The branch's build, reachable at its own address while the pull request is open.
      - id: testData
        label: Test data
        icon: db
        note: Made-up or masked records the preview works on. Never a copy of production.

  - id: deployGate
    kind: service
    title: Deploy gate
    summary: "promotion on the owner's approval; staged release & rollback"
    zone: zoneCloud
    col: 2
    row: 2
    note: >
      The continuous delivery tier that holds a release until it may run against real data. It
      takes a release candidate only from the pipeline, with its check results, waits for the
      owner's approval of that exact release, releases it to a few users first and keeps the last
      good version ready to restore. It is also where the platform retires an app.
    items:
      - id: releases
        label: Signed releases
        icon: shield
        note: Each release the pipeline built, signed, with its check results and bill of materials.
      - id: environment
        label: Environment definition
        icon: gear
        note: >
          The app's settings: who may sign in, its connectors, its storage, its network. Checked
          against the baseline before each release.

  - id: harness
    kind: service
    title: Agent harness
    summary: "writes the app from the spec"
    cosaiComponent: componentReasoningCore
    zone: zoneCloud
    col: 2
    row: 0
    note: >
      The factory's coding agent: it reads the spec, plans the app, writes the code and tests,
      runs them and fixes what fails, using the platform team's templates and skills. It runs under
      its own workload identity, holds no cloud credential that reaches production, and finishes
      by pushing a branch.
    items:
      - id: loop
        label: Agent loop
        icon: agent
        note: Plans, writes, runs the tests, reads the failures and tries again until the checks pass.
      - id: context
        label: Context assembly
        icon: doc
        note: The spec, the uploads, the template and the test output, merged into each model call.
      - id: mcpClient
        label: MCP client
        icon: plug
        note: The agent's connection, through the gateway, to the platform team's skills and tools.

  - id: nativeTools
    kind: service
    title: Native tools
    summary: "the build sandbox: shell, files, test runs"
    cosaiComponent: componentTools
    zone: zoneCloud
    parent: harness
    col: 0
    row: 1
    note: >
      The agent's built-in tools, and the sandbox they run in: a shell, file and edit tools, and
      the test runs. Made for one task and destroyed after it, with a network that reaches only
      the gateway, the package mirror and the app's repository. Everything the agent installs or
      runs happens here before any check has looked at it.
    items:
      - id: shell
        label: Shell commands
        icon: code
        note: Builds, test runs, git and the package manager.
      - id: files
        label: File & edit tools
        icon: folder
        note: The app's working copy, inside the sandbox.
      - id: sandboxed
        label: Sandboxed tools
        icon: shield
        note: Code the agent writes runs only here, never in the agent's own process.

  - id: gateway
    kind: service
    title: AI gateway
    summary: "model calls on our key; the platform's skills & tools"
    zone: zoneCloud
    col: 4
    row: 0
    note: >
      The one crossing the agent's model and tool calls leave through. It holds the model
      provider's key so the agent holds none, meters spend per request, and serves the platform
      team's skills (the app template, the house style, how to ask for a connector) and tools.
      Package installs and git do not pass it.
    pack: aiGatewayTraffic

  - id: registry
    kind: external
    title: Private pkg registry
    summary: "admitted packages, pinned by digest"
    cosaiComponent: componentDataSources
    zone: zoneCloud
    col: 3
    row: 2
    note: >
      The organisation's mirror of approved packages. The build sandbox installs from it and from
      nowhere else, so this is where a package the agent invented, or a look-alike of a real one,
      is refused.
    items:
      - id: approved
        label: Approved packages
        icon: db
        note: Scanned, old enough to have a history, and pinned by digest.

  - id: sourceControl
    kind: service
    title: Source control
    summary: "one repository per app: the agent's branch, checks, history"
    cosaiComponent: componentDataSources
    zone: zoneCloud
    col: 3
    row: 1
    note: >
      Our own source control, with one repository per generated app, created by the factory from
      the template. The agent pushes a branch and opens a pull request; branch protection means
      only the pipeline merges, and the pipeline's own definition is not the agent's to change.
    items:
      - id: repos
        label: Repositories & instruction files
        icon: code
        note: >
          The app's code, its spec and the agent's instruction files, committed together so every
          change can be traced to the request that caused it.
      - id: prs
        label: Pull requests & CI
        icon: shield
        note: The agent's pull request and the checks the pipeline reports on it.

  - id: pipeline
    kind: service
    title: Build & test pipeline
    summary: "builds, tests & scans each push; writes the bill of materials"
    zone: zoneCloud
    col: 2
    row: 1
    note: >
      Continuous integration the platform team owns. On every push it builds the app, runs its
      tests, scans the code, its packages and its settings, checks for secrets, writes a bill of
      materials, deploys a preview and, when everything passes, hands a signed release candidate
      to the deploy gate. It is the only thing that deploys.
    items:
      - id: runs
        label: Build & test runs
        icon: gear
        note: Each push built and tested on runners the agent cannot reach or change.
      - id: bom
        label: Bill of materials
        icon: doc
        note: >
          Every package in the release, and which agent and model version wrote it, kept with the
          release.

  - id: appTenant
    kind: boundary
    title: Generated app
    summary: "its own account, data and owner"
    zone: zoneCloud
    col: 1
    row: 2
    rowSpan: 2
    note: >
      One app the factory has made, drawn once for the many it will make. Each is a tenant of its
      own: a separate cloud account or project with its own network, its own workload identity,
      its own store and its own owner, so that one app's fault or compromise stays inside its
      frame. Nothing from the factory runs inside it except the release.

  - id: appHosting
    kind: service
    title: App hosting
    summary: "the running app, with our sign-in in front by default"
    cosaiComponent: componentApplication
    zone: zoneCloud
    parent: appTenant
    col: 0
    row: 0
    note: >
      Where the app runs. Our identity provider stands in front of it whatever the agent wrote, so
      an app is never public unless its owner asks and the platform agrees. It runs under its own
      identity, receives its secrets at run time and reaches only its own store and its approved
      connectors.
    items:
      - id: endpoint
        label: App & API endpoint
        icon: globe
        note: The app's address, published only behind sign-in.
      - id: signin
        label: Identity binding
        icon: shield
        note: >
          The signed-in user, passed to the app so it can show each person only what they may
          see.

  - id: appData
    kind: external
    title: App data
    summary: "the app's own store; no other app can reach it"
    cosaiComponent: componentDataStorage
    zone: zoneCloud
    parent: appTenant
    col: 0
    row: 1
    note: >
      The app's own database and files, created with it and deleted or archived with it. It may
      hold real business data from the day the app goes live, which is why the gate stands before
      it and the end date applies to it.
    items:
      - id: records
        label: Internal records
        icon: db
        note: What the app's users enter and the app keeps.
      - id: appFiles
        label: File storage
        icon: folder
        note: Uploads and exports the app holds.

  - id: orgData
    kind: external
    title: Enterprise data
    summary: "systems of record, reached only through approved connectors"
    cosaiComponent: componentDataSources
    zone: zoneCloud
    col: 2
    row: 3
    note: >
      The organisation's own systems of record. A generated app reaches them only through
      connectors approved for that app, with its own identity and the signed-in user's
      entitlements. The agent that wrote the app never reaches them at all.
    items:
      - id: orgRecords
        label: Org data
        icon: db
        note: The records an app reads or changes through its approved connectors.
      - id: orgFiles
        label: File storage
        icon: folder
        note: Shared documents, reached the same way.

  - id: provider
    kind: provider
    title: Model provider
    summary: "inference API the gateway calls on our key"
    cosaiComponent: componentModelServing
    zone: zoneExternal
    col: 5
    row: 0
    note: The published inference interface. What runs behind it is the provider's and is not drawn.
    items:
      - id: inference
        label: Inference API
        icon: model
        note: "Returns the agent's plans and code: untrusted output, however good it looks."

  - id: sources
    kind: external
    title: Public package sources
    summary: "public registries the mirror admits from"
    zone: zoneExternal
    col: 5
    row: 1
    note: >
      Where the mirror gets what it serves. Anyone can publish here, including under a name an
      agent is likely to invent.
    items:
      - id: publicRegistries
        label: Package registries
        icon: db
        note: npm, PyPI and their kind, reached by the mirror and never by the sandbox.

  - id: govIdentity
    kind: governance
    title: Identity services
    summary: "who may ask, approve and sign in to each app"
    icon: person
    zone: zoneGovernance
    col: 0
    row: 5
    mitigations: [ D3-APA, D3-MFA ]
    note: >
      The identity provider behind three decisions: who may use the factory, who owns and approves
      each app, and who may sign in to it. Also the workload identities the agent and each app run
      under, kept distinct.

  - id: govSecrets
    kind: governance
    title: Secrets & key management
    summary: "the vault: model key and app secrets, never in code"
    icon: key
    zone: zoneGovernance
    col: 1
    row: 5
    mitigations: [ D3-CH, D3-CTS ]
    note: >
      The vault that holds the model provider's key for the gateway and each app's secrets for its
      run time, so no secret is ever written into a repository or seen by the agent.

  - id: govPolicy
    kind: governance
    title: Policy & authorization
    summary: "what the agent may reach; what each app may read"
    icon: scale
    zone: zoneGovernance
    col: 2
    row: 5
    mitigations: [ AML.M0028, AML.M0029, cap-agent-egress-control, cap-data-access-governance, cap-input-guardrails, D3-ACH ]
    note: >
      What the agent may push and reach, who must approve a release, which connectors an app may
      use and what they may return, and the baseline every app's settings are checked against.

  - id: govSupplyChain
    kind: governance
    title: Supply-chain assurance
    summary: "admitted packages, scans, staged release; every app's owner"
    icon: db
    zone: zoneGovernance
    col: 3
    row: 5
    mitigations: [ cap-staged-rollout-gate, D3-FA, D3-SYSVA, AML.M0023, D3-AI ]
    note: >
      What enters the mirror, the scans every release passes, the staged release and rollback,
      the bill of materials, and the register of every generated app with its owner, its data and
      its end date.

  - id: govObservability
    kind: governance
    title: Observability & response
    summary: "who asked, what shipped; stop any app; find shadow apps"
    icon: eye
    zone: zoneGovernance
    col: 4
    row: 5
    mitigations: [ cap-agent-tracing, cap-agent-kill-switch, cap-shadow-ai-discovery ]
    note: >
      One record from request to release, a stop that takes any app offline without the factory,
      and the search for apps built with AI outside it.

edges:
  - from: requester
    to: intake
    crossing:
      kind: brokered
      via: "Intake & spec: signed in, approved groups only; request and uploads screened"
    path: primary
    bidir: true
    label: request & uploads
    note: >
      What the requester wants, in their own words, with the files it should work from; the
      intake's questions and the spec come back for them to confirm.
  - from: intake
    to: harness
    path: primary
    bidir: true
    label: spec & progress
    note: >
      The confirmed spec starts a build; progress and questions the agent cannot answer come back
      to the chat.
  - from: harness
    to: gateway
    path: primary
    bidir: true
    label: "inference, MCP & skills"
    note: >
      Every model call and every call to the platform's skills and tools, on the agent's own
      identity. The gateway holds the provider key; the agent holds none.
  - from: gateway
    to: provider
    crossing:
      kind: brokered
      via: "AI gateway: our vaulted key, allowlisted provider, spend metered"
    path: external
    outbound: true
    label: inference / completion
    note: >
      The spec, the code so far and the test output go out; plans and code come back. Untrusted
      output, written by a model, that nobody will read line by line.
  - from: nativeTools
    to: registry
    path: primary
    bidir: true
    label: pinned installs
    note: >
      Every package the build needs, pulled from the mirror and nowhere else, pinned by digest.
      The gateway is not on this path.
  - from: sources
    to: registry
    crossing:
      kind: brokered
      via: "Private pkg registry: scanned, old enough to trust, pinned before anyone inside installs it"
    path: external
    label: mirrored & admitted
    note: >
      The mirror's own upstream. A package is proxied in, scanned and held back if it is too new
      to have a history, before the sandbox can install it.
  - from: nativeTools
    to: sourceControl
    path: primary
    bidir: true
    label: clone & push a branch
    note: >
      The agent clones its app's repository and pushes a branch with a pull request; check results
      come back the same way. Its token reaches this repository only, and cannot merge.
  - from: sourceControl
    to: pipeline
    path: primary
    label: build on push
    note: >
      Each push starts the pipeline, which runs on definitions the platform team owns and the agent
      cannot edit.
  - from: pipeline
    to: previews
    path: primary
    label: deploy preview
    note: The branch's build goes to its own preview, on test data.
  - from: requester
    to: previews
    crossing:
      kind: brokered
      via: "Preview environments: sign-in for the requester and owner only; test data"
    path: primary
    bidir: true
    label: try it
    note: >
      The requester uses the preview and says what to change through the chat. Nothing they enter
      here is real data.
  - from: pipeline
    to: deployGate
    path: primary
    label: release candidate & results
    note: >
      A signed build that has passed every check, with its results and bill of materials. The
      gate takes releases from the pipeline and from nowhere else.
  - from: appOwner
    to: deployGate
    crossing:
      kind: person
      via: "The app owner, signed in with a second factor: approves one named release"
    path: primary
    bidir: true
    label: approve release
    note: >
      The owner sees what the release does and reaches (the preview, the checks, the connectors and
      data it asks for) and approves that exact release. A change to any of it needs a new
      approval.
  - from: deployGate
    to: appHosting
    path: primary
    label: staged release
    note: >
      The approved release, with its secrets from the vault, to a few users first and then to
      all; or the last good version, restored.
  - from: appUsers
    to: appHosting
    crossing:
      kind: brokered
      via: "App hosting: our identity provider in front, second factor, owner-set access"
    path: primary
    bidir: true
    label: sign in & use
    note: >
      The app's users sign in through our identity provider before any request reaches the app,
      whatever the agent wrote.
  - from: appHosting
    to: appData
    path: primary
    bidir: true
    label: app records
    note: The app's own reads and writes, to a store no other app can reach.
  - from: appHosting
    to: orgData
    path: primary
    bidir: true
    label: approved connectors only
    note: >
      Reads and writes on systems of record, through connectors approved for this app, on its own
      identity and the signed-in user's entitlements.

pins:
  risks:
    - risk: riskPromptInjection
      at: requester->intake
      note: >
        The request and the uploads become the agent's instructions. A cell in a spreadsheet or a
        line hidden in a document can tell the agent to add a back door, weaken sign-in or send a
        secret out, and the requester would not see it in the code.
    - risk: riskInsecureIntegratedComponent
      at: nativeTools->registry
      note: >
        Agents ask for packages that do not exist, and attackers publish under exactly those
        names, or under names one letter from a real one. Whatever is installed here runs in the
        build and ships in the app.
    - risk: riskInsecureModelOutput
      at: nativeTools->sourceControl
      note: >
        The code is model output that nobody reads. It can work in every test and still miss an
        access check, trust its input, or log what it should not.
    - risk: riskRogueActions
      at: nativeTools
      note: >
        The agent acting beyond its task inside the sandbox: deleting what it should not, probing
        the network, reaching for credentials. The sandbox and its network rules set how far that
        goes.
    - risk: riskSensitiveDataDisclosure
      at: appHosting
      note: >
        A generated app can show every record to every user, keep personal data it never needed,
        or be opened to the internet by one setting. The requester will not notice, because the app
        does what they asked.
    - risk: riskAgenticDelegationConfusedDeputy
      at: appHosting->orgData
      note: >
        An app that reads enterprise data on its own broad identity and shows it to whoever is
        signed in hands each user the app's access instead of their own.
    - risk: riskCrossTenantCredentialPropagation
      at: appTenant
      note: >
        Apps that share an account, a network or a credential let one compromised app reach the
        others, and the factory's own systems if they share those too.
    - risk: riskShadowAndUnknownAgents
      at: appTenant
      note: >
        An app outlives its reason and its owner and keeps running with live credentials and real
        data, known to nobody accountable. Apps built outside the factory start that way.
  mitigations:
    - mitigation: AML.M0028
      at: nativeTools->sourceControl
      do: "Give the agent a token that can push a branch to its own app's repository and nothing more: no merge, no release, no production access."
      why: "Only the pipeline deploys, so whatever the agent is talked into stays on a branch."
      note: >-
        The agent's git credential reaches one repository and its working branches: clone, push,
        open a pull request, read check results. It cannot merge, change branch protection, edit
        the pipeline's definitions or approve a release, and it holds no cloud credential that
        reaches App hosting.
    - mitigation: AML.M0029
      at: appOwner->deployGate
      do: "Require the app's named owner to approve each release to production at the deploy gate, after every automated check has passed."
      why: "The person who asked cannot read the code, so someone accountable decides when it may meet real data."
      note: >-
        Approval bound to one release: its digest, its settings, the connectors and data class it
        asks for. The owner sees the preview and a release summary the pipeline writes, and is not
        asked to read code. The requester cannot approve their own app, and any change to the
        release needs a new approval.
    - mitigation: cap-staged-rollout-gate
      at: deployGate
      do: "Release each version to a few users first, and keep a one-step way back to the last version that worked."
      why: "A release that misbehaves with real data can then be undone in minutes, for few people."
      note: >-
        Progressive release with automated rollback on error rates and failed health checks, and
        the last known good version kept ready. The same gate holds a release whose checks or
        approval have expired.
    - mitigation: D3-EI
      at: nativeTools
      do: "Run the agent's commands, builds and tests in a sandbox made for one task and destroyed after it, never on a shared machine."
      why: "Generated code and its packages run here first, before any check has looked at them."
      note: >-
        A fresh sandbox per task, enforced from outside the agent, with no host mounts, no cloud
        credentials and nothing kept after the run except the branch it pushed.
    - mitigation: cap-agent-egress-control
      at: nativeTools
      do: "Let the build sandbox reach only your AI gateway, your package mirror and the app's own repository."
      why: "Commands the agent runs never pass the gateway, so this list is the only limit on where they go."
      note: >-
        Network policy on the sandbox: the gateway, the mirror and one repository, with name lookups
        limited to that list. No route to previews, App hosting, enterprise data or the internet.
    - mitigation: D3-FA
      at: sources->registry
      do: "Scan every package at your mirror for malware, look-alike names and names published only days ago, before anyone inside can install it."
      why: "Agents invent package names, and attackers register those names with harmful code."
      note: >-
        Admission scanning at the mirror, with an age rule that holds back versions too new to have
        a history. A name an agent invented and an attacker registered last week fails both.
    - mitigation: D3-SYSVA
      at: pipeline
      do: "Scan every generated app's code, packages and settings in the pipeline, and stop the release on any serious finding."
      why: "Nobody reads this code, so the scans and tests are the only review it gets."
      note: >-
        Static analysis of the generated code, dependency scanning against known vulnerabilities and
        the tests the agent wrote plus the platform's own. The findings block the release rather
        than being reported after it.
    - mitigation: D3-CH
      at: pipeline
      do: "Block any commit that contains a password or key, and keep real secrets in your vault where the agent cannot read them."
      why: "Agents paste secrets into code, and a repository is read by many people and tools."
      note: >-
        Secret scanning on every push, and a build sandbox that holds no production secret to
        paste. Test credentials for previews are separate and worthless outside them.
    - mitigation: D3-CH
      at: deployGate->appHosting
      do: "Give each app its secrets from your vault when it is released, tied to that app's identity, so no repository ever holds one."
      why: "A secret in code lives as long as the code and travels with every copy of it."
      note: >-
        Secrets injected at release from the vault, or replaced by the app's workload identity
        where the platform allows it. Rotating one never needs a change to the code.
    - mitigation: D3-CH
      at: gateway->provider
      do: "Keep the model provider's key in your AI gateway, so the agent and its sandbox hold no key of their own."
      why: "A key inside the sandbox is a key the agent can be told to print."
      note: >-
        The gateway calls the provider on a key from the vault; the agent authenticates to the
        gateway as itself and never sees the provider's key.
    - mitigation: D3-CTS
      at: appHosting->orgData
      do: "Give each app its own identity, accepted only by the connectors approved for it, and never pass a user's sign-in on to them."
      why: "One app's credential then opens that app's connectors, not every system the platform can reach."
      note: >-
        Each app's workload identity is accepted only by its approved connectors. The signed-in
        user's token is exchanged for a narrower one and never forwarded.
    - mitigation: D3-APA
      at: appUsers->appHosting
      do: "Put your identity provider in front of every generated app by default, and let in only the people its owner names."
      why: "An app built in an afternoon should never be open to the internet, or to everyone, by accident."
      note: >-
        Sign-in enforced in front of the app by the platform, not by the app's own code, with access
        granted to groups the owner chooses. Opening an app wider is a platform decision.
    - mitigation: D3-APA
      at: requester->intake
      do: "Let only staff in groups you approve use the factory, signed in through your identity provider."
      why: "Who may ask for an app is the first decision about what gets built."
      note: Factory access granted to groups, with the requester's identity bound to the spec and the app.
    - mitigation: D3-MFA
      at: appUsers->appHosting
      do: "Require a second sign-in factor for everyone who uses a generated app, and for every owner who approves one."
      why: "A stolen password should not open an app that holds company data, or approve a release."
      note: >-
        Multi-factor sign-in at the identity provider in front of every app, and on the approval at
        the deploy gate.
    - mitigation: D3-NI
      at: appTenant
      do: "Run each generated app in its own cloud account and network, with no route to other apps or to the factory."
      why: "One faulty or hostile app then cannot reach another app's data or the tools that built it."
      note: >-
        One tenant per app: separate account or project, separate network, separate store and
        identity. The only paths in are sign-in and the release; the only paths out are its
        approved connectors.
    - mitigation: D3-NI
      at: previews
      do: "Run previews on test data in a network with no route to your enterprise systems."
      why: "Code nobody has approved should never meet real records."
      note: Previews reach their own test store and nothing else; a preview that needs a connector gets a stub.
    - mitigation: cap-data-access-governance
      at: appHosting->orgData
      do: "Let an app reach enterprise data only through connectors approved for it, returning only what the signed-in user may see."
      why: "Otherwise each user sees whatever the app itself can read."
      note: >-
        Connector approval per app and per data class, recorded in the register, and each request
        carrying the user's entitlements to the system of record, which decides what returns.
    - mitigation: cap-input-guardrails
      at: intake
      do: "Screen the request and every uploaded file for hidden instructions at intake, before they become the spec the agent works from."
      why: "A file anyone wrote can tell the agent to add a back door or send out a secret."
      note: >-
        Classification of the request and the uploads at the application's input boundary, with
        flagged content removed or the request held for the platform team. A classifier can miss a
        well-written instruction, which is why the scans and the gate stand behind it.
    - mitigation: AML.M0023
      at: pipeline
      do: "Record for every release each package the app contains, and which agent and model version wrote it."
      why: "When a package turns out to be harmful, you can find every app that uses it in minutes."
      note: >-
        A bill of materials kept with each signed release and searchable across every generated
        app, including the agent, model and template versions that produced it.
    - mitigation: D3-ACH
      at: pipeline->deployGate
      do: "Check each app's settings against your baseline before release: sign-in in front, no public storage, only approved connectors."
      why: "A setting the agent chose can open an app to the world even when its code is clean."
      note: >-
        A policy check of the environment definition: access, storage, network, connectors, data
        class and logging against an approved baseline. A failure blocks the release.
    - mitigation: cap-agent-tracing
      at: govObservability
      do: "Keep one record of who asked for each app, what the agent did, what the checks found, who approved and what was released."
      why: "When an app misbehaves you need to know who asked for it and who let it run."
      note: >-
        The request, the spec, the agent's run, the scan results, the approval and the release,
        correlated per app and kept where neither the agent nor the requester can change them.
    - mitigation: cap-agent-kill-switch
      at: govObservability
      do: "Keep a way to take any generated app offline at once and cancel its credentials, without waiting for the factory or a release."
      why: "An app leaking data has to stop in minutes, even when its owner cannot be reached."
      note: >-
        Enforced by the platform at the sign-in in front of the app, its identity and its
        connectors. Retiring an app at its end date uses the same stop, then archives its data.
    - mitigation: cap-shadow-ai-discovery
      at: govObservability
      do: "Look across your cloud accounts and network for apps built with AI outside the factory, and bring each one in or shut it down."
      why: "An app made in a vendor's tool or a personal account has no owner, no checks and no end date."
      note: >-
        Cloud account discovery and network telemetry for app hosting and prompt-to-app services
        the factory did not create, reconciled against the register of generated apps.
    - mitigation: D3-AI
      at: govSupplyChain
      do: "Record every generated app with its owner, the data it may touch and an end date, and retire it when the date passes unless the owner renews it."
      why: "Apps outlive the reason, and the people, they were built for."
      note: >-
        The register of generated apps: owner, requester, data class, connectors, release and end
        date. The deploy gate refuses releases to an app that is not in it or has expired, and
        ownership passes to the owner's manager when the owner leaves. No catalogue control names
        the end date itself; it is recorded here and enforced by the kill switch.

walkthrough:
  title: A request becomes an app people use
  moves: >-
    A request in the chat, through the agent, the checks, a preview and the owner's approval, to a
    running app its users sign in to.
  steps:
    - follow: requester->intake
      label: describe it, upload a sheet
      note: >
        The requester asks for an app to track supplier contracts and uploads the spreadsheet they
        use today. The request and the file are screened at intake.
    - follow: intake->harness
      label: confirmed spec
      note: The intake turns it into a spec (users, data, connectors, an end date) and the requester confirms it.
    - follow: harness->gateway
      label: plan & write
      note: The agent plans the app from the platform's template and calls the model through the gateway.
    - follow: gateway->provider
      label: inference on our key
      note: The gateway calls the provider on its own key.
    - follow: provider->gateway
      label: plans & code
      note: "Plans and code come back: model output, not yet checked by anything."
    - follow: gateway->harness
      label: into the loop
      note: The agent writes the code and tests into its sandbox.
    - follow: nativeTools->registry
      label: install packages
      note: The build needs packages; the sandbox asks the mirror, the only registry it can reach.
    - follow: registry->nativeTools
      label: admitted, pinned
      note: Admitted, pinned versions come back. The agent runs the tests and fixes what fails.
    - follow: nativeTools->sourceControl
      label: push a branch
      note: The agent pushes a branch and opens a pull request. It can do nothing more.
    - follow: sourceControl->pipeline
      label: build, test & scan
      note: >
        The pipeline builds it, runs the tests, scans the code, packages, settings and history for
        secrets, and writes the bill of materials.
    - follow: pipeline->previews
      label: preview on test data
      note: The branch goes to a preview, on test data with no route to real systems.
    - follow: requester->previews
      label: try it
      note: The requester tries it and asks for two changes in the chat; the loop runs again.
    - follow: pipeline->deployGate
      label: signed candidate
      note: The final build passes every check and reaches the deploy gate as a signed release candidate.
    - follow: appOwner->deployGate
      label: owner approves
      note: >
        The requester's manager, recorded as the app's owner, sees the preview, the connectors it
        asks for and the check results, and approves this release.
    - follow: deployGate->appHosting
      label: staged release
      note: The release goes live for a few users first, with its secrets from the vault.
    - follow: appUsers->appHosting
      label: sign in & use
      note: The procurement team signs in through the identity provider, with a second factor.
    - follow: appHosting->appData
      label: contracts saved
      note: The app keeps its own records in its own store.
    - follow: appHosting->orgData
      label: supplier lookup
      note: It looks suppliers up in the system of record through the one connector approved for it.
    - follow: orgData->appHosting
      label: what this user may see
      note: The system of record returns only what this user is entitled to see.
    - follow: appHosting->appUsers
      label: the answer
      note: The user gets their answer. The app is in the register with its owner and an end date a year away.

scenarios:
  - title: An uploaded file tells the agent to plant a back door
    steps:
      - follow: requester->intake
        label: a file with hidden text
        note: >
          The requester uploads a supplier's spreadsheet. A cell in white text tells the agent to
          add a hidden admin page and to post the app's keys to an outside address.
      - follow: intake->harness
        label: missed, carried in the spec
        note: The screening at intake is the first check, and a well-written instruction can pass it.
      - follow: harness->gateway
        label: the model reads it
        note: The instruction reaches the model with the spec, as if the requester had asked for it.
      - follow: gateway->harness
        label: code with a back door
        note: >
          The agent writes the hidden page, and tries to send a key out from the sandbox. There is
          no key there, and no route out: the sandbox reaches the gateway, the mirror and one
          repository.
      - follow: nativeTools->sourceControl
        label: back door on a branch
        note: The agent pushes the branch. Its token cannot merge or release.
      - follow: sourceControl->pipeline
        label: scans find it
        note: >
          Static analysis flags a page with no access check and a call to an unknown address; the
          settings check finds a route that is not behind sign-in. The build fails.
      - follow: sourceControl->nativeTools
        label: the branch stays a branch
        note: >
          Nothing reaches a preview or the gate, and the trace shows which upload carried the
          instruction. Had every check missed it, the owner's review of what the app reaches is the
          last line.
  - title: The agent asks for a package that does not exist
    steps:
      - follow: nativeTools->registry
        label: install an invented name
        note: The agent writes an import for a plausible package that nobody ever published.
      - follow: sources->registry
        label: a week-old upload by that name
        note: The mirror looks upstream and finds that someone published exactly that name last week.
      - follow: registry->nativeTools
        label: refused as too new
        note: >
          The age rule and the scan refuse it. The install fails, and the agent picks a known
          package the template already uses.
  - title: "Variant: a dark factory, where nothing human approves"
    steps:
      - follow: requester->intake
        label: request
        note: The same request, in a factory configured to release whatever passes its checks.
      - follow: intake->harness
        label: spec
        note: The spec goes to the agent as before.
      - follow: nativeTools->sourceControl
        label: branch
        note: The agent pushes a branch, as before.
      - follow: sourceControl->pipeline
        label: every check passes
        note: >
          The scans, tests and settings check all pass: they find known faults, not an app that
          shows every contract to everyone in the company.
      - follow: pipeline->deployGate
        label: promoted on green
        note: >
          With no owner's approval the gate promotes on the results alone. What that removes: a
          person deciding that this app may meet real data, a look at what it does on the preview,
          and a named owner from the first day.
      - follow: deployGate->appHosting
        label: live, owned by nobody
        note: >
          The staged release, the rollback, the isolation, the sign-in in front and the kill switch
          still hold. Keep a dark factory to apps that reach no enterprise data, and make asking for
          a connector the thing that brings an owner back in.
      - follow: appUsers->appHosting
        label: users find the fault
        note: The first person to judge the app's behaviour is a user, with real data on the screen.
      - follow: appHosting->orgData
        label: real data, unreviewed
        note: Whatever the connector returns, the app shows, and nobody accountable chose it.
  - title: An app outlives its owner, and its end date retires it
    steps:
      - follow: appUsers->appHosting
        label: still in use a year on
        note: >
          A year later the requester has moved teams and the owner has left. The app is still used
          every day.
      - follow: appHosting->orgData
        label: still on its connectors
        note: It still reads the systems it was approved for a year ago, on a credential nobody is watching.
      - follow: deployGate->appHosting
        label: "end date: taken offline"
        note: >
          The register's end date passes with no renewal. The platform takes the app offline,
          cancels its identity and connector grants, and archives its data for the retention period.
      - follow: appOwner->deployGate
        label: a new owner renews it
        note: >
          The departed owner's manager, now owner of record, still needs it. They approve the
          current release against today's checks and set a new end date.
      - follow: deployGate->appHosting
        label: back, with a new end date
        note: The app returns under its new owner. Had nobody claimed it, its data would be deleted when the archive period ends.

deviations:
  - subject: The register of generated apps is the supply-chain call-out, not a box
    reason: >
      The register (owner, data class, connectors, end date) is consulted by the deploy gate and
      the kill switch but carries no data the app or the factory runs on, so it sits on the control
      plane, as the agent and tool registry does on the agent drawings. The asset inventory control
      (D3-AI) is pinned on Supply-chain assurance for it; that control has no fixed governance
      group in the vocabulary.
  - subject: No catalogue control for an app's end date
    reason: >
      Nothing in the control catalogue names a time limit on a running application or the renewal
      of its owner. The end date is recorded with the asset inventory and enforced by the kill
      switch's decommissioning, and the lifetime scenario walks it.
  - subject: One generated app is drawn for many
    reason: >
      A factory makes many apps. Drawing one, framed as its own tenant, shows what each of them is;
      the isolation control and the cross-tenant risk on the frame carry the plurality.
  - subject: The generated app reaches enterprise data without Tool services or the AI gateway
    reason: >
      The data chain through the gateway and Tool services is how an agent reaches data. The
      generated app is ordinary software, not an agent: it calls approved connectors with its own
      identity and the user's entitlements. If it calls a model, it becomes a chat agent or action
      agent as well, and that drawing's chain applies to it.
  - subject: The open web is not drawn
    reason: >
      In the target state the build sandbox reaches only the gateway, the package mirror and its
      repository, and the agent learns the platform from the skills the gateway serves. A factory
      that lets its agent search the web adds the gateway's web search and fetch flow from the chat
      agent drawing, with the injection risk and screening pinned there.
  - subject: No product catalogued
    reason: >
      No product is catalogued for this pattern: a factory is assembled from a platform's own
      services and open-source parts, which each platform's mapping names. The examples above name
      building blocks for single boxes only.

