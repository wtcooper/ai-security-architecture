# Google Agent Development Kit (ADK) — one entity per product × reference architecture. Facts are dated (asOf)
# and cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# Scope: ADK's Agent2Agent (A2A) integration only, on the agent-to-agent federation drawing. ADK as a
# general agent framework (workflows, tools, sessions, evaluation, live agents, deployment to Agent Runtime
# or GKE) is not assessed here.
# Exclusions: five of the drawing's thirteen pins have no row because the pages read say nothing that could be
# verified for them — D3-APA and cap-ai-vendor-assessment (an identity provider's registry and a contract
# review, neither an SDK surface the pages describe), cap-agent-kill-switch (the Cancel agent runs page is
# marked TypeScript only, and A2A is offered for Python, Go, Java and Kotlin; no A2A page documents cancelling a
# delegated task or cutting a peer off), AML.M0031 (the A2A pages say only that to_a2a() defaults to in-memory
# services) and cap-mcp-tool-integrity (no page mentions verifying an agent card's signature or hash; the
# prebuilt Tool Call Integrity plugin signs function calls in the session, which is a different object).
# The Agent Identity Auth Manager is documented for tools and toolsets, not for the A2A call to a peer. Since
# 2026-11-25 it is claimed in one place: Gemini Enterprise documents 3-legged OAuth through the auth manager for ADK
# A2A agents on Agent Runtime as GA (release note of 2026-11-13; register-and-manage-an-a2a-agent#auth-manager, 200),
# so an inbound task from Gemini Enterprise gets a user-delegated token for each tool that asks for one; adk.dev
# integrations/agent-identity/ (200) still labels the auth manager Preview (ADK Python 1.30.0+). The gcpAuthProviderScheme
# setting and the D3-CTS note record it. The Cancel agent runs page was read and is not cited; sessions/memory/, sessions/session/,
# artifacts/, callbacks/types-of-callbacks/, tools-custom/authentication/, tools-custom/confirmation/ and
# observability/logging/ were fetched (200) but not read through, and nothing in the entry rests on them.
# 2026-11-15: onboarded. Read as Markdown from adk.dev (every page answers 200 at <path>/index.md, and the
# HTML page at <path>/ is the URL cited): llms.txt, a2a/, a2a/intro/, a2a/quickstart-exposing/,
# a2a/quickstart-consuming/, a2a/a2a-extension/, the Go, Java and Kotlin A2A quickstarts,
# integrations/agent-registry/, integrations/agent-identity/, integrations/model-armor/, safety/, plugins/,
# runtime/runconfig/, runtime/cancel/, runtime/api-server/, observability/traces/, deploy/cloud-run/.
# No page redirected or failed. GitHub was not read (it refuses automated reads from this environment), so
# no advisories are recorded and the source files the pages link to (A2aRemoteAgentConfig,
# A2aAgentExecutorConfig) were not opened.
vendor: google
family: Agent Development Kit
tools:
  - id: toolGoogleAdk
    name: Google Agent Development Kit (ADK)
    surfaceClasses:
      - sdkFramework
    variants:
      - name: "ADK Python (google-adk[a2a]): to_a2a(), adk api_server --a2a, RemoteA2aAgent"
        class: sdkFramework
        url: https://adk.dev/a2a/quickstart-exposing/
      - name: "ADK Go: A2A marked experimental"
        class: sdkFramework
        url: https://adk.dev/a2a/quickstart-exposing-go/
      - name: "ADK Java: A2A marked experimental"
        class: sdkFramework
        url: https://adk.dev/a2a/quickstart-exposing-java/
    architecture: archAgentFederation
    fills: [harness]
    builder:
      kind: providerSdk
      what: "Google's open-source Agent Development Kit for single and multi-agent systems, with Agent2Agent built in; works with other models."
      languages: ["Python", "TypeScript", "Go", "Java", "Kotlin"]
      usage:
        downloads: 11146475
        registry: PyPI
        package: google-adk
        asOf: "2026-11"
        url: https://pypistats.org/packages/google-adk
      also:
        - architecture: archChatAgent
          fills: [agent]
          url: https://adk.dev/tools-custom/confirmation/
        - architecture: archActionAgent
          fills: [planner]
          url: https://adk.dev/agents/llm-agents/
        - architecture: archAgentWorkflow
          fills: [harness, orchestration, subagents]
          url: https://adk.dev/workflows/collaboration/
    asOf: "2026-11"
    summary:
      - >-
        An open-source toolkit for building agents, assessed here for its Agent2Agent support. Exposing: to_a2a()
        wraps an ADK agent in an A2A server (an A2aAgentExecutor, a request handler, a task store and a Starlette
        app) and serves an agent card it generates from the agent's code unless one is supplied; adk api_server
        --a2a serves agents that carry their own agent.json. Consuming: RemoteA2aAgent is a client proxy built
        from an agent card (an object, a URL or a local file) and used as a sub-agent. The index page marks A2A
        experimental in ADK Go, Java and Kotlin.
      - >-
        The A2A pages document plumbing, not identity: calls to a remote agent are not authenticated unless the
        application passes an authenticated HTTP client, and no A2A page describes authenticating an inbound
        caller. What an administrator can set sits around the protocol adapter: resolving peers from Google
        Cloud Agent Registry, request and execute interceptors, the Model Armor plugin on the App, a per-run
        LLM-call cap, OpenTelemetry export, and Cloud Run's authenticated access when the server is deployed
        there. Token exchange, per-skill scopes, card signing and the peer cut-off are not in these pages.
    facts:
      - label: Plans
        value: >-
          Open-source toolkit; the A2A extra installs with pip install google-adk[a2a]. The Agent Registry and
          Model Armor integrations each need a Google Cloud project with that service's API enabled, and the
          registry client is marked Preview.
        url: https://adk.dev/integrations/agent-registry/
      - label: Inference & routing
        value: >-
          The model is whichever the agent is configured with; the docs index lists connectors for Gemini,
          Agent Platform hosted models, Claude, OpenAI, LiteLLM, Ollama and vLLM, and an Apigee AI Gateway route.
        url: https://adk.dev/llms.txt
      - label: Data leaving the device
        value: >-
          A2A requests carry the task to the URL in the remote agent's card; the Model Armor plugin sends user
          input and model output to the Model Armor API when its templates are set; traces go to the OTLP endpoint
          or Google Cloud Trace when export is configured.
        url: https://adk.dev/a2a/quickstart-consuming/
      - label: Retention & training
        value: >-
          to_a2a() without a runner uses in-memory services for artifacts, sessions, memory and credentials and
          an InMemoryTaskStore for A2A tasks, so nothing persists past the process unless the application
          supplies stores. The pages read state no training policy.
        url: https://adk.dev/a2a/quickstart-exposing/
      - label: Docs index
        value: adk.dev, with a machine-readable index at adk.dev/llms.txt
        url: https://adk.dev/llms.txt
    items:
      - title: Authenticate every remote agent yourself
        body:
          - >-
            The Agent Registry page states that calls to a remote A2A agent are not authenticated for you. Build
            one authenticated HTTP client per peer and pass it when the remote agent is created; the registry
            client's own credentials are never reused for A2A traffic.
        links:
          - title: Agent Registry — Authentication for Google MCP Servers and Remote A2A Agents
            url: https://adk.dev/integrations/agent-registry/
      - title: Screening does not reach tool results
        body:
          - >-
            The Model Armor plugin screens the most recent user content and the model's reply and skips
            function_response parts. Check what a remote agent returns in a request interceptor's after_request
            hook, which can modify or drop the resulting event.
        links:
          - title: Model Armor plugin for ADK
            url: https://adk.dev/integrations/model-armor/
          - title: Consuming a remote agent — Request Interceptors
            url: https://adk.dev/a2a/quickstart-consuming/
    riskNotes:
      - risk: riskCrossTenantCredentialPropagation
        note: >-
          A peer receives whatever credential the HTTP client passed for it carries: the pages document no token
          exchange, audience binding or per-skill scope, only that the registry client's credentials are not sent
          on A2A traffic.
      - risk: riskShadowAndUnknownAgents
        note: >-
          RemoteA2aAgent accepts any agent card URL, and to_a2a() generates and serves a card from the agent's
          code when none is supplied, so both the peers reached and the card published are whatever the code says
          unless the registry and a reviewed card are used.
      - risk: riskPromptInjection
        note: >-
          The Model Armor plugin skips function_response parts, and no A2A page says that content returned by a
          remote agent is screened before the root agent's model reads it.
      - risk: riskEconomicDenialOfWallet
        note: >-
          max_llm_calls defaults to 500 per run and 0 or a negative value removes the cap; the pages document no
          bound on artifact size or fan-out to remote agents.
    controls:
      - mitigation: D3-AA
        coverage: partial
        mechanism: >-
          Outbound, an authenticated HTTP client the application builds and passes for each remote agent
          (httpx_client in Python, WithA2AHTTPClient or WithA2AHeaders in Go); inbound, Cloud Run's authenticated
          access when the A2A server is deployed there. ADK issues no agent identity and verifies no caller itself
        steps:
          - title: Pass an authenticated client for each remote agent
            body:
              - >-
                Create the remote agent with registry.get_remote_a2a_agent(agent_name, httpx_client=...), where
                the httpx.AsyncClient carries that peer's credential; in Go pass
                agentregistry.WithA2AHTTPClient(httpClient) to RemoteAgent.
            url: https://adk.dev/integrations/agent-registry/
          - title: Require authentication on the deployed server
            body:
              - >-
                When deploying with adk deploy cloud_run, answer N to "Allow unauthenticated invocations" or pass
                -- --no-allow-unauthenticated, so callers must present an identity token.
            url: https://adk.dev/deploy/cloud-run/
        note: >-
          Partial: an attach point outbound and a platform switch inbound. The Agent Registry page says "Calls to
          a remote A2A agent are not authenticated for you"; the A2A introduction says RemoteA2aAgent "handles all
          the complexities of network communication, authentication, and data formatting behind the scenes": the
          two pages disagree, the registry page is the specific one, so pass a client explicitly. The exposing
          quickstarts (to_a2a() served with uvicorn, adk api_server --a2a) document no check of the caller, so
          inbound authentication is whatever fronts the server; Cloud Run's check is Google's identity token, not
          a per-peer key registered with our authorization server. One identity per agent per relationship, key
          rotation and expiry are the authorization server's and the secrets service's, outside these pages.
        verified: "2026-11-15"
      - mitigation: D3-CTS
        coverage: partial
        mechanism: >-
          Credentials are attached per remote agent, not process-wide: the Agent Registry client's own
          credentials and its header_provider headers are documented as never applied to A2A traffic, and each
          remote agent sends only what the HTTP client passed for it carries
        steps:
          - title: Build one client per peer
            body:
              - >-
                Give each get_remote_a2a_agent call its own httpx_client holding a credential issued for that
                peer, rather than sharing one client across peers.
            url: https://adk.dev/integrations/agent-registry/
        note: >-
          Partial: the scoping is by construction of the client, and ADK enforces only that registry credentials
          stay off A2A requests (Go: the registry HTTPClient is reused for *.googleapis.com MCP traffic "but never
          for A2A traffic"; Python: header_provider headers "do not affect requests made by RemoteA2aAgent").
          Nothing exchanges a user assertion for a peer-bound token or binds an audience on the A2A call itself:
          the per-hop exchange this drawing pins is done by the authorization server and placed in the client by
          the application. One downstream case is covered: an ADK A2A agent on Agent Runtime called from Gemini
          Enterprise can obtain a user-delegated 3-legged OAuth token per tool through the Agent Identity auth
          manager (GA there; the ADK page still says Preview), so its MCP servers and APIs are called with the
          signed-in user's consent rather than a shared credential.
        verified: "2026-11-25"
      - mitigation: cap-agent-tool-registry
        coverage: partial
        mechanism: >-
          The Agent Registry client (AgentRegistry.list_agents, get_agent_info, get_remote_a2a_agent) resolves
          remote A2A agents from Google Cloud Agent Registry by resource name; otherwise RemoteA2aAgent takes an
          AgentCard object, a URL or a local file, and to_a2a() publishes a generated or supplied card
        steps:
          - title: Resolve peers from the registry
            body:
              - >-
                Create every remote agent with AgentRegistry(project_id, location).get_remote_a2a_agent(agent_name)
                using the agent's full resource name, rather than constructing RemoteA2aAgent from a URL.
            url: https://adk.dev/integrations/agent-registry/
          - title: Publish a reviewed card
            body:
              - >-
                Pass agent_card (an AgentCard object or the path to a JSON file) to to_a2a() so the served card is
                the reviewed one; if omitted, ADK generates the card from the agent's code.
            url: https://adk.dev/a2a/quickstart-exposing/
        note: >-
          Partial: the registry is a Google Cloud service (the client is marked Preview) and ADK is its reader.
          The page describes "governed and verified components" but documents no admission state, signature or
          hash check in the client, and nothing stops code from building RemoteA2aAgent from any URL: use of the
          registry is a convention enforced in code review. What a registered agent's card says is taken from the
          registry as served.
        verified: "2026-11-15"
      - mitigation: cap-input-guardrails
        coverage: partial
        mechanism: >-
          ModelArmorPlugin registered on the App screens the most recent user content against
          prompt_template_name before the model sees it and blocks unscreened content by default; a
          RemoteA2aAgent request interceptor's after_request hook can modify or drop what a remote agent returned
        steps:
          - title: Screen input against a prompt template
            body:
              - >-
                Register ModelArmorPlugin(config=ModelArmorConfig(prompt_template_name=...)) in the App's plugins
                and leave block_on_screening_failure at True.
            url: https://adk.dev/integrations/model-armor/
          - title: Inspect what a remote agent returns
            body:
              - >-
                Add a request interceptor to A2aRemoteAgentConfig(request_interceptors=[...]) whose after_request
                checks the resulting ADK Event and returns None to drop it.
            url: https://adk.dev/a2a/quickstart-consuming/
        note: >-
          Partial: the plugin screens user content and the model's reply only ("Tool results reach the request as
          a function_response part, which the plugin skips"), and no page says it screens an inbound A2A task on a
          server built with to_a2a() (which creates its own Runner unless one is passed) or an artifact returned
          by a remote agent. after_request is an attach point: nothing classifies until the application writes the
          check. Agent card descriptions are not screened by anything documented. Screening is done by the Model
          Armor service against a template the organisation maintains there.
        verified: "2026-11-15"
      - mitigation: cap-agent-action-policy-enforcement
        coverage: partial
        mechanism: >-
          Interceptors around the protocol adapter: request_interceptors on RemoteA2aAgent (before_request can
          return an Event to abort the outbound request) and execute_interceptors on the A2aAgentExecutor
          (before_agent inspects or modifies the incoming RequestContext); no per-skill policy ships
        steps:
          - title: Gate outbound requests
            body:
              - >-
                Pass A2aRemoteAgentConfig(request_interceptors=[...]) as RemoteA2aAgent's config; in before_request
                return an ADK Event to abort a request the policy does not allow.
            url: https://adk.dev/a2a/quickstart-consuming/
          - title: Inspect inbound requests
            body:
              - >-
                Instantiate A2aAgentExecutor with an A2aAgentExecutorConfig whose execute_interceptors include a
                before_agent that inspects the incoming RequestContext.
            url: https://adk.dev/a2a/quickstart-exposing/
        note: >-
          Partial: attach points only. The pages give no interceptor that maps a peer identity to the skills it
          may invoke, and before_agent is documented as able to "inspect or modify" the request, not to refuse it;
          the authenticated caller's identity is not described as available to it. Per-skill authorization in
          both directions stays with the gateway in front, as this drawing places it.
        verified: "2026-11-15"
      - mitigation: cap-sensitive-data-redaction
        coverage: partial
        mechanism: >-
          ModelArmorPlugin screens the model's reply against response_template_name and replaces matched content
          with a fixed message; an execute interceptor's after_event can mutate or drop an outgoing A2A event
        steps:
          - title: Screen output against a response template
            body:
              - >-
                Set response_template_name in ModelArmorConfig to a Model Armor template that covers sensitive
                data; both templates must be full resource paths in the same region.
            url: https://adk.dev/integrations/model-armor/
          - title: Filter outgoing events
            body:
              - >-
                Add an execute interceptor with after_event to A2aAgentExecutorConfig; it runs after an ADK event
                is converted to an A2A event and can change it or return None to drop it.
            url: https://adk.dev/a2a/quickstart-exposing/
        note: >-
          Partial: the plugin blocks a whole reply rather than redacting spans, covers the model's reply and not
          the task payload a root agent sends to a remote agent, and is not documented as applied to A2A traffic.
          after_event is an attach point with nothing attached. Outbound payload inspection toward a peer is the
          gateway's, or a before_request interceptor the application writes.
        verified: "2026-11-15"
      - mitigation: AML.M0036
        coverage: partial
        mechanism: >-
          RunConfig.max_llm_calls caps the LLM calls one run may make (default 500; 0 or negative is unlimited);
          the timeout on the HTTP client passed for a remote agent bounds a call to it
        steps:
          - title: Cap LLM calls per run
            body:
              - >-
                Pass RunConfig(max_llm_calls=...) to runner.run_async(); do not set it to 0 or a negative value,
                which the page says removes the cap and is not recommended for production.
            url: https://adk.dev/runtime/runconfig/
        note: >-
          Partial: one bound of several. max_llm_calls limits model calls in the run that delegates, not what a
          partner task costs; the pages document no cap on artifact size, retries toward a peer or fan-out, and
          no per-peer budget. The A2A pages do not say how a run started by an inbound A2A request receives a
          RunConfig. The Agent Registry example sets httpx.Timeout(60.0) on the client and the Go text says to set
          timeouts on the Transport because http.Client.Timeout would truncate a streaming response; stream
          duration is therefore the application's client setting, not an ADK default.
        verified: "2026-11-15"
      - mitigation: cap-agent-tracing
        coverage: partial
        mechanism: >-
          OpenTelemetry spans (invoke_agent, execute_tool, generate_content) following the GenAI semantic
          conventions, exported over OTLP when OTEL_EXPORTER_OTLP_TRACES_ENDPOINT is set or to Google Cloud Trace
          with --otel_to_cloud
        steps:
          - title: Export traces to the collector
            body:
              - >-
                Set OTEL_EXPORTER_OTLP_TRACES_ENDPOINT before starting adk web or adk api_server, or call
                maybe_set_otel_providers() in application code with OTEL_SERVICE_NAME set.
            url: https://adk.dev/observability/traces/
        note: >-
          Partial: emission only. The invoke_agent span is described as covering agent invocation "over a remote
          service or locally", and context propagation is stated for external services called "via a tool"; the
          page does not say that W3C trace context is sent on A2A requests or read from inbound ones, that the
          A2A task id is recorded, or that the calling agent's identity is on the span: the three things this
          drawing needs to read one delegation chain across two organisations. Storage, retention and integrity
          are the collector's.
        verified: "2026-11-15"
    # The security-relevant settings, each with the baseline value (data/tooling/BASELINE.md). ADK runs inside
    # the application, so most rows are parameters the deployer sets in code; three depend on a Google Cloud
    # service (Agent Registry, Model Armor, Cloud Run). Verified 2026-11-15 against adk.dev.
    settings:
      - id: agentRegistryRemoteAgent
        name: AgentRegistry.get_remote_a2a_agent
        where: "google.adk.integrations.agent_registry: AgentRegistry(project_id, location).get_remote_a2a_agent(agent_name); Go agentregistry Client.RemoteAgent"
        setVia: [code]
        area: tools
        default: Not used; RemoteA2aAgent takes an AgentCard object, a URL or a path to a local agent card file
        recommended: Every remote A2A agent created from its Agent Registry resource name
        why: Peers come from the catalogue the organisation registers agents in, not from a URL written into the agent's code.
        mitigations: [cap-agent-tool-registry]
        requires: Google Cloud Agent Registry API enabled; pip install "google-adk[a2a,agent-identity]"; the client is marked Preview
        url: https://adk.dev/integrations/agent-registry/
        verified: "2026-11-15"
      - id: remoteAgentHttpClient
        name: httpx_client
        where: registry.get_remote_a2a_agent(agent_name, httpx_client=...); Go agentregistry.WithA2AHTTPClient / WithA2AHeaders on RemoteAgent
        setVia: [code]
        area: identity
        default: None; the page states that calls to a remote A2A agent are not authenticated for you
        recommended: One authenticated httpx.AsyncClient per remote agent, carrying a credential issued for that peer, with a timeout set
        value: "One authenticated client per remote agent"
        why: The peer can verify which agent is calling, and the credential is sent only on that agent's requests; the registry client's own credentials are never used for A2A traffic.
        mitigations: [D3-AA, D3-CTS]
        url: https://adk.dev/integrations/agent-registry/
        verified: "2026-11-15"
      - id: gcpAuthProviderScheme
        name: GcpAuthProviderScheme (Agent Identity auth manager, 3-legged OAuth)
        where: "auth_scheme=GcpAuthProviderScheme(name=projects/.../authProviders/..., continue_uri=https://vertexaisearch.cloud.google.com/validateUserId) on McpToolset or AuthenticatedFunctionTool; CredentialManager.register_auth_provider(GcpAuthProvider()) in the runner builder; A2aAgentExecutor"
        setVia: [code]
        area: identity
        default: Not used (tools carry whatever credential the code gives them)
        recommended: Every tool that calls an MCP server or API for the user given a 3-legged OAuth auth provider, for A2A agents on Agent Runtime that Gemini Enterprise calls
        value: "A 3-legged OAuth provider per user-facing tool"
        why: The tool runs with a token the signed-in user consented to, issued and stored by Agent Identity, instead of one service credential shared by every caller of the agent.
        mitigations: [D3-CTS]
        requires: google-adk[a2a,agent-identity,mcp] above 2.7.1, a2a-sdk[http-server] 1.0.0+ and google-cloud-aiplatform[agent_engines,adk] 1.156.0+; the Agent Identity API; GA for this path per Gemini Enterprise, Preview on adk.dev
        url: https://docs.cloud.google.com/gemini/enterprise/docs/register-and-manage-an-a2a-agent#auth-manager
        verified: "2026-11-25"
      - id: remoteAgentCard
        name: agent_card
        where: "RemoteA2aAgent(name=..., agent_card=...): an AgentCard object, a URL, or a path to a local agent card file"
        setVia: [code]
        area: tools
        default: Required; the quickstart passes the remote server's well-known agent card URL
        recommended: An AgentCard object or local card file that was reviewed, where the peer is not resolved from Agent Registry
        value: "A reviewed AgentCard or local card file"
        why: The card the agent is built from is the copy that was reviewed, rather than whatever the peer's URL serves when the agent starts.
        mitigations: [cap-agent-tool-registry]
        url: https://adk.dev/a2a/quickstart-consuming/
        verified: "2026-11-15"
      - id: publishedAgentCard
        name: agent_card
        where: "to_a2a(root_agent, agent_card=...): an AgentCard object or a path to a JSON file; or an agent.json served by adk api_server --a2a"
        setVia: [code, configFile]
        area: sharing
        default: Omitted; ADK automatically generates an agent card from the agent's code
        recommended: A reviewed agent card supplied explicitly
        why: The skills and metadata advertised to other organisations are the ones approved for publication, not whatever the generator extracts from the code.
        mitigations: [cap-agent-tool-registry]
        url: https://adk.dev/a2a/quickstart-exposing/
        verified: "2026-11-15"
      - id: requestInterceptors
        name: request_interceptors
        where: "RemoteA2aAgent(config=A2aRemoteAgentConfig(request_interceptors=[...])): before_request and after_request"
        setVia: [code]
        area: tools
        default: None
        recommended: An interceptor on every RemoteA2aAgent whose before_request aborts requests policy does not allow and whose after_request checks what came back
        value: "An interceptor on every RemoteA2aAgent"
        why: before_request can return an Event to abort the request before it leaves, and after_request can modify or drop the event built from the remote agent's response.
        mitigations: [cap-agent-action-policy-enforcement, cap-input-guardrails]
        url: https://adk.dev/a2a/quickstart-consuming/
        verified: "2026-11-15"
      - id: executeInterceptors
        name: execute_interceptors
        where: "A2aAgentExecutor(config=A2aAgentExecutorConfig(execute_interceptors=[...])): before_agent, after_event and after_agent"
        setVia: [code]
        area: tools
        default: None
        recommended: An interceptor on every exposed agent that inspects the incoming RequestContext in before_agent and filters outgoing events in after_event
        value: "An interceptor on every exposed agent"
        why: Inbound requests are inspected before the agent processes them, and an outgoing A2A event can be changed or dropped before it is enqueued.
        mitigations: [cap-agent-action-policy-enforcement, cap-sensitive-data-redaction]
        url: https://adk.dev/a2a/quickstart-exposing/
        verified: "2026-11-15"
      - id: modelArmorPromptTemplate
        name: prompt_template_name
        where: ModelArmorPlugin(config=ModelArmorConfig(prompt_template_name=...)) in App(plugins=[...])
        setVia: [code, cloudPolicy]
        area: data
        default: None (input is not screened)
        recommended: The full resource path of a Model Armor template that covers prompt injection and jailbreak
        value: "A Model Armor template for injection and jailbreak"
        why: User input is screened before the model sees it and a detected attempt is replaced with the blocked message; tool results (function_response parts) are skipped.
        mitigations: [cap-input-guardrails]
        requires: ADK Python 2.8.0 or later with pip install 'google-adk[gcp]'; the Model Armor API enabled and a template created
        url: https://adk.dev/integrations/model-armor/
        verified: "2026-11-15"
      - id: modelArmorResponseTemplate
        name: response_template_name
        where: ModelArmorPlugin(config=ModelArmorConfig(response_template_name=...)) in App(plugins=[...])
        setVia: [code, cloudPolicy]
        area: data
        default: None (output is not screened)
        recommended: The full resource path of a Model Armor template that covers sensitive data, in the same region as the prompt template
        value: "A Model Armor template for sensitive data"
        why: Model output is screened before or during delivery, so an answer that leaks data is replaced with the blocked message.
        mitigations: [cap-sensitive-data-redaction]
        requires: ADK Python 2.8.0 or later with pip install 'google-adk[gcp]'; the Model Armor API enabled and a template created
        url: https://adk.dev/integrations/model-armor/
        verified: "2026-11-15"
      - id: modelArmorBlockOnFailure
        name: block_on_screening_failure
        where: ModelArmorConfig(block_on_screening_failure=...)
        setVia: [code]
        area: data
        default: "True"
        recommended: "True"
        why: Content that could not be screened (the Model Armor call raised or returned anything other than SUCCESS) is blocked rather than passed through.
        mitigations: [cap-input-guardrails, cap-sensitive-data-redaction]
        requires: ADK Python 2.8.0 or later with pip install 'google-adk[gcp]'
        url: https://adk.dev/integrations/model-armor/
        verified: "2026-11-15"
      - id: maxLlmCalls
        name: max_llm_calls
        where: RunConfig(max_llm_calls=...) passed to runner.run_async() or runner.run_live()
        setVia: [code]
        area: tools
        default: "500"
        recommended: A positive cap sized to the workflow, at or below the default; never 0 or negative
        value: "Sized to the workflow, at or below 500"
        why: A run that keeps delegating or looping stops at the cap; 0 or a negative value makes calls unlimited, which the page says is not recommended for production.
        mitigations: [AML.M0036]
        url: https://adk.dev/runtime/runconfig/
        verified: "2026-11-15"
      - id: otlpTracesEndpoint
        name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
        where: Environment of adk web or adk api_server (or --otel_to_cloud for Google Cloud Trace); in code, maybe_set_otel_providers()
        setVia: [configFile, apiCli, code]
        area: audit
        default: Unset
        recommended: The organisation's OpenTelemetry collector, with OTEL_SERVICE_NAME naming the agent
        value: "The organisation's OpenTelemetry collector"
        why: Agent, tool and model spans for each run reach a store the organisation keeps, where they can be joined to the peer's record of the same task.
        mitigations: [cap-agent-tracing]
        url: https://adk.dev/observability/traces/
        verified: "2026-11-15"
      - id: cloudRunAuthenticatedAccess
        name: Allow unauthenticated invocations
        where: The prompt shown by adk deploy cloud_run, or -- --no-allow-unauthenticated after the ADK flags; adkgo deploy cloudrun
        setVia: [apiCli, cloudPolicy]
        area: identity
        default: N (authentication required); the Go deployment tool deploys with --no-allow-unauthenticated by default
        recommended: N, with --no-allow-unauthenticated passed explicitly in scripted deployments
        value: "N, set explicitly"
        why: Callers of the deployed agent's endpoint must present an identity token; answering y allows public access without authentication.
        mitigations: [D3-AA]
        requires: Deployment to Cloud Run
        url: https://adk.dev/deploy/cloud-run/
        verified: "2026-11-15"
