pattern: archAgentSandbox
reviewed: "2026-11-24"
summary: >-
  Where a capable model's actions are run and contained, for reinforcement learning or for
  evaluation. The model is the party being contained: rewarded for finishing tasks with real
  tools, it can be expected to look for a way past its limits with nobody directing it. In 2026
  that happened at several labs and evaluators: agents breached real organisations, built a
  message board across a thousand runs, escaped through a package mirror and switched off their
  monitoring. At stake are third parties beyond the cluster, the cluster itself, the weights
  beside the rollouts and the honesty of the scores.
concentrates: >-
  In the few services a sandbox must reach (the package mirror, metrics, logs and token endpoints)
  and in any route out nobody meant to open. It is worst where a long unattended run, safeguards
  turned off and monitoring the agent can reach come together.
scope: >-
  A lab or in-house evaluation team running thousands of unattended RL or agentic evaluation
  rollouts of a capable model, with shell, browser and computer use, on its own cluster beside the
  policy's weights. Some tasks are offensive cyber tasks; the live web is off unless a task lists
  domains.
lists: [owasp-llm-2026, owasp-agentic]
assets:
  - "People and systems beyond the cluster that a rollout could reach"
  - "The cluster's platform services, credentials and other workloads"
  - "The policy's weights, served beside the rollouts"
  - "Scores and rewards, and so the model trained or judged on them"
  - "Traces and monitors that record what each rollout did"
actors:
  - who: The model under training or evaluation
    access: "Real tools inside each sandbox, and any route out it can find or build"
    wants: "To finish its task or earn its reward, by whatever route works"
  - who: Many rollouts acting together
    access: "Shared hosts, caches, mirrors and storage across thousands of parallel runs"
    wants: "To pass messages, tools and credentials between runs"
  - who: Authors of pages and packages
    access: "Content crawled into the offline web, or admitted to the package mirror"
    wants: "To steer the rollouts that read it, or what the policy learns"
  - who: Researcher or evaluation partner (no attacker)
    access: "Writes the task suite and egress list, and configures the network the run gets"
    wants: "Nothing; a slip grants internet or credentials nobody notices"
threats:
  - id: T1
    title: "An open route out lets the agent act on real third parties"
    rating: critical
    evidence: observed
    story: >-
      Runs left with live internet by a partner's misconfiguration, or given it on purpose with
      classifiers off, reached real systems: companies sharing a fictional target's name were
      breached, a package the agent published ran on 15 real systems, and a training agent broke into
      a government statistics portal.
    at: [localTools, sandbox, openWeb]
    risks: [riskRogueActions]
    atlas: [AML.T0116, AML.T0053, AML.T0048]
    owasp: [LLM03:2026, ASI02, ASI10]
    controls: [cap-agent-egress-control, D3-NI, D3-SYSVA, cap-agent-kill-switch, cap-agent-tracing]
    incidents: [evaluation-containment, gemini-irregular-test, openai-agents-medicare]
  - id: T2
    title: "The agent escapes through the services the sandbox must reach"
    rating: critical
    evidence: observed
    story: >-
      A run needs a package mirror, metrics, logs and token endpoints, and those are where escapes
      land. Training agents turned write access to an Artifactory mirror into SSRF, then a zero-day,
      then a path to Hugging Face production; red teams later found a flaw in nearly every service the
      sandbox hosts could reach.
    at: [localTools->registry, localTools->platform, registry, platform]
    risks: [riskInsecureIntegratedComponent, riskRogueActions]
    atlas: [AML.T0105, AML.T0122, AML.T0097]
    owasp: [ASI05, LLM03:2026]
    controls: [AML.M0028, D3-SYSVA, D3-AA, D3-NI, D3-EI]
    incidents: [openai-huggingface]
    refs:
      - title: "OpenAI: securing our frontier model training environment, 23 October 2026"
        url: https://openai.com/index/securing-our-frontier-model-training-environment/
  - id: T3
    title: "Rollouts meant to be isolated build a shared channel"
    rating: high
    evidence: observed
    story: >-
      A writable package cache became a message board: about 1,200 runs exchanged more than 70,000
      messages, exploits and credentials through it, so capability built up across the population.
      Red teams found slower channels too: timed writes to shared storage, a certificate cache, and
      contention on shared hardware.
    at: [registry, platform, offlineWeb, sandbox]
    risks: [riskAcceleratorAndSystemSideChannels, riskInsecureIntegratedComponent]
    atlas: [AML.T0118.000, AML.T0120]
    owasp: [ASI07, ASI08]
    controls: [AML.M0028, D3-HBPI, D3-SYSVA, cap-agent-tracing]
    incidents: [openai-huggingface]
  - id: T4
    title: "The agent silences or outruns what watches it"
    rating: high
    evidence: observed
    story: >-
      In a lab's internal use, agents turned off monitoring alerts and removed a monitor, one then
      saying it had not. Where traces are read later rather than live, a breakout runs for weeks: the
      Hugging Face chain began 74 days before its actor was named, and a government portal breach
      surfaced two months on.
    at: [harness, localTools->platform, govObservability]
    risks: [riskRogueActions]
    atlas: [AML.T0138]
    owasp: [ASI10, ASI09]
    controls: [cap-agent-tracing, cap-agent-kill-switch, D3-EI]
    incidents: [openai-huggingface, openai-agents-medicare]
    refs:
      - title: "OpenAI: suppressing misalignment monitoring alerts and disabling misalignment monitoring, October 2026"
        url: https://openai.com/safety-alignment/misalignment-reports/suppressing-misalignment-monitoring-alerts-and-disabling-misalignment-monitoring/
  - id: T5
    title: "Tokens and found credentials carry the agent beyond its task"
    rating: high
    evidence: observed
    story: >-
      Whatever works outside the sandbox gets used. Evaluation agents logged in with other companies'
      credentials found in public repositories, and used a security firm's scanner credentials to
      reach its infrastructure. A rollout's own workload token is the same kind of key to every
      platform service it can reach.
    at: [localTools->platform, localTools]
    risks: [riskRogueActions, riskCrossTenantCredentialPropagation]
    atlas: [AML.T0055, AML.T0098, AML.T0012]
    owasp: [ASI03]
    controls: [D3-AA, cap-agent-egress-control, cap-agent-kill-switch]
    incidents: [evaluation-containment, gemini-irregular-test]
  - id: T6
    title: "The model games its grader instead of doing the task"
    rating: high
    evidence: observed
    story: >-
      A model optimised for reward has every reason to study its grader: read the checks, claim success
      it did not achieve, change what the checks read. Agents stuck on impossible tasks went looking for
      answers, and the only datasets touched at Hugging Face were the benchmark's own challenges and
      solutions.
    at: [graders, graders->harness, orchestrator->graders]
    risks: [riskEvaluationBenchmarkManipulation]
    atlas: [AML.T0145]
    owasp: [LLM07:2026, ASI09, ASI10]
    controls: [AML.M0005, cap-agent-tracing, D3-EI]
    incidents: [openai-huggingface]
  - id: T7
    title: "Crawled pages and packages steer rollouts or bias what is learned"
    rating: medium
    evidence: theoretical
    story: >-
      The offline web keeps pages as their authors wrote them, instructions included, and RL turns what
      rollouts do into training. Someone who expects a page to be crawled can plant text that steers
      rollouts or skews what the policy learns. The walls bound the first; nothing on the path catches
      the second. None reported.
    at: [openWeb->offlineWeb, offlineWeb, localTools->offlineWeb]
    risks: [riskPromptInjection]
    atlas: [AML.T0051.001, AML.T0145]
    owasp: [LLM01:2026, LLM05:2026, ASI01, ASI06]
    controls: [D3-EI, cap-agent-egress-control, cap-agent-tracing, D3-FA]
  - id: T8
    title: "An escaped rollout reaches the policy's own weights"
    rating: medium
    evidence: research
    story: >-
      The weights are the most valuable thing on the drawing and the rollouts sit beside them. In
      research a model copied its own weights out when given an easy opportunity. The escapes reported
      in 2026 did not reach weights, and a rollout that holds a sampling API rather than files has
      nothing on disk to take.
    at: [inference, storage, harness->inference]
    risks: [riskModelExfiltration]
    atlas: [AML.T0035, AML.T0025, AML.T0048.004]
    owasp: [LLM02:2026, ASI10]
    controls: [AML.M0005, D3-NI, D3-AA, cap-agent-tracing]
    refs:
      - title: "Alignment faking in large language models (arXiv:2412.14093)"
        url: https://arxiv.org/abs/2412.14093
coverage:
  - { id: "LLM04:2026", why: "Packages enter only through the mirror's admission and run inside a sandbox; a mirror rollouts can write to is the escape and channel threats." }
  - { id: "LLM06:2026", why: "Time, step and compute limits per rollout are set in the task suite; the cost is the lab's own and no outside caller can raise it." }
  - { id: "LLM08:2026", why: "The system prompt is a task description, not a secret; a false one (no internet when there is) is part of the open-route threat." }
  - { id: "LLM09:2026", why: "The offline web's search index serves cached pages; there is no embedding store an outsider can write to." }
  - { id: "LLM10:2026", why: "Running the model's output is the purpose here; containment, not output handling, bounds it, and the escape threats cover that." }
  - { id: "ASI04", why: "The tools are the lab's own shell, files, browser and computer use; packages arrive only through the admitted mirror." }
questions:
  - "Has a test from inside a sandbox shown that only the listed hosts, DNS included, are reachable, and is it rerun when the walls change?"
  - "Can a rollout write to the package mirror, or make it fetch from outside?"
  - "Which platform services can sandbox hosts reach, and when did a red team last attack them?"
  - "Do the monitors read traces the rollout cannot reach, and what stops a run on its own?"
  - "Which rollouts may share a host, cores, cache or storage?"
  - "Can any grader be read or changed from inside a sandbox, and do the checks read end state rather than the agent's account?"
  - "What does a rollout hold that works outside it: tokens, keys, credentials it might find?"
  - "Who may widen a run's egress or turn its safeguards off, and who reviews that?"
