        summary: "The supervisor and specialists run as pods on Amazon EKS. Lambda's checkpoint-and-replay engine does not come with the cluster, so the journal moves to an engine you add: for example an AWS Step Functions Standard workflow started by EventBridge, with the agent pods as activity workers and a task token for operator approval. You also carry node and image patching, scaling, pod identity, network policy and telemetry, which Lambda ran."
        bindings:
          - { block: events, service: "Amazon EventBridge, SQS and EventBridge Pipes", note: "A rule, or a pipe from the queue, starts a state machine execution under an IAM role; nothing invokes the pods.", url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-pipes-event-target.html }
          - { block: harness, service: "Your agents in pods on Amazon EKS", note: "Each agent can run as its own Deployment with its own service account and Pod Identity role, so a principal per agent can be an IAM role as well as a token.", url: https://docs.aws.amazon.com/eks/latest/userguide/pod-identities.html }
          - { block: orchestration, service: "Your supervisor agent, on AWS Step Functions tasks", note: "A Standard workflow records each step for up to a year; agent pods poll for work as activity workers, and .waitForTaskToken pauses for an operator.", url: https://docs.aws.amazon.com/step-functions/latest/dg/concepts-activities.html }
          - { block: state, service: "Step Functions execution history and AgentCore Memory", note: "Execution history is the step journal, readable for 90 days after a run completes; Bedrock Knowledge Bases stays the vector index.", url: https://docs.aws.amazon.com/step-functions/latest/dg/choosing-workflow-type.html }
        dropSettings: [lambdaInvokePolicy, durableConfig, durableCallbackApproval, lambdaVpcConfig, durableStopExecution]
        addSettings: [eksPodIdentity, eksNetworkPolicy, eksImdsHopLimit, eksAppNetworkPolicy, eksIsolatedPods, eksAgentQuarantine, eksClusterAccessEntries, eksControlPlaneLogs, eksPrivateEndpoint, sfnStartExecutionRole, sfnTaskTokenApproval, sfnStopExecution, sfnEncryptionConfig]
        dropDifferences: [events->harness, operator->events]
        alsoNeeded:
