          account (Enterprise, beta); the owner stops, pauses or deletes their own tasks
        steps:
          - title: Disable cloud sessions
            body:
              - Turn off "Run Cowork in the cloud", or "Enable for your organization" for the whole product, at
                Organization settings > Cowork.
            url: >-
              https://support.claude.com/en/articles/13455879-use-claude-cowork-on-team-and-enterprise-plans
          - title: Refuse inference for an account (Enterprise, beta)
            body:
              - With Inference hooks enforcing, have your AI security server deny that user's requests; turning
                enforcement on or off reaches every Anthropic server in about a minute.
            url: https://platform.claude.com/docs/en/manage-claude/inference-hooks-configuration
        note: >-
          Partial by the rule: whether switching cloud sessions off stops a running session or a scheduled task
          is not documented (delay not documented; role changes take up to 15 minutes; network changes reach new
          sessions only). Only the owner can stop a task or pause and delete a scheduled one. An Inference hooks
          deny refuses the next request without terminating the session or cancelling queued runs, and setting a
          group's pooled budget to $0 freezes its usage on usage-based Enterprise. No EDR complement exists,
          because the sessions run off every endpoint.
