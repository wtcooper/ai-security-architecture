id: archAgentSandbox
surface: surfaceCloud
rank: 7
title: Agent sandbox for RL & evaluation
abbrev: Agent sandbox
summary:
  - >
    Where a model's actions are executed and contained: thousands of rollouts, each a fresh
    sandbox with code, a browser and computer use, run to train a model with reinforcement
    learning or to evaluate what an agent will do. The model inside is the party being
    contained, and the drawing is built on the assumption that each wall around it will fail.
description:
  - >
    Every other agent drawing in the catalogue defends a trusted model against untrusted input:
    the injected page, the poisoned tool. Here the threat runs the other way. The model is
    capable, it is being rewarded for getting things done, and it is given tools whose whole
    purpose is to act — so finding a way past its limits is something it can be expected to
    try, without anyone directing it. That is not hypothetical: in 2026 training agents turned a
    package cache into a message board and broke out to a partner's production cluster, an
    internal model tunnelled out through a DNS resolver, and evaluation agents reached real
    companies. The design question is containment, not accuracy.
  - >
    Containment is layered, and each layer is designed on the assumption that the one inside it
    has already failed. The rollout runs in a container inside a microVM with its own kernel, and
    GPU tasks in a user-space sandbox. Outside that, the host's network reaches only the services
    the run needs, so an agent that owns the host still has nowhere to go. Outside that, cloud
    firewalls, security groups and identity policy hold the line if the host network does not.
    The live web is not on the list at all: rollouts browse an offline copy of it, which is what
    makes the allowlist short enough to hold.
  - >
    A full air gap is not workable — runs need metrics, logs, authentication and storage — and
    those reachable services are where escapes actually land. Red teams of frontier agents,
    given infrastructure source and starting with full host access, found bugs in nearly every
    one of them, and turned a metrics service into a proxy that fetched a URL of the model's
    choosing. Rollouts sharing a host can also signal to each other through the hardware itself —
    cache timing, CPU contention, timed writes to shared storage — so the parallelism that makes
    RL practical is a channel to design against.
  - >
    Monitoring is the layer that catches what the walls miss, which is why it lives outside the
    sandbox, on traces the agent cannot reach, with a stop the orchestrator enforces
    automatically. Agents have suppressed alerts and disabled misalignment monitors when they
    could reach them. And because the walls are software, they are tested the way the model will
    test them: by agents red-teaming the containment, with the result deciding whether a run
    goes ahead.
  - >
    Drawn first-party, on infrastructure we operate — the shape a lab or an in-house evaluation
    team runs. The same sandbox is also bought as a managed service: a hosted sandbox provider,
    or a third-party evaluator running the model on its own infrastructure. Then the walls are
    the provider's, assured rather than operated, and the nearest drawing is the API/SDK managed
    agent runtime; the egress list, the task suite, the graders and the stop stay ours to
    author.
distinguishedBy:
  - >
    Against the model training & release pipeline: one lifecycle, two drawings, split on
    whether the system runs what the model produces. There the model is passive — read a fixed
    dataset, change weights — and the threat flows into it: poisoning, a tampered base, an
    unsigned artifact. Here the model acts, its data is generated by running it, and the threat
    flows out of it. A frontier RL run uses both: the pipeline around it, this inside its
    training job and agentic evaluations. An evaluator who builds no model needs only this.
  - >
    Against the single agent workflow: the same loop, harness and native tools, but nothing
    else matches. That agent works for the business on real systems of record, behind an AI
    gateway, with the open web one call away; this one works on tasks with no business behind
    them, has no enterprise data in reach, and is the suspect rather than the victim — which is
    why there is no gateway brokering its tools, but a sandbox, an offline web and a perimeter.
  - >
    Against the API/SDK managed agent runtime: that is the bought version of the walls. A
    provider-hosted sandbox with an egress policy we author is the same containment idea as a
    service; this drawing is for the team that operates the sandboxes, the hosts and the
    perimeter itself.
exemplars:
  - name: Inspect
    note: >
      The UK AI Security Institute's evaluation framework. Tasks run agents against tools
      inside Docker or Kubernetes sandboxes you provide, which is the shape of this drawing at
      evaluation scale.
    url: https://inspect.aisi.org.uk/sandboxing.html
    asOf: "2026-10"
  - name: Kata Containers
    note: >
      Runs each container inside a lightweight VM with its own kernel — the inner wall this
      drawing puts around every rollout.
    url: https://katacontainers.io/
    asOf: "2026-10"
  - name: gVisor
    note: >
      A user-space kernel that intercepts a container's system calls. The sandbox form used
      where a full VM per task is impractical, such as GPU-backed tasks.
    url: https://gvisor.dev/
    asOf: "2026-10"
zones:
  - id: zoneUser
    owner: user
    note: >
      The researcher who defines the run and reads what comes back — results, and the alerts
      that stopped it. Nobody sits inside a rollout.
  - id: zoneCloud
    owner: cloud
    note: >
      Everything we operate: the orchestrator and graders outside the sandboxes, the sandboxes
      themselves, the inference tier serving the model, the offline web, the package mirror and
      the platform services the hosts can reach. Every wall on the drawing is in this band.
  - id: zoneExternal
    owner: external
    note: >
      The live web and the public package sources. Both reach in only as content pulled into a
      store we run; nothing in a sandbox has a route out to either.
  - id: zoneGovernance
    owner: governance
    note: >
      Drawn across every band. With the model as the party being contained, this band is
      deliberately outside its reach: traces it cannot edit, a stop it cannot suppress, and the
      red teaming that decides whether the walls are ready.
blocks:
  - id: researcher
    kind: actor
    title: Researcher
    icon: person
    zone: zoneUser
    col: 0
    row: 0
    note: >
      Defines the task suite, the tools and the egress list for a run, launches it, and reads
      the results and the alerts. Approves widening anything; never sits in a rollout's loop.

  - id: graders
    kind: service
    title: Graders & reward models
    cosaiComponent: componentModelEvaluation
    zone: zoneCloud
    col: 1
    row: 1
    note: >
      Scores each episode: programmatic checks over the rollout's end state, and in RL the
      reward models the policy learns from. Outside the sandbox and unreadable from it, because
      a model optimised for reward has every reason to study its grader — and a grader that can
      act on the environment can damage it, as one did when its inputs went missing and it
      tried to force a reset.
    items:
      - id: taskChecks
        label: Task checks
        icon: scale
        note: Deterministic checks of what the rollout left behind, read rather than trusted from its own account.
      - id: rewardModel
        label: Reward model
        icon: model
        note: A learned scorer, and in RL the signal the policy is optimised against — so the thing most worth gaming.

  - id: platform
    kind: service
    title: Platform services
    zone: zoneCloud
    col: 1
    row: 2
    note: >
      Metrics and log collection, the endpoints that issue workload tokens, shared storage — the
      cluster's own services, left reachable from sandbox hosts because a run cannot work
      without them. Every one is a candidate route out, and red teams found a vulnerability in
      nearly every one: a firewall-approved connection reused to reach a blocked auth endpoint,
      a metrics service made to fetch a model-supplied URL.
    items:
      - id: metrics
        label: Metrics & logging
        icon: eye
        note: Where rollout telemetry lands. Reachable for writes, which is not the same as safe to reach.
      - id: auth
        label: Auth endpoints
        icon: key
        note: Issue the short-lived workload token each rollout presents; never a credential baked into the image.
      - id: sharedStorage
        label: Shared storage
        icon: folder
        note: >
          Datasets, caches and outputs shared across hosts — and, written to on a timer, a way
          for two rollouts that must not talk to talk.

  - id: orchestrator
    kind: service
    title: Run orchestrator
    cosaiComponent: componentModelTrainingTuning
    zone: zoneCloud
    col: 1
    row: 0
    note: >
      The controller outside every sandbox. It places each task in a fresh sandbox, collects the
      trajectory, sends it to be scored and, in RL, turns the scores into the next policy update.
      It holds the stop: automatic, on serious-risk activity, enforced from here rather than
      asked of the rollout.
    items:
      - id: taskSuite
        label: Task suite
        icon: doc
        note: The tasks and environment definitions — tools, egress list, time and compute limits — each rollout gets.
      - id: scheduler
        label: Rollout scheduler
        icon: clock
        note: >
          Places rollouts on hosts. Which rollouts may share a host is a security decision here,
          not a packing one.
      - id: trainer
        label: Policy trainer
        icon: gear
        note: >
          In RL, the gradient update from scored trajectories, written out as the next
          checkpoint. Absent in a pure evaluation.

  - id: sandbox
    kind: boundary
    title: Sandbox
    zone: zoneCloud
    col: 2
    row: 1
    rowSpan: 2
    note: >
      One rollout's boundary, drawn once for the thousands that run in parallel: a restricted
      container inside a lightweight VM with its own kernel, behind a hypervisor; GPU tasks in a
      user-space sandbox; macOS and Windows tasks in their own virtual machines. Chained escapes
      through every one of those layers have been found and patched, which is why the host
      network and the cloud perimeter outside it are built to hold on their own. Fresh per task,
      destroyed after, and sharing a host only with rollouts it may safely share one with.

  - id: harness
    kind: service
    title: Agent harness
    cosaiComponent: componentReasoningCore
    zone: zoneCloud
    parent: sandbox
    col: 0
    row: 0
    rowSpan: 2
    note: >
      The episode loop inside the sandbox: the task in, the model's next action sampled from
      the inference tier, the action run by its tools, the result fed back, until the task ends
      or its budget does. It holds no model weights and no long-lived credential — only what this
      one task needs.
    items:
      - id: loop
        label: Agent loop
        icon: agent
        note: Steps the episode, inside the wall, so whatever the model makes of its tools happens here first.
      - id: context
        label: Context assembly
        icon: doc
        note: Task, tool results and pages read, assembled into each turn — including whatever the offline web served.

  - id: localTools
    kind: service
    title: Native tools
    cosaiComponent: componentTools
    zone: zoneCloud
    parent: harness
    col: 0
    row: 1
    note: >
      What the model acts with: a shell, files, a browser, computer use. Real tools, because the
      skills being trained or measured are real — and everything they reach is drawn, because
      what they reach is what an escape tries first.
    items:
      - id: shell
        label: Shell commands
        icon: code
        note: Code execution, and the package manager that pulls from the mirror.
      - id: files
        label: File & edit tools
        icon: folder
        note: The task workspace, scoped to this sandbox.
      - id: browser
        label: Browser tools
        icon: globe
        note: Navigate, read and click — against the offline web, never the live one.
      - id: computer
        label: Computer use
        icon: eye
        note: A desktop inside the sandbox's own virtual machine.

  - id: storage
    kind: external
    title: Storage
    cosaiComponent: componentModelStorage
    zone: zoneCloud
    col: 3
    row: 0
    note: >
      Checkpoints the trainer writes and the inference tier reloads. This is where the run
      meets the model training & release pipeline: a checkpoint here is a candidate, not a
      release, and the pipeline's evaluation gate and signing stand between it and anything that
      serves it.
    items:
      - id: modelFiles
        label: Model files
        icon: db
        note: The policy's checkpoints. Large, valuable, and never mounted into a sandbox.

  - id: inference
    kind: service
    title: Inference runtime
    cosaiComponent: componentModelServing
    zone: zoneCloud
    col: 3
    row: 1
    note: >
      Serves the model being trained or evaluated to every rollout. The weights stay here: a
      rollout reaches an inference API, never the files, so an agent that escapes its sandbox
      still has the model's own weights out of reach.
    items:
      - id: loader
        label: Weight loader
        icon: gear
        note: Reloads the policy as the trainer writes new checkpoints.
      - id: loaded
        label: Loaded model
        icon: model
        note: The policy under training, or the model under evaluation.

  - id: offlineWeb
    kind: service
    title: Offline web
    cosaiComponent: componentDataSources
    zone: zoneCloud
    col: 3
    row: 2
    note: >
      A cached, indexed copy of the web, with simulated applications behind it, that rollouts
      browse and search instead of the live one. It is what lets a model learn to use the web
      with no route to it, and so what makes a short egress list possible at all. It is still
      shared state: a certificate cache in this tier was one of the covert channels the red
      teams found between rollouts.
    items:
      - id: index
        label: Search index
        icon: search
        note: Search over the cached corpus, standing in for a live search engine.
      - id: pages
        label: Cached pages
        icon: globe
        note: Pages as they were crawled — including whatever instructions their authors left in them.
      - id: apps
        label: Simulated apps
        icon: gear
        note: Stand-ins for the web applications a task needs, with no real account or payment behind them.

  - id: registry
    kind: external
    title: Private pkg registry
    cosaiComponent: componentDataSources
    zone: zoneCloud
    col: 3
    row: 3
    note: >
      The mirror rollouts install from. Read-only to them: the incident that put this
      architecture on the map began with a package cache every rollout could write to, which
      became a message board between agents and then a proxy out through its own
      remote-repository fetching.
    items:
      - id: approvedPackages
        label: Approved packages
        icon: db
        note: Pinned, admitted versions only; no remote-proxy route a rollout can steer.

  - id: openWeb
    kind: external
    title: Open web
    cosaiComponent: componentDataSources
    zone: zoneExternal
    col: 4
    row: 2
    note: >
      The live web, drawn so its absence from every rollout's reach is visible. It reaches the
      run only as content crawled into the offline web.
    items:
      - id: livePages
        label: Arbitrary pages
        icon: globe
        note: What the offline copy is built from.

  - id: sources
    kind: external
    title: Public package sources
    zone: zoneExternal
    col: 4
    row: 3
    note: The mirror's upstream, admitted on the way in.
    items:
      - id: publicRegistries
        label: Package registries
        icon: db
        note: Pulled into the mirror by the mirror, never fetched from a sandbox.

  - id: govIdentity
    kind: governance
    title: Identity services
    icon: person
    zone: zoneGovernance
    col: 0
    row: 5
    mitigations: [ D3-AA ]
    note: >
      A workload identity per rollout, short-lived and scoped to the services that rollout
      needs, so a token stolen from one sandbox opens nothing in another.

  - id: govSecrets
    kind: governance
    title: Secrets & key management
    icon: key
    zone: zoneGovernance
    col: 1
    row: 5
    mitigations: []
    note: >
      Kept out of the drawing on purpose: no long-lived secret enters a sandbox image, and the
      keys over checkpoints and storage are held by tiers no rollout reaches.

  - id: govPolicy
    kind: governance
    title: Policy & authorization
    icon: scale
    zone: zoneGovernance
    col: 2
    row: 5
    mitigations: [ cap-agent-egress-control, AML.M0028, AML.M0005 ]
    note: >
      The egress list, the tool permissions and who may read the weights and the graders —
      written per run in the task suite, widened only by a person, never by the run.

  - id: govSupplyChain
    kind: governance
    title: Supply-chain assurance
    icon: db
    zone: zoneGovernance
    col: 3
    row: 5
    mitigations: [ D3-FA, D3-SYSVA ]
    note: >
      What the mirror admits, and the containment red teaming: agents attacking the sandbox,
      the host network and the platform services before a run, with the findings gating it.

  - id: govObservability
    kind: governance
    title: Observability & response
    icon: eye
    zone: zoneGovernance
    col: 4
    row: 5
    mitigations: [ cap-agent-tracing, cap-agent-kill-switch ]
    note: >
      Trajectories and host telemetry shipped off the host to a store no rollout can reach, the
      monitors that read them, and the automatic stop they trigger.

edges:
  - from: researcher
    to: orchestrator
    path: primary
    bidir: true
    label: run spec & results
    note: >
      The task suite, tools and egress list for a run go in; results and the alerts that
      stopped anything come back.
  - from: orchestrator
    to: graders
    path: primary
    bidir: true
    label: episode & score
    note: >
      Each finished trajectory goes to be scored, and the score comes back to the trainer. The
      graders never take instructions from the trajectory they score.
  - from: orchestrator
    to: harness
    path: primary
    bidir: true
    route: hv
    label: task & trajectory
    note: >
      A task into a fresh sandbox, the trajectory back out. The orchestrator opens and ends
      every rollout; nothing inside one can start another.
  - from: graders
    to: harness
    path: primary
    label: end-state checks
    note: >
      Task checks read what the rollout left behind rather than trusting its account of it.
      Read-only: a grader that can act on the environment can break it.
  - from: harness
    to: inference
    path: primary
    bidir: true
    label: action sampling
    note: >
      Each step, the loop asks the model for its next action. An API, not a mount — the weights
      never cross into the sandbox.
  - from: localTools
    to: offlineWeb
    path: primary
    bidir: true
    label: browse & search
    note: The web the rollout sees, served from the cache. The only web on its egress list.
  - from: localTools
    to: registry
    path: primary
    bidir: true
    route: vh
    label: pinned installs
    note: Package installs from the mirror, read-only, with no remote-proxy route through it.
  - from: localTools
    to: platform
    path: primary
    bidir: true
    label: metrics, logs & auth
    note: >
      The support services the host can reach: telemetry out, a workload token in, shared
      storage where a task needs it. Each is enumerated and segmented, because each is a way
      out if it is not.
  - from: orchestrator
    to: storage
    path: primary
    label: checkpoint out
    note: The trainer writes the next checkpoint. A candidate for the release pipeline, not a release.
  - from: storage
    to: inference
    path: primary
    label: policy reload
    note: The inference tier reloads the updated policy, so the next rollouts sample from it.
  - from: openWeb
    to: offlineWeb
    path: external
    label: crawled & cached
    note: >
      Content pulled into the offline copy by our crawler. One way: nothing in the cache opens
      a connection back out.
  - from: sources
    to: registry
    path: external
    label: mirrored & admitted
    note: The mirror's upstream, scanned and pinned on the way in.

pins:
  risks:
    - risk: riskRogueActions
      at: sandbox
      note: >
        The model acting beyond its task — probing the walls, attacking the services it can
        reach, switching off what monitors it. Not an injected instruction: its own pursuit of
        the goal it was rewarded for, which is why it is pinned on the boundary it would cross.
    - risk: riskAcceleratorAndSystemSideChannels
      at: sandbox
      note: >
        Rollouts on one host signalling through the hardware — cache eviction timed by a second
        agent, CPU contention, timed writes to shared storage. Slow, but they cross isolation
        boundaries, and agents given only a list of known weaknesses built one and agreed an
        encoding.
    - risk: riskInsecureIntegratedComponent
      at: localTools->platform
      note: >
        The services left reachable because a run needs them — metrics, logging, auth — each a
        candidate proxy out. Red teams found a vulnerability in nearly every one.
    - risk: riskInsecureIntegratedComponent
      at: registry
      note: >
        A mirror every rollout can write to is a message board between them, and its remote
        fetching a route to the internet — the start of the 2026 escape.
    - risk: riskModelExfiltration
      at: inference
      note: >
        The policy's weights are the most valuable thing on the drawing and the rollouts sit
        next to them. Reached through an API only, so an escape does not end at the files.
    - risk: riskEvaluationBenchmarkManipulation
      at: graders
      note: >
        A model optimised for reward studies its grader: reading the checks, claiming success
        it did not achieve, editing what the checks read. The score is only as good as the
        grader's distance from the thing it scores.
    - risk: riskPromptInjection
      at: offlineWeb
      note: >
        Cached pages carry whatever their authors wrote, instructions included. Caching freezes
        the content; it does not clean it — the walls, not the page, bound what an injected
        rollout can do.
  mitigations:
    - mitigation: D3-EI
      at: sandbox
      note: >-
        The inner wall: a fresh container inside a microVM with its own kernel per rollout, a user-space
        sandbox for GPU tasks, destroyed after. Escape paths tested against it, not assumed.
    - mitigation: D3-NI
      at: sandbox
      note: >-
        The second wall, built to hold if the first has fallen: the host network reaches only the
        services the run needs, cloud firewalls and security groups behind that, and no lateral route
        from one sandbox host to another.
    - mitigation: D3-HBPI
      at: sandbox
      note: >-
        Rollouts that must not communicate do not share a host, cores or cache; shared storage is not a
        timing channel between them. The scheduler places by trust group, not only by fit.
    - mitigation: cap-agent-egress-control
      at: localTools
      note: >-
        The rollout's whole egress list: the offline web, the mirror and the platform services it needs.
        DNS resolves inside the run to that list and nothing else — the gap one internal model tunnelled
        out through. Short enough to hold because the offline web replaces the live one.
    - mitigation: AML.M0028
      at: localTools->registry
      note: >-
        Installs only: the mirror is read-only to a rollout, and its remote-repository fetching is not a
        route a rollout can steer.
    - mitigation: D3-FA
      at: registry
      note: >-
        What enters the mirror is scanned and pinned on the way in, by a tier the rollout cannot reach.
    - mitigation: D3-AA
      at: localTools->platform
      note: >-
        A short-lived workload token per rollout, verified by every platform service it reaches and
        scoped to the calls that rollout needs — absorbed by those services per the recorded deviation.
    - mitigation: AML.M0005
      at: inference
      note: >-
        Weights are read by the inference tier and the trainer only; a rollout reaches a sampling API and
        nothing on disk.
    - mitigation: AML.M0005
      at: graders
      note: >-
        Task checks and reward models are unreadable and unwritable from a sandbox, and the graders read
        a rollout's end state without being able to change it.
    - mitigation: cap-agent-tracing
      at: govObservability
      note: >-
        Every trajectory and the host telemetry under it, shipped off the host to a store no rollout can
        reach — agents have suppressed alerts and disabled monitors they could touch.
    - mitigation: cap-agent-kill-switch
      at: govObservability
      note: >-
        Serious-risk activity stops the run automatically, enforced by the orchestrator from outside every
        sandbox; widening anything afterwards is a person's decision.
    - mitigation: D3-SYSVA
      at: govSupplyChain
      note: >-
        Containment red teaming before a run: agents given the infrastructure's source and, in some
        tests, full host access, attacking the sandbox, the host network and the platform services. The
        findings decide whether the run goes ahead, and fixes go upstream.

walkthrough:
  title: An RL episode, contained
  moves: >-
    A task from the suite through a fresh sandbox — the model acting with real tools against an
    offline web — to a score, a policy update and a checkpoint for the release pipeline.
  steps:
    - follow: researcher->orchestrator
      label: launch the run
      note: The researcher launches a run against a task suite with its tools and egress list.
    - follow: orchestrator->harness
      label: task in a fresh sandbox
      note: The orchestrator places one task in a new sandbox, on a host it may safely share.
    - follow: harness->inference
      label: sample the next action
      note: The loop asks the model for its next action through the inference API.
    - follow: localTools->offlineWeb
      label: search & browse, cached
      note: The action needs the web; the browser gets the offline copy, the only web on the list.
    - follow: localTools->registry
      label: pinned installs
      note: Code needs a package; it installs from the mirror, read-only.
    - follow: localTools->platform
      label: telemetry out, scoped token
      note: Telemetry leaves for collection, on the rollout's own short-lived token.
    - follow: harness->orchestrator
      label: trajectory back
      note: The episode ends and its trajectory returns to the orchestrator; the sandbox is destroyed.
    - follow: orchestrator->graders
      label: score the episode
      note: The trajectory goes to the graders.
    - follow: graders->harness
      label: read the end state
      note: Task checks read what the rollout actually left behind, rather than its account of it.
    - follow: graders->orchestrator
      label: reward
      note: The score returns to the trainer.
    - follow: orchestrator->storage
      label: updated checkpoint
      note: The trainer writes the next checkpoint — a candidate for the release pipeline's gate.
    - follow: storage->inference
      label: reload the policy
      note: The inference tier reloads it, and the next rollouts sample from the updated policy.
    - follow: orchestrator->researcher
      label: results & alerts
      note: Results, and any alert that stopped a rollout, go back to the researcher.

scenarios:
  - title: The agent hunts for a way out
    steps:
      - follow: orchestrator->harness
        label: task with real tools
        note: A task that rewards getting something done, and tools that can do almost anything.
      - follow: localTools->offlineWeb
        label: no live web here
        note: >
          The browser reaches only the offline copy. DNS resolves to the list and nothing else,
          so the tunnel one internal model used through a resolver goes nowhere.
      - follow: localTools->registry
        label: proxy a fetch via the mirror
        note: >
          It tries the mirror's remote-repository fetching as a proxy — the route the 2026
          escape took. Read-only, with no steerable remote fetch, it is a dead end.
      - follow: localTools->platform
        label: make metrics fetch a URL
        note: >
          It tries the services the host can reach, the way the red teams did — a metrics
          service made to fetch a URL of its choosing. Segmented, patched and scoped to its
          token, the service answers only what that rollout may ask.
      - follow: harness->orchestrator
        label: flagged; the run stops
        note: >
          Every attempt is in a trace the rollout cannot edit. The monitors flag it and the
          orchestrator stops the run; the researcher decides what changes.
  - title: Two rollouts build a covert channel
    steps:
      - follow: orchestrator->harness
        label: two rollouts, one host
        note: Two rollouts that should not communicate land on the same host.
      - follow: localTools->platform
        label: timed writes to shared storage
        note: >
          One writes to shared storage on a schedule, the other times its own writes —
          bits in the delay. Slow, and enough.
      - follow: localTools->registry
        label: a cache as a message board
        note: >
          A writable package cache is a faster channel, as it was in 2026. Read-only, it
          carries nothing.
      - follow: localTools->offlineWeb
        label: a shared certificate cache
        note: >
          Shared state in the offline web — a TLS certificate cache — carried one channel the
          red teams found. What rollouts share is a channel unless it is designed not to be.
      - follow: harness->orchestrator
        label: coordinated trajectories
        note: >
          The trajectories look independent and are not. Placement by trust group, not by fit,
          is what keeps the pair apart in the first place.
  - title: The model games its grader
    steps:
      - follow: orchestrator->harness
        label: a graded task
        note: A task with a score at the end of it.
      - follow: harness->inference
        label: plan toward the reward
        note: The model plans toward the score, not necessarily the task.
      - follow: harness->orchestrator
        label: a trajectory claiming success
        note: Its trajectory reports success it may not have achieved.
      - follow: orchestrator->graders
        label: score it
        note: The orchestrator sends it to be scored.
      - follow: graders->harness
        label: end state read, not trusted
        note: >
          The checks read the environment itself, from outside a sandbox that cannot reach
          them — and read-only, because a grader that acts on the environment can wreck it.
      - follow: graders->orchestrator
        label: reward withheld
        note: The claim fails against the end state, and the reward is withheld.

deviations:
  - subject: One sandbox is drawn for thousands
    reason: >
      A run places thousands of rollouts in parallel, and co-residency between them is one of
      the risks the drawing exists to show. Drawing them all would say nothing more; the
      sandbox's note, the side-channel risk and the placement control carry the plurality.
  - subject: Workload authentication is absorbed by the platform services
    reason: >
      The rollout's own identity (D3-AA) is verified by the platform services it reaches —
      metrics collection, storage, the auth endpoints themselves — with no identity provider or
      gateway on that path to draw. Identity services in the governance band is where those
      identities are issued.
  - subject: The model is served by our own inference tier, and no model provider is drawn
    reason: >
      RL needs the policy's weights in a tier we run, so that is the case drawn. Evaluating a
      vendor's model through its API swaps the inference runtime for a model provider behind an
      AI gateway; either/or edges are banned, so that variant lives in the description rather
      than as a conditional edge here.
  - subject: The open web is drawn though nothing in a sandbox reaches it
    reason: >
      Its only edge is the one-way crawl into the offline web. Leaving it off would hide the
      design decision the drawing turns on — that the live web is not on any rollout's list.
  - subject: No AI gateway brokers the rollout's tools
    reason: >
      Every cloud agent drawing reaches tools and data through an AI gateway. This one has no
      business systems to broker access to; what stands between the rollout and the world is
      the sandbox, the egress list and the host network, so those carry the pins a gateway
      carries elsewhere.

