                At Organization settings > Organization and access > Session security enable "Shortened session
                length" so users sign in, and meet the IdP's MFA, again.
            url: https://support.claude.com/en/articles/13163631-configuring-session-security-settings
          - title: Require trusted devices for reaching the computer
            body:
