    mitigations: [cap-staged-rollout-gate]
    url: https://learn.microsoft.com/en-us/azure/container-apps/traffic-splitting
    verified: "2026-11-21"
  - id: sandboxPerBuild
    name: "Sandbox per build, deleted after, with identitySettings lifecycle None"
    where: "Container Apps Sandboxes › sandbox group › sandbox created per build (SDK or aca CLI); identitySettings at creation; AutoDeletePolicy"
    setVia: [code, apiCli]
    area: tools
    default: "Group identities available in every sandbox; sandboxes kept until deleted"
    recommended: "Create a new sandbox for each build from the platform image, delete it when the build ends and set an auto-delete policy as a backstop. Set every group identity's lifecycle to None so code in the sandbox can get no token."
    value: "One sandbox per build, deleted; identities None"
    why: "Generated code and its packages run in a microVM made for one build and gone after it, holding no token that reaches Azure."
