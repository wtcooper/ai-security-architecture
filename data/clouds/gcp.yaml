    verified: "2026-11-21"
  - id: odsBuildGate
    name: "On-Demand Scanning in Cloud Build (block on severity)"
    product: "Cloud Build"
    where: "Cloud Build › inline build config › steps that scan the built image with On-Demand Scanning and stop before the push to Artifact Registry"
    setVia: [code, apiCli]
    area: tools
    default: "Not run"
    recommended: "Scan every image before it is pushed and fail the build on HIGH or CRITICAL. Add your own code, dependency and settings scanners as further steps: Secure Source Manager's dependency scanning is in Preview and does not block merges."
    value: "Fail the build on HIGH or CRITICAL"
    why: "Nobody reads this code, so a known vulnerable package in the image stops the release in the pipeline, before it reaches the deploy gate."
    mitigations: [D3-SYSVA]
    url: https://docs.cloud.google.com/artifact-analysis/docs/ods-cloudbuild
    verified: "2026-11-21"
  - id: binAuthzAttestor
    name: "Binary Authorization policy requiring attestations (Cloud Run)"
    where: "Binary Authorization › policy in each app project, with an attestor whose Cloud KMS key only the pipeline's service account can sign with; Organization Policy › run.allowedBinaryAuthorizationPolicies on the apps folder"
    setVia: [cloudPolicy, apiCli]
    area: tools
    default: "Not enforced"
    recommended: "Require the pipeline's attestation, signed only after every scan and test passes, and require Binary Authorization on Cloud Run with the organisation policy. Anyone who can update a service can use breakglass, so deny the breakglass annotation with a custom constraint."
    value: "Attested images only"
