# Cursor — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# Excluded: Cursor Origin (git forge, early beta 2026-08-17) — a code-hosting service, not an agent
# runtime; recorded as facts on toolCursorCloudAgents (cloud-agents.yaml) and in README Exclusions.
# 2026-09-25: re-verified toolCursor against the MITRE capability rules; every step and evidence URL
# answered 200 at its own address (no redirects); trust.cursor.com renders client-side, so its document
# list was not read and the certifications are taken from cursor.com/security.
vendor: cursor
family: Cursor
tools:
  - id: toolCursor
    name: Cursor
    surfaceClasses:
      - desktopApp
      - endpointCli
      - cloudAgent
    variants:
      - name: Cursor IDE
        class: desktopApp
        url: https://cursor.com/docs/enterprise/deployment-patterns
      - name: Cursor CLI (agent)
        class: endpointCli
        url: https://cursor.com/docs/cli/overview
      - name: Cursor for iOS / Web — Remote Control of a local agent
        class: cloudAgent
        url: https://cursor.com/docs/cloud-agent/mobile
    architecture: archCodingAgentThirdParty
    status: ga
    asOf: "2026-09"
    summary:
      - >-
        Cursor is a VS Code-derived IDE and a companion CLI (installed as `agent`) that run an agent on the
        developer's machine with the developer's own credentials. Inference is never local: prompts and code
        context go to Cursor's backend (api2/api5.cursor.sh) and on to the model providers Cursor routes to,
        most under zero-data-retention terms, with Privacy Mode on by default for Enterprise teams and
        enforceable so members cannot switch it off. The Remote Control variant (Cursor 3.9.8+, iOS / web)
        moves only the agent loop to Cursor's cloud; terminal, file and git tool calls still execute on the
        developer's computer.
      - >-
        Admin control has two channels. MDM device policies (AllowedTeamId, AllowedExtensions,
        WorkspaceTrustEnabled, UpdateMode, ExtensionGalleryServiceUrl) ship as a macOS .mobileconfig, Windows
        ADMX or ~/.cursor/policy.json on Linux, and MDM can also drop ~/.cursor/permissions.json and an
        enterprise hooks.json. The Enterprise team dashboard pushes Run Mode policy, Model Access Control, MCP
        Configuration, Team Rules, Team hooks (synced every thirty minutes), Repository Blocklist, Protected
        Git Scopes, Browser Controls and .cursor Directory Protection; dashboard and hard-coded sandbox rules
        cannot be weakened by user or project files.
      - >-
        Two things leadership should hold onto. First, the docs are candid that the Auto-review classifier
        "can make mistakes" and that .cursorignore "is not a security boundary" — the hard controls are the
        sandbox policy, the CLI's permissions.deny rules and hooks that fail closed. Second, the local sandbox
        has had a steady run of escapes in 2026 (git hooks, .claude hook files, working-directory and symlink
        canonicalisation, privileged Docker containers, tampered venvs), all fixed by 3.0–3.1.2, plus an
        unfixed Windows C:\ProgramData\Cursor\hooks.json trust issue reported to Cursor in January 2026 and
        still unresolved, with no CVE assigned. Anysphere became a SpaceX subsidiary on 2026-08-15, which
        changes the vendor-risk file.
    facts:
      - label: Plans
        value: >-
          Hobby, Pro, Pro+, Ultra, Teams and Enterprise. Nearly every admin control on this entity is labelled
          Enterprise: SCIM, MDM policies, Model Access Control, MCP Configuration, Run Mode policy, Repository
          Blocklist, .cursor Directory Protection, Browser Controls, audit log, SIEM streaming, OpenTelemetry
          export, Admin API and service accounts.
        url: https://cursor.com/pricing
      - label: Inference & routing
        value: >-
          Cloud-hosted only. The app talks to Cursor backends (*.cursor.sh, *.cursorapi.com, *.cursor-cdn.com,
          *.cursorvm.com; api2.cursor.sh for API, api5.cursor.sh for agent traffic) over TLS 1.2+ with
          certificate pinning, defaulting to HTTP/2 with an HTTP/1.1 SSE fallback; SSL inspection of these
          domains is documented as a cause of agent failures.
        url: https://cursor.com/docs/enterprise/network-configuration
      - label: Data leaving the device
        value: >-
          Prompts and code context for every LLM request; the codebase index; MCP traffic to whatever servers
          are configured (terminal and MCP tools cannot be stopped by .cursorignore). Cloud Agents are the
          only feature that stores code, temporarily while a run executes. With Privacy Mode on, code is never
          used for training by Cursor or providers; models that keep inputs for provider-side safety review
          (Claude Fable 5/5.1) are disabled until an admin approves them.
        url: https://cursor.com/docs/enterprise/privacy-and-data-governance
      - label: Data retention / training
        value: >-
          Privacy Mode is on by default for Enterprise teams and enforceable org-wide; most models run under
          zero-data-retention agreements, ZDR does not apply when members bring their own API keys, and Claude
          Fable models retain inputs and outputs for Anthropic harm-prevention review (not training).
          Sub-processors are listed on the trust portal.
        url: https://cursor.com/help/security-and-privacy/privacy
      - label: Docs index
        value: >-
          Enterprise documentation hub (identity, security hardening, LLM safety, models and integrations,
          compliance, network, OpenTelemetry, deployment patterns).
        url: https://cursor.com/docs/enterprise
      - label: Vendor ownership
        value: >-
          SpaceX closed its $60 billion all-stock acquisition of Anysphere (Cursor) on 2026-08-15. Reassess
          subprocessor, data-residency and contract terms accordingly.
        url: https://techcrunch.com/2026/08/15/spacex-officially-closes-its-cursor-acquisition/
      - label: Certifications
        value: >-
          SOC 2 Type II, ISO/IEC 27001:2022, ISO/IEC 42001:2023 and AIUC-1; annual third-party pen test; no
          infrastructure in China; vulnerability reports to security-reports@cursor.com.
        url: https://cursor.com/security
    items:
      - title: Identity and device management
        body:
          - SAML 2.0 SSO (password auth can be blocked), SCIM provisioning with group sync, and three
            dashboard roles. MDM policies for macOS and Windows cover Allowed Team IDs (blocks
            personal-account login on corporate devices), an Allowed Extensions allowlist (Cursor 2.1+) and
            Workspace Trust enforcement.
        links:
          - title: Cursor enterprise identity and access management
            url: https://cursor.com/docs/enterprise/identity-and-access-management
      - title: Privacy, model and MCP control
        body:
          - Privacy Mode is default-on for Enterprise teams and admins can enforce it so members cannot
            disable it; model access is set per team and per organisation group, and BYOK API keys can be
            blocked. MCP servers are governed by a dashboard allowlist with wildcard matching, per-server tool
            restrictions and per-server network policies; ~/.cursor/permissions.json, distributable via MDM,
            carries only the terminal and MCP auto-run allowlists and Auto-review hints — admin settings take
            precedence over the local file and editor settings.
        links:
          - title: Model and integration management
            url: https://cursor.com/docs/enterprise/model-and-integration-management
          - title: Privacy and data governance
            url: https://cursor.com/docs/enterprise/privacy-and-data-governance
      - title: Agent run-mode policies and audit
        body:
          - Enterprise Run Mode policies (Cursor 3.6+) set the terminal posture — Auto-review, Allowlist, or
            Run Everything — and the docs are candid that the allowlist is best-effort, not a security
            boundary; hooks can scan prompts, block commands and redact secrets, and .cursorignore is likewise
            documented as not a boundary. Enterprise audit logs record admin and account events (explicitly
            not agent responses or generated code), stream to SIEM, and the Admin API exposes members, usage,
            spend, repo blocklists and model access.
        links:
          - title: LLM safety and controls
            url: https://cursor.com/docs/enterprise/llm-safety-and-controls
          - title: Compliance and monitoring
            url: https://cursor.com/docs/enterprise/compliance-and-monitoring
    riskNotes:
      - risk: riskPromptInjection
        note: >-
          Cursor's own mitigation is an LLM classifier (Auto-review) that the docs say can allow a call you
          would have blocked; the deterministic layer is sandbox.json, hooks and the CLI's permissions.deny
          (the IDE's permissions.json holds allowlists and classifier hints, not denies). Rules files,
          AGENTS.md and .cursor/* are instruction surfaces an attacker can reach through a repository (Rules
          File Backdoor), which is what .cursor Directory Protection and enforced Team Rules are for.
      - risk: riskToolSourceProvenance
        note: >-
          MCPoison (CVE-2025-54136) showed trust bound to an MCP server's name rather than its command; since
          1.3 any change to an MCP configuration re-prompts. The Enterprise MCP allowlist matches command and
          URL patterns, so a pinned pattern is the only provenance check the vendor ships — the org must
          curate the Team Marketplace itself.
      - risk: riskRogueActions
        note: >-
          Run Everything mode removes every gate; the Enterprise Run Mode policy is the switch that takes it
          away from members. Five sandbox-escape advisories in 2026 mean the sandbox is a blast-radius
          reducer, not a guarantee; keep the fleet on 3.1.2 or later.
      - risk: riskSensitiveDataDisclosure
        note: >-
          .cursorignore is a convenience filter that terminal and MCP tools bypass; beforeReadFile and
          beforeSubmitPrompt hooks (failClosed) and the sandbox's protected paths are the controls that hold.
          ZDR is lost the moment a member uses a personal API key, which Model Access Control can block.
      - risk: riskInsecureIntegratedComponent
        note: >-
          The extension marketplace is a second supply chain inside the IDE: AllowedExtensions, Install
          Cooldown and ExtensionGalleryServiceUrl decide what can be installed; the
          .claude/settings.local.json hook escape (CVE-2026-48124) shows sibling-tool config files in a
          workspace are also executable surface.
    controls:
      - mitigation: D3-MFA
        coverage: partial
        mechanism: >-
          SSO required for every user on a verified domain once the SAML connection is active (Team Settings →
          Single Sign-On (SSO); the Organization's Settings on Enterprise); MDM policy AllowedTeamId pins the
          client to the org's teams; the second factor is the IdP's policy
        steps:
          - title: Federate sign-in and verify the domain
            body:
              - In Team Settings → Single Sign-On (SSO) (Enterprise org admins use the Organization's Settings)
                complete SSO-Provider Connection Settings and Domain Verification Settings; once both are
                active every user on that domain must sign in with SSO, and there is no separate enforcement
                toggle.
            url: https://cursor.com/docs/account/teams/sso
          - title: Pin managed devices to your teams
            body:
              - Set the MDM policy AllowedTeamId (it overrides the cursorAuth.allowedTeamId setting) to the
                comma-separated list of your team IDs so a sign-in to any other team, including a personal
                account, is logged out immediately.
            url: https://cursor.com/docs/enterprise/identity-and-access-management
          - title: Close the non-domain door
            body:
              - On teams not using SCIM turn on Restrict invites to verified domains in team settings, and
                revoke invite links, which have a long expiry and admit anyone who holds them.
            url: https://cursor.com/docs/account/teams/members
        note: >-
          Partial by the rule applied to every vendor: Cursor enforces SSO-only sign-in for users on a verified
          domain (Teams and Enterprise) and AllowedTeamId pins the device client to the org's teams (Enterprise
          MDM: macOS profile, Windows ADMX, Linux ~/.cursor/policy.json in the user's home directory), so the
          IdP's MFA policy governs every interactive login. MFA is configured in the IdP, not in Cursor, whose
          own account layer has no require-second-factor switch. Paths that skip the IdP's MFA: user API keys
          from Dashboard → API Keys used by the CLI as CURSOR_API_KEY or --api-key (no expiry documented, and
          no admin switch forbids them; Enterprise can only restrict which users may use the CLI), Enterprise
          service-account keys (rotate or archive to revoke), Admin API keys, the CLI's locally stored
          browser-login credential (lifetime not documented), and invite-link joins with non-domain emails.
          AllowedTeamId does not reach unmanaged devices.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityIga
          reviewRequired: false
          original:
            - capability: capabilityIga
              coverage: native
              mechanism: >-
                Enterprise dashboard SSO (SAML 2.0) and SCIM 2.0; MDM policy AllowedTeamId /
                cursorAuth.allowedTeamId
              steps:
                - title: Turn on SSO and SCIM
                  body:
                    - Configure SAML 2.0 SSO (Okta, Azure AD, Google Workspace, OneLogin) in the team
                      dashboard and enable SCIM 2.0 provisioning with group sync; both require Enterprise and
                      SCIM requires SSO.
                  url: https://cursor.com/docs/enterprise/identity-and-access-management
                - title: Pin corporate devices to your team
                  body:
                    - Set the MDM policy AllowedTeamId to the comma-separated list of authorised team IDs so
                      personal accounts cannot sign in on managed devices; deploy via the shipped
                      .mobileconfig (bundle com.todesktop.230313mzl4w4u92), the ADMX templates or
                      ~/.cursor/policy.json on Linux.
                  url: https://cursor.com/docs/enterprise/deployment-patterns
              verified: 2026-09-10
      - mitigation: cap-agent-action-policy-enforcement
        coverage: native
        mechanism: >-
          Admin-distributed pre-tool hooks: Enterprise Team hooks (dashboard, cloud-synced) or an MDM-placed
          system hooks.json, with preToolUse / beforeShellExecution / beforeMCPExecution returning permission
          deny and failClosed; the Enterprise Run Mode policy removes Run Everything
        steps:
          - title: Distribute a deny-capable pre-tool hook
            body:
              - In the dashboard's Team hooks (team-content?section=hooks; Enterprise cloud distribution, synced
                to clients every thirty minutes) add preToolUse, beforeShellExecution and beforeMCPExecution
                hooks that call your policy service and return permission deny (or exit code 2), with
                failClosed true so a crash or timeout blocks.
            url: https://cursor.com/docs/hooks
          - title: Or place it system-wide by MDM
            body:
              - Write hooks.json to /Library/Application Support/Cursor/hooks.json, /etc/cursor/hooks.json or
                C:\ProgramData\Cursor\hooks.json; hooks from every source run and any deny wins over ask and
                allow regardless of source.
            url: https://cursor.com/docs/hooks
          - title: Remove Run Everything
            body:
              - In the web dashboard's team controls limit the modes available to members to Auto-review and
                Allowlist; team settings take precedence over individual and project configuration.
            url: https://cursor.com/docs/agent/security/run-modes
        note: >-
          Native on the rule applied to every vendor: an admin-locked pre-tool hook that can deny, evaluated by
          the harness before shell, file (Read, Write, Delete, Grep), MCP and Task calls, outside the model, in
          both the IDE and the CLI. The decision logic is the organisation's own hook: Cursor's declarative
          lists are allowlists that skip approval, and the Auto-review classifier (Claude 4.5 Haiku or GPT-5.4
          Mini) is documented as "not a security boundary", so neither is the policy decision point. Gaps: hooks
          fail open unless failClosed is set; preToolUse accepts but does not enforce ask (escalate from
          beforeShellExecution / beforeMCPExecution instead); Tab completions use separate hooks; cloud
          distribution is Enterprise-only (Teams can place hooks by MDM only); the decision is exported only as
          cursor.hook.execution_complete in Enterprise OpenTelemetry Export unless the hook logs it itself; and
          a user-writable C:\ProgramData\Cursor\hooks.json on Windows (reported January 2026, unresolved) lets
          a local user replace the system hook.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAgentRuntimeEnforcement
          reviewRequired: false
          original:
            - capability: capabilityAgentRuntimeEnforcement
              coverage: native
              mechanism: >-
                Enterprise Run Mode policy (Auto-review / Allowlist / Run Everything);
                ~/.cursor/permissions.json via MDM; hooks.json beforeShellExecution / beforeMCPExecution with
                permission deny; CLI permissions.deny
              steps:
                - title: Set the Run Mode policy
                  body:
                    - In the Enterprise team dashboard set the run mode to Auto-review (default) or Allowlist
                      and remove Run Everything; team settings take precedence over individual and project
                      configuration.
                  url: https://cursor.com/docs/agent/security/run-modes
                - title: Distribute deterministic deny rules
                  body:
                    - Push ~/.cursor/permissions.json through MDM for terminal-command and MCP allow/deny
                      lists; admin dashboard settings outrank the file, which outranks editor settings.
                  url: https://cursor.com/docs/enterprise/deployment-patterns
                - title: Block at the hook boundary
                  body:
                    - Ship an enterprise hooks.json (/Library/Application Support/Cursor/hooks.json,
                      /etc/cursor/hooks.json, C:\ProgramData\Cursor\hooks.json) with beforeShellExecution and
                      beforeMCPExecution hooks returning permission deny; precedence is Enterprise → Team →
                      Project → User and exit code 2 blocks.
                  url: https://cursor.com/docs/hooks
                - title: Lock the CLI the same way
                  body:
                    - In ~/.cursor/cli-config.json set permissions.allow / permissions.deny with Shell(),
                      Read(), Write(), WebFetch() and Mcp(server:tool) rules; deny wins over allow.
                  url: https://cursor.com/docs/cli/reference/permissions
              note: >-
                The docs state the Auto-review classifier can allow a call you would have blocked; only the
                deny rules, hooks and sandbox are deterministic.
              verified: 2026-09-10
      - mitigation: cap-ai-vendor-assessment
        coverage: external
        mechanism: >-
          Vendor evidence on cursor.com/security and the Trust Center (trust.cursor.com), consumed by the
          organisation's own TPRM platform
        evidence:
          - title: Cursor security page (AIUC-1, ISO 27001 and 42001, SOC 2 Type II, annual pen test)
            url: https://cursor.com/security
          - title: Cursor Trust Center (reports on request, subprocessors; client-rendered)
            url: https://trust.cursor.com/
        note: >-
          External by the rule applied to every vendor: Cursor publishes evidence but the assessment, its
          cadence and the reassessment trigger belong to the organisation's TPRM platform. The security page
          states AIUC-1, ISO/IEC 27001:2022 and ISO/IEC 42001:2023 certification, a SOC 2 Type II attestation
          and at-least-annual third-party penetration testing, with certificates and reports available on
          request at trust.cursor.com; the portal renders client-side, so its document list was not read by
          automated fetch. Subscribe there for subprocessor and posture-change notices, and re-run the
          assessment for the 2026-08-15 change of ownership to SpaceX and the sign-in move to
          accounts.spacex.ai / accounts.x.ai from 2026-09-30.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAiTprm
          reviewRequired: false
          original:
            - capability: capabilityAiTprm
              coverage: external
              mechanism: >-
                Vendor evidence from cursor.com/security and trust.cursor.com consumed by the organisation's
                own TPRM platform
              steps:
                - title: Collect the vendor evidence
                  body:
                    - Pull SOC 2 Type II, ISO 27001/42001, AIUC-1, the pen-test report and the sub-processor
                      list from the trust portal; note the 2026-08-15 change of ownership to SpaceX and re-run
                      the assessment.
                  url: https://trust.cursor.com
              note: >-
                Cursor publishes evidence; the assessment cadence and reassessment trigger on ownership change
                must come from your TPRM tooling.
              verified: 2026-09-10
      - mitigation: cap-sensitive-data-redaction
        coverage: partial
        mechanism: >-
          Hooks as the inline attach point for the organisation's DLP: beforeSubmitPrompt and beforeReadFile
          (block), preToolUse updated_input and postToolUse updated_mcp_tool_output (rewrite); .cursorignore and
          the Enterprise dashboard's Cursor Ignore Configuration as data minimisation only
        steps:
          - title: Inspect prompts and file reads inline
            body:
              - Distribute beforeSubmitPrompt (return continue false) and beforeReadFile (receives the file
                content; return permission deny) hooks that send the text to your DLP API, with failClosed true
                on beforeReadFile.
            url: https://cursor.com/docs/hooks
          - title: Mask what tools send and return
            body:
              - Use preToolUse updated_input to strip secrets from outgoing tool arguments and postToolUse
                updated_mcp_tool_output to replace an MCP result with a redacted copy before the model sees it.
            url: https://cursor.com/docs/hooks
          - title: Keep secret paths out of context
            body:
              - Add .cursorignore patterns (or global ignore patterns in user settings) for .env, key and
                credential files; Agent, Tab, Inline Edit and @-mentions honour them, terminal and MCP tools do
                not.
            url: https://cursor.com/docs/reference/ignore-file
        note: >-
          Partial by the rule applied to every vendor: the hooks are an inline attach point that can block or
          rewrite, and the detection is the organisation's DLP; Cursor itself detects nothing. Covered once a
          hook is attached: user prompts (block only), agent file reads (block only), Tab file reads
          (beforeTabFileRead), outgoing tool arguments and MCP results (rewrite). Not covered: shell command
          output and web fetch or browser content enter context with no hook that can change them. The file
          exclusions are data minimisation, which the docs call "not a security boundary". Network or endpoint
          DLP on *.cursor.sh is the documented external alternative, and SSL inspection of those domains is a
          documented cause of agent failures. Cloud distribution of hooks is Enterprise; Teams places them by
          MDM.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAiDlp
          reviewRequired: false
          original:
            - capability: capabilityAiDlp
              coverage: partial
              mechanism: >-
                hooks.json beforeSubmitPrompt and beforeReadFile (Enterprise-managed, failClosed);
                .cursorignore as a convenience filter only
              steps:
                - title: Scan prompts and reads with hooks
                  body:
                    - Add beforeSubmitPrompt and beforeReadFile hooks in the enterprise or team hooks.json to
                      scan for sensitive data and block or redact before content reaches the model; set
                      failClosed on critical hooks.
                  url: https://cursor.com/docs/enterprise/llm-safety-and-controls
                - title: Do not rely on .cursorignore
                  body:
                    - Use .cursorignore for secrets and regulated trees, knowing terminal and MCP tools cannot
                      be blocked by it and the docs call it a convenience feature, not a security boundary.
                  url: https://cursor.com/docs/enterprise/llm-safety-and-controls
              note: >-
                No vendor-side content inspection or blocking policy exists; the docs point to endpoint DLP,
                hooks and third-party vendor APIs for centralised policy.
              verified: 2026-09-10
      - mitigation: AML.M0028
        coverage: partial
        mechanism: >-
          Enterprise MCP Configuration (server command/URL allowlist with a per-server Tools list); admin Run
          Mode policy and allowlists; hooks for argument and path denies; CLI permissions.allow / deny in the
          user-editable ~/.cursor/cli-config.json
        steps:
          - title: Scope MCP servers and their tools
            body:
              - In Team Settings > MCP Configuration (Enterprise) add command entries for stdio servers, URL
                entries for remote servers and a tool allowlist per server, and do not let users configure
                their own MCP servers outside the admin-defined patterns.
            url: https://cursor.com/docs/mcp
          - title: Own the auto-run lists
            body:
              - Set the Run Mode policy and command and MCP allowlists in the dashboard; admin-controlled lists
                replace permissions.json and editor entries and make the in-app allowlist editor read-only.
            url: https://cursor.com/docs/reference/permissions
          - title: Deny by argument and path with hooks
            body:
              - For shell arguments and file paths distribute preToolUse, beforeShellExecution and
                beforeReadFile hooks that deny on your patterns (git push, credential paths), since the IDE has
                no declarative deny list.
            url: https://cursor.com/docs/hooks
          - title: Scope the CLI
            body:
              - In ~/.cursor/cli-config.json set permissions.allow and permissions.deny with Shell(), Read(),
                Write(), WebFetch() and Mcp(server:tool) tokens; deny wins over allow.
            url: https://cursor.com/docs/cli/reference/permissions
        note: >-
          Partial by the rule applied to every vendor: admin-lockable scoping exists for MCP servers and tools
          (Enterprise MCP Configuration; the MCP page describes the Tools list as what may run automatically,
          the Model and Integration page as what can run) and for which calls skip approval, but the IDE has no
          declarative per-tool deny with argument or path scoping. That exists only in the CLI's
          cli-config.json, a user-editable file with no documented admin lock, or in the organisation's own
          hooks. Bypass modes: Run Everything is removable by the Enterprise Run Mode policy; the CLI's
          --force / --yolo and approvalMode unrestricted are not documented as bound by that policy
          (Enterprise can restrict which users may use the CLI). Enforcement sits in the harness, outside the
          model.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityToolPermissionScoping
          reviewRequired: false
          original:
            - capability: capabilityToolPermissionScoping
              coverage: native
              mechanism: >-
                Enterprise MCP Configuration (server:tool allowlist patterns, per-server tool lists);
                ~/.cursor/permissions.json via MDM; CLI Mcp(server:tool) rules
              steps:
                - title: Allowlist MCP servers and tools
                  body:
                    - In the dashboard's MCP Configuration add command patterns for stdio servers and URL
                      patterns for remote servers, then restrict each server's Tools field; patterns are
                      server:tool, server:*, *:tool or *:*.
                  url: https://cursor.com/docs/enterprise/model-and-integration-management
                - title: Scope CLI tools per operation type
                  body:
                    - Use Shell(commandBase), Read(pathOrGlob), Write(pathOrGlob), WebFetch(domain) and
                      Mcp(server:tool) entries in permissions.allow / permissions.deny; project-level
                      .cursor/cli.json carries permissions only.
                  url: https://cursor.com/docs/cli/reference/permissions
              note: >-
                server:tool patterns hide MCP tools; permissions.json and CLI rules limit shell and file
                arguments; Run Mode pre-approves. Run Everything bypasses all of it unless the Enterprise
                policy removes that mode.
              verified: 2026-09-10
      - mitigation: D3-EI
        coverage: partial
        mechanism: >-
          OS sandbox for agent terminal commands (macOS Seatbelt; Linux Landlock + seccomp) shaped by
          sandbox.json with a team-admin layer local files cannot weaken; Agent Sandbox Mode enforceable
          org-wide on Enterprise; per-server sandbox for stdio MCP servers
        steps:
          - title: Enforce sandboxing org-wide
            body:
              - In the Enterprise dashboard's Run Mode controls keep members on Auto-review or Allowlist with
                sandboxing enabled and remove Run Everything; team settings take precedence over individual and
                project configuration.
            url: https://cursor.com/docs/agent/security/run-modes
          - title: Set the team-admin sandbox policy
            body:
              - Define the team sandbox rules (networkPolicy, paths, disableTmpWrite); they merge above
                ~/.cursor/sandbox.json and <workspace>/.cursor/sandbox.json and neither file can weaken them.
            url: https://cursor.com/docs/reference/sandbox
          - title: Sandbox local MCP servers
            body:
              - In MCP Configuration give each stdio server the Allowlist or Deny all network mode, never No
                sandbox.
            url: https://cursor.com/docs/enterprise/model-and-integration-management
          - title: Meet the Linux requirements
            body:
              - Ship kernel 6.2+ with Landlock v3 and unprivileged user namespaces, and install the
                cursor-sandbox-apparmor package for the CLI and remote environments; otherwise Cursor falls back
                to approval prompts.
            url: https://cursor.com/docs/agent/security/run-modes
        note: >-
          Partial by the rule applied to every vendor: the sandbox is OS-enforced and Enterprise can enforce it
