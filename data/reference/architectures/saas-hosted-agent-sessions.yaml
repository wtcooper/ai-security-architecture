id: archHostedAgentSessions
surface: surfaceSaas
rank: 3
title: Vendor-hosted coding & desktop agent sessions
abbrev: Hosted agent sessions

summary:
  - >
    The vendor's coding or desktop agent run on the vendor's compute instead of the developer's
    machine: one hosted harness in a per-session sandbox, reachable through several doors — a
    hand-off from the local harness, the vendor's web, mobile and chat surfaces, a
    source-control event or a schedule, and an API. The session clones a repository through a
    credential proxy, works on a branch, and hands back a draft pull request that a person
    merges. The doors are concurrent, not variants; the runtime behind them is one thing.

description:
  - >
    Every vendor built the same product: the engine from the endpoint drawings, hosted. What
    changes is custody. On the endpoint the loop runs on a machine that also holds the user's
    SSH keys, cloud credentials and browser sessions, and the person is present to approve
    what matters. Here the loop runs in a vendor microVM or container that is created for the
    session and reclaimed after it, the repository credential never enters that sandbox — a
    proxy substitutes a scoped placeholder — and nobody is watching. The human's approval
    point moves from each tool call to the merge gate, and every control on this drawing is
    about making that gate real and keeping the sandbox from reaching anything the gate does
    not cover.
  - >
    The ingress is the repository host. Issue text, pull-request comments, review threads and
    the instruction files committed beside the code all enter the session as instruction, and
    most of them are writable by people with no commit access. Every 2026 incident in this
    class arrived that way: a comment drove a hosted CI agent into exfiltrating its keys, an
    issue title poisoned a triage workflow's cache and a release token walked out through it,
    an App that should never have been able to trigger a run did. The trigger authorisation —
    a verified human with write access — and the classification of what a session reads are
    therefore pinned where the events originate, not inside a loop we cannot see.
  - >
    The egress is the same host, plus whatever the sandbox's network policy allows. The agent
    may push to its own branch and nothing else; it cannot mark a pull request ready, approve
    it or merge it, and its own initiator's approval does not count. Workflows a pull request
    would fire wait for a person to approve and run them, because a run that fires on an
    agent's reply is a run an attacker who can make the agent reply controls. The sandbox's
    egress is an allowlist the vendor enforces and we author — with two facts to carry: some
    traffic bypasses it in every product (the vendor's connectors, the git proxy, the inference
    API), and the hosts every allowlist permits — the repository host, the package registries —
    are write-capable, so they are exfiltration channels unless methods are restricted too.
  - >
    Inference is the vendor's. No product in this class lets the hosted loop's model calls
    route through a customer gateway, including the variants that execute on workers we run;
    the AI gateway on this drawing is on the tool path only — and that path is the one place
    external compute reaches back into our systems, so it carries the drawing's strictest
    pins: the vendor's connector service meets one aggregate MCP endpoint, on a per-user grant
    our authorization server issued, evaluated per call and scoped to a named server list. Everything the gateway does
    for inference elsewhere in the catalogue has to be re-obtained as tenant configuration —
    server-managed settings, shared environments, an org-level switch for the hosted mode —
    and as exported audit, whose coverage differs by product and by plan.
  - >
    Identity is three different things, and the drawing carries all three because the
    products do. A session acts as the user who started it (their commits, their pull
    requests, their replies on the thread), as a bot or App with the user as co-author, or as
    a shared service identity for sessions raised from a channel or a schedule. Which one a
    product uses decides whose grant is exercised and what "revoke this agent" means, and it
    is the first thing to establish per product before any other control is assessed.

distinguishedBy:
  - >
    Against the third-party coding & desktop agents: the same engine and the same vendor
    control plane, with the loop moved off the machine. There the human is present and the
    machine holds the credentials; here the human is absent, the sandbox holds a scoped
    placeholder, and the merge gate is the approval. The endpoint drawing keeps this runtime
    as an item on its Vendor service block and draws the hand-off toward it; this drawing is
    where that item lands.
  - >
    Against the API/SDK managed agent runtime: the same hosted harness, driven from different
    doors. There our own application invokes the session, binds the user to it, executes
    custom tools and receives the stream; the definition is authored by an engineer and
    deployed. Here the vendor's own surfaces start the session, the definition is repository
    content plus an admin-owned environment, and the result is a pull request. The blocks that
    appear and disappear between the two are the reason they are two drawings.

exemplars:
  - name: Claude Code on the web and Claude Cowork in the cloud
    note: >
      Sessions on Anthropic-managed VMs started from claude.ai/code, the mobile app, the
      Desktop app, "claude --cloud", routines and Claude Tag; a git proxy keeps the credential
      outside the VM; network access is an allowlist per environment ("Trusted" by default)
      that the git proxy, MCP connectors and the inference API bypass. Acts as the user on
      GitHub. Self-hosted environments move execution to runners we operate while orchestration
      and inference stay with Anthropic and cannot be routed through a gateway. Org switches:
      allow_remote_sessions, Routines, Remote Control; ZDR organisations cannot use any of it.
    url: https://code.claude.com/docs/en/claude-code-on-the-web
    asOf: "2026-09"
  - name: Cursor Cloud Agents
    note: >
      One Firecracker microVM per agent in a dedicated AWS account, started from the desktop,
      the CLI, the web, iOS, Slack, GitHub, Linear, an API or Automations. Internet is on by
      default and lockable to allowlist-only by Enterprise; runtime secrets are redacted from
      transcripts and commits; commits are signed by an HSM key and pull requests stay drafts.
      Team automations run as a shared service identity, private ones as the user.
    url: https://cursor.com/docs/cloud-agent
    asOf: "2026-09"
  - name: OpenAI Codex cloud
    note: >
      OpenAI-hosted containers with a two-phase runtime: the setup script has internet, the
      agent phase does not unless an environment allows it (None / Common dependencies / All,
      with GET-only method restriction). Secrets are removed before the agent phase. Started
      from the web, the CLI, the IDE's "Delegate", GitHub, Slack, Linear or a schedule; the
      managed configuration that governs local clients does not govern the cloud.
    url: https://learn.chatgpt.com/docs/cloud
    asOf: "2026-09"
  - name: GitHub Copilot cloud agent and Agent HQ
    note: >
      An ephemeral GitHub Actions job with a firewall on by default, a token that reaches one
      branch, no ability to mark ready, approve or merge, and "approve and run workflows" on
      anything the pull request would trigger. Started from the agents panel, an issue, a PR
      comment, VS Code's cloud session target (Copilot, Claude or Codex), the CLI's /delegate,
      mobile or chat. Third-party agents run under the same policies.
    url: https://docs.github.com/en/copilot/concepts/agents/cloud-agent/about-cloud-agent
    asOf: "2026-09"

zones:
  - id: zoneUser
    owner: user
    note: >
      The developer at the keyboard for the hand-off and the review, and the same person — or,
      on a chat surface, not necessarily the same person — steering from a phone, a browser or
      a channel while the session runs.
  - id: zoneEndpoint
    owner: endpoint
    note: >
      The local harness is only a door on this drawing: it pushes a branch and a conversation
      summary up, and pulls the cloud branch back on teleport. Nothing on the machine executes
      on the session's behalf.
  - id: zoneCloud
    owner: cloud
    note: >
      The repository host the session reads and writes, our gateway where the vendor's
      connector service is admitted to our tool servers, and the systems behind them. The host
      is drawn here whether we run it or rent it: its policy is ours either way.
  - id: zoneVendor
    owner: vendor
    note: >
      Two blocks for one vendor, because a session is admitted by one and executed by the
      other: the control plane — settings, environments, the relay and the scheduler — and the
      runtime that holds the loop, the model and the sandbox. What they operate inside either
      is assured, not drawn.
  - id: zoneExternal
    owner: external
    note: >
      What the sandbox reaches under its egress policy: package registries in the setup phase,
      the web in the agent phase, and the third-party tool services our gateway brokers.
  - id: zoneGovernance
    owner: governance
    note: >
      On a runtime we do not operate, this band is where the vendor's exports are fused with
      our record — and where "stop this agent" has to be defined with its delay, because
      revoking an App or a seat does not stop a running session.

blocks:
  - id: developer
    kind: actor
    title: Developer
    icon: person
    zone: zoneUser
    col: 0
    row: 1
    note: >
      Present at the start and at the end — the hand-off and the merge — and absent for the
      run in between. The merge gate is the approval this archetype has; every control on the
      drawing exists to make it a real one.

  - id: remoteDevice
    kind: service
    title: Remote device
    cosaiComponent: componentAgentUserQuery
    zone: zoneUser
    col: 0
    row: 2
    note: >
      The doors that start and steer a session with nobody at the machine: the vendor's web
      and mobile apps, and an @-mention in a chat channel. Admission is the vendor's account
      binding for the first and whoever the channel admits for the second — the widest
      admission decision on the drawing.
    items:
      - id: phoneWeb
        label: Phone & web apps
        icon: phone
        note: The owner's own surfaces, signed into the vendor account the session is bound to.
      - id: chatChannels
        label: Chat channels
        icon: chat
        note: >
          A session raised from Slack, Teams or Linear runs on the vendor's cloud under a
          shared channel identity on most products — not as the person who typed.

  - id: harness
    kind: service
    title: Local applications
    cosaiComponent: componentApplication
    zone: zoneEndpoint
    col: 1
    row: 1
    note: >
      The vendor's application on the machine — CLI, editor extension or desktop app — drawn
      only as far as this drawing uses it: the loop that hands off. "Continue in the cloud", a prefix on the prompt or a delegate command pushes the
      working branch and a summary of the conversation up and starts a session from it;
      teleport brings the cloud branch and its history back. The full anatomy — native tools,
      memory, the local model path — is the endpoint drawing's, and nothing of it executes
      on this drawing's path.
    items:
      - id: loop
        label: Agent loop
        icon: agent
        note: The conversation that becomes the hosted session's opening context.

  - id: sourceControl
    kind: service
    title: Source control
    cosaiComponent: componentDataSources
    zone: zoneCloud
    col: 3
    row: 0
    note: >
      The one tier that is ingress, egress, definition and gate at once. Issue text, comments
      and review threads enter the session as instruction; a branch and a draft pull request
      come back out; the instruction files, setup scripts and environment configuration
      committed beside the code are the session's definition; review, merge and "approve and
      run workflows" are the gate. Drawn in our band whether we host it or rent it, because
      the policy that matters — App installation scope, branch protection, CODEOWNERS on the
      agent's own configuration, who may trigger a run — is ours either way.
    items:
      - id: repos
        label: Repositories & instruction files
        icon: code
        note: >
          The code, and CLAUDE.md, AGENTS.md, setup scripts, hooks and MCP configuration —
          content that executes as instruction and is versioned like code because it is code.
      - id: threads
        label: Issues & PR threads
        icon: chat
        note: >
          Writable by anyone the repository admits, read by the session as instruction. Hidden
          characters and HTML comments carry payloads the human reviewer never sees.
      - id: prs
        label: Pull requests & CI
        icon: shield
        note: >
          The draft the session opens, the review a person gives, the workflows the pull
          request would fire — and the single branch the session may write.

  - id: managedRuntime
    kind: provider
    title: Managed runtime
    cosaiComponent: componentReasoningCore
    zone: zoneVendor
    col: 4
    row: 1
    note: >
      The vendor's own coding agent, hosted: the loop, context assembly and compaction, the
      model, session state and one sandbox per session, on compute the vendor operates. What
      we configure about it — the environment, the network policy, the credentials it may
      draw — is drawn as pins on this block and on the sandbox nested inside it; the execution
      behind them is assured, not inspected. Product-specific caveats — retention, session
      sharing, snapshot lifetimes, which plans get proxied credentials — belong on the
      exemplars and the tool records, not here.
    items:
      - id: agentLoop
        label: Agent harness
        icon: agent
        note: >
          Their harness running the repository's instructions — the loop, context assembly,
          compaction and retries, theirs to operate — with the built-in tools nested beneath.
      - id: inference
        label: Model inference
        icon: model
        note: >
          Their model, called inside their boundary. It never crosses our AI gateway, and no
          product in this class lets it — including the variants that execute on our workers.
      - id: managedMemory
        label: Memory store
        icon: folder
        note: >
          Agent-written memory and session transcripts the vendor holds: persisted after the
          browser closes, shareable on some plans, and merged into later sessions on the
          products that ship auto-memory.
      - id: vault
        label: Credential vault
        icon: key
        note: >
          The git proxy that substitutes a scoped credential so the sandbox never holds the
          repository token, the environment secrets that exist only in the setup phase, and
          the runtime secrets redacted from transcripts — each a different product's answer to
          the same requirement, and the plan-gated gaps recorded per product.
      - id: mcpClient
        label: MCP client
        icon: plug
        note: >
          The harness's own MCP client. On most products it reaches servers through the
          vendor's connector service, outside the environment's network policy — which is why
          the path to our servers is drawn from the control plane to our gateway, and why the
          connector allowlist is a control-plane setting rather than a sandbox one.

  - id: nativeTools
    kind: provider
    title: Native tools
    cosaiComponent: componentTools
    zone: zoneVendor
    parent: managedRuntime
    col: 0
    row: 0
    note: >
      The sandbox: a microVM or container created for the session and reclaimed after it,
      holding the file tools, the shell, the skills the repository names and the hosted
      browser where the product offers one. Two phases where the product has them — setup
      with network for dependencies, then the agent phase under the environment's allowlist.
      Drawn because what it may reach is ours to author; where a product moves execution to a
      worker we run, this block is what moves.
    items:
      - id: editTools
        label: File & edit tools
        icon: folder
        note: Read, write, edit, glob and grep across the cloned repository.
      - id: shell
        label: Shell commands
        icon: code
        note: >
          Command execution inside the session sandbox — and the place a hook, a task file or
          a virtual-environment interpreter written now is executed later by a tool nobody
          sandboxed.
      - id: skills
        label: Installed skills
        icon: gear
        note: >
          Packaged instructions the repository or the environment names, downloaded at session
          start — content that executes as instruction.
      - id: computerUse
        label: Computer use
        icon: eye
        note: >
          The hosted browser and remote desktop, where offered: the widest reach a session can
          be given, and the one whose content returns unclassified.

  - id: vendorService
    kind: provider
    title: Vendor service
    cosaiComponent: componentApplication
    zone: zoneVendor
    col: 4
    row: 2
    note: >
      The published surfaces of the vendor's control plane: the settings that reach a hosted
      session (server-managed, never the device's), the shared environments an owner defines,
      the org-level switch for the hosted mode, the relay behind the phone and the channel,
      the scheduler behind routines and automations, and the connector service that calls MCP
      servers on the session's behalf. This is the tier a hosted session is admitted by; the
      runtime above is the tier it executes in.
    items:
      - id: managedSettings
        label: Managed settings
        icon: gear
        note: >
          Server-managed settings and organisation-shared environments — network access level,
          environment variables, setup script — plus the toggles that enable hosted mode at all.
      - id: connectorBroker
        label: Connector broker
        icon: plug
        note: >
          The vendor's MCP and connector service, calling our gateway and third-party servers
          from the vendor's side, outside the sandbox's egress policy, on tokens the vendor holds.
      - id: auditExport
        label: Session audit export
        icon: eye
        note: >
          Session logs, agentic audit events and compliance exports — whose coverage of the
          hosted surface differs by product and plan, and is verified rather than assumed.
      - id: remoteSessions
        label: Remote & scheduled sessions
        icon: phone
        note: >
          The relay that admits a phone or a channel to a running session, and the scheduler
          that starts one with nobody present at all.

  - id: aiGateway
    kind: service
    title: AI gateway
    zone: zoneCloud
    col: 3
    row: 3
    note: >
      The customer-operated crossing where the vendor's connector service is admitted to our
      MCP servers: the one component on the reach-back path where the grant is ours to scope
      and revoke and the call is recorded on our terms. Not on the inference path — nothing in
      this class routes the hosted loop's model calls through us.
    items:
      - id: gwTools
        label: MCP & API gateway
        icon: plug
        note: Which of our servers a hosted session may reach, and on whose grants.

  - id: internalTools
    kind: service
    title: Tool services
    cosaiComponent: componentTools
    zone: zoneCloud
    col: 2
    row: 3
    pack: toolServicesRemote
    note: >
      Our own MCP servers and connectors — ticketing, documentation, systems of record — that
      a hosted session is adopted in order to reach beyond the repository.

  - id: orgData
    kind: external
    title: Enterprise data
    cosaiComponent: componentDataSources
    zone: zoneCloud
    col: 2
    row: 4
    pack: enterpriseData
    note: The systems of record behind those servers, reached on grants we scope per session.

  - id: sources
    kind: external
    title: Public package sources
    zone: zoneExternal
    col: 5
    row: 0
    note: >
      What the setup phase installs from, straight from the public index under the
      environment's allowlist — the path a mirror would close, and the write-capable host every
      allowlist permits.
    items:
      - id: registries
        label: Package registries
        icon: db
        note: PyPI, npm and the rest — pulled from directly, under the environment's allowlist.
      - id: hubs
        label: Skill & extension hubs
        icon: gear
        note: Skills and plugins the repository or the environment names, fetched at session start.

  - id: downstream
    kind: external
    title: Downstream services
    cosaiComponent: componentDataSources
    zone: zoneExternal
    col: 5
    row: 3
    pack: downstreamPublic
    note: >
      The web the sandbox fetches from in the agent phase, where the environment allows it,
      and where the actions our gateway brokers land.

  - id: extTools
    kind: service
    title: Tool services
    cosaiComponent: componentTools
    zone: zoneExternal
    col: 5
    row: 4
    pack: toolServicesRemote
    note: >
      Third-party servers and connectors our gateway brokers outward — the same component as
      the internal surface, out where nobody we contracted with operates it.

  - id: govIdentity
    kind: governance
    title: Identity services
    icon: person
    zone: zoneGovernance
    col: 0
    row: 5
    mitigations: [ D3-MFA, D3-APA, D3-AA, D3-CR ]
    note: >
      Who may start a session and as whom it runs: federated login and trusted devices at the
      vendor's account layer, write access as the trigger condition at the repository host, and
      an inventory of the App installations, service identities and user-bound sessions a
      product acts through — with an owner and an expiry on each.

  - id: govSecrets
    kind: governance
    title: Secrets & key management
    icon: key
    zone: zoneGovernance
    col: 1
    row: 5
    mitigations: [ D3-CH, D3-CRO, AML.M0012, D3-CTS, D3-TB ]
    note: >
      The repository credential the proxy substitutes, the environment secrets that exist only
      in the setup phase, and customer-managed keys over what the vendor stores — with the
      plan-gated gaps recorded per product rather than assumed of the class.

  - id: govPolicy
    kind: governance
    title: Policy & authorization
    icon: scale
    zone: zoneGovernance
    col: 2
    row: 5
    mitigations: [ AML.M0028, AML.M0029, D3-AMED, AML.M0037, AML.M0030, AML.M0033, AML.M0004, AML.M0036 ]
    note: >
      One branch, no merge, a human reviewer who is not the initiator, workflows that wait for
      approval, a network allowlist an administrator locks, a connector allowlist the session
      cannot widen — and a session budget, because an unattended loop bills by the minute.

  - id: govSupplyChain
    kind: governance
    title: Supply-chain assurance
    icon: db
    zone: zoneGovernance
    col: 3
    row: 5
    mitigations: [ D3-AI, AML.M0008, D3-RC, D3-RS, D3-RD, D3-ORA, D3-CI, AML.M0014, D3-FIM ]
    note: >
      Routines, automations, environments and connector registrations inventoried like agents;
      instruction files and environment definitions reviewed and versioned like code; the
      platform assessed on a clock because its defaults move.

  - id: govObservability
    kind: governance
    title: Observability & response
    icon: eye
    zone: zoneGovernance
    col: 4
    row: 5
    mitigations: [ AML.M0024, D3-SFA, D3-ORA, D3-PT, D3-CR ]
    note: >
      The vendor's session logs and agentic audit events exported and fused with the
      repository host's record and our gateway's — one trail per session, from trigger to
      merge — and a stop whose delay is known: disabling the App or the seat prevents the next
      session, not the one that is running.

edges:
  - from: developer
    to: harness
    path: primary
    bidir: true
    label: local session
    note: >
      The person at the keyboard, in the CLI, the editor or the desktop app — the same
      pattern as the endpoint drawings, used here only as far as the hand-off.
  - from: developer
    to: remoteDevice
    path: primary
    bidir: true
    label: away from the machine
    note: The same person on a phone or in a browser — or, on a chat surface, whoever the channel admits.
  - from: harness
    to: managedRuntime
    path: external
    bidir: true
    label: hand-off / teleport
    note: >
      The local conversation and the working branch become a hosted session; the cloud branch
      and its history come back the same way. Asymmetric on most products: a terminal session
      cannot be pushed up mid-task, but the desktop app can, and a finished cloud session can
      be pulled down.
  - from: remoteDevice
    to: vendorService
    path: external
    bidir: true
    label: start & steer session
    note: >
      The phone, the browser or the channel talks to the vendor's relay directly. Nothing we
      operate is on this path — a personal device on a cell network has no reason to traverse
      our egress — so admission is the vendor's account binding and whatever the managed
      settings allow, and on a channel it is whoever the channel admits.
  - from: vendorService
    to: managedRuntime
    path: primary
    label: settings, environment & schedules
    note: >
      The control plane admitting a session to the runtime: which environment it runs in, what
      the server-managed settings permit, which connectors it may call, and — from the
      scheduler — sessions that start with nobody present at all.
  - from: managedRuntime
    to: sourceControl
    path: external
    bidir: true
    route: vh
    label: events in, branch & PR out
    note: >
      Both directions of the repository host. Inward: an issue assigned, a comment, a CI
      failure or a review starts or steers a session, and the instruction files and threads
      enter its context. Outward: the clone through the git proxy on a scoped credential, the
      push to the session's own branch, and the draft pull request — the only write the
      runtime is permitted.
  - from: developer
    to: sourceControl
    path: primary
    bidir: true
    route: vh
    label: review & merge
    note: >
      The gate. A person reviews the draft, approves the workflows it would fire, and merges —
      or does not. The initiator's approval does not count on the products that enforce it,
      and the agent cannot approve, mark ready or merge on any of them.
  - from: vendorService
    to: aiGateway
    path: external
    bidir: true
    route: vh
    label: to the approved vendor
    note: >
      The reach-back path, and the crossing this drawing exists to govern: compute we do not
      operate calling back into our systems for data connectors. The vendor's connector
      service is admitted to our MCP endpoint here — the gateway's aggregate MCP surface, never
      a server or the data directly — on audience-bound tokens and per-user grants our own
      authorization server issued, with per-call policy evaluated at the gateway, the servers
      and tools it may reach scoped to a named list, and every call recorded against the grant.
      The vendor's own identity and IP ranges admit the caller; they authorise nothing. The
      outbound-only tunnel form both first-party vendors also ship — a client we run that dials
      out so the endpoint stays private — terminates at this same gateway and is recorded as a
      deviation rather than drawn as a second path.
  - from: aiGateway
    to: internalTools
    path: primary
    bidir: true
    label: brokered tool calls
    note: Which of our servers a hosted session may call, on short-lived grants we issue.
  - from: internalTools
    to: orgData
    path: primary
    bidir: true
    label: scoped reads & writes
    note: The records and systems the session was adopted to reach beyond the repository.
  - from: aiGateway
    to: extTools
    path: external
    bidir: true
    route: vh
    label: brokered external calls
    note: >
      Third-party servers and connectors reached through the crossing that admitted them —
      egress and returned-content classification enforced at our boundary. The connectors the
      vendor calls from its own side never meet this list; that path is recorded as a
      deviation.
  - from: extTools
    to: downstream
    path: external
    bidir: true
    label: action / returned content
    note: Actions landing outside, and the content they return.
  - from: nativeTools
    to: sources
    path: external
    bidir: true
    route: vh
    label: setup installs
    note: >
      The setup phase pulling dependencies from the public index under the environment's
      allowlist — a phase that has network before the agent does, runs whatever the setup
      script says, and caches its result for the next user of the environment. The registry
      is also a write-capable host every allowlist permits, which is what makes it an
      exfiltration channel.
  - from: nativeTools
    to: downstream
    path: external
    bidir: true
    route: hv
    label: web fetch under egress policy
    note: >
      The sandbox's own reach to the web in the agent phase, where the environment allows it —
      closed by default on some products, open by default on others — and the content that
      comes back as instruction.

pins:
  risks:
    - risk: riskPromptInjection
      at: sourceControl->managedRuntime
      note: >
        Issue text, comments, review threads and instruction files enter the session as
        instruction, and most are writable by people with no commit access. The dominant
        ingress of the archetype, and the one every 2026 incident used.
    - risk: riskPromptInjection
      at: nativeTools->downstream
      note: >
        A fetched page enters a loop nobody is watching. On the products where the agent phase
        has internet by default this is the unclassified ingress the environment policy exists
        to close.
    - risk: riskPromptInjection
      at: aiGateway->extTools
      note: Content returning from a brokered outbound action re-enters a context we do not hold.
    - risk: riskSensitiveDataDisclosure
      at: nativeTools->sources
      note: >
        The hosts every allowlist permits are write-capable: a gist, a package publish, a
        pages site. Stolen tokens left through the repository host itself in the 2025 supply
        chain worm, and through a public index in the vendor's own 2026 evaluation incidents.
    - risk: riskSensitiveDataDisclosure
      at: managedRuntime
      note: >
        The repository, the transcript, tool output and environment variables all live on
        their side under their retention terms; sessions persist after the browser closes,
        snapshots outlive the run, and on some plans a session can be shared publicly with
        private-repository content inside it.
    - risk: riskRogueActions
      at: managedRuntime->sourceControl
      note: >
        A push, a pull request, a reply on the thread — from a loop that reads its own
        thread. An agent's reply can fire comment-triggered automation, and an automation
        configured to approve low-risk pull requests removes the gate this drawing rests on.
    - risk: riskAgenticDelegationConfusedDeputy
      at: managedRuntime->sourceControl
      note: >
        The session exercises the user's grant, an App installation's, or a shared service
        identity's — whichever the product uses — and the repository host cannot tell an
        injected instruction from an intended one. What bounds it is the token's scope: one
        repository, one branch, no merge.
    - risk: riskToolSourceProvenance
      at: nativeTools->sources
      note: >
        Dependencies and skills pulled from a public index in a phase that has network and
        runs as root in the sandbox — admitted by the environment's allowlist and vetted by
        nobody on the path.
    - risk: riskToolSourceProvenance
      at: sourceControl
      note: >
        Instruction files arrive with the clone. A CLAUDE.md or AGENTS.md shipped inside a
        dependency, a hook committed by a worm, a setup script edited by anyone with access to
        the environment: content that executes as instruction, delivered through the supply
        chain.
    - risk: riskShadowAndUnknownAgents
      at: remoteDevice->vendorService
      note: >
        A channel raises sessions for whoever it admits, a schedule runs them for an owner who
        may have left, and none of it appears in any inventory we keep unless the vendor's
        export is queried.
    - risk: riskRunawayAgentToolLoops
      at: vendorService->managedRuntime
      note: >
        Automations that re-run on CI failure and review comments, and sessions that reply to
        their own threads, make a loop with no natural end — billed by the minute and bounded
        only by the budget the tenant sets.
    - risk: riskStaleAgentIdentityBinding
      at: managedRuntime
      note: >
        A session bound to a user's account keeps that grant after the person has gone; an
        App installation keeps its scope after the team that installed it has moved on; a
        shared automation identity outlives every owner it had. Nothing on the vendor's side
        ties any of them to a lifecycle we run.
    - risk: riskCrossTenantCredentialPropagation
      at: vendorService->aiGateway
      note: >
        The grant the vendor's connector service presents to our gateway is the load-bearing
        secret on the reach-back path, and it is held on the vendor's side: a connector grant
        attached to an environment rather than a person, an environment variable visible to
        everyone who shares the environment, a setup cache kept for hours, a tunnel token on a
        host we run — each a way one session's authority becomes another's, on infrastructure
        nobody of ours watches.
    - risk: riskAgenticDelegationConfusedDeputy
      at: vendorService->aiGateway
      note: >
        Their infrastructure exercising our authority, steered by whatever the session read.
        The grant is the only thing bounding it, and the grant is issued at our gateway — which
        is the entire argument for drawing one and for never letting the vendor's tunnel or
        allowlisted IP range reach past it.
  mitigations:
    - mitigation: D3-MFA
      at: vendorService
      note: >-
        Federated login and trusted-device enrolment at the vendor's account layer, hosted mode enabled per
        role or group rather than per organisation, and the relay bound to the owner's account — Zone-2
        configuration, because nothing we operate is on the remote path.
    - mitigation: D3-APA
      at: vendorService
      note: >-
        Federated login and trusted-device enrolment at the vendor's account layer, hosted mode enabled per
        role or group rather than per organisation, and the relay bound to the owner's account — Zone-2
        configuration, because nothing we operate is on the remote path.
    - mitigation: D3-MFA
      at: sourceControl->managedRuntime
      note: >-
        Only a verified human with write access may start a session from the repository host; Apps and bots
        may not. The condition the 2026 trigger-bypass fix restored, and the one setting that decides whether
        a public issue is an attack surface.
    - mitigation: D3-APA
      at: sourceControl->managedRuntime
      note: >-
        Only a verified human with write access may start a session from the repository host; Apps and bots
        may not. The condition the 2026 trigger-bypass fix restored, and the one setting that decides whether
        a public issue is an attack surface.
    - mitigation: D3-AA
      at: managedRuntime
      note: >-
        Every App installation, service identity and user-bound session inventoried as a non-human identity
        with an owner and an expiry — because the products act through three different kinds of principal and
        "revoke this agent" means a different operation for each.
    - mitigation: D3-CR
      at: managedRuntime
      note: >-
        Every App installation, service identity and user-bound session inventoried as a non-human identity
        with an owner and an expiry — because the products act through three different kinds of principal and
        "revoke this agent" means a different operation for each.
    - mitigation: D3-CH
      at: vendorService
      note: >-
        Environment secrets injected for the setup phase and removed before the agent runs, or redacted from
        transcripts and commits where the product offers that; environment variables treated as visible to the
        model. The plan-gated exceptions — proxied API credentials available on some plans and not others —
        recorded per product.
    - mitigation: D3-CRO
      at: vendorService
      note: >-
        Environment secrets injected for the setup phase and removed before the agent runs, or redacted from
        transcripts and commits where the product offers that; environment variables treated as visible to the
        model. The plan-gated exceptions — proxied API credentials available on some plans and not others —
        recorded per product.
    - mitigation: AML.M0012
      at: managedRuntime
      note: >-
        Customer-managed keys over the vendor's storage of repositories, snapshots and transcripts, where the
        product offers them — with what they do not cover recorded.
    - mitigation: AML.M0028
      at: managedRuntime->sourceControl
      note: >-
        A token that reaches one repository and one branch, cannot push the default branch, mark ready,
        approve or merge; protected scopes and repository blocklists on the products that have them; a session
        that can reach only repositories its trigger could already reach.
    - mitigation: AML.M0028
      at: vendorService
      note: >-
        The connector and MCP allowlist the session cannot widen, the network access level an administrator
        locks, and the built-in tools the environment enables — the settings that make "the sandbox reaches
        only what we named" true.
    - mitigation: AML.M0028
      at: vendorService->aiGateway
      note: >-
        The strict half of the crossing: the vendor's connector service reaches one aggregate MCP endpoint,
        never a server or the data; the endpoint fronts a named list of servers and tools per vendor, per
        environment where the product supports it; and a grant is scoped to that list and to the session's
        user. A marketplace that admits every server to every caller is the failure this pin exists to name.
    - mitigation: D3-AMED
      at: aiGateway
      note: >-
        Per-call policy evaluated at the gateway, outside the loop being governed: audience, grant scope,
        destination, rate and the returned content's classification — decided on every call, because the
        caller is a loop somebody else operates and something it read may be steering it.
    - mitigation: AML.M0037
      at: aiGateway
      note: >-
        Per-call policy evaluated at the gateway, outside the loop being governed: audience, grant scope,
        destination, rate and the returned content's classification — decided on every call, because the
        caller is a loop somebody else operates and something it read may be steering it.
    - mitigation: AML.M0030
      at: aiGateway
      note: >-
