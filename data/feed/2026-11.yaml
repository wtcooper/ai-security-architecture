  - id: lovable-supabase-exposure
    date: 2026-11-02
    title: "Lovable-built apps: 24,664 sites hand out Supabase database records to anyone who loads them"
    summary: >
      Crissy Field, with Handelsblatt, examined 159,041 projects built with the Lovable app builder and found
      24,664 of the 34,545 using Supabase sending database records on page load without a login; 10,560 tables
      with email addresses sat on 7,403 sites, and one forum exposed more than 80,000 profiles and 200,000 chat
      messages. The researchers could not establish whether any data was misused.
    category: exposed
    perspective: target
    evidence: reported
