      - mitigation: cap-agent-egress-control
        coverage: partial
        mechanism: >-
          VS Code ChatAgentNetworkFilter with ChatAgentAllowedNetworkDomains / ChatAgentDeniedNetworkDomains
          (fetch tool and integrated browser; in Copilot harness sessions also the runtime's web fetch tool);
          managed sandbox.userPolicy.network allowedHosts / blockedHosts for sandboxed commands in Copilot harness
          sessions; Domain() managed permissions in Agent Host sessions; Copilot service domains at the proxy
        steps:
          - title: Turn on the agent network filter with an allowlist
            body:
              - >-
                Set ChatAgentNetworkFilter=true and list ChatAgentAllowedNetworkDomains (wildcards allowed), with
                ChatAgentDeniedNetworkDomains taking precedence; in Copilot harness sessions a non-empty allowed list
                also blocks the runtime's web fetch tool outside it, even with Allow all.
            url: https://code.visualstudio.com/docs/enterprise/ai-settings
          - title: Limit sandboxed commands to your hosts
            body:
              - >-
                With the managed sandbox required, list sandbox.userPolicy.network.allowedHosts (a non-empty list
                blocks hosts that do not match) and blockedHosts; on Windows the sandbox relies on programs
                honouring the proxy.
            url: https://docs.github.com/en/copilot/reference/enterprise-administrators/enterprise-managed-settings
          - title: Deny domains in managed permissions
            body:
              - >-
                Use Domain(...) selectors under permissions.deny for hosts Agent Host sessions must never reach;
                *.example.com covers subdomains.
            url: >-
              https://docs.github.com/en/copilot/reference/enterprise-administrators/enterprise-managed-settings
          - title: Allowlist the Copilot service domains at the proxy
            body:
              - >-
                Permit *.githubcopilot.com with the plan-specific *.business or *.enterprise.githubcopilot.com, the
                github.com login and copilot_internal endpoints and copilot-proxy.githubusercontent.com; pull the
                current set from gh api meta.
            url: https://docs.github.com/en/copilot/reference/copilot-allowlist-reference
        note: >-
          Partial by the rule applied to every vendor: the domain allowlist covers only some tools and is not
          fully admin-lockable. The network filter binds the fetch tool and the integrated browser (and, in
          Copilot harness sessions, the runtime's web fetch); sandboxed commands in Copilot harness sessions are
          bound by the managed sandbox host rules, which on Windows depend on programs honouring the proxy, and
          the deprecated chat.agent.sandbox.retryWithAllowNetworkRequests still lets Local harness users retry a
          blocked command with unrestricted network. Remote MCP servers, extensions,
          the extension host and the agent's own API traffic bypass it; JetBrains' managed sandbox (preview)
          has network switches; Visual Studio, Xcode and Eclipse rely on the host firewall or SSE.
        verified: "2026-10-30"
        migration:
          from:
            - capabilityEgressControl
          reviewRequired: false
          original:
            - capability: capabilityEgressControl
              coverage: native
              mechanism: >-
                VS Code ChatAgentNetworkFilter with ChatAgentAllowedNetworkDomains / DeniedNetworkDomains,
                sandbox allowNetwork, Domain() managed permissions, documented proxy allowlist
              steps:
                - title: Turn on the agent network filter with an allowlist
                  body:
                    - Set ChatAgentNetworkFilter=true; with both domain lists empty all domains are blocked, so add
                      ChatAgentAllowedNetworkDomains entries (wildcards allowed) and let
                      ChatAgentDeniedNetworkDomains take precedence.
                  url: https://code.visualstudio.com/docs/enterprise/ai-settings
                - title: Deny domains in managed permissions
                  body:
                    - Use Domain(...) selectors under permissions.deny for hosts the agent's fetch and browser tools must never
                      reach; host matching is case-insensitive and *.example.com covers subdomains.
                  url: >-
                    https://docs.github.com/en/copilot/reference/enterprise-administrators/enterprise-managed-settings
                - title: Allowlist the Copilot service domains at the proxy
                  body:
                    - Permit *.githubcopilot.com plus the plan-specific *.business or *.enterprise.githubcopilot.com, the
                      github.com login and copilot_internal endpoints and copilot-proxy.githubusercontent.com; pull
                      the current set from gh api meta.
                  url: https://docs.github.com/en/copilot/reference/copilot-allowlist-reference
              note: >-
                VS Code only: the network filter and sandbox allowNetwork bound agent fetches and sandboxed
                commands there; other editors are bounded by host network policy. Remote MCP servers connect
                outside the filter.
              verified: 2026-09-10
