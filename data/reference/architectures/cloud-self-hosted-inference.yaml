id: archSelfHostedInference
surface: surfaceCloud
rank: 5
title: Self-hosted model inference
abbrev: Self-hosted inference

summary:
  - >
    An open-weights model served on infrastructure the organisation operates — the same
    inference runtime as the endpoint local model runtime, with an AI gateway in front of it and
    a governance plane behind it. Weights land in storage from a public hub or the
    organisation's own fine-tuning pipeline, and the whole model-provider role moves inside the
    boundary.

description:
  - >
    The trade is explicit: the provider-boundary disclosure risk goes away and a supply-chain,
    availability and safety risk arrives — while logs, caches, storage and co-tenancy keep
    their own disclosure paths in-house. There is no provider applying content policy, no provider absorbing a
    traffic spike, and no provider patching the serving stack. Every control a managed API
    supplies by default is now a component this organisation runs or does without — which is why
    the gateway and the governance plane are the blocks that separate this architecture from the
    same software installed by one person on a workstation.
  - >
    The supply chain is the distinctive risk. Weights are large artifacts that arrive in storage
    from a public hub or from the organisation's own fine-tuning pipeline, and several
    distribution formats execute code on load. The control is scanning and format policy in the
    promotion gate, before an artifact reaches the runtime — a blocking gate, not a report — and
    digest verification at load, so the gate cannot be bypassed by writing to storage directly.
  - >
    Multi-tenancy inside the runtime has no equivalent elsewhere in this catalogue. Continuous
    batching mixes tenants' requests in one forward pass on shared accelerators, the KV cache
    holds their context, and prefix caching across tenants is a performance feature that is also
    a disclosure path. Whether cache entries may be shared across tenants is a serving
    configuration flag with data-protection consequences, and it rarely reaches a review.
  - >
    Availability is a security property here in a way it is not with a managed API. Capacity is
    finite and expensive, admission control at the gateway is what stops one caller becoming
    everyone else's outage, and quotas are a control rather than a billing feature.

distinguishedBy:
  - >
    Against the endpoint local model runtime: identical software, entirely different operational
    position. There it was installed by one person and has no inventory entry; here it has a
    gateway in front, a promotion pipeline, an identity and someone on call.
  - >
    Against consuming a managed model API: this architecture replaces one boundary crossing with
    a whole subsystem. The guardrails, abuse monitoring, capacity management and patching the
    provider was doing are now blocks on this diagram.

exemplars:
  - name: vLLM
    note: >
      The serving runtime this drawing's runtime block describes — continuous batching, paged
      attention, prefix caching — whose security guide documents the opt-in API key, the
      unauthenticated auxiliary endpoints and the trusted-network assumption the notes cite.
    url: https://docs.vllm.ai
    asOf: "2026-09"
  - name: KServe
    note: >
      Model serving on Kubernetes with an inference-aware routing layer in front — the
      cluster-scheduled shape of this architecture, storage-to-runtime load path included.
    url: https://kserve.github.io/website/
    asOf: "2026-09"
  - name: SGLang
    note: >
      A second serving stack with the same co-tenancy mechanics (radix-tree prefix caching
      across requests), illustrating that the cache-sharing disclosure path is a property of
      the class, not one product.
    url: https://docs.sglang.ai
    asOf: "2026-09"

zones:
  - id: zoneCloud
    owner: cloud
    note: >
      Everything we operate. This architecture is almost entirely one band, which is the point:
      the organisation took the model in-house and inherited every control the provider was
      applying on the way in and out.
  - id: zoneExternal
    owner: external
    note: Outside the company — the public hubs and pipelines the weights arrive from.
  - id: zoneGovernance
    owner: governance
    note: >
      Drawn across every band because it governs every band. With no vendor and no human in the
      request path, admission of the artifact and inventory of the runtime are most of what
      governance can do here.

blocks:
  - id: consumers
    kind: service
    title: Consuming applications
    zone: zoneCloud
    icon: code
    col: 0
    row: 1
    note: >
      Internal applications and agents sharing one cluster. Their isolation from each other is a
      property of the serving configuration, not of the network between them.

  - id: gateway
    kind: service
    title: AI gateway
    zone: zoneCloud
    col: 1
    row: 1
    note: >
      The governed front door in front of finite capacity — the same gateway block every hosted
      architecture in this catalogue routes through. With no provider applying content policy,
      the guardrail checks enforced here are a service the organisation runs itself or does
      without. Its items are the traffic classes it brokers — the checks it runs are the
      numbered pins on this block and its edges, and the call-outs beneath.
    items:
      - id: gwModel
        label: Model proxy
        icon: model
        note: The one traffic class this gateway carries — inference, brokered per tenant.

  - id: api
    kind: service
    title: Inference API
    cosaiComponent: componentModelServing
    zone: zoneCloud
    col: 2
    row: 1
    note: >
      The OpenAI-compatible endpoint the serving stack publishes — the same component the
      local runtime draws, at a different scale. Authentication here is opt-in too: vLLM's
      `--api-key` is a flag, not a default, and a serving tier reachable without one is the
      same failure as an unauthenticated laptop, with a much larger blast radius.
    items:
      - id: endpoint
        label: Completion endpoint
        icon: plug
        note: The published interface every internal caller shares.
      - id: binding
        label: Interface binding
        icon: gear
        note: Which network the tier is reachable from, and the whole of the trust boundary if auth is off.

  - id: runtime
    kind: service
    title: Inference runtime
    zone: zoneCloud
    col: 3
    row: 1
    cosaiComponent: componentModelServing
    note: >
      The same runtime the endpoint architecture draws — loading weights, batching requests,
      serving completions — operated here as a shared service across tenants on shared
      accelerators. The serving stack is third-party code with its own CVE stream, and its
      distributed control plane assumes a trusted network: job APIs and inter-node channels
      ship unauthenticated by design, so network isolation is a control, not a hardening step.
    items:
      - id: loader
        label: Weight loader
        icon: gear
        note: Where a pickle-based format turns file opening into code execution — and where the registry digest is verified.
      - id: model
        label: Loaded model
        icon: model
        note: Open weights with no provider-side guardrail, abuse monitoring or content policy.
      - id: batching
        label: Continuous batching
        icon: gear
        note: Mixes tenants' requests in one forward pass on shared accelerators. Efficiency and co-tenancy are the same mechanism.
      - id: cache
        label: KV & prefix cache
        icon: db
        note: >
          Tenants' live context, held to avoid recomputing it. Sharing prefixes across tenants
          is a performance feature and a disclosure path in the same flag.

  - id: storage
    kind: external
    title: Storage
    zone: zoneCloud
    col: 4
    row: 1
    cosaiComponent: componentModelStorage
    note: >
      Versioned weight artifacts with provenance and a promotion state — expensive to reproduce,
      trivial to copy. Nothing serves that was not promoted, provided the load path verifies the
      digest.
    items:
      - id: files
        label: Model files
        icon: db
        note: Multi-gigabyte artifacts whose format determines whether loading them is deserialization or execution.

  - id: sources
    kind: external
    title: Model sources
    zone: zoneExternal
    col: 5
    row: 1
    cosaiComponent: componentModelStorage
    note: >
      Where hub weights come from: a public catalogue, where publisher identity says nothing
      about what the artifact does on load. The organisation's own fine-tuned models do not
      enter here — they arrive from the model registry, inside our custody.
    items:
      - id: hub
        label: Open-weights catalogue
        icon: db
        note: Declared behaviour and actual behaviour are separate facts.

  - id: govIdentity
    kind: governance
    title: Identity services
    icon: person
    zone: zoneGovernance
    col: 1
    row: 5
    capabilities: [capabilityNhiManagement]
    note: >
      Workload identity per calling tenant — the thing every quota, cache-isolation and
      attribution decision on this page keys off, issued by the platform rather than a shared
      key in a config map.

  - id: govSupplyChain
    kind: governance
    title: Supply-chain assurance
    icon: db
    zone: zoneGovernance
    col: 4
    row: 5
    capabilities: [capabilityModelScanning, capabilityAiBom, capabilityStagedRollout]
    note: >
      Format and content inspection as a blocking gate in the promotion pipeline, and the
      record of which artifact is actually serving. The control a managed provider would have
      supplied, now operated in-house.

  - id: govPolicy
    kind: governance
    title: Policy & authorization
    icon: scale
    zone: zoneGovernance
    col: 3
    row: 5
    capabilities: [capabilityRateLimiting, capabilityModelGuardrails]
    note: >
      Per-tenant ceilings on finite capacity — what stops one caller becoming everyone's outage
      — and the content policy no provider is applying any more.

  - id: govSecrets
    kind: governance
    title: Secrets & key management
    icon: key
    zone: zoneGovernance
    col: 2
    row: 5
    capabilities: [capabilitySecretsManagement, capabilityModelWeightProtection]
    note: >
      The internal credentials this system runs on — storage pulls, registry reads,
      control-plane tokens — and the weights themselves treated as an asset worth protecting
      rather than a file on a disk.

  - id: govObservability
    kind: governance
    title: Observability & response
    icon: eye
    zone: zoneGovernance
    col: 5
    row: 5
    capabilities: [capabilityAuditLogging, capabilityAiSpm, capabilityAiRedTeaming, capabilityAiVulnMgmt]
    note: >
      Which versions serve where and at what configuration — including whether cross-tenant
      cache sharing is on — plus per-version red teaming, because a new checkpoint from the
      same publisher is a new model nobody else has tested.

  - id: registry
    kind: service
    title: Model registry
    cosaiComponent: componentModelStorage
    zone: zoneCloud
    col: 4
    row: 0
    note: >
      The fine-tuning pipeline's output, and the block the two drawings share literally: a
      promoted release arrives here signed by an identity the training job never held, with
      lineage back to its data, base and run. What it publishes needs no second gate — its
      signature and lineage are verified, not re-evaluated.
    items:
      - id: releases
        label: Signed releases
        icon: shield
        note: Signature and lineage are the admission evidence; withdrawal here is refusal at load everywhere.

edges:
  - from: consumers
    to: gateway
    path: primary
    bidir: true
    label: inference request
    note: >
      The tenant on the token is what quotas and cache-isolation decisions key off. A request
      that arrives without one gets whatever the default tenant can do.
  - from: gateway
    to: api
    path: primary
    bidir: true
    label: brokered inference
    note: >
      Every caller crosses the gateway, which is where the tenant identity, the per-tenant
      quota and the spend attribution live — the things the endpoint drawing has nowhere to
      put.
  - from: api
    to: runtime
    path: primary
    bidir: true
    note: >
      Admitted requests scheduled into the batch; completions back through the guardrail checks.
      Output-side policy is the half most often omitted when self-hosting.
  - from: registry
    to: storage
    path: primary
    label: promoted release
    note: >
      A signed release lands in the store with its promotion record; the load path verifies
      the signature against it. This is where this drawing meets the training pipeline.
  - from: sources
    to: storage
    path: external
    label: weights in
    note: >
      Artifacts arrive in storage — fetched from the hub by the ingest tooling, or published
      by the fine-tuning pipeline's registry. The serving runtime holds no source-fetch
      credentials; provenance establishes who made the artifact and nothing about what it
      does on load.
  - from: storage
    to: runtime
    path: primary
    label: load
    note: >
      Only promoted artifacts load, digest-verified against the promotion record. Without
      that verification the gate can be bypassed by writing to storage directly.
pins:
  risks:
    - risk: riskSensitiveDataDisclosure
      at: api
      note: >
        The endpoint's own exposure, distinct from the cache story pinned on the runtime:
        authentication is opt-in on this class of server, and a completion endpoint reachable
        without it hands every tenant's model to whatever can route to the binding.
    - risk: riskModelSourceTampering
      at: sources
      note: Publisher identity is the only assurance the hub offers, and it says nothing about the artifact's behaviour.
    - risk: riskMaliciousLoaderDeserialization
      at: storage->runtime
      note: >
        Several weight formats execute code on load, and the loader is where the file is
        opened. Format policy at promotion is what keeps this leg deserialization rather than
        execution.
    - risk: riskModelExfiltration
      at: storage
      note: The stored artifact is expensive to reproduce and trivial to copy, which makes storage access control an asset-protection question.
    - risk: riskModelDeploymentTampering
      at: storage->runtime
      note: A load path that skips digest verification turns the promotion gate into a suggestion.
    - risk: riskInsecureIntegratedComponent
      at: runtime
      note: The serving stack is third-party code with its own CVE stream, and no provider is patching it on anyone's behalf.
    - risk: riskInsecureIntegratedComponent
      at: gateway
      note: >
        The gateway is third-party code holding every tenant's brokered credentials — a
        compromised release of the gateway itself is the whole credential portfolio, a supply
        chain incident class with recent precedent.
    - risk: riskAcceleratorAndSystemSideChannels
      at: runtime
      note: Shared accelerators are a physical substrate common to every tenant, below every namespace boundary.
    - risk: riskSensitiveDataDisclosure
      at: runtime
      note: >
        The sharpest risk that exists here and not on the endpoint. Continuous batching mixes
        several tenants' requests into one forward pass, and prefix caching makes
        time-to-first-token a side channel — a crafted prefix plus response timing is enough
        to reconstruct prompts and secrets cached from another tenant's request. Efficiency
        and isolation are the same settings; partition the cache by tenant, and note the risk
        compounds under disaggregated serving, where the cache crosses the network onto SSD
        and object storage.
    - risk: riskModelReverseEngineering
      at: api
      note: >
        Sustained query access is all extraction needs, and every internal caller — or
        whatever compromises one — has it. A proprietary fine-tune distilled out through its
        own completion endpoint is theft that looks like traffic; rate ceilings and anomaly
        review on the crossing are the answer.
    - risk: riskDenialOfMLService
      at: consumers->gateway
      note: Capacity is finite and there is no provider to absorb a spike. Admission control here is an availability control, not a billing feature.
    - risk: riskInsecureModelOutput
      at: gateway
      note: With no provider applying output policy, an unguarded return leg hands raw completions to every caller.

    - risk: riskAdapterPEFTInjection
      at: api
      note: >
        Dynamic adapter-loading endpoints load LoRA weights at runtime by path — a second load
        path that skips storage, the digest and the promotion gate, and one the serving stack
        ships behind a flag.
    - risk: riskModelDeploymentTampering
      at: api
      note: >
        Weight-update, pause and abort endpoints outside the versioned API are not covered by
        the API key on the common serving stacks; reachable from a tenant, they swap the model
        under every other tenant.
    - risk: riskMaliciousLoaderDeserialization
      at: runtime
      note: >
        The compile and torch caches are loaded without integrity verification, in formats that
        can execute; a writable cache directory is a write-to-execute path the serving stack's
        own guide says never to share.
  capabilities:
    - capability: capabilityModelWeightProtection
      at: storage->runtime
      note: >
        Verify at load, not at download. For a promoted release that is the OpenSSF Model
        Signing signature with its Sigstore bundle — a detached signature, so nothing has to be
        repackaged; for a hub artifact, which mostly carries none, it is the promotion record's
        digest. This is the gate between the store and the loader.
    - capability: capabilityAiBom
      at: govSupplyChain
      note: >
        The record of which artifact is actually serving — publisher, version, format and the
        scan that cleared it. Without it the question "what is running" has no answer.
    - capability: capabilitySecretsManagement
      at: gateway
      note: >
        The internal credentials the crossing brokers — storage pulls, registry reads,
        control-plane tokens — issued short-lived per call rather than living in the serving
        tier's environment.
    - capability: capabilityAuditLogging
      at: govObservability
      note: >
        Every request and completion recorded from the tap at the crossing every caller
        shares, kept privacy-consciously: the log of an inference service is itself a corpus
        of everything the organisation asked.
    - capability: capabilityAiRedTeaming
      at: govObservability
      note: >
        Per model version, because a new checkpoint from the same publisher is a new model
        nobody else has tested — and there is no provider doing it on our behalf.
    - capability: capabilityModelScanning
      at: sources->storage
      note: >
        Format and content scanning as a blocking gate on ingest, before any artifact can be
        promoted — absorbed by the promotion gate over Storage, per the recorded deviation.
    - capability: capabilityModelEvals
      at: sources->storage
      note: >
        Safety and adversarial evaluation per model version gates promotion — inline on the
        artifact path per the recorded deviation, the ontology's canonical evaluation
        exception.
    - capability: capabilityStagedRollout
      at: storage->runtime
      note: >
        A new version serves a slice before it serves everyone, and the previous promoted
        artifact stays loadable — rollback is a registry operation, not a re-download.
    - capability: capabilityAiGateway
      at: gateway
      note: >
        One governed front door for every caller: routing, admission and policy at a single
        crossing.
    - capability: capabilityNhiManagement
      at: consumers->gateway
      note: Workload identity per calling tenant, issued by the platform rather than a shared key in a config map.
    - capability: capabilityRateLimiting
      at: consumers->gateway
      note: Per-tenant quotas on finite capacity, enforced at admission rather than discovered at saturation.
    - capability: capabilityModelGuardrails
      at: gateway
      note: Content and injection classification on both legs, because no provider is applying policy for you.
    - capability: capabilityMlSecureDefaults
      at: runtime
      note: Reviewed serving configuration — batching, cache sharing, tenancy flags — treated as security settings, not tuning knobs.
    - capability: capabilityMemoryProtection
      at: runtime
      note: Tenant-scoped cache keys, so a prefix hit can never cross a tenant boundary.
    - capability: capabilityConfidentialComputing
      at: runtime
      note: Hardware-backed isolation for the highest-sensitivity tenants where shared accelerators are not acceptable.
    - capability: capabilityAiVulnMgmt
      at: govObservability
      note: Track and patch the serving stack's CVE stream on your own schedule, because nobody upstream will.
    - capability: capabilityModelWeightProtection
      at: storage
      note: Encryption, access control and integrity digests on weights at rest, matched by verification at load.
    - capability: capabilityAiSpm
      at: govObservability
      note: Continuous posture over which versions serve where and at what configuration, catching drift before an incident does.

    - capability: capabilityMlSecureDefaults
      at: api
      note: >
        Runtime weight and adapter updating disabled, and the control endpoints outside the
        versioned API unreachable from any tenant — the serving stack's own security guide says
        as much.
    - capability: capabilityEgressControl
      at: runtime
      note: >
        The distributed serving plane talks between nodes with no authentication by design;
        network isolation of that plane is the control, absorbed by platform network policy per
        the recorded deviation.
walkthrough:
  title: A tenant calls the endpoint
  moves: >-
    Prompts from our own services into weights we host, and completions back.
  steps:
    - follow: consumers->gateway
      note: The workload identity on the request decides its quota and its cache scope.
    - follow: gateway->api
      note: Admitted within quota, with the input-side guardrail applied at the crossing.
    - follow: api->runtime
      note: >
        Scheduled into a batch alongside other tenants' traffic; tenant-scoped cache keys are
        what keep the prefix lookup safe.
    - follow: runtime->api
      note: The completion leaves the batch — raw model output, nothing yet between it and the caller.
    - follow: api->gateway
      note: Back through the crossing, where the output-side guardrail runs — the half most often omitted.
    - follow: gateway->consumers
      note: The completion returns to the tenant that asked, attributed and metered.

scenarios:
  - title: A new checkpoint is promoted
    steps:
      - follow: sources->storage
        note: >
          A hub artifact arrives with provenance recorded. Scanning and per-version evaluation
          gate its promotion here — blocking, or it is not a gate.
      - follow: registry->storage
        note: >
          A release from our own pipeline arrives already gated: its signature and lineage are
          verified, and nothing is evaluated twice.
      - follow: storage->runtime
        note: >
          The promoted artifact loads, digest-verified against the promotion record, and
          serves a staged slice first — with the previous version still loadable if the slice
          misbehaves.
  - title: A spike hits finite capacity
    steps:
      - follow: consumers->gateway
        note: Admission control decides who waits. There is no provider to absorb the spike.
      - follow: gateway->api
        note: Within-quota traffic is scheduled; everything else is shed at the front door rather than at the accelerator.

  - title: A tenant probes another's prefix
    steps:
      - follow: consumers->gateway
        note: A crafted prompt sharing a suspected prefix with another tenant's traffic, well within quota.
      - follow: gateway->api
        note: Admitted like any call; nothing at the crossing knows what the prefix is for.
      - follow: api->runtime
        note: >
          Time to first token says whether the prefix was already cached by someone else.
          Tenant-scoped cache keys make the answer always no — the drawing's sharpest risk,
          closed by one configuration flag or open by default.

deviations:
  - subject: No separate GPU or cache blocks are drawn
    reason: >
      The accelerators, the batch and the KV cache are internals of the inference runtime — the
      same block the endpoint architecture draws — so they appear as items inside it rather than
      as blocks, and the multi-tenancy risks pin to the runtime and its serving path.
  - subject: The model registry is folded into Storage and the promotion gate
    reason: >
      Registry semantics — versioning, provenance, promotion state — live in the storage block
      and the governance plane's gate over it; drawing a separate registry service duplicated
      the storage block it fronted. The training pipeline draws the registry in full; this
      drawing consumes it.
  - subject: Admission scanning and per-version evaluation are absorbed by the promotion gate
    reason: >
      capabilityModelScanning is embodied by the private package registry and evaluation is a
      block on the training drawing; here both duties run inside the promotion gate over
      Storage, pinned on the ingest edge — one gate, two checks, on the only path an artifact
      can take to the runtime. Evaluation inline on an artifact path is the ontology's own
      canonical exception.
  - subject: The AI gateway carries inference only
    reason: >
      No MCP, tool or skills traffic exists on this drawing, so the gateway lists its one real
      traffic class rather than the registered aiGatewayTraffic pack — the same honesty rule
      the SaaS drawings and the MCP publisher apply in the other direction.

  - subject: Network isolation of the serving plane is absorbed by platform policy
    reason: >
      The nodes of a distributed serving plane talk to each other unauthenticated by design.
      The control is an isolated network for that plane, delivered by the cluster's network
      policy rather than by any block on the drawing; the pin sits on the runtime because
      that is what it protects.

