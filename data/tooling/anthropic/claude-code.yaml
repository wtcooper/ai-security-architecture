# Claude Code — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
vendor: anthropic
family: Claude Code
tools:
  - id: toolClaudeCode
    name: Claude Code
    surfaceClasses:
      - endpointCli
      - ideExtension
      - desktopApp
    variants:
      - name: Claude Code CLI
        class: endpointCli
      - name: Claude Code for VS Code
        class: ideExtension
      - name: Claude Code for JetBrains IDEs
        class: ideExtension
      - name: Claude Code desktop app
        class: desktopApp
    architecture: archCodingAgentThirdParty
    status: ga
    asOf: 2026-08
    summary:
      - "Two admin channels share one top-precedence managed tier: endpoint-managed settings
        delivered as files or OS policies via MDM/GPO, and server-managed settings configured in the
        claude.ai admin console (Teams/Enterprise, Owner roles) and fetched by clients at login with
        hourly polling. Managed settings outrank command-line flags and all user and project files."
    items:
      - title: Managed settings via MDM, GPO or the admin console
        body:
          - "Endpoint paths: macOS /Library/Application Support/ClaudeCode/managed-settings.json
            (plus a managed-settings.d/ drop-in directory), Linux and WSL
            /etc/claude-code/managed-settings.json, Windows C:\\Program
            Files\\ClaudeCode\\managed-settings.json — the legacy ProgramData path is no longer
            supported as of v2.1.75. OS-policy channels: the macOS managed-preference domain
            com.anthropic.claudecode and the Windows registry key
            HKLM\\SOFTWARE\\Policies\\ClaudeCode."
          - "Server-managed settings cover the same keys from the console, with a caveat the docs
            state plainly: it is a client-side control, not a security boundary, and it is
            unavailable when routing through Bedrock, Vertex or a custom base URL. Endpoint
            management via MDM is the stronger channel; forceRemoteSettingsRefresh makes the server
            channel fail closed at startup."
        links:
          - title: Claude Code settings reference (precedence, paths, keys)
            url: https://code.claude.com/docs/en/settings
          - title: Server-managed settings
            url: https://code.claude.com/docs/en/server-managed-settings
      - title: Permission, MCP and hook lockdown
        body:
          - Pin permission rules with permissions.allow / deny / ask, and set
            allowManagedPermissionRulesOnly to block user- and project-level rules entirely.
            disableAutoMode removes the auto-approval mode from the mode cycle (the settings
            reference's current name; older pages still show disableBypassPermissionsMode).
          - "MCP admission: allowedMcpServers is the allowlist — undefined means unrestricted and an
            empty array is a full lockdown — with deniedMcpServers winning on conflict,
            allowManagedMcpServersOnly, and a managed-mcp.json file for exclusive control of MCP
            configuration. Hooks and sideloading close the remaining gaps: allowManagedHooksOnly,
            disableAllHooks, allowedHttpHookUrls, and disableSideloadFlags to reject --plugin-dir
            and --mcp-config at the command line."
        links:
          - title: Claude Code settings reference
            url: https://code.claude.com/docs/en/settings
      - title: Forced login, credentials and audit telemetry
        body:
          - forceLoginMethod and forceLoginOrgUUID pin sessions to the organisation;
            forceLoginOrgUUID also blocks startup on ambient API-key credentials (v2.1.146+).
            apiKeyHelper substitutes a managed credential script for stored keys.
          - "Fleet-wide audit: set CLAUDE_CODE_ENABLE_TELEMETRY=1 and the OTEL_* exporter variables
            in the managed env block; when the exporter endpoint comes from managed settings,
            conflicting developer-set OTel variables are removed at startup (v2.1.217+). Sessions
            then emit per-tool decision events, prompt and API events (text redacted by default) and
            usage metrics to the organisation's collector."
        links:
          - title: Authentication and IAM
            url: https://code.claude.com/docs/en/iam
          - title: Monitoring and OpenTelemetry
            url: https://code.claude.com/docs/en/monitoring-usage
    controls: []
    sources:
      - title: Claude Code settings reference
        url: https://code.claude.com/docs/en/settings
      - title: Claude Code server-managed settings
        url: https://code.claude.com/docs/en/server-managed-settings
      - title: Claude Code monitoring
        url: https://code.claude.com/docs/en/monitoring-usage
