  - architecture: archActionAgent
    asOf: "2026-10"
    # >>> checked against the vendor's documentation
    verified: "2026-11-18"
    sources:
      events: https://docs.cloud.google.com/pubsub/docs/authenticate-push-subscriptions
      localTools: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sandbox/code-execution-overview
      planner: https://docs.cloud.google.com/architecture/single-agent-ai-system-adk-cloud-run
      stateRetrieval: https://docs.cloud.google.com/run/docs/ai-agents
      gateway: https://docs.cloud.google.com/apigee/docs/api-platform/fundamentals/build-ai-gateway
      internalTools: https://docs.cloud.google.com/architecture/agenticai-orchestrate-access-disparate-systems
      provider: https://docs.cloud.google.com/gemini-enterprise-agent-platform/vertex-ai-name-changes
      orgData: https://docs.cloud.google.com/architecture/agenticai-orchestrate-access-disparate-systems
      registry: https://docs.cloud.google.com/artifact-registry/docs/repositories/remote-overview
    differences:
      - at: gateway->provider
        text: "Google's reference sends model calls from the agent through Model Armor to the model, with Agent Gateway as an optional route. It does not use Apigee. Putting Apigee in front of the model is this mapping's choice, and you build it."
        url: https://docs.cloud.google.com/architecture/single-agent-ai-system-adk-cloud-run
      - at: gateway->internalTools
        text: "Google's reference connects the agent to tool servers on Cloud Run, signed in through Identity-Aware Proxy with Agent Gateway. Routing them through Apigee is this mapping's choice."
        url: https://docs.cloud.google.com/architecture/agenticai-orchestrate-access-disparate-systems
      - at: gateway->openWeb
        text: "Grounding with Google Search is a built-in tool that the model platform runs. It does not pass through your gateway, so your gateway's rules and logs do not cover it."
      - at: localTools->registry
        text: "Generated code runs in Agent Platform Code Execution, a separate service with no network that installs nothing. This flow applies only to building the agent's own image."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sandbox/code-execution-overview
      - at: planner
        text: "Outbound traffic from Cloud Run leaves through Secure Web Proxy, a separate exit from the gateway that is not drawn. The destination allowlist is enforced there."
        url: https://docs.cloud.google.com/secure-web-proxy/docs/overview
      - at: operator->events
        text: "Google's agent kit returns an operator's approval as a direct call to the agent's run endpoint. Returning it as a queued message is not documented, so you build that."
    alsoNeeded:
      - service: "Agent Identity and IAM service accounts"
        role: identity
        why: "The agent's own identity; Google recommends its auth manager over stored secrets."
        url: https://docs.cloud.google.com/run/docs/securing/service-identity
      - service: "Identity-Aware Proxy"
        role: identity
        why: "Signs callers in to tool servers on Cloud Run in Google's reference."
        url: https://docs.cloud.google.com/architecture/agenticai-orchestrate-access-disparate-systems
      - service: "Application Load Balancer with Cloud Armor"
        role: ingress
        why: "Protects incoming webhooks."
      - service: "Secure Web Proxy"
        role: network
        why: "The separate exit for outbound traffic."
        url: https://docs.cloud.google.com/secure-web-proxy/docs/overview
      - service: "VPC Service Controls and Private Service Connect"
        role: network
        why: "Keep the model and data services inside a perimeter."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/general/vpc-service-controls
      - service: "Cloud KMS"
        role: keys
        why: "Your own encryption keys for stored data."
      - service: "Model Armor"
        role: other
        why: "Screens prompts and answers on the way to and from the model."
        url: https://docs.cloud.google.com/model-armor/model-armor-vertex-integration
      - service: "Agent Registry"
        role: registry
        why: "The approved list of agents and tool servers."
        url: https://docs.cloud.google.com/agent-registry/overview
      - service: "Binary Authorization"
        role: registry
        why: "Allows only approved container images to deploy."
      - service: "Cloud Trace, Cloud Logging audit logs and Security Command Center"
        role: logging
        why: "The record of what the agent did, and findings on the project."
        url: https://docs.cloud.google.com/logging/docs/audit/configure-data-access
    # <<< checked
    reference:
      - title: Orchestrate access to disparate enterprise systems
        url: https://docs.cloud.google.com/architecture/agenticai-orchestrate-access-disparate-systems
      - title: Single-agent AI system using ADK and Cloud Run
        url: https://docs.cloud.google.com/architecture/single-agent-ai-system-adk-cloud-run
    summary:
      - >-
        Your own agent on Cloud Run (ADK in Google's references; any framework serves) started only by
        authenticated Pub/Sub pushes and schedules, reaching Gemini and a catalogue of MCP tools through
        an AI gateway (Apigee here), with the tool surface filtered per agent by API product and
        high-value actions parked for an operator. Google's references deploy the agent on Cloud Run
        with Agent Runtime as the managed alternative; that runtime is the API/SDK managed agent runtime
        drawing.
    bindings:
      - block: events
        service: "Pub/Sub push and Cloud Scheduler"
        note: "Eventarc for file drops; an operator's approval returns as a message that resumes the parked step."
        options:
          - { name: "Pub/Sub push and Cloud Scheduler", kind: commercial, url: "https://docs.cloud.google.com/pubsub/docs/overview", note: "Authenticated push subscriptions and cron jobs start runs and carry an operator's reply.", packs: [googleCloudNative] }
          - { name: "Cloud Scheduler and Eventarc triggers", kind: commercial, url: "https://docs.cloud.google.com/eventarc/docs/overview", note: "Eventarc routes Google Cloud and custom events to the agent from Pub/Sub topics, Kafka or third-party sources." }
          - { name: "Managed Service for Apache Kafka", kind: commercial, url: "https://docs.cloud.google.com/managed-service-for-apache-kafka/docs/overview", note: "Google-run open-source Kafka clusters, for organisations whose business events already flow through Kafka." }
      - block: localTools
        service: "Your function tools and Code Execution"
        note: "Tools compiled into the agent run in its container; generated code runs in an Agent Platform Code Execution sandbox."
        options:
          - { name: "Your function tools and Code Execution", kind: commercial, url: "https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sandbox/code-execution-overview", note: "Tools run in the agent's container; generated code runs in an Agent Platform Code Execution sandbox that keeps state up to 14 days.", packs: [googleCloudNative] }
          - { name: "Cloud Run sandboxes", kind: commercial, url: "https://docs.cloud.google.com/run/docs/code-execution", note: "Preview: sandboxes created inside the Cloud Run service or job the agent runs in, for code, sub-agents or a browser." }
          - { name: "Agent Sandbox on GKE with GKE Sandbox", kind: commercial, url: "https://docs.cloud.google.com/kubernetes-engine/docs/concepts/machine-learning/agent-sandbox", note: "A kernel-isolated Pod per agent from the open-source SIG Apps controller, under gVisor or microVMs; you upgrade the controller." }
          - { name: "Agent Sandbox with Kata Containers", kind: open, url: "https://agent-sandbox.sigs.k8s.io/docs/use-cases/examples/kata-gke-sandbox/", note: "The same controller with Kata Containers you install on Ubuntu node pools; Google's support and SLAs do not cover Kata.", packs: [openSourceOnGke] }
          - { name: "Agent Substrate on GKE", kind: commercial, url: "https://docs.cloud.google.com/kubernetes-engine/ai-ml/about-agent-substrate", note: "Google's recommended default for CPU agents: idle sessions suspend and restore in under a second; GKE Standard 1.37+, no GPUs." }
      - { block: planner, service: Your agent on Cloud Run, builtWith: Agent Development Kit (ADK), note: "Google's reference names Agent Runtime on Gemini Enterprise Agent Platform as the alternative, the managed runtime." }
      - block: stateRetrieval
        service: "Firestore and Agent Search"
        note: "Google's reference keeps case state in Agent Platform Sessions or Cloud Storage; Agent Search was Vertex AI Search."
        options:
          - { name: "Firestore and Agent Search", kind: commercial, url: "https://docs.cloud.google.com/firestore/native/docs/overview", note: "Firestore holds case state through a store you write; Agent Search (formerly Vertex AI Search) is the index.", packs: [googleCloudNative] }
          - { name: "Agent Platform Sessions and Memory Bank", kind: commercial, url: "https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/memory-bank", note: "Managed session history and long-term memories per user scope; ADK's VertexAiSessionService needs an Agent Runtime resource.", packs: [agentPlatformGovernance] }
          - { name: "Cloud SQL for PostgreSQL or AlloyDB with pgvector", kind: commercial, url: "https://docs.cloud.google.com/sql/docs/postgres/generate-manage-vector-embeddings", note: "ADK's DatabaseSessionService keeps sessions in PostgreSQL; the same managed database can hold embeddings with pgvector." }
          - { name: "Memorystore for Valkey", kind: commercial, url: "https://docs.cloud.google.com/memorystore/docs/valkey/about-vector-search", note: "Managed Valkey for fast session state, with vector search for retrieval." }
          - { name: "PostgreSQL with pgvector on GKE (CloudNativePG)", kind: open, url: "https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/deploy-pgvector", note: "Google's GKE tutorial runs the CloudNativePG operator with pgvector; you operate the cluster.", packs: [openSourceOnGke] }
      - block: gateway
        service: "Apigee (AI gateway)"
        note: "Agent Gateway is the Agent Platform's own gateway: Google-managed for agents on Agent Runtime, early preview for Cloud Run."
        options:
          - { name: "Apigee (AI gateway)", kind: commercial, url: "https://docs.cloud.google.com/apigee/docs/api-platform/get-started/ai-capabilities", note: "Model Armor, LLM token limits, semantic cache and MCP proxies as policies in an Apigee organisation you provision.", packs: [googleCloudNative] }
