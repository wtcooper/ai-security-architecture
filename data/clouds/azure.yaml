  - architecture: archRemoteMcpServer
    asOf: "2026-10"
    # >>> checked against the vendor's documentation
    verified: "2026-11-18"
    sources:
      idp: https://learn.microsoft.com/en-us/entra/fundamentals/what-is-entra
      gateway: https://learn.microsoft.com/en-us/azure/api-management/mcp-server-overview
      authServer: https://learn.microsoft.com/en-us/entra/agent-id/client-id-metadata-documents
      service: https://learn.microsoft.com/en-us/azure/app-service/configure-authentication-mcp
      orgData: https://learn.microsoft.com/en-us/azure/app-service/overview-managed-identity
    differences:
      - at: callers->authServer
        text: "Entra now also accepts unregistered clients through Client ID Metadata Documents (public preview): Entra fetches the client's metadata URL and creates an agent identity on consent. To keep a pre-registered-only design, turn off user consent for these clients."
        url: https://learn.microsoft.com/en-us/entra/agent-id/manage-client-id-metadata-document-clients
      - at: callers->idp
        text: "Microsoft's guide has clients obtain the server's token directly from Entra, by user sign-in with PKCE or as a registered agent identity. It describes no identity-assertion (ID-JAG) exchange, so plan for sign-in and preauthorized clients rather than ID-JAG."
        url: https://learn.microsoft.com/en-us/entra/agent-id/secure-mcp-server-with-entra-id
      - at: gateway
        text: "API Management policies apply to the whole MCP server, not to single tools, and App Service's built-in authorization is also server-wide. Per-tool scope and role checks must be written in the server's own handlers."
        url: https://learn.microsoft.com/en-us/azure/api-management/mcp-server-overview
      - at: gateway->service
        text: "App Service has its own public endpoint by default, so callers could skip the gateway. Restrict the app to API Management with access restrictions or a private endpoint."
        url: https://learn.microsoft.com/en-us/azure/app-service/overview-access-restrictions
      - at: gateway->service
        text: "API Management forwards most request headers to the backend, but Microsoft notes the Authorization header may need an explicit policy. Without it the server cannot check the caller's token on every call."
        url: https://learn.microsoft.com/en-us/azure/api-management/secure-mcp-servers
      - at: service
        text: "App Service publishes the server's discovery document (protected resource metadata, still in preview) for the address it was reached on. Behind API Management the builder must make that document, the gateway address and the Application ID URI agree."
        url: https://learn.microsoft.com/en-us/azure/app-service/overview-authentication-authorization
      - at: service->authServer
        text: "The server does not ask Entra about each token; it checks signature, issuer and audience locally. A revoked user's token therefore keeps working until it expires, one hour by default."
        url: https://learn.microsoft.com/en-us/entra/identity/users/users-revoke-access
      - at: service->orgData
        text: "On-behalf-of exchange works only for tokens that carry a user. For autonomous callers with app-only tokens the handler must use the server's managed identity and filter by the caller's tenant itself."
        url: https://learn.microsoft.com/en-us/entra/identity-platform/v2-oauth2-on-behalf-of-flow
    alsoNeeded:
      - service: "App Service access restrictions or private endpoint"
        role: network
        why: "Stops callers reaching the MCP server directly, bypassing API Management."
        url: https://learn.microsoft.com/en-us/azure/app-service/overview-access-restrictions
      - service: "Azure Front Door or Application Gateway with web application firewall"
        role: ingress
        why: "Internet-facing protection in front of API Management; not part of the gateway itself."
        url: https://learn.microsoft.com/en-us/azure/api-management/front-door-api-management
      - service: "Azure Key Vault"
        role: secrets
        why: "Holds upstream credentials that handlers use, read through Key Vault references."
        url: https://learn.microsoft.com/en-us/azure/key-vault/general/overview
      - service: "Managed identity for the App Service app"
        role: identity
        why: "The server's own identity for Key Vault and for upstream calls made without a user."
        url: https://learn.microsoft.com/en-us/azure/app-service/overview-managed-identity
      - service: "Virtual network with Azure Firewall"
        role: network
        why: "Outbound traffic from the server is routed through the firewall."
        url: https://learn.microsoft.com/en-us/azure/firewall/overview
      - service: "Log Analytics workspace (Azure Monitor)"
        role: logging
        why: "Receives API Management gateway logs; the server needs its own application logs too."
        url: https://learn.microsoft.com/en-us/azure/api-management/monitor-api-management
      - service: "Azure DevOps with GitHub Advanced Security"
        role: other
        why: "Repository and pipeline service that runs the code and dependency scanning settings."
        url: https://learn.microsoft.com/en-us/azure/devops/repos/security/github-advanced-security-code-scanning
    quickstart:
      - title: "Secure MCP servers with Microsoft Entra authentication - Azure App Service"
        url: https://learn.microsoft.com/en-us/azure/app-service/configure-authentication-mcp-server-vscode
      - title: "Connect and Govern Existing MCP server - Azure API Management"
        url: https://learn.microsoft.com/en-us/azure/api-management/expose-existing-mcp-server
    # <<< checked
    reference:
      - title: Secure a Model Context Protocol (MCP) server with Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/agent-id/secure-mcp-server-with-entra-id
      - title: Secure access to MCP servers in API Management
        url: https://learn.microsoft.com/en-us/azure/api-management/secure-mcp-servers
      - title: Configure built-in MCP server authorization on App Service
        url: https://learn.microsoft.com/en-us/azure/app-service/configure-authentication-mcp
    summary:
      - >-
        Your MCP server on Azure App Service, published through API Management's MCP servers, with
        Microsoft Entra ID as both the identity provider and the authorization server: the server is
        an app registration whose Application ID URI is its canonical URL, so every token is
        audience-bound to it. Entra offers no dynamic client registration, so clients are pre-registered
        and preauthorized, and the organisation's callers are governed where they sign in: the server's
        enterprise app assignment and Conditional Access.
    bindings:
      - { block: idp, service: Microsoft Entra ID, note: "Sign-in, the server's enterprise app assignment and Conditional Access decide who can get a token at all." }
      - { block: gateway, service: Azure API Management (MCP servers) }
      - { block: authServer, service: "Microsoft Entra ID (server app registration)", note: "At login.microsoftonline.com/<tenant>/oauth21/2026-08. No dynamic client registration: clients are pre-registered or, in public preview, named by a Client ID Metadata Document that Entra itself fetches." }
      - { block: service, service: Your MCP server on Azure App Service, note: "Built-in MCP server authorization serves the protected resource metadata; Azure Functions MCP bindings are the serverless alternative." }
      - { block: toolDefs, service: Tool definitions in your repository, build: true, note: "Versioned with the release and pinned by hash where the server loads them." }
      - { block: orgData, service: Your systems of record, build: true, note: "Reached on an on-behalf-of token or the server's own managed identity, never the caller's token." }
    # >>> hosting options (compared against the vendor's pages; one is the mapping itself)
    hosting:
      - id: appService
        kind: runtime
        name: "Azure App Service"
        url: https://learn.microsoft.com/en-us/azure/app-service/overview
        asOf: "2026-11"
        mapped: true
        compare:
          runs: "App Service runs your web app, with the MCP endpoint your code mounts beside its other routes, on the instances of your App Service plan."
          patching: "Azure patches the host and guest operating systems monthly and updates built-in language runtimes; you keep the MCP SDK, dependencies and any custom container current."
          data: "Requests and tool results are handled by your app code on the plan's instances in its region; anything kept is what your code and logging settings store."
          network: "Access restrictions and private endpoints limit inbound traffic; virtual network integration carries outbound traffic, all of it only when that routing is switched on."
          identity: "The app runs as a system-assigned or user-assigned managed identity, and App Service Authentication checks callers' tokens before requests reach your code."
          accepts: "Streamable HTTP servers built with an MCP SDK in .NET, Python, Node.js or Java, or a custom container; a preview feature builds tools from an OpenAPI 3.0 specification."
          workload: "Unless Always On is set the app unloads after 20 idle minutes; a request with no response in about 230 seconds times out; the Python and Node.js tutorials are stateless."
          portability: "A server built with a standard MCP SDK moves unchanged; the authentication configuration and protected resource metadata setting are App Service features to rebuild."
          effort: "Your team owns the app code, its dependencies, the plan's scaling and the authentication configuration; there are no servers or clusters to operate."
          fits: "Microsoft's guide names it for adding MCP to an existing web app and for code deployment without a Dockerfile."
        sources:
