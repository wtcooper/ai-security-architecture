    setVia: [code, apiCli]
    area: data
    recommended: "Standard tier; block jailbreak, prompt injection and prompt leakage at High on the request and on text extracted from each upload, refuse the spec if the guardrail cannot answer, and scan the upload bucket for malware."
    value: "Block at High, fail closed"
    why: "A file anyone wrote can tell the agent to add a back door or send out a secret; screening at intake stops it before it becomes the spec."
    mitigations: [cap-input-guardrails]
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-prompt-attack.html
    verified: "2026-11-21"
  - id: appStoreEndpointPolicy
    name: "Bucket policy (aws:SourceVpce) and default encryption with the app's KMS key"
    where: "Amazon S3 (or DynamoDB) in the app's account › Permissions › Bucket policy; Properties › Default encryption SSE-KMS with that app's key"
    setVia: [cloudPolicy]
    area: data
    recommended: "Deny access unless the request arrives through the app's own VPC endpoint, encrypt with a key only the app's task role and the platform can use, and keep the store in the app's account so it goes with it."
    value: "Own endpoint only; own KMS key"
    why: "The store then answers only its own app, so a fault or compromise in another app cannot reach its records."
    mitigations: [D3-NI]
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/example-bucket-policies-vpc-endpoint.html
    verified: "2026-11-21"
  - id: gatewayInferenceConnector
    name: "Inference connector target (credentialProviderType GATEWAY_IAM_ROLE or API_KEY)"
    product: "AgentCore Gateway"
    where: "AgentCore Gateway › target › inference connector (bedrock-mantle, bedrock-runtime, anthropic or openai); API keys in the AgentCore Identity token vault"
    setVia: [apiCli]
    area: tools
    recommended: "Point the agent's model client at the gateway's inference target; the gateway's role or a vaulted API key calls the provider, and the agent's role holds no bedrock:InvokeModel."
    value: "Credential held by the gateway"
    why: "The agent holds no model credential, so nothing leaked from a session works elsewhere, and every call is metered at one crossing. Any code in a session can read the execution role's credentials from the microVM metadata service, so the gateway is the only model path only while that role holds no model permission."
    mitigations: [D3-CH]
    default: "None: AWS's documented runtime role grants bedrock:InvokeModel, AWS's samples call Amazon Bedrock directly, and Strands Agents uses Bedrock with the role's credentials unless given another model"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-inference-connector.html
    verified: "2026-11-24"
  - id: factoryReleaseRecord
    name: "Release record (spec, session, commit, checks, approval, release)"
    where: "Your factory register keyed by app and release: spec version, AgentCore session ID, agent and model version, commit, InspectorScan SBOM, approval result, ECS deployment ID"
    setVia: [code]
    area: audit
    recommended: "Write one record per release from the pipeline, with the SBOM and the agent and model version, into the log archive account where the factory cannot delete it."
    value: "One record per release, in the log archive"
    why: "When an app misbehaves, or a package turns out to be harmful, you can find who asked, what the agent did, who approved and every app affected."
    mitigations: [AML.M0023, cap-agent-tracing]
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/action-reference-InspectorScan.html
    verified: "2026-11-21"
  - id: appQuarantine
    name: "Quarantine SCP and fixed-response listener action"
    where: "AWS Organizations › deny-all SCP attached to the app's account; Application Load Balancer › listener › default and rule actions set to fixed-response 503"
    setVia: [cloudPolicy, apiCli]
    area: network
    recommended: "Keep a deny-all SCP that exempts only the break-glass role. To take an app down, attach it to the account and set the listener's actions to fixed-response 503, from the runbook, without a release."
    value: "Deny-all SCP and 503 at the load balancer"
    why: "The SCP stops what the app's credentials can do at once, but running tasks keep serving users, so the load balancer has to stop the traffic too."
    mitigations: [cap-agent-kill-switch]
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/rule-action-types.html
    verified: "2026-11-21"
  - id: configShadowAiQuery
    name: "Advanced queries on an organization aggregator"
    where: "AWS Config › organization aggregator › Advanced queries for AWS::Amplify::App, AWS::AppRunner::Service and AWS::Bedrock types; ListAggregateDiscoveredResources for AWS::BedrockAgentCore::Runtime"
    setVia: [apiCli]
    area: audit
    recommended: "Run the query weekly from the security account and raise a ticket for each match in an account the factory did not vend; bring the app in through the factory or shut it down."
    value: "Weekly, every account outside the factory"
    why: "An app made in a vendor's tool or a personal account has no owner, no checks and no end date."
    mitigations: [cap-shadow-ai-discovery]
    url: https://docs.aws.amazon.com/config/latest/developerguide/querying-AWS-resources.html
    verified: "2026-11-21"
  - id: appAccountTags
    name: "Account tags (owner, data, end date) and a tag policy"
    where: "AWS Organizations › AWS accounts › (app account) › Tags; Policies › Tag policies on the Generated apps OU; CloseAccount at the end date"
    setVia: [cloudPolicy]
    area: audit
    recommended: "Tag each app account with owner, data class and end date at vending; list them as Required tag keys in the tag policy and check them in the vending code; remind the owner and close the account unless renewed."
    value: "Owner, data and end date on every account"
    why: "Apps outlive the reason, and the people, they were built for; a closed account retires the app and its data together."
    mitigations: [D3-AI, AML.M0043]
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_tag-policies.html
    verified: "2026-11-21"
