# EXAMPLE tool status — the template an adopting organisation edits. `available` says whether
# people may install and use the product at all: either the organisation provides it or it
# blocks it, so it is a boolean, not a status. How well an available product is locked down is
# what `controls` says: per capability in the tool's reference control set (its architecture's
# pins), enabled | inProgress | gap, each with a `note` — the justification the Tools grid shows
# when someone hovers that cell: what was set up, or why it is not — and an optional `evidence`
# reference. Every pinned capability of every product listed here carries a note, so the hover
# always has something to say; rewrite the text to describe what you actually configured. A tool
# not listed is not available and renders greyed out when "Show status" is on; a capability with
# no key under an available tool reads as a gap with no reasoning. (Shipped example; replace it
# in data/org/local/.)
