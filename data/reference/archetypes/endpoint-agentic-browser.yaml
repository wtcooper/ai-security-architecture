id: archAgenticBrowser
surface: surfaceEndpoint
title: Agentic browser and AI extension
abbrev: Agentic browser

summary:
  - >
    An agent driving a browser that is already logged into everything, or an extension reading
    every page the user opens. The page is simultaneously the untrusted input and the privileged
    context, which is what makes this archetype structurally different from the rest.

description:
  - >
    Every other endpoint archetype has some separation between the content it reads and the
    authority it holds. Here there is none: the agent acts inside a session that is already
    authenticated to the user's mail, bank, source control and internal applications, and the
    instruction it is following arrives as text on a page served by whoever owns that page.
  - >
    Two variants share the shape. A dedicated agentic browser drives the session itself, with
    navigation and clicking as tools. An extension sits in the page and reads the DOM, sometimes
    with permission to act on it. The extension variant is the broader exposure in practice — an
    extension with host permissions on all sites sees every page including the ones the user would
    never point an agent at, and its update channel is a supply chain nobody enrolled.
  - >
    Same-origin policy is the boundary the web is built on, and this archetype's job is to cross
    it. An agent that reads a page from one origin and then acts on another has done exactly what
    a decade of browser security is designed to prevent, with the user's cookies attached. There is
    no browser-level control that distinguishes an agent's cross-origin action from the user's,
    because from the browser's perspective they are the same session.
  - >
    The controls that work are the ones that constrain what the session can reach rather than what
    the agent may say. A separate browser profile with a narrow set of logged-in origins is worth
    more than any prompt filter, because it converts an unbounded blast radius into a bounded one.
    In-browser inspection is the only place with visibility into what the agent actually saw and
    did, which is why browser detection and response is the primary capability here rather than a
    supporting one.

distinguishedBy:
  - >
    Against a coding agent: that one reads a repository the developer chose and acts on a
    filesystem. This one reads pages an attacker serves and acts through credentials the user
    already holds, with no working directory to scope it to.
  - >
    Against a desktop assistant with computer use: overlapping and often the same product, but the
    browser variant is worth separating because its authority is a set of authenticated web
    sessions rather than local files, and because the extension form has an update channel and a
    permission model the desktop form does not.

exemplars:
  - name: Agentic browsers
    note: >
      Browsers with a built-in agent that navigates, reads and clicks on the user's behalf inside
      their existing signed-in session.
    asOf: "2026-08"
  - name: Assistant sidebars in mainstream browsers
    note: >
      An assistant panel with access to the current page's content, and increasingly to act on it.
      Ships enabled to a very large installed base.
    asOf: "2026-08"
  - name: AI browser extensions
    note: >
      Third-party extensions requesting host permissions across all sites. The permission grant is
      one click, the update channel is automatic, and the reviewer is the store.
    asOf: "2026-08"

zones:
  - id: outside
    type: outsideWorld
    personas: []
    note: >
      The web. Every page is authored by someone else, and the agent reads all of them with the
      same standing.

  - id: device
    type: device
    personas: [personaEndUser]
    note: The browser process, its profile, and whatever inspects them.

  - id: session
    type: network
    personas: [personaEndUser, personaApplicationDeveloper]
    note: >
      The origins the profile is already signed in to. Shared ownership because the authority is
      granted by each of those applications, not by anything on this device.

  - id: vendor
    type: vendorOpaque
    personas: [personaModelProvider]
    note: Where page content goes to be reasoned about.

  - id: governance
    type: management
    personas: [personaGovernance]
    note: What an organisation can still enforce on a browser it manages.

nodes:
  - id: user
    type: humanUser
    zone: outside
    label: User
    note: Sets the goal, and is usually not reading the pages the agent reads.

  - id: webPage
    type: untrustedSource
    zone: outside
    label: Web page content
    note: >
      Visible text, hidden text, alt attributes, comments and anything else in the DOM. All of it
      is model input, and none of it is distinguishable from the user's instruction once in context.
    risks: [riskPromptInjection, riskModelEvasion]
    capabilities: [capabilityPromptInjectionDefense, capabilityBrowserDetectionResponse]

  - id: extensionStore
    type: skillPackage
    zone: outside
    label: Extension distribution
    note: >
      Where the extension came from and where its updates come from. An automatic update channel
      into a component with permission to read every page.
    risks: [riskInsecureIntegratedComponent, riskToolSourceProvenance]
    capabilities: [capabilityAiBom, capabilityShadowAiDiscovery]

  - id: browserRuntime
    type: browserRuntime
    zone: device
    label: Browser runtime
    note: >
      Navigation, DOM reading and clicking, offered to the model as tools. Its authority is the
      profile's cookie jar.
    risks: [riskRogueActions, riskSensitiveDataDisclosure]
    capabilities: [capabilityBrowserDetectionResponse, capabilityAgentSandboxing]

  - id: agentLoop
    type: reasoningCore
    zone: device
    label: Agent loop
    note: Reads the page, decides the next navigation or click, and repeats.
    risks: [riskPromptInjection, riskRogueActions]
    capabilities: [capabilityAgentRuntimeEnforcement, capabilityHitlControls]

  - id: pageExtract
    type: inputHandling
    zone: device
    label: Page extraction
    note: >
      Turns a rendered page into context. The only point where hidden and off-screen content can be
      stripped before it becomes instruction, and the point most implementations skip.
    risks: [riskPromptInjection, riskModelEvasion]
    capabilities: [capabilityPromptInjectionDefense, capabilityModelGuardrails]

  - id: actionGate
    type: hitlGate
    zone: device
    label: Action confirmation
    note: >
      Blocks before a consequential click — a purchase, a send, a permission change. The set of
      actions that count is a product decision and is usually narrower than users assume.
    risks: [riskRogueActions, riskAgenticDelegationConfusedDeputy]
    capabilities: [capabilityHitlControls, capabilityToolPermissionScoping]

  - id: profile
    type: credentialStore
    zone: device
    label: Browser profile
    note: >
      Cookies, saved passwords and session tokens for every origin the user has signed into.
      Narrowing this to a dedicated profile is the highest-value control in the archetype, and it
      is a configuration choice rather than a product feature.
    risks: [riskSensitiveDataDisclosure, riskCrossTenantCredentialPropagation]
    capabilities: [capabilityCredentialIsolation, capabilityIga]

  - id: bdr
    type: auditSink
    zone: device
    label: In-browser inspection
    note: >
      The only vantage point that sees what the agent read and what it clicked. Where the agent is
      a vendor's, this is also the only telemetry available.
    risks: [riskShadowAndUnknownAgents]
    capabilities: [capabilityBrowserDetectionResponse, capabilityAiDetectionResponse, capabilityAiDlp]

  - id: signedInOrigins
    type: actuator
    zone: session
    label: Signed-in applications
    note: >
      Mail, banking, source control, internal tools. The agent acts on these as the user, and the
      applications cannot tell the difference.
    risks: [riskRogueActions, riskAgenticDelegationConfusedDeputy, riskSensitiveDataDisclosure]
    capabilities: [capabilityIga, capabilitySse, capabilityRateLimiting]

  - id: modelApi
    type: inferenceEndpoint
    zone: vendor
    label: Inference API
    note: Receives page content, which is frequently more than the user realises they shared.
    risks: [riskExcessiveDataHandlingDuringInference, riskSensitiveDataDisclosure]
    capabilities: [capabilityAiGateway, capabilityTransportSecurity]

  - id: extensionPolicy
    type: policyEngine
    zone: governance
    label: Extension and browser policy
    note: >
      Managed browser policy: which extensions may install, which origins the agent may reach, and
      whether the assistant is enabled at all.
    risks: [riskShadowAndUnknownAgents, riskInsecureIntegratedComponent]
    capabilities: [capabilityAiGovernancePlatform, capabilityShadowAiDiscovery]

  - id: sse
    type: egressProxy
    zone: governance
    label: Secure service edge
    note: Inline inspection of where the browser goes and what leaves with it.
    risks: [riskSensitiveDataDisclosure]
    capabilities: [capabilitySse, capabilityEgressControl, capabilityAiDlp]

edges:
  - from: user
    to: browserRuntime
    label: goal
    control:
      kind: userIdentity
      note: The user states an outcome; the pages that determine how it is reached are not theirs.

  - from: webPage
    to: pageExtract
    label: rendered content
    control:
      kind: contentInspection
      note: >
        Hidden and off-screen content stripped before the page becomes context. Bounds the
        injection rather than preventing it, which is why the profile's scope matters more.
    risks: [riskPromptInjection]

  - from: extensionStore
    to: browserRuntime
    label: install and auto-update
    control:
      kind: provenance
      note: >
        A signature proves who shipped it, not what it does. An extension with host permissions on
        all sites is one silent update away from reading every page.
    risks: [riskInsecureIntegratedComponent, riskToolSourceProvenance]

  - from: pageExtract
    to: agentLoop
    label: page context
    risks: [riskPromptInjection]

  - from: agentLoop
    to: modelApi
    label: inference request
    control:
      kind: brokeredCredential
      note: >
        Carries whatever the extraction step passed through, which on an authenticated page is the
        user's own data.
    risks: [riskExcessiveDataHandlingDuringInference, riskSensitiveDataDisclosure]

  - from: modelApi
    to: agentLoop
    label: next action
    control:
      kind: transport
      note: The response selects a click. Transport integrity says nothing about whose intent it encodes.
    risks: [riskInsecureModelOutput]

  - from: agentLoop
    to: actionGate
    label: proposed action
    risks: [riskRogueActions]

  - from: actionGate
    to: browserRuntime
    label: confirmed action

  - from: browserRuntime
    to: signedInOrigins
    label: authenticated request
    control:
      kind: credentialIsolation
      note: >
        A dedicated profile with a narrow set of signed-in origins. Converts unbounded ambient
        authority into a bounded set, and is worth more than any prompt-level control here.
    risks: [riskRogueActions, riskAgenticDelegationConfusedDeputy]

  - from: profile
    to: browserRuntime
    label: session tokens
    kind: control
    risks: [riskSensitiveDataDisclosure, riskCrossTenantCredentialPropagation]

  - from: browserRuntime
    to: bdr
    label: page and action telemetry
    kind: control
    risks: [riskShadowAndUnknownAgents]

  - from: extensionPolicy
    to: browserRuntime
    label: enforced policy
    kind: control
    control:
      kind: tenantConfiguration
      note: >
        Enforced by the browser against the user, which is the one control here that does not
        depend on the agent behaving.
    risks: [riskShadowAndUnknownAgents]

  - from: sse
    to: browserRuntime
    label: egress inspection
    kind: control
    control:
      kind: postureInspection
      note: Sees the destinations. Sees the content only where inspection is actually terminated.
    risks: [riskSensitiveDataDisclosure]

crossCutting:
  - risk: riskPromptInjection
    note: >
      Not localisable to a node because the untrusted input and the privileged context are the same
      object. Every control in this archetype is a mitigation of consequence rather than of cause.
  - risk: riskAgenticDelegationConfusedDeputy
    note: >
      The browser holds authority the agent did not earn and the visited page did not deserve.
      Every authenticated origin in the profile is in scope for every page the agent reads.
  - risk: riskSensitiveDataDisclosure
    note: >
      Page content leaves for inference, and the pages are authenticated ones. The user consented
      to an assistant, not to a transcript of their mail.

risks:
  - riskPromptInjection
  - riskAgenticDelegationConfusedDeputy
  - riskRogueActions
  - riskSensitiveDataDisclosure
  - riskInsecureIntegratedComponent
  - riskCrossTenantCredentialPropagation
  - riskShadowAndUnknownAgents
  - riskToolSourceProvenance
  - riskModelEvasion
  - riskInsecureModelOutput
  - riskExcessiveDataHandlingDuringInference

capabilities:
  - capabilityBrowserDetectionResponse
  - capabilityCredentialIsolation
  - capabilityHitlControls
  - capabilityPromptInjectionDefense
  - capabilitySse
  - capabilityEgressControl
  - capabilityAiDlp
  - capabilityToolPermissionScoping
  - capabilityAgentSandboxing
  - capabilityAgentRuntimeEnforcement
  - capabilityShadowAiDiscovery
  - capabilityAiGovernancePlatform
  - capabilityAiDetectionResponse
  - capabilityIga
  - capabilityRateLimiting
  - capabilityAiBom
  - capabilityModelGuardrails
  - capabilityAiGateway
  - capabilityTransportSecurity

deviations:
  - subject: Authenticated sessions are drawn as a zone, and marked shared
    reason: >
      They are not infrastructure and they are not on the device — they are standing grants held by
      other applications, and the browser merely presents them. Giving them a zone is what makes
      the blast radius visible; marking them shared is what makes it clear the device owner is not
      the only party who can revoke.
  - subject: The dedicated browser and the extension are drawn as one archetype
    reason: >
      Their trust boundaries and their controls are the same: untrusted page in, ambient authority
      out, inspection only in the browser. The extension's distribution channel is the one genuine
      difference and it is drawn as its own node rather than a second diagram.
  - subject: Page extraction is drawn even though many products have no such step
    reason: >
      Drawing only what is commonly implemented would leave no place to attach the mitigation. It
      is drawn with a note saying it is frequently skipped, which is a more useful statement than
      its absence.

sources:
  - title: "OWASP Top 10 for Agentic Applications 2026 — ASI01 goal hijack, ASI03 privilege abuse"
    url: https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/
  - title: "OWASP Securing Agentic Applications Guide 1.0 — browser and computer-use agents"
    url: https://genai.owasp.org/resource/securing-agentic-applications-guide-1-0/
  - title: "OWASP Top 10 for LLM Applications 2026 — LLM01 prompt injection"
    url: https://genai.owasp.org/resource/owasp-genai-llm-top-10-2026/
  - title: "Five Eyes joint guidance — careful adoption of agentic AI services"
    url: https://www.ncsc.govt.nz/assets/guidance/Documents/Careful-adoption-of-agentic-AI-services_FINAL.pdf
