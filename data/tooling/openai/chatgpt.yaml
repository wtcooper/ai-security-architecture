              mechanism: None in product beyond workspace pinning of the desktop app
              evidence:
                - title: Vendor docs index, reviewed for the integration point (2026-09-10)
                  url: https://learn.chatgpt.com/docs/enterprise/chatgpt-work-overview
              verified: 2026-09-10
      - mitigation: AML.M0024
        coverage: native
        mechanism: >-
          Compliance Logs Platform (immutable JSONL: conversation messages, APP_LOG request and response,
          APP_AUTH_LOG, audit, auth, Workspace Agent and Codex events) pulled with a workspace Admin key; 30-day
          source retention
        steps:
          - title: Create an Admin key for log export
            body:
              - >-
                In Admin Console open the workspace's Credentials > Admin keys; a workspace owner grants
                Conversation messages plus the audit, authentication and app log categories.
            url: https://help.openai.com/en/articles/20001407-managing-admin-keys-in-admin-console
          - title: Collect continuously
            body:
              - >-
                Run download_compliance_files.sh or .ps1 (or the List Files and Download File endpoints) per event
                type into the SIEM before the 30-day source window lapses.
            url: https://learn.chatgpt.com/docs/enterprise/compliance-api
          - title: Pin the collector's addresses
            body:
              - >-
                IP allowlisting is always enforced for Compliance API keys; add the collector's egress IPs under
                Identity & access > Access Restrictions.
            url: https://help.openai.com/en/articles/12111596-ip-allowlisting-for-chatgpt
        note: >-
          Native by the rule applied to every vendor: the Compliance Logs Platform exports conversation messages
          and connector and tool events — APP_LOG records the request payload and normalised response of each app
          call, APP_AUTH_LOG each link and unlink, and Workspace Agent logs carry run, connector-call, trigger and
          memory events — as immutable JSONL files with a p99 target under 30 minutes, ready to fuse with the
          organisation's gateway record. Boundaries: 30 days at source with no backfill; the vendor says the
          export does not establish a complete trail for every hosted shell command, browser interaction, file
          operation or approval; Work Local, Computer Use and Chrome-extension actions are not fully recorded
          (local OpenTelemetry is a separate opt-in path); app-log coverage varies by app. Capture only: tamper
          resistance and retention beyond 30 days are the receiving store's.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAuditLogging
          reviewRequired: false
          original:
            - capability: capabilityAuditLogging
              coverage: partial
              mechanism: Compliance API (30-day source retention) and workspace analytics
              note: >-
                Not every local file operation, screenshot or Chrome-extension action appears in the
                Compliance API.
              steps:
                - title: Export continuously
                  body:
                    - Use COMPLIANCE_API_KEY against the Admin API; the source window does not replace your
                      retention policy.
                  url: https://learn.chatgpt.com/docs/enterprise/compliance-api
              verified: 2026-09-10
      - mitigation: cap-agent-kill-switch
        coverage: partial
        mechanism: >-
          Permissions & roles Off for Work Cloud, Work Local and Enable agents; app Disable in Admin > Plugins;
          Unpublish or Delete Workspace Agent and Delete User Automation on the Admin API; access-token and
          service-account revocation
        steps:
          - title: Turn the agent surfaces off
            body:
              - >-
                In Workspace settings > Permissions & roles set Work Cloud, Work Local and Enable agents to Off for
                the affected roles; an explicit Off in any role denies.
            url: https://learn.chatgpt.com/docs/enterprise/roles-and-workspace-permissions
          - title: Revoke connector access in bulk
            body:
              - >-
                In Admin > Plugins select Disable on each affected app; turning an app off triggers revocation of
                its stored tokens.
            url: https://help.openai.com/en/articles/11509118-admin-controls-security-and-compliance-for-plugins-and-apps
          - title: Stop agents and scheduled tasks
            body:
              - >-
                Call Unpublish Workspace Agent or Delete Workspace Agent and Delete User Automation on the Admin
                API, or use the agent area of the admin console.
            url: https://chatgpt.com/public/admin/api-reference
          - title: Revoke automation credentials
            body:
              - >-
                Revoke tokens at chatgpt.com/admin/access-tokens and disable service accounts, which revokes all of
                their tokens.
            url: https://learn.chatgpt.com/docs/enterprise/service-accounts
        note: >-
          Partial by the rule applied to every vendor: the admin can switch the agent surfaces off org-wide,
          revoke connector grants in bulk by disabling apps, unpublish or delete agents and delete scheduled
          tasks, but no page says a Work task, agent run or deep research already in progress stops. Documented
          timings are custom-role changes in about five minutes, IdP sync every 30 to 40 minutes (it cannot be
          forced), IP allowlist 5 to 15 minutes, and a Work network change after the current command finishes;
          the delay for stopping running work is not documented. Removing local Codex permission suspends tokens
          without revoking them, and per-user grant revocation is the user's action. Measure the stop before
          relying on it.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityKillSwitch
          reviewRequired: false
          original:
            - capability: capabilityKillSwitch
              coverage: native
              mechanism: Role Off for Work Local / Work Cloud / plugins, token revocation, service-account disable
              steps:
                - title: Turn surfaces off by role
                  body:
                    - Work Cloud and Work Local are distinct toggles in Permissions & roles; plugins can be made unavailable in
                      Admin > Plugins.
                  url: https://learn.chatgpt.com/docs/enterprise/chatgpt-work-cloud-security
                - title: Revoke credentials
                  body:
                    - Owners and admins revoke any token; disabling a service account revokes all of its tokens.
                  url: https://learn.chatgpt.com/docs/enterprise/service-accounts
              note: >-
                Role and token changes apply at the next request; an in-flight request completes. The docs
                state no propagation delay, so measure it before relying on it.
              verified: 2026-09-10
