id: archCodingAgentFirstParty
surface: surfaceEndpoint
rank: 2
title: First-party coding & desktop agents
abbrev: First-party agents
summary:
  - >
    The same engine as the vendored coding agents without the vendor: an open-source harness a
    developer installs from a community registry and runs with their own keys. The interaction
    model is identical; what is missing is every control the vendor column supplied — session
    credentials, managed settings, audit export, an owner-bound remote relay — and nothing
    replaces them by default.

description:
  - >
    Architecturally this is the vendored coding agent with the vendor service column deleted.
    The harness, the tool surface, the memory layer and the untrusted-content ingress are the
    same drawing; the differences are custody and supply chain. Credentials are pasted,
    long-lived keys that sit in plaintext configuration in most of the harnesses; governance
    is files on the same disk the agent can edit; and the binary itself arrives through
    community package registries and marketplaces — the category's landmark incident is a
    compromised harness release published with stolen publisher tokens.
  - >
    The target state routes every model and remote call through an AI gateway the organisation
    operates — the credential broker that vaults the key the user would otherwise paste, the
    egress allowlist, the audit tap. The common state has nothing at that crossing: the
    harness calls the provider directly and the only record is the provider's bill. The
    gateway is drawn because this catalogue draws architectures as they should be built; the
    deviation records the distance.
  - >
    Remote control exists here too, with a weaker admission model than the vendor products.
    The harnesses ship server modes — a listening port on the machine, localhost by default,
    with auth ranging from a mandatory shared secret down to none at all — plus official
    mobile clients over relay tunnels, and a fast-growing ecosystem of chat bridges that put
    messaging-platform identity in front of the loop. None of it binds admission to an owner
    account the way the vendor relays do, which is why the remote surface here is drawn with
    the same seriousness as the personal agent's channels.
  - >
    The software ships no governance of its own: no managed settings tier, no session audit
    export, no admin toggle for the remote surface. The governance band this drawing carries
    is therefore entirely the organisation's — services the target state adds around the
    harness, none of them supplied by the thing being governed. Where enterprise controls
    exist for this category they are bolt-on — managed configuration paths and enterprise
    policy services a team must adopt deliberately — and the sanctioned posture is something
    the organisation publishes, not something the software ships.

distinguishedBy:
  - >
    Against the vendored coding agents: the same loop, the same tool surface, the same
    human-present default. What changes is custody — pasted keys instead of expiring session
    credentials, community registries instead of signed vendor channels, bearer secrets and
    platform identity instead of an owner-bound relay — and the absence of any control plane
    an administrator could switch on.
  - >
    Against the personal autonomous agent: this one is still invoked by a present developer
    and scoped to a workspace, with no heartbeat and no ambient senders. But the drift is
    real and one-directional — server modes, chat bridges, scheduled recipes — and a deployed
    OSS harness that listens on channels and runs unattended has become the personal agent
    and should be read on that page.

exemplars:
  - name: Terminal harnesses
    note: >
      The opencode/Crush class: TUIs over a client/server core, with headless serve modes and
      web surfaces. The most popular open-source agents, and the clearest expression of the
      pattern.
    asOf: "2026-08"
  - name: IDE-extension harnesses
    note: >
      The Cline family and its forks: marketplace-distributed extensions plus emerging
      standalone cores. The distribution channel is the marketplace — which is also the
      attack surface the category's worst incident used.
    asOf: "2026-08"
  - name: Desktop and mobile-remote harnesses
    note: >
      Goose-class agents with desktop apps, server binaries, scheduled recipes, and an
      official mobile client over a relay tunnel — the furthest drift toward the personal
      agent's shape, and the category's strongest remote-admission model.
    asOf: "2026-08"

zones:
  - id: zoneUser
    owner: user
    note: >
      The developer at the keyboard, and the phone, browser and chat surfaces they steer the
      session from when they are not.
  - id: zoneEndpoint
    owner: endpoint
    note: >
      The managed device, running a harness the developer installed themselves: the loop, its
      tool surface and its memory. Ours to manage and nobody's to support — its outbound
      routes are the brokered crossing and, in the common install, whatever the harness dials
      itself.
  - id: zoneCloud
    owner: cloud
    note: >
      Infrastructure we operate — the AI gateway that brokers every model and remote call, and
      the systems and data it admits the agent into. With no vendor column, this band is the
      only place a control can live.
  - id: zoneExternal
    owner: external
    note: Outside the company with no agreement — package registries, the open web, third-party SaaS.
  - id: zoneGovernance
    owner: governance
    note: >
      Drawn across every band because it governs every band — including the external
      connections, whose reachability is itself a governed decision.

blocks:
  - id: remoteDevice
    kind: service
    title: Remote device
    cosaiComponent: componentAgentUserQuery
    zone: zoneUser
    col: 0
    row: 0
    note: >
      The surfaces that steer a session when the developer is not at the machine — and here
      nothing binds them to an owner. A serve port takes a shared secret at best, a relay
      tunnel takes whatever the harness was configured with, and a chat bridge takes whoever
      the platform admits. That absence, not the surfaces themselves, is the finding.
    items:
      - id: phoneWeb
        label: Phone & web apps
        icon: phone
        note: >
          Web UIs the harness serves itself, and mobile clients reaching it over relay tunnels.
          No vendor account stands behind any of them.
      - id: chatChannels
        label: Chat channels
        icon: chat
        note: >
          Community bridges put messaging-platform identity in front of the loop — admission
          becomes whoever the channel admits, which is the personal agent's model exactly.

  - id: developer
    kind: actor
    title: Developer
    icon: person
    zone: zoneUser
    col: 0
    row: 1
    note: >
      Present, watching, and the approval gate for what matters — the property the whole
      archetype's posture rests on, and the one that unattended modes quietly remove.

  - id: relay
    kind: external
    title: Remote relay
    cosaiComponent: componentAgentUserQuery
    zone: zoneExternal
    col: 5
    row: 0
    note: >
      What a phone actually reaches, in the target state: a tunnel the harness dialled out to,
      a purpose-built agent relay, or a chat platform bridging into the loop. It is drawn in
      the external band because it is somebody else's service — including, for one popular
      harness, a default community relay with no IP allowlisting that most users will never
      change. The alternative is worse rather than better: with no relay the phone connects
      straight to a listening port on the machine.
    items:
      - id: tunnel
        label: Tunnel service
        icon: plug
        note: Tailscale, Cloudflare Tunnel or ngrok in front of a harness that ships no transport auth of its own.
      - id: chatChannels
        label: Chat channels
        icon: chat
        note: A community bridge putting messaging-platform identity in front of the loop.

  - id: harness
    kind: service
    title: Agent harness
    cosaiComponent: componentReasoningCore
    zone: zoneEndpoint
    col: 1
    row: 1
    note: >
      The installed application — the loop behind the terminal, editor or chat window, running
      as the user, with its built-in tools nested inside it. Unlike the vendor products it
      commonly does open a port of its own — localhost by default, and the thing exposure scans
      keep finding when that default is changed.
    items:
      - id: apiServer
        label: Local API server
        icon: plug
        note: >
          The serve mode: a listening port with auth ranging from a mandatory shared secret to
          none at all. This archetype's defining exposure, and the reason its remote surface is
          drawn with the same seriousness as the personal agent's channels.
      - id: loop
        label: Agent loop
        icon: agent
        note: Decides the next edit, command or screen action from everything it has read.
      - id: context
        label: Context assembly
        icon: doc
        note: Merges the instruction, the memory and the tool results into one prompt.

      - id: mcpClient
        label: MCP client
        icon: plug
        note: >
          The harness's own MCP client — the party that connects out: to local servers in its
          native tools, and through the gateway's MCP brokerage to remote ones.
  - id: memory
    kind: service
    title: Memory & state
    cosaiComponent: componentDataStorage
    zone: zoneEndpoint
    col: 2
    row: 2
    note: >
      Agent-written notes and the rules files merged into every later session — on by default
      in several products, and repo-committed in all of them.
    items:
      - id: memoryFiles
        label: Memory files
        icon: folder
        note: Agent-written notes loaded at the start of every session.
      - id: rules
        label: Rules & instructions
        icon: doc
        note: The AGENTS.md-class files — the repo-committed ones authored by whoever last committed.
      - id: hooks
        label: Hooks & settings
        icon: gear
        note: >
          Session-start hooks, permission rules and editor tasks that run as code when the
          project opens — the persistence a self-propagating package worm writes into an
          agent's configuration, not prose the loop reads but commands it executes.

  - id: toolPlane
    kind: service
    title: Native tools
    cosaiComponent: componentTools
    zone: zoneEndpoint
    parent: harness
    col: 0
    row: 0
    note: >
      The application's built-in tools, nested because the loop calling them is not a hop:
      file and edit tools, the shell, the local MCP servers it spawns or attaches to, the
      sandbox for builds and tests, skills and computer use — running as the user on a machine
      that also holds their SSH keys, cloud credentials and browser sessions. What these tools
      reach is drawn: memory files, the package mirror, the gateway's API brokerage, and the
      internet directly when a local server holds its own token.
    items:
      - id: editTools
        label: File & edit tools
        icon: folder
        note: Read and write across the working tree and the user's documents.
      - id: shell
        label: Shell commands
        icon: code
        note: Command execution with the user's authority when it runs outside the sandbox.
      - id: mcp
        label: Local MCP servers
        icon: code
        note: >
          Local MCP servers: child processes the harness spawns through npx or uv, or servers
          already running on the machine, holding the user's privileges and, often, their own API
          tokens in a config dotfile. Remote MCP servers are a different thing on this catalogue —
          reached through the gateway, drawn in Tool services — and the industry names them apart.
      - id: sandboxedTools
        label: Sandboxed tools
        icon: shield
        note: Where builds, tests and driven desktops run when isolation is on.
      - id: skills
        label: Installed skills
        icon: gear
        note: >
          Packaged instructions and helpers, delivered from the mirror through the crossing —
          content that executes as instruction, versioned and pinned like code.
      - id: computerUse
        label: Computer use
        icon: eye
        note: >
          The sharpest tool the harness can switch on: the agent drives the GUI and inherits
          every application already signed in.

  - id: aiGateway
    kind: service
    title: AI gateway
    zone: zoneCloud
    col: 3
    row: 2
    note: >
      The organisation-operated crossing that replaces the missing vendor column, and the only
      component in this drawing that can hold a control at all: the vault for the key the
      developer would otherwise paste, the registry of MCP servers, APIs and connectors it will
      broker, and the admission decision for the remote surface. Which build of the agent runs is the
      mirror's decision, reached by the native tools directly. Its items are the traffic classes
      it brokers; the checks are the numbered pins on this block and its edges, and the
      call-outs beneath.
    pack: aiGatewayTraffic

  - id: hostedTools
    kind: service
    title: Tool services
    cosaiComponent: componentTools
    zone: zoneCloud
    col: 4
    row: 3
    note: >
      Our own tool servers and service APIs — the same component as the endpoint's local
      surface and the external one, at a different band. What the agent is actually meant to
      reach, and what the gateway in front of it decides it may.
    items:
      - id: internalMcp
        label: Remote MCP servers
        icon: plug
        note: Our own servers, listed in the catalogue the gateway enforces.
      - id: internalApis
        label: APIs & connectors
        icon: plug
        note: Service APIs reached on grants the gateway issues, scoped to the developer.

  - id: orgData
    kind: external
    title: Enterprise data
    cosaiComponent: componentDataSources
    zone: zoneCloud
    col: 4
    row: 4
    note: >
      The repositories, documents and systems of record behind our own tool servers. Ours, and
      still untrusted as input — many hands wrote the content, and none of them are
      authenticated.
    items:
      - id: code
        label: Code & project docs
        icon: doc
        note: A repository is a document the attacker may have contributed to.
      - id: dotfile
        label: Tool config dotfile
        icon: gear
        note: The tool-server declaration that ships with the code — the most attacked artifact here.
      - id: records
        label: Org data
        icon: db
        note: Business systems reached under the developer's scope, never a standing service account.
      - id: fileStorage
        label: File storage
        icon: folder
        note: Governed content stores reached through our connectors rather than the device's mounts.

  - id: registry
    kind: external
    title: Private pkg registry
    cosaiComponent: componentDataSources
    zone: zoneCloud
    col: 3
    row: 3
    note: >
      Where the vendor column used to be. This archetype's supply chain includes the agent
      itself: the harness, its extensions and its skills all arrive through community channels
      on publisher self-attestation, and a compromised release of a harness has already
      shipped once. The organisation-maintained mirror moves the review earlier; it does not
      remove the risk.
    items:
      - id: hub
        label: Approved packages
        icon: db
        note: Harness releases, extensions and skills — reviewed, pinned and mirrored before installation.

  - id: extTools
    kind: service
    title: Tool services
    cosaiComponent: componentTools
    zone: zoneExternal
    col: 5
    row: 3
    note: >
      Third-party servers and connectors — the same component again, out where nobody we
      contracted with operates it. Admitted by assessment even when the service is free and
      unsupported, or refused at the crossing.
    items:
      - id: mcp
        label: Remote MCP servers
        icon: plug
        note: Remote servers whose tool descriptions enter context as model input.
      - id: apis
        label: APIs & connectors
        icon: plug
        note: Third-party service calls made on brokered, developer-scoped credentials.

  - id: provider
    kind: provider
    title: Model provider
    cosaiComponent: componentModelServing
    zone: zoneExternal
    col: 5
    row: 1
    note: >
      The inference API the gateway brokers directly — no vendor service stands between. The
      completion drives writes, commands and clicks.
    items:
      - id: inference
        label: Inference API
        icon: model
        note: Receives code, documents and screenshots; returns the plan.

  - id: downstream
    kind: external
    title: Downstream services
    cosaiComponent: componentDataSources
    zone: zoneExternal
    col: 5
    row: 5
    note: >
      What the native tools reaches on the open internet — dependency registries, the web, and
      third-party SaaS the developer has grants into.
    items:
      - id: registries
        label: Package registries
        icon: db
        note: Dependencies and their metadata, authored by strangers and read into context.
      - id: web
        label: Web & APIs
        icon: globe
        note: Attacker-writable content that re-enters the loop, and the exfiltration path out.
      - id: saas
        label: SaaS
        icon: mail
        note: Third-party accounts reached on standing grants that outlive the conversation.

  - id: govIdentity
    kind: governance
    title: Identity services
    icon: person
    zone: zoneGovernance
    col: 0
    row: 6
    capabilities: [capabilityIga]
    note: >
      The IdP and device-posture plane deciding who may open a session at all, and on what
      machine — the binding that makes the enterprise agreement apply to this traffic.

  - id: govSecrets
    kind: governance
    title: Secrets & key management
    icon: key
    zone: zoneGovernance
    col: 1
    row: 6
    capabilities: [capabilitySecretsManagement, capabilityCredentialIsolation]
    note: >
      Vaulted, short-lived, connector-scoped grants on our own keys — and keeping the
      developer's own keys and sessions out of the agent's reach.

  - id: govPolicy
    kind: governance
    title: Policy & authorization
    icon: scale
    zone: zoneGovernance
    col: 2
    row: 6
    capabilities: [capabilityAgentRuntimeEnforcement, capabilityEgressControl, capabilityAiDlp, capabilityRateLimiting]
    note: >
      The decisions the one crossing enforces per call — what may be reached, what may leave,
      and what it may cost. With no vendor console above it, this is the only tier where a
      policy can be made non-overridable by the developer running the agent.

  - id: govSupplyChain
    kind: governance
    title: Supply-chain assurance
    icon: db
    zone: zoneGovernance
    col: 4
    row: 6
    capabilities: [capabilityAgentRegistry, capabilityMcpToolSecurity, capabilityAiBom, capabilitySystemPromptManagement]
    note: >
      Which agents, connectors and servers are admitted, and pinned to which versions. This
      call-out carries more weight here than in any other drawing: the supply chain delivers
      the harness itself, through channels that have already shipped a compromised release.

  - id: govObservability
    kind: governance
    title: Observability & response
    icon: eye
    zone: zoneGovernance
    col: 6
    row: 6
    capabilities: [capabilityAuditLogging, capabilityShadowAiDiscovery, capabilityKillSwitch]
    note: >
      Our gateway tap is the only session record there is — no vendor export exists to fuse
      with it — plus the discovery that finds the installs which never enrolled.


edges:
  - from: developer
    to: remoteDevice
    path: primary
    bidir: true
    label: away from the machine
    note: The same person, not at the keyboard — or, on a chat surface, not necessarily the same person.
  - from: developer
    to: harness
    path: primary
    bidir: true
    label: local session
    note: >
      The direct path, and the one most developers use: the CLI, editor or desktop app on the
      machine, authorised by holding the machine. The same shape as the personal agent's local
      session — proximity is the authorisation, so device posture carries it.
  - from: remoteDevice
    to: relay
    path: external
    bidir: true
    label: remote steering
    note: >
      The phone reaches the relay, not the machine. Nothing we operate is on this hop, and the
      relay is a third party we did not contract with — for one popular harness, a community
      instance running on somebody's goodwill.
  - from: relay
    to: harness
    path: external
    bidir: true
    route: hv
    label: dialled-out tunnel
    note: >
      The tunnel and bridge shapes: a relay the harness dialled out to, or a chat bridge
      forwarding platform messages. Admission is a bearer secret at best — never an
      owner-bound account, and never our firewall, because a phone on a cell network reaches
      the machine without passing through the corporate network at all. The third shape — a
      direct connection to the listening port with no relay anywhere — traverses nothing
      drawable at all, and is carried as the exposure risk pinned on the harness.
  - from: toolPlane
    to: memory
    label: read & write / context
    route: vh
    path: primary
    bidir: true
    note: >
      The file tools are how the loop reads and writes what it learns — memory files written
      by the agent, rules and instructions read back on the next task. Context assembly loads
      the same rules at session start, through the same files.
  - from: harness
    to: aiGateway
    route: hv
    path: primary
    bidir: true
    label: inference, MCP & skills
    note: >
      The one general-purpose crossing: every model call and every remote tool call leave the
      endpoint here — in the target state. In the common install the model call goes straight
      out on a pasted key and never sees this tier.
  - from: toolPlane
    to: aiGateway
    route: hv
    path: primary
    bidir: true
    label: API & MCP calls via gateway
    note: >
      A local server's or tool's own calls to remote MCP servers, APIs and connectors, brokered
      here on the gateway's registry of destinations and on credentials it injects. Package
      installs go to the mirror, and the direct path below is the one this brokerage exists
      to replace.
  - from: aiGateway
    to: provider
    label: inference / completion
    route: hv
    path: external
    bidir: true
    note: >
      Inference on a credential the gateway brokers, rather than the long-lived key the
      developer would otherwise paste into a dotfile. With no vendor between them, this is the
      whole model path — and in the common install it does not cross the gateway at all.
  - from: toolPlane
    to: registry
    route: vh
    path: primary
    bidir: true
    label: pinned installs
    note: >
      Harness, extension and skill releases pulled straight from the mirror, pinned by digest — never from a community channel.
      The endpoint's egress allowlist is what makes the mirror the only place the sandbox can
      fetch from; the AI gateway brokers model and tool calls and is not on this path.
  - from: toolPlane
    to: downstream
    route: vh
    path: external
    bidir: true
    label: direct egress
    note: >
      The common shape of a local MCP server and of a shell command: a process on the machine
      holding its own token and calling the SaaS, the API or the web itself — no gateway, no
      broker, and no record on our side. What bounds it is the endpoint's egress policy and
      where the token lives; both are pinned here, because this is the path a phone-home
      actually takes.
  - from: aiGateway
    to: hostedTools
    route: hv
    path: primary
    bidir: true
    label: internal tool calls
    note: >
      The path the deployment exists for: our own servers and APIs, admitted by the catalogue
      and reached on grants scoped to the developer.
  - from: hostedTools
    to: orgData
    path: primary
    bidir: true
    label: scoped reads & writes
    note: >
      Repository reads, the writes that become pull requests, and business-system calls —
      recorded on our side of the boundary.
  - from: aiGateway
    to: extTools
    route: hv
    path: external
    bidir: true
    label: brokered external calls
    note: Admission is the catalogue; every call carries a scoped, short-lived credential.
  - from: extTools
    to: downstream
    label: action / returned content
    path: external
    bidir: true
    note: >
      Registries, the web and third-party accounts — and whatever returns re-enters the loop as
      context.

pins:
  risks:
    - risk: riskPromptInjection
      at: hostedTools->orgData
      note: >
        Source files, manifests, issue text and documents are unrelated paths into the same
        context window, none of which is the developer's instruction.
    - risk: riskPromptInjection
      at: memory
      note: >
        Memory files and rules are prose a later session treats as instruction — including
        rules committed by whoever last touched the repo, and the settings hooks the worm
        incidents wrote their persistence into.
    - risk: riskToolRegistryTampering
      at: toolPlane
      note: >
        Configuration admits the whole native tools and can arrive with the clone. Injecting into
        it and swapping it after approval are the disclosed paths.
    - risk: riskInsecureModelOutput
      at: harness
      note: >
        The completion is unauthenticated content, and this is where it becomes the plan —
        file writes, commands and clicks all start as text the model returned.
    - risk: riskExcessiveDataHandlingDuringInference
      at: aiGateway->provider
      note: >
        Code, documents and screenshots leave the company here — usually more than the
        developer pictured sharing, and with no vendor tenancy in between, whatever the
        provider's default retention happens to be is the retention policy.
    - risk: riskStaleAgentIdentityBinding
      at: remoteDevice->relay
      note: >
        A remote channel is only as good as the account and device binding behind it; a stale
        login steering a machine full of credentials is an account-compromise blast radius —
        and here admission is a bearer secret at best, never an owner-bound account.
    - risk: riskInsecureIntegratedComponent
      at: toolPlane->registry
      note: >
        The mirror decides which build of the agent runs. A tampered or unpinned release is
        code execution as the developer, on a machine that also holds their keys — the
        category's landmark incident, not a hypothetical.
    - risk: riskSensitiveDataDisclosure
      at: toolPlane->aiGateway
      note: >
        The machine also holds SSH keys, cloud credentials and browser sessions; outside the
        sandbox nothing separates them from the agent's shell on the way out.
    - risk: riskToolSourceProvenance
      at: extTools->downstream
      note: >
        Dependencies and remote servers arrive on publisher self-attestation, and their
        descriptions and contents are read into context as model input.
    - risk: riskRogueActions
      at: hostedTools->orgData
      note: Writes into systems of record from a loop whose plan nobody reviewed.
    - risk: riskInsecureIntegratedComponent
      at: harness
      note: >
        The serve mode is an agent-control transport listening on the machine: bound wider
        than localhost with a guessable or absent secret, whoever reaches the port drives the
        loop directly — this archetype's defining exposure, on a path that traverses no relay
        and nothing we operate.
    - risk: riskShadowAndUnknownAgents
      at: harness
      note: >
        A binary a developer can fetch without asking anyone. Unmanaged, it has no policy, no
        audit and no inventory entry — and that is the common case.

    - risk: riskInsecureIntegratedComponent
      at: aiGateway
      note: >
        The gateway is a third-party tier with its own CVE stream — the LiteLLM backdoor shipped
        in a release — and here there is no vendor console to notice a gateway that has gone
        quiet.
    - risk: riskMCPTransportHijacking
      at: aiGateway->extTools
      note: >
        A remote MCP transport intercepted or impersonated between the crossing and the server
        it admits — the tool result arrives from whoever holds the connection.
    - risk: riskRunawayAgentToolLoops
      at: harness
      note: >
        A scheduled or hosted session has no human to notice it looping; seat metering is the
        only meter, and the stop is the credential.
    - risk: riskInsecureIntegratedComponent
      at: memory
      note: >
        Hooks and settings are executed, not read: a session-start hook or folder-open task
        written into the agent's configuration is code execution as the developer on every
        launch — the persistence the CHAINDROP worm chose.
    - risk: riskSensitiveDataDisclosure
      at: toolPlane->downstream
      note: >
        The path a phone-home takes: a shell command or a local server bundles a token, a file
        or a key into a request and sends it itself. Nothing of ours is on this hop unless the
        endpoint's egress policy is — and the token a local MCP server uses lives in a dotfile
        on the same disk.
  capabilities:
    - capability: capabilityIga
      at: relay
      note: >
        Bind the remote surface to a named user on a managed device by contracting the relay:
        a zero-trust tunnel tied to our directory is the only way this path acquires an
        identity we govern. Nothing in this category does it on its own — a serve port takes
        a shared secret, a chat bridge takes whoever the platform admits — and an
        uncontracted community relay leaves the path uncontrolled, which is then the finding.
    - capability: capabilityAgentRuntimeEnforcement
      at: harness->aiGateway
      note: Session admission and per-call policy evaluated at the edge, outside the application being governed.
    - capability: capabilityMcpToolSecurity
      at: toolPlane->registry
      note: >
        Pin harness, extension and skill versions against the mirror; an update is a decision,
        because the update channel is this category's proven attack path.
    - capability: capabilityAiDlp
      at: toolPlane->aiGateway
      note: >
        Inspection belongs on the brokered tool path, where the agent's calls carry repository
        content out to servers we did not write — not on the pinned vendor session.
    - capability: capabilityRateLimiting
      at: harness->aiGateway
      note: >
        Spend ceilings at the crossing, because the only native meter in this category is the
        provider's invoice — there is no vendor console showing seat usage or session counts.
    - capability: capabilityToolPermissionScoping
      at: toolPlane
      note: >
        Per-tool grants scoped to the working tree and the task, instead of the developer's full
        authority on the machine — enforced where the tools run, inside the application.
    - capability: capabilityAgentSandboxing
      at: toolPlane
      note: >
        Make sandboxed tools the default path for commands and computer use, so the approval
        gate fires only for actions that leave the box.
    - capability: capabilityCredentialIsolation
      at: toolPlane
      note: Keep SSH keys, cloud credentials and browser profiles outside the agent's reachable filesystem.
    - capability: capabilityMemoryProtection
      at: toolPlane->memory
      note: Treat memory and rules as untrusted input on read; a repo-committed rules change is a code change.
    - capability: capabilityPromptInjectionDefense
      at: hostedTools->orgData
      note: Treat repository and document content as untrusted; it cannot be authenticated, only bounded.
    - capability: capabilitySecretsManagement
      at: aiGateway
      note: >
        The provider key lives in the gateway's vault, never pasted into a dotfile — and org
        access rides short-lived, connector-scoped grants the crossing issues per call.
    - capability: capabilityMcpToolSecurity
      at: toolPlane->aiGateway
      note: Provenance and behavioural review before a server is admitted; pin versions so an update is a decision.
    - capability: capabilityHitlControls
      at: hostedTools->orgData
      note: Non-overridable approval on consequential writes, kept rare enough that each prompt is read.
    - capability: capabilityAgentRegistry
      at: aiGateway
      note: >
        A managed allowlist of connectors and tool servers, enforced from our gateway rather
        than from the configuration file it governs.
    - capability: capabilityAuditLogging
      at: aiGateway
      note: >
        The gateway tap is the whole record: with no vendor console anywhere, what does not
        cross here was never logged at all.
    - capability: capabilityShadowAiDiscovery
      at: harness
      note: Find the installs that never enrolled, because this archetype spreads one developer at a time.
    - capability: capabilityEdr
      at: harness
      note: >
        The device tooling that sees what no crossing can: which harnesses are installed,
        which ports they listen on, what their processes execute — and the containment that
        isolates a machine whose agent has been steered.

    - capability: capabilityAgentRuntimeEnforcement
      at: relay->harness
      note: >
        Admission of a remote instruction: the relay's identity headers and the harness's shared
        secret decide whether a steering message is executed — absorbed by the harness and the
        contracted relay, recorded as a deviation.
    - capability: capabilityKillSwitch
      at: govObservability
      note: >
        Revoke the brokered credential and block the port from device management — the only
        stop, because no vendor console exists.
    - capability: capabilityAiBom
      at: registry
      note: >
        Digest and signature verification at admission to the mirror, and an inventory of which
        harness, extension and skill builds are permitted to run.
    - capability: capabilitySystemPromptManagement
      at: memory
      note: >
        Instruction files, hooks and settings are configuration and are managed as code:
        reviewed on change, diffed on clone, never executed from a package a dependency dropped
        in.
    - capability: capabilityEgressControl
      at: toolPlane
      note: >
        The endpoint's egress allowlist, enforced by device management, decides where the
        direct path may go: the AI gateway, the package mirror, and the named services a local
        server is approved to call — nothing else. Shell commands, fetches and
        browser traffic are bounded here — not at the gateway, which brokers model, MCP and API
        calls and sees nothing else.
    - capability: capabilityToolPermissionScoping
      at: aiGateway->extTools
      note: >
        The gateway's own allowlist: which external MCP servers, APIs and peer agents are
        registered, and which tools each key may call on them. Configuration of a broker, not a
        network control.
walkthrough:
  title: The developer asks for a change
  moves: >-
    A task stated at the machine, inference, and the approved edits and calls it produces.
  steps:
    - follow: developer->harness
      note: The task is stated by a human who will stay for the session.
    - follow: harness->aiGateway
      note: >
        The turn's model call crosses on a brokered credential — or, in the common install,
        does not cross here at all and goes straight out on a pasted key.
    - follow: aiGateway->provider
      note: Inference on the vaulted key, against an allowlisted provider.
    - follow: provider->aiGateway
      note: The completion comes back across the same brokered crossing.
    - follow: aiGateway->harness
      note: And into the loop — unauthenticated content, now the plan.
    - follow: harness->developer
      note: >
        Consequential actions surface for approval before they run — the only gate there is,
        kept rare enough that each prompt is read.
    - follow: developer->harness
      note: Approved — this action, these arguments, not a blanket yes.
    - follow: toolPlane->aiGateway
      note: >
        Edits and commands execute inside the application's native tools, with whatever scope
        the permission model granted. Anything a local tool sends to a remote server or
        connector crosses our tier here — brokered, on a credential the gateway injects.
    - follow: aiGateway->extTools
      note: A third-party server or connector, admitted by the catalogue on a scoped credential.
    - follow: extTools->downstream
      note: >
        And out to what those services act on. What comes back is loaded and read as context,
        which is why the provenance of a tool matters as much as the content of a page.

scenarios:
  - title: Steering from a phone
    steps:
      - follow: developer->remoteDevice
        note: The developer types the instruction on a phone, a web UI the harness serves, or a chat thread.
      - follow: remoteDevice->relay
        note: >
          The phone reaches a third-party relay. Nothing we operate is on this hop, and for one
          popular harness the default is a community relay with no IP allowlisting.
      - follow: relay->harness
        note: >
          The relay hands the instruction down a connection the harness dialled out. Admission
          is a bearer secret at best; with no relay at all the phone connects straight to a
          listening port and admission is whatever that port checks, which is often nothing.
      - follow: harness->relay
        note: The result goes back up the same dialled-out connection.
      - follow: relay->remoteDevice
        note: >
          And back to the phone. The same shape as the third-party round trip, with a party in
          the middle that vouches for nothing — no owner account, no tenant, often no allowlist.
          That is the whole difference between the two drawings.
  - title: A poisoned document phones home
    steps:
      - follow: harness->aiGateway
        note: The loop asks for a document — a ticket, a wiki page, a shared file — through the crossing.
      - follow: aiGateway->hostedTools
        note: Brokered to the connector that can read it.
      - follow: hostedTools->orgData
        note: A hidden instruction in the document is read along with the document.
      - follow: orgData->hostedTools
        note: The content comes back as a tool result.
      - follow: hostedTools->aiGateway
        note: Across the crossing, where inspection is possible and rarely configured.
      - follow: aiGateway->harness
        note: And into context, where the loop cannot tell the instruction from the task.
      - follow: harness->aiGateway
        note: The poisoned context goes up for inference.
      - follow: aiGateway->provider
        note: Nothing on this hop knows the context is hostile.
      - follow: provider->aiGateway
        note: The completion carries the attacker's instruction as the plan.
      - follow: aiGateway->harness
        note: The loop treats it as the next step.
      - follow: toolPlane->downstream
        note: >
          A shell command or a local server bundles a token, a file or a key into a request and
          sends it itself — the direct path, where the endpoint's egress allowlist is the last
          control standing, and on the common install there is none.
  - title: The harness updates itself
    steps:
      - follow: toolPlane->registry
        note: >
          A new release of the harness or one of its extensions is requested — the package manager
          runs as the developer, in the application's own tools, on the supply chain's proven path,
          straight to the mirror: the one destination the egress allowlist permits, and where a
          version is pinned and a review has happened.
      - follow: registry->toolPlane
        note: >
          The approved build comes back, digest-checked against the pin — the hop a compromised
          release actually arrives on — and loads into the running process with everything the
          agent has. A compromised release is code execution as the developer.
deviations:
  - subject: There is no vendor band
    reason: >
      That absence is the archetype. Every control the vendor column supplied in the
      third-party drawing — expiring session credentials, managed settings, session audit
      export, an owner-bound remote relay — has no counterpart here, and nothing replaces
      them by default. The family differs in exactly three places, all consequences of the
      missing column: custody (a Remote relay in the external band where the vendor's
      owner-bound relay stood, plus the listening serve port), the software supply chain (the
      Private pkg registry, because the community channel delivers the agent itself), and the
      spend meter (a rate-limiting pin, because no vendor console exists). Everything else is
      deliberately identical so a reader comparing the two sees those differences and nothing
      else.
  - subject: The AI gateway is drawn although the common install lacks it
    reason: >
      This catalogue draws target states. The gateway is the organisation's replacement for
      the missing vendor column — key vault, egress policy, audit, and the admission decision
      for the remote surface — and the common state, a pasted key calling the provider
      directly, is recorded here rather than drawn as a second model path.
  - subject: The private package registry is drawn in the enterprise band, not as a tool source
    reason: >
      In this archetype the registry delivers the agent itself, not merely what the agent
      calls. Drawing it in the enterprise band rather than out among the downstream services
      says the thing that matters: which build of the harness is permitted to run is a
      decision the organisation makes at its own mirror, which the native tools reaches directly
      under the endpoint's egress allowlist.
  - subject: The sandbox is a Sandboxed tools item, not a frame
    reason: >
      Of the ontology's three canonical sandbox forms, this one is a contained execution path
      inside one application: the harness and shell run as the user, and only tool execution
      is contained — conditionally, when isolation is on. A boundary frame would claim a
      containment the drawing's own notes deny. The personal agent, whose whole loop lives
      inside the container, draws the frame; here the item form is the honest one.

  - subject: Identity governance and remote admission are absorbed by the relay and the harness
    reason: >
      Two inline pins sit on components that are not their registered embodiment. Identity
      governance on the relay is delivered by contracting a zero-trust tunnel tied to our
      directory — an uncontracted community relay leaves the pin unmet, which is then the
      finding. Runtime enforcement on the relay-to-harness hop is the harness's own shared
      secret and loopback bind plus the relay's identity headers; nothing else on this path
      can hold it.

