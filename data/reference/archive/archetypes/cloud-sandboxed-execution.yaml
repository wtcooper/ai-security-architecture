    url: https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/
  - title: "OWASP Securing Agentic Applications Guide 1.0 — sandboxing and containment"
    url: https://genai.owasp.org/resource/securing-agentic-applications-guide-1-0/
  - title: "Thoughtworks Technology Radar vol. 34 — sandboxed execution for coding agents"
    url: https://www.thoughtworks.com/radar/techniques
  - title: "Anthropic engineering — decoupled brain and hands, credentials outside the sandbox"
    url: https://www.anthropic.com/engineering/managed-agents
  - title: "AWS Well-Architected Agentic AI Lens — isolation and bounded autonomy"
    url: https://docs.aws.amazon.com/wellarchitected/latest/agentic-ai-lens/agentic-ai-lens.html
