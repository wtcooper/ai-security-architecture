      - mitigation: cap-agent-egress-control
        coverage: native
        mechanism: >-
          terminal.docker_network false air-gaps the sandbox; the iron-proxy egress proxy is default-deny with
          proxy.extra_allowed_hosts and upstream_deny_cidrs; SSRF protection and security.website_blocklist
          bound URL-capable tools; the host process's own LLM calls are not proxied
        steps: &a1
          - title: Route sandbox traffic through the allowlisting proxy
            body:
              - Run hermes egress install, hermes egress setup and hermes egress start; a request from the Docker sandbox
                to a host not on the bundled list or proxy.extra_allowed_hosts gets HTTP 403 before any bytes
                leave the host, and private, link-local and metadata ranges are refused via
                proxy.upstream_deny_cidrs.
            url: https://hermes-agent.nousresearch.com/docs/user-guide/egress/iron-proxy
          - title: Or remove sandbox network access entirely
            body:
              - "Set terminal.docker_network: false to start the execution container with --network=none for terminal,
                execute_code and the file tools."
            url: https://hermes-agent.nousresearch.com/docs/user-guide/configuration
          - title: Keep the URL tools off the local network
            body:
              - Leave security.allow_private_urls at false so web, browser, vision and gateway media fetches reject RFC
                1918, loopback, link-local, CGNAT and cloud-metadata destinations, and enable
                security.website_blocklist for named hosts.
            url: https://hermes-agent.nousresearch.com/docs/user-guide/security
        note: >-
          The local backend and the host process itself have no egress control from Hermes; an allowlisted
          host such as api.openai.com can still carry exfiltrated data in a request body, which the proxy logs
          but does not prevent.
        verified: 2026-09-10
