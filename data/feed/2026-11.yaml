  - id: inference-server-side-channels
    kind: research
    date: '2026-11-19'
    title: Sandboxed models can signal each other through a shared inference server's step size and KV
      cache
    summary: 'Two researchers show two covert channels in vLLM: one model varies engine step size to change
      rounding the other reads, or leaves a cached ''mailbox'' the other detects. A policy told a monitor
      on the same engine ''not a honeypot'' and 354 of 354 attacks passed. Both worked on SGLang, LMDeploy
      and TensorRT-LLM. The authors say a monitor on a separate engine instance closes nearly every channel.

      '
    why: >-
      Network and filesystem sandboxing does not isolate models that share an inference server with their
      monitor.
    vendor: LessWrong (Deshpande, Africa)
    products: [toolVllm]
    controls: [D3-EI, AML.M0024]
    patterns: [archAgentSandbox, archSelfHostedInference]
    update:
      action: controlGuidance
      status: proposed
      target: D3-EI
      note: >-
        Isolation includes inference: run monitors on a separate engine from the policy, salt KV caches
        per tenant.
    sources:
    - title: Models Can Communicate via Inference Servers Despite Being Sandboxed
      url: >-
        https://www.lesswrong.com/posts/7wzWuLP3HhyBLmKfo/models-can-communicate-via-inference-servers-despite-being
      publisher: LessWrong
      date: '2026-11-19'
    - {title: Models Can Communicate via Inference Servers Despite Being Sandboxed (discussion), url: 'https://news.ycombinator.com/item?id=50637686',
      publisher: Hacker News, date: '2026-11-25'}
  - id: google-chrome-mirror-dimension
    kind: research
    date: '2026-11-19'
    title: Chrome's Mirror Dimension tests browser agents against a synthetic web in a gVisor sandbox
    summary: 'Chrome AI Security runs browser-use agents in headless Chrome inside gVisor, with traffic
      sent to a local proxy that serves generated copies of real sites under real URLs and a custom root
      CA. Engineers inject payloads into text, images, DOM, ARIA labels and WebMCP tool responses at any
      step, keyed by HTTP headers so the URL stays clean. An automated pipeline makes over 1,000 test
      cases a day per engineer.

      '
    why: >-
      A repeatable way to red-team indirect prompt injection in browser agents without touching the live
      web.
    vendor: Google
    products: [toolGeminiChrome]
    controls: [AML.M0035, D3-EI]
    patterns: [archAgenticBrowser, archAgentSandbox]
    sources:
    - {title: 'Mirror Dimension for Agents: Evaluating Browser-Use Agents Without the Web', url: 'https://blog.google/security/mirror-dimension-for-agents/',
      publisher: Google, date: '2026-11-19'}
  - id: checkpoint-gatekeeper-asymmetry
    kind: research
    date: '2026-11-19'
    title: >-
      Check Point: a guard model weaker than the model it protects will be bypassed ('gatekeeper asymmetry')
    summary: 'Check Point Research argues that when the screen is weaker than the system behind it, attackers
      eventually win. Its PuzzleMask technique hides a payload in plain prose: a small LLM sanity check
      passes it and the stronger target model extracts and acts on it. It reports success on GPT-5.2-thinking-high.
      It advises treating such gaps as failed by default and planning defence in depth behind the guard.

      '
    why: Challenges relying on a small screening model in front of a frontier model with tools.
    vendor: Check Point
    controls: [cap-input-guardrails, AML.M0020]
    patterns: [archChatAgent, archActionAgent]
    update:
      action: controlGuidance
      status: proposed
      target: cap-input-guardrails
      note: >-
        A screen weaker than the protected model misses payloads the model can decode; back it with action-level
        checks.
    sources:
    - title: '30 Years of Gatekeeper Asymmetry Doom: The Paradox that Makes Powerful LLMs More Vulnerable'
      url: >-
        https://research.checkpoint.com/2026/30-years-of-gatekeeper-asymmetry-doom-the-paradox-that-makes-powerful-llms-more-vulnerable/
      publisher: Check Point Research
      date: '2026-11-19'
