  - id: agentLogSink
    name: "Aggregated sink to a central log bucket with locked retention"
    where: "Cloud Logging › organisation or folder › aggregated sink to a log bucket in a logging project; bucket retention and lock; log views for readers"
    setVia: [apiCli, adminConsole]
    area: audit
    default: "Data Access audit logs are off until you enable them. Once on, they, gateway request logs and the agent's stdout and stderr logs go to the _Default bucket with 30 days of retention."
    recommended: "Route cloudaudit.googleapis.com logs, networkservices.googleapis.com/gateway_requests and the reasoning_engine_stdout and reasoning_engine_stderr logs to one bucket. Set retention, lock it, and grant read access through log views."
    value: "One central bucket, retention locked"
