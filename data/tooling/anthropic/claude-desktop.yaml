    # The security-relevant settings, each with the baseline value (data/tooling/BASELINE.md).
    # Two planes: Claude Desktop's device policy (com.anthropic.claudefordesktop / HKLM\SOFTWARE\Policies\Claude /
    # /etc/claude-desktop/managed-settings.json), which overrides the in-app allowlist, and the claude.ai console
    # (Organization settings). Rows marked "Claude Desktop on 3P" are keys documented only for that mode. The
    # Code and Cowork tabs' own settings are on toolClaudeCode and toolClaudeCowork. Verified 2026-10-30.
    settings:
      - id: requireSso
        name: Require SSO for Claude
        where: claude.ai Organization settings › Organization and access › Authentication
        setVia: [adminConsole, identityProvider]
        area: identity
        default: "Off"
        recommended: "On, with MFA enforced on the Claude app in your IdP"
        why: Every interactive claude.ai and Claude Desktop login goes through the corporate IdP and its MFA; personal email logins on your domain stop working.
        mitigations: [D3-MFA]
        requires: Team or Enterprise
        url: https://support.claude.com/en/articles/13132885-set-up-single-sign-on-sso
        verified: "2026-10-30"
      - id: shortenedSessionLength
        name: Shortened session length
        where: claude.ai Organization settings › Organization and access › Session security
        setVia: [adminConsole]
        area: identity
        default: Not enabled (sign-in kept while the user stays active)
        recommended: 7 days
        why: The Claude Desktop sign-in expires weekly, so a stolen or stale session meets the IdP's MFA again.
        mitigations: [D3-MFA, D3-CH]
        requires: Enterprise
        url: https://support.claude.com/en/articles/13163631-configuring-session-security-settings
        verified: "2026-10-30"
      - id: forceLoginOrgUUID
        name: forceLoginOrgUUID
        where: Claude Desktop policy (com.anthropic.claudefordesktop / HKLM\SOFTWARE\Policies\Claude) → forceLoginOrgUUID
        setVia: [mdm]
        area: identity
        default: Unset (any organisation)
        recommended: Your organisation's UUID
        why: On managed devices Claude Desktop refuses a login to any other organisation, personal accounts included.
        mitigations: [D3-MFA, cap-shadow-ai-discovery]
        url: https://support.claude.com/en/articles/12622667-enterprise-configuration-for-claude-desktop
        verified: "2026-10-30"
      - id: migrateAccounts
        name: Migrate accounts using your domain
        where: claude.ai Organization settings › Organization and access › Security
        setVia: [adminConsole]
        area: identity
        default: "Off"
        recommended: On, after reviewing the personal accounts listed on your domain
        why: No Free, Pro or Max account can exist on the verified domain, so work chats can't sit in personal plans no admin sees; it can't be reversed.
        mitigations: [cap-shadow-ai-discovery]
        requires: Enterprise, enforced SSO
        url: https://support.claude.com/en/articles/14625619-claim-and-migrate-accounts-on-your-domain
        verified: "2026-10-30"
      - id: tenantRestrictions
        name: Tenant Restrictions (anthropic-allowed-org-ids)
        where: Corporate TLS-inspecting proxy → anthropic-allowed-org-ids header on Claude traffic
        setVia: [cloudPolicy]
        area: identity
        default: Not injected
        recommended: Your organisation's UUID, injected for every managed device
        why: Personal and other organisations' Claude accounts can't sign in from the corporate network, on any device or browser.
        mitigations: [cap-shadow-ai-discovery]
        requires: Enterprise
        url: https://support.claude.com/en/articles/13198485-enforce-network-level-access-control-with-tenant-restrictions
        verified: "2026-10-30"
      - id: requireTrustedDevices
        name: Require trusted devices
        where: claude.ai Organization settings › Capabilities › Remote sessions
        setVia: [adminConsole]
        area: identity
        default: "Off"
        recommended: "On"
        why: Reaching back into a member's computer from a cloud session needs an enrolled device and a sign-in under 18 hours old, not just a signed-in account.
        mitigations: [D3-MFA]
        requires: Team or Enterprise (beta)
        url: https://code.claude.com/docs/en/remote-control#trusted-devices
        verified: "2026-10-30"
      - id: computerAccess
        name: Computer access (custom role capability)
        where: claude.ai Organization settings › Roles › role › Capabilities › Remote sessions
        setVia: [adminConsole, identityProvider]
        area: tools
        default: On for roles that include Chat, Claude Code, Cowork or Claude in Chrome while it is on for the organisation
        recommended: Granted only on the roles of groups that need to reach their own computer from the web, mobile or scheduled tasks
        why: Scheduled tasks, Claude on the web and Claude Mobile reach a member's files, apps and browser through the desktop app only for those groups; sessions started in Claude Desktop itself are unaffected.
        mitigations: [AML.M0028, cap-agent-kill-switch]
        requires: Enterprise
        url: https://support.claude.com/en/articles/13930452-manage-custom-roles-on-enterprise-plans
        verified: "2026-10-30"
      - id: isLocalDevMcpEnabled
        name: isLocalDevMcpEnabled
        where: Claude Desktop policy → isLocalDevMcpEnabled
        setVia: [mdm]
        area: tools
        default: "true"
        recommended: "false"
        why: Local MCP servers from claude_desktop_config.json and plugins run on the device with the user's permissions, outside the connector list and tool policy; off also stops the app connecting to Claude in Chrome.
        mitigations: [AML.M0028, cap-agent-action-policy-enforcement, cap-agent-tool-registry, cap-mcp-tool-integrity, cap-agent-kill-switch]
        url: https://support.claude.com/en/articles/12622667-enterprise-configuration-for-claude-desktop
        verified: "2026-10-30"
      - id: isDesktopExtensionEnabled
        name: isDesktopExtensionEnabled
        where: Claude Desktop policy → isDesktopExtensionEnabled, isDesktopExtensionDirectoryEnabled
        setVia: [mdm]
        area: tools
        default: "true / true"
        recommended: Unset, so the allowlist decides which extensions load
        why: isDesktopExtensionEnabled false stops installed extensions loading and blocks new installs, and either key set to false overrides the in-app allowlist; keep them as the off switch for machines that must run no extensions.
        mitigations: [cap-agent-kill-switch, AML.M0028]
        url: https://support.claude.com/en/articles/12622667-enterprise-configuration-for-claude-desktop
        verified: "2026-10-30"
      - id: desktopExtensionAllowlist
        name: Allowlist (desktop extensions)
        where: claude.ai Organization settings › Connectors › Desktop
        setVia: [adminConsole]
        area: tools
        default: "Off (every extension in the registry installable)"
        recommended: On, with only approved extensions added; leave isDesktopExtensionEnabled unset so the list populates
        why: Desktop extensions are blocked by default, installed ones outside the list are removed, and members install only the .mcpb servers you list.
        mitigations: [cap-agent-tool-registry, AML.M0028, cap-mcp-tool-integrity, D3-FA]
        requires: Team or Enterprise
        url: https://support.claude.com/en/articles/12592343-enabling-and-using-the-desktop-extension-allowlist
        verified: "2026-10-30"
      - id: isClaudeCodeForDesktopEnabled
        name: isClaudeCodeForDesktopEnabled
        where: Claude Desktop policy → isClaudeCodeForDesktopEnabled
        setVia: [mdm]
        area: tools
        default: "true"
        recommended: "false, except on devices of the groups that hold Claude Code"
        why: The Code tab runs commands and edits files on the device; off, chat users don't get a coding agent their role was never meant to have.
        mitigations: [AML.M0028]
        url: https://support.claude.com/en/articles/12622667-enterprise-configuration-for-claude-desktop
        verified: "2026-10-30"
      - id: inferenceHooks
        name: Inference hooks
        where: claude.ai Organization settings › Data and privacy › Inference hooks
        setVia: [adminConsole]
        area: data
        default: "Off"
        recommended: On, connected to your DLP or AI-security service, enforcing after a monitor-only period
        why: Each Claude Desktop chat request, results from local MCP servers and extensions included, is checked by your own service before inference, so secrets and injected content can be stopped centrally.
        mitigations: [cap-sensitive-data-redaction, cap-input-guardrails]
        requires: Enterprise
        url: https://platform.claude.com/docs/en/manage-claude/inference-hooks-configuration
        verified: "2026-10-30"
      - id: memory
        name: Memory
        where: claude.ai Organization settings › Capabilities
        setVia: [adminConsole]
        area: data
        default: "Off (each member opts in once an Owner allows it)"
        recommended: "Off; projects keep their own context"
        why: Account memory carries details across chats, so one engagement's material could resurface in another client's work; teams that want it get it per role.
        mitigations: [AML.M0031]
        requires: Team or Enterprise
        url: https://support.claude.com/en/articles/11817273-use-claude-s-chat-search-and-memory-to-build-on-previous-context
        verified: "2026-10-30"
      - id: complianceApi
        name: Compliance API
        where: claude.ai Organization settings › API, then a Compliance Access Key with read:compliance_user_data
        setVia: [adminConsole, apiCli]
        area: audit
        default: "Off"
        recommended: On, pulled into your SIEM and eDiscovery; delete scope on a separate key
        why: Desktop chats are claude.ai chats, so their tool calls and results reach your own store with the rest; while it is off nothing is exported.
        mitigations: [cap-agent-tracing]
        requires: Enterprise
        url: https://platform.claude.com/docs/en/manage-claude/compliance-api-access
        verified: "2026-10-30"
      - id: disableAutoUpdates
        name: disableAutoUpdates
        where: Claude Desktop policy → disableAutoUpdates, autoUpdaterEnforcementHours
        setVia: [mdm]
        area: tools
        default: "false / 72"
        recommended: "false, unless MDM pins and ships versions itself / 72"
        why: Security fixes to Claude Desktop reach every device, restarting it within three days of a prepared update.
        mitigations: []
        url: https://support.claude.com/en/articles/12622667-enterprise-configuration-for-claude-desktop
        verified: "2026-10-30"
      - id: managedMcpServers
        name: Managed MCP servers (managedMcpServers)
        where: Claude Desktop on 3P configuration (MDM profile, bootstrap server or Enterprise Admin Console) → managedMcpServers, each entry's toolPolicy
        setVia: [mdm, adminConsole]
        area: tools
        default: Unset (no servers pushed; users' own tools user-controlled)
        recommended: 'The approved servers, each with a toolPolicy of "*": "blocked" plus exact "allow" or "ask" entries'
        why: Approved servers reach every device with unlisted tools removed, and the policy is enforced in the desktop host process, not only in the prompt.
        mitigations: [cap-agent-action-policy-enforcement, AML.M0028, AML.M0029, cap-agent-tool-registry]
        requires: Claude Desktop on 3P
        url: https://claude.com/docs/third-party/claude-desktop/configuration#managedmcpservers
        verified: "2026-10-30"
      - id: mcpPersistentAlwaysAllowEnabled
        name: Allow persistent tool approvals (mcpPersistentAlwaysAllowEnabled)
        where: Claude Desktop on 3P configuration → mcpPersistentAlwaysAllowEnabled
        setVia: [mdm, adminConsole]
        area: tools
        default: "true"
        recommended: "false"
        why: MCP tool approvals stay per call or per task, and standing approvals users saved earlier in Chat and Cowork stop applying.
        mitigations: [AML.M0029]
        requires: Claude Desktop on 3P
        url: https://claude.com/docs/third-party/claude-desktop/configuration#mcppersistentalwaysallowenabled
        verified: "2026-10-30"
      - id: isDesktopExtensionSignatureRequired
        name: Require signed extensions (isDesktopExtensionSignatureRequired)
        where: Claude Desktop on 3P configuration → isDesktopExtensionSignatureRequired
        setVia: [mdm, adminConsole]
        area: tools
        default: "false"
        recommended: "true"
        why: Desktop extensions not signed by a trusted publisher are rejected, so an unsigned or home-made .mcpb can't load.
        mitigations: [D3-FA, cap-mcp-tool-integrity]
        requires: Claude Desktop on 3P
        url: https://claude.com/docs/third-party/claude-desktop/configuration#isdesktopextensionsignaturerequired
        verified: "2026-10-30"
      - id: disableDeploymentModeChooser
        name: Disable Claude.ai sign-in (disableDeploymentModeChooser)
        where: Claude Desktop on 3P MDM profile → disableDeploymentModeChooser
        setVia: [mdm]
        area: identity
        default: "false"
        recommended: "true"
        why: Users see only your provider at sign-in and can't leave the managed configuration by signing in to claude.ai, personal accounts included.
        mitigations: [cap-shadow-ai-discovery]
        requires: Claude Desktop on 3P (not settable from the Enterprise Admin Console)
        url: https://claude.com/docs/third-party/claude-desktop/configuration#disabledeploymentmodechooser
        verified: "2026-10-30"
      - id: chatSessionRetentionDays
        name: Chat retention period (chatSessionRetentionDays)
        where: Claude Desktop on 3P configuration → chatSessionRetentionDays
        setVia: [mdm, adminConsole]
        area: data
        default: Unset (no deletion)
        recommended: "30"
        why: Chats and their files, stored unencrypted on the device in 3P mode, are deleted after 30 idle days instead of staying on laptops indefinitely; projects and memory stay.
        mitigations: [AML.M0031]
        requires: Claude Desktop on 3P
        url: https://claude.com/docs/third-party/claude-desktop/configuration#chatsessionretentiondays
        verified: "2026-10-30"
      - id: otlpEndpoint
        name: OTLP endpoint (otlpEndpoint)
        where: Claude Desktop on 3P configuration → otlpEndpoint, otlpContentCapture
        setVia: [mdm, adminConsole]
        area: audit
        default: Unset (no export)
        recommended: Your OpenTelemetry collector, forwarding to the SIEM; otlpContentCapture left unset (metadata only)
        why: Chat, Cowork and Code session events from every device land in the SIEM with the signed-in user, without prompt or tool content unless you add it.
        mitigations: [cap-agent-tracing]
        requires: Claude Desktop on 3P
        url: https://claude.com/docs/third-party/claude-desktop/telemetry
        verified: "2026-10-30"
