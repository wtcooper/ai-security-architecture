      - mitigation: AML.M0028
        coverage: native
        verified: "2026-09-10"
        mechanism: >-
          Site-level scoping: org allowlist and blocklist at Organization settings > Claude in Chrome override
          user grants; per-site "Allow this action" / "Always allow actions on this site"; default-blocked
          categories and financial-site gating; Chrome ExtensionSettings runtime_blocked_hosts /
          runtime_allowed_hosts at the browser policy tier
        steps:
          - title: Scope by site in the vendor console
            body:
              - Add approved sites to the allowlist so Claude can only browse those, and forbidden sites to
                the blocklist, which applies regardless of user settings; the vendor recommends a restrictive
                allowlist during rollout.
            url: https://support.claude.com/en/articles/13065128-claude-in-chrome-admin-controls
          - title: Let users grant the minimum per site
            body:
              - Advise "Allow this action" over "Always allow actions on this site"; users review and revoke
                always-allow grants under Extension settings > Permissions.
            url: https://support.claude.com/en/articles/12902446-claude-in-chrome-permissions-guide
          - title: Enforce host scope from browser policy
            body:
              - In ExtensionSettings for id fcoeoabgfenejglbffodgkkbkcdhcgfn set runtime_blocked_hosts for
                origins the extension must never touch; the Chromium policy text warns that from Chrome 154
                runtime_blocked_hosts on an extension with the debugger permission disables
                chrome.debugger.attach() entirely, so test before rollout.
            url: >-
              https://chromium.googlesource.com/chromium/src/+/HEAD/components/policy/resources/templates/policy_definitions/Extensions/ExtensionSettings.yaml
        evidence: []
        note: >-
          Scoping is by site, not by tool: the org allowlist and blocklist hide sites, per-site grants
          pre-approve actions there, and default-blocked categories limit reach. In Claude Code the
          extension's tools follow permission rules.
