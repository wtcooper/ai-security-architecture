                organisation's DLP service.
            url: https://learn.chatgpt.com/docs/enterprise/agent-security
          - title: Keep secrets paths and window captures out
            body:
              - >-
                Set [permissions.filesystem] deny_read for credential paths and, for the most sensitive teams,
                allow_appshots = false in Global requirements.toml.
            url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
        note: >-
          Partial by the rule applied to every vendor: a hook that can block is an attach point and the detection
