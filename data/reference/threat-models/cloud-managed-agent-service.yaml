pattern: archCloudManagedAgent
reviewed: "2026-11-24"
summary: >-
  A cloud provider runs the agent loop as a resource in your own cloud account, so your
  identity, network, keys, policy and audit log apply, but the loop, the model call and the
  built-in tools run where you cannot inspect them. Your gateway sees tool traffic only: what
  hosted connectors, web tools and memory return reaches the loop unscreened by you, and a
  built-in shell may sit beside the credentials the service resolves. Defaults matter, because
  on most platforms an agent starts with a public endpoint and key access.
concentrates: >-
  Where a ticket or record an outsider wrote reaches a session whose built-in shell or code
  tool shares a trust domain with the credentials the service resolved, and the agent's cloud
  identity can reach more of the account than its task needs.
scope: >-
  Agents defined in a provider's managed agent service inside your cloud account, called by
  your application for signed-in users, with tools into internal systems through your gateway,
  provider-hosted connectors, built-in web and code tools, and memory in your own stores.
lists: [owasp-llm-2026, owasp-agentic, owasp-mcp]
assets:
  - "Records in systems of record the agent reaches through your gateway"
  - "The agent's cloud identity, and connector credentials the service resolves"
  - "Conversations, memory, files and search index in your stores"
  - "The agent definition: model, instructions, tools and service settings"
  - "Cloud account resources the agent's identity can reach"
  - "Agent traces and the cloud audit log"
actors:
  - who: "Author of a ticket, record or page"
    access: "Writes content the agent reads through your tools, hosted connectors or web fetch"
    wants: "To steer the agent or take its credentials"
  - who: "End user"
    access: "Signed in at your front end, with a session bound to them"
    wants: "Data or actions beyond their own access"
  - who: "Anyone with a role in the account"
    access: "Can create or change agent resources by API or console"
    wants: "Speed, which leaves agents public, keyed or unregistered"
  - who: "Tool server or connector operator"
    access: "Serves tool descriptions and results the loop reads, from the provider's side"
    wants: "To steer the agent, or change after review"
  - who: "The provider and its suppliers"
    access: "Runs the loop, model calls and built-in tools on machines you do not manage"
    wants: "Product operation; trusted but not inspected"
  - who: "The agent itself"
    access: "Its definition, identity and tools, in sessions nobody watches"
    wants: "None; a failure source"
threats:
  - id: T1
    title: "A ticket has the built-in shell read the agent's resolved credentials"
    rating: critical
    evidence: research
    story: >-
      A hidden comment in a support ticket had a managed agent run a script through its default
      shell, which sat beside the harness and read the operator's tool token from its memory.
      Replayed from a laptop, the token reached customer records. The service keeps keys from
      the agent only while nothing it runs can reach them.
    at: [internalTools->orgData, managedRuntime->aiGateway, nativeTools, managedRuntime]
    risks: [riskPromptInjection, riskInsecureIntegratedComponent, riskAgenticDelegationConfusedDeputy]
    atlas: [AML.T0051.001, AML.T0050, AML.T0098, AML.T0091.000]
    owasp: [LLM01:2026, LLM10:2026, ASI05, MCP01:2025, MCP05:2025]
    controls: [D3-EI, AML.M0028, D3-CH, cap-agent-egress-control, cap-input-guardrails]
    incidents: [agentcore-token-theft]
  - id: T2
    title: "The agent's cloud identity reaches far more of the account than its task"
    rating: high
    evidence: research
    story: >-
      A service's default identity, or one shared by several agents, can read stores and
      resources the agent never needs, and code a tool runs can pick that identity up. In one
      provider's agent runtime, a deployed tool read the default service agent's token and used
      it to list and read the project's storage buckets.
    at: [managedRuntime, nativeTools->memory, managedRuntime->aiGateway]
    risks: [riskAgenticDelegationConfusedDeputy, riskSensitiveDataDisclosure]
    atlas: [AML.T0055, AML.T0012]
    owasp: [LLM03:2026, ASI03, MCP02:2025]
    controls: [D3-AA, cap-data-access-governance, D3-CH, D3-ACH]
    refs:
      - { title: "Unit 42, Double Agents: Exposing Security Blind Spots in GCP Vertex AI, 31 March 2026", url: "https://unit42.paloaltonetworks.com/double-agents-vertex-ai/" }
  - id: T3
    title: "Hosted connectors and built-in web tools carry instructions past your gateway"
    rating: high
    evidence: disclosed
    story: >-
      Connectors the provider hosts, remote tool servers named in the definition and web search
      return content into the loop on the provider's side, where nothing of yours screens it,
      and a server can change after review. A public issue read through a code-hosting tool
      server made an agent leak private repositories.
    at: [managedRuntime->vendorTools, nativeTools->openWeb]
    risks: [riskPromptInjection, riskToolSourceProvenance]
    atlas: [AML.T0051.001, AML.T0110.000, AML.T0110.002]
    owasp: [LLM01:2026, ASI01, MCP03:2025, MCP06:2025]
    controls: [AML.M0028, cap-agent-egress-control, cap-input-guardrails, cap-agent-action-policy-enforcement]
    refs:
      - { title: "Invariant Labs, GitHub MCP server vulnerability", url: "https://invariantlabs.ai/blog/mcp-github-vulnerability" }
  - id: T4
    title: "A planted line in memory steers later sessions and other users"
    rating: high
    evidence: observed
    story: >-
      Conversation state and long-term memory are read back on every later call, and in every
      session if memory is shared across users, with no gateway on the path. A page or tool
      result the service chooses to remember keeps steering after the run. Links telling
      assistants to trust a company were found in the wild.
    at: [memory, nativeTools->memory]
    risks: [riskPromptInjection, riskSensitiveDataDisclosure]
    atlas: [AML.T0080.000, AML.T0085.002, AML.T0070]
    owasp: [LLM02:2026, LLM05:2026, LLM09:2026, ASI06, MCP10:2025]
    controls: [AML.M0031, cap-data-access-governance, cap-input-guardrails]
    refs:
      - { title: "Microsoft Security blog, AI Recommendation Poisoning, February 2026", url: "https://www.microsoft.com/en-us/security/blog/2026/02/10/ai-recommendation-poisoning/" }
  - id: T5
    title: "An agent created by hand is public, keyed or unregistered"
    rating: high
    evidence: disclosed
    story: >-
      An agent is one API call away for anyone with the role in the account, and on most
      platforms it starts with a public endpoint and key access. Agents made outside the
      pipeline are not in the register, so nobody reviews or stops them. An autonomous
      scanner found 22 unauthenticated endpoints on one firm's AI platform.
    at: [agentDef->managedRuntime, entry->managedRuntime]
    risks: [riskShadowAndUnknownAgents]
    atlas: [AML.T0132, AML.T0012]
    owasp: [ASI03, MCP07:2025, MCP09:2025]
    controls: [cap-agent-tool-registry, D3-ACH, D3-NI, D3-APA, cap-staged-rollout-gate]
    incidents: [mckinsey-lilli]
  - id: T6
    title: "Your application's identity stands in for the user on every call"
    rating: high
    evidence: disclosed
    story: >-
      If the front end calls the agent as itself and your gateway grants access to the agent,
      not the person, every tool call carries the application's reach and the model decides
      who sees what. A shared secret and email-only account linking once let an
      outsider drive a privileged built-in agent to create an administrator.
    at: [entry->managedRuntime, managedRuntime->aiGateway, aiGateway->internalTools]
    risks: [riskAgenticDelegationConfusedDeputy, riskRogueActions]
    atlas: [AML.T0053, AML.T0085.001]
    owasp: [LLM03:2026, ASI03, MCP07:2025]
    controls: [D3-APA, AML.M0028, D3-CTS, AML.M0029]
    refs:
      - { title: "AppOmni, BodySnatcher: ServiceNow AI agents (CVE-2025-12420)", url: "https://appomni.com/ao-labs/bodysnatcher-agentic-ai-security-vulnerability-in-servicenow/" }
  - id: T7
    title: "A skill, package or tool server changes after it was reviewed"
    rating: high
    evidence: observed
    story: >-
      Skills, packages and images the definition brings run in the session sandbox as code,
      and a remote tool server can change what it does without a new version. In 2026 an AI
      gateway library and an agent framework shipped releases with credential stealers; a
      look-alike MCP package copied all mail after 15 clean releases.
    at: [nativeTools, managedRuntime->vendorTools, agentDef->managedRuntime]
    risks: [riskInsecureIntegratedComponent, riskToolSourceProvenance]
    atlas: [AML.T0010.005, AML.T0109, AML.T0011.001]
    owasp: [LLM04:2026, ASI04, MCP04:2025]
    controls: [cap-agent-tool-registry, cap-staged-rollout-gate, AML.M0028, D3-EI]
    incidents: [mcp-supply-chain, litellm-release-hijack]
  - id: T8
    title: "Prompts and traces are processed or kept where you did not intend"
    rating: medium
    evidence: observed
    story: >-
      Prompts, context and tool results are processed on the provider's side, possibly in
      another region or under preview terms, and traces copy all of it into logs many people
      can read. In 2026 an inference provider kept a customer's AI chat transcripts despite a
      zero-retention commitment, and a breach there exposed them.
    at: [managedRuntime, memory]
    risks: [riskSensitiveDataDisclosure]
    atlas: [AML.T0085.002]
    owasp: [LLM02:2026]
    controls: [cap-ai-vendor-assessment, AML.M0012, cap-agent-tracing]
    refs:
      - { title: "Notion, security incident involving a third-party AI vendor", url: "https://notion.com/help/security-incident-involving-a-third-party-ai-vendor" }
  - id: T9
    title: "Writes land from a loop nobody watches and nobody can stop quickly"
    rating: medium
    evidence: theoretical
    story: >-
      Consequential writes reach systems of record from a loop the provider runs and you cannot
      watch. A session that loops, or a definition that went wrong, keeps acting until someone
      disables the identity, ends the sessions and pulls the version. No public case for these
      services; rated on the mechanism.
    at: [internalTools->orgData, managedRuntime]
    risks: [riskRogueActions]
    atlas: [AML.T0034.002]
    owasp: [LLM06:2026, ASI02, ASI08, ASI10, MCP08:2025]
    controls: [AML.M0029, AML.M0036, cap-agent-kill-switch, cap-agent-tracing]
coverage:
  - { id: "LLM07:2026", why: "Answers go to your own users through your application; a wrong answer acted on is outside what this drawing changes." }
  - { id: "LLM08:2026", why: "Users can draw out the definition's instructions and tool schemas; they should hold no secrets or access rules, which your gateway enforces." }
  - { id: "ASI07", why: "One provider-run agent per definition, with no messages between agents on the drawing." }
  - { id: "ASI09", why: "Approvals are shown in your own application for the exact action, so the agent does not frame its own request." }
questions:
  - "Which built-in tools (shell, code, computer use) are on for each agent, and can anything they run reach the credentials the service resolves?"
  - "Does each agent have its own cloud identity, and what can it read in the account beyond its own stores?"
  - "Does cloud policy refuse an agent with a public endpoint, key access, or an unapproved model or region?"
  - "Which connectors and remote tool servers does each definition name, and what screens what they return?"
  - "Whose access does a tool call carry at your gateway: the signed-in person's, or the application's?"
  - "Is memory kept per user and per session, and what may the agent decide to remember?"
  - "Can you stop an agent in minutes: disable its identity, end its sessions and pull its version?"
