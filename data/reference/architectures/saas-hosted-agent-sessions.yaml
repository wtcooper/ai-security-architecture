    - mitigation: AML.M0028
      at: aiGateway->internalTools
      note: Which servers, which tools, whose grant — decided at our tier because theirs is not ours to configure.
    - mitigation: AML.M0028
      at: aiGateway->extTools
      note: >-
        The gateway's registry of external destinations for the tools we chose to front. The connectors the
        vendor calls from its own side never meet this list.
    - mitigation: AML.M0029
      at: sourceControl
      note: >-
        The gate: a draft pull request a person reviews and merges, an initiator whose approval does not
        count, and workflows that wait for "approve and run". It approves the output, not the actions taken to
        produce it — a session's tool calls and network effects have already happened when the reviewer
        arrives, which is why the sandbox and egress pins exist.
    - mitigation: AML.M0029
      at: aiGateway->internalTools
      note: >-
        A consequential write into our systems refused at our gateway unless it carries an approval bound to
        the exact action — the second gate, for the tools the session reaches beyond the repository.
    - mitigation: AML.M0020
      at: sourceControl->managedRuntime
      note: >-
        Hidden-character and HTML-comment filtering on what the session reads, the agent's own configuration
        directories under CODEOWNERS and required review, and content from non-collaborators treated as
        untrusted input rather than instruction.
    - mitigation: AML.M0020
      at: aiGateway
      note: >-
        Returned tool and connector content classified at our crossing before it goes back to a loop we cannot
        see.
    - mitigation: D3-ORA
      at: managedRuntime
      note: >-
        Their isolation, retention and tenancy assured by assessment rather than drawn — the only
        representation a vendor-internal control gets.
    - mitigation: D3-CI
      at: managedRuntime
      note: >-
        The defaults move — egress on or off, self-approving automations, which plan gets proxied credentials,
        whether the compliance export covers this surface — and are re-assessed on a clock, not once.
    - mitigation: AML.M0020
      at: managedRuntime
      note: >-
        The vendor's own classifiers on what the session reads and does — hidden-character filtering,
        auto-mode reviewers, safety checks on the hosted browser — a zone-2 configuration choice on their
        surface rather than a tier we operate.
    - mitigation: AML.M0031
      at: managedRuntime
      note: >-
        Agent-written memory and persisted sessions: what is merged into later sessions, who can open a
        transcript, how long snapshots live — each a setting whose default is wider than most adopters assume.
    - mitigation: AML.M0004
      at: vendorService
      note: >-
        Session budgets, usage ceilings and automation caps in the tenant, because an unattended loop that
        re-triggers itself bills by the minute and nobody is watching the meter.
    - mitigation: AML.M0036
      at: vendorService
      note: >-
        Session budgets, usage ceilings and automation caps in the tenant, because an unattended loop that
        re-triggers itself bills by the minute and nobody is watching the meter.
    - mitigation: D3-EI
      at: nativeTools
      note: >-
        One microVM or container per session around the built-in tools, created for the run and reclaimed
        after it, with no shared filesystem between sessions — the provider's boundary, or ours where
        execution moves to a worker we run.
    - mitigation: D3-OTF
      at: nativeTools
      note: >-
