          - at: service
            text: "Microsoft's guidance for this option is thin: one paragraph in the hosting guide (a Deployment, a Service and an ingress) and one walkthrough that deploys a specific open-source server with the KMCP controller. There is no AKS counterpart to the App Service and Functions authorisation tutorials."
            url: https://learn.microsoft.com/en-us/azure/aks/openwebsearch-on-aks
