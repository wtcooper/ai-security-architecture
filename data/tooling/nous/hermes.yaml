      - mitigation: cap-mcp-tool-integrity
        coverage: partial
        mechanism: >-
          hermes security audit (OSV) scans the venv, plugin dependencies and pinned npx/uvx MCP servers;
          plugins are opt-in via plugins.enabled and pinnable to a commit SHA; hub skills are quarantined,
          content-hashed and scanned before install; MCP catalog entries are Nous-reviewed manifests
        steps: &a1
          - title: Run the supply-chain audit and fail on findings
            body:
              - hermes security audit --fail-on high checks installed PyPI distributions, plugin requirements under
                ~/.hermes/plugins/ and pinned npx/uvx MCP servers in config.yaml against OSV.dev; add it to a
                cron job or CI.
            url: https://hermes-agent.nousresearch.com/docs/reference/cli-commands
          - title: Keep third-party plugins opt-in and pinned
            body:
              - Nothing under ~/.hermes/plugins/ loads until its name is in plugins.enabled; install with hermes plugins
                install owner/repo --ref <40-char SHA> so updates cannot move it silently, and leave
                HERMES_ENABLE_PROJECT_PLUGINS unset.
            url: https://hermes-agent.nousresearch.com/docs/user-guide/features/plugins
          - title: Trust the skill scanner's verdict
            body:
              - Hub and URL installs are quarantined, scanned and recorded with a content hash in skills/.hub/lock.json;
                --force cannot override a dangerous verdict, and hermes skills audit re-scans installed hub
                skills.
            url: https://hermes-agent.nousresearch.com/docs/user-guide/features/skills
          - title: Install MCP servers from the reviewed catalog
            body:
              - Prefer hermes mcp install <name> from the Nous-approved catalog, whose manifests link the upstream repo
                and arrive disabled by default, over hand-written mcp_servers entries.
            url: https://hermes-agent.nousresearch.com/docs/user-guide/features/mcp
        note: >-
          Tool definitions served by an MCP server are not hash-pinned or re-verified between sessions, and
          unpinned npx -y servers are outside the OSV scan; cataloged means reviewed, not audited. Rated
          partial rather than native because MCP servers themselves have no allowlist in the product's config;
          plugins are opt-in and pinnable, but any MCP server the user configures is admitted.
        verified: 2026-09-10
