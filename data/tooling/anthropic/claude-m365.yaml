      - mitigation: cap-data-access-governance
        coverage: partial
        mechanism: >-
          Retrieval runs as the user: Office.js reads only the open file or the open mail item, and Outlook's
          Graph calls use the user's own delegated token; access_policies addin.access statements keyed on
          sensitivity label or file path restrict which open documents the add-in will run on (manifest or
          bootstrap); no admin scoping of mailboxes, folders or connector corpora
        steps:
          - title: Restrict the add-in to approved documents
            body:
              - >-
                Add an access_policies allow statement for addin.access listing your General and Public label
                GUIDs (default-deny for everything else), or deny statements for restricted labels and
                file_path prefixes such as a restricted share.
            url: https://github.com/anthropics/financial-services/blob/main/claude-for-msft-365-install/commands/access-policies.md
          - title: Own the Graph application
            body:
              - >-
                Register a single-tenant app with the delegated Graph permissions and set graph_client_id, so
                approval and Conditional Access for mailbox access sit under your own application.
            url: https://claude.com/docs/office-agents/outlook
        note: >-
          Partial by the rule: identity-scoped retrieval holds — the open document is one the user already
          opened, and Graph delegated access is bounded by both the consented scopes and the user's own mailbox
          and calendar permissions, so whatever the user can already reach, oversharing included, is
          reachable. The admin restriction covers only the open document (label or path), is documented for
          manifest and bootstrap delivery, and does not scope mailbox search, thread retrieval or connectors.
          Oversharing analysis of SharePoint, OneDrive and Exchange is the DSPM product's.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityDataAccessGovernance
          reviewRequired: false
          original:
            - capability: capabilityDataAccessGovernance
              coverage: partial
              mechanism: >-
                The add-in reads only the currently open file or the open email; Outlook access is bounded by
                the Graph consent granted by the admin
              steps:
