          - title: Secure MCP Tunnel guide
            url: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels
        note: >-
          The tunnel has no model and relays JSON-RPC responses and stream events unchanged, so it has no
          surface for injection screening. The vendor's returned-content defenses are toolChatgptDesktop's
          (zone 2), and classifying records before they return to the vendor's cloud is the organisation's AI
          gateway's, which the drawing places behind the tunnel.
        verified: "2026-09-25"
