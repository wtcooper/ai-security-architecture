    # The security-relevant settings, each with the baseline value (data/tooling/BASELINE.md). The deployer is the
    # admin: most rows are a constructor argument, a decorator or an environment variable set in the application's
    # own code or image; rows with requires: CrewAI AMP are set in AMP's console or Platform API. Verified 2026-11-21.
    settings:
      - id: llmBaseUrlGateway
        name: LLM base_url and api_key
        where: crewai › LLM(model=..., base_url=..., api_key=...), or OPENAI_BASE_URL and the provider key variables in the environment
        setVia: [code, configFile]
        area: network
        default: Direct to the provider, with the provider key in the process environment
        recommended: base_url set to the firm's AI gateway, which holds the provider keys; the process holds only a gateway credential injected from the secret manager
        value: "The firm's AI gateway, gateway credential only"
        why: No provider key sits in the crew's environment for an injected tool call to read, and every model call leaves through the gateway's allowlist, budgets and audit.
        mitigations: [D3-CH, cap-agent-egress-control]
        url: https://docs.crewai.com/v1.15.44/en/concepts/llms
        verified: "2026-11-21"
      - id: ampWorkloadIdentitySecrets
        name: Secrets Manager (Workload Identity)
        where: CrewAI AMP › Settings › Workload Identity and Secret Provider Credentials, then Environment Variables › Value Source, assigned per automation
        setVia: [adminConsole, cloudPolicy]
        area: identity
        default: Plaintext environment variables (Direct Value)
        recommended: AWS Secrets Manager, Google Cloud Secret Manager or Azure Key Vault through Workload Identity, each secret referenced by name and assigned only to the automations that need it
        value: "Workload Identity, assigned per automation"
        why: No plaintext key is stored in AMP or baked into the image, and a rotated secret reaches the next kickoff; each Workload Identity configuration still serves the whole organisation.
        mitigations: [D3-CH, D3-CTS]
        requires: "CrewAI AMP; runtime 1.14.5 or later; labelled Beta"
        url: https://docs-platform.crewai.com/platform/en/features/secrets-manager/overview
        verified: "2026-11-21"
      - id: ampRbacGrants
        name: Role-Based Access Control (RBAC) grants, Teams and Service Accounts
        where: CrewAI AMP › Settings › Teams, Members and Service Accounts, or Share on a resource; JIT SSO group-to-Team mappings
        setVia: [adminConsole, identityProvider]
        area: identity
        default: New members have no access; a creator becomes Admin on what they create
        recommended: Automation Operator per automation to teams mapped from IdP groups, Automation Builders and Identity and Access Admin to a named few, and a service account for every API caller
        value: "Per-automation grants to IdP-mapped teams"
        why: Only the owning team can run an automation, read its traces and answer its approvals, and API callers are named principals; JIT SSO applies group removals only at the next sign-in.
        mitigations: [D3-APA, D3-AA]
        requires: "CrewAI AMP; JIT SSO needs an Enterprise SaaS SSO connection"
        url: https://docs-platform.crewai.com/platform/en/features/rbac
        verified: "2026-11-21"
      - id: ampUserBearerToken
        name: User Bearer Token (Scoped Deployments)
        where: CrewAI AMP › the deployment's Status tab, used on the kickoff request in place of the organisation-level Bearer Token
        setVia: [adminConsole, apiCli]
        area: identity
        default: The deployment's organisation-level Bearer Token
        recommended: Kick off with the requesting user's User Bearer Token so connected apps act as that user; keep the organisation-level token for service use only
        value: "The requesting user's token"
        why: Connected apps such as Gmail, Drive and Salesforce are read and written with the requester's own account, not one shared connection that reaches every user's data.
        mitigations: [cap-data-access-governance, D3-CTS]
        requires: CrewAI AMP
        url: https://docs-platform.crewai.com/platform/en/features/tools-and-integrations
        verified: "2026-11-21"
      - id: agentTaskTools
        name: tools (Agent, Task) and allow_delegation
        where: crewai › Agent(tools=[...], allow_delegation=...) and Task(tools=[...]), or the same fields in agents/<name>.jsonc and crew.jsonc
        setVia: [code, configFile]
        area: tools
        default: "tools []; allow_delegation False (the AMP FAQ says True)"
        recommended: An explicit tool list on every agent, Task tools narrowing it per task, and allow_delegation set False explicitly on every specialist, True only on the manager
        value: "Explicit lists; delegation only on the manager"
        why: A specialist hijacked by injected text holds only its own tools and cannot hand work to a coworker that has tools it lacks.
        mitigations: [AML.M0028, cap-agent-tool-registry, AML.M0037]
        url: https://docs.crewai.com/v1.15.44/en/concepts/agents
        verified: "2026-11-21"
      - id: preToolCallPolicyHook
        name: "@on(InterceptionPoint.PRE_TOOL_CALL) with HookAborted"
        where: crewai.hooks › on(InterceptionPoint.PRE_TOOL_CALL, tools=[...], agents=[...]), or crew-scoped on a @CrewBase method
        setVia: [code]
        area: tools
        default: No hooks
        recommended: A global hook on every tool that writes, sends or pays that checks the agent role, the tool and its arguments and raises HookAborted on a deny, with no other exception types raised
        value: "Policy hook on every consequential tool"
        why: A call the policy forbids is refused before it runs, in every crew and flow; any exception other than HookAborted is swallowed and the call goes ahead.
        mitigations: [cap-agent-action-policy-enforcement, AML.M0029]
        url: https://docs.crewai.com/v1.15.44/en/learn/tool-hooks
        verified: "2026-11-21"
      - id: executionStopHook
        name: "@on(InterceptionPoint.EXECUTION_START, PRE_STEP, PRE_MODEL_CALL) with HookAborted"
        where: crewai.hooks › on(InterceptionPoint.EXECUTION_START), on(InterceptionPoint.PRE_STEP) and on(InterceptionPoint.PRE_MODEL_CALL)
        setVia: [code]
        area: tools
        default: No hooks
        recommended: An EXECUTION_START hook that aborts a run whose inputs carry no authorised principal, and PRE_STEP and PRE_MODEL_CALL hooks that abort when the operator's stop flag for that crew is set
        value: "Caller check at start; stop flag per step"
        why: Unauthorised kickoffs never begin, and a misbehaving run stops at its next step or model call instead of finishing its plan; a tool already running is not interrupted.
        mitigations: [D3-APA, cap-agent-kill-switch]
        url: https://docs.crewai.com/v1.15.44/en/learn/execution-hooks
        verified: "2026-11-21"
      - id: humanFeedbackGate
        name: "@human_feedback (emit, default_outcome, provider)"
        where: crewai.flow.human_feedback › @human_feedback(message=..., emit=[...], default_outcome=..., provider=...) on the Flow method that proposes the action
        setVia: [code]
        area: tools
        default: Blocks for console input; no default outcome
        recommended: Approve and reject outcomes in emit, default_outcome set to the reject outcome, an async HumanFeedbackProvider that notifies the approver, and the action only in the @listen for the approve outcome
        value: "Reject by default; act only on approval"
        why: The flow pauses with its state persisted until a person decides, and the action never runs without that decision; with emit, a free-text reply is mapped to an outcome by an LLM.
        mitigations: [AML.M0029]
        url: https://docs.crewai.com/v1.15.44/en/learn/human-feedback-in-flows
        verified: "2026-11-21"
      - id: ampHitlConfig
        name: Human in the Loop Configuration (Auto-Response, Routing Rules)
        where: CrewAI AMP › Deployment › Settings › Human in the Loop Configuration
        setVia: [adminConsole]
        area: tools
        default: Email notifications enabled; requests no rule matches go to the deployment creator
        recommended: Auto-Response off for any review that gates an action, and routing rules with a fixed assign_to_email per method pattern rather than assign_from_input taken from flow state
        value: "Auto-response off; fixed reviewer per method"
        why: No approval is granted by a timeout, and a model-written field in flow state cannot choose who approves the action.
        mitigations: [AML.M0029, D3-APA]
        requires: "CrewAI AMP (Enterprise); crewai 1.8.0 or later"
        url: https://docs-platform.crewai.com/platform/en/features/flow-hitl-management
        verified: "2026-11-21"
      - id: mcpStaticToolFilter
        name: tool_filter (create_static_tool_filter)
        where: crewai.mcp › MCPServerStdio / MCPServerHTTP / MCPServerSSE(tool_filter=create_static_tool_filter(allowed_tool_names=[...])); "#tool" on a string reference
        setVia: [code]
        area: tools
        default: None (every tool the server lists)
        recommended: The approved tool names for each server in a structured config; string references only with a #tool selector
        value: "Approved tool names per server"
        why: Tools a server adds or renames later are never offered to the agent; a dynamic filter is the place to compare a definition hash.
        mitigations: [cap-mcp-tool-integrity, AML.M0028, cap-agent-tool-registry, AML.M0037]
        url: https://docs.crewai.com/v1.15.44/en/mcp/overview
        verified: "2026-11-21"
      - id: mcpCredentials
        name: headers (MCPServerHTTP, MCPServerSSE) and env (MCPServerStdio)
        where: crewai.mcp › MCPServerHTTP(url=..., headers={...}); MCPServerStdio(command=..., env={...})
        setVia: [code]
        area: identity
        default: No headers; the env the code passes
        recommended: Each server's token in its own Authorization header from the secret manager, never in a URL query string, and an explicit env for stdio servers with only the variables they need, not **os.environ
        value: "Header token per server; minimal stdio env"
        why: A server's credential goes only to that server and never into logged URLs, and a local server cannot read every key the crew process holds.
        mitigations: [D3-CH, D3-CTS]
        url: https://docs.crewai.com/v1.15.44/en/mcp/overview
        verified: "2026-11-21"
      - id: crewaiToolsSafePaths
        name: CREWAI_TOOLS_FORCE_SAFE_PATHS, CREWAI_TOOLS_ALLOWED_PRIVATE_HOSTS and base_dir
        where: Environment of the worker; FileReadTool(base_dir=...) and FileWriterTool(base_dir=...)
        setVia: [configFile, code]
        area: network
        default: "Guard on, but CREWAI_TOOLS_ALLOW_UNSAFE_PATHS can switch it off; base_dir is the working directory"
        recommended: CREWAI_TOOLS_FORCE_SAFE_PATHS=true on every managed worker, CREWAI_TOOLS_ALLOW_UNSAFE_PATHS and CREWAI_TOOLS_ALLOWED_PRIVATE_HOSTS never set there, and base_dir on each file tool at the one tree it needs
        value: "Lock true; no private hosts; base_dir per tool"
        why: URL tools cannot be steered to cloud metadata or internal services, file tools stay inside their tree, and an exported variable cannot switch either guard off.
        mitigations: [cap-agent-egress-control, AML.M0028, cap-data-access-governance]
        url: https://docs.crewai.com/v1.15.44/en/tools/file-document/urlreadtool
        verified: "2026-11-21"
      - id: remoteSandboxTools
        name: E2B and Daytona sandbox tools (persistent)
        where: crewai_tools › E2BExecTool / E2BPythonTool / E2BFileTool(persistent=..., sandbox_timeout=...) or DaytonaExecTool(persistent=...)
        setVia: [code]
        area: tools
        default: "persistent False (a new sandbox for every call)"
        recommended: These tools for any code or shell an agent writes, persistent False unless a task needs state, no attach mode for untrusted work, and allow_code_execution left unset
        value: "Ephemeral remote sandbox for agent code"
        why: Code an agent writes runs in a disposable VM rather than the crew's process with its keys; the in-process Code Interpreter was removed after sandbox escapes.
        mitigations: [D3-EI]
        url: https://docs.crewai.com/v1.15.44/en/tools/ai-ml/e2bsandboxtools
        verified: "2026-11-21"
      - id: maxIterTimeRpm
        name: max_iter, max_execution_time and max_rpm
        where: crewai › Agent(max_iter=..., max_execution_time=..., max_rpm=...); Crew(max_rpm=...) overrides the agents'
        setVia: [code, configFile]
        area: tools
        default: "max_iter 20 on the Agents page (25 in the 1.15.44 source); max_execution_time and max_rpm unset"
        recommended: max_iter sized to each agent's task, a max_execution_time in seconds on every agent, and a crew-level max_rpm below the provider quota allotted to the workload
        value: "Per-agent cap and time limit; crew RPM cap"
        why: A looping or hijacked agent must give its best answer and cannot burst requests past its share of quota; no token or cost ceiling stops a run.
        mitigations: [AML.M0036, AML.M0004, cap-agent-kill-switch]
        url: https://docs.crewai.com/v1.15.44/en/concepts/agents
        verified: "2026-11-21"
      - id: taskGuardrails
        name: guardrail / guardrails with output_pydantic
        where: crewai › Task(guardrail=..., guardrails=[...], guardrail_max_retries=..., output_pydantic=...); HallucinationGuardrail as the guardrail on AMP
        setVia: [code]
        area: tools
        default: "No guardrail; guardrail_max_retries 3"
        recommended: A function guardrail and an output_pydantic model on every task whose output another agent or system consumes, and HallucinationGuardrail with reference context where answers must be grounded
        value: "Function check and schema on every hand-off"
        why: A subagent's output that breaks the schema or the check goes back for retry instead of becoming the next agent's context; string guardrails are judged by the agent's own LLM.
        mitigations: [cap-input-guardrails, cap-retrieval-grounding-checks]
        requires: "HallucinationGuardrail: CrewAI AMP"
        url: https://docs.crewai.com/v1.15.44/en/concepts/tasks
        verified: "2026-11-21"
      - id: contentHooks
        name: "@on(InterceptionPoint.POST_TOOL_CALL) and PRE_MODEL_CALL"
        where: crewai.hooks › on(InterceptionPoint.POST_TOOL_CALL, tools=[...]) returning a replacement string; on(InterceptionPoint.PRE_MODEL_CALL) over ctx.messages
        setVia: [code]
        area: data
        default: No hooks
        recommended: Your injection classifier and PII and secret detector on every tool that returns external content, replacing flagged results before an agent reads them
        value: "Injection and PII checks on external content"
        why: Injected instructions and sensitive spans in a page, file, MCP or A2A result are removed before an agent reasons over them or memory stores them.
        mitigations: [cap-input-guardrails, cap-sensitive-data-redaction]
        url: https://docs.crewai.com/v1.15.44/en/learn/tool-hooks
        verified: "2026-11-21"
      - id: memoryScopes
        name: Memory scope, slice (read_only) and private
        where: crewai › Memory().scope("/..."), memory.slice(scopes=[...], read_only=True), remember(..., source=..., private=True); Memory(storage=...) or CREWAI_STORAGE_DIR
        setVia: [code, configFile]
        area: data
        default: One shared crew memory under ./.crewai/memory, with the scope inferred by the LLM
        recommended: A storage location per tenant, an explicit scope per agent, read-only slices for agents that only recall, and each user's records saved with source set to that user and private True
        value: "Per-tenant store; scoped, read-only where possible"
        why: One agent's or user's notes are not recalled into another's task prompt, and an agent that only needs to recall cannot write poisoned facts.
        mitigations: [AML.M0031, cap-data-access-governance]
        url: https://docs.crewai.com/v1.15.44/en/concepts/memory
        verified: "2026-11-21"
      - id: flowPersistence
        name: "@persist (FlowPersistence) and restore_from_state_id"
        where: crewai.flow.persistence › @persist with a FlowPersistence backend; Flow.kickoff(restore_from_state_id=...) and Flow.from_pending(flow_id)
        setVia: [code]
        area: data
        default: SQLiteFlowPersistence in a local database
        recommended: A persistence backend per tenant on storage the firm encrypts, and the caller's ownership of a state or flow ID checked before any fork, resume or restore
        value: "Per-tenant backend; ownership checked on resume"
        why: A caller who knows another run's state or flow ID cannot fork or resume it; an unmatched restore_from_state_id falls back silently, so check it exists.
        mitigations: [AML.M0031, D3-APA, AML.M0012]
        url: https://docs.crewai.com/v1.15.44/en/concepts/flows
        verified: "2026-11-21"
      - id: stateFileLoading
        name: CREWAI_DESERIALIZE_CALLBACKS and CREWAI_TRAINED_AGENTS_FILE
        where: Environment of the worker; CheckpointConfig(location=..., max_checkpoints=...); Crew(trained_agents_file=...)
        setVia: [configFile, code]
        area: data
        default: "Callbacks not imported on restore; trained suggestions loaded from trained_agents_data.pkl in the working directory"
        recommended: CREWAI_DESERIALIZE_CALLBACKS unset, checkpoints in a location only the workload writes with max_checkpoints set, and the trained-agents file pinned to a reviewed path or absent
        value: "Unset; a reviewed trained file or none"
        why: A tampered checkpoint cannot import code on restore, and a planted .pkl in the working directory cannot add mandatory instructions to every task prompt.
        mitigations: [AML.M0031]
        url: https://docs.crewai.com/v1.15.44/en/concepts/checkpointing
        verified: "2026-11-21"
      - id: knowledgeScope
        name: knowledge_sources and KnowledgeConfig
        where: crewai › Agent(knowledge_sources=[...]) or Crew(knowledge_sources=[...]); KnowledgeConfig(results_limit=..., score_threshold=...)
        setVia: [code]
        area: data
        default: "results_limit 3; score_threshold 0.35"
        recommended: Knowledge on the agent that needs it rather than the crew, from curated files only, with score_threshold raised to drop weak matches
        value: "Agent-level, curated, higher threshold"
        why: Each agent retrieves only from its own collection, and weakly related chunks that someone seeded are less likely to reach the prompt.
        mitigations: [cap-retrieval-grounding-checks, cap-data-access-governance]
        url: https://docs.crewai.com/v1.15.44/en/concepts/knowledge
        verified: "2026-11-21"
      - id: skillVersionPin
        name: skills (registry reference with @version)
        where: crewai › Agent(skills=["@<org-uuid>/<name>@<version>"]); crewai skill install and crewai skill search
        setVia: [code, apiCli]
        area: tools
        default: An unpinned reference resolves to the newest published version
        recommended: Skills installed only from the organisation's registry with scan status passed, every reference pinned to a version, and project-local skills reviewed like code
        value: "Organisation registry only, pinned @version"
        why: A newly published or unscanned skill version cannot change what every agent is told without a reviewed pin change; local ./skills folders are not scanned.
        mitigations: [D3-FA, cap-staged-rollout-gate, cap-agent-tool-registry]
        requires: CrewAI AMP organisation (skills registry)
        url: https://docs.crewai.com/v1.15.44/en/concepts/skills
        verified: "2026-11-21"
      - id: crewaiTest
        name: crewai test (--n-iterations, --model)
        where: CLI › crewai test -n <iterations> -m <model>, run in the release pipeline
        setVia: [apiCli]
        area: tools
        default: "3 iterations with the documented default model"
        recommended: A CI step that runs the candidate crew for several iterations, scored by a fixed --model judge (an OpenAI model per the Testing page), and fails the release below the agreed crew score
        value: "Release blocked below the agreed score"
        why: A model, prompt or tool change that degrades the crew is caught before it ships; the scores measure quality, so security cases are the firm's to add.
        mitigations: [cap-staged-rollout-gate]
        url: https://docs.crewai.com/v1.15.44/en/concepts/testing
        verified: "2026-11-21"
      - id: telemetrySession
        name: telemetry_session (providers, processors)
        where: crewai.telemetry.tracing › telemetry_session(providers=..., processors=..., log_emitter=...) around each execution
        setVia: [code]
        area: audit
        default: Not used; built-in tracing stays off until consent or an authenticated export to AMP
        recommended: Every execution wrapped with the firm's OpenTelemetry provider and processors exporting to its collector, with redaction done in the processor
        value: "The firm's OpenTelemetry provider"
        why: Every crew and flow step, model call, tool call and approval pause lands in the firm's SIEM with parent links intact; the host owns redaction.
        mitigations: [cap-agent-tracing]
        url: https://docs.crewai.com/v1.15.44/en/observability/tracing
        verified: "2026-11-21"
      - id: ampOtelCollectors
        name: OpenTelemetry Collectors
        where: CrewAI AMP › Settings › OpenTelemetry Collectors › Add Collector (OpenTelemetry Traces, OpenTelemetry Logs)
        setVia: [adminConsole]
        area: audit
        default: None (traces kept in AMP only)
        recommended: One traces and one logs collector pointing at the firm's OTLP endpoint with an authentication header, and the service name set per automation
        value: "Traces and logs to the firm's collector"
        why: Deployed and Studio runs reach the SIEM with crewai.principal.id and enduser.id, so each action traces to who started it under the firm's retention.
        mitigations: [cap-agent-tracing]
        requires: CrewAI AMP
        url: https://docs-platform.crewai.com/platform/en/guides/capture_telemetry_logs
        verified: "2026-11-21"
      - id: vendorDataSharing
        name: share_crew, CREWAI_TRACING_ENABLED and CREWAI_DISABLE_TELEMETRY
        where: crewai › Crew(share_crew=..., tracing=...) and Flow(tracing=...); environment variables of the worker
        setVia: [code, configFile]
        area: data
        default: "share_crew off; AMP tracing off until consent; anonymous telemetry on"
        recommended: share_crew False, tracing False or CREWAI_TRACING_ENABLED=false outside the firm's own AMP organisation, and CREWAI_DISABLE_TELEMETRY=true
        value: "All off outside the firm's AMP organisation"
        why: Task content, inputs, outputs and prompt-bearing traces do not reach CrewAI's own store or model training; anonymous telemetry otherwise carries agent roles and tool names.
        mitigations: [cap-sensitive-data-redaction]
        url: https://docs.crewai.com/v1.15.44/en/telemetry
        verified: "2026-11-21"
      - id: ampAcpPolicies
        name: Agent Control Plane Policies (PII Redaction, Cost Limit)
        where: CrewAI AMP › Agent Control Plane › Policies › Create new, or Deployment › Settings › PII Protection and Cost Alerts
        setVia: [adminConsole]
        area: data
        default: No policies; PII Redaction for Traces off on each deployment
        recommended: An organisation-wide PII Redaction policy masking the firm's entity list and custom recognizers, and a Cost Limit policy per automation with a monthly threshold alerting the owning team
        value: "Org-wide PII masking; monthly cost alert"
        why: Client personal data is masked in traces before AMP stores them and overspend is noticed; neither changes what the model sees, and a cost limit never stops a run.
        mitigations: [cap-sensitive-data-redaction, AML.M0036]
        requires: "CrewAI AMP; PII Redaction needs the Enterprise or Ultra plan; Agent Control Plane is Beta"
        url: https://docs-platform.crewai.com/platform/en/features/agent-control-plane/policies
        verified: "2026-11-21"
      - id: a2aServerAuth
        name: A2AServerConfig auth
        where: crewai.a2a › A2AServerConfig(auth=...); AUTH_TOKEN for the default SimpleTokenAuth
        setVia: [code, configFile]
        area: identity
        default: SimpleTokenAuth with the static AUTH_TOKEN environment variable
        recommended: On AMP, OIDCAuth against the firm's IdP or MTLSServerAuth; outside AMP, a long random AUTH_TOKEN from the secret manager behind the firm's gateway; nothing sensitive in the public agent card
        value: "OIDC or mTLS, not the static default"
        why: Only authenticated peers can hand tasks to the crew, and the publicly readable agent card does not advertise internal names or skills.
        mitigations: [D3-AA, D3-APA]
        requires: "OIDCAuth, OAuth2ServerAuth and MTLSServerAuth: CrewAI AMP (A2A server agents in early release)"
        url: https://docs-platform.crewai.com/platform/en/features/a2a
        verified: "2026-11-21"
      - id: a2aClientConfig
        name: A2AClientConfig (auth, timeout, max_turns)
        where: crewai.a2a › Agent(a2a=A2AClientConfig(endpoint=..., auth=..., timeout=..., max_turns=...))
        setVia: [code]
        area: identity
        default: "auth None; timeout 120; max_turns 10"
        recommended: OAuth2ClientCredentials with the narrowest scopes for each peer endpoint, a timeout and max_turns sized to the task, and trust_remote_completion_status left False
        value: "Scoped OAuth2 per peer; tight turns and timeout"
        why: Each peer receives only its own scoped credential, and a stalling or chatty peer cannot hold the agent in a long exchange.
        mitigations: [D3-CTS, D3-AA, AML.M0036]
        url: https://docs.crewai.com/v1.15.44/en/learn/a2a-agent-delegation
        verified: "2026-11-21"
