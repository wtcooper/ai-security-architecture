id: archAgenticBrowser
surface: surfaceEndpoint
rank: 5
title: Browser AI agents & extensions
abbrev: Browser AI

summary:
  - >
    AI operating inside the user's web browser, in two shapes that share one drawing: a browser
    with the agent built in, whose side panel reads the open tabs and navigates, clicks and types
    for the user; and an extension from a model vendor that connects an assistant to the browser
    the user already runs. Either way the agent works inside sessions that are already signed
    in — every rendered page is untrusted input, and the profile's cookie jar is the credential.

description:
  - >
    Every other endpoint archetype keeps some separation between the content it reads and the
    authority it holds. Here there is none. The agent acts inside a profile that is already
    authenticated to the user's mail, calendar, workspace, bank and internal applications, and
    the instruction it follows arrives as text on a page served by whoever owns that page. The
    same-origin policy is the boundary the web is built on, and this archetype's job is to cross
    it: an agent that reads one origin and acts on another has done exactly what two decades of
    browser security exist to prevent, with the user's cookies attached. From the application's
    side the click is the user's — no grant was ever issued to an agent, so nothing downstream
    can tell them apart.
  - >
    The two product shapes differ in packaging, not architecture. A built-in agent ships inside
    a browser the vendor controls end to end; an extension arrives from a public store into a
    browser somebody else builds, with host permissions on every site and an automatic update
    channel nobody enrolled. Both are the same harness: a loop, a context assembled from the
    page, and a tool surface that is the browser's own APIs — navigate, read the DOM and the
    screenshot, click, type. The extension is the broader exposure in practice, because it sees
    the pages the user would never point an agent at, and its store is a supply chain with a
    one-click admission decision.
  - >
    The controls that work constrain what the session can reach rather than what the model may
    say. A dedicated, managed browser profile with a narrow set of signed-in origins and no saved
    passwords converts an unbounded blast radius into a bounded one — the vendors' own safety
    pages now recommend exactly this, and it is a configuration choice rather than a product
    feature. Site-level permissions — act, read only, no access — enforced from the vendor's
    admin console and the browser's policy tier decide where the agent may act before any page
    is read; confirmation before consequential actions is what remains for the pages the
    allowlist admits. On the network, the browser is the one agent client whose traffic the
    organisation can actually see: it trusts the enterprise root, so the secure service edge
    inspects what leaves for the vendor and classifies what comes back from the web — the
    inspection point the coding agents' pinned sessions deny us.
  - >
    What the vendor supplies is a managed-settings tier — an organisation toggle, site allow and
    block lists that override user permissions, an audit export — and, inside the product,
    injection classifiers and action screening that are assured rather than drawn. What the
    organisation supplies is everything else: the managed profile, browser policy over which
    extensions may install at all, the edge that sees the traffic, and in-browser telemetry of
    what the agent read and clicked, which is the only vantage point that sees either.

distinguishedBy:
  - >
    Against the coding and desktop agents: those read a repository the developer chose and act
    on a filesystem, with a working directory to scope them to. This one reads pages an attacker
    can serve and acts through credentials the user already holds, and the nearest thing to a
    scope is the profile's list of signed-in origins.
  - >
    Against computer use on a desktop agent: that tool drives the whole machine through the GUI
    and its blast radius is the OS session. This one lives inside the browser, speaks its APIs —
    DOM, tabs, navigation — and its blast radius is the set of websites the profile is signed in
    to. Overlapping products exist; the authority, the permission model and the store's update
    channel are different problems.
  - >
    Against enterprise AI chat: the same vendor's chat client in a tab reads what the user pastes
    or uploads. This archetype reads every tab the user opens and clicks on their behalf — the
    chat surface with the browser's authority behind it.

exemplars:
  - name: Perplexity Comet
    note: >
      A browser with the assistant built in, acting inside the user's signed-in sessions. Its
      enterprise tier lets an organisation admin set per-domain permissions — browser control,
      read only, or no access — and disable the assistant for the organisation. Help-centre
      pages block automated fetch; verified through the search index of the vendor's own
      help centre.
    url: https://www.perplexity.ai/help-center/en/articles/13531023-managing-comet-assistant-permissions
    asOf: "2026-09"
  - name: Dia
    note: >
      A browser whose assistant answers from the full context of the user's tabs and connected
      tools — workspace suites and chat platforms — and builds documents from them; the
      "everything the user is signed into is context" shape.
    url: https://www.diabrowser.com/
    asOf: "2026-09"
  - name: Microsoft Edge Copilot Mode
    note: >
      The assistant panel of a mainstream browser, shipped to a very large installed base: it
      reads across open tabs, completes forms and bookings with approval before finalising, and
      is governed for work accounts through the browser's own enterprise policy set — page-context
      access, sidebar availability and the Copilot toggle itself.
    url: https://explore.microsoft.com/en-us/edge/copilot-mode
    asOf: "2026-09"
  - name: ChatGPT built-in browser
    note: >
      The successor to the retired Atlas browser: a browser inside the vendor's desktop app that
      works across tabs, waits while the user signs in, and continues tasks while the user
      reviews. The help centre blocks automated fetch; verified through the search index of the
      vendor's own help centre.
    url: https://help.openai.com/en/articles/20001371-evolving-atlas-into-chatgpt-for-browser-based-agentic-work
    asOf: "2026-09"
  - name: Assistant extensions from model vendors
    note: >
      Extensions that connect a general assistant to the browser the user already runs — Claude
      in Chrome and Gemini in Chrome are the widely deployed shape. Claude's own safety page names
      prompt injection as the primary risk, blocks site categories by default, always confirms
      or refuses a listed set of actions, and recommends a separate profile without access to
      sensitive accounts; its admin console holds the organisation toggle and site lists.
    url: https://support.claude.com/en/articles/12902428-use-claude-in-chrome-safely
    asOf: "2026-09"

zones:
  - id: zoneUser
    owner: user
    note: The person at the keyboard, stating goals and answering confirmations in the side panel.
  - id: zoneEndpoint
    owner: endpoint
    note: >
      The managed device, running the browser: the profile whose sessions the agent acts with,
      the agent itself, and the memory it keeps between sessions. Ours to manage, theirs to
      build — and, uniquely on this surface, ours to see, because the browser trusts our root.
  - id: zoneCloud
    owner: cloud
    note: >
      Infrastructure we operate — the secure service edge every browser session leaves through,
      which is where the organisation inspects, allowlists and records.
  - id: zoneVendor
    owner: vendor
    note: >
      The vendor's own environment under an enterprise agreement: their backend, their admin
      console, and the model provider behind them. Configured through what they publish;
      everything inside is assured, not drawn.
  - id: zoneExternal
    owner: external
    note: >
      Outside the company with no agreement — the signed-in web applications the session
      reaches, the open web the agent reads, and the stores the extension updates from.
  - id: zoneGovernance
    owner: governance
    note: >
      Drawn across every band because it governs every band — including which origins the
      profile may hold sessions to, and which pages the agent may be pointed at.

blocks:
  - id: user
    kind: actor
    title: User
    icon: person
    zone: zoneUser
    col: 0
    row: 1
    note: >
      Sets the goal and answers confirmations, and is usually not reading the pages the agent
      reads on the way to the outcome — which is why the confirmation prompt is the last human
      decision on most of these walks.

  - id: profile
    kind: boundary
    title: Browser profile
    zone: zoneEndpoint
    col: 1
    row: 1
    note: >
      The container the agent runs inside: a profile is a self-contained browser instance with
      its own tabs, its own extensions and its own cookie jar, and everything drawn inside acts
      with the sessions it holds. The frame is the scope decision — the highest-value control in
      the archetype: a dedicated, managed profile signed into the few origins the agent needs and
      holding no saved passwords, which the vendors' own safety guidance now recommends. The
      common state is the user's everyday profile, signed into everything.

  - id: harness
    kind: service
    title: Agent harness
    cosaiComponent: componentReasoningCore
    zone: zoneEndpoint
    parent: profile
    col: 0
    row: 1
    note: >
      The built-in agent or the vendor's extension — the same loop either way: reads the
      extracted page, decides the next navigation or click, and repeats. Once page text is in
      context it is indistinguishable from the user's goal. Inference goes to the vendor's own
      service on the signed-in account, through the browser's network stack — which is what
      lets our edge see it.
    items:
      - id: loop
        label: Agent loop
        icon: agent
        note: Plans the next action from the goal and everything the browser has shown it.
      - id: context
        label: Context assembly
        icon: doc
        note: Merges the goal, the memories and the extracted pages into one prompt.
      - id: extraction
        label: Page extraction
        icon: doc
        note: >
          Turns a rendered page into context — the only point where hidden and off-screen
          content can be stripped before it becomes instruction, and where the vendor's
          injection classifiers run.

  - id: toolPlane
    kind: service
    title: Native tools
    cosaiComponent: componentTools
    zone: zoneEndpoint
    parent: harness
    col: 0
    row: 0
    note: >
      The browser's own APIs offered to the loop as tools, nested because the loop calling them
      is not a hop. Their authority is the profile's cookie jar; from the browser's perspective
      the agent's click is the user's. What they reach is drawn: the tabs, and the memory the
      agent keeps.
    items:
      - id: browserTools
        label: Browser tools
        icon: globe
        note: >
          Navigate, read the DOM and the screenshot, click and type — the per-site permission
          (act, read only, no access) is enforced here, before any request leaves.

  - id: browser
    kind: service
    title: Browser
    cosaiComponent: componentAgentUserQuery
    zone: zoneEndpoint
    parent: profile
    col: 1
    row: 0
    note: >
      The tabs the agent reads and drives, the extension host that loads the code doing the
      reading, and the profile's cookie jar. Every page rendered here — visible text, hidden text, alt attributes, comments —
      becomes model input with the same standing as the user's goal. The user signs into the
      profile's origins here, which is how the sessions the agent inherits came to exist.
    items:
      - id: tabs
        label: Tabs & rendered pages
        icon: globe
        note: Pages fetched with the profile's cookies, rendered, and handed to page extraction.
      - id: extensionHost
        label: Extension host
        icon: plug
        note: >
          Where the extension variant lives: host permissions on every site, and an automatic
          update channel from the store into the code that reads every page. Which extensions
          may install at all is browser policy, enforced here.
      - id: cookies
        label: Session cookies
        icon: key
        note: >
          Standing authentication to every signed-in origin in the profile, attached to every
          request the agent causes — the credential on this drawing.
      - id: savedLogins
        label: Saved passwords & autofill
        icon: key
        note: >
          Credentials the browser will type into a form the agent navigated to — absent from
          the dedicated profile in the target state.

  - id: memory
    kind: service
    title: Memory & state
    cosaiComponent: componentDataStorage
    zone: zoneEndpoint
    col: 1
    row: 2
    note: >
      What the agent keeps between sessions and reads back as context: the conversation, and the
      browser memories several products build from the pages the user visited. Outside the
      profile because it outlives the session — and, for most products, synced to the vendor's
      side as well.
    items:
      - id: conversation
        label: Conversation state
        icon: folder
        note: Side-panel sessions saved to history and synced across the user's devices.
      - id: index
        label: Search index
        icon: search
        note: >
          Browser memories: pages visited, summarised and retrievable — a page the attacker
          served once, kept as context for every later task.

  - id: aiGateway
    kind: service
    title: AI gateway
    zone: zoneCloud
    col: 2
    row: 1
    note: >
      The organisation's secure service edge, which every session from the managed profile
      leaves through: the agent's inference calls to the vendor, and the browsing it causes.
      Because the browser trusts the enterprise root, this tier can inspect what leaves for the
      vendor and classify what comes back from the web — the one agent client on the endpoint
      surface where that is true. Its item is the traffic class it carries; the checks it runs
      — inspection, allowlisting, the record — are the numbered pins on this block and its
      edges. It brokers no model or MCP traffic here: the vendor's agent calls its own model.
    items:
      - id: swg
        label: Secure web gateway
        icon: globe
        note: The forward-proxy tier for the browser's sessions — inspected where policy allows, allowlisted where it does not.

  - id: vendorService
    kind: provider
    title: Vendor service
    zone: zoneVendor
    col: 3
    row: 1
    note: >
      The vendor's backend and the published surfaces of its control plane. What is listed is
      only what the organisation can configure or receive; the injection classifiers and action
      screening the vendor runs inside are assured, not drawn.
    items:
      - id: managedSettings
        label: Managed settings
        icon: gear
        note: >
          The organisation toggle, site allow and block lists that override user permissions,
          per-role enablement, and the policy that binds the extension to our tenant. Off, or
          on by default, depending on the plan — worth checking rather than assuming.
      - id: auditExport
        label: Session audit export
        icon: eye
        note: Exported sessions and actions — in an unmanaged install, no record at all.

  - id: provider
    kind: provider
    title: Model provider
    cosaiComponent: componentModelServing
    zone: zoneVendor
    col: 3
    row: 2
    note: >
      The inference API behind the vendor's service. For a vendor that is also the model
      provider this leg collapses into their own backend; otherwise it is a disclosed
      subprocessor under the same agreement.
    pack: modelProvider
    items:
      - id: inference
        label: Inference API
        icon: model
        note: Receives page content from authenticated sessions; the completion selects the next click.

  - id: openWeb
    kind: external
    title: Open web
    cosaiComponent: componentDataSources
    zone: zoneExternal
    col: 4
    row: 0
    note: >
      Every page is authored by someone else, and the agent reads all of them with the same
      standing. A hostile page needs no vulnerability — its text is already model input. The
      extension stores live here too: the update channel pulls from them directly, and nothing
      of ours admits what arrives.
    items:
      - id: pages
        label: Arbitrary pages
        icon: globe
        note: Visible and hidden text alike, served by whoever owns the page — and the form an exfiltration is typed into.
      - id: stores
        label: Skill & extension hubs
        icon: gear
        note: >
          The public extension stores: reviewed by the store, installed in one click, updated
          automatically.

  - id: downstream
    kind: external
    title: Downstream services
    cosaiComponent: componentDataSources
    zone: zoneExternal
    col: 4
    row: 3
    note: >
      The signed-in web applications the session reaches — mail, calendar, workspace, banking,
      and the organisation's own applications through their web front ends. The agent acts on
      these as the user, and the applications cannot tell the difference: no grant was ever
      issued to an agent.
    items:
      - id: saas
        label: SaaS
        icon: mail
        note: Mail, calendar, workspace and payment sites — readable and actionable as the user on every turn.
      - id: orgData
        label: Org data
        icon: db
        note: >
          Internal applications reached through the browser on the SSO session — org data via
          the web, with no connector, no gateway grant and no record of ours beyond the edge.

  - id: govIdentity
    kind: governance
    title: Identity services
    icon: person
    zone: zoneGovernance
    col: 0
    row: 4
    capabilities: [capabilityIga]
    note: >
      The IdP behind the vendor account, and the managed profile's binding to the workforce
      identity — the two logins that decide whether the enterprise agreement applies to this
      traffic at all.

  - id: govSecrets
    kind: governance
    title: Secrets & key management
    icon: key
    zone: zoneGovernance
    col: 1
    row: 4
    capabilities: [capabilityCredentialIsolation]
    note: >
      Keeping the user's standing sessions and saved credentials out of the agent's profile —
      the cookie jar is the secret on this drawing.

  - id: govPolicy
    kind: governance
    title: Policy & authorization
    icon: scale
    zone: zoneGovernance
    col: 2
    row: 4
    capabilities: [capabilityAgentRuntimeEnforcement, capabilityToolPermissionScoping, capabilityEgressControl, capabilityAiDlp, capabilityHitlControls]
    note: >
      The site-level decisions — act, read only, no access — authored in the vendor console and
      the browser policy tier, the destinations the edge admits, and what may leave for
      inference.

  - id: govSupplyChain
    kind: governance
    title: Supply-chain assurance
    icon: db
    zone: zoneGovernance
    col: 3
    row: 4
    capabilities: [capabilityMcpToolSecurity, capabilityAgentRegistry, capabilityAiTprm]
    note: >
      Which browsers and extensions may install at all, pinned to which versions, and the
      vendor assessment behind the allowlist entry.

  - id: govObservability
    kind: governance
    title: Observability & response
    icon: eye
    zone: zoneGovernance
    col: 4
    row: 4
    capabilities: [capabilityAuditLogging, capabilityShadowAiDiscovery, capabilityBrowserDetectionResponse, capabilityEdr, capabilityKillSwitch]
    note: >
      The edge's record fused with the vendor's export, in-browser telemetry of what the agent
      read and clicked, discovery of the extensions nobody enrolled, and the policy push that
      removes one everywhere at once.

edges:
  - from: user
    to: harness
    path: primary
    bidir: true
    label: local session
    note: >
      The user states an outcome in the side panel and answers confirmations. The pages that
      determine how the outcome is reached are not theirs.
  - from: toolPlane
    to: browser
    path: primary
    bidir: true
    label: navigate, read & click
    note: >
      Actions out as navigation, clicks and keystrokes indistinguishable from the user's own;
      rendered pages back as extracted context. The per-site permission is enforced on the way
      out, the stripping of hidden content on the way back.
  - from: toolPlane
    to: memory
    path: primary
    bidir: true
    label: read & write / context
    note: >
      Conversation and browser memories written as the agent works and read back as context on
      the next task — the persistence that lets one hostile page outlive the session it was read in.
  - from: harness
    to: aiGateway
    path: primary
    bidir: true
    label: inference & session
    note: >
      Page content — including content from authenticated pages — leaves for inference on the
      signed-in vendor account, through the browser's network stack and therefore through our
      edge; the completion that returns selects the next click and is not authenticated content.
  - from: browser
    to: aiGateway
    route: vh
    path: primary
    bidir: true
    label: browser egress
    note: >
      Every request the agent causes, with the profile's cookies attached, leaves through the
      edge; every page comes back through it. The one hop on this drawing where the
      organisation sees the agent's browsing.
  - from: aiGateway
    to: vendorService
    path: external
    bidir: true
    label: to the approved vendor
    note: >
      Admitted by the allowlist an assessment put it on, and — unlike the coding agents' pinned
      sessions — inspectable, because the browser trusts the enterprise root. What crosses is
      the user's pages and the plan that comes back.
  - from: vendorService
    to: provider
    path: external
    bidir: true
    label: inference / completion
    note: The vendor's service calls the model provider; everything behind that interface is theirs.
  - from: aiGateway
    to: openWeb
    route: vh
    path: external
    bidir: true
    label: browsing / page content
    note: >
      Browsing out; page text back in. The primary injection path — any page the agent reads can
      steer what it does on every origin the profile reaches — and the exfiltration path, when
      the agent is steered into typing what it read into a form the attacker owns.
  - from: aiGateway
    to: downstream
    route: vh
    path: external
    bidir: true
    label: authenticated requests
    note: >
      Requests out with the user's cookies; authenticated content — mail, records, internal
      pages — back in as model input. Where a purchase, a send or a permission change lands.
  - from: openWeb
    to: browser
    route: vh
    path: external
    label: extension install & update
    note: >
      The extension variant's supply chain: installed from the store in one click, updated
      silently on the store's schedule, straight into the host that reads every page. Physically
      this traverses the edge like everything else; nothing there admits it — the admission
      decision is browser policy, enforced at the host.

pins:
  risks:
    - risk: riskPromptInjection
      at: aiGateway->openWeb
      note: >
        Page text is instruction once extracted — visible or hidden — and the author is whoever
        owns the page the agent happened to read.
    - risk: riskSensitiveDataDisclosure
      at: aiGateway->openWeb
      note: >
        The exfiltration path: an agent steered by one page types what it read on another —
        mail, records, a one-time code — into a form on a page the attacker owns, on a request
        that looks like browsing.
    - risk: riskAgenticDelegationConfusedDeputy
      at: aiGateway->downstream
      note: >
        Instructions from one origin act on another with the user's cookies attached. The
        application receives a request it cannot distinguish from the user's, because no grant
        was ever issued to an agent.
    - risk: riskRogueActions
      at: aiGateway->downstream
      note: >
        A purchase, a send or a permission change is one click, and the set of actions the
        confirmation gate covers is narrower than users assume.
    - risk: riskSensitiveDataDisclosure
      at: harness->aiGateway
      note: >
        Authenticated page content leaves for inference. The user consented to an assistant,
        not to a transcript of their inbox.
    - risk: riskExcessiveDataHandlingDuringInference
      at: aiGateway->vendorService
      note: >
        Whole pages, screenshots and every tab the agent opened on the way go to the vendor and
        into its retention — usually more than the user pictured sharing, and synced to the
        vendor's side as memory for most products.
    - risk: riskInsecureModelOutput
      at: harness
      note: >
        The completion selects a click on a real, signed-in application, and nothing
        authenticates its intent.
    - risk: riskRunawayAgentToolLoops
      at: harness
      note: >
        An agent that retries a click, reloads and retries again, with no meter but the vendor's
        and a human who has switched tabs — each iteration a real request on a real session.
    - risk: riskCrossTenantCredentialPropagation
      at: browser
      note: >
        Every authenticated origin in the profile is in scope for every page the agent reads —
        authority pooled in one cookie jar, read here as pooled session authority.
    - risk: riskPromptInjection
      at: memory
      note: >
        Browser memories are prose a later task treats as context; a page the attacker served
        once is kept, summarised, and re-read on the next task the user asks for.
    - risk: riskInsecureIntegratedComponent
      at: harness
      note: >
        The extension variant is third-party code with host permissions on all sites, reading
        every page the user opens — including the ones they would never point an agent at — and
        replaced silently by whatever the store's update channel delivers next.
    - risk: riskToolSourceProvenance
      at: openWeb->browser
      note: >
        The store's review is the only review, and the update channel is automatic: one silent
        update changes the code that reads every page, with no further decision by anyone.
    - risk: riskShadowAndUnknownAgents
      at: harness
      note: >
        An extension is one click to install and appears in no inventory; assistant panels ship
        enabled to an installed base nobody enrolled, and the default flips from plan to plan.

  capabilities:
    - capability: capabilityHitlControls
      at: user->harness
      note: >
        Confirmation before consequential clicks — payments, sends, publishing, credential entry
        — with the covered set defined by consequence rather than by what the product found
        convenient, and the "skip all approvals" mode removable by the admin tier.
    - capability: capabilityToolPermissionScoping
      at: toolPlane
      note: >
        Site-level permissions enforced where the tools run: which origins the agent may act on,
        which it may only read, which it may not touch — set in the vendor console over the
        user's own grants.
    - capability: capabilityCredentialIsolation
      at: profile
      note: >
        A dedicated managed profile with a narrow set of signed-in origins and no saved
        passwords — the control that converts an unbounded blast radius into a bounded one, and
        the one the vendors' own safety guidance asks for.
    - capability: capabilityPromptInjectionDefense
      at: harness
      note: >
        Strip hidden and off-screen content at page extraction and classify what remains before
        it becomes context. Bounds the injection rather than preventing it; the vendor's
        classifiers run here and are assured rather than drawn.
    - capability: capabilityMemoryProtection
      at: toolPlane->memory
      note: >
        Treat browser memories as untrusted on read; scope which origins may be remembered at
        all, and keep the sensitive ones out.
    - capability: capabilityBrowserDetectionResponse
      at: browser
      note: >
        In-browser telemetry of what the agent read and clicked — the only vantage point that
        sees either, and often the only telemetry available.
    - capability: capabilityEdr
      at: browser
      note: >
        The device tooling that sees which browsers and extensions are installed, what the
        profile directory holds, and the containment that isolates a machine whose agent has
        been steered.
    - capability: capabilityAgentRegistry
      at: browser
      note: >
        The browser policy allowlist of extensions and agentic browsers permitted to install —
        by identifier, blocked by requested permission — enforced at the host, not at the store.
    - capability: capabilityShadowAiDiscovery
      at: browser
      note: >
        Inventory the extensions and assistant panels that never enrolled, from the device and
        from the edge — this archetype spreads one click at a time.
    - capability: capabilitySse
      at: aiGateway
      note: >
        The secure service edge on the managed browser's sessions: TLS inspection where policy
        allows, destination allowlisting where it does not, and the one record of the agent's
        browsing the organisation holds.
    - capability: capabilityAuditLogging
      at: aiGateway
      note: >
        The edge's session record fused with the vendor's audit export — only the combination
        shows what was read, what left, and what was clicked.
    - capability: capabilityAiDlp
      at: harness->aiGateway
      note: >
        Classify and redact what page content may leave for inference, on the hop where the
        browser's trust in our root makes inspection real — because the pages are authenticated ones.
    - capability: capabilityEgressControl
      at: aiGateway->openWeb
      note: >
        An allowlist on where the agent may browse, enforced at the edge and by managed browser
        policy on the agent's profile — the profile is what lets the rule apply to the agent's
        browsing and not the user's.
    - capability: capabilityMcpToolSecurity
      at: openWeb->browser
      note: >
        Admission of extensions as a supply-chain decision: reviewed permissions, pinned
        versions, and an update that is a decision rather than an event.
    - capability: capabilityIga
      at: vendorService
      note: >
        Federated login on the agent's vendor account, and the tenant binding that keeps the
        extension from signing into a personal account — Zone-2 configuration, because the
        account layer is the only lever on this path.
    - capability: capabilityAgentRuntimeEnforcement
      at: vendorService
      note: >
        Managed settings make the site lists, the blocked action classes and the approval mode
        non-overridable on the device — the per-action decision is enforced inside the agent by
        the tier the vendor delivers.
    - capability: capabilityAiTprm
      at: vendorService
      note: >
        The assessment behind the allowlist entry, pinned on the vendor itself: their
        classifiers, retention terms and memory sync are the substance of the review.
    - capability: capabilityKillSwitch
      at: govObservability
      note: >
        Force-remove the extension by browser policy, disable the agent in the vendor console,
        and revoke the profile's sessions — each reachable without waiting for the user to notice.

walkthrough:
  title: The user asks for something on a signed-in site
  moves: >-
    A goal stated in the side panel, the signed-in page it needs, inference through the vendor,
    and the confirmed click that lands as the user.
  steps:
    - follow: user->harness
      label: goal stated in the side panel
      note: The user states an outcome — reschedule the meeting, pay the invoice — and stays for the session.
    - follow: toolPlane->memory
      label: memory & history read
      note: The loop assembles context — the conversation so far and the browser memories.
    - follow: memory->toolPlane
      label: context loads
      note: All of it loads as context — including whatever an earlier task persisted.
    - follow: toolPlane->browser
      label: open the tab, read the page
      note: The browser tools open the signed-in application and read what is rendered.
    - follow: browser->aiGateway
      label: authenticated request
      note: The request leaves with the profile's cookies attached, through the edge.
    - follow: aiGateway->downstream
      label: on the signed-in session
      note: The application answers the user's own session; it has no idea an agent is driving.
    - follow: downstream->aiGateway
      label: page / record back
      note: Records, mail, a calendar — authored by many hands, none of them the user.
    - follow: aiGateway->browser
      label: page rendered
      note: Back through the edge, where returned content can be classified, and rendered.
    - follow: browser->toolPlane
      label: page extracted into context
      note: Page extraction strips hidden content and hands the rest to the loop as context.
    - follow: harness->aiGateway
      label: context leaves for inference
      note: >
        The goal and the extracted pages leave for the vendor on the signed-in account — and
        through our edge, which is where classification of what leaves is real.
    - follow: aiGateway->vendorService
      label: inspected, to the approved vendor
      note: Admitted by the allowlist, inspected because the browser trusts our root.
    - follow: vendorService->provider
      label: vendor's model call
      note: The vendor's service calls the model provider; everything past that interface is theirs.
    - follow: provider->vendorService
      label: completion
      note: The completion comes back to the vendor's service.
    - follow: vendorService->aiGateway
      label: plan
      note: And back across the edge — unauthenticated content, about to become the plan.
    - follow: aiGateway->harness
      label: plan into loop
      note: The loop treats the completion as its next action.
    - follow: harness->user
      label: approval prompt
      note: >
        The consequential action surfaces for confirmation before it runs — rare enough, in the
        target state, that the prompt is read.
    - follow: user->harness
      label: approved (this action)
      note: Approved — this action, on this site, not a blanket yes.
    - follow: toolPlane->browser
      label: the consequential click
      note: The click, on an origin the site permissions allow the agent to act on.
    - follow: browser->aiGateway
      label: request with cookies attached
      note: Out through the edge with the user's session.
    - follow: aiGateway->downstream
      label: action lands as the user
      note: The application applies it as the user's own action, and records it as such.
    - follow: downstream->aiGateway
      label: confirmation
      note: The confirmation page returns.
    - follow: aiGateway->browser
      label: rendered
      note: And renders in the tab.
    - follow: browser->toolPlane
      label: result extracted
      note: Extracted into context, so the loop knows the action landed.
    - follow: harness->user
      label: outcome reported
      note: The outcome, reported in the side panel — and written to memory for the next task.

scenarios:
  - title: A hostile page steers the agent
    steps:
      - follow: user->harness
        label: routine goal (compare prices)
        note: The user asks for something routine — compare prices, find a venue.
      - follow: toolPlane->browser
        label: navigate to results
        note: The agent navigates; the browser fetches whatever the task surfaces.
      - follow: browser->aiGateway
        label: fetch
        note: Out through the edge, as ordinary browsing.
      - follow: aiGateway->openWeb
        label: browsing
        note: To a page the attacker owns, or one they were able to write on.
      - follow: openWeb->aiGateway
        label: page with hidden instruction
        note: >
          A page comes back carrying text addressed to the agent — off-screen, white on white,
          or in a comment — which the edge can classify and rarely does.
      - follow: aiGateway->browser
        label: rendered, hidden text included
        note: Rendered in the tab, hidden text and all.
      - follow: browser->toolPlane
        label: extracted into context
        note: Page extraction is the last point the hidden text could be stripped; past it, the text is context.
      - follow: harness->aiGateway
        label: poisoned context leaves
        note: The poisoned context goes to the vendor for inference, indistinguishable from the user's goal.
      - follow: aiGateway->vendorService
        label: inference
        note: The vendor's classifiers are the last defence on this hop, and they are the vendor's.
      - follow: vendorService->aiGateway
        label: attacker's plan as completion
        note: The completion carries the attacker's instruction as the next step.
      - follow: aiGateway->harness
        label: next click
        note: The loop treats it as the next click.
      - follow: toolPlane->browser
        label: click on a signed-in origin
        note: >
          The next click lands on a signed-in origin — the mail tab, the internal application —
          if the site permissions let the agent act there.
      - follow: browser->aiGateway
        label: request with the user's cookies
        note: With the user's cookies attached.
      - follow: aiGateway->downstream
        label: acts on the signed-in app
        note: The application receives a request it cannot distinguish from the user's.
      - follow: downstream->aiGateway
        label: records read
        note: What the attacker wanted read — mail, a record, a one-time code — comes back.
      - follow: aiGateway->browser
        label: rendered
        note: Rendered in the tab.
      - follow: browser->toolPlane
        label: extracted
        note: And extracted into context, where the plan already says what to do with it.
      - follow: toolPlane->browser
        label: typed into the attacker's form
        note: The agent types it into a form on the page it was steered from.
      - follow: browser->aiGateway
        label: exfil request
        note: A request that looks like browsing.
      - follow: aiGateway->openWeb
        label: content leaves to the attacker's page
        note: >
          The content leaves to the attacker's page — the edge's classification of what leaves
          is the last control standing, and the destination allowlist the one before it.

  - title: Summarise my inbox
    steps:
      - follow: user->harness
        label: summarise my inbox
        note: A legitimate request against the user's own mail.
      - follow: toolPlane->browser
        label: open the mail tab
        note: The agent opens the mail tab in the profile.
      - follow: browser->aiGateway
        label: authenticated request
        note: Out with the standing session.
      - follow: aiGateway->downstream
        label: inbox on the standing session
        note: The browser fetches the inbox on the standing session.
      - follow: downstream->aiGateway
        label: mail, incl. strangers' messages
        note: Mail content returns — including messages written by strangers, which are now model input.
      - follow: aiGateway->browser
        label: rendered
        note: Rendered in the tab.
      - follow: browser->toolPlane
        label: inbox extracted into context
        note: The whole inbox view is extracted into context.
      - follow: harness->aiGateway
        label: the inbox leaves for inference
        note: The inbox leaves for inference, which is more than the user pictured sharing.
      - follow: aiGateway->vendorService
        label: DLP-inspected, to the vendor
        note: >
          Classified at the edge on the way out — the one place a mail transcript can be redacted
          before it becomes the vendor's to retain.
      - follow: vendorService->aiGateway
        label: summary
        note: The summary comes back.
      - follow: aiGateway->harness
        label: into the loop
        note: Into the loop.
      - follow: harness->user
        label: summary in the side panel
        note: And to the user — with the inbox now in the vendor's retention and, likely, its memory.

  - title: The extension updates itself
    steps:
      - follow: openWeb->browser
        label: silent update from the store
        note: >
          A new version arrives over the store's channel into the extension host — the code that
          reads every page has changed, with no decision by the user and no admission by us.
      - follow: browser->toolPlane
        label: every open page, read by new code
        note: The updated code reads every tab the profile has open, on the permissions it already held.
      - follow: browser->aiGateway
        label: requests on every session's cookies
        note: Whatever it now does, it does with the profile's cookies attached.
      - follow: aiGateway->downstream
        label: on every signed-in origin
        note: >
          On every signed-in origin the profile holds — which is why the profile's scope, and
          the policy allowlist that pins the version, are the controls this walk pins.

  - title: A memory carries the injection forward
    steps:
      - follow: toolPlane->memory
        label: poisoned page kept as a memory
        note: >
          A page read on one task is summarised into browser memories — hidden instruction
          included, because the summariser read it too.
      - follow: memory->toolPlane
        label: read back on the next task
        note: The next task, unrelated, loads the memory as context.
      - follow: harness->aiGateway
        label: into inference, on a clean goal
        note: >
          The injection re-enters inference under a goal the user never associated with the
          page — memory scoping and treating memories as untrusted on read are what bound it.

deviations:
  - subject: The AI gateway is the secure service edge, and carries no model proxy
    reason: >
      Every product in this class calls its own vendor's model on the signed-in account, so the
      organisation's tier brokers no inference and no MCP traffic; the aiGatewayTraffic pack is
      not used and the block lists the one traffic class it carries — the secure web gateway the
      managed browser's sessions leave through. It is drawn as the AI gateway because it is the
      customer-operated tier every session crosses, and because capabilitySse is registered on
      it; what it does here is admission, inspection and the record, which are its pins. A
      reader comparing this to the coding agents should see the same block doing a narrower job.
  - subject: The vendor's path is inspected here, unlike the coding agents' pinned sessions
    reason: >
      The sibling drawings admit the vendor session by allowlist and refuse to draw inspection
      on it, because a CLI's pinned TLS session cannot be inspected without breaking the
      product. A browser is different in a way that matters: extensions and built-in agents use
      the browser's network stack, which trusts the enterprise root, so the secure service edge
      genuinely sees what leaves for the vendor. AI DLP is pinned on that hop for that reason,
      and nowhere else on the endpoint surface.
  - subject: Injection defence is absorbed by the harness's page extraction
    reason: >
      The registered embodiment is the AI gateway, but the point where hidden and off-screen
      content can be stripped before it becomes instruction is page extraction inside the
      agent, and the vendor's injection classifiers run there too. The pin sits on the harness
      and the control is absorbed by it; the edge can classify returned pages on the browsing
      leg and that is recorded on the edge's own notes, not as a second embodiment.
  - subject: The profile is drawn as a boundary around the browser and the agent
    reason: >
      A reader expects a profile inside a browser. The drawing inverts that on purpose: a
      profile is a self-contained browser instance — its own tabs, extensions and cookie jar —
      and it is the boundary this archetype actually has, so it is drawn as the frame around
      everything that acts with its sessions, the way the personal agent draws its sandbox. The
      Browser block inside it holds the tabs, the extension host and the cookie jar the frame
      scopes; credential isolation pins on the frame because the frame is the decision.
  - subject: The extension supply path is drawn direct from the store to the host
    reason: >
      Physically the update traverses the secure service edge like every other request; drawing
      it that way would suggest the edge admits it, and nothing there does. The admission
      decision — which extensions may install, at which versions — is browser policy enforced at
      the extension host, and the edge from the store to the host is where that decision and the
      provenance risk are pinned.
  - subject: Cross-tenant credential propagation is read as pooled session authority
    reason: >
      The catalogue defines the risk as one tenant's credentials reaching another. On this
      drawing the mechanism is the same shape inside one user: every signed-in origin's session
      sits in one cookie jar, and a page from any of them — or from nowhere — can cause a request
      on all of them. The tag is kept because it is the nearest coded risk; the profile's
      scope is the answer to both readings.

