  - architecture: archTrainingPipeline
    asOf: "2026-10"
    # >>> checked against the vendor's documentation
    verified: "2026-11-18"
    sources:
      dataOrigins: https://docs.aws.amazon.com/sagemaker/latest/dg/sms.html
      pkgRegistry: https://docs.aws.amazon.com/codeartifact/latest/ug/welcome.html
      curation: https://docs.aws.amazon.com/sagemaker/latest/dg/processing-job.html
      corpus: https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html
      trainJob: https://docs.aws.amazon.com/sagemaker/latest/dg/how-it-works-training.html
      storage: https://docs.aws.amazon.com/AmazonS3/latest/userguide/bucket-policies.html
      evaluation: https://docs.aws.amazon.com/sagemaker/latest/dg/define-pipeline.html
      registry: https://docs.aws.amazon.com/sagemaker/latest/dg/model-registry.html
    alsoNeeded:
      - service: "Amazon ECR"
        role: registry
        why: "Holds the training, processing and evaluation container images, which CodeArtifact cannot store."
        url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/image-scanning-enhanced.html
      - service: "An image build step that installs packages through CodeArtifact (for example AWS CodeBuild)"
        role: other
        why: "Network-isolated jobs cannot install packages at run time, so they are built into the image."
        url: https://docs.aws.amazon.com/sagemaker/latest/dg/mkt-algo-model-internet-free.html
      - service: "AWS IAM execution roles"
        role: identity
        why: "One role per stage; SageMaker uses it to read and write S3 for the job."
        url: https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-roles.html
      - service: "Amazon VPC with private subnets and an S3 gateway endpoint"
        role: network
        why: "Routes SageMaker's data downloads and uploads through your network."
        url: https://docs.aws.amazon.com/sagemaker/latest/dg/mkt-algo-model-internet-free.html
      - service: "AWS KMS"
        role: keys
        why: "Encryption key for volumes and outputs, and a separate signing key for releases."
        url: https://docs.aws.amazon.com/kms/latest/APIReference/API_Sign.html
      - service: "Amazon CloudWatch Logs"
        role: logging
        why: "Processing and training job logs and metrics are written here; they can contain training data."
        url: https://docs.aws.amazon.com/sagemaker/latest/dg/processing-job.html
      - service: "AWS CloudTrail"
        role: logging
        why: "Records who started runs, changed approval status and used the signing key."
        url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/logging-data-events-with-cloudtrail.html
      - service: "A promotion job triggered by approval (your CI/CD)"
        role: other
        why: "Approval only changes a status; copying, documenting and signing the release is a job you build."
        url: https://docs.aws.amazon.com/sagemaker/latest/dg/model-registry-approve.html
    quickstart:
      - title: "Define a pipeline"
        url: https://docs.aws.amazon.com/sagemaker/latest/dg/define-pipeline.html
      - title: "Add a step"
        url: https://docs.aws.amazon.com/sagemaker/latest/dg/build-and-manage-steps-types.html
    # <<< checked
    reference:
      - title: Well-Architected Generative AI Lens — Model customization
        url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/genops05.html
      - title: Well-Architected Generative AI Lens — Data poisoning
        url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/gensec06.html
      - title: Amazon SageMaker Pipelines
        url: https://docs.aws.amazon.com/sagemaker/latest/dg/pipelines.html
    summary:
      - >-
        A SageMaker Pipelines run: Processing jobs curate and redact into a versioned S3 dataset, a
        network-isolated SageMaker AI training job writes an unsigned candidate under its own role and
        your KMS key, an evaluation step gates registration in SageMaker Model Registry, and a
        separate promotion role approves, documents and signs the release with an asymmetric KMS key.
        Base checkpoints and frameworks come only through CodeArtifact and a scanned S3 mirror.
    bindings:
      - block: upstreamArtifacts
        service: "Hugging Face Hub and public registries"
        options:
          - { name: "Hugging Face Hub and public registries", kind: commercial, url: "https://huggingface.co/docs/hub/index", note: "The public hub for open weights and datasets; today's mapping.", packs: [awsNative, awsEksOpenSource] }
          - { name: "Amazon SageMaker JumpStart", kind: commercial, url: "https://docs.aws.amazon.com/sagemaker/latest/dg/studio-jumpstart.html", note: "Pretrained models AWS packages for SageMaker AI deployment." }
          - { name: "NVIDIA NGC", kind: commercial, url: "https://awslabs.github.io/ai-on-eks/docs/blueprints/inference/framework-guides/GPUs/nvidia-nim-llama3", note: "Per-model NIM containers pulled with an NGC API key; AI on EKS has NIM guides." }
      - { block: dataOrigins, service: Your datasets and labelling workforce, build: true, note: "SageMaker Ground Truth where AWS runs the labelling." }
      - block: pkgRegistry
        service: "CodeArtifact and an S3 checkpoint mirror"
        options:
          - { name: "CodeArtifact and an S3 checkpoint mirror", kind: commercial, url: "https://docs.aws.amazon.com/codeartifact/latest/ug/welcome.html", note: "Packages through CodeArtifact's external connections; checkpoints copied into a scanned S3 mirror; today's mapping.", packs: [awsNative] }
          - { name: "JFrog Artifactory", kind: commercial, url: "https://docs.jfrog.com/artifactory/docs/hugging-face-repositories", note: "Remote repositories cache packages, and Hugging Face models and datasets too." }
          - { name: "Sonatype Nexus Repository", kind: commercial, url: "https://help.sonatype.com/en/hugging-face-repositories.html", note: "Proxy repositories for package formats, Hugging Face among them." }
      - block: curation
        service: "SageMaker Processing jobs"
        options:
          - { name: "SageMaker Processing jobs", kind: commercial, url: "https://docs.aws.amazon.com/sagemaker/latest/dg/processing-job.html", note: "Built-in or your own containers as jobs; today's mapping.", packs: [awsNative] }
          - { name: "AWS Glue", kind: commercial, url: "https://docs.aws.amazon.com/glue/latest/dg/what-is-glue.html", note: "Serverless data integration and ETL into the data lake." }
          - { name: "Amazon EMR", kind: commercial, url: "https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-what-is-emr.html", note: "Managed Spark and Hadoop; AI on EKS adds a GPU Spark RAPIDS example." }
          - { name: "Ray on KubeRay with Argo Workflows (JARK)", kind: open, url: "https://awslabs.github.io/ai-on-eks/docs/infra/training/jark", note: "AI on EKS's JARK stack: Argo Workflows for the pipeline, Ray for scale-out data and training steps.", packs: [awsEksOpenSource] }
          - { name: "Databricks Runtime for Machine Learning", kind: commercial, url: "https://docs.databricks.com/aws/en/machine-learning/train-model/", note: "Spark with Photon on classic compute in your AWS account.", packs: [databricksOnAws] }
      - { block: corpus, service: Amazon S3 dataset bucket (versioned) }
      - block: trainJob
        service: "SageMaker AI training jobs"
        note: "SageMaker HyperPod for multi-node runs that need a persistent cluster."
        options:
          - { name: "SageMaker AI training jobs", kind: commercial, url: "https://docs.aws.amazon.com/sagemaker/latest/dg/how-it-works-training.html", packs: [awsNative], watch: [{ text: "With network isolation the container calls no service, CodeArtifact and S3 included: packages are installed into the image at build and kept in Amazon ECR, and the base checkpoint arrives as an S3 input that SageMaker copies in.", url: "https://docs.aws.amazon.com/sagemaker/latest/dg/mkt-algo-model-internet-free.html" }] }
          - { name: "Kubeflow Trainer (TrainJob)", kind: open, url: "https://www.kubeflow.org/docs/components/trainer/overview/", note: "Kubeflow's current training API for PyTorch, DeepSpeed, JAX and others; Training Operator v1 (PyTorchJob) is legacy." }
          - { name: "SageMaker HyperPod training operator", kind: commercial, url: "https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-eks-operator.html", note: "On HyperPod with EKS: fault recovery, hung-job detection and process-level management." }
          - { name: "Slurm on SageMaker HyperPod", kind: commercial, url: "https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-slurm.html", note: "Where the training team works in Slurm rather than Kubernetes." }
          - { name: "Ray Train on KubeRay", kind: open, url: "https://docs.ray.io/en/latest/cluster/kubernetes/index.html", note: "RayJob and RayCluster resources on EKS; part of AI on EKS's JARK stack.", packs: [awsEksOpenSource] }
          - { name: "Kueue", kind: open, url: "https://kueue.sigs.k8s.io/docs/overview/", note: "Queues and quotas in front of any of the job types, so teams share GPU capacity." }
          - { name: "Databricks AI Runtime", kind: commercial, url: "https://docs.databricks.com/aws/en/machine-learning/ai-runtime", note: "Serverless GPU compute for single and multi-node fine-tuning; Databricks' replacement for its retired fine-tuning service.", packs: [databricksOnAws], watch: [{ text: "Foundation Model Fine-tuning has reached end of life; AI Runtime is the recommended path.", url: "https://docs.databricks.com/aws/en/machine-learning/ai-runtime" }] }
      - { block: storage, service: Amazon S3 candidate bucket }
      - block: evaluation
        service: "SageMaker Pipelines evaluation step"
        note: "SageMaker Clarify foundation model evaluations plus your own backdoor and memorisation probes, on a read-only role."
        options:
          - { name: "SageMaker Pipelines evaluation step", kind: commercial, url: "https://docs.aws.amazon.com/sagemaker/latest/dg/define-pipeline.html", packs: [awsNative] }
          - { name: "SageMaker Clarify foundation model evaluations (fmeval)", kind: commercial, url: "https://docs.aws.amazon.com/sagemaker/latest/dg/clarify-foundation-model-evaluate.html", note: "Automatic evaluation jobs; the fmeval library also scores models outside JumpStart; today's mapping." }
          - { name: "Amazon Bedrock Evaluations", kind: commercial, url: "https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation.html", note: "Judge-model, programmatic and RAG evaluations, imported models included." }
          - { name: "MLflow GenAI evaluation", kind: open, url: "https://docs.databricks.com/aws/en/mlflow3/genai/eval-monitor/", note: "MLflow 3 scores traces with scorers: LLM judges and code-based checks, as Databricks documents it.", packs: [databricksOnAws] }
          - { name: "Inspect", kind: open, url: "https://inspect.aisi.org.uk/", note: "Open-source framework for LLM evaluations from the UK AI Security Institute." }
          - { name: "garak", kind: open, url: "https://docs.garak.ai/garak", note: "Open-source LLM vulnerability scanner built from probes." }
