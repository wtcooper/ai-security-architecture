      - at: gateway->provider
        text: "AWS's own samples have the agent call Amazon Bedrock directly, and the documented runtime role allows it. To send model calls through the gateway, point the model client at a gateway inference target and remove the direct model permission from the runtime's role."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-permissions.html
      - at: events->planner
        text: "AWS recommends a gateway in front of the runtime as its governed way in. This mapping has a function start the runtime directly, so that function's role is the control on who may start a run."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-security-best-practices.html
      - at: localTools
        text: "The code sandbox is AgentCore Code Interpreter, a separate managed service the agent calls, not something inside the agent's own process. The agent calls it and AgentCore Memory directly, not through the gateway."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/code-interpreter-resource-management.html
