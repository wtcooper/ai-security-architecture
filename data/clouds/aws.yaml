    default: "SSE-S3 (Amazon S3 managed keys)"
    recommended: "Set default encryption to SSE-KMS with your customer managed key and an S3 Bucket Key; grant kms:Decrypt and kms:GenerateDataKey to the training role only, and encrypt the job's volumes with the same key."
    value: "SSE-KMS with your customer managed key"
