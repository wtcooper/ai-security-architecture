id: fireworks-ai-breach
title: "Fireworks AI: a tuning and evaluation provider's own credentials open its customers' secrets, datasets and models"
subtitle: >
  Two intrusions at Fireworks AI between August and October 2026 took the secrets customers
  kept for their evaluation jobs, then datasets, model files and account data. Downstream, Uber
  lost drivers' licence records and Notion its users' AI chat transcripts, and Uber's own alerts
  stayed silent because the intruder came in as Fireworks.
date: 2026-11
dateRange: 3 August – 30 October 2026 (disclosed 9 October – 17 November)
category: identity
perspective: target
# The customers' tuning and evaluation ran on a provider's platform, not their own; the boxes (datasets, jobs, model files, evaluation, secrets) are the same whoever runs them, and the chain ran across them.
archetype: archTrainingPipeline
caveat: >
  Fireworks has not said how many customers lost secrets, datasets or models ("a small number"),
  nor named the vulnerability or the third-party cloud provider. Uber's figure of 149,346 comes
  from its state breach filings as reported by TechCrunch (Oregon) and BleepingComputer (Maine).
  Notion puts its share at under 1% of workspaces; TechCrunch reported around 1% of its
  customers. Fireworks' page dates the first bulletin 10 October, while its own timeline and its
  9 November update say it was published on 9 October (10pm PDT).
breaks:
  - control: AML.M0005
    how: "Each customer's datasets, model files and evaluation jobs readable only by that customer's identities, checked at the store, so a stolen staff credential does not open them all."
  - control: D3-AA
    how: "Jobs read datasets and write model files as their own workload identity; a workload started from a breached R&D machine gets nothing from the stores."
  - control: D3-NI
    how: "R&D machines on another provider's cloud reached production; the job plane should accept nothing from outside the platform's own control services."
  - control: AML.M0012
    how: "Model files and datasets under keys the customer manages, and short-lived credentials for evaluation jobs instead of standing keys, so what was copied or read stops working."
  - control: AML.M0007
    how: "Strip credentials and personal data before a dataset leaves for a provider: the keys Notion users had pasted into chats travelled with the transcripts."
  - control: AML.M0024
    how: "Log every access to a customer's account by the provider's own identities and give that log to the customer; Uber's alerts never fired because the intruder came in as Fireworks."
summary:
  - >
    Fireworks AI serves open-weight models and lets customers tune and evaluate models on its
    platform. Customers keep secrets there for their evaluation jobs, upload datasets and leave
    tuned model files behind. The provider's own access therefore reaches into every customer's
    pipeline at once.
  - >
    Fireworks describes two separate intrusions. In the first (3 August – 7 October) an
    intruder used stolen Fireworks credentials and a vulnerability in one of its services, read
    the environment variables of customers' evaluation jobs, where API keys and tokens were
    stored as secrets, and for a small number of customers took secrets, model files and
    datasets. In the second (23 – 30 October) a breach at a third-party cloud provider hosting
    Fireworks R&D machines led into part of production: account and billing information for
    every account created before 30 October, and datasets, models or secrets for a small number
    of customers.
    Fireworks links the activity to a financially motivated group that sells stolen access to
    large language models ("LLMJacking").
  - >
    The damage landed on the customers. Uber notified 149,346 people whose names, addresses,
    dates of birth and driver's licence numbers were taken from its account with Fireworks.
    Notion found AI chat transcripts from under 1% of its workspaces in a dataset Fireworks
    held, some with API keys users had pasted in. Cursor's turn came through a key it had issued
    to Fireworks.
risks:
  - riskCrossTenantCredentialPropagation
  - riskSensitiveDataDisclosure
  - riskModelExfiltration
  - riskExcessiveDataHandling
steps:
  - n: 1
    title: Fireworks' own credentials, and a flaw in one of its services
    phase: introduced
    narrative: >
      Between 3 August and 7 October an intruder probed Fireworks and got in with stolen
      Fireworks credentials and a vulnerability in one of its services, which Fireworks has not
      named. Fireworks identified "unauthorized use of internal Fireworks credentials" on
      6 October and began containment the same day. Unit 42 later completed the forensic
      investigation of this intrusion.
    path: [govIdentity]
    risks:
      - riskCrossTenantCredentialPropagation
    sources:
      - title: "Security bulletins"
        url: https://fireworks.ai/security-bulletins
        publisher: Fireworks AI
        date: 2026-11-17
  - n: 2
    title: Evaluation jobs give up the secrets customers stored for them
    phase: exposed
    narrative: >
      Customers' evaluation jobs received their API keys and tokens as environment variables,
      from secrets stored on the platform. The intruder read those variables in a limited number
      of customer accounts. Fireworks' first bulletin said it had found no access to customer
      models, datasets, training data, personal information or inference traffic, told affected
      customers to rotate the third-party credentials named in their notices with the providers
      that issued them, and said it was reviewing how secrets are made available to evaluation
      jobs.
    path: [govSecrets, evaluation]
    risks:
      - riskSensitiveDataDisclosure
    sources:
      - title: "Security bulletins"
        url: https://fireworks.ai/security-bulletins
        publisher: Fireworks AI
        date: 2026-11-17
      - title: "Fireworks AI Confirms Wider Breach Affecting Customer Datasets, Model Weights and Notion AI Chats"
        url: https://thehackernews.com/2026/11/fireworks-ai-breach-widens-to-expose.html
        publisher: The Hacker News
        date: 2026-11-10
  - n: 3
    title: "The provider's credentials open a customer's account: Uber"
    phase: exposed
    narrative: >
      Fireworks' 17 November update says the first intrusion also reached secrets, model files
      and datasets for a small number of customers. Uber was one. Fireworks told Uber on
      9 October; on 13 October Uber found the intruder had used the provider's compromised
      internal credentials to access Uber's account with it. Uber's filings put the total at
      149,346 people, with names, addresses, dates of birth and driver's licence numbers. Uber
      told TechCrunch it had alerts enabled for unauthorized access to its Fireworks environment,
      and none fired, because the access came with Fireworks' own credentials.
    path: [corpus]
    risks:
      - riskCrossTenantCredentialPropagation
      - riskSensitiveDataDisclosure
    sources:
      - title: "Uber says hackers stole information on close to 150,000 driver's licenses during data breach"
        url: https://techcrunch.com/2026/11/13/uber-confirms-hackers-stole-thousands-of-drivers-license-information-in-data-breach/
        publisher: TechCrunch
        date: 2026-11-16
      - title: "Uber notifies drivers of data breach affecting nearly 150,000 people"
        url: https://www.bleepingcomputer.com/news/security/uber-notifies-drivers-of-data-breach-affecting-nearly-150-000-people/
        publisher: BleepingComputer
        date: 2026-11-17
  - n: 4
    title: A breached R&D cloud leads to datasets, models and every account's billing
    phase: exposed
    narrative: >
      A third-party cloud provider that hosted Fireworks R&D machines had a security incident on
      23 October. On 24 October the intruder used it to reach Fireworks development machines,
      ran an unauthorized workload and reached part of production. Fireworks detected it the
      same day. The intruder took account and billing information for every account created
      before 30 October (Fireworks does not store card numbers) and, for a small number of
      customers, datasets, models or secrets, including a subset of incomplete model weights.
      Fireworks disabled self-serve dataset uploads and downloads for batch inference and
      dataset-based training.
    path: [corpus->trainJob, trainJob->storage]
    risks:
      - riskModelExfiltration
      - riskSensitiveDataDisclosure
    sources:
      - title: "Security bulletins"
        url: https://fireworks.ai/security-bulletins
        publisher: Fireworks AI
        date: 2026-11-17
  - n: 5
    title: Notion's chat transcripts, and the keys pasted into them
    phase: exposed
    narrative: >
      Notion used Fireworks for the classification jobs behind its Insights feature and to serve
      open-weight models. Fireworks told Notion on 6 November that customer data may have been
      accessed and confirmed the dataset on 8 November: Notion AI chat transcripts used for
      Insights, from under 1% of workspaces, mostly not labelled with who wrote them. They held
      whatever users had typed, API keys included. Notion revoked the exposed Notion keys on
      11 November, reported third-party keys to their issuers on 12 November, disabled Insights
      and stopped serving open-weight models through Fireworks.
    path: [dataOrigins->curation, curation->corpus]
    risks:
      - riskExcessiveDataHandling
      - riskSensitiveDataDisclosure
    sources:
      - title: "Fireworks AI incident"
        url: https://www.notion.com/en-us/security/advisories/security-incident-involving-a-third-party-ai-vendor
        publisher: Notion
        date: 2026-11-12
      - title: "Cyberattack on Fireworks AI allowed hackers to access Notion customers' chat transcripts"
        url: https://techcrunch.com/2026/11/12/cyberattack-on-fireworks-ai-allowed-hackers-to-access-notion-customers-chat-transcripts/
        publisher: TechCrunch
        date: 2026-11-12
  - n: 6
    title: Where this chain breaks
    phase: mitigated
    narrative: >
      The provider holds the decisive controls: each customer's datasets, model files and
      evaluation jobs readable only by that customer's identities, checked at the store; jobs
      that read and write as their own workload identity; and R&D machines with no path into
      production. The customer holds the rest. Strip credentials and personal data before a
      dataset or trace leaves for a provider. Give evaluation jobs short-lived credentials and
      keep stored model files under your own keys. And ask the provider for the log of its own
      identities' access to your account, because your alerts watch your users, not the
      provider's.
    path: [dataOrigins->curation, curation->corpus, corpus->trainJob, trainJob->storage, storage->evaluation, govSecrets, govIdentity, govObservability]
    sources:
      - title: "Security bulletins"
        url: https://fireworks.ai/security-bulletins
        publisher: Fireworks AI
        date: 2026-11-17
alsoSeen:
  - title: "Cursor: a Fireworks-held key opens a bucket of agent traces, and a trojanized Claude Code extension reaches Cursor's marketplace"
    date: October – November 2026
    note: >
      Fireworks exposed an access key Cursor had issued to it; the attacker copied a bucket of
      coding agent traces shared for model training, and unredacted credentials in a few of them
      led to Cursor's SaaS tools. From there, on 29 October, the attacker placed unauthorized
      copies of Anthropic's Claude Code extension (2.1.312 and 2.1.313) on the cache serving
      Cursor's extension marketplace, where at most 5,000 users may have received them over
      about 11 hours.
    sources:
      - title: "An update on our recent security incident"
        url: https://cursor.com/blog/security-incident-update
        publisher: Cursor
        date: 2026-11-13
      - title: "Cursor Says Stolen Fireworks AI Key Led to Trojanized Claude Code Extension Incident"
        url: https://thehackernews.com/2026/11/stolen-fireworks-ai-key-led-to-cursor.html
        publisher: The Hacker News
        date: 2026-11-15
