          - title: Replace static cloud keys with short-lived ones
            body:
              - Federate with OIDC tokens (five minutes, no refresh) instead of storing cloud access keys.
            url: https://cursor.com/docs/cloud-agent/identity
          - title: Rotate automation keys
            body:
              - Rotate a service account's API key from Dashboard → Settings → API Keys → Service Accounts (the old
                key is invalidated immediately) and archive the account to revoke all its keys.
            url: https://cursor.com/docs/account/enterprise/service-accounts
          - title: Treat the private-connectivity tunnel token as a service credential
            body:
              - For Cloudflare Tunnel private connectivity Cursor creates the tunnel and shares the token through
                a 1Password share; keep it out of email and chat and agree rotation and revocation with Cursor.
            url: https://cursor.com/docs/cloud-agent/private-connectivity
        note: >-
          Partial on the hosted rule. Secrets are encrypted and scoped per team, user or environment, and MCP
          env, headers and client secrets are write-only after saving, but the docs do not say Cloud Agent
          secrets are write-only, Environment Variable secrets are visible to the agent by design, and Runtime
          Secrets are readable inside the VM. Short-lived issuance exists for cloud roles (OIDC five minutes, STS
          one hour) and for Team Pool GitHub tokens, not documented for the repository credential on Cursor-hosted
          VMs. Tunnel: a vendor tunnel exists for Enterprise private connectivity (Cloudflare Tunnel, token issued
          by Cursor) with no documented rotation or revocation; tunnels an organisation runs inside the VM
          (Tailscale, cloudflared) keep their tokens as Cursor Secrets, which the setup page says to rotate after
          testing.
        verified: "2026-09-25"
