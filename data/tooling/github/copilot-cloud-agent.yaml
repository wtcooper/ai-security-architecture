                itself cannot be extended.
            url: >-
              https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/customize-the-agent-environment
        note: >-
          Rated native on the AML.M0036 rule: administrators set per-user and per-organisation caps that GitHub
          checks on every AI-credit request — user-level budgets always hard-stop and a $0 budget blocks
          immediately — so a session is refused at its next model call once its user's budget or a stopping
          budget is exhausted. GitHub documents the per-request check, not what the session then shows.
