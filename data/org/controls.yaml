# Your organisation's controls, and how far along each one is.
#
# One row per control your organisation runs. Each row maps to one or more controls in this
# catalogue, and several of your rows may map to the same one: the mapping is many to many.
# A catalogue control then shows your controls beneath it, by name, and its status is worked
# out from theirs: Enabled only when every one of yours that maps to it is enabled, a Gap when
# none is under way, In progress otherwise. A catalogue control with none of yours mapped
# reads "Not set".
#
#   id      your own identifier for the control (a policy or register number). Required and
#           unique. It is for your records and for this file: it is never shown on a page.
#   name    what your organisation calls it. This is what people see.
#   status  enabled | inProgress | gap. Leave it out if you have not assessed it yet.
#   maps    the catalogue controls it delivers, one or more. Use the control's key from the
#           Controls page address (/controls?control=<key>), for example D3-MFA or
#           cap-agent-egress-control.
#   note    optional, shown beside the name.
#   link    optional: your policy, standard or evidence for it (https).
#
# Example:
#
# controls:
#   - id: SEC-014
#     name: Workforce sign-in with phishing-resistant MFA
#     status: enabled
#     maps: [D3-MFA]
#     link: https://policies.example.com/sec-014
#   - id: SEC-031
#     name: Secure web gateway for AI traffic
#     status: inProgress
#     maps: [cap-agent-egress-control, D3-OTF]
#     note: Rolled out to engineering; the rest of the company by Q2.
#   - id: SEC-032
#     name: Agent sandbox network allowlist
#     status: enabled
#     maps: [cap-agent-egress-control]
controls: []
