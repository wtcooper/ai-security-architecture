  - id: redHatOpenShiftAi
    name: "Red Hat OpenShift AI on OpenShift"
    kind: commercial
    scope: platform
    vendor: "Red Hat"
    asOf: "2026-11"
    status: mixed
    summary: "Red Hat's supported AI platform, OpenShift AI 3.5 (GA September 2026, release 3.5.3 in November 2026), on OpenShift: a Models-as-a-Service AI gateway, KServe with Red Hat's vLLM build and llm-d, a model catalog and registry, AI Pipelines, Kubeflow Trainer, EvalHub with garak, and the Red Hat build of Agent Sandbox, alongside Red Hat build of Keycloak, Service Mesh, Connectivity Link with its MCP gateway, and the Advanced Developer Suite for the factory. Your platform team runs it with Red Hat support."
    fits: "When the organisation already runs OpenShift, or wants one vendor's subscription and support across the cluster, model serving, gateway, identity, sandbox and developer platform."
    compare:
      licence: "Subscriptions to open-source software: OpenShift (or OpenShift Platform Plus), OpenShift AI, Connectivity Link and Advanced Developer Suite are separate entitlements; the components are open source upstream (KServe, vLLM, llm-d, Kubeflow, Kuadrant, agent-sandbox, Kata)."
      support: "Red Hat support for GA components; Technology and Developer Preview items (among them Agent Sandbox, MaaS showback, the agent-trace view and OpenShift AI's MCP gateway workflows) carry no production support; OGX ends with 3.5 Full Support."
      covers: "Cluster, AI gateway (MaaS) and MCP gateway, front door, model serving with catalog and registry, pipelines, training, evaluation and red teaming, guardrails, object storage, identity and workload identity, sandbox runtime, events, agent runtime (OGX), tracing, CI, GitOps deploy, developer portal and image registry."
      bringYourOwn: "A durable workflow engine (for example Temporal), an A2A gateway, a PyPI and npm mirror, web search and offline web, source control, a session cache, the vault behind ESO, the database operator, your RL loop, release-signing key custody and the SIEM."
      integration: "Operators from one catalogue; MaaS on Connectivity Link and llm-d; catalog to registry to deployment; Connectivity Link policies validate Red Hat build of Keycloak tokens; workload identity federates through Service Mesh; Agent Sandbox uses Kata from sandboxed containers."
      effort: "Medium: Operators install and upgrade the components, but several separately versioned products and preview features need tracking, and you still set policy, networking, storage and quotas."
