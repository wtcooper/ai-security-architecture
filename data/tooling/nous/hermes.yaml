# Hermes Agent — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
vendor: nous
family: Hermes Agent
tools:
  - id: toolHermes
    name: Hermes Agent
    surfaceClasses:
      - endpointCli
    architecture: archPersonalAgent
    status: ga
    asOf: "2026-09"
    summary:
      - An open-source (MIT) personal agent runtime (v0.21.1, 2026-09-07) — a competing product to
        OpenClaw, not a variant of it, with a one-command migration from it (hermes claw migrate).
        Its posture centres on per-command approval
        with dangerous-command detection, DM pairing, fully isolated per-profile state, and
        sandboxed execution across multiple terminal backends.
    items:
      - title: Approval-first execution and isolated state
        body:
          - Execution goes through command approval with dangerous-command detection — blocked
            actions return a tool error naming the denied command rather than silently proceeding —
            and the first DM claims exclusive access to a deployment. Profiles are fully isolated
            (own memory store, session database and skills directory), subagents run isolated, and
            sandboxed execution spans local, Docker, SSH, Singularity, Modal, Daytona and Vercel
            Sandbox backends with container hardening and namespace isolation.
          - "The governance trade-off to weigh: Hermes is a self-improving agent that writes its own
            skills from experience, which is also the feature demanding the most trust — an
            organisation sanctioning it should decide whether self-modification is acceptable and
            pin the approval policy accordingly."
        links:
          - title: Hermes Agent — official site
            url: https://hermes-agent.nousresearch.com/
          - title: Hermes Agent FAQ (approvals, pairing, profile isolation)
            url: https://github.com/NousResearch/hermes-agent/blob/main/website/docs/reference/faq.md
          - title: NousResearch/hermes-agent README (seven terminal backends, isolated subagents, migration)
            url: https://github.com/NousResearch/hermes-agent
    controls: []
    sources:
      - title: Hermes Agent — official site
        url: https://hermes-agent.nousresearch.com/
      - title: NousResearch/hermes-agent repository
        url: https://github.com/NousResearch/hermes-agent
