      - mitigation: cap-agent-kill-switch
        coverage: partial
        mechanism: >-
          hermes gateway stop (--all), hermes cron pause, /loop stop, hermes pairing revoke, hermes egress
          setup --rotate-tokens and /rollback undo pieces of a deployment; there is no single
          revoke-everything and provider keys are rotated at the provider
        steps: &a1
          - title: Stop the agent and its schedules
            body:
              - hermes gateway stop --all halts every profile's gateway service; hermes cron pause <job> and /loop stop or
                /heartbeat pause halt the unattended triggers; the terminal tool is guarded from stopping its
                own supervised gateway.
            url: https://hermes-agent.nousresearch.com/docs/reference/cli-commands
          - title: Cut off a sender
            body:
              - hermes pairing revoke <platform> <user-id> removes a paired user; hermes pairing clear-pending drops
                outstanding codes.
            url: https://hermes-agent.nousresearch.com/docs/reference/cli-commands
          - title: Invalidate sandbox credentials
            body:
              - hermes egress setup --rotate-tokens mints fresh proxy tokens and hermes egress stop kills the daemon so
                old tokens stop working; restart running sandboxes too.
            url: https://hermes-agent.nousresearch.com/docs/reference/cli-commands
          - title: Undo file damage
            body:
              - "With checkpoints.enabled: true Hermes snapshots the project before destructive operations into
                ~/.hermes/checkpoints/store/; /rollback diff <N> previews and /rollback <N> restores."
            url: https://hermes-agent.nousresearch.com/docs/user-guide/checkpoints-and-rollback
        note: >-
          Decommissioning means deleting the profile directory yourself and rotating every provider and
          platform token it held; quarantine from peers is only A2A_TRUSTED_PEERS on the other agents.
        verified: 2026-09-10
        migration:
          from:
            - capabilityKillSwitch
          reviewRequired: false
          original:
            - capability: capabilityKillSwitch
              coverage: partial
              mechanism: >-
