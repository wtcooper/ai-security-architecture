# CrewAI: one entity per product × reference architecture. Facts are dated (asOf) and cite the vendor's
# own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# Scope: the open-source crewai and crewai-tools Python packages (Agents, Crews, Flows, Memory, Knowledge, MCP,
# A2A, execution hooks) on the multi-agent workflow drawing, with CrewAI AMP (Agent Management Platform) as a
# variant where it is the documented way to deploy, trace and govern crews. Its rows carry requires: CrewAI AMP.
# Exclusions: Crew Studio and Flows in Studio (no-code builders), the CopilotKit / AG-UI frontend and Channels
# guides, training (crewai train) beyond the trained-agents file it leaves behind, and the third-party
# observability and tool integrations listed in the docs. The Code Interpreter page is still published, but the
# tool is removed and allow_code_execution / code_execution_mode are deprecated; neither is recommended here.
# 2026-11-21: onboarded. Read as Markdown (<page>.md, all 200) from docs.crewai.com/v1.15.44/en/: introduction,
# installation, concepts (agents, agent-capabilities, tasks, crews, flows, production-architecture, knowledge,
# skills, llms, files, processes, collaboration, memory, planning, testing, cli, tools, event-listener,
# checkpointing, streaming, artifacts, training), mcp (overview, dsl-integration, stdio, sse, streamable-http,
# multiple-servers, security), tools (overview, file-document/filereadtool, filewritetool, urlreadtool,
# directoryreadtool, web-scraping/scrapewebsitetool, ai-ml/codeinterpretertool, daytona, e2bsandboxtools),
# observability (tracing, overview), learn (execution-hooks, llm-hooks, tool-hooks, execution-boundary-hooks,
# step-hooks, human-in-the-loop, human-feedback-in-flows, human-input-on-execution, hierarchical-process,
# custom-manager-agent, coding-agents, create-custom-tools, a2a-agent-delegation), guides (flows/mastering-flow-state,
# flows/conversational-flows, advanced/fingerprinting), telemetry, changelog and api-reference (kickoff, resume,
# status); and from docs-platform.crewai.com/platform/en/: introduction, features (automations, agent-repositories,
# tools-and-integrations, pii-trace-redactions, a2a, traces, hallucination-guardrail, flow-hitl-management, jit-sso,
# rbac, agent-control-plane overview / monitoring / policies, secrets-manager overview / usage / aws-workload-identity),
# guides (deploy-to-amp, prepare-for-deployment, private-package-registry, kickoff-crew, capture_telemetry_logs,
# vertex-ai-workload-identity-setup, tool-repository, custom-mcp-server, human-in-the-loop), FAQ; plus
# docs-platform.crewai.com/api/service-account and the AMP API index.
# Fetch log: unversioned docs.crewai.com/en/<page> answers 307 to /v1.15.44/en/<page>, so the versioned URL is
# cited. learn/a2a-agent-delegation answers 200 at v1.15.44 but is not listed in the docs index (it was listed at
# v1.10.0). pypistats.org answered 429 once, then 200. api.github.com refused (session bound to other
# repositories) and github.com refused curl, but WebFetch read the crewAI security-advisories page and the GitHub
# Advisory Database entries cited; OSV (api.osv.dev) lists only GHSA-mr4r-hcgx-8p4h for crewai-tools.
# Conflicts recorded in the rows: allow_delegation defaults to False on the Agents page and "(default: True)" in
# the AMP FAQ; the repeated-call stop counts consecutive calls on the Tools page and the whole task on the Agents
# page; the Coding Agents page still documents allow_code_execution=True; the Secrets Manager usage page describes
# the older custom-role model that RBAC v2 replaced; max_iter defaults to 20 on the Agents page and 25 in the
# 1.15.44 source (agents/agent_builder/base_agent.py, read from the PyPI wheel and the 1.15.44 tag).
# 2026-11-21 (new pins): AML.M0037 (partial) and AML.M0012 (partial) rows after the multi-agent pattern pinned them,
# from docs.crewai.com v1.15.44 concepts/flows and the agents and MCP rows read the same day.
vendor: crewai
family: CrewAI
tools:
  - id: toolCrewAi
    name: CrewAI
    surfaceClasses:
      - sdkFramework
    variants:
      - name: "crewai (Python): Agents, Crews, Flows, Memory, Knowledge, MCP client, A2A client and server"
        class: sdkFramework
        url: https://docs.crewai.com/v1.15.44/en/introduction
      - name: "crewai-tools (Python): file, web, RAG and E2B / Daytona sandbox tools with the SSRF and path guard"
        class: sdkFramework
        url: https://docs.crewai.com/v1.15.44/en/tools/overview
      - name: "CrewAI AMP (Agent Management Platform): deployment, traces, RBAC, Secrets Manager, HITL, Agent Control Plane"
        class: sdkFramework
        url: https://docs-platform.crewai.com/platform/en/introduction
    architecture: archAgentWorkflow
    fills: [harness, orchestration, subagents]
    builder:
      kind: framework
      what: "Open-source Python framework for teams of role-playing agents (Crews) run inside event-driven, stateful workflows (Flows); any model."
      languages: ["Python"]
      usage:
        downloads: 2559771
        registry: PyPI
        package: crewai
        asOf: "2026-11"
        url: https://pypistats.org/packages/crewai
      also:
        - architecture: archChatAgent
          fills: [agent]
          url: https://docs.crewai.com/v1.15.44/en/guides/flows/conversational-flows
        - architecture: archActionAgent
          fills: [planner]
          url: https://docs.crewai.com/v1.15.44/en/concepts/agents
        - architecture: archAgentFederation
          fills: [harness]
          url: https://docs.crewai.com/v1.15.44/en/learn/a2a-agent-delegation
    status: ga
    asOf: "2026-11"
    summary:
      - >-
        An open-source (MIT) Python framework, crewai 1.15.44 (2026-11-19), that runs multi-agent work inside the
        customer's own process. Crews are teams of role-playing agents with tools, run in a sequential or
        hierarchical process (a manager agent built from manager_llm or manager_agent allocates tasks and validates
        their results), with optional delegation between agents. Flows are event-driven, stateful workflows whose
        steps call crews or agents, persist state (@persist, SQLite by default), write checkpoints and pause for
        human feedback. Agents call any model through native SDK integrations or LiteLLM, use crewai-tools, MCP
        servers and AMP-connected apps, and can delegate to, or serve as, Agent2Agent (A2A) peers.
      - >-
        State stays where the deployer puts it: memory in LanceDB under ./.crewai/memory, knowledge in a local
        Qdrant per process, checkpoints as JSON under ./.checkpoints, flow state in SQLite; the docs describe no
        encryption at rest for any of them. Leaving the process: prompts and tool results to the model provider,
        memory content to the configured LLM and embedder (OpenAI by default), anonymous telemetry (agent roles,
        tool names) to CrewAI unless disabled, traces to CrewAI AMP only after consent or an authenticated export,
        and task descriptions, inputs and outputs when share_crew is on.
      - >-
        Most controls are code the deployer writes: @on execution hooks at kickoff, step, model-call and tool-call
        points that stop an operation with HookAborted (and fail open on any other exception), task guardrails,
        @human_feedback, max_iter, max_execution_time and max_rpm, MCP tool filters and memory scopes. The switches
        are few: the crewai-tools SSRF and path guard, CREWAI_DESERIALIZE_CALLBACKS and the telemetry variables.
        CrewAI AMP adds the administrator surface: RBAC v2, JIT SSO and service accounts, Secrets Manager with
        Workload Identity (beta), Flow HITL management, PII redaction for traces and cost alerts in the Agent
        Control Plane (beta), OpenTelemetry export and A2A server authentication (early release).
    facts:
      - label: Plans
        value: >-
          Free MIT-licensed packages (uv add crewai, 'crewai[tools]', 'crewai[a2a]'). CrewAI AMP has a free account
          at app.crewai.com; PII Redaction policies need the Enterprise or Ultra plan, and LLM workload identity and
          JIT SSO are Enterprise SaaS features enabled by the CrewAI account team.
        url: https://docs-platform.crewai.com/platform/en/features/agent-control-plane/policies
      - label: Inference & routing
        value: >-
          Native SDK integrations for OpenAI, Anthropic, Google Gemini, Azure, AWS Bedrock and Snowflake Cortex;
          every other provider through the crewai[litellm] extra. An agent with no llm uses OPENAI_MODEL_NAME or the
          documented default model; LLM(base_url=...) or OPENAI_BASE_URL sends calls to a gateway.
        url: https://docs.crewai.com/v1.15.44/en/concepts/llms
      - label: Data leaving the device
        value: >-
          Prompts, tool results and files to the model provider; memory content to the configured LLM for scope and
          importance analysis and to the embedder (OpenAI text-embedding-3-large by default); anonymous telemetry
          (versions, agent roles, tool names, counts) to CrewAI unless CREWAI_DISABLE_TELEMETRY is set; traces with
          prompts, inputs and outputs to AMP only after the consent prompt or an authenticated export; full task
          content with share_crew.
        url: https://docs.crewai.com/v1.15.44/en/telemetry
      - label: Retention & training
        value: >-
          share_crew shares complete crew information and execution with CrewAI "to make the library better, and
          allow us to train models" (off unless set). Local memory, checkpoints and flow state persist until reset
          or deleted (memory.reset(), crewai reset-memories, max_checkpoints); knowledge sits in a temporary Qdrant
          folder per process that is removed at exit unless a fixed path is set. AMP trace retention is not stated
          on the pages read.
        url: https://docs.crewai.com/v1.15.44/en/concepts/crews
      - label: Docs index
        value: >-
          docs.crewai.com (versioned, with llms.txt) for the framework and docs-platform.crewai.com for CrewAI AMP
          and its Platform API.
        url: https://docs.crewai.com/llms.txt
      - label: Latest release
        value: >-
          crewai and crewai-tools 1.15.44, published to PyPI on 2026-11-19; Python >=3.10 and <3.14.
        url: https://pypi.org/project/crewai/
      - label: Security policy
        value: >-
          The crewAIInc/crewAI repository publishes a security policy and one repository advisory
          (GHSA-wp6h-6xxh-g8fp, 2026-11-19); the other 2026 entries are in the GitHub Advisory Database, most of
          them unreviewed and without a fixed version.
        url: https://github.com/crewAIInc/crewAI/security/advisories
    items:
      - title: Lock the crewai-tools guards on shared workers
        body:
          - >-
            The file tools confine paths to base_dir and the URL tools refuse private, loopback, link-local and
            reserved addresses, but CREWAI_TOOLS_ALLOW_UNSAFE_PATHS=true switches both off for the whole process. Set
            CREWAI_TOOLS_FORCE_SAFE_PATHS=true on managed workers so a tenant cannot export the escape hatch, and keep
            CREWAI_TOOLS_ALLOWED_PRIVATE_HOSTS empty there.
        links:
          - title: File Read (allowed paths)
            url: https://docs.crewai.com/v1.15.44/en/tools/file-document/filereadtool
          - title: URL Read (network safety)
            url: https://docs.crewai.com/v1.15.44/en/tools/file-document/urlreadtool
      - title: Decide where traces go before the first run
        body:
          - >-
            The first interactive run asks "Share this execution trace with CrewAI? [y/N]" and a yes uploads the
            buffered trace, prompts included. Set tracing on the Crew or Flow (or CREWAI_TRACING_ENABLED) explicitly,
            and wrap executions in telemetry_session with the firm's OpenTelemetry provider so spans reach its own
            collector.
        links:
          - title: CrewAI Tracing
            url: https://docs.crewai.com/v1.15.44/en/observability/tracing
    riskNotes:
      - risk: riskPromptInjection
        note: >-
          CrewAI's MCP security page warns that a malicious server's tool descriptions inject instructions as soon as
          the tools are listed, with no tool call. With memory=True each task's output is distilled into facts that
          are recalled into later tasks' prompts, and agents load trained suggestions from trained_agents_data.pkl in
          the working directory as mandatory instructions.
      - risk: riskOrchestratorRouteHijacking
        note: >-
          In a hierarchical crew the manager agent allocates tasks among all agents by model judgement. A2A on AMP
          routes a crew-level request to the agent named in client-supplied target_agent metadata, or to the first
          agent; @human_feedback with emit maps a free-text reply to the next route with an LLM.
      - risk: riskAgenticDelegationConfusedDeputy
        note: >-
          allow_delegation gives an agent Delegate work to coworker and Ask question to coworker tools; the coworker
          acts with its own tools on text the delegating agent wrote. The docs disagree on the default (False on the
          Agents page, True in the AMP FAQ), so set it on every agent.
      - risk: riskInsecureIntegratedComponent
        note: >-
          crewai-tools' URL guard (validate_url, added after CVE-2026-2286 let the RAG tools fetch internal URLs) was
          bypassed or skipped three more times in 2026 (CVE-2026-62240, CVE-2026-112308, CVE-2026-120630), and the
          in-process CodeInterpreterTool was removed after its fallback sandbox allowed code execution
          (CVE-2026-2275, CVE-2026-2287). Pin crewai and crewai-tools to current releases.
      - risk: riskRunawayAgentToolLoops
        note: >-
          max_iter (20 on the Agents page, 25 in the 1.15.44 source) forces a best answer when reached. Five identical
          tool calls with identical results end the loop, a fixed limit the docs describe two ways: consecutive calls,
          then a forced final answer under tool_failure_policy (Tools page, as the source does), or any five in the
          task, then ToolExecutionFailedError whatever the policy (Agents page). No token or cost budget stops a run,
          and AMP Cost Limit policies only send email.
      - risk: riskSensitiveDataDisclosure
        note: >-
          A checkpoint holds the full crew, flow or agent state with inputs, memory and outputs (JSON under
          ./.checkpoints by default), and memory content is sent to the configured LLM for analysis. No encryption at
          rest is documented, and AMP's PII redaction applies to traces only.
      - risk: riskRetrievalVectorStorePoisoning
        note: >-
          Every Flow gets a Memory() by default, stored in LanceDB on disk and recalled across runs; @human_feedback
          learn=True stores lessons from reviewer replies and rewrites later output with them before review.
    controls:
      - mitigation: AML.M0031
        coverage: partial
        mechanism: >-
          Memory scopes and read-only slices, private records keyed by source, the storage path
          (./.crewai/memory, CREWAI_STORAGE_DIR or Memory(storage=...)) and reset / forget; Flow @persist (SQLite by
          default) and CheckpointConfig snapshots; the CREWAI_DESERIALIZE_CALLBACKS guard; the trained-agents file
        steps:
          - title: Scope memory per agent and per tenant
            body:
              - >-
                Give each agent memory=memory.scope("/agent/<role>"), give agents that only recall a
                memory.slice(scopes=[...], read_only=True), save each user's records with source="user:<id>" and
                private=True, and set CREWAI_STORAGE_DIR (or storage=) per tenant.
            url: https://docs.crewai.com/v1.15.44/en/concepts/memory
          - title: Keep state files from loading code or instructions
            body:
              - >-
                Leave CREWAI_DESERIALIZE_CALLBACKS unset, write checkpoints to a CheckpointConfig location only the
                workload can write, with max_checkpoints, and pin trained_agents_file (CREWAI_TRAINED_AGENTS_FILE) to a
                reviewed file or keep none in the working directory.
            url: https://docs.crewai.com/v1.15.44/en/concepts/checkpointing
          - title: Persist flow state per tenant and check ownership on resume
            body:
              - >-
                Pass a FlowPersistence backend per tenant to @persist, and authorise the caller before
                kickoff(restore_from_state_id=...) or Flow.from_pending(flow_id).
            url: https://docs.crewai.com/v1.15.44/en/concepts/flows
        note: >-
          Partial by the rule for this drawing (as toolClaudeAgentSdk): scoping, deletion and the storage location
          are configuration, but nothing validates what a step writes. With memory=True the crew extracts facts from
          every task output and recalls them into the next task's prompt; Flows get a Memory() by default backed by
          LanceDB on disk that persists across runs; the LLM infers a scope when none is given; HITL learn=True
          stores distilled lessons. A checkpoint holds the full crew state, inputs, memory and outputs as JSON or
          SQLite, and no encryption at rest is documented for checkpoints, flow state or memory. Agents load trained
          suggestions from trained_agents_data.pkl in the working directory and append them to task prompts as
          mandatory instructions. GHSA-wp6h-6xxh-g8fp (fixed 1.15.31) was a bypass of the deserialisation guard.
        verified: "2026-11-21"
      - mitigation: cap-staged-rollout-gate
        coverage: partial
        mechanism: >-
          crewai test (the crew run for N iterations and scored 1 to 10 per task and for the crew by a model) as a
          regression run in CI; versioned skill references (@org-uuid/name@version) and Agent Repository skill pins;
          no release gate or rollback in the framework or the AMP pages read
        steps:
          - title: Score each change in the release pipeline
            body:
              - >-
                Run crewai test --n-iterations N --model <scoring model> on the candidate crew in CI (the crew runs on
                its own models; --model is the judge that scores it, OpenAI only per the Testing page) and fail the
                release below the agreed crew score.
            url: https://docs.crewai.com/v1.15.44/en/concepts/testing
          - title: Pin skill versions
            body:
              - >-
                Reference registry skills as @<org-uuid>/<name>@<version> so a newly published version reaches agents
                only when the pin is moved in a reviewed change.
            url: https://docs.crewai.com/v1.15.44/en/concepts/skills
        note: >-
          Partial, one step above the OpenAI Agents SDK and Claude Agent SDK (external), because a model-backed,
          scored test run ships that a CI job can gate on; the OpenAI testing utilities make no model requests.
          crewai test scores output quality, not leakage or backdoor triggers, and the protected test set, the
          threshold and the release decision are the deployer's; it gates nothing itself. An unpinned skill
          reference resolves to the newest published version. AMP's Redeploy replaces the running automation; no
          staged rollout or rollback is documented on the pages read.
        verified: "2026-11-21"
      - mitigation: cap-agent-tracing
        coverage: native
        mechanism: >-
          The CrewAIEventsBus (crew, agent, task, tool, MCP, LLM, guardrail, memory, human-feedback, A2A and
          HookDispatchedEvent events); telemetry_session (crewai.telemetry.tracing) building OpenTelemetry spans on
          the host's providers and processors; built-in tracing to AMP after consent or an authenticated export;
          AMP OpenTelemetry Collectors exporting traces and logs with principal attributes
        steps:
          - title: Export spans to your own collector
            body:
              - >-
                Wrap each execution in telemetry_session(providers=..., processors=...) with the firm's OpenTelemetry
                provider and exporter; spans keep their timestamps, parents and HITL pause and resume links.
            url: https://docs.crewai.com/v1.15.44/en/observability/tracing
          - title: Export AMP runs
            body:
              - >-
                In AMP open Settings > OpenTelemetry Collectors > Add Collector, add OpenTelemetry Traces and
                OpenTelemetry Logs with the collector endpoint and an authentication header.
            url: https://docs-platform.crewai.com/platform/en/guides/capture_telemetry_logs
          - title: Listen for the security events
            body:
              - >-
                Register a BaseEventListener for ToolUsage, MCPToolExecution, LLMGuardrail, HumanFeedback and A2A
                events and forward them to the SIEM.
            url: https://docs.crewai.com/v1.15.44/en/concepts/event-listener
        note: >-
          Native on the rule applied to toolClaudeAgentSdk and toolOpenaiAgentsSdk: every model call, tool call,
          task or flow step, guardrail, memory operation, approval and delegation emits an event, and spans reach the
          customer's store through telemetry_session or AMP's collector export, which adds crewai.principal.id and
          enduser.id. Limits: the built-in tracing exports to CrewAI AMP and stays off until consent; the host owns
          redaction in telemetry_session; anonymous usage telemetry runs on a private TracerProvider and never
          reaches the customer's collector; emission is not tamper resistance, so retention and integrity are the
          collector's.
        verified: "2026-11-21"
      - mitigation: D3-APA
        coverage: partial
        mechanism: >-
          AMP RBAC v2 grants (principal, role, scope), teams with JIT SSO group mappings, service accounts, the
          deployment's Bearer Token and User Bearer Token on the kickoff API; in the framework only hooks
          (EXECUTION_START) that can abort a run
        steps:
          - title: Grant running and approving by team
            body:
              - >-
                In AMP Settings > Teams give Automation Operator on each automation to the owning team, keep
                Automation Builders and Identity and Access Admin to a named few, and map IdP groups to those teams.
            url: https://docs-platform.crewai.com/platform/en/features/rbac
          - title: Gate self-hosted runs at kickoff
            body:
              - >-
                Register an @on(InterceptionPoint.EXECUTION_START) hook that checks the caller's grant passed in the
                inputs and raises HookAborted when it is missing.
            url: https://docs.crewai.com/v1.15.44/en/learn/execution-hooks
        note: >-
          Partial, on the rule applied to toolOpenaiAgentsSdk (an attach point in the framework). AMP enforces who
          may see, run, edit, share and approve each automation; access only adds up, Organization scope covers
          resources created later, and new members start with none. But the deployment's organisation-level Bearer
          Token gives full crew operations to whoever holds it and is attributed as type unknown; JIT SSO is not SCIM,
          so a removed user keeps existing access until reconciled; Identity and Access Admin can grant itself any
          role. In the framework nothing decides who may kick off, resume (Flow.from_pending, restore_from_state_id)
          or stop a run: the Agents page says a session ID identifies state and applications must still authorise
          access to persisted sessions.
        verified: "2026-11-21"
      - mitigation: D3-AA
        coverage: partial
        mechanism: >-
          AMP service accounts (client credentials exchanged for one-hour opaque tokens, rotatable); A2A server
          authentication (SimpleTokenAuth from AUTH_TOKEN by default; OIDCAuth, OAuth2ServerAuth, APIKeyServerAuth,
          MTLSServerAuth and EnterpriseTokenAuth on AMP) and per-peer A2A client auth; per-agent LLM and MCP
          credentials; component fingerprints as labels
        steps:
          - title: Authenticate inbound A2A callers
            body:
              - >-
                Set A2AServerConfig(auth=...) to OIDCAuth or MTLSServerAuth on AMP; outside AMP keep SimpleTokenAuth
                only with a long random AUTH_TOKEN from the secret manager behind the firm's gateway.
            url: https://docs-platform.crewai.com/platform/en/features/a2a
          - title: Give each API caller a service account
            body:
              - >-
                Create one in AMP Settings > Service Accounts, exchange its client credentials at /oauth/token for a
                one-hour token, and rotate the secret on a schedule.
            url: https://docs-platform.crewai.com/api/service-account
        note: >-
          Partial by the rule for this drawing: nothing mints or authenticates an identity per agent. Fingerprints
          give each Agent, Crew and Task a UUID that cannot be set by hand, but they are audit labels, not
          principals; every agent in a crew runs in one process with one environment. An agent can hold its own
          LLM key and MCP headers, but minting and revoking them is the application's. The open-source A2A server
          defaults to one static shared token; the stronger schemes are AMP's and marked early release.
        verified: "2026-11-21"
      - mitigation: D3-CH
        coverage: partial
        mechanism: >-
          Provider keys from the environment (.env) or LLM(api_key=...); base_url to a key-holding gateway; AMP
          Secrets Manager referencing AWS Secrets Manager, Google Cloud Secret Manager or Azure Key Vault with static
          credentials or Workload Identity (beta); Vertex AI workload identity minted per execution (early access)
        steps:
          - title: Hold the provider key at the gateway
            body:
              - >-
                Construct LLM(model=..., base_url=<gateway>, api_key=<gateway credential>) and inject that credential
                from the secret manager, never in roles, goals, backstories, task descriptions or inputs.
            url: https://docs.crewai.com/v1.15.44/en/concepts/llms
          - title: Resolve secrets at kickoff on AMP
            body:
              - >-
                Configure Secrets Manager with Workload Identity, reference each secret by name under Environment
                Variables, and assign it only to the automations that need it.
            url: https://docs-platform.crewai.com/platform/en/features/secrets-manager/overview
        note: >-
          Partial by the rule for this drawing: the framework takes whatever key the environment or code gives it and
          brokers nothing per step. On AMP the Workload Identity path stores no static credential and resolves each
          secret into the process environment at every kickoff, while the static path bakes values into the
          deployment image; every Workload Identity configuration is organisation-wide, so each automation is
          bootstrapped against all of them. The MCP DSL examples put API keys in URL query strings and the stdio
          examples pass **os.environ to the server.
        verified: "2026-11-21"
      - mitigation: cap-agent-action-policy-enforcement
        coverage: partial
        mechanism: >-
          @on(InterceptionPoint.PRE_TOOL_CALL, tools=[...], agents=[...]) hooks reading ToolCallHookContext
          (tool_name, tool_input, agent, task, crew) and raising HookAborted; crew-scoped hooks on @CrewBase methods;
          PRE_STEP hooks; no declarative policy language
        steps:
          - title: Decide every consequential call in a hook
            body:
              - >-
                Register a global PRE_TOOL_CALL hook for tools that write, send or pay that checks the agent role, the
                tool and its arguments and raises HookAborted(reason, source) on a deny.
            url: https://docs.crewai.com/v1.15.44/en/learn/tool-hooks
          - title: Abort only with HookAborted
            body:
              - >-
                Raise HookAborted rather than any other exception: other exceptions in a hook are swallowed and the
                operation continues.
            url: https://docs.crewai.com/v1.15.44/en/learn/execution-hooks
        note: >-
          Partial on the rule applied to toolOpenaiAgentsSdk (policy functions the deployer writes): the hook runs
          outside the model before every tool execution in crews, flows and direct kickoff(), and a blocked call
          returns "Tool execution blocked by hook" to the agent. But the rules are the deployer's code, hooks fail
          open on any exception other than HookAborted, global hooks persist for the life of the process, and the
          decision is recorded only as a HookDispatchedEvent. Whether A2A delegations pass through PRE_TOOL_CALL is
          not documented.
        verified: "2026-11-21"
      - mitigation: AML.M0028
        coverage: partial
        mechanism: >-
