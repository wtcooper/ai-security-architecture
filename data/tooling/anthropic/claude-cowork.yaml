      - mitigation: AML.M0036
        coverage: native
        mechanism: >-
          Spend limits at Organization settings > Usage (organisation, group per-user, seat tier and individual)
          and pooled monthly group budgets (Enterprise, beta) that pause every member when exhausted; Team
          usage-credit spend limits
        steps:
          - title: Set group spend limits (Enterprise)
            body:
              - At Organization settings > Usage open the "By group/tier" tab, choose "Edit limits" on a group and
                set a Member limit; individual limits override group limits.
            url: >-
              https://support.claude.com/en/articles/13799932-manage-groups-and-group-spend-limits-on-enterprise-plans
          - title: Cap a team with a pooled budget (Enterprise, beta)
            body:
              - In the same "Edit limits" dialog set a Pooled monthly budget; when it runs out usage pauses for
                every member of the group, and $0 freezes the group.
            url: https://support.claude.com/en/articles/17005973-manage-pooled-group-budgets-on-enterprise-plans
          - title: Cap usage credits (Team and seat-based Enterprise)
            body:
              - At Organization settings > Usage set the organisation-wide monthly spend limit and per-user limits
                on usage credits.
            url: >-
              https://support.claude.com/en/articles/12005970-manage-usage-credits-for-team-and-seat-based-enterprise-plans
        note: >-
          Native by the rule: admin-set spend caps stop use when exhausted ("usage can go slightly over a limit
          before it pauses"). Not offered: a per-session or per-task budget, session duration or concurrency
          limits, or a cap on scheduled tasks; the pool is shared with chat and Claude Code, seat usage limits
          are vendor-fixed, and pooled budgets cannot be managed through the Admin API.
        verified: "2026-09-25"
      - mitigation: cap-input-guardrails
        coverage: partial
        mechanism: >-
          Anthropic's content classifiers scan untrusted content entering context (no administrator setting);
          Inference hooks (Enterprise, beta) hold each governed prompt and returned tool result, connector calls
          included, for an allow or deny verdict from the organisation's AI security server
        steps:
          - title: Put an inspector on returned tool content (Enterprise, beta)
            body:
              - At Organization settings > Data and privacy > Inference hooks turn on "Allow for your
                organization", register your AI security server, choose Failure handling and turn on "Enforce
                verdicts".
            url: https://platform.claude.com/docs/en/manage-claude/inference-hooks-configuration
          - title: Know what the vendor screening covers
            body:
              - Content classifiers scan all untrusted content entering Claude's context and flag potential
                injections; there is no setting or event export for them.
            url: https://support.claude.com/en/articles/13364135-use-claude-cowork-safely
        note: >-
          Partial on the rule applied to every vendor: vendor-internal screening that is not admin-configurable,
          and an inline hook that is an attach point until the organisation's server classifies. Hook verdicts
          are allow or deny only (no strip or quarantine) and system prompts and tool definitions are never sent.
          Connector content returning through the organisation's AI gateway on the tunnel path can be
          classified there as well.
        verified: "2026-09-25"
      - mitigation: cap-ai-vendor-assessment
        coverage: external
        mechanism: >-
          The Anthropic Trust Center (SOC 2 Type 2 and CSA STAR L2 report, ISO 27001 and ISO 42001
          certificates, 2025 annual penetration testing reports, SIG Lite and CAIQ questionnaires, Cowork
          security documents) and the Help Center architecture overview of cloud sessions feed the
          organisation's TPRM platform
        evidence:
          - title: Anthropic Trust Center (compliance scope table and resources, read 2026-09-25)
            url: https://trust.anthropic.com/
          - title: Claude Cowork architecture overview (cloud session architecture)
            url: https://support.claude.com/en/articles/14479288-claude-cowork-architecture-overview
          - title: What Certifications has Anthropic obtained?
            url: https://support.claude.com/en/articles/10015870-what-certifications-has-anthropic-obtained
        note: >-
          External by the rule applied to every vendor: the TPRM platform holds the questionnaire, evidence
          expiry and reassessment trigger. The Trust Center lists SOC 2 Type II, ISO 27001:2022, ISO/IEC
          42001:2023, HIPAA and CSA STAR for Claude Enterprise and Claude Team; its Cowork document is the
          desktop security architecture, so request the cloud-sandbox, egress-proxy and tenant-isolation claims
          explicitly. Reassess on the moving defaults: cloud sessions on by default for Team and the default
          execution place where allowed, Cowork not covered by zero data retention, a beta surface.
        verified: "2026-09-25"
      - mitigation: D3-AA
        coverage: partial
        mechanism: >-
          Sessions act under the member's own account and connector grants; scheduled runs are agent-owned
          sessions with an agent_id (cagt_) and started_by_user in the Compliance API
        steps:
          - title: Inventory agent-owned runs
            body:
              - Query /v1/compliance/apps/sessions/remote without user_ids[], since that filter excludes agent-owned
                sessions, and read agent_id and started_by_user.
            url: https://platform.claude.com/docs/en/manage-claude/compliance-sessions
          - title: Revoke through the member
            body:
              - Remove the Cowork in the cloud capability from the member's custom role at Organization settings >
                Roles, or remove the member from the mapped IdP group so the next SCIM sync drops it.
            url: https://support.claude.com/en/articles/13930458-set-up-role-based-permissions-on-enterprise-plans
        note: >-
          Partial by the rule: the session authenticates as the member and carries attribution only; the agent
          id on scheduled runs is an identifier in the transcript record with no documented separate issuance,
          authorisation or revocation, so revoking the agent means removing the member's access or deleting the
          task. Connector actions appear in the connected service as the member.
        verified: "2026-09-25"
      - mitigation: D3-CH
        coverage: partial
        mechanism: >-
          Session-scoped sandbox tokens that expire within hours; connector tokens held server-side and, under
          managed authorisation, issued and revoked by the IdP; MCP tunnels (Enterprise research preview) with a
          rotatable, revocable tunnel token and a CA the organisation holds; no store for secrets a task needs
        steps:
          - title: Rotate and revoke the tunnel credentials
            body:
              - Revoke the Tunnels API key at Organization settings > Tunnels > Tunnels API after setup, rotate the
                tunnel token by incrementing tunnel.tokenVersion (Helm) or --token-version (Compose), and archive
                the tunnel to invalidate its token.
            url: https://claude.com/docs/connectors/mcp-tunnels/setup
          - title: Issue connector credentials through the IdP
            body:
              - Set up Managed authorization on supported connectors at Organization settings > Connectors so the
                IdP sets token lifetime and deprovisioning revokes access.
            url: https://support.claude.com/en/articles/15537633-authorize-mcp-connectors-for-your-entire-organization
        note: >-
          Partial by the rule: a vendor tunnel exists and its credentials are scoped, rotatable and revocable
          (outbound-only cloudflared plus proxy, inner TLS with a CA generated in your environment, a server
          certificate valid 90 days and renewed locally, rotation that does not sever established connections),
          and sandbox tokens are short-lived, but Cowork offers no encrypted, write-only store for secrets a
          task needs, so anything a member pastes or saves to the account is readable by the model. Tunnels are
          an Enterprise research preview by request, with Cloudflare as subprocessor.
        verified: "2026-09-25"
