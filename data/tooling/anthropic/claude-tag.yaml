              steps:
                - title: Inventory what Claude can do and does
                  body:
                    - Review the Access bundles page (Active / Never used per credential), the Audit page tabs
                      at claude.ai/admin-settings/claude-tag/audit, and the per-channel Access summary.
                  url: https://claude.com/docs/claude-tag/admins/audit
              note: The Audit page, Access bundles and analytics are inputs to governance; there is no intake, risk
                decision, ownership or lifecycle workflow in the product. Rated external on the same rule as
