id: supplyChain            # the key feed items and deep dives carry in `category`
slug: poisoned-supply-chain         # its address: /incidents/poisoned-supply-chain/
order: 2
name: "Poisoned supply chain"
short: "A package, model, plugin, skill, extension or release the AI system trusts arrives with an attacker's code in it."
since: 2026-11-25
overview: >-
  AI systems are assembled from code their operators did not write: gateways and frameworks from
  PyPI, models from Hugging Face, plugins, skills, MCP servers and browser extensions. Each runs
  with the rights of the host that loads it, and much of it runs at install or load time, before
  anything is imported or reviewed. In 2026 hijacked releases of the LiteLLM gateway and Microsoft
  Agent Framework carried credential stealers for an hour or two, fake Qwen2 test models ran
  miners on GPU hosts, and a worm planted agent hooks in GitHub repositories. At stake are the
  provider, cloud and CI keys those hosts hold. Pinning, admission scanning and a short route out
  decide whether a bad version matters.
howItWorks:
  - "An attacker publishes or takes over something the AI system installs: a package, model repository, plugin, skill, MCP server, extension or release."
  - "The route is often a stolen publishing credential, a lookalike name, or an artefact built to pass the registry's scanners."
  - "Its code runs as soon as it is installed, loaded or opened: a .pth startup hook, auto_map loader code, a session-start hook, an extension script."
  - "It runs with the host's rights and takes what is there: provider keys, cloud and CI tokens, GPU time, a way back in."
signs:
  - "A new version that adds a startup hook, install script or model loader code the previous one did not have."
  - "A model or package from an account days old, or a pinned plugin whose checkout does not match its pin."
  - "Build hosts, gateways or GPU hosts calling webhook sites, lookalike domains or mining pools."
stops:
  - control: D3-FA
    how: "Admission scanning at your mirror flags what runs at install or load: .pth startup hooks, auto_map loader code, hooks written into .claude/ or .vscode/."
  - control: AML.M0014
    how: "Install by digest and verified provenance, so a release from a lookalike build, an unreviewed model revision or a swapped plugin commit never loads."
  - control: cap-staged-rollout-gate
    how: "New versions soak before production; LiteLLM 1.107.0 and agent-framework 1.26.1 were pulled within hours, before a gated upgrade would take them."
  - control: cap-agent-tool-registry
    how: "Plugins, MCP servers and extensions come from an admitted list by identifier and pinned version, and an upstream bump is reviewed before auto-update."
  - control: AML.M0023
    how: "A bill of materials answers within the hour which hosts ran the bad version or loaded the bad repository, and whose keys they held."
  - control: D3-NI
    how: "Gateways and serving hosts reach their backends and your mirror only, so the stealer cannot post to its lookalike domain and the miner finds no pool."
risks: [riskInsecureIntegratedComponent, riskToolSourceProvenance, riskToolRegistryTampering, riskModelSourceTampering, riskMaliciousLoaderDeserialization]
owasp: [LLM04:2026, ASI04, MCP03:2025, MCP04:2025]
atlas: [AML.T0010.001, AML.T0010.003, AML.T0010.005, AML.T0011.000, AML.T0011.001, AML.T0109]
notSameAs:
  - pattern: exploitedSoftware
    why: "A flaw in software as its maker shipped it is exploited software; supply chain is when the artefact itself arrives carrying the attacker's code."
  - pattern: promptInjection
    why: "An instruction file that works only if the agent obeys it is prompt injection; a hook or loader that runs as code is supply chain."
  - pattern: identity
    why: "A stolen publishing token that ships a poisoned release is supply chain; a stolen key used to call models or read AI data is stolen credentials."
