  - id: agentcorruption-agentcore
    date: 2026-10-08
    title: "AgentCorruption: one prompt to an exposed AgentCore agent yields a role over every agent in the region"
    summary: >
      Zenity Labs showed that one prompt could make an exposed AgentCore agent's HTTP tool fetch the instance
      metadata endpoint, and the default execution role it returned spanned every AgentCore agent in the
      account and region, with their conversations, memories and Secrets Manager secrets. AWS moved AgentCore
      to IMDSv2 and narrowed the role by 29 September, while calling the behaviour "documented and expected".
    category: promptInjection
    perspective: target
