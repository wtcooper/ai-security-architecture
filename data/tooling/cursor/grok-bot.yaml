# Grok Bot — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# 2026-09-15: added sandboxing, egress, runtime enforcement, credential isolation and MCP rows after the managed-runtime drawing pinned them; fetched grok-bot/teams, security, security-faq, private-networks (all 200).
# 2026-09-25: re-verified toolGrokBot against the MITRE capability rules; no redirects or failures (all cursor.com, docs.x.ai
# and x.ai URLs 200; docs read through the .md variants, e.g. cursor.com/docs/grok-bot/teams.md).
# 2026-10-03: persistent-agent mapping; Team Bot authority/approval and opt-in MCP Tool I/O refreshed.
# Removed D3-AA, D3-EI and input-guardrail rows from this reference; assurance limits remain in items.
vendor: cursor
family: Grok Bot
tools:
  - id: toolGrokBot
    name: Grok Bot
    surfaceClasses:
      - managedRuntime
      - chatIntegration
    variants:
      - name: Grok Bot personal agents in Cursor
        class: managedRuntime
        url: https://cursor.com/docs/grok-bot
      - name: Grok Bot Team Bots
        class: managedRuntime
        url: https://docs.x.ai/grok-bot/team-bots
        note: Shared team setup and memory; personal OAuth follows the caller, while configured keys and secrets
          can serve the whole team. Availability varies by account.
      - name: Grok Bot in Slack
        class: chatIntegration
        url: https://cursor.com/docs/grok-bot/teams
    architecture: archPersistentManagedAgents
    status: beta
    asOf: "2026-10"
    summary:
      - Persistent personal and Team Bots operated by Cursor. Personal Bots belonging to one user share a
        hosted computer, files and browser sessions across tasks. Team Bots add shared setup and memory,
        with separate private conversations and channel-specific computer and approval behavior.
      - Backend connectors, signed-in browsers, optional local commands and desktop network routing have
        separate authority boundaries. Enterprise network policy and connector policy must be configured
        separately. Terminating compute preserves durable state and does not revoke access.
      - Enterprise administration includes access controls, Action Recording and Auto-review enforcement.
        Automated review screens selected actions; it does not establish human approval or complete
        coverage of memory writes. Existing controls retain their individual verification dates; this
        October refresh covers placement, Team Bots and telemetry.
    facts:
      - label: Plans
        value: >-
          Early beta from 2026-08-11 for Cursor Ultra, SuperGrok Heavy and Cursor Teams Premium, widened on
          2026-08-26/27 to all SuperGrok, Cursor Pro and Cursor Teams plans (Cursor's docs now say every paid
          individual Cursor plan, Cursor Teams, or a linked individual SuperGrok, SuperGrok Plus, SuperGrok Heavy
          or X Premium+ subscription, with weekly usage). Most organisational controls are Enterprise only (the
          enable switch, Network Controls, Team Setup, Team Secrets, Action Recording, Enforce Auto-review, audit
          logs, OpenTelemetry Export, SCIM); Team Rules, Cloud Agent delegation, template sharing and the
          local-execution ceiling are on Teams too, and on self-serve Teams Grok Bot cannot be switched off.
        url: https://x.ai/news/grok-bot-more-plans
      - label: Inference & routing
        value: >-
          Cursor's hosted providers; Privacy Mode terms apply uniformly, including to Grok 4.5. Computers run
          in the United States today; custom residency requires the account team.
        url: https://cursor.com/docs/grok-bot/security
      - label: Data leaving the device
        value: >-
          Mostly nothing runs locally: files, browser sessions, memory and shell state live on the cloud
          computer, except commands and file transfers a Bot runs on the member's machine through the desktop
          app (per-command approval by default); connector tokens stay on Cursor's backend and are never stored
          on the computer; internet egress uses shared ranges that identify Grok Bot traffic rather than your
          team.
        url: https://cursor.com/docs/grok-bot/private-networks
      - label: Data retention / training
        value: >-
          Deletion follows the DPA — data is deleted or returned within 30 days of written direction after the
          service ends; Bot memory and files persist across sessions by design. Privacy Mode means code is not
          used for training.
        url: https://cursor.com/docs/grok-bot/security
      - label: Docs index
        value: >-
          Grok Bot documentation (overview, Teams and Enterprise, security, security FAQ, private networks,
          settings).
        url: https://cursor.com/docs/grok-bot
      - label: Isolation
        value: >-
          Personal Bots share a per-user Firecracker computer. Team Bot private conversations normally
          use the participant’s computer; shared Slack/group work uses a Team Bot computer. Verify the
          applicable conversation mode rather than assuming per-Bot isolation.
        url: https://docs.x.ai/grok-bot/team-bots
      - label: Vendor ownership
        value: >-
          Grok Bot is the first joint product after SpaceX's acquisition of Anysphere (closed 2026-08-14); the
          SpaceXAI docs mirror Cursor's and state that Anysphere operates the service.
        url: https://docs.x.ai/grok-bot/security
    riskNotes:
      - risk: riskPromptInjection
        note: >-
          Pages, messages and shared memory can carry hostile instructions. Signed-in browsers and
          permitted connectors expose downstream authority; automated action review does not eliminate
          injection or replace destination authorization.
      - risk: riskAgenticDelegationConfusedDeputy
        note: >-
          Personal OAuth authority and Team Bot shared credentials differ. Check the caller, channel
          audience and effective destination credential before any action or delegation; shared secrets
          can authorize every teammate.
      - risk: riskSensitiveDataDisclosure
        note: >-
          Persistent memory, files and browser sessions accumulate on a US-hosted computer that all of
          the user's Bots share; Action Recording is off by default, so what a Bot did with that data is
          not recorded unless an admin turns it on.
      - risk: riskShadowAndUnknownAgents
        note: >-
          Grok Bot is bundled with individual paid plans, so members with personal accounts get it
          outside the organisation's switch; AllowedTeamId on managed devices and the org-wide switch
          with Manage Group Access are the containment.
    items:
      - title: Separate personal authority from shared Team Bot resources
        body:
          - Team Bot OAuth connections use the caller’s account. Owner-configured keys, secrets and
            shared memory are team resources. In non-owner and shared chats, an interactive approver is
            unavailable; constrain permitted operations and enforce supported admin review.
        links:
          - title: "Team Bots: credentials, computers and approvals"
            url: https://docs.x.ai/grok-bot/team-bots
      - title: Treat isolation and screening as bounded supplier safeguards
        body:
          - Personal Bots share their user’s computer; this is not per-Bot isolation. Auto-review checks
            selected actions, not every incoming document or memory write. Inventory and SSO do not
            create a separate authenticated principal for each Bot.
        links:
          - title: Security boundaries
            url: https://cursor.com/docs/grok-bot/security-faq
      - title: Control optional local paths and delegated work
        body:
          - Local command execution and routing through a desktop are separate switches. Cloud Agent
            delegation starts separate hosted coding work with its own controls; include child work when
            responding to an incident.
        links:
          - title: Team administration
            url: https://cursor.com/docs/grok-bot/teams
          - title: Private network paths
            url: https://cursor.com/docs/grok-bot/private-networks
    controls:
      - mitigation: D3-APA
        coverage: partial
        mechanism: >-
          Enable Grok Bot switch with Manage Group Access on the Grok Bot dashboard page (Enterprise); Cloud
          Agents, Public template sharing, Execution on Local Computer and Allow Local Egress capability switches;
          group Grok Bot tabs that can only widen; /grok-bot/access and /grok-bot/capabilities in the Admin API
        steps:
          - title: Decide who gets Bots
            body:
              - On the Grok Bot page of the Cursor dashboard turn Enable Grok Bot on and use Manage Group Access to
                limit it to specific groups (Enterprise); turning it off blocks every member without deleting their
                computers.
            url: https://cursor.com/docs/grok-bot/teams
          - title: Close the widening switches
            body:
              - On the same page turn Cloud Agents off, keep Public template sharing off, set Execution on Local
                Computer to Never allow and turn Allow Local Egress off (Enterprise); a group's Grok Bot tab can
                only widen these for its members.
            url: https://cursor.com/docs/grok-bot/teams
          - title: Manage access as code
            body:
              - Set /grok-bot/access to mode limited with group IDs, and the cloudAgents, templateSharing,
                localExecution and localEgressAllowed fields of /grok-bot/capabilities, with an admin-scoped key.
            url: https://cursor.com/docs/account/teams/admin-api
        note: >-
          Rated partial on the hosted rule. On Enterprise, enablement is per group and the widening switches are
          admin-owned (a group can only widen them, and a member in several groups gets the most permissive
          result), but who can wake a Bot is not an admin setting: a routine's Slack listener starts a run on any
          matching message in the channel, and routines can also fire on GitHub notifications. On self-serve
          Teams Grok Bot is on for every member with no switch to turn it off, and personal paid plans bring it
          outside the organisation's switch. Enforced by Cursor's control plane; sign-in follows the team's Cursor
          SSO, so device-aware IdP policies gate the member's device, not the hosted computer.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityIga
          reviewRequired: false
          original:
            - capability: capabilityIga
              coverage: native
              mechanism: >-
                Organisation-wide switch on the Grok Bot page with Manage Group Access; SSO and SCIM 2.0
                (Enterprise)
              steps:
                - title: Decide who gets Bots
                  body:
                    - Use the organisation-wide switch on the Grok Bot dashboard page and Manage Group Access
                      to enable it for specific groups; provision and deprovision through SCIM 2.0.
                  url: https://cursor.com/docs/grok-bot/teams
              verified: 2026-09-10
      - mitigation: cap-agent-tool-registry
        coverage: partial
        mechanism: >-
          Audit log events grok_bot_created, grok_bot_lifecycle, grok_bot_routine, grok_bot_resource and
          grok_bot_team_setup_manifest; Grok Bot Computers for organisation admins
        steps:
          - title: Inventory Bots and routines from the audit log
            body:
              - Filter the Audit Log by the Grok Bot application; grok_bot_created, grok_bot_lifecycle and
                grok_bot_routine record each Bot and routine (automation_id, name, trigger_type) with the member
                who acted, and the log streams to a SIEM.
            url: https://cursor.com/docs/enterprise/compliance-and-monitoring
          - title: Inventory and clean up computers
            body:
              - Organisation admins search members under Grok Bot Computers → Manage, and turn on Terminate
                Inactive Computers to reclaim computers idle for 30 days.
            url: https://cursor.com/docs/grok-bot/computers
        note: >-
          Partial on the hosted rule. The audit trail records each Bot and routine with its owner, but the docs
          describe no admin list of Bots and routines, no approval state, and nothing unregistered is denied: any
          member with access creates Bots and routines at will. Public template sharing (off by default on
          Enterprise) limits what leaves the team, not what is created.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAgentRegistry
          reviewRequired: false
          original:
            - capability: capabilityAgentRegistry
              coverage: partial
              mechanism: >-
                Computer management (look up any member's computer, creation and last-active times); audit log
                of Bot creation and member access changes
              steps:
                - title: Inventory computers and Bots
                  body:
                    - Organisation admins can look up any member's computer, see when it was created and last active, and read
                      Bot creation and access-change events in the audit log.
                  url: https://cursor.com/docs/grok-bot/teams
              note: No approval step or declared-capability record per Bot.
              verified: 2026-09-10
      - mitigation: AML.M0028
        coverage: partial
        mechanism: >-
          Team connector policy (Plugins & MCPs) and the Enterprise MCP allowlist; Network Controls; Execution on
          Local Computer ceiling; Cloud Agents switch; Enforce Auto-review with team Auto-review rules
        steps:
          - title: Restrict connectors
            body:
              - Set which servers members can use from the Team Marketplace on the dashboard's Plugins & MCPs page
                and, on Enterprise, the MCP allowlist; a blocked connector shows Disabled by team admin on every Bot.
            url: https://cursor.com/docs/grok-bot/teams
          - title: Set a locked network policy
            body:
              - Choose Team allowlist only in Network Controls on the Grok Bot page and lock the team policy so
                directory-group policies cannot replace it (Enterprise).
            url: https://cursor.com/docs/grok-bot/security
          - title: Cap local execution and delegation
            body:
              - Set Execution on Local Computer to Never allow and turn the Cloud Agents switch off unless Bots
                need them.
            url: https://cursor.com/docs/grok-bot/teams
          - title: Lock the reviewer on
            body:
              - Turn on Enforce Auto-review and add team rules with Configure Rules (Enterprise); members see them
                as locked rows and can only add stricter personal rules.
            url: https://cursor.com/docs/grok-bot/teams
        note: >-
          Rated partial on the rule applied to every vendor. The product-enforced limits are per connector (allow
          or block a server), per destination (Network Controls) and per capability (local execution, Cloud Agent
          delegation, local egress). There is no admin rule over built-in tool calls by name and arguments: shell,
          browser and computer use inside the hosted computer are gated only by Auto Review, and team Auto-review
          rules are natural-language allow and block instructions the reviewer model interprets (the Admin API
          takes up to 20 of each), not deterministic matches. A group can lift Enforce Auto-review with Don't
          enforce for this group. Blocking a plugin does not block the service's website. A Bot's reach is its
          member's accounts and every login on the shared computer.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityToolPermissionScoping
            - capabilityAgentRuntimeEnforcement
            - capabilityMcpToolSecurity
          reviewRequired: false
          original:
            - capability: capabilityToolPermissionScoping
              coverage: native
              mechanism: >-
                Network Controls (four modes, team allowlist); Team Setup; Auto-review Ask first / Allow
                automatically rules; Execution on Local Computer (Always allow / Ask every time / Never
                allow); Bot access bounded by its owner
              steps:
                - title: Set a network policy
                  body:
                    - Pick one of the four Network Controls modes; teams without a policy default to
                      allow-all, and the policy is separate from Cloud Agent network settings and applies when
                      a computer is created or recreated.
                  url: https://cursor.com/docs/grok-bot/security
                - title: Write Auto-review rules
                  body:
                    - Ask first rules always stop matching actions and Allow automatically rules let them
                      proceed when the reviewer finds no safety concern; admins set team rules and members may
                      only add stricter personal ones.
                  url: https://cursor.com/docs/grok-bot/security-faq
                - title: Restrict execution on the member's own machine
                  body:
                    - Set Execution on Local Computer to Ask every time or Never allow; the default is Always
                      allow, and the more restrictive of the admin and member setting wins.
                  url: https://cursor.com/docs/grok-bot/teams
              note: >-
                Network Controls limit destinations, Ask first and Allow automatically rules pre-approve or
                gate actions, and the local-execution setting caps what a Bot may run on a member's machine.
                Tools are not individually hidden; a Bot's reach is its owner's.
              verified: 2026-09-10
            - capability: capabilityAgentRuntimeEnforcement
              coverage: native
              mechanism: Team-wide Ask first rules always stop matching actions; Never allow for Execution on Local
                Computer; Auto-review (an AI reviewer) evaluates everything else and can allow, require
                approval or deny; login, 2FA and payment always handed to the member
              steps:
                - title: Write Ask first rules for the actions that must stop
                  body:
                    - Ask first rules always stop matching actions and win over Allow automatically when rules
                      conflict; admins set team rules and members may add only stricter ones.
                  url: https://cursor.com/docs/grok-bot/security-faq
                - title: Deny local execution where the microVM must hold
                  body:
                    - Set Execution on Local Computer to Never allow; the default Always allow delegates the
                      decision to the member.
                  url: https://cursor.com/docs/grok-bot/teams
              note: The deterministic part is Ask first and Never allow; Auto-review is a classifier that the docs say does
                not review all side effects, such as memory writes. Rules match actions, not shell commands
                individually, and the MCP allowlist decides which connector tools exist at all.
              verified: 2026-09-15
            - capability: capabilityMcpToolSecurity
              coverage: native
              mechanism: Enterprise MCP allowlist under the team's connector policy; a blocked connector shows as Disabled
                by team admin on every Bot
              steps:
                - title: Allowlist connectors and MCP servers for the team
                  body:
                    - Set the connector policy and MCP allowlist on the Grok Bot page; any permitted connector
                      is available to every Bot a member runs and a blocked one is disabled for all of them.
                  url: https://cursor.com/docs/grok-bot/teams
              note: "Enterprise only. Rated native on the same rule as Cursor: admission by identity, organisation-wide.
                Admission is not integrity — nothing pins what a permitted server serves."
              verified: 2026-09-15
      - mitigation: AML.M0029
        coverage: partial
        mechanism: >-
          Approval cards (Allow once, Always allow, Deny) raised by Auto Review; Enforce Auto-review and
          team Auto-review rules (Enterprise); Execution on Local Computer Ask every time; login, 2FA and
          payment handed to the member
        steps:
          - title: Lock Auto Review on
            body:
              - Turn on Enforce Auto-review on the Grok Bot page (off by default) and do not use Don't
                enforce for this group on any group.
            url: https://cursor.com/docs/grok-bot/teams
          - title: Add Ask first team rules
            body:
              - Use Configure Rules on the Grok Bot page to add Ask first rules for production
                deployments, external email, payments and accepting legal terms; Ask first wins when
                rules conflict.
            url: https://cursor.com/docs/grok-bot/teams
          - title: Force per-command approval on members' machines
            body:
              - Set the Execution on Local Computer ceiling to Ask every time or Never allow; the local
                approval card shows the exact command.
            url: https://cursor.com/docs/grok-bot/security
          - title: Check Team Bot approval availability
            body:
              - Restrict non-owner and shared-channel work to approved scopes; an owner-chat approval
                mechanism does not extend to every Team Bot conversation.
            url: https://docs.x.ai/grok-bot/team-bots
        note: >-
          Partial: approval cards support human decisions for personal and owner conversations, but
          Auto-review is a model-based action reviewer. Team Bot non-owner conversations and shared
          channels lack an interactive approver; do not infer a human gate there. Local execution set to
          Ask every time covers local commands only. Natural-language rules are not deterministic action
          matching.
        verified: "2026-10-03"
        migration:
          from:
            - capabilityHitlControls
          reviewRequired: false
          original:
            - capability: capabilityHitlControls
              coverage: native
              mechanism: >-
                Team-wide Ask first rules (the human gate); Enforce Auto-review (Enterprise, off by default,
                an AI reviewer); local-execution ceiling; login, 2FA and payment always handed to the member
              steps:
                - title: Add team-wide Ask first rules
                  body:
                    - On the Grok Bot page add Ask first rules for the actions a person must approve; they
                      apply to every member's Bots and win over Allow automatically when rules conflict. This
                      is the human gate — Auto-review can allow an action without anyone seeing it.
                  url: https://cursor.com/docs/grok-bot/teams
                - title: Enforce Auto-review
                  body:
                    - Turn on Enforce Auto-review so members cannot switch the AI reviewer off; it evaluates
                      shell commands, plugin calls, computer use, automation writes and delegation and can
                      allow, require approval or deny. An allow verdict is automatic, not human, review.
                  url: https://cursor.com/docs/grok-bot/teams
                - title: Set the local-execution ceiling
                  body:
                    - Always allow, Ask every time or Never allow for local execution on the Grok Bot page is
                      the team's ceiling; a member's own stricter setting still applies, so the ceiling is not
                      every member's effective default.
                  url: https://cursor.com/docs/grok-bot/teams
              note: >-
                Enforce Auto-review guarantees automatic review, not human review; the docs state Auto-review
                does not review all side effects, such as memory writes.
              verified: 2026-09-15
      - mitigation: cap-ai-vendor-assessment
        coverage: external
        mechanism: >-
          Vendor evidence (Grok Bot security Certifications section, trust.cursor.com, the DPA) consumed by the
          organisation's TPRM platform
        evidence:
          - title: >-
              Grok Bot security (ISO/IEC 27001 and ISO/IEC 42001 by Schellman with Grok Bot in the current scope;
              US-only hosting; DPA 30-day deletion), checked 2026-09-25
            url: https://cursor.com/docs/grok-bot/security
          - title: Grok Bot security, SpaceXAI docs mirror
            url: https://docs.x.ai/grok-bot/security
          - title: Cursor security page (SOC 2 Type II, AIUC-1 and ISO certifications for Cursor)
            url: https://cursor.com/security
        note: >-
          External: the organisation's TPRM platform consumes the evidence. Record US-only hosting outside
          Cursor's US data residency program, shared egress ranges, the DPA's 30-day deletion term, a model
          allowlist whose enforcement is not guaranteed, the SpaceXAI co-branding, and that the Grok Bot pages
          name ISO 27001 and 42001 scope but not SOC 2 (cursor.com/security lists SOC 2 Type II for Cursor without
          naming Grok Bot). Access, capabilities, network policy and Enforce Auto-review are readable through the
          Admin API (/grok-bot/*) for posture checks; Team Secrets and Action Recording's store are not.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAiTprm
            - capabilityVendorAssurance
          reviewRequired: false
          original:
            - capability: capabilityAiTprm
              coverage: external
              mechanism: >-
                Vendor evidence (Cursor trust portal, ISO 27001/42001, DPA) consumed by the organisation's
                TPRM platform
              steps:
                - title: Assess the new surface
                  body:
                    - Record US-only hosting, shared egress ranges, the DPA's 30-day deletion term, the SpaceXAI co-branding and
                      Anysphere's ISO 27001 / 42001 certifications.
                  url: https://docs.x.ai/grok-bot/security
              verified: 2026-09-10
            - capability: capabilityVendorAssurance
              coverage: external
              mechanism: Dashboard-only settings verified manually or through an SSPM product
              note: Network Controls, Enforce Auto-review and Action Recording have no documented API; posture checks must
                read the dashboard.
              evidence:
                - title: Vendor docs index, reviewed for the integration point (2026-09-10)
                  url: https://cursor.com/docs/grok-bot
              verified: 2026-09-10
      - mitigation: cap-agent-tracing
        coverage: native
        mechanism: >-
          Enterprise Action Recording and server-side OpenTelemetry Export, with separate opt-ins for
          conversation content and MCP Tool I/O
        steps:
          - title: Enable action recording and export
            body:
              - Enable Action Recording and configure the Enterprise OpenTelemetry destination. Keep
                action records for correlation with exported tool content.
            url: https://cursor.com/docs/grok-bot/teams
          - title: Choose content export deliberately
            body:
              - Enable Allow conversation content export for the team and Conversation content for the
                destination. Enable Tool I/O separately for hosted MCP arguments and results; it defaults
                off.
            url: https://cursor.com/docs/enterprise/opentelemetry-export
        note: >-
          Standard action records omit tool payloads. Opt-in conversation export can include prompts and
          responses, and the separate Tool I/O toggle adds hosted MCP arguments/results. Content is
          scrubbed and truncated; redaction cannot guarantee removal of every secret. Other shell/browser
          payloads are not thereby fully captured. Disabled periods are not backfilled.
        verified: "2026-10-03"
        migration:
          from:
            - capabilityAgentObservability
            - capabilityAuditLogging
          reviewRequired: false
          original:
            - capability: capabilityAgentObservability
              coverage: native
              mechanism: >-
                Action Recording (Enterprise, off by default) plus OpenTelemetry Export tagged
                cursor.surface=grok_bot
              steps:
                - title: Record Bot actions
                  body:
                    - Turn on Action Recording on the Grok Bot page to capture Bot actions including scrubbed shell commands,
                      then enable OpenTelemetry Export so shell, browser, tool-call and computer-use events
                      reach your collector.
                  url: https://cursor.com/docs/grok-bot/teams
                - title: Export the events
                  body:
                    - Configure Team Settings → OpenTelemetry Export; Grok Bot actions arrive as logs with no prompt content.
                  url: https://cursor.com/docs/enterprise/opentelemetry-export
              note: >-
                Action Recording captures what the Bot did on its computer; OTel export carries lifecycle and
                tool events. Neither is detection — the recordings and events feed a tool the organisation
                runs.
              verified: 2026-09-10
            - capability: capabilityAuditLogging
              coverage: native
              mechanism: Enterprise audit log covering Grok Bot control-plane events; SIEM streaming
              steps:
                - title: Stream Grok Bot audit events
                  body:
                    - Audit logs cover admin, security and authentication events plus Bot creation, member
                      access changes, Team Setup manifests, MCP authentication, Slack account links and
                      routines.
                  url: https://cursor.com/docs/grok-bot/teams
              note: Control-plane events only — Bot actions are in Action Recording, not the audit log. Retention and tamper
                evidence are not stated; the SIEM stream is the durable record.
              verified: 2026-09-10
      - mitigation: AML.M0031
        coverage: partial
        mechanism: >-
          Bot memory persists by design with no admin switch; Team Rules and Group Rules always required; Grok
          Bot Computers Delete VMs and Data (organisation admins, Enterprise)
        steps:
          - title: Lock the instruction sources
            body:
              - Add Team Rules on the Grok Bot page scoped to Grok Bot; rules applied to Grok Bot are always
                required and members cannot turn them off.
            url: https://cursor.com/docs/grok-bot/teams
          - title: Wipe a member's state when needed
            body:
              - Under Grok Bot Computers → Manage → Manage selected, Delete VMs and Data removes the computer and
                its durable data; Terminate VMs and Recreate VMs keep the disk.
            url: https://cursor.com/docs/grok-bot/computers
        note: >-
          Partial on the rule. Admins can lock instruction sources (Team Rules and Group Rules) and wipe a
          member's computer, but no admin setting disables or scopes Bot memory, memory writes are not validated
          and Auto Review does not review them, and the shared durable disk (files, browser sessions, logins)
          persists across sessions for every Bot the member runs. Deleting a Bot removes its profile,
          conversation and routines, not files or sign-ins on the computer; a shared Bot template carries
          identity, description, skills and routines.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityMemoryProtection
          reviewRequired: false
          original:
            - capability: capabilityMemoryProtection
              coverage: partial
              mechanism: >-
                Per-user microVM; admin computer termination; separate user accounts for separate credentials
              steps:
                - title: Terminate a computer to reset state
                  body:
                    - Organisation admins can terminate any member's computer; provision separate Cursor user
                      accounts where workloads must not share memory, files or browser sessions.
                  url: https://cursor.com/docs/grok-bot/teams
              note: >-
                Memory persists by design and Auto-review does not evaluate memory writes; there is no
                validation, expiry or rollback.
              verified: 2026-09-10
