          - { name: "AWS Lambda MicroVMs", kind: commercial, url: "https://docs.aws.amazon.com/lambda/latest/dg/lambda-microvms-guide.html", note: "Firecracker microVMs restored from a snapshot of your image, with VM-level isolation and controlled ingress and egress." }
          - { name: "Isolated pods on Amazon EKS (Nitro Sandbox)", kind: commercial, url: "https://docs.aws.amazon.com/eks/latest/userguide/sandboxing.html", note: "Opt in per pod with runtimeClassName isolated-sandbox; each pod gets its own microVM on supported instance types." }
          - { name: "kubernetes-sigs agent-sandbox with gVisor on EKS", kind: open, url: "https://awslabs.github.io/ai-on-eks/docs/infra/agents/agent-sandbox", note: "AI on EKS solution: sandbox CRDs and warm pools, gVisor or Nitro tiers, Cilium FQDN egress filtering; v1beta1 API.", packs: [awsEksOpenSource] }
