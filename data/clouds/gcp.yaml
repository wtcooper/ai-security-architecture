        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/grounding/grounding-with-google-search
      - at: orchestration->subagents
        text: "Google's reference has agents talk over the A2A protocol, checked by Agent Gateway and Agent Registry, and lets each run as its own service. Here delegation stays inside one process, so nothing screens messages between agents unless your code does."
        url: https://docs.cloud.google.com/architecture/multiagent-ai-system
      - at: subagents
        text: "A Cloud Run service runs as one service account. Per-subagent tokens exist only because the coordinator's account may impersonate the others, so a compromised process can mint them all. Google's reference gives each agent its own Agent Identity."
        url: https://docs.cloud.google.com/iam/docs/create-short-lived-credentials-direct
      - at: orchestration->state
        text: "ADK resume is not a replaying engine. It restores finished steps from the session's events and re-runs the rest, and tools may run more than once. Make every write tool safe to repeat, and never change the agents while a run is stopped."
        url: https://adk.dev/runtime/resume/
      - at: state
        text: "Sessions are child resources of an Agent Runtime instance, so you must create one (no code deployed) even though the agent runs on Cloud Run. Sessions live 365 days unless you set a shorter lifetime."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sessions/manage-with-api
      - at: operator->events
        text: "ADK's confirmation page lists Agent Platform Sessions (VertexAiSessionService) as not supported. The operator-approval step therefore conflicts with keeping the journal in Sessions; test it or use another store. The reply must be posted to the ADK server with the invocation ID."
        url: https://adk.dev/tools-custom/confirmation/
      - at: localTools
        text: "Code Execution is a separate Agent Platform service with no network, called by API. ADK says the agent's service account needs roles/aiplatform.user for it, the same role that permits direct model calls, which weakens the gateway-only rule unless narrowed."
        url: https://adk.dev/integrations/code-exec-agent-runtime/
      - at: harness
        text: "Apigee is not the network exit. Cloud Run reaches the internet freely unless you send all outbound traffic into the VPC and through Secure Web Proxy with an allow list. Agent Gateway for Cloud Run uses that same proxy and is Limited Preview."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/gateways/agent-gateway-overview
    alsoNeeded:
      - service: "IAM service accounts"
        role: identity
        why: "Each Cloud Run service, and Apigee's proxies, run as a service account you create and scope."
        url: https://docs.cloud.google.com/apigee/docs/api-platform/security/google-auth/overview
      - service: "VPC network with Direct VPC egress and Secure Web Proxy"
        role: network
        why: "The only way to control where Cloud Run workloads can connect on the internet."
        url: https://docs.cloud.google.com/secure-web-proxy/docs/overview
      - service: "Apigee networking (Private Service Connect or VPC peering)"
        role: network
        why: "Lets agents reach Apigee privately and lets Apigee reach tool services on Cloud Run."
        url: https://docs.cloud.google.com/apigee/docs/api-platform/get-started/networking-options
      - service: "Secret Manager"
        role: secrets
        why: "Google's recommended store for API keys and passwords that Cloud Run services need."
        url: https://docs.cloud.google.com/run/docs/configuring/services/secrets
      - service: "Cloud KMS"
        role: keys
        why: "Customer-managed encryption keys for stored conversations, sessions and logs, where policy requires them."
        url: https://docs.cloud.google.com/kms/docs/cmek
      - service: "Binary Authorization"
        role: registry
        why: "Allows only approved container images to deploy to Cloud Run; Google's reference names it."
        url: https://docs.cloud.google.com/binary-authorization/docs/overview
      - service: "Model Armor templates"
        role: other
        why: "Apigee's prompt policy and the platform floor settings both need a Model Armor template to exist."
        url: https://docs.cloud.google.com/model-armor/model-armor-vertex-integration
      - service: "Cloud Logging and Cloud Trace"
        role: logging
        why: "Cloud Run sends logs here by default; route them onward to your security monitoring."
        url: https://docs.cloud.google.com/logging/docs/overview
      - service: "Agent Runtime instance"
        role: other
        why: "Agent Platform Sessions can only be created under one, even with no agent deployed to it."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sessions/manage-with-api
      - service: "Cloud Run ingress restriction"
        role: ingress
        why: "Keeps the agent service off the public internet; this pattern's settings list has no ingress entry."
        url: https://docs.cloud.google.com/run/docs/securing/ingress
    quickstart:
      - title: "Workflows: multi-agent, multi-node applications"
        url: https://adk.dev/workflows/
    # <<< checked
    reference:
      - title: Multi-agent AI system in Google Cloud
        url: https://docs.cloud.google.com/architecture/multiagent-ai-system
      - title: Resume stopped agents (ADK)
        url: https://adk.dev/runtime/resume/
      - title: Apigee AI Gateway for ADK agents
        url: https://adk.dev/agents/models/apigee/
    summary:
      - >-
        An ADK multi-agent app — a coordinator and its subagents in one process on Cloud Run —
        made resumable, with its event history in Agent Platform Sessions so a stopped workflow
        picks up at its invocation and waits for an operator's confirmation. Each subagent calls
        on its own service account's short-lived token, and every model and tool call crosses
        Apigee. Google's reference also lets agents run as separate services that talk A2A, or on
        Agent Runtime — the managed runtime, which is a different drawing.
    bindings:
      - { block: events, service: Pub/Sub push and Cloud Scheduler, note: "Starts runs, and carries the operator's confirmation that resumes a suspended step." }
      - { block: harness, service: Your multi-agent app on Cloud Run, builtWith: Agent Development Kit (ADK), note: "Agent Runtime on Gemini Enterprise Agent Platform is the managed alternative Google's reference names." }
      - { block: localTools, service: Your function tools and Code Execution, builtWith: Agent Development Kit (ADK) }
      - { block: orchestration, service: Your coordinator agent (resumable), builtWith: Agent Development Kit (ADK), note: "ResumabilityConfig: the session's event history is the journal a stopped workflow resumes from." }
      - { block: subagents, service: "Your subagents, each on its own service account", builtWith: Agent Development Kit (ADK) }
      - { block: state, service: "Agent Platform Sessions, Firestore, Agent Search", note: "Event history in Sessions; shared working memory in Firestore; the index in Agent Search." }
      - { block: gateway, service: Apigee (AI gateway), note: "Agent Gateway is the Agent Platform's own gateway — Google-managed for agents on Agent Runtime, early preview for Cloud Run." }
      - { block: provider, service: Gemini on Agent Platform }
      - { block: internalTools, service: "Your MCP servers on Cloud Run, via Apigee" }
      - { block: orgData, service: Your systems of record, build: true, note: "Cloud SQL, BigQuery, line-of-business systems — whatever the workflow changes." }
      - { block: openWeb, service: Grounding with Google Search }
      - { block: sources, service: "Public registries (PyPI, npm)" }
      - { block: registry, service: Artifact Registry remote and virtual repos }
    settings:
      - pubsubPushAuth
      - cloudRunServiceIdentity
      - subagentShortLivedTokens
      - disableSaKeyCreation
      - apigeeVerifyIam
      - sessionsTtl
      - firestoreTtl
      - agentSearchAccessControl
      - checkGrounding
      - sdpDeidentify
      - apigeeSanitizeUserPrompt
      - modelArmorFloorSettings
      - apigeeLlmTokenQuota
      - apigeeMcpDiscoveryProxy
      - apigeeMcpToolAccess
      - agentRegistry
      - adkRemoteConfirmation
      - codeExecutionSandbox
      - cloudRunTrafficSplit
      - agentEvaluation
      - arVirtualRepoPriority
      - arPackageScanning
      - swpEgress
      - vpcServiceControls
      - adkCloudTrace
      - dataAccessAuditLogs
      - disableServiceAccount

  - architecture: archRemoteMcpServer
    asOf: "2026-10"
    # >>> checked against the vendor's documentation
    verified: "2026-11-18"
    sources:
      idp: https://docs.cloud.google.com/identity-platform/docs/multi-tenancy
      gateway: https://docs.cloud.google.com/apigee/docs/api-platform/apigee-mcp/manage-mcp-tool-access
      authServer: https://docs.cloud.google.com/apigee/docs/api-platform/security/oauth/oauth-home
      service: https://docs.cloud.google.com/run/docs/host-mcp-servers
      orgData: https://docs.cloud.google.com/run/docs/configuring/services/secrets
    differences:
      - at: service->authServer
        text: "The Cloud Run service never sees or checks the caller's token. Apigee checks it, then calls Cloud Run with its own Google identity token, and offers no token-exchange grant. Have Apigee pass the verified app, user and tenant on to the service."
        url: https://docs.cloud.google.com/apigee/docs/api-platform/security/google-auth/overview
      - at: callers->authServer
        text: "Apigee does not host a sign-in or consent page. Its authorization-code flow redirects to a login app that you build and run; that app signs the user in (here with Identity Platform) and then asks Apigee to issue the code."
        url: https://docs.cloud.google.com/apigee/docs/api-platform/security/oauth/oauth-v2-policy-authorization-code-grant-type
      - at: callers->idp
        text: "Identity Platform signs each customer's users in through their tenant's SAML or OIDC provider, but its documentation describes no identity assertion grant (ID-JAG) for agents. Plan on browser sign-in through your login app only, unless you add another identity product."
        url: https://docs.cloud.google.com/identity-platform/docs/concepts-authentication
      - at: gateway->service
        text: "By default a Cloud Run service's run.app address can be reached from the internet. Require authentication, give the invoker role only to Apigee's proxy service account, and restrict ingress or disable the default address so callers cannot go round Apigee."
        url: https://docs.cloud.google.com/run/docs/securing/ingress
      - at: callers->gateway
        text: "MCP clients find the authorization server through a metadata document at /.well-known/oauth-protected-resource/mcp; Apigee answers 404 when it is not configured. Make sure your proxy serves it, and put an external load balancer in front of Apigee for internet callers."
        url: https://docs.cloud.google.com/apigee/docs/api-platform/apigee-mcp/troubleshoot-mcp-deployments
      - at: service
        text: "Deploying with the functional-type flag also lists the server in your organisation's Agent Registry, and the setting cannot be changed afterwards. It is a Preview feature. Google's own guides then protect such servers with IAP and Google sign-in, not Apigee."
        url: https://docs.cloud.google.com/run/docs/ai/agent-platform-features
    alsoNeeded:
      - service: "External Application Load Balancer (with Private Service Connect to Apigee)"
        role: ingress
        why: "Internet callers reach Apigee through an external load balancer; Apigee is not directly exposed."
        url: https://docs.cloud.google.com/apigee/docs/api-platform/get-started/networking-options
      - service: "Apigee proxy service account (IAM)"
        role: identity
        why: "Apigee calls Cloud Run as a named service account that needs the Cloud Run invoker role."
        url: https://docs.cloud.google.com/apigee/docs/api-platform/security/google-auth/overview
      - service: "Login and consent app (your own, for example on Cloud Run)"
        role: other
        why: "Apigee's authorization-code flow needs a login app you host to sign users in and record consent."
        url: https://docs.cloud.google.com/apigee/docs/api-platform/security/oauth/oauth-v2-policy-authorization-code-grant-type
      - service: "Artifact Registry"
        role: registry
        why: "Holds the MCP server's container image that Cloud Run deploys and Artifact Analysis scans."
        url: https://docs.cloud.google.com/artifact-analysis/docs/enable-automatic-scanning
      - service: "Private Service Connect or VPC peering from Apigee to the backend"
        role: network
        why: "Apigee reaches backends in your network over VPC peering or Private Service Connect, which you set up."
        url: https://docs.cloud.google.com/apigee/docs/api-platform/get-started/networking-options
      - service: "Secret Manager"
        role: secrets
        why: "Holds each upstream credential the handlers use."
        url: https://docs.cloud.google.com/run/docs/configuring/services/secrets
      - service: "Secure Web Proxy with a VPC network"
        role: network
        why: "Filters the service's outbound traffic to an allowed list."
        url: https://docs.cloud.google.com/secure-web-proxy/docs/overview
      - service: "Cloud Logging"
        role: logging
        why: "Receives Apigee's per-call logs; the proxy's service account needs the log writer role."
        url: https://docs.cloud.google.com/apigee/docs/api-platform/reference/policies/message-logging-policy
    quickstart:
      - title: "Build and deploy a remote MCP server on Cloud Run"
        url: https://docs.cloud.google.com/run/docs/tutorials/deploy-remote-mcp-server
      - title: "Manage MCP tool access"
        url: https://docs.cloud.google.com/apigee/docs/api-platform/apigee-mcp/manage-mcp-tool-access
    # <<< checked
    reference:
      - title: Host MCP servers on Cloud Run
        url: https://docs.cloud.google.com/run/docs/host-mcp-servers
      - title: Get started with Apigee and MCP
        url: https://docs.cloud.google.com/apigee/docs/api-platform/apigee-mcp/apigee-mcp-quickstart
      - title: Single-agent AI system using ADK and Cloud Run — MCP security considerations
        url: https://docs.cloud.google.com/architecture/single-agent-ai-system-adk-cloud-run
    summary:
      - >-
        Your MCP server on Cloud Run, published only through an Apigee MCP proxy that is also the
        OAuth 2.0 authorization server: clients are registered developer apps whose API products
        name the tools they may see, so every token is bound to this proxy and checked, with its
        app, on each request. Customer callers sign in through their own IdP, federated as an
        Identity Platform tenant. Google's own reference protects Cloud Run MCP servers with IAP
        and Agent Gateway, which serve internal callers rather than a server published to other
        organisations.
    bindings:
      - { block: idp, service: Identity Platform (a tenant per customer), note: "Each customer organisation's IdP federated as its tenant's SAML or OIDC provider; your own staff through your workforce IdP." }
      - { block: gateway, service: Apigee (MCP proxy), note: "ParsePayload reads the JSON-RPC method and tool, so authorization, quotas and logging are per tool." }
      - { block: authServer, service: Apigee OAuth 2.0 token endpoints, note: "Clients are pre-registered as developer apps, so no client-metadata document is fetched; Google Cloud workloads present their own service-account identity, checked by VerifyIAM." }
      - { block: service, service: Your MCP server on Cloud Run, note: "Deployed with --functional-type=mcp-server and invoked only by Apigee's service account." }
      - { block: toolDefs, service: Tool definitions in your repository, build: true, note: "Versioned with the release and pinned by hash where the server loads them." }
      - { block: orgData, service: Your systems of record, build: true, note: "Reached on the service's own identity or a Secret Manager credential for that upstream, never the caller's token." }
    settings:
      - identityPlatformTenants
      - apigeeVerifyAccessToken
      - apigeeKeyApproval
      - apigeeMcpToolAccess
      - apigeeVerifyIam
      - cloudRunServiceIdentity
      - noTokenPassthrough
      - secretManagerSecrets
      - disableSaKeyCreation
      - apigeeRevokeTokens
      - tenantScoping
      - apigeeSpikeArrest
      - toolDefinitionPinning
      - appSecurityTesting
      - containerScanning
      - swpEgress
      - apigeeMessageLogging

  - architecture: archSelfHostedInference
    asOf: "2026-10"
    # >>> checked against the vendor's documentation
    verified: "2026-11-18"
    sources:
      consumers: https://docs.cloud.google.com/vpc/docs/private-service-connect
      gateway: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-gke-inference-gateway
      api: https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/serve-with-gke-inference-gateway
      runtime: https://docs.cloud.google.com/architecture/networking-for-ai-inference-gke
      storage: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/cloud-storage-fuse-csi-driver
      sources: https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/serve-gemma-gpu-vllm
      registry: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/model-registry/introduction
    differences:
      - at: gateway
        text: "The gateway is not one product. A regional internal load balancer runs GKE Inference Gateway and calls Apigee and Model Armor as side checks. The builder must attach both extensions and set them to block traffic when a check fails or times out."
        url: https://docs.cloud.google.com/architecture/networking-for-ai-inference-gke
      - at: gateway->api
        text: "Google's walkthrough has Apigee check API keys, not Google identities. On this callout path Apigee message logging is unsupported and one Apigee proxy handles all traffic. The builder must plan tenant identity, quotas and logging within those limits."
        url: https://docs.cloud.google.com/apigee/docs/api-platform/service-extensions/extension-processor-overview
      - at: api->runtime
        text: "The load balancer first asks an in-cluster endpoint picker which vLLM replica to use, then sends the request to that pod. The picker is an extra component in the path; network policy must let only the gateway and picker reach vLLM."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-gke-inference-gateway
      - at: sources->storage
        text: "Google's GKE tutorials have vLLM download weights directly from Hugging Face at start-up, using a token kept in the cluster. To match the drawing, the builder must add an intake job that copies vetted weights into the bucket and block Hugging Face from serving nodes."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/serve-with-gke-inference-gateway
      - at: registry->storage
        text: "Model Registry does not push weights into the bucket, and vLLM on GKE does not read its aliases. The registry only records a bucket path. The builder's promotion job must copy the weights and point the deployment at the aliased version."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/model-registry/import-model
      - at: storage->runtime
        text: "Mounting the bucket with Cloud Storage FUSE hands the pod whatever files are there; the mount does not check a digest or signature. The builder must add a start-up check before vLLM opens the weights and grant the pod read-only access."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/cloud-storage-fuse-csi-driver
      - at: runtime
        text: "Google's reference draws no outbound exit. GKE nodes with only internal addresses cannot reach the internet unless Cloud NAT is added. The builder should keep it that way and serve the vLLM image from a private registry."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/network-isolation
    alsoNeeded:
      - service: "Apigee instance and Apigee Operator for Kubernetes"
        role: other
        why: "The Apigee callout needs a same-region Apigee instance and the operator installed in the cluster."
        url: https://docs.cloud.google.com/apigee/docs/api-platform/apigee-kubernetes/apigee-apim-operator-overview
      - service: "Workload Identity Federation for GKE"
        role: identity
        why: "Gives vLLM pods a keyless identity to read the weights bucket; only named inside the bucket-access row."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/workload-identity
      - service: "Cloud KMS"
        role: keys
        why: "Customer-managed key for the weights bucket; in the component note but has no settings row."
        url: https://docs.cloud.google.com/storage/docs/encryption/customer-managed-keys
      - service: "Secret Manager"
        role: secrets
        why: "Holds the Hugging Face token for the intake job and other credentials, instead of plain cluster secrets."
        url: https://docs.cloud.google.com/secret-manager/docs/overview
      - service: "Artifact Registry"
        role: registry
        why: "Private home for the vLLM serving image; Settings cover only scanning of images."
        url: https://docs.cloud.google.com/artifact-registry/docs/overview
      - service: "Cloud NAT (only if egress is allowed)"
        role: network
        why: "Private nodes have no internet without NAT; decide explicitly whether any outbound path exists."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/network-isolation
      - service: "Cloud Logging (HTTP access logging through GCPBackendPolicy)"
        role: logging
        why: "Per-InferencePool access logs; replaces the Apigee MessageLogging row, which does not work on this path."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/customize-gke-inference-gateway-configurations
      - service: "Cloud Armor"
        role: ingress
        why: "Google's reference lists it as optional edge protection in front of the gateway."
        url: https://docs.cloud.google.com/architecture/networking-for-ai-inference-gke
      - service: "llm-d Endpoint Picker"
        role: other
        why: "Runs in the cluster and picks the replica for every request; needs its own network policy."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-gke-inference-gateway
    quickstart:
      - title: "Serve an LLM with GKE Inference Gateway"
        url: https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/serve-with-gke-inference-gateway
      - title: "Serve Gemma open models using GPUs on GKE with vLLM"
        url: https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/serve-gemma-gpu-vllm
    # <<< checked
    reference:
      - title: Networking for AI inference model serving on GKE
        url: https://docs.cloud.google.com/architecture/networking-for-ai-inference-gke
      - title: About GKE Inference Gateway
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-gke-inference-gateway
    summary:
      - >-
        vLLM on GKE GPU node pools behind GKE Inference Gateway, reached through a Private Service
        Connect endpoint, with Apigee called from the load balancer for authentication and quotas
        and Model Armor screening prompts and responses — the shape Google's reference draws.
        Weights live in a Cloud Storage bucket only the serving identity reads, and Agent Platform
        Model Registry's aliases say which version serves.
    bindings:
      - { block: consumers, service: Internal apps via Private Service Connect }
      - { block: gateway, service: GKE Inference Gateway with Apigee, note: "Apigee's Extension Processor called through a Service Extensions traffic extension; Model Armor called from the same load balancer." }
      - { block: api, service: vLLM OpenAI-compatible server, builtWith: vLLM}
      - { block: runtime, service: vLLM on GKE GPU node pools, builtWith: vLLM, note: "One InferencePool per model; multi-node replicas talk over the backend RDMA network." }
      - { block: storage, service: Cloud Storage (model weights bucket), note: "Mounted read-only through Cloud Storage FUSE; CMEK keys in Cloud KMS." }
      - { block: sources, service: "Public model hubs (Hugging Face)" }
      - { block: registry, service: Agent Platform Model Registry }
    settings:
      - apigeeVerifyIam
      - apigeeSpikeArrest
      - modelArmorInferenceGateway
      - modelSignatureVerify
      - modelFormatScan
      - modelVersionAliases
      - inferencePoolRollout
      - gcsUniformAccess
      - confidentialGpuNodes
      - vllmServingConfig
      - containerScanning
      - gkeNetworkPolicy
      - vpcServiceControls
      - apigeeMessageLogging
      - disableSaKeyCreation

  - architecture: archTrainingPipeline
    asOf: "2026-10"
    # >>> checked against the vendor's documentation
    verified: "2026-11-18"
    sources:
      upstreamArtifacts: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/model-garden/use-models
      pkgRegistry: https://docs.cloud.google.com/artifact-registry/docs/repositories/remote-overview
      curation: https://docs.cloud.google.com/dataflow/docs/overview
      corpus: https://docs.cloud.google.com/storage/docs/object-versioning
      trainJob: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/training/overview
      storage: https://docs.cloud.google.com/storage/docs/encryption/customer-managed-keys
      evaluation: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/evaluation/introduction
      registry: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/model-registry/introduction
    differences:
      - at: trainJob
        text: "Google's blueprint uses Managed Airflow as its main production orchestrator, with Pipelines as an alternative, and still calls the platform Vertex AI. Choosing Agent Platform Pipelines works, but the blueprint's code and diagrams will not match one-to-one."
        url: https://docs.cloud.google.com/architecture/blueprints/genai-mlops-blueprint
      - at: pkgRegistry->trainJob
        text: "A serverless training job keeps Google-managed internet access by default, even with a Private Service Connect interface, so it can bypass the mirror. Internet is blocked only once the project is inside a VPC Service Controls perimeter. The builder must enforce that perimeter."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/training/psc-i-egress
      - at: corpus->trainJob
        text: "By default training code runs as a shared Google-managed service agent, not a per-pipeline identity. The builder must attach a dedicated service account to every job so it can read only its approved dataset version."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/general/custom-service-account
      - at: trainJob->storage
        text: "A training pipeline can create a Model resource by itself the moment training ends, skipping the candidate bucket and the evaluation gate. The builder should run plain jobs that only write to the bucket and deny the training identity permission to upload models."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/training/create-training-pipeline
      - at: storage->evaluation
        text: "The Gen AI evaluation service scores a model by calling it, not by reading files in a bucket. The builder must first serve the candidate on a temporary test endpoint, or run batch inference, and supply red-teaming tooling separately."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/evaluation-overview
      - at: evaluation->registry
        text: "In Google's blueprint the pipeline itself imports a validated model into Model Registry and a data scientist decides what goes to production. There is no signing step or separate promotion identity; the builder must add both."
        url: https://docs.cloud.google.com/architecture/blueprints/genai-mlops-blueprint
      - at: storage->registry
        text: "Model Registry records a Cloud Storage folder path and a serving container image, not a digest or signature. The builder's promotion step must compute the digest, sign it, and keep both beside the artifact or as labels on the version."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/model-registry/import-model
      - at: upstreamArtifacts->pkgRegistry
