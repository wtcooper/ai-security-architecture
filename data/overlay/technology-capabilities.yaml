    description: Replaces sensitive values with tokens. Re-identification and token-vault access remain relevant
      to privacy.
    primarySource:
      framework: enisa-ecsmaf
      entry: tokenisation
    frameworkMappings:
      - framework: enisa-ecsmaf
        entry: tokenisation
        relationship: same-category
        rationale: Uses the published category; the display name may expand an acronym or normalize spelling.
      - framework: nist-csf
        entry: PR.DS
        relationship: supports
        rationale: Reduces exposure of original sensitive values.
    mitigationMappings:
      - mitigation: AML.M0020
        rationale: Token replacement can implement sensitive-data transformation at AI boundaries.
