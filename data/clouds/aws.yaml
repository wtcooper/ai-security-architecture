  - architecture: archAgentSandbox
    asOf: "2026-10"
    # >>> checked against the vendor's documentation
    verified: "2026-11-18"
    sources:
      graders: https://docs.aws.amazon.com/sagemaker/latest/dg/realtime-endpoints.html
      platform: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-vpc.html
      orchestrator: https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod.html
      sandbox: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-sessions.html
      harness: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agents-tools-runtime.html
      localTools: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/browser-tool.html
      storage: https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html
      inference: https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-model-deployment-deploy-ftm.html
      offlineWeb: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/what-is.html
      registry: https://docs.aws.amazon.com/codeartifact/latest/ug/welcome.html
      sources: https://docs.aws.amazon.com/codeartifact/latest/ug/external-connection.html
    differences:
      - at: localTools->offlineWeb
        text: "AgentCore Browser is not inside the rollout's microVM: the rollout drives a separate Browser session through the AgentCore API, so browsing leaves through that session, not the shell. Create the custom browser in VPC mode on the sandbox subnets, grant the rollout role only the browser actions it uses, and stop the session with the episode."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/browser-tool.html
    alsoNeeded:
      - service: "Amazon ECR"
        role: registry
        why: "Holds the rollout container image; VPC-mode runtimes need ECR and S3 endpoints to pull it."
        url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/what-is-ecr.html
      - service: "SageMaker Runtime interface endpoint (AWS PrivateLink)"
        role: network
        why: "Private path from the sandbox subnets to the vLLM endpoint; the listed endpoints name Bedrock instead."
        url: https://docs.aws.amazon.com/sagemaker/latest/dg/interface-vpc-endpoint.html
      - service: "Amazon VPC with AWS Network Firewall and Route 53 Resolver DNS Firewall"
        role: network
        why: "Private subnets in supported Availability Zones, with no NAT route for rollouts."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-vpc.html
      - service: "IAM roles and EKS Pod Identity"
        role: identity
        why: "Separate roles for rollouts, orchestrator, inference and graders."
        url: https://docs.aws.amazon.com/eks/latest/userguide/pod-identities.html
      - service: "AWS IAM Identity Center"
        role: identity
        why: "Workforce sign-in for the researchers who submit runs and read results."
        url: https://docs.aws.amazon.com/singlesignon/latest/userguide/what-is.html
      - service: "AWS KMS"
        role: keys
        why: "Customer managed keys for checkpoint and trajectory buckets and log groups."
