id: archPersistentManagedAgents
surface: surfaceSaas
rank: 5
title: Persistent managed agents
abbrev: Persistent agents

summary:
  - >
    A vendor-hosted agent that continues across tasks, keeping its memory, files and a
    logged-in browser, and takes work from approved channels and its own schedules as well as
    from the person who set it up. Unlike a coding & desktop session, it holds standing
    connector grants and saved logins, so each consequential action is approved at dispatch
    rather than through a reviewed pull request. It works through the vendor's connectors and
    a hosted computer, and reaches our own systems only down the tunnel to our AI gateway.

description:
  - >
    The continuing agent is the unit of governance: a new conversation resets none of its
    owner, audience, schedules, retained state or standing grants. A team channel can have a
    wider audience than the person whose grant the agent uses. Stopping it means halting
    work, disabling schedules, revoking grants and clearing retained memory and browser state.
  - >
    Its key tools: the vendor's connectors to the SaaS we approved (Tool services in the vendor
    band); the hosted computer's browser and shell; package installs and public source control
    under one egress allowlist; its retained memory; its schedules; and an outbound-only tunnel
    to our AI gateway, the only route into our own systems.
  - >
    The baseline reads with scoped accounts and returns drafts. A consequential write needs an
    authenticated human approval bound to the exact action at dispatch; where a product cannot
    enforce that gate, leave the operation unavailable. Provider internals are assessed through
    vendor assurance, not drawn.

distinguishedBy:
  - >
    Against the coding & desktop runtime's hosted sessions: a session does one task, started by
    a person or a repository event, on a per-task grant — usually the initiator's — and its
    environment is reclaimed; its work is code, gated by a reviewed pull request. This agent
    continues on standing grants, a shared bot acting on its owner's or a service account, and
    its work is business SaaS — mail, documents, calendars, the web — gated per action at
    dispatch.
  - >
    Against enterprise chat: chat centres on conversations and tenant content; this pattern
    centres on a continuing agent with retained context, standing authority and recurring work.
  - >
    Against the API/SDK managed agent runtime: customer software invokes and integrates that
    loop. This agent is consumed through the vendor's product and approved channels, with no
    application of ours in front of it.

exemplars:
  - name: OpenAI Dots
    note: >
      Persistent assistants with continuing context, connected apps and a cloud computer.
      Rolling out to Pro and Business Premium; Enterprise access is an admin-enabled beta.
    url: https://openai.com/index/introducing-dots/
    asOf: "2026-10"
  - name: Grok Bot
    note: >
      Persistent personal and team bots with hosted computers, browser sessions and connected
      apps, offered on paid individual and Teams plans. Personal bots share their user's computer.
    url: https://cursor.com/docs/grok-bot
    asOf: "2026-10"

zones:
  - id: zoneUser
    owner: user
    note: >
      The owner and requesters in the vendor's product, and the team channels where anyone the
      channel admits can give the agent work. Only an authorised approver may approve a
      consequential action.
  - id: zoneCloud
    owner: cloud
    note: >
      The tunnel the agent reaches back through, our gateway where it is admitted to our tool
      servers, and the systems behind them.
  - id: zoneVendor
    owner: vendor
    note: >
      The agent provider, under our agreement: the product that admits work, the runtime that
      keeps the agent's state between tasks, and its connectors to the SaaS we approved.
  - id: zoneExternal
    owner: external
    note: >
      What the agent reaches out to under its egress policy: public repositories, the package
      and skill sources its hosted computer installs from, and the open web its browser reads
      and acts on. Every edge here is opened from the vendor's side; nothing in this band
      connects back in.
  - id: zoneGovernance
    owner: governance
    note: Customer administration, supplier assurance and response across the continuing agent's lifetime.

blocks:
  - id: user
    kind: actor
    title: End user
    icon: person
    zone: zoneUser
    col: 0
    row: 1
    note: An authenticated owner or requester; only an authorised approver may approve the proposed action.
  - id: remoteDevice
    kind: service
    title: Remote device
    cosaiComponent: componentAgentUserQuery
    zone: zoneUser
    col: 0
    row: 2
    note: >
      Team channels the agent belongs to. Anyone the channel admits can give it work, and it
      answers on its owner's or a service account rather than as the person who typed — the
      widest admission decision on the drawing.
    items:
      - id: chatChannels
        label: Chat channels
        icon: chat
        note: Slack, Teams and similar team spaces; the channel's membership is the audience for everything the agent posts.
  - id: vendorService
    kind: provider
    title: Vendor service
    cosaiComponent: componentApplication
    zone: zoneVendor
    col: 3
    row: 1
    note: >
      The vendor's product and channel integrations, and the customer-visible configuration
      surface: who may create, share and invoke an agent, and the schedules it keeps.
    items:
      - id: settings
        label: Managed settings
        icon: gear
        note: Membership, agent ownership, sharing and available action modes.
      - id: schedules
        label: Remote & scheduled sessions
        icon: phone
        note: >
          Channel requests and the recurring work the agent keeps, each schedule with a named
          owner, scope and expiry; recurrence does not renew authority.
      - id: audit
        label: Session audit export
        icon: eye
        note: Available product events, exported with documented gaps in tool and browser visibility.
  - id: managedRuntime
    kind: provider
    title: Managed runtime
    cosaiComponent: componentReasoningCore
    zone: zoneVendor
    col: 4
    row: 1
    note: >
      The hosted agent loop and the state it keeps between tasks. Per-agent, per-user and shared
      computer or memory scopes must be established from the product; no per-agent VM is assumed.
    items:
      - id: harness
        label: Agent harness
        icon: agent
        note: Runs admitted work and consumes tool results within the configured authority.
      - id: inference
        label: Model inference
        icon: model
        note: Provider-operated inference inside the managed service.
      - id: memory
        label: Memory store
        icon: folder
        note: >
          Memory, conversation history, work files and browser sessions kept between tasks —
          the property that makes this a different class from a hosted session. Each can have
          its own sharing and deletion lifetime.
      - id: vault
        label: Credential vault
        icon: key
        note: >
          The standing authority the agent holds between tasks: connector grants, browser
          cookies and saved logins. They are distinct credentials; a vault claim need not cover
          all three.
      - id: mcp
        label: MCP client
        icon: plug
        note: Calls the vendor's connectors, and our gateway down the tunnel, on the grants the vault holds for this agent.
  - id: nativeTools
    kind: provider
    title: Native tools
    cosaiComponent: componentTools
    zone: zoneVendor
    parent: managedRuntime
    col: 0
    row: 0
    note: >
      Hosted file, shell and browser operations invoked by the enclosing runtime. Containment represents
      that local dispatch and result path, as in the other managed-runtime architectures.
    items:
      - id: files
        label: File & edit tools
        icon: folder
        note: Work files may survive individual tasks; restrict accessible material and verify its lifecycle.
      - id: shell
        label: Shell commands
        icon: code
        note: Commands on the hosted computer, an alternate route to the network beside the browser.
      - id: browser
        label: Browser tools
        icon: globe
        note: Hosted browsing with separately governed cookies, saved accounts and destination rules.
  - id: vendorTools
    kind: service
    title: Tool services
    cosaiComponent: componentTools
    zone: zoneVendor
    col: 4
    row: 0
    pack: toolServicesRemote
    note: >
      The vendor's connectors to the SaaS we approved — mail, documents, calendars — called on
      the agent's standing grants under our agreement. A service outside any agreement is not
      connected. This baseline enables APIs and connectors only; A2A peers need a reviewed flow
      before use.
  - id: tunnel
    kind: service
    title: Tunnel connector
    cosaiComponent: componentAgentUserQuery
    zone: zoneCloud
    col: 2
    row: 3
    note: >
      Vendor-supplied software we run inside our own network so the agent's runtime can reach
      our gateway without an inbound rule: it dials out, holds the connection open and carries
      the requests in. Transport only — it does not authenticate to the upstream, and the
      payloads still traverse the vendor's cloud — so it hands to the AI gateway, never to a
      server or the data. Verify per product that its persistent agents can use the tunnel;
      where they cannot, this path stays closed.
    items:
      - id: tunnelClient
        label: Outbound connector
        icon: plug
        note: Dials out to the vendor's edge; opens nothing inbound.
  - id: aiGateway
    kind: service
    title: AI gateway
    zone: zoneCloud
    col: 2
    row: 4
    note: >
      The customer-operated crossing where the agent is admitted to our MCP servers: the one
      component on the reach-back path where the grant is ours to scope and revoke and the call
      is recorded on our terms. Not on the inference path: the agent's model calls stay with
      the vendor.
    items:
      - id: gwTools
        label: MCP & API gateway
        icon: plug
        note: Which of our servers the agent may reach, and on whose grants.
  - id: internalTools
    kind: service
    title: Tool services
    cosaiComponent: componentTools
    zone: zoneCloud
    col: 1
    row: 4
    pack: toolServicesRemote
    note: >
      Our own MCP servers and connectors — ticketing, documentation, systems of record — that
      the agent is approved to reach.
  - id: orgData
    kind: external
    title: Enterprise data
    cosaiComponent: componentDataSources
    zone: zoneCloud
    col: 1
    row: 5
    pack: enterpriseData
    note: The systems of record behind those servers, reached on grants we scope per agent.
  - id: openWeb
    kind: external
    title: Open web
    cosaiComponent: componentDataSources
    zone: zoneExternal
    col: 5
    row: 2
    note: >
      Search results and the pages the hosted browser reads and acts on. Every page is someone
      else's text and enters the loop as instruction; a logged-in session there carries the
      agent's saved authority.
    items:
      - id: webSearch
        label: Web search
        icon: search
        note: Results ranked by someone else, read as context.
      - id: pages
        label: Arbitrary pages
        icon: globe
        note: Visible and hidden text alike — and the form a disclosure is typed into.
  - id: publicRepos
    kind: service
    title: Source control
    cosaiComponent: componentDataSources
    zone: zoneExternal
    col: 5
    row: 0
    note: >
      Public source control: open repositories the agent clones read-only — an upstream
      dependency, an example, a project to patch. Untrusted like any page: the instruction
      files and issue text in someone else's repository are someone else's instructions.
    items:
      - id: publicRepositories
        label: Public repositories
        icon: code
        note: Cloned read-only, never with a write credential the agent holds.
  - id: sources
    kind: external
    title: Public package sources
    zone: zoneExternal
    col: 5
    row: 3
    note: >
      What the agent installs on its hosted computer: the vendor's own package mirror where it
      offers one, otherwise the public registries under the allowlist. Install only pinned
      versions verified against lockfile hashes or signatures. A registry is also a
      write-capable host every allowlist permits.
    items:
      - id: registries
        label: Package registries
        icon: db
        note: PyPI, npm and the rest — pinned versions, verified against lockfile hashes at install.
      - id: hubs
        label: Skill & extension hubs
        icon: gear
        note: Skills and plugins the agent or its owner adds, pinned to reviewed versions.
  - id: govIdentity
    kind: governance
    title: Identity services
    icon: person
    zone: zoneGovernance
    col: 0
    row: 6
    mitigations: [D3-MFA, D3-APA]
    note: Enrol authorised users and approvers, and remove access when their role changes.
  - id: govSecrets
    kind: governance
    title: Secrets & key management
    icon: key
    zone: zoneGovernance
    col: 1
    row: 6
    mitigations: [D3-CH, D3-CTS]
    note: >
      Track connector tokens, browser credentials and the tunnel's token and TLS key separately,
      including revocation at each issuer.
  - id: govPolicy
    kind: governance
    title: Policy & authorization
    icon: scale
    zone: zoneGovernance
    col: 2
    row: 6
    mitigations: [AML.M0028, AML.M0029, AML.M0031, AML.M0036, cap-agent-egress-control]
    note: Define permitted actions, approval conditions, retained-state policy and continuing-work limits.
  - id: govSupplyChain
    kind: governance
    title: Supply-chain assurance
    icon: db
    zone: zoneGovernance
    col: 3
    row: 6
    mitigations: [cap-ai-vendor-assessment, cap-agent-tool-registry]
    note: Maintain the approved population and assess provider controls that the customer cannot configure.
  - id: govObservability
    kind: governance
    title: Observability & response
    icon: eye
    zone: zoneGovernance
    col: 4
    row: 6
    mitigations: [cap-agent-tracing, cap-agent-kill-switch]
    note: Correlate available activity records and exercise stopping work and revoking continuing authority.

edges:
  - from: user
    to: vendorService
    path: external
    bidir: true
    label: request / approval / result
    note: Authenticated product session; approval authority is checked separately from the right to make a request.
  - from: user
    to: remoteDevice
    path: primary
    bidir: true
    label: in a team channel
    note: The owner — or anyone the channel admits — giving the agent work where the team already talks.
  - from: remoteDevice
    to: vendorService
    path: external
    bidir: true
    label: start & steer work
    note: >
      The channel talks to the vendor's integration directly; nothing we operate is on the path.
      Admission is whoever the channel admits, and the agent answers on its owner's or a
      service account, not as the person who typed.
  - from: vendorService
    to: managedRuntime
    path: primary
    bidir: true
    label: admitted work / status
    note: >
      Requests, channel messages and the agent's own schedules enter here; results and proposed
      actions return for review.
  - from: managedRuntime
    to: vendorTools
    path: external
    bidir: true
    label: scoped API call / result
    note: The vendor's connector on one of the agent's standing grants; returned records are untrusted task input.
  - from: nativeTools
    to: openWeb
    path: external
    outbound: true
    route: hv
    label: browser action / page
    note: >
      The hosted browser's own session and cookies, to allowed destinations only. Connector OAuth
      restrictions do not constrain this route, and the reply brings untrusted content in.
  - from: nativeTools
    to: sources
    path: external
    outbound: true
    route: vh
    label: package installs
    note: >
      Packages and skills the agent installs on its hosted computer, pinned and hash-verified,
      from the vendor's own package mirror where it offers one, otherwise the public registries
      under the allowlist; a changed or unpinned package fails the install. What it installs
      stays on a computer that persists between tasks. The registry is also a write-capable
      host every allowlist permits, which is what makes it an exfiltration channel.
  - from: managedRuntime
    to: publicRepos
    path: external
    outbound: true
    route: hv
    label: clone public repos
    note: >
      A read-only clone of a public repository from the hosted computer, under the same
      allowlist. A write credential the agent holds belongs to its own approved destinations
      alone.
  - from: managedRuntime
    to: tunnel
    path: external
    bidir: true
    route: vh
    label: outbound-only tunnel
    note: >
      The agent reaching back into our systems through software the vendor publishes and we
      run. Our side dials out, so nothing is opened inbound; the requests still traverse the
      vendor's cloud. The public-endpoint form — the vendor calling an internet-facing gateway
      URL — is not part of this baseline.
  - from: tunnel
    to: aiGateway
    path: primary
    bidir: true
    label: tool call / result
    note: >
      The tunnel hands to our gateway's aggregate MCP endpoint, never to a server or the data:
      admitted on audience-bound tokens and per-agent grants our own authorization server
      issued, per-call policy evaluated at the gateway, the servers and tools scoped to a named
      list, and every call recorded against the grant. The vendor's identity and IP ranges
      admit the caller; they authorise nothing.
  - from: aiGateway
    to: internalTools
    path: primary
    bidir: true
    label: brokered tool calls
    note: Which of our servers the agent may call, on short-lived grants we issue.
  - from: internalTools
    to: orgData
    path: primary
    bidir: true
    label: scoped reads & writes
    note: The records and systems the agent was approved to reach.

pins:
  risks:
    - risk: riskShadowAndUnknownAgents
      at: vendorService
      note: An unregistered persistent agent or schedule continues outside the approved owner and connector inventory.
    - risk: riskAgenticDelegationConfusedDeputy
      at: vendorService->managedRuntime
      note: A channel participant induces work using a broader owner's or shared account's authority.
    - risk: riskSensitiveDataDisclosure
      at: managedRuntime
      note: Retained context acquired for one audience is reused in a task or channel with a wider audience.
    - risk: riskPromptInjection
      at: managedRuntime
      note: An instruction retained from untrusted content influences later tasks through continuing memory or files.
    - risk: riskRunawayAgentToolLoops
      at: managedRuntime
      note: Repeated tasks and retries consume resources after the original requester has stopped watching.
    - risk: riskPromptInjection
      at: managedRuntime->vendorTools
      note: A connector response embeds instructions that try to redirect the agent's next action.
    - risk: riskRogueActions
      at: managedRuntime->vendorTools
      note: A write exceeds the current approved purpose even though the connected account can technically perform it.
    - risk: riskSensitiveDataDisclosure
      at: nativeTools->openWeb
      note: A logged-in browser exports retained sensitive material through an account unrelated to the current task.
    - risk: riskRogueActions
      at: nativeTools->openWeb
      note: A browser operation changes records or sends material beyond the exact action its owner approved.
    - risk: riskPromptInjection
      at: nativeTools->openWeb
      note: A returned public page attempts to obtain connected-account actions or disclosure of retained context.
    - risk: riskSensitiveDataDisclosure
      at: nativeTools->sources
      note: >
        The package registries every allowlist permits are write-capable: a package publish
        carries whatever the hosted computer holds — retained files, saved tokens — to a public
        index.
    - risk: riskInsecureIntegratedComponent
      at: nativeTools->sources
      note: >
        A malicious or compromised package or skill the agent installs runs on its hosted
        computer, beside retained files and saved logins, and stays there for later tasks.
        Pinning and hash verification stop a changed artifact; they do not make a reviewed
        version benign.
    - risk: riskAgenticDelegationConfusedDeputy
      at: tunnel
      note: >
        Their infrastructure exercising our authority, steered by whatever the agent read or
        kept. The grant is the only thing bounding it, and the grant is issued at our gateway —
        never let the vendor's tunnel or IP range reach past it.
  mitigations:
    - mitigation: D3-MFA
      at: user->vendorService
      note: Require a verified second factor for product access and privileged approval sessions; SSO alone is insufficient.
    - mitigation: D3-APA
      at: vendorService
      note: Administer who may create, invoke, share or reschedule agents, and who may change their account grants.
    - mitigation: AML.M0028
      at: managedRuntime->vendorTools
      note: Limit admitted tools and effective account grants by operation and resource; use read-only accounts for draft work.
    - mitigation: AML.M0028
      at: nativeTools
      note: Bound file access and browser-account permissions separately; do not attach a write-capable account to read-only work.
    - mitigation: AML.M0029
      at: vendorService->managedRuntime
      note: >
        Require an authenticated human decision bound to the exact consequential operation,
        arguments and target before dispatch. Auto-review or permission to log in is not this
        gate; leave consequential operations unavailable where it cannot be enforced.
    - mitigation: D3-CH
      at: managedRuntime
      note: >
        Configure protected credential storage, short lifetimes and rotation; keep raw secrets
        out of prompts and work files. Establish separately how saved browser credentials and
        cookies are protected and cleared.
    - mitigation: D3-CTS
      at: managedRuntime->vendorTools
      note: Restrict each connector credential to its designated recipient and audience; do not forward it to another tool or browser route.
    - mitigation: AML.M0031
      at: managedRuntime
      note: >
        Govern retained-state readers and writers, source provenance, correction, retention and
        recovery. Verify what deletion clears across memory, files and history; restrict sensitive
        durable use when the product cannot meet the required lifecycle.
    - mitigation: AML.M0036
      at: vendorService
      note: Enforce task duration, iteration and tool budgets plus aggregate recurring-work limits; a fresh run must not reset the owner's total allowance.
    - mitigation: cap-agent-egress-control
      at: nativeTools
      note: >
        One destination allowlist for the hosted computer's actual network routes — the browser,
        and the shell's fetches, clones and package installs — limited to the open web the task
        needs, public source control and the package sources or the vendor's mirror, with write
        methods restricted on hosts the list must permit. Verify redirects and alternate fetch
        tools. Enable these routes only for the data class their enforceable restrictions
        support; a connector allowlist is not egress control.
    - mitigation: D3-CH
      at: tunnel
      note: >-
        The tunnel token and TLS private key on this host are the load-bearing secrets on the path — issued
        scoped, rotated like a service credential, and revocable without redeploying the host. The tunnel
        carries traffic on them but never authenticates to our server; that is the gateway's job.
    - mitigation: AML.M0028
      at: aiGateway->internalTools
      note: >-
        Which servers and tools the agent may reach, on whose grant — a per-agent, audience-bound grant our
        authorization server issued, never the vendor's service identity: one aggregate endpoint fronting a
        named list, read-mostly unless a write has a named owner.
    - mitigation: cap-input-guardrails
      at: aiGateway
      note: >-
        Tool content returned through this gateway is classified here before it goes back to a loop we
        cannot see — and may be kept in its memory. Content from the vendor's own connectors never crosses
        it, so this pin covers none of theirs.
    - mitigation: cap-agent-tool-registry
      at: govSupplyChain
      note: >
        Register each agent's owner, audience, version, approval state, triggers, tools and grants.
        Reconcile actual tenant activity against that record and configure admission to deny
        unapproved agents and grants; inventory alone does not authorise their use.
    - mitigation: cap-ai-vendor-assessment
      at: managedRuntime
      note: Verify provider isolation, hidden credential handling, internal screening and retention claims with evidence; record gaps instead of drawing unobservable controls.
    - mitigation: cap-agent-tracing
      at: govObservability
      note: Correlate available agent, requester, schedule, tool and gateway records; establish coverage gaps before relying on reconstruction.
    - mitigation: cap-agent-kill-switch
      at: govObservability
      note: >
        Stop active work, disable recurring triggers and queued restarts, revoke connector,
        browser and gateway grants, and clear retained memory and browser state as a separate,
        verified step; confirm that work cannot resume on surviving authority.

walkthrough:
  title: A continuing agent prepares a work summary
  moves: >-
    Read approved SaaS, our own records and public context, keep only permitted working state,
    and return a draft to the authorised audience.
  steps:
    - follow: user->vendorService
      label: request a draft
      note: Resolve the requester and permitted audience before admitting the task.
    - follow: vendorService->managedRuntime
      label: admit scoped work
      note: Apply the continuing agent's current scope and budgets, not the authority of an arbitrary channel member.
    - follow: managedRuntime->vendorTools
      label: read approved SaaS
      note: Invoke an approved connector on the agent's scoped standing grant.
    - follow: vendorTools->managedRuntime
      label: consume records as data
      note: Returned records are task input, not instruction; record source and scope for anything retained.
    - follow: managedRuntime->tunnel
      label: tool call down the tunnel
      note: The agent needs a record only our systems hold; its MCP client calls back through the connection our side opened.
    - follow: tunnel->aiGateway
      label: to our gateway
      note: Admitted on a per-agent grant we issued, evaluated per call, scoped to a named server list.
    - follow: aiGateway->internalTools
      label: per-agent grant
      note: Admitted to a named server on a short-lived grant.
    - follow: internalTools->orgData
      label: read on our side
      note: The read happens on our side, which is the only reason it is bounded.
    - follow: tunnel->managedRuntime
      label: recorded result back
      note: The record returns the same way — classified and recorded at our gateway — to the loop.
    - follow: nativeTools->openWeb
      label: fetch allowed public context
      note: The runtime dispatches its nested browser tool; this route has its own egress restrictions.
    - follow: openWeb->nativeTools
      label: return untrusted page
      note: The tool returns page content to its enclosing runtime; the page grants no authority.
    - follow: managedRuntime->vendorService
      label: return draft and provenance
      note: Preserve only permitted continuing context, with the configured audience and retention.
    - follow: vendorService->user
      label: show draft to authorised audience
      note: A completed draft does not authorise sending or publishing it elsewhere.

scenarios:
  - title: A consequential browser action needs approval
    steps:
      - follow: managedRuntime->vendorService
        label: propose exact action
        note: Present the operation, account, target and arguments before any effect.
      - follow: vendorService->user
        label: request owner approval
        note: Use an authenticated approval surface; an untrusted page or channel participant cannot approve.
      - follow: user->vendorService
        label: approve this action
        note: Bind the decision to the presented action and reject changed or expired proposals.
      - follow: vendorService->managedRuntime
        label: release approved dispatch
        note: Refuse the operation if the product cannot enforce the required human gate.
      - follow: nativeTools->openWeb
        label: perform approved browser action
        note: Recheck the browser account and target against the approved proposal before effect.
      - follow: openWeb->nativeTools
        label: return action result
        note: The browser returns status to its enclosing runtime on the same session.
      - follow: managedRuntime->vendorService
        label: report outcome
        note: Report the actual effect and available evidence, including failures.
      - follow: vendorService->user
        label: deliver receipt
        note: The requester receives the outcome; continuing grants remain subject to revocation.
  - title: "Standing authority: a channel request and a schedule"
    steps:
      - follow: remoteDevice->vendorService
        label: request from a team channel
        note: Anyone the channel admits can give the agent work; nothing we operate is on this path.
      - follow: vendorService->managedRuntime
        label: runs on the owner's grants
        note: >
          The agent acts on its owner's or a service account's standing grants, not as the person
          who typed — the delegation a hosted task session does not have.
      - follow: managedRuntime->vendorTools
        label: standing grant, no new consent
        note: The connector call needs no fresh consent; the grant was given once and survives between tasks.
      - follow: vendorTools->managedRuntime
        label: kept in memory
        note: What comes back can be retained and shape later tasks for a different audience.
      - follow: managedRuntime->vendorService
        label: result posted to the channel
        note: The output's audience is the channel's membership, wider than the grant's owner.
      - follow: vendorService->remoteDevice
        label: visible to the whole channel
        note: Everyone in the channel reads it.
      - follow: vendorService->managedRuntime
        label: next run on a schedule
        note: >
          The agent's own schedule starts the next run with nobody present. Recurrence does not
          renew authority; disabling schedules and revoking grants is part of the stop.
  - title: An installed package tries to publish what the agent holds
    steps:
      - follow: nativeTools->sources
        label: install a package
        note: >
          A task needs a library, and the agent installs it on its hosted computer from a
          registry the allowlist permits.
      - follow: sources->nativeTools
        label: package runs on the hosted computer
        note: >
          Its install script runs beside retained files and saved logins, on a computer that
          persists into later tasks.
      - follow: nativeTools->sources
        label: publish as exfiltration
        note: >
          It publishes what it found to the same registry, a host every allowlist permits. The
          list said where the computer may talk, not what it may say; method restrictions and
          watching those hosts for writes are what remain.

deviations:
  - subject: Hosted browser and backend connector routes remain separate
    reason: >
      Provider-hosted tools are shown within Managed runtime using the existing SaaS grammar.
      The browser has a real outbound route to the open web and separate account state. Local
      desktop browsing, VPN routing or delegated child agents require their own enforcement and
      lifecycle review; none inherits connector restrictions automatically.
  - subject: The AI gateway carries tool traffic only
    reason: >
      The vendor calls its own model inside its own runtime — drawn as the Model inference item
      on the Managed runtime block, with no Model provider block on this drawing. The gateway
      is drawn with its one real traffic class rather than the registered aiGatewayTraffic
      pack, following the SaaS siblings.

