        summary: "The supervisor and its specialists run as one Strands Agents process in an AgentCore Runtime session, started by a Lambda function that EventBridge and SQS invoke. Runtime adds a microVM per run and async jobs past a 15-minute request, but no checkpoint log or replay: a session's compute ends at 8 hours on microVMs (14 days on Instances), so your code saves step state to AgentCore Memory or session storage and resumes the run when the approval event arrives."
        bindings:
          - { block: events, service: "Amazon EventBridge, SQS and AWS Lambda", note: "An ingress function validates the event and calls InvokeAgentRuntime with the run's session ID; rule targets list no AgentCore Runtime target.", url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-invoke-agent.html }
          - { block: harness, service: "Your agents on AgentCore Runtime", builtWith: "Strands Agents", note: "One runtime session per run, in its own microVM; idle timeout 15 minutes and maximum lifetime 8 hours by default.", url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agents-tools-runtime.html }
          - { block: orchestration, service: "Your supervisor agent, checkpointing in your code", builtWith: "Strands Agents", note: "No durable steps: the supervisor writes each step's result to memory or session storage and reloads it when the run is invoked again.", url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-how-it-works.html }
          - { block: state, service: "AgentCore Memory and session storage", note: "Session storage (preview) keeps a session's files across stop and resume; AgentCore Memory holds events. Neither journals or replays steps.", url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-filesystem-configurations.html }
        dropSettings: [lambdaInvokePolicy, durableConfig, durableCallbackApproval, lambdaVpcConfig, durableStopExecution]
        addSettings: [runtimeResourcePolicy, runtimeExecutionRole, runtimeVpcMode, runtimeStopSession, strandsInterrupts, runtimeLifecycleConfig]
        differences:
          - at: orchestration->state
            text: "A durable function journals every step and replays after a failure. A Runtime session's state is ephemeral: if the microVM ends mid-run, only what your code already wrote to AgentCore Memory or session storage survives, and a step that had started can run twice unless you make it idempotent."
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-how-it-works.html
          - at: operator->events
            text: "A durable callback suspends for days without compute charge. A Runtime session is ended after 15 idle minutes by default and at 8 hours at most on microVMs, so waiting for an operator ends the session; the approval event invokes the runtime again with the same session ID, in a new microVM, and the supervisor reloads its state."
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-lifecycle-settings.html
          - at: events->harness
            text: "The function's resource-based policy tied the trigger to one EventBridge rule. Here an ingress Lambda function calls InvokeAgentRuntime, so the runtime's resource-based policy names that function's role, and the ingress function's own invoke permissions decide who can start a run."
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/resource-based-policies.html
          - at: harness
            text: "AWS's examples create runtimes with networkMode PUBLIC. The route through Network Firewall holds only once the runtime is set to VPC mode in private subnets, and in VPC mode it has no internet access unless those subnets route to a NAT gateway."
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-vpc.html
          - at: subagents
            text: "Runtime creates one workload identity for the whole runtime, and a Runtime-managed identity cannot fetch a workload access token directly. A principal per agent inside one process still needs workload identities that you create and request tokens for in code, as on Lambda."
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/get-workload-access-token.html
        alsoNeeded:
          - service: "AWS Lambda ingress function"
            role: ingress
            why: "EventBridge started the durable function directly, SQS for 15 minutes at most; a runtime needs InvokeAgentRuntime."
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-invoke-agent.html
          - service: "AgentCore Memory with the Strands Agents SDK integration"
            role: other
            why: "Holds the conversation and step state that Lambda's checkpoint log held."
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/strands-sdk-memory.html
          - service: "Amazon ECR repository (container deployments)"
            role: registry
            why: "A runtime deployed as a container pulls an ARM64 image from Amazon ECR; direct code deployment avoids it."
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-how-it-works.html
        quickstart:
          - title: "Get started with AgentCore Runtime using the AgentCore CLI"
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-get-started-cli.html
          - title: "Handle asynchronous and long running agents with AgentCore Runtime"
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-long-run.html
          - title: "Configure AgentCore lifecycle settings"
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-lifecycle-settings.html
