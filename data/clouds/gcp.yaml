  - architecture: archAgentFederation
    asOf: "2026-10"
    # >>> checked against the vendor's documentation
    verified: "2026-11-18"
    sources:
      idp: https://docs.cloud.google.com/identity/docs/overview
      entry: https://docs.cloud.google.com/run/docs/securing/identity-aware-proxy-cloud-run
      authServer: https://docs.cloud.google.com/apigee/docs/api-platform/security/oauth/access-tokens
      harness: https://docs.cloud.google.com/run/docs/ai/a2a-agents
      localTools: https://adk.dev/tools-custom/function-tools/
      memory: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sessions
      gateway: https://docs.cloud.google.com/gemini/enterprise/docs/register-and-manage-an-a2a-agent
      internalTools: https://docs.cloud.google.com/apigee/docs/api-platform/apigee-mcp/manage-mcp-tool-access
      provider: https://docs.cloud.google.com/gemini-enterprise-agent-platform/overview
    differences:
      - at: harness->gateway
        text: "ADK sends model calls straight to Gemini with the agent's own service account unless you wrap the model in ApigeeLlm. To force the gateway, point model and MCP addresses at Apigee and remove direct model permission from the agent's account."
        url: https://adk.dev/agents/models/apigee/
      - at: gateway->provider
        text: "Google's reference sends the model call from the agent through Model Armor to Gemini, with no Apigee. Here Apigee calls the model with its own service account, so also turn on Model Armor floor settings to catch calls that bypass Apigee."
        url: https://docs.cloud.google.com/architecture/single-agent-ai-system-adk-cloud-run
      - at: gateway->internalTools
        text: "Google's reference has the agent call MCP servers on Cloud Run directly, protected by IAP and IAM, or through Agent Gateway. To make Apigee the only door, allow only Apigee's service account to invoke the tool services."
        url: https://docs.cloud.google.com/architecture/single-agent-ai-system-adk-cloud-run
      - at: gateway->authServer
        text: "There is no separate authorization server: the token endpoints are proxies inside the same Apigee. Its OAuth policy supports client credentials, authorization code, password and implicit grants only, so exchanging a peer's token for an internal one must be hand-built."
        url: https://docs.cloud.google.com/apigee/docs/api-platform/reference/policies/oauthv2-policy
      - at: idp->authServer
        text: "Apigee does not federate with Cloud Identity on its own. Google's guide for an A2A agent behind Apigee has the proxy check each user token itself: verify signed tokens against the issuer's keys, or call Google's tokeninfo endpoint for Google tokens."
        url: https://docs.cloud.google.com/gemini/enterprise/docs/register-and-manage-an-a2a-agent
      - at: gateway->peerVendor
        text: "Google's references send outbound A2A through Agent Gateway and admit peers through Agent Registry; Apigee is not mentioned. Agent Gateway for Cloud Run is Limited Preview, so with Apigee the card, skill and artifact checks are policies you write yourself."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/gateways/agent-gateway-overview
      - at: peerVendor
        text: "Google's custom SAML app is a browser sign-on: the user's browser carries the assertion to the vendor. No Google page opened shows a gateway attaching a user's SAML assertion to an agent call, so confirm how the user's identity reaches the vendor peer."
        url: https://knowledge.workspace.google.com/admin/apps/set-up-your-own-custom-saml-app
      - at: gateway->partner
        text: "Inbound peers reach Apigee only if you arrange it: Google says to set the Agent Card address to the Apigee proxy, require OAuth there, and keep the Cloud Run agent private so only Apigee's service account can invoke it."
        url: https://docs.cloud.google.com/gemini/enterprise/docs/register-and-manage-an-a2a-agent
      - at: memory
        text: "Cloud Run's A2A guide keeps task state in an A2A task store: in memory by default, lost on restart, or AlloyDB for production. Sessions holds conversation events, so multi-day tasks also need a persistent task store that you secure."
        url: https://docs.cloud.google.com/run/docs/deploy-a2a-agents
      - at: harness
        text: "This pattern's settings list has no network exit control. Unless Cloud Run sends all outbound traffic into the VPC and through Secure Web Proxy, the agent can call a peer directly and skip Apigee's checks."
        url: https://docs.cloud.google.com/secure-web-proxy/docs/overview
    alsoNeeded:
      - service: "IAM service accounts"
        role: identity
        why: "Each Cloud Run service, and Apigee's proxies, run as a service account you create and scope."
        url: https://docs.cloud.google.com/apigee/docs/api-platform/security/google-auth/overview
      - service: "VPC network with Direct VPC egress and Secure Web Proxy"
        role: network
        why: "Stops the agent calling peers or the internet directly, around Apigee."
        url: https://docs.cloud.google.com/secure-web-proxy/docs/overview
      - service: "Apigee networking and external load balancer"
        role: ingress
        why: "Peers reach Apigee through a load balancer; Apigee reaches the private agent through Private Service Connect."
        url: https://docs.cloud.google.com/apigee/docs/api-platform/get-started/networking-options
      - service: "Agent Runtime instance"
        role: other
        why: "Agent Platform Sessions can only be created under one, even with no agent deployed to it."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sessions/manage-with-api
      - service: "AlloyDB for PostgreSQL"
        role: other
        why: "Google's Cloud Run guide uses it as the persistent A2A task store; the default store is in memory."
        url: https://docs.cloud.google.com/run/docs/deploy-a2a-agents
      - service: "Secret Manager"
        role: secrets
        why: "Holds database passwords and any peer client secrets; the Cloud Run A2A guide uses it."
        url: https://docs.cloud.google.com/run/docs/deploy-a2a-agents
      - service: "Cloud KMS"
        role: keys
        why: "Customer-managed encryption keys for stored task data and sessions, where policy requires them."
        url: https://docs.cloud.google.com/kms/docs/cmek
      - service: "Artifact Registry and Binary Authorization"
        role: registry
        why: "Stores the agent's container image and allows only approved images to deploy."
        url: https://docs.cloud.google.com/binary-authorization/docs/overview
      - service: "Model Armor templates"
        role: other
        why: "The sanitize calls need a template, plus Sensitive Data Protection templates for de-identification."
        url: https://docs.cloud.google.com/model-armor/sanitize-prompts-responses
      - service: "Cloud Logging and Data Access audit logs"
        role: logging
        why: "Only tracing is in the settings; peer calls through Apigee and the platform also need audit logs."
        url: https://docs.cloud.google.com/logging/docs/overview
    quickstart:
      - title: "Deploy A2A agents to Cloud Run"
        url: https://docs.cloud.google.com/run/docs/deploy-a2a-agents
      - title: "Register and manage A2A agents"
        url: https://docs.cloud.google.com/gemini/enterprise/docs/register-and-manage-an-a2a-agent
    # <<< checked
    reference:
      - title: Single-agent AI system using ADK and Cloud Run — A2A security considerations
        url: https://docs.cloud.google.com/architecture/single-agent-ai-system-adk-cloud-run
      - title: Multi-tenant agentic AI system
        url: https://docs.cloud.google.com/architecture/multi-tenant-agentic-ai-system
      - title: ADK with Agent2Agent (A2A) Protocol
        url: https://adk.dev/a2a/
    summary:
      - >-
        Your agent on Cloud Run (for example built with ADK) speaking A2A both ways through the gateway,
        Apigee here: outbound it presents a Google-signed ID token to each peer platform and, where a
        vendor federates with Google, a SAML assertion for the user; inbound, peers are registered
        Apigee apps whose tokens, skills and quotas the gateway checks, with Model Armor screening every
        artifact in and de-identifying every payload out. Google's references name Agent Registry for
        admitted A2A agents and Agent Gateway for the crossing; Agent Gateway is Google-managed only for
        agents on Agent Runtime.
    bindings:
      - block: idp
        service: "Cloud Identity (Google as IdP)"
        note: "Custom SAML apps decide which groups' identity may travel to which vendor platform."
        options:
          - { name: "Cloud Identity (Google as IdP)", kind: commercial, url: "https://docs.cloud.google.com/identity/docs/overview", note: "Custom SAML apps decide which groups' identities may travel to which vendor platform.", packs: [googleCloudNative] }
          - { name: "Microsoft Entra ID federated with Cloud Identity", kind: commercial, url: "https://docs.cloud.google.com/architecture/identity/federating-gcp-with-azure-active-directory", note: "Entra ID stays the IdP; Google's reference provisions Cloud Identity users and signs them in through it." }
          - { name: "Okta federated with Cloud Identity", kind: commercial, url: "https://docs.cloud.google.com/architecture/identity/okta-provisioning-and-single-sign-on", note: "Okta provisions users into Cloud Identity and handles single sign-on, per Google's reference." }
          - { name: "Workforce Identity Federation", kind: commercial, url: "https://docs.cloud.google.com/iam/docs/workforce-identity-federation", note: "Sync-less: users of your external IdP sign in to Google Cloud without being copied into Cloud Identity." }
      - { block: entry, service: Cloud Run front end with IAP }
      - block: authServer
        service: "Apigee OAuth 2.0 token endpoints"
        note: "Issues our agent's tokens to registered peer apps; outbound, our agent's identity is a Google-signed ID token rather than a secret."
        options:
          - { name: "Apigee OAuth 2.0 token endpoints", kind: commercial, url: "https://docs.cloud.google.com/apigee/docs/api-platform/apigee-mcp/apigee-mcp-overview", note: "Issues tokens to peer agents registered as Apigee apps, with API products naming the skills each may call.", packs: [googleCloudNative] }
          - { name: "Keycloak on GKE", kind: open, url: "https://www.keycloak.org/docs/latest/server_admin/index.html", note: "Self-run OAuth server with a client per peer agent and standard token exchange.", packs: [openSourceOnGke] }
      - { block: harness, service: Your A2A agent on Cloud Run, note: "Your agent publishes its Agent Card and calls peers over A2A, in any framework (ADK does both); Agent Runtime is the managed alternative." }
      - { block: localTools, service: Your function tools in the agent, builtWith: Agent Development Kit (ADK) }
      - block: memory
        service: "Agent Platform Sessions"
        options:
          - { name: "Agent Platform Sessions", kind: commercial, url: "https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sessions", note: "Managed session history behind ADK's VertexAiSessionService, which needs an Agent Runtime resource.", packs: [googleCloudNative, agentPlatformGovernance] }
          - { name: "Firestore with your own session store", kind: commercial, url: "https://docs.cloud.google.com/firestore/native/docs/overview", note: "Serverless document database; ADK has no Firestore session service, so the store is code you write." }
          - { name: "Cloud SQL for PostgreSQL or AlloyDB with pgvector", kind: commercial, url: "https://docs.cloud.google.com/sql/docs/postgres/generate-manage-vector-embeddings", note: "ADK's DatabaseSessionService keeps sessions in PostgreSQL; the same managed database can hold embeddings with pgvector." }
          - { name: "Memorystore for Valkey", kind: commercial, url: "https://docs.cloud.google.com/memorystore/docs/valkey/about-vector-search", note: "Managed Valkey for fast session state, with vector search for retrieval." }
          - { name: "PostgreSQL with pgvector on GKE (CloudNativePG)", kind: open, url: "https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/deploy-pgvector", note: "Google's GKE tutorial runs the CloudNativePG operator with pgvector; you operate the cluster.", packs: [openSourceOnGke] }
      - block: gateway
        service: "Apigee (A2A and model proxies)"
        note: "Agent Gateway governs A2A natively for agents on Agent Runtime; early preview for Cloud Run."
        options:
          - { name: "Apigee (A2A and model proxies)", kind: commercial, url: "https://docs.cloud.google.com/apigee/docs/api-platform/get-started/ai-capabilities", note: "Peers as registered Apigee apps with keys and quotas; Apigee's AI capability list has model and MCP policies but none for A2A.", packs: [googleCloudNative] }
          - { name: "Agent Gateway with Model Armor", kind: commercial, url: "https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/gateways/agent-gateway-overview", note: "Mediates A2A natively, checking Agent Identity and Agent Registry; Google-managed for Agent Runtime, Preview on GKE, Limited Preview on Cloud Run.", packs: [agentPlatformGovernance] }
          - { name: "LiteLLM Proxy on GKE or Cloud Run", kind: open, url: "https://docs.litellm.ai/docs/a2a", note: "A2A agent gateway with per-key and per-team access to onboarded agents, beside its model and MCP gateways.", packs: [openSourceOnGke] }
          - { name: "Kong AI Gateway", kind: commercial, url: "https://developer.konghq.com/plugins/ai-a2a-proxy/", note: "AI A2A Proxy (Gateway 3.14+, AI Gateway Enterprise) is a transparent proxy: it traces A2A tasks and rewrites Agent Card URLs.", packs: [kongAiGateway] }
          - { name: "agentgateway", kind: open, url: "https://agentgateway.dev/", note: "Linux Foundation project started by Solo.io: one data plane for LLM, MCP and A2A traffic, with Gemini and Vertex providers." }
      - block: internalTools
        service: "Your MCP servers on Cloud Run, behind the gateway"
        options:
          - { name: "Your MCP servers on Cloud Run, behind the gateway", kind: commercial, url: "https://docs.cloud.google.com/run/docs/host-mcp-servers", note: "Tool servers you write and host on Cloud Run, which Google documents for MCP, reached only through the gateway.", packs: [googleCloudNative] }
          - { name: "MCP Toolbox for Databases", kind: open, url: "https://mcp-toolbox.dev/", note: "Google's open-source MCP server for AlloyDB, BigQuery, Cloud SQL, Spanner and other databases, with client SDKs and ADK support (release 1.18.0)." }
          - { name: "Google Cloud remote MCP servers", kind: commercial, url: "https://docs.cloud.google.com/mcp/overview", note: "Google-hosted MCP servers for Google and Google Cloud services, governed with IAM; no server for you to run." }
          - { name: "MCP in Apigee (APIs exposed as MCP tools)", kind: commercial, url: "https://docs.cloud.google.com/apigee/docs/api-platform/apigee-mcp/apigee-mcp-overview", note: "Turns APIs already managed in Apigee into MCP tools with OAuth and per-tool policies; on Apigee hybrid from 1.17.0." }
      - { block: orgData, service: Your systems of record, build: true }
      - { block: peerVendor, service: A vendor platform's agent, note: "Under an agreement and a SAML or OIDC federation with Cloud Identity." }
