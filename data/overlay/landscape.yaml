# The enterprise landscape: the MITRE parent capabilities placed onto three well-known framings,
# so leadership can read coverage and gaps at the enterprise level before opening any one
# reference architecture. Specialisations follow their parent and are never placed here.
#
# A placement is one string per view: "group" or "group/lane" for a grouped view, "row/column"
# for the matrix. The build requires every MITRE parent to be placed exactly once in every view.
attribution: The framings are borrowed, not invented — CISA's Zero Trust Maturity Model pillars,
  Sounil Yu's Cyber Defense Matrix form with NIST CSF 2.0 functions, and Gartner's AI TRiSM
  market layers. Placing each MITRE capability onto them is this repository's authored judgement,
  one primary home per view; it does not claim the framework authors would place it the same way.
views:
  - id: domains
    title: Security domains
    short: Domains
    kind: groups
    basis: CISA Zero Trust Maturity Model v2.0 — five pillars, three cross-cutting capabilities
    url: https://www.cisa.gov/zero-trust-maturity-model
    description: >-
      The enterprise view your security organisation already runs: pillars are the estates
      teams own, and the bars beneath them cut across every pillar. Read a column to see how much
      of AI security lands on one team; read a bar to see what has to be organisation-wide.
    groups:
      - id: identity
        title: Identity & access
        role: pillar
        blurb: Human, workload and agent identities, their credentials, and authorization at every boundary
      - id: devices
        title: Devices & endpoints
        role: pillar
        blurb: The managed device an agent runs on — isolation, process behaviour, browser sessions
      - id: networks
        title: Networks
        role: pillar
        blurb: Segmentation, egress control and message security between components
      - id: workloads
        title: Applications & workloads
        role: pillar
        blurb: The AI application, its models, its agents and their supply chain
        lanes:
          - id: models
            title: Models & supply chain
          - id: apps
            title: Applications & agents
          - id: testing
            title: Development & testing
      - id: data
        title: Data
        role: pillar
        blurb: Training, retrieval and state data — inventory, provenance, encryption, recovery
      - id: visibility
        title: Visibility & analytics
        role: crosscutting
        blurb: Telemetry, inventories and detection analytics that span every pillar
      - id: automation
        title: Automation & orchestration
        role: crosscutting
        blurb: Response and recovery actions — revoke, terminate, restore
      - id: governance
        title: Governance
        role: crosscutting
        blurb: Risk assessment and assurance programmes over the whole estate
  - id: matrix
    title: Asset × function matrix
    short: Matrix
    kind: matrix
    basis: Cyber Defense Matrix form — AI asset classes against the NIST CSF 2.0 functions
    url: https://cyberdefensematrix.com/
    description: >-
      Every cell is one question — do we protect our models, can we recover our data — so an
      empty cell is a finding in itself. Two kinds of gap show here: a hatched cell is one the
      catalogue has no capability for at all; a tinted tile is one the organisation has assessed.
    rows:
      - id: data
        title: Data
        blurb: Training, retrieval, evaluation and state data
      - id: model
        title: Models
        blurb: Weights, artifacts, behaviour and the model supply chain
      - id: application
        title: Applications
        blurb: The AI application, its prompts, configuration and gateway
      - id: agent
        title: Agents & tools
        blurb: Agent runtime, tool invocation, memory and delegated authority
      - id: identity
        title: Identities & credentials
        blurb: Human, workload and agent identities and their secrets
      - id: platform
        title: Platform & infrastructure
        blurb: Hosts, runtimes, networks and the software stack
    columns:
      - id: govern
        title: Govern
        blurb: Policy, oversight and risk management
      - id: identify
        title: Identify
        blurb: Inventory, provenance and risk assessment
      - id: protect
        title: Protect
        blurb: Safeguards that prevent or limit an event
      - id: detect
        title: Detect
        blurb: Finding an event as it happens
      - id: respond
        title: Respond
        blurb: Containing a detected event
      - id: recover
        title: Recover
        blurb: Restoring what an event damaged
  - id: layers
    title: AI TRiSM layers
    short: Layers
    kind: groups
    basis: After Gartner AI TRiSM (2025) — four market layers from governance down to the stack
    url: https://www.gartner.com/en/documents/6185655
    description: >-
      The framing the market sells in. The top two layers are the AI-native products leadership
      is being pitched; the bottom two are the enterprise controls that have to be extended to AI.
      Read down the stack to see where the organisation is buying new and where it is reusing.
    groups:
      - id: governance
        title: AI governance & assurance
        blurb: Inventory, risk assessment, policy administration, testing and red-teaming of AI systems
      - id: runtime
        title: AI runtime inspection & enforcement
        blurb: Guardrails, authorization and control over prompts, outputs, tools and agent actions at inference time
      - id: information
        title: Information governance
        blurb: Provenance, protection, access monitoring and recovery of the data AI consumes and produces
      - id: infrastructure
        title: Infrastructure & stack
        blurb: The foundational controls AI runs on — identities, networks, hosts, artifacts and models
        lanes:
          - id: identity
            title: Identity & secrets
          - id: network
            title: Network & messaging
          - id: host
            title: Hosts & runtime
          - id: supply
            title: Artifacts, models & supply chain
