        security groups, Network Firewall and a DNS Firewall allow list) driven by your RL orchestrator
        on compute you choose (SageMaker HyperPod here; Amazon EKS or AWS Batch also serve), which
        serves the policy from its own inference tier (vLLM here) and scores episodes with graders the
        sandbox cannot reach. Rollouts browse an offline web you host and install from a read-only
        CodeArtifact mirror; trajectories ship to CloudWatch and S3 in an account no rollout can write.
