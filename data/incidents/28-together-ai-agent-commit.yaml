id: together-ai-agent-commit
title: "Together AI: a coding agent commits a key, and an outsider downloads customers' prompts"
subtitle: >
  While working on a public repository, an AI coding agent committed a credential for a private
  Hugging Face repository of customer prompt samples. Scanning caught it and the commit was
  reverted, but an outsider had already used it to download the samples and test the
  credentials inside them.
date: 2026-11
dateRange: June – November 2026 (disclosed 21 November)
category: aiMadeExposure
perspective: target
# The key left through a coding agent's commit to a developer's repository; Together AI did not name the agent product, so the third-party coding agent pattern is assumed.
archetype: archCodingAgentThirdParty
caveat: >
  Together AI's notice is the only first-hand account, and the press repeats it. It does not
  name the coding agent or say when the commit was made, how long the credential was exposed or
  how many prompts were downloaded, and its review of personal data was still under way. The
  Hacker News adds that Together AI understands the data has been deleted; the notice as
  published does not say so.
breaks:
  - control: D3-CH
    how: "Scoped, short-lived credentials, or keyless access where the service supports it (Together AI's first fix), leave a committed key little to open and little time to open it."
  - control: cap-sensitive-data-redaction
    how: "Run the same secret detection on what the agent commits and pushes as on what it sends to the web, before the push; here the scan found the key once it was already public."
  - control: cap-agent-action-policy-enforcement
    how: "A push to a public repository is something the agent proposes and a person confirms, locked in the vendor's managed settings so no developer loosens it."
summary:
  - >
    Together AI kept samples of customer prompts, sent to its serverless inference service in
    June and July 2026, in a private Hugging Face repository for routine software testing.
    During development of its public GitHub repository, xorl, an AI coding agent committed a
    credential for that repository. Automated scanning detected it and the commit was reverted,
    but during the exposure window an unauthorized party obtained the credential and downloaded
    the samples.
  - >
    The party then searched the prompts for credentials to other services and tested whether
    they worked. Five of the credentials it tested were canaries from a Dragos experiment, which
    submitted about two million prompts carrying unique links and credentials to AI providers
    between July and November 2026.
  - >
    What a coding agent commits is as public as the repository it pushes to, and a scan that
    runs after the push dates the leak rather than preventing it. Together AI moved to scoped or
    short-lived credentials and keyless access, credential checks on every pull request, updated
    rules for AI coding agents, and zero data retention as the default for new accounts.
risks:
  - riskInsecureModelOutput
  - riskSensitiveDataDisclosure
steps:
  - n: 1
    title: Customer prompts kept for testing
    phase: introduced
    narrative: >
      For routine software testing, Together AI collected authorized samples of prompts sent to
      its serverless inference service and stored them in a private Hugging Face repository. The
      samples came from requests to the MiniMax M3, GLM-5.2 and Kimi K2.6 models, mainly on 24
      June and 4, 8 and 14 July 2026.
    path: [orgData]
    risks:
      - riskSensitiveDataDisclosure
    sources:
      - title: "Security event: Prompt leakage for requests in June and July of 2026"
        url: https://www.together.ai/blog/security-event-prompt-leakage-for-requests-in-june-and-july-of-2026
        publisher: Together AI
        date: 2026-11-21
  - n: 2
    title: A coding agent commits the key to a public repository
    phase: introduced
    narrative: >
      During development of Together AI's public GitHub repository, xorl, an AI coding agent
      committed a credential that granted access to the private Hugging Face repository. Together
      AI did not name the agent or say when the commit was made.
    path: [developer->harness, toolPlane->sourceControl]
    risks:
      - riskInsecureModelOutput
    sources:
      - title: "Security event: Prompt leakage for requests in June and July of 2026"
        url: https://www.together.ai/blog/security-event-prompt-leakage-for-requests-in-june-and-july-of-2026
        publisher: Together AI
        date: 2026-11-21
      - title: "OpenRouter Drops 3 Providers After Researchers Catch Months of Prompt Theft at AI Hosting Firms"
        url: https://thehackernews.com/2026/11/openrouter-drops-3-providers-after.html
        publisher: The Hacker News
        date: 2026-11-22
  - n: 3
    title: Scanning catches it, after an outsider has it
    phase: exposed
    narrative: >
      Together AI's automated scanning detected the exposed credential and the commit was
      reverted. During the exposure window, an unauthorized party obtained the credential. The
      notice does not say how long the window lasted.
    path: [sourceControl]
    risks:
      - riskSensitiveDataDisclosure
    sources:
      - title: "Security event: Prompt leakage for requests in June and July of 2026"
        url: https://www.together.ai/blog/security-event-prompt-leakage-for-requests-in-june-and-july-of-2026
        publisher: Together AI
        date: 2026-11-21
  - n: 4
    title: The samples are downloaded and searched for more keys
    phase: exposed
    narrative: >
      The party used the credential to download the stored prompt samples, then searched them
      for credentials to other services and tested whether those worked. Five of the
      credentials it tested were canaries from a Dragos experiment that had submitted about two
      million prompts, each carrying unique links and credentials, to AI providers between July
      and November 2026. Together AI worked with an external forensic firm and law enforcement,
      found no evidence of prompt leakage beyond this incident, and was still reviewing whether
      sensitive personal information was exposed.
    path: [orgData]
    risks:
      - riskSensitiveDataDisclosure
    sources:
      - title: "Security event: Prompt leakage for requests in June and July of 2026"
        url: https://www.together.ai/blog/security-event-prompt-leakage-for-requests-in-june-and-july-of-2026
        publisher: Together AI
        date: 2026-11-21
      - title: "OpenRouter Drops 3 Providers After Researchers Catch Months of Prompt Theft at AI Hosting Firms"
        url: https://thehackernews.com/2026/11/openrouter-drops-3-providers-after.html
        publisher: The Hacker News
        date: 2026-11-22
      - title: "Three breaches, endless leaks: Your AI supply chain needs canaries"
        url: https://www.dragos.com/blog/ai-supply-chain-security-canary-tokens
        publisher: Dragos
        date: 2026-11-19
  - n: 5
    title: Where this chain breaks
    phase: mitigated
    narrative: >
      Give developers and their agents credentials that are scoped and short-lived, or no key at
      all where the service supports keyless access, so a committed key opens little for long.
      Scan what the agent commits before it is pushed, not once the repository is public, and
      treat any key that reached a public commit as taken: revoke it, because a revert removes
      the commit from the branch, not the key from whoever copied it. Make a push to a public
      repository something the agent proposes and a person confirms, set in the vendor's managed
      settings. And keep no customer prompts the work does not need: zero data retention, now
      Together AI's default for new accounts, leaves nothing to download.
    path: [developer->harness, toolPlane->sourceControl, vendorService, govSecrets, govPolicy]
    sources:
      - title: "Security event: Prompt leakage for requests in June and July of 2026"
        url: https://www.together.ai/blog/security-event-prompt-leakage-for-requests-in-june-and-july-of-2026
        publisher: Together AI
        date: 2026-11-21
alsoSeen:
  - title: "Claude Code's \"don't ask again\" writes secrets into a file that reaches public repositories"
    date: November 2026
    note: >
      Approving a command with "Yes, and don't ask again" saves the command string, any key in
      it included, as an allow rule in `.claude/settings.local.json`, and copies of that file get
      committed. Apiiro counted 1,379 distinct secrets in 1,122 public copies and GitGuardian,
      by its own method, 31,088 (5,343 valid) across 23,276 repositories; per GitGuardian,
      Anthropic's Claude Code lead said the team was looking into it and prototyping built-in
      secret scanning.
    sources:
      - title: "Claude Code's 'Don't Ask Again' File Exposes Passwords and Keys in 1,122 Public Copies on GitHub"
        url: https://thehackernews.com/2026/11/claude-codes-dont-ask-again-file.html
        publisher: The Hacker News
        date: 2026-11-07
      - title: "Claude Code settings.local.json Secrets: 17 months of exposure on GitHub, & Docker Hub"
        url: https://blog.gitguardian.com/claude-code-settings-local-json-secrets-docker-hub/
        publisher: GitGuardian
        date: 2026-11-09
