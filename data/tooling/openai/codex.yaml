# Codex — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
vendor: openai
family: Codex
tools:
  - id: toolCodex
    name: Codex
    surfaceClasses:
      - endpointCli
      - ideExtension
      - desktopApp
    variants:
      - name: Codex CLI
        class: endpointCli
      - name: Codex IDE extension
        class: ideExtension
      - name: Codex app
        class: desktopApp
    architecture: archCodingAgentThirdParty
    status: ga
    asOf: 2026-08
    summary:
      - "One agent across the CLI, the IDE extension and the ChatGPT desktop app, configured through
        TOML with a documented precedence chain and a genuine enterprise enforcement layer: an
        admin-authored requirements.toml that constrains approval policies, sandbox profiles,
        network, MCP servers and feature flags, and that users cannot override."
    items:
      - title: Admin-enforced requirements.toml
        body:
          - Requirements arrive by system file (/etc/codex/requirements.toml on Unix,
            %ProgramData%\OpenAI\Codex\requirements.toml on Windows), as a cloud-managed policy
            bundle assigned from chatgpt.com and delivered at sign-in, or via macOS MDM under
            com.openai.codex (base64-encoded TOML; the highest-precedence channel). If the cloud
            policy fetch fails with no valid cache, the client refuses to start unmanaged rather
            than failing open.
          - 'Enforceable keys cover the surfaces that matter: allowed_approval_policies and
            allowed_permission_profiles with default_permissions (e.g. pin ":workspace" and allow
            only read-only and workspace profiles), filesystem deny_read patterns for secrets paths,
            prefix command rules, managed hooks with allow_managed_hooks_only, experimental network
            domain allow/deny lists, and feature pins that disable computer use and browser surfaces
            org-wide.'
        links:
          - title: Codex managed configuration
            url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
          - title: Codex admin setup and rollout
            url: https://learn.chatgpt.com/docs/enterprise/admin-setup
      - title: Sandbox, approvals and network posture
        body:
          - Sandboxing is OS-enforced (Seatbelt on macOS, bwrap plus seccomp on Linux, a native
            Windows sandbox) with permission profiles from read-only through workspace-write to an
            explicit danger-full-access escape hatch. The agent runs with network access off by
            default; enabling it can route through a domain-filtering proxy, and .git, .codex and
            .agents stay read-only inside writable roots. Codex cloud blocks internet access during
            the agent phase by default, with per-environment allowlists and method restrictions.
        links:
          - title: Codex approvals and security
            url: https://learn.chatgpt.com/docs/agent-approvals-security
          - title: Codex cloud internet access
            url: https://learn.chatgpt.com/docs/cloud/internet-access
      - title: Workspace gating and compliance export
        body:
          - Workspace admins gate Codex Local (desktop app, CLI and IDE extension together) and
            Codex cloud separately, assign access by role with SCIM-synced groups, and set starting
            model defaults — enforced requirements still win. Codex usage, including the local
            clients, exports through the Compliance API and the immutable Compliance Logs Platform
            alongside workspace audit and authentication logs.
        links:
          - title: Using Codex with your ChatGPT plan
            url: https://help.openai.com/en/articles/11369540-using-codex-with-your-chatgpt-plan
          - title: Compliance API
            url: https://learn.chatgpt.com/docs/enterprise/compliance-api
    controls: []
    sources:
      - title: Codex managed configuration
        url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
      - title: Codex approvals and security
        url: https://learn.chatgpt.com/docs/agent-approvals-security
