# EXAMPLE tool status — the template an adopting organisation edits. `available` says whether
# people may install and use the product at all: either the organisation provides it or it
# blocks it, so it is a boolean, not a status. How well an available product is locked down is
# what `controls` says: per capability in the tool's reference control set (its architecture's
# pins), enabled | inProgress | gap, each with a `note` — the justification the Tools grid shows
# when someone hovers that cell: what was set up, or why it is not — and an optional `evidence`
# reference. Every pinned capability of every product listed here carries a note, so the hover
# always has something to say; rewrite the text to describe what you actually configured. A tool
# not listed is not available and renders greyed out when "Show status" is on; a capability with
# no key under an available tool reads as a gap with no reasoning. (Shipped example; replace it
# in data/org/local/.)
tools:
  - tool: toolClaudeCode
    available: true
    note: Approved for engineering on managed laptops; managed settings pushed by MDM.
    controls:
      capabilityIga: { status: enabled, note: SSO enforced through the claude.ai organisation; forceLoginMethod claudeai and forceLoginOrgUUID pinned in managed-settings.json }
      capabilityAgentRuntimeEnforcement: { status: enabled, note: permissions.deny rules for destructive shell commands and force-push in managed settings; a PreToolUse hook blocks commands that leave the repository }
      capabilityAiTprm: { status: enabled, note: Anthropic assessed in the TPRM platform against the SOC 2 Type 2 and ISO 27001 artifacts; annual re-review, evidence: TPRM-0417 }
      capabilityAiDlp: { status: inProgress, note: Read() deny rules cover .env and ~/.aws; sandbox credential masking waits on the sandbox rollout }
      capabilityToolPermissionScoping: { status: enabled, note: permissions.deny and allowManagedPermissionRulesOnly in managed-settings.json, evidence: CHG-1042 }
      capabilityAgentSandboxing: { status: gap, note: sandbox.enabled pending bubblewrap packaging for the Linux fleet }
      capabilityCredentialIsolation: { status: enabled, note: forceLoginOrgUUID; API keys blocked, the apps gateway holds the upstream key }
      capabilityMemoryProtection: { status: inProgress, note: Managed CLAUDE.md pushed org-wide; autoMemoryDirectory not yet pinned to a per-user path }
      capabilityPromptInjectionDefense: { status: inProgress, note: Built-in detections only; WebFetch limited to allowed domains, no inline classifier yet }
      capabilitySecretsManagement: { status: enabled, note: apiKeyHelper issues short-lived gateway tokens; no long-lived key on the device }
      capabilityMcpToolSecurity: { status: enabled, note: allowedMcpServers allowlist, managed-mcp.json is the only server set }
      capabilityHitlControls: { status: enabled, note: disableBypassPermissionsMode set; permissions.ask on git push and package publish }
      capabilityAgentRegistry: { status: inProgress, note: Seats assigned per role in the admin console; agent teams disabled until the inventory is complete }
      capabilityAuditLogging: { status: inProgress, note: OTel export to the SIEM from a pilot group }
      capabilityShadowAiDiscovery: { status: enabled, note: anthropic-allowed-org-ids header injected by the corporate proxy; personal logins blocked }
      capabilityKillSwitch: { status: enabled, note: SCIM deprovisioning removes the seat; requiredMinimumVersion forces upgrades }
      capabilityEdr: { status: enabled, note: EDR agent on every managed laptop with the documented process exclusions }
      capabilitySystemPromptManagement: { status: enabled, note: Managed policy CLAUDE.md at the managed path; strictPluginOnly on }
      capabilityAiBom: { status: gap, note: Vendor offers nothing; the inventory is kept by hand in the governance register }
      capabilityEgressControl: { status: inProgress, note: Gateway enforced for inference; sandbox network policy not yet rolled out }
      capabilityModelScanning: { status: gap, note: Not applicable on the device — no model artifacts are loaded; recorded so the gap is deliberate }
  - tool: toolCursor
    available: true
    note: Pilot with one team; Privacy Mode enforced, MCP allowlist under evaluation.
    controls:
      capabilityIga: { status: enabled, note: SSO through the team dashboard; MDM AllowedTeamId pins the tenant }
      capabilityAgentRuntimeEnforcement: { status: inProgress, note: Run Mode policy set to Auto-review for the pilot team; Allowlist mode planned }
      capabilityAiTprm: { status: enabled, note: Cursor assessed in the TPRM platform; ownership change flagged for re-review, evidence: TPRM-0522 }
      capabilityAiDlp: { status: inProgress, note: beforeReadFile hook redacts .env files; no beforeSubmitPrompt hook yet }
      capabilityToolPermissionScoping: { status: inProgress, note: MCP Configuration allowlist drafted; permissions.json not yet pushed by MDM }
      capabilityAgentSandboxing: { status: gap, note: sandbox.json not configured; developers run in the default mode }
      capabilityCredentialIsolation: { status: gap, note: Vendor offers nothing for the local agent — it runs with the developer's own credentials }
      capabilityMemoryProtection: { status: inProgress, note: .cursor Directory Protection on and Team Rules enforced; Workspace Trust policy pending }
      capabilityPromptInjectionDefense: { status: inProgress, note: Auto-review classifier on; Browser Controls domain allowlist not set }
      capabilitySecretsManagement: { status: enabled, note: Personal API keys blocked in Team Settings → Models }
      capabilityMcpToolSecurity: { status: inProgress, note: MCP Configuration allowlist under evaluation with the pilot team }
      capabilityHitlControls: { status: enabled, note: Auto-review Run Mode; MCP tools prompt by default }
      capabilityAgentRegistry: { status: gap, note: Team Marketplaces not yet configured; plugins are open }
      capabilityAuditLogging: { status: inProgress, note: Enterprise Audit Log enabled; SIEM streaming not yet connected }
      capabilityShadowAiDiscovery: { status: enabled, note: MDM AllowedTeamId blocks personal logins }
      capabilityKillSwitch: { status: enabled, note: SCIM deprovisioning; Model Access Control ready to disable a model }
      capabilityEdr: { status: enabled, note: EDR agent with the documented process exclusions }
      capabilitySystemPromptManagement: { status: enabled, note: Team Rules enforced from the dashboard }
      capabilityAiBom: { status: gap, note: Vendor offers nothing; kept by hand in the governance register }
      capabilityEgressControl: { status: gap, note: sandbox.json network policy not configured; the corporate proxy is the only control }
      capabilityModelScanning: { status: gap, note: Not applicable on the device — no model artifacts are loaded }
  - tool: toolClaudeManagedAgents
    available: true
    note: Design partner programme; vault scoping under review.
    controls:
      capabilityIga: { status: enabled, note: Console organisation on SSO; one workspace per team }
      capabilityNhiManagement: { status: inProgress, note: Vault display_name mapped to the owning service; no lifecycle review yet }
      capabilitySecretsManagement: { status: inProgress, note: Vault credentials with managed OAuth refresh for MCP; static bearer tokens still in two vaults }
      capabilityEncryptionKeyManagement: { status: gap, note: No customer-managed keys for sessions; accepted for the design partner phase }
      capabilityAgentRegistry: { status: enabled, note: Agents are workspace resources with metadata naming the owner }
      capabilityStagedRollout: { status: enabled, note: Agent versions bumped through the deployment pipeline; version pinned per environment }
      capabilityToolPermissionScoping: { status: inProgress, note: Toolsets default to enabled false; per-tool review in progress }
      capabilityHitlControls: { status: enabled, note: permission_policy always_ask on write tools }
      capabilityPromptInjectionDefense: { status: inProgress, note: Read-only memory stores and limited networking; no inline classifier }
      capabilityAiTprm: { status: enabled, note: Covered by the Anthropic TPRM assessment, evidence: TPRM-0417 }
      capabilityAgentObservability: { status: enabled, note: Session event stream shipped to the observability platform }
      capabilityAuditLogging: { status: inProgress, note: Session events retained; export to the SIEM not yet automated }
      capabilityModelGuardrails: { status: gap, note: Model-side safeguards only; no organisation guardrail on the session }
      capabilityMemoryProtection: { status: enabled, note: Memory stores attached read_only except the agent's own }
      capabilityModelEvals: { status: gap, note: No release-gate evaluation before an agent version goes live }
      capabilityAiGovernancePlatform: { status: inProgress, note: Agent and vault listings pulled into the governance register weekly by script }
      capabilityRateLimiting: { status: enabled, note: Session budget set on every agent }
      capabilityKillSwitch: { status: enabled, note: Agent archive and session delete runbook; on-call can interrupt a session }
      capabilityVendorAssurance: { status: enabled, note: Configuration read back through the API into the register }
  - tool: toolClaudeDesktop
    available: true
    note: Enterprise plan; connector directory restricted to approved connectors.
    controls:
      capabilityIga: { status: enabled, note: Require SSO for Claude; SCIM provisioning with groups }
      capabilitySse: { status: enabled, note: IP allowlisting to the corporate egress ranges; tenant restrictions header on the proxy }
      capabilityAiDlp: { status: inProgress, note: Endpoint DLP covers the desktop app; SaaS-side inspection pending }
      capabilityBrowserDetectionResponse: { status: enabled, note: Browser security extension inspects paste and upload on claude.ai }
      capabilityEgressControl: { status: enabled, note: Documented host allowlist on the proxy; egressProxyUrl pushed by MDM }
      capabilityAiGovernancePlatform: { status: inProgress, note: Compliance API pulled into the governance register; usage exports still manual }
      capabilityHitlControls: { status: enabled, note: Connector tools prompt per call; always-allow disabled by the Owner }
      capabilityPromptInjectionDefense: { status: inProgress, note: Connector tool restrictions in place; inference hooks pending }
      capabilityNhiManagement: { status: enabled, note: Compliance and Admin API keys scoped and rotated quarterly }
      capabilityVendorAssurance: { status: enabled, note: Effective settings read back through the Compliance API }
      capabilityDspm: { status: enabled, note: Retention set to 90 days; Compliance API delete on legal request }
      capabilityAiTprm: { status: enabled, note: Covered by the Anthropic TPRM assessment, evidence: TPRM-0417 }
      capabilityEncryptionKeyManagement: { status: gap, note: Customer-managed keys not requested; default encryption accepted }
      capabilitySecretsManagement: { status: enabled, note: Enterprise-managed connector authorisation; no per-user OAuth grants }
      capabilityToolPermissionScoping: { status: enabled, note: Connector directory restricted; write tools off for the organisation }
      capabilityDataAccessGovernance: { status: inProgress, note: Connectors act as the user; managed authorisation scoping under review }
      capabilityAgentRegistry: { status: enabled, note: Connector catalogue and extension allowlist in the console }
      capabilityAuditLogging: { status: enabled, note: Audit log export to the SIEM }
      capabilityShadowAiDiscovery: { status: enabled, note: Domain capture on; personal accounts on the verified domain pulled in }
      capabilityKillSwitch: { status: enabled, note: SCIM deprovisioning; connector disable runbook }
