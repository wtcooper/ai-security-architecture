id: coding-agent-hijack
title: Your repository is a prompt, and anyone can write to it
subtitle: >
  Coding agents read issues, pull-request comments and instruction files as trusted context.
  In 2026 attackers started writing to all three.
dateRange: April – June 2026
perspective: target
map: agent
summary:
  - >
    A coding agent's context is assembled from the repository around it: `CLAUDE.md`,
    `.cursorrules`, issue threads, PR comments, CI logs. Most of those are writable by people
    who have no commit access.
  - >
    Attackers used that. Hostile GitHub comments steered Claude Code, Gemini CLI and Copilot
    Agent into running attacker-chosen actions. The Claude Code GitHub Action was driven into
    exfiltrating secrets. TrapDoor went upstream of all of it and poisoned instruction files
    distributed through npm, PyPI and crates.io.
  - >
    This is the only case in this set where the agent's *system instructions* are the target,
    which makes instruction files a supply-chain artefact that needs the same provenance
    controls as code.
patterns:
  - Social Engineering of AI Agents
  - Config-as-Code Execution
  - Tool Poisoning
  - Credential Theft via AI Tools
cves: []
risks:
  - riskPromptInjection
  - riskDataPoisoning
  - riskToolSourceProvenance
  - riskRogueActions
  - riskPromptResponseCachePoisoning
controls:
  - controlInputValidationAndSanitization
  - controlComponentIdentityProvenance
  - controlAgentExecutionBounds
  - controlAgentCredentialIsolation
  - controlAgentObservability
  - controlModelAndDataIntegrityManagement
steps:
  - n: 1
    title: Instruction files get poisoned at the source
    phase: introduced
    narrative: >
      TrapDoor planted malicious directives in `CLAUDE.md` and `.cursorrules` files shipped
      through npm, PyPI and crates.io. Developers pulled them in as ordinary dependencies. The
      agent read them as its own standing instructions.
    components:
      - componentAgentSystemInstruction
      - componentDataSources
    risks:
      - riskDataPoisoning
      - riskToolSourceProvenance
    sources:
      - title: "TrapDoor poisons CLAUDE.md and .cursorrules across npm, PyPI and crates.io"
        url: https://github.com/webpro255/awesome-ai-agent-attacks
        publisher: Awesome AI Agent Attacks timeline
        date: 2026-05-24
  - n: 2
    title: A comment on a pull request becomes a command
    phase: introduced
    narrative: >
      Claude Code, Gemini CLI and Copilot Agent were hijacked through GitHub comments and PR
      bodies. Anyone able to comment could reach the agent's context — no repository write
      access required. Azure DevOps MCP had the same shape, via hidden PR comments.
    components:
      - componentAgentUserQuery
      - componentAgentInputHandling
      - componentRAGContent
    risks:
      - riskPromptInjection
    sources:
      - title: "Claude Code, Gemini CLI, Copilot Agent hijacked via GitHub comments"
        url: https://github.com/webpro255/awesome-ai-agent-attacks
        publisher: Awesome AI Agent Attacks timeline
        date: 2026-04-15
  - n: 3
    title: The agent acts with the pipeline's credentials
    phase: exposed
    narrative: >
      In CI the agent holds real credentials. The Claude Code GitHub Action was driven into
      exfiltrating secrets — the injected instruction executed with the permissions of the
      workflow, not of the person who wrote the comment.
    components:
      - componentReasoningCore
      - componentTools
      - componentOrchestrationOutputHandling
    risks:
      - riskRogueActions
      - riskPromptInjection
    sources:
      - title: "Claude Code GitHub Action prompt-injection secret exfiltration"
        url: https://github.com/webpro255/awesome-ai-agent-attacks
        publisher: Awesome AI Agent Attacks timeline
        date: 2026-06-05
  - n: 4
    title: Poisoned context persists
    phase: exposed
    narrative: >
      Because the instruction lives in a checked-in file or a cached context, it fires again
      on the next run and the next developer. One injection becomes a standing capability.
    components:
      - componentMemory
      - componentAgentSystemInstruction
      - componentReasoningCore
    risks:
      - riskPromptResponseCachePoisoning
      - riskDataPoisoning
    sources:
      - title: "Awesome AI agent attacks — 2026 timeline"
        url: https://github.com/webpro255/awesome-ai-agent-attacks
        publisher: webpro255
  - n: 5
    title: Where this chain breaks
    phase: mitigated
    narrative: >
      Treat instruction files as code: signed, reviewed, provenance-checked. Treat repository
      content from non-collaborators as untrusted input. Give CI agents their own scoped,
      short-lived credentials. Bound what an agent may execute without a human confirming.
    components:
      - componentAgentInputHandling
      - componentAgentSystemInstruction
      - componentReasoningCore
      - componentTools
      - componentOrchestrationInputHandling
    sources:
      - title: "Securing agentic apps: how to vet the tools your AI agents depend on"
        url: https://workos.com/blog/mcp-supply-chain-security
        publisher: WorkOS
alsoSeen:
