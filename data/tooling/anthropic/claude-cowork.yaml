          named tools, but scheduled tasks run with an approval mode chosen at creation and nobody present (runs
          are reviewed afterwards on the Scheduled page), code in the sandbox is not approved per command, "Skip
          all approvals" has no documented console switch on Team, and the Automatically approve reviewer is a
          model that never counts. There is no merge-style gate on output.
