id: promptInjection            # the key feed items and deep dives carry in `category`
slug: prompt-injection         # its address: /incidents/prompt-injection/
order: 1
name: "Prompt injection and agent hijack"
short: "Content the agent reads steers it into acting for someone else: leaking data, calling tools or changing its own settings."
since: 2026-11-25
overview: >-
  An agent reads email, tickets, web forms, repository files and shared chats as part of its task,
  and the model cannot reliably tell content it was asked to read from instructions to follow.
  Anyone who can write where the agent reads can steer it, with whatever the session already
  holds: connected mail, CRM records, a shell, its own settings. In 2026 this reached Copilot,
  Agentforce, ChatGPT, Manus, AgentCore and the coding agents; most cases were found by
  researchers and fixed, with no victims named. At stake is what the session can reach and where
  it can send it, so the controls that break the chain make the session smaller: fewer tools,
  tokens out of its reach, no unlisted way out.
howItWorks:
  - "An attacker writes instructions where the agent will read them: an email, a support ticket, a public lead form, an AGENTS.md, a web page or a shared chat."
  - "A user asks for something routine, and the agent reads that content as part of the task, often hidden in an HTML comment or encoded."
  - "The agent acts with what it already holds: it queries records, reads connected mail, runs a shell, or adds an MCP server or hook to its own config."
  - "The result leaves by a route the agent may use anyway: a fetch, a rendered image or link, a DNS lookup, a commit or a post in someone else's name."
signs:
  - "A connector read, query or tool call the user did not ask for, just after the agent opened mail, a ticket, a lead or a shared chat."
  - "Requests from the agent to hosts nobody listed, with data in the path, a query string or a subdomain."
  - "A new MCP server, hook or allow rule in the agent's own configuration that nobody reviewed."
stops:
  - control: cap-input-guardrails
    how: "Mail, tickets, public form fields and shared chats are screened as untrusted data where the agent reads them, before they can steer it."
  - control: AML.M0028
    how: "Tools scoped to the task: a lead-review agent needs Leads, not Accounts, and ticket triage needs no root shell. The injection uses what was already granted."
  - control: D3-CTS
    how: "Connector and repository tokens are used only on the call to their own service, never left in the sandbox's environment for injected code to read."
  - control: cap-agent-egress-control
    how: "The agent's shell and fetch tool reach only the hosts the task needs, so the upload or reverse shell carrying the data has nowhere to connect."
  - control: AML.M0029
    how: "Approval bound to the action before it runs: ChatGPT's default ran Gmail reads first, and Manus warned only after the decoded payload had run."
  - control: cap-ai-vendor-assessment
    how: "In most cases the defence that failed was the vendor's: ask how its screening, link handling and sandbox isolation are tested, and re-check after each fix."
risks: [riskPromptInjection, riskSensitiveDataDisclosure, riskRogueActions, riskAgenticDelegationConfusedDeputy, riskCovertChannelsInModelOutputs]
owasp: [LLM01:2026, LLM03:2026, ASI01, ASI02, MCP06:2025]
atlas: [AML.T0051.001, AML.T0093, AML.T0053, AML.T0081, AML.T0086, AML.T0077]
notSameAs:
  - pattern: supplyChain
    why: "A planted hook or loader that runs as code, whether or not the agent obeys anything, is supply chain; injection needs the model to read and act."
  - pattern: exploitedSoftware
    why: "When a page or shared link runs code through a flaw in the AI product, as the ChatGPT shared-link flaw did, no model was steered."
  - pattern: breakout
    why: "An agent that goes past its brief with nothing outside steering it is escape and overreach, not injection."
