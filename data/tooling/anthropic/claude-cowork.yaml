          Compliance API remote session endpoints (product_surface cowork_remote) return prompts, responses,
          tool calls and tool results; the OTLP export set at Organization settings > Cowork covers cloud
          sessions with events correlated by prompt.id and session.id
        steps:
          - title: Pull cloud-session transcripts (Enterprise)
            body:
              - Use a Compliance Access Key with read:compliance_user_data on /v1/compliance/apps/sessions/remote
                and its messages endpoint.
            url: https://platform.claude.com/docs/en/manage-claude/compliance-sessions
          - title: Stream session events to your collector
            body:
              - At Organization settings > Cowork enter the OTLP endpoint, protocol and headers; the stream covers
                cloud sessions as well as local ones.
            url: >-
              https://support.claude.com/en/articles/14477985-monitor-claude-cowork-activity-with-opentelemetry
        note: >-
          Native by the rule: programmatic export covering this hosted surface. The OTLP push is the copy the
          session cannot alter; the Compliance API pull is not, because a member's deletion removes a remote
          session from it. Tool inputs and results are truncated to 10,000 bytes by default, thinking is left
          out of the OTLP response event, the OTLP prompt-content default is documented both ways, and Team plans get OTLP only (the
          Compliance API is Enterprise).
        verified: "2026-09-25"
