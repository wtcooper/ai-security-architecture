          - { name: "AWS Lambda reward functions", kind: commercial, url: "https://docs.aws.amazon.com/bedrock/latest/userguide/reinforcement-fine-tuning.html", note: "Custom grading code in Lambda, as Bedrock reinforcement fine-tuning uses it." }
