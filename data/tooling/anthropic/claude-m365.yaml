                  url: https://support.claude.com/en/articles/13132885-set-up-single-sign-on-sso
              verified: 2026-09-10
      - mitigation: D3-APA
        coverage: native
        mechanism: >-
          Microsoft 365 admin center Settings > Integrated apps assigns the add-ins to everyone, users or
          groups, with self-install closed by Let users access the Office Store (Word, Excel, PowerPoint) and
          the My Marketplace Apps / My Custom Apps / My ReadWriteMailbox Apps user roles (Outlook); a
          documented tenant-wide Microsoft Graph admin consent to Anthropic's Claude for Office Entra app
          (c2995f31-11e7-4882-b7a7-ef9def0a0266) or your own single-tenant app via graph_client_id; per-user
          disabled_features / access_policies through Entra extension attributes or a bootstrap endpoint in
          custom-manifest deployments; claude.ai Organization settings > Office agents is org-wide only
        steps:
          - title: Assign the add-ins to groups
            body:
              - >-
                In the Microsoft 365 admin center go to Settings > Integrated apps > Add-ins > Deploy Add-in,
                choose the Claude listing or upload the manifest, and assign Specific users/groups; group
                membership then grants and removes access.
            url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/manage-deployment-of-add-ins
          - title: Close the self-install paths
            body:
              - >-
                Clear Let users access the Office Store at Settings > Org settings > Services > User owned apps
                and services, and for Outlook remove My Marketplace Apps, My Custom Apps and My
                ReadWriteMailbox Apps from the default role assignment policy in the Exchange admin center.
            url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/manage-addins-in-the-admin-center
          - title: Decide the Graph consent
            body:
              - >-
                Have a Global Administrator open the documented admin-consent link for Claude for Office
                (Mail.ReadWrite, Calendars.Read, User.Read, offline_access), or register a single-tenant app
                with those delegated permissions and set graph_client_id on the manifest URL instead.
            url: https://claude.com/docs/office-agents/outlook
          - title: Set per-user feature policy
            body:
              - >-
                In custom-manifest deployments deliver disabled_features (comma-separated) through Entra ID
                extension attributes, or access_policies statements through the manifest or a bootstrap
                endpoint, so features vary by user.
            url: https://claude.com/docs/office-agents/third-party-platforms
        note: >-
          Native by the rule, with the add-in's authorization plane split across two consoles. The Microsoft
          side decides who may run the add-in (group assignment; unassigned users are blocked only once the
          Office Store setting and the Exchange add-in user roles, both on by default, are closed) and whether
          the Graph grant exists at all: Anthropic documents the consent URL, the app ID, the verified publisher
          (Anthropic, PBC), the redirect URIs and the delegated scopes, plus a single-tenant alternative whose
          approval and Conditional Access the organisation owns (the setup plugin's manifest command also lists
          People.Read for that app; the Outlook page lists four scopes). That consent is the Microsoft 365
          tenant's own control. The claude.ai side is coarse: Organization settings > Office agents switches
          cross-app mode for everyone, Enterprise custom roles do not list the add-ins, and model access
          follows the member's role. Per-user feature policy exists only where configuration keys are
          delivered, which the docs describe for third-party-platform deployments.
        verified: "2026-09-25"
