    where: "Container Apps Sandboxes › sandbox › Egress policy (aca sandbox egress set --default Deny --rule host:Allow); telemetryConfig at creation"
    setVia: [code, apiCli]
    area: network
    default: "No policy: outbound access unrestricted; no telemetry exported"
    recommended: "At creation on every sandbox: default Deny with traffic inspection Full; Allow rules for the gateway, feed hosts and github.com; Transform rules injecting gateway and git credentials; NetworkEgressDecisions to Log Analytics."
    value: "Deny by default; gateway, feed, repository allowed"
    why: "Commands the agent runs never pass the gateway, so this list is the only limit on where they go, and every allowed or denied request is on record."
    mitigations: [cap-agent-egress-control, cap-agent-tracing]
    url: https://sandboxes.azure.com/docs/sandboxes/sandbox/egress
    verified: "2026-11-21"
  - id: ghPackageFirewall
    name: "Package firewall policy (public preview, npm only)"
    where: "GitHub enterprise › Policies › Package firewall; npm resolved through https://package-firewall.githubapp.com/npm/enterprises/<enterprise>"
    setVia: [adminConsole]
    area: tools
    default: "Malware block on; vulnerabilities Critical only; minimum age 1 day"
    recommended: "Have the admission pipeline resolve each requested npm package through the firewall before saving it to Azure Artifacts: malware, new install scripts and attestation downgrades blocked, High or higher, minimum age 7 days. Other ecosystems need their own check."
    value: "Malware blocked, High or higher, minimum age 7 days"
    why: "Azure Artifacts saves what a Collaborator installs without scanning it. Holding back very new versions and known malware catches the names agents invent and look-alikes registered for them."
    mitigations: [D3-FA]
    url: https://docs.github.com/en/enterprise-cloud@latest/code-security/how-tos/secure-your-supply-chain/secure-your-dependencies/protecting-endpoints-with-package-firewall
    verified: "2026-11-21"
  - id: ghCodeScanningMergeProtection
    name: "Require code scanning results (branch ruleset)"
    where: "GitHub organisation › Settings › Rulesets › branch ruleset › Require code scanning results › Required tools and alert thresholds"
    setVia: [adminConsole, apiCli]
    area: tools
    default: "No code scanning rule; alerts are reported, merges not blocked"
    requires: "GitHub Code Security"
    recommended: "Add CodeQL and the Microsoft Security DevOps tools that upload SARIF, with Security alerts set to High or higher and Alerts to Errors, so a serious finding stops the merge and therefore the release."
    value: "CodeQL and MSDO; High or higher blocks merge"
    why: "Nobody reads this code, so the scans are its only review, and a serious finding has to stop the release rather than appear in a report."
    mitigations: [D3-SYSVA]
    url: https://docs.github.com/en/code-security/code-scanning/managing-your-code-scanning-configuration/set-code-scanning-merge-protection
    verified: "2026-11-21"
  - id: ghPushProtection
    name: "Push protection with delegated bypass (GitHub Secret Protection)"
    where: "GitHub enterprise or organisation › security configuration › Secret Protection › Push protection; delegated bypass reviewers"
    setVia: [adminConsole]
    area: tools
    default: "Off for repositories; any writer can bypass a block by giving a reason"
    requires: "GitHub Secret Protection"
    recommended: "On for every factory repository, with delegated bypass so only the security team can approve a bypass request. The agent's GitHub App is never a bypass reviewer or exempt actor."
    value: "On; bypass only with security team approval"
    why: "Agents paste keys into code. A push holding one is refused before it reaches a repository that many people and tools read."
    mitigations: [D3-CH]
    url: https://docs.github.com/en/code-security/secret-scanning/introduction/about-push-protection
    verified: "2026-11-21"
  - id: apimConnectorClientIds
    name: "validate-azure-ad-token with client-application-ids (per connector API)"
    where: "API Management › APIs › (connector API for one system of record) › Inbound processing"
    setVia: [cloudPolicy, configFile]
    area: data
    default: "No policy"
    recommended: "One connector API per approved app and system, accepting only that app's managed identity in client-application-ids and the connector's audience. The backend applies the user's entitlements from an on-behalf-of token, never the user's own token."
    value: "Only the approved app's identity accepted"
    why: "One app's credential opens that app's connectors and nothing else, and what comes back is limited to what the signed-in user may see."
    mitigations: [D3-CTS, cap-data-access-governance]
    url: https://learn.microsoft.com/en-us/azure/api-management/validate-azure-ad-token-policy
    verified: "2026-11-21"
  - id: appContainerAppsRequireAuth
    name: "Built-in authentication: Restrict access, Require authentication (Microsoft Entra ID)"
    where: "Container Apps › (generated app or preview) › Authentication; az containerapp auth microsoft update"
    setVia: [apiCli, cloudPolicy]
    area: identity
    default: "Not enabled: every request reaches the container"
    recommended: "Deploy every generated app and preview from the platform template with the Microsoft provider and Require authentication, browsers redirected to Entra sign-in, HTTPS only, and Assignment required on the app's enterprise application."
    value: "Entra ID provider, Require authentication"
    why: "Sign-in runs in a platform sidecar before any request reaches code the agent wrote, so an app is never open because its code forgot a check."
    mitigations: [D3-APA]
    url: https://learn.microsoft.com/en-us/azure/container-apps/authentication
    verified: "2026-11-21"
  - id: caRequireMfaStrength
    name: "Conditional Access: Require authentication strength"
    where: "Microsoft Entra admin center › Entra ID › Conditional Access › Policies › New policy"
    setVia: [identityProvider]
    area: identity
    default: "No policy"
    requires: "Microsoft Entra ID P1"
    recommended: "All users, All resources, Multifactor authentication strength, emergency access accounts excluded, started in Report-only. Add Phishing-resistant MFA strength for app owners, since they approve releases after signing in to GitHub through Entra ID."
    value: "MFA for all users; phishing-resistant for owners"
    why: "A stolen password should not open an app that holds company data or approve its release. GitHub applies the second factor only at the Entra sign-in."
    mitigations: [D3-MFA]
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/policy-all-users-mfa-strength
    verified: "2026-11-21"
  - id: appSubscriptionPerApp
    name: "Subscription vending: one subscription per app (Online product line)"
    where: "Platform automation with the subscription vending Bicep (avm/ptn/lz/sub-vending) or Terraform (avm-ptn-alz-sub-vending) module; Landing zones › Online management group"
    setVia: [code, cloudPolicy]
    area: network
    default: "Apps share a subscription; corp-connected spokes reach each other through the hub firewall"
    recommended: "Vend each app its own subscription under the Online management group, with a virtual network not peered to other apps or the factory, its own owner, budget and Defender for Cloud enrolment; connectors reached by private endpoint."
    value: "Own subscription and unpeered network per app"
    why: "One faulty or hostile app cannot reach another app's data or the tools that built it, and the policies above it apply before it exists."
    mitigations: [D3-NI]
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/landing-zone/design-area/subscription-vending-product-lines
    verified: "2026-11-21"
  - id: policyContainerAppsBaseline
    name: "Built-in Container Apps policy definitions"
    where: "Azure Policy › assign at the factory apps management group: Container App environments should use network injection; Managed Identity should be enabled for Container Apps; Container Apps should only be accessible over HTTPS; Authentication should be enabled on Container Apps"
    setVia: [cloudPolicy]
    area: network
    default: "Not assigned"
    recommended: "Deny for network injection, managed identity and HTTPS only. Authentication should be enabled on Container Apps offers only AuditIfNotExists, so the pipeline must also check each app's authentication configuration before release."
    value: "Deny where offered; authentication audited"
    why: "A setting the agent chose cannot open an app or its network even when the template is bypassed, and the gap Azure Policy cannot deny is named."
    mitigations: [D3-ACH, D3-NI]
    url: https://learn.microsoft.com/en-us/azure/container-apps/policy-reference
    verified: "2026-11-21"
  - id: foundryDocumentAttackGuardrail
    name: "Guardrail control: Document attack (Prompt Shields)"
    where: "Foundry portal › project › Guardrails › Create guardrail › Document attack, assigned to the intake's model deployment"
    setVia: [adminConsole, apiCli]
    area: tools
    default: "User prompt attack detection on; document attack detection off"
    recommended: "Turn on Document attack, action block at user input, for the intake deployment; wrap each uploaded file's text, JSON-escaped, in <documents> delimiters; keep user prompt attack on; test every language used."
    value: "Document attack on, action block"
    why: "A file anyone wrote can tell the agent to add a back door. Screening it at intake keeps most such instructions out of the spec, though some will get through."
    mitigations: [cap-input-guardrails]
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-safety/concepts/jailbreak-detection
    verified: "2026-11-21"
  - id: ghSbomAttestation
    name: "Build provenance and SBOM attestations (actions/attest)"
    where: "Platform build workflow › two actions/attest@v4 steps with subject-name, subject-digest and push-to-registry: one for provenance, one adding sbom-path (SPDX or CycloneDX JSON)"
    setVia: [configFile]
    area: audit
    default: "No attestation and no bill of materials"
    recommended: "Attest every release image with build provenance and an SBOM, record the agent and model version that wrote it in the build record, and verify the attestation with gh attestation verify before the deploy job runs."
    value: "Provenance and SBOM per image, verified at deploy"
    why: "When a package turns out to be harmful you can find every app that uses it in minutes, and the gate takes only images the pipeline built."
    mitigations: [AML.M0023]
    url: https://docs.github.com/en/actions/how-tos/secure-your-work/use-artifact-attestations/use-artifact-attestations
    verified: "2026-11-21"
  - id: msdoIacScan
    name: "Microsoft Security DevOps action, IaC category"
    where: "Platform build workflow › microsoft/security-devops-action with categories IaC (Template Analyzer, Checkov); SARIF uploaded to code scanning"
    setVia: [configFile]
    area: tools
    default: "Not run"
    recommended: "Scan each app's Bicep against the platform baseline (authentication configured, no public storage, managed identity, approved connectors only) on every push, and fail the release on findings through Require code scanning results."
    value: "IaC checks on every push; findings block release"
    why: "A setting the agent chose can expose an app whose code is clean, so settings are checked before release, not after."
    mitigations: [D3-ACH, D3-SYSVA]
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/github-action
    verified: "2026-11-21"
  - id: ghAuditLogStreaming
    name: "Audit log streaming, with API request events"
    where: "GitHub enterprise › Settings › Audit log › Log streaming › Azure Event Hubs or Azure Blob Storage; Audit log › Settings › Enable API Request Events"
    setVia: [adminConsole]
    area: audit
    default: "Not streamed; API request events off"
    recommended: "Stream to an Event Hubs namespace feeding the Log Analytics workspace behind Microsoft Sentinel, with API request events on, and join it to intake, sandbox and deployment records by app and build ID."
    value: "Streamed to Azure, API request events on"
    why: "Pushes, workflow runs and the owner's approval land in the same record as who asked for the app and what was released."
    mitigations: [cap-agent-tracing]
    url: https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/streaming-the-audit-log-for-your-enterprise
    verified: "2026-11-21"
  - id: appRevisionDeactivate
    name: "Revision deactivate (generated app)"
    where: "Container Apps › (generated app) › Revisions and replicas; az containerapp revision deactivate"
    setVia: [apiCli, adminConsole]
    area: audit
    default: "Active revisions keep serving"
    recommended: "In the stop runbook, deactivate every active revision, set Enabled for users to sign-in? to No on the enterprise app, then remove role assignments. RBAC removals take up to 10 minutes; group or app role changes can lag hours."
    value: "All revisions deactivated; sign-in disabled"
    why: "An app leaking data stops in minutes without the factory or a release, because deactivation stops every replica while role changes catch up."
    mitigations: [cap-agent-kill-switch]
    url: https://learn.microsoft.com/en-us/azure/container-apps/revisions-manage
    verified: "2026-11-21"
  - id: mdcaGenAiDiscovery
    name: "Cloud discovery, Generative AI category, with app discovery policies"
    where: "Microsoft Defender portal › Cloud apps › Cloud discovery dashboard and Cloud app catalog (Generative AI category); app discovery policies"
    setVia: [adminConsole]
    area: sharing
    default: "No discovery policy"
    recommended: "Filter discovered apps on Generative AI to find app builders and coding tools in use, add a discovery policy that alerts and can unsanction by risk score and daily users, and pair it with the Defender CSPM AI workload inventory."
    value: "Generative AI discovery policy on"
    why: "An app made in a vendor's builder or a personal account has no owner, no checks and no end date. Finding it is the first step to bringing it in or closing it."
    mitigations: [cap-shadow-ai-discovery]
    url: https://learn.microsoft.com/en-us/security/security-for-ai/discover
    verified: "2026-11-21"
  - id: policyRequireTagRg
    name: "Require a tag on resource groups (owner, end date)"
    where: "Azure Policy › Definitions › built-in (Tags) › assign at the factory apps management group, effect deny, once per tag"
    setVia: [cloudPolicy]
    area: audit
    default: "Not assigned"
    recommended: "Require owner, owner group, data classification and end date tags on every app resource group, set by the vending pipeline, and run a scheduled job that retires apps past their end date unless the owner renews."
    value: "Owner and end date required on every app"
    why: "Apps outlive the reason and the people they were built for. A required owner and end date make the register and the retirement automatic."
    mitigations: [D3-AI, AML.M0043]
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-policies
    verified: "2026-11-21"
  - id: aksAgentSandboxClaim
    name: "Agent Sandbox cluster extension: SandboxTemplate, SandboxWarmPool and SandboxClaim (preview)"
    where: "AKS › cluster extension (Agent Sandbox); SandboxTemplate with runtimeClassName kata-vm-isolation-v2 in the factory namespace; one SandboxClaim per build"
    setVia: [clusterPolicy, configFile]
    area: tools
    default: "Extension not installed; pods use the default runc runtime"
    recommended: "One SandboxClaim per build from a warm pool whose template uses kata-vm-isolation-v2, deleted when the build ends. The extension and the v2 runtime are preview, need Kubernetes 1.35 or later and supported v6 VM sizes, and are not for production use."
    value: "One Kata v2 sandbox per build, deleted after"
    why: "Each build's code runs in its own pod VM with a guest kernel, ready before the build starts and gone after it."
    mitigations: [D3-EI]
    url: https://learn.microsoft.com/en-us/azure/aks/agent-sandbox-cluster-extension
    verified: "2026-11-21"
