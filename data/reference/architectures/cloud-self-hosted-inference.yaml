id: archSelfHostedInference
surface: surfaceCloud
rank: 5
title: Self-hosted model inference
abbrev: Self-hosted inference

summary:
  - >
    An open-weights model served on infrastructure the organisation operates: the same
    inference runtime as the endpoint local model runtime, with an AI gateway in front of it and
    a governance plane behind it. Weights land in storage from a public hub or the
    organisation's own training & release pipeline, and the whole model-provider role moves inside the
    boundary.

overview: >-
  Weights from a public hub or your own pipeline pass a blocking scan before promotion and a check
  against the approved copy at load, then serve the organisation's callers, often many teams on
  shared accelerators, where a cache shared across them can leak one team's context. Unlike a managed model API, no provider
  supplies content policy, abuse monitoring, spare capacity or patching, so you run each one or do
  without.

description:
  - >
    An open-weights model served on infrastructure the organisation runs, for its own
    applications and agents. Each call passes an AI gateway, which checks the calling team's
    identity, applies its quota and screens the request and the answer, then the serving
    engine's API, which schedules it into the inference runtime.
  - >
    Weights reach storage from a public hub, scanned before they are promoted, or as signed
    releases from the organisation's own training pipeline. The runtime loads only an approved
    artifact, checked against its digest at load.
  - >
    What sets it apart is that the model provider's role moves inside: content policy, abuse
    monitoring, spare capacity and patching are the organisation's to run or go without. Teams
    on one deployment share accelerators and a cache that holds their context, so isolation
    between them is a serving setting.

distinguishedBy:
  - >
    Against the endpoint local model runtime: identical software, entirely different operational
    position. There it was installed by one person and has no inventory entry; here it has a
    gateway in front, a promotion pipeline, an identity and someone on call.
  - >
    Against consuming a managed model API: this architecture replaces one boundary crossing with
    a whole subsystem. The guardrails, abuse monitoring, capacity management and patching the
    provider was doing are now blocks on this diagram.

exemplars:
  - name: vLLM
    fills: runtime
    note: >
      An inference engine with an OpenAI-compatible serving API, deployed on infrastructure you
      operate. It fills the model-serving tier behind the organization’s access and traffic
      controls.
    url: https://docs.vllm.ai/en/latest/
    asOf: "2026-10"
  - name: NVIDIA NIM
    fills: runtime
    note: >
      Containerized model-serving software deployed on your own GPU infrastructure. This example
      uses the self-hosted container mode, with model storage and service exposure managed by your
      organization.
    url: https://docs.nvidia.com/nim/large-language-models/latest/reference/architecture.html
    asOf: "2026-10"
  - name: KServe
    fills: runtime
    note: >
      A Kubernetes platform for deploying predictive and generative inference services, including
      vLLM-backed serving. Illustrates the cluster-managed deployment of the runtime and
      model-loading path.
    url: https://kserve.github.io/website/
    asOf: "2026-10"

zones:
  - id: zoneCloud
    owner: cloud
    gloss: "our serving cluster"
    note: >
      Everything we operate. This architecture is almost entirely one band, which is the point:
      the organisation took the model in-house and inherited every control the provider was
      applying on the way in and out.
  - id: zoneExternal
    owner: external
    note: "Outside the company: the public hubs and pipelines the weights arrive from."
  - id: zoneGovernance
    owner: governance
    note: >
      Drawn across every band because it governs every band. With no vendor and no human in the
      request path, admission of the artifact and inventory of the runtime are most of what
      governance can do here.

blocks:
  - id: consumers
    kind: service
    title: Consuming applications
    summary: "internal apps and agents, on a shared or a dedicated deployment"
    zone: zoneCloud
    icon: code
    col: 0
    row: 1
    note: >
      Internal applications and agents calling the model. They can share one deployment (the
      cheapest, and it needs cache isolation per tenant), have a dedicated deployment per team or
      sensitivity tier, or mix the two: shared for low-sensitivity callers, dedicated for the rest.
      Where they share, their isolation from each other is a property of the serving configuration,
      not of the network between them. Give tenants that must share nothing their own instance:
      vLLM's own security guide says its per-request cache salt is not an isolation boundary.

  - id: gateway
    kind: service
    title: AI gateway
    summary: "the front door: tenant identity, quotas & content policy"
    zone: zoneCloud
    col: 1
    row: 1
    note: >
      The governed front door in front of finite capacity: the same gateway block every hosted
      architecture in this catalogue routes through. With no provider applying content policy,
      the guardrail checks enforced here are a service the organisation runs itself or does
      without. Its items are the traffic classes it brokers; the checks it runs are the
      numbered pins on this block and its edges, and the call-outs beneath.
    items:
      - id: gwModel
        label: Model proxy
        icon: model
        note: "The one traffic class this gateway carries: inference, brokered per tenant."

  - id: api
    kind: service
    title: Inference API
    summary: "the engine's API, often OpenAI-compatible; caller checks vary by engine"
    cosaiComponent: componentModelServing
    zone: zoneCloud
    col: 2
    row: 1
    note: >
      The endpoint the serving engine publishes (often OpenAI-compatible): the same component the
      local runtime draws, at a different scale. Whether it checks callers depends on the engine and
      on what fronts it: an API-key flag on the engine, authentication at an ingress, service mesh
      or sidecar in front of it (mutual TLS, an OAuth2 proxy, the platform's ingress
      authentication), or both. vLLM's `--api-key`, for example, is a flag, not a default, and even
      when set it covers only the /v1, /v2, /inference and /cohere routes: /invocations serves the
      same inference without it. So admit only the gateway at the network layer, whatever the engine
      offers, or the tier is an unauthenticated laptop with a larger blast radius.
    items:
      - id: endpoint
        label: Completion endpoint
        icon: plug
        note: The published interface every internal caller shares.
      - id: binding
        label: Interface binding
        icon: gear
        note: Which network the tier is reachable from, and the whole of the trust boundary if auth is off.

  - id: runtime
    kind: service
    title: Inference runtime
    summary: "loads weights; batches & caches requests, across tenants where shared"
    zone: zoneCloud
    col: 3
    row: 1
    cosaiComponent: componentModelServing
    note: >
      The same runtime the endpoint architecture draws (loading weights, batching requests,
      serving completions) operated here as a service for the organisation's callers, often across
      tenants on shared accelerators. The serving stack is third-party code with its own CVE stream, and its
      distributed control plane assumes a trusted network: job APIs and inter-node channels
      ship unauthenticated by design, so network isolation is a control, not a hardening step.
    items:
      - id: loader
        label: Weight loader
        icon: gear
        note: Where a pickle-based format turns file opening into code execution, and where the registry digest is verified.
      - id: model
        label: Loaded model
        icon: model
        note: Open weights with no provider-side guardrail, abuse monitoring or content policy.
      - id: batching
        label: Continuous batching
        icon: gear
        note: Mixes tenants' requests in one forward pass on shared accelerators. Efficiency and co-tenancy are the same mechanism.
      - id: cache
        label: KV & prefix cache
        icon: db
        note: >
          Tenants' live context, held to avoid recomputing it. Sharing prefixes across tenants
          is a performance feature and a disclosure path in the same setting.

  - id: storage
    kind: external
    title: Storage
    summary: "versioned weight files; loadable only at a promoted digest"
    zone: zoneCloud
    col: 4
    row: 1
    cosaiComponent: componentModelStorage
    note: >
      Versioned weight artifacts: expensive to reproduce, trivial to copy. Promotion binds a
      release to an immutable approved digest recorded outside this store's write path, so
      replacing a file and the digest beside it does not make it loadable.
    items:
      - id: files
        label: Model files
        icon: db
        note: Multi-gigabyte artifacts whose format determines whether loading them is deserialization or execution.

  - id: sources
    kind: external
    title: Model sources
    summary: "public open-weights hub; whatever it scans or signs, it is not your approval"
    zone: zoneExternal
    col: 5
    row: 1
    cosaiComponent: componentModelStorage
    note: >
      Where hub weights come from: a public catalogue. What it checks (a hub's malware scan of
      uploads, a publisher's signature where there is one) says who published a file and what was
      looked for, not that it is safe to load here: that is the promotion gate's decision. The organisation's own fine-tuned models do not
      enter here: they arrive from the model registry, inside our custody.
    items:
      - id: hub
        label: Open-weights catalogue
        icon: db
        note: Declared behaviour and actual behaviour are separate facts.

  - id: govIdentity
    kind: governance
    title: Identity services
    summary: "an identity per calling team or service"
    icon: person
    zone: zoneGovernance
    col: 1
    row: 5
    mitigations: [ D3-AA ]
    note: >
      An identity per calling team or service (platform workload identity where callers run on the
      platform): the thing every quota, cache-isolation and attribution decision on this page keys
      off, never a shared key in a config map.

  - id: govSupplyChain
    kind: governance
    title: Supply-chain assurance
    summary: "blocking scan at promotion; record of what serves"
    icon: db
    zone: zoneGovernance
    col: 4
    row: 5
    mitigations: [ D3-FA, AML.M0023, AML.M0014, cap-staged-rollout-gate, D3-AVE ]
    note: >
      Format and content inspection as a blocking gate in the promotion pipeline, and the
      record of which artifact is actually serving. The control a managed provider would have
      supplied, now operated in-house.

  - id: govPolicy
    kind: governance
    title: Policy & authorization
    summary: "per-tenant quotas and our own content policy"
    icon: scale
    zone: zoneGovernance
    col: 3
    row: 5
    mitigations: [ AML.M0004, cap-output-guardrails, AML.M0005 ]
    note: >
      Per-tenant ceilings on finite capacity (what stops one caller becoming everyone's outage)
      and the content policy no provider is applying any more.

  - id: govSecrets
    kind: governance
    title: Secrets & key management
    summary: "storage, registry and control-plane credentials"
    icon: key
    zone: zoneGovernance
    col: 2
    row: 5
    mitigations: [ D3-CH ]
    note: >
      The internal credentials this system runs on (storage pulls, registry reads,
      control-plane tokens) and the weights themselves treated as an asset worth protecting
      rather than a file on a disk.

  - id: govObservability
    kind: governance
    title: Observability & response
    summary: "every request and answer, logged at the gateway all callers share"
    icon: eye
    zone: zoneGovernance
    col: 5
    row: 5
    mitigations: [ AML.M0024 ]
    note: >
      The record of every request and completion, taken at the gateway every caller shares and
      tagged with the calling tenant and the model version that answered. It is the only place
      misuse, a leak across tenants or a bad version shows up, and it is itself a corpus of
      everything the organisation asked, so it is kept apart from the serving tier and read
      under its own access rules. Which version serves where, and its testing, belong to
      Supply-chain assurance.

  - id: registry
    kind: service
    title: Model registry
    summary: "signed releases from our own training pipeline"
    cosaiComponent: componentModelStorage
    zone: zoneCloud
    col: 4
    row: 0
    note: >
      The training & release pipeline's output, and the block the two drawings share literally: a
      promoted release arrives here signed by an identity the training job never held, with
      lineage back to its data, base and run. What it publishes needs no second gate: its
      signature and lineage are verified, not re-evaluated.
    items:
      - id: releases
        label: Signed releases
        icon: shield
        note: >
          Signature and lineage are the admission evidence. Withdrawal stops future loads only where
          the loader checks current release status; instances already serving keep running until stopped.

edges:
  - from: consumers
    to: gateway
    path: primary
    bidir: true
    label: inference request
    note: >
      The tenant on the token is what quotas and cache-isolation decisions key off. A request
      that arrives without one gets whatever the default tenant can do.
  - from: gateway
    to: api
    path: primary
    bidir: true
    label: brokered inference
    note: >
      Every caller crosses the gateway, which is where the tenant identity, the per-tenant
      quota and the spend attribution live: the things the endpoint drawing has nowhere to
      put.
  - from: api
    to: runtime
    label: request / completion
    path: primary
    bidir: true
    note: >
      Admitted requests scheduled into the batch; completions back through the guardrail checks.
      Output-side policy is the half most often omitted when self-hosting.
  - from: registry
    to: storage
    path: primary
    label: promoted release
    note: >
      A signed release lands in the store with its promotion record; the load path verifies
      the signature against it. This is where this drawing meets the training pipeline.
  - from: sources
    to: storage
    crossing:
      kind: brokered
      via: "Promotion gate over storage: blocking format & content scan on ingest"
    path: external
    label: weights in
    note: >
      Hub artifacts arrive in storage, fetched by the promotion pipeline's ingest tooling. The
      serving runtime holds no source-fetch credentials; provenance establishes who made the
      artifact and nothing about what it does on load.
  - from: storage
    to: runtime
    path: primary
    label: load
    note: >
      Only promoted artifacts load, digest-verified against the promotion record. Without
      that verification the gate can be bypassed by writing to storage directly.
pins:
  risks:
    - risk: riskSensitiveDataDisclosure
      at: api
      note: >-
        A caller that reaches the inference API without the gateway gets unfiltered completions from
        models fine-tuned on internal data: authentication is opt-in on this class of server.
    - risk: riskModelSourceTampering
      at: sources
      note: Publisher identity is the only assurance the hub offers, and it says nothing about the artifact's behaviour.
    - risk: riskMaliciousLoaderDeserialization
      at: storage->runtime
      note: >
        Several weight formats execute code on load, and the loader is where the file is
        opened. Format policy at promotion is what keeps this leg deserialization rather than
        execution.
    - risk: riskModelExfiltration
      at: storage
      note: The stored artifact is expensive to reproduce and trivial to copy, which makes storage access control an asset-protection question.
    - risk: riskModelDeploymentTampering
      at: storage->runtime
      note: A load path that skips digest verification turns the promotion gate into a suggestion.
    - risk: riskInsecureIntegratedComponent
      at: runtime
      note: The serving stack is third-party code with its own CVE stream, and no provider is patching it on anyone's behalf.
    - risk: riskInsecureIntegratedComponent
      at: gateway
      note: >-
        The gateway is third-party code that sees every tenant's prompts and completions and sets the
        cache salts and quotas: a compromised release of the gateway itself is all of it, a supply-
        chain incident class with recent precedent.
    - risk: riskAcceleratorAndSystemSideChannels
      at: runtime
      note: >
        Shared accelerators are a physical substrate common to every tenant, below every namespace
        boundary. Process isolation does not close this channel; dedicated accelerators per
        sensitivity tier are the deployment choice where the residual is unacceptable.
    - risk: riskSensitiveDataDisclosure
      at: runtime
      note: >
        The sharpest risk that exists here and not on the endpoint. Continuous batching mixes
        several tenants' requests into one forward pass, and prefix caching makes
        time-to-first-token a side channel: a crafted prefix plus response timing is enough
        to reconstruct prompts and secrets cached from another tenant's request. Efficiency
        and isolation are the same settings; partition the cache by tenant, and note the risk
        compounds under disaggregated serving, where the cache crosses the network onto SSD
        and object storage.
    - risk: riskModelReverseEngineering
      at: api
      note: >
        Sustained query access is all extraction needs, and every internal caller, or
        whatever compromises one, has it. A proprietary fine-tune distilled out through its
        own completion endpoint is theft that looks like traffic; rate ceilings and anomaly
        review on the crossing are the answer.
    - risk: riskDenialOfMLService
      at: consumers->gateway
      note: Capacity is finite and there is no provider to absorb a spike. Admission control here is an availability control, not a billing feature.
    - risk: riskInsecureModelOutput
      at: gateway
      note: With no provider applying output policy, an unguarded return leg hands raw completions to every caller.

    - risk: riskAdapterPEFTInjection
      at: api
      note: >
        Dynamic adapter-loading endpoints load LoRA weights at runtime by path: a second load
        path that skips storage, the digest and the promotion gate, and one the serving stack
        ships behind a flag.
    - risk: riskModelDeploymentTampering
      at: api
      note: >
        Weight-update, pause and abort endpoints outside the versioned API are not covered by
        the API key on the common serving stacks; reachable from a tenant, they swap the model
        under every other tenant.
    - risk: riskMaliciousLoaderDeserialization
      at: runtime
      note: >
        The compile and torch caches are loaded without integrity verification, in formats that
        can execute; a writable cache directory is a write-to-execute path the serving stack's
        own guide says never to share.
  mitigations:
    - mitigation: AML.M0014
      at: storage->runtime
      do: "Check a model's signature or approved fingerprint at the moment it is loaded, not when it was downloaded."
      why: "A file can be swapped in storage after it was checked."
      note: >-
        Verify at load, not at download. For a promoted release that is the OpenSSF Model Signing signature
        with its Sigstore bundle: a detached signature, so nothing has to be repackaged; for a hub artifact,
        which mostly carries none, it is the promotion record's digest. This is the gate between the store and
        the loader.
    - mitigation: AML.M0023
      at: govSupplyChain
      do: "Keep a record of which model file is actually serving: publisher, version, format and the scan that cleared it."
      why: "Without it nobody can answer what is running."
      note: >-
        The record of which artifact is actually serving: publisher, version, format and the scan that
        cleared it. Without it the question "what is running" has no answer.
    - mitigation: AML.M0024
      at: govObservability
      do: "Record every request and answer at the gateway all callers share, and protect that log."
      why: "The log holds everything your organisation asked the model."
      note: >-
        Every request and completion recorded from the tap at the crossing every caller shares, kept
        privacy-consciously: the log of an inference service is itself a corpus of everything the organisation
        asked.
    - mitigation: D3-FA
      at: storage
      do: "Scan every model file's format and contents before it can be approved."
      why: "Some model files run code when they are opened."
      note: >-
        Format and content scanning as a blocking gate on ingest, before any artifact can be promoted,
        absorbed by the promotion gate over Storage, per the recorded deviation.
    - mitigation: cap-staged-rollout-gate
      at: storage->runtime
      do: "Test each model version for safety before approving it, release it in stages (for example a small share of traffic first), and keep the previous version ready to restore."
      why: "You can then roll back without downloading anything."
      note: >-
        Safety and adversarial evaluation of each model version gates its promotion; then the new
        version is released in stages before it serves everyone (a canary share of traffic, shadow
        traffic whose answers are not returned, a blue/green switch with an immediate switch back,
        or one consuming team opting in first), and the previous promoted artifact stays loadable:
        rollback is a registry operation, not a re-download.
    - mitigation: D3-AA
      at: gateway
      do: "Give each calling team or service its own identity, which the gateway checks on every request, never a key they share."
      why: "A shared key in a settings file belongs to everyone and no one."
      note: >-
        An identity per calling team or service, checked by the gateway on every request, never a key shared in a config map. Common ways: platform workload identity (Kubernetes service-account tokens, cloud workload identity, SPIFFE/SPIRE), mutual TLS client certificates from an internal CA, or a per-team key the gateway issues, scopes and rotates. Platform workload identity fits best where callers run on your platform, for the reason the D3-CH pin gives: a copied credential stops working at the next rotation.
    - mitigation: AML.M0004
      at: consumers->gateway
      do: "Set a usage quota for each calling team at the gateway."
      why: "Capacity is limited, and one team should not be able to exhaust it for the others."
      note: >-
        Per-tenant quotas on finite capacity, enforced at admission rather than discovered at saturation.
    - mitigation: cap-output-guardrails
      at: gateway
      do: "Screen requests and answers at the gateway against your content policy."
      why: "No provider is doing this for you."
      note: >-
        Content-policy classification of request and response, because no provider is applying policy for you.
    - mitigation: D3-HBPI
      at: runtime
      do: "Use separate hardware, or confidential-computing modes that prove themselves, for each level of data sensitivity."
      why: "One team's workload could otherwise read another's data left in memory."
      note: >-
        Hardware-enforced isolation per sensitivity tier (dedicated accelerators, or confidential-
        computing modes with attestation), so one tier's process cannot read another's memory, on the
        host or the accelerator.
    - mitigation: D3-AVE
      at: govSupplyChain
      do: "List the known flaws in the serving software and gateway against the versions you actually run."
      why: "Every new advisory then maps to the instances it affects."
      note: >-
        Enumerate the known vulnerabilities in the serving stack and the gateway against the versions actually
        running, so every advisory maps to the instances it affects. Patching them is the owner's job.
    - mitigation: AML.M0005
      at: storage
      do: "Lock down stored model files: only the approval pipeline writes them and only the serving identity reads them."
      why: "Nobody else should be able to replace or copy a model."
      note: >-
        Access control on weights at rest: only the promotion pipeline writes, and only the serving identity reads.
    - mitigation: D3-ACH
      at: api
      do: "Make sure no caller can load, swap or update a model or adapter at runtime, keep the server's control endpoints off the network callers use, and keep each team's cache separate."
      why: "These are security settings, not tuning options: a shared cache or an open control endpoint lets one caller affect another."
      note: >-
        No caller can change what is loaded: runtime weight and adapter loading switched off (vLLM's
        runtime LoRA updating left disabled, for example), or multi-adapter serving where only the
        control plane loads adapters, from promoted storage and digest-verified. The control
        endpoints outside the versioned API are bound to a separate administration network or
        blocked at the gateway, and the serving configuration is reviewed as security settings
        rather than tuning knobs. Cache isolation is part of it: a per-tenant cache salt the gateway
        sets on every request, overwriting any the caller sent and stripping or regenerating
        multimodal uuid values (vLLM's cache_salt), prefix caching turned off for traffic that
        crosses tenants, or a separate instance per tenant or sensitivity tier. vLLM says its salt
        is not an isolation boundary, so tenants that must share nothing get their own instance. The
        compile and kernel cache directory is private to the serving identity, never shared or
        tenant-writable.
    - mitigation: D3-NI
      at: runtime
      do: "Isolate the network that serving nodes use to talk to each other."
      why: "That traffic has no sign-in by design, so the network boundary is the only protection."
      note: >-
        The distributed serving plane talks between nodes with no authentication by design; network isolation
        of that plane is the control, absorbed by platform network policy per the recorded deviation.
    - mitigation: D3-CH
      at: govSecrets
      do: "Use short-lived workload identities for storage, registry and control calls, and keep any secret that must exist in a vault, one per system, rotated."
      why: "A copied credential then stops working at the next rotation and opens one system, not the cluster."
      note: >-
        Storage pulls, registry reads and control-plane calls run on short-lived workload identities, not on
        keys kept in an image or a config file. Where a secret has to exist it sits in the vault, one per
        upstream, and is rotated, so a credential copied out of the serving path stops working at the next
        rotation and opens one upstream, not the cluster.
    - mitigation: D3-NI
      at: gateway
      do: "Let the gateway open connections only to the inference API and to your own logging and secrets services, and block everything else it tries to reach."
      why: "A hijacked release of the gateway sees every team's prompts and holds every key; with nowhere else to connect, it cannot send them out."
      note: >-
        Outbound limits on the gateway's own workload where it is software we deploy: a default-deny policy
        that admits the inference API, the log pipeline and the vault. The backdoored gateway release of
        October 2026 ran on startup, collected stored provider keys and cloud credentials, uploaded them to
        an attacker's domain and polled for a second-stage loader; none of that works from a gateway that
        can reach nothing else. Where the gateway is the platform's managed service, the provider runs it
        and this is assured, not configured.

walkthrough:
  title: A tenant calls the endpoint
  moves: >-
    Prompts from our own services into weights we host, and completions back.
  steps:
    - follow: consumers->gateway
      label: request with caller identity
      note: The caller's identity on the request decides its quota and its cache scope.
    - follow: gateway->api
      label: admitted; request policy check
      note: Admitted within quota, with the content-policy check applied to the request at the crossing.
    - follow: api->runtime
      label: batched; cache scoped to tenant
      note: >
        Scheduled into a batch alongside other tenants' traffic; the serving stack's per-tenant
        cache isolation keeps the prefix lookup inside this tenant.
    - follow: runtime->api
      label: raw completion
      note: "The completion leaves the batch: raw model output, nothing yet between it and the caller."
    - follow: api->gateway
      label: output guardrail
      note: "Back through the crossing, where the output-side guardrail runs: the half most often omitted."
    - follow: gateway->consumers
      label: completion, metered
      note: The completion returns to the tenant that asked, attributed and metered.

scenarios:
  - title: A new checkpoint is promoted
    steps:
      - follow: sources->storage
        label: hub artifact with provenance
        note: >
          A hub artifact arrives with provenance recorded. Scanning and per-version evaluation
          gate its promotion here: blocking, or it is not a gate.
      - follow: registry->storage
        label: or a signed release
        note: >
          The other input, separately: a release from our own pipeline arrives already gated;
          its signature and lineage are verified, and nothing is evaluated twice.
      - follow: storage->runtime
        label: digest-verified load
        note: >
          The promoted artifact loads, digest-verified against the promotion record, and is released
          in stages, with the previous version still loadable if it misbehaves.
  - title: A spike hits finite capacity
    steps:
      - follow: consumers->gateway
        label: spike
        note: Admission control decides who waits. There is no provider to absorb the spike.
      - follow: gateway->api
        label: within-quota scheduled
        note: Within-quota traffic is scheduled; everything else is shed at the front door rather than at the accelerator.

  - title: A tenant probes another's prefix
    steps:
      - follow: consumers->gateway
        label: crafted prompt
        note: A crafted prompt sharing a suspected prefix with another tenant's traffic, well within quota.
      - follow: gateway->api
        label: admitted
        note: Admitted like any call; nothing at the crossing knows what the prefix is for.
      - follow: api->runtime
        label: timing reveals cache
        note: >
          Time to first token says whether the prefix was already cached by someone else. Per-tenant
          cache isolation keeps other tenants' prefixes out of reach, and tenants that must share
          nothing get their own instance. In vLLM, for example, that isolation is a secret cache
          salt the gateway sets on every request; vLLM leaves it opt-in and says it is not an
          isolation boundary.

deviations:
  - subject: No separate GPU or cache blocks are drawn
    reason: >
      The accelerators, the batch and the KV cache are internals of the inference runtime (the
      same block the endpoint architecture draws), so they appear as items inside it rather than
      as blocks, and the multi-tenancy risks pin to the runtime and its serving path.
  - subject: Admission scanning and per-version evaluation are absorbed by the promotion gate
    reason: >
      Hub artifacts have no scanning or evaluation block of their own here; both duties run in
      the promotion gate over Storage: scanning (D3-FA) pinned on the store, evaluation as the
      first step of the rollout gate on the load path. Releases from the model registry arrive already
      evaluated and signed. Evaluation inline on an artifact path is the ontology's own
      canonical exception.
  - subject: The AI gateway carries inference only
    reason: >
      No MCP, tool or skills traffic exists on this drawing, so the gateway lists its one real
      traffic class rather than the registered aiGatewayTraffic pack: the same honesty rule
      the SaaS drawings and the MCP publisher apply in the other direction.

  - subject: Network isolation of the serving plane is absorbed by platform policy
    reason: >
      The nodes of a distributed serving plane talk to each other unauthenticated by design.
      The control (D3-NI) is an isolated network for that plane, delivered by the cluster's network
      policy rather than by any block on the drawing; the pin sits on the runtime because
      that is what it protects.

