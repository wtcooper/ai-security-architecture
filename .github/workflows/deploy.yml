name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The compiled dataset and the feed's files are not committed: compile them before anything
      # reads them. Fails on any dangling identifier or map drift.
      - run: npm run data
      - run: npm run lint
      - run: npm test
      # Compiles the data again (as it always does), then exports the site, /feed.xml included.
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /ai-security-architecture
          NEXT_PUBLIC_SITE_URL: https://wtcooper.github.io/ai-security-architecture
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
