    setVia: [apiCli]
    area: tools
    recommended: "The candidate served on a short-lived vLLM in the evaluation namespace and scanned with a fixed probe set; the report and hit log stored with the run and read by the gate; the organisation's own capability and memorisation tests run beside it"
    why: "Behavioural testing finds what reading the weights cannot: unsafe output, leaked training data and planted behaviour."
    mitigations: [AML.M0008]
    url: https://reference.garak.ai/en/latest/cliref.html
    verified: "2026-11-18"
  - id: agentSandboxTemplate
    name: "SandboxTemplate and SandboxClaim"
    where: "agent-sandbox › SandboxTemplate (extensions.agents.x-k8s.io/v1beta1) › spec.podTemplate, networkPolicy, networkPolicyManagement; one SandboxClaim per rollout"
    setVia: [clusterPolicy]
    area: tools
    default: "networkPolicyManagement is Managed: the controller keeps a shared NetworkPolicy for the template; an empty rule list blocks all traffic in that direction"
    recommended: "One template per task family: runtimeClassName set, no service account token unless the task needs one, no volume beyond scratch, and a networkPolicy holding only the egress that family needs; the orchestrator creates one claim per rollout"
    why: "Every rollout starts from the same reviewed definition, in a fresh pod that the orchestrator, not the task, creates."
    mitigations: [D3-EI, D3-NI, cap-agent-egress-control]
    url: https://agent-sandbox.sigs.k8s.io/docs/api/
    verified: "2026-11-18"
  - id: k8sPodSecurityRestricted
    name: "Pod Security Standards: Restricted"
    where: "Kubernetes › Namespace label pod-security.kubernetes.io/enforce: restricted (Pod Security Admission)"
    setVia: [clusterPolicy]
    area: tools
    default: "No level is enforced until the namespace is labelled"
    recommended: "enforce: restricted on every rollout namespace, so a sandbox pod cannot be privileged, use the host's namespaces or mount the host's files"
    why: "Whatever a rollout asks for, the pod it gets has no path to the node except through the sandbox runtime."
    mitigations: [D3-EI]
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
    verified: "2026-11-18"
  - id: k8sDedicatedNodeTaints
    name: "Taints and tolerations (dedicated nodes)"
    where: "Kubernetes › kubectl taint nodes <node> dedicated=<group>:NoSchedule, with a matching toleration and node label on the pods (or RuntimeClass scheduling)"
    setVia: [clusterPolicy]
    area: tools
    recommended: "A node pool per trust group, tainted and labelled; rollouts of one group never schedule beside another group, and never on nodes that run inference, graders or platform services"
    why: "Tasks that must stay apart do not share a machine, so a side channel or an escape reaches only tasks of the same group."
    mitigations: [D3-HBPI]
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
    verified: "2026-11-18"
  - id: k8sCpuManagerStatic
    name: "CPU Manager static policy with full-pcpus-only"
    where: "Kubernetes › kubelet cpuManagerPolicy: static (--cpu-manager-policy) with the policy option full-pcpus-only=true"
    setVia: [configFile]
    area: tools
    default: "none: all pods share the node's CPUs"
    recommended: "static with full-pcpus-only=true on the sandbox node pools, and rollout pods in the Guaranteed class with whole-number CPU requests, so each gets exclusive physical cores"
    why: "Two tasks never run on the two threads of one core, which closes the cheapest processor side channels between them."
    mitigations: [D3-HBPI]
    url: https://kubernetes.io/docs/tasks/administer-cluster/cpu-management-policies/
    verified: "2026-11-18"
  - id: kubeflowTrainJobSuspend
    name: "TrainJob suspend and activeDeadlineSeconds"
    where: "Kubeflow Trainer › TrainJob (trainer.kubeflow.org/v1alpha1) › spec.suspend, spec.activeDeadlineSeconds"
    setVia: [apiCli]
    area: tools
    recommended: "The stop path sets suspend: true on the run's TrainJob, which terminates its pods, and deletes the run's Sandboxes; activeDeadlineSeconds on every job as the backstop"
    why: "The policy update and the rollouts stop together, from the orchestrator's side, and the job can be examined before anyone resumes it."
    mitigations: [cap-agent-kill-switch]
    url: https://trainer.kubeflow.org/en/latest/user-guides/trainjob-lifecycle.html
    verified: "2026-11-18"
  - id: sandboxRunStop
    name: "Stop the run on a serious-risk alert, from the orchestrator"
    where: "Your orchestrator › a handler for an Alertmanager webhook_configs receiver"
    setVia: [code]
    area: tools
    recommended: "Alert rules on host and network signals route to a webhook the orchestrator serves; it deletes every Sandbox of the run by label, suspends the TrainJob and blocks the run's gateway key; no stop logic runs inside a sandbox"
    why: "A run that shows serious-risk activity is stopped automatically by a component the model cannot reach."
    mitigations: [cap-agent-kill-switch]
    url: https://prometheus.io/docs/alerting/latest/configuration/
    verified: "2026-11-18"
  - id: sandboxContainmentRedTeam
    name: "Containment red team before each run"
    where: "Your evaluation pipeline › a gated stage in which agents attack the sandbox boundary, the node network and the platform services from inside a rollout"
    setVia: [code]
    area: tools
    recommended: "Required before any run that widens tools or egress; the attacking agents get the same sandbox, image and token a rollout gets; findings block the run until fixed"
    why: "Each wall is assumed to fail, so each is attacked on purpose before the model under test has the chance."
    mitigations: [D3-SYSVA]
    url: https://gvisor.dev/docs/architecture_guide/security/
    verified: "2026-11-18"
  - id: litellmAgentRegistry
    name: "Agents registered on the gateway (curated Agent Card)"
    where: "LiteLLM Proxy › admin UI Agentic › Agents, or POST /v1/agents with agent_card_params and litellm_params; Re-sync from upstream"
    setVia: [adminConsole, apiCli]
    area: tools
    recommended: "One record per approved peer agent and per agent you publish, protocolVersion pinned, only the reviewed skills exposed, and every Re-sync from upstream diff accepted by the record's owner"
    why: "The gateway serves and calls only agents that have a reviewed record, and the list of records is the register of partnerships."
    mitigations: [cap-agent-tool-registry]
    url: https://docs.litellm.ai/docs/a2a_agent_card
    verified: "2026-11-18"
  - id: litellmAgentAccess
    name: "Agent access (Allowed Agents, agent_access_default_deny)"
    where: "LiteLLM Proxy › object_permission.agents and agent_access_groups on keys and teams; general_settings.agent_access_default_deny"
    setVia: [apiCli, adminConsole, configFile]
    area: tools
    default: "Open: with no agent list on the key or team, every agent is allowed"
    requires: "agent_access_default_deny needs LiteLLM v1.108.0 or later"
    recommended: "agent_access_default_deny: true; each peer's key allowed only the agent you published for it, and your own agent's key allowed only the peer agents its users are approved for"
    why: "Which partner may reach which of your agents, and which partner agents your agent may call, is decided at the gateway and refused with a 403 otherwise."
    mitigations: [cap-agent-action-policy-enforcement]
    url: https://docs.litellm.ai/docs/proxy/access_management/agents
    verified: "2026-11-18"
  - id: a2aTaskLimits
    name: "Cap stream time, artefact size, retries and sub-tasks per peer task"
    where: "Your A2A client code › a deadline on each stream, a byte limit on artefacts, a retry and sub-task counter per task, CancelTask when a limit is reached"
    setVia: [code]
    area: tools
    recommended: "Per partnership: a maximum stream duration, a maximum artefact size accepted, a small retry count and a ceiling on sub-tasks; on breach the client sends CancelTask and marks the task failed"
    why: "One partner task cannot hold a connection open for hours, return more than you agreed to accept or multiply itself, whatever the partner agent does."
    mitigations: [AML.M0036]
    url: https://a2a-protocol.org/latest/specification/#315-cancel-task
    verified: "2026-11-18"
  - id: a2aCardSignaturePin
    name: "Verify the Agent Card signature and pinned hash on every task"
    where: "Your A2A client and server code › AgentCard.signatures (AgentCardSignature, JWS over the RFC 8785 canonical card) checked against the key and hash stored in the peer's record"
    setVia: [code]
    area: tools
    requires: "Card signing is optional in the A2A specification (Agent Cards MAY be signed), so require it in the partnership agreement"
    recommended: "Refuse any task to or from a peer whose card signature fails against the key recorded at approval, or whose canonical card hash differs from the approved one; a changed card goes back to its owner for review"
    why: "A partner agent is the one you approved only if its description still verifies, so a swapped or edited card stops work instead of redirecting it."
    mitigations: [cap-mcp-tool-integrity, cap-agent-tool-registry]
    url: https://a2a-protocol.org/latest/specification/#84-agent-card-signing
    verified: "2026-11-18"
  - id: litellmAgentKillSwitch
    name: "Agent kill switch and removal"
    where: "LiteLLM Proxy › agent kill_switch (url, method, auth); POST /v1/agents/{agent_id}/kill_switch; deleting the agent record"
    setVia: [apiCli, adminConsole]
    area: tools
    default: "No kill switch configured; firing one returns 400"
    requires: "Firing the switch only calls the webhook: the agent stays registered and enabled. The audit log entry needs an Enterprise licence"
    recommended: "A kill_switch webhook on your own agent that stops its runtime and cancels open tasks; the peer cut-off runbook deletes the peer's agent record, blocks its key and disables its Keycloak client"
    why: "One rehearsed runbook removes a partner from the gateway and stops the work already delegated to it."
    mitigations: [cap-agent-kill-switch]
    url: https://docs.litellm.ai/docs/a2a_kill_switch
    verified: "2026-11-18"
  # --- Network -------------------------------------------------------------------------
  - id: envoyGatewayRateLimit
    name: "Global rate limit (BackendTrafficPolicy rateLimit)"
    where: "Envoy Gateway › BackendTrafficPolicy › spec.rateLimit.global.rules: clientSelectors.headers (type: Distinct), limit.requests, limit.unit"
    setVia: [clusterPolicy]
    area: network
    default: "None until a policy is applied. The global rate limit needs a Redis instance configured for Envoy Gateway"
    requires: "A Redis-compatible store for the rate limit service"
    recommended: "On each route, one rule keyed on the distinct value of each header that identifies the caller (the signed-in user and the session, or the client and its customer), each with a per-minute limit sized for callers that retry and run in parallel; requests over the limit receive 429"
    why: "One user, one runaway session or one looping client is slowed at the edge by its own limit, without flooding the service behind the route or touching other callers."
    mitigations: [AML.M0004]
    url: https://gateway.envoyproxy.io/docs/tasks/traffic/global-rate-limit/
    verified: "2026-11-18"
  - id: litellmAgentSessionLimits
    name: "Agent session limits (max_iterations, max_budget_per_session)"
    where: "LiteLLM Proxy › Agent Gateway › POST /v1/agents: session_tpm_limit, session_rpm_limit; litellm_params.max_iterations and max_budget_per_session"
    setVia: [apiCli]
    area: network
    default: "No cap for a session unless set"
    recommended: "The agent registered on the gateway with max_iterations and max_budget_per_session set, and require_trace_id_on_calls_by_agent on so that calls are counted for each session"
    why: "One turn or one run cannot loop through model and tool calls without end: the gateway counts them and stops at the cap."
    mitigations: [AML.M0036]
    url: https://docs.litellm.ai/docs/proxy/users
    verified: "2026-11-18"
  - id: k8sNetworkPolicyDefaultDeny
    name: "Default deny all ingress and all egress traffic"
    where: "Kubernetes › NetworkPolicy in each namespace: podSelector: {}, policyTypes: [Ingress, Egress]; enforced by Cilium (policyEnforcementMode always makes it cluster-wide)"
    setVia: [clusterPolicy]
    area: network
    default: "Pods are non-isolated: all inbound and outbound connections are allowed until a policy selects them"
    requires: "A network plugin that enforces NetworkPolicy, such as Cilium"
    recommended: "A default-deny policy in every namespace before any workload starts, then one explicit allow per flow on the drawing: each service accepts traffic only from the component drawn in front of it, only the gateway's pods reach the model and tool services, and a workload reaches only the stores it uses"
    why: "Kubernetes isolates nothing by default. With deny-by-default the drawn flows are the only paths that exist, the gateway is the only way to a model or tool, and a compromised pod has nowhere to go."
    mitigations: [cap-agent-egress-control, AML.M0028, D3-NI]
    url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
    verified: "2026-11-18"
  - id: ciliumFqdnEgress
    name: "DNS-based policies (toFQDNs)"
    where: "Cilium › CiliumNetworkPolicy or CiliumClusterwideNetworkPolicy › spec.egress[].toFQDNs (matchName, matchPattern) with a toPorts rules.dns rule towards kube-dns"
    setVia: [clusterPolicy]
    area: network
    default: "All egress and every DNS lookup is allowed until a policy selects the endpoint"
    recommended: "Each workload's egress lists the few named services it needs as matchName entries, no matchPattern wildcards, on port 443, with the rules.dns rule that lets Cilium's DNS proxy see lookups and allows those names only; the outbound proxy is the only workload with a rule that leaves the cluster network"
    why: "A workload can resolve and reach only the names on its list, even when their addresses change, so a new destination needs a reviewed policy change and data cannot be sent anywhere unapproved."
    mitigations: [cap-agent-egress-control, D3-OTF, D3-NI]
    url: https://docs.cilium.io/en/stable/security/dns/
    verified: "2026-11-18"
  - id: egressProxyAllowlist
    name: "acl dstdomain and http_access"
    where: "Squid › squid.conf: acl <name> dstdomain <hosts>; acl <name> dst <ranges>; http_access allow <name>; http_access deny all"
    setVia: [configFile]
    area: network
    default: "Deny, unless rules exist in squid.conf"
    recommended: "http_access deny for private, loopback and link-local destinations (acl dst); one dstdomain list of approved hosts per calling workload, allowed for that workload only; then http_access deny all; the access log shipped with the other logs; the proxy is the only host with a route to the internet"
    why: "There is one exit from the data centre: it refuses internal addresses, opens only for hosts on a reviewed list for each workload, and records every request."
    mitigations: [cap-agent-egress-control, D3-OTF, D3-NI]
    url: https://www.squid-cache.org/Doc/config/http_access/
    verified: "2026-11-18"
  - id: keycloakCimdTrustedDomains
    name: "client-id-metadata-document executor: Trusted domains"
    where: "Keycloak › Realm settings › Client policies › a profile with the client-id-metadata-document executor and a policy with the client-id-uri condition; server started with --features=cimd"
    setVia: [identityProvider]
    area: network
    default: "Experimental and off; when enabled, an empty Trusted domains list denies every domain"
    requires: "Keycloak started with the experimental cimd feature"
    recommended: "Feature left off unless a caller needs it; when on, Trusted domains lists only the client publishers you accept, Allow http scheme is off and Restrict same domain is on wherever the clients allow it"
    why: "The authorization server fetches a document from an address the caller supplies, so the list of domains it may fetch from has to be short and yours."
    mitigations: [D3-OTF]
    url: https://www.keycloak.org/securing-apps/mcp-authz-server
    verified: "2026-11-18"
  - id: litellmTelemetryOff
    name: "LITELLM_OFFLINE_MODE"
    where: "LiteLLM Proxy › environment variable on every instance (it cannot be set in config.yaml)"
    setVia: [configFile]
    area: network
    default: "Off: the proxy fetches the model cost map and other catalogues from raw.githubusercontent.com, looks up the latest release at docs.litellm.ai and api.github.com, checks api.pwnedpasswords.com and downloads tokenisers from huggingface.co"
    recommended: "LITELLM_OFFLINE_MODE=true, with LITELLM_TELEMETRY_DISABLED=true, NO_REDOC=True and CHECKPOINT_DISABLE=1; callback packages built into the image; LITELLM_LICENSE set only if licensed, since the proxy then contacts license.litellm.ai when it cannot verify the key locally"
    why: "A gateway with no route out should not try to leave. These switches stop the start-up fetches, so a blocked request is never a silent fallback or a reason to open the firewall."
    mitigations: [D3-ACH]
    url: https://docs.litellm.ai/docs/proxy/outbound_requests
    verified: "2026-11-18"
  - id: litellmPassThroughOff
    name: "pass_through_endpoints and route exposure"
    where: "LiteLLM Proxy › general_settings.pass_through_endpoints; environment DISABLE_ADMIN_UI, NO_DOCS; path rules on the ingress in front"
    setVia: [configFile]
    area: network
    default: "All proxy routes are exposed on the one port (allowed_routes unset)"
    requires: "general_settings.allowed_routes, admin_only_routes and auth on pass-through endpoints need a LiteLLM Enterprise licence, so the open-source build restricts paths at the ingress"
    recommended: "No pass_through_endpoints defined; tenants reach only the inference paths through the ingress route, key management and the admin UI are reachable only from the platform network, and DISABLE_ADMIN_UI and NO_DOCS are set on tenant-facing instances"
    why: "Callers get the inference API and nothing else: no route that forwards to an arbitrary target and no management endpoint to probe."
    mitigations: [D3-ACH]
    url: https://docs.litellm.ai/docs/proxy/public_routes
    verified: "2026-11-18"
  - id: vllmOfflineMode
    name: "HF_HUB_OFFLINE"
    where: "vLLM pod › environment; vllm serve given a local path (or an s3:// URL) as the model"
    setVia: [configFile]
    area: network
    default: "Off: given a Hub model id, vllm serve downloads the weights at start"
    recommended: "HF_HUB_OFFLINE=1, the model argument a local path on a read-only volume filled from the weights bucket (or an s3:// URL with --load-format runai_streamer and AWS_ENDPOINT_URL set to the object gateway), and no HF_TOKEN in the pod"
    why: "The serving pod loads only the promoted files already inside the boundary and never asks the public hub for anything at start."
    mitigations: [D3-ACH]
    url: https://huggingface.co/docs/huggingface_hub/package_reference/environment_variables
    verified: "2026-11-18"
  - id: vllmUsageStatsOff
    name: "VLLM_NO_USAGE_STATS"
    where: "vLLM pod › environment"
    setVia: [configFile]
    area: network
    default: "On: vLLM collects anonymous usage data by default"
    recommended: "VLLM_NO_USAGE_STATS=1 and DO_NOT_TRACK=1 on every serving pod"
    why: "Nothing about the deployment (model architecture, GPU type, version) is reported outside the data centre."
    mitigations: [D3-ACH]
    url: https://docs.vllm.ai/en/latest/usage/usage_stats.html
    verified: "2026-11-18"
  - id: harborProxyCache
    name: "Proxy Cache project"
    where: "Harbor › New Project › Proxy Cache, with a registry endpoint"
    setVia: [adminConsole]
    area: network
    recommended: "One proxy cache project per upstream registry the platform needs; nodes pull only from Harbor, by digest, and no node has a route to a public registry"
    why: "Public images arrive through one door you control and are scanned there, so the cluster needs no direct path to the internet."
    mitigations: [D3-NI]
    url: https://goharbor.io/docs/latest/administration/configure-proxy-cache/
    verified: "2026-11-18"
  - id: ciliumHostFirewall
    name: "Host firewall (host network policy)"
    where: "Cilium › Helm value hostFirewall.enabled=true; CiliumClusterwideNetworkPolicy with spec.nodeSelector"
    setVia: [clusterPolicy]
    area: network
    default: "Off until hostFirewall.enabled is set"
    recommended: "On for the sandbox node pools: a host policy that admits only the control plane, the kubelet and the telemetry collector, with no rule from one sandbox node to another; proved in policy audit mode first"
    why: "If a rollout breaks out of its sandbox it lands on a node that cannot open a connection to any other node."
    mitigations: [D3-NI]
    url: https://docs.cilium.io/en/stable/security/host-firewall/
    verified: "2026-11-18"
  # --- Logging & audit -----------------------------------------------------------------
  - id: langfuseTracing
    name: "Self-hosted Langfuse (model and agent traces)"
    where: "Langfuse on Kubernetes (Helm) with its own PostgreSQL, ClickHouse, Valkey and S3-compatible bucket; LiteLLM success_callback: [\"langfuse\"] with LANGFUSE_HOST, LANGFUSE_PUBLIC_KEY and LANGFUSE_SECRET_KEY"
    setVia: [configFile]
    area: audit
    default: "LANGFUSE_HOST defaults to https://cloud.langfuse.com, so the LiteLLM callback sends to Langfuse Cloud unless it is set"
    requires: "Langfuse audit logs, data retention policies and server-side masking need an Enterprise licence key; tracing does not"
    recommended: "LANGFUSE_HOST set to the Langfuse instance in your own data centre; the gateway, not the agents, holds the Langfuse keys; one trace per session, run or task carrying the agent identity and the user or trigger it acts for; operators can read traces while the work is still running"
    why: "Which agent did what, on whose behalf, with which prompt, tool calls and result is one readable trace in the organisation's own store, which the agents have no credentials for."
    mitigations: [cap-agent-tracing]
    url: https://langfuse.com/self-hosting
    verified: "2026-11-18"
  - id: litellmLoggingCallbacks
    name: "Logging callbacks (callbacks, success_callback, failure_callback)"
    where: "LiteLLM Proxy › config.yaml › litellm_settings: callbacks, success_callback, failure_callback, s3_callback_params (s3_endpoint_url), global_disable_no_log_param, turn_off_message_logging; callback_settings; OTEL_EXPORTER and OTEL_ENDPOINT"
    setVia: [configFile]
    area: audit
    default: "No callback is configured, and a caller can skip logging for a request with no-log. Message content is logged unless turn_off_message_logging is set; Langfuse logging goes to Langfuse Cloud unless LANGFUSE_HOST is set"
    recommended: "callbacks: [\"otel\"] to your OpenTelemetry Collector, plus s3_v2 to a bucket only the gateway can write or langfuse to your own instance; failure_callback set too; global_disable_no_log_param: true; turn_off_message_logging only where content must not be kept; redact_user_api_key_info left off"
    why: "Every model and tool call that crosses the gateway is recorded with the key and team it belongs to, in stores the organisation runs, and a caller cannot ask for a request to be left out."
    mitigations: [cap-agent-tracing, AML.M0024]
    url: https://docs.litellm.ai/docs/proxy/logging
    verified: "2026-11-18"
  - id: lokiRetentionImmutability
    name: "Compactor retention (retention_enabled, retention_period)"
    where: "Grafana Loki › compactor: retention_enabled, delete_request_store; limits_config: retention_period; chunks in an object store bucket that only Loki's identity can write"
    setVia: [configFile]
    area: audit
    default: "Retention is off until the compactor enables it: logs sent to Loki are kept indefinitely"
    recommended: "retention_enabled: true with a retention_period that meets the organisation's record-keeping rule; chunks in a bucket with object lock that only Loki can write; only the collector writes to Loki, and no workload holds credentials for Loki, its delete API or the bucket"
    why: "The record of what the workloads did is kept for a set time, outlives the run, and cannot be edited or deleted by the workloads it describes."
    mitigations: [cap-agent-tracing, AML.M0024]
    url: https://grafana.com/docs/loki/latest/operations/storage/retention/
    verified: "2026-11-18"
  - id: otelCollectorPipeline
    name: "Collector pipelines (receivers, processors, exporters)"
    where: "OpenTelemetry Collector › config.yaml › receivers, processors, exporters, service.pipelines for traces, metrics and logs"
    setVia: [configFile]
    area: audit
    recommended: "An OTLP receiver for the gateway, the services and the node agents, exporters to Loki, Prometheus and the SIEM, and the collector in its own namespace that workloads can send to but not read from or change"
    why: "Each tool call, agent step and host event leaves the place it happened as it happens and lands where it can be searched in an incident."
    mitigations: [AML.M0024, cap-agent-tracing]
    url: https://opentelemetry.io/docs/collector/configuration/
    verified: "2026-11-18"
  - id: mlflowModelRegistryStages
    name: "Model Registry aliases and tags"
    where: "MLflow › Model Registry › registered model version: alias (for example @champion), tags, description"
    setVia: [apiCli, adminConsole]
    area: audit
    recommended: "Each release registered as a version linked to the run that produced it, with a description and tags for the weights digest, base model or publisher, format and scan result; an approver who is not the author moves the alias, and deployment reads the version by alias"
    why: "The registry is the record of which model file is serving, where it came from and who approved it."
    mitigations: [AML.M0023, cap-model-documentation, cap-staged-rollout-gate]
    url: https://mlflow.org/docs/latest/ml/model-registry/
    verified: "2026-11-18"
  - id: mlflowDatasetTracking
    name: "MLflow Dataset Tracking (mlflow.log_input)"
    where: "MLflow › an mlflow.data dataset with its source and digest, logged with mlflow.log_input(dataset, context=\"training\") in every run"
    setVia: [code]
    area: audit
    recommended: "Each curation run logs the dataset version it produced with its source and digest, and each training run logs the dataset it read with context training and the base model as a tag"
    why: "A model version can be traced to its run, the exact data it was trained on and where that data came from."
    mitigations: [AML.M0025, AML.M0023]
    url: https://mlflow.org/docs/latest/ml/dataset/
    verified: "2026-11-18"
  - id: k8sAuditLogging
    name: "Audit policy (--audit-policy-file)"
    where: "Kubernetes › kube-apiserver flags: --audit-policy-file, --audit-log-path (or the webhook backend)"
    setVia: [configFile]
    area: audit
    default: "No events are logged when the flag is omitted"
    recommended: "A policy that records at least Metadata for every request and RequestResponse for job, pipeline, Sandbox, SandboxClaim, role and RoleBinding resources; Secrets at Metadata only, never RequestResponse; events shipped off the control plane nodes to the log store and the SIEM"
    why: "The platform itself records who started each run, under which identity, and who created, changed or deleted a workload, a role or a secret, outside the cluster the run could touch."
    mitigations: [AML.M0024, cap-agent-tracing]
    url: https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
    verified: "2026-11-18"
  - id: tetragonTracingPolicy
    name: "TracingPolicy"
    where: "Tetragon › TracingPolicy custom resource (kprobes, tracepoints, selectors, Signal and Override actions); events exported from each node"
    setVia: [clusterPolicy]
    area: audit
    recommended: "Process, file and network events from every sandbox node exported off the node, with a TracingPolicy that sends SIGKILL on a short, reviewed list of serious-risk actions"
    why: "The host under the sandboxes is watched from the kernel, outside anything a rollout controls, and the worst actions are stopped where they happen."
    mitigations: [cap-agent-tracing, cap-agent-kill-switch]
    url: https://tetragon.io/docs/concepts/tracing-policy/
    verified: "2026-11-18"
  - id: trivyK8sCompliance
    name: "Kubernetes compliance reports (trivy k8s --compliance)"
    where: "Trivy › trivy k8s --compliance k8s-nsa-1.0 or k8s-cis-1.23, with the node collector on"
    setVia: [apiCli]
    area: audit
    recommended: "Run against the sandbox cluster before each run and after every platform change; failed checks on the sandbox nodes or namespaces block the run until fixed"
    why: "The cluster's own hardening is checked against a published benchmark before a model is given a foothold in it."
    mitigations: [D3-SYSVA]
    url: https://trivy.dev/docs/latest/target/kubernetes/
    verified: "2026-11-18"
  - id: litellmAgentTraceId
    name: "require_trace_id_on_calls_to_agent"
    where: "LiteLLM Proxy › agent litellm_params: require_trace_id_on_calls_to_agent, require_trace_id_on_calls_by_agent"
    setVia: [apiCli, adminConsole]
    area: audit
    recommended: "true on every registered agent, with the A2A task id sent as x-litellm-trace-id and X-LiteLLM-Agent-Id forwarded on the agent's own model calls"
    why: "A task cannot cross the gateway without a trace identifier, so your record and the partner's record of the same task can be matched."
    mitigations: [cap-agent-tracing]
    url: https://docs.litellm.ai/docs/a2a
    verified: "2026-11-18"
  # --- Sharing -------------------------------------------------------------------------
  - id: nexusProxyAllowlist
    name: "Routing Rules"
    where: "Sonatype Nexus Repository › Settings › Routing Rules (BLOCK or ALLOW mode, path matchers); assigned in each proxy repository's Routing Rule field"
    setVia: [adminConsole]
    area: sharing
    default: "No rule: a proxy repository fetches any requested component from its remote, the public registry"
    requires: "Routing rules are in Community Edition and match on the request path only. Malware and look-alike-name detection and quarantine is Sonatype Repository Firewall, a separate paid product (Pro+ or Enterprise). Community Edition is capped at 40,000 components and 100,000 requests a day; a large fleet needs the Pro edition or Pulp"
    recommended: "On each proxy repository (PyPI, npm, Hugging Face), an ALLOW rule listing only the approved package and model paths, or a BLOCK rule covering every in-house package name and namespace so it is never fetched from outside; all installs go through the mirror (pip index-url), pinned by hash"
    why: "A package or model reaches a workload only if the mirror was told to admit it, and an internal name cannot be answered by a public look-alike."
    mitigations: [D3-FA, AML.M0028]
    url: https://help.sonatype.com/en/routing-rules.html
    verified: "2026-11-18"
  - id: trivyScanPipeline
    name: "Vulnerability scanning of images and dependencies"
    where: "Trivy › pipeline steps trivy image <ref> and trivy fs <project or lock file> with --severity HIGH,CRITICAL --exit-code 1; Trivy's vulnerability databases mirrored in your own registry"
    setVia: [apiCli]
    area: sharing
    default: "Vulnerability and secret scanning are on; Trivy exits with code 0 even when it finds issues unless --exit-code is set. Trivy pulls its databases from mirror.gcr.io and ghcr.io and contacts check.trivy.dev, none of which the cluster can reach"
    recommended: "On every change and nightly build, trivy image and trivy fs with --severity HIGH,CRITICAL --exit-code 1 on each image and lock file before it is pushed to the registry or promoted to the package mirror; Trivy's databases mirrored inside the data centre; new names checked against your approved list"
    why: "Known flaws and embedded secrets in the images and packages you run are found before they are admitted and again as new advisories appear, and a failing scan stops the build instead of producing a report nobody reads."
    mitigations: [D3-FA, D3-AVE, D3-SYSVA]
    url: https://trivy.dev/docs/latest/guide/scanner/vulnerability/
    verified: "2026-11-18"
  - id: peerPlatformReview
    name: "Assess the peer platform before federation"
    where: "Your vendor risk process › a recorded assessment per peer platform, renewed yearly and attached to its agent record"
    setVia: [code]
    area: sharing
    recommended: "Before any federation is configured: how the platform handles the identity assertions you send, how it separates customers, whether it signs its Agent Cards, what audit records it exports and whether it honours CancelTask"
    why: "Your users' identities travel to this platform, so the decision to federate rests on evidence of how it will treat them."
    mitigations: [cap-ai-vendor-assessment]
    url: https://a2a-protocol.org/latest/specification/
    verified: "2026-11-18"

implementations:
  - architecture: archChatAgent
    asOf: "2026-11"
    verified: "2026-11-18"
    reference:
      - title: "Production Best Practices"
        url: https://docs.litellm.ai/docs/proxy/prod
      - title: "Security"
        url: https://docs.vllm.ai/en/latest/usage/security/
      - title: "Production environment"
        url: https://kubernetes.io/docs/setup/production-environment/
    summary:
      - "Your chat agent runs on your own Kubernetes cluster behind Envoy Gateway, with people signing in through Keycloak. Every model and tool call passes LiteLLM Proxy, which holds the agent's virtual key, its tool grants and pinned tool descriptions, guardrails and limits, and calls your own vLLM models on GPU nodes in the same data centre. Generated code runs in throwaway gVisor sandboxes, and default-deny network policy with one outbound proxy keeps traffic on the drawn paths. Data, prompts and weights stay in your data centre, and you carry everything a cloud provider would otherwise run."
    bindings:
      - { block: events, service: "Kubernetes CronJobs and Argo Events", note: "A scheduled run starts with no user in the thread, so any write it proposes waits in the approval queue." }
      - { block: entry, service: "Envoy Gateway with Keycloak sign-in (OIDC)", note: "A SecurityPolicy with oidc sends every request to Keycloak first. Do not build on ingress-nginx: it was retired in March 2026." }
      - { block: localTools, service: "agent-sandbox on gVisor (RuntimeClass)", note: "In-process handlers stay in the agent's pod; generated code runs in a Sandbox pod of its own. Kata Containers is the alternative runtime." }
      - { block: agent, service: "Your agent on Kubernetes", build: true, note: "Any framework. A Temporal Workflow holds a turn that is waiting for the user's approval, so the wait survives a restart." }
      - { block: memory, service: "PostgreSQL with pgvector; Valkey for sessions", note: "Row security and a partition for each tenant in PostgreSQL; an ACL user and an expiry on every session key in Valkey." }
      - { block: gateway, service: "LiteLLM Proxy on Kubernetes", note: "Needs its own PostgreSQL and Redis. Reading keys from Vault needs an Enterprise licence, so mount the master key and salt key from a Kubernetes Secret." }
      - { block: provider, service: "vLLM on GPU nodes (NVIDIA GPU Operator)", note: "Your own open-weights models, in the same data centre. Tool calling needs --enable-auto-tool-choice and a --tool-call-parser. KServe is the alternative." }
      - { block: internalTools, service: "Your MCP servers on Kubernetes, behind LiteLLM", build: true, note: "Registered under mcp_servers. Each verifies the exchanged token and its audience itself, and accepts calls from the gateway only." }
      - { block: orgData, service: "Your systems of record", build: true, note: "Yours to run. Enforce who may read which row in the store itself, for example with PostgreSQL row security." }
      - { block: openWeb, service: "SearXNG, reached through the Squid outbound proxy", note: "SearXNG runs inside and is registered on LiteLLM as a tool; it and page fetches leave only through the proxy." }
      - { block: sources, service: "Public registries (PyPI, npm)", note: "Outside the organisation. Only the package mirror may reach them, through the outbound proxy." }
      - { block: registry, service: "Sonatype Nexus Repository Community Edition", note: "Proxy and hosted repositories for PyPI and npm. Community Edition has usage caps; Pulp is the alternative." }
    sources:
      events: https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/
      entry: https://gateway.envoyproxy.io/docs/
      localTools: https://agent-sandbox.sigs.k8s.io/
      agent: https://docs.temporal.io/
      memory: https://github.com/pgvector/pgvector
      gateway: https://docs.litellm.ai/docs/simple_proxy
      provider: https://docs.vllm.ai/en/latest/
      internalTools: https://docs.litellm.ai/docs/mcp
      orgData: https://www.postgresql.org/docs/current/ddl-rowsecurity.html
      openWeb: https://docs.searxng.org/
      sources: https://pypi.org/
      registry: https://help.sonatype.com/en/sonatype-nexus-repository.html
    differences:
      - at: gateway->provider
        text: "The model provider is inside: LiteLLM calls your own vLLM servers in the same data centre, so prompts and completions never leave. vLLM has no authentication unless --api-key is set, and even then /invocations, /tokenize and other paths stay open, so network policy must admit only the gateway's pods to it."
        url: https://docs.vllm.ai/en/latest/usage/security/
      - at: provider
        text: "vLLM collects anonymous usage data by default and sends it to its maintainers. In a data centre with residency rules, set VLLM_NO_USAGE_STATS=1 (or DO_NOT_TRACK=1) on every vLLM pod, and keep the pods without a route to the outside."
        url: https://docs.vllm.ai/en/latest/usage/usage_stats/
      - at: agent->gateway
        text: "Nothing in Kubernetes puts LiteLLM in this path. Pods are non-isolated by default, so an agent pod that can route to vLLM or to a tool service can call it directly and skip the gateway's keys, limits and logs. The drawing holds only with default-deny network policy and allow rules that admit the gateway alone."
        url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
      - at: gateway->internalTools
        text: "LiteLLM's MCP gateway is open by default: when no key, team or organisation carries a server list, a caller reaches every registered MCP server, and tool lists are served live from the server. Set require_key_mcp_access_defined, grant servers for each key, and pin each server's tools after review."
        url: https://docs.litellm.ai/docs/mcp_control
      - at: gateway
        text: "LiteLLM can check a Keycloak token itself (JWT auth) only with an Enterprise licence. In the open-source edition the agent presents its own virtual key, so the gateway knows which agent is calling but takes the user's identity on the agent's word. Where a call must be limited to the user, rely on the token exchanged for each tool server."
        url: https://docs.litellm.ai/docs/proxy/token_auth
      - at: localTools->memory
        text: "No gateway sits on this path, so LiteLLM's Presidio masking never sees what the agent stores: the agent must mask before it writes. Valkey's default user needs no password and can reach every key, so session state is separate only once you create an ACL user for each service with its own key pattern."
        url: https://valkey.io/topics/acl/
      - at: sources->registry
        text: "Nexus routing rules allow or block by request path, and Trivy finds known vulnerabilities. Neither detects a malicious or look-alike package: Sonatype points to its separate Repository Firewall product for that. Without it, add a quarantine repository and your own name check before a package is promoted."
        url: https://help.sonatype.com/en/routing-rules.html
    alsoNeeded:
      - service: "Keycloak, highly available, with its own database"
        role: identity
        why: "It is the sign-in service and the OAuth authorization server for people, services and token exchange. A cloud would have run it for you."
        url: https://www.keycloak.org/documentation
      - service: "Vault or OpenBao, sealed by a hardware security module"
        role: secrets
        why: "It holds the gateway's master key, database credentials and signing keys. Auto-unseal with a PKCS#11 HSM needs Vault Enterprise; in OpenBao it is an open-source plugin."
        url: https://openbao.org/docs/configuration/seal/pkcs11/
      - service: "cert-manager with an internal certificate authority"
        role: keys
        why: "Every service-to-service connection needs a certificate that is issued and renewed without a person, from a private authority you control."
        url: https://cert-manager.io/docs/
      - service: "Cilium and a Squid outbound proxy"
        role: network
        why: "The network plugin enforces the policies and the proxy is the one exit. Without both, every pod can reach every other pod and the internet."
        url: https://docs.cilium.io/en/stable/security/policy/
      - service: "Harbor registry with Trivy scanning and Cosign signatures"
        role: registry
        why: "The cluster pulls the agent, gateway, vLLM and sandbox images from a registry inside the data centre, scanned and signed, not from the internet."
        url: https://goharbor.io/docs/
      - service: "OpenTelemetry Collector, Grafana Loki, self-hosted Langfuse"
        role: logging
        why: "They receive the gateway's logs and traces and keep them where the agent cannot write. Loki keeps logs for ever unless retention is turned on."
        url: https://opentelemetry.io/docs/collector/
      - service: "Your SIEM, fed by the collector and Kubernetes audit logs"
        role: logging
        why: "Detections on blocked calls, denied egress and key use have to run somewhere. The API server logs nothing until an audit policy file is set."
        url: https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
      - service: "Kubernetes control plane and etcd on your own servers"
        role: other
        why: "You build and run the highly available control plane, its etcd and its certificates that a managed service would have provided."
        url: https://kubernetes.io/docs/setup/production-environment/
      - service: "GPU servers with the NVIDIA GPU Operator"
        role: other
        why: "The hardware, its drivers, the container toolkit and the device plugin are yours to buy, install and keep working. Capacity is what you own."
        url: https://docs.nvidia.com/datacenter/cloud-native/gpu-operator/latest/index.html
      - service: "Backup and restore with Velero"
        role: other
        why: "Cluster resources and the volumes behind PostgreSQL, Keycloak, Vault and the logs need tested backups in a second location you run."
        url: https://velero.io/docs/
      - service: "Patching and upgrades of the cluster and every component"
        role: other
        why: "Nobody else patches Kubernetes, the nodes, LiteLLM, vLLM or Keycloak for you. Plan regular upgrades and a way to roll them back."
        url: https://kubernetes.io/docs/tasks/administer-cluster/cluster-upgrade/
    quickstart:
      - title: "Deploy with Helm"
        url: https://docs.litellm.ai/docs/proxy/deploy/helm
      - title: "Using Kubernetes"
        url: https://docs.vllm.ai/en/latest/deployment/k8s/
      - title: "OIDC Authentication"
        url: https://gateway.envoyproxy.io/docs/tasks/security/oidc/
    settings:
      - keycloakGroupsAccess
      - keycloakTokenLifetimes
      - envoyGatewayRateLimit
      - litellmVirtualKeys
      - litellmKeyRotation
      - keycloakTokenExchange
      - litellmMcpTokenExchange
      - litellmMcpGateway
      - litellmMcpToolAllowlist
      - litellmMcpPinnedTools
      - litellmMcpPolicyGuardrail
      - temporalApprovalSignal
      - litellmGuardrailsInput
      - litellmGuardrailsOutput
      - presidioMaskBeforeStore
      - litellmBudgetsRateLimits
      - litellmAgentSessionLimits
      - litellmFallbacksRouting
      - promptfooEvalGate
      - postgresRowSecurity
      - ingestScanBeforeIndex
      - frontEndSanitiseOutput
      - k8sNetworkPolicyDefaultDeny
      - ciliumFqdnEgress
      - egressProxyAllowlist
      - k8sRuntimeClassSandbox
      - agentSandboxShutdown
      - nexusProxyAllowlist
      - trivyScanPipeline
      - langfuseTracing
      - litellmLoggingCallbacks

