# NIST CSF 2.0 categories and an authored crosswalk from CoSAI controls onto them.
# Category names and identifiers are NIST's; the crosswalk is this repository's assessment.
frameworks:
  - id: nist-csf
    name: NIST CSF
    fullName: NIST CSF
    version: "2.0"
    baseUri: https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf
    documentUri: https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf
    description: Cybersecurity outcomes, mapped alongside CoSAI’s controls. CoSAI remains the canonical control
      taxonomy; its NIST AI RMF mappings remain intact.
    authored: true
    summary: Selected source entries; crosswalks authored in this repository.
    attribution: Source category names and identifiers belong to the named publisher. Descriptions are repository
      summaries; all crosswalks are repository assessments, not publisher endorsements.
    mappingRationale: Category references describe terminology or narrower scope. Supports mappings describe a
      possible contribution, never equivalence, deployed coverage, or control fulfillment. Only the listed
      source entries are included.
    entries:
      GV.OC:
        label: Organizational Context
        description: Understand organizational dependencies and obligations.
        identifierKind: official
        sourceLocation: Appendix A, CSF Core categories
        group: Govern
        url: https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf
      GV.RM:
        label: Risk Management Strategy
        description: Set direction for cybersecurity risk decisions.
        identifierKind: official
        sourceLocation: Appendix A, CSF Core categories
        group: Govern
        url: https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf
      GV.RR:
        label: Roles, Responsibilities, and Authorities
        description: Assign security accountability and authority.
        identifierKind: official
        sourceLocation: Appendix A, CSF Core categories
        group: Govern
        url: https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf
      GV.PO:
        label: Policy
        description: Establish and maintain cybersecurity policy.
        identifierKind: official
        sourceLocation: Appendix A, CSF Core categories
        group: Govern
        url: https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf
      GV.OV:
        label: Oversight
        description: Review cybersecurity performance and strategy.
        identifierKind: official
        sourceLocation: Appendix A, CSF Core categories
        group: Govern
        url: https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf
      GV.SC:
        label: Cybersecurity Supply Chain Risk Management
        description: Manage risks introduced through suppliers.
        identifierKind: official
        sourceLocation: Appendix A, CSF Core categories
        group: Govern
        url: https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf
      ID.AM:
        label: Asset Management
        description: Identify and manage assets throughout their lifecycle.
        identifierKind: official
        sourceLocation: Appendix A, CSF Core categories
        group: Identify
        url: https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf
      ID.RA:
        label: Risk Assessment
        description: Understand threats, vulnerabilities, and impacts.
        identifierKind: official
        sourceLocation: Appendix A, CSF Core categories
        group: Identify
        url: https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf
      ID.IM:
        label: Improvement
        description: Improve security through evaluation and experience.
        identifierKind: official
        sourceLocation: Appendix A, CSF Core categories
        group: Identify
        url: https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf
      PR.AA:
        label: Identity Management, Authentication, and Access Control
        description: Manage identities and restrict access.
        identifierKind: official
        sourceLocation: Appendix A, CSF Core categories
        group: Protect
        url: https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf
      PR.AT:
        label: Awareness and Training
        description: Develop personnel security knowledge and skills.
        identifierKind: official
        sourceLocation: Appendix A, CSF Core categories
        group: Protect
        url: https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf
      PR.DS:
        label: Data Security
        description: Protect information confidentiality, integrity, and availability.
        identifierKind: official
        sourceLocation: Appendix A, CSF Core categories
        group: Protect
        url: https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf
      PR.PS:
        label: Platform Security
        description: Secure platform configurations, software, and execution.
        identifierKind: official
        sourceLocation: Appendix A, CSF Core categories
        group: Protect
        url: https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf
      PR.IR:
        label: Technology Infrastructure Resilience
        description: Maintain resilient technology and networks.
        identifierKind: official
        sourceLocation: Appendix A, CSF Core categories
        group: Protect
        url: https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf
      DE.CM:
        label: Continuous Monitoring
        description: Observe assets for potentially adverse events.
        identifierKind: official
        sourceLocation: Appendix A, CSF Core categories
        group: Detect
        url: https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf
      DE.AE:
        label: Adverse Event Analysis
        description: Analyze observations to detect incidents.
        identifierKind: official
        sourceLocation: Appendix A, CSF Core categories
        group: Detect
        url: https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf
      RS.MA:
        label: Incident Management
        description: Manage response to detected incidents.
        identifierKind: official
        sourceLocation: Appendix A, CSF Core categories
        group: Respond
        url: https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf
      RS.AN:
        label: Incident Analysis
        description: Investigate incidents and establish their impact.
        identifierKind: official
        sourceLocation: Appendix A, CSF Core categories
        group: Respond
        url: https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf
      RS.CO:
        label: Incident Response Reporting and Communication
        description: Coordinate incident communications.
        identifierKind: official
        sourceLocation: Appendix A, CSF Core categories
        group: Respond
        url: https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf
      RS.MI:
        label: Incident Mitigation
        description: Contain and reduce incident effects.
        identifierKind: official
        sourceLocation: Appendix A, CSF Core categories
        group: Respond
        url: https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf
      RC.RP:
        label: Incident Recovery Plan Execution
        description: Restore affected assets and operations.
        identifierKind: official
        sourceLocation: Appendix A, CSF Core categories
        group: Recover
        url: https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf
      RC.CO:
        label: Incident Recovery Communication
        description: Communicate recovery progress.
        identifierKind: official
        sourceLocation: Appendix A, CSF Core categories
        group: Recover
        url: https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf
    entriesComplete: true
    controlMappings:
      - control: controlModelPrivacyEnhancingTechnologies
        entries:
          - PR.DS
        rationale: Training-time privacy technologies contribute to protecting data.
      - control: controlRuntimePrivacyEnhancingTechnologies
        entries:
          - PR.DS
        rationale: Inference-time privacy technologies contribute to data protection.
      - control: controlTrainingDataManagement
        entries:
          - ID.AM
          - PR.DS
        rationale: Dataset lifecycle and authorized use support asset and data management.
      - control: controlTrainingDataSanitization
        entries:
          - PR.DS
        rationale: Sanitization contributes to dataset integrity.
      - control: controlUserDataManagement
        entries:
          - PR.DS
        rationale: User-data handling requirements support data protection.
      - control: controlModelAndDataInventoryManagement
        entries:
          - ID.AM
        rationale: Maintains inventories of AI models and data.
      - control: controlModelAndDataAccessControls
        entries:
          - PR.AA
        rationale: Restricts access to models and data.
      - control: controlModelAndDataIntegrityManagement
        entries:
          - PR.DS
        rationale: Protects model and dataset integrity.
      - control: controlModelAndDataExecutionIntegrity
        entries:
          - PR.PS
        rationale: Protects software and model execution.
      - control: controlSecureByDefaultMLTooling
        entries:
          - PR.PS
        rationale: Secure configurations and development support platform security.
      - control: controlInputValidationAndSanitization
        entries:
          - PR.PS
        rationale: Input validation is a secure application-development practice.
      - control: controlOutputValidationAndSanitization
        entries:
          - PR.PS
        rationale: Output validation constrains unsafe downstream execution.
      - control: controlAdversarialTrainingAndTesting
        entries:
          - ID.RA
          - ID.IM
        rationale: Adversarial evaluation identifies weaknesses and informs improvement.
      - control: controlApplicationAccessManagement
        entries:
          - PR.AA
          - PR.IR
        rationale: Application access and resource management support authorization and capacity resilience.
      - control: controlAgentPluginUserControl
        entries:
          - PR.AA
        rationale: User control over agent actions constrains delegated access.
      - control: controlAgentPluginPermissions
        entries:
          - PR.AA
        rationale: Agent tool permissions implement access policy.
      - control: controlRedTeaming
        entries:
          - ID.RA
          - ID.IM
        rationale: Adversarial testing identifies weaknesses and improvement opportunities.
      - control: controlVulnerabilityManagement
        entries:
          - ID.RA
          - PR.PS
        rationale: Findings and remediation support risk assessment and secure platforms.
      - control: controlThreatDetection
        entries:
          - DE.CM
          - DE.AE
        rationale: Monitoring and analysis support threat detection.
      - control: controlIncidentResponseManagement
        entries:
          - RS.MA
          - RS.AN
          - RS.CO
          - RS.MI
          - RC.RP
        rationale: The response lifecycle covers coordination, analysis, communication, containment, and recovery.
      - control: controlUserPoliciesAndEducation
        entries:
          - PR.AT
        rationale: User education supports security awareness.
      - control: controlInternalPoliciesAndEducation
        entries:
          - GV.PO
          - PR.AT
        rationale: Internal policy and staff education support policy and training outcomes.
      - control: controlProductGovernance
        entries:
          - GV.OV
          - GV.PO
        rationale: Product oversight and policy support governance outcomes.
      - control: controlRiskGovernance
        entries:
          - GV.RM
          - GV.OV
        rationale: Risk governance establishes strategy and oversight.
      - control: controlAgentObservability
        entries:
          - DE.CM
          - DE.AE
        rationale: Agent telemetry supports monitoring and analysis.
      - control: controlIsolatedConfidentialComputing
        entries:
          - PR.DS
          - PR.PS
        rationale: Isolation protects data in use and execution environments.
      - control: controlRetrievalAndVectorSystemIntegrity
        entries:
          - PR.DS
        rationale: Retrieval integrity contributes to trustworthy stored and retrieved data.
      - control: controlOrchestratorAndRouteIntegrity
        entries:
          - PR.PS
        rationale: Protects application routing and execution configuration.
      - control: controlAgentInventoryManagement
        entries:
          - ID.AM
        rationale: Maintains agent inventories.
      - control: controlAgentIntegrityManagement
        entries:
          - PR.PS
        rationale: Protects agent software and execution integrity.
      - control: controlAgentCredentialIsolation
        entries:
          - PR.AA
        rationale: Credential isolation constrains cross-agent authority.
      - control: controlInterComponentTransportSecurity
        entries:
          - PR.DS
        rationale: Protects data in transit between components.
      - control: controlComponentIdentityProvenance
        entries:
          - PR.AA
        rationale: Identity provenance supports trusted identity assertions.
      - control: controlAgentExecutionBounds
        entries:
          - PR.IR
          - PR.AA
        rationale: Execution bounds constrain resource use and authorized actions.
