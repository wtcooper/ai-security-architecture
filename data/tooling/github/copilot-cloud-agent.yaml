                Datadog, Google Cloud Storage, Splunk, or Microsoft Purview for agent session events only).
            url: >-
              https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/streaming-the-audit-log-for-your-enterprise
          - title: Or pull them over the API
            body:
              - >-
                Set "Copilot Usage Records API" to Enabled everywhere and read GET
                /enterprises/{enterprise}/copilot/usage-records as an EMU enterprise owner; the records include
                cloud agents operating on github.com.
            url: https://docs.github.com/en/enterprise-cloud@latest/rest/copilot/copilot-usage-metrics
          - title: Correlate on agent_session_id
            body:
              - >-
                Agentic audit events carry actor_is_agent=true, agent_session_id and the initiating user; stream
