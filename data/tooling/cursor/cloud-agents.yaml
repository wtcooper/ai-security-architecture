# Cursor Cloud Agents — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# Excluded: Cursor Origin (git forge, early beta 2026-08-17) — code hosting, not an agent runtime; its
# admin switch and the code-egress concern are recorded as facts below and in README Exclusions.
# 2026-09-15: added sandboxing, egress, runtime enforcement, credential isolation and MCP rows after the managed-runtime drawing pinned them; fetched cloud-agent/security, security-network, settings, identity, hooks, enterprise/model-and-integration-management (all 200).
