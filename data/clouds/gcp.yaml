          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/use-a-custom-agent
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/use-an-a2a-agent
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/manage-revisions-and-traffic
