# OpenClaw — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
#
# Fetch log 2026-09-10: every docs.openclaw.ai page cited below resolved as Markdown (append
# .md; index at https://docs.openclaw.ai/llms.txt). Guessed URLs plugins/sdk-hooks and
# plugins/sdk/hooks returned 404 (the plugin hook page is plugins/hooks/tool-policy). The GitHub
# advisories listing renders only 10 of 647 published advisories to a fetch; the full list was
# read through the GitHub REST API (repos/openclaw/openclaw/security-advisories). NVD resolved
# CVE-2026-25253; the project's own advisory for the same bug carries no CVE id
# (GHSA-g8p2-7wf7-98mq). Earliest published advisory is 2026-01-31; there are no 2025 advisories.
# 2026-09-25: re-verified all 21 archPersonalAgent rows (cap-input-guardrails … D3-FA) against the MITRE
# capability rules; every docs.openclaw.ai URL cited resolved 200 as Markdown with no redirects. A WebFetch
# summary of gateway/sandbox-vs-tool-policy-vs-elevated misread the sandbox default as "non-main"; the page
# text, gateway/sandboxing and gateway/config-agents/sandbox all say "off". The advisories API lists 722
# published advisories; 75 new since 2026-09-10, all published 2026-09-11 (30 high, none critical); the
# five high ones that touch a pinned control are listed below. Latest release v2026.9.6 (2026-09-23).
vendor: openclaw
family: OpenClaw
tools:
  - id: toolOpenclaw
    name: OpenClaw
    surfaceClasses:
      - endpointCli
    architecture: archPersonalAgent
    status: ga
    asOf: "2026-09"
    summary:
      - "A self-hosted personal agent whose gateway is the control plane — channels, tool policy and auth
        under an explicit single-trusted-operator model. Official hardening is real and specific:
        loopback-plus-token gateway auth, DM pairing, high-risk tools disabled or sandboxed, and a container
        sandbox whose defaults are no network, a read-only root and all capabilities dropped. Sandboxing
        itself is off by default (agents.defaults.sandbox); latest release 2026.9.6 (2026-09-23)."
      - "The operator model is the single trusted user: the person who runs the gateway is the administrator,
        everything below is a config key in openclaw.json, a CLI command or a Control UI setting that user
        sets, and the trust-model page says plainly that one gateway is one trust boundary and not hostile
        multi-tenant isolation."
    facts:
      - label: Plans
        value: >-
          Open source, self-hosted; no vendor plan tiers. ClawHub is the public marketplace for skills and
          plugins.
        url: https://docs.openclaw.ai/clawhub
      - label: Inference & routing
        value: >-
          The user picks the model provider under models.providers (hosted APIs, subscription OAuth, or local
          servers); every reply and tool call runs on that provider, and web search, embeddings and media
          features can call further paid APIs with their own keys.
        url: https://docs.openclaw.ai/reference/api-usage-costs
      - label: Data leaving the device
        value: >-
          Prompts, tool results and attachments go to the configured model and tool providers; runtime traffic
          can be forced through an operator proxy (proxy.proxyUrl). Feature telemetry is off by default
          (telemetry.enabled false) and rides the daily update check when enabled.
        url: https://docs.openclaw.ai/gateway/config-observability
      - label: Retention & training
        value: >-
          Everything is local under ~/.openclaw: config, credentials, SQLite state and session transcripts
          (JSONL). The metadata-only audit ledger keeps 30 days and at most 100,000 rows. No vendor training;
          provider terms apply to what is sent for inference.
        url: https://docs.openclaw.ai/gateway/security/secrets-and-storage
      - label: Docs index
        value: https://docs.openclaw.ai/llms.txt
        url: https://docs.openclaw.ai/llms.txt
    items:
      - title: Gateway lockdown and the version floor
        body:
          - "gateway.bind defaults to loopback (container images default to an exposed bind); the
            network-exposure page says plainly never to expose it unauthenticated on 0.0.0.0, and
            gateway.auth.mode token is the recommended mode. DM hardening is dmPolicy pairing (codes expire
            after one hour for unknown senders), allowFrom contact allowlists and requireMention in groups;
            `openclaw security audit` checks a deployment and `--fix` applies safe fixes (open group policies
            to allowlist, file permissions). Enforce a version floor of 2026.1.29: earlier Control UI builds
            auto-connected to an attacker-supplied gatewayUrl and sent the operator token (CVE-2026-25253,
            CVSS 8.8), and internet scans found thousands of exposed instances."
        links:
          - title: OpenClaw gateway security model
            url: https://docs.openclaw.ai/gateway/security
          - title: OpenClaw network exposure
            url: https://docs.openclaw.ai/gateway/security/network-exposure
          - title: OpenClaw access control and allowlists
            url: https://docs.openclaw.ai/gateway/security/access-control
          - title: OpenClaw security CLI (audit, --fix)
            url: https://docs.openclaw.ai/cli/security
          - title: GitHub Advisory GHSA-g8p2-7wf7-98mq — CVE-2026-25253 (readable primary advisory)
            url: https://github.com/advisories/GHSA-g8p2-7wf7-98mq
          - title: NVD — CVE-2026-25253 (record; client-rendered, thin to automated fetch)
            url: https://nvd.nist.gov/vuln/detail/cve-2026-25253
      - title: Sandbox defaults and proxy-injected credentials
        body:
          - With the Docker sandbox backend enabled, tool execution runs in a container whose defaults are
            network none, readOnlyRoot true, capDrop ALL, an init process and no-new-privileges, with the
            workspace mounted read-only at /agent (workspaceAccess ro) or read-write by policy; per-agent
            sandbox and tool-policy overrides layer on top, and the docs warn never to mount the host Docker
            socket into a sandbox container. Docker's own Sandboxes product wraps the same agent with a
            configurable egress proxy that denies arbitrary hosts and injects provider API keys at the proxy,
            so the agent process never holds them.
        links:
          - title: OpenClaw sandboxing
            url: https://docs.openclaw.ai/gateway/sandboxing
          - title: OpenClaw Docker backend defaults
            url: https://docs.openclaw.ai/gateway/sandboxing/docker-backend
          - title: "Docker: Run OpenClaw securely in Docker Sandboxes"
            url: https://www.docker.com/blog/run-openclaw-securely-in-docker-sandboxes/
    riskNotes:
      - risk: riskPromptInjection
        note: >-
          The docs treat every fetched page, email, attachment and hook payload as hostile even when only the
          operator can message the bot; the shipped defences are boundary markers and token stripping, not a
          classifier, so the recommended shape is a tool-less reader agent plus tool policy, exec approvals
          and sandboxing.
      - risk: riskRogueActions
        note: >-
          The trusted-operator default is host exec with security full and ask off; nothing prompts until the
          user sets tools.exec.mode to allowlist or ask, and tools.elevated lets exec leave the sandbox for
          allowlisted senders.
    controls:
      - mitigation: cap-input-guardrails
        coverage: partial
        mechanism: >-
          External content (web, mail, hook payloads, attachments) is wrapped in
          <<<EXTERNAL_UNTRUSTED_CONTENT>>> boundary markers with chat-template special tokens stripped;
          nothing classifies it. The attach point is a plugin before_agent_run gate hook, which sees the final
          prompt and session messages before model submission and can block the run (it fails closed on error
          or timeout); tool_result_persist and before_message_write can rewrite a tool result before it is
          persisted.
        steps:
          - title: Keep the unsafe-content bypass flags off
            body:
              - Leave hooks.mappings[].allowUnsafeExternalContent, hooks.gmail.allowUnsafeExternalContent and
                the cron payload field allowUnsafeExternalContent unset so external content keeps its boundary
                markers.
            url: https://docs.openclaw.ai/gateway/security/prompt-injection
          - title: Attach your own screening to the run gate
            body:
              - Register a plugin before_agent_run handler that runs your injection classifier over the
                assembled prompt and session messages and blocks the run on a hit; the runner also blocks the
                run when the handler throws or exceeds its 15-second default timeout.
            url: https://docs.openclaw.ai/plugins/hooks/reference
          - title: Summarise untrusted content in a reader agent
            body:
              - Route web, mail and hook content to a read-only or tool-disabled agent under
                agents.entries.<id> and pass only its summary to the main agent, constraining the handoff with
                tools.agentToAgent.allow.
            url: https://docs.openclaw.ai/gateway/security/prompt-injection
          - title: Let the audit catch weak-model exposure
            body:
              - "`openclaw security audit` warns when a model of 300B parameters or fewer runs unsandboxed
                with web or browser tools enabled; fix that finding before exposing the agent to untrusted
                inboxes."
            url: https://docs.openclaw.ai/cli/security
        note: >-
          Partial by the rule applied to every vendor: the product ships a hook that can block, not a
          classifier. Boundary markers and token stripping lower the odds that an injected instruction is
          obeyed but detect nothing, so inbound channel messages (the owner's included) and tool results reach
          the model unscreened unless a plugin gates the run. The memory taint on network-sourced tool results
          governs promotion into long-term memory, not what the model reads in the current turn. Enforcing
          actor: the Gateway process on the host, for every channel and agent once the plugin is loaded.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityPromptInjectionDefense
          reviewRequired: false
          original:
            - capability: capabilityPromptInjectionDefense
              coverage: partial
              mechanism: >-
                External content is wrapped in <<<EXTERNAL_UNTRUSTED_CONTENT>>> boundary markers with
                chat-template special tokens stripped, and an outbound sanitizer strips leaked tool-call
                scaffolding from replies; there is no injection classifier. Hardening is the reader-agent
                pattern, tool policy and the audit's small-model warning.
              steps:
                - title: Keep the unsafe-content bypass flags off
                  body:
                    - Leave hooks.mappings[].allowUnsafeExternalContent,
                      hooks.gmail.allowUnsafeExternalContent and the cron payload field
                      allowUnsafeExternalContent unset; if one is needed for debugging, isolate that agent
                      with a sandbox, minimal tools and its own session namespace.
                  url: https://docs.openclaw.ai/gateway/security/prompt-injection
                - title: Summarise untrusted content in a reader agent
                  body:
                    - Route web, mail and hook content to a read-only or tool-disabled agent under
                      agents.entries.<id> (sandbox mode all, tools.deny for exec/browser/write) and pass only
                      its summary to the main agent; constrain the handoff with tools.agentToAgent.allow.
                  url: https://docs.openclaw.ai/gateway/security/prompt-injection
                - title: Deny the high-risk tools unless needed
                  body:
                    - Keep web_search, web_fetch and browser out of tool-enabled agents via tools.deny, and
                      set tools.exec.strictInlineEval true whenever interpreters (python, node, ruby,
                      osascript) are allowlisted so -c/-e forms still need approval.
                  url: https://docs.openclaw.ai/gateway/security/prompt-injection
                - title: Let the audit catch weak-model exposure
                  body:
                    - "`openclaw security audit` warns when a model of 300B parameters or fewer runs
                      unsandboxed with web or browser tools enabled; fix that finding before exposing the
                      agent to untrusted inboxes."
                  url: https://docs.openclaw.ai/cli/security
              note: >-
                Boundary markers and token stripping reduce the chance an injected instruction is obeyed; they
                detect nothing. Detection would be a scanner the operator adds in front of tool results.
              verified: 2026-09-10
      - mitigation: cap-output-guardrails
        coverage: partial
        mechanism: >-
          plugins.entries.amazon-bedrock.config.guardrail applies an Amazon Bedrock Guardrail (content
          filters, topic denial, word filters) to every Bedrock model invocation; for any other provider the
          only points are plugin hooks — before_agent_run can block a run before model submission, and
          message_sending / reply_payload_sending can rewrite or cancel a reply before delivery.
        steps:
          - title: Apply a Bedrock Guardrail when the provider is Bedrock
            body:
              - Set plugins.entries.amazon-bedrock.config.guardrail with guardrailIdentifier and
                guardrailVersion (streamProcessingMode "sync" or "async" for streamed output) and grant the
                Gateway's IAM principal bedrock:ApplyGuardrail.
            url: https://docs.openclaw.ai/providers/bedrock
          - title: Gate requests with your own classifier
            body:
              - A plugin before_agent_run handler can run your harm or denied-topic classifier on the final
                prompt and block the run; it fails closed on error or timeout.
            url: https://docs.openclaw.ai/plugins/hooks/reference
          - title: Hold replies with your own classifier
            body:
              - "A plugin message_sending handler can rewrite the outbound content or return { cancel: true };
                a handler that throws or times out is logged and skipped, so this gate fails open."
            url: https://docs.openclaw.ai/plugins/hooks/messages
        note: >-
          Partial by the attach-point rule: a config switch classifies model traffic only on the Amazon
          Bedrock provider, where AWS runs the classifier; every other provider gets nothing unless the user
          attaches a plugin. No harm-category, denied-topic or blocked-term filter ships in OpenClaw itself,
          and the only built-in output processing is the sanitizer that strips leaked tool-call scaffolding.
          The decision models API (onnx, TypeSafe) has no automatic consumer wired to it.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityModelGuardrails
          reviewRequired: false
          original:
            - capability: capabilityModelGuardrails
              coverage: none
              note: >-
                No harm-category, denied-topic or blocked-term filter on model inputs or outputs is
                documented; the only output processing is the scaffolding sanitizer. Apply guardrails at the
                provider (the Amazon Bedrock plugin advertises guardrail support but documents no key) and
                keep /reasoning, /verbose and /trace off in shared rooms.
              evidence:
                - title: Vendor docs index, reviewed; no setting for this control (2026-09-10)
                  url: https://docs.openclaw.ai/llms.txt
              verified: 2026-09-10
      - mitigation: cap-sensitive-data-redaction
        coverage: partial
        mechanism: >-
          Attach points on both legs: plugin message_sending / reply_payload_sending hooks can rewrite or
          cancel an outbound reply, and before_tool_call can rewrite a tool call's params or block it; a
          Bedrock Guardrail's sensitive-information filters apply on the Bedrock provider only. Built in:
          pattern and exact-value redaction of logs and operator surfaces (logging.redactPatterns) and
          tools.fs.workspaceOnly path fences.
        steps:
          - title: Redact replies and tool calls in a plugin
            body:
              - Register message_sending (rewrite content or cancel delivery) and before_tool_call (rewrite
                params or block) handlers that call your DLP detector; message_sending fails open when a
                handler errors, before_tool_call fails closed.
            url: https://docs.openclaw.ai/plugins/hooks/messages
          - title: Use the Bedrock Guardrail's sensitive-information filters
            body:
              - A guardrail referenced from plugins.entries.amazon-bedrock.config.guardrail applies its
                sensitive-information filters to Bedrock invocations; other providers are not covered.
            url: https://docs.openclaw.ai/providers/bedrock
          - title: Extend log redaction
            body:
              - Set logging.redactPatterns (regex strings) for tokens, hostnames and internal URLs; the
                setting replaces the default string list, so include the defaults you still want.
            url: https://docs.openclaw.ai/gateway/logging
          - title: Keep file tools inside the workspace
            body:
              - Set tools.fs.workspaceOnly true and leave tools.exec.applyPatch.workspaceOnly at its default
                true; avoid broad workspace roots such as the home directory.
            url: https://docs.openclaw.ai/gateway/security/tool-permissions
        note: >-
          Partial by the rule: detection on the reply and tool-call legs is the user's own detector at a hook,
          or AWS's filter on the Bedrock path only. The built-in redaction matches known secret patterns in
          logs, Control UI tool events, diagnostics exports and approval displays; it does not inspect prompts
          sent to the provider or replies sent to a channel. workspaceOnly is data minimisation, not
          detection.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAiDlp
          reviewRequired: false
          original:
            - capability: capabilityAiDlp
              coverage: partial
              mechanism: >-
                Always-on secret redaction across console, file logs, OTLP records and transcripts with
                logging.redactPatterns for custom patterns, tools.fs.workspaceOnly and
                tools.exec.applyPatch.workspaceOnly to keep file tools inside the workspace, write-only store
                secrets, and channel contextVisibility. No policy inspection of prompt or response content for
                sensitive data.
              steps:
                - title: Add your own redaction patterns
                  body:
                    - Set logging.redactPatterns (regex strings) for tokens, hostnames and internal URLs; note
                      that setting it replaces the built-in defaults, so include the ones you still want.
                  url: https://docs.openclaw.ai/gateway/logging
                - title: Keep file tools inside the workspace
                  body:
                    - Set tools.fs.workspaceOnly true and leave tools.exec.applyPatch.workspaceOnly at its
                      default true; avoid broad workspace roots such as the home directory.
                  url: https://docs.openclaw.ai/gateway/security/tool-permissions
                - title: Limit what rooms feed the prompt
                  body:
                    - Use contextVisibility on group channels so the agent reads only what it needs, and keep
                      /reasoning, /verbose and /trace disabled outside trusted DMs.
                  url: https://docs.openclaw.ai/gateway/security/access-control
              note: >-
                Redaction is pattern-based and applied to logs, transcripts and telemetry after the fact;
                prompts sent to the model provider and tool results are not inspected. Treat it as log
                hygiene, not prompt DLP.
              verified: 2026-09-10
      - mitigation: D3-APA
        coverage: partial
        mechanism: >-
          Per-channel dmPolicy (pairing by default, allowlist, open, disabled) with allowFrom and
          groupAllowFrom, reusable accessGroups referenced as accessGroup:<name> from any channel's lists,
          commands.allowFrom and commands.ownerAllowFrom for commands and directives, and explicit approval of
          paired devices and nodes.
        steps:
          - title: Define approved senders once
            body:
              - Put approved senders in accessGroups.<name> (type "message.senders", members keyed "*" for
                every channel or by channel) and set each channel's allowFrom to ["accessGroup:<name>"] with
                dmPolicy "allowlist".
            url: https://docs.openclaw.ai/channels/access-groups
          - title: Keep unknown senders out
            body:
              - Leave dmPolicy "pairing" or use "allowlist"; approve a request with `openclaw pairing approve
                <channel> <code>` (codes expire after one hour and pending requests cap at three per channel
                account).
            url: https://docs.openclaw.ai/channels/pairing
          - title: Restrict who may issue commands
            body:
              - Set commands.allowFrom per provider (when set it is the only authorization source for commands
                and directives such as /exec) and commands.ownerAllowFrom for owner-only commands.
            url: https://docs.openclaw.ai/gateway/config-channels/commands
          - title: Approve devices explicitly
            body:
              - Review pending and paired devices with `openclaw devices list`, approve a request with
                `openclaw devices approve <requestId>` and remove strays with `openclaw devices remove
                <deviceId>`.
            url: https://docs.openclaw.ai/cli/devices
        note: >-
          Partial by the architecture rule: admission is set channel by channel and an approved sender never
          expires or gets re-checked — the pairing page says approvals persist until removed. accessGroups let
          every bridge use one list, but each channel has to reference it and group policies stay separate. No
          directory binding: members are platform IDs, except Discord's channelAudience type, which resolves
          membership through Discord at authorization time. The 2026-09-11 advisory batch fixed per-channel
          admission bypasses in 2026.8.1 (GHSA-58qx-6m8p-wh2j Slack group DMs, GHSA-8938-r7c6-54vq Microsoft
          Teams access groups).
        verified: "2026-09-25"
        migration:
          from:
            - capabilityIga
          reviewRequired: false
          original:
            - capability: capabilityIga
              coverage: native
              mechanism: >-
                gateway.auth.mode (token | password | trusted-proxy; required by default, fail-closed),
                dmPolicy pairing plus allowFrom allowlists per channel, device and node pairing approvals, and
                gateway.roles / gateway.auth.identityScopes for operator.read | write | admin scopes on team
                gateways
              steps:
                - title: Require gateway authentication
                  body:
                    - Set gateway.auth.mode "token" and a real gateway.auth.token (24+ characters; `openclaw
                      doctor --generate-gateway-token` mints one); startup rejects blank or placeholder
                      secrets and the audit flags short ones.
                  url: https://docs.openclaw.ai/gateway/security/network-exposure
                - title: Gate who can message the agent
                  body:
                    - Keep dmPolicy "pairing" (the default) and approve senders with `openclaw pairing approve
                      <channel> <code>`, or switch to "allowlist" with an explicit allowFrom list; "open"
                      requires allowFrom to contain "*".
                  url: https://docs.openclaw.ai/gateway/security/access-control
                - title: Approve devices and nodes explicitly
                  body:
                    - Review `openclaw devices list`, remove strays with `openclaw devices remove <deviceId>`,
                      and set gateway.nodes.pairing.autoApproveLocal false to require a decision for every
                      device; leave autoApproveCidrs unset.
                  url: https://docs.openclaw.ai/cli/devices
                - title: Scope operator connections
                  body:
                    - On a shared gateway define gateway.roles with per-role scopes (operator.read,
                      operator.write, operator.approvals, operator.admin) and map identities with
                      gateway.auth.identityScopes; a required gateway.roles.default caps everyone else.
                  url: https://docs.openclaw.ai/gateway/operator-scopes
              verified: 2026-09-10
      - mitigation: cap-agent-action-policy-enforcement
        coverage: native
        mechanism: >-
          tools.exec.mode (deny | allowlist | ask | auto | full) under a host approvals floor (the stricter of
          config and host approvals wins), with approval-backed runs bound to resolved executables, argv, cwd
          and one file operand; tools.allow / tools.deny, tools.toolsBySender and per-agent tools;
          tools.fs.workspaceOnly; plugin before_tool_call hooks (block or require approval, fail closed).
          Stored automation jobs carry an explicit tool list. The default is full host exec with no prompts.
        steps:
          - title: Choose an exec mode that enforces policy
            body:
              - "`openclaw config set tools.exec.mode allowlist` (misses are denied) or `ask` (misses go to a
                human); `deny` blocks host exec, and `auto` adds a model reviewer, which is not a
                deterministic rule."
            url: https://docs.openclaw.ai/tools/permission-modes
          - title: Stop the agent rewriting its own policy
            body:
              - Put group:automation (or at least the openclaw tool) in tools.deny, or run the messaging,
                coding or minimal profile, which omits openclaw; under Full Access, including the default, a
                config change the agent delegates through openclaw is applied without an approval prompt.
            url: https://docs.openclaw.ai/gateway/config-tools/tool-policy
          - title: Bind unattended jobs to a tool list
            body:
              - Create agent-turn automations with `--tools` naming only what the job needs (`--tools ""`
                disables every tool); jobs an agent creates are capped to that turn's tools and it cannot
                widen the stored list.
            url: https://docs.openclaw.ai/automation/cron-jobs/payloads
          - title: Add a deterministic plugin gate
            body:
              - A plugin before_tool_call handler returning block true, or a requireApproval decision, is
                terminal for that tool call; the runner blocks the call when the handler throws or times out.
            url: https://docs.openclaw.ai/plugins/hooks/tool-policy
        note: >-
          Native by the same rule as Claude Code: deterministic config rules over tool name and, for exec, the
          arguments and resolved binary, evaluated by the Gateway before the call runs and outside the model.
          Unattended turns: automation jobs store an explicit tool policy that agent-created jobs cannot
          widen, but heartbeat turns run with the agent's ordinary tools — there is no restricted class for
          them. Outside the decision point: a remote MCP server's own actions; the auto-mode and
          workspace-mode LLM reviewer, a second gate that is not deterministic; and the Policy plugin's
          policy.jsonc, a conformance check rather than a runtime decision. Exec allowlist parsing bypasses
          were fixed in 2026.8.1 (GHSA-ghpx-6xwq-2w4w, GHSA-9f86-pvv5-rxfw), which sets the version floor.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAgentRuntimeEnforcement
          reviewRequired: false
          original:
            - capability: capabilityAgentRuntimeEnforcement
              coverage: native
              mechanism: >-
                tools.exec.mode (deny | allowlist | ask | auto | full) evaluated on the execution host against
                the per-agent allowlist, with approval-backed runs bound to resolved executables and one file
                operand and denied on drift; plugin before_tool_call hooks can block or require approval for
                any tool call. The trusted-operator default resolves to full/off.
              steps:
                - title: Choose an exec mode that enforces policy
                  body:
                    - "`openclaw config set tools.exec.mode allowlist` (silent deny on miss) or `ask` (human
                      prompt on miss); the default for gateway and node hosts is security full with ask off,
                      and `deny` blocks host exec entirely."
                  url: https://docs.openclaw.ai/tools/permission-modes
                - title: Verify the effective policy
                  body:
                    - Run `openclaw approvals get` and `openclaw exec-policy show`; effective policy is the
                      stricter of tools.exec.* and the host approvals file, and askFallback defaults to deny
                      when no UI can answer a prompt.
                  url: https://docs.openclaw.ai/tools/exec-approvals
                - title: Rely on approval binding
                  body:
                    - Approved commands bind cwd, exact argv, resolved executable identity (content hash for
                      writable binaries) and one concrete script or file operand; a change after approval
                      denies the run instead of executing drifted content.
                  url: https://docs.openclaw.ai/tools/exec-approvals
                - title: Add a deterministic plugin gate
                  body:
                    - A plugin before_tool_call handler returning block true (or requiring an allow-once |
                      allow-always | deny decision) is terminal for that tool call and is recorded as an
                      enforced decision in the audit ledger.
                  url: https://docs.openclaw.ai/plugins/hooks/tool-policy
              note: >-
                exec mode and allowlists are deterministic and bound to resolved executables; before_tool_call
                plugin hooks are an integration point. MCP tool calls pass tool policy; a server's own actions
                are outside it.
              verified: 2026-09-10
      - mitigation: D3-MAN
        coverage: native
        mechanism: >-
          gateway.bind "loopback" by default; gateway.auth required by default (token | password |
          trusted-proxy; non-loopback binds require auth and "none" is an explicit opt-in);
          gateway.controlUi.allowedOrigins (defaulting to gateway.publicOrigin) for browser origins; device
          clients sign the server's connect.challenge nonce; gateway.tls with gateway.remote.tlsFingerprint
          pinning for remote clients.
        steps:
          - title: Keep the Gateway on loopback with token auth
            body:
