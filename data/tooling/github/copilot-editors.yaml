        note: >-
          External (EDR): no Copilot editor analyses process behaviour. Integration points an EDR can correlate:
          VS Code runs agents in a dedicated Agent Host process (local utility process, or a standalone server
          started with code agent host) separate from the extension host; Copilot OTel execute_tool spans name
          each tool call (arguments with content capture); and in Agent Host Copilot sessions a policy hook can
          post each preToolUse event to an EDR or SIEM over HTTPS. Other editors run Copilot inside the IDE
          process with no hook.
        verified: "2026-09-25"
