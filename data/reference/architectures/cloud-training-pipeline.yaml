id: archTrainingPipeline
surface: surfaceCloud
rank: 6
title: Fine-tuning and model registry pipeline
abbrev: Training pipeline

summary:
  - >
    A build system whose artifact is a model. Curated data goes in, a tuned checkpoint comes
    out, and everything that is true of a compiler and its supply chain is true here — except
    that the output cannot be diffed and the defects cannot be found by reading it.

description:
  - >
    Treating this as a build pipeline is the whole of the correct framing. It has source inputs,
    a build environment, dependencies, an artifact, a registry and a promotion path, and it
    deserves the controls a software pipeline gets: reproducibility, provenance, signed
    artifacts, and a promotion gate nothing bypasses. Where the analogy breaks is inspection: a
    compiled binary can be decompiled and diffed; a tuned checkpoint cannot be read for
    backdoors in any practical sense. Input control and evaluation are the substitutes for code
    review — what went into the training set and how the result behaves are the only two things
    anyone can actually examine.
  - >
    Poisoning is therefore the primary risk and it is durable. A poisoned example influences
    every inference the model ever makes, survives redeployment, and is not removable without
    retraining — and the dose is small: published results show a near-constant few hundred
    poisoned documents backdoor models regardless of scale, so poisoning needs a foothold, not
    a percentage. A targeted poisoning that only activates on a trigger phrase is invisible to
    accuracy metrics and to any evaluation that does not know what to look for — which is why
    curation is the last place a bad example can be removed rather than baked in, and why
    lineage from every promoted model back to its exact dataset is what makes a discovered
    poisoning scopeable at all.
  - >
    Training data is also a disclosure surface in a way inference data is not. Memorised
    examples can be extracted from the model afterwards, so restricted-access content in the
    corpus becomes part of an artifact served far more widely than the dataset ever was. The two
    access questions to settle early: who may promote a checkpoint to production, and who may
    read the corpus. Both default to a broad platform-team role, and both are higher-privilege
    than they look — which is why promotion is a separated human decision and the signing key
    lives outside the training environment, so a compromised job cannot sign its own output.

distinguishedBy:
  - >
    Against the batch pipeline: same build-system trust properties, different artifact. That
    produces data; this produces a model. The data can be corrected in place; the model cannot.
  - >
    Against self-hosted inference: that consumes artifacts, this produces them. They meet at the
    registry, and the promotion gate between them is where both archetypes' supply-chain
    controls concentrate.

exemplars:
  - name: Managed fine-tuning services
    note: >
      Provider-hosted tuning against a customer dataset, producing a private checkpoint served
      from the same platform. Availability varies sharply by provider and by year.
    asOf: "2026-08"
  - name: Self-operated tuning on accelerator fleets
    note: >
      Adapter or full fine-tuning on the organisation's own hardware, with a registry and
      promotion pipeline built alongside.
    asOf: "2026-08"
  - name: Adapter and preference tuning
    note: >
      Lightweight tuning producing an adapter rather than a full checkpoint. Smaller artifact,
      same supply-chain questions, and an additional one about who may load an adapter at serve
      time.
    asOf: "2026-08"

zones:
  - id: zoneExternal
    owner: external
    note: >
      Where the two inputs come from — the corpora we did not author and the base checkpoint we
      did not train. Drawn on the left because this is an ingest architecture: the outside
      world is its source, not its destination.
  - id: zoneCloud
    owner: cloud
    note: >
      The run itself: the assembled dataset, the GPU pool that consumes it, and the artifact
      store the new weights land in. Nothing else — a fine-tuning run needs remarkably little
      to be honest about.
  - id: zoneGovernance
    owner: governance
    note: >
      Sparse, and deliberately. The dataset's provenance and the output's signature are the two
      things that make a run auditable six months later; the rest of an MLOps platform is a
      different architecture.

blocks:
  - id: upstreamArtifacts
    kind: external
    title: Base model & deps
    cosaiComponent: componentModelStorage
    zone: zoneExternal
    col: 0
    row: 0
    note: >
      The starting checkpoint and the frameworks around it, pulled from a public hub or an
      internal mirror. One of the run's two inputs, and the one whose format decides whether
      loading it is deserialization or execution.
    items:
      - id: baseCheckpoint
        label: Base checkpoint
        icon: model
        note: The weights the run starts from — open, or one of our own earlier outputs.
      - id: frameworks
        label: Frameworks & dependencies
        icon: code
        note: The training stack itself, and an ordinary software supply chain with model-shaped consequences.

  - id: dataOrigins
    kind: external
    title: Training content origins
    cosaiComponent: componentDataSources
    zone: zoneExternal
    col: 0
    row: 1
    note: >
      Scraped, purchased, internal and human-labelled content. The other input, and the one
      that carries the most sensitivity: it is usually proprietary, it is read by every worker
      in the job, and it is the point where poisoning enters.
    items:
      - id: scraped
        label: Scraped & purchased sets
        icon: globe
        note: Content authored by people who did not know it would train a model.
      - id: internal
        label: Internal records
        icon: db
        note: Our own data, and the reason the dataset store is the most sensitive thing on this page.

  - id: corpus
    kind: service
    title: Training corpus
    cosaiComponent: componentTrainingData
    zone: zoneCloud
    col: 1
    row: 1
    note: >
      The assembled, versioned dataset the run actually reads — an object-storage bucket or a
      shared filesystem, mounted by every worker. Access control and provenance here matter
      more than anything else in the drawing.
    items:
      - id: datasetVersions
        label: Dataset versions
        icon: db
        note: The exact bytes a given run consumed, addressable after the fact or the run is unreproducible.

  - id: trainJob
    kind: service
    title: Training job
    cosaiComponent: componentModelTrainingTuning
    zone: zoneCloud
    col: 2
    row: 1
    note: >
      The GPU pool and the framework running on it. The technique decides the shape more than
      anything else does: a quantized low-rank run fits on a single node, while a full
      fine-tune needs sharded optimizer state across nodes and a high-bandwidth interconnect.
      Everything the job holds — the dataset, the base weights, the credentials it was handed —
      is in one blast radius for the hours it runs.
    items:
      - id: gpuPool
        label: GPU compute
        icon: gear
        note: One node or many, gang-scheduled; the interconnect is what decides whether multi-node is viable.
      - id: tuningRun
        label: Tuning run
        icon: gear
        note: Full fine-tune, or the low-rank techniques that collapse the same job onto far less hardware.
      - id: reproRecord
        label: Reproducibility record
        icon: doc
        note: Which data, which base, which code, which seed — recorded during the run, not reconstructed later.

  - id: storage
    kind: external
    title: Storage
    cosaiComponent: componentModelStorage
    zone: zoneCloud
    col: 3
    row: 1
    note: >
      Where the output lands. For a low-rank run that is an adapter directory of megabytes
      rather than a model; for a full fine-tune it is a complete checkpoint. Either way this is
      the artifact the serving tier will later load, which is why it is signed here and
      verified there.
    items:
      - id: modelFiles
        label: Model files
        icon: db
        note: The new weights, or the adapter that layers over the base.
      - id: signedReleases
        label: Signed releases
        icon: shield
        note: Signed at the moment they land, so the tier that loads them has something to check.

  - id: govSupplyChain
    kind: governance
    title: Supply-chain assurance
    icon: db
    zone: zoneGovernance
    col: 1
    row: 3
    capabilities: [capabilityDataProvenance, capabilityAiBom, capabilityModelScanning]
    note: >
      What went in and what came out: the provenance of every example, the format check on the
      base checkpoint before a loader opens it, and the record tying an artifact to the run
      that produced it.

  - id: govPolicy
    kind: governance
    title: Policy & authorization
    icon: scale
    zone: zoneGovernance
    col: 2
    row: 3
    capabilities: [capabilityDataAccessGovernance, capabilityHitlControls]
    note: >
      Who may read the dataset and who may authorise a run against it. The dataset is the
      sensitive asset here, not the model.

  - id: govSecrets
    kind: governance
    title: Secrets & key management
    icon: key
    zone: zoneGovernance
    col: 3
    row: 3
    capabilities: [capabilityModelWeightProtection, capabilityEncryptionKeyManagement]
    note: Signing keys for the output, and the credentials the job holds for its whole run.

  - id: govObservability
    kind: governance
    title: Observability & response
    icon: eye
    zone: zoneGovernance
    col: 4
    row: 3
    capabilities: [capabilityAuditLogging, capabilityModelDocumentation]
    note: >
      The lineage record and the documentation that travel with an artifact — the only reason a
      question asked long after the run has an answer.

edges:
  - from: dataOrigins
    to: corpus
    path: external
    label: content in
    note: >
      Material from outside, assembled into the versioned set the run will read. This is the
      last point at which a poisoned example can be removed rather than learned.
  - from: upstreamArtifacts
    to: trainJob
    path: external
    label: base weights in
    note: >
      The starting checkpoint and its frameworks, loaded by the job. For several formats
      opening the file is itself the execution event, which is why the format check belongs
      before this hop and not after it.
  - from: corpus
    to: trainJob
    path: primary
    bidir: true
    label: dataset read
    note: Every worker in the job reads the same set, which is what makes its access control load-bearing.
  - from: trainJob
    to: storage
    path: primary
    label: new weights out
    note: >
      The output artifact — a full checkpoint, or an adapter of a few megabytes. Signed as it
      lands, because the tier that loads it later has no other way to know what it is.

pins:
  risks:
    - risk: riskDataPoisoning
      at: dataOrigins->corpus
      note: >
        A poisoned example entering a set nobody can later re-inspect. The injection point of
        the whole architecture, and the reason provenance is pinned rather than assumed.
    - risk: riskUnauthorizedTrainingData
      at: corpus
      note: Content that was never licensed, consented to, or cleared for this use, learned irreversibly.
    - risk: riskExcessiveDataHandling
      at: corpus
      note: >
        The most sensitive artifact in the drawing, mounted by every worker in the job. Its
        access control matters more than anything else on this page.
    - risk: riskModelSourceTampering
      at: upstreamArtifacts->trainJob
      note: >
        A base checkpoint whose format executes on load, or a framework dependency that does.
        Publisher identity says nothing about what the artifact does when opened.
    - risk: riskInsecureIntegratedComponent
      at: trainJob
      note: >
        The job holds the dataset, the base weights and its own credentials at once, for hours.
        Whatever compromises the training container gets all three.
    - risk: riskModelExfiltration
      at: storage
      note: >
        The output is the expensive thing and it is small — an adapter is megabytes. Egress from
        the artifact store deserves the attention a model-sized file would not attract.

  capabilities:
    - capability: capabilityDataSanitization
      at: dataOrigins->corpus
      note: >
        Quality, safety and sensitive-content filtering at ingest — the last point at which a
        bad example is removable rather than learned. It is a control on this hop rather than a
        stage of its own, because what a pipeline calls "curation" is filtering plus provenance
        and nothing a reader needs drawn as a box.
    - capability: capabilityDataProvenance
      at: dataOrigins->corpus
      note: Where every example came from, recorded at ingest, because it cannot be reconstructed after training.
    - capability: capabilityDataAccessGovernance
      at: corpus
      note: Who may read the set, enforced at the store rather than trusted to the job.
    - capability: capabilityModelScanning
      at: upstreamArtifacts->trainJob
      note: Format and content inspection gating the load, not following it.
    - capability: capabilityHitlControls
      at: corpus->trainJob
      note: A person authorises a run against a named dataset version; runs do not start themselves.
    - capability: capabilityModelWeightProtection
      at: trainJob->storage
      note: >
        Sign the artifact as it lands, with the OpenSSF Model Signing spec and a Sigstore
        bundle, so the serving tier's load-time verification has something to verify.
    - capability: capabilityEncryptionKeyManagement
      at: storage
      note: Our keys over the output, and over the checkpoints the run wrote on the way.
    - capability: capabilityAiBom
      at: govSupplyChain
      note: The record tying this artifact to this data, this base and this run.
    - capability: capabilityAuditLogging
      at: govObservability
      note: Who ran what against which data, retained long enough to answer a question nobody has asked yet.
    - capability: capabilityModelDocumentation
      at: govObservability
      note: What the artifact is and what it was trained on, travelling with it rather than living in a wiki.

walkthrough:
  title: A tuning run produces an adapter
  moves: >-
    A versioned dataset and a base checkpoint through GPU compute, into a signed artifact.
  steps:
    - follow: dataOrigins->corpus
      note: Content is assembled into a named, versioned set.
    - follow: upstreamArtifacts->trainJob
      note: The base checkpoint is scanned, then loaded by the job.
    - follow: corpus->trainJob
      note: Every worker reads the same set, on a grant that is checked at the store.
    - follow: trainJob->storage
      note: The output lands and is signed in the same step, so it is never unsigned at rest.

scenarios:
  - title: A poisoning is discovered months later
    steps:
      - follow: dataOrigins->corpus
        note: The provenance record maps the poisoned examples back to the batch they arrived in.
      - follow: corpus->trainJob
        note: And forward to every run that read that dataset version — which is why versioning is not bookkeeping.
      - follow: trainJob->storage
        note: The artifacts those runs produced are identified by lineage and withdrawn.

deviations:
  - subject: Upstream artifact scanning is absorbed by the training job's intake
    reason: >
      Base checkpoints and dependencies are scanned where the job ingests them rather than at
      a drawn scanning stage — the scanning chip on that edge marks the duty, and drawing a
      stage would duplicate the promotion gate's scanner for a second artifact class.

sources:
  - title: "OWASP Top 10 for LLM Applications 2026 — LLM05 data and model poisoning, LLM04 supply chain"
    url: https://genai.owasp.org/resource/owasp-genai-llm-top-10-2026/
  - title: "Anthropic — a small, near-constant number of samples poisons models of any size"
    url: https://www.anthropic.com/research/small-samples-poison
  - title: "OpenSSF Model Signing — standardised signing and provenance for model artifacts"
    url: https://openssf.org/projects/model-signing/
  - title: "MITRE ATLAS — poisoning, model artifact and supply chain techniques"
    url: https://atlas.mitre.org/
  - title: "NIST SP 800-218A — secure software development practices for generative AI"
    url: https://csrc.nist.gov/pubs/sp/800/218/a/final
  - title: "CISA and NSA — AI data security"
    url: https://www.cisa.gov/resources-tools/resources/ai-data-security
  - title: "Microsoft Azure Well-Architected — training workload architecture pattern"
    url: https://learn.microsoft.com/en-us/azure/well-architected/ai/architecture-pattern
