  - id: zenity-resilience-by-design
    kind: research
    date: '2026-11-06'
    title: 'Zenity: design agents to fail safely with bounded authority, circuit breakers and replayable
      traces'
    summary: 'Zenity''s guidance sets four planes: bounded authority (own identity, short-lived credentials,
      a policy engine on each action, readers of untrusted content kept apart from actors), circuit breakers
      by action reversibility with fail-closed defaults, tamper-evident decision traces agents cannot
      reach, and graceful degradation to deterministic workflows. It adds a design-review checklist.

      '
    why: A pre-deployment checklist that ties each control to prompt injection, tool misuse and cascades.
    vendor: Zenity
    controls: [cap-agent-action-policy-enforcement, AML.M0029, cap-agent-tracing, cap-agent-kill-switch]
    patterns: [archAgentWorkflow, archActionAgent]
    sources:
