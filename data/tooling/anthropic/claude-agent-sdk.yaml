# Claude Agent SDK — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
vendor: anthropic
family: Claude Agent SDK
tools:
  - id: toolClaudeAgentSdk
    name: Claude Agent SDK
    surfaceClasses:
      - managedRuntime
    variants:
      - name: "@anthropic-ai/claude-agent-sdk (TypeScript)"
        class: managedRuntime
        url: https://code.claude.com/docs/en/agent-sdk/quickstart
      - name: claude-agent-sdk (Python)
        class: managedRuntime
        url: https://code.claude.com/docs/en/agent-sdk/quickstart
      - name: Headless CLI (claude -p) as a subprocess from other languages
        class: managedRuntime
        url: https://code.claude.com/docs/en/agent-sdk/overview
    architecture: archAgentWorkflow
    status: ga
    asOf: "2026-09"
    summary:
      - >-
        A library (Python and TypeScript) that runs the Claude Code agent loop inside the customer's own
        process: each query() spawns a bundled claude CLI subprocess that owns a shell, a working directory
        and JSONL transcripts on local disk, and calls the Anthropic API (or Bedrock, Vertex, Foundry, Claude
        Platform on AWS) with an API key from the host's environment. Nothing is hosted by Anthropic;
        sandboxing, egress, credential injection, multi-tenant isolation and session persistence are the
        deployer's responsibility, and the docs describe container, gVisor and Firecracker patterns with a
        credential-injecting egress proxy.
      - >-
        Its controls are Claude Code's, reachable as options: permissionMode, allowedTools / disallowedTools,
        a canUseTool callback, programmatic PreToolUse hooks that run before every other check, settingSources
        to stop reading filesystem settings, mcpServers, maxTurns, and OpenTelemetry export inherited from the
        environment. Managed policy on the host (MDM, managed-settings.json) and server-managed settings
        fetched with an organisation credential still apply and cannot be disabled from the SDK. Anthropic
        does not allow third parties to offer claude.ai login through SDK-built products.
    facts:
      - label: Plans
        value: >-
          Anthropic API key (Console), Bedrock (CLAUDE_CODE_USE_BEDROCK), Claude Platform on AWS, Google
          Cloud's Agent Platform (CLAUDE_CODE_USE_VERTEX) or Microsoft Foundry (CLAUDE_CODE_USE_FOUNDRY);
          governed by Anthropic's Commercial Terms.
        url: https://code.claude.com/docs/en/agent-sdk/quickstart
      - label: Inference & routing
        value: >-
          Direct to api.anthropic.com or the provider's regional endpoint; ANTHROPIC_BASE_URL or HTTPS_PROXY
          route model calls through a proxy that can inject the key outside the container.
        url: https://code.claude.com/docs/en/agent-sdk/secure-deployment
      - label: Data leaving the device
        value: >-
          Prompts, tool results and file contents to the model provider; OTLP telemetry only to the collector
          you configure (content redacted unless OTEL_LOG_* opt-ins are set); transcripts on local disk or a
          SessionStore you provide.
        url: https://code.claude.com/docs/en/agent-sdk/observability
      - label: Retention & training
        value: >-
          API commercial terms: no training, 30-day retention by default, ZDR available for API organisations;
          local transcripts under ~/.claude/projects/ or CLAUDE_CONFIG_DIR until you delete them.
        url: https://platform.claude.com/docs/en/manage-claude/api-and-data-retention
      - label: Docs index
        value: >-
          code.claude.com/docs/en/agent-sdk (overview, permissions, hooks, hosting, secure deployment)
        url: https://code.claude.com/docs/en/agent-sdk/overview
    riskNotes:
      - risk: riskPromptInjection
        note: >-
          The SDK's own guide opens with prompt injection as the threat model and recommends defence in depth:
          bare-name deny rules, PreToolUse hooks, read-only mounts, --network none containers and a
          credential-injecting proxy.
      - risk: riskAgentDelegationChainOpacity
        note: >-
          Subagents inherit the parent's permission mode (never bypassPermissions unless the parent has it)
          and hooks fire inside them with agent_id / agent_type; tracing nests subagent spans under the parent
          tool span only when CLAUDE_CODE_ENHANCED_TELEMETRY_BETA is on.
      - risk: riskRunawayAgentToolLoops
        note: >-
          There is no top-level session timeout; maxTurns is the only bound, and a stall watchdog
          (CLAUDE_ASYNC_AGENT_STALL_TIMEOUT_MS) is not a deadline. Cost tracking is per-session in the result
          stream.
      - risk: riskSensitiveDataDisclosure
        note: >-
          Default query() options read user, project and local settings, CLAUDE.md and auto memory from the
          host filesystem, and load claude.ai connectors when a claude.ai login is present; multi-tenant
          deployments must set settingSources [] and per-tenant CLAUDE_CONFIG_DIR / cwd.
      - risk: riskToolSourceProvenance
        note: >-
          MCP servers are whatever the deployer configures; .mcp.json in the working directory is loaded when
          the project setting source is on. Managed host policy (allowedMcpServers,
          strictPluginOnlyCustomization) still applies to SDK sessions.
    controls:
      - mitigation: AML.M0031
        coverage: partial
        verified: "2026-09-10"
        mechanism: >-
          settingSources [] plus CLAUDE_CODE_DISABLE_AUTO_MEMORY=1 and per-tenant CLAUDE_CONFIG_DIR and cwd;
          SessionStore adapter for transcripts; no memory validation or rollback
        steps:
          - title: Isolate tenants' memory and settings
            body:
              - Pass settingSources [] (Python setting_sources=[]), set CLAUDE_CODE_DISABLE_AUTO_MEMORY=1 and
                a per-tenant CLAUDE_CONFIG_DIR in env, and a per-tenant cwd on every query().
            url: https://code.claude.com/docs/en/agent-sdk/hosting
          - title: Control where transcripts persist
            body:
              - Configure a SessionStore adapter (S3, Redis, Postgres) and alert on mirror_error messages; do
                not share a store across tenants.
            url: https://code.claude.com/docs/en/agent-sdk/hosting
        evidence: []
        note: >-
          Isolation only: per-tenant directories and disabled auto-memory bound where memory lives. Nothing
          validates what is written, detects poisoning or restores a known-good state — recovery is the
          SessionStore's backups.
