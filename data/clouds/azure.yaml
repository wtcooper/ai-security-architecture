          - at: gateway->service
            text: "The MCP extension serves the server at /runtime/webhooks/mcp, not at a path your code chooses, and by default asks for the mcp_extension system key. API Management must be pointed at that path and send the key, or the level is set to Anonymous. Turning on built-in MCP authentication in the portal (preview) switches the key requirement off automatically."
            url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-mcp
          - at: service
            text: "Hosting a server built with an MCP SDK is in public preview. It supports only stateless servers on the Streamable HTTP transport, only the Flex Consumption plan, and needs the feature flag AzureWebJobsFeatureFlags=EnableMcpCustomHandlerPreview. Microsoft's page says to use the MCP extension when the server must keep state."
            url: https://learn.microsoft.com/en-us/azure/azure-functions/self-hosted-mcp-servers
          - at: toolDefs->service
            text: "With the MCP extension there is no definitions file for the server to load. Each tool's name, description and properties are written in the function's trigger declaration, so the reviewed and pinned artefact is the deployment package itself. Pin the package by hash and review trigger metadata in code review."
            url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-mcp-tool-trigger
          - at: service
            text: "Instances scale to zero, so the first call after a quiet period waits for a cold start unless always-ready instances are set (the default is zero). Microsoft also states that an HTTP-triggered function has at most 230 seconds to respond, whatever the function timeout, so plan long tool calls within that limit."
            url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-scale
          - at: service->orgData
            text: "A function app has a public endpoint and, without virtual network integration, calls out directly to the internet. Both walls are choices: access restrictions or a private endpoint inbound, and an integration subnet routed to a firewall outbound. The app also needs its host storage account reachable from that subnet."
            url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-networking-options
