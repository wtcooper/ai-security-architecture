# Microsoft Agent Framework: one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# Exclusions: Microsoft Foundry Agent Service (prompt agents, Foundry hosted agents and their Entra agent identity,
# Foundry guardrails, Toolbox, Memory, the Foundry evaluation service and tracing portal) is catalogued separately as
# toolFoundryAgentService; agents built with this framework can be hosted there, and only the framework's own
# packages are rated here. Semantic Kernel and AutoGen (the predecessors) are not assessed. The GitHub Copilot,
# Claude and Copilot Studio agent-service integrations run other vendors' runtimes and are not rated here. DevUI is
# a local development sample (recorded as an item, not a control). Go (agent-framework-go v0.3.1) is public preview;
# rows describe Python and .NET unless they name Go.
# 2026-11-21: onboarded. About 75 pages under learn.microsoft.com/en-us/agent-framework read as markdown (Accept:
# text/markdown), all 200, from the tree in /en-us/agent-framework/toc.json. The Python API reference page for
# FunctionInvocationConfiguration answered 200 but is dated 2025-11-18 (pre-GA), so no default is taken from it.
# The FAQ (2026-10-23) says only .NET and Python are supported; the overview (2026-10-23) lists Go in public preview.
# github.com refused automated reads from this environment (403 to curl, 404 to the fetch tool for the repository,
# its security tab and raw.githubusercontent.com), and the GitHub API is not reachable from this session, so
# SECURITY.md, release notes and repository advisories were not read; release dates come from the PyPI JSON API, the
# NuGet registration API, proxy.golang.org and devblogs.microsoft.com/agent-framework (1.0 post, 200). Advisories
# were searched in the OSV.dev API for 34 PyPI, NuGet and Go package names: only agent-framework (the PyPI
# meta-package) has entries (MAL-2026-20101, PYSEC-2026-4388); GHSA-764m-3ppc-5m73 was read with the fetch tool.
# A Check Point checkpoint-deserialisation finding (Black Hat USA, August 2026) has no CVE or GHSA and is recorded as
# a risk note from secondary reporting. Downloads: pypistats.org API, agent-framework-core (every install of the
# meta-package or an integration pulls it); the meta-package itself had 192,153 last month.
# 2026-11-21 (new pins): AML.M0037 (partial) and AML.M0012 (partial) rows after the multi-agent pattern pinned them,
# from learn.microsoft.com agent-framework/workflows/checkpoints (200).
vendor: microsoft
family: Microsoft Agent Framework
tools:
  - id: toolMicrosoftAgentFramework
    name: Microsoft Agent Framework
    surfaceClasses:
      - sdkFramework
    variants:
      - name: "agent-framework-core and agent-framework (Python: core plus integration packages)"
        class: sdkFramework
        url: https://pypi.org/project/agent-framework-core/
        note: >-
          GA since 1.0 (2026-04-02); 1.26.0 is current. Core, OpenAI, Foundry, AG-UI, Declarative, GitHub Copilot and
          Orchestrations are released packages, as are the Durable Task and Azure Functions packages since 1.0.0
          (2026-11-09); A2A, Redis, Purview, tools, Hyperlight, Monty and DevUI packages are beta.
      - name: "Microsoft.Agents.AI and Microsoft.Agents.AI.Workflows (.NET)"
        class: sdkFramework
        url: https://www.nuget.org/packages/Microsoft.Agents.AI
        note: >-
          GA since 1.0; 1.28.0 (2026-11-06) is current. The A2A, self-hosting and shell packages are prerelease.
      - name: "agent-framework-go (Go, public preview)"
        class: sdkFramework
        url: https://pkg.go.dev/github.com/microsoft/agent-framework-go
        note: >-
          v0.3.1 (2026-11-13); declarative agents, CodeAct and functional workflows are not implemented in Go.
      - name: "Durable Extension (agent-framework-durabletask, agent-framework-azurefunctions; Microsoft.Agents.AI.DurableTask)"
        class: sdkFramework
        url: https://learn.microsoft.com/en-us/agent-framework/hosting/durable-extension
        note: >-
          Released packages since 2026-11-09 (agent-framework-durabletask and agent-framework-azurefunctions 1.0.0,
          Microsoft.Agents.AI.DurableTask 1.16.0), though the docs page (2026-08-31) still installs them with
          prerelease flags. They run agents and workflows on Durable Task infrastructure, in Azure Functions or on
          your own compute, with persisted sessions, checkpointed orchestrations and session time to live.
    architecture: archAgentWorkflow
    fills: [harness, orchestration, subagents]
    builder:
      kind: providerSdk
      what: "Microsoft's open-source successor to Semantic Kernel and AutoGen: agents, graph workflows and multi-agent orchestration, with middleware, MCP and A2A."
      languages: ["Python", "C#", "Go"]
      usage:
        downloads: 1678683
        registry: PyPI
        package: agent-framework-core
        asOf: "2026-11"
        url: https://pypistats.org/packages/agent-framework-core
      also:
        - architecture: archChatAgent
          fills: [agent]
          url: https://learn.microsoft.com/en-us/agent-framework/integrations/by-component/ui/ag-ui/human-in-the-loop
        - architecture: archActionAgent
          fills: [planner]
          url: https://learn.microsoft.com/en-us/agent-framework/hosting/durable-extension
        - architecture: archAgentFederation
          fills: [harness]
          url: https://learn.microsoft.com/en-us/agent-framework/hosting/self-hosting/a2a/server
    status: ga
    asOf: "2026-11"
    summary:
      - >-
        Microsoft's open-source (MIT) SDK and the direct successor to Semantic Kernel and AutoGen, in Python and .NET
        (both at 1.0, the production-ready release with stable APIs, since April 2026) with a Go library in public preview. It runs the agent
        loop inside the customer's own process: agents over chat clients for Microsoft Foundry, Azure OpenAI, OpenAI,
        Anthropic, Bedrock, Gemini, Ollama and others; function tools, local and hosted MCP tools and agents called as
        tools; agent, chat and function middleware; context providers for memory and retrieval; and graph-based
        workflows with Sequential, Concurrent, Handoff, Group Chat and Magentic orchestrations, request-and-response
        pauses for people, and a checkpoint at every superstep. Tools run in the host process unless the deployer
        routes them to DockerShellTool, a Hyperlight microVM or a provider-hosted code interpreter.
      - >-
        State lives where the application puts it: an AgentSession it serialises, history providers (in memory by
        default; Redis, Cosmos DB), checkpoint storage (in memory, file, Cosmos DB; pickled through a restricted
        unpickler in Python) or the Durable Extension on Durable Task infrastructure. What leaves the process is the
        model call, MCP and A2A traffic, OpenTelemetry only once an exporter is configured (no prompt or tool content
        unless ENABLE_SENSITIVE_DATA is set), and a User-Agent naming the framework version, with a feature-usage
        token on Foundry and Azure OpenAI paths. It serves and calls A2A through beta (Python) and prerelease (.NET)
        packages. Agents built with it can be hosted in Microsoft Foundry Agent Service, recorded as
        toolFoundryAgentService.
      - >-
        Nearly every control is code the deployer writes against documented options: approval_mode or
        ApprovalRequiredAIFunction (off by default), function-invocation limits (call count and wall clock unlimited
        by default), middleware, MCP allowed_tools and approval maps, orchestration round caps. Python adds
        experimental Agent Hooks (a fail-closed interception contract) and FIDES (label-based information-flow
        policy), and a beta Purview DLP middleware. On by default: approvals bound to the issuing session, restricted
        checkpoint deserialisation, 30-second MCP timeouts with bounded discovery, and instrumentation without
        content. On 2026-11-17 two unauthorised PyPI releases of the agent-framework meta-package (1.26.1, 1.26.2)
        carried a credential stealer; they were removed, and 1.26.0 is clean.
    facts:
      - label: Plans
        value: >-
          Free, MIT-licensed packages (pip install agent-framework or agent-framework-core; NuGet Microsoft.Agents.AI;
          go get github.com/microsoft/agent-framework-go). Model calls bill to the chosen provider; the Purview
          middleware needs Microsoft Purview with Microsoft 365 E5 and pay-as-you-go billing.
        url: https://pypi.org/project/agent-framework-core/
      - label: Inference & routing
        value: >-
          Chat clients for Microsoft Foundry, Azure OpenAI, OpenAI, Anthropic and Ollama among others; Azure routing
          prefers credential= (an Azure TokenCredential) over api_key, other keys come from environment variables
          such as OPENAI_API_KEY, and .env files are not loaded automatically. The docs call DefaultAzureCredential
          convenient for development and suggest a specific credential such as ManagedIdentityCredential in production.
        url: https://learn.microsoft.com/en-us/agent-framework/integrations/by-component/model-providers/openai
      - label: Data leaving the device
        value: >-
          Instructions, history and tool results to the model provider; tool calls to MCP servers (with W3C trace
          context in client-opened MCP calls) and messages to A2A peers; history, sessions and checkpoints wherever the
          chosen store lives; telemetry only to the exporter you configure, content excluded unless
          ENABLE_SENSITIVE_DATA; the framework version in the User-Agent and, on Foundry and Azure OpenAI paths, a
          feature-usage token (AGENT_FRAMEWORK_FEATURE_MASK_DISABLED or AGENT_FRAMEWORK_USER_AGENT_DISABLED turn them
          off).
        url: https://learn.microsoft.com/en-us/agent-framework/agents/observability
      - label: Retention & training
        value: >-
          The framework keeps nothing beyond the history provider, session store and checkpoint storage the
          application configures. Service-managed conversations (OpenAI Responses or Conversations IDs, Foundry) are
          kept by that service under its own terms, which also govern training. Durable Extension sessions persist
          until a time to live or retention policy removes them; Python keeps all history by default.
        url: https://learn.microsoft.com/en-us/agent-framework/concepts/agents/conversations/session
      - label: Docs index
        value: >-
          learn.microsoft.com/agent-framework (Python, .NET and Go pivots), with API references for Microsoft.Agents.AI
          and agent-framework-core, and a Python upgrade log of significant changes per release.
        url: https://learn.microsoft.com/en-us/agent-framework/overview/
      - label: Release status
        value: >-
          Version 1.0 for .NET and Python announced 2026-04-03 as the production-ready release with long-term
          support; DevUI, Skills, AG-UI, the Agent Harness and the Foundry integrations were then preview. Current:
          Python 1.26.0, .NET 1.28.0, Go v0.3.1 (public preview). Agent Hooks, FIDES, looping, background agents and
          file access are experimental in Python.
        url: https://devblogs.microsoft.com/agent-framework/microsoft-agent-framework-version-1-0/
      - label: Security model
        value: >-
          Shared responsibility: the framework doesn't manage authentication, encryption or connection details for
          external services, imposes no input, output or rate limits, and treats user, assistant and tool messages
          as untrusted.
        url: https://learn.microsoft.com/en-us/agent-framework/concepts/agents/safety
      - label: Supply-chain incident
        value: >-
          agent-framework 1.26.1 and 1.26.2 were published to PyPI without authorisation on 2026-11-17, each adding a
          .pth hook that ran a credential stealer at every Python start; PyPI removed both with Microsoft. Version
          1.26.0 and agent-framework-core are not listed as affected.
        url: https://osv.dev/vulnerability/PYSEC-2026-4388
    items:
      - title: Install from a pinned, hashed lockfile
        body:
          - >-
            The malicious agent-framework 1.26.1 and 1.26.2 wheels ran without an import, harvesting environment
            secrets, credential files, Azure managed-identity tokens and CI OIDC tokens. Pin agent-framework-core (and
            the meta-package, if used) by version and hash at the firm's package mirror, search lockfiles and CI logs
            for the two versions, and rotate every credential reachable from a host that installed either.
        links:
          - title: PYSEC-2026-4388 on OSV
            url: https://osv.dev/vulnerability/PYSEC-2026-4388
          - title: GHSA-764m-3ppc-5m73 (malware advisory)
            url: https://github.com/advisories/GHSA-764m-3ppc-5m73
      - title: Keep DevUI on the developer's machine
        body:
          - >-
            DevUI is a sample for local development and not for production. Bearer-token authentication is on by
            default, a non-loopback bind needs DEVUI_AUTH_TOKEN or --auth-token, and --no-auth is accepted only on
            loopback; developer mode exposes hot reload and deployment APIs, so use user mode if it must be shared.
        links:
          - title: DevUI security and deployment
            url: https://learn.microsoft.com/en-us/agent-framework/integrations/by-component/ui/devui/security
    riskNotes:
      - risk: riskPromptInjection
        note: >-
          The safety page treats user, assistant and tool messages as untrusted and warns that context and history
          providers can inject messages with any role, system included. FIDES is the only deterministic defence and is
          experimental, Python-only and unsupported with Monty and Hyperlight CodeAct; an AG-UI server exposed
          directly to browsers accepts client-supplied messages, tools and state.
      - risk: riskOrchestratorRouteHijacking
        note: >-
          A handoff is a tool call the model chooses, every participant stays connected in a mesh whatever the
          handoff rules say, and autonomous mode answers an agent that doesn't hand off with a canned prompt for up to
          50 turns by default. The Magentic supervisor's plan review is off by default in Python and on in .NET.
      - risk: riskAgentDelegationChainOpacity
        note: >-
          An agent called as a tool returns only its final text to the outer agent; in Python its approvals can't be
          resumed through the parent and fail closed, and background agents return text without passing approvals
          back. Tracing is the documented way to see what the inner agent did.
      - risk: riskRogueActions
        note: >-
          Every tool runs without approval unless approval_mode is set (default never_require); harness standing
          approvals persist in the session and match a replacement tool of the same name; LocalShellTool runs on the
          host and isn't a sandbox even with approval.
      - risk: riskRunawayAgentToolLoops
        note: >-
          max_function_calls and max_duration_seconds are unlimited by default and checked only after each tool
          batch; looping (10 iterations) and autonomous handoff (50 turns) bound loops by default, and no token or
          cost ceiling ships.
      - risk: riskSensitiveDataDisclosure
        note: >-
          Checkpoints store the full conversation and the serialised agent session, pickled in Python; enabling
          sensitive data adds prompts, tool arguments and results to spans; service-side conversation IDs are scoped to
          the backing key or project, not the end user, so a multi-user host must map and check them.
      - risk: riskInsecureIntegratedComponent
        note: >-
          The framework itself was the compromised component on 2026-11-17 (agent-framework 1.26.1 and 1.26.2 on
          PyPI). Check Point separately reported a checkpoint deserialisation flaw reachable through prompt injection
          at Black Hat USA 2026, found before GA and fixed, with no CVE issued; checkpoint loading now uses a
          restricted unpickler.
      - risk: riskToolSourceProvenance
        note: >-
          MCP tool definitions come from the server when it connects; FIDES treats server annotations and result
          labels as restriction-only unless trust_server_ifc is set, and a configured name that matches several
          remote tools fails closed, but harness standing approvals match by tool name.
    controls:
      - mitigation: AML.M0031
        coverage: partial
        mechanism: >-
          Checkpoint storage (in memory, file, Cosmos DB) with a restricted unpickler and allowed_checkpoint_types;
          history providers scoped by application, tenant, agent and session (Redis) or partitioned by session
          (Cosmos DB); session stores keyed to an authenticated isolation key (.NET) or AG-UI authorization scope;
          as_tool(propagate_session=False) by default; Durable Extension session time to live
        steps:
          - title: Keep checkpoints private and narrow
            body:
              - >-
                Use CosmosCheckpointStorage with managed identity on a container scoped to the workflow service, list
                only your own state classes in allowed_checkpoint_types, and never load a checkpoint from an untrusted
                source.
            url: https://learn.microsoft.com/en-us/agent-framework/workflows/checkpoints
          - title: Scope history to the tenant
            body:
              - >-
                Set application_id, tenant_id and agent_id on RedisHistoryProvider from the authenticated identity,
                never from model output; scoped keys are the default.
            url: https://learn.microsoft.com/en-us/agent-framework/integrations/by-component/context-providers/redis
          - title: Bind sessions to the caller
            body:
              - >-
                In .NET hosts register UseClaimsBasedAgentIsolation and keep isolation on the session store, so a
                continuation ID resolves only to sessions saved under the caller's claim.
            url: https://learn.microsoft.com/en-us/agent-framework/hosting/self-hosting/
        note: >-
          Partial on the rule applied to the Claude Agent SDK on this drawing (per-session and per-tenant scoping and
          deletion are configuration; nothing validates what a step writes). Context and history providers can inject
          messages with any role, and the safety page says restoring a session from an untrusted store is accepting
          untrusted input. A checkpoint holds every executor's state, pending messages, the full conversation and the
          serialised agent session; the restricted unpickler limits Python deserialisation to allowed types but the
          docs say it doesn't make tampered data safe. Durable sessions persist until a time to live or retention
          policy removes them. Agents called as tools get their own session unless propagate_session=True, and
          harness standing approvals live in session state.
        verified: "2026-11-21"
      - mitigation: cap-staged-rollout-gate
        coverage: partial
        mechanism: >-
          evaluate_agent() and evaluate_workflow() with LocalEvaluator checks (keyword_check, tool_called_check,
          tool_call_args_match) and FoundryEvals; raise_for_status() raises EvalNotPassedError (.NET AssertAllPassed);
          no staged rollout, traffic split or rollback
        steps:
          - title: Gate releases on an evaluation run
            body:
              - >-
                In CI, run evaluate_agent() or evaluate_workflow() over a protected test set with tool_call_args_match
                and your own @evaluator checks, and fail the build when raise_for_status() raises EvalNotPassedError.
            url: https://learn.microsoft.com/en-us/agent-framework/agents/evaluation
        note: >-
          Partial: the Claude Agent SDK and OpenAI Agents SDK are rated external on this control because they ship no
          evaluation harness; Agent Framework ships one whose pass or fail result a pipeline can gate on. The release
          decision, the protected test set, progressive rollout and rollback are the pipeline's and the hosting
          platform's. FoundryEvals sends items to a Foundry project and uses a model as the judge.
        verified: "2026-11-21"
      - mitigation: cap-agent-tracing
        coverage: native
        mechanism: >-
          OpenTelemetry instrumentation on by default (ENABLE_INSTRUMENTATION): invoke_agent, chat and execute_tool
          spans with GenAI attributes; workflow.build, invoke_workflow or workflow.session, executor.process,
          edge_group.process and message.send spans; duration and token metrics; configure_otel_providers() or
          UseOpenTelemetry route them to the customer's collector; trace context propagated to client-opened MCP
          servers
        steps:
          - title: Export to the firm's collector
            body:
              - >-
                Call configure_otel_providers() with OTEL_EXPORTER_OTLP_ENDPOINT and OTEL_SERVICE_NAME set (Python), or
                add UseOpenTelemetry to the agent and chat client with a matching AddSource (.NET); no exporter is
                installed by default.
            url: https://learn.microsoft.com/en-us/agent-framework/agents/observability
          - title: Keep content out unless approved
            body:
              - >-
                Leave ENABLE_SENSITIVE_DATA (EnableSensitiveData in .NET) false unless the trace store is approved for
                prompts, tool arguments and results.
            url: https://learn.microsoft.com/en-us/agent-framework/agents/observability
          - title: Trace every workflow hop
            body:
              - >-
                Use the executor.process and message.send spans to follow each subagent step; executor inputs and
                outputs are recorded only when sensitive data is on.
            url: https://learn.microsoft.com/en-us/agent-framework/workflows/observability
        note: >-
          Native on the rule applied to the Claude Agent SDK and OpenAI Agents SDK: every agent run, model call,
          framework-executed tool call and workflow step is a span, and the customer's own exporter receives them.
          Limits: nothing leaves until an exporter is configured; provider-hosted tools and hosted MCP calls appear only
          inside the model response and receive no trace context; identity is whatever resource attributes the
          application adds. Emission is not tamper resistance; retention and integrity are the collector's.
        verified: "2026-11-21"
      - mitigation: D3-APA
        coverage: partial
        mechanism: >-
          AG-UI endpoints must declare authorization_scope_resolver or single_user (Python, since 1.23); .NET session
          stores wrapped in IsolationKeyScopedAgentSessionStore through UseClaimsBasedAgentIsolation; Durable Functions
          endpoints behind function keys; function_invocation_kwargs carrying the caller's grant to tools and
          middleware; authentication itself is the host's
        steps:
          - title: Scope AG-UI state to the caller
            body:
              - >-
                Pass authorization_scope_resolver to add_agent_framework_fastapi_endpoint, returning the authenticated
                tenant and user, and never set single_user=True on a shared endpoint.
            url: https://learn.microsoft.com/en-us/agent-framework/support/upgrade/migrate-to-mcp-2-x
          - title: Isolate .NET sessions by claim
            body:
              - >-
                Register UseClaimsBasedAgentIsolation (prerelease Microsoft.Agents.AI.Hosting.AspNetCore) after
                configuring ASP.NET Core authentication, and keep isolation on the session store.
            url: https://learn.microsoft.com/en-us/agent-framework/hosting/self-hosting/
          - title: Carry the grant to every tool
            body:
              - >-
                Pass the caller's principal and grant in function_invocation_kwargs and check them in function
                middleware before call_next().
            url: https://learn.microsoft.com/en-us/agent-framework/concepts/agents/middleware/runtime-context
        note: >-
          Partial on the OpenAI Agents SDK rule (a context carrying the caller's grant is an attach point), with
          hosting helpers that bind sessions, checkpoints, detached runs and approval state to an authenticated scope.
          The framework authenticates no one: the self-hosting pages leave routes, identity, authorization and request
          policy to the application; a continuation, context or task ID is an identifier, not a credential; A2A
          forwarded metadata isn't an authentication boundary; and Durable Functions keys protect generated endpoints
          without establishing user identity or session ownership.
        verified: "2026-11-21"
      - mitigation: D3-AA
        coverage: partial
        mechanism: >-
          A chat client per agent with its own TokenCredential (ManagedIdentityCredential recommended over
          DefaultAzureCredential) or key; per-tool MCP headers (static_headers, header_provider); per-peer A2A
          auth_interceptor; agent name and ID are labels; a dedicated Entra identity per agent comes only with Foundry
          hosted agents
        steps:
          - title: Give each workload its own identity
            body:
              - >-
                Pass credential= a ManagedIdentityCredential for a user-assigned identity per agent workload to its chat
                client, instead of an API key or DefaultAzureCredential.
            url: https://learn.microsoft.com/en-us/agent-framework/integrations/by-component/model-providers/openai
          - title: Give a subagent its own tool credential
            body:
              - >-
                Construct the MCPStreamableHTTPTool a subagent uses with a header_provider or static_headers carrying a
                token minted for that agent, and give the tool to that agent only.
            url: https://learn.microsoft.com/en-us/agent-framework/agents/tools/local-mcp-tools
        note: >-
          Partial on the rule applied to the Claude Agent SDK on this drawing (per-agent credentials are configurable
          but the framework mints none). Each agent can hold its own client and credential, but agents in one process
          share its environment and host identity, and an agent's ID or name is a routing and checkpoint key, not an
          authenticated principal. Minting, rotating and revoking per-agent credentials is the application's or
          Entra's; Foundry hosted agents add an Entra identity per deployed agent (toolFoundryAgentService).
        verified: "2026-11-21"
      - mitigation: D3-CH
        coverage: partial
        mechanism: >-
          credential= with an Azure TokenCredential preferred over api_key; other keys read from environment variables
          (OPENAI_API_KEY, FOUNDRY_MODELS_API_KEY); .env files not loaded automatically; SecretString masks string
          conversion; MCP header_provider keeps tokens out of model-visible tool arguments; CodeAct host tools hold
          credentials outside the guest
        steps:
          - title: Use managed identity, not keys
            body:
              - >-
                Use ManagedIdentityCredential in production; the docs warn that DefaultAzureCredential risks
                unintended credential probing through its fallback chain.
            url: https://learn.microsoft.com/en-us/agent-framework/integrations/by-component/model-providers/microsoft-foundry
          - title: Keep credentials out of tool arguments
            body:
              - >-
                Supply MCP credentials through header_provider, capturing the token in a closure or ContextVar, or
                through static_headers; runtime kwargs whose name the server schema accepts can become tool arguments.
            url: https://learn.microsoft.com/en-us/agent-framework/agents/tools/local-mcp-tools
          - title: Keep secrets out of CodeAct guests
            body:
              - >-
                Put credentialed calls in narrow host tools on HyperlightCodeActProvider; allowed_domains and
                file_mounts constrain the guest, not the host callbacks.
            url: https://learn.microsoft.com/en-us/agent-framework/integrations/by-component/context-providers/hyperlight
        note: >-
          Partial on the rule for this drawing: the framework takes whatever credential or key the application gives
          each client and brokers nothing per step; no credential provider issues a short-lived token per tool call.
          Anything placed in function_invocation_kwargs reaches tools and, through as_tool(), delegated agents;
          checkpoints and serialised sessions persist whatever was put in them. The November 2026 PyPI compromise
          harvested environment variables, ~/.azure and managed-identity tokens from hosts that installed it.
        verified: "2026-11-21"
      - mitigation: cap-agent-action-policy-enforcement
        coverage: partial
        mechanism: >-
          Function middleware (Python FunctionInvocationContext, .NET function calling middleware) that returns a result
          without call_next(); Agent Hooks (experimental, Python) with allow, deny, transform and escalate verdicts at
          pre_tool_call that fail closed; FIDES (experimental, Python) refusing sink tools under untrusted or
          over-confidential context; ShellPolicy as a command pre-filter
        steps:
          - title: Decide every tool call in middleware
            body:
              - >-
                Register function middleware on each agent that checks the principal in context.kwargs, the tool and
                its arguments, and sets context.result without calling call_next() when the policy forbids the call.
            url: https://learn.microsoft.com/en-us/agent-framework/concepts/agents/middleware/
          - title: Enforce through Agent Hooks
            body:
              - >-
                Install one create_agent_hooks_middleware(interceptors=..., mode="enforce") bundle first in the agent's
                middleware list, with a pre_tool_call interceptor returning Verdict.deny or Verdict.escalate.
            url: https://learn.microsoft.com/en-us/agent-framework/agents/agent-hooks
          - title: Declare sink policy with FIDES
            body:
              - >-
                Attach SecureAgentConfig and mark write and send tools accepts_untrusted False with a
                max_allowed_confidentiality, keeping block_on_violation True.
            url: https://learn.microsoft.com/en-us/agent-framework/agents/security
        note: >-
          Partial on the rule applied to the OpenAI Agents SDK (policy functions the deployer writes), not the Claude
