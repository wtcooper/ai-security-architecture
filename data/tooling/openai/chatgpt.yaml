  - id: toolChatgptDesktop
    name: ChatGPT desktop app and Work Local
    surfaceClasses:
      - desktopApp
      - browserExtension
    variants:
      - name: ChatGPT desktop app (macOS, Windows MSIX, Linux preview)
        class: desktopApp
        url: https://learn.chatgpt.com/docs/app
        note: >-
          One app bundles Chat, Work and Codex. Chat and cloud Work show the same synced chats as the web
          (toolChatgptWeb); the Codex view is toolCodex. This record is what the app executes or reaches on the
          device.
      - name: Work Local (local orchestration and execution)
        class: desktopApp
        url: https://learn.chatgpt.com/docs/enterprise/chatgpt-work-local-security
      - name: Local computer access with Work Cloud (cloud orchestration, steps run on the connected computer)
        class: desktopApp
        url: https://learn.chatgpt.com/docs/enterprise/cloud-local-access
        note: >-
          Allowed by Admin Console > Permissions > Work Cloud > Allow local computer access; needs desktop app
          26.929 or later and Sign in with ChatGPT (API keys and Codex access tokens do not enable it).
      - name: Computer Use (macOS and Windows; Locked Use on macOS)
        class: desktopApp
        url: https://learn.chatgpt.com/docs/computer-use
      - name: Built-in browser (in-app browser pane and Browser Use)
        class: desktopApp
        url: https://learn.chatgpt.com/docs/browser
      - name: Remote control from the ChatGPT mobile app (phone steers the desktop host)
        class: desktopApp
        url: https://learn.chatgpt.com/docs/remote-connections
      - name: ChatGPT browser extension (Chrome, Edge, Brave, Opera, Vivaldi)
        class: browserExtension
        url: https://learn.chatgpt.com/docs/chrome-extension
        note: >-
          Driven from the desktop app (side chat, tab mentions, browser control in signed-in sessions); the
          admin levers recorded here are the desktop app's (External browser use, managed Browser Use site
          policies). Browser extensions are assessed on the agentic browser drawing (archAgenticBrowser), not
          here.
    architecture: archCodingAgentThirdParty
    status: ga
    asOf: "2026-10"
    summary:
      - >-
        The ChatGPT desktop app's local reach: Work Local, where a task reads files, edits them and runs shell
        commands under the Codex sandbox and approval settings; local computer access with Work Cloud, where
        OpenAI's cloud coordinates the task and the connected computer executes the steps that need it; Computer
        Use operating native apps (Screen Recording and Accessibility on macOS, the active desktop on Windows,
        optional Locked Use on a locked Mac); the built-in browser and the browser extension acting in browser
        sessions on the machine; Appshots; Computer History; and device remote control from a phone. As a chat
        client the app shows the same synced chats as the web (toolChatgptWeb); its Codex view is toolCodex.
      - >-
        Inference is at OpenAI for every mode: the vendor states that local execution does not mean offline or
        device-only inference, and that file excerpts, prompts, screenshots, browser content and tool results
        may be sent to OpenAI to complete a task. Local Work conversations stay on the computer; cloud Work
        conversations sync. The local runtime is the Codex runtime the app shares with toolCodex.
      - >-
        Two admin planes. Workspace permissions in Admin Console > Permissions decide who may work locally (Use
        Work locally, or Allow members to use Codex and Work Locally), whether cloud tasks may reach the computer
        (Allow local computer access under Work Cloud, which interrupts running turns when turned off) and who
        may enable Computer History. Runtime requirements constrain the device: Admin Console > Agent security
        (a Global baseline with Local overrides — Desktop feature availability, Desktop browser controls with
        Site rules, Desktop app controls with App rules and Allow use while locked, Policy guardrails, Manage
        Networking) delivered at ChatGPT sign-in, the system requirements.toml, legacy managed_config.toml, and
        macOS MDM under com.openai.codex, which ranks highest; sign-in restrictions are honoured only from MDM
        or the system file. Work cloud containers do not inherit any of these local requirements.
    facts:
      - label: Plans
        value: >-
          The desktop app is on every ChatGPT plan, Free included; Work Local and the admin controls need an
          eligible Business, Enterprise or Edu workspace. Computer Use is on macOS and Windows in supported
          regions, not in the Linux preview; Computer History is macOS-only on Pro, Business and Enterprise.
        url: https://learn.chatgpt.com/docs/whats-new
      - label: Inference & routing
        value: >-
          Model calls go to OpenAI. With local computer access with Work Cloud the cloud coordinates and the
          computer executes; model_provider and model_providers are not supported in managed requirements or
          configuration for that mode.
        url: https://learn.chatgpt.com/docs/config-file/config-reference
      - label: Data leaving the device
        value: >-
          Relevant file excerpts, prompts, screenshots, Appshots, browser content and tool results may be sent to
          OpenAI services to complete a task; a browser or app already signed in exposes that account's
          permissions.
        url: https://learn.chatgpt.com/docs/enterprise/chatgpt-work-local-security
      - label: Retention & training
        value: >-
          Local Work conversations stay on the computer and do not follow hosted retention settings by
          assumption; Computer History writes plain-text memory files under ~/.codex/memories that it does not
          encrypt; local computer access with Work Cloud offers no strict zero data retention. Business data is
          not used for training by default.
        url: https://learn.chatgpt.com/docs/enterprise/chatgpt-work-local-security
      - label: Docs index
        value: learn.chatgpt.com/docs/enterprise/chatgpt-work-local-security and managed-configuration
        url: https://learn.chatgpt.com/docs/enterprise/chatgpt-work-local-security
    items:
      - title: Managed deployment and update control
        body:
          - Windows ships only as a Store-signed MSIX (no MSI or standalone EXE), deployable via Intune, MECM
            or winget with offline packages available; macOS deploys from the enterprise DMG, with device
            management arriving through the com.openai.codex MDM payload rather than a dedicated packaging
            guide. The built-in updater is disabled with an enforced requirements.toml feature pin, targeted
            by group, user or platform from the managed-configs console.
        links:
          - title: Windows deployment
            url: https://learn.chatgpt.com/docs/enterprise/windows-deployment
          - title: Managing app updates
            url: https://learn.chatgpt.com/docs/enterprise/manage-app-updates
      - title: Desktop requirements in Agent security
        body:
          - Desktop feature availability forces off the In-app browser, Browser use, External browser use (the
            browser extension) or Computer use, and blocks user opt-in to Full CDP access; Desktop browser
            controls set site rules for access, uploads, downloads and Debug/CDP with approval duration;
            Desktop app controls set Computer Use app rules by macOS bundle ID, Windows AUMID or signed Windows
            executable, Save app approvals and Allow use while locked. Appshots and device remote control are
            set with Edit as TOML.
          - Browser Use rules do not cover Computer Use operating a browser as a native app; deny the browser in
            App rules or force Computer use off to close that path. MDM changes are read at the next launch, and
            a background refresh of cloud requirements does not change a task already running.
        links:
          - title: Managed configuration — control browser and Computer Use
            url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
          - title: Agent Security
            url: https://learn.chatgpt.com/docs/enterprise/agent-security
    riskNotes:
      - risk: riskPromptInjection
        note: >-
          The built-in browser, the browser extension and Computer Use read pages and app content as context
          while acting in signed-in sessions; the vendor tells users to treat page content as untrusted, and the
          only admin levers are feature force-offs, site and app rules, and approval settings.
      - risk: riskRogueActions
        note: >-
          Locked Use lets an approved Computer Use turn unlock a Mac nobody is watching, and saved app and site
          approvals ("Allow for all sites" in the extension) remove later prompts unless the persistent-approval
          requirements are deployed.
      - risk: riskSensitiveDataDisclosure
        note: >-
          Appshots include text beyond the visible window, browser history can be read into a task, and Computer
          History keeps unencrypted memory files readable by other programs running as the user.
      - risk: riskExcessiveDataHandlingDuringInference
        note: >-
          Computer Use sees whatever is on screen in an approved app, and a restriction on direct file access does
          not restrict the files that app can open.
      - risk: riskShadowAndUnknownAgents
        note: >-
          With local computer access a cloud task reaches the computer from web or mobile, and device remote
          control steers local sessions from a phone; if the computer is offline the task can continue in a
          cloud container that does not enforce the local requirements.
      - risk: riskInsecureIntegratedComponent
        note: >-
          The app shares the Codex runtime and its %ProgramData%\OpenAI\Codex configuration path, the subject of
          the 2026 Cymulate config-trust report.
    controls:
      - mitigation: D3-MFA
        coverage: partial
        mechanism: >-
          allowed_login_methods = ["chatgpt"] and allowed_chatgpt_workspaces in the system requirements.toml or
          macOS MDM (cloud-managed values are ignored); MFA itself is enforced by the organisation's SSO IdP
        steps:
          - title: Pin the desktop app to the org workspace
            body:
              - >-
                In the system requirements.toml or MDM com.openai.codex requirements_toml_base64 set
                allowed_login_methods = ["chatgpt"] and allowed_chatgpt_workspaces = ["<workspace-uuid>"]; both
                apply before credentials load and are ignored in cloud-managed requirements.
            url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
          - title: Enforce MFA in the identity provider
            body:
              - >-
                ChatGPT has no workspace-wide MFA enforcement, so require SSO with MFA at the IdP and manage SSO in
                the Global Admin Console.
            url: https://learn.chatgpt.com/docs/enterprise/work-admin-faq
        note: >-
          Partial by the rule applied to every vendor (as on toolCodex): the local runtime can be pinned to the
          org's ChatGPT workspace, so the IdP's MFA policy governs each interactive sign-in, but MFA is configured
          in the IdP — the admin FAQ states ChatGPT doesn't provide workspace-wide MFA enforcement. Local computer
          access with Work Cloud needs Sign in with ChatGPT in the intended workspace (API keys and Codex access
          tokens do not enable it). The pin holds only on machines that carry the system file or MDM payload;
          an unmanaged install signs in to whatever account the user chooses.
        verified: "2026-10-30"
      - mitigation: cap-agent-action-policy-enforcement
        coverage: partial
        mechanism: >-
          Agent security Desktop browser controls (Site rules: access, uploads, downloads, Debug/CDP) and Desktop
          app controls (App rules by bundle ID, AUMID or signed executable), [rules] prefix_rules for local shell
          commands, managed hooks in local-only threads and mcp_tool hooks on the cloud orchestrator
        steps:
          - title: Write the site rules
            body:
              - >-
                In Admin Console > Agent security > Requirements > Desktop browser controls > Site rules edit the
                Default row and add origin rules with Site access, Uploads, Downloads and Debug/CDP set to Allow or
                Block.
            url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
          - title: Write the app rules
            body:
              - >-
                Under Desktop app controls > App rules set the Default row and add rules by macOS bundle ID,
                Windows AUMID or Windows executable publisher and product name, including a deny for the browsers
                if Computer Use must not drive them.
            url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
          - title: Gate tool events with an MCP hook
            body:
              - >-
                For local computer access with Work Cloud configure mcp_tool hook handlers in Global
                requirements.toml; command, prompt and local or plugin hooks are not supported with cloud
                orchestration.
            url: https://learn.chatgpt.com/docs/enterprise/agent-security
        note: >-
          Partial on the rule applied to every vendor (as on toolCodex): deterministic allow and deny rules exist
          per site and per app, enforced by the app, and a user approval cannot override an administrator's
          denial; when several origin patterns match the most restrictive value wins. But they decide whether a
          site or app may be used and which transfers are allowed, not which action is taken in it; Computer Use
          operating a browser escapes Browser Use site rules entirely; a PreToolUse callback error, timeout or
          malformed response fails the hook without blocking the tool; command prefix rules cover shell commands
          only. Rules arrive with the policy and a running task may not pick up a change.
        verified: "2026-10-30"
      - mitigation: cap-ai-vendor-assessment
        coverage: external
        mechanism: >-
          Vendor evidence from the OpenAI Trust Portal and the ChatGPT Work enterprise security whitepaper, consumed
          by the organisation's TPRM platform
        evidence:
          - title: OpenAI Trust Portal (SafeBase) — SOC 2, ISO, pentest and subprocessor artifacts (2026-10-30)
            url: https://trust.openai.com/
          - title: ChatGPT Work enterprise security whitepaper (linked from Work local security, 2026-10-30)
            url: https://cdn.openai.com/pdf/chatgpt-work-enterprise-security.pdf
        note: >-
          External by the rule applied to every vendor: the assessment runs in the organisation's TPRM platform
          from the same portal evidence as toolChatgptWeb. Assess the desktop binary separately from the
          service — what it can read on the device (Screen Recording and Accessibility grants, the Locked Use
          authorization plugin, the browser extension's all-sites permissions) and the release clock, since older
          app versions get no separate security patches.
        verified: "2026-10-30"
      - mitigation: cap-sensitive-data-redaction
        coverage: partial
        mechanism: >-
          Managed hooks (UserPromptSubmit and PreToolUse in local-only Work threads; mcp_tool hooks with cloud
          orchestration) as the attach point for the organisation's inspector; deny_read, allow_appshots = false
          and site Uploads rules as minimisation only
        steps:
          - title: Attach your inspector to managed hooks
            body:
              - >-
                In Agent security > Edit as TOML define managed hooks with allow_managed_hooks_only = true for
