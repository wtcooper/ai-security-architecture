  # <<< managed agent service mapping
  # >>> software factory mapping (checked against the vendor's pages by two people)
  - architecture: archSoftwareFactory
    asOf: "2026-11"
    verified: "2026-11-21"
    reference:
      - title: "Subscription vending implementation guidance (Azure Architecture Center)"
        url: https://learn.microsoft.com/en-us/azure/architecture/landing-zones/subscription-vending
      - title: "Establish common subscription vending product lines (Cloud Adoption Framework)"
        url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/landing-zone/design-area/subscription-vending-product-lines
      - title: "Start your platform engineering journey (Microsoft platform engineering guide)"
        url: https://learn.microsoft.com/en-us/platform-engineering/journey
      - title: "Azure Container Apps Sandboxes overview"
        url: https://learn.microsoft.com/en-us/azure/container-apps/sandboxes-overview
      - title: "Azure Container Apps Sandboxes samples (scenario 02: Copilot CLI in a sandbox with deny-default egress)"
        url: https://github.com/Azure-Samples/azure-container-apps-sandboxes
      - title: "Publish revisions with GitHub Actions in Azure Container Apps"
        url: https://learn.microsoft.com/en-us/azure/container-apps/github-actions
    summary:
      - "On Azure the factory's coding agent runs in Azure Container Apps Sandboxes, one hardware-isolated microVM per build with a deny-by-default egress policy, started by a Container Apps job. GitHub Enterprise Cloud holds a repository per app; GitHub Actions with GitHub Advanced Security builds, scans and attests, and a production environment with required reviewers is the deploy gate. Each app runs on Container Apps behind Entra ID sign-in, in its own vended subscription, with Key Vault, Azure Artifacts and API Management around it."
    bindings:
      - { block: intake, service: "Intake chat app on Container Apps", build: true, note: "Signs requesters in with Entra ID (assigned groups only), screens the request and uploaded files with Prompt Shields, writes the spec and starts a build through a Service Bus queue.", url: https://learn.microsoft.com/en-us/azure/ai-services/content-safety/concepts/jailbreak-detection }
      - { block: previews, service: "Container Apps, per-app preview", note: "A container app per branch in its own environment, built-in auth with an Entra app set to Assignment required for requester and owner (Global Administrators still bypass), test data, no peering.", url: https://learn.microsoft.com/en-us/azure/container-apps/environment }
      - { block: deployGate, service: "GitHub Actions production environment", note: "Required reviewers from the app's owner team, self-review prevented, admin bypass off; the job signs in to Azure by OIDC and shifts Container Apps revision traffic in steps.", url: https://docs.github.com/en/actions/reference/workflows-and-actions/deployments-and-environments }
      - { block: harness, service: "Agent in Container Apps", build: true, note: "A Container Apps job creates a sandbox per build and starts the agent loop in it. Microsoft's platform images target GitHub Copilot CLI and Claude Code; model calls must go to your gateway.", url: https://techcommunity.microsoft.com/blog/appsonazureblog/azure-container-apps-sandboxes-now-generally-available/4559125 }
      - { block: nativeTools, service: "Container Apps Sandboxes, one per build", note: "A hardware-isolated microVM per build, deleted when it ends. Egress policy Deny with the gateway, feed and repository allowed; credentials injected by the egress proxy, not held inside.", url: https://learn.microsoft.com/en-us/azure/container-apps/sandboxes-overview }
      - { block: gateway, service: "Azure API Management (AI gateway)", note: "Validates the agent's Entra token, meters tokens and calls Foundry model deployments with its managed identity, so it holds no model key. MCP servers and the skills catalogue sit behind it.", url: https://learn.microsoft.com/en-us/azure/api-management/genai-gateway-capabilities }
      - { block: registry, service: "Azure Artifacts feed", note: "Only the admission pipeline holds Collaborator, so only it saves public packages; builds and agents read. Azure Artifacts runs no malware or package-age check itself.", url: https://learn.microsoft.com/en-us/azure/devops/artifacts/concepts/upstream-sources?view=azure-devops }
      - { block: sourceControl, service: "GitHub Enterprise Cloud (managed users)", note: "One repository per app from the template. The agent's GitHub App token covers that repository only; organisation rulesets require the platform's workflows and block edits to .github.", url: https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/about-rulesets }
      - { block: pipeline, service: "GitHub Actions with Advanced Security", note: "Required workflows build, test, run dependency review and IaC checks, attest with an SBOM and deploy previews; CodeQL runs by default setup, enforced by Require code scanning results.", url: https://docs.github.com/en/actions/how-tos/secure-your-work/use-artifact-attestations/use-artifact-attestations }
      - { block: appTenant, service: "One subscription per app", note: "Created by subscription vending under the Online landing zone management group: own unpeered VNet, own identity, Key Vault and budget, tagged with owner and end date.", url: https://learn.microsoft.com/en-us/azure/architecture/landing-zones/subscription-vending }
      - { block: appHosting, service: "Container Apps, one environment per app", note: "Built-in authentication with Entra ID in front, a user-assigned identity, secrets as Key Vault references, multiple revision mode for staged release. Not Container Apps Express.", url: https://learn.microsoft.com/en-us/azure/container-apps/authentication }
      - { block: appData, service: "Azure SQL and Blob Storage, per app", note: "In the app's subscription, Entra-only authentication and shared key access off. Storage is encrypted at rest by default; add customer-managed keys where data needs them.", url: https://learn.microsoft.com/en-us/azure/storage/common/storage-service-encryption }
      - { block: orgData, service: "Systems of record via API Management", build: true, note: "Reached only through connector APIs that accept the approved app's own identity and carry the user's entitlements by on-behalf-of exchange; the agent never reaches them.", url: https://learn.microsoft.com/en-us/azure/api-management/validate-azure-ad-token-policy }
      - { block: provider, service: "Microsoft Foundry model deployments", note: "Called only by the gateway with its managed identity. Other providers, such as the Anthropic Messages API on API Management v2 tiers, can sit behind the same gateway.", url: https://learn.microsoft.com/en-us/azure/api-management/genai-gateway-capabilities }
      - { block: sources, service: "Public registries (npm, PyPI, NuGet)", note: "Reached only by the Azure Artifacts feed's upstream sources, never by a build sandbox.", url: https://learn.microsoft.com/en-us/azure/devops/artifacts/concepts/upstream-sources?view=azure-devops }
    sources:
      intake: https://learn.microsoft.com/en-us/azure/ai-services/content-safety/concepts/jailbreak-detection
      previews: https://learn.microsoft.com/en-us/azure/container-apps/environment
      deployGate: https://docs.github.com/en/actions/reference/workflows-and-actions/deployments-and-environments
      harness: https://techcommunity.microsoft.com/blog/appsonazureblog/azure-container-apps-sandboxes-now-generally-available/4559125
      nativeTools: https://learn.microsoft.com/en-us/azure/container-apps/sandboxes-overview
      gateway: https://learn.microsoft.com/en-us/azure/api-management/genai-gateway-capabilities
      registry: https://learn.microsoft.com/en-us/azure/devops/artifacts/concepts/upstream-sources?view=azure-devops
      sourceControl: https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/about-rulesets
      pipeline: https://docs.github.com/en/actions/how-tos/secure-your-work/use-artifact-attestations/use-artifact-attestations
      appTenant: https://learn.microsoft.com/en-us/azure/architecture/landing-zones/subscription-vending
      appHosting: https://learn.microsoft.com/en-us/azure/container-apps/authentication
      appData: https://learn.microsoft.com/en-us/azure/storage/common/storage-service-encryption
      orgData: https://learn.microsoft.com/en-us/azure/api-management/validate-azure-ad-token-policy
      provider: https://learn.microsoft.com/en-us/azure/api-management/genai-gateway-capabilities
      sources: https://learn.microsoft.com/en-us/azure/devops/artifacts/concepts/upstream-sources?view=azure-devops
    differences:
      - at: nativeTools
        text: "A sandbox has unrestricted outbound access until an egress policy is set, and the documentation describes policies per sandbox, not a default for the group. Group managed identities are also offered to every sandbox unless their lifecycle is None. The orchestrator must apply both to every sandbox it creates."
        url: https://sandboxes.azure.com/docs/sandboxes/sandbox/egress
      - at: nativeTools->registry
        text: "Microsoft's allow list for Azure Artifacts includes *.blob.core.windows.net, *.visualstudio.com and *.dedup.microsoft.com, so allowing the feed in the sandbox egress policy also opens every Azure Storage account. Run a package proxy in your own network, or accept that opening and watch the egress decisions."
        url: https://learn.microsoft.com/en-us/azure/devops/organizations/security/allow-list-ip-url?view=azure-devops
      - at: sources->registry
        text: "Azure Artifacts saves any public package a Collaborator installs and documents no malware, look-alike or package-age check. GitHub Package Firewall does this for npm only, is public preview, and is documented in front of JFrog Artifactory rather than Azure Artifacts, so admission for other ecosystems is yours to build."
        url: https://docs.github.com/en/enterprise-cloud@latest/code-security/how-tos/secure-your-supply-chain/secure-your-dependencies/protecting-endpoints-with-package-firewall
      - at: appHosting
        text: "Built-in authentication is off on a new container app, and once on, any user in the tenant can get a token unless Assignment required is set. The built-in policy for it can only audit, not deny, so identity in front of every app and preview holds only because the platform template and the pipeline check put it there."
        url: https://learn.microsoft.com/en-us/azure/container-apps/authentication
      - at: appHosting
        text: "Container Apps Express, which Microsoft calls developer-first and agent-first, has no built-in authentication, no Key Vault references and no multiple revisions or traffic splitting. A factory deploying there would lose sign-in in front, vaulted secrets and staged release, so generated apps go to workload profiles environments."
        url: https://learn.microsoft.com/en-us/azure/container-apps/express-overview
      - at: appTenant
        text: "Apps in one Container Apps environment share its virtual network and log destination, so isolation needs an environment per app. The corp-connected vending product line routes traffic between landing zones through the hub firewall; only the online line leaves app networks unpeered, which is the deliberate choice here."
        url: https://learn.microsoft.com/en-us/azure/container-apps/environment
      - at: appOwner->deployGate
        text: "Required reviewers need read access to the repository, so every app owner needs an account in the GitHub enterprise. GitHub enforces no second factor itself for Enterprise Managed Users: Conditional Access applies at the Entra sign-in, not at the approval. Administrators can bypass protection rules unless the environment disallows it."
        url: https://docs.github.com/en/actions/reference/workflows-and-actions/deployments-and-environments
      - at: govObservability
        text: "A removed Azure RBAC assignment can keep working for up to 10 minutes, and group or app role changes carried in managed identity tokens for hours, as tokens are cached about 24 hours with no forced refresh. The stop runbook therefore deactivates every revision first, then disables sign-in and removes roles."
        url: https://learn.microsoft.com/en-us/azure/container-apps/managed-identity
    alsoNeeded:
      - service: "Microsoft Entra ID (Enterprise Managed Users OIDC, Conditional Access, an enterprise app per generated app)"
        role: identity
        why: "Signs in requesters, owners and app users, carries Conditional Access to GitHub sign-in, and holds each app's assignment list."
        url: https://docs.github.com/en/enterprise-cloud@latest/admin/managing-iam/configuring-authentication-for-enterprise-managed-users/about-support-for-your-idps-conditional-access-policy
      - service: "Azure Firewall with route tables (hub)"
        role: network
        why: "Outbound filter for the orchestrator job's environment; unpeered Online app networks need their own firewall or NAT. User-defined routes need workload profiles environments."
        url: https://learn.microsoft.com/en-us/azure/container-apps/use-azure-firewall
      - service: "GitHub larger runners with Azure private networking"
        role: network
        why: "Lets the pipeline reach private app environments and the feed from a subnet whose NSG rules you set; standard hosted runners are not supported."
        url: https://docs.github.com/en/enterprise-cloud@latest/organizations/managing-organization-settings/about-azure-private-networking-for-github-hosted-runners-in-your-organization
      - service: "Azure Key Vault, one per app"
        role: secrets
        why: "Holds each app's secrets for Key Vault references; the app's identity holds Key Vault Secrets User on that vault only."
        url: https://learn.microsoft.com/en-us/azure/container-apps/manage-secrets
      - service: "Azure Container Registry"
        role: registry
        why: "Holds attested release images; apps pull with managed identity and AcrPull rather than admin credentials."
        url: https://learn.microsoft.com/en-us/azure/container-apps/github-actions
      - service: "Azure DevOps organisation (for Azure Artifacts)"
        role: registry
        why: "Azure Artifacts feeds and their upstream sources live in an Azure DevOps organisation even when code and CI are on GitHub."
        url: https://learn.microsoft.com/en-us/azure/devops/artifacts/concepts/upstream-sources?view=azure-devops
      - service: "Azure Service Bus queue"
        role: other
        why: "Carries confirmed specs from intake to the event-driven Container Apps job, so nothing needs the job's start permission, which can expose its secrets."
        url: https://learn.microsoft.com/en-us/azure/container-apps/jobs
      - service: "Log Analytics workspace with Microsoft Sentinel, data collection endpoint and rule"
        role: logging
        why: "Receives sandbox telemetry through the Logs Ingestion API, the GitHub audit stream and Azure activity, joined into one record per app."
        url: https://sandboxes.azure.com/docs/sandboxes/telemetry
      - service: "Microsoft Defender for Cloud (Defender CSPM, GitHub connector)"
        role: other
        why: "Discovers AI workloads across subscriptions and other clouds, and brings DevOps security findings from GitHub into one view."
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/ai-security-posture
      - service: "Azure Policy and management groups"
        role: other
        why: "Apply the Container Apps, tag and location baselines to every vended subscription before an app resource exists."
        url: https://learn.microsoft.com/en-us/azure/architecture/landing-zones/subscription-vending
    quickstart:
      - title: "Azure Container Apps Sandboxes overview"
        url: https://learn.microsoft.com/en-us/azure/container-apps/sandboxes-overview
      - title: "Subscription vending implementation guidance"
        url: https://learn.microsoft.com/en-us/azure/architecture/landing-zones/subscription-vending
      - title: "Authenticate to Azure from GitHub Actions by OpenID Connect"
        url: https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure-openid-connect
    hosting:
      - id: containerAppsSandboxes
        kind: runtime
        name: "Azure Container Apps Sandboxes, started per build by a Container Apps job"
        url: https://learn.microsoft.com/en-us/azure/container-apps/sandboxes-overview
        asOf: "2026-11"
        mapped: true
        compare:
          runs: "Your Container Apps job starts the coding agent in a sandbox per build; each sandbox is a hardware-isolated microVM with its own kernel, deleted when the build ends."
          patching: "Microsoft runs the sandbox hosts and its platform images; you rebuild any custom disk image and the job's container image yourself."
          data: "Specs, code and build output stay on the sandbox disk and volumes in your sandbox group until deleted; telemetry leaves only where you configure it."
          network: "Outbound is unrestricted until an egress policy is set on each sandbox; a Deny default with host rules and VNet integration through a delegated subnet are offered."
          identity: "Managed identities attach to the sandbox group; lifecycle None hides tokens from code, and the egress proxy can inject a secret or identity token instead."
          accepts: "Any OCI image as the disk image, or Microsoft platform images aimed at GitHub Copilot CLI and Claude Code, with whatever language and toolchain it holds."
          workload: "Sandboxes start in under a second and scale to thousands; tiers run from 0.25 to 16 cores; stopped sandboxes keep disk state and stop compute billing."
          portability: "The image runs anywhere containers run; sandbox lifecycle, egress policy and credential injection are specific to the Sandboxes SDK, CLI and API."
          effort: "Your team writes the orchestrator and sets egress, lifecycle and identity on every sandbox; there are no nodes, node pools or cluster to operate."
          fits: "Microsoft lists sandboxes for agent workflows, untrusted code and ephemeral CI builds, and suggests considering them instead of dynamic sessions for new projects."
        sources:
          - https://learn.microsoft.com/en-us/azure/container-apps/sandboxes-overview
          - https://sandboxes.azure.com/docs/sandboxes/sandbox/egress
          - https://sandboxes.azure.com/docs/sandboxes/identity
          - https://sandboxes.azure.com/docs/sandboxes/sandbox/vnet
          - https://sandboxes.azure.com/docs/sandboxes/telemetry
          - https://sandboxes.azure.com/docs/sandboxes/sandbox/lifecycle
          - https://techcommunity.microsoft.com/blog/appsonazureblog/azure-container-apps-sandboxes-now-generally-available/4559125
          - https://github.com/Azure-Samples/azure-container-apps-sandboxes
          - https://learn.microsoft.com/en-us/azure/container-apps/jobs
          - https://mc.merill.net/message/AZ561262
      - id: aksAgentSandbox
        kind: cluster
        name: "AKS Pod Sandboxing with the Agent Sandbox cluster extension (preview)"
        url: https://learn.microsoft.com/en-us/azure/aks/agent-sandbox-cluster-extension
        asOf: "2026-11"
        compare:
          runs: "Your orchestrator claims a Sandbox pod per build from a warm pool; each runs under Kata VM isolation v2 (preview) with its own guest kernel."
          patching: "You keep Kubernetes, the Azure Linux node image and the extension current; Azure manages the control plane."
          data: "Code and build output stay on nodes and volumes in your subscription; the pod VM boundary isolates compute, not storage paths."
          network: "Pods have unrestricted traffic until you add Cilium network policy, FQDN filtering and an outbound route to Azure Firewall."
          identity: "Pods use Microsoft Entra Workload ID through a federated service account, and can reach the node's metadata service unless you block it."
          accepts: "Linux images on Azure Linux x86-64 node pools of supported v6 VM sizes, with any coding agent you package; no Arm64 or host networking."
          workload: "Warm pools keep Sandboxes ready before a build starts and use capacity while idle; parallel builds are bounded by the node pools you size."
          portability: "Agent Sandbox and Kata Containers are open source and run on other Kubernetes clusters; identity, network and node pool wiring are redone."
          effort: "Your team runs the cluster, Kata node pools, warm pools, network policy, firewall and logs; Defender for Containers does not assess Kata pods."
          fits: "Microsoft describes the extension for isolated AI agent workloads on capacity you control; it is preview and not meant for production use."
        sources:
          - https://learn.microsoft.com/en-us/azure/aks/agent-sandbox-cluster-extension
          - https://learn.microsoft.com/en-us/azure/aks/use-pod-sandboxing
          - https://learn.microsoft.com/en-us/azure/aks/container-network-security-fqdn-filtering-concepts
        summary: "The coding agent and its tools run in a Kata VM-isolated pod per build on AKS, claimed from a warm pool through the Agent Sandbox cluster extension (preview) on the kata-vm-isolation-v2 runtime (preview). Cilium network policy with FQDN filtering and Azure Firewall replace the sandbox egress policy, and Workload ID replaces the sandbox group identity. GitHub, the pipeline, the gate and the per-app subscriptions stay as mapped."
        bindings:
          - { block: harness, service: "Your coding agent in a Kata pod on AKS", build: true, note: "Claimed per build from a SandboxWarmPool by your orchestrator; runs under a service account federated to a narrowly scoped identity.", url: https://learn.microsoft.com/en-us/azure/aks/agent-sandbox-cluster-extension }
          - { block: nativeTools, service: "AKS Pod Sandboxing with Agent Sandbox (preview)", note: "Each build's commands run in a pod VM with its own guest kernel on a dedicated Azure Linux node pool; the claim is deleted when the build ends.", url: https://learn.microsoft.com/en-us/azure/aks/use-pod-sandboxing }
        dropSettings: [sandboxPerBuild, sandboxEgressPolicy]
        addSettings: [aksPodSandboxing, aksFqdnFiltering, aksNetworkPolicy, aksWorkloadIdentity, aksImdsRestriction, aksContainerLogs, aksAgentSandboxClaim]
        differences:
          - at: nativeTools
            text: "The Agent Sandbox extension and the kata-vm-isolation-v2 runtime it requires are both preview, excluded from service-level agreements and not meant for production. They need Kubernetes 1.35, a v6 VM family and a region with the right AKS release, and installing the extension does not itself enable Pod Sandboxing."
            url: https://learn.microsoft.com/en-us/azure/aks/agent-sandbox-cluster-extension
          - at: nativeTools
            text: "Microsoft Defender for Containers does not assess pods that run under the Kata runtime, so threat detection for build sandboxes must come from your own container logs and network flow records."
            url: https://learn.microsoft.com/en-us/azure/aks/use-pod-sandboxing
          - at: harness
            text: "Warm-pool Sandboxes consume compute while no build is using them, and in preview a single snapshot cannot be restored to several independent Sandboxes, so capacity for parallel builds is planned and paid for in node pools."
            url: https://learn.microsoft.com/en-us/azure/aks/agent-sandbox-cluster-extension
        alsoNeeded:
          - service: "Advanced Container Networking Services"
            role: network
            why: "FQDN filtering in Cilium network policy, which limits the build pods to the gateway, the feed and GitHub, depends on it."
            url: https://learn.microsoft.com/en-us/azure/aks/container-network-security-fqdn-filtering-concepts
          - service: "Quota for supported v6 VM sizes"
            role: other
            why: "Kata VM isolation v2 runs only on the Dasv6, Easv6, Fasv6 and related families the extension lists."
            url: https://learn.microsoft.com/en-us/azure/aks/agent-sandbox-cluster-extension
        quickstart:
          - title: "Agent Sandbox cluster extension (preview)"
            url: https://learn.microsoft.com/en-us/azure/aks/agent-sandbox-cluster-extension
          - title: "Pod sandboxing with Azure Kubernetes Service (AKS)"
            url: https://learn.microsoft.com/en-us/azure/aks/use-pod-sandboxing
      - id: copilotCloudAgent
        kind: managed
        name: "GitHub Copilot in the cloud (GitHub, part of Microsoft)"
        url: https://docs.github.com/en/copilot/concepts/agents/cloud-agent/about-cloud-agent
        asOf: "2026-11"
        compare:
          runs: "GitHub runs the agent in a cloud sandbox or on a GitHub Actions runner per task; it works on one branch and opens one pull request per task."
          patching: "GitHub maintains the agent, its models and the cloud sandbox; you maintain any self-hosted runners and the setup steps you add."
          data: "Code and prompts are processed on GitHub's infrastructure or on your own runners, outside your Azure subscription."
          network: "A firewall limits the agent's Bash tool to a recommended allowlist plus your entries; it is not compatible with self-hosted runners."
          identity: "The agent pushes only to its own branch, cannot approve or merge, and the person who asked cannot approve its pull request."
          accepts: "Repositories on GitHub only, not Azure Repos; Ubuntu x64 or Windows 64-bit runners; repository MCP servers, custom agents and skills."
          workload: "A GitHub Actions session stops at 59 minutes and cannot be extended; cloud sandbox sessions can work across several repositories."
          portability: "Instructions, skills and MCP configuration live in the repository; the agent itself runs only on GitHub."
          effort: "Your team sets policies, firewall, rulesets and setup steps; there is no agent infrastructure to run unless you use self-hosted runners."
          fits: "GitHub describes it for delegating tasks that end in a pull request, with workflows held until a person with write access approves them."
        sources:
          - https://docs.github.com/en/copilot/concepts/agents/cloud-agent/about-cloud-agent
          - https://docs.github.com/en/copilot/concepts/agents/cloud-agent/risks-and-mitigations
          - https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/customize-the-agent-environment
          - https://docs.github.com/en/copilot/how-tos/use-copilot-agents/coding-agent/customize-the-agent-firewall
          - https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/streaming-the-audit-log-for-your-enterprise
        offers:
          - name: "Cloud sandbox, GitHub Actions and custom environments"
            what: "Sessions run in a cloud sandbox, on GitHub Actions runners (larger runners with Azure private networking, or ephemeral self-hosted runners managed by ARC), or on a Linux machine you register."
            url: https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/customize-the-agent-environment
          - name: "Agent firewall"
            what: "Internet access is limited by a firewall with a recommended allowlist on by default and organisation and repository custom allowlists; it covers the agent's Bash tool, not other MCP servers or setup steps."
            url: https://docs.github.com/en/copilot/how-tos/use-copilot-agents/coding-agent/customize-the-agent-firewall
          - name: "copilot-setup-steps.yml"
            what: "A single workflow job on the default branch that prepares the GitHub Actions environment before the agent starts; it does not apply to cloud sandbox sessions."
            url: https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/customize-the-agent-environment
          - name: "Built-in branch and review protections"
            what: "The agent pushes to one copilot/ branch, cannot approve, merge or mark its pull request ready, the requester cannot approve it, and Actions workflows wait for approval by a user with write access."
            url: https://docs.github.com/en/copilot/concepts/agents/cloud-agent/risks-and-mitigations
          - name: "Repository MCP servers, custom agents and agent skills"
            what: "Connect tools and task-specific instructions to the agent; personal MCP servers and connectors apply to cloud sandbox sessions only."
            url: https://docs.github.com/en/copilot/concepts/agents/cloud-agent/about-cloud-agent
          - name: "Automations and integrations"
            what: "Sessions can start on a schedule or on repository events, and from Microsoft Teams or Slack; events from users without write access are ignored by default."
            url: https://docs.github.com/en/copilot/concepts/agents/cloud-agent/about-cloud-agent
          - name: "Rulesets apply to the agent"
            what: "A ruleset or branch protection rule can stop Copilot creating or updating pull requests, and administrators can grant it a ruleset bypass."
            url: https://docs.github.com/en/copilot/concepts/agents/cloud-agent/about-cloud-agent
          - name: "Copilot agent session events in the audit stream (public preview)"
            what: "Agent session events can be streamed to Microsoft Agent 365 and Microsoft Purview, for enterprises that use Enterprise Managed Users or GitHub Enterprise Cloud with data residency."
            url: https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/streaming-the-audit-log-for-your-enterprise
