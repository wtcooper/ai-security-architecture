  # <<< managed agent service mapping
  # >>> software factory mapping (checked against the vendor's pages by two people)
  - architecture: archSoftwareFactory
    asOf: "2026-11"
    verified: "2026-11-21"
    reference:
      - title: "It's safe to close your laptop now: Hosting coding agents on Amazon Bedrock AgentCore (AWS Machine Learning Blog)"
        url: https://aws.amazon.com/blogs/machine-learning/its-safe-to-close-your-laptop-now-hosting-coding-agents-on-amazon-bedrock-agentcore/
      - title: "Extend Claude Code to remote sessions on Amazon Bedrock AgentCore with security controls (AWS Machine Learning Blog)"
        url: https://aws.amazon.com/blogs/machine-learning/extend-claude-code-to-remote-sessions-on-amazon-bedrock-agentcore-with-security-controls/
      - title: "Deployment Pipeline Reference Architecture (DPRA) for AWS workloads"
        url: https://aws-samples.github.io/aws-deployment-pipeline-reference-architecture/
      - title: "Organizing Your AWS Environment Using Multiple Accounts (AWS whitepaper)"
        url: https://docs.aws.amazon.com/whitepapers/latest/organizing-your-aws-environment/organizing-your-aws-environment.html
    summary:
      - "Each build runs your coding agent (Claude Code on the Claude Agent SDK, or another CLI agent) in its own Amazon Bedrock AgentCore Runtime session in VPC mode, calling models through AgentCore Gateway, installing from AWS CodeArtifact and pushing a branch to GitHub. A platform-owned CodePipeline with CodeBuild and Amazon Inspector builds, scans and deploys previews; the app owner approves in CodePipeline; an ECS canary deploy releases to one Control Tower account per app, behind an ALB that signs users in."
    bindings:
      - { block: intake, service: "Intake app on CloudFront and Lambda", build: true, note: "Screens the request and uploads with Bedrock Guardrails before writing the spec to DynamoDB; the same shape AWS uses to queue tasks for its remote coding agent sample.", url: https://aws.amazon.com/blogs/machine-learning/extend-claude-code-to-remote-sessions-on-amazon-bedrock-agentcore-with-security-controls/ }
      - { block: harness, service: "Agent on AgentCore Runtime", builtWith: "Claude Agent SDK (Claude Code)", note: "One runtime per app repository and one session per build, as in AWS's sample. Codex, Kiro CLI or OpenCode package the same way as a container image.", url: https://aws.amazon.com/blogs/machine-learning/extend-claude-code-to-remote-sessions-on-amazon-bedrock-agentcore-with-security-controls/ }
      - { block: nativeTools, service: "AgentCore Runtime session microVM", note: "Shell, files and tests run in the session's own microVM; your dispatcher can run deterministic steps with InvokeAgentRuntimeCommand. Tools must be in the image.", url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-execute-command.html }
      - { block: gateway, service: "Amazon Bedrock AgentCore Gateway", note: "Inference connector targets hold the model credential; MCP targets serve the platform's tools. AWS's post mounts shared skills from S3 Files instead.", url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-inference-connector.html }
      - { block: provider, service: "Amazon Bedrock (Claude models)", note: "The gateway's connectors also reach the Anthropic and OpenAI APIs with a vaulted key.", url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-inference-connector.html }
      - { block: registry, service: "AWS CodeArtifact repositories", note: "The sandbox reads a repository with no external connection; an admission pipeline copies versions in after age and Inspector checks.", url: https://docs.aws.amazon.com/codeartifact/latest/ug/package-version-age-gating.html }
      - { block: sources, service: "Public registries (npm, PyPI, Maven)", url: https://docs.aws.amazon.com/codeartifact/latest/ug/external-connection.html }
      - { block: sourceControl, service: "GitHub, one repository per app", note: "Wired to CodePipeline through AWS CodeConnections. Inspector Code Security connects to GitHub and GitLab, not CodeCommit.", url: https://docs.aws.amazon.com/inspector/latest/user/code-security-assessments-connect-github.html }
      - { block: pipeline, service: "AWS CodePipeline (V2) with AWS CodeBuild", note: "One platform-owned pipeline per app in the tooling account, started on push and pull request; buildspec held in the project; InspectorScan action; deploys the preview.", url: https://docs.aws.amazon.com/codepipeline/latest/userguide/pipelines-filter.html }
      - { block: previews, service: "ECS on Fargate, per-app preview account", note: "Behind an ALB authenticate-cognito rule whose user pool federates only to an Identity Center app assigned to the requester and owner; test data, no connector network.", url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/listener-authenticate-users.html }
      - { block: deployGate, service: "CodePipeline approval and ECS canary", note: "The owner approves one execution; a CloudFormation deploy action then updates the app's stack in its account, and ECS shifts traffic by the service's canary settings.", url: https://docs.aws.amazon.com/codepipeline/latest/userguide/approvals.html }
      - { block: appTenant, service: "One AWS account per app", note: "An Account Factory Customization blueprint creates the VPC, cluster, user pool, keys and deploy role in a Generated apps OU.", url: https://docs.aws.amazon.com/controltower/latest/userguide/af-customization-page.html }
      - { block: appHosting, service: "ECS on Fargate, ALB with sign-in", note: "A standard ECS service, not Express Mode, so the blueprint owns the listener rules. App Runner is closed to new customers.", url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/express-service-work.html }
      - { block: appData, service: "DynamoDB, Aurora or S3, per app", note: "Encrypted with the app's own KMS key and reachable only through the app's VPC endpoints.", url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/example-bucket-policies-vpc-endpoint.html }
      - { block: orgData, service: "Systems of record via VPC Lattice", build: true, note: "Each connector is a VPC Lattice service shared to the app accounts approved for it.", url: https://docs.aws.amazon.com/vpc-lattice/latest/ug/auth-policies.html }
    sources:
      intake: https://aws.amazon.com/blogs/machine-learning/extend-claude-code-to-remote-sessions-on-amazon-bedrock-agentcore-with-security-controls/
      harness: https://aws.amazon.com/blogs/machine-learning/extend-claude-code-to-remote-sessions-on-amazon-bedrock-agentcore-with-security-controls/
      nativeTools: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-execute-command.html
      gateway: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-inference-connector.html
      provider: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-inference-connector.html
      registry: https://docs.aws.amazon.com/codeartifact/latest/ug/package-version-age-gating.html
      sources: https://docs.aws.amazon.com/codeartifact/latest/ug/external-connection.html
      sourceControl: https://docs.aws.amazon.com/inspector/latest/user/code-security-assessments-connect-github.html
      pipeline: https://docs.aws.amazon.com/codepipeline/latest/userguide/pipelines-filter.html
      previews: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/listener-authenticate-users.html
      deployGate: https://docs.aws.amazon.com/codepipeline/latest/userguide/approvals.html
      appTenant: https://docs.aws.amazon.com/controltower/latest/userguide/af-customization-page.html
      appHosting: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/express-service-work.html
      appData: https://docs.aws.amazon.com/AmazonS3/latest/userguide/example-bucket-policies-vpc-endpoint.html
      orgData: https://docs.aws.amazon.com/vpc-lattice/latest/ug/auth-policies.html
    differences:
      - at: nativeTools->sourceControl
        text: "A Network Firewall rule that admits github.com admits every repository on it, so the agent's one-repository token, not the network, limits where a push goes. To hold pushes at the network, CodeCommit (open to new customers again since November 2025) takes a VPC endpoint whose policy can name repositories, but Inspector Code Security does not scan it."
        url: https://docs.aws.amazon.com/codecommit/latest/userguide/codecommit-and-interface-VPC.html
      - at: harness
        text: "Any code in the session can read the runtime's execution-role credentials from the microVM metadata service. AWS's coding-agent sample lets that role call Bedrock directly; for the gateway to be the only model path, use an inference target and leave bedrock:InvokeModel, and every deploy permission, out of the role."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/security-credentials-management.html
      - at: sources->registry
        text: "CodeArtifact does not scan packages or hold back new ones: a repository with an external connection fetches any public package the moment a client asks. Age gating is a check you run against the upstream publish times it keeps, and Inspector findings flag workloads using packages it has marked malicious. Admission is yours to build."
        url: https://docs.aws.amazon.com/codeartifact/latest/ug/package-version-age-gating.html
      - at: pipeline
        text: "Inspector Code Security scans only the default branch, and a pull request when it is opened; with pull request triggers only, the top 25 critical or high findings appear in GitHub alone. The InspectorScan action that can fail a CodePipeline stage checks packages from an SBOM, so a SAST finding stops a release only if you add a SAST step of your own."
        url: https://docs.aws.amazon.com/inspector/latest/user/code-security-assessments-create-configuration.html
      - at: previews
        text: "No preview path is private by default. ECS Express Mode without subnets uses the default VPC's public subnets, an internet-facing load balancer and public task IPs, with no sign-in; Amplify Hosting gives each pull request its own URL, protected at most by a shared password or WAF IP rules. Here previews sit behind sign-in for the requester and owner."
        url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/express-service-work.html
      - at: appOwner->deployGate
        text: "A CodePipeline approval does not know who asked for the app: anyone holding PutApprovalResult on that action can approve, and an unanswered approval fails after seven days unless its timeout is set (5 minutes to 60 days). Owner, never requester, holds only because the factory grants that permission to the owner alone."
        url: https://docs.aws.amazon.com/codepipeline/latest/userguide/approvals.html
      - at: deployGate
        text: "ECS canary shifts a percentage of requests, not a chosen group of users, so the first users of a release are whoever the load balancer picks. ECS does not check image signatures at launch; to accept only signed releases, sign with ECR managed signing and verify in a deployment lifecycle hook Lambda."
        url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/image-signing-verification.html
      - at: appUsers->appHosting
        text: "No AWS hosting tier puts sign-in in front by default. App Runner is closed to new customers, Express Mode's load balancer has no authentication and its API cannot change load balancer settings, and Amplify offers a password. The blueprint writes the sign-in rule, and one account per app matters: Express Mode shares a load balancer among up to 25 services in a VPC."
        url: https://docs.aws.amazon.com/apprunner/latest/dg/apprunner-availability-change.html
    alsoNeeded:
      - service: "AWS IAM Identity Center"
        role: identity
        why: "Workforce sign-in with MFA for requesters, owners and app users; one SAML application per app whose assignments decide who may sign in; the owner's approval permission set."
        url: https://docs.aws.amazon.com/singlesignon/latest/userguide/assignuserstoapp.html
      - service: "Amazon Cognito user pool in each app account"
        role: identity
        why: "Federates to that app's Identity Center application and backs the ALB's authenticate-cognito action."
        url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/listener-authenticate-users.html
      - service: "AgentCore Identity"
        role: identity
        why: "Keeps the GitHub App credential and provider API keys in its token vault and hands the session short-lived tokens."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/identity-idp-github.html
      - service: "AWS CodeConnections"
        role: other
        why: "Connects each app pipeline to GitHub for push and pull request triggers."
        url: https://docs.aws.amazon.com/codepipeline/latest/userguide/connections-github.html
      - service: "Amazon VPC with NAT gateway and AWS Network Firewall"
        role: network
        why: "VPC-mode sessions get no internet from public subnets; private subnets route through NAT and the firewall's domain allowlist."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-vpc.html
      - service: "Amazon VPC Lattice service network, shared with AWS RAM"
        role: network
        why: "Carries connector traffic from approved app accounts to enterprise systems without peering."
        url: https://docs.aws.amazon.com/vpc-lattice/latest/ug/auth-policies.html
      - service: "AWS Certificate Manager"
        role: ingress
        why: "ALB sign-in actions work only on HTTPS listeners, which need a certificate."
        url: https://docs.aws.amazon.com/acm/latest/userguide/acm-overview.html
      - service: "AWS KMS"
        role: keys
        why: "A customer managed key per app account for its store, logs and secrets."
        url: https://docs.aws.amazon.com/kms/latest/developerguide/overview.html
      - service: "AWS Secrets Manager"
        role: secrets
        why: "Each app's secrets in its own account, injected by ECS at task start; backs AgentCore Identity's vault."
        url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/secrets-envvar-secrets-manager.html
      - service: "Amazon ECR with managed signing"
        role: registry
        why: "Holds the agent image and each app's images; managed signing signs on push with AWS Signer."
        url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/managed-signing.html
      - service: "Your app register"
        role: registry
        why: "AWS Service Catalog AppRegistry is closed to new customers, so the register is the account tags plus the factory's own table."
        url: https://docs.aws.amazon.com/servicecatalog/latest/arguide/intro-app-registry.html
      - service: "Amazon CloudWatch, AWS CloudTrail and AWS Config"
        role: logging
        why: "Agent traces, the record of approvals and deployments, and the organisation-wide resource inventory."
        url: https://docs.aws.amazon.com/config/latest/developerguide/querying-AWS-resources.html
      - service: "Amazon GuardDuty Malware Protection for S3"
        role: other
        why: "Scans the intake's upload bucket before a file reaches the spec."
        url: https://docs.aws.amazon.com/guardduty/latest/ug/gdu-malware-protection-s3.html
    quickstart:
      - title: "Get started with AgentCore Runtime using the AgentCore CLI"
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-get-started-cli.html
      - title: "Creating an Amazon ECS canary deployment"
        url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/deploy-canary-service.html
      - title: "Customize accounts with Account Factory Customization (AFC)"
        url: https://docs.aws.amazon.com/controltower/latest/userguide/af-customization-page.html
    hosting:
      - id: agentCoreRuntime
        kind: runtime
        name: "Amazon Bedrock AgentCore Runtime"
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agents-tools-runtime.html
        asOf: "2026-11"
        mapped: true
        compare:
          runs: "Your coding agent runs in a container AWS hosts, one microVM per session; a fresh session ID for every build keeps one build from another."
          patching: "AWS patches the host and microVM; you rebuild the agent image, with its CLI, git and toolchains, from a patched base and redeploy the runtime."
          data: "Spec, clone and build output live in the session microVM in your account's Region and go with it, unless you attach session storage (preview), S3 Files or EFS."
          network: "PUBLIC or VPC mode; in VPC mode traffic leaves through network interfaces in your subnets, so security groups, NAT and Network Firewall decide what a build reaches."
          identity: "The runtime's IAM execution role, readable by any code in the microVM through its metadata service, plus an AgentCore workload identity for gateway and GitHub tokens."
          accepts: "Any agent and toolchain in a container image or code package; AWS names Claude Code, Codex, Kiro, OpenCode, Cursor CLI and Gemini CLI as hostable."
          workload: "A session runs up to 8 hours and ends after 15 idle minutes by default; builds run in parallel within account quotas and bill for CPU and memory used."
          portability: "The agent is an ordinary container; starting a session, InvokeAgentRuntimeCommand and StopRuntimeSession are AgentCore calls your dispatcher makes."
          effort: "You own the agent image, dispatcher, execution role, VPC egress, GitHub App and gateway targets; AWS runs microVM capacity, isolation and scaling."
          fits: "AWS's coding-agent samples run one task per Runtime session in your VPC and end in a pull request that a person reviews and merges."
        sources:
          - https://aws.amazon.com/blogs/machine-learning/extend-claude-code-to-remote-sessions-on-amazon-bedrock-agentcore-with-security-controls/
          - https://aws.amazon.com/blogs/machine-learning/its-safe-to-close-your-laptop-now-hosting-coding-agents-on-amazon-bedrock-agentcore/
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-sessions.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-execute-command.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-filesystem-configurations.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-lifecycle-settings.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-vpc.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/security-credentials-management.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/bedrock-agentcore-limits.html
      - id: eksSandboxPods
        kind: cluster
        name: "Amazon EKS with isolated pods (Nitro Sandbox)"
        url: https://docs.aws.amazon.com/eks/latest/userguide/sandboxing.html
        asOf: "2026-11"
        compare:
          runs: "Your agent runs as Kubernetes Jobs or pods; each build's pod in its own Nitro Sandbox (runtimeClassName isolated-sandbox) keeps one build from another."
          patching: "AWS patches the control plane, and nodes too with EKS Auto Mode; otherwise you patch node AMIs, the Nitro Sandbox AMI among them, and your images."
          data: "Spec, clone and build output stay on node storage and EBS or EFS volumes in your account; an EBS volume attaches to one sandbox at a time."
          network: "Pods get VPC addresses and no limits until network policy is enforced; Auto Mode adds DNS-based egress rules, and a network-isolated pod has no network at all."
          identity: "An IAM role per service account through EKS Pod Identity; a sandboxed pod sees surrogate metadata, not the node's role."
          accepts: "Any agent and toolchain in a container on supported EC2 instance types; privileged containers get privileges inside their sandbox only."
          workload: "Jobs have no session cap; you size node pools for parallel builds and carry idle capacity, or let Karpenter or Auto Mode add nodes as builds queue."
          portability: "Jobs and pods use the Kubernetes API and move to other clusters; the isolated-sandbox runtime class and Pod Identity are EKS features."
          effort: "You run the cluster, sandbox node pools, network policy, a dispatcher that creates one Job per build, scaling and logging."
          fits: "Suits a platform team that already runs EKS on Kubernetes 1.36 or later and wants build pods beside its other workloads."
        sources:
          - https://docs.aws.amazon.com/eks/latest/userguide/sandboxing.html
          - https://docs.aws.amazon.com/eks/latest/userguide/sandboxing-limitations.html
          - https://docs.aws.amazon.com/eks/latest/userguide/sandboxing-metadata-credentials.html
          - https://docs.aws.amazon.com/eks/latest/userguide/sandboxing-getting-started.html
          - https://docs.aws.amazon.com/eks/latest/userguide/auto-net-pol.html
          - https://docs.aws.amazon.com/eks/latest/userguide/cni-network-policy.html
          - https://docs.aws.amazon.com/eks/latest/userguide/pod-identities.html
          - https://docs.aws.amazon.com/eks/latest/userguide/automode.html
        summary: "Each build runs as a Kubernetes Job on Amazon EKS whose pod uses the isolated-sandbox runtime class, so it gets its own Nitro Sandbox (a Firecracker microVM). Gateway, mirror, pipeline, deploy gate and app tenancy are unchanged. You now carry what AgentCore Runtime did for each build: starting and stopping the sandbox, egress policy at the pod, the agent's Pod Identity role, node capacity for parallel builds, and the cluster itself."
        bindings:
          - { block: harness, service: "Your coding agent as Kubernetes Jobs on Amazon EKS", builtWith: "Claude Agent SDK (Claude Code)", note: "A dispatcher creates one Job per build under a Pod Identity role that holds no deploy rights.", url: https://docs.aws.amazon.com/eks/latest/userguide/pod-identities.html }
          - { block: nativeTools, service: "Nitro Sandbox pod (runtimeClassName isolated-sandbox)", note: "Hardware-isolated per pod; egress limited by DNS-based network policy and Network Firewall.", url: https://docs.aws.amazon.com/eks/latest/userguide/sandboxing.html }
        dropSettings: [buildSessionPerTask, runtimeVpcMode]
        addSettings: [eksIsolatedPods, eksPodIdentity, eksAppNetworkPolicy, eksImdsHopLimit, eksAgentQuarantine, eksControlPlaneLogs, eksSandboxPodSpecRbac, eksPrivateEndpoint]
        differences:
          - at: nativeTools
            text: "Pods share the node's kernel unless runtimeClassName isolated-sandbox is set, which needs Kubernetes 1.36 or later and supported instance types. The network-isolated annotation removes every network device, so a build that must reach the gateway, mirror and GitHub relies on network policy instead."
            url: https://docs.aws.amazon.com/eks/latest/userguide/sandboxing.html
          - at: nativeTools->registry
            text: "Kubernetes enforces no network policy until you switch it on (enableNetworkPolicy on the VPC CNI, or the Auto Mode Network Policy Controller), and DNS-based egress rules exist only in EKS Auto Mode. Until then a build pod reaches anything the VPC routes to."
            url: https://docs.aws.amazon.com/eks/latest/userguide/auto-net-pol.html
          - at: harness
            text: "There is no session stop call. Ending a build means deleting its Job, and stopping the agent means deleting its Pod Identity association; credentials already issued stay valid until they expire unless the role's sessions are revoked."
            url: https://docs.aws.amazon.com/eks/latest/userguide/pod-identities.html
        alsoNeeded:
          - service: "EKS Auto Mode or Karpenter node pools on Nitro Sandbox instance types"
            role: other
            why: "Builds need nodes that can host sandboxes; Runtime supplied the microVMs."
            url: https://docs.aws.amazon.com/eks/latest/userguide/sandboxing-getting-started.html
          - service: "Network Policy Controller (Auto Mode) or VPC CNI network policy agent"
            role: network
            why: "Without it no egress policy takes effect on the build pods."
            url: https://docs.aws.amazon.com/eks/latest/userguide/cni-network-policy.html
          - service: "EKS Pod Identity Agent"
            role: identity
            why: "Serves each pod its role's credentials; Runtime used the execution role."
            url: https://docs.aws.amazon.com/eks/latest/userguide/pod-id-agent-setup.html
          - service: "Amazon CloudWatch Observability EKS add-on"
            role: logging
            why: "Collects container logs and metrics; Runtime wrote them to CloudWatch for you."
            url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/install-CloudWatch-Observability-EKS-addon.html
        quickstart:
          - title: "Getting started with sandboxes on Amazon EKS"
            url: https://docs.aws.amazon.com/eks/latest/userguide/sandboxing-getting-started.html
          - title: "Create an EKS Auto Mode cluster"
            url: https://docs.aws.amazon.com/eks/latest/userguide/getting-started-automode.html
          - title: "Use network policies with EKS Auto Mode"
            url: https://docs.aws.amazon.com/eks/latest/userguide/auto-net-pol.html
      - id: kiroCloudSessions
        kind: managed
        name: "Kiro autonomous mode in cloud sessions (Kiro Web)"
        url: https://kiro.dev/docs/web/autonomous-mode/
        asOf: "2026-11"
        compare:
          runs: "Kiro runs its agent harness in a managed cloud sandbox it provisions for each session; you configure the environment and connect repositories, not the compute."
          patching: "Kiro, an AWS product, maintains the sandbox and the agent; you keep your project's environment configuration and steering files current."
          data: "Repositories are cloned into the sandbox; sessions and files persist in Kiro's cloud in us-east-1 or eu-central-1 until deleted, not in your AWS account."
          network: "Per environment: Connections access only, Common dependencies, Open internet or a custom domain allow-list; the sandbox cannot sit in your VPC."
          identity: "Users sign in through IAM Identity Center, Okta or Entra ID; repository access is the Kiro GitHub or GitLab app and the user's own write permission."
          accepts: "GitHub and GitLab repositories; in autonomous mode the agent picks the model; MCP servers and environment settings are configured per sandbox."
          workload: "Tasks run in the background and in parallel and can be scheduled hourly, daily or by cron, at most hourly; a run opens a pull or merge request when it has changes."
          portability: "Steering and .kiro configuration live in the repository; sessions, sandboxes and scheduled tasks are Kiro's and do not move."
          effort: "An administrator turns on Cloud Sessions and installs the GitHub app; you set environments, internet access and secrets; Kiro runs the rest."
          fits: "AWS points Amazon Q Developer IDE users to Kiro; its pages describe work on connected repositories that ends in a pull or merge request for review."
        sources:
