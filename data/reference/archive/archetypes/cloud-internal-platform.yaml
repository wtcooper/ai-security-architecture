id: archInternalPlatform
surface: surfaceCloud
title: Internal multi-tenant AI platform
abbrev: Internal AI platform

summary:
  - >
    The paved road: a shared platform on which product teams build AI features, with the gateway,
    the agent runtime, the data plumbing and the guardrails supplied centrally. The archetype whose
    unit of concern is the population of workloads rather than any one of them.

description:
  - >
    Every organisation that gets past its third AI workload builds some version of this, usually
    after discovering it has three different credential arrangements and no aggregate view. The
    platform's purpose is to make the governed path the easy path, so that a team choosing the
    quickest route also chooses the controlled one.
  - >
    That framing produces the archetype's design rule: adoption is a security control. A platform
    teams route around because it is slow, restrictive or badly documented produces worse outcomes
    than no platform, because it also produces the belief that AI use is governed. The measure of
    this architecture is what fraction of workloads actually run on it, and that number should be
    monitored as carefully as any control.
  - >
    Tenancy is the hard technical part. Product teams share a gateway, a vector store, an agent
    runtime and a set of node pools, and the isolation between them is a platform property nobody
    on a product team can verify. Namespace, network and data isolation each fail differently, and
    a shared vector store with per-tenant filtering rather than per-tenant separation is a
    disclosure waiting for a query bug.
  - >
    The platform's own access is the concentration risk. Platform operators can typically read
    across tenants by construction, the central log holds every product's prompts, and the shared
    credential store holds every provider relationship. The platform team's own privileges deserve
    the scrutiny normally reserved for a domain administrator, and they rarely get it.
  - >
    Finally, this is where organisation-wide controls become possible at all. Model approval,
    evaluation gates, inventory and cost attribution work here and cannot work anywhere else,
    because there is nowhere else that sees all of it.

distinguishedBy:
  - >
    Against the AI gateway: that is one component of this, and usually the first built. This is the
    whole paved road — runtime, data plane, templates and standards — with the population problem
    as its subject.
  - >
    Against the vendor low-code agent builder: the same paved-road intent with the paving done
    in-house. Here the environment model, the deployment gate and the isolation are designed rather
    than selected, and the builders are engineers rather than business users.
  - >
    Against any single application archetype: those describe one workload. This describes the
    substrate several of them share, and its risks are aggregation, isolation and adoption rather
    than anything in a request path.

exemplars:
  - name: Internal AI platform teams
    note: >
      A central team offering gateway, runtime, vector store and templates as a product to internal
      product teams, with an onboarding path and a support rota.
    asOf: "2026-08"
  - name: Multi-tenant generative AI platform reference designs
    note: >
      Cloud providers publish this as a named architecture, which is a reasonable indicator that
      most large organisations converge on it.
    asOf: "2026-08"

zones:
  - id: outside
    type: outsideWorld
    personas: []
    note: Model providers, and the end users of whatever the product teams build.

  - id: tenants
    type: compute
    qualifier: tenant workloads
    personas: [personaApplicationDeveloper]
    note: >
      The tenants. Each builds its own workload, and each can leave the platform if it is easier to.

  - id: platform
    type: compute
    qualifier: shared platform
    personas: [personaPlatformProvider, personaAgenticProvider]
    note: >
      Gateway, runtime and templates, shared across tenants. The isolation between tenants is a
      property of this tier that no tenant can verify.

  - id: dataPlane
    type: data
    personas: [personaDataProvider, personaPlatformProvider]
    note: >
      Vector stores, memory and feature data. Per-tenant separation or per-tenant filtering — a
      choice with very different failure modes.

  - id: governance
    type: management
    personas: [personaGovernance, personaPlatformProvider]
    note: >
      The organisation-wide controls that are only possible because there is one place that sees
      everything.

nodes:
  - id: providers
    type: inferenceEndpoint
    zone: outside
    label: Model providers
    note: Several, consumed on behalf of every tenant through one relationship each.
    risks: [riskExcessiveDataHandlingDuringInference, riskDenialOfMLService]
    capabilities: [capabilityAiTprm, capabilityVendorAssurance, capabilityTransportSecurity]

  - id: productWorkload
    type: apiEndpoint
    zone: tenants
    label: Product workloads
    note: >
      Whatever each team is building — an assistant, an agent, a pipeline. Each is one of the other
      archetypes in this catalogue, running here.
    risks: [riskShadowAndUnknownAgents, riskCrossTenantCredentialPropagation]
    capabilities: [capabilityAiSpm, capabilityAgentRegistry, capabilityNhiManagement]

  - id: onboarding
    type: registry
    zone: tenants
    label: Onboarding path
    note: >
      How a team gets started. Its friction is a security parameter: a slow onboarding produces
      workloads that were built somewhere else.
    risks: [riskShadowAndUnknownAgents]
    capabilities: [capabilityAgentRegistry, capabilityAiGovernancePlatform, capabilityShadowAiDiscovery]

  - id: sharedGateway
    type: router
    zone: platform
    label: Shared AI gateway
    note: >
      One crossing to model providers for every tenant, with per-tenant quotas, logging and cost
      attribution. Described in full as its own archetype.
    risks: [riskCrossTenantCredentialPropagation, riskEconomicDenialOfWallet, riskSensitiveDataDisclosure]
    capabilities: [capabilityAiGateway, capabilityRateLimiting, capabilityAiDlp]

  - id: sharedRuntime
    type: harness
    zone: platform
    label: Shared agent runtime
    note: >
      A common place to run agents, with sandboxing, identity and observability supplied. Tenants
      inherit controls they did not have to build.
    risks: [riskCrossTenantCredentialPropagation, riskRogueActions, riskInsecureIntegratedComponent]
    capabilities: [capabilityAgentSandboxing, capabilityAgentRuntimeEnforcement, capabilityNhiManagement]

  - id: templates
    type: skillPackage
    zone: platform
    label: Paved-road templates
    note: >
      Reference implementations with the controls already wired. The most effective security
      artifact the platform produces, and the one most often under-invested in.
    risks: [riskInsecureIntegratedComponent, riskToolSourceProvenance]
    capabilities: [capabilityMlSecureDefaults, capabilityAppSecTesting, capabilityStagedRollout]

  - id: sharedVectorStore
    type: index
    zone: dataPlane
    label: Shared vector store
    note: >
      Several tenants' embeddings in one system. Per-tenant separation is a design decision;
      per-tenant filtering is one query bug away from cross-tenant disclosure.
    risks: [riskCrossTenantCredentialPropagation, riskSensitiveDataDisclosure, riskRetrievalVectorStorePoisoning]
    capabilities: [capabilityRagSecurity, capabilityDataAccessGovernance, capabilityEncryptionKeyManagement]

  - id: sharedMemory
    type: memoryStore
    zone: dataPlane
    label: Shared memory and state
    note: >
      Session and agent state across tenants. Keying is the whole of the isolation, and a key that
      omits the tenant collapses it silently.
    risks: [riskCrossTenantCredentialPropagation, riskSensitiveDataDisclosure, riskPromptResponseCachePoisoning]
    capabilities: [capabilityMemoryProtection, capabilityEncryptionKeyManagement, capabilityDataAccessGovernance]

  - id: tenancyPolicy
    type: policyEngine
    zone: governance
    label: Tenancy and isolation policy
    note: >
      Namespace, network and data isolation between tenants. A platform property no tenant can
      verify, which makes it the platform team's obligation to state and test.
    risks: [riskCrossTenantCredentialPropagation, riskAcceleratorAndSystemSideChannels]
    capabilities: [capabilityAgentSandboxing, capabilityDataAccessGovernance, capabilityMlSecureDefaults]

  - id: modelCatalogue
    type: registry
    zone: governance
    label: Approved model catalogue
    note: >
      Which models any tenant may use, at which versions, with which terms. An organisation-wide
      control that only works because there is one gateway.
    risks: [riskModelDeploymentTampering, riskShadowAndUnknownAgents]
    capabilities: [capabilityAiBom, capabilityStagedRollout, capabilityModelDocumentation]

  - id: workloadInventory
    type: registry
    zone: governance
    label: Workload inventory
    note: >
      Every AI workload, its owner, its data, its models and its risk classification. The artifact
      an auditor asks for and the one that does not exist without a platform.
    risks: [riskShadowAndUnknownAgents]
    capabilities: [capabilityAiSpm, capabilityAgentRegistry, capabilityAiGovernancePlatform]

  - id: platformEvals
    type: evaluationHarness
    zone: governance
    label: Shared evaluation service
    note: >
      Adversarial and safety testing offered as a service, so each team does not build its own and
      most therefore actually do it.
    risks: [riskModelEvasion, riskInsecureModelOutput, riskPromptInjection]
    capabilities: [capabilityModelEvals, capabilityAiRedTeaming, capabilityAppSecTesting]

  - id: platformAccess
    type: identityProvider
    zone: governance
    label: Platform operator access
    note: >
      The platform team can typically read across every tenant by construction. Their privileges
      deserve domain-administrator scrutiny and rarely receive it.
    risks: [riskExcessiveDataHandling, riskSensitiveDataDisclosure, riskCrossTenantCredentialPropagation]
    capabilities: [capabilityIga, capabilityCredentialIsolation, capabilityAuditLogging]

  - id: adoptionSignal
    type: auditSink
    zone: governance
    label: Adoption and drift monitoring
    note: >
      What fraction of AI workloads actually run here, and which teams left. Treated as a product
      metric and functioning as a security one.
    risks: [riskShadowAndUnknownAgents]
    capabilities: [capabilityShadowAiDiscovery, capabilityAiSpm, capabilityAiDetectionResponse]

  - id: centralLog
    type: auditSink
    zone: governance
    label: Central observability
    note: >
      Every prompt, tool call and cost across every tenant. The most sensitive log the organisation
      holds, and the only complete one.
    risks: [riskSensitiveDataDisclosure, riskExcessiveDataHandling]
    capabilities: [capabilityAuditLogging, capabilityAgentObservability, capabilityAiDetectionResponse]

edges:
  - from: onboarding
    to: productWorkload
    label: paved-road start
    control:
      kind: admission
      note: >
        Registration is how a workload enters the inventory. A team that starts without it is
        invisible to every governance control on this diagram.
    risks: [riskShadowAndUnknownAgents]

  - from: templates
    to: productWorkload
    label: reference implementation
    control:
      kind: artifactIntegrity
      note: >
        Controls arriving pre-wired. Also a supply chain into every workload, which makes template
        review a platform-wide security activity.
    risks: [riskInsecureIntegratedComponent, riskToolSourceProvenance]

  - from: productWorkload
    to: sharedGateway
    label: model calls
    control:
      kind: workloadIdentity
      note: >
        Per tenant, because quota, cost attribution and the log all key off it. A shared platform
        credential makes every downstream record anonymous.
    risks: [riskCrossTenantCredentialPropagation]

  - from: productWorkload
    to: sharedRuntime
    label: agent execution
    control:
      kind: isolation
      note: >
        Isolation asserted by the platform and unverifiable by the tenant, which is why the tenancy
        policy has to be stated and tested rather than assumed.
    risks: [riskCrossTenantCredentialPropagation, riskRogueActions]

  - from: sharedRuntime
    to: sharedVectorStore
    label: retrieval
    control:
      kind: dataEntitlement
      note: >
        Separation means a bug returns nothing; filtering means a bug returns another tenant's
        data. The difference only shows up when something goes wrong.
    risks: [riskCrossTenantCredentialPropagation, riskSensitiveDataDisclosure]

  - from: sharedRuntime
    to: sharedMemory
    label: session state
    control:
      kind: memoryScope
      note: >
        A key that omits the tenant collapses isolation silently and looks like a cache hit rather
        than a breach.
    risks: [riskCrossTenantCredentialPropagation, riskPromptResponseCachePoisoning]

  - from: sharedGateway
    to: providers
    label: provider call
    control:
      kind: brokeredCredential
      note: >
        One relationship per provider, used on behalf of every tenant. Concentration is the benefit
        and the exposure at once.
    risks: [riskExcessiveDataHandlingDuringInference, riskSensitiveDataDisclosure]

  - from: tenancyPolicy
    to: sharedRuntime
    label: isolation guarantees
    kind: control
    control:
      kind: isolation
      note: >
        The tenant cannot test it, so the platform has to — and has to publish the result, or the
        guarantee is just a claim in a wiki.
    risks: [riskCrossTenantCredentialPropagation]

  - from: modelCatalogue
    to: sharedGateway
    label: approved models
    kind: control
    control:
      kind: admission
      note: >
        An organisation-wide model policy, enforceable only because there is one crossing. Without
        the gateway this control cannot exist at all.
    risks: [riskModelDeploymentTampering]

  - from: workloadInventory
    to: productWorkload
    label: registration and classification
    kind: control
    control:
      kind: discovery
      note: >
        Both, because self-registration finds the compliant teams and discovery finds the rest.
    risks: [riskShadowAndUnknownAgents]

  - from: platformEvals
    to: productWorkload
    label: evaluation as a service
    kind: control
    control:
      kind: evaluationGate
      note: >
        Central provision is why teams actually evaluate. A policy requiring evaluation without
        supplying a harness produces evidence rather than testing.
    risks: [riskModelEvasion]

  - from: platformAccess
    to: centralLog
    label: operator access
    kind: control
    control:
      kind: auditTrail
      note: >
        The platform team can read every tenant's prompts. That is the concentration risk of this
        archetype and it deserves the treatment given to domain administration.
    risks: [riskSensitiveDataDisclosure, riskExcessiveDataHandling]

  - from: sharedGateway
    to: centralLog
    label: cross-tenant telemetry
    kind: control
    control:
      kind: auditTrail
      note: >
        Tenant-tagged so a product team can see its own without seeing everyone's, which is the
        access-control question the central log poses.
    risks: [riskSensitiveDataDisclosure]

  - from: adoptionSignal
    to: onboarding
    label: adoption and leakage
    kind: control
    control:
      kind: discovery
      note: >
        The platform's adoption rate is a security metric. Workloads that left are workloads with
        none of these controls, and the reason they left is usually fixable.
    risks: [riskShadowAndUnknownAgents]

crossCutting:
  - risk: riskCrossTenantCredentialPropagation
    note: >
      Gateway, runtime, vector store and memory are all shared, and each isolates differently.
      Tenancy is not one component's property — it is a claim about four of them at once, and only
      the platform team can test it.
  - risk: riskShadowAndUnknownAgents
    note: >
      A platform teams route around is worse than none, because it also produces the belief that AI
      use is governed. Adoption is the control, and friction is the vulnerability.
  - risk: riskSensitiveDataDisclosure
    note: >
      Concentration. One log with every prompt, one credential store with every provider
      relationship, and one team that can read across all of it.

risks:
  - riskCrossTenantCredentialPropagation
  - riskShadowAndUnknownAgents
  - riskSensitiveDataDisclosure
  - riskExcessiveDataHandling
  - riskModelDeploymentTampering
  - riskInsecureIntegratedComponent
  - riskRogueActions
  - riskEconomicDenialOfWallet
  - riskRetrievalVectorStorePoisoning
  - riskPromptResponseCachePoisoning
  - riskModelEvasion
  - riskInsecureModelOutput
  - riskPromptInjection
  - riskToolSourceProvenance
  - riskDenialOfMLService
  - riskAcceleratorAndSystemSideChannels
  - riskExcessiveDataHandlingDuringInference

capabilities:
  - capabilityAiSpm
  - capabilityAgentRegistry
  - capabilityAiGovernancePlatform
  - capabilityShadowAiDiscovery
  - capabilityAiGateway
  - capabilityAgentSandboxing
  - capabilityDataAccessGovernance
  - capabilityRagSecurity
  - capabilityMemoryProtection
  - capabilityIga
  - capabilityCredentialIsolation
  - capabilityNhiManagement
  - capabilityAuditLogging
  - capabilityAgentObservability
  - capabilityModelEvals
  - capabilityAiRedTeaming
  - capabilityAppSecTesting
  - capabilityAiBom
  - capabilityStagedRollout
  - capabilityMlSecureDefaults
  - capabilityRateLimiting
  - capabilityAiDlp
  - capabilityEncryptionKeyManagement
  - capabilityAgentRuntimeEnforcement
  - capabilityAiDetectionResponse
  - capabilityModelDocumentation
  - capabilityTransportSecurity
  - capabilityAiTprm
  - capabilityVendorAssurance

deviations:
  - subject: This archetype contains other archetypes
    reason: >
      Its tenants are assistants, agents and pipelines already described elsewhere in this
      catalogue, so it overlaps all of them by construction. It is drawn because its risks —
      tenancy, concentration and adoption — belong to none of them individually and appear nowhere
      else. The product workloads are deliberately one node.
  - subject: Adoption monitoring is drawn as a security control
    reason: >
      It is a product metric and would not normally appear on a security diagram. It is drawn
      because every control here applies only to workloads that are on the platform, which makes
      the adoption rate the multiplier on all of them.
  - subject: Platform operator access is drawn as an identity node in the control plane
    reason: >
      It is a risk rather than a control, and the vocabulary has no node type for a privileged
      insider. It is placed here because the concentration of access is a defining property of the
      archetype and needs somewhere to be stated rather than left implicit.

