# GitHub Copilot SDK — one entity per product × reference architecture. Facts are dated (asOf)
# and cite the vendor's own documentation; re-verify before enforcing. Schema:
# data/tooling/README.md.
vendor: github
family: GitHub Copilot SDK
tools:
  - id: toolCopilotSdk
    name: GitHub Copilot SDK
    surfaceClasses:
      - managedRuntime
    variants:
      - name: Copilot SDK (Node.js, Python, Go, .NET, Rust, Java; GA 2026-06-02)
        class: managedRuntime
        url: https://github.blog/changelog/2026-06-02-copilot-sdk-is-now-generally-available/
      - name: Headless Copilot CLI server (copilot --headless) for backend services and multi-tenant deployments
        class: managedRuntime
        url: https://docs.github.com/en/copilot/how-tos/copilot-sdk/setup/backend-services
      - name: Cloud sessions (work runs on GitHub-hosted compute, published to github.com/copilot/tasks)
        class: managedRuntime
        url: https://docs.github.com/en/copilot/how-tos/copilot-sdk/features/cloud-sessions
    architecture: archAgentWorkflow
    status: ga
    asOf: "2026-09"
    summary:
      - "The Copilot SDK embeds the agent runtime behind Copilot CLI in a customer-hosted
        application: the SDK talks JSON-RPC to a Copilot CLI process (bundled, local, or a
        persistent --headless server) that plans, calls tools, edits files and streams turns. The
        customer owns request routing, user authentication, session ownership, tool registration,
        secrets and scaling; GitHub supplies the model access and the permission model the CLI
        already enforces."
      - "Inference goes to the Copilot API using a GitHub OAuth token, a fine-grained PAT, a
        server-to-server installation token, or — under BYOK — straight to OpenAI, Azure, Anthropic
        or a local OpenAI-compatible endpoint, bypassing GitHub entirely. Session state lives on
        the host under COPILOT_HOME/session-state/{sessionId} (or an application-provided
        sessionFs); cloud sessions run on GitHub compute and appear in the agents panel."
      - "The controls are code: onPermissionRequest (deny-by-default), onPreToolUse allow / deny
        / ask / modify, mode \"empty\" with an explicit availableTools list, per-session gitHubToken,
        sessionIdleTimeoutSeconds, and an OpenTelemetry TelemetryConfig with W3C trace propagation.
        The SDK later added its own enterprise-permissions layer — enableManagedSettings and a
        managedSettings option on session.create / session.resume (deny / ask / allow rules) —
        but this shipped after GA (v1.0.2, v1.0.13) and the enterprise managed-settings client
        matrix still does not list the SDK, so central managed-settings.json policy does not reach
        SDK sessions automatically."
    facts:
      - label: Plans
        value: "Any Copilot subscriber including Free; non-Copilot users via BYOK. Sessions bill AI credits to the token's owner; usage is exposed as assistant.usage and session.usage.getMetrics (nano-AI units)."
        url: https://github.blog/changelog/2026-06-02-copilot-sdk-is-now-generally-available/
      - label: Inference & routing
        value: "Copilot API with the session's GitHub token, or BYOK ProviderConfig (type openai / azure / anthropic, baseUrl, apiKey, wireApi) with prompts sent directly to the provider; Azure managed identity can supply bearer tokens instead of keys."
        url: https://docs.github.com/en/copilot/how-tos/copilot-sdk/auth/byok
      - label: Data leaving the host
        value: "Prompts, tool results and file context to the Copilot API or the BYOK provider; OTLP traces only where configured; cloud sessions publish to github.com/copilot/tasks/{sessionId}; the CLI's telemetry stays on unless COPILOT_OFFLINE=true."
        url: https://docs.github.com/en/copilot/responsible-use/agents
      - label: Data retention / training
        value: "Session state persists on the host filesystem (or a shared volume) with a 30-minute idle timeout in headless mode; GitHub-hosted models follow the Copilot ZDR terms (Claude Fable 5 / 5.1 retain by default); BYOK providers apply their own retention."
        url: https://docs.github.com/en/copilot/reference/ai-models/model-hosting
      - label: Docs index
        value: "Copilot SDK how-tos: setup, authentication, features, hooks, integrations, observability, troubleshooting."
        url: https://docs.github.com/en/copilot/how-tos/copilot-sdk
    items:
      - title: Multi-user server mode — the isolation checklist
        body:
          - "Set gitHubToken per session so content exclusion, model routing and quota follow the
            requesting user; use mode: \"empty\" and an explicit availableTools list (custom:*,
            mcp:tool) so ambient OS tools are off; encode tenant and user in session IDs and check
            ownership before resume or delete; set sessionIdleTimeoutSeconds; use baseDirectory
            and sessionFs to isolate runtime state. The docs list the pitfalls plainly: default
            mode copilot-cli exposes the host filesystem, one shared GitHub token loses per-user
            authorisation, client-provided session IDs cannot be trusted."
          - "Deployment patterns: an isolated CLI per user (strongest; SOC 2 / HIPAA), a shared CLI
            with per-session isolation, or shared collaborative sessions that need application
            locking. There is no built-in auth between SDK and CLI — bind --headless to loopback
            or a private network."
        links:
          - title: Multi-tenancy and server deployments
            url: https://docs.github.com/en/copilot/how-tos/copilot-sdk/setup/multi-tenancy
          - title: Scaling and multi-tenancy
            url: https://docs.github.com/en/copilot/how-tos/copilot-sdk/setup/scaling
          - title: Backend services setup
            url: https://docs.github.com/en/copilot/how-tos/copilot-sdk/setup/backend-services
      - title: Hooks as the policy layer
        body:
          - "onPermissionRequest is deny-by-default: file writes, shell commands and URL fetches
            fail unless the application approves. onPreToolUse returns permissionDecision allow /
            deny / ask with modifiedArgs, additionalContext and suppressOutput; onPostToolUse can
            redact secrets and audit; onUserPromptSubmitted / onUserPromptTransformed filter or
            replace prompts; onSessionStart / End and onErrorOccurred carry sessionId for
            correlation. All run inline in the turn."
        links:
          - title: Working with hooks
            url: https://docs.github.com/en/copilot/how-tos/copilot-sdk/features/hooks
          - title: Pre-tool-use hook
            url: https://docs.github.com/en/copilot/how-tos/copilot-sdk/hooks/pre-tool-use
    riskNotes:
      - risk: riskAgenticDelegationConfusedDeputy
        note: >-
          The documented anti-pattern is one service token for every user; with it, content
          exclusion and quotas collapse to the service account's view. Per-session gitHubToken and
          backend ownership checks on session IDs are the vendor's answer.
      - risk: riskOrchestratorRouteHijacking
        note: >-
          The SDK–CLI JSON-RPC link has no authentication; a headless CLI bound to 0.0.0.0 is an
          open agent runtime with whatever token it was started with.
      - risk: riskEconomicDenialOfWallet
        note: >-
          No built-in rate limiting or session cap: the SDK exposes quota and usage events but
          the application must enforce limits and evict idle sessions.
      - risk: riskToolSourceProvenance
        note: >-
          MCP servers and custom tools are registered by the application; nothing verifies them,
          and the default tool mode inherits the CLI's host tools.
