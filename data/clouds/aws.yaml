          - https://kiro.dev/docs/guides/running-kiro-in-the-cloud/
          - https://docs.aws.amazon.com/amazonq/latest/qdeveloper-ug/q-developer-ide-end-of-support.html
        offers:
          - name: "Autonomous mode (Kiro Web)"
            what: "Takes a task end to end in an isolated sandbox, delegates steps to sub-agents and opens a pull or merge request; it never merges automatically. No preview label on the page."
            url: https://kiro.dev/docs/web/autonomous-mode/
          - name: "Cloud sessions"
            what: "The Kiro harness in a managed sandbox, started from Web, IDE, CLI or Mobile in the profile's Region; off by default for Identity Center organisations, formerly labelled Kiro Web (Preview)."
            url: https://kiro.dev/docs/cloud-sessions/
          - name: "Sandbox internet access"
            what: "Three access levels or a custom allow-list of domains for each sandbox environment, with secrets injected as environment variables the agent can read."
            url: https://kiro.dev/docs/web/sandbox/internet-access/
          - name: "GitHub integration (Kiro Agent app)"
            what: "Issues labelled kiro or a /kiro comment assign work; the app asks for write access to Actions, Checks, Contents, Issues, Pull requests and Workflows."
            url: https://kiro.dev/docs/web/github/
          - name: "Scheduled tasks"
            what: "Run a prompt against connected repositories in autonomous mode on an hourly, daily or cron schedule and open a pull request when there are changes."
            url: https://kiro.dev/docs/web/automations/
