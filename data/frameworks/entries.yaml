# One-line reference text for every external-framework identifier CoSAI maps onto.
#
# CoSAI publishes bare identifiers — `AML.M0003`, `MEASURE-2.7`, `LLM01:2025` — and nothing
# else. On the Frameworks tab those are unreadable without knowing the framework by heart, so
# each one gets its own framework's name for it and a one-sentence description.
#
# None of this text is CoSAI's, and almost none of it is ours: each entry is the external
# framework describing itself, in its own words. `source` records where each block came from
# and flags the one exception — ISO/IEC 22989's text is not openly licensed, so those six
# roles are described rather than quoted.
#
# The build fails if CoSAI maps to an identifier that has no entry here, so this file cannot
# silently fall behind a CoSAI refresh.
#
# See data/PROVENANCE.md.

frameworks:
  mitre-atlas:
    source: >
      MITRE ATLAS, dist/ATLAS.yaml at tag v5.0.1 — the version CoSAI's mappings declare.
      `label` is the ATLAS name verbatim; `description` is the first sentence of the ATLAS
      description, with cross-reference links flattened.
    entries:
      "AML.M0003":
        label: "Model Hardening"
        description: "Use techniques to make AI models robust to adversarial inputs such as adversarial training or network distillation."
      "AML.M0004":
        label: "Restrict Number of AI Model Queries"
        description: "Limit the total number and rate of queries a user can perform."
      "AML.M0006":
        label: "Use Ensemble Methods"
        description: "Use an ensemble of models for inference to increase robustness to adversarial inputs. Some attacks may effectively evade one model or model family but be ineffective against others."
      "AML.M0007":
        label: "Sanitize Training Data"
        description: "Detect and remove or remediate poisoned training data. Training data should be sanitized prior to model training and recurrently for an active learning model."
      "AML.M0008":
        label: "Validate AI Model"
        description: "Validate that AI models perform as intended by testing for backdoor triggers or adversarial influence. Monitor model for concept drift and training data drift, which may indicate data tampering and poisoning."
      "AML.M0010":
        label: "Input Restoration"
        description: "Preprocess all inference data to nullify or reverse potential adversarial perturbations."
      "AML.M0011":
        label: "Restrict Library Loading"
        description: "Prevent abuse of library loading mechanisms in the operating system and software to load untrusted code by configuring appropriate library loading mechanisms and investigating potential vulnerable software."
      "AML.M0013":
        label: "Code Signing"
        description: "Enforce binary and application integrity with digital signature verification to prevent untrusted code from executing."
      "AML.M0014":
        label: "Verify AI Artifacts"
        description: "Verify the cryptographic checksum of all AI artifacts to verify that the file was not modified by an attacker."
      "AML.M0015":
        label: "Adversarial Input Detection"
        description: "Detect and block adversarial inputs or atypical queries that deviate from known benign behavior, exhibit behavior patterns observed in previous attacks or that come from potentially malicious IPs."
      "AML.M0019":
        label: "Control Access to AI Models and Data in Production"
        description: "Require users to verify their identities before accessing a production model. Require authentication for API endpoints and monitor production model queries to ensure compliance with usage policies and to prevent model misuse."
      "AML.M0020":
        label: "Generative AI Guardrails"
        description: "Guardrails are safety controls that are placed between a generative AI model and the output shared with the user to prevent undesired inputs and outputs."
      "AML.M0024":
        label: "AI Telemetry Logging"
        description: "Implement logging of inputs and outputs of deployed AI models. Monitoring logs can help to detect security threats and mitigate impacts."
      "AML.M0028":
        label: "AI Agent Tools Permissions Configuration"
        description: "When deploying tools that will be shared across multiple AI agents, it is important to implement robust policies and controls on permissions for the tools."
        note: >-
          CoSAI stamps this identifier @5.0.1, but ATLAS did not define it until a later
          release. Text here is from ATLAS v5.6.0.
      "AML.T0005":
        label: "Create Proxy AI Model"
        description: "Adversaries may obtain models to serve as proxies for the target model in use at the victim organization. Proxy models are used to simulate complete access to the target model in a fully offline manner."
      "AML.T0008.002":
        label: "Domains"
        description: "Adversaries may acquire domains that can be used during targeting. Domain names are the human readable names used to represent one or more IP addresses."
      "AML.T0010.001":
        label: "AI Software"
        description: "Most AI systems rely on a limited set of AI frameworks. An adversary could get access to a large number of AI systems through a comprise of one of their supply chains."
      "AML.T0010.002":
        label: "Data"
        description: "Data is a key vector of supply chain compromise for adversaries. Every AI project will require some form of data."
      "AML.T0010.003":
        label: "Model"
        description: "AI-enabled systems often rely on open sourced models in various ways. Most commonly, the victim organization may be using these models for fine tuning."
      "AML.T0010.004":
        label: "Container Registry"
        description: "An adversary may compromise a victim's container registry by pushing a manipulated container image and overwriting an existing container name and/or tag."
      "AML.T0012":
        label: "Valid Accounts"
        description: "Adversaries may obtain and abuse credentials of existing accounts as a means of gaining Initial Access. Credentials may take the form of usernames and passwords of individual user accounts or API keys that provide access to various AI resources and services."
      "AML.T0015":
        label: "Evade AI Model"
        description: "Adversaries can Craft Adversarial Data that prevent a AI model from correctly identifying the contents of the data."
      "AML.T0018":
        label: "Manipulate AI Model"
        description: "Adversaries may directly manipulate an AI model to change its behavior or introduce malicious code. Manipulating a model gives the adversary a persistent change in the system."
      "AML.T0019":
        label: "Publish Poisoned Datasets"
        description: "Adversaries may Poison Training Data and publish it to a public location. The poisoned dataset may be a novel dataset or a poisoned variant of an existing open source dataset."
      "AML.T0020":
        label: "Poison Training Data"
        description: "Adversaries may attempt to poison datasets used by an AI model by modifying the underlying data or its labels."
      "AML.T0024":
        label: "Exfiltration via AI Inference API"
        description: "Adversaries may exfiltrate private information via AI Model Inference API Access. AI models have been shown to leak private information about their training data, and the model itself may also be extracted."
      "AML.T0024.002":
        label: "Extract AI Model"
        description: "Adversaries may extract a functional copy of a private model. By repeatedly querying the victim's AI Model Inference API Access, the adversary can collect the target model's inferences into a dataset."
      "AML.T0025":
        label: "Exfiltration via Cyber Means"
        description: "Adversaries may exfiltrate AI artifacts or other information relevant to their goals via traditional cyber means."
      "AML.T0029":
        label: "Denial of AI Service"
        description: "Adversaries may target AI-enabled systems with a flood of requests for the purpose of degrading or shutting down the service."
      "AML.T0034":
        label: "Cost Harvesting"
        description: "Adversaries may target different AI services to send useless queries or computationally expensive inputs to increase the cost of running services at the victim organization."
      "AML.T0034.002":
        label: "Agentic Resource Consumption"
        description: "Adversaries may coerce an agentic AI system into performing computationally expensive tool calls that waste resources and consume API budgets."
        note: >-
          CoSAI stamps this identifier @5.0.1, but ATLAS did not define it until a later
          release. Text here is from ATLAS v5.6.0.
      "AML.T0043":
        label: "Craft Adversarial Data"
        description: "Adversarial data are inputs to an AI model that have been modified such that they cause the adversary's desired effect in the target model."
      "AML.T0048.004":
        label: "AI Intellectual Property Theft"
        description: "Adversaries may exfiltrate AI artifacts to steal intellectual property and cause economic harm to the victim organization."
      "AML.T0049":
        label: "Exploit Public-Facing Application"
        description: "Adversaries may attempt to take advantage of a weakness in an Internet-facing computer or program using software, data, or commands in order to cause unintended or unanticipated behavior."
      "AML.T0051":
        label: "LLM Prompt Injection"
        description: "An adversary may craft malicious prompts as inputs to an LLM that cause the LLM to act in unintended ways. These \"prompt injections\" are often designed to cause the model to ignore aspects of its original instructions and follow the adversary's instructions instead."
      "AML.T0053":
        label: "AI Agent Tool Invocation"
        description: "Adversaries may use their access to an AI agent to invoke tools the agent has access to. LLMs are often connected to other services or resources via tools to increase their capabilities."
      "AML.T0055":
        label: "Unsecured Credentials"
        description: "Adversaries may search compromised systems to find and obtain insecurely stored credentials. These can be misplaced in many locations: plaintext files such as bash history, environment variables, operating system or application-specific repositories, and specialised artifacts such as private keys."
      "AML.T0059":
        label: "Erode Dataset Integrity"
        description: "Adversaries may poison or manipulate portions of a dataset to reduce its usefulness, reduce trust, and cause users to waste resources correcting errors."
      "AML.T0086":
        label: "Exfiltration via AI Agent Tool Invocation"
        description: "Adversaries may use prompts to invoke an agent's tool capable of performing write operations to exfiltrate data."
  owasp-top10-llm:
    source: >
      OWASP Top 10 for Large Language Model Applications, 2025 edition, from the project's
      own `2_0_vulns/` source files. `label` is OWASP's title; `description` is the opening
      of OWASP's own Description section, trimmed to the definitional sentences.
    entries:
      "LLM01:2025":
        label: "Prompt Injection"
        description: "A Prompt Injection Vulnerability occurs when user prompts alter the LLM's behavior or output in unintended ways. These inputs can affect the model even if they are imperceptible to humans, therefore prompt injections do not need to be human-visible/readable, as long as the content is parsed by the model."
      "LLM02:2025":
        label: "Sensitive Information Disclosure"
        description: "LLMs, especially when embedded in applications, risk exposing sensitive data, proprietary algorithms, or confidential details through their output. This includes personal identifiable information, financial details, health records, confidential business data, security credentials and legal documents."
      "LLM03:2025":
        label: "Supply Chain"
        description: "LLM supply chains are susceptible to various vulnerabilities, which can affect the integrity of training data, models, and deployment platforms. While traditional software vulnerabilities focus on issues like code flaws and dependencies, in ML the risks also extend to third-party pre-trained models and data."
      "LLM04:2025":
        label: "Data and Model Poisoning"
        description: "Data poisoning occurs when pre-training, fine-tuning, or embedding data is manipulated to introduce vulnerabilities, backdoors, or biases. This manipulation can compromise model security, performance, or ethical behavior, leading to harmful outputs or impaired capabilities."
      "LLM05:2025":
        label: "Improper Output Handling"
        description: "Improper Output Handling refers specifically to insufficient validation, sanitization, and handling of the outputs generated by large language models before they are passed downstream to other components and systems. Since LLM-generated content can be controlled by prompt input, this behavior is similar to providing users indirect access to additional functionality."
      "LLM06:2025":
        label: "Excessive Agency"
        description: "Excessive Agency is the vulnerability that enables damaging actions to be performed in response to unexpected, ambiguous or manipulated outputs from an LLM, regardless of what is causing the LLM to malfunction. The root cause is typically excessive functionality, excessive permissions or excessive autonomy."
      "LLM07:2025":
        label: "System Prompt Leakage"
        description: "The system prompt leakage vulnerability refers to the risk that the system prompts or instructions used to steer the behavior of the model can also contain sensitive information that was not intended to be discovered. When discovered, this information can be used to facilitate other attacks."
      "LLM08:2025":
        label: "Vector and Embedding Weaknesses"
        description: "Weaknesses in how vectors and embeddings are generated, stored, or retrieved in Retrieval Augmented Generation systems can be exploited by malicious actions, intentional or unintentional, to inject harmful content, manipulate model outputs, or access sensitive information."
      "LLM09:2025":
        label: "Misinformation"
        description: "Misinformation occurs when LLMs produce false or misleading information that appears credible. This vulnerability can lead to security breaches, reputational damage, and legal liability."
      "LLM10:2025":
        label: "Unbounded Consumption"
        description: "Unbounded Consumption occurs when an LLM application allows users to conduct excessive and uncontrolled inferences, leading to risks such as denial of service, economic losses, model theft, and service degradation. The high computational demands of LLMs, especially in cloud environments, make them vulnerable to resource exploitation and unauthorized usage."

  stride:
    source: >
      STRIDE, as defined by Microsoft in the Threat Modeling Tool documentation. Descriptions
      are Microsoft's own wording for each category.
    entries:
      Spoofing:
        label: "Spoofing"
        description: "Involves illegally accessing and then using another user's authentication information, such as username and password. The property it threatens is authentication."
      Tampering:
        label: "Tampering"
        description: "Involves the malicious modification of data — unauthorized changes to persistent data such as that held in a database, and the alteration of data as it flows between two computers over an open network. The property it threatens is integrity."
      Repudiation:
        label: "Repudiation"
        description: "Associated with users who deny performing an action without other parties having any way to prove otherwise — for example, a user performs an illegal operation in a system that lacks the ability to trace prohibited operations. The property it threatens is non-repudiation."
      InformationDisclosure:
        label: "Information Disclosure"
        description: "Involves the exposure of information to individuals who are not supposed to have access to it — the ability to read a file one was not granted access to, or to read data in transit between two computers. The property it threatens is confidentiality."
      DenialOfService:
        label: "Denial of Service"
        description: "Denies service to valid users, for example by making a server temporarily unavailable or unusable. The property it threatens is availability."
      ElevationOfPrivilege:
        label: "Elevation of Privilege"
        description: "An unprivileged user gains privileged access and thereby has sufficient access to compromise or destroy the entire system, including situations where an attacker has penetrated all defenses and become part of the trusted system itself. The property it threatens is authorization."

  nist-ai-rmf:
    source: >
      NIST AI Risk Management Framework 1.0 (NIST AI 100-1), via the NIST AI RMF Playbook at
      airc.nist.gov. `description` is the subcategory text verbatim; `label` is a short name
      for it, ours, because NIST publishes the subcategories without one.
    entries:
      "GOVERN-1.6":
        label: "AI system inventory"
        description: "Mechanisms are in place to inventory AI systems and are resourced according to organizational risk priorities."
      "GOVERN-6.2":
        label: "Third-party contingency processes"
        description: "Contingency processes are in place to handle failures or incidents in third-party data or AI systems deemed to be high-risk."
      "MAP-3.4":
        label: "Operator and practitioner proficiency"
        description: "Processes for operator and practitioner proficiency with AI system performance and trustworthiness – and relevant technical standards and certifications – are defined, assessed and documented."
      "MEASURE-2.3":
        label: "Performance and assurance criteria"
        description: "AI system performance or assurance criteria are measured qualitatively or quantitatively and demonstrated for conditions similar to deployment setting(s). Measures are documented."
      "MEASURE-2.6":
        label: "Safety risk evaluation"
        description: "AI system is evaluated regularly for safety risks – as identified in the MAP function. The AI system to be deployed is demonstrated to be safe, its residual negative risk does not exceed the risk tolerance, and can fail safely, particularly if made to operate beyond its knowledge limits."
      "MEASURE-2.7":
        label: "Security and resilience"
        description: "AI system security and resilience – as identified in the MAP function – are evaluated and documented."
      "MEASURE-2.9":
        label: "Model explanation and validation"
        description: "The AI model is explained, validated, and documented, and AI system output is interpreted within its context – as identified in the MAP function – and to inform responsible use and governance."
      "MEASURE-2.10":
        label: "Privacy risk"
        description: "Privacy risk of the AI system – as identified in the MAP function – is examined and documented."
      "MEASURE-2.11":
        label: "Fairness and bias"
        description: "Fairness and bias – as identified in the MAP function – are evaluated and results are documented."
      "MANAGE-2.1":
        label: "Resources and non-AI alternatives"
        description: "Resources required to manage AI risks are taken into account, along with viable non-AI alternative systems, approaches, or methods – to reduce the magnitude or likelihood of potential impacts."

  iso-22989:
    source: >
      ISO/IEC 22989:2022, Artificial intelligence concepts and terminology, clause 5, which
      defines the roles organisations play in the AI ecosystem and the sub-roles within each.
      The standard's text is not openly licensed, so these describe each role as the standard
      defines it rather than quoting it. CoSAI's identifier names the role and, in brackets,
      the sub-role it means.
    entries:
      "AI Producer":
        label: "AI Producer"
        description: "The organisation that designs, develops, tests and deploys the AI system or model itself. Its sub-roles cover the whole build: designer, developer, tester, evaluator, operator and deployer."
      "AI Partner (data supplier)":
        label: "AI Partner · data supplier"
        description: "An AI partner supports an AI system's operation without controlling its behaviour. As a data supplier it provides, curates or licenses the data a producer trains, tunes or evaluates on, and carries the obligations that come with that data."
      "AI Partner (infrastructure provider)":
        label: "AI Partner · infrastructure provider"
        description: "An AI partner supports an AI system's operation without controlling its behaviour. As an infrastructure provider it supplies the compute, accelerators, storage and platform the system is trained and served on."
      "AI Partner (tooling provider)":
        label: "AI Partner · tooling provider"
        description: "An AI partner supports an AI system's operation without controlling its behaviour. As a tooling provider it supplies the frameworks, libraries, APIs and agentic components the system is assembled from."
      "AI Customer (application builder)":
        label: "AI Customer · application builder"
        description: "An AI customer consumes an AI system produced by someone else. As an application builder it embeds that system in a product of its own, and is responsible for how the system behaves in that context."
      "AI Customer (end user)":
        label: "AI Customer · end user"
        description: "An AI customer consumes an AI system produced by someone else. As an end user it acts on the system's output directly, without building anything on top of it."

  owasp-agentic:
    source: >
      OWASP Top 10 for Agentic Applications 2026, published 9 December 2025 by the OWASP
      GenAI Security Project. Titles and descriptions are OWASP's own, from the publication
      announcement and the project's summary of each entry. CoSAI does not carry this
      framework; the mappings onto it are authored here — see
      data/overlay/frameworks-authored.yaml.
    entries:
      ASI01:
        label: "Agent Goal Hijack"
        description: "Attackers alter an agent's objectives through malicious content, exploiting its planning and reasoning to redirect it into unintended operations such as silent data exfiltration."
      ASI02:
        label: "Tool Misuse and Exploitation"
        description: "Agents use legitimate tools in unsafe ways — parameter manipulation, tool-chain abuse — repurposing authorised capability toward destructive ends."
      ASI03:
        label: "Identity and Privilege Abuse"
        description: "Agents inherit or escalate high-privilege credentials, enabling unauthorised cross-system access and letting an agent operate far beyond its intended scope."
      ASI04:
        label: "Agentic Supply Chain Vulnerabilities"
        description: "Compromised tools, plugins, registries or external components that agents unknowingly leverage, including runtime components in dynamic MCP and agent-to-agent ecosystems."
      ASI05:
        label: "Unexpected Code Execution"
        description: "Agents generate or run code and commands unsafely, so natural-language execution paths become remote code execution and data exfiltration vectors."
      ASI06:
        label: "Memory and Context Poisoning"
        description: "Attackers poison agent memory systems and retrieval databases, corrupting decision-making across sessions and reshaping behaviour long after the initial interaction."
      ASI07:
        label: "Insecure Inter-Agent Communication"
        description: "Multi-agent systems face identity spoofing, message replay and channel tampering, so spoofed messages between agents cause misdirection across agent clusters."
      ASI08:
        label: "Cascading Failures"
        description: "Small errors propagate across planning and execution, amplifying through interconnected systems as false signals move through automated pipelines."
      ASI09:
        label: "Human-Agent Trust Exploitation"
        description: "Users over-trust agent recommendations or explanations, and confident-sounding output misleads operators into approving harmful actions."
      ASI10:
        label: "Rogue Agents"
        description: "Compromised or misaligned agents act harmfully while appearing legitimate, exploiting the trust other components place in them in multi-agent workflows."

  owasp-llm-2026:
    source: >
      OWASP Top 10 for LLM Applications 2026, Version 2026, published 4 August 2026 by the
      OWASP GenAI Security Project and licensed CC BY-SA 4.0. Labels and descriptions are
      taken from the document itself — the opening of each entry's Description section,
      trimmed to the definitional sentences. For LLM03 the definitional sentence is the one
      that names the vulnerability rather than the paragraph that introduces agency.
    entries:
      "LLM01:2026":
        label: "Prompt Injection"
        description: >-
          A prompt-injection vulnerability occurs when input to a large language model —
          direct user input, retrieved content, tool output, image, audio or video content,
          intermediate reasoning, or persistent memory — alters the model's behavior in ways
          the application developer did not intend. LLMs make no architectural distinction
          between instructions and data, both being tokens on the same stream, so there is no
          clean equivalent to parameterized queries. Inputs need not be human-readable, need
          not arrive directly from a user, and need not be visible in the rendered interface
          to influence the model.
      "LLM02:2026":
        label: "Sensitive Information Disclosure"
        description: >-
          Sensitive information disclosure occurs when an LLM-integrated system exposes
          confidential, regulated, privileged, or proprietary data through a channel the data
          subject, controller, or system owner did not authorize. The channel is not only the
          final answer: tool-call arguments, reasoning traces, retrieved chunks, multimodal
          output, logs, telemetry, embeddings, and observable inference properties such as
          timing and token length are all disclosure surfaces.
      "LLM03:2026":
        label: "Excessive Agency"
        description: >-
          Excessive Agency is the vulnerability that enables damaging actions to be performed
          in response to unexpected, ambiguous or manipulated outputs from an LLM, regardless
          of what is causing the LLM to malfunction. The root cause is typically one or more
          of excessive functionality, excessive permissions, or excessive autonomy.
      "LLM04:2026":
        label: "Supply Chain"
        description: >-
          LLM supply chains are susceptible to vulnerabilities that affect the integrity of
          training data, models, adapters, conversion pipelines, and deployment platforms,
          resulting in biased outputs, security breaches, or system failures. While
          traditional software vulnerabilities focus on code flaws and dependencies, in ML the
          risks extend to third-party pre-trained models, datasets, and model artifacts, which
          can be manipulated through tampering, poisoning, or malicious artifact replacement.
      "LLM05:2026":
        label: "Data and Model Poisoning"
        description: >-
          A class of attacks and failures where an adversary, or an unsafe process, manipulates
          data or model artifacts to embed harmful behavior, bias, or exploitable weaknesses
          into an AI system. Poisoning is not limited to training data in the traditional
          sense: it can occur anywhere data is ingested, transformed, retrieved, or reused,
          including during pre-training, fine-tuning, embedding creation, retrieval
          augmentation, and model distribution.
      "LLM06:2026":
        label: "Unbounded Consumption"
        description: >-
          Unbounded Consumption occurs when an LLM application allows excessive and
          uncontrolled inferences, enabling attackers to disrupt service availability, inflict
          unsustainable financial costs, or steal intellectual property through model cloning —
          all by exploiting a common class of vulnerability: the absence of adequate controls
          over how resources are consumed.
      "LLM07:2026":
        label: "Misinformation"
        description: >-
          Misinformation occurs when an LLM or LLM-enabled application produces incorrect,
          incomplete, unsupported, or misleading information that appears credible enough to
          influence a human decision, an automated workflow, or an agent action. The core risk
          is that the incorrect output is trusted and acted upon.
      "LLM08:2026":
        label: "Hidden Context Exposure"
        description: >-
          The unauthorized extraction, inference, or reconstruction of hidden, non-user-facing
          system instructions or operational context placed in a model's context. It becomes
          security-relevant when that hidden context contains or reveals secrets, policy logic,
          tools, trust boundaries, workflow criteria, proprietary behavior, or other sensitive
          implementation details that materially increase attacker capability.
      "LLM09:2026":
        label: "Vector and Embedding Weaknesses"
        description: >-
          Security risks in any LLM application that converts text, images, code, or audio into
          numerical representations and uses similarity search to decide what the model sees.
          Retrieval-Augmented Generation is the most familiar case, but the same machinery
          underlies vector-backed agent memory, semantic caches, and deduplication pipelines.
          Whenever similarity search sits between a data source and the prompt, the embedding
          layer becomes part of the application's trust boundary.
      "LLM10:2026":
        label: "Improper Output Handling"
        description: >-
          Insufficient validation, sanitization, and handling of the outputs generated by large
          language models before they are passed downstream to other components and systems.
          Since LLM-generated content can be controlled by prompt input, this behavior is
          similar to providing users indirect access to additional functionality.

  owasp-mcp:
    source: >
      OWASP MCP Top 10, version 0.1 (Phase 3 — Beta Release and Pilot Testing) from the OWASP
      MCP Top 10 project, licensed CC BY-NC-SA 4.0. Titles are OWASP's own; each description
      is OWASP's own definitional sentence for the entry, from the project's list page. CoSAI
      does not carry this framework; the mappings onto it are authored here — see
      data/overlay/frameworks-authored.yaml.
    entries:
      "MCP01:2025":
        label: "Token Mismanagement & Secret Exposure"
        description: "Hard-coded credentials, long-lived tokens, and secrets stored in model memory or protocol logs can expose sensitive environments."
      "MCP02:2025":
        label: "Privilege Escalation via Scope Creep"
        description: "Temporary or loosely defined permissions within MCP servers often expand over time, granting agents excessive capabilities."
      "MCP03:2025":
        label: "Tool Poisoning"
        description: "Tool poisoning occurs when an adversary compromises the tools, plugins, or their outputs that an AI model depends on — including rug pulls, schema poisoning and tool shadowing."
      "MCP04:2025":
        label: "Software Supply Chain Attacks & Dependency Tampering"
        description: "A compromised dependency can alter agent behavior or introduce execution-level backdoors."
      "MCP05:2025":
        label: "Command Injection & Execution"
        description: "Command injection occurs when an AI agent constructs and executes system commands using untrusted input without proper validation."
      "MCP06:2025":
        label: "Intent Flow Subversion"
        description: "Malicious instructions embedded in context can hijack the 'Intent Flow', steering the agent away from the user's original goal."
      "MCP07:2025":
        label: "Insufficient Authentication & Authorization"
        description: "MCP servers, tools, or agents fail to properly verify identities or enforce access controls during interactions."
      "MCP08:2025":
        label: "Lack of Audit and Telemetry"
        description: "Limited telemetry from MCP servers impedes investigation and incident response."
      "MCP09:2025":
        label: "Shadow MCP Servers"
        description: "Unapproved or unsupervised deployments of Model Context Protocol instances operating outside formal security governance."
      "MCP10:2025":
        label: "Context Injection & Over-Sharing"
        description: "When context windows are shared or insufficiently scoped, sensitive information from one task may be exposed to another."
