          - title: Close Outlook self-install
            body:
              - >-
                Remove My Marketplace Apps, My Custom Apps and My ReadWriteMailbox Apps from the default role
                assignment policy under Roles > User roles in the Exchange admin center.
            url: https://learn.microsoft.com/en-us/exchange/clients-and-mobile-in-exchange-online/add-ins-for-outlook/specify-who-can-install-and-manage-add-ins
          - title: Reconcile use against the record
            body:
