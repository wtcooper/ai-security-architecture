  - id: agentCoreInterfaceEndpoints
    name: "Interface VPC endpoints for AgentCore, with endpoint policies"
    where: "Amazon VPC › Endpoints › com.amazonaws.<region>.bedrock-agentcore, bedrock-agentcore-control and bedrock-agentcore.gateway"
    setVia: [apiCli, cloudPolicy]
    area: network
    default: "No endpoint; calls use the public regional endpoint"
    requires: "For JWT callers the policy principal must be *, so restrict by gateway or harness resource and security group; only SigV4 callers can be named"
    recommended: "Create the endpoints your callers use, with private DNS, in the application and agent VPCs: bedrock-agentcore for runtimes and harnesses, bedrock-agentcore.gateway for gateways, bedrock-agentcore-control for administration. Endpoint policy: only InvokeHarness and InvokeAgentRuntime on your harness ARNs for the application role, and InvokeGateway on your gateway. Endpoint security group: the calling subnets only."
    value: "All three, private DNS, scoped endpoint policies"
    why: "The default endpoint policy allows full access to AgentCore. A scoped policy keeps the private path from being used to reach other accounts' agents or other actions."
    mitigations: [D3-NI]
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/vpc-interface-endpoints.html
    verified: "2026-11-24"
  - id: agentCoreNetworkPerimeterScp
    name: "Network perimeter policy (aws:SourceVpc, aws:SourceVpce)"
    where: "AWS Organizations › Service control policies › Deny bedrock-agentcore invoke and control actions unless the request arrives through your VPC endpoints"
    setVia: [cloudPolicy]
    area: network
    default: "Not set"
    requires: "Applies to IAM principals in your organisation only; AWS documents resource-based policies for runtimes, gateways and memory, not for a harness ARN, so JWT callers of a harness are not covered"
    recommended: "Deny InvokeHarness, InvokeAgentRuntime, InvokeAgentRuntimeCommand and InvokeGateway unless aws:SourceVpce is one of your endpoints, with an exception where aws:ViaAWSService is true and for the pipeline role."
    value: "Deny invokes unless via your endpoints"
    why: "The AgentCore API endpoint stays reachable from the internet. This makes a stolen role credential useless from outside your network."
    mitigations: [D3-NI, D3-ACH]
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_condition-keys.html
    verified: "2026-11-18"
  - id: gatewayIamInboundPolicy
    name: "AWS_IAM inbound authoriser and resource-based policy on the gateway"
    product: "AgentCore Gateway"
    where: "AgentCore Gateway › (gateway) › Inbound Auth AWS_IAM; PutResourcePolicy on the gateway ARN"
    setVia: [apiCli, cloudPolicy]
