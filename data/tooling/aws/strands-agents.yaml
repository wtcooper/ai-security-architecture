# Strands Agents: one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# Exclusions: Amazon Bedrock AgentCore (Runtime, harness, Memory, Gateway, Identity, Policy) is catalogued as
# toolBedrockAgentcore in aws/bedrock-agentcore.yaml; its settings are not repeated here, and the
# AgentCoreMemorySessionManager is noted only as a third-party session manager. Bidirectional (voice) agents,
# Strands Labs projects (robots, Cosmos, AI Functions, Harness Optimizer, Decider), the Strands CLI, the
# standalone Strands Shell and the experimental Agent Configuration API are not assessed. The deprecated
# strands-agents-tools package is recorded only through its advisories. Dogwood Authorization is described by
# its own page as experimental (a reference interpreter) and is not used for any rating.
# 2026-11-21: onboarded. Read strandsagents.com/llms.txt and every cited page as its index.md variant (all
# 200; the HTML URLs cited also answer 200). The site moved from /latest/documentation/docs/user-guide/... to
# /docs/user-guide/...; the old interrupts and agents-as-tools URLs used in data/clouds/aws.yaml still answer 200.
# The SDK repositories are now one monorepo, github.com/strands-agents/harness-sdk (PyPI and npm metadata).
# github.com and api.github.com answered 403 to curl from this environment; the harness-sdk and tools
# advisory pages, SECURITY.md and the release lists were read with WebFetch, and the three SDK advisories were
# cross-checked in the OSV API (api.osv.dev). For GHSA-qhw6-2h72-m84v and GHSA-mpxq-953j-42m4 the GitHub page
# (0.8.8) and the CVE record in OSV (0.8.2, 0.8.3) give different fixed versions, so no fixed version is
# written for them. Latest releases: strands-agents 1.65.0 (PyPI, 2026-11-13), @strands-agents/sdk 1.26.0
# (npm, 2026-11-19), harness-python 0.4.0, harness-typescript 0.5.0, Strands Box v0.2.4 (v0.3.0-preview.1
# pre-release). www.npmjs.com answered 403; download counts came from api.npmjs.org and pypistats.org.
vendor: aws
family: Strands Agents
tools:
  - id: toolStrandsAgents
    name: Strands Agents
    surfaceClasses:
      - sdkFramework
    variants:
      - name: strands-agents (Python SDK)
        class: sdkFramework
        url: https://strandsagents.com/docs/user-guide/sdk/quickstart/python/
      - name: "@strands-agents/sdk (TypeScript SDK)"
        class: sdkFramework
        url: https://strandsagents.com/docs/user-guide/sdk/quickstart/typescript/
      - name: Strands harness (strands-harness, @strands-agents/harness)
        class: sdkFramework
        url: https://strandsagents.com/docs/user-guide/harness/
        note: >-
          A 0.x factory (create_harness / createHarness) that returns a plain SDK Agent with defaults: shell, read,
          write, edit, web_fetch, web_search, programmatic_tool_caller and subagent tools, long-term memory and
          sessions under ./.agent, skills from ./.agent/skills, and no interventions.
      - name: Strands Box (policy-enforced sandbox runtime)
        class: sdkFramework
        url: https://strandsagents.com/docs/user-guide/box/quickstart/
        note: >-
          A 0.x developer-preview runtime (latest v0.2.4) for macOS on Apple silicon and Linux that runs an agent under box.toml
          (operating-system filesystem grants) and policy.dw (a decision per shell command, file operation,
          egress request and MCP request), with credentials injected at its egress gateway. It also runs other
          agents, such as Claude Code and Codex CLI.
    architecture: archActionAgent
    fills: [planner]
    builder:
      kind: providerSdk
      what: "AWS's open-source, model-driven agent SDK: tools, MCP, approvals, Cedar policy, sessions, memory, swarm and graph, A2A and OpenTelemetry."
      languages: ["Python", "TypeScript"]
      usage:
        downloads: 38571198
        registry: PyPI
        package: strands-agents
        asOf: "2026-11"
        url: https://pypistats.org/packages/strands-agents
      also:
        - architecture: archChatAgent
          fills: [agent]
          url: https://strandsagents.com/docs/user-guide/sdk/agents/interventions/human-in-the-loop/
        - architecture: archAgentWorkflow
          fills: [harness, orchestration, subagents]
          url: https://strandsagents.com/docs/user-guide/sdk/multi-agent/multi-agent-patterns/
        - architecture: archAgentFederation
          fills: [harness]
          url: https://strandsagents.com/docs/user-guide/sdk/multi-agent/agent-to-agent/
    status: ga
    asOf: "2026-11"
    summary:
      - >-
        An open-source agent SDK from AWS (Apache-2.0; Python strands-agents 1.x and TypeScript
        @strands-agents/sdk 1.x) whose docs now call it the Strands Harness SDK. The model-driven loop runs
        inside the customer's own process: the model picks tools, the SDK executes them (concurrently by
        default), and the loop repeats until the model stops, a limit or cancellation ends it, or an interrupt
        pauses it for a person. Tools are decorated functions, MCP servers (stdio, Streamable HTTP, SSE), vended
        tools, other agents, or remote agents over A2A; Swarm, Graph and agents-as-tools coordinate several
        agents in one application. Amazon Bedrock is the default model provider, called with the AWS credential
        chain; Anthropic, OpenAI, Google, Ollama, LiteLLM and others plug in through the same agent code.
      - >-
        Nothing is hosted by the SDK. Conversation history and state live in the agent object and persist only
        through a session manager on storage the deployer names (local files, S3 or a custom backend);
        long-term memory goes to the stores attached to a MemoryManager. What leaves the process is the model
        request (prompt, history and tool results), whatever each tool and MCP server sends, and OpenTelemetry
        spans to the collector the deployer configures, prompts and tool results included, with no redaction
        by the SDK. Strands agents can be deployed to Amazon Bedrock AgentCore Runtime, Lambda, Fargate, EKS or
        any container host; AgentCore is catalogued separately.
      - >-
        Most controls are vended classes and parameters the deployer wires in code: HumanInTheLoop and
        CedarAuthorization intervention handlers, per-call limits on turns and tokens, cancel signals, MCP tool
        filters and OAuth client credentials, Bedrock guardrails on the model, Docker or SSH sandboxes for the
        shell and file tools, and session and memory scoping. Nothing asks for approval, isolates commands or
        bounds a call unless it is configured. Strands Box, a 0.x sandbox from the same project, adds an
        operating-system boundary, a policy-checked egress gateway and credential injection, and the Strands
        Evals SDK (Python) scores and red-teams an agent in CI.
    facts:
      - label: Plans
        value: >-
          Free, Apache-2.0 packages (pip install strands-agents, npm install @strands-agents/sdk; extras such as
          strands-agents[a2a], [cedar], [otel]); model calls bill to the chosen provider, Amazon Bedrock by
          default.
        url: https://pypi.org/project/strands-agents/
      - label: Inference & routing
        value: >-
          BedrockModel by default, using boto3 (Python) or the AWS SDK for JavaScript credential chain, a
          boto_session or clientConfig, or a Bedrock API key (api_key / apiKey); the region comes from
          region_name, the boto3 session, AWS_REGION, then us-west-2. Other providers through a Model instance
          per agent.
        url: https://strandsagents.com/docs/user-guide/sdk/model-providers/amazon-bedrock/
      - label: Data leaving the device
        value: >-
          Prompts, history and tool results to the model provider; tool and MCP traffic to their endpoints;
          OpenTelemetry spans (prompts, system prompt, responses, tool results) only to the exporter you set up;
          sessions and memory to the storage you choose; an optional HITL classifier or decision model and the
          agentic web_fetch analyst make their own model calls.
        url: https://strandsagents.com/docs/user-guide/sdk/observability-evaluation/traces/
      - label: Retention & training
        value: >-
          The SDK keeps nothing beyond the storage you configure; its session managers have no TTL and the docs
          tell you to add cleanup. Retention and training are the model provider's terms; on Bedrock, the
          Region's data retention mode is set in the AWS account, not in Strands.
        url: https://docs.aws.amazon.com/bedrock/latest/userguide/data-retention.html
      - label: Docs index
        value: >-
          strandsagents.com (machine-readable index at strandsagents.com/llms.txt): harness, Harness SDK, Shell,
          Box and Evals SDK guides, plus Python and TypeScript API references.
        url: https://strandsagents.com/llms.txt
      - label: Security policy
        value: >-
          Reports go to the AWS Vulnerability Disclosure Program on HackerOne or aws-security@amazon.com, not
          public issues; 1.x is supported and versions below 1.0 are not.
        url: https://github.com/strands-agents/harness-sdk/blob/main/SECURITY.md
      - label: Vendor ownership
        value: >-
          Amazon Web Services; source in the github.com/strands-agents/harness-sdk monorepo (Python and
          TypeScript SDKs, harness and CLI), with Box and the deprecated tools package in their own repositories.
        url: https://strandsagents.com/
    items:
      - title: Put policy before approval
        body:
          - >-
            Register CedarAuthorization before HumanInTheLoop in interventions. Handlers run in registration
            order and a deny short-circuits, so a call no policy permits never reaches the approver or the risk
            classifier; give every security handler on_error "deny".
        links:
          - title: Approve before your agent acts
            url: https://strandsagents.com/docs/user-guide/sdk/agents/approve-before-acting/
          - title: Interventions
            url: https://strandsagents.com/docs/user-guide/sdk/agents/interventions/
      - title: Decide the Strands harness defaults before shipping
        body:
          - >-
            The harness turns on shell and file tools, web access, programmatic tool calling, a generalist
            subagent and file-based memory, applies no interventions and runs commands on a local sandbox on the
            host. Narrow builtin_tools, set interventions, pass a Docker or SSH sandbox, and point session and
            memory directories at private durable storage.
        links:
          - title: Take Strands harness to production
            url: https://strandsagents.com/docs/user-guide/harness/production/
          - title: Strands harness configuration reference
            url: https://strandsagents.com/docs/user-guide/harness/reference/configuration/
    riskNotes:
      - risk: riskPromptInjection
        note: >-
          A Bedrock guardrail's prompt-attack filter does not evaluate toolResult content, so text injected
          through a tool reaches the model unless an after_tool_call intervention screens it. In Python, input
          other than a string is trusted: a trailing toolUse block runs that tool on the next call with no model
          call in between.
      - risk: riskRogueActions
        note: >-
          Nothing asks by default. Approval exists only where HumanInTheLoop or a Confirm handler is attached; its
          classifier and "auto" mode are model judgements, and a trust answer approves a tool for the agent's
          life. Strands harness ships shell, write and edit on the host with no interventions.
      - risk: riskSensitiveDataDisclosure
        note: >-
          Spans carry the prompt, system prompt, responses and tool results, and Strands does not redact them.
          The A2A server shared history across context IDs before strands-agents 1.43.0 (@strands-agents/sdk
          1.5.0), and FileSessionManager's default /tmp storage was readable by other local users before 1.48.0.
      - risk: riskRunawayAgentToolLoops
        note: >-
          Turn and token caps apply only when limits are passed, and are checked between turns, so one turn can
          overshoot. Guide-triggered model retries have no framework cap, and TypeScript Swarm and Graph default
          maxSteps, timeout and nodeTimeout to Infinity.
      - risk: riskAgenticDelegationConfusedDeputy
        note: >-
          Every tool runs with the process's AWS credentials unless it reads the caller's grant from
          invocation_state. Vended subagent, swarm and graph children inherit the parent's tools and interventions
          but not its hooks or plugins, and a custom builder decides whether interventions carry over at all.
      - risk: riskRetrievalVectorStorePoisoning
        note: >-
          Once a store is attached, memory injection is on and folds retrieved entries into the prompt; automatic
          extraction distils facts with a model call, and Strands harness keeps file-based memory on by default.
      - risk: riskInsecureIntegratedComponent
        note: >-
          The deprecated strands-agents-tools package had six 2026 advisories, most of one pattern: security
          parameters (consent flags, masking, connection settings, namespaces) left reachable by the model.
          Migrate to the SDK's vended tools and bind such parameters at construction.
    controls:
      - mitigation: D3-APA
        coverage: partial
        mechanism: >-
          CedarAuthorization (default-deny Cedar policies over principal, tool and arguments, the principal resolved
          from invocation_state) and invocation_state carrying the caller to every tool and hook; who may start,
          resume, answer an interrupt or call the A2A server is the application's endpoint
        steps:
          - title: Bind the caller at ingress
            body:
              - >-
                Pass the authenticated principal, role and token as invocation_state on every call; it reaches
                hooks and tools but is not part of the model context.
            url: https://strandsagents.com/docs/user-guide/sdk/agents/state/
          - title: Decide tool access per principal in Cedar
            body:
              - >-
                Construct CedarAuthorization with a policies file, a principal_resolver that returns None when no
                identity is present (every call is then denied) and a context_enricher for the role.
            url: https://strandsagents.com/docs/user-guide/sdk/agents/interventions/cedar-authorization/
          - title: Authenticate who reaches the agent
            body:
              - >-
                Put the endpoint that invokes or resumes the agent behind your IdP or API gateway; for an A2A
                server set userBuilder (TypeScript) or add middleware on to_fastapi_app (Python).
            url: https://strandsagents.com/docs/user-guide/sdk/multi-agent/a2a-server-configuration/
        note: >-
          Partial on this drawing's rule for D3-APA, as for the OpenAI Agents SDK: the SDK carries the caller's
          grant to every callback, and here Cedar can also decide which principal may call which tool with which
          arguments. Authentication is not the SDK's: a resolver reads whatever the application put in
          invocation_state, a TypeScript A2A server has no authentication by default, context_id is not an
          authentication boundary, and whether the person answering an interrupt is an authorised approver is the
          application's check.
        verified: "2026-11-21"
      - mitigation: cap-agent-tool-registry
        coverage: partial
        mechanism: >-
          Tools listed per agent in reviewed code; automatic loading from ./tools/ off by default; MCP tool_filters
          allowed and rejected lists; make_a2a_client allowed_endpoints for remote agents; no registry with owner,
          version or approval state
        steps:
          - title: Declare each agent's catalogue in code
            body:
              - >-
                Pass an explicit tools list to every Agent and keep load_tools_from_directory False, its default;
                in Strands harness narrow builtin_tools to what the workflow needs.
            url: https://strandsagents.com/docs/user-guide/sdk/tools/using-tools/
          - title: Admit only named MCP tools
            body:
              - >-
                Set tool_filters={"allowed": [...]} (TypeScript toolFilters) on every MCPClient so tools a server
                adds later are not offered.
            url: https://strandsagents.com/docs/user-guide/sdk/tools/mcp-tools/
          - title: Name the remote agents it may call
            body:
              - >-
                Build the A2A client tool with make_a2a_client(allowed_endpoints=[...]) listing only approved peers.
            url: https://strandsagents.com/docs/user-guide/sdk/tools/vended-tools/a2a-client/
        note: >-
          Partial by this drawing's rule, as for the OpenAI Agents SDK and Claude Agent SDK: the catalogue is
          whatever the process constructs and admission is code review. Nothing consults a registry before a tool
          is offered, MCP tool definitions come from the server, the A2A server advertises skills generated from
          its tools, and allowed_endpoints gates only the agent-card fetch. Reconciliation against the
          organisation's registry is its own pipeline, fed by gen_ai.agent.name and trace attributes.
        verified: "2026-11-21"
      - mitigation: cap-staged-rollout-gate
        coverage: partial
        mechanism: >-
          Strands Evals SDK (strands-agents-evals, Python): experiments with output, trajectory and safety
          evaluators, red-team experiments, and strands-evals run --fail-on any or threshold:0.X setting the exit
          code a CI job gates on; no versioning, traffic split or rollback in the framework
        steps:
          - title: Gate the release job on an evaluation
            body:
              - >-
                Run strands-evals run <experiment.json> --agent module:factory in the release pipeline with
                --fail-on any (the default) or threshold:0.X, and never --exit-zero on that job.
            url: https://strandsagents.com/docs/user-guide/evals-sdk/cli/run/
          - title: Red-team before each prompt, model or tool change
            body:
              - >-
                Run a RedTeamExperiment over the prompt_injection, excessive_agency, sensitive_data and
                data_exfiltration categories against a factory-built agent, and block on breaches.
            url: https://strandsagents.com/docs/user-guide/evals-sdk/red-teaming/
        note: >-
          Partial, where the OpenAI Agents SDK and Claude Agent SDK are external: the same project ships an
          evaluation and red-team harness whose exit code gates a release, but the judges are models, the test set
          and its protection are the organisation's, the Evals SDK is Python only, and versioning, progressive
          rollout and rollback belong to the deployment platform (AgentCore endpoints, for example), so the
          native rating that versioned endpoints earn elsewhere does not apply.
        verified: "2026-11-21"
      - mitigation: AML.M0028
        coverage: native
        mechanism: >-
          Python @tool builds a Pydantic model from type hints and validates input before the function runs;
          TypeScript tool() validates Zod inputSchema at runtime; per-agent tools lists; MCP tool_filters;
          subagent tools axis Fixed([...])
        steps:
          - title: Type every action
            body:
              - >-
                Define each action with a typed @tool function (Python) or tool({ inputSchema: z.object(...) })
                (TypeScript); a plain JSON Schema inputSchema is passed through without runtime validation.
            url: https://strandsagents.com/docs/user-guide/sdk/tools/custom-tools/
          - title: Give each agent and child only its own actions
            body:
              - >-
                Pass a per-agent tools list, and on make_subagent set tools to Fixed([...]) so the model cannot
                hand a child the parent's whole toolset.
            url: https://strandsagents.com/docs/user-guide/sdk/tools/vended-tools/
          - title: Allowlist tools from MCP servers
            body:
              - >-
                Set tool_filters={"allowed": [...]} on each MCPClient; the allowed list applies first, then
                rejected.
            url: https://strandsagents.com/docs/user-guide/sdk/tools/mcp-tools/
        note: >-
          Native on this drawing's rule for AML.M0028, as for the OpenAI Agents SDK (typed schemas validated by the
          SDK before execution, plus per-agent tool lists). Outside the boundary: TypeScript tools declared with a
          plain JSON Schema, MCP tool arguments (validated by the server), and the shell and REPL tools, which take
          free-form commands. Every tool runs with the process's authority unless it reads the caller's grant
          from invocation_state; a compensating transaction is the tool author's.
        verified: "2026-11-21"
      - mitigation: AML.M0029
        coverage: native
        mechanism: >-
          HumanInTheLoop intervention handler (interrupt/resume, stdio or a custom ask callback; allowed_tools with
          "!name" negation; optional risk classifier; opt-in trust); Confirm actions from custom handlers; raw
          interrupts from BeforeToolCallEvent hooks or tools, persisted with a session manager
        steps:
          - title: Gate consequential tools
            body:
              - >-
                Register HumanInTheLoop with allowed_tools listing only read-only tools; every other call stops
                with stop_reason "interrupt" until the application resumes it with an interruptResponse for that
                interrupt id.
            url: https://strandsagents.com/docs/user-guide/sdk/agents/interventions/human-in-the-loop/
          - title: Make irreversible tools always ask
            body:
              - >-
                Negate them in allowed_tools ("!delete_files"): a negated tool always prompts, bypasses any
                classifier and cannot be trusted for the session.
            url: https://strandsagents.com/docs/user-guide/sdk/agents/approve-before-acting/
          - title: Park approvals across requests
            body:
              - >-
                Attach a session manager so interrupt state survives between the request that raised it and the
                one that answers it, and load sessions only from storage the application controls.
            url: https://strandsagents.com/docs/user-guide/sdk/interrupts/
        note: >-
          Native on the same rule as the OpenAI Agents SDK's needs_approval and the Claude Agent SDK's canUseTool:
          a built-in primitive holds the exact call, with its arguments, until the application records a decision
          for that interrupt id. The deployer supplies the approver, the UI, authentication and the rule that the
          requester never approves; the docs describe no approver identity on the decision. Boundaries: nothing asks unless a handler
          is attached; the classifier and "auto" mode are model judgements (auto can change in a minor release);
          trust is sticky for the agent's life; direct agent.tool calls do not support interrupts; a subagent built
          by a custom builder keeps the gate only if the builder passes interventions on.
        verified: "2026-11-21"
      - mitigation: cap-agent-action-policy-enforcement
        coverage: native
        mechanism: >-
          CedarAuthorization vended intervention: Cedar policies (inline, .cedar files, hot reload) evaluated
          before each tool call over principal, tool name, arguments (context.input) and session context
          (call_count, hour_utc, enriched fields); default-deny, fail-closed on engine errors; custom
          InterventionHandler deny, guide, confirm and transform actions
        steps:
          - title: Load a default-deny policy file
            body:
              - >-
                Construct CedarAuthorization(policies="./policies/agent.cedar", tools=[...]) so schema validation
                catches policy typos at construction, and register it first in interventions.
            url: https://strandsagents.com/docs/user-guide/sdk/agents/interventions/cedar-authorization/
          - title: Fail closed on callback errors
            body:
              - >-
                Set on_error "deny" on CedarAuthorization and on every custom security handler; never "proceed",
                which lets the guarded call run unchecked.
            url: https://strandsagents.com/docs/user-guide/sdk/agents/interventions/
          - title: Cap delegation as well as tools
            body:
              - >-
                Add call_count limits on the subagent, swarm and graph tools, because each child agent shares the
                handler but keeps its own count.
            url: https://strandsagents.com/docs/user-guide/sdk/agents/interventions/cedar-authorization/
        note: >-
          Native on the rule applied to the Claude Agent SDK's declarative deny and ask rules: a declarative,
          identity-aware policy outside the model decides every tool call before it runs, deny short-circuits the
          handlers after it, and an unresolved principal or an engine failure denies. The OpenAI Agents SDK is
          partial because its guardrails are code the deployer writes. Not covered: what a tool does inside its
          body (a shell command is one call to the shell tool; Strands Box decides each command), direct
          agent.tool calls, and children built by a custom builder that drops interventions; the resource is
          static and the namespace option is TypeScript only.
        verified: "2026-11-21"
      - mitigation: D3-AA
        coverage: partial
        mechanism: >-
          No agent identity in the SDK; the process authenticates to Bedrock through the AWS credential chain (a
          workload IAM role), a boto_session per BedrockModel, or a Bedrock API key; per-agent MCPClient with its
          own OAuth client credentials; A2AAgent client_config for SigV4, OAuth or bearer auth to peers
        steps:
          - title: Run each agent workload under its own role
            body:
              - >-
                Leave BedrockModel to the default credential chain on a workload role, or pass a boto_session for
                an agent that needs its own role, rather than an api_key.
            url: https://strandsagents.com/docs/user-guide/sdk/model-providers/amazon-bedrock/
          - title: Give each agent its own tool credential
            body:
              - >-
                Construct that agent's MCPClient with auth={"client_id": ..., "client_secret": ...} for its own
                OAuth client and list it only in that agent's tools.
            url: https://strandsagents.com/docs/user-guide/sdk/tools/mcp-transports/
          - title: Authenticate to remote agents per peer
            body:
              - >-
                Pass an A2AAgent client_config (Python) or clientFactory (TypeScript) carrying the credential
                issued for that peer.
            url: https://strandsagents.com/docs/user-guide/sdk/multi-agent/agent-to-agent/
        note: >-
          Partial by this drawing's rule (the SDK neither mints nor authenticates agent identities), as for the
          OpenAI Agents SDK. Agent name and agent_id label spans and sessions but are not principals; agents in one
          process share its environment and default credentials. Minting, rotating and revoking per-agent
          credentials is the application's or the platform's (IAM roles, the OAuth server).
        verified: "2026-11-21"
      - mitigation: cap-data-access-governance
        coverage: partial
        mechanism: >-
          invocation_state carrying the requester's token to tools and hooks; per-request MCP headers or OAuth
          client credentials; BedrockKnowledgeBaseStore scope (a metadata filter per tenant) and
          access_control_list stamped on writes; no on-behalf-of exchange
        steps:
          - title: Carry the requester's token to data tools
            body:
              - >-
                Put the account-scoped token from your own OAuth or on-behalf-of flow in invocation_state and use
                it inside each tool's data call.
            url: https://strandsagents.com/docs/user-guide/sdk/agents/state/
          - title: Scope memory retrieval per tenant
            body:
              - >-
                Build one BedrockKnowledgeBaseStore per tenant with its own scope, and set access_control_list where
                the data source is ACL-aware.
            url: https://strandsagents.com/docs/user-guide/sdk/memory/bedrock-knowledge-base/
        note: >-
          Partial on the same rule as the OpenAI Agents SDK's run context (a per-call attach point): retrieval runs
          with the requester's entitlements only when the application obtains and passes that token. MCP OAuth in
          the SDK is the client_credentials grant, a machine identity, and the interactive flow is an
          auth_provider the deployer supplies. Store scope isolates tenants inside one knowledge base but is a
          filter the store applies with its own AWS credentials; oversharing analysis of sources is outside the SDK.
        verified: "2026-11-21"
      - mitigation: AML.M0031
        coverage: partial
        mechanism: >-
          SnapshotSessionManager / SessionManager keyed by session_id and agent_id on the storage you pass, with
          immutable snapshots for restore and delete_session(); A2A agent_factory isolating each context_id;
          MemoryManager stores with scope and writable, writes opt-in
        steps:
          - title: Key each session to one case
            body:
              - >-
                Construct SnapshotSessionManager(session_id=<case id>, storage=S3Storage(bucket, prefix=...)) with a
                unique agent_id, and call delete_session() when the case closes.
            url: https://strandsagents.com/docs/user-guide/sdk/agents/session-management/
          - title: Restore a known-good state
            body:
              - >-
                Create immutable snapshots with snapshot_trigger and roll an agent back with restore_snapshot to a
                checkpoint taken before suspect content arrived.
            url: https://strandsagents.com/docs/user-guide/sdk/agents/session-management/
          - title: Keep memory writes off where input is untrusted
            body:
              - >-
                Leave stores writable=False and extraction off on agents that read external content; in Strands
                harness pass memory=False or a scoped store.
            url: https://strandsagents.com/docs/user-guide/sdk/memory/managing-memory/
        note: >-
          Partial by this drawing's rule (session and store objects the deployer scopes): the boundary is the
          session_id, agent_id and storage the application picks, and session state is trusted input, so loading a
          session from storage an attacker can write is the attack. Nothing validates what a turn writes; the
          managers take no distributed lock and have no TTL. Python's FileSessionManager defaulted to /tmp storage
          that other local users could read or redirect through symlinks until 1.48.0.
        verified: "2026-11-21"
      - mitigation: D3-CH
        coverage: partial
        mechanism: >-
          AWS credential chain (temporary role credentials) for Bedrock and S3; MCP OAuth client_credentials with
          automatic token acquisition and refresh, ${VAR} placeholders in load_servers config; Strands Box
          [egress.<name>] secrets injected at the gateway so the workload holds only a placeholder
        steps:
          - title: Use role credentials, not keys in code
            body:
              - >-
                Run the agent under an IAM role and let BedrockModel and S3Storage resolve it from the default chain;
                do not pass access keys or a Bedrock api_key literal.
            url: https://strandsagents.com/docs/user-guide/sdk/model-providers/amazon-bedrock/
          - title: Keep MCP secrets in the environment
            body:
              - >-
                Load servers with MCPClient.load_servers using ${OAUTH_CLIENT_ID} and ${OAUTH_CLIENT_SECRET}
                placeholders, so no secret sits in the configuration file.
            url: https://strandsagents.com/docs/user-guide/sdk/tools/mcp-transports/
          - title: Inject credentials outside the agent
            body:
              - >-
                In a Strands Box, bind each credential to its destinations with [egress.<name>] secret.ref and the
                default secret.inject "phantom".
            url: https://strandsagents.com/docs/user-guide/box/guides/network-and-credentials/
        note: >-
          Partial by this drawing's rule: the SDK takes whatever credential the environment or the application
          gives it and brokers nothing per step. Role credentials and OAuth tokens expire, but the process holds
          them, every tool in it can read its environment, and the A2A and HTTP clients carry whatever headers the
          application sets. Box keeps the real value out of the workload, but every process in a box can use every
          route, so the box, not the tool, is the credential boundary.
        verified: "2026-11-21"
      - mitigation: AML.M0036
        coverage: partial
        mechanism: >-
          Per-call limits (turns, total_tokens, output_tokens, structured_output_attempts) with limit_* stop
          reasons; model max_tokens; Swarm max_handoffs, max_iterations, execution_timeout and node_timeout
          (TypeScript maxSteps, timeout, nodeTimeout); Graph max node executions and timeouts; cancel_signal
          deadlines
        steps:
          - title: Cap every invocation
            body:
              - >-
                Pass limits={"turns": N, "total_tokens": M} (TypeScript limits: { turns, totalTokens }) on every
                call and handle the limit_* stop reasons.
            url: https://strandsagents.com/docs/user-guide/sdk/agents/lifecycle-controls/
          - title: Bound multi-agent runs in both SDKs
            body:
              - >-
                Set Swarm and Graph step limits and timeouts explicitly; TypeScript maxSteps, timeout and
                nodeTimeout default to Infinity.
            url: https://strandsagents.com/docs/user-guide/sdk/multi-agent/swarm/
          - title: Add a wall-clock deadline
            body:
              - >-
                Pass cancel_signal (TypeScript cancelSignal: AbortSignal.timeout(ms)) so a slow tool cannot hold the
                run open.
            url: https://strandsagents.com/docs/user-guide/sdk/agents/lifecycle-controls/
        note: >-
          Partial by this drawing's rule: the SDK ships turn and token budgets, which go further than a turn limit
          alone, but they apply only when passed, are checked between turns (one model call can overshoot), and do
          not count tool or downstream charges. Python Swarm defaults are finite (20 handoffs, 900 s); TypeScript
          defaults are not. Quotas and cost ceilings on the crossing belong to the AI gateway or the account.
        verified: "2026-11-21"
      - mitigation: cap-agent-egress-control
        coverage: partial
        mechanism: >-
          None in the SDK (web_fetch and a2a_client defer egress control to the encapsulating layer); Strands Box
          egress gateway deciding each net:connect and http:request against policy.dw, with stdio MCP servers
          contained by default (network.contain_egress true)
        steps:
          - title: Run the agent in a box with named hosts only
            body:
              - >-
                Permit net:connect and http:request only for the model endpoint, the package mirror and the task's
                hosts in policy.dw, and add the metadata_hosts and metadata_addresses forbid rules.
            url: https://strandsagents.com/docs/user-guide/box/security/
          - title: Keep servers behind the gateway
            body:
              - >-
                Leave network.contain_egress true on every [mcp.<name>] and [tool.<name>] table; false gives that
                program direct network access with no policy decision.
            url: https://strandsagents.com/docs/user-guide/box/reference/configuration/
          - title: Bound agents outside a box at the network
            body:
              - >-
                Run the process, its tools and MCP servers in a subnet or namespace whose egress allows only the AI
                gateway and the mirror.
            url: https://strandsagents.com/docs/user-guide/sdk/tools/vended-tools/web-fetch/
        note: >-
          Partial on the same finding as the OpenAI Agents SDK and Claude Agent SDK: the SDK itself controls no
          egress, and allowed_endpoints on the A2A client gates only the card fetch. Box enforces a per-host policy
          for an agent run inside it, but it is a 0.x runtime, cloud metadata is blocked only by the two forbid
          rules you add, contain_egress = false bypasses it, and some clients (the AWS SDK for JavaScript) need a
          preload to use its proxy.
        verified: "2026-11-21"
      - mitigation: cap-input-guardrails
        coverage: partial
        mechanism: >-
          BedrockModel guardrail_id / guardrailConfig (Bedrock Guardrails on model input and output, with
          guardrail_intervened stop reason and input redaction); before_invocation and after_tool_call intervention
          handlers (Transform, Deny, Guide) as attach points for the deployer's classifier
        steps:
          - title: Attach a Bedrock guardrail to the model
            body:
              - >-
                Set guardrail_id and guardrail_version on BedrockModel (TypeScript guardrailConfig) for a guardrail
                with the prompt-attack filter on, and leave guardrail_latest_message False.
            url: https://strandsagents.com/docs/user-guide/sdk/model-providers/amazon-bedrock/
          - title: Screen tool results before the model reads them
            body:
              - >-
                Register an intervention whose after_tool_call runs your injection classifier and returns a
                Transform that replaces a flagged result.
            url: https://strandsagents.com/docs/user-guide/sdk/agents/interventions/
        note: >-
          Partial by this drawing's rule: no injection classifier ships in the SDK. Bedrock Guardrails screens the
          request on Bedrock models only, and AWS documents that its prompt-attack filter does not evaluate tool
          results or tool definitions, which is the path this pin sits on; the intervention hooks are attach points
          until a classifier is attached.
        verified: "2026-11-21"
      - mitigation: cap-agent-tracing
        coverage: native
        mechanism: >-
          OpenTelemetry tracing: an agent span per invocation with cycle, model-invoke and tool spans (tool name,
          call id, status, result), token usage, trace_attributes and baggage, exported by StrandsTelemetry /
          setupTracer or an existing global tracer provider to the deployer's OTLP collector
        steps:
          - title: Export spans to your collector
            body:
              - >-
                Install strands-agents[otel], call StrandsTelemetry().setup_otlp_exporter() (TypeScript setupTracer)
                and set OTEL_EXPORTER_OTLP_ENDPOINT to the firm's collector.
            url: https://strandsagents.com/docs/user-guide/sdk/observability-evaluation/traces/
          - title: Correlate runs to the case and principal
            body:
              - >-
                Set trace_attributes with session.id and user.id on each agent, and pass a key predicate to
                setup_baggage_processor so inbound baggage is not stamped wholesale.
            url: https://strandsagents.com/docs/user-guide/sdk/observability-evaluation/traces/
          - title: Mask at the collector
            body:
              - >-
                Add a masking processor at the OpenTelemetry Collector, because Strands does not redact its own
                telemetry.
            url: https://strandsagents.com/docs/user-guide/sdk/safety-security/pii-redaction/
        note: >-
          Native on the rule applied to the OpenAI Agents SDK and Claude Agent SDK: every model call and tool call
          is a span in one trace per invocation, exported to the customer's collector, with no vendor backend.
          Limits: payloads (prompts, system prompt, responses, tool results) are always captured, with no switch to
          drop them; the documented span types are agent, cycle, model and tool, so interventions and session
          writes have no span of their own; identity is whatever the
          application stamps; a processor is an in-process observer, so retention and tamper resistance are the
          collector's. Box adds its own decision log for what it governs.
        verified: "2026-11-21"
      - mitigation: cap-agent-kill-switch
        coverage: partial
        mechanism: >-
          agent.cancel() and per-call cancel_signal (TypeScript cancelSignal AbortSignal), checked while streaming,
          before and after tool execution and during MCP calls; stop_reason "cancelled"; revoking the workload role;
          delete_session(); A2A TypeScript server stopped through serve({ signal })
        steps:
          - title: Cancel the running invocation
            body:
              - >-
                Wire an operator stop and a deadline to cancel_signal or agent.cancel(), and have long-running tools
                poll tool_context.cancel_signal or forward it.
            url: https://strandsagents.com/docs/user-guide/sdk/agents/lifecycle-controls/
          - title: Revoke what it authenticates with
            body:
              - >-
                Remove or deny the workload role's Bedrock and tool permissions so later model and AWS calls fail.
            url: https://strandsagents.com/docs/user-guide/sdk/model-providers/amazon-bedrock/
          - title: Discard what it stored
            body:
              - >-
                Call delete_session() on its session manager and drop pending interrupts so the run cannot be
                resumed.
            url: https://strandsagents.com/docs/user-guide/sdk/agents/session-management/
        note: >-
          Partial by this drawing's rule (in-process cancellation only), as for the OpenAI Agents SDK: the stop is a
          call by the process that holds the agent. Cancellation is cooperative once a tool starts; non-MCP tools
          finish before it is observed, an in-flight MCP request is cancelled best-effort, and in Python calling
          cancel() on an idle agent cancels its next invocation. Revoking the role stops later calls only (delay
          not documented by Strands); quarantine from peers is the deployer's step.
        verified: "2026-11-21"
      - mitigation: cap-retrieval-grounding-checks
        coverage: partial
        mechanism: >-
          MemoryManager recall and injection over attached stores (injection on by default, results labelled with
          the store name in an escaped memory block); BedrockKnowledgeBaseStore scope per tenant and min_score;
          stores read-only unless writable; LLMSteeringHandler as an attach point for checking a tool call against
          the task
        steps:
          - title: Isolate and floor retrieval
            body:
              - >-
                Give each tenant its own BedrockKnowledgeBaseStore scope and set min_score (or max_score) so weak
                matches are not injected.
            url: https://strandsagents.com/docs/user-guide/sdk/memory/bedrock-knowledge-base/
          - title: Control what is injected and written
            body:
              - >-
                Tune or disable injection (trigger, query, format) and keep add_memory and extraction off on agents
                that read untrusted content.
            url: https://strandsagents.com/docs/user-guide/sdk/memory/managing-memory/
        note: >-
          Partial, where the OpenAI Agents SDK is not applicable: Strands owns a retrieval path (memory injection
          into the prompt), and per-tenant scope, score floors and read-only stores are settable. Not covered:
          nothing screens stored entries for poisoning, the default escaping marks memory as data but does not
          verify it, and no runtime check that a response is supported by its sources ships (the Evals SDK's
          faithfulness evaluator runs offline). Ingest trust in the knowledge base is that store's.
        verified: "2026-11-21"
      - mitigation: cap-mcp-tool-integrity
        coverage: partial
        mechanism: >-
          MCP clients declared in code (stdio command or URL); tool_filters allowed and rejected lists (TypeScript
          callback matchers receive the tool); prefixes; Strands Box stdio servers in their own sandbox, started
          only on a shell:spawn permit, with each request an mcp:call policy decision and the configured command
          refused if it changes during a run
        steps:
          - title: Admit only named tools
            body:
              - >-
                Set tool_filters={"allowed": [...]} on every MCPClient (TypeScript toolFilters), naming the approved
                tools exactly.
            url: https://strandsagents.com/docs/user-guide/sdk/tools/mcp-tools/
          - title: Refuse redefined tools in a callback
            body:
              - >-
                In TypeScript, add a rejected callback matcher that hashes the tool's name, description and input
                schema and rejects any that differ from the approved value.
            url: https://strandsagents.com/docs/user-guide/sdk/tools/mcp-tools/
          - title: Contain stdio servers
            body:
              - >-
                Declare each local server as an [mcp.<name>] table in a Strands Box with only the filesystem it
                needs, so it starts only when policy permits its command.
            url: https://strandsagents.com/docs/user-guide/box/reference/configuration/
        note: >-
          Partial by core rule 1, as for the OpenAI Agents SDK: a declared server and a name allowlist admit tools
          but verify nothing a server serves, and the docs describe no hashing, pinning or re-approval when a
          definition changes. The TypeScript callback matcher is the attach point for pinning; Python filters are
          strings and regular expressions. Box pins the program's file identity for one run, not the definitions it
          serves.
        verified: "2026-11-21"
      - mitigation: D3-FA
        coverage: external
        mechanism: >-
          None in the SDK; admission scanning at the package mirror or artifact repository that the sandbox image,
          stdio MCP commands and skills directories are built from
        evidence:
          - title: "Sandbox overview: the SDK runs commands in a sandbox you provision and scans nothing (2026-11-21)"
            url: https://strandsagents.com/docs/user-guide/sdk/sandbox/
          - title: "Attach and invoke tools: tool files in ./tools/ are executed if auto-loading is on (2026-11-21)"
            url: https://strandsagents.com/docs/user-guide/sdk/tools/using-tools/
        note: >-
          External (package firewall or artifact-repository scanning at the mirror), as for the OpenAI Agents SDK:
          the SDK scans nothing it loads or its agents install. Stdio MCP servers start from the command the
          application gives (the docs' examples use uvx ...@latest), skills load from directories, and a
          sandboxed shell installs from whatever registry its network allows. Integration points: point the sandbox
          image and Box egress policy at the scanning mirror only, and pin MCP server versions and the SDK in the
          lockfile.
        verified: "2026-11-21"
      - mitigation: D3-EI
        coverage: partial
        mechanism: >-
          Agent sandbox parameter: DockerSandbox (docker exec into a running container you provision, with user
          and working_dir) or SshSandbox (key-based, host-key checking, SSH option allowlist) for sandbox_shell,
          sandbox_file_editor, shell, python_repl and file tools; no sandbox means the host; Strands Box adds
          operating-system enforcement for the whole agent
        steps:
          - title: Pass a real sandbox
            body:
              - >-
                Construct the agent with sandbox=DockerSandbox("<container>", user="1000:1000") (or SshSandbox); in
                TypeScript pass sandbox: false only for trusted local development.
            url: https://strandsagents.com/docs/user-guide/sdk/sandbox/available-sandboxes/
          - title: Confine the whole agent
            body:
              - >-
                Run the agent under Strands Box with [agent.filesystem] grants limited to its workspace and a
                policy that permits only the programs it needs.
            url: https://strandsagents.com/docs/user-guide/box/security/
        note: >-
          Partial on the core sandbox rule (as on toolOpenaiAgentsSdk and toolClaudeAgentSdk): the SDK offers
          isolation backends, but omitting sandbox runs command and file tools on the host with the process's full
          permissions, and Strands harness defaults to a local sandbox on the host. Inside a Docker sandbox: the
          sandbox tools; the container's image, mounts and network are the deployer's. Outside: the loop, every
          custom tool, MCP servers and the TypeScript bash tool, which spawns bash on the host.
        verified: "2026-11-21"
    # The security-relevant settings, each with the baseline value (data/tooling/BASELINE.md). The SDK runs inside
    # the application, so every row is a class, parameter, environment variable or file key the deployer sets;
    # identity for model calls is the AWS account's. Verified 2026-11-21 against strandsagents.com (index.md pages).
    settings:
      - id: humanInTheLoop
        name: "HumanInTheLoop"
        where: "Agent(interventions=[HumanInTheLoop(allowed_tools=[...])]); Strands harness create_harness(interventions=\"ask\")"
        setVia: [code]
        area: tools
        default: "No intervention; every tool call runs (Strands harness too)"
        recommended: "HumanInTheLoop with allowed_tools listing only read-only tools, answered through interrupt/resume or an ask callback to the approver's UI"
        value: "Every non-read-only tool waits for a person"
        why: "A consequential call stops with its tool name and arguments until a person approves or rejects that interrupt, instead of running on the model's choice."
        mitigations: [AML.M0029]
        url: https://strandsagents.com/docs/user-guide/sdk/agents/interventions/human-in-the-loop/
        verified: "2026-11-21"
      - id: hitlAlwaysAsk
        name: "allowed_tools negation (\"!tool_name\") and classifier"
        where: "HumanInTheLoop(allowed_tools=[\"read_file\", \"!delete_files\"], classifier=...) (TypeScript allowedTools)"
        setVia: [code]
        area: tools
        default: "No classifier (every non-allowed call asks); no negated tools"
        recommended: '"!name" on every irreversible or money-moving tool; no "auto" mode in production; a classifier only for low-impact tools, pinned with classifier=True or your own config'
        value: "!name on irreversible tools; no auto mode"
        why: "A negated tool always prompts and cannot be trusted, so a classifier that rates a risky call safe, or an auto-mode change in a minor release, cannot skip it."
        mitigations: [AML.M0029]
        url: https://strandsagents.com/docs/user-guide/sdk/agents/approve-before-acting/
        verified: "2026-11-21"
      - id: hitlEnableTrust
        name: "enable_trust"
        where: "HumanInTheLoop(enable_trust=...) (TypeScript enableTrust)"
        setVia: [code]
        area: tools
        default: "False"
        recommended: "False on any agent with consequential tools"
        value: "Off (keep the default)"
        why: "A \"trust\" answer approves that tool for the rest of the agent's life, so one approval would cover every later call with different arguments."
        mitigations: [AML.M0029]
        url: https://strandsagents.com/docs/user-guide/sdk/agents/interventions/human-in-the-loop/
        verified: "2026-11-21"
      - id: cedarAuthorization
        name: "CedarAuthorization"
        where: "strands.vended_interventions.cedar.CedarAuthorization(policies=\"./policies/agent.cedar\", tools=[...]); registered first in interventions"
        setVia: [code, configFile]
        area: tools
        default: "Not attached; no policy decides tool calls"
        requires: "strands-agents[cedar] in Python"
        recommended: "A reviewed .cedar file permitting each tool per role and argument bound, validated against the tool definitions, registered before HumanInTheLoop"
        value: "Default-deny Cedar file, before approval"
        why: "A call no policy permits is denied outside the model before it runs and before any approver or classifier sees it; reload() swaps policies atomically."
        mitigations: [cap-agent-action-policy-enforcement, D3-APA, AML.M0028]
        url: https://strandsagents.com/docs/user-guide/sdk/agents/interventions/cedar-authorization/
        verified: "2026-11-21"
      - id: cedarPrincipalResolver
        name: "principal_resolver, context_enricher and on_error"
        where: "CedarAuthorization(principal_resolver=..., context_enricher=..., on_error=\"deny\") (TypeScript principalResolver, contextEnricher, onError)"
        setVia: [code]
        area: identity
        default: 'Anonymous principal; on_error "throw"'
        recommended: 'Resolve the authenticated caller from invocation_state (None when absent), enrich role and environment from it, on_error "deny"; never "proceed"'
        value: "Caller from invocation_state; on_error deny"
        why: "Every call is decided for the real requester, a request with no identity is denied outright, and a failing resolver blocks the call instead of skipping the check."
        mitigations: [D3-APA, cap-agent-action-policy-enforcement]
        url: https://strandsagents.com/docs/user-guide/sdk/agents/interventions/cedar-authorization/
        verified: "2026-11-21"
      - id: invocationStateGrant
        name: "invocation_state"
        where: "agent(prompt, invocation_state={...}) (TypeScript invoke(prompt, { invocationState })); read in tools through ToolContext"
        setVia: [code]
        area: identity
        default: "{}"
        recommended: "The authenticated principal, tenant and its scoped token on every call; tools call data sources with that token, never the process's credentials"
        value: "Caller's identity and scoped token per call"
        why: "Tools and policy act for the requester without the grant entering the model's context, so the model cannot read or rewrite it."
        mitigations: [D3-APA, cap-data-access-governance, D3-CTS]
        url: https://strandsagents.com/docs/user-guide/sdk/agents/state/
        verified: "2026-11-21"
      - id: toolInputSchemas
        name: "@tool type hints / tool() inputSchema"
        where: "Python @tool with typed parameters; TypeScript tool({ inputSchema: z.object(...) })"
        setVia: [code]
        area: tools
        default: "Python validates via Pydantic; TypeScript JSON Schema is not validated"
        recommended: "Typed, constrained parameters on every action; Zod schemas in TypeScript, never a bare JSON Schema object"
        value: "Zod or typed schemas on every tool"
        why: "Malformed or out-of-range arguments are refused before the function runs; a plain JSON Schema passes the model's input through unchecked."
        mitigations: [AML.M0028]
        url: https://strandsagents.com/docs/user-guide/sdk/tools/custom-tools/
        verified: "2026-11-21"
      - id: explicitToolList
        name: "tools, load_tools_from_directory and builtin_tools"
        where: "Agent(tools=[...], load_tools_from_directory=False); Strands harness create_harness(builtin_tools=[...])"
        setVia: [code]
        area: tools
        default: "Directory loading off; harness enables shell, read, write, edit, web_fetch, web_search, programmatic_tool_caller, subagent"
        recommended: "An explicit tools list per agent, directory loading left off, and the harness built-ins narrowed to the tools the workflow needs"
        value: "Explicit list; harness built-ins narrowed"
        why: "Only reviewed tools are offered; with directory loading on, any Python file written to ./tools/ is executed and reloaded on change."
        mitigations: [cap-agent-tool-registry, AML.M0028]
        url: https://strandsagents.com/docs/user-guide/sdk/tools/using-tools/
        verified: "2026-11-21"
      - id: mcpToolFilters
        name: "tool_filters"
        where: "MCPClient(..., tool_filters={\"allowed\": [...], \"rejected\": [...]}) (TypeScript toolFilters)"
        setVia: [code]
        area: tools
        default: "Every tool the server lists"
        recommended: "The approved tool names for each server in allowed; in TypeScript a rejected callback that refuses definitions whose hash changed"
        value: "Approved tool names only"
        why: "Tools a server adds or renames later are never offered to the agent; allowed applies first and rejected wins when both match."
        mitigations: [cap-mcp-tool-integrity, cap-agent-tool-registry, AML.M0028]
        url: https://strandsagents.com/docs/user-guide/sdk/tools/mcp-tools/
        verified: "2026-11-21"
      - id: mcpClientAuth
        name: "auth / headers (MCPClient) and ${VAR} placeholders"
        where: "MCPClient(url=..., auth={\"client_id\": ..., \"client_secret\": ..., \"scopes\": [...]}); MCPClient.load_servers({... \"${OAUTH_CLIENT_SECRET}\" ...})"
        setVia: [code, configFile]
        area: identity
        default: "No authentication"
        recommended: "OAuth client credentials per server and per agent, read from the environment or secret store through ${VAR} placeholders; tokens in Authorization headers, never URLs"
        value: "Per-server OAuth client, secrets from env"
        why: "Each server gets its own short-lived token, refreshed by the client, and no secret is written into configuration or code."
        mitigations: [D3-CH, D3-AA, D3-CTS]
        url: https://strandsagents.com/docs/user-guide/sdk/tools/mcp-transports/
        verified: "2026-11-21"
      - id: subagentAxes
        name: "make_subagent tools axis and builder"
        where: "make_subagent(tools=Fixed([...]), builder=...) (TypeScript makeSubagent({ tools: new Fixed([...]) })); same axes on the swarm and graph tools"
        setVia: [code]
        area: tools
        default: "Child inherits the parent's tools, model and interventions, not its hooks or plugins"
        recommended: "Fixed tool subsets per child; any custom builder passes the parent's interventions; approvals and policy as interventions, not hooks"
        value: "Fixed tool subset; interventions carried over"
        why: "The model cannot give a child tools it should not have, and a delegated call meets the same approval and policy, which a hook-based gate would not."
        mitigations: [AML.M0028, AML.M0029, cap-agent-action-policy-enforcement]
        url: https://strandsagents.com/docs/user-guide/sdk/tools/vended-tools/
        verified: "2026-11-21"
      - id: invocationLimits
        name: "limits and max_tokens"
        where: "agent(prompt, limits={\"turns\": N, \"total_tokens\": M, \"output_tokens\": K}) (TypeScript limits); BedrockModel(max_tokens=...)"
        setVia: [code]
        area: tools
        default: "No limits passed; max_tokens is the model's output limit"
        recommended: "Turns and total tokens sized to the workflow on every call, and an explicit max_tokens on the model"
        value: "Turn and token caps on every call"
        why: "A looping run ends with a limit_* stop reason instead of spending model calls and tool actions without bound; limits are checked between turns."
        mitigations: [AML.M0036]
        url: https://strandsagents.com/docs/user-guide/sdk/agents/lifecycle-controls/
        verified: "2026-11-21"
      - id: multiAgentLimits
        name: "Swarm and Graph limits"
        where: "Swarm(max_handoffs, max_iterations, execution_timeout, node_timeout, repetitive_handoff_detection_window) / TypeScript maxSteps, timeout, nodeTimeout; GraphBuilder.set_max_node_executions, set_execution_timeout"
        setVia: [code]
        area: tools
        default: "Python Swarm 20 handoffs, 900 s; TypeScript maxSteps and timeouts Infinity; detection off"
        recommended: "Explicit step limits and total and per-node timeouts in both SDKs, with repetitive handoff detection on"
        value: "Finite steps and timeouts; ping-pong detection"
        why: "A swarm or graph that loops between agents stops at a known bound instead of running until the process dies."
        mitigations: [AML.M0036]
        url: https://strandsagents.com/docs/user-guide/sdk/multi-agent/swarm/
        verified: "2026-11-21"
      - id: cancelSignal
        name: "cancel_signal / agent.cancel()"
        where: "agent(prompt, cancel_signal=threading.Event()) or agent.cancel(); TypeScript invoke(prompt, { cancelSignal: AbortSignal.timeout(ms) })"
        setVia: [code]
        area: tools
        default: "No deadline"
        recommended: "A per-request deadline plus an operator stop wired to the signal; long-running tools poll or forward it"
        value: "Deadline and operator stop on every run"
        why: "A misbehaving run stops at the next checkpoint with stop_reason \"cancelled\", and an in-flight MCP request is cancelled, without killing the process."
        mitigations: [cap-agent-kill-switch, AML.M0036]
        url: https://strandsagents.com/docs/user-guide/sdk/agents/lifecycle-controls/
        verified: "2026-11-21"
      - id: bedrockGuardrail
        name: "guardrail_id / guardrailConfig"
        where: "BedrockModel(guardrail_id=..., guardrail_version=..., guardrail_redact_output=..., guardrail_latest_message=False) (TypeScript guardrailConfig)"
        setVia: [code, cloudPolicy]
        area: data
        default: "No guardrail; input redaction on and output redaction off when one is set"
        requires: "Amazon Bedrock models"
        recommended: "A published guardrail version with the prompt-attack and sensitive-information filters, the whole conversation evaluated, output redaction on"
        value: "Versioned guardrail, whole conversation, redaction"
        why: "Prompt attacks and sensitive data in requests and replies are blocked or redacted at the model; the prompt-attack filter does not read tool results."
        mitigations: [cap-input-guardrails, cap-sensitive-data-redaction]
        url: https://strandsagents.com/docs/user-guide/sdk/model-providers/amazon-bedrock/
        verified: "2026-11-21"
      - id: toolResultScreening
        name: "after_tool_call (InterventionHandler)"
        where: "A custom InterventionHandler whose after_tool_call returns Transform(apply=...), registered in interventions with on_error \"deny\""
        setVia: [code]
        area: tools
        default: "None"
        recommended: "Your injection classifier on every tool that returns external content, replacing flagged results before the next model call"
        value: "Classifier on every external-content tool"
        why: "A web page, email or file carrying injected instructions is replaced before the model reasons over it, the path a Bedrock guardrail does not screen."
        mitigations: [cap-input-guardrails]
        url: https://strandsagents.com/docs/user-guide/sdk/agents/interventions/
        verified: "2026-11-21"
      - id: agentSandbox
        name: "sandbox"
        where: "Agent(sandbox=DockerSandbox(\"<container>\", user=\"1000:1000\", working_dir=...)) or SshSandbox(...); TypeScript sandbox"
        setVia: [code]
        area: tools
        default: "None (host, full process permissions); harness uses a local sandbox on the host"
        recommended: "A DockerSandbox on a locked-down container (non-root user, no secrets mounted, restricted network) for any agent with shell, file or REPL tools"
        value: "Docker sandbox, non-root, for shell and files"
        why: "Model-written commands and code run in the container, not on the host where the agent's credentials and files live."
        mitigations: [D3-EI]
        url: https://strandsagents.com/docs/user-guide/sdk/sandbox/available-sandboxes/
        verified: "2026-11-21"
      - id: boxEgressPolicy
        name: "policy.dw net:connect / http:request permits and contain_egress"
        where: "Strands Box policy.dw (permit and forbid rules); box.toml [mcp.<name>] / [tool.<name>] network.contain_egress"
        setVia: [configFile]
        area: network
        default: "Nothing permitted until policy allows it; contain_egress true for stdio servers"
        requires: "Strands Box (0.x, developer preview) on macOS Apple silicon or Linux"
        recommended: "Permits for the model endpoint, the package mirror and the task's hosts only, plus the metadata_hosts and metadata_addresses forbid rules; contain_egress left true"
        value: "Named hosts only; metadata forbids; contained"
        why: "The agent, its tools and its MCP servers reach only listed destinations, and cloud metadata and private addresses are refused at the gateway."
        mitigations: [cap-agent-egress-control, D3-EI]
        url: https://strandsagents.com/docs/user-guide/box/security/
        verified: "2026-11-21"
      - id: boxEgressSecrets
        name: "[egress.<name>] secret.ref and secret.inject"
        where: "Strands Box box.toml [egress.<name>] destinations, secret.ref (\"env://NAME\" or \"aws://PROFILE\"), secret.inject"
        setVia: [configFile]
        area: identity
        default: 'secret.inject "phantom"'
        requires: "Strands Box (0.x, developer preview)"
        recommended: "Each credential bound to its own destinations, injected as a phantom placeholder; tools that must not share a credential run in a separate box"
        value: "Per-destination phantom credentials"
        why: "The workload holds only a placeholder, and the gateway adds the real credential only to permitted requests to that destination."
        mitigations: [D3-CH, D3-CTS, cap-agent-egress-control]
        url: https://strandsagents.com/docs/user-guide/box/guides/network-and-credentials/
        verified: "2026-11-21"
      - id: otlpExport
        name: "StrandsTelemetry().setup_otlp_exporter() / OTEL_EXPORTER_OTLP_ENDPOINT"
        where: "strands.telemetry.StrandsTelemetry (TypeScript setupTracer) and the OTEL_EXPORTER_OTLP_* environment variables"
        setVia: [code, configFile]
        area: audit
        default: "No exporter unless one is set up or a global tracer provider exists"
        requires: "strands-agents[otel] in Python"
        recommended: "OTLP export to the firm's collector, which masks prompt and tool-result attributes before storage, because Strands does not redact them"
        value: "OTLP to the firm's collector, masked there"
        why: "Every model call and tool call is kept as a span in your own store; without masking, prompts and tool results land there in full."
        mitigations: [cap-agent-tracing, cap-sensitive-data-redaction]
        url: https://strandsagents.com/docs/user-guide/sdk/observability-evaluation/traces/
        verified: "2026-11-21"
      - id: traceAttributes
        name: "trace_attributes and setup_baggage_processor"
        where: "Agent(trace_attributes={\"session.id\": ..., \"user.id\": ...}); StrandsTelemetry().setup_baggage_processor(predicate) (TypeScript traceAttributes, baggageProcessor)"
        setVia: [code]
        area: audit
        default: "No attributes; baggage not stamped"
        recommended: "session.id, user.id and tenant on every agent; a baggage processor only with a key predicate"
        value: "Case and principal on every span"
        why: "Each span ties to a case and requester for the SIEM; without a predicate, every inbound baggage entry would be stamped onto every span."
        mitigations: [cap-agent-tracing]
        url: https://strandsagents.com/docs/user-guide/sdk/observability-evaluation/traces/
        verified: "2026-11-21"
      - id: sessionManager
        name: "SnapshotSessionManager / SessionManager"
        where: "Agent(agent_id=..., session_manager=SnapshotSessionManager(session_id=..., storage=S3Storage(bucket, prefix=...))); TypeScript SessionManager({ sessionId, storage })"
        setVia: [code]
        area: data
        default: "None; Python falls back to LocalFileStorage(\"./.strands/\") when a manager has no storage"
        recommended: "One session per case with a unique agent_id, on S3Storage or a private directory, delete_session() at case close; Python 1.48.0 or later for FileSessionManager"
        value: "One session per case, private storage"
        why: "One case's history never seeds another's run, session files cannot be read or redirected by other local users, and history is deleted when the case ends."
        mitigations: [AML.M0031]
        url: https://strandsagents.com/docs/user-guide/sdk/agents/session-management/
        verified: "2026-11-21"
      - id: memoryStores
        name: "MemoryManager stores (scope, writable, extraction)"
        where: "MemoryManager(stores=[BedrockKnowledgeBaseStore(name, scope=..., writable=..., access_control_list=..., min_score=...)]); Strands harness memory"
        setVia: [code]
        area: data
        default: "Recall and injection on once a store is attached; writes opt-in; harness memory on"
        recommended: "One scoped store per tenant, read-only and with extraction off on agents that read untrusted content; harness memory=False unless a scoped store is passed"
        value: "Per-tenant scope; read-only where input is untrusted"
        why: "Injected content cannot steer one tenant's agent into writing durable memories that later runs, or other tenants, read back as trusted context."
        mitigations: [AML.M0031, cap-retrieval-grounding-checks, cap-data-access-governance]
        url: https://strandsagents.com/docs/user-guide/sdk/memory/bedrock-knowledge-base/
        verified: "2026-11-21"
      - id: a2aAgentFactory
        name: "agent_factory and max_contexts"
        where: "A2AServer(agent_factory=..., max_contexts=...) (TypeScript A2AExpressServer({ agentFactory, maxContexts }))"
        setVia: [code]
        area: data
        default: "max_contexts 1000; the single shared agent option is deprecated"
        recommended: "agent_factory returning a fresh agent per context_id, with its own session manager; strands-agents 1.43.0 or @strands-agents/sdk 1.5.0 or later"
        value: "Fresh agent per context_id"
        why: "Callers in different A2A contexts never read or steer each other's history; context_id is still not an authentication boundary."
        mitigations: [AML.M0031, D3-APA]
        url: https://strandsagents.com/docs/user-guide/sdk/multi-agent/agent-to-agent/
        verified: "2026-11-21"
      - id: a2aServerAuth
        name: "userBuilder / to_fastapi_app middleware, host"
        where: "TypeScript A2AExpressServer({ userBuilder, host }); Python A2AServer(host=...).to_fastapi_app() with authentication middleware"
        setVia: [code]
        area: identity
        default: "No authentication; host 127.0.0.1"
        recommended: "Every A2A request authenticated to a calling agent identity (token bound to this agent and skill) before it reaches the server; host left on loopback behind the gateway"
        value: "Authenticated caller on every A2A request"
        why: "Only identified peers can start tasks or answer interrupts, so knowing a context_id or the URL is not enough to reach the agent."
        mitigations: [D3-AA, D3-APA]
        url: https://strandsagents.com/docs/user-guide/sdk/multi-agent/a2a-server-configuration/
        verified: "2026-11-21"
      - id: a2aClientEndpoints
        name: "allowed_endpoints / client_config"
        where: "make_a2a_client(allowed_endpoints=[url, (url, ClientConfig(...))]) (TypeScript makeA2AClient({ allowedEndpoints })); A2AAgent(client_config=...)"
        setVia: [code]
        area: identity
        default: "allowed_endpoints required; no authentication"
        recommended: "Only approved peers, each with a credential issued for that peer and a timeout; network egress control alongside"
        value: "Approved peers, each with its own credential"
        why: "The model can contact only named agents, and each peer receives only its own token; the list gates the card fetch, not where the card points."
        mitigations: [cap-agent-tool-registry, D3-CTS, D3-AA]
        url: https://strandsagents.com/docs/user-guide/sdk/tools/vended-tools/a2a-client/
        verified: "2026-11-21"
      - id: bedrockCredentials
        name: "boto_session / api_key (BedrockModel)"
        where: "BedrockModel(boto_session=..., region_name=...) or the default AWS credential chain; TypeScript region, clientConfig, apiKey"
        setVia: [code, cloudPolicy]
        area: identity
        default: "Default AWS credential chain"
        recommended: "A workload IAM role per agent workload resolved from the chain, least-privilege Bedrock permissions; no access keys or Bedrock API key in code"
        value: "Workload IAM role; no keys in code"
        why: "The agent holds expiring role credentials scoped to its workload, revocable by removing the role's permissions, instead of a long-lived key."
        mitigations: [D3-CH, D3-AA, cap-agent-kill-switch]
        url: https://strandsagents.com/docs/user-guide/sdk/model-providers/amazon-bedrock/
        verified: "2026-11-21"
      - id: evalsFailOn
        name: "strands-evals run --fail-on"
        where: "strands-evals run <experiment.json> --agent module:factory --fail-on any|threshold:0.X (strands-agents-evals)"
        setVia: [apiCli]
        area: audit
        default: '--fail-on any'
        requires: "Python (strands-agents-evals)"
        recommended: "Run in the release pipeline with --fail-on any or a threshold, plus a red-team experiment; never --exit-zero on the release job"
        value: "Release blocked on failures; no --exit-zero"
        why: "A prompt, model or tool change that regresses quality or lets an attack through fails the build instead of shipping."
        mitigations: [cap-staged-rollout-gate]
        url: https://strandsagents.com/docs/user-guide/evals-sdk/cli/run/
        verified: "2026-11-21"
