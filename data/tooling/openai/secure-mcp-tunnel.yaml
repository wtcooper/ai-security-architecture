      - mitigation: D3-CH
        coverage: native
        mechanism: >-
          Restricted runtime API key (Tunnels Read + Use) read from an env: or file: reference; key expiry and
          an organisation- or project-level maximum API key lifetime; optional control-plane mTLS binding;
          revocation on the Platform API keys page or the Admin API
        steps:
          - title: Mint a least-privilege runtime key
            body:
              - >-
                On the Platform API keys page create a Restricted key with Tunnels Read + Use and export it as
                CONTROL_PLANE_API_KEY; keep OPENAI_ADMIN_KEY and All keys out of the long-lived daemon.
            url: https://github.com/openai/tunnel-client/blob/master/docs/permissions.md
          - title: Keep the key out of argv and profiles
            body:
              - >-
                Set control_plane.api_key to file:/run/secrets/... (or env:) mounted from the secrets manager;
                tunnel-client resolves it at startup and redacts API keys from its support export.
            url: https://github.com/openai/tunnel-client/blob/master/docs/configuration.md
          - title: Cap the key's lifetime
            body:
              - >-
                Enforce a maximum API key lifetime at organisation or project level in Platform settings so new
                runtime keys must expire; rotate by creating the replacement, restarting tunnel-client with it,
                then deleting the old key.
            url: https://developers.openai.com/api/docs/guides/production-best-practices
          - title: Drop the static key on AWS
            body:
              - >-
                Where tunnel-client runs on AWS, set control_plane.aws_identity_provider_id and
                aws_service_account_id (a project service account with Tunnels Read + Use) and leave the static
                API key unset; the client exchanges its role for a short-lived token kept in memory.
            url: https://raw.githubusercontent.com/openai/tunnel-client/master/docs/configuration.md
          - title: Bind the key to a certificate
            body:
              - >-
                Activate a trust anchor at Organization settings > Security > Mutual TLS for the key's
                organisation or project and give tunnel-client control_plane.client_cert and client_key; a
                request with the key but no accepted certificate fails with certificate_required.
            url: https://developers.openai.com/api/docs/guides/mutual-tls
          - title: Give each deployment its own runtime identity
            body:
              - >-
                On the Platform API keys page create a Restricted key with Tunnels Read + Use for each
                tunnel-client deployment, owned by a principal in the tunnel-runtime group, and never run the
                daemon on an admin key or an All key.
            url: https://github.com/openai/tunnel-client/blob/master/docs/permissions.md
          - title: Authenticate the tunnel to our server
            body:
              - >-
                Where the MCP server should see the tunnel as a caller, set MCP_CLIENT_CERT and MCP_CLIENT_KEY
                (MCP-side mTLS, HTTP bindings only) — a static credential that identifies the tunnel, not the
                user.
            url: https://github.com/openai/tunnel-client/blob/master/docs/configuration.md
        note: >-
          Native by the drawing rule for a tunnel credential: it is scoped (a Restricted key with Tunnels Read +
          Use), held as a reference to the host's secret store rather than in the profile, rotatable under an
          enforced maximum lifetime, bindable to a client certificate so the key alone is not enough, and
          revocable centrally without redeploying — delete the key on the API keys page or through the Admin
          API, remove the principal's Tunnels Use, or delete the tunnel. Boundaries: the key is a bearer token
          sent to OpenAI on every poll and readable by whoever can read the host's environment or secret file;
          tunnel-client does not encrypt it (custody is the Kubernetes Secret, systemd credential or secrets
          manager the operator uses) and still accepts a literal value for compatibility; the reference is
          resolved at startup, so rotation needs a restart, and stdio bindings allow one instance per tunnel ID
          (a brief gap); the maximum lifetime binds only keys created after it is set; the propagation delay of
          a revocation is not documented. Other credentials on the path: a connector-forwarded Authorization
          bearer crosses OpenAI (strict-local-auth is unsupported), while MCP_EXTRA_HEADERS and MCP-side mTLS
          keep a backend credential on the final hop. The same rule reads Anthropic's MCP tunnel credentials
          (tokenVersion rotation, Tunnels API key revoked after setup) as meeting the tunnel test. A key created
          without an expiry, under no enforced maximum, lives until revoked, so a forgotten tunnel keeps polling
          until its key is revoked or the tunnel is deleted. By default the tunnel does not authenticate to our
          MCP server at all; MCP-side mTLS or a static MCP_EXTRA_HEADERS value are opt-in and static.
        verified: "2026-10-30"
        migration:
          from:
            - capabilitySecretsManagement
          reviewRequired: false
          original:
            - capability: capabilitySecretsManagement
              coverage: partial
              mechanism: >-
                CONTROL_PLANE_API_KEY from the environment; rotation and revocation in Platform tunnel settings
              steps:
                - title: Rotate the runtime key from Platform settings
                  body:
                    - All creation, rotation and revocation happens at
                      platform.openai.com/settings/organization/tunnels.
                  url: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels
              note: >-
                The control-plane key is a long-lived stored secret in the host environment, readable by
                anyone with access to the tunnel-client process; rotation is manual in Platform settings.
              verified: 2026-09-10
      - mitigation: AML.M0028
        coverage: partial
        mechanism: >-
          Tunnel associations to named Platform organisations and ChatGPT workspaces; Tunnels Use held by a
          named group; tunnel-client exposes only its configured MCP bindings, allowlisted poll channels and
          labelled Harpoon targets
        steps:
          - title: Associate each tunnel narrowly
            body:
              - >-
                In Platform tunnel settings associate the tunnel only with the ChatGPT workspace and Platform
                organisations that should list or call it; each association is a context that can reach the
                server.
            url: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels
          - title: Hold Use in one group
            body:
              - >-
                Grant Tunnels Read + Use through a custom organisation role assigned to the group that runs
                tunnel-client or attaches tunnels to apps, and keep Manage with tunnel managers.
            url: https://developers.openai.com/api/docs/guides/rbac
          - title: Expose only the intended servers
            body:
              - >-
                Configure only the intended --mcp.server-url or --mcp-command bindings, set
                control_plane.poll_channels as an allowlist (omitted channels are disabled), and register
                Harpoon targets by label so callers cannot choose hosts.
            url: https://github.com/openai/tunnel-client/blob/master/docs/configuration.md
        note: >-
          Partial by the rule: server-level admission is admin-set and enforced — a tunnel serves only its
          associated contexts, only principals with Tunnels Use can run or attach it, and tunnel-client reaches
          only its configured bindings and labelled Harpoon targets — but there is no per-tool or read/write
          scoping, because tunnel-client forwards JSON-RPC unchanged; per-tool and per-group scoping belongs to
          the MCP gateway behind it and to ChatGPT's plugin and action controls (toolChatgptDesktop). Caller
          authority is preserved: the connector's Authorization header goes only to the configured MCP origin,
          and OpenAI-internal, IP-forwarding and hop-by-hop headers are dropped; a static MCP_EXTRA_HEADERS
          credential adds the tunnel's own authority instead. Harpoon also auto-registers OAuth endpoints
          discovered from the MCP server's metadata when their hosts pass the private-host filters (loopback,
          RFC 1918 and ULA by default).
        verified: "2026-09-25"
        migration:
          from:
            - capabilityToolPermissionScoping
          reviewRequired: false
          original:
            - capability: capabilityToolPermissionScoping
              coverage: partial
              mechanism: >-
                Tunnel association to specific organisations or workspaces; Harpoon exposes only configured
                targets by label
              note: Tool-level scoping belongs to the MCP server and the ChatGPT app's action controls.
              steps:
                - title: Scope discovery
                  body:
                    - Associate the tunnel only with the organisations or workspaces that should see it;
                      Harpoon is bounded to configured targets, not a general proxy.
                  url: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels
              verified: 2026-09-10
      - mitigation: cap-data-access-governance
        coverage: external
        mechanism: >-
          The MCP server or MCP gateway behind the tunnel enforces the user's entitlements from the connector
          Authorization header that tunnel-client forwards
        evidence:
          - title: tunnel-client architecture — OAuth-protected MCP (checked 2026-09-25)
            url: https://github.com/openai/tunnel-client/blob/master/docs/architecture.md
          - title: Secure MCP Tunnel — OAuth
            url: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels
        note: >-
          The tunnel decides nothing about which records come back; the MCP server behind it does. tunnel-client
          forwards the connector's Authorization bearer only to the configured MCP origin, so retrieval runs
          with the user's entitlements when the MCP server validates that token against the source, and OAuth
          discovery travels through the tunnel so the server can stay private. A static MCP_EXTRA_HEADERS value
          or MCP-side client certificate authenticates the tunnel, not the user — used alone it turns retrieval
          into a service-principal read. Corpus scoping is the MCP server's or gateway's; the admin-granted
          corpus of the pin is toolChatgptDesktop's.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityDataAccessGovernance
          reviewRequired: false
          original:
            - capability: capabilityDataAccessGovernance
              coverage: external
              mechanism: The MCP server behind the tunnel enforces per-user access
              note: >-
                The tunnel forwards the caller's identity context only insofar as the MCP protocol carries it;
                whether retrieval is delegated or service-owned is decided by how the MCP server behind the
                tunnel authenticates callers.
              evidence:
                - title: Vendor docs index, reviewed for the integration point (2026-09-10)
                  url: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels
              verified: 2026-09-10
      - mitigation: cap-agent-tool-registry
        coverage: partial
        mechanism: >-
          Platform tunnel settings and GET /v1/tunnels list every tunnel with its organisation and workspace
          associations; tunnel.created / updated / deleted audit events record who changed them
        steps:
          - title: Treat the tunnel list as the register
            body:
              - >-
                List tunnels in Platform tunnel settings or with tunnel-client admin tunnels list (admin key,
                Tunnels Manage) and record in your registry the MCP server and owner behind each tunnel_id.
            url: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels
          - title: Reconcile changes from the audit log
            body:
              - >-
                Pull tunnel.created, tunnel.updated and tunnel.deleted events from GET
                /v1/organization/audit_logs (event_types filter) to catch tunnels added outside the process.
            url: https://developers.openai.com/api/reference/resources/admin/subresources/organization/subresources/audit_logs/methods/list
          - title: Read what sits behind a tunnel
            body:
              - >-
                On the tunnel host, /health/mcp reports the MCP server's self-reported name, version and tool
                names (loopback only) for the registry's capability descriptor.
            url: https://github.com/openai/tunnel-client/blob/master/docs/health.md
        note: >-
          Partial by the rule (list plus enforcement, but no owner or approval record): only a tunnel created
          under Tunnels Manage and associated with the workspace can be selected, so the list is enforced by
          construction, but it records only name, description and associations (owner is the audit-log actor,
          and there is no approval state), and it registers the tunnel, not the MCP server or tools behind it.
          The ChatGPT apps built on a tunnel are listed in ChatGPT (toolChatgptDesktop). Tunnels created in a
          personal Platform organisation never appear in the corporate list (cap-shadow-ai-discovery). A tunnel
          can be associated with several organisations or workspaces, and every association can reach the private
          server, so review associations as part of the register.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAgentRegistry
          reviewRequired: false
          original:
            - capability: capabilityAgentRegistry
              coverage: native
              mechanism: Platform tunnel settings list every tunnel with its associations; tunnel.* audit events
              steps:
                - title: Treat tunnel settings as the register
                  body:
                    - Every tunnel endpoint is created and listed in Platform tunnel settings and its lifecycle appears as
                      tunnel.created / updated / deleted in audit logs.
                  url: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels
              note: >-
                A register of tunnels and their associations, which is the inventory relevant to this product;
                the MCP servers behind them are registered where they are approved, not here.
              verified: 2026-09-10
      - mitigation: cap-shadow-ai-discovery
        coverage: external
        mechanism: >-
          None in the product; endpoint inventory and the egress proxy find unregistered tunnel-clients by
          binary, User-Agent and the tunnel ID in the poll path
        evidence:
          - title: tunnel-client README — What it does (control-plane headers; checked 2026-09-25)
            url: https://github.com/openai/tunnel-client
          - title: Secure MCP Tunnel — personal Platform organisations
            url: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels
        note: >-
          Nothing in the product lists tunnels or tunnel-clients outside the corporate organisation, and the
          guide supports tunnels in personal Platform organisations. Integration point for SSE/CASB and EDR:
          tunnel-client identifies itself on every control-plane call with User-Agent oai-tunnel-client/<version>
          plus X-Tunnel-Client-Name, X-Tunnel-Client-Version and X-Tunnel-Client-Instance-Id headers and polls
          GET /v1/tunnels/{tunnel_id}/poll, so an inspecting proxy can extract tunnel IDs and reconcile them
          against the organisation's tunnel list; endpoint inventory finds the tunnel-client and bundled
          cloudflared binaries.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityShadowAiDiscovery
          reviewRequired: false
          original:
            - capability: capabilityShadowAiDiscovery
              coverage: external
              mechanism: None; the tunnel register shows only sanctioned servers
              evidence:
                - title: Vendor docs index, reviewed for the integration point (2026-09-10)
                  url: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels
              verified: 2026-09-10
      - mitigation: cap-agent-tracing
        coverage: partial
        mechanism: >-
          Platform audit logs API (tunnel.*, api_key.*, certificate and role events); tunnel-client structured
          logs, /metrics and client_instance_id correlation on the host; app invocation logs stay on the ChatGPT
          side
        steps:
          - title: Export the control-plane trail
            body:
              - >-
                Poll GET /v1/organization/audit_logs with an admin key, filtered to tunnel.created,
                tunnel.updated, tunnel.deleted and api_key.* events, into the SIEM.
            url: https://developers.openai.com/api/reference/resources/admin/subresources/organization/subresources/audit_logs/methods/list
          - title: Ship the tunnel host's own record
            body:
              - >-
                Run tunnel-client with --log.format json and --log.file (LOG_FILE) forwarded off the host, and
                scrape /metrics; each process stamps its client_instance_id on control-plane requests and logs.
            url: https://github.com/openai/tunnel-client/blob/master/docs/configuration.md
        note: >-
          Partial by the rule: only a control-plane admin audit log is exported programmatically. The guide says
          tunnel control-plane auth, long-poll and response traffic and individual transport requests are not
          emitted as ChatGPT Compliance Platform app events, so tool calls and their content are recorded on the
          app path (app invocation logs and APP_AUTH_LOG — toolChatgptDesktop) and by our gateway, not by the
          tunnel. tunnel-client's own logs and metrics are operational (health, readiness, polling, failures);
          the docs describe no per-call audit event. Raw HTTP logging (--log.http-raw-unsafe) is off by default
          and unsafe, and the admin UI export is redacted. The host logs are alterable by whoever runs the host,
          so capture here is not tamper resistance.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAuditLogging
          reviewRequired: false
          original:
            - capability: capabilityAuditLogging
              coverage: partial
              mechanism: >-
                Platform audit logs for tunnel metadata; app-level invocation logs; tunnel-client /metrics and
                admin UI
              note: Control-plane tunnel traffic is not emitted as Compliance Platform app events.
              steps:
                - title: Combine the three logs
                  body:
                    - Platform audit logs (tunnel.*), ChatGPT app invocation and auth-lifecycle logs, and
                      tunnel-client's own /metrics and loopback-only /ui log export.
                  url: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels
              verified: 2026-09-10
      - mitigation: cap-agent-kill-switch
        coverage: native
        mechanism: >-
          Stop tunnel-client; revoke the runtime key on the Platform API keys page; delete the tunnel in
          Platform tunnel settings (Tunnels Manage) or with tunnel-client admin tunnels delete
        steps:
          - title: Stop the client
            body:
              - >-
                Stop the tunnel-client process or scale its deployment to zero; the guide states that requests
                through the tunnel fail while the client is not connected.
            url: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels
          - title: Revoke the runtime key
            body:
              - >-
                Delete the runtime API key on the Platform API keys page or with the Admin API project API key
                delete method, so no copy of the client can reconnect.
            url: https://developers.openai.com/api/reference/resources/admin/subresources/organization/subresources/projects/subresources/api_keys/methods/delete
          - title: Decommission the tunnel
            body:
              - >-
                Delete the tunnel in Platform tunnel settings or with tunnel-client admin tunnels delete
                <tunnel_id> --confirm (admin key with Tunnels Manage), which removes it for every associated
                organisation and workspace.
            url: https://github.com/openai/tunnel-client/blob/master/docs/enterprise-customer-onboarding.md
        note: >-
          Native by the drawing rule for this path: one operator action, taken outside the agent on a process
          that runs in our network, stops it; the guide documents that requests fail while the client is
          disconnected; and revoking the runtime key and deleting the tunnel end every associated workspace's use
          at once. Boundaries: an MCP call already forwarded completes at the MCP server, which the tunnel cannot
          cancel; the propagation delay of key revocation, Tunnels Use removal (role changes up to 30 minutes)
          and tunnel deletion is not documented. The ChatGPT app built on the tunnel and each user's OAuth grant
          to the MCP server are disabled in ChatGPT (toolChatgptDesktop) and at the authorisation server.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityKillSwitch
          reviewRequired: false
          original:
            - capability: capabilityKillSwitch
              coverage: native
              mechanism: Delete or revoke the tunnel in Platform tunnel settings (Tunnels Read + Manage)
              steps:
                - title: Revoke the tunnel
                  body:
                    - Deleting the tunnel endpoint stops every associated organisation and workspace from reaching the server;
                      stop tunnel-client as well.
                  url: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels
              verified: 2026-09-10
    # The security-relevant settings, each with the baseline value (data/tooling/BASELINE.md).
    # Tunnel records and permissions live in OpenAI Platform settings; everything else is tunnel-client's own
    # configuration (profile YAML, flags or environment) on the host the organisation runs. Verified 2026-10-30
    # at developers.openai.com and the openai/tunnel-client docs (read at raw.githubusercontent.com).
    settings:
      - id: tunnelPermissions
        name: Tunnels — Read, Manage and Use
        where: platform.openai.com › Organization settings › Roles (custom role, Tunnels row), assigned through Groups
        setVia: [adminConsole, identityProvider]
        area: identity
        recommended: Two roles on IdP-synced groups — tunnel managers Read + Manage, runtime users Read + Use — and nobody else
        why: Only named managers can create or repoint a tunnel and only named principals can run tunnel-client or attach it to an app; role changes take up to 30 minutes.
        mitigations: [D3-APA, AML.M0028]
        url: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels
        verified: "2026-10-30"
      - id: tunnelAssociations
        name: Associations (Platform organizations and ChatGPT workspaces)
        where: Platform tunnel settings › (tunnel) › associated organizations and workspaces
        setVia: [adminConsole]
        area: tools
        recommended: The owning Platform organization and the corporate ChatGPT workspace, plus only the organizations a reviewed Codex or API flow calls from
        why: Every association is another OpenAI context that can list the tunnel and call the private MCP server behind it.
        mitigations: [AML.M0028, D3-APA]
        url: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels
        verified: "2026-10-30"
      - id: runtimeApiKey
        name: CONTROL_PLANE_API_KEY (control_plane.api_key)
        where: Profile YAML control_plane.api_key, --control-plane.api-key, or the CONTROL_PLANE_API_KEY environment variable
        setVia: [configFile]
        area: identity
        default: Falls back to OPENAI_API_KEY when unset
        recommended: "A Restricted key with Tunnels Read + Use, referenced as a file: or env: reference — never an All key or admin key"
        why: Anyone who reads the daemon's key can run the tunnel; a restricted key reaches nothing else in the organization and stays out of argv and profiles.
        mitigations: [D3-CH]
        url: https://raw.githubusercontent.com/openai/tunnel-client/master/docs/permissions.md
        verified: "2026-10-30"
      - id: awsWorkloadIdentity
        name: control_plane.aws_identity_provider_id and control_plane.aws_service_account_id
        where: Profile YAML, or CONTROL_PLANE_AWS_IDENTITY_PROVIDER_ID and CONTROL_PLANE_AWS_SERVICE_ACCOUNT_ID
        setVia: [configFile]
        area: identity
        default: Unset (static API key)
        recommended: Set wherever tunnel-client runs on AWS, mapped to a project service account with Tunnels Read + Use, static key settings unset
        why: The client trades its AWS role for a short-lived token held in memory, so no long-lived key sits on the host.
        mitigations: [D3-CH]
        url: https://raw.githubusercontent.com/openai/tunnel-client/master/docs/configuration.md
        verified: "2026-10-30"
      - id: maxApiKeyLifetime
        name: Maximum API key lifetime
        where: platform.openai.com › Platform settings (organization, or the project)
        setVia: [adminConsole]
        area: identity
        recommended: 90 days
        why: New runtime keys must expire, so a copied key stops working; rotate by creating the replacement, restarting the client, then deleting the old key.
        mitigations: [D3-CH]
        url: https://developers.openai.com/api/docs/guides/production-best-practices
        verified: "2026-10-30"
      - id: controlPlaneMtls
        name: control_plane.client_cert and control_plane.client_key
        where: Profile YAML or --control-plane.client-cert / --control-plane.client-key, with the trust anchor active under Organization settings › Security › Mutual TLS
        setVia: [configFile, adminConsole]
        area: identity
        default: Unset (API key only)
        recommended: On — a client certificate from your internal CA, its trust anchor active for the key's project
        why: A leaked runtime key alone no longer connects; the control plane also requires the certificate.
        mitigations: [D3-CH]
        url: https://raw.githubusercontent.com/openai/tunnel-client/master/docs/configuration.md
        verified: "2026-10-30"
      - id: mcpClientCert
        name: MCP_CLIENT_CERT and MCP_CLIENT_KEY
        where: --mcp.client-cert / --mcp.client-key, or per channel on --mcp.server-url (HTTP bindings only)
        setVia: [configFile]
        area: identity
        default: Unset
        recommended: On wherever the MCP server can validate client certificates
        why: The MCP server accepts calls only from the tunnel host; the certificate identifies the tunnel, not the user, so OAuth still decides per user.
        mitigations: [D3-CH]
        url: https://raw.githubusercontent.com/openai/tunnel-client/master/docs/configuration.md
        verified: "2026-10-30"
      - id: pollChannels
        name: control_plane.poll_channels
        where: Profile YAML, --control-plane.poll-channel or CONTROL_PLANE_POLL_CHANNELS
        setVia: [configFile]
        area: tools
        default: Unset (legacy unscoped polling)
        recommended: Set explicitly to the channels this client serves, e.g. [main]
        why: Once set it is an allowlist, so a channel left out — Harpoon included — is never polled.
        mitigations: [AML.M0028]
        url: https://raw.githubusercontent.com/openai/tunnel-client/master/docs/configuration.md
        verified: "2026-10-30"
      - id: mcpBindings
        name: --mcp.server-url and --mcp.command
        where: Flags (aliases --mcp-server-url, --mcp-command), MCP_SERVER_URL, or mcp.server_urls / mcp.commands in the profile
        setVia: [configFile]
        area: tools
        recommended: Only the approved MCP servers, each over HTTPS, one binding per channel
        why: tunnel-client forwards JSON-RPC unchanged, so its bindings are the whole set of servers OpenAI products can reach through it.
        mitigations: [AML.M0028, cap-agent-tool-registry]
        url: https://raw.githubusercontent.com/openai/tunnel-client/master/docs/configuration.md
        verified: "2026-10-30"
      - id: harpoonTargets
        name: --harpoon.target (HARPOON_TARGETS)
        where: Flag, HARPOON_TARGETS, or harpoon.targets in the profile
        setVia: [configFile]
        area: network
        default: No targets (the harpoon channel returns unsupported_channel)
        recommended: None, unless a reviewed private REST endpoint needs it; then labelled targets only, plaintext HTTP left off
        why: Each target is a private HTTP endpoint agents can call through the tunnel by label; with none registered the channel stays closed.
        mitigations: [AML.M0028, D3-OTF]
        url: https://raw.githubusercontent.com/openai/tunnel-client/master/docs/configuration.md
        verified: "2026-10-30"
      - id: oauthTrustedOrigins
        name: mcp.oauth_trusted_origins
        where: Profile YAML, --mcp.oauth-trusted-origin or MCP_OAUTH_TRUSTED_ORIGINS
        setVia: [configFile]
        area: identity
        default: Only the configured MCP server origin
        recommended: The exact origin of your authorization server, nothing else
        why: OAuth discovery follows only origins you trust, so altered metadata cannot send the sign-in flow to another host.
        mitigations: []
        url: https://raw.githubusercontent.com/openai/tunnel-client/master/docs/configuration.md
        verified: "2026-10-30"
      - id: outboundProxy
        name: --http-proxy and --ca-bundle
        where: --http-proxy (TUNNEL_CLIENT_HTTP_PROXY), --control-plane.http-proxy, --mcp.http-proxy and --ca-bundle (CA_BUNDLE)
        setVia: [configFile]
        area: network
        default: Environment HTTP_PROXY / HTTPS_PROXY, system trust store
        recommended: Through the corporate proxy, with its CA bundle added
        why: The tunnel's egress to api.openai.com is inspected and logged like other outbound traffic; stdio bindings ignore proxy settings.
        mitigations: [D3-OTF]
        url: https://raw.githubusercontent.com/openai/tunnel-client/master/docs/configuration.md
        verified: "2026-10-30"
      - id: healthListenAddr
        name: --health.listen-addr (HEALTH_LISTEN_ADDR)
        where: Flag, environment variable or health.listen_addr in the profile
        setVia: [configFile]
        area: network
        default: 127.0.0.1:8080
        recommended: 127.0.0.1:8080 — widen only for an orchestrator probe on a trusted network
        why: /healthz, /readyz, /metrics and the embedded UI stay off the network.
        mitigations: []
        url: https://raw.githubusercontent.com/openai/tunnel-client/master/docs/configuration.md
        verified: "2026-10-30"
      - id: allowRemoteUi
        name: --allow-remote-ui (ALLOW_REMOTE_UI)
        where: Flag or environment variable
        setVia: [configFile]
        area: network
        default: "false"
        recommended: "false"
        why: The admin UI, with its log export and live log-level control, answers only loopback clients.
        mitigations: []
        url: https://raw.githubusercontent.com/openai/tunnel-client/master/docs/configuration.md
        verified: "2026-10-30"
      - id: rawPayloadLogging
        name: --log.http-raw-unsafe and --harpoon.capture-payloads
        where: Flags, or LOG_HTTP_RAW_UNSAFE and HARPOON_CAPTURE_PAYLOADS
        setVia: [configFile]
        area: audit
        default: "false"
        recommended: "false — on only for a controlled debugging session"
        why: Raw logging can write headers and bodies — bearer tokens and tool payloads — to the log and the admin UI.
        mitigations: []
        url: https://raw.githubusercontent.com/openai/tunnel-client/master/docs/configuration.md
        verified: "2026-10-30"
      - id: structuredLogs
        name: --log.format and --log.file
        where: Flags, LOG_FORMAT and LOG_FILE, or log.format / log.file in the profile
        setVia: [configFile]
        area: audit
        default: Default logger to stdout
        recommended: json to a file shipped to the SIEM, with /metrics scraped
        why: The host's record of polling, failures and client_instance_id sits beside the Platform audit log for the same tunnel.
        mitigations: [cap-agent-tracing]
        url: https://raw.githubusercontent.com/openai/tunnel-client/master/docs/configuration.md
        verified: "2026-10-30"
      - id: platformAuditLogs
        name: Audit logs (tunnel.created, tunnel.updated, tunnel.deleted)
        where: Admin API GET /v1/organization/audit_logs with an admin key, filtered by event type
        setVia: [apiCli]
        area: audit
        recommended: Pulled into the SIEM, alerting on tunnel.* and api_key.* events
        why: A tunnel created, repointed or deleted outside the change process shows up on the next pull; tunnel traffic itself is not a Compliance Platform event.
        mitigations: [cap-agent-tracing, cap-agent-tool-registry]
        url: https://developers.openai.com/api/reference/resources/admin/subresources/organization/subresources/audit_logs/methods/list
        verified: "2026-10-30"
      - id: deleteTunnel
        name: tunnel-client admin tunnels delete
        where: tunnel-client admin tunnels delete <tunnel_id> --confirm (admin key with Tunnels Manage), or Platform tunnel settings
        setVia: [apiCli, adminConsole]
        area: audit
        recommended: Your incident runbook's first step for a misbehaving server, with the runtime key revoked alongside
        why: Requests fail while the client is disconnected, and with the one tunnel record and its key gone no copy of the client can reconnect.
        mitigations: [cap-agent-kill-switch]
        url: https://raw.githubusercontent.com/openai/tunnel-client/master/docs/enterprise-customer-onboarding.md
        verified: "2026-10-30"
    sources:
      - title: Secure MCP Tunnels guide
        url: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels
      - title: openai/tunnel-client repository
        url: https://github.com/openai/tunnel-client
      - title: API data usage
        url: https://developers.openai.com/api/docs/guides/your-data
      - title: OpenAI trust portal
        url: https://trust.openai.com/
