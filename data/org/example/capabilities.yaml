# EXAMPLE enterprise layer. Per capability (data/overlay/capabilities.yaml ids), per surface, the
# technology the organisation deploys around its AI tools and whether it is in place. This is the
# only source of the status shown on the Capabilities tab and beside the enterprise-capability
# modules on each architecture's Tools tab. One vocabulary everywhere: enabled | inProgress | gap;
# a capability × surface not listed reads as a gap when "Show status" is on. (This file is the
# shipped example; replace it in data/org/local/.)
capabilities:
  capabilityAiDlp:
    surfaceEndpoint: { status: enabled, technology: Example endpoint DLP agent, note: Inspects prompts and uploads in the browser and the desktop apps. }
    surfaceSaas: { status: inProgress, technology: Example CASB, note: Inline for sanctioned vendors; shadow AI only discovered, not blocked. }
  capabilityEgressControl:
    surfaceEndpoint: { status: enabled, technology: Example SSE / secure web gateway, note: Deny-by-default egress with named AI providers allowed. }
    surfaceCloud: { status: enabled, technology: Cloud network policy }
  capabilityAgentSandboxing:
    surfaceEndpoint: { status: gap, note: No fleet-wide sandbox packaging yet; relies on each product's own sandbox. }
  capabilityIga:
    surfaceEndpoint: { status: enabled, technology: Example IdP with SSO and MFA }
    surfaceSaas: { status: enabled, technology: Example IdP with SCIM }
  capabilityAuditLogging:
    surfaceEndpoint: { status: inProgress, technology: Example SIEM, note: OTel export from a pilot group only. }
  capabilityMcpToolSecurity:
    surfaceEndpoint: { status: inProgress, technology: MDM-pushed allowlists, note: Allowlists per product; no central MCP registry yet. }
  capabilityPromptInjectionDefense:
    surfaceEndpoint: { status: gap, note: No runtime guardrail in front of the endpoint agents. }
    surfaceCloud: { status: inProgress, technology: Example AI gateway guardrails }
