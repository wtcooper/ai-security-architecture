  - architecture: archTrainingPipeline
    asOf: "2026-10"
    # >>> checked against the vendor's documentation
    verified: "2026-11-18"
    sources:
      dataOrigins: https://docs.aws.amazon.com/sagemaker/latest/dg/sms.html
      pkgRegistry: https://docs.aws.amazon.com/codeartifact/latest/ug/welcome.html
      curation: https://docs.aws.amazon.com/sagemaker/latest/dg/processing-job.html
      corpus: https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html
      trainJob: https://docs.aws.amazon.com/sagemaker/latest/dg/how-it-works-training.html
      storage: https://docs.aws.amazon.com/AmazonS3/latest/userguide/bucket-policies.html
      evaluation: https://docs.aws.amazon.com/sagemaker/latest/dg/define-pipeline.html
      registry: https://docs.aws.amazon.com/sagemaker/latest/dg/model-registry.html
    differences:
      - at: pkgRegistry->trainJob
        text: "With network isolation on, the training container cannot call any service, including CodeArtifact and S3. Packages must be installed into the container image at build time and stored in Amazon ECR; the base checkpoint must arrive as an S3 input that SageMaker copies in."
        url: https://docs.aws.amazon.com/sagemaker/latest/dg/mkt-algo-model-internet-free.html
      - at: corpus->trainJob
        text: "With network isolation on, the training code never talks to the dataset bucket and gets no AWS credentials. SageMaker itself downloads the data and uploads the result using the job's role, so that role's S3 permissions are the control."
        url: https://docs.aws.amazon.com/sagemaker/latest/dg/mkt-algo-model-internet-free.html
      - at: upstreamArtifacts->pkgRegistry
        text: "CodeArtifact fetches a package from the public repository the first time someone asks for it, so admission is on demand, not reviewed. There is no managed mirror for Hugging Face weights; you copy them into S3 and scan them yourself."
        url: https://docs.aws.amazon.com/codeartifact/latest/ug/welcome.html
      - at: storage->evaluation
        text: "There is no ready-made evaluation step. AWS's tutorial uses a Processing job that SageMaker feeds with the candidate copied from S3, writes a results file, and a Condition step reads it. You write the evaluation script and thresholds."
        url: https://docs.aws.amazon.com/sagemaker/latest/dg/define-pipeline.html
      - at: evaluation->registry
        text: "AWS's approval page says code or a pipeline step can set a version to Approved, so a run could approve itself. Register every version as PendingManualApproval and deny the pipeline and training roles permission to change approval status; only the approver role may."
        url: https://docs.aws.amazon.com/sagemaker/latest/dg/model-registry-approve.html
      - at: storage->registry
        text: "The registry records where the artifact sits in S3 and its ETag, not a SHA-256 digest, and the default field expects a single tar.gz file. Store your own digest and signature with the version, and copy the release out of the candidate bucket."
        url: https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_ModelPackageContainerDefinition.html
    alsoNeeded:
      - service: "Amazon ECR"
        role: registry
        why: "Holds the training, processing and evaluation container images, which CodeArtifact cannot store."
        url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/image-scanning-enhanced.html
      - service: "An image build step that installs packages through CodeArtifact (for example AWS CodeBuild)"
        role: other
        why: "Network-isolated jobs cannot install packages at run time, so they are built into the image."
        url: https://docs.aws.amazon.com/sagemaker/latest/dg/mkt-algo-model-internet-free.html
      - service: "AWS IAM execution roles"
        role: identity
        why: "One role per stage; SageMaker uses it to read and write S3 for the job."
        url: https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-roles.html
      - service: "Amazon VPC with private subnets and an S3 gateway endpoint"
        role: network
        why: "Routes SageMaker's data downloads and uploads through your network."
        url: https://docs.aws.amazon.com/sagemaker/latest/dg/mkt-algo-model-internet-free.html
      - service: "AWS KMS"
        role: keys
        why: "Encryption key for volumes and outputs, and a separate signing key for releases."
        url: https://docs.aws.amazon.com/kms/latest/APIReference/API_Sign.html
      - service: "Amazon CloudWatch Logs"
        role: logging
        why: "Processing and training job logs and metrics are written here; they can contain training data."
        url: https://docs.aws.amazon.com/sagemaker/latest/dg/processing-job.html
      - service: "AWS CloudTrail"
        role: logging
        why: "Records who started runs, changed approval status and used the signing key."
        url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/logging-data-events-with-cloudtrail.html
      - service: "A promotion job triggered by approval (your CI/CD)"
        role: other
        why: "Approval only changes a status; copying, documenting and signing the release is a job you build."
        url: https://docs.aws.amazon.com/sagemaker/latest/dg/model-registry-approve.html
    quickstart:
      - title: "Define a pipeline"
        url: https://docs.aws.amazon.com/sagemaker/latest/dg/define-pipeline.html
      - title: "Add a step"
        url: https://docs.aws.amazon.com/sagemaker/latest/dg/build-and-manage-steps-types.html
    # <<< checked
    reference:
      - title: Well-Architected Generative AI Lens — Model customization
        url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/genops05.html
      - title: Well-Architected Generative AI Lens — Data poisoning
        url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/gensec06.html
      - title: Amazon SageMaker Pipelines
        url: https://docs.aws.amazon.com/sagemaker/latest/dg/pipelines.html
    summary:
      - >-
        A SageMaker Pipelines run: Processing jobs curate and redact into a versioned S3 dataset, a
        network-isolated SageMaker AI training job writes an unsigned candidate under its own role and
        your KMS key, an evaluation step gates registration in SageMaker Model Registry, and a
        separate promotion role approves, documents and signs the release with an asymmetric KMS key.
        Base checkpoints and frameworks come only through CodeArtifact and a scanned S3 mirror.
    bindings:
      - { block: upstreamArtifacts, service: Hugging Face Hub and public registries }
      - { block: dataOrigins, service: Your datasets and labelling workforce, build: true, note: "SageMaker Ground Truth where AWS runs the labelling." }
      - { block: pkgRegistry, service: CodeArtifact and an S3 checkpoint mirror }
      - { block: curation, service: SageMaker Processing jobs }
      - { block: corpus, service: Amazon S3 dataset bucket (versioned) }
      - { block: trainJob, service: SageMaker AI training jobs, note: "SageMaker HyperPod for multi-node runs that need a persistent cluster." }
      - { block: storage, service: Amazon S3 candidate bucket }
      - { block: evaluation, service: SageMaker Pipelines evaluation step, note: "SageMaker Clarify foundation model evaluations plus your own backdoor and memorisation probes, on a read-only role." }
      - { block: registry, service: Amazon SageMaker Model Registry }
    # >>> hosting options (compared against the vendor's pages; one is the mapping itself)
    hosting:
      - id: sageMakerTraining
        kind: runtime
        name: "Amazon SageMaker AI training jobs"
        url: https://docs.aws.amazon.com/sagemaker/latest/dg/train-model.html
        asOf: "2026-11"
        mapped: true
        compare:
          runs: "SageMaker AI provisions instances for each job, runs your training container on them and releases them when the job ends."
          patching: "SageMaker AI manages the training instances and publishes pre-built framework images; you maintain any image and packages you bring."
          data: "SageMaker copies data from your S3 bucket to the job instances and uploads artefacts back; volumes and output can use your KMS key."
          network: "Containers have internet access by default; VpcConfig attaches jobs to your subnets and EnableNetworkIsolation blocks all outbound calls."
          identity: "An IAM execution role passed to each job as RoleArn; with network isolation the container itself receives no AWS credentials."
          accepts: "Built-in algorithms, pre-built PyTorch and TensorFlow containers that run your script, or your own training container."
          workload: "A job runs for one day by default and 28 days at most; checkpoints sync to S3 and managed Spot training restarts interrupted jobs from them."
          portability: "Training code runs in a standard container; job definitions, input channels and pipeline steps are SageMaker APIs to re-create elsewhere."
          effort: "Your team owns training code, images, job configuration and quotas; AWS provisions, monitors and tears down the instances."
          fits: "AWS presents training jobs as the fully managed route for ephemeral jobs where you choose the instance type and count."
        sources:
          - https://docs.aws.amazon.com/sagemaker/latest/dg/train-model.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/how-it-works-training.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/docker-containers.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/mkt-algo-model-internet-free.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/train-vpc.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/model-checkpoints.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/model-managed-spot-training.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-roles.html
          - https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_StoppingCondition.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/customizing-models-infrastructure.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/customizing-models-training-jobs.html
      - id: eks
        kind: cluster
        name: "Amazon EKS"
        url: https://docs.aws.amazon.com/eks/latest/userguide/ml-on-eks.html
        asOf: "2026-11"
        compare:
          runs: "You run training as Kubernetes jobs on GPU nodes in your cluster, through an operator such as the Kubeflow Training Operator or KubeRay."
          patching: "AWS patches the control plane and, on EKS Auto Mode, the nodes; on your own node groups you update GPU AMIs and drivers. Operators and training images are yours."
          data: "Data, checkpoints and weights stay in your account on S3, FSx for Lustre or EBS volumes that you mount into the training pods."
          network: "Pods run in your VPC subnets; Kubernetes network policies, security groups and a private cluster endpoint limit traffic."
          identity: "A Kubernetes service account mapped to an IAM role through EKS Pod Identity."
          accepts: "Any training container; AWS's guides use AWS Deep Learning Containers with Kubeflow PyTorchJob resources, and Ray Train on KubeRay."
          workload: "No session limit, but Auto Mode replaces nodes within 21 days; a node holds at most 5 sandboxes per vCPU, and AWS's blueprint reports a pod Ready in about 5 seconds."
          portability: "Jobs are container images and Kubernetes resources from open source operators; storage drivers and IAM mapping are AWS-specific."
          effort: "Your team operates the cluster, GPU nodes, device plugins, training operator, storage drivers, job queues and upgrades."
          fits: "AWS presents EKS for teams with Kubernetes expertise that want full cluster control and one orchestrator across training pipelines."
        sources:
          - https://docs.aws.amazon.com/eks/latest/userguide/ml-on-eks.html
          - https://docs.aws.amazon.com/eks/latest/userguide/ml-resources.html
          - https://docs.aws.amazon.com/eks/latest/userguide/ml-cluster-setup.html
          - https://docs.aws.amazon.com/eks/latest/userguide/security.html
          - https://docs.aws.amazon.com/eks/latest/userguide/automode.html
          - https://docs.aws.amazon.com/eks/latest/userguide/pod-identities.html
          - https://docs.aws.amazon.com/eks/latest/userguide/cni-network-policy.html
          - https://docs.aws.amazon.com/eks/latest/userguide/cluster-endpoint.html
          - https://docs.aws.amazon.com/eks/latest/userguide/sandboxing-limitations.html
          - https://aws.amazon.com/blogs/machine-learning/configure-and-verify-a-distributed-training-cluster-with-aws-deep-learning-containers-on-amazon-eks/
          - https://awslabs.github.io/ai-on-eks/docs/infra/training/jark
          - https://awslabs.github.io/ai-on-eks/docs/category/training-on-eks
          - https://docs.aws.amazon.com/AmazonS3/latest/userguide/default-bucket-encryption.html
          - https://awslabs.github.io/ai-on-eks/docs/blueprints/training/GPUs/bionemo
        summary: "The training job becomes a Kubernetes job, a Kubeflow PyTorchJob in AWS's guide, on GPU nodes in an EKS cluster you run. You now carry what SageMaker did for each job: GPU nodes and drivers, the operator, copying data and checkpoints, encryption of volumes, per-job IAM roles and the network wall that EnableNetworkIsolation gave in one flag. Curation, evaluation, registry and signing can stay on SageMaker AI, but something you choose must start the job and collect its output."
        bindings:
          - { block: trainJob, service: "Kubeflow PyTorchJob on Amazon EKS GPU nodes", build: true, builtWith: "Kubeflow Training Operator", note: "AWS Deep Learning Containers run as PyTorchJob workers, with the EFA and NVIDIA device plugins, etcd, and FSx for Lustre or EBS volumes for data and checkpoints.", url: https://aws.amazon.com/blogs/machine-learning/configure-and-verify-a-distributed-training-cluster-with-aws-deep-learning-containers-on-amazon-eks/ }
        dropSettings: [smTrainingRole, smTrainingKms, smNetworkIsolation]
        addSettings: [eksPodIdentity, eksNetworkPolicy, eksPrivateEndpoint, eksGpuTaints, eksClusterAccessEntries, eksControlPlaneLogs, eksImdsHopLimit, s3DefaultSseKms]
        differences:
          - at: trainJob
            text: "The Kubeflow Training Operator that AWS's guide installs is the legacy v1 project (PyTorchJob); the guide notes its successor, Kubeflow Trainer v2, was in alpha. AWS's AI on EKS JARK stack trains with Ray on KubeRay, though its BioNeMo blueprint still uses PyTorchJob. Pin the operator version you validate."
            url: https://docs.aws.amazon.com/eks/latest/userguide/cni-network-policy.html
          - at: corpus->trainJob
            text: "SageMaker no longer copies the dataset in under a role the code never holds. The pod reads the bucket itself with its own Pod Identity role, so the training code holds live credentials. Scope that role to read the corpus prefix and write the candidate prefix only."
            url: https://docs.aws.amazon.com/eks/latest/userguide/pod-identities.html
          - at: trainJob
            text: "The Kubeflow Training Operator that AWS's guide installs is the legacy v1 project (PyTorchJob); the guide notes its successor, Kubeflow Trainer v2, was in alpha. AWS's AI on EKS stack trains with Ray on KubeRay instead. Pin the operator version you validate."
            url: https://aws.amazon.com/blogs/machine-learning/configure-and-verify-a-distributed-training-cluster-with-aws-deep-learning-containers-on-amazon-eks/
          - at: trainJob
            text: "Training pods share the node kernel with every other pod on the node. Isolated pods cannot be used for GPU jobs: GPU and device passthrough are not supported in Nitro Sandboxes. Keep training nodes dedicated and tainted, one pool per sensitivity tier."
            url: https://docs.aws.amazon.com/eks/latest/userguide/sandboxing-limitations.html
          - at: trainJob->storage
            text: "The mapping's pipeline starts SageMaker jobs and records their output. A Kubernetes job is started and watched by whatever you put in that place; AWS's EKS stack uses Argo Workflows. The step must also write the candidate to the bucket and hand its location to the evaluation step."
            url: https://awslabs.github.io/ai-on-eks/docs/infra/training/jark
        alsoNeeded:
          - service: "Kubeflow Training Operator (or KubeRay)"
            role: other
            why: "Creates and restarts the worker pods of a distributed job, which SageMaker did per training job."
            url: https://aws.amazon.com/blogs/machine-learning/configure-and-verify-a-distributed-training-cluster-with-aws-deep-learning-containers-on-amazon-eks/
          - service: "NVIDIA and EFA device plugins on GPU nodes"
            role: other
            why: "Expose GPUs and the fast interconnect to pods; SageMaker supplied both on its training instances."
            url: https://aws.amazon.com/blogs/machine-learning/configure-and-verify-a-distributed-training-cluster-with-aws-deep-learning-containers-on-amazon-eks/
          - service: "Amazon FSx for Lustre and EBS CSI drivers"
            role: other
            why: "Provide storage for datasets, checkpoints and logs in place of SageMaker input channels and checkpoint sync."
            url: https://aws.amazon.com/blogs/machine-learning/configure-and-verify-a-distributed-training-cluster-with-aws-deep-learning-containers-on-amazon-eks/
          - service: "EKS Pod Identity"
            role: identity
            why: "Replaces the job's execution role with an IAM role per training service account."
            url: https://docs.aws.amazon.com/eks/latest/userguide/pod-identities.html
          - service: "Argo Workflows (or your own job launcher)"
            role: other
            why: "Starts the job and passes its output on; AWS includes Argo Workflows in its JARK stack for automating model pipelines."
            url: https://awslabs.github.io/ai-on-eks/docs/infra/training/jark
        quickstart:
          - title: "Overview of Artificial Intelligence and Machine Learning on Amazon EKS"
            url: https://docs.aws.amazon.com/eks/latest/userguide/ml-on-eks.html
          - title: "Configure and verify a distributed training cluster with AWS Deep Learning Containers on Amazon EKS"
            url: https://aws.amazon.com/blogs/machine-learning/configure-and-verify-a-distributed-training-cluster-with-aws-deep-learning-containers-on-amazon-eks/
          - title: "AI on EKS: JARK on EKS"
            url: https://awslabs.github.io/ai-on-eks/docs/infra/training/jark
      - id: sageMakerHyperPod
        kind: cluster
        name: "Amazon SageMaker HyperPod"
        url: https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod.html
        asOf: "2026-11"
        compare:
          runs: "You submit jobs through Slurm or Amazon EKS to a persistent cluster whose instances SageMaker AI provisions, monitors and replaces."
          patching: "AWS publishes HyperPod AMIs; you apply them with UpdateClusterSoftware or opt in to automatic security patching of idle nodes."
          data: "Data, checkpoints and weights stay in your account on S3, FSx for Lustre or the EBS volumes attached to cluster instances."
          network: "Cluster instances attach to your VPC subnets and security groups; AWS's guide leaves securing network egress from the cluster to you."
          identity: "An IAM execution role for the cluster instance groups; with EKS orchestration, pods can take their own roles through EKS Pod Identity."
          accepts: "Containerised jobs such as Kubeflow PyTorchJob on EKS, Slurm jobs, and SageMaker recipes for fine-tuning foundation models."
          workload: "Built for jobs lasting weeks or months; health checks replace faulty nodes and auto-resume restarts PyTorch jobs from their checkpoints."
          portability: "Jobs use Slurm or Kubernetes interfaces and standard containers; the resiliency features, recipes and cluster APIs are HyperPod-specific."
          effort: "Your team operates the long-lived cluster, its scheduler, add-ons, quotas, storage and software updates; AWS replaces failed instances."
          fits: "AWS presents HyperPod for large-scale, long-running and multi-job training that needs a persistent cluster with fault recovery."
        sources:
          - https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-eks.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-slurm.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-prerequisites.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-prerequisites-iam.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-ami-auto-patching.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-release-ami.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-eks-run-jobs-kubectl.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-eks-operator.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-eks-resiliency.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/customizing-models-hyperpod.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/customizing-models-infrastructure.html
          - https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_ClusterEbsVolumeConfig.html
          - https://docs.aws.amazon.com/AmazonS3/latest/userguide/default-bucket-encryption.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-release-ami-update.html
        summary: "Training runs as jobs on a persistent SageMaker HyperPod cluster, here orchestrated by Amazon EKS, whose GPU instances SageMaker AI provisions, health-checks and replaces. Unlike a training job, the cluster outlives each run, so you carry its software updates, scheduler, access entries, storage and network egress, and the per-job role, encryption and isolation that CreateTrainingJob set for you. In return multi-node jobs can run for weeks and resume after hardware faults."
        bindings:
          - { block: trainJob, service: "PyTorchJob on SageMaker HyperPod (Amazon EKS)", build: true, builtWith: "Kubeflow Training Operator", note: "Submitted with kubectl or the HyperPod CLI to the Kubeflow Training Operator installed by Helm chart, or to the HyperPod training operator; Slurm orchestration is the alternative.", url: https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-eks-run-jobs-kubectl.html }
        dropSettings: [smTrainingRole, smTrainingKms, smNetworkIsolation]
        addSettings: [eksPodIdentity, eksRunAccessEntry, eksControlPlaneLogs, eksNetworkPolicy, s3DefaultSseKms, hyperPodVpcConfig, hyperPodVolumeKms]
        differences:
          - at: trainJob
            text: "Node software is not refreshed per job. AMI security patches reach nodes only when you call UpdateClusterSoftware, set an update schedule, or enable auto-patching per instance group (EKS clusters created from 2026), which patches idle nodes on a date set 21 days after each release and deferrable to 60 days."
            url: https://docs.aws.amazon.com/sagemaker/latest/dg/customizing-models-hyperpod.html
          - at: trainJob
            text: "AWS's HyperPod on EKS page states that orchestration is user-managed and asks you to keep access to the Kubernetes API server endpoint least-privilege and to secure network egress from the cluster. Neither is set for you as VpcConfig and EnableNetworkIsolation were per job."
            url: https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-eks.html
          - at: corpus->trainJob
            text: "The cluster has one IAM execution role per instance group, not one per job. Give each training job its own role through EKS Pod Identity, which needs the eks-auth:AssumeRoleForPodIdentity permission on the HyperPod role, and keep the instance group role minimal."
            url: https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-prerequisites-iam.html
          - at: trainJob->storage
            text: "Job auto-resume works only for Kubeflow PyTorchJob with Training Operator release 1.7.0, 1.8.0 or 1.8.1 installed from the Helm chart. The job, not the service, writes checkpoints and the candidate, so your code must save them to shared storage or S3."
            url: https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-eks-run-jobs-kubectl.html
          - at: trainJob
            text: "Node software is not refreshed per job. AMI security patches reach nodes only when you call UpdateClusterSoftware or enable auto-patching per instance group, which patches idle nodes on a date set 21 days after each release and deferrable to 60 days."
            url: https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-ami-auto-patching.html
        alsoNeeded:
          - service: "Amazon EKS cluster (control plane for the HyperPod cluster)"
            role: other
            why: "A HyperPod cluster maps one-to-one to an EKS cluster, whose control plane settings, access and upgrades you manage."
            url: https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod.html
          - service: "Kubeflow Training Operator or HyperPod training operator"
            role: other
            why: "Runs and recovers distributed jobs; SageMaker training jobs did this without an operator."
            url: https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-eks-operator.html
          - service: "EKS access entries and Kubernetes RBAC"
            role: identity
            why: "Decide which scientists may submit jobs to which namespace; IAM on CreateTrainingJob did this before."
            url: https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-prerequisites-iam.html
          - service: "Amazon FSx for Lustre"
            role: other
            why: "Optional shared file system for datasets and checkpoints across cluster nodes."
            url: https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-prerequisites.html
        quickstart:
          - title: "Orchestrating SageMaker HyperPod clusters with Amazon EKS"
            url: https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-eks.html
          - title: "Running jobs using kubectl"
            url: https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-eks-run-jobs-kubectl.html
          - title: "Model customization on HyperPod"
            url: https://docs.aws.amazon.com/sagemaker/latest/dg/customizing-models-hyperpod.html
      - id: sageMakerServerlessCustomization
        kind: managed
        name: "Amazon SageMaker AI serverless model customization"
        url: https://docs.aws.amazon.com/sagemaker/latest/dg/customize-model.html
        asOf: "2026-11"
        compare:
          runs: "SageMaker AI runs the training on GPU capacity it provisions and releases; you choose a base model, technique, dataset and settings."
          patching: "AWS operates and patches the whole training stack; you have no image, instance or cluster to maintain."
          data: "Datasets are read from your S3 bucket; the output is written to your S3 path and logged in a model package group in your account."
          network: "Jobs accept your subnets and security groups; training sessions place a proxy network interface in your VPC for S3 traffic."
          identity: "Your SageMaker AI execution role, carrying the AmazonSageMakerModelCustomizationCoreAccess managed policy or equivalent permissions."
          accepts: "Listed open-weight and Amazon Nova base models; supervised, preference and reinforcement fine-tuning with LoRA or full fine-tuning."
          workload: "There is no instance selection; SageMaker picks GPU instances, runs its own recipes, shows live metrics and logs a checkpoint if a job fails."
          portability: "Open-weight results are artefacts in your S3 bucket that deploy to SageMaker AI endpoints or Amazon Bedrock; recipes and job APIs are SageMaker-specific."
          effort: "Your team prepares datasets, reward functions and evaluations and reviews the results; AWS operates all training infrastructure."
          fits: "AWS presents it for quick experimentation and production fine-tuning jobs without operations overhead or instance selection."
        sources:
          - https://docs.aws.amazon.com/sagemaker/latest/dg/customize-model.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/customizing-models.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/customizing-models-infrastructure.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/model-customize-open-weight.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/model-customize-open-weight-prereq.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/model-customize-open-weight-job.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/model-customize-open-weight-deployment.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/customizing-models-deployment.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/customizing-models-training-sessions.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/training-sessions-vpc.html
          - https://docs.aws.amazon.com/sagemaker/latest/dg/model-customize-mtrl.html
          - https://docs.aws.amazon.com/bedrock/latest/userguide/custom-models.html
          - https://docs.aws.amazon.com/nova/latest/nova2-userguide/nova-model-sagemaker-inference.html
        offers:
          - name: "Serverless training"
            what: "Fully managed jobs that provision GPU instances (P5, P4de, P4d, G5) by model size, run pre-optimised training recipes and clean up resources when training completes."
            url: https://docs.aws.amazon.com/sagemaker/latest/dg/customize-model.html
          - name: "Customization techniques"
            what: "Supervised fine-tuning (SFT), direct preference optimization (DPO), reinforcement learning with verifiable rewards (RLVR) or AI feedback (RLAIF), and multi-turn reinforcement learning."
            url: https://docs.aws.amazon.com/sagemaker/latest/dg/customizing-models.html
          - name: "Training types"
            what: "LoRA, which trains a small set of adapter weights, or full fine-tuning (FFT), which updates all model weights; support varies by model and technique."
            url: https://docs.aws.amazon.com/sagemaker/latest/dg/model-customize-open-weight.html
          - name: "Supported base models"
            what: "Open-weight models from Alibaba (Qwen), DeepSeek, Google (Gemma), Meta (Llama, Muse), Mistral AI, NVIDIA (Nemotron) and OpenAI (GPT OSS), and Amazon Nova models."
            url: https://docs.aws.amazon.com/sagemaker/latest/dg/customizing-models.html
          - name: "Training session APIs"
            what: "Stateful serverless GPU sessions in which your Python code calls operations such as forward_backward, optim_step and sample to drive a custom training loop."
            url: https://docs.aws.amazon.com/sagemaker/latest/dg/customizing-models-training-sessions.html
          - name: "Evaluation and reward assets"
            what: "Datasets and evaluators (reward functions in code, or reward prompts for an LLM judge) are managed as assets and used for training and for model evaluation jobs."
            url: https://docs.aws.amazon.com/sagemaker/latest/dg/customize-model.html
          - name: "Logged models, registration and lineage"
            what: "Each job logs its output to a model package group, and lineage between training jobs, datasets, models, evaluations and deployments is captured automatically."
            url: https://docs.aws.amazon.com/sagemaker/latest/dg/customize-model.html
          - name: "Deployment"
            what: "A custom model deploys to SageMaker AI Inference endpoints or to Amazon Bedrock; customised Amazon Nova models deploy to Amazon Bedrock or, if full-rank or LoRA-merged, to SageMaker inference."
            url: https://docs.aws.amazon.com/sagemaker/latest/dg/customizing-models-deployment.html
