# Per-tool assessments reference organization capability IDs, never MITRE or CoSAI IDs.
# These are illustrative assessments; legacy evidence is preserved in archive/.
tools:
  - tool: toolClaudeCode
    available: true
    note: Approved for engineering on managed laptops; managed settings pushed by MDM.
    capabilities:
      EX-ACCESS: {status: inProgress, note: Managed permission policy under review.}
