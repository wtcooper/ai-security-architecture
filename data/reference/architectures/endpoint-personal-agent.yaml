id: archPersonalAgent
surface: surfaceEndpoint
rank: 3
title: Personal autonomous agent
abbrev: Personal agent

summary:
  - >
    An always-on daemon on a personal device that takes ambient messages from anyone who can reach
    its channels, runs an unattended agent loop with the user's own credentials, and keeps what it
    learns in files it will read back as instruction. Assembled by the user from a harness, wired-up
    tools and pasted-in keys — there is no vendor application wrapping it.

description:
  - >
    The harness is a long-lived process, not an invocation. It owns the channel bridges, the agent
    loop, a heartbeat that fires with nobody watching, and a memory directory the next turn treats
    as context. Nothing about it is scoped to a task: it starts when the machine starts and ends
    when the user kills it.
  - >
    Three default postures make this a distinct architecture rather than a variation on a coding
    assistant — each now exists as an opt-in feature over there, and is the resting state here.
    It listens — whoever can reach a bridge can address the agent, and the bridge is
    the authorization decision. It runs unattended — the heartbeat starts the loop with no human
    seeing the plan before the tools execute. And it remembers in a medium it re-reads as
    instruction — one successful injection written into memory survives restarts and re-executes
    on the schedule.
  - >
    The target state wraps the harness whole. A microVM-class sandbox contains the daemon, its
    memory and a deliberately local tool surface — files, shell and skills, with their own
    kernel, filesystem, packages and network — and remote reach is pushed outside the boundary.
    The AI gateway is the general-purpose exit: deny-by-default egress for all outbound
    traffic, credentials injected at the crossing so the sandbox itself holds no secrets, and
    the audit tap. Remote MCP servers and external APIs sit behind the gateway as their own
    tool surface, and only they touch downstream services. Two other openings exist: a
    read-only pull from a private, organisation-maintained package registry, and the owner's
    workspace folders, shared into the sandbox explicitly and nothing else. The boundary is
    also what the approval prompts traded away — shipped sandboxes run the agent approval-free
    inside, on the position that isolation, egress policy and credential injection replace
    per-command consent. Products now ship exactly this wrap for the popular harnesses; the
    drawing is that pattern, vendor-neutral.
  - >
    What the drawing still does not contain is a governance plane. No agent identity distinct
    from the user, no policy engine consulted per tool call, no audit sink beyond the gateway's
    tap, no kill switch beyond killing the process. The sandbox bounds the blast radius; it does
    not govern the agent.

distinguishedBy:
  - >
    Against the coding and desktop agents: the capabilities have converged — those now take
    remote steering, scheduled runs and agent-written memory too — so what separates the
    archetypes is defaults, identity and custody. There, each of those is opt-in, reaches the
    machine as an outbound relay only the owner's vendor account can address, and can be
    switched off from an admin console. Here, listening is the resting state, the sender set is
    whoever the messaging platform admits, the keys are long-lived and pasted in, and the whole
    thing is pieced together by the user with no console anyone can switch anything off from.
    The exposure scans still tell the story: personal gateways bind ports and get found by the
    tens of thousands; a vendor agent's remote channel opens no inbound port at all.
  - >
    Against a cloud agent service: the same loop hosted by a provider gets an identity, a policy
    boundary, an audit trail and an administrator by default. Moving this architecture off the
    endpoint changes almost nothing about the loop and almost everything about the governance.

exemplars:
  - name: OpenClaw
    note: >
      The reference implementation of the pattern: a gateway daemon owning all state, channel
      bridges for a dozen messaging platforms, an embedded agent runtime, Markdown memory with a
      scheduled heartbeat, in-process skills from a public registry, and paired device nodes.
    url: https://docs.openclaw.ai/concepts/architecture
    asOf: "2026-08"
  - name: Hermes Agent
    note: >
      An independent implementation with a candid threat model, which states plainly that its deny
      rules guard against an honest-but-wrong agent rather than an adversarial one. Its
      self-improvement feature — the agent writing its own skills — is this archetype's
      persistence vector made into a product decision.
    url: https://hermes-agent.nousresearch.com/docs/user-guide/security
    asOf: "2026-08"
  - name: Homegrown harnesses
    note: >
      The long tail: a script, a messaging webhook, an API key in a dotfile, and cron.
      Structurally identical and considerably more common than either named project.
    asOf: "2026-08"

blocks:
  - id: senders
    kind: actor
    title: Unsolicited senders
    icon: people
    col: 0
    row: 0
    note: >
      Anyone who can reach a connected channel. On a public messaging network that is an unbounded
      set, and the message body is model input.

  - id: remoteDevice
    kind: service
    title: Remote device
    cosaiComponent: componentAgentUserQuery
    col: 0
    row: 1
    note: >
      The owner's own surfaces: the messaging apps they address the agent through, and the
      gateway's control UI. Identity here is whatever the messaging platform asserts — the
      same channels everyone else uses, with no second factor — and the control UI is a real
      attacked surface, not an admin convenience.
    items:
      - id: messagingApps
        label: Messaging apps
        icon: chat
        note: The owner instructs the agent over the same platforms unsolicited senders use.
      - id: controlUi
        label: Control UI
        icon: globe
        note: >
          The gateway's own dashboard — the surface whose token-exfiltration flaw powered the
          exposed-instance scans.

  - id: owner
    kind: actor
    title: Owner
    icon: person
    col: 0
    row: 2
    note: The person the agent acts for, addressing it over the same channels as everyone else.

  - id: bridges
    kind: service
    title: Channel bridges
    col: 1
    row: 1
    cosaiComponent: componentAgentUserQuery
    note: >
      One adapter per messaging platform, each implementing its own sender check. The count of
      channels is the count of independent authorization surfaces — disclosed bypasses in this
      archetype cluster in newly added bridges.
    items:
      - id: adapters
        label: Channel adapters
        icon: chat
        note: Per-platform inbound and outbound message handling.

  - id: toolPlane
    kind: service
    title: Tool services
    col: 2
    row: 2
    cosaiComponent: componentTools
    note: >
      The local tool surface inside the sandbox — files, shell and skills only. No computer use
      and no MCP in here: remote transports live behind the gateway, and the device's GUI is out
      of the loop's reach by construction.
    items:
      - id: editTools
        label: File & edit tools
        icon: folder
        note: >
          Read and write on the sandbox's own filesystem and the mounted workspace folders —
          never the rest of the host.
      - id: shell
        label: Shell commands
        icon: code
        note: >
          Command execution inside the sandbox. Package installs pull read-only from the private
          registry — the shell's one path off the machine.
      - id: skills
        label: Installed skills
        icon: gear
        note: >
          Prose plus executable code loaded into the daemon's own process. A skill has whatever
          the agent has.

  - id: harness
    kind: service
    title: Agent harness
    col: 2
    row: 1
    cosaiComponent: componentReasoningCore
    note: >
      One long-lived process that owns every piece of state: the loop that plans, calls tools and
      reads results back as context. Historically bound to all interfaces, which is how exposure
      scans found instances by the tens of thousands.
    items:
      - id: loop
        label: Agent loop
        icon: agent
        note: Plans, calls tools, reads the results back as context. Nobody reviews the plan.
      - id: heartbeat
        label: Heartbeat
        icon: clock
        note: >
          A periodic tick that starts the loop with no human present and re-reads the memory
          files. The mechanism that converts a one-time injection into a recurring one.
      - id: context
        label: Context assembly
        icon: doc
        note: Merges the message, the memory and the tool results into one prompt.

  - id: memory
    kind: service
    title: Memory & state
    col: 2
    row: 0
    cosaiComponent: componentDataStorage
    note: >
      Cross-session plain-text files plus the embedded search over them. Written by the agent,
      read back as instruction on every subsequent turn including the unattended ones. This is
      the persistence primitive. It lives on the sandbox's own filesystem — surviving restarts,
      removed with the sandbox — so quarantine and memory wipe are the same operation.
    items:
      - id: memoryFiles
        label: Memory files
        icon: folder
        note: Prose the next turn treats as instruction.
      - id: index
        label: Search index
        icon: search
        note: Retrieval over everything the agent has ever kept.

  - id: workspace
    kind: external
    title: Owner workspace
    cosaiComponent: componentDataSources
    col: 0
    row: 3
    note: >
      The host folders the owner chooses to share into the sandbox — mounted at their real
      paths, and the only part of the host filesystem that exists in there. Direct mode mounts
      them read-write, so an edit is on the host the moment it is made; clone mode mounts them
      read-only and the agent works on a private copy whose changes return by git. The
      enterprise posture is clone mode.
    items:
      - id: sharedPaths
        label: Shared folders
        icon: folder
        note: >
          Explicitly listed paths only. The home directory, keychains and dotfiles are not
          hidden from the agent — they are simply not there.

  - id: registry
    kind: external
    title: Private pkg registry
    cosaiComponent: componentDataSources
    col: 3
    row: 2
    note: >
      The organisation-maintained mirror of approved packages and skills — reachable read-only
      from the sandbox's install path, and nothing else. The common state is an open community
      marketplace where admission is publisher self-attestation; the provenance risk stays pinned
      here because a private mirror moves the review, it does not remove it.
    items:
      - id: hub
        label: Approved packages
        icon: db
        note: Reviewed, pinned and mirrored by the organisation before the agent can fetch them.

  - id: gateway
    kind: service
    title: AI gateway
    col: 3
    row: 1
    note: >
      The egress proxy at the sandbox boundary, and the general-purpose exit. Deny-by-default
      for all outbound traffic, credentials injected into request headers at the crossing so
      the sandbox holds no secrets, and the audit tap on everything that leaves.
    items:
      - id: allowlist
        label: Egress allowlist
        icon: shield
        note: >
          All outbound traffic denied by default, not just the web; models, tools, channels and
          registries each named explicitly.
      - id: credInjection
        label: Credential injection
        icon: key
        note: >
          Secrets stay in the host's keychain and are injected into headers at the proxy —
          inside the boundary the agent sees only placeholder values, so there is no key to
          read, log or exfiltrate.
      - id: auditTap
        label: Audit tap
        icon: doc
        note: Every crossing recorded as a side effect — the only audit trail this architecture has.

  - id: provider
    kind: provider
    title: Model provider
    col: 4
    row: 0
    cosaiComponent: componentModelServing
    note: >
      The inference API, reached only through the gateway on an injected credential. Everything
      behind the published interface is the provider's, and is not drawn.
    items:
      - id: inference
        label: Inference API
        icon: model
        note: The published interface. The completion it returns drives the tool calls.

  - id: remoteTools
    kind: service
    title: Remote tool services
    col: 4
    row: 1
    cosaiComponent: componentTools
    note: >
      The remote transports, kept outside the sandbox: MCP servers and external APIs the
      allowlist names. The sandbox reaches them only through the gateway, and only they touch
      downstream services.
    items:
      - id: mcp
        label: Remote MCP
        icon: plug
        note: >
          Remote servers on standing grants, admitted by configuration — their tool descriptions
          enter context as model input.
      - id: apis
        label: APIs & connectors
        icon: plug
        note: External service calls on the agent's behalf, made with injected credentials.

  - id: downstream
    kind: external
    title: Downstream services
    cosaiComponent: componentDataSources
    col: 4
    row: 2
    note: >
      What the remote tools reach with the user's credentials — and where fetched content comes
      back in as context indistinguishable from the user's own words.
    items:
      - id: accounts
        label: SaaS
        icon: mail
        note: The user's own mail, calendar and service accounts, reached with the user's own sessions.
      - id: web
        label: Web & APIs
        icon: globe
        note: Attacker-writable content that re-enters the loop as context.
      - id: devices
        label: Paired devices
        icon: phone
        note: >
          Companion devices exposing camera, screen and remote execution. The grant is to the
          harness — so it is also a grant to anything that has compromised the harness.

edges:
  - from: senders
    to: bridges
    path: primary
    label: unsolicited message
    note: Any party who can reach a channel can address the agent. The bridge is the admission decision.
  - from: owner
    to: remoteDevice
    path: primary
    bidir: true
    label: instruction / reply
    note: >
      The owner writes on their own surfaces — the messaging apps, or the gateway's control
      UI. Everything after this crossing rides platform identity.
  - from: remoteDevice
    to: bridges
    path: primary
    bidir: true
    note: >
      The bridge decides the sender is the owner from the messaging platform's own identifier —
      as strong as the platform makes it, with no second factor.
  - from: bridges
    to: harness
    path: primary
    bidir: true
    note: Normalised messages in; rendered replies out, to wherever the agent addresses them.
  - from: harness
    to: toolPlane
    path: primary
    bidir: true
    note: >
      Local tool calls out, results back into context — files, shell and skills, all inside the
      sandbox.
  - from: harness
    to: memory
    path: primary
    bidir: true
    note: >
      The loop writes what it learns and reads it back as instruction on every later turn —
      including the unattended ones.
  - from: harness
    to: gateway
    path: primary
    bidir: true
    label: model & egress calls
    note: >
      Every call out of the sandbox crosses the boundary here, on a credential the gateway
      injects and against per-tool permissions checked at the crossing. The completion that
      comes back is unauthenticated content that drives tool calls.
  - from: gateway
    to: provider
    path: primary
    bidir: true
    route: vh
    note: >
      Inference on an injected credential — reachable because the allowlist names it, and logged
      at the crossing.
  - from: gateway
    to: remoteTools
    path: primary
    bidir: true
    label: remote MCP & APIs
    note: >
      The only route to remote transports. Admission is the allowlist; every call is logged and
      carries an injected, scoped credential.
  - from: remoteTools
    to: downstream
    path: external
    bidir: true
    note: >
      Actions land on real accounts through the remote tools; whatever comes back re-enters the
      loop as context.
  - from: toolPlane
    to: registry
    path: external
    label: read-only pull
    note: >
      The install path: shell package pulls reach the private registry and nothing else, with no
      write permission in either direction.
  - from: toolPlane
    to: workspace
    path: external
    bidir: true
    route: vh
    label: workspace mount
    note: >
      The third opening. In direct mode a written file is a host file immediately — including
      files the host executes implicitly, like git hooks, CI configuration and IDE task
      definitions. Clone mode turns the crossing into a git fetch the owner performs.

pins:
  risks:
    - risk: riskPromptInjection
      at: senders->bridges
      note: The message body is model input, from an unbounded set of senders.
    - risk: riskPromptInjection
      at: memory
      note: >
        Memory is prose the next turn treats as instruction. One injection that writes here
        survives restarts and re-executes on the heartbeat.
    - risk: riskPromptInjection
      at: remoteTools->downstream
      note: Fetched content re-enters the loop as context indistinguishable from the user's words.
    - risk: riskShadowAndUnknownAgents
      at: harness
      note: >
        Nothing registers the agent with anyone. Organisations discover these by scanning for
        them.
    - risk: riskRunawayAgentToolLoops
      at: harness
      note: The heartbeat restarts the loop unattended; nothing bounds what a bad turn spends.
    - risk: riskSensitiveDataDisclosure
      at: harness
      note: >
        In the common deployment, credentials sit at rest inside the same blast radius as the
        code that reads them; the target state moves them behind the gateway's injection.
    - risk: riskToolSourceProvenance
      at: toolPlane->registry
      note: >
        In the common state admission is publisher self-attestation, for artifacts that are
        prose plus code. The private mirror moves the review; the risk stays until it happens.
    - risk: riskInsecureIntegratedComponent
      at: toolPlane
      note: Bridges and skills are third-party code in one process.
    - risk: riskToolRegistryTampering
      at: gateway->remoteTools
      note: >
        The configuration admitting remote servers is agent-writable in most deployments, which
        makes tool registration a self-service operation for an attacker with code execution.
    - risk: riskInsecureModelOutput
      at: gateway->provider
      note: The completion is unauthenticated content, and it drives the tool calls.
    - risk: riskRogueActions
      at: remoteTools->downstream
      note: Unattended triggering, unscoped authority and no approval gate compound here.
    - risk: riskRogueActions
      at: toolPlane->workspace
      note: >
        Direct-mode edits land on the host as they happen. A modified git hook or CI file
        executes outside the boundary the sandbox was supposed to hold.
    - risk: riskCovertChannelsInModelOutputs
      at: bridges->harness
      note: >
        Replies go wherever the agent addresses them — not necessarily back to the sender who
        prompted the turn.

  capabilities:
    - capability: capabilityPromptInjectionDefense
      at: senders->bridges
      note: Classify inbound content before it reaches the loop; treat every message as untrusted.
    - capability: capabilityAgentRuntimeEnforcement
      at: bridges
      note: One sender-admission decision enforced for every bridge, not re-implemented per channel.
    - capability: capabilitySecretsManagement
      at: gateway
      note: >
        Credentials injected at the boundary, short-lived and scoped; nothing inside the sandbox
        holds a key at rest.
    - capability: capabilityMemoryProtection
      at: harness->memory
      note: Treat memory as untrusted input on read; scope and review what gets written.
    - capability: capabilityToolPermissionScoping
      at: harness->toolPlane
      note: Per-tool grants on the local surface instead of the daemon's full authority.
    - capability: capabilityToolPermissionScoping
      at: harness->gateway
      note: >
        Tool permissions evaluated at the boundary against the agent's identity — what this
        agent may call, per destination, decided outside the loop it governs.
    - capability: capabilityToolPermissionScoping
      at: toolPlane->workspace
      note: >
        Share named folders only, and prefer the read-only clone mode — the mount list is a
        permission grant on the host filesystem.
    - capability: capabilityAgentSandboxing
      at: harness
      note: >
        Wrap the harness whole — daemon, memory and local tools in one microVM-class boundary
        with its own kernel, filesystem and network, not a per-command box. This boundary is
        what makes approval-free unattended operation defensible at all.
    - capability: capabilityMcpToolSecurity
      at: gateway->remoteTools
      note: Provenance and behavioural review before a remote server is admitted; pin what the allowlist names.
    - capability: capabilityEgressControl
      at: gateway
      note: >
        Deny-by-default egress at the boundary — models, tools, channels and registries each
        named — enforced outside the loop it contains.
    - capability: capabilityEgressControl
      at: toolPlane->registry
      note: >
        The install path is scoped to one destination and read-only — no write permission, so a
        compromised loop can pull approved packages and nothing else.
    - capability: capabilityHitlControls
      at: remoteTools->downstream
      note: A human approval gate on consequential actions, because no one saw the plan.
    - capability: capabilityKillSwitch
      at: harness
      note: A stop that is not "find the process and kill it" — and that survives the heartbeat.

scenarios:
  - title: A stranger messages the agent
    steps:
      - follow: senders->bridges
        note: The message arrives from an unbounded set of senders. The allowlist is the gate.
      - follow: bridges->harness
        note: The body enters the loop as model input.
      - follow: harness->gateway
        note: The turn's model call crosses the boundary on an injected credential.
      - follow: gateway->provider
        note: The model plans; the completion comes back and is treated as the plan.
      - follow: harness->toolPlane
        note: Local tool calls execute inside the sandbox — no human sees the plan first.
      - follow: gateway->remoteTools
        note: Anything remote has to be on the allowlist, and crosses on an injected credential.
      - follow: remoteTools->downstream
        note: Actions land on real accounts; anything fetched re-enters as context.
      - follow: bridges->remoteDevice
        note: The reply goes wherever the agent addresses it — not necessarily the surface that prompted the turn.
  - title: The heartbeat fires with nobody watching
    steps:
      - follow: memory->harness
        note: The tick re-reads memory — including anything an attacker wrote there last week.
      - follow: harness->gateway
        note: The unattended turn's calls cross the boundary like any other.
      - follow: gateway->provider
        note: Recalled prose becomes the instruction for this turn.
      - follow: harness->toolPlane
        note: The loop acts, unattended, inside the sandbox.
      - follow: toolPlane->workspace
        note: Edits reach the shared folders — in direct mode, that is the host, immediately.
      - follow: remoteTools->downstream
        note: A one-time injection has become a recurring implant — bounded now by the allowlist.
  - title: A skill is installed
    steps:
      - follow: harness->toolPlane
        note: The install is a shell command inside the sandbox.
      - follow: toolPlane->registry
        note: The pull is read-only, and only the private registry is reachable.
      - follow: toolPlane->harness
        note: The package was reviewed and mirrored first — but it still loads into the daemon's process with everything the agent has.

deviations:
  - subject: The sandbox boundary is drawn as containment, not as a block
    reason: >
      The wrap-the-whole-harness product is a boundary around the daemon, its memory and its
      local tools, with the AI gateway as the general-purpose exit and a read-only registry pull
      as the only other opening. The React Flow view draws that frame literally; the SVG view
      shows the same blocks and edges without the enclosure.
  - subject: Remote transports are drawn as their own block outside the sandbox
    reason: >
      Remote MCP and external APIs are reachable only through the gateway, so they are drawn
      behind it as "Remote tool services" — the same transports the cloud architectures call
      Tool services — while the in-sandbox Tool services block keeps only the local surface:
      files, shell and skills. The shipped products document the caveat this drawing encodes:
      a local stdio MCP server runs on the host with host permissions, outside the boundary,
      which is why the target state admits remote transports only behind the gateway.
  - subject: The workspace mount is drawn as a third opening
    reason: >
      Shipped sandboxes share the owner's chosen folders into the microVM, read-write by
      default. That crossing is real attack surface — a direct-mode edit to a file the host
      executes implicitly leaves the boundary without ever touching the gateway — so the
      drawing refuses the fiction of a two-opening sandbox.
  - subject: The registry pull is drawn from Tool services, not the harness
    reason: >
      Installs happen through shell commands, so the drawing runs the read-only pull from the
      tool surface that executes them; the grant belongs to the agent either way.
  - subject: No governance plane is drawn
    reason: >
      This archetype has none — no agent identity, no policy engine, no audit sink, no registry,
      no kill switch. The sandbox products have begun selling one — centrally managed policies
      over a fleet's network, filesystem and tool access — but that plane governs the sandbox,
      not the agent, and the archetype as assembled still has nothing. The other architectures
      in this catalogue draw a governance column; the empty space where it would be is this
      diagram's finding, and inventing one would misrepresent the pattern.

