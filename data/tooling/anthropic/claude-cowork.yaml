        note: >-
          Partial by the rule: the inventory and the connector list are enforced registers for what the
          organisation distributes, but members can still upload plugins saved locally to their own desktop and
          run their MCP servers unless isLocalDevMcpEnabled is false, connectors carry no owner or approval
          record, scheduled tasks are visible only after they run, and group plugin overrides resolve to the most
