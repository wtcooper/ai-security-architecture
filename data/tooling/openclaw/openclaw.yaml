                    - "`openclaw agents list --bindings` (or `--json`) enumerates agents, workspaces and
                      channel bindings; add or remove them with `openclaw agents add|delete` rather than
                      ad-hoc config."
                  url: https://docs.openclaw.ai/cli/agents
                - title: Approve extensions through the allowlist
                  body:
                    - plugins.allow is exclusive; a plugin outside it stays unavailable even when tools.allow
                      contains "*", and plugins.entries.<id>.enabled false disables one.
                  url: https://docs.openclaw.ai/tools/plugin
                - title: Inventory tool servers
                  body:
                    - "`openclaw mcp status --verbose` lists every mcp.servers definition with enablement,
                      OAuth and filter state; Settings → MCP in the Control UI shows the same inventory."
                  url: https://docs.openclaw.ai/cli/mcp/registry
              note: >-
                Native on the personal-agent rule: the config is the authoritative declaration of this
                gateway's agents, plugins and servers. It is scoped to one installation and carries no owner
                or approval workflow — a single-user product does not need one, but an organisation running
                several gateways records them centrally.
              verified: 2026-09-10
      - mitigation: D3-PA
        coverage: external
        evidence:
          - title: OpenClaw Gateway runbook (service labels and units)
            url: https://docs.openclaw.ai/gateway
          - title: OpenClaw logging (file logs under /tmp/openclaw)
            url: https://docs.openclaw.ai/gateway/logging
          - title: OpenClaw OpenTelemetry spans (openclaw.tool.execution)
            url: https://docs.openclaw.ai/gateway/opentelemetry/spans-and-events
        note: >-
          External (EDR): OpenClaw analyses no process behaviour. Integration points for the sensor: the
          Gateway service (LaunchAgent label ai.openclaw.gateway, or ai.openclaw.<profile>, on macOS; systemd
          user unit openclaw-gateway.service on Linux) and the exec processes it spawns; the daily JSONL logs
          under /tmp/openclaw/; OpenTelemetry openclaw.tool.execution spans carrying each tool call's
          parameters for SIEM correlation; and a plugin before_tool_call hook, which fails closed, where a
          sensor's verdict can block a tool call. Run the Gateway as a dedicated OS user so its processes are
          attributable.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityEdr
          reviewRequired: false
          original:
            - capability: capabilityEdr
              coverage: external
              note: >-
                Nothing device-resident ships with the product; run the host's own EDR and a dedicated OS
                user. The documented integration point for a security agent is a plugin before_tool_call hook
                (block or require approval on every tool call) plus `openclaw security audit --deep` for live
                probes.
              evidence:
                - title: Vendor docs index, reviewed for the integration point (2026-09-10)
                  url: https://docs.openclaw.ai/llms.txt
              verified: 2026-09-10
      - mitigation: cap-agent-egress-control
        coverage: partial
        mechanism: >-
          The Docker sandbox takes agents.defaults.sandbox.docker.network "none" (default), "bridge" or a
          custom network — on or off, with no destination list; the OpenShell backend applies an OpenShell
          policy file (plugins.entries.openshell.config.policy) that permits named destinations;
          secrets.egressProxy.allowedHosts restricts Gateway-hosted exec traffic for clients that honour the
          proxy; tools.web.fetch.ssrfPolicy host lists bound web_fetch; proxy.proxyUrl routes runtime traffic
          through the user's forward proxy.
        steps:
          - title: Keep the sandbox offline
            body:
              - Leave agents.defaults.sandbox.docker.network at its default "none"; "host" is blocked and
                container namespace joins need the dangerouslyAllowContainerNamespaceJoin break-glass key.
            url: https://docs.openclaw.ai/gateway/config-agents/sandbox
          - title: Use an OpenShell policy for a destination allowlist
            body:
              - With backend "openshell", set plugins.entries.openshell.config.policy to the absolute path of
                an OpenShell policy YAML on the Gateway host that permits only the destinations the agent
                needs; Docker network keys do not apply to that backend.
            url: https://docs.openclaw.ai/gateway/openshell
          - title: Allowlist host-exec egress
            body:
              - "`openclaw config set secrets.egressProxy.allowedHosts '[\"api.openai.com\"]' --strict-json`
                with the egress proxy enabled; an empty array is lockdown (only secret-bound and bypass
                hosts). Cooperating clients only — raw sockets can bypass it."
            url: https://docs.openclaw.ai/gateway/secrets/secret-store-and-egress
          - title: Block web_fetch destinations
            body:
              - Set tools.web.fetch.ssrfPolicy.blockedHostnames for hosts and wildcard subdomains to deny and
                keep dangerouslyAllowPrivateNetwork false; private and internal targets stay blocked unless
                named in allowedHostnames.
            url: https://docs.openclaw.ai/tools/web-fetch
        note: >-
          Partial on the architecture rule: OpenClaw's own sandbox network is on or off. A domain-level
          allowlist lives either in OpenShell, a separate runtime the OpenShell backend delegates to, or in
          the egress proxy, which only cooperating clients on Gateway-hosted exec honour (the vendor says raw
          sockets bypass it). The Gateway's own model, channel and web_fetch traffic is not
          destination-allowlisted, the sandboxed browser uses its own bridge network, and an unsandboxed exec
          backend is bounded only by the host. proxy.proxyUrl routing is only as strong as the operator
          proxy's policy.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityEgressControl
          reviewRequired: false
          original:
            - capability: capabilityEgressControl
              coverage: native
              mechanism: >-
                Sandbox containers default to network none; secrets.egressProxy.allowedHosts is an
                exact-hostname traffic allowlist for Gateway-hosted exec; web_fetch and browser SSRF policies
                block private ranges with allowedHostnames / blockedHostnames; proxy.proxyUrl routes all
                runtime HTTP/WebSocket traffic through an operator-run forward proxy (the proxy itself is
                external)
              steps:
                - title: Keep the sandbox offline
                  body:
                    - Leave agents.defaults.sandbox.docker.network at its default "none"; "host" is blocked
                      and container namespace joins need a dangerously* break-glass key.
                  url: https://docs.openclaw.ai/gateway/config-agents/sandbox
                - title: Allowlist exec egress
                  body:
                    - "`openclaw config set secrets.egressProxy.allowedHosts '[\"api.openai.com\"]'
                      --strict-json` with the egress proxy enabled; an empty array is lockdown (only
                      secret-bound and bypass hosts). Cooperating clients only — raw sockets can bypass it."
                  url: https://docs.openclaw.ai/gateway/secrets/secret-store-and-egress
                - title: Pin web_fetch destinations
                  body:
                    - Set tools.web.fetch.ssrfPolicy.allowedHostnames and blockedHostnames and keep
                      dangerouslyAllowPrivateNetwork false; private and internal hostnames are blocked by
                      default with DNS pinning.
                  url: https://docs.openclaw.ai/tools/web-fetch
                - title: Route everything through your proxy
                  body:
                    - Set proxy.proxyUrl (or OPENCLAW_PROXY_URL) and validate with `openclaw proxy validate
                      --proxy-url <url>`; the proxy's destination policy is the real boundary and OpenClaw
                      ships none.
                  url: https://docs.openclaw.ai/security/network-proxy
              note: >-
                Sandboxed exec is bounded by the container network and the egress proxy allowlist; the gateway
                process's own model and channel calls follow proxy.proxyUrl but are not destination-filtered,
                and a local (unsandboxed) exec backend is bounded only by the host.
              verified: 2026-09-10
      - mitigation: D3-FA
        coverage: partial
        mechanism: >-
          ClawHub security audits of published skill and plugin releases, with a blocked release refused at
          install; `openclaw security audit --deep` code-safety scans of installed plugins and skills
          (plugins.code_safety, skills.code_safety); security.installPolicy runs the user's own scanner before
          an install commits. Packages the agent installs and local model weights are not scanned.
        steps:
          - title: Read the release audit before installing
            body:
              - Community ClawHub installs print the release's audit outcome and details link; a blocking
                outcome or disabled download is refused, and a Review outcome only informs.
            url: https://docs.openclaw.ai/cli/plugins/install
          - title: Scan what is installed
            body:
              - Run `openclaw security audit --deep`, which adds the plugin and skill code-safety scans to the
                ordinary audit.
            url: https://docs.openclaw.ai/gateway/security/audit-checks
          - title: Put your scanner in the install path
            body:
              - Configure security.installPolicy (enabled, targets ["skill", "plugin"], exec.command) so your
                scanner returns allow, warn or block; neither --force nor the acknowledgement overrides block.
            url: https://docs.openclaw.ai/tools/skills-config
          - title: Avoid unscanned skills
            body:
              - Do not use `--force-install`, which installs a GitHub-backed skill before ClawHub's scan
                completes, and treat skills-sh, git and local installs as unscanned.
            url: https://docs.openclaw.ai/cli/skills
        note: >-
          Partial on the architecture rule: the project's registry scans what it hosts and the CLI can scan
          installed extension code, but the boundary is ClawHub releases and this Gateway's extension roots.
          Official packages and bundled plugins skip the release-trust check, npm, git and local installs are
          not scanned by ClawHub, the code scans are static and bounded, and the Python, npm or other packages
          the agent installs through exec, like any local model weights the user points models.providers at,
          reach the host unscanned. Admission scanning at a package mirror or artifact repository is the
          external control.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityModelScanning
          reviewRequired: false
          original:
            - capability: capabilityModelScanning
              coverage: none
              note: >-
                Models are remote provider APIs or local servers (Ollama, LM Studio, llama.cpp) the user
                points models.providers at; nothing inspects model files. Scan any local GGUF or other weights
                with an external tool before configuring them, including the local embedding option for
                memory.search.provider. Rated none rather than not applicable because the product's optional
                local model and local embedding paths load weights the operator supplies, and nothing in the
                product scans them.
              evidence:
                - title: Vendor docs index, reviewed; no setting for this control (2026-09-10)
                  url: https://docs.openclaw.ai/llms.txt
              verified: 2026-09-10
