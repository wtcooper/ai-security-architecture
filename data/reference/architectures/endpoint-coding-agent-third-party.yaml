id: archCodingAgentThirdParty
surface: surfaceEndpoint
rank: 1
title: Third-party coding & desktop agents
abbrev: Third-party agents

summary:
  - >
    A vendor-built agent application driven by a person who is present — a terminal CLI, an IDE
    extension, or a desktop GUI, all the same engine in a different shell. The harness and its
    tool surface ship inside the vendor's application: file and edit tools, a shell, MCP servers,
    installed skills, and optionally computer use, with sandboxed execution for the tools that
    need containing. The shell changes the review surface, not the security architecture.
    Remote steering, scheduled runs and agent-written memory are now opt-in features of the
    same engine — owner-bound and admin-toggleable, which is what still separates this from the
    personal autonomous agent.

description:
  - >
    The defining property is the human in the loop and the fact that the loop is scoped to a task.
    The person starts it, watches it, and is the approval gate for the actions that matter. That
    is the default posture rather than a guarantee: every product now ships opt-in unattended
    modes — scheduled automations, event triggers, sessions steered from a phone over an
    outbound relay — each bound to the owner's account and switchable off from the vendor
    control plane. Most
    of this archetype's security posture rests on that gate being real rather than nominal — and
    approval fatigue is the failure mode that makes everything else matter. A gate that fires on
    every file write trains the user to accept, so the architectures that hold up narrow what
    needs approving: sandboxed tools, permissions scoped in advance on the harness-to-tools path,
    and default-deny egress, so the prompts that do fire are rare enough to read.
  - >
    Everything the agent reads is untrusted input with the same standing as the user's
    instruction: source files, dependency manifests, issue text, documents, mail — and
    screenshots, where an injection can be a picture of text. The tool plane is admitted by
    configuration that often arrives with the content itself: a project dotfile that ships in the
    clone can register tool servers the user never chose, and the disclosed vulnerability pattern
    in this archetype is overwhelmingly about that file. The same convergence produced a memory
    layer: agent-written notes and rules files merged into every later session — the persistent
    instruction channel the personal agent used to own alone, now on by default in several of
    the products. Computer use is the sharpest tool the
    application can switch on — the agent acts through the GUI and inherits every application
    already signed in, through an interface built on the assumption that a human is driving.
  - >
    The application boundary is the vendor's: tool capabilities and connectors are built into the
    CLI or GUI and configured there, and the only governance this archetype has is the published
    surface of the vendor's control plane — managed settings, a tool-server allowlist, audit
    export. In a managed deployment they are the difference between a governed tool and a shadow
    one; in the default install none of them are on, and the same binary runs with no policy, no
    audit and no inventory entry.
  - >
    The first-party harnesses that run the same loop without a vendor are their own
    architecture in this catalogue — same engine, different custody: pasted keys, community
    supply chains, and no control plane. This page is the third-party pattern, where the
    vendor column is the partial governance the archetype has. The two drawings are
    deliberately identical apart from that column.

distinguishedBy:
  - >
    Against the open-source coding agents: the same engine and the same human-present default,
    but here the vendor column exists — expiring session credentials instead of pasted keys, a
    signed distribution channel instead of community registries, an owner-bound relay instead
    of a bearer-secret serve port, and a managed-settings tier an administrator can actually
    switch on.
  - >
    Against the personal autonomous agent: the capabilities have converged — this one now takes
    remote steering, scheduled runs and agent-written memory too — so what separates the
    archetypes is defaults, identity and custody. Here each of those is opt-in, addressable
    only by the owner's vendor account over an outbound relay that opens no inbound port, and
    switchable off from an admin console. The personal harness listens as its resting state, on
    raw platform identities an unbounded sender set can use, holds long-lived keys the user
    pasted in — and has no console anyone can switch anything off from.
  - >
    Against a vendor-managed runtime in the cloud: the same engine run by the vendor on their
    infrastructure gets an isolated filesystem, default-deny egress and a clean teardown. Here it
    runs on a machine that also holds the user's SSH keys, cloud credentials and browser
    sessions, and sandboxed tools are the only thing separating them from the agent's shell.

exemplars:
  - name: Terminal CLIs
    note: >
      The engine in a shell against a working directory — Claude Code and Codex in their CLI
      form — with a permission model for file writes and command execution and project-scoped
      tool servers.
    asOf: "2026-08"
  - name: IDE extensions and agent-first IDEs
    note: >
      The same engine in an editor: the VS Code extensions are the identical loop with an inline
      review surface, and Cursor is an IDE built around one. The tool-server configuration lives
      in a repository dotfile — the specific location that has repeatedly proven to be a
      code-execution path when written or swapped between approval and use.
    asOf: "2026-08"
  - name: Desktop assistant apps
    note: >
      Claude Desktop and the ChatGPT desktop app: chat over local files and standing connectors
      with the vendor's coding engine embedded underneath, plus an opt-in computer-use mode that
      drives the graphical interface behind OS screen-recording and input grants.
    asOf: "2026-08"
  - name: Managed enterprise deployments
    note: >
      The same product with centrally managed settings, an allowlist of permitted tool servers and
      exported audit. The architecture is unchanged; the vendor control plane being switched on is
      the difference.
    asOf: "2026-08"

zones:
  - id: zoneUser
    owner: user
    note: >
      The developer at the keyboard, and the phone, browser and chat surfaces they steer the
      session from when they are not.
  - id: zoneEndpoint
    owner: endpoint
    note: >
      The managed device, running the vendor's application: the harness, its tool surface and
      its memory. Ours to manage, theirs to build — its outbound routes are the SSO session to
      the approved vendor and the brokered crossing, nothing else.
  - id: zoneCloud
    owner: cloud
    note: >
      Infrastructure we operate — the AI gateway that brokers model, tool and egress traffic
      and admits agents into our systems, and those systems themselves.
  - id: zoneVendor
    owner: vendor
    note: >
      The vendor's own environment, under an enterprise agreement: their backend, their control
      plane, and the model providers behind it. Approved and allowlisted, not inspected.
  - id: zoneExternal
    owner: external
    note: Outside the company with no agreement — package registries, the open web, third-party SaaS.
  - id: zoneGovernance
    owner: governance
    note: >
      Drawn across every band because it governs every band — including the external
      connections, whose reachability is itself a governed decision.

blocks:
  - id: remoteDevice
    kind: service
    title: Remote device
    cosaiComponent: componentAgentUserQuery
    zone: zoneUser
    col: 0
    row: 0
    note: >
      The surfaces that steer a session when the developer is not at the machine — phone, web
      and chat. Bound to the owner's vendor account, and admin-toggleable, which is what
      separates this from a personal agent's open channels.
    items:
      - id: phoneWeb
        label: Phone & web apps
        icon: phone
        note: The owner's own surfaces, signed into the same vendor account as the harness.
      - id: chatChannels
        label: Chat channels
        icon: chat
        note: >
          The @-mention surfaces — and the widest admission decision here, because whoever the
          channel admits can raise a session.

  - id: developer
    kind: actor
    title: Developer
    icon: person
    zone: zoneUser
    col: 0
    row: 1
    note: >
      Present, watching, and the approval gate for what matters — the property the whole
      archetype's posture rests on, and the one that unattended modes quietly remove.

  - id: harness
    kind: service
    title: Agent harness
    cosaiComponent: componentReasoningCore
    zone: zoneEndpoint
    col: 1
    row: 1
    note: >
      The loop behind the terminal, editor or chat window, running as the user. Remote steering
      reaches it over an outbound relay; it opens no port of its own.
    items:
      - id: loop
        label: Agent loop
        icon: agent
        note: Decides the next edit, command or screen action from everything it has read.
      - id: context
        label: Context assembly
        icon: doc
        note: Merges the instruction, the memory and the tool results into one prompt.

  - id: memory
    kind: service
    title: Memory & state
    cosaiComponent: componentDataStorage
    zone: zoneEndpoint
    col: 1
    row: 2
    note: >
      Agent-written notes and the rules files merged into every later session — on by default
      in several products, and repo-committed in all of them.
    items:
      - id: memoryFiles
        label: Memory files
        icon: folder
        note: Agent-written notes loaded at the start of every session.
      - id: rules
        label: Rules & instructions
        icon: doc
        note: The AGENTS.md-class files — the repo-committed ones authored by whoever last committed.

  - id: toolPlane
    kind: service
    title: Tool services
    cosaiComponent: componentTools
    zone: zoneEndpoint
    col: 2
    row: 2
    note: >
      The application's action surface, running as the user on a machine that also holds their
      SSH keys, cloud credentials and browser sessions.
    items:
      - id: editTools
        label: File & edit tools
        icon: folder
        note: Read and write across the working tree and the user's documents.
      - id: shell
        label: Shell commands
        icon: code
        note: Command execution with the user's authority when it runs outside the sandbox.
      - id: mcp
        label: MCP servers
        icon: plug
        note: >
          The servers a developer installs on their own machine — local child processes with
          the user's privileges. Remote ones are reached through the gateway, not from here.
      - id: sandboxedTools
        label: Sandboxed tools
        icon: shield
        note: Where builds, tests and driven desktops run when isolation is on.
      - id: skills
        label: Installed skills
        icon: gear
        note: >
          Packaged instructions and helpers pulled through the crossing's skills broker —
          content that executes as instruction, versioned and pinned like code.
      - id: computerUse
        label: Computer use
        icon: eye
        note: >
          The sharpest tool the application can switch on: the agent drives the GUI and
          inherits every application already signed in.

  - id: aiGateway
    kind: service
    title: AI gateway
    zone: zoneCloud
    col: 3
    row: 2
    note: >
      The crossing into our own systems, and the one general-purpose exit from the endpoint:
      how both the local application and the vendor's hosted sessions reach org data, and the
      only place that reach is scoped and recorded. Its items are the traffic classes it
      brokers; the checks it runs — the allowlist that admits the vendor by name, the audit
      tap, the credential broker — are the numbered pins on this block and its edges, and the
      call-outs beneath.
    pack: aiGatewayTraffic

  - id: hostedTools
    kind: service
    title: Tool services
    cosaiComponent: componentTools
    zone: zoneCloud
    col: 3
    row: 3
    note: >
      Our own tool servers and service APIs — the same component as the endpoint's local
      surface and the external one, at a different band. What the agent is actually meant to
      reach, and what the gateway in front of it decides it may.
    items:
      - id: internalMcp
        label: MCP servers
        icon: plug
        note: Our own servers, listed in the catalogue the gateway enforces.
      - id: internalApis
        label: APIs & connectors
        icon: plug
        note: Service APIs reached on grants the gateway issues, scoped to the developer.

  - id: orgData
    kind: external
    title: Enterprise data
    cosaiComponent: componentDataSources
    zone: zoneCloud
    col: 3
    row: 4
    note: >
      The repositories, documents and systems of record behind our own tool servers. Ours, and
      still untrusted as input — many hands wrote the content, and none of them are
      authenticated.
    items:
      - id: code
        label: Code & project docs
        icon: doc
        note: A repository is a document the attacker may have contributed to.
      - id: dotfile
        label: Tool config dotfile
        icon: gear
        note: The tool-server declaration that ships with the code — the most attacked artifact here.
      - id: records
        label: Org data
        icon: db
        note: Business systems reached under the developer's scope, never a standing service account.
      - id: fileStorage
        label: File storage
        icon: folder
        note: Governed content stores reached through our connectors rather than the device's mounts.

  - id: vendorService
    kind: provider
    title: Vendor service
    zone: zoneVendor
    col: 4
    row: 0
    note: >
      The vendor's backend and the published surfaces of its control plane — outside the
      company, whatever the contract says. Its internals are assured, not drawn: what is listed
      here is only what the organisation can configure or receive.
    items:
      - id: managedSettings
        label: Managed settings
        icon: gear
        note: Centrally enforced permissions and a tool-server allowlist. Off by default.
      - id: auditExport
        label: Session audit export
        icon: eye
        note: Exported prompts, tool calls and approvals — in an unmanaged install, no record at all.
      - id: remoteSessions
        label: Remote & scheduled sessions
        icon: phone
        note: The relay behind phone steering and the scheduler behind unattended runs.

  - id: extTools
    kind: service
    title: Tool services
    cosaiComponent: componentTools
    zone: zoneExternal
    col: 5
    row: 2
    note: >
      Third-party servers and connectors — the same component again, out where nobody we
      contracted with operates it. Admitted by assessment even when the service is free and
      unsupported, or refused at the crossing.
    items:
      - id: mcp
        label: MCP servers
        icon: plug
        note: Remote servers whose tool descriptions enter context as model input.
      - id: apis
        label: APIs & connectors
        icon: plug
        note: Third-party service calls made on brokered, developer-scoped credentials.

  - id: provider
    kind: provider
    title: Model provider
    cosaiComponent: componentModelServing
    zone: zoneExternal
    col: 5
    row: 1
    note: The inference API behind the vendor's service. The completion drives writes, commands and clicks.
    items:
      - id: inference
        label: Inference API
        icon: model
        note: Receives code, documents and screenshots; returns the plan.

  - id: downstream
    kind: external
    title: Downstream services
    cosaiComponent: componentDataSources
    zone: zoneExternal
    col: 5
    row: 3
    note: >
      What the tool plane reaches on the open internet — dependency registries, the web, and
      third-party SaaS the developer has grants into.
    items:
      - id: registries
        label: Package registries
        icon: db
        note: Dependencies and their metadata, authored by strangers and read into context.
      - id: web
        label: Web & APIs
        icon: globe
        note: Attacker-writable content that re-enters the loop, and the exfiltration path out.
      - id: saas
        label: SaaS
        icon: mail
        note: Third-party accounts reached on standing grants that outlive the conversation.

  - id: govIdentity
    kind: governance
    title: Identity services
    icon: person
    zone: zoneGovernance
    col: 0
    row: 5
    capabilities: [capabilityIga]
    note: >
      The IdP and device-posture plane deciding who may open a session at all, and on what
      machine — the binding that makes the enterprise agreement apply to this traffic.

  - id: govSecrets
    kind: governance
    title: Secrets & key management
    icon: key
    zone: zoneGovernance
    col: 1
    row: 5
    capabilities: [capabilitySecretsManagement, capabilityCredentialIsolation]
    note: >
      Vaulted, short-lived, connector-scoped grants on our own keys — and keeping the
      developer's own keys and sessions out of the agent's reach.

  - id: govPolicy
    kind: governance
    title: Policy & authorization
    icon: scale
    zone: zoneGovernance
    col: 2
    row: 5
    capabilities: [capabilityAgentRuntimeEnforcement, capabilityEgressControl, capabilityAiDlp]
    note: >
      The decisions the two crossings enforce per call — what may be reached, and what may
      leave — authored where the vendor's application cannot override them.

  - id: govSupplyChain
    kind: governance
    title: Supply-chain assurance
    icon: db
    zone: zoneGovernance
    col: 4
    row: 5
    capabilities: [capabilityAgentRegistry, capabilityMcpToolSecurity, capabilityAiTprm]
    note: >
      Which agents, connectors and servers are admitted, pinned to which versions — and the
      vendor assessment that put the approved destinations in the allowlist.

  - id: govObservability
    kind: governance
    title: Observability & response
    icon: eye
    zone: zoneGovernance
    col: 6
    row: 5
    capabilities: [capabilityAuditLogging, capabilityShadowAiDiscovery]
    note: >
      Our session record fused with the vendor's export, and the discovery that finds the
      installs which never enrolled.


edges:
  - from: developer
    to: remoteDevice
    path: primary
    bidir: true
    label: away from the machine
    note: The same person, not at the keyboard — or, on a chat surface, not necessarily the same person.
  - from: developer
    to: harness
    path: primary
    bidir: true
    label: local session
    note: >
      The direct path, and the one most developers use: the CLI, editor or desktop app on the
      machine, authorised by holding the machine. The same shape as the personal agent's local
      session — proximity is the authorisation, so device posture carries it.
  - from: remoteDevice
    to: vendorService
    path: external
    bidir: true
    label: remote steering
    note: >
      The phone talks to the vendor's relay directly, and this is the one path in the drawing
      that never touches anything we operate — a personal device on a cell network has no
      reason to traverse the corporate egress and no way to be made to. Admission here is the
      vendor's account binding and whatever the managed settings allow, which is exactly why
      that tier is the control rather than our firewall.
  - from: harness
    to: memory
    path: primary
    bidir: true
    note: The loop writes what it learns and reads it back as instruction on the next task.
  - from: harness
    to: toolPlane
    path: primary
    bidir: true
    route: hv
    label: local tool calls
    note: Tool calls out with whatever scope the permission model granted; results back into context.
  - from: harness
    to: vendorService
    path: external
    bidir: true
    route: vh
    label: SSO session
    note: >
      The primary and vendor-recommended path, and the one most of our users are on: the
      application authenticates to the vendor's own service and calls it directly. Enterprise
      SSO happens at the vendor's account layer, so this leg is what makes the sign-in work at
      all — the client has to reach them. What governs it is the tenant binding behind that
      account and the assessment behind the allowlist entry, not an inspection point we run.
  - from: harness
    to: aiGateway
    path: primary
    bidir: true
    route: hv
    label: model & tool calls
    note: >
      The one general-purpose crossing: the vendor session, every model call inside it, and
      every remote tool call leave the endpoint here.
  - from: toolPlane
    to: aiGateway
    path: primary
    bidir: true
    label: brokered calls
    note: >
      The local tool surface reaches nothing on its own. Connectors and remote servers are
      brokered here, and the crossing's bundled egress-proxy function carries the tool plane's
      package and web fetches to their allowlisted destinations — one tier, several duties,
      per the recorded deviation.
  - from: aiGateway
    to: vendorService
    path: external
    bidir: true
    route: vh
    label: to the approved vendor
    note: >
      Out to the vendor's backend on a session-scoped credential. The destination is in the
      allowlist because an assessment cleared it, and the agreement governs the data once it
      arrives.
  - from: vendorService
    to: provider
    path: external
    bidir: true
    route: vh
    note: The vendor's service calls the model provider; everything behind that interface is theirs.
  - from: aiGateway
    to: hostedTools
    path: primary
    bidir: true
    label: internal tool calls
    note: >
      The path the deployment exists for: our own servers and APIs, admitted by the catalogue
      and reached on grants scoped to the developer.
  - from: hostedTools
    to: orgData
    path: primary
    bidir: true
    label: scoped reads & writes
    note: >
      Repository reads, the writes that become pull requests, and business-system calls —
      recorded on our side of the boundary.
  - from: aiGateway
    to: extTools
    path: external
    bidir: true
    label: brokered external calls
    note: Admission is the catalogue; every call carries a scoped, short-lived credential.
  - from: extTools
    to: downstream
    path: external
    bidir: true
    note: >
      Registries, the web and third-party accounts — and whatever returns re-enters the loop as
      context.

pins:
  risks:
    - risk: riskPromptInjection
      at: hostedTools->orgData
      note: >
        Source files, manifests, issue text and documents are unrelated paths into the same
        context window, none of which is the developer's instruction.
    - risk: riskPromptInjection
      at: memory
      note: >
        Memory files and rules are prose a later session treats as instruction — including
        rules committed by whoever last touched the repo, and the settings hooks the worm
        incidents wrote their persistence into.
    - risk: riskToolRegistryTampering
      at: toolPlane
      note: >
        Configuration admits the whole tool plane and can arrive with the clone. Injecting into
        it and swapping it after approval are the disclosed paths.
    - risk: riskInsecureModelOutput
      at: harness
      note: >
        The completion is unauthenticated content, and this is where it becomes the plan —
        file writes, commands and clicks all start as text the model returned.
    - risk: riskExcessiveDataHandlingDuringInference
      at: harness->vendorService
      note: >
        Code, documents and screenshots leave the company on the SSO session — the path most
        users are actually on — usually more than the developer pictured sharing, and with
        nothing of ours on the hop to see how much.
    - risk: riskStaleAgentIdentityBinding
      at: remoteDevice->vendorService
      note: >
        A remote channel is only as good as the account and device binding behind it, and this
        one is bound by the vendor rather than by us. A stale login steering a machine full of
        credentials is an account-compromise blast radius, and nothing we operate is on the
        path to notice it.
    - risk: riskAgenticDelegationConfusedDeputy
      at: aiGateway->vendorService
      note: >
        A hosted session arriving with a connector grant is the vendor's infrastructure
        exercising our authority — the grant is what bounds it, and our gateway issues it.
    - risk: riskSensitiveDataDisclosure
      at: toolPlane->aiGateway
      note: >
        The machine also holds SSH keys, cloud credentials and browser sessions; outside the
        sandbox nothing separates them from the agent's shell on the way out.
    - risk: riskToolSourceProvenance
      at: extTools->downstream
      note: >
        Dependencies and remote servers arrive on publisher self-attestation, and their
        descriptions and contents are read into context as model input.
    - risk: riskRogueActions
      at: hostedTools->orgData
      note: Writes into systems of record from a loop whose plan nobody reviewed.
    - risk: riskInsecureIntegratedComponent
      at: aiGateway
      note: >
        The gateway is third-party code holding the brokered credentials and the allowlist —
        a compromised release of the tier the controls hang on is the joined incident's
        centrepiece, not a hypothetical.
    - risk: riskMCPTransportHijacking
      at: aiGateway->extTools
      note: >
        A remote server's transport, redirected or replayed between approval and use, delivers
        somebody else's tools under an approved name.
    - risk: riskZombieShadowMCPServers
      at: toolPlane
      note: >
        A server admitted once and forgotten keeps its process, its privileges and its place
        in context long after the project that justified it.
    - risk: riskShadowAndUnknownAgents
      at: harness
      note: >
        A binary a developer can fetch without asking anyone. Unmanaged, it has no policy, no
        audit and no inventory entry — and that is the common case.

  capabilities:
    - capability: capabilityIga
      at: vendorService
      note: >
        Federated login enforced in the vendor's account layer — Zone-2 configuration, because
        the phone never touches our network and the account binding is the only lever. An
        unfederated vendor login is the finding.
    - capability: capabilityAgentRuntimeEnforcement
      at: harness->aiGateway
      note: Session admission and per-call policy evaluated at the edge, outside the application being governed.
    - capability: capabilityAiTprm
      at: vendorService
      note: >
        The assessment behind the allowlist entry, pinned on the vendor itself: their
        controls, retention terms and tenancy are the substance of the review, because once
        the destination is approved and named, the session is not something we inspect.
    - capability: capabilityAiDlp
      at: toolPlane->aiGateway
      note: >
        Inspection belongs on the arbitrary-destination path, where the agent fetches from
        registries and the open web — not on the pinned vendor session.
    - capability: capabilityEgressControl
      at: aiGateway->extTools
      note: >
        Default-deny outbound enforced at the crossing we operate — the vendor's endpoints and
        the approved registries in the allowlist, nothing else.
    - capability: capabilityToolPermissionScoping
      at: harness->toolPlane
      note: >
        Per-tool grants scoped to the working tree and the task, instead of the developer's
        full authority on the machine.
    - capability: capabilityAgentSandboxing
      at: toolPlane
      note: >
        Make sandboxed tools the default path for commands and computer use, so the approval
        gate fires only for actions that leave the box.
    - capability: capabilityCredentialIsolation
      at: toolPlane
      note: Keep SSH keys, cloud credentials and browser profiles outside the agent's reachable filesystem.
    - capability: capabilityMemoryProtection
      at: harness->memory
      note: Treat memory and rules as untrusted input on read; a repo-committed rules change is a code change.
    - capability: capabilityPromptInjectionDefense
      at: hostedTools->orgData
      note: Treat repository and document content as untrusted; it cannot be authenticated, only bounded.
    - capability: capabilitySecretsManagement
      at: aiGateway
      note: >
        Org access rides short-lived, connector-scoped grants issued at the marketplace on our
        own keys — the vendor's cloud never holds a standing org credential.
    - capability: capabilityMcpToolSecurity
      at: toolPlane->aiGateway
      note: Provenance and behavioural review before a server is admitted; pin versions so an update is a decision.
    - capability: capabilityHitlControls
      at: hostedTools->orgData
      note: Non-overridable approval on consequential writes, kept rare enough that each prompt is read.
    - capability: capabilityAgentRegistry
      at: aiGateway
      note: >
        A managed allowlist of connectors and tool servers, enforced from our gateway rather
        than from the configuration file it governs.
    - capability: capabilityAuditLogging
      at: aiGateway
      note: >
        Our own session record, fused with the vendor's export — only the combination covers
        what the vendor's console cannot see.
    - capability: capabilityShadowAiDiscovery
      at: harness
      note: Find the installs that never enrolled, because this archetype spreads one developer at a time.
    - capability: capabilityKillSwitch
      at: govObservability
      note: >
        Unattended modes need a stop: sessions switchable off from the vendor control plane,
        and the gateway able to revoke the grants a scheduled run rides on — without waiting
        for the owner to notice.
    - capability: capabilityEdr
      at: harness
      note: >
        The device tooling that sees what no crossing can: which harnesses are installed,
        what their processes execute, and the containment that isolates a machine whose agent
        has been steered.

walkthrough:
  title: The developer asks for a change
  moves: >-
    A task stated at the machine, inference through the vendor, and the approved edits it
    produces.
  steps:
    - follow: developer->harness
      note: The task is stated by a human who will stay for the session.
    - follow: harness->vendorService
      note: >
        Context leaves on the SSO session — the vendor-recommended path, and the one most of
        our users are on. What governs it is the tenant binding and the assessment behind the
        allowlist entry.
    - follow: vendorService->provider
      note: The vendor's service calls the model provider behind it; everything past that interface is theirs.
    - follow: provider->vendorService
      note: The completion comes back to the vendor's service.
    - follow: vendorService->harness
      note: And down the same session into the loop — unauthenticated content, now the plan.
    - follow: harness->developer
      note: >
        Consequential actions surface for approval before they run — the gate the whole
        archetype leans on, rare enough that each prompt is read.
    - follow: developer->harness
      note: Approved — this action, these arguments, not a blanket yes.
    - follow: harness->toolPlane
      note: Edits and commands execute with whatever scope the permission model granted.
    - follow: toolPlane->aiGateway
      note: >
        Anything leaving the machine crosses our tier — a dependency fetch bound for an
        allowlisted registry, a call to our own servers, all on the same bundled crossing.
    - follow: aiGateway->extTools
      note: A third-party server or connector, admitted by the catalogue on a scoped credential.
    - follow: extTools->downstream
      note: >
        And out to what those services act on. What comes back is loaded and read as context,
        which is why the provenance of a tool matters as much as the content of a page.

scenarios:
  - title: Steering from a phone
    steps:
      - follow: developer->remoteDevice
        note: The developer types the instruction on a phone or in a chat thread, away from the machine.
      - follow: remoteDevice->vendorService
        note: Out to the vendor, authenticated by the vendor's account and nothing of ours.
      - follow: vendorService->harness
        note: >
          Down the outbound SSO session the harness was already holding open. Nothing of ours
          is on this path — the relay requires the vendor's own API, which is exactly the
          trade the deviation records — and nothing listens on the endpoint; the work arrives
          only because the harness dialled out first.
      - follow: harness->toolPlane
        note: The work happens locally, with the developer's files, credentials and sessions around it.
      - follow: toolPlane->harness
        note: The result comes back to the loop.
      - follow: harness->vendorService
        note: The result goes back up the same outbound session.
      - follow: vendorService->remoteDevice
        note: >
          And back to the phone, the way it came. Six steps across two boundaries — and the
          honest point is that no control of ours sits on any of them: admission is the
          vendor's account binding and the managed-settings tier, which is why those are the
          controls this page pins.
  - title: A poisoned document phones home
    steps:
      - follow: harness->aiGateway
        note: The loop asks for a document — a ticket, a wiki page, a shared file — through our crossing.
      - follow: aiGateway->hostedTools
        note: Brokered to the connector that can read it.
      - follow: hostedTools->orgData
        note: A hidden instruction in the document is read along with the document.
      - follow: orgData->hostedTools
        note: The content comes back as a tool result.
      - follow: hostedTools->aiGateway
        note: Across the crossing, where inspection is possible and rarely configured.
      - follow: aiGateway->harness
        note: And into context, where the loop cannot tell the instruction from the task.
      - follow: harness->vendorService
        note: The poisoned context goes up to the vendor for inference, on the SSO session.
      - follow: vendorService->provider
        note: Nothing on this hop knows the context is hostile.
      - follow: provider->vendorService
        note: The completion carries the attacker's instruction as the plan.
      - follow: vendorService->harness
        note: The loop treats it as the next step.
      - follow: harness->toolPlane
        note: A shell command or edit tool bundles a token, a file or a key into a request.
      - follow: toolPlane->aiGateway
        note: The exfiltration attempt has to cross the egress allowlist — the last control standing.
      - follow: aiGateway->extTools
        note: To an allowlisted destination the attacker controls, or a domain nobody reviewed.
  - title: A hosted session reaches back
    steps:
      - follow: vendorService->aiGateway
        note: A cloud or scheduled session asks for org data; nobody's laptop is involved.
      - follow: aiGateway->hostedTools
        note: >
          Our gateway admits it to our own tool surface rather than letting the vendor's cloud
          reach past into the data directly.
      - follow: hostedTools->orgData
        note: The scoped, BYOK-backed grant reaches exactly the admitted connector, and we record it.

deviations:
  - subject: One model path is drawn; the customer-key variant is recorded, not drawn
    reason: >
      The SSO path — the application authenticating to the vendor and calling it directly —
      is the vendor-recommended baseline and the one most of our users are on, so it is the
      one drawn. The documented alternative, inference on our own keys through the gateway
      with the vendor out of the loop, is a separately reviewed variant rather than a second
      edge, because the two are not composable: the vendor's remote-control relay requires
      the vendor's own API, so pointing the client at a gateway disables remote steering,
      server-side web search and the long prompt cache. Route through your gateway and gain
      credential control, egress policy, audit and spend ceilings; lose the relay. That trade
      — not a missing rate-limit pin — is also why the sibling drawing pins rateLimiting and
      this one leans on the vendor's seat metering.
  - subject: The crossing bundles an egress-proxy function
    reason: >
      A LiteLLM-class tier is not a general web proxy, but this catalogue draws the endpoint's
      arbitrary-destination traffic — package and web fetches — over the same crossing that
      brokers model and tool calls, because the duties are enforced together even where they
      are implemented as separate proxies. An organisation running a distinct egress/SSE tier
      splits the block and changes nothing else; the personal agent records the same bundling.
  - subject: The vendor's own path is admitted, not inspected
    reason: >
      A pinned TLS session to an approved vendor cannot be inspected without breaking the
      product, and drawing an inspection point on it would assert a control nobody operates.
      What governs that path is the assessment behind the allowlist entry, the tenant binding
      in managed settings, and the agreement — pinned as vendor assurance rather than drawn.
      Note the contrast worth carrying into product selection: not every vendor in this
      category offers a path that removes them from inference. One major competitor routes
      every request through its own backend by design, including when the customer supplies
      their own keys, which additionally voids that vendor's zero-retention terms.
  - subject: The sandbox is a Sandboxed tools item, not a frame
    reason: >
      Of the ontology's three canonical sandbox forms, this one is a contained execution path
      inside one application: the harness and shell run as the user, and only tool execution
      is contained — conditionally, when isolation is on. A boundary frame would claim a
      containment the drawing's own notes deny. The personal agent, whose whole loop lives
      inside the container, draws the frame; here the item form is the honest one.

