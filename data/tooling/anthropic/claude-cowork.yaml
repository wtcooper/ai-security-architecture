            body:
              - Set disabledBuiltinTools (for example Bash, Read(**/.env)) and builtinToolPolicy ask entries in Claude
                Desktop managed configuration; managed Bash and WebFetch deny rules in Claude Code policy also
                stop Cowork's workspace tools.
            url: https://claude.com/docs/third-party/claude-desktop/configuration
        note: >-
