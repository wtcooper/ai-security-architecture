  - architecture: archAgentWorkflow
    asOf: "2026-10"
    # >>> checked against the vendor's documentation
    verified: "2026-11-18"
    sources:
      events: https://learn.microsoft.com/en-us/azure/service-bus-messaging/service-bus-messaging-overview
      harness: https://learn.microsoft.com/en-us/agent-framework/hosting/durable-extension
      localTools: https://learn.microsoft.com/en-us/azure/container-apps/sessions
      orchestration: https://learn.microsoft.com/en-us/azure/durable-task/sdks/durable-agents-microsoft-agent-framework
      subagents: https://learn.microsoft.com/en-us/agent-framework/overview/
      state: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/what-is-foundry-iq
      gateway: https://learn.microsoft.com/en-us/azure/api-management/genai-gateway-capabilities
      provider: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-sold-directly-by-azure
      internalTools: https://learn.microsoft.com/en-us/azure/api-management/mcp-server-overview
      openWeb: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/bing-tools
      registry: https://learn.microsoft.com/en-us/azure/devops/artifacts/start-using-azure-artifacts
    differences:
      - at: harness->gateway
        text: "Microsoft's durable agent samples create the model client straight against the Foundry endpoint; nothing routes it through API Management. The builder must point every agent's client at API Management and give model access only to API Management's managed identity."
        url: https://learn.microsoft.com/en-us/azure/durable-task/sdks/durable-agents-microsoft-agent-framework
      - at: gateway
        text: "Microsoft now offers two gateways for Foundry models and tools: Azure API Management and a separate Azure AI Gateway resource type. The settings in this mapping apply to API Management only, so the builder must choose API Management deliberately."
        url: https://learn.microsoft.com/en-us/azure/foundry/configuration/enable-ai-api-management-gateway-portal
      - at: gateway->openWeb
        text: "Web search runs inside Foundry as a tool of the model platform. Its traffic uses public egress, bypasses API Management and Azure Firewall, and leaves Azure's compliance boundary. Only pages your own code fetches can be forced through your network controls."
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/bing-tools
      - at: localTools
        text: "The code sandbox is a separate service, not part of the agent process. The agent calls a session pool over HTTPS at a dynamicsessions.io address using an Entra token and the Session Executor role. Allow that address through Azure Firewall."
        url: https://learn.microsoft.com/en-us/azure/container-apps/sessions-usage
      - at: localTools->registry
        text: "With egress disabled (the default) sandbox sessions cannot reach the package feed or the memory stores. The agent passes files in and out through the pool API; packages beyond the preinstalled set need a custom container pool."
        url: https://learn.microsoft.com/en-us/azure/container-apps/session-pool
      - at: harness
        text: "Azure adds a separate way out that the generic drawing lacks: the agent's outbound traffic is routed to Azure Firewall with user-defined routes. This works only in a workload profiles Container Apps environment and needs an allow rule per outside address."
        url: https://learn.microsoft.com/en-us/azure/container-apps/use-azure-firewall
      - at: orchestration->state
        text: "The journal does not live in your database. Workers stream it to the managed Durable Task Scheduler service at a durabletask.io address, signed in with the app's identity. Add a private endpoint and the Durable Task Worker role; payloads are capped at 1 MB."
        url: https://learn.microsoft.com/en-us/azure/durable-task/scheduler/durable-task-scheduler
      - at: operator->events
        text: "A queue message does not resume a paused step by itself. When self-hosted on Container Apps the host must expose its own API and pass the operator's answer to the workflow client; only Azure Functions hosting generates the respond endpoint for you."
        url: https://learn.microsoft.com/en-us/agent-framework/hosting/durable-extension
      - at: sources->registry
        text: "Azure Artifacts has no review step for public packages: when anyone with the Collaborator role installs through the feed, the package is saved automatically. Give that role only to a curation pipeline and everyone else Reader."
        url: https://learn.microsoft.com/en-us/azure/devops/artifacts/concepts/upstream-sources
    alsoNeeded:
      - service: "Microsoft Entra ID"
        role: identity
        why: "Signs in users and issues tokens for the managed identities used on every hop."
        url: https://learn.microsoft.com/en-us/entra/fundamentals/what-is-entra
      - service: "Azure Virtual Network with private endpoints and private DNS zones"
        role: network
        why: "Keeps Foundry, Cosmos DB, search and API Management reachable only from inside the network."
        url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
      - service: "Azure Firewall"
        role: network
        why: "The single controlled way out for the agent subnet, with an address allowlist."
        url: https://learn.microsoft.com/en-us/azure/firewall/overview
      - service: "Azure Key Vault"
        role: secrets
        why: "Holds Application Gateway TLS certificates and any secrets for connections that cannot use Entra ID."
        url: https://learn.microsoft.com/en-us/azure/key-vault/general/overview
      - service: "Azure Container Registry"
        role: registry
        why: "Stores the agent and tool-server container images that Container Apps pulls; Azure Artifacts cannot."
        url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-intro
      - service: "Azure Monitor: Application Insights and a Log Analytics workspace"
        role: logging
        why: "Receives traces and diagnostics from the agent, API Management and data stores."
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/log-analytics-workspace-overview
      - service: "Azure AI Content Safety resource"
        role: other
        why: "The llm-content-safety policy sends prompts to it; it must exist as an API Management backend."
        url: https://learn.microsoft.com/en-us/azure/ai-services/content-safety/overview
      - service: "Azure Language resource (PII detection)"
        role: other
        why: "The PII redaction step calls this service; it is a separate resource to deploy."
        url: https://learn.microsoft.com/en-us/azure/ai-services/language-service/personally-identifiable-information/overview
      - service: "Azure API Center"
        role: other
        why: "Holds the inventory of MCP servers and APIs the agent may call."
        url: https://learn.microsoft.com/en-us/azure/api-center/register-discover-mcp-server
      - service: "Application Gateway with WAF (or internal-only ingress)"
        role: ingress
        why: "Protects the approval and status API your self-hosted workflow must expose to operators."
        url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/ag-overview
