# On-premises data centre: the hosted patterns as run on infrastructure the organisation owns and
# operates itself, with the security-relevant settings of the self-hosted software that plays each
# component. Nothing here is a provider's to run: the reference stack is Kubernetes on the
# organisation's own servers, LiteLLM Proxy as the AI gateway, vLLM for inference, Keycloak, Vault,
# Cilium, Harbor, MLflow and an OpenTelemetry-based logging stack. Each is this mapping's choice for
# its role, and an organisation records what it runs instead in data/status.yaml.
#
# Rows follow data/tooling/BASELINE.md, as the cloud files do: the setting as the project's own
# documentation names it, a url that resolved on its verified date, the baseline value, and the
# controls on the drawing it delivers. setVia "code" marks a control no product setting provides.
id: cloudOnPrem
name: On-premises data centre
short: On-premises
selfManaged: true
boundary: Enterprise data centre

settings:
  # --- Identity & access ---------------------------------------------------------------
  - id: keycloakGroupsAccess
    name: "Condition - User Role with Deny Access (conditional flow)"
    where: "Keycloak › Authentication › Flows › a copy of the browser flow bound to the client, with a conditional sub-flow: Condition - User Role, then Deny Access; the client role granted through Groups"
    setVia: [identityProvider]
    area: identity
    recommended: "One client role for each client people sign in to, granted to groups and never to individual users; the flow denies sign-in to anyone who lacks the role; group membership reviewed on the same cycle as any access grant; step-up or network conditions sit in the same flow"
    why: "Who may use a client is decided in the identity provider, per group, before any token for it exists, and access follows group membership when someone moves or leaves."
    mitigations: [D3-APA]
    url: https://www.keycloak.org/docs/latest/server_admin/index.html#explicitly-denyallow-access-in-conditional-flows
    verified: "2026-11-18"
  - id: keycloakTokenLifetimes
    name: "Access Token Lifespan and Revocation"
    where: "Keycloak › Realm settings › Tokens: Access Token Lifespan (client override under the client's Advanced settings), Revoke Refresh Token; Realm settings › Sessions: SSO Session Idle, SSO Session Max, Client Session Max; Sessions › Actions › Revocation (not-before, Set to now, Push); the client's Enabled switch"
    setVia: [identityProvider]
    area: identity
    requires: "Access tokens already issued stay valid until they expire, which is why the lifespan must be short"
    recommended: "Access Token Lifespan of five minutes or less; Client Session Max no longer than a working day; Revoke Refresh Token enabled; the incident runbook disables the affected client, uses Revocation › Set to now › Push and signs out active sessions; a drill times how long the last old token keeps working"
    why: "A token already issued stays valid until it expires, so a short lifespan bounds how long a stolen or revoked token is useful, and disabling the client stops new tokens, exchanges and refreshes at once."
    mitigations: [D3-APA, cap-agent-kill-switch, D3-CH, D3-CR]
    url: https://www.keycloak.org/docs/latest/server_admin/index.html#_timeouts
    verified: "2026-11-18"
  - id: litellmVirtualKeys
    name: "Virtual Keys"
    where: "LiteLLM Proxy › POST /key/generate (or the admin UI › Virtual Keys); general_settings.master_key and database_url (DATABASE_URL) set"
    setVia: [apiCli, adminConsole]
    area: identity
    default: "Off: virtual keys need general_settings.master_key and a PostgreSQL database_url, and neither is set out of the box; a key has no expiry unless duration is set"
    recommended: "One key per calling agent, team, client or run, issued with models, allowed_routes, a duration (expiry) and its own MCP server and agent lists; the master key used only to mint keys, never to carry traffic; upperbound_key_generate_params caps the budget, limits and duration any key may be given"
    why: "Each caller has its own identity at the gateway, checked on every call, so usage is attributable and one caller can be cut off without touching the rest."
    mitigations: [D3-AA, D3-CH, D3-CTS]
    url: https://docs.litellm.ai/docs/proxy/virtual_keys
    verified: "2026-11-18"
  - id: litellmKeyRotation
    name: "Disable Keys (/key/block) and key expiry (duration)"
    where: "LiteLLM Proxy › duration on /key/generate; POST /key/block and /key/unblock; /key/{key}/regenerate; auto_rotate and rotation_interval with LITELLM_KEY_ROTATION_ENABLED=true"
    setVia: [apiCli]
    area: identity
    default: "Keys do not expire and are not blocked unless you set it"
    requires: "Key Rotations (/key/{key}/regenerate, auto_rotate, rotation_interval) need a LiteLLM Enterprise licence; duration and /key/block do not"
    recommended: "A duration on every key, capped with litellm_settings.upperbound_key_generate_params, and each key re-issued before it lapses; POST /key/block as the first step of the cut-off runbook, timed in a drill; where the licence allows, auto_rotate: true with a rotation_interval of 30d or less"
    why: "A leaked key stops working on its own, and a misbehaving caller loses the gateway in one call, whatever tokens it still holds and without a release."
    mitigations: [D3-CH, cap-agent-kill-switch, D3-CR]
    url: https://docs.litellm.ai/docs/proxy/virtual_keys
    verified: "2026-11-18"
  - id: keycloakTokenExchange
    name: "Standard token exchange"
    where: "Keycloak › Clients › the requesting client › Capability config › Standard Token Exchange switch; token endpoint with grant_type=urn:ietf:params:oauth:grant-type:token-exchange, subject_token, audience; client policy executor downscope-assertion-grant-enforcer"
    setVia: [identityProvider]
    area: identity
    default: "Off for each client until its switch is turned on. The server feature (token-exchange-standard:v2) is enabled by default; legacy token exchange is deprecated and off"
    requires: "Standard token exchange covers tokens of your own realm; delegation is a preview feature and subject impersonation is not implemented"
    recommended: "On only for the confidential clients that hand work on (the gateway, or a service that calls other systems); every exchange names one audience; the downscope-assertion-grant-enforcer executor applied so an exchange can only narrow a token; refresh tokens in token exchange set to No; exchanges logged"
    why: "Each service behind the caller receives a new token made for it alone and no wider than the one presented, so the credential a request arrived with is never passed on."
    mitigations: [D3-CTS, AML.M0028, cap-data-access-governance]
    url: https://www.keycloak.org/securing-apps/token-exchange
    verified: "2026-11-18"
  - id: litellmMcpTokenExchange
    name: "MCP OBO Auth (auth_type: oauth2_token_exchange)"
    where: "LiteLLM Proxy › config.yaml › mcp_servers.<server>: auth_type, token_exchange_endpoint, client_id, client_secret, audience, scopes"
    setVia: [configFile]
    area: identity
    default: "auth_type is none when omitted: the tool server is called with no credential"
    recommended: "auth_type: oauth2_token_exchange on every tool server that acts as the user; token_exchange_endpoint is the Keycloak realm's token endpoint; audience is that tool server's own client; the narrowest scopes"
    why: "The gateway swaps the caller's bearer token for one scoped to a single tool server (RFC 8693) and forwards only the exchanged token."
    mitigations: [D3-CTS, AML.M0028, cap-data-access-governance]
    url: https://docs.litellm.ai/docs/mcp_obo_auth
    verified: "2026-11-18"
  - id: keycloakClientScopes
    name: "Client scopes, Audience mapper and role scope mappings"
    where: "Keycloak › Clients › the client › Settings (Client authentication On, Service account roles) and Client scopes tab (Default and Optional; dedicated scope › Scope › Full scope allowed); Client scopes › (scope) › Mappers › Audience (Included Client Audience or Included Custom Audience); with --features=resource-indicators, the client's resource_url attribute"
    setVia: [identityProvider]
    area: identity
    default: "Full Scope Allowed is on: each client gets all the role mappings of the user. No audience is added until a mapper is configured; RFC 8707 resource indicators are an experimental feature that is off unless enabled at start-up"
    recommended: "One confidential client per agent, trigger source or calling service, with a named owner; its service account holds only the roles its work needs; scopes linked as Optional, so a caller gets only those it needs; an Audience mapper for each service in an optional client scope; Full scope allowed off"
    why: "A token names the one service it is for and carries only the roles, scopes and claims that caller was granted, so a service can refuse tokens issued for anything else."
    mitigations: [D3-APA, D3-AA, D3-CTS, AML.M0028]
    url: https://www.keycloak.org/docs/latest/server_admin/index.html#audience-support
    verified: "2026-11-18"
  - id: kafkaAcls
    name: "Authorization and ACLs (StandardAuthorizer)"
    where: "Apache Kafka › server properties: authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer, super.users; ACLs set with kafka-acls.sh"
    setVia: [configFile, apiCli]
    area: identity
    default: "With the authoriser configured, a resource with no ACL is open to super users only"
    recommended: "Authoriser on for every broker and controller; each trigger source may write only its own topic and only the trigger consumer may read it; allow.everyone.if.no.acl.found left false"
    why: "A request reaches the agent only from a producer that is allowed to raise that kind of work, so the run's access can be bound to a known source."
    mitigations: [D3-APA]
    url: https://kafka.apache.org/44/security/authorization-and-acls/
    verified: "2026-11-18"
  - id: temporalAuthorizer
    name: "Authorizer and ClaimMapper plugins"
    where: "Temporal Server (self-hosted) › authorization: an Authorizer and the default JWT ClaimMapper (JWTKeyProvider KeySourceURIs, permissions claim); frontend TLS with requireClientAuth (mTLS)"
    setVia: [code, configFile]
    area: identity
    default: "The default noopAuthorizer allows every API request, with no authentication or access control"
    recommended: "The default JWT ClaimMapper pointed at the Keycloak JWKS and an Authorizer replacing the no-op default; each trigger client may start Workflows in its own namespace only, only the approval service may signal them, workers hold the worker permission, admin is kept to operators; mTLS on the frontend"
    why: "Starting, signalling and resuming a run are themselves checked calls, so only a named trigger, approval service or operator can make them and the triggers stay the only way in."
    mitigations: [D3-APA]
    url: https://docs.temporal.io/self-hosted-guide/security
    verified: "2026-11-18"
  - id: k8sServiceAccountTokens
    name: "ServiceAccount token volume projection"
    where: "Kubernetes › Pod spec: serviceAccountName, automountServiceAccountToken; volumes.projected.sources.serviceAccountToken (audience, expirationSeconds)"
    setVia: [configFile]
    area: identity
    default: "A Pod with no serviceAccountName runs as the namespace's default ServiceAccount, and its token is mounted automatically unless automounting is turned off"
    recommended: "One ServiceAccount per workload; a projected token with its own audience and a short expirationSeconds for each service the workload signs in to; automountServiceAccountToken: false on every pod that does not need a token, sandbox pods included"
    why: "Each workload proves which workload it is with a short-lived token that the kubelet rotates and only the named service accepts, so nothing long-lived sits in an image or a config file."
    mitigations: [D3-AA, D3-CH]
    url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
    verified: "2026-11-18"
  - id: vaultDynamicSecrets
    name: "Database secrets engine (dynamic roles)"
    where: "HashiCorp Vault › database secrets engine: database/config/<name>, database/roles/<role> (creation_statements, default_ttl, max_ttl), database/creds/<role> (OpenBao is the open-source alternative)"
    setVia: [apiCli]
    area: identity
    default: "Default TTL of 1 hour and maximum TTL of 24 hours"
    recommended: "One role per service and database, readable only by that service's own Vault role and limited to its tables; credentials issued on demand with a default_ttl of one hour or less; a static role with a rotation period where a service cannot re-read them; the root credential rotated by Vault"
    why: "Every service reaches each database with its own short-lived user, so a leaked credential is limited to one system for a short time and can be traced to one workload."
    mitigations: [cap-data-access-governance, D3-CH]
    url: https://developer.hashicorp.com/vault/docs/secrets/databases
    verified: "2026-11-18"
  - id: keycloakK8sClientAuth
    name: "Kubernetes identity provider (Signed JWT - Federated)"
    where: "Keycloak › Identity Providers › Kubernetes; Clients › Credentials › Client Authenticator: Signed JWT - Federated, Federated Subject system:serviceaccount:<namespace>:<serviceaccount>"
    setVia: [identityProvider]
    area: identity
    default: "The feature is enabled by default; no provider is configured"
    recommended: "One Keycloak client and one Kubernetes ServiceAccount per agent, never the default account; the agent presents its projected service account token (short expirationSeconds, Keycloak as audience) and holds no client secret"
    why: "Each agent proves who it is with a token Kubernetes issued for that pod and rotates, so there is no stored secret to leak and the supervisor and each specialist are separate principals."
    mitigations: [D3-AA, D3-CH, D3-APA]
    url: https://www.keycloak.org/docs/latest/server_admin/index.html#_identity_broker_kubernetes
    verified: "2026-11-18"
  - id: keycloakClientSignedJwt
    name: "Service account roles with the Signed JWT client authenticator"
    where: "Keycloak › Clients › (client) › Settings › Client authentication On, Service account roles; Credentials › Client Authenticator › Signed JWT (or Signed JWT - Federated with a Kubernetes identity provider)"
    setVia: [identityProvider]
    area: identity
    default: "Client ID and Secret is the default client authenticator"
    recommended: "One confidential client per automated caller, Service account roles on, Client Authenticator set to Signed JWT so the caller proves itself with its own registered key, and client scopes narrower than a signed-in person receives"
    why: "An automated caller has its own identity and key, no shared secret exists to leak, and what it may do is smaller than what a person may do."
    mitigations: [D3-AA]
    url: https://www.keycloak.org/docs/latest/server_admin/index.html#_client-credentials
    verified: "2026-11-18"
  - id: envoyGatewayJwt
    name: "SecurityPolicy JWT authentication"
    where: "Envoy Gateway › SecurityPolicy › spec.jwt.providers[]: issuer, audiences, remoteJWKS, claimToHeaders"
    setVia: [clusterPolicy]
    area: identity
    default: "If issuer or audiences are not provided, they are not checked"
    recommended: "On the MCP route: issuer set to the Keycloak realm, audiences set to this server's canonical URL, remoteJWKS pointing at the realm's keys, and the client and tenant claims copied to headers for rate limiting"
    why: "A token issued for another service is refused at the edge, before it reaches the gateway or a handler."
    mitigations: [D3-CTS]
    url: https://gateway.envoyproxy.io/docs/api/extension_types/
    verified: "2026-11-18"
  - id: vaultKubernetesAuth
    name: "Kubernetes auth method"
    where: "Vault › auth/kubernetes/role/<role>: bound_service_account_names, bound_service_account_namespaces, audience, ttl, policies"
    setVia: [apiCli]
    area: identity
    recommended: "One role per workload, bound to exactly one service account and namespace, with an audience, a short ttl and a policy that reads only that workload's paths; a role for a sensitive job, such as release signing, is bound to that job's account alone"
    why: "A workload proves who it is with its service account token and gets only its own secrets, so no vault credential is stored in the cluster and each secret has one reader."
    mitigations: [D3-CH, D3-AA, AML.M0013]
    url: https://developer.hashicorp.com/vault/docs/auth/kubernetes
    verified: "2026-11-18"
  - id: litellmMasterKey
    name: "LITELLM_MASTER_KEY and LITELLM_SALT_KEY"
    where: "LiteLLM Proxy › environment, read from Kubernetes Secrets (Helm: masterKey.secretName, gateway.envSecrets) that are synced from Vault"
    setVia: [configFile]
    area: identity
    default: "The Helm chart expects Secrets you create before installing; masterKey.generate is false"
    requires: "LiteLLM's built-in HashiCorp Vault secret manager needs a LiteLLM Enterprise licence; syncing from Vault with the Vault Secrets Operator does not"
    recommended: "Both written to Vault and synced into the Secrets the chart reads, never placed in config.yaml or values.yaml; the master key rotated with LiteLLM's master key rotation flow; the salt key never changed once models are stored"
    why: "The master key is the proxy administrator's credential and the salt key encrypts the stored model credentials, so both belong in the vault with the other root secrets."
    mitigations: [D3-CH]
    url: https://docs.litellm.ai/docs/proxy/prod
    verified: "2026-11-18"
  - id: vllmApiKey
    name: "--api-key (VLLM_API_KEY)"
    where: "vLLM › vllm serve --api-key flag or VLLM_API_KEY environment variable; VLLM_ALLOW_RUNTIME_LORA_UPDATING and VLLM_SERVER_DEV_MODE unset; --trust-remote-code not passed"
    setVia: [configFile]
    area: identity
    default: "No authentication. With a key set, only the /v1, /v2, /inference and /cohere paths require it"
    recommended: "Set from a Secret synced from Vault and held only by the gateway (LiteLLM), never by callers; VLLM_ALLOW_RUNTIME_LORA_UPDATING and VLLM_SERVER_DEV_MODE unset and --trust-remote-code left off; every path outside /v1 blocked by network policy or a reverse proxy"
    why: "The key stops a stray pod from calling the model directly, and leaving the other switches off keeps adapter loading, development endpoints and code shipped with a model out of reach."
    mitigations: [D3-ACH, AML.M0005]
    url: https://docs.vllm.ai/en/latest/usage/security/
    verified: "2026-11-18"
  - id: cephRgwStsWebIdentity
    name: "STS AssumeRoleWithWebIdentity"
    where: "Ceph Object Gateway › rgw s3 auth use sts and rgw sts key; an OpenID Connect provider and one role per workload"
    setVia: [configFile, apiCli]
    area: identity
    default: "rgw_s3_auth_use_sts is false"
    recommended: "STS on, Keycloak registered as the OpenID Connect provider, one role per workload whose trust policy matches the token's aud and sub claims and whose permission policy names only that workload's bucket prefixes"
    why: "Workloads hold temporary storage credentials tied to their own identity, in place of a static access key that any pod could copy."
    mitigations: [D3-AA, D3-CH, AML.M0005]
    url: https://docs.ceph.com/en/latest/radosgw/STS/
    verified: "2026-11-18"
  - id: mlflowAuthPermissions
    name: "Authentication and permissions (--app-name basic-auth)"
    where: "MLflow › mlflow server --app-name basic-auth; basic_auth.ini: default_permission; MLFLOW_AUTH_ADMIN_PASSWORD; per-model permissions"
    setVia: [configFile, apiCli]
    area: identity
    default: "With the auth app on, the default permission for all users is READ on every resource"
    recommended: "The auth app on, default_permission = NO_PERMISSIONS, the admin password supplied from the vault, training identities given EDIT on their own experiments only, and MANAGE on registered models held by the approvers group"
    why: "Only an approver can change a registered model's status, so the approval in the registry is a separate human decision."
    mitigations: [cap-model-documentation]
    url: https://mlflow.org/docs/latest/self-hosting/security/basic-http-auth/
    verified: "2026-11-18"
  - id: kubeflowTrainJobServiceAccount
    name: "TrainJob runtimePatches (serviceAccountName)"
    where: "Kubeflow Trainer › TrainJob › spec.runtimePatches[].trainingRuntimeSpec: serviceAccountName, tolerations, nodeSelector; ClusterTrainingRuntime for the approved template"
    setVia: [configFile]
    area: identity
    recommended: "Each run's TrainJob names a service account created for that run, allowed to read the approved dataset version and write only its own candidate prefix, on the training GPU pool; images and commands come from a ClusterTrainingRuntime the platform team owns"
    why: "A run acts under its own identity with only its own inputs and outputs, and never under the identity that releases."
    mitigations: [D3-AA]
    url: https://trainer.kubeflow.org/en/latest/operator-guides/runtime-patches.html
    verified: "2026-11-18"
  - id: k8sRbacLeastPrivilege
    name: "RBAC Role and RoleBinding"
    where: "Kubernetes › Role, ClusterRole, RoleBinding, ClusterRoleBinding"
    setVia: [clusterPolicy]
    area: identity
    recommended: "People and orchestrators act through a namespaced Role limited to what they create (jobs, pipeline runs, Sandboxes) that cannot read Secrets or bind roles; workload service accounts get no binding outside their own namespace; accounts that run generated code are bound to no role"
    why: "Permissions are additive, so each person and workload is granted only what its task needs, and nothing that runs generated code can reach weights, secrets or the release path through the cluster."
    mitigations: [D3-AA, AML.M0005, D3-EI]
    url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
    verified: "2026-11-18"
  # --- Data & models -------------------------------------------------------------------
  - id: litellmGuardrailsInput
    name: "Guardrails (mode: pre_call and post_mcp_call)"
    where: "LiteLLM Proxy › config.yaml › guardrails[]: guardrail_name, litellm_params.guardrail, mode, default_on"
    setVia: [configFile]
    area: data
    default: "Off: default_on is false, so a guardrail runs only when a request names it. MCP sub-calls do not inherit the parent request's guardrails selection, so nothing screens them unless default_on is set"
    requires: "Choosing guardrails per key or per model needs a LiteLLM Enterprise licence; guardrails in config.yaml with default_on are open source"
    recommended: "default_on: true guardrails in pre_call for requests and, where tools are called, in post_mcp_call for tool results and fetched pages, calling Presidio and an injection or safety classifier you host (a custom guardrail or guardrail: generic_guardrail_api); skip_tool_message_in_guardrail left off"
    why: "What people, tools, web pages and other organisations send is screened at the gateway before a model reads it, and default_on covers MCP sub-calls that would not inherit a per-request choice."
    mitigations: [cap-input-guardrails, cap-output-guardrails]
    url: https://docs.litellm.ai/docs/proxy/guardrails/quick_start
    verified: "2026-11-18"
  - id: litellmGuardrailsOutput
    name: "PII, PHI Masking - Presidio (guardrail: presidio)"
    where: "LiteLLM Proxy › config.yaml › guardrails[].litellm_params: guardrail: presidio, mode, pii_entities_config, presidio_filter_scope, presidio_language; PRESIDIO_ANALYZER_API_BASE, PRESIDIO_ANONYMIZER_API_BASE"
    setVia: [configFile]
    area: data
    default: "No masking until a Presidio guardrail is configured. output_parse_pii only restores masked tokens after the call; it does not scan answers. Scanning answers needs post_call and presidio_filter_scope, which defaults to both"
    recommended: "Presidio analyser and anonymiser run in the cluster; guardrail on post_call with default_on: true and presidio_filter_scope: both; pii_entities_config set to MASK for the personal data types you handle and BLOCK for those that must never pass; logging_only too, so traces and logs hold masked text"
    why: "Personal data is masked in what models return and in what the gateway logs or passes on, whichever model produced it."
    mitigations: [cap-sensitive-data-redaction, cap-output-guardrails]
    url: https://docs.litellm.ai/docs/proxy/guardrails/pii_masking_v2
    verified: "2026-11-18"
  - id: presidioMaskBeforeStore
    name: "Mask personal data before writing to memory"
    where: "Your agent's memory tool › a call to the Presidio analyser and anonymiser services before each write to PostgreSQL or Valkey"
    setVia: [code]
    area: data
    recommended: "Every turn, summary and extracted fact is passed through Presidio and stored masked; the memory tool has no write path that skips the call"
    why: "Memory writes do not pass through the gateway, so the agent itself must remove sensitive data from what a conversation keeps."
    mitigations: [cap-sensitive-data-redaction]
    url: https://presidio.dataprivacystack.org/installation/
    verified: "2026-11-18"
  - id: postgresRowSecurity
    name: "Row Security Policies"
    where: "PostgreSQL › ALTER TABLE ... ENABLE ROW LEVEL SECURITY and FORCE ROW LEVEL SECURITY; CREATE POLICY ... USING (...)"
    setVia: [apiCli]
    area: data
    default: "Off: every row of a table a role can read is visible. Once enabled, a table with no policy denies all rows; superusers, BYPASSRLS roles and normally the table owner bypass row security"
    recommended: "Enabled and forced on every table that holds tenant, session, case or run data (memory, artefact and embedding tables included); a policy matching each row's tenant, session, run or task to the one set on the connection or transaction; the application role has no BYPASSRLS and is not the table owner"
    why: "The database itself returns only the rows of the tenant, session or run being served, whatever query is sent and even when a handler forgets its filter."
    mitigations: [AML.M0031, cap-data-access-governance, cap-retrieval-grounding-checks]
    url: https://www.postgresql.org/docs/current/ddl-rowsecurity.html
    verified: "2026-11-18"
  - id: ingestScanBeforeIndex
    name: "Scan documents before they are indexed"
    where: "Your ingestion job › LLM Guard's Prompt Injection scanner (and Presidio) run on each chunk before its embedding is written to pgvector"
    setVia: [code]
    area: data
    recommended: "Only the ingestion job can write to the index; a chunk that fails the scan is quarantined for review and not embedded; each row is written with its tenant and source"
    why: "Retrieved text is a way to plant instructions, so it is checked before it can ever be returned to the model."
    mitigations: [cap-retrieval-grounding-checks]
    url: https://protectai.github.io/llm-guard/input_scanners/prompt_injection/
    verified: "2026-11-18"
  - id: frontEndSanitiseOutput
    name: "Sanitise rendered model output"
    where: "Your front end › the component that renders the assistant's answers, and the Content-Security-Policy response header"
    setVia: [code]
    area: data
    recommended: "Render answers as text or sanitised markdown; strip HTML; block external images and links to hosts outside an allowlist; set a Content-Security-Policy"
    why: "An answer can carry markup or a link an attacker planted in a document or web page, and the browser would otherwise act on it."
    mitigations: [cap-output-encoding]
    url: https://genai.owasp.org/llmrisk/llm052025-improper-output-handling/
    verified: "2026-11-18"
  - id: litellmApplyGuardrail
    name: "Call /guardrails/apply_guardrail before anything is stored or sent"
    where: "Your agent code › POST /guardrails/apply_guardrail on LiteLLM Proxy with guardrail_name and text"
    setVia: [code]
    area: data
    recommended: "Each step result, retrieved document and peer artefact is passed through the Presidio and injection guardrails by name before it is written to the journal, the index or shared memory, and before anything is sent to a peer; a block fails the write"
    why: "Memory, the index and the journal are written by code the gateway never sees, so the same guardrails are applied on that path by an explicit call."
    mitigations: [AML.M0031, cap-retrieval-grounding-checks, cap-sensitive-data-redaction, cap-input-guardrails]
    url: https://docs.litellm.ai/docs/apply_guardrail
    verified: "2026-11-18"
  - id: temporalPayloadCodec
    name: "Payload Codec"
    where: "Your Temporal Workers and Clients › Data Converter with a custom Payload Codec; a Codec Server for the Web UI"
    setVia: [code]
    area: data
    default: "Without a codec, payloads reach the Temporal Service unencrypted"
    recommended: "A codec that encrypts every payload with a key from your vault before it leaves the Worker, failure messages included; decoding offered only to operators through a Codec Server"
    why: "What steps write to the journal is unreadable in the Temporal database and its backups, and only the agents' own processes hold the key."
    mitigations: [cap-sensitive-data-redaction]
    url: https://docs.temporal.io/production-deployment/data-encryption
    verified: "2026-11-18"
  - id: harborVulnerabilityGate
    name: "Prevent vulnerable images from running; Automatically scan images on push"
    where: "Harbor › Projects › (project) › Configuration"
    setVia: [adminConsole]
    area: data
    recommended: "Both on for every project the cluster's workloads pull from, with the severity level set to High; Trivy enabled when Harbor is installed (--with-trivy)"
    why: "The registry scans every image pushed to it and refuses to serve one with a serious known flaw, so that image cannot be deployed or started as a sandbox."
    mitigations: [D3-AVE, D3-FA]
    url: https://goharbor.io/docs/2.16.0/working-with-projects/project-configuration/
    verified: "2026-11-18"
  - id: mcpTenantScopedHandlers
    name: "Resolve the tenant from the token in every handler"
    where: "Your MCP server › handler code, with an Open Policy Agent decision per call where rules are shared"
    setVia: [code]
    area: data
    recommended: "Every handler takes the tenant from the validated token, never from a tool argument, sets it for the query and scopes every read and write to it; a test proves one customer's token cannot read another's rows"
    why: "Separation between customers is the server's own code, so it is written once, in one place, and checked on every query."
    mitigations: [cap-data-access-governance]
    url: https://www.openpolicyagent.org/docs
    verified: "2026-11-18"
  - id: vllmCacheSalt
    name: "cache_salt"
    where: "vLLM › request body field, added by a LiteLLM callback (async_pre_call_hook) before the call is forwarded"
    setVia: [code]
    area: data
    default: "cache_salt is optional; without it all callers share cached prefixes"
    recommended: "A secret random salt per team (256 bits), added by the gateway to every request and overwriting any value the caller sent"
    why: "Prefix caching can leak another tenant's prompt through response timing; a per-tenant salt keeps each team's cache separate."
    mitigations: [D3-ACH]
    url: https://docs.vllm.ai/en/latest/usage/security.html
    verified: "2026-11-18"
  - id: k8sGpuNodeTaints
    name: "Taints and Tolerations on GPU node pools"
    where: "Kubernetes › kubectl taint nodes <node> <key>=<value>:NoSchedule; matching tolerations and nodeSelector on the pods"
    setVia: [apiCli]
    area: data
    recommended: "A tainted GPU node pool per data sensitivity tier, each model's pods tolerating only its own tier and pinned to it with a nodeSelector; GPU time-slicing left unconfigured, because it gives no memory or fault isolation between workloads"
    why: "Workloads of different sensitivity never share an accelerator, so one tier cannot read what another left in GPU memory."
    mitigations: [D3-HBPI]
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
    verified: "2026-11-18"
  - id: modelScanFiles
    name: "ModelScan (modelscan -p)"
    where: "ModelScan › intake and release jobs, before a file is copied to a bucket that serving or training reads"
    setVia: [apiCli]
    area: data
    recommended: "Every downloaded or trained model file scanned, exit code 0 required to proceed, pickle-based formats refused for serving in favour of safetensors, and the scan report stored with the version"
    why: "A model file can carry code that runs when it is loaded; scanning its format and contents before approval keeps that out of the cluster."
    mitigations: [D3-FA]
    url: https://github.com/protectai/modelscan
    verified: "2026-11-18"
  - id: modelSigningVerify
    name: "Verify the model signature at load (model_signing verify)"
    where: "OpenSSF Model Signing › an init container on the serving pod, run before vllm serve starts"
    setVia: [code]
    area: data
    default: "No product setting: the organisation adds the check"
    recommended: "model_signing verify with the release public key against the signature file stored beside the weights; the pod fails to start on a mismatch, and the verified digest is compared with the version approved in the registry"
    why: "The check happens at the moment of loading, so a file swapped after download or after approval is refused."
    mitigations: [AML.M0014]
    url: https://github.com/sigstore/model-transparency
    verified: "2026-11-18"
  - id: objectStoreBucketPolicy
    name: "Bucket Policies"
    where: "Ceph Object Gateway › S3 bucket policy JSON (Principal, Action, Resource), applied with s3cmd setpolicy"
    setVia: [apiCli]
    area: data
    recommended: "Each bucket written (s3:PutObject) by the one identity that owns it and read (s3:GetObject, s3:ListBucket) only by the identities that need it; no other principal named, so an identity that runs generated code appears in no policy"
    why: "Only the identity that owns a bucket can change the weights or data in it, and only the identities that must read them can."
    mitigations: [AML.M0005]
    url: https://docs.ceph.com/en/latest/radosgw/bucketpolicy/
    verified: "2026-11-18"
  - id: objectStoreVersioningLock
    name: "Bucket versioning and Object Lock"
    where: "Ceph Object Gateway › PUT /{bucket}?versioning (Status: Enabled); x-amz-bucket-object-lock-enabled when the bucket is created, then PUT /{bucket}?object-lock (Mode, Days or Years)"
    setVia: [apiCli]
    area: data
    default: "Object Lock can be configured only on a bucket that was created with it enabled"
    recommended: "Versioning Enabled on weights, dataset and log buckets; Object Lock in COMPLIANCE mode with a retention period on the release and log buckets"
    why: "A promoted release, a dataset version or a log record cannot be silently overwritten or removed, and the previous version is there to restore."
    mitigations: [AML.M0005, AML.M0024]
    url: https://docs.ceph.com/en/latest/radosgw/s3/bucketops/
    verified: "2026-11-18"
  - id: presidioDatasetRedaction
    name: "Presidio Analyzer and Anonymizer on dataset records"
    where: "Presidio › a curation step in the pipeline, run before a dataset version is written"
    setVia: [code]
    area: data
    recommended: "Every internal record analysed and anonymised or dropped before it is written to a dataset version, with the entity list and language set for the organisation's data, and a sampled human check because detection is automated and not guaranteed"
    why: "Curation is the last place a bad or sensitive example can be removed; after training it cannot be deleted from the model."
    mitigations: [AML.M0007]
    url: https://presidio.dataprivacystack.org/
    verified: "2026-11-18"
  - id: cephRgwSseKms
    name: "Server-side encryption with HashiCorp Vault (SSE-KMS)"
    where: "Ceph Object Gateway › ceph.conf: rgw crypt s3 kms backend = vault, rgw crypt vault auth, rgw crypt vault secret engine = transit, rgw crypt vault addr, rgw crypt vault prefix"
    setVia: [configFile]
    area: data
    recommended: "The transit engine as the key backend with agent authentication, encryption applied to the dataset, candidate and release buckets, and every request sent over HTTPS"
    why: "Stored datasets, checkpoints and releases are encrypted with keys the organisation holds in its own vault."
    mitigations: [AML.M0012]
    url: https://docs.ceph.com/en/latest/radosgw/vault/
    verified: "2026-11-18"
  - id: modelSigningSign
    name: "Sign the release (model_signing sign)"
    where: "OpenSSF Model Signing › a release job that runs after approval, under its own service account"
    setVia: [code]
    area: data
    recommended: "The approved candidate signed with model_signing sign using a key only the release job can use (a PKCS #11 key on the HSM, or a key issued from the vault), the signature stored beside the weights and its digest recorded in the registry"
    why: "A signature means a person approved this exact set of files, because the job that trains can never produce one."
    mitigations: [AML.M0013]
    url: https://github.com/sigstore/model-transparency
    verified: "2026-11-18"
  - id: vaultTransitKeys
    name: "Transit secrets engine"
    where: "HashiCorp Vault or OpenBao › transit secrets engine: transit/keys/<name> (for example ecdsa-p256 or rsa-4096), sign and verify; transit/keys/<name>/rotate"
    setVia: [apiCli]
    area: data
    requires: "Keys held in an HSM (managed_key) and PKCS11 auto-unseal need Vault Enterprise; OpenBao provides a pkcs11 seal through its KMS plugin"
    recommended: "A separate key for each purpose (a signing key per release role or per agent per partnership, separate encryption keys for stored data), usable only by the one role that needs it; workloads ask the vault to sign and never hold the key; each key rotated on a schedule and at once when its use ends"
    why: "Private keys are used through the vault and never reach a pod or a file, so only the approved role can sign and stored data stays under the organisation's own keys."
    mitigations: [AML.M0013, AML.M0012, D3-AA]
    url: https://developer.hashicorp.com/vault/docs/secrets/transit
    verified: "2026-11-18"
  - id: pulpSyncAllowlist
    name: "Remote includes with an immediate sync"
    where: "Pulp › pulp python remote create --includes [...] with policy immediate; pulp python repository sync run by the admission pipeline"
    setVia: [apiCli]
    area: data
    default: "Python remotes are created with policy on_demand, which fetches a file from the remote when it is first requested"
    recommended: "includes listing the approved packages, policy immediate so every file is downloaded at sync time, sync run only by the admission pipeline; rollouts read the distribution's content URL and never the Pulp API"
    why: "The mirror holds only what the pipeline admitted, and an install by a rollout cannot cause a fetch from outside."
    mitigations: [D3-FA, AML.M0028]
    url: https://pulpproject.org/pulp_python/docs/user/guides/sync/
    verified: "2026-11-18"
  - id: pipRequireHashes
    name: "Hash-checking mode (--require-hashes)"
    where: "pip › requirements file with --hash per requirement; pip install --require-hashes --only-binary :all: against the mirror"
    setVia: [configFile]
    area: data
    default: "Off unless a hash is given for a requirement"
    recommended: "Every task image and every in-task install uses a requirements file with pinned versions and hashes, produced by the admission pipeline"
    why: "A package that differs from the one that was scanned and approved fails to install."
    mitigations: [D3-FA]
    url: https://pip.pypa.io/en/stable/topics/secure-installs/
    verified: "2026-11-18"
  # --- Tools, runtime & supply chain ---------------------------------------------------
  - id: litellmMcpGateway
    name: "MCP servers (mcp_servers) and MCP Permission Management"
    where: "LiteLLM Proxy › config.yaml › mcp_servers (or the admin UI › MCP Servers); object_permission.mcp_servers, mcp_access_groups and mcp_rpm_limit on keys and teams; general_settings.require_key_mcp_access_defined"
    setVia: [configFile, apiCli]
    area: tools
    default: "Open: if no key, team or organisation carries a list, a request can reach every registered MCP server"
    recommended: "Every tool service registered once under mcp_servers by a named owner, changed by reviewed merge; each key or team granted only its own servers, with an mcp_rpm_limit for each; require_key_mcp_access_defined: true; allow_all_keys off; available_on_public_internet: false on internal servers"
    why: "The list of registered servers is the inventory of tools, and a key reaches only the servers it was granted, so a tool that is not on the list cannot be reached through the gateway."
    mitigations: [cap-agent-tool-registry, AML.M0028, AML.M0036]
    url: https://docs.litellm.ai/docs/mcp_control
    verified: "2026-11-18"
  - id: litellmMcpToolAllowlist
    name: "allowed_tools, mcp_tool_permissions and allowed_params"
    where: "LiteLLM Proxy › config.yaml › mcp_servers.<server>.allowed_tools, disallowed_tools, allowed_params; object_permission.mcp_tool_permissions on keys and teams"
    setVia: [configFile, apiCli]
    area: tools
    default: "Every tool and every parameter of a server a caller can reach can be called"
    recommended: "allowed_tools on every server, listing only its reviewed tools; mcp_tool_permissions giving each key or team only the tools it may call; allowed_params listing the arguments accepted by tools that write or take sensitive arguments"
    why: "Each caller is offered, and can call, only the named tools with the named arguments; anything else is refused with a 403 at the gateway."
    mitigations: [AML.M0028, cap-agent-tool-registry, cap-agent-action-policy-enforcement]
    url: https://docs.litellm.ai/docs/mcp_control
    verified: "2026-11-18"
  - id: litellmMcpPinnedTools
    name: "Pinned tools (pinned_tools)"
    where: "LiteLLM Proxy › POST /v1/mcp/server/{server_id}/pin (needs the database), or config.yaml › mcp_servers.<server>.pinned_tools"
    setVia: [apiCli, configFile]
    area: tools
    default: "Not pinned: the gateway serves whatever tool list and descriptions the upstream server returns"
    recommended: "Every MCP server pinned once its tool list is reviewed; the mcp_pinned_tools_changed alert sent to the on-call channel; re-pin only after the change has been reviewed"
    why: "The model is offered only the tool names, descriptions and input schemas that were approved. A tool the server adds or rewrites later is not served, and the difference raises an alert."
    mitigations: [cap-mcp-tool-integrity]
    url: https://docs.litellm.ai/docs/mcp_control
    verified: "2026-11-18"
  - id: litellmMcpPolicyGuardrail
    name: "Check every tool call against policy before it runs"
    where: "LiteLLM Proxy › config.yaml › guardrails[]: a CustomGuardrail (apply_guardrail) with mode: pre_mcp_call and default_on: true that queries Open Policy Agent"
    setVia: [code, configFile]
    area: tools
    default: "No check: a permitted tool call is forwarded as the model wrote it"
    recommended: "The guardrail sends the calling key, the user, the tool name and its arguments to OPA and blocks unless policy allows this action on this record for this amount; a write passes only with an approval reference for that exact action in that session; it fails closed"
    why: "The decision is made at the gateway when the action is requested, in policy the agent cannot edit, and not left to the model's judgement."
    mitigations: [cap-agent-action-policy-enforcement, AML.M0028]
    url: https://docs.litellm.ai/docs/mcp_guardrail
    verified: "2026-11-18"
  - id: temporalApprovalSignal
    name: "Wait for an approval Signal before a consequential write"
    where: "Your agent's Temporal Workflow › a Signal handler and a durable timer in front of the write Activity"
    setVia: [code]
    area: tools
    recommended: "The Workflow shows the exact proposed action and waits; it runs the write only after a Signal that approves that action, from the user in the thread or from an operator queue when nobody is present; a timer cancels it when no answer comes"
    why: "Nothing that matters is written without a person's approval of that exact action, and the wait survives restarts because the Workflow state is durable."
    mitigations: [AML.M0029]
    url: https://docs.temporal.io/ai/cookbook/human-in-the-loop-python
    verified: "2026-11-18"
  - id: litellmBudgetsRateLimits
    name: "Budgets, Rate Limits"
    where: "LiteLLM Proxy › /key/generate, /team/new, /user/new, /customer/new, /budget/new: max_budget, budget_duration, tpm_limit, rpm_limit, max_parallel_requests; mcp_rpm_limit per MCP server on a key or team; rpm on the MCP server; general_settings.fail_closed_rate_limit_enforcement"
    setVia: [apiCli, adminConsole]
    area: tools
    default: "No limits unless set: a key's max_budget is null, the master key has none and an MCP server without an entry is uncapped. Budgets need the PostgreSQL database; without it they fail open"
    requires: "A PostgreSQL database for budgets. Budgets for each model on a key (model_max_budget) need a LiteLLM Enterprise licence; the other limits do not"
    recommended: "tpm_limit, rpm_limit and max_parallel_requests on every key and team; a max_budget with budget_duration on each team; a customer budget for each end user or customer; mcp_rpm_limit for each MCP server a key may reach; fail_closed_rate_limit_enforcement: true so a limit still holds when Redis is down"
    why: "Every caller and team has a ceiling on model and tool usage, so a loop or a greedy caller is refused at the gateway instead of consuming the GPUs everyone shares."
    mitigations: [AML.M0036, AML.M0004]
    url: https://docs.litellm.ai/docs/proxy/users
    verified: "2026-11-18"
  - id: litellmFallbacksRouting
    name: "Weighted Deployments (weight) and traffic mirroring (silent_model)"
    where: "LiteLLM Proxy › config.yaml › model_list[].litellm_params.weight and silent_model; router_settings: routing_strategy, fallbacks, allowed_fails, cooldown_time"
    setVia: [configFile]
    area: tools
    default: "routing_strategy is simple-shuffle: requests are spread at random across the deployments that share a model_name"
    recommended: "Callers use a model group name. A new model version is first mirrored with silent_model, then added under the same model_name with a small weight once its evaluation passes; the previous version stays in the group and in fallbacks until the new one is approved; rollback removes the new deployment"
    why: "A new model version takes a small share of traffic first, and the previous version is one reviewed configuration change away."
    mitigations: [cap-staged-rollout-gate]
    url: https://docs.litellm.ai/docs/routing
    verified: "2026-11-18"
  - id: promptfooEvalGate
    name: "promptfoo eval and redteam run in the pipeline"
    where: "promptfoo › promptfooconfig.yaml in the workload's repository; CI pipeline steps promptfoo eval --fail-on-error (with a pass-rate threshold on the results file) and promptfoo redteam run"
    setVia: [configFile]
    area: tools
    recommended: "The evaluation suite and red-team cases run against the candidate, through the gateway, on every change to a model, system prompt, tool list or agent version; a failed test or a pass rate below the agreed level blocks the merge or release; prompts are versioned in the repository with a named owner"
    why: "Behaviour is tested before every change to a model, an instruction or an agent ships, and a regression blocks the release while the previous version stays live."
    mitigations: [cap-staged-rollout-gate]
    url: https://www.promptfoo.dev/docs/integrations/ci-cd/
    verified: "2026-11-18"
  - id: k8sRuntimeClassSandbox
    name: "RuntimeClass (gVisor or Kata Containers)"
    where: "Kubernetes › RuntimeClass (node.k8s.io/v1: handler, scheduling.nodeSelector) and Pod spec.runtimeClassName, set in the sandbox pod template (agent-sandbox Sandbox spec.podTemplate.spec or SandboxTemplate)"
    setVia: [clusterPolicy]
    area: tools
    default: "If no runtimeClassName is specified, the default runtime handler is used and pods share the node's kernel"
    recommended: "A RuntimeClass for gVisor (handler: runsc) or Kata Containers on a dedicated node pool, set as runtimeClassName on every pod that runs code a model or agent wrote and fixed in the sandbox template; those pods have their own namespace, and the code never runs in the agent's or the job's own pod"
    why: "Generated code runs behind a second kernel boundary, a user-space kernel or a guest kernel, in a pod of its own, so a break-out does not land in the agent's process, a job that holds credentials or the node's kernel."
    mitigations: [D3-EI, D3-HBPI]
    url: https://kubernetes.io/docs/concepts/containers/runtime-class/
    verified: "2026-11-18"
  - id: agentSandboxShutdown
    name: "Sandbox lifecycle: shutdownTime and shutdownPolicy"
    where: "agent-sandbox › Sandbox (agents.x-k8s.io/v1beta1) › spec.lifecycle: shutdownTime, shutdownPolicy"
    setVia: [clusterPolicy, code]
    area: tools
    default: "Unset: the Sandbox never expires and runs until it is deleted by hand; shutdownPolicy defaults to Retain"
    recommended: "One Sandbox per task, never reused across tasks or runs; shutdownPolicy: Delete and a shutdownTime no later than the task's time limit, set on every Sandbox when it is created; the component that created it also deletes it as soon as the task ends"
    why: "No sandbox outlives its task: the controller tears the pod down at the deadline even if its creator has failed, so nothing one task's code left behind is there for the next."
    mitigations: [D3-EI]
    url: https://agent-sandbox.sigs.k8s.io/docs/sandbox/lifecycle/
    verified: "2026-11-18"
  - id: temporalTerminateWorkflows
    name: "temporal workflow terminate (by visibility query)"
    where: "Temporal CLI › temporal workflow terminate --query <list filter> --reason <text>"
    setVia: [apiCli]
    area: tools
    recommended: "The runbook terminates every running Workflow of the agent's type with one query, then blocks the agent's gateway key; the reason is recorded in each Event History"
    why: "Live runs stop at once and cannot react to it, with no deployment needed."
    mitigations: [cap-agent-kill-switch]
    url: https://docs.temporal.io/cli/command-reference/workflow
    verified: "2026-11-18"
  - id: litellmToolPermissionGuardrail
