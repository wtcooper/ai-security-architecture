      - { block: gateway, service: Amazon Bedrock AgentCore Gateway, note: "An inference provider target pointing at the private vLLM endpoint through gateway VPC egress. AWS's EKS guidance uses LiteLLM here." }
      - { block: api, service: vLLM OpenAI-compatible API (internal NLB), builtWith: vLLM}
      - { block: runtime, service: vLLM on Amazon EKS GPU nodes, builtWith: vLLM, note: "SageMaker AI real-time endpoints with the LMI container are the managed alternative." }
      - { block: storage, service: Amazon S3 model artifact bucket }
      - { block: sources, service: Hugging Face Hub }
      - { block: registry, service: Amazon SageMaker Model Registry }
