  - architecture: archRemoteMcpServer
    asOf: "2026-10"
    # >>> checked against the vendor's documentation
    verified: "2026-11-18"
    sources:
      idp: https://docs.aws.amazon.com/singlesignon/latest/userguide/what-is.html
      gateway: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway.html
      authServer: https://docs.aws.amazon.com/cognito/latest/developerguide/token-endpoint.html
      service: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-mcp.html
      toolDefs: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/registry-supported-record-types.html
      orgData: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/on-behalf-of-token-exchange.html
    differences:
      - at: toolDefs->service
        text: "Callers get tool names and descriptions from AgentCore Gateway's stored catalogue, not from your service, so a hash check inside the service does not cover what callers see. The reviewed schema is loaded into the gateway's mcpToolSchema on every release: a second path for the published schemas, beside the one into the service."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-MCPservers.html
    alsoNeeded:
      - service: "Amazon Bedrock AgentCore Identity"
        role: identity
        why: "Stores the gateway's and service's outbound OAuth clients and API keys and performs on-behalf-of token exchange."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/identity.html
      - service: "Amazon VPC (Runtime VPC network mode)"
        role: network
        why: "AWS's Runtime example deploys with public networking; VPC mode is needed to reach private systems of record."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-vpc.html
      - service: "AWS PrivateLink interface endpoints"
        role: network
        why: "Private path from your VPC to AgentCore and the stores the service reads."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/vpc-interface-endpoints.html
      - service: "AWS KMS"
        role: keys
        why: "Customer managed key for the gateway, which otherwise uses a service-managed key."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-encryption.html
      - service: "AWS Secrets Manager"
        role: secrets
        why: "Holds upstream credentials and Cognito client secrets."
        url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotate-secrets_turn-on-for-other.html
      - service: "Amazon ECR"
        role: registry
        why: "Stores the container image the Runtime pulls, unless you use direct code deployment."
        url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/what-is-ecr.html
      - service: "Amazon CloudWatch and AWS CloudTrail"
        role: logging
        why: "Traces need CloudWatch Transaction Search switched on once; gateway calls are CloudTrail data events."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/observability-configure.html
      - service: "AWS WAF"
        role: ingress
        why: "Regional web ACL attached to the gateway; it fails closed by default if WAF is unreachable."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-waf.html
      - service: "Amazon CloudFront"
        role: ingress
        why: "Needed only for a custom public domain in front of the gateway."
        url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html
      - service: "AWS Lambda"
        role: other
        why: "Runs the gateway's request interceptor."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-interceptors.html
      - service: "AWS Fargate, Application Load Balancer and Amazon DynamoDB"
        role: other
        why: "Host and session store for your MCP auth service, as the guidance page draws it."
        url: https://docs.aws.amazon.com/solutions/deploying-model-context-protocol-servers-on-aws/
    quickstart:
      - title: "Get started with AgentCore Gateway"
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-quick-start.html
      - title: "Guidance for Deploying Model Context Protocol Servers on AWS"
        url: https://docs.aws.amazon.com/solutions/deploying-model-context-protocol-servers-on-aws/
    # <<< checked
    reference:
      - title: Guidance for Deploying Model Context Protocol Servers on AWS
        url: https://aws.amazon.com/solutions/guidance/deploying-model-context-protocol-servers-on-aws/
      - title: Tool-based agents for servers (AWS Prescriptive Guidance)
        url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-patterns/tool-based-agents-for-servers.html
      - title: Deploy MCP servers in AgentCore Runtime
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-mcp.html
    summary:
      - >-
        A stateless MCP server on AgentCore Runtime, published through AgentCore Gateway with AWS
        WAF, taking tokens from an Amazon Cognito user pool that federates to your identity provider.
        AWS's guidance fronts the servers with CloudFront, WAF and a load balancer and runs its own
        MCP auth service beside Cognito; the gateway here adds per-tool rate limits, interceptors and
        a static tool schema. Cognito's token endpoint takes authorization code, refresh and client
        credentials grants, so the enterprise-managed (ID-JAG) and token-exchange profiles are the
        part you add.
    bindings:
      - block: idp
        service: "Your corporate identity provider"
        build: true
        note: "IAM Identity Center or a third-party IdP, federated to the Cognito user pool. The identity-assertion grant (ID-JAG) is that IdP's feature, where it has one."
        options:
          - { name: "Your corporate identity provider", kind: commercial, url: "https://docs.aws.amazon.com/singlesignon/latest/userguide/what-is.html", packs: [awsNative] }
          - { name: "AWS IAM Identity Center", kind: commercial, url: "https://docs.aws.amazon.com/singlesignon/latest/userguide/manage-your-identity-source-idp.html", note: "AWS's workforce sign-in; can itself take users from Okta or Microsoft Entra ID over SAML and SCIM." }
          - { name: "Okta", kind: commercial, url: "https://aws.amazon.com/blogs/machine-learning/govern-ai-agent-access-with-okta-cross-app-access-and-amazon-bedrock-agentcore-part-1/", note: "AWS's worked example uses Okta Cross App Access to decide which agent may act for which user." }
          - { name: "Microsoft Entra ID", kind: commercial, url: "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/identity-idp-microsoft.html", note: "AgentCore takes it as the inbound identity provider for Gateway and Runtime and as an outbound credential provider." }
          - { name: "Ping Identity", kind: commercial, url: "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/identity-idps.html", note: "Among AgentCore Identity's built-in providers, with OneLogin, CyberArk and FusionAuth." }
      - block: gateway
        service: "AgentCore Gateway with AWS WAF"
        note: "AWS's MCP guidance uses CloudFront, AWS WAF and an Application Load Balancer here."
        options:
          - { name: "AgentCore Gateway with AWS WAF", kind: commercial, url: "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-MCPservers.html", note: "Your MCP server as a gateway target, JWT or IAM inbound; today's mapping.", packs: [awsNative], watch: [{ text: "Does not pass the caller's token to an MCP server target: it authenticates again with client credentials, token exchange, SigV4 or an API key, and only token exchange keeps the user and tenant in the token the server sees.", url: "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-MCPservers.html" }, { text: "Renames every tool to targetName___toolName, so the names a caller's model sees differ from those in your repository.", url: "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-rate-limits-dimensions.html" }, { text: "Advertises its AWS managed hostname in its OAuth metadata; to publish on your own domain, put a proxy such as CloudFront in front, set domainOverride and have the proxy overwrite the domain header.", url: "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-inbound-auth.html" }, { text: "Takes OAuth tokens and allows calls of up to 15 minutes, with tool payloads capped at 6 MB by default.", url: "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/bedrock-agentcore-limits.html" }] }
          - { name: "Amazon CloudFront, AWS WAF and an Application Load Balancer", kind: commercial, url: "https://docs.aws.amazon.com/solutions/deploying-model-context-protocol-servers-on-aws/", note: "AWS's MCP deployment guidance, servers on Fargate and Lambda validating each token with Cognito." }
          - { name: "Amazon API Gateway HTTP API with a JWT authorizer", kind: commercial, url: "https://docs.aws.amazon.com/apigateway/latest/developerguide/http-api-jwt-authorizer.html", note: "Validates the caller's JWT from any OIDC issuer before the request reaches your MCP service.", watch: [{ text: "HTTP APIs end a call at 30 seconds and 10 MB. AWS's EKS pattern puts one with IAM (SigV4) authorisation in front of an internal load balancer, which most MCP clients reach only through a signing proxy.", url: "https://docs.aws.amazon.com/prescriptive-guidance/latest/mcp-deployment-patterns-on-aws/deployment-pattern-4-amazon-elastic-kubernetes-service.html" }] }
          - { name: "MCP Gateway & Registry", kind: open, url: "https://agentic-community.github.io/mcp-gateway-registry/", note: "Apache 2.0; runs on EKS, ECS or EC2; OAuth against Keycloak, Entra ID, Okta, Auth0, Cognito or PingFederate.", packs: [awsEksOpenSource] }
          - { name: "Kong AI MCP Proxy with AI MCP OAuth2", kind: commercial, url: "https://developer.konghq.com/plugins/ai-mcp-oauth2/", note: "Kong as the MCP resource server with per-tool ACLs; the OAuth2 plugin is Tech Preview.", packs: [kongAiGateway], watch: [{ text: "Kong as the MCP resource server; the OAuth2 plugin is Tech Preview.", url: "https://developer.konghq.com/plugins/ai-mcp-oauth2/" }] }
          - { name: "agentgateway", kind: open, url: "https://agentgateway.dev/", note: "Open-source gateway that routes and secures MCP tool traffic beside LLM and A2A traffic." }
      - block: authServer
        service: "Amazon Cognito and your MCP auth service"
        note: "Cognito issues and revokes the tokens; the auth service (on ECS in AWS's guidance) adds the grant profiles Cognito does not take. Where callers use the identity-assertion grant (ID-JAG), an authorization server that accepts it, such as Okta in AWS's worked example, can take its place."
        options:
          - { name: "Amazon Cognito and your MCP auth service", kind: commercial, url: "https://docs.aws.amazon.com/solutions/deploying-model-context-protocol-servers-on-aws/", note: "AWS's MCP guidance: Cognito authenticates; an MCP auth service behind CloudFront and the ALB, state in DynamoDB, issues tokens.", packs: [awsNative], watch: [{ text: "Cognito has no dynamic client registration (AWS's Runtime tutorial uses Auth0 for it), so each MCP client is pre-created as an app client and listed in the authorizer's allowedClients.", url: "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-mcp.html" }, { text: "AWS's sample makes Cognito the authorization server, with servers publishing OAuth protected-resource metadata; a separate auth service is needed only for grants Cognito does not take, such as identity assertion and token exchange.", url: "https://raw.githubusercontent.com/aws-solutions-library-samples/guidance-for-deploying-model-context-protocol-servers-on-aws/main/README.md" }, { text: "In AWS's worked example the identity-assertion (ID-JAG) grant is issued and redeemed at Okta's authorization server, with AgentCore Identity sending JWT_AUTHORIZATION_GRANT; Cognito plays no part, so callers on that profile need a server that accepts the grant.", url: "https://aws.amazon.com/blogs/machine-learning/govern-ai-agent-access-with-okta-cross-app-access-and-amazon-bedrock-agentcore-part-1/" }] }
          - { name: "Okta (Cross App Access)", kind: commercial, url: "https://aws.amazon.com/blogs/machine-learning/govern-ai-agent-access-with-okta-cross-app-access-and-amazon-bedrock-agentcore-part-1/", note: "The identity-assertion grant decided in Okta, validated by AgentCore; AWS's worked example." }
          - { name: "Microsoft Entra ID", kind: commercial, url: "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/identity-idp-microsoft.html", note: "Configurable as identity provider and authorization server for AgentCore Gateway and Runtime." }
          - { name: "Keycloak on Amazon EKS", kind: open, url: "https://www.keycloak.org/securing-apps/token-exchange", note: "Open source; standard token exchange (V2) is supported and on by default. The MCP Gateway & Registry install sets it up.", packs: [awsEksOpenSource] }
      - { block: service, service: Your MCP server on AgentCore Runtime, note: "Stateless streamable HTTP at /mcp. Amazon ECS or Lambda behind the load balancer is the guidance's alternative.", watch: [{ text: "MCP 2026-07-28 has no Mcp-Session-Id: Runtime keys each session, and its microVM, on X-Amzn-Bedrock-AgentCore-Runtime-Session-Id, so a request with neither header starts a new one against the active-session quota, and the gateway cannot pass X-Amzn- headers. Keep the server stateless.", url: "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-mcp-protocol-contract.html" }] }
      - { block: toolDefs, service: Versioned tool definitions in your repository, build: true, note: "Published as an approved MCP record in AWS Agent Registry." }
      - { block: orgData, service: Your systems of record, build: true, note: "Each reached on its own vaulted credential or an exchanged downstream token." }
    # >>> hosting options (compared against the vendor's pages; one is the mapping itself)
    hosting:
      - id: agentCoreRuntime
        kind: runtime
        name: "Amazon Bedrock AgentCore Runtime"
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agents-tools-runtime.html
        asOf: "2026-11"
        mapped: true
        compare:
          runs: "AWS runs your MCP server in a dedicated microVM per session, started from your container image or code package."
          patching: "AWS patches the OS kernel, and language runtimes for direct code deployments; you rebuild container images from a patched base image."
          data: "Requests and tool results are processed in session microVMs in the Region; memory is sanitised at session end and logs go to CloudWatch in your account."
          network: "PUBLIC or VPC network mode; in VPC mode AWS places network interfaces in your subnets and your security groups control what the server reaches."
          identity: "An IAM execution role that AgentCore Runtime assumes, plus a workload identity from AgentCore Identity for outbound OAuth and API keys."
          accepts: "Streamable HTTP at 0.0.0.0:8000/mcp, stateless or stateful, built with any MCP SDK, as an ARM64 container image or a direct code package."
          workload: "Requests with one session ID reach one microVM, and one with no ID starts a new session; a request may run 15 minutes, a stream 60 minutes, and a session 8 hours or 15 idle minutes."
          portability: "The server is a standard Streamable HTTP MCP server in a container; the invocation address, inbound authoriser and session headers are AgentCore-specific."
          effort: "Your team owns the server code, image rebuilds, execution role and authoriser settings; AWS operates capacity, scaling and session isolation."
          fits: "AWS's MCP guidance says to use Runtime when the solution needs a custom MCP server or a target that AgentCore Gateway does not support."
        sources:
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agents-tools-runtime.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-mcp.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-mcp-protocol-contract.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-how-it-works.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-lifecycle-settings.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-security-best-practices.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-vpc.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/bedrock-agentcore-limits.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-permissions.html
          - https://docs.aws.amazon.com/prescriptive-guidance/latest/mcp-deployment-patterns-on-aws/deployment-pattern-1-amazon-bedrock-agent-core.html
      - id: eks
        kind: cluster
        name: "Amazon EKS"
        url: https://docs.aws.amazon.com/prescriptive-guidance/latest/mcp-deployment-patterns-on-aws/deployment-pattern-4-amazon-elastic-kubernetes-service.html
        asOf: "2026-11"
        compare:
          runs: "You run the MCP server as pods on worker nodes in your EKS cluster; AWS runs the Kubernetes control plane."
          patching: "AWS patches the control plane; you patch node operating systems and images, unless EKS Auto Mode patches nodes and replaces them within 21 days."
          data: "Requests and tool results are processed in pods on EC2 instances in your account and VPC; state lives in the data stores you attach."
          network: "Pods sit in your VPC subnets behind an internal Application Load Balancer; Kubernetes network policies and security groups filter traffic."
          identity: "A Kubernetes service account mapped to an IAM role through EKS Pod Identity."
          accepts: "Any container that serves Streamable HTTP; AWS's sample runs a Python MCP server at /mcp behind an HTTPS internal load balancer."
          workload: "Stateless servers scale as replicas behind the load balancer; an API Gateway HTTP API in front limits calls to 30 seconds and 10 MB."
          portability: "The server is a standard container with Kubernetes manifests; the load balancer controller, Pod Identity and IAM wiring are AWS-specific."
          effort: "Your team operates the cluster, node groups, add-ons, ingress, autoscaling, upgrades and the server's deployment pipeline."
          fits: "AWS's guidance places this pattern with organisations that already have Kubernetes expertise, noting its higher complexity and cost."
        sources:
          - https://docs.aws.amazon.com/prescriptive-guidance/latest/mcp-deployment-patterns-on-aws/deployment-pattern-4-amazon-elastic-kubernetes-service.html
          - https://docs.aws.amazon.com/prescriptive-guidance/latest/mcp-deployment-patterns-on-aws/resources.html
          - https://docs.aws.amazon.com/prescriptive-guidance/latest/mcp-deployment-patterns-on-aws/next-steps.html
          - https://docs.aws.amazon.com/prescriptive-guidance/latest/mcp-deployment-patterns-on-aws/best-practices-for-mcp-deployments.html
          - https://docs.aws.amazon.com/prescriptive-guidance/latest/mcp-deployment-patterns-on-aws/conclusion.html
          - https://github.com/aws-samples/sample-mcp-deployment-patterns/tree/main/deploy-eks
          - https://docs.aws.amazon.com/eks/latest/userguide/security.html
          - https://docs.aws.amazon.com/eks/latest/userguide/automode.html
          - https://docs.aws.amazon.com/eks/latest/userguide/pod-identities.html
          - https://docs.aws.amazon.com/eks/latest/userguide/cni-network-policy.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-vpc-egress.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-MCPservers.html
          - https://docs.aws.amazon.com/elasticloadbalancing/latest/application/listener-verify-jwt.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/bedrock-agentcore-limits.html
        summary: "Your MCP server runs as a Deployment on Amazon EKS behind an internal Application Load Balancer; AgentCore Gateway reaches it as an MCP server target through a VPC Lattice private endpoint. You now carry what Runtime did: nodes and their patching, scaling, the load balancer, token checks at the server's edge, per-pod IAM roles, network policy and log collection. Runtime's per-session microVM is gone; pods share nodes unless you add isolation."
        bindings:
          - { block: service, service: "Your MCP server on Amazon EKS", build: true, note: "A Deployment serving stateless Streamable HTTP at /mcp behind an HTTPS internal Application Load Balancer, registered with the gateway as an MCP server target on a private endpoint.", url: https://docs.aws.amazon.com/prescriptive-guidance/latest/mcp-deployment-patterns-on-aws/deployment-pattern-4-amazon-elastic-kubernetes-service.html, watch: [{ text: "Pods on a node share its kernel, so tenants are kept apart by your code, namespaces and network policy unless the pods run as isolated pods (runtimeClassName isolated-sandbox, Kubernetes 1.36 or later, supported instance types).", url: "https://docs.aws.amazon.com/eks/latest/userguide/sandboxing.html" }] }
        dropSettings: [runtimeInboundJwt, runtimeRequestHeaderAllowlist]
        addSettings: [eksPodIdentity, eksNetworkPolicy, eksPrivateEndpoint, eksClusterAccessEntries, eksControlPlaneLogs, eksImdsHopLimit, albJwtValidation, gatewayMcpPrivateEndpoint]
        alsoNeeded:
          - service: "Application Load Balancer (AWS Load Balancer Controller or EKS Auto Mode)"
            role: ingress
            why: "Runtime gave the server an HTTPS address; on EKS an internal load balancer and its certificate do that."
            url: https://github.com/aws-samples/sample-mcp-deployment-patterns/tree/main/deploy-eks
          - service: "AWS Certificate Manager"
            role: keys
            why: "The internal load balancer needs a certificate for the name the gateway's private endpoint calls."
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-vpc-egress.html
          - service: "EKS Pod Identity"
            role: identity
            why: "Replaces Runtime's execution role with an IAM role per service account."
            url: https://docs.aws.amazon.com/eks/latest/userguide/pod-identities.html
          - service: "Amazon ECR"
            role: registry
            why: "Holds the server image the Deployment pulls; AWS builds and pushes it there in its sample."
            url: https://github.com/aws-samples/sample-mcp-deployment-patterns/tree/main/deploy-eks
          - service: "Amazon CloudWatch with OpenTelemetry instrumentation"
            role: logging
            why: "AWS's guidance asks for OpenTelemetry-compatible instrumentation with CloudWatch on patterns outside AgentCore."
            url: https://docs.aws.amazon.com/prescriptive-guidance/latest/mcp-deployment-patterns-on-aws/best-practices-for-mcp-deployments.html
        quickstart:
          - title: "Deployment Pattern 4 - Amazon Elastic Kubernetes Service"
            url: https://docs.aws.amazon.com/prescriptive-guidance/latest/mcp-deployment-patterns-on-aws/deployment-pattern-4-amazon-elastic-kubernetes-service.html
          - title: "Sample implementation: Amazon EKS MCP server deployment"
            url: https://github.com/aws-samples/sample-mcp-deployment-patterns/tree/main/deploy-eks
          - title: "Configure AgentCore Gateway VPC egress for gateway targets"
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-vpc-egress.html
      - id: lambda
        kind: runtime
        name: "AWS Lambda with Amazon API Gateway"
        url: https://docs.aws.amazon.com/prescriptive-guidance/latest/mcp-deployment-patterns-on-aws/deployment-pattern-2-aws-lambda-amazon-api-gateway.html
        asOf: "2026-11"
        compare:
          runs: "AWS Lambda runs your server code in execution environments it creates per concurrent request; API Gateway receives the HTTP calls."
          patching: "Lambda applies runtime patches to functions in Auto update mode; you update your code, dependencies and any container image you deploy."
          data: "Requests and tool results are processed in Lambda execution environments in the Region; durable state must sit in a store such as DynamoDB."
          network: "Functions have public internet access by default; attached to your VPC they reach only what its subnets, routes and security groups allow."
          identity: "The function's IAM execution role, whose temporary credentials Lambda supplies to the code."
          accepts: "Managed runtimes or container images; AWS's sample handles MCP JSON-RPC POSTs at /mcp in a Python function behind API Gateway."
          workload: "Each environment handles one request at a time; an invocation runs at most 15 minutes, capacity scales from zero and new environments cold start."
          portability: "Tool logic is ordinary code; the Lambda handler, API Gateway event format and authoriser configuration are AWS-specific and are rewritten elsewhere."
          effort: "Your team owns the function code, API Gateway and authoriser configuration and the external state store; there are no servers to operate."
          fits: "AWS's guidance places it with variable workloads and teams that put rapid development ahead of operational control."
        sources:
          - https://docs.aws.amazon.com/prescriptive-guidance/latest/mcp-deployment-patterns-on-aws/deployment-pattern-2-aws-lambda-amazon-api-gateway.html
          - https://docs.aws.amazon.com/prescriptive-guidance/latest/mcp-deployment-patterns-on-aws/resources.html
          - https://docs.aws.amazon.com/prescriptive-guidance/latest/mcp-deployment-patterns-on-aws/next-steps.html
          - https://docs.aws.amazon.com/prescriptive-guidance/latest/mcp-deployment-patterns-on-aws/conclusion.html
          - https://github.com/aws-samples/sample-mcp-deployment-patterns/tree/main/deploy-serverless
          - https://docs.aws.amazon.com/lambda/latest/dg/runtime-management-shared.html
          - https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html
          - https://docs.aws.amazon.com/lambda/latest/dg/configuration-vpc.html
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/http-api-jwt-authorizer.html
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/http-api-quotas.html
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/response-transfer-mode.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-MCPservers.html
        summary: "Your MCP server runs as a Lambda function that answers each MCP POST, with Amazon API Gateway (or a Lambda function URL) giving it an HTTPS address that AgentCore Gateway calls as an MCP server target. Lambda still patches, scales and isolates each request for you. What you now carry: an API front door and its authoriser, an external store for anything that must outlive one request, and the 15-minute and API Gateway time limits in place of Runtime's sessions."
        bindings:
          - { block: service, service: "Your MCP server on AWS Lambda behind API Gateway", build: true, note: "A function handling MCP JSON-RPC at /mcp, stateless, with API Gateway as its HTTPS endpoint; registered with AgentCore Gateway as an MCP server target.", url: https://docs.aws.amazon.com/prescriptive-guidance/latest/mcp-deployment-patterns-on-aws/deployment-pattern-2-aws-lambda-amazon-api-gateway.html, watch: [{ text: "API Gateway HTTP APIs end a call at 30 seconds and 10 MB, and REST APIs at 29 seconds unless the integration's response transfer mode is STREAM, so long tool calls run asynchronously or stream.", url: "https://docs.aws.amazon.com/apigateway/latest/developerguide/response-transfer-mode.html" }, { text: "Lambda keeps no state between requests, so it suits stateless MCP; a server that needs elicitation, sampling or progress notifications over stateful Streamable HTTP belongs on another host or uses the MCP Tasks extension.", url: "https://github.com/aws-samples/sample-mcp-deployment-patterns/tree/main/deploy-serverless" }] }
        dropSettings: [runtimeInboundJwt, runtimeRequestHeaderAllowlist]
        addSettings: [lambdaVpcConfig, apiGatewayJwtAuthorizer]
        alsoNeeded:
          - service: "Amazon API Gateway"
            role: ingress
            why: "Gives the function an HTTPS endpoint and checks the token or signature before invoking it."
            url: https://docs.aws.amazon.com/prescriptive-guidance/latest/mcp-deployment-patterns-on-aws/deployment-pattern-2-aws-lambda-amazon-api-gateway.html
          - service: "Amazon DynamoDB or Amazon Aurora"
            role: other
            why: "AWS's guidance stores durable application state outside the Lambda execution environment."
            url: https://docs.aws.amazon.com/prescriptive-guidance/latest/mcp-deployment-patterns-on-aws/deployment-pattern-2-aws-lambda-amazon-api-gateway.html
          - service: "AWS Secrets Manager"
            role: secrets
            why: "AWS's guidance retrieves database, internal service and API credentials from it at run time."
            url: https://docs.aws.amazon.com/prescriptive-guidance/latest/mcp-deployment-patterns-on-aws/deployment-pattern-2-aws-lambda-amazon-api-gateway.html
          - service: "Amazon CloudWatch with OpenTelemetry instrumentation"
            role: logging
            why: "AWS's guidance asks for OpenTelemetry-compatible instrumentation with CloudWatch on patterns outside AgentCore."
            url: https://docs.aws.amazon.com/prescriptive-guidance/latest/mcp-deployment-patterns-on-aws/best-practices-for-mcp-deployments.html
        quickstart:
          - title: "Deployment Pattern 2 - AWS Lambda + Amazon API Gateway"
            url: https://docs.aws.amazon.com/prescriptive-guidance/latest/mcp-deployment-patterns-on-aws/deployment-pattern-2-aws-lambda-amazon-api-gateway.html
          - title: "Sample implementation: Maths MCP Server - Serverless Deployment"
            url: https://github.com/aws-samples/sample-mcp-deployment-patterns/tree/main/deploy-serverless
          - title: "MCP servers as AgentCore Gateway targets"
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-MCPservers.html
      - id: agentCoreGateway
        kind: managed
        name: "Amazon Bedrock AgentCore Gateway"
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway.html
        asOf: "2026-11"
        compare:
          runs: "AWS runs the MCP endpoint; the gateway translates tool calls into Lambda invocations or API requests, so you run no MCP server."
          patching: "AWS patches the gateway; you still patch and operate the Lambda functions and APIs behind it."
          data: "Requests and results pass through the AWS-run gateway to your targets; gateway data at rest is encrypted with a service key or your KMS key."
          network: "The endpoint is AWS-hosted and reachable through an AgentCore VPC endpoint; VPC egress carries calls to Lambda, API Gateway and private targets."
          identity: "The gateway's IAM service role invokes Lambda and Smithy targets; OpenAPI targets use stored API keys, OAuth credentials or SigV4 signing."
          accepts: "Lambda functions with a tool schema, OpenAPI 3.0 and 3.1 specifications, Smithy models, API Gateway REST API stages and built-in connectors."
          workload: "A gateway invocation times out at 15 minutes by default; optional MCP sessions last 15 minutes to 8 hours and responses can stream as SSE."
          portability: "Tool schemas, OpenAPI files and Lambda code stay yours; the endpoint, authoriser, policies and published tool names are gateway configuration."
          effort: "Your team maintains tool schemas, target credentials and the backing functions and APIs; AWS operates the MCP endpoint and its scaling."
          fits: "AWS's guidance calls it the preferred starting point when existing Lambda functions or APIs already provide the business logic."
        sources:
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-core-concepts.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-supported-targets.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-add-target-lambda.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-schema-openapi.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-building-smithy-targets.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-api-gateway.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-connectors.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-features.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-sessions.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-mcp-streaming.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-encryption.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-vpc-egress.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-inbound-auth.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/bedrock-agentcore-limits.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-vpc.html
          - https://docs.aws.amazon.com/prescriptive-guidance/latest/mcp-deployment-patterns-on-aws/deployment-pattern-1-amazon-bedrock-agent-core.html
          - https://docs.aws.amazon.com/prescriptive-guidance/latest/mcp-deployment-patterns-on-aws/conclusion.html
        offers:
          - name: "AWS Lambda function targets"
            what: "Connects the gateway to Lambda functions that implement your tools, described by a tool schema supplied inline or from Amazon S3."
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-add-target-lambda.html
          - name: "OpenAPI schema targets"
            what: "Translates incoming MCP requests into HTTP requests to REST APIs defined by OpenAPI 3.0 or 3.1 specifications, using each operationId as the tool name."
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-schema-openapi.html
          - name: "Smithy model targets"
            what: "Translates incoming MCP requests into API calls to services defined by Smithy models of up to 10 MB that use the RestJson protocol."
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-building-smithy-targets.html
          - name: "Amazon API Gateway REST API stages as targets"
            what: "Exposes operations of a public REST API stage in the same account and Region as tools, selected with tool filters and renamed with tool overrides."
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-api-gateway.html
          - name: "Built-in connectors as targets"
            what: "Adds Amazon Bedrock Managed Knowledge Bases, Web Search Tool, Web Answer and AWS Step Functions as gateway targets."
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-connectors.html
          - name: "Inbound authorization"
            what: "Each gateway takes a JWT authoriser, IAM (SigV4) authorisation or an offloaded authorisation type to control which clients may call it."
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-inbound-auth.html
          - name: "Semantic search of tools"
            what: "When enabled at creation, clients call the x_amz_bedrock_agentcore_search tool to find tools with a natural language query."
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-features.html
          - name: "MCP sessions, response streaming and tasks"
            what: "Optional sessions, SSE response streaming, elicitation, sampling and tasks, several of which apply only to MCP server targets."
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-features.html
