    kind: research
    date: '2026-11-23'
    title: 'Anthropic''s enterprise guide to securing coding agents: judgment layer plus fixed boundaries'
    summary: 'Anthropic''s guide pairs a judgment layer (alignment, injection probes, the auto mode classifier)
      with fixed boundaries: deny-first permission rules, per-part Bash analysis, managed hooks, an enforced
      OS sandbox with no unsandboxed retries, narrow egress allowlists with DNS logging and DLP, managed-only
      MCP servers and domains, OpenTelemetry export, and a two-week pilot that reviews denials and blocked
      egress.

      '
    why: >-
      Says alignment lowers the odds of a bad action but not its ceiling; 'anything the agent can read,
      it can leak.'
    vendor: Anthropic
    products: [toolClaudeCode, toolClaudeCodeWeb]
    controls: [cap-agent-egress-control, D3-EI, cap-agent-action-policy-enforcement, cap-mcp-tool-integrity]
    patterns: [archCodingAgentThirdParty, archHostedAgentSessions]
    update:
      action: controlGuidance
      status: proposed
      target: cap-agent-egress-control
      note: >-
        A domain allowlist can't tell your account from an attacker's: pair it with site-scoped secrets,
        DNS logging and DLP.
    sources:
    - {title: The enterprise guide to securing coding agents, url: 'https://claude.com/resources/articles/enterprise-guide-to-securing-coding-agents',
      publisher: Anthropic, date: '2026-11-23'}
