# Claude Ship — one entity per product × reference architecture. Facts are dated (asOf) and cite the vendor's own
# documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# Scope: the three Claude Ship agents an Owner turns on for GitHub repositories at claude.ai Organization settings ›
# Claude Ship: Code Review (generally available), PR Steward and Claude Approvals (public beta), acting through the
# Claude GitHub App. On the agentic software factory they sit on the factory's source control and pipeline: they review,
# fix and decide approvals on the pull requests the factory's agent opens; they do not write the app from the spec,
# release it, host it or retire it.
# Exclusions: the /ship and /steward commands and auto-fix (Claude Code features that act as the developer in their own
# sessions: toolClaudeCode and toolClaudeCodeWeb); /code-review, Ultrareview and Claude in your own CI (claude-code
# GitHub Actions, GitLab CI/CD), which are other ways to get a review. Code Review is also mentioned on
# toolClaudeCodeWeb as a feature of the cloud runtime on the hosted-sessions drawing; this entry is its record on the
# software factory.
# 2026-11-26: onboarded on archSoftwareFactory from the feed item claude-ship-beta, marked preview at the owner's
# direction (Code Review is GA; PR Steward and Approvals are public beta). Read that day: the launch article
# (claude.com, 200) and 20 code.claude.com pages as Markdown (<path>.md, listed in code.claude.com/docs/llms.txt), all
# 200; the URLs below are the same pages without .md. Fetch log: claude.ai/admin-settings/claude-ship answered 403 (a
# signed-in console page), so console paths are as the docs name them; the support article on usage credits redirects
# from 12429409-extra-usage-for-paid-claude-plans to 12429409-manage-usage-credits-for-paid-claude-plans. The docs link
# the Claude Ship page both as admin-settings/claude-ship and as admin-settings/claude-code#code-review.
vendor: anthropic
family: Claude Ship
tools:
  - id: toolClaudeShip
    name: Claude Ship (Code Review, PR Steward, Claude Approvals)
    surfaceClasses:
      - ciIntegration
      - cloudAgent
    variants:
      - name: Code Review (generally available)
        class: ciIntegration
        url: https://code.claude.com/docs/en/code-review
        note: >-
          Reviews each pull request on Anthropic infrastructure with read-only repository access, posts inline findings
          and a Claude Code Review check run that never concludes as a failure.
      - name: PR Steward (public beta)
        class: cloudAgent
        url: https://code.claude.com/docs/en/pr-steward
        note: >-
          Pushes fixes for failing checks, merge conflicts and review feedback from a Claude Code cloud session, acting
          as the Claude GitHub App; designed not to approve or merge.
      - name: Claude Approvals (public beta)
        class: ciIntegration
        url: https://code.claude.com/docs/en/approvals
        note: >-
          A Claude Approvals check driven by .claude/approvals.yml on the default branch; where the policy allows it,
          Claude posts an approving review that GitHub can count. github.com only.
    architecture: archSoftwareFactory
    fills: [sourceControl]
    builder:
      kind: codingAgent
      what: "Anthropic-hosted agents on your GitHub pull requests: review findings, fixes for failing checks, and approvals under a policy file you write."
      languages: ["Any language in a GitHub repository"]
    status: preview
    asOf: "2026-11"
    summary:
      - >-
        Claude Ship, launched on 2026-11-23 for Claude Team and Enterprise organisations with repositories on GitHub, is
        three agents an Owner turns on per repository at Organization settings › Claude Ship. Code Review (GA) has
        several agents read each pull request's diff and surrounding code on Anthropic infrastructure, verify and rank
        findings, and post them inline with a check run; it never builds or runs the code and by itself neither
        approves nor blocks. PR Steward (beta) works in a Claude Code cloud session per pull request, in auto mode, and
        pushes commits for failing checks, conflicts and review comments as the Claude GitHub App.
      - >-
        Claude Approvals (beta) reads a policy file, .claude/approvals.yml on the default branch, that sets how many
        people a path needs and where Claude may approve, and reports a Claude Approvals check; the check blocks a merge
        only where GitHub requires it, and Claude's approving review can count as GitHub's required approval. The
        product turns an AI reviewer into a possible approver, so what merges is decided by the policy file, the
        branch rules and who can change either. None of the agents is available with Zero Data Retention, the HIPAA
        configuration or customer-managed keys, and each bills tokens to usage credits.
    facts:
      - label: Plans
        value: >-
          Team and Enterprise. Code Review is generally available; PR Steward and Claude Approvals are public beta. Not
          available with Zero Data Retention, the HIPAA configuration or customer-managed encryption keys; Approvals
          also cannot start with FERPA or Access Transparency settings. Billed by tokens to usage credits, outside plan
          usage, and billing continues if usage credits are turned off; spend limits are set per service at
          Organization settings › Usage, and PR Steward has none until one is set.
        url: https://code.claude.com/docs/en/claude-ship
      - label: Inference & routing
        value: >-
          Anthropic infrastructure; Code Review picks its own models with no admin model choice. A Claude organisation
          is needed even where developers use Claude Code through Bedrock, Google Cloud's Agent Platform or Foundry.
          PR Steward runs in an Anthropic-hosted cloud environment, or a self-hosted environment an Owner selects.
        url: https://code.claude.com/docs/en/code-review
      - label: Data leaving the device
        value: >-
          Through the Claude GitHub App, Anthropic reads each covered pull request's diff, surrounding code, text and
          comments; PR Steward clones the repository into a cloud session VM and runs its builds and tests there.
        url: https://code.claude.com/docs/en/pr-steward-security
      - label: Retention & training
        value: >-
          Commercial terms: no training on code or prompts unless the organisation opts in to the Development Partner
          Program; 30-day standard retention for Claude Code data. PR Steward's cloud sessions keep a stored transcript
          under the same policies, and a session can be deleted.
        url: https://code.claude.com/docs/en/data-usage
      - label: Docs index
        value: code.claude.com/docs/en/claude-ship (Code Review, PR Steward and Claude Approvals sections)
        url: https://code.claude.com/docs/en/claude-ship
      - label: Code hosts
        value: >-
          Code Review: github.com, GitHub Enterprise Cloud with data residency and GitHub Enterprise Server. PR Steward:
          github.com and a connected Enterprise Server on port 443, up to 256 repositories. Approvals: github.com,
          including Enterprise Cloud.
        url: https://code.claude.com/docs/en/approvals
    items:
      - title: Where each control lives
        body:
          - >-
            Organization settings › Claude Ship (Owner role): the Review switch, the organisation's review level, each
            repository's Review runs, Steward, Runs for, Excluded users, spend cap and environment, Where it runs, and
            the Approve row's Block globally. Organization settings › Usage: monthly limits for Code Review, PR Steward
            and Approvals classifiers. In the repository: REVIEW.md and .claude/approvals.yml on the default branch. In
            GitHub: the Claude GitHub App's repository access, rulesets that require a review and the Claude Approvals
            check, and the app's place on bypass lists.
        links:
          - title: Claude Ship
            url: https://code.claude.com/docs/en/claude-ship
          - title: Claude Approvals and your GitHub rules
            url: https://code.claude.com/docs/en/approvals-github-rules
      - title: What it covers on the software factory
        body:
          - >-
            The review and merge stage of the agent's pull request: an AI review, an agent that fixes what fails, and a
            policy for who has to approve the merge. PR Steward skips drafts and pull requests a bot opened unless
            someone starts it, so a factory whose agent opens draft pull requests as a bot gets Code Review and
            Approvals but not Steward by default. The owner's release approval, the staged release, the app's tenancy
            and data, and the register of apps are other products.
        links:
          - title: PR Steward (when it starts)
            url: https://code.claude.com/docs/en/pr-steward
    riskNotes:
      - risk: riskInsecureModelOutput
        note: >-
          The Claude Code Review check run never concludes as a failure, and a review with no findings does not mean the
          code is secure; a review blocks a merge only through an enforced Approvals policy that reads
          claude/code_review and a required Claude Approvals check.
      - risk: riskPromptInjection
        note: >-
          A pull request's text can steer a classifier's answer, and where a rule's if, an override's if or a reuse
          reads that answer, it can lower how many people the pull request needs; PR Steward acts unattended on pull
          request text that other people write.
      - risk: riskRogueActions
        note: >-
          PR Steward runs in auto mode and pushes without asking. Merging, turning on auto-merge, force-pushing and
          pushing to other branches are left to GitHub's branch rules, after permission rules that match command text
          and a model's check, which the docs say a command written another way can pass.
      - risk: riskShadowAndUnknownAgents
        note: >-
          Anyone who can merge a policy file into the default branch turns on Approvals, and with it Claude's approving
          reviews, in that repository unless an Owner has clicked Block globally.
    controls:
      - mitigation: AML.M0028
        coverage: partial
        mechanism: >-
          Per-repository Steward setting; the Claude GitHub App limited to selected repositories; the app's token kept
          outside the session sandbox, with Anthropic's service refusing approvals, changes to branch protection,
          rulesets, statuses and check runs, branch deletion and tag pushes; Code Review read-only; everything else left
          to GitHub's branch rules
        steps:
          - title: Require a review GitHub enforces
            body:
              - >-
                In a ruleset on the default branch require a pull request with at least one approval, dismiss stale
                approvals on new pushes, keep the Claude GitHub App off the bypass list and protect every other branch
                PR Steward should not push to.
            url: https://code.claude.com/docs/en/pr-steward-setup#require-reviews-with-branch-rules
          - title: Turn PR Steward on repository by repository
            body:
              - >-
                In Organization settings › Claude Ship, Edit the repository and set Steward to Manual (@claude steward)
                before On.
            url: https://code.claude.com/docs/en/pr-steward-setup#choose-when-pr-steward-starts-in-each-repository
          - title: Limit the app to the factory's repositories
            body:
              - >-
                When installing the Claude GitHub App, choose Only select repositories and list the repositories Claude
                Ship should act in.
            url: https://code.claude.com/docs/en/code-review-setup#turn-on-code-review
        note: >-
          Partial on the rule applied to the GitHub proxy of Claude Code cloud sessions: the service refuses approvals,
          rule changes, branch deletions and tag pushes, but merges, auto-merge, force-pushes and pushes to any branch
          the app can write are refused only by GitHub's branch rules, and the session's own guard against them is
          command-text rules plus a model's judgment. The app holds read and write on contents, pull requests and
          issues, and on github.com can be granted write on workflows. In a self-hosted environment PR Steward can push
          with the runner's own git credentials and reach GitHub with any credential a session can read.
        verified: "2026-11-26"
      - mitigation: AML.M0029
        coverage: partial
        mechanism: >-
          Claude Approvals policy file (.claude/approvals.yml: seats, people lists, claude: comments or approves, mode
          observe or enforce) reported as the Claude Approvals check, required in GitHub; the organisation-wide Approve
          row (Block globally or Allow policy files)
        steps:
          - title: Ask for a person who isn't an author
            body:
              - >-
                In a root .claude/approvals.yml, add a rule on "**" with nested: inherit, claude: comments and seats
                [{ count: 1, from: [humans, "!pr/authors"] }], with no if or override that reads a classifier.
            url: https://code.claude.com/docs/en/approvals-github-rules#merges-without-human-review
          - title: Require the check from the Claude app
            body:
              - >-
                In the branch ruleset require status checks and add Claude Approvals with the Claude app as its source
                (integration_id 1236702), never any source.
            url: https://code.claude.com/docs/en/approvals-setup#enforce-your-policy-and-require-claude-approvals
          - title: Keep policy files from switching it on
            body:
              - >-
                Until a policy is reviewed, click Block globally in the Approve row of Organization settings › Claude
                Ship, then Allow policy files.
            url: https://code.claude.com/docs/en/approvals-setup#ways-to-turn-off-approvals
        note: >-
          Partial by two rules: an AI reviewer is not human approval, and a merge gate approves the output, not the
          release. The policy can require named people or teams other than the author at merge, which GitHub enforces
          once the check is required; but Claude's approving review can itself satisfy GitHub's required approval
          where a rule says approves, a machine user counts as a person, seats: 1 can be the author, classifier
          answers can be steered by the pull request, and files no rule covers pass. The owner's approval of a release
          at the deploy gate is the deploy tooling's.
        verified: "2026-11-26"
      - mitigation: cap-staged-rollout-gate
        coverage: notApplicable
        note: >-
          Claude Ship works on pull requests and does not release or roll back the generated app; staged release and
          rollback belong to the deploy gate. No setting exists here for this pin. Approvals' observe mode stages the
          policy itself, not a release.
        evidence:
          - title: Set up Claude Approvals (observe mode)
            url: https://code.claude.com/docs/en/approvals-setup
        verified: "2026-11-26"
      - mitigation: D3-EI
        coverage: native
        mechanism: >-
          Each PR Steward session runs in a Claude Code cloud session with a fresh VM (Ubuntu 24.04) in the environment
          an Owner selects under Where it runs; Code Review does not build or run code
        steps:
          - title: Choose the environment PR Steward runs in
            body:
              - >-
                In Organization settings › Claude Ship › Where it runs select an organisation-shared Anthropic-hosted
                environment as the Default environment, overriding per repository only where needed.
            url: https://code.claude.com/docs/en/pr-steward-setup#choose-the-environment-pr-steward-runs-in
        note: >-
          Native on the rule applied to Claude Code cloud sessions: each Anthropic-hosted session gets its own VM,
          enforced by Anthropic, and the GitHub token stays outside it. Boundaries: a session can live about a week on
          one pull request before a new one starts; the environment cache and setup script carry across sessions; in a
          self-hosted environment isolation is the runner operator's. Classifier runs of Approvals are cloud sessions
          too; Code Review reads code without running it.
        verified: "2026-11-26"
      - mitigation: cap-agent-egress-control
        coverage: native
        mechanism: >-
          The network access level of the cloud environment PR Steward uses (None, Limited with Allowed domains and Allow
          package managers, Full), set by an Owner on organisation-shared environments; credentials from a Claude Tag
          bundle reach only the hosts the bundle lists
        steps:
          - title: Limit the shared environment's network
            body:
              - >-
                In Admin settings › Cloud environments, set the environment's Network access to Limited with Allowed
                domains for your package mirror and the hosts the build needs, and select it for PR Steward.
            url: https://code.claude.com/docs/en/cloud-environments#network-access
        note: >-
          Native here, unlike for a developer's own cloud sessions (rated partial because members can pick a personal
          Full environment): PR Steward's environment is chosen by an Owner, and its network level is enforced by
          Anthropic's proxy. Paths that bypass the level, None included: GitHub through its own proxy, MCP connectors
          through Anthropic's servers, network-secret hosts and the Anthropic API. Allow package managers opens public
          registries; uncheck it where a mirror exists.
        verified: "2026-11-26"
      - mitigation: D3-FA
        coverage: notApplicable
        note: >-
          Claude Ship inspects no package before it is installed; admission scanning belongs to the private registry.
          No setting exists here for this pin.
        evidence:
          - title: Code Review (what a review can access)
            url: https://code.claude.com/docs/en/code-review
        verified: "2026-11-26"
      - mitigation: D3-SYSVA
        coverage: partial
        mechanism: >-
          Code Review on every push (Review runs), at a review level (Quick, Standard, Deep), with REVIEW.md read from the
          protected default branch; findings block a merge only where an enforced Approvals rule reads claude/code_review
        steps:
          - title: Review every push to the factory's repositories
            body:
              - >-
                Turn on the switch under Review in Organization settings › Claude Ship and set each factory
                repository's Review runs to After every push.
            url: https://code.claude.com/docs/en/code-review-setup#set-when-reviews-run
          - title: Make the review a gate
            body:
              - >-
                In .claude/approvals.yml make a passing claude/code_review a condition of the rules for app code, and
                require the Claude Approvals check.
            url: https://code.claude.com/docs/en/approvals-setup#let-claude-approve-when-code-review-passes
        note: >-
          Partial: an AI review that reads the diff and its surroundings, focused on correctness by default, which does
          not build, run or dependency-scan the code, and whose check never fails on its own. It stops a merge only
          through an enforced, required Approvals policy, and at Code Review's spend limit a check that needs its review
          can stop passing. The pipeline's static analysis, dependency scanning and the release block stay with CI.
        verified: "2026-11-26"
      - mitigation: D3-CH
        coverage: partial
        mechanism: >-
          The Claude GitHub App's token is kept outside PR Steward's sandbox and added by Anthropic's service; registry
          and other credentials come from a Claude Tag bundle turned on for PR Steward, added outside the VM for the
          hosts listed
        steps:
          - title: Give PR Steward only the credentials it builds with
            body:
              - >-
                Put the private registry login in a Claude Tag bundle limited to its hosts and turn on the PR Steward row
                under the bundle's Where it applies.
            url: https://code.claude.com/docs/en/pr-steward-setup#give-pr-steward-credentials-from-a-claude-tag-bundle
        note: >-
          Partial: credentials stay out of the session, but nothing here scans pushes for secrets or keeps an app's
          secrets out of its code; those are the pipeline's (push protection, secret scanning) and the vault's. The docs
          warn that PR Steward reads text other people write, which can steer how it uses a credential. Bundles do not
          apply in a self-hosted environment.
        verified: "2026-11-26"
      - mitigation: D3-CTS
        coverage: notApplicable
        note: >-
          Claude Ship does not run the generated app or its connectors. No setting exists here for this pin.
        evidence:
          - title: Claude Ship
            url: https://code.claude.com/docs/en/claude-ship
        verified: "2026-11-26"
      - mitigation: D3-APA
        coverage: partial
        mechanism: >-
          Owner-only settings; PR Steward's Runs for (All eligible authors or Listed users only) and Excluded users;
          comment commands accepted only from people with write access; automatic reviews and Steward skip forks
        steps:
          - title: Choose whose pull requests PR Steward works on
            body:
              - >-
                Under the Steward switch set Runs for to Listed users only for a pilot, and add accounts it should never
                work for to Excluded users.
            url: https://code.claude.com/docs/en/pr-steward-setup#turn-on-pr-steward-and-add-repositories
        note: >-
          Partial: the product limits which repositories and authors its agents act for, keyed to GitHub accounts and
          repository write access rather than identity-provider groups. Who may use the factory, and sign-in in front
          of each generated app, are the intake's and the app platform's.
        verified: "2026-11-26"
      - mitigation: D3-MFA
        coverage: notApplicable
        note: >-
          Claude Ship has no sign-in of its own for approvers or app users; GitHub's two-factor requirement and the
          identity provider cover the people who approve and use. No setting exists here for this pin.
        evidence:
          - title: Claude Approvals and your GitHub rules
            url: https://code.claude.com/docs/en/approvals-github-rules
        verified: "2026-11-26"
      - mitigation: D3-NI
        coverage: notApplicable
        note: >-
          Claude Ship hosts no preview or app. No setting exists here for this pin.
        evidence:
          - title: Claude Ship
            url: https://code.claude.com/docs/en/claude-ship
        verified: "2026-11-26"
      - mitigation: cap-data-access-governance
        coverage: notApplicable
        note: >-
          Claude Ship does not serve app users or broker connectors to enterprise data. No setting exists here for this
          pin.
        evidence:
          - title: Claude Ship
            url: https://code.claude.com/docs/en/claude-ship
        verified: "2026-11-26"
      - mitigation: cap-input-guardrails
        coverage: none
        note: >-
          No setting exists for this pin. Built in, not settable: Anthropic's service passes PR Steward only the
          comments of the author, writers and bots, and REVIEW.md, instruction files, policy files and classifier
          definitions are read from the default branch, never from the pull request. Nothing classifies pull request
          text for injected instructions, and the docs say a pull request can steer a classifier. Rated on the rule
          applied to both products onboarded on this drawing on 2026-11-26: author filtering is not screening; the
          screening this pin asks for is the intake's classifier on the request and uploads.
        evidence:
          - title: What PR Steward can access
            url: https://code.claude.com/docs/en/pr-steward-security
          - title: Claude Approvals and your GitHub rules (classifier answers)
            url: https://code.claude.com/docs/en/approvals-github-rules
        verified: "2026-11-26"
      - mitigation: AML.M0023
        coverage: notApplicable
        note: >-
          Claude Ship writes no bill of materials; PR Steward's commits are authored as Claude <noreply@anthropic.com>
          and each push's comment names its commits, which ties a change to the agent but not to a model version. The
          release's bill of materials is the pipeline's. No setting exists here for this pin.
        evidence:
          - title: Work with PR Steward on a pull request
            url: https://code.claude.com/docs/en/pr-steward-pull-requests
        verified: "2026-11-26"
      - mitigation: D3-ACH
        coverage: notApplicable
        note: >-
          Claude Ship does not check a generated app's environment definition against a baseline; that is the
          pipeline's policy check. No setting exists here for this pin.
        evidence:
          - title: Code Review
            url: https://code.claude.com/docs/en/code-review
        verified: "2026-11-26"
      - mitigation: cap-agent-tracing
        coverage: external
        note: >-
          No setting exists for this pin in the pages read. The record lives on GitHub: Code Review's check run and
          comments, PR Steward's progress comments naming each pushed commit and how to undo it, the Approvals check and
          its reasons, all made as the Claude GitHub App, so GitHub's audit log and its streaming to your SIEM are the
          integration point. The Code Review and PR Steward analytics pages report activity and spend, not an audit
          trail.
        evidence:
          - title: Work with PR Steward on a pull request
            url: https://code.claude.com/docs/en/pr-steward-pull-requests
          - title: Code Review costs and usage (analytics)
            url: https://code.claude.com/docs/en/code-review-costs
        verified: "2026-11-26"
      - mitigation: cap-agent-kill-switch
        coverage: partial
        mechanism: >-
          Steward switch, repository Steward Off and Excluded users (new starts stop); removing the
          claude-pr-steward-watching label or @claude stop on a pull request; Block globally for Approvals; the Review
          switch for Code Review
        steps:
          - title: Stop PR Steward where it is working
            body:
              - >-
                Remove the claude-pr-steward-watching label from the pull requests it watches (or comment @claude stop),
                then turn off the Steward switch or set the repository's Steward to Off.
            url: https://code.claude.com/docs/en/pr-steward-setup#turn-off-pr-steward
          - title: Stop Claude approving everywhere
            body:
              - >-
                Click Block globally in the Approve row, stop requiring the Claude Approvals check, and dismiss Claude's
                approving reviews on open pull requests.
            url: https://code.claude.com/docs/en/approvals-setup#turn-off-approvals
        note: >-
          Partial by the kill-switch rule: turning PR Steward off stops new starts, but it keeps working for a time on
          pull requests that already carry its label (about a week after excluding an author) until the labels are
          removed; Claude's earlier approving reviews keep counting until dismissed. The stop this pin names, taking a
          generated app offline, is the app platform's.
        verified: "2026-11-26"
      - mitigation: cap-shadow-ai-discovery
        coverage: notApplicable
        note: >-
          Finding apps built outside the factory is cloud and network discovery's objective. No setting exists here for
          this pin.
        evidence:
          - title: Claude Ship
            url: https://code.claude.com/docs/en/claude-ship
        verified: "2026-11-26"
      - mitigation: D3-AI
        coverage: notApplicable
        note: >-
          The register of generated apps belongs to the factory's catalogue. No setting exists here for this pin.
        evidence:
          - title: Claude Ship
            url: https://code.claude.com/docs/en/claude-ship
        verified: "2026-11-26"
      - mitigation: AML.M0043
        coverage: notApplicable
        note: >-
          Claude Ship creates no previews or other resources beyond commits, comments, reviews and check runs on pull
          requests that already exist. No setting exists here for this pin.
        evidence:
          - title: PR Steward
            url: https://code.claude.com/docs/en/pr-steward
        verified: "2026-11-26"
    settings:
      - id: codeReviewSwitch
        name: Review (Code Review switch)
        where: claude.ai Organization settings › Claude Ship › Review
        setVia: [adminConsole]
        area: tools
        default: "Off"
        recommended: On, with the factory's app repositories added
        value: "On"
        why: Every pull request the factory's agent opens gets a second reading for logic and security bugs before anyone decides to merge it.
        mitigations: [D3-SYSVA]
        requires: Team or Enterprise; Owner role; not with ZDR, HIPAA or customer-managed keys
        url: https://code.claude.com/docs/en/code-review-setup#turn-on-code-review
        verified: "2026-11-26"
      - id: reviewRuns
        name: Review runs
        where: Organization settings › Claude Ship › Repositories › Edit › Review runs
        setVia: [adminConsole]
        area: tools
        default: After every push (for a repository added from Add a repository)
        recommended: After every push on the factory's repositories
        value: "After every push"
        why: A fix the agent pushes after the first review is reviewed too, instead of merging unread.
        mitigations: [D3-SYSVA]
        url: https://code.claude.com/docs/en/code-review-setup#set-when-reviews-run
        verified: "2026-11-26"
      - id: reviewLevel
        name: Review level
        where: Organization settings › Claude Ship › Review level (organisation default), or Repositories › Edit › Review level
        setVia: [adminConsole]
        area: tools
        default: Standard
        recommended: Deep on the factory's app repositories; Standard as the organisation default
        value: "Deep on factory repositories"
        why: Code that no person reads gets the most thorough pass the product offers.
        mitigations: [D3-SYSVA]
        url: https://code.claude.com/docs/en/code-review-setup#set-the-default-review-level
        verified: "2026-11-26"
      - id: reviewMd
        name: REVIEW.md
        where: Repository root, on a protected default branch
        setVia: [configFile]
        area: tools
        default: None (reviews focus on correctness)
        recommended: A REVIEW.md that adds the factory's security checks (access checks, secrets in code, logging of personal data), merged to a protected default branch
        value: "Factory security checks, protected branch"
        why: Reviews look for what generated apps get wrong, and a pull request cannot rewrite the instructions it is reviewed against.
        mitigations: [D3-SYSVA]
        url: https://code.claude.com/docs/en/code-review-customize#which-branch-review-md-is-read-from
        verified: "2026-11-26"
      - id: githubAppRepositories
        name: Claude GitHub App repository access
        where: GitHub › Install GitHub App › Choose which repositories the app can access
        setVia: [adminConsole]
        area: tools
        default: Chosen at install (All repositories or Only select repositories)
        recommended: Only select repositories, the factory's app repositories
        value: "Only select repositories"
        why: The app's permission set is broader than a review needs and is shared with other Claude features, so it reaches only repositories you chose.
        mitigations: [AML.M0028]
        requires: Owner of the GitHub organisation
        url: https://code.claude.com/docs/en/code-review-setup#turn-on-code-review
        verified: "2026-11-26"
      - id: stewardRepository
        name: Steward (repository)
        where: Organization settings › Claude Ship › Repositories › Edit › Steward (Manual (@claude steward), On, On (including drafts), Off)
        setVia: [adminConsole]
        area: tools
        default: Off until an Owner turns on the Steward switch and sets the repository
        recommended: Manual (@claude steward) while piloting, On once its fixes match what reviewers would do
        value: "Manual, then On"
        why: PR Steward pushes commits without asking, so it acts only in repositories, and at the moments, an Owner chose.
        mitigations: [AML.M0028]
        requires: Owner role; usage credits; the GitHub connector on
        url: https://code.claude.com/docs/en/pr-steward-setup#choose-when-pr-steward-starts-in-each-repository
        verified: "2026-11-26"
      - id: stewardRunsFor
        name: Runs for (and Excluded users)
        where: Organization settings › Claude Ship › under the Steward switch › Runs for, Excluded users
        setVia: [adminConsole]
        area: identity
        recommended: Listed users only during the pilot, then All eligible authors; accounts it must not act for under Excluded users
        value: "Listed users only for the pilot"
        why: PR Steward works only on the pull requests of authors you named, never for an account you excluded.
        mitigations: [D3-APA]
        url: https://code.claude.com/docs/en/pr-steward-setup#turn-on-pr-steward-and-add-repositories
        verified: "2026-11-26"
      - id: requireReviewRuleset
        name: Require a pull request with approval (ruleset), stale approvals dismissed, Claude GitHub App off the bypass list
        where: GitHub › repository or organisation › Settings › Rules › Rulesets › default branch
        setVia: [adminConsole]
        area: tools
        default: No rule (nothing stops a merge)
        recommended: At least one approval required, dismissed on new pushes or required on the most recent push, the Claude GitHub App not on any bypass list, force pushes blocked
        value: "Approval required, stale approvals dismissed"
        why: Whatever PR Steward pushes, and whatever Claude approves, GitHub still decides what merges, and a push after an approval needs a new one.
        mitigations: [AML.M0028, AML.M0029]
        requires: Admin of the repository; a paid GitHub plan for a private repository
        url: https://code.claude.com/docs/en/pr-steward-setup#require-reviews-with-branch-rules
        verified: "2026-11-26"
      - id: stewardEnvironment
        name: Where it runs (Default environment) and Environment
        where: Organization settings › Claude Ship › Where it runs › Default environment; Repositories › Edit › Environment
        setVia: [adminConsole]
        area: tools
        default: The organisation's default environment, or with none an Anthropic-hosted environment with no setup script or variables
        recommended: An organisation-shared Anthropic-hosted environment set aside for PR Steward
        value: "Shared Anthropic-hosted environment"
        why: Each session's builds and tests run in a fresh VM whose network you set, not on a runner that holds other credentials.
        mitigations: [D3-EI, cap-agent-egress-control]
        url: https://code.claude.com/docs/en/pr-steward-setup#choose-the-environment-pr-steward-runs-in
        verified: "2026-11-26"
      - id: environmentNetworkAccess
        name: Network access (cloud environment)
        where: claude.ai Admin settings › Cloud environments › environment › Network access (None, Limited, Full)
        setVia: [adminConsole]
        area: network
        default: Limited, with Allow package managers checked
        recommended: Limited, with Allowed domains for your package mirror and the hosts the build needs, Allow package managers unchecked where a mirror exists
        value: "Limited, your mirror and named hosts"
        why: Commands PR Steward runs reach only listed hosts; GitHub, connectors, network-secret hosts and the Anthropic API still take their own paths.
        mitigations: [cap-agent-egress-control]
        requires: Owner role (organisation-shared environments)
        url: https://code.claude.com/docs/en/cloud-environments#network-access
        verified: "2026-11-26"
      - id: tagBundleForSteward
        name: PR Steward (Claude Tag bundle › Where it applies)
        where: Organization settings › Claude Tag › Bundles › bundle › Where it applies › PR Steward
        setVia: [adminConsole]
        area: data
        default: "Off"
        recommended: On only for a bundle holding the registry login PR Steward builds with, limited to that registry's hosts
        value: "On for a single-purpose bundle"
        why: The credential is added outside the VM and only for the hosts the bundle lists, so the session never holds it.
        mitigations: [D3-CH]
        requires: Claude Tag set up; Anthropic-hosted environment
        url: https://code.claude.com/docs/en/pr-steward-setup#give-pr-steward-credentials-from-a-claude-tag-bundle
        verified: "2026-11-26"
      - id: approvalsPolicy
        name: .claude/approvals.yml (verdict seats and claude)
        where: Repository › .claude/approvals.yml on the default branch
        setVia: [configFile]
        area: tools
        default: No file (Approvals off in the repository)
        recommended: 'A root rule on "**" with nested: inherit, claude: comments and seats [{ count: 1, from: [humans, "!pr/authors"] }], and no classifier condition that lowers it'
        value: "One person besides the author on every path"
        why: Every merge of factory code needs a person who did not write it, and nothing in the pull request's text can lower that.
        mitigations: [AML.M0029]
        url: https://code.claude.com/docs/en/approvals-github-rules#merges-without-human-review
        verified: "2026-11-26"
      - id: approvalsMode
        name: mode (approvals policy)
        where: .claude/approvals.yml › mode
        setVia: [configFile]
        area: tools
        default: enforce (a policy file with no mode line is enforced)
        recommended: observe until the check's titles match what your reviewers decide, then enforce
        value: "observe first, then enforce"
        why: Nobody relies on Claude's verdicts, or its approving reviews, before they have been compared with people's.
        mitigations: [AML.M0029]
        url: https://code.claude.com/docs/en/approvals-setup#switch-from-observe-mode-to-enforcement
        verified: "2026-11-26"
      - id: requireApprovalsCheck
        name: Require status checks to pass (Claude Approvals, source the Claude app)
        where: GitHub › Settings › Rules › Rulesets (or branch protection) › Require status checks › Claude Approvals
        setVia: [adminConsole]
        area: tools
        default: Not required (the check does not block a merge)
        recommended: Required on the default branch and every branch the policy gates, source the Claude app (integration_id 1236702)
        value: "Required, source the Claude app"
        why: The policy blocks a merge only where GitHub requires its check, and a check named Claude Approvals from any other source is refused.
        mitigations: [AML.M0029]
        requires: Admin access to the repository
        url: https://code.claude.com/docs/en/approvals-setup#set-the-source-that-github-accepts-for-claude-approvals
        verified: "2026-11-26"
      - id: approvalsBlockGlobally
        name: Approve (Block globally / Allow policy files)
        where: Organization settings › Claude Ship › Approve
        setVia: [adminConsole]
        area: tools
        default: Allow policy files (anyone who can merge a policy file turns Approvals on)
        recommended: Block globally until the platform team has reviewed a repository's policy, then Allow policy files
        value: "Block globally until a policy is reviewed"
        why: Claude's approving reviews cannot appear in a repository because someone merged a policy file nobody reviewed.
        mitigations: [AML.M0029, cap-agent-kill-switch]
        requires: Owner role
        url: https://code.claude.com/docs/en/approvals-setup#ways-to-turn-off-approvals
        verified: "2026-11-26"
      - id: stewardTurnOff
        name: Steward switch, repository Steward Off, claude-pr-steward-watching label
        where: Organization settings › Claude Ship › Steward; the claude-pr-steward-watching label on each pull request
        setVia: [adminConsole]
        area: tools
        recommended: In the stop runbook, remove the label from watched pull requests first, then turn the switch off
        value: "Labels removed, then switch off"
        why: Turning the switch off only stops new starts; removing the label stops the work already in progress.
        mitigations: [cap-agent-kill-switch]
        url: https://code.claude.com/docs/en/pr-steward-setup#turn-off-pr-steward
        verified: "2026-11-26"
