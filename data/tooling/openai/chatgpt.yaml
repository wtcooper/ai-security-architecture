vendor: openai
family: ChatGPT
tools:
  - id: toolChatgptDesktop
    name: ChatGPT Enterprise (web, desktop and Work)
    surfaceClasses:
      - desktopApp
      - saasChat
      - browserExtension
    variants:
      - name: ChatGPT desktop app (macOS, Windows MSIX, Linux preview)
        class: desktopApp
        url: https://learn.chatgpt.com/docs/enterprise/windows-deployment
      - name: ChatGPT web (chatgpt.com)
        class: saasChat
        url: https://learn.chatgpt.com/docs/use-chatgpt
      - name: ChatGPT Work (Work Local and Work Cloud)
        class: saasChat
        url: https://learn.chatgpt.com/docs/get-started-with-work
      - name: Built-in browser (browser_use) and Chrome extension
        class: browserExtension
        url: https://learn.chatgpt.com/docs/browser
    architecture: archEnterpriseAiChat
    status: ga
    asOf: "2026-09"
    summary:
      - The current desktop app bundles Chat, Work and Codex, and is governed by the same
        managed-configuration system as Codex — requirements.toml cloud policies and the com.openai.codex MDM
        domain — plus workspace admin controls for plugins, apps, memory and identity from the ChatGPT admin
        panel.
      - >-
        Inference is at OpenAI for every mode. Chat and Work Cloud run entirely on OpenAI infrastructure (Work
        Cloud in VM-backed sandboxes with a hosted browser whose cookies stay separate from the device); Work
        Local runs on the desktop app with the Codex sandbox, computer use and the built-in browser, and the
        vendor states that relevant file excerpts, prompts, screenshots and browser content may be sent to
        OpenAI to complete a task.
      - >-
        Enterprise administration is role-based (Owner, Admin, Member, Analytics Viewer plus custom roles
        whose grants add up, so On in any assigned role grants access), provisioned by SCIM, with plugins and apps off by default on
        Enterprise and Edu (new workspaces start with a vendor-selected set of apps enabled), per-connection
        action controls, a GPT actions domain allowlist, access-token lifetime limits, service accounts, and a
        Compliance API whose records live 30 days at source.
    facts:
      - label: Plans
        value: >-
          Business, Enterprise and Edu carry the admin controls; apps and plugins default on for Business and
          off for Enterprise and Edu, except that new Enterprise and Edu workspaces start with a vendor-selected
          set of apps enabled.
        url: https://help.openai.com/en/articles/11509118-admin-controls-security-and-compliance-for-plugins-and-apps
      - label: Inference & routing
        value: >-
          Work Cloud runs the Codex harness in an isolated OpenAI environment; the web cannot access local
          files, apps or tabs.
        url: https://learn.chatgpt.com/docs/enterprise/chatgpt-work-overview
      - label: Data leaving the device
        value: >-
          Local execution does not mean device-only inference; file excerpts, prompts, screenshots, browser
          content and tool results may be sent to OpenAI.
        url: https://learn.chatgpt.com/docs/enterprise/chatgpt-work-local-security
      - label: Retention & training
        value: >-
          Conversations follow workspace retention settings with deletion scheduled within 30 days; Compliance
          Logs Platform keeps 30 days; connected-app data follows the source system.
        url: https://learn.chatgpt.com/docs/enterprise/chatgpt-work-cloud-security
      - label: Docs index
        value: learn.chatgpt.com/docs/enterprise/chatgpt-work-overview (links every admin page)
        url: https://learn.chatgpt.com/docs/enterprise/chatgpt-work-overview
    items:
      - title: Managed deployment and update control
        body:
          - Windows ships only as a Store-signed MSIX (no MSI or standalone EXE), deployable via Intune, MECM
            or winget with offline packages available; macOS deploys from the enterprise DMG, with device
            management arriving through the com.openai.codex MDM payload rather than a dedicated packaging
            guide. The built-in updater is disabled with an enforced requirements.toml feature pin, targeted
            by group, user or platform from the managed-configs console.
        links:
          - title: Windows deployment
            url: https://learn.chatgpt.com/docs/enterprise/windows-deployment
          - title: Managing app updates
            url: https://learn.chatgpt.com/docs/enterprise/manage-app-updates
      - title: Workspace controls over connectors, apps and memory
        body:
          - On Enterprise and Edu workspaces, new plugins and apps are disabled by default (new workspaces start
            with a vendor-selected set of apps enabled) and enabled per role, with per-app configuration for
            real-time access, actions, approvals and domain restrictions — one control set that applies across
            web, mobile, desktop and Codex. Memory and record mode are workspace-level toggles (record off by
            default), and the Compliance Logs Platform exports immutable audit, authentication and usage events
            with 30-day source retention, so longer retention requires continuous export.
        links:
          - title: Admin controls, security, and compliance for plugins and apps
            url: https://help.openai.com/en/articles/11509118-admin-controls-security-and-compliance-for-plugins-and-apps
          - title: OpenAI Compliance Platform for Enterprise and Edu customers
            url: https://help.openai.com/en/articles/9261474-openai-compliance-platform-for-enterprise-and-edu-customers
    riskNotes:
      - risk: riskExcessiveDataHandlingDuringInference
        note: >-
          Work Local ships file excerpts and screenshots to the service, and shared connections retrieve with the
          connected account's permissions, which the vendor warns may be broader than the individual user's.
      - risk: riskPromptInjection
        note: >-
          The hosted and built-in browsers and connected apps feed arbitrary content to the model; OpenAI's
          screening (MCP content monitoring, link-generation controls, a sign-in review model) is vendor-internal
          and not admin-tunable, and a Lockdown Mode role cuts exfiltration paths without screening content.
      - risk: riskAgenticDelegationConfusedDeputy
        note: >-
          Agent-owned and shared connected accounts act for whoever triggers the task; action control
          (read-only or a custom set) is the bound.
    controls:
      - mitigation: D3-APA
        coverage: native
        mechanism: >-
          Admin Console > Permissions custom roles (Default / On / Off; grants combine additively) over Work,
          plugins and apps, developer mode, agents and GPTs; target-tenant admin consent for connector apps
          (Admin > Plugins > Configure Microsoft permissions to Entra organisation-wide consent, Google Workspace
          scope authorisation)
        steps:
          - title: Model feature access as custom roles
            body:
              - >-
                Workspace owners keep Work, plugins, custom MCP plugins, agent building or publishing and GPT
                sharing off in the workspace default and grant them through custom roles (Permissions & roles >
                Custom roles) assigned to SCIM groups; grants are additive, so Off in one role does not remove
                access another assigned role grants.
            url: https://learn.chatgpt.com/docs/enterprise/roles-and-workspace-permissions
          - title: Grant Microsoft permissions through Entra admin consent
            body:
              - >-
                In Admin > Plugins select Configure Microsoft permissions, keep only the permissions you intend to
                grant, then have an Entra administrator grant organisation-wide consent to the verified ChatGPT /
                OpenAI, L.L.C. application; actions stay off until enabled in ChatGPT.
            url: https://help.openai.com/en/articles/11509118-admin-controls-security-and-compliance-for-plugins-and-apps
          - title: Authorise Google scopes in Google Workspace
            body:
              - >-
                Have the Google Workspace administrator authorise the Drive, Docs, Sheets and Slides scopes (and
                domain-wide delegation for administrator-managed sync), or turn off the actions whose scopes you
                will not grant.
            url: https://help.openai.com/en/articles/11509118-admin-controls-security-and-compliance-for-plugins-and-apps
          - title: Require SSO for the workspace
            body:
              - >-
                In Admin Console (admin.openai.com) open Global settings > Access > Single Sign-On and, after
                testing the connection, set the ChatGPT product policy (or the workspace override) to Required;
                Required applies to members whose email is on a verified domain the policy covers.
            url: https://help.openai.com/en/articles/9534785-single-sign-on-sso-setup-for-openai-products
          - title: Verify every sign-in domain
            body:
              - >-
                Under Global settings > Access > Domains add each exact domain and subdomain, publish the DNS TXT
                record, select Check Domain, then use Manage eligibility to scope it to the intended workspaces.
            url: https://help.openai.com/en/articles/8871611-verifying-your-domain-for-openai-identity
        note: >-
          Native by the rule applied to every vendor: the console administers role- and group-based
          authorisation over connectors, agents and features (custom roles on SCIM-synced groups, whose grants add up), and
          OpenAI documents the target-tenant consent path for its connector apps — Entra organisation-wide
          consent to the verified ChatGPT / OpenAI, L.L.C. application for Outlook, Teams and SharePoint, Google
          Workspace scope authorisation and domain-wide delegation, and Slack admin approval for the ChatGPT
          Agents app. The target-tenant consent itself is the other tenant's control (Entra, Google Workspace,
          Slack, GitHub organisation approval); OpenAI does not publish the Entra app ID, so confirm the app
          identity on the consent screen. Custom roles are Enterprise, Edu and Healthcare only and take about five
          minutes to apply. Policy administration is not the runtime decision, which OpenAI makes per request.
          Required SSO sends verified-domain members through the IdP, but invited members from other domains may
          still use another permitted sign-in method; domain claiming (a separate request to OpenAI) also blocks
          corporate app connections from personal or other workspaces.
        verified: "2026-10-30"
        migration:
          from:
            - capabilityIga
            - capabilityDataAccessGovernance
          reviewRequired: false
          original:
            - capability: capabilityIga
              coverage: native
              mechanism: >-
                SCIM provisioning, workspace roles and custom roles (Permissions & roles), access-token
                expiration limit
              note: >-
                SAML/OIDC setup lives in the Help Center, which returned 403 today; the roles model is
