        summary: "The coordinator and its subagents run together in one Deployment in a GKE cluster you operate, pulling triggers and operator confirmations from Pub/Sub; Sessions still holds the journal. You now carry the Pod's identity and its right to mint each subagent's token, the node's credentials, private nodes and network policy, the outbound proxy route, canary rollouts through Cloud Deploy, and node upgrades that can evict a running workflow."
        bindings:
          - { block: harness, service: "Your multi-agent app in a Deployment on GKE", builtWith: "Agent Development Kit (ADK)", note: "Coordinator and subagents in one Pod, as in one process on Cloud Run: one Deployment, one Kubernetes ServiceAccount. adk deploy gke (Python only) builds and applies it.", url: https://adk.dev/deploy/gke/ }
          - { block: events, service: "Pub/Sub pull subscription and Cloud Scheduler", note: "Push needs an HTTPS endpoint on the public web, so a subscriber beside the app pulls. It starts runs and carries the operator's confirmation that resumes a suspended step.", url: https://docs.cloud.google.com/pubsub/docs/subscriber }
        dropSettings: [pubsubPushAuth, cloudRunServiceIdentity, cloudRunTrafficSplit, swpEgress]
        addSettings: [workloadIdentityGke, gkeNetworkPolicy, fqdnNetworkPolicy, pubsubPullAccess, gkeNodeServiceAccount, gkeSwpExplicitProxy, cloudDeployCanaryGke]
        differences:
          - at: events->harness
            text: "Pub/Sub can push only to an HTTPS endpoint on the public web, so on a private cluster the agent pulls instead. No signed delivery names the caller: whoever holds Pub/Sub Publisher on the topic can start a run, so the topic's IAM policy is now the gate, and you build the subscriber that hands each message to the agent."
            url: https://docs.cloud.google.com/pubsub/docs/subscriber
          - at: harness
            text: "Nothing limits a Pod's outbound traffic until you configure it: by default every Pod can talk to every other Pod, GKE nodes have external IP addresses, and no network policy applies. The egress allowlist holds only with private nodes, network policy enforcement and the proxy route all in place."
            url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/hardening-your-cluster
          - at: orchestration->subagents
            text: "Each subagent's token is still minted for its own IAM service account, so the coordinator's Kubernetes ServiceAccount principal needs Service Account Token Creator on each one. All the agents share one Pod, so they share its ServiceAccount, its network policy and its node."
            url: https://docs.cloud.google.com/iam/docs/create-short-lived-credentials-direct
          - at: orchestration
            text: "A run is no longer cut at Cloud Run's 60-minute request limit, but node auto-upgrades and scale-down evict Pods (Autopilot can protect a Pod for up to seven days), so a long workflow still has to resume from its session history."
            url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/autopilot-overview
          - at: harness->gateway
            text: "The agent's identity is its Kubernetes ServiceAccount only where Workload Identity Federation for GKE is on for the cluster and node pool (always on in Autopilot). Without it the node service account's credentials are exposed to workloads. adk deploy gke uses the default ServiceAccount in the default namespace, so give the agent its own."
            url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/workload-identity
