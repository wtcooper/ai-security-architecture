          re-mints sandbox proxy tokens
        steps:
          - title: Pull keys from Bitwarden Secrets Manager
            body:
              - "Run hermes secrets bitwarden setup (installs the pinned bws binary, stores the access token,
                picks a project) and set secrets.bitwarden.enabled: true with project_id in config.yaml;
                rotate the bootstrap token with hermes secrets bitwarden token."
            url: https://hermes-agent.nousresearch.com/docs/user-guide/secrets/bitwarden
          - title: Or reference 1Password items
            body:
              - "Set secrets.onepassword.enabled: true and map env var names to op:// references under
                secrets.onepassword.env, authenticating with the op CLI via a service account token named by
                service_account_token_env."
            url: https://hermes-agent.nousresearch.com/docs/user-guide/secrets/onepassword
          - title: Or wrap any CLI vault with the command helper
            body:
              - Point the command source at a helper (keepassxc-cli, secret-tool, pass or a script) that
                prints KEY=VALUE lines; sources compose with a fixed precedence and secrets.preserve_existing
                pins per-profile values.
            url: https://hermes-agent.nousresearch.com/docs/user-guide/secrets/command
          - title: Lock the file that remains and rotate sandbox tokens
            body:
              - Run chmod 600 ~/.hermes/.env as the security page instructs, and after a suspected leak mint
                fresh proxy tokens with hermes egress setup --rotate-tokens and restart running sandboxes.
            url: https://hermes-agent.nousresearch.com/docs/reference/cli-commands
