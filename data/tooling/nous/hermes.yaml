      - mitigation: AML.M0024
        coverage: unknown
        mechanism: >-
          Rotating agent.log / gateway.log / errors.log under ~/.hermes/logs (secrets redacted), full message
          history in state.db exportable with hermes sessions export, per-request iron-proxy and A2A audit
          files, and post_tool_call hooks for an external trail; local files, not tamper-evident
        steps:
          - title: Read and tail the activity logs
            body:
              - hermes logs agent --since 1h --session <id> shows API calls, tool dispatch and session
                lifecycle; hermes logs gateway covers platform connections and message dispatch; files rotate
                under ~/.hermes/logs/.
            url: https://hermes-agent.nousresearch.com/docs/reference/cli-commands
          - title: Export session history for retention
            body:
              - hermes sessions export backup.jsonl --redact dumps message history from ~/.hermes/state.db
                with secrets scrubbed; filter by --source, --older-than or --session-id for a scoped extract.
            url: https://hermes-agent.nousresearch.com/docs/user-guide/sessions
          - title: Ship a tool-call trail off the box
            body:
              - "Register a post_tool_call shell hook under hooks: in config.yaml (or a Python plugin) that
                forwards tool_name, args, status and duration_ms to your log store; the docs list logging and
                audit trails as its use case."
            url: https://hermes-agent.nousresearch.com/docs/user-guide/features/hooks
          - title: Keep the network and peer logs
            body:
              - ~/.hermes/proxy/iron-proxy.log records every CONNECT, secret swap and allowlist denial with
                the source sandbox, and every A2A exchange appends to ~/.hermes/a2a_audit.jsonl; rotate both
                with logrotate.
            url: https://hermes-agent.nousresearch.com/docs/user-guide/egress/iron-proxy
        evidence: []
        note: >-
          Capability scope changed: reassess this function. Retained configuration and evidence describe the
          former capability, not verified coverage of every replacement.


          [capabilityAuditLogging] All records are plain files owned by the same OS user the agent runs as —
