      - mitigation: AML.M0004
        coverage: unknown
        mechanism: >-
          agent.max_turns and agent.run_budget_seconds cap a turn; tool_loop_guardrails hard stops and
          loop_caps block runaway loops; delegation.max_iterations, max_concurrent_children and
          max_spawn_depth bound subagents; loops.max_ticks, cron.max_parallel_jobs and A2A_RATE_LIMIT bound
          unattended surfaces
        steps:
          - title: Cap iterations and wall-clock per turn
            body:
              - Set agent.max_turns to a positive integer (unlimited by default) and agent.run_budget_seconds,
                or pass hermes chat --run-budget 850, so a single turn cannot run without bound.
            url: https://hermes-agent.nousresearch.com/docs/user-guide/configuration
          - title: Turn loop warnings into hard stops
            body:
              - "Set tool_loop_guardrails.hard_stop_enabled: true and lower loop_caps.max_web_searches and
                loop_caps.max_subagents; unattended gateway and cron sessions already hard-stop by default via
                non_interactive_hard_stop_enabled."
            url: https://hermes-agent.nousresearch.com/docs/user-guide/configuration
          - title: Bound delegation depth and fan-out
            body:
              - Set delegation.max_iterations (default 250), delegation.max_concurrent_children (default 10)
                and keep delegation.max_spawn_depth at 1 so children cannot spawn grandchildren.
            url: https://hermes-agent.nousresearch.com/docs/user-guide/features/delegation
          - title: Backstop timers and peers
            body:
              - loops.max_ticks (default 100) pauses a /loop; cron.max_parallel_jobs limits cron concurrency;
                A2A_RATE_LIMIT (60/min per identity) and A2A_MAX_PINGPONG_TURNS stop two agents ping-ponging.
            url: https://hermes-agent.nousresearch.com/docs/user-guide/features/loops
