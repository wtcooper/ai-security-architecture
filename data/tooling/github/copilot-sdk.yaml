# GitHub Copilot SDK — one entity per product × reference architecture. Facts are dated (asOf)
# and cite the vendor's own documentation; re-verify before enforcing. Schema:
# data/tooling/README.md.
# 2026-09-25: re-verified toolCopilotSdk against the MITRE capability rules; every docs.github.com
# copilot-sdk page cited answered 200 at its own path (hreflang checked, no silent redirect).
# managedSettings, enableManagedSettings, sandboxConfig, connectionToken, mcpOAuthTokenStorage,
# enableSessionStore and skipEmbeddingRetrieval are documented only in the github/copilot-sdk
# repository (CHANGELOG, nodejs/README.md, TSDoc in nodejs/src), not on docs.github.com; the backend
# guide still says there is no SDK–CLI auth while the Node.js README documents connectionToken.
vendor: github
family: GitHub Copilot SDK
tools:
  - id: toolCopilotSdk
    name: GitHub Copilot SDK
    surfaceClasses:
      - sdkFramework
    variants:
      - name: Copilot SDK (Node.js, Python, Go, .NET, Rust, Java; GA 2026-06-02)
        class: sdkFramework
        url: https://github.blog/changelog/2026-06-02-copilot-sdk-is-now-generally-available/
      - name: >-
          Headless Copilot CLI server (copilot --headless) for backend services and multi-tenant deployments
        class: sdkFramework
        url: https://docs.github.com/en/copilot/how-tos/copilot-sdk/setup/backend-services
      - name: Cloud sessions (work runs on GitHub-hosted compute, published to github.com/copilot/tasks)
        class: sdkFramework
        url: https://docs.github.com/en/copilot/how-tos/copilot-sdk/features/cloud-sessions
    architecture: archAgentWorkflow
    status: ga
    asOf: "2026-09"
    summary:
      - "The Copilot SDK embeds the agent runtime behind Copilot CLI in a customer-hosted application: the SDK
        talks JSON-RPC to a Copilot CLI process (bundled, local, or a persistent --headless server) that
        plans, calls tools, edits files and streams turns. The customer owns request routing, user
        authentication, session ownership, tool registration, secrets and scaling; GitHub supplies the model
        access and the permission model the CLI already enforces."
      - "Inference goes to the Copilot API using a GitHub OAuth token, a fine-grained PAT, a server-to-server
        installation token, or — under BYOK — straight to OpenAI, Azure, Anthropic or a local
        OpenAI-compatible endpoint, bypassing GitHub entirely. Session state lives on the host under
        COPILOT_HOME/session-state/{sessionId} (or an application-provided sessionFs); cloud sessions run on
        GitHub compute and appear in the agents panel."
      - "The controls are code: onPermissionRequest (requests are not approved without it), onPreToolUse allow
        / deny / ask / modify, mode \"empty\" with an explicit availableTools list, per-session gitHubToken or a
        rotating gitHubTokenProvider, sessionLimits, and an OpenTelemetry TelemetryConfig with W3C trace
        propagation. The SDK's own enterprise-permissions layer — enableManagedSettings (v1.0.7: the runtime
        self-fetches the enterprise's managed policy with the session's token) and a host-injected
        managedSettings option (v1.0.13: deny / ask / allow rules, re-supplied on every resume) — composes
        with device-managed (MDM) policy on the runtime host, but the enterprise managed-settings client
        matrix does not list the SDK, so server-managed policy reaches an SDK session only when the
        application opts in."
    facts:
      - label: Plans
        value: >-
          Any Copilot subscriber including Free; non-Copilot users via BYOK. Sessions bill AI credits to the
          token's owner; usage is exposed as assistant.usage and session.usage.getMetrics (nano-AI units).
        url: https://github.blog/changelog/2026-06-02-copilot-sdk-is-now-generally-available/
      - label: Inference & routing
        value: >-
          Copilot API with the session's GitHub token, or BYOK ProviderConfig (type openai / azure /
          anthropic, baseUrl, apiKey, wireApi) with prompts sent directly to the provider; Azure managed
          identity can supply bearer tokens instead of keys.
        url: https://docs.github.com/en/copilot/how-tos/copilot-sdk/auth/byok
      - label: Data leaving the host
        value: >-
          Prompts, tool results and file context to the Copilot API or the BYOK provider; OTLP traces only
          where configured; cloud sessions publish to github.com/copilot/tasks/{sessionId}; the CLI's
          telemetry stays on unless COPILOT_OFFLINE=true.
        url: https://docs.github.com/en/copilot/responsible-use/agents
      - label: Data retention / training
        value: >-
          Session state persists on the host filesystem (or a shared volume) until deleted — there is no idle
          timeout by default (set sessionIdleTimeoutSeconds or --session-idle-timeout); GitHub-hosted models
          follow the Copilot ZDR terms (Claude Fable 5 / 5.1 retain by default); BYOK providers apply their
          own retention.
        url: https://docs.github.com/en/copilot/reference/ai-models/model-hosting
      - label: Docs index
        value: >-
          Copilot SDK how-tos: setup, authentication, features, hooks, integrations, observability,
          troubleshooting.
        url: https://docs.github.com/en/copilot/how-tos/copilot-sdk
    items:
      - title: Multi-user server mode — the isolation checklist
        body:
          - "Set gitHubToken per session so content exclusion, model routing and quota follow the requesting
            user; use mode: \"empty\" and an explicit availableTools list (custom:*, mcp:tool) so ambient OS
            tools are off; encode tenant and user in session IDs and check ownership before resume or delete;
            set sessionIdleTimeoutSeconds; use baseDirectory and sessionFs to isolate runtime state. The docs
            list the pitfalls plainly: default mode copilot-cli exposes the host filesystem, one shared GitHub
            token loses per-user authorisation, client-provided session IDs cannot be trusted."
          - "Deployment patterns: an isolated CLI per user (strongest; SOC 2 / HIPAA), a shared CLI with
            per-session isolation, or shared collaborative sessions that need application locking. The backend
            guide says there is no built-in auth between SDK and CLI; the Node.js README documents a
            connectionToken shared secret for the runtime link (generated automatically when the SDK spawns a
            TCP runtime) — set one and still bind --headless to loopback or a private network."
        links:
          - title: Multi-tenancy and server deployments
            url: https://docs.github.com/en/copilot/how-tos/copilot-sdk/setup/multi-tenancy
          - title: Scaling and multi-tenancy
            url: https://docs.github.com/en/copilot/how-tos/copilot-sdk/setup/scaling
          - title: Backend services setup
            url: https://docs.github.com/en/copilot/how-tos/copilot-sdk/setup/backend-services
          - title: Copilot SDK for Node.js — README (connection options)
            url: https://github.com/github/copilot-sdk/blob/main/nodejs/README.md
      - title: Hooks as the policy layer
        body:
          - "onPermissionRequest decides every file write, shell command and URL fetch; without it nothing is
            approved (the compatibility guide calls this deny-by-default, the Node.js README says requests stay
            pending until resolved). onPreToolUse returns permissionDecision allow / deny / ask with
            modifiedArgs, additionalContext and suppressOutput; onPostToolUse can redact secrets and audit;
            onUserPromptSubmitted / onUserPromptTransformed filter or replace prompts; onSessionStart / End
            and onErrorOccurred carry sessionId for correlation. All run inline in the turn."
        links:
          - title: Working with hooks
            url: https://docs.github.com/en/copilot/how-tos/copilot-sdk/features/hooks
          - title: Pre-tool-use hook
            url: https://docs.github.com/en/copilot/how-tos/copilot-sdk/hooks/pre-tool-use
    riskNotes:
      - risk: riskAgenticDelegationConfusedDeputy
        note: >-
          The documented anti-pattern is one service token for every user; with it, content exclusion and
          quotas collapse to the service account's view. Per-session gitHubToken and backend ownership checks
          on session IDs are the vendor's answer.
      - risk: riskOrchestratorRouteHijacking
        note: >-
          The SDK–CLI JSON-RPC link is authenticated only by an optional connectionToken shared secret; a
          headless CLI bound to 0.0.0.0 without one is an open agent runtime with whatever token it was started
          with, and anyone holding the secret can drive every session on it.
      - risk: riskEconomicDenialOfWallet
        note: >-
          The only built-in ceiling is a soft per-session AI-credit cap (sessionLimits.maxAiCredits); there is
          no rate limiting or session cap, so the application must enforce limits and evict idle sessions.
      - risk: riskToolSourceProvenance
        note: >-
          MCP servers and custom tools are registered by the application; nothing verifies them, and the
          default tool mode inherits the CLI's host tools.
    controls:
      - mitigation: AML.M0031
        coverage: partial
        mechanism: >-
          Per-session state under COPILOT_HOME/session-state/{sessionId} or a per-session sessionFs provider;
          baseDirectory per runtime; memory { enabled } and enableSessionStore (both off by default in mode
          "empty"); "memory" permission requests through onPermissionRequest; sessionIdleTimeoutSeconds and
          deleteSession
        steps:
          - title: Namespace state per tenant and run
            body:
              - >-
                Encode tenant and user in sessionId, check stored ownership before resumeSession or deleteSession,
                give each runtime its own baseDirectory (COPILOT_HOME) and route state through a per-session
                sessionFs provider when it must live in your own store.
            url: https://docs.github.com/en/copilot/how-tos/copilot-sdk/setup/multi-tenancy
          - title: Keep shared memory out of multi-tenant sessions
            body:
              - >-
                Start the client in mode "empty", or pass memory: { enabled: false } and enableSessionStore: false
                on createSession and resumeSession, so neither Copilot Memory nor the cross-session store is read
                or written.
            url: https://github.com/github/copilot-sdk/blob/main/nodejs/README.md
          - title: Gate every memory write
            body:
              - >-
                In onPermissionRequest, inspect requests of kind "memory" (subject, fact, citations) and reject any
                fact your own validator does not accept.
            url: https://docs.github.com/en/copilot/how-tos/copilot-sdk/features/streaming-events
          - title: Expire and delete state
            body:
              - >-
                Set sessionIdleTimeoutSeconds (no default; sessions with running commands or background agents are
                never idle-cleaned) and call deleteSession when a workflow ends to remove its history, planning
                state and artifacts from disk.
            url: https://docs.github.com/en/copilot/how-tos/copilot-sdk/features/session-persistence
        note: >-
          Partial by the rule for this drawing, as on the Claude Agent SDK: state is namespaced per session by
          configuration and can be expired and deleted, but the only write control on memory is the host's own
          permission handler (an attach point), and nothing validates on read what a step wrote — custom agents
          and fleet-mode workers share the parent session's state. Enabled, Copilot Memory is
          repository-scoped and shared by every user with access to that repository; GitHub checks repository
          facts against their citations before use and deletes entries unused for 28 days, which is vendor-side
          hygiene, not tenant separation. Enforcing actor: the runtime for storage paths, the application for
          ownership checks and the memory decision.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityMemoryProtection
          reviewRequired: false
          original:
            - capability: capabilityMemoryProtection
              coverage: partial
              mechanism: >-
                Per-session runtime state under COPILOT_HOME/session-state/{sessionId}, sessionFs to route
                state into application storage, sessionIdleTimeoutSeconds, application-enforced ownership
                checks
              steps:
                - title: Isolate and expire session state
                  body:
                    - Encode tenant and user in session IDs, verify ownership before resume or delete, set
                      sessionIdleTimeoutSeconds (15–30 minutes for chat) and use baseDirectory / sessionFs to
                      keep state per process or in your own store.
                  url: https://docs.github.com/en/copilot/how-tos/copilot-sdk/setup/multi-tenancy
              note: >-
                Isolation and retention are the application's: sessionFs decides where state lives, ownership
                checks decide who reads it, and idle timeouts bound retention. Nothing validates or restores
                memory.
              verified: 2026-09-10
      - mitigation: AML.M0008
        coverage: external
        mechanism: >-
          No evaluation harness or release gate in the SDK; sessions are scriptable and emit session events and
          OpenTelemetry traces an evaluation platform can score
        evidence:
          - title: Copilot SDK how-to index, reviewed 2026-09-25 (no evaluation feature)
            url: https://docs.github.com/en/copilot/how-tos/copilot-sdk
          - title: OpenTelemetry instrumentation for Copilot SDK, reviewed 2026-09-25
            url: https://docs.github.com/en/copilot/how-tos/copilot-sdk/observability/opentelemetry
        note: >-
          Rated external by the rule for this drawing: the SDK ships no harness that can gate a deploy, so an
          AI evaluation / red-teaming platform run in the deployer's CI supplies it. Integration point: drive
          createSession and send from the pipeline for every prompt, custom-agent, tool or model change and score
          the session event stream and OTLP traces before release. GitHub's own model evaluations are supplier
          evidence, not a gate the application controls.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityModelEvals
          reviewRequired: false
          original:
            - capability: capabilityModelEvals
              coverage: none
              mechanism: No evaluation harness in the SDK; GitHub evaluates hosted models vendor-side
              note: >-
                Rated none on the same rule as Copilot cloud's supplier evidence: GitHub's internal benchmarks
                and red teaming are TPRM evidence, not a harness the application can run. Build evals in your
                own CI against the SDK.
              evidence:
                - title: Vendor docs index, reviewed; no setting for this control (2026-09-10)
                  url: https://docs.github.com/en/copilot/how-tos/copilot-sdk
              verified: 2026-09-10
      - mitigation: cap-agent-tracing
        coverage: native
        mechanism: >-
          Client TelemetryConfig (otlpEndpoint, otlpProtocol, exporterType otlp-http or file, filePath,
          sourceName, captureContent) exporting the runtime's traces, metrics and events; W3C traceparent into
          tool handlers; subagent.* lifecycle events with toolCallId and agentId; permission.requested /
          completed and assistant.usage session events
        steps:
          - title: Export the runtime's traces
            body:
              - >-
                Create the client with telemetry: { otlpEndpoint, otlpProtocol, exporterType, sourceName,
                captureContent } (or exporterType "file" with filePath) so model calls and tool executions reach
                your collector; enable captureContent only where that collector is cleared for prompts and tool
                arguments.
            url: https://docs.github.com/en/copilot/how-tos/copilot-sdk/observability/opentelemetry
          - title: Reconstruct the delegation tree
            body:
              - >-
                Persist subagent.selected / started / completed / failed events (toolCallId, agentName) and the
                envelope agentId on sub-agent events, keyed by sessionId.
            url: https://docs.github.com/en/copilot/how-tos/copilot-sdk/features/custom-agents
          - title: Record decisions and usage
            body:
              - >-
                Store permission.requested and permission.completed (requestId, kind, result.kind) and
                assistant.usage events next to the traces.
            url: https://docs.github.com/en/copilot/how-tos/copilot-sdk/features/streaming-events
        note: >-
          Native by the rule for this drawing: the runtime traces model calls and tool executions and exports
          them over OTLP or to a file the deployer controls, sub-agent handoffs are correlated by toolCallId and
          agentId, and W3C trace context links the application's own tool spans. Boundary: prompts, tool
          arguments and results are captured only with captureContent (off by default); permission decisions and
          sub-agent lifecycle arrive as session events the host must persist, not as documented spans; with the
          in-process transport the telemetry option is rejected and must be set on the host process; cloud
          sessions run on GitHub compute. Emission is not tamper resistance or detection — the collector's
          retention and the SIEM supply those.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAgentObservability
            - capabilityAuditLogging
            - capabilityAiDetectionResponse
          reviewRequired: false
          original:
            - capability: capabilityAgentObservability
              coverage: native
              mechanism: >-
                TelemetryConfig (OTLP endpoint, protocol, exporter type, capture content, source name) on the
                client; W3C traceparent / tracestate propagation between SDK, CLI and tool handlers; usage
                events
              steps:
                - title: Configure OTLP export and trace propagation
                  body:
                    - "Create the client with telemetry: { otlpEndpoint, otlpProtocol, exporterType, captureContent } — Python,
                      Go and .NET inject trace context automatically, Node.js needs onGetTraceContext; tool
                      handlers receive traceparent for child spans."
                  url: https://docs.github.com/en/copilot/how-tos/copilot-sdk/observability/opentelemetry
                - title: Capture usage per turn
                  body:
                    - Subscribe to assistant.usage and session.usage_info events and call session.usage.getMetrics for per-model
                      totals.
                  url: https://docs.github.com/en/copilot/how-tos/copilot-sdk/features/usage-and-billing
              note: >-
                Traces cover the SDK, CLI and tool handlers with W3C correlation; capture content is off by
                default. Emission is not detection or an audit record.
              verified: 2026-09-10
            - capability: capabilityAuditLogging
              coverage: partial
              mechanism: Hooks for audit logging (onPreToolUse / onPostToolUse with sessionId), OTLP traces, cloud sessions
                visible on github.com; no GitHub audit-log events for local SDK sessions
              steps:
                - title: Log decisions from hooks
                  body:
                    - Record every permissionDecision and tool result in onPreToolUse / onPostToolUse, keyed
                      by the invocation's sessionId, alongside the OTLP export.
                  url: https://docs.github.com/en/copilot/how-tos/copilot-sdk/features/hooks
              verified: 2026-09-10
            - capability: capabilityAiDetectionResponse
              coverage: external
              mechanism: OTLP traces and hook logs feed a SIEM; no vendor detections for SDK sessions
              note: "The traces and hook logs are the feed; detection logic and response actions live in the SIEM. Required
                fields: session id, tool name, permission decision, integration id."
              evidence:
                - title: Vendor docs index, reviewed for the integration point (2026-09-10)
                  url: https://docs.github.com/en/copilot/how-tos/copilot-sdk
              verified: 2026-09-10
      - mitigation: D3-APA
        coverage: external
        mechanism: >-
          No inbound authorisation policy: the application authenticates users, owns session IDs and checks
          ownership; a per-session gitHubToken / gitHubTokenProvider binds each session to the requesting user's
          GitHub grant; an optional connectionToken shared secret guards the SDK–runtime link
        evidence:
          - title: Multi-tenancy and server deployments ("the application owns request routing and authorization")
            url: https://docs.github.com/en/copilot/how-tos/copilot-sdk/setup/multi-tenancy
          - title: Backend services setup (loopback default; "No built-in auth between SDK and CLI")
            url: https://docs.github.com/en/copilot/how-tos/copilot-sdk/setup/backend-services
          - title: Copilot SDK for Node.js README (RuntimeConnection connectionToken)
            url: https://github.com/github/copilot-sdk/blob/main/nodejs/README.md
        note: >-
          Rated external by the rule for this drawing, as the Claude Agent SDK leaves user authentication to the
          deployer's gateway: nothing in the SDK decides who may start, resume, steer or delete a session — the
          application's IdP and API gateway do. Integration points: pass the authenticated user's token per
          session (gitHubToken, or a rotating gitHubTokenProvider) so the run carries that user's GitHub grant
          for content exclusion, model policy and quota; check stored ownership before resumeSession and
          deleteSession; set a connectionToken on the runtime link. That token is one shared secret — whoever
          holds it can drive every session on the runtime — and the backend guide still says the link has no
          auth. Cloud sessions are the exception: GitHub's cloud-agent entitlement and organisation policy can
          refuse creation (policy_blocked).
        verified: "2026-09-25"
        migration:
          from:
            - capabilityIga
            - capabilityDataAccessGovernance
          reviewRequired: false
          original:
            - capability: capabilityIga
              coverage: partial
              mechanism: >-
                GitHub OAuth per user with gitHubToken set per session; service-to-server installation tokens
                for services; application-level authentication and session ownership
              steps:
                - title: Authenticate users, not the runtime
                  body:
                    - Pass each requesting user's GitHub token on the session (gitHubToken) so quota, content
                      exclusion and model policy resolve to that user; reserve service tokens for internal
                      tools.
                  url: https://docs.github.com/en/copilot/how-tos/copilot-sdk/setup/multi-tenancy
                - title: Choose the auth path per deployment
                  body:
                    - GitHub OAuth for user-facing apps, short-lived installation access tokens for
                      server-to-server, BYOK where GitHub auth is not wanted.
                  url: https://docs.github.com/en/copilot/how-tos/copilot-sdk/auth
              note: >-
                Rated partial on the same rule as the Claude Agent SDK and Codex SDK: OAuth per user and
                installation tokens authenticate the runtime to GitHub; who may use the deployed application,
                with what roles, and how they are provisioned and removed is the application's own identity
                layer, which the SDK does not provide.
              verified: 2026-09-10
            - capability: capabilityDataAccessGovernance
              coverage: partial
              mechanism: >-
                Per-session gitHubToken makes GitHub retrieval and content exclusion run as the requesting
                user; other data sources are the application's tools
              steps:
                - title: Never retrieve as a shared principal
                  body:
                    - Set gitHubToken per session; for custom tools, pass the user's identity into the tool
                      handler rather than a service credential.
                  url: https://docs.github.com/en/copilot/how-tos/copilot-sdk/setup/multi-tenancy
              note: >-
                Delegated for GitHub sources when the application passes a per-user token; a shared token
                makes retrieval service-owned. Every other source is the application's tool, enforcing
                whatever it enforces.
              verified: 2026-09-10
      - mitigation: D3-AA
        coverage: partial
        mechanism: >-
          One GitHub identity per session (gitHubToken / gitHubTokenProvider) shared by every agent in it;
          per-agent mcpServers with their own headers or env; agentId on sub-agent events and typed message
          sources (user, system, agent-<id>) as labels; clientInfo and GITHUB_COPILOT_INTEGRATION_ID attribute
          the application
        steps:
          - title: Give each custom agent its own tool credentials
            body:
              - >-
                Configure mcpServers on each customAgents entry with that agent's own credential in headers
                (remote) or env (local), and list only its tools, so its MCP calls authenticate as a distinct
                principal.
            url: https://docs.github.com/en/copilot/how-tos/copilot-sdk/features/custom-agents
          - title: Attribute the application
            body:
              - >-
                Set clientInfo (applicationName, applicationVersion, integration fields) on the client and
                GITHUB_COPILOT_INTEGRATION_ID on the runtime process so runtime telemetry and Mission Control
                requests name your integration.
            url: https://docs.github.com/en/copilot/how-tos/copilot-sdk/features/client-info
        note: >-
          Partial by the rule for this drawing: credentials can be configured per custom agent for the MCP
          servers it uses, but every agent and sub-agent in a session shares the session's GitHub identity for
          model calls and GitHub access, and none is authenticated or revocable as its own principal. agentId and
          the agent-<id> message source are correlation labels the application derives, not authentication. The
          runtime's own credential — a GitHub App installation token or a user's OAuth token — authenticates the
          deployment, not an agent.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityNhiManagement
          reviewRequired: false
          original:
            - capability: capabilityNhiManagement
              coverage: partial
              mechanism: >-
                Server-to-server installation access tokens (short-lived) and GITHUB_COPILOT_INTEGRATION_ID
                stamping requests with the product identity
              note: >-
                The agent's identity is the token's identity; there is no agent-specific credential or
                registry. Rotate installation tokens and stamp the integration ID for attribution.
              steps:
                - title: Stamp the integration identity
                  body:
                    - Set GITHUB_COPILOT_INTEGRATION_ID on the runtime so requests are attributed and routed
                      by product.
                  url: https://docs.github.com/en/copilot/how-tos/copilot-sdk/setup/multi-tenancy
              verified: 2026-09-10
      - mitigation: D3-CH
        coverage: partial
        mechanism: >-
          gitHubTokenProvider (rotating session-scoped GitHub tokens with expiresIn, no fallback to ambient
          auth); BYOK bearerTokenProvider (e.g. Azure managed identity); GitHub App installation tokens (one
          hour); MCP OAuth tokens held in memory by default (mcpOAuthTokenStorage); storage in the deployer's
          secret manager
        steps:
          - title: Broker GitHub credentials per session
            body:
              - >-
                Set gitHubTokenProvider on createSession instead of a static gitHubToken and return { kind:
                "token", accessToken, expiresIn } from your broker; the runtime calls it for initial and refresh
                acquisition and rejects the operation rather than falling back to ambient authentication.
            url: https://docs.github.com/en/copilot/how-tos/copilot-sdk/auth/authenticate
          - title: Replace static provider keys
            body:
              - >-
                For BYOK set bearerTokenProvider so the runtime asks your identity library for a bearer token
                before outbound provider requests instead of holding an apiKey.
            url: https://docs.github.com/en/copilot/how-tos/copilot-sdk/setup/azure-managed-identity
          - title: Use short-lived app tokens for services
            body:
              - >-
                Mint GitHub App installation access tokens with the Copilot Requests permission (they expire after
                one hour) and restart or reconnect the runtime before expiry instead of a long-lived
                COPILOT_GITHUB_TOKEN.
            url: https://docs.github.com/en/copilot/how-tos/copilot-sdk/auth/server-to-server-tokens
          - title: Keep secrets in a manager
            body:
              - >-
                The scaling guide's production checklist names Vault or Kubernetes Secrets for credentials and
                persistent volumes for session state.
            url: https://docs.github.com/en/copilot/how-tos/copilot-sdk/setup/scaling
        note: >-
          Partial by the rule for this drawing: short-lived credentials are brokered only through callbacks the
          deployer implements (helper hooks), per session rather than per step, and a secret manager or workload
          identity supplies them. The runtime process holds whatever it receives and every tool in the session
          acts with it; a static gitHubToken, apiKey or COPILOT_GITHUB_TOKEN on a headless server is long-lived.
          MCP OAuth tokens are discarded at session end unless mcpOAuthTokenStorage is "persistent" (OS
          keychain, shared across sessions). The repository README's FAQ still says BYOK is key-based only; the
          BYOK and Azure managed identity guides document bearerTokenProvider — prefer the guides.
        verified: "2026-09-25"
        migration:
          from:
            - capabilitySecretsManagement
          reviewRequired: false
          original:
            - capability: capabilitySecretsManagement
              coverage: partial
              mechanism: >-
                Provider keys via ProviderConfig.apiKey or Azure managed-identity bearer callbacks; platform
                secret managers recommended; no vault integration in the SDK
              steps:
                - title: Prefer managed identity over static keys
                  body:
                    - Use the Azure managed identity setup so the SDK obtains bearer tokens through callbacks
