# Initial evidence review 2026-10-03. Unassessed reference controls remain unknown.
# Enterprise personal-dot mode; specialist organizational dots remain focused pilots.
# 2026-10-30: added settings: and moved the record's sources to learn.chatgpt.com/docs/dots and
# enterprise/dots-admin-guide (200; help.openai.com 403). Corrections: dots access is now under Admin Console >
# Permissions > Workspace default > Workspace capabilities (Use dots (Beta)), with Allow local computer access,
# Add dots to Slack and Microsoft Teams and Use custom rules for dots beside it; the cloud capabilities are named Use
# a browser, Allow network access and Allow computer use (shared with Work Cloud), plus Use password manager; role
# grants add up, so Off in one role does not revoke access another grants; Pause stops only the main task.
# 2026-10-30 (controls): added D3-MFA, D3-CTS, AML.M0036, cap-input-guardrails, cap-agent-tool-registry, cap-ai-vendor-assessment
# and cap-agent-tracing rows from learn.chatgpt.com dots, dots/controls, dots/computers-and-apps, dots/channels, enterprise/dots-admin-guide,
# work-admin-faq, cloud-local-access and chatgpt-work-cloud-security (.md, 200) and trust.openai.com (200); help.openai.com and
# openai.com/index/introducing-dots refused automated reads (403). Added the sso, perUserUsageLimits and dotsUsageAnalytics settings.
vendor: openai
family: Dots
tools:
  - id: toolOpenaiDots
    name: OpenAI Dots
    surfaceClasses:
      - managedRuntime
      - chatIntegration
    variants:
      - name: Personal dot in ChatGPT
        class: managedRuntime
        url: https://learn.chatgpt.com/docs/dots
      - name: Personal dot in Slack and Microsoft Teams
        class: chatIntegration
        url: https://learn.chatgpt.com/docs/dots/channels
        note: Owner-directed work with channel-visible output; Microsoft Teams is an invite-only alpha.
    architecture: archPersistentManagedAgents
    status: beta
    asOf: "2026-10"
    summary:
      - >-
        A continuing personal agent with a cloud computer, connected apps and cross-task context.
        It can delegate Codex or Work tasks. Optional local access introduces another execution
        boundary; a desktop interface alone does not make the loop customer-operated. Local execution on a
        connected computer runs through the ChatGPT desktop app, whose local reach is the endpoint record
        toolChatgptDesktop.
      - >-
        This initial record covers documented personal-dot controls. Specialist dots with dedicated
        organizational identities are focused enterprise pilots; planned Agent 365 integration is
        not credited as available enforcement.
    facts:
      - label: Plans
        value: >-
          Gradual rollout: Pro 100, Pro 200 and Pro 500 (over 18, outside the EEA, UK and Switzerland);
          Business Premium and Enterprise worldwide. On Enterprise dots are off by default and a workspace
          administrator must enable them.
        url: https://learn.chatgpt.com/docs/dots
      - label: Inference & routing
        value: >-
          OpenAI operates the service. Enterprise model controls and defaults do not apply to the main dot;
          tasks it delegates to Work or Codex follow those products' controls.
        url: https://learn.chatgpt.com/docs/enterprise/dots-admin-guide
      - label: Data leaving the device
        value: >-
          Connected information and task context reach the hosted service. Connecting a local
          computer additionally permits local files and commands; local browser access is a separate route.
        url: https://learn.chatgpt.com/docs/dots/computers-and-apps
      - label: Retention & training
        value: >-
          Dot context persists until deletion; separately stored artifacts have separate lifetimes.
          Business workspace data is not used for training by default; personal-plan settings differ.
        url: https://learn.chatgpt.com/docs/enterprise/dots-admin-guide
      - label: Docs index
        value: Dots member guide (learn.chatgpt.com/docs/dots) and workspace admin guide.
        url: https://learn.chatgpt.com/docs/dots
    items:
      - title: Keep persistent and delegated authority distinct
        body:
          - Review connected accounts, browser sessions and child tasks separately. A dot's display
            identity does not establish the effective principal at each destination.
        links:
          - title: Dots launch and specialist pilot scope
            url: https://openai.com/index/introducing-dots/
      - title: Treat automatic review as a bounded safeguard
        body:
          - Auto-review checks selected actions. Proactive research uses restricted read-only tools;
            subsequent actions follow normal action rules. Neither establishes complete input screening.
        links:
          - title: How action review works
            url: https://learn.chatgpt.com/docs/dots/controls
    riskNotes:
      - risk: riskPromptInjection
        note: Untrusted pages, connected content and retained context can influence later tasks.
      - risk: riskSensitiveDataDisclosure
        note: Browser sessions, connected grants and retained context need separate access and deletion decisions.
      - risk: riskAgenticDelegationConfusedDeputy
        note: Check the initiating owner, downstream credential and audience for each delegated or channel-visible effect.
    controls:
      - mitigation: D3-APA
        coverage: native
        mechanism: Enterprise role permissions govern access to dots and optional capabilities.
        steps:
          - title: Limit workspace access
            body:
              - In Admin Console > Permissions > Workspace default > Workspace capabilities keep Use dots
                (Beta) off and grant it through a custom role; grants add up, so check every role assigned
                directly or through groups.
            url: https://learn.chatgpt.com/docs/enterprise/dots-admin-guide
        note: Feature access is separate from downstream app authorization and website sessions.
        verified: "2026-10-30"
      - mitigation: AML.M0028
        coverage: partial
        mechanism: Workspace capability switches and existing plugin/action permissions constrain supported routes.
        steps:
          - title: Enable only required capabilities
            body:
              - Review Use a browser, Allow network access and Allow computer use (Let agents use cloud
                computers), Use password manager, Allow local computer access under Use dots, and each app's
                access and allowed actions in Plugins separately. Apply least privilege in each destination
                service too.
            url: https://learn.chatgpt.com/docs/enterprise/dots-admin-guide
        note: Coarse capability admission does not prove argument-level authorization for every action.
        verified: "2026-10-30"
      - mitigation: AML.M0029
        coverage: partial
        mechanism: Supported actions expose confirmation or handoff rules.
        steps:
          - title: Require review for consequential work
            body:
              - In Settings > Personalization > Custom rules, select Ask before taking action or Hand off
                to you for the relevant action, and avoid Take action without asking for anything consequential.
                Rules stop applying if the workspace turns off Use custom rules for dots.
            url: https://learn.chatgpt.com/docs/dots/controls
        note: Rule interpretation and automatic review are not deterministic human gates for every effect.
        verified: "2026-10-30"
      - mitigation: cap-agent-egress-control
        coverage: unknown
        mechanism: Browser enablement is documented; per-destination hosted-browser egress enforcement is not established.
        evidence:
          - title: Separate cloud browser and network controls
            url: https://learn.chatgpt.com/docs/enterprise/dots-admin-guide
        note: >-
          Allow network access governs shell/code internet access, outside this reference's browser
          route. Use a browser enables or disables browsing; it does not establish a destination
          allowlist. Verify the browser route before crediting this pin.
        verified: "2026-10-30"
      - mitigation: AML.M0031
        coverage: partial
        mechanism: ChatGPT memory-sharing settings and whole-dot deletion provide limited state control.
        evidence:
          - title: Dots memory and deletion boundaries
            url: https://help.openai.com/en/articles/20001529-dots-privacy-security-and-safety-faqs
          - title: Memory sharing and deletion (admin guide FAQ, 2026-10-30)
            url: https://learn.chatgpt.com/docs/enterprise/dots-admin-guide
        note: >-
          Disabling sharing does not erase received context. Individual dot memories cannot currently
          be inspected or edited; deletion leaves separately retained artifacts and ChatGPT memory.
          Fine-grained integrity and recovery controls are not established.
        verified: "2026-10-03"
      - mitigation: D3-CH
        coverage: partial
        mechanism: Supported secure sign-in sends credentials to the browser without exposing them to the model.
        evidence:
          - title: Private sign-in form and saved logins
            url: https://learn.chatgpt.com/docs/dots/computers-and-apps
        note: The resulting browser session still carries authority; ordinary chat or plugin secrets are outside this guarantee.
        verified: "2026-10-30"
      - mitigation: cap-agent-kill-switch
        coverage: partial
        mechanism: The profile Pause control stops dot work until resumed.
        steps:
          - title: Pause ongoing work
            body:
              - Select Pause, which stops the dot's current main task only; stop delegated tasks in Activity,
                disable or delete recurring tasks in Scheduled, and revoke local or downstream access when
                required.
            url: https://learn.chatgpt.com/docs/dots/controls
        note: Stop latency and atomic cancellation of independently running delegated tasks are not documented here.
        verified: "2026-10-30"
      - mitigation: D3-MFA
        coverage: partial
        mechanism: >-
          Enterprise and Business Premium members reach their dot through their ChatGPT workspace account, so the
          workspace's SSO (Global Admin Console, after domain verification) and the IdP's MFA policy apply;
          ChatGPT has no workspace-wide MFA switch
        steps:
          - title: Require SSO and enforce MFA in the IdP
            body:
              - >-
                Manage SSO in the Global Admin Console for every verified domain and require MFA on the ChatGPT
                app in your IdP; ChatGPT itself offers only account-level MFA a user turns on.
            url: https://learn.chatgpt.com/docs/enterprise/work-admin-faq
        note: >-
          Partial by the rule applied to every vendor (as on toolCodex): sign-in to ChatGPT, where a dot is
          created, directed and approved, goes through the IdP's MFA, but MFA is configured in the IdP, not the
          product. Not covered: channels that authenticate the owner by another identity (Slack direct messages
          and mentions rest on Slack's sign-in; texting, a Pro beta in the U.S., on a verified phone number);
          Pro accounts, which have no organisation layer; and the websites the dot's cloud browser signs in to,
          whose verification codes the member enters through the private sign-in form.
        verified: "2026-10-30"
      - mitigation: D3-CTS
        coverage: unknown
        mechanism: >-
          Website credentials go through the private sign-in form to the remote browser outside the conversation;
          Save to Passwords offers a matching saved login only after confirmation; connected apps use the owner's
          ChatGPT plugin connections
        evidence:
          - title: Sign in to a website, saving and reusing a login
            url: https://learn.chatgpt.com/docs/dots/computers-and-apps
          - title: Manage dots permissions and capabilities (whose account a dot uses)
            url: https://learn.chatgpt.com/docs/enterprise/dots-admin-guide
          - title: Dots privacy, security and safety FAQ (Help Center, 403 to automated reads on 2026-10-30)
            url: https://help.openai.com/en/articles/20001529-dots-privacy-security-and-safety-faqs
        note: >-
          Unknown, on the same finding as toolGrokBot: the pages that resolved keep credentials out of the model
          and require confirmation to reuse a saved login, which is credential hardening, but they do not say
          that a credential or session can reach only the site it belongs to, and the privacy and security FAQ
          refused automated reads. A signed-in website session stays usable by the dot until it expires or the
          member signs out. Until recipient binding is documented, keep client systems and administrator accounts
          out of the dot's browser and leave Use password manager off.
        verified: "2026-10-30"
      - mitigation: AML.M0036
        coverage: partial
        mechanism: >-
          Monthly per-user usage limits for Enterprise and Edu (workspace default, group defaults, individual
          overrides) bound the Work and Codex tasks a dot starts or manages; conversations with the dot itself
          do not count toward ChatGPT usage limits and draw on a plan allowance OpenAI sets
        steps:
          - title: Set per-user limits for the dots pilot
            body:
              - >-
                Set a monthly per-user usage limit as the workspace default with a group default for the pilot
                group, so the Work and Codex tasks a dot delegates stop at a known level.
            url: https://learn.chatgpt.com/docs/enterprise/work-admin-faq
        note: >-
          Partial on the resource-consumption rule: the organisation can bound the delegated Work and Codex tasks,
          which "count toward those products' usage limits as usual", but nothing it sets bounds the main dot:
          its own conversations do not count toward ChatGPT usage limits, the plan's allowance for deeper work is
          the vendor's, and no limit on background agents run in parallel, run time or task frequency is
          documented. Pause stops only the main task, so a runaway schedule is stopped in Scheduled. The
          per-user limit procedure itself is on the Help Center, which refused automated reads.
        verified: "2026-10-30"
      - mitigation: cap-input-guardrails
        coverage: none
        mechanism: >-
          Vendor-run safeguards against malicious instructions that can pause or stop work when monitoring
          detects a safety concern; proactive research uses read-only tools; automatic action review
        evidence:
          - title: Dots FAQ (built-in safeguards, proactive research)
            url: https://learn.chatgpt.com/docs/enterprise/dots-admin-guide
          - title: How action review works
            url: https://learn.chatgpt.com/docs/dots/controls
        note: >-
          None that anyone can set (the rule applied on toolClaudeDuet and toolMetaMuse): the safeguards are
          described in general terms with no setting, threshold, hook or event an administrator can use, and no
          inference hook or gateway attach point is documented for dots. Automatic review judges proposed
          actions, which is action policy, not input screening. What stands in is limiting what the dot reads
          (connected apps and their allowed actions, Use a browser) and keeping approval on consequential
          actions through custom rules.
        verified: "2026-10-30"
      - mitigation: cap-agent-tool-registry
        coverage: partial
        mechanism: >-
          Use dots access through the workspace default and custom roles; the Usage Analytics API reports dots
          use per user (client_id = DOTS); compliance records carry an agent object with the dot ID, name and
          type
        steps:
          - title: Report who runs a dot
            body:
              - >-
                Create an Admin key with enterprise.analytics.usage.read under Admin Console › Credentials ›
                Admin keys and pull /v1/analytics/workspaces/{workspace_id}/usage filtered on client_id DOTS.
            url: https://learn.chatgpt.com/docs/enterprise/dots-admin-guide
          - title: Limit who can have one
            body:
              - >-
                Keep Use dots off in the workspace default and grant it through a custom role, checking every
                role a member holds because grants add up.
            url: https://learn.chatgpt.com/docs/enterprise/dots-admin-guide
        note: >-
          Partial on the registry rule (as on toolGrokBot): the organisation decides who may have a dot and can
          derive an inventory from usage and compliance records, but no admin list of dots, their scheduled
          tasks, connected apps or Slack identities is documented, and there is no approval state for a dot or
          its recurring work. The tasks a dot delegates appear in Work and Codex reporting, not under the
          dot.
        verified: "2026-10-30"
      - mitigation: cap-ai-vendor-assessment
        coverage: external
        mechanism: >-
          The organisation's TPRM platform, consuming OpenAI's trust portal and the dots eligibility and data
          pages
        evidence:
          - title: OpenAI Trust Portal
            url: https://trust.openai.com/
          - title: Local computer access for Work Cloud and dots (dots residency and exclusions)
            url: https://learn.chatgpt.com/docs/enterprise/cloud-local-access
          - title: Manage dots permissions and capabilities (availability and data requirements)
            url: https://learn.chatgpt.com/docs/enterprise/dots-admin-guide
        note: >-
          External: the assessment is the organisation's TPRM process. Record that dots are an Enterprise beta
          without data or inference residency, unavailable on FedRAMP, EKM and UAE-residency workspaces, that
          Enterprise model controls do not apply to the main dot, and that the guide asks organisations needing residency, EKM or specific compliance
          coverage to confirm dots support with their account team. Compliance Logs Platform records are kept 30
          days at source (stated for Work Cloud).
        verified: "2026-10-30"
      - mitigation: cap-agent-tracing
        coverage: partial
        mechanism: >-
          Compliance Logs Platform records for dots (client_id = DOTS): user prompts and responses, supported
          tool-call events, and connected-app MCP calls and results, pulled with a CODEX_LOG admin key; the
          member's Activity view of tasks
        steps:
          - title: Pull dots compliance records into the SIEM
            body:
              - >-
                Create an Admin key with CODEX_LOG access under Admin Console › Credentials › Admin keys, list and
                download the compliance JSONL files through the Admin API and keep records with client_id DOTS.
            url: https://learn.chatgpt.com/docs/enterprise/dots-admin-guide
        note: >-
          Partial on the tracing rule: messages, supported tool calls and connected-app calls with their results
          reach the organisation, but the guide says to check which records exist before relying on them, and
          the cloud browser's navigations, the cloud computer's commands and local-computer work are not
          documented in the records. Compliance Logs Platform records stay at source for 30 days (stated for Work
          Cloud), so pull them continuously; delegated Work
          and Codex tasks are recorded under those products. The Activity view is the member's, not a trace.
        verified: "2026-10-30"
    # The security-relevant settings, each with the baseline value (data/tooling/BASELINE.md).
    # On Enterprise the workspace owner sets dots access and the cloud-computer capabilities (shared with Work Cloud)
    # in Admin Console › Permissions, where role grants add up; on a Pro account the member is the only admin, so the
    # rest are the member's own controls in the dot's profile and settings. Verified 2026-10-30 at learn.chatgpt.com.
    settings:
      - id: useDots
        name: Use dots (Beta)
        where: Admin Console › Permissions › Workspace default › Workspace capabilities › Use dots, or a custom role
        setVia: [adminConsole, identityProvider]
        area: identity
        default: "Off"
        recommended: Off in the workspace default; On through a custom role for a pilot group
        why: A dot works between conversations through its owner's connected apps; grants add up, so one role left On keeps access for its members.
        mitigations: [D3-APA, cap-agent-kill-switch]
        requires: Enterprise or Business Premium
        url: https://learn.chatgpt.com/docs/enterprise/dots-admin-guide
        verified: "2026-10-30"
      - id: dotsLocalComputerAccess
        name: Allow local computer access
        where: Admin Console › Permissions › Use dots › Allow local computer access
        setVia: [adminConsole]
        area: tools
        default: "Off"
        recommended: "Off"
        why: A connected computer gives the dot local files, code and apps from any channel its owner messages it on, phone included.
        mitigations: [AML.M0028, D3-APA]
        url: https://learn.chatgpt.com/docs/enterprise/cloud-local-access
        verified: "2026-10-30"
      - id: dotsMessaging
        name: Add dots to Slack and Microsoft Teams
        where: Admin Console › Permissions (workspace default or custom role)
        setVia: [adminConsole]
        area: sharing
        recommended: Off until the pilot needs it; then On for that role only, with the Slack app approved by your Slack admin
        why: A dot with its own Slack identity posts where everyone in the conversation can read it; turning it off does not remove the member's own Slack connection.
        mitigations: [D3-APA]
        url: https://learn.chatgpt.com/docs/enterprise/dots-admin-guide
        verified: "2026-10-30"
      - id: dotsCustomRules
        name: Use custom rules for dots
        where: Admin Console › Permissions (workspace default or custom role)
        setVia: [adminConsole]
        area: tools
        recommended: "On"
        why: Members can require Ask before taking action or Hand off to you for consequential actions; with it off, saved rules stop applying.
        mitigations: [AML.M0029]
        url: https://learn.chatgpt.com/docs/enterprise/dots-admin-guide
        verified: "2026-10-30"
      - id: dotsCloudBrowser
        name: Use a browser
        where: Admin Console › Permissions › Workspace default › Workspace capabilities › Let agents use cloud computers (shared with Work Cloud and team automations)
        setVia: [adminConsole]
        area: network
        recommended: "On"
        why: Browsing is much of a dot's use and its cloud browser holds its own sessions, not the member's sign-ins; it is an on/off switch, not a destination allowlist.
        mitigations: []
        url: https://learn.chatgpt.com/docs/enterprise/dots-admin-guide
        verified: "2026-10-30"
      - id: dotsNetworkAccess
        name: Allow network access
        where: Admin Console › Permissions › Workspace default › Workspace capabilities › Let agents use cloud computers
        setVia: [adminConsole]
        area: network
        recommended: "Off"
        why: Code and shell on the dot's cloud computer cannot reach arbitrary hosts; browsing and connected apps are separate paths.
        mitigations: []
        url: https://learn.chatgpt.com/docs/enterprise/chatgpt-work-cloud-security
        verified: "2026-10-30"
      - id: dotsPasswordManager
        name: Use password manager
        where: Admin Console › Permissions › Workspace default › Workspace capabilities › Use password manager
        setVia: [adminConsole]
        area: identity
        recommended: "Off"
        why: The dot's cloud browser cannot draw on the password manager; members sign in through the private sign-in form instead.
        mitigations: [D3-CH]
        url: https://learn.chatgpt.com/docs/enterprise/dots-admin-guide
        verified: "2026-10-30"
      - id: dotsConnectedApps
        name: Connected apps (available apps and allowed actions)
        where: Admin Console › Plugins › (app) › App access and Tools — the same controls as ChatGPT
        setVia: [adminConsole]
        area: tools
        recommended: The dots pilot gets only approved apps, read actions unless a write is part of an agreed workflow
        why: A dot uses the owner's connections with their allowed actions, so reading mail never implies sending it.
        mitigations: [AML.M0028]
        url: https://learn.chatgpt.com/docs/enterprise/dots-admin-guide
        verified: "2026-10-30"
      - id: dotsComplianceRecords
        name: Admin keys (CODEX_LOG access, client_id = DOTS)
        where: Admin Console › (workspace) › Credentials › Admin keys, then the Compliance Logs Platform via the Admin API
        setVia: [adminConsole, apiCli]
        area: audit
        recommended: Pulled continuously into the SIEM with the ChatGPT compliance records, filtered on client_id DOTS
        why: Prompts, replies, tool calls and connected-app calls a dot made reach your SIEM before the source window lapses.
        mitigations: [cap-agent-tracing]
        requires: Enterprise
        url: https://learn.chatgpt.com/docs/enterprise/dots-admin-guide
        verified: "2026-10-30"
      - id: customRules
        name: Custom rules
        where: Settings › Personalization › Permissions › Custom rules (mobile — Customize › Custom rules)
        setVia: [configFile]
        area: tools
        default: No rules (built-in safeguards and automatic review)
        recommended: Ask before taking action for sending or sharing outside the team; Hand off to you for deleting shared files
        why: Puts the member in front of the actions that leave the firm or cannot be undone; rules are instructions, not enforcement.
        mitigations: [AML.M0029]
        url: https://learn.chatgpt.com/docs/dots/controls
        verified: "2026-10-30"
      - id: saveToPasswords
        name: Save to Passwords
        where: The dot's private sign-in form, when offered
        setVia: [configFile]
        area: identity
        default: Not saved
        recommended: Not used for client systems or administrator accounts
        why: Credentials go to the remote browser outside the conversation; a saved login makes later sign-ins one confirmation away.
        mitigations: [D3-CH]
        url: https://learn.chatgpt.com/docs/dots/computers-and-apps
        verified: "2026-10-30"
      - id: chatgptMemory
        name: ChatGPT Memory
        where: The member's ChatGPT memory setting
        setVia: [configFile]
        area: data
        recommended: Off for dots used on client work
        why: Stops ChatGPT memory flowing into the dot; it does not erase what the dot already holds, so delete the dot to clear that.
        mitigations: [AML.M0031]
        url: https://learn.chatgpt.com/docs/enterprise/dots-admin-guide
        verified: "2026-10-30"
      - id: pauseDot
        name: Pause
        where: Pause on the dot; delegated tasks stopped in Activity and recurring tasks in Scheduled
        setVia: [configFile]
        area: audit
        recommended: The member's and the admin runbook's first step for an unexpected action, followed by Scheduled › disable
        why: Pause stops the dot's current main task but not delegated tasks or future scheduled runs, so each is stopped on its own.
        mitigations: [cap-agent-kill-switch]
        url: https://learn.chatgpt.com/docs/dots/controls
        verified: "2026-10-30"
      - id: deleteDot
        name: Delete
        where: Delete on the dot (read the confirmation before confirming)
        setVia: [configFile]
        area: data
        recommended: Used when a member leaves the pilot or the dot has handled material it should not keep
        why: Removes the dot and its own context, but not changes it made in connected apps or messages it delivered; separately stored files and threads need their own deletion.
        mitigations: [AML.M0031]
        url: https://learn.chatgpt.com/docs/dots/controls
        verified: "2026-10-30"
      - id: sso
        name: SSO
        where: Global Admin Console (admin.openai.com) › SSO and related identity settings, after domain verification
        setVia: [adminConsole, identityProvider]
        area: identity
        recommended: Required for every verified domain, with MFA enforced on the ChatGPT app in your IdP
        why: ChatGPT has no workspace-wide MFA switch, so the IdP's sign-in policy is the only place MFA is enforced for the people who direct and approve dots.
        mitigations: [D3-MFA, D3-APA]
        url: https://learn.chatgpt.com/docs/enterprise/work-admin-faq
        verified: "2026-10-30"
      - id: perUserUsageLimits
        name: Monthly per-user usage limits
        where: Workspace usage limits › workspace default, group defaults and individual overrides
        setVia: [adminConsole]
        area: tools
        recommended: A workspace default with a group default for the dots pilot, increase requests reviewed by an admin
        why: Work and Codex tasks a dot starts or manages stop at a known level; the dot's own conversations do not count toward these limits.
        mitigations: [AML.M0036]
        requires: Enterprise or Edu
        url: https://learn.chatgpt.com/docs/enterprise/work-admin-faq
        verified: "2026-10-30"
      - id: dotsUsageAnalytics
        name: Admin keys (enterprise.analytics.usage.read)
        where: Admin Console › (workspace) › Credentials › Admin keys, then /v1/analytics/workspaces/{workspace_id}/usage
        setVia: [adminConsole, apiCli]
        area: audit
        recommended: Pulled daily, filtered on client_id DOTS, and reconciled against the roles that grant Use dots
        why: Shows who in the workspace runs a dot, so use outside the approved pilot group is found.
        mitigations: [cap-agent-tool-registry]
        requires: Enterprise
        url: https://learn.chatgpt.com/docs/enterprise/dots-admin-guide
        verified: "2026-10-30"
    advisories: []
    sources:
      - title: Introducing dots
        url: https://openai.com/index/introducing-dots/
      - title: Meet dots
        url: https://learn.chatgpt.com/docs/dots
