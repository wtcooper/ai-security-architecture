  - id: groundingSourcesConstraint
    name: "Control Grounding Sources in Vertex AI Generative APIs, and Disable Grounding with Google Search in generative AI APIs"
    where: "Organization Policy › constraints/vertexai.genAIGroundingSources and constraints/vertexai.disableGenAIGoogleSearchGrounding"
    setVia: [cloudPolicy]
    area: tools
    default: "Not set. All grounding sources are allowed and Grounding with Google Search is enabled."
