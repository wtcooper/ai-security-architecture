  - id: ncsc-defending-agentic-cyber-attacks
    kind: research
    date: '2026-11-24'
    title: >-
      NCSC: agentic attacks exploit familiar weaknesses faster; eight priorities from exposure inventory
      to decoys
    summary: 'The NCSC says none of the weaknesses AI agents exploit are new. Its priorities: inventory
      internet-facing systems, put services behind authentication, correlate logs for agent traits (bursts,
      broad parameter sweeps, high error rates), patch fast, add bot challenges to logins and LLM-backed
      features, rate-limit per account or token rather than IP, throttle sign-ups and plant honeytokens.

      '
    why: >-
      Agency guidance on defending against AI-run attacks; says IP blocking is often ineffective against
      agents.
    vendor: NCSC
    controls: [D3-AI, D3-RAPA, AML.M0004]
    patterns: [archChatAgent]
