# Google Cloud: the first-party cloud architectures as built on Google Cloud (Gemini Enterprise
# Agent Platform, formerly Vertex AI), and the security-relevant settings that secure them. One
# settings library per cloud, so a setting used by several architectures is one row with one
# status in data/org/products.yaml; each implementation binds the drawing's blocks to services and lists
# the settings that apply to it.
#
# Every row follows data/tooling/BASELINE.md: the setting's name as Google's page gives it, a url
# that resolved on its verified date, the baseline value, and the controls on the drawing it
# delivers. setVia "code" marks a control no Google Cloud setting provides: the organisation builds
# it into its own agent. Product names follow the current docs: Vertex AI is now Gemini Enterprise
# Agent Platform, Vertex AI Agent Engine is Agent Runtime, and Vertex AI Search is Agent Search.
id: cloudGcp
name: Google Cloud
short: Google Cloud

# Technology packs: sets of products their vendor or project documents as working together,
# researched 2026-11-24. The first is the provider's own services, the mapping as drawn; a platform
# pack fills most boxes, an add-on replaces some boxes of either. None is ranked. A pack's product for
# a box is the box's option that lists the pack; each box still names the service drawn.
packs:
  - id: googleCloudNative
    name: "Google Cloud managed services"
    kind: commercial
    scope: platform
    vendor: "Google Cloud"
    url: "https://docs.cloud.google.com/gemini-enterprise-agent-platform/overview"
    asOf: "2026-11"
    status: mixed
    summary: "The services this mapping draws today: Gemini Enterprise Agent Platform for models, sessions, training, evaluation and the model registry, Apigee as the AI and MCP gateway, Cloud Run and GKE for your code, and Artifact Registry, Secure Source Manager, Cloud Build and Cloud Deploy for the factory. Google runs every service; you run your code and configuration on them."
    fits: "When the organisation wants one provider's managed services, billing and support behind every box and already uses or accepts Apigee as its gateway."
    compare:
      licence: "Google Cloud pay-as-you-go or committed use; Apigee needs a Subscription, Pay-as-you-go or Evaluation organisation; partner models such as Claude are Separate Offerings."
      support: "Google Cloud Customer Care for every service; partner models under their providers' terms."
      covers: "Every role in all ten patterns, as drawn today."
      bringYourOwn: "Your agent and tool code, systems of record, IAM and VPC Service Controls design, and red-team tooling beside the evaluation service."
      integration: "Google documents each pair: Apigee with Model Armor, GKE Inference Gateway with Apigee and Model Armor, ADK with Agent Platform Sessions, Secure Source Manager triggers to Cloud Build, Cloud Deploy to Cloud Run and GKE."
      effort: "Lowest operating load; the Apigee proxies, policies and IAM are still yours to build."
    integrations:
      - { between: [Apigee, "Model Armor"], what: "Apigee as an AI gateway with model routing, Model Armor screening and semantic cache.", url: "https://docs.cloud.google.com/apigee/docs/api-platform/fundamentals/build-ai-gateway" }
      - { between: ["GKE Inference Gateway", Apigee], what: "The inference gateway calls Apigee for API security, rate limits and quotas, and Model Armor for content screening.", url: "https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-gke-inference-gateway" }
      - { between: ["Agent Development Kit", "Agent Platform Sessions"], what: "ADK's VertexAiSessionService keeps sessions in Agent Platform.", url: "https://adk.dev/sessions/session/" }
      - { between: ["Secure Source Manager", "Cloud Build"], what: "A triggers file in the repository starts Cloud Build.", url: "https://docs.cloud.google.com/secure-source-manager/docs/overview" }
      - { between: ["Cloud Deploy", "Cloud Run"], what: "Cloud Deploy promotes releases to Cloud Run and GKE targets, with approvals.", url: "https://docs.cloud.google.com/deploy/docs/overview" }
    sources:
      - https://docs.cloud.google.com/gemini-enterprise-agent-platform/overview
      - https://docs.cloud.google.com/apigee/docs/api-platform/get-started/ai-capabilities
      - https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-gke-inference-gateway
      - https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sessions
      - https://docs.cloud.google.com/run/docs/code-execution
      - https://docs.cloud.google.com/secure-source-manager/docs/overview
      - https://docs.cloud.google.com/deploy/docs/overview
