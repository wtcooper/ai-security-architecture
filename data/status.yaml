# Your organisation's status for each capability, and your own name for it.
#
# Nothing ships with a status: every capability reads "Not set" until it is listed here.
# Key each entry by a capability id from the Capabilities page — a MITRE id (D3-MFA,
# AML.M0020) or an authored specialisation (cap-agent-egress-control).
#
#   status       enabled | inProgress | gap
#   displayName  what your organisation calls it; the catalogue name is shown beneath it
#   note         optional, shown on hover
#
# Control status is never set here: it rolls up from the capabilities that support the
# control. A parent MITRE capability rolls up from its specialisations too.
#
# Example:
#
# capabilities:
#   cap-agent-egress-control:
#     status: enabled
#     displayName: AI egress allow-list
#     note: Deny by default; named model providers allowed.
#   D3-MFA:
#     status: inProgress
capabilities: {}

# Products: the tools and clouds your organisation uses, and their settings. Shown on each
# architecture's Enable tab, step 4: a product's pill is coloured by its status, and each row of
# its settings table by the setting's. Anything not listed reads "Not enabled".
#
# Key each entry by a tool id (data/tooling/, e.g. toolClaudeCode) or a cloud id (data/clouds/,
# e.g. cloudAzure); key each setting by the id on its row.
#
#   status    enabled | testing | notEnabled
#   note      optional, shown on hover
#   settings  setting id -> { status, value (what you actually set, if it differs), note }
#
# Example:
#
# products:
#   toolClaudeCode:
#     status: enabled
#     settings:
#       requireSso: { status: enabled }
#       sandboxEnabled: { status: testing, note: Pilot group only }
products: {}
