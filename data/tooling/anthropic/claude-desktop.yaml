                then toggle "Require SSO for Claude" in Authentication settings.
            url: https://support.claude.com/en/articles/13132885-set-up-single-sign-on-sso
          - title: Provision and deprovision from the directory
            body:
              - Enable SCIM with group-to-role mapping (Enterprise / Console); users removed from all mapped
                groups are removed at the next sync.
            url: https://support.claude.com/en/articles/13133195-set-up-jit-or-scim-provisioning
          - title: Gate features by role
            body:
              - Create custom roles and groups at Organization settings > Roles and Groups to gate Claude
                Code, Cowork, Chrome, connectors, Claude Tag, models and admin scopes.
            url: >-
              https://support.claude.com/en/articles/13930458-set-up-role-based-permissions-on-enterprise-plans
