        summary: "The agent runs as a Deployment in a GKE cluster you operate and pulls its triggers from Pub/Sub instead of receiving pushes; Apigee, the tool servers, the stores and Code Execution stay where they are. You now carry what Cloud Run did for you: the Pod's identity and the node's credentials, private nodes and network policy, the outbound proxy route, canary rollouts through Cloud Deploy, and cluster and node upgrades."
        bindings:
          - { block: planner, service: "Your agent in a Deployment on GKE", builtWith: "Agent Development Kit (ADK)", note: "A Deployment and ClusterIP Service in its own namespace, on its own Kubernetes ServiceAccount, from your manifests; adk deploy gke (Python only) uses the default ones.", url: https://adk.dev/deploy/gke/ }
          - { block: events, service: "Pub/Sub pull subscription and Cloud Scheduler", note: "Push needs an HTTPS endpoint on the public web, so a subscriber beside the agent pulls. Cloud Scheduler publishes to the topic, and the operator's approval returns the same way.", url: https://docs.cloud.google.com/pubsub/docs/subscriber }
