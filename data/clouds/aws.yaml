  - id: webSearchDomainFilter
    name: "Web Search Tool target domain include and exclude lists"
    where: "AgentCore Gateway › Web Search Tool connector target › parameterValues.domainFilter.include and .exclude"
    setVia: [apiCli]
    area: tools
    default: "No domain lists"
    requires: "Include list needs connector version 1.2.0 or later"
    recommended: "Set an include list of the sites the agent's task needs, or at least an exclude list, on the target. Pin the connector version. Grant execution roles neither bedrock-agentcore:InvokeWebSearch nor, where the agent does not browse, bedrock-agentcore:StartBrowserSession: the Web Search API and AgentCore Browser reach the web with IAM alone, without the gateway."
    value: "Include list of needed sites, or an exclude list"
