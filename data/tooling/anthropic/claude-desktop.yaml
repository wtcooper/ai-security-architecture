        verified: "2026-10-30"
      - mitigation: D3-EI
        coverage: none
        mechanism: >-
          Local MCP servers and desktop extensions run as ordinary host processes with the user's permissions;
          the app offers no sandbox for them, only their removal
        evidence:
          - title: Claude Cowork architecture overview (local plugin MCP servers run natively on the device)
            url: https://support.claude.com/en/articles/14479288-claude-cowork-architecture-overview
          - title: Deploying enterprise-grade MCP servers with desktop extensions (direct filesystem and OS access)
            url: >-
