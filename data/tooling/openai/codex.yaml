  - id: toolCodexSdk
    name: Codex SDK
    surfaceClasses:
      - managedRuntime
    variants:
      - name: "@openai/codex-sdk (TypeScript)"
        class: managedRuntime
        url: https://learn.chatgpt.com/docs/codex-sdk
      - name: openai-codex (Python)
        class: managedRuntime
        url: https://learn.chatgpt.com/docs/codex-sdk
    architecture: archAgentWorkflow
    status: ga
    asOf: "2026-09"
    summary:
      - >-
        The SDK embeds the Codex agent in customer-hosted automation: it drives a local Codex
        runtime (the Python package pins its own) over JSON-RPC with a thread/turn API, sandbox
        presets (read_only, workspace_write, full_access) settable per thread or per turn, and
        model selection. Inference is at OpenAI; execution is wherever the host runs.
      - >-
        Because it is the same app-server, the host's config.toml and any requirements.toml apply
        — the SDK page says an omitted sandbox falls back to the app-server's configured default.
        Unattended runs authenticate with CODEX_API_KEY, a service-account CODEX_ACCESS_TOKEN or
        workload identity federation, which is the credential story that distinguishes this
        entity from the interactive shells.
    facts:
      - label: Plans
        value: API-key usage bills at API rates; ChatGPT sign-in and service-account tokens use the workspace plan.
        url: https://learn.chatgpt.com/docs/pricing
      - label: Inference & routing
        value: The SDK controls a local runtime that calls OpenAI; model_provider / base_url overrides in config.toml apply.
        url: https://learn.chatgpt.com/docs/codex-sdk
      - label: Data leaving the device
        value: Prompts, file contents the agent reads and command output go to OpenAI as with the CLI.
        url: https://learn.chatgpt.com/docs/enterprise/chatgpt-work-local-security
      - label: Docs index
        value: learn.chatgpt.com/docs/codex-sdk
        url: https://learn.chatgpt.com/docs/codex-sdk
      - label: Data retention / training
        value: API-key traffic falls under the API data policy — not used for training by default, 30-day abuse-monitoring logs, ZDR by approval.
        url: https://developers.openai.com/api/docs/guides/your-data
    riskNotes:
      - risk: riskRunawayAgentToolLoops
        note: agents.max_concurrent_threads_per_session is the only vendor bound on subagent fan-out; task duration and spend are yours to cap.
      - risk: riskRogueActions
        note: full_access is one argument away in the SDK; pin allowed_sandbox_modes on the host so the preset is rejected.
      - risk: riskAgenticDelegationConfusedDeputy
        note: Runs act as whichever token the host holds; use a service account so actions attribute to the automation, not an engineer.
      - risk: riskToolSourceProvenance
        note: MCP servers and plugins configured on the host are inherited by SDK threads; allowlist them in requirements.toml.
    controls:
      - capability: capabilityMemoryProtection
        coverage: partial
        mechanism: Thread persistence (resumeThread) and history.persistence on the host
        steps:
          - title: Disable persisted transcripts on the host
            body:
              - Set [history] persistence = "none" if threads must not survive the process.
            url: https://learn.chatgpt.com/docs/config-file/config-advanced
        verified: "2026-09-10"
      - capability: capabilityModelEvals
        coverage: none
        mechanism: Not offered
        note: No vendor evaluation harness for SDK agents; structured output and streaming events let you build one.
        verified: "2026-09-10"
      - capability: capabilityAgentObservability
        coverage: partial
        mechanism: Streaming turn events and [otel] export
        steps:
          - title: Export OTel logs
            body:
              - Set [otel] exporter to otlp-http or otlp-grpc; events carry model and sandbox metadata, with prompts redacted unless log_user_prompt = true.
            url: https://learn.chatgpt.com/docs/config-file/config-advanced
        verified: "2026-09-10"
      - capability: capabilityIga
        coverage: partial
        mechanism: ChatGPT sign-in, service-account tokens or workload identity federation for the host process
        steps:
          - title: Authenticate unattended runs without a personal token
            body:
              - Exchange an OIDC or SPIFFE JWT-SVID through a federation rule for a short-lived
                workspace token (never longer than one hour).
            url: https://learn.chatgpt.com/docs/enterprise/workload-identity
        verified: "2026-09-10"
      - capability: capabilityNhiManagement
        coverage: native
        mechanism: Service accounts and workload identity federation rules
        steps:
          - title: Give the automation its own identity
            body:
              - Create a service account (SCIM userType "ServiceAccount" is supported) and issue
                tokens from its Access tokens section; runs attribute to it.
            url: https://learn.chatgpt.com/docs/enterprise/service-accounts
          - title: Prefer federation over stored tokens
            body:
              - Provider and rule creation, updates and archival generate audit events; disabling a
                rule revokes tokens already issued through it.
            url: https://learn.chatgpt.com/docs/enterprise/workload-identity
        verified: "2026-09-10"
      - capability: capabilitySecretsManagement
        coverage: partial
        mechanism: CODEX_API_KEY / CODEX_ACCESS_TOKEN environment variables, cli_auth_credentials_store = "ephemeral"
        steps:
          - title: Keep the credential in memory only
            body:
              - Set cli_auth_credentials_store = "ephemeral" so nothing is written to auth.json;
                supply CODEX_API_KEY or CODEX_ACCESS_TOKEN from your secret manager.
            url: https://learn.chatgpt.com/docs/config-file/environment-variables
        verified: "2026-09-10"
      - capability: capabilityAgentRuntimeEnforcement
        coverage: native
        mechanism: PreToolUse / PermissionRequest hooks and [rules] on the host
        steps:
          - title: Gate tool calls with a hook
            body:
              - A PreToolUse hook returning permissionDecision "deny" blocks the call for every
                SDK thread; managed hooks in requirements.toml cannot be bypassed.
            url: https://learn.chatgpt.com/docs/hooks
        verified: "2026-09-10"
      - capability: capabilityToolPermissionScoping
        coverage: native
        mechanism: Sandbox preset per thread or turn; [mcp_servers] enabled_tools
        steps:
          - title: Choose the preset per thread
            body:
              - Pass Sandbox.read_only or Sandbox.workspace_write at thread creation or on a turn;
                the setting applies to that turn and later turns.
            url: https://learn.chatgpt.com/docs/codex-sdk
          - title: Limit MCP tools
            body:
              - enabled_tools / disabled_tools per [mcp_servers.<name>] in the host config.
            url: https://learn.chatgpt.com/docs/extend/mcp
        verified: "2026-09-10"
      - capability: capabilityCredentialIsolation
        coverage: partial
        mechanism: Service-account attribution; no on-behalf-of exchange
        note: The agent holds one token for the whole run; there is no per-user delegation inside a thread.
        steps:
          - title: Attribute runs to the automation identity
            body:
              - Tokens from a service account make runs attribute to that account in analytics and audit records.
            url: https://learn.chatgpt.com/docs/enterprise/service-accounts
        verified: "2026-09-10"
      - capability: capabilityRateLimiting
        coverage: partial
        mechanism: agents.max_concurrent_threads_per_session; workspace usage limits
        steps:
          - title: Cap subagent fan-out
            body:
              - Set agents.max_concurrent_threads_per_session (or agents.enabled = false) in the host config.
            url: https://learn.chatgpt.com/docs/agent-configuration/subagents
          - title: Set workspace spend limits
            body:
              - Plan-dependent usage limits and spend controls cover eligible Codex activity; API billing is separate.
            url: https://learn.chatgpt.com/docs/enterprise/usage-limits
        verified: "2026-09-10"
      - capability: capabilityPromptInjectionDefense
        coverage: partial
        mechanism: Sandbox default and network off; Guardian auto-review where approvals are delegated
        note: Headless runs have no human at the approval prompt, so the sandbox and egress rules are the defence.
        steps:
          - title: Keep network off in workspace_write
            body:
              - The default workspace-write sandbox keeps network off; the docs warn injection can make the agent fetch untrusted instructions.
            url: https://learn.chatgpt.com/docs/agent-approvals-security
        verified: "2026-09-10"
      - capability: capabilityAiDlp
        coverage: partial
        mechanism: deny_read globs and shell_environment_policy on the host
        steps:
          - title: Deny secret paths
            body:
              - "[permissions.filesystem] deny_read in requirements.toml applies to SDK threads too."
            url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
        verified: "2026-09-10"
      - capability: capabilityHitlControls
        coverage: partial
        mechanism: approval_policy on the host; the SDK page documents sandbox presets, not an approval callback
        note: Could not verify an SDK-level approval handler from the fetched page; treat headless runs as unattended.
        steps:
          - title: Decide the approval policy for headless use
            body:
              - approval_policy "on-request" versus "never" is a host config choice; requirements.toml can forbid "never".
            url: https://learn.chatgpt.com/docs/sandboxing
        verified: "2026-09-10"
      - capability: capabilityDataAccessGovernance
        coverage: none
        mechanism: Not offered
        note: The agent reads whatever the host user can read; scope the host account and working directory.
        verified: "2026-09-10"
      - capability: capabilityAgentSandboxing
        coverage: native
        mechanism: OS sandbox of the local runtime, presets settable per thread
        steps:
          - title: Run in workspace_write or read_only
            body:
              - Sandbox.full_access runs without filesystem restrictions; pin allowed_sandbox_modes on the host to exclude it.
            url: https://learn.chatgpt.com/docs/codex-sdk
        verified: "2026-09-10"
      - capability: capabilityAgentRegistry
        coverage: partial
        mechanism: "[mcp_servers] approved identities and [marketplaces] on the host"
        steps:
          - title: Allowlist tool servers
            body:
              - Only servers whose name and identity match an approved [mcp_servers] entry are enabled.
            url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
        verified: "2026-09-10"
      - capability: capabilityAuditLogging
        coverage: partial
        mechanism: OTel export plus Compliance API when signed in with a workspace identity
        steps:
          - title: Attribute and export
            body:
              - Service-account runs appear in workspace analytics and audit records; token creation and configuration changes are tracked through the Admin API.
            url: https://learn.chatgpt.com/docs/enterprise/service-accounts
        verified: "2026-09-10"
      - capability: capabilityKillSwitch
        coverage: native
        mechanism: Token revocation, service-account disable, federation rule disable
        steps:
          - title: Revoke at the identity
            body:
              - Disabling or deleting the service account revokes all of its tokens; disabling a federation provider or rule revokes tokens issued through it.
            url: https://learn.chatgpt.com/docs/enterprise/workload-identity
        verified: "2026-09-10"
      - capability: capabilityAiDetectionResponse
        coverage: external
        mechanism: OTel stream into the organisation's SIEM
        note: Detection content is yours; the vendor emits events with model and sandbox metadata.
        verified: "2026-09-10"
      - capability: capabilityEncryptionKeyManagement
        coverage: partial
        mechanism: TLS to OpenAI (CODEX_CA_CERTIFICATE for interception), OS keyring for stored credentials
        steps:
          - title: Trust the corporate CA explicitly
            body:
              - Set CODEX_CA_CERTIFICATE (or SSL_CERT_FILE) to the PEM bundle in TLS-interception environments.
            url: https://learn.chatgpt.com/docs/config-file/environment-variables
        verified: "2026-09-10"
      - capability: capabilityRagSecurity
        coverage: none
        mechanism: Not applicable
        note: The SDK ships no retrieval store; any RAG the host adds is the host's control.
        verified: "2026-09-10"
      - capability: capabilityMcpToolSecurity
        coverage: native
        mechanism: "[mcp_servers] identity allowlist and marketplaces.restrict_to_allowed_sources"
        steps:
          - title: Lock MCP and plugin sources
            body:
              - An empty [mcp_servers] table disables all servers; restrict_to_allowed_sources rejects unmatched marketplaces.
            url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
        verified: "2026-09-10"
      - capability: capabilityAiBom
        coverage: partial
        mechanism: Pinned runtime (Python SDK) and codex_bin path
        note: The Python SDK uses its pinned runtime and CodexConfig(codex_bin=...) fixes the binary; nothing is signed or manifested.
        steps:
          - title: Pin the runtime
            body:
              - Point CodexConfig(codex_bin=...) at a vetted binary rather than whatever is on PATH.
            url: https://learn.chatgpt.com/docs/codex-sdk
        verified: "2026-09-10"
      - capability: capabilityEgressControl
        coverage: partial
        mechanism: sandbox_workspace_write.network_access and [experimental_network] domain lists
        note: Domain rules cover sandboxed commands only, not MCP servers.
        steps:
          - title: Allowlist domains
            body:
              - "[experimental_network] with managed_allowed_domains_only = true in requirements.toml."
            url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
        verified: "2026-09-10"
      - capability: capabilityModelScanning
        coverage: none
        mechanism: Not applicable
        note: No model artifacts are loaded by the SDK.
        verified: "2026-09-10"
