# GitHub Copilot cloud agent — one entity per product × reference architecture. Facts are dated
# (asOf) and cite the vendor's own documentation; re-verify before enforcing. Schema:
# data/tooling/README.md. Excluded: Jules, Devin and Cursor inside GitHub — announced partners,
# not shipped; Copilot Workspace — gone.
# 2026-09-15: added sandboxing, egress, runtime enforcement, credential isolation and MCP rows after the managed-runtime drawing pinned them; fetched about-cloud-agent, customize-the-firewall, hooks-reference, configure-secrets-and-variables, mcp-and-cloud-agent, supported-surfaces-for-policies, risks-and-mitigations (all 200).
# 2026-09-25: re-verified toolCopilotCloudAgent against the MITRE capability rules; concepts/agents/cloud-agent/risks-and-mitigations redirects to concepts/security-governance-and-network-settings/risks-and-mitigations; set-up-copilot/configure-runners is now the Copilot code review runners page (cloud agent runners: manage-for-organization/configure-runner-for-coding-agent); copilot.github.trust.page renders client-side (read in a browser).
vendor: github
family: GitHub Copilot cloud agent
tools:
  - id: toolCopilotCloudAgent
    name: GitHub Copilot cloud agent
    surfaceClasses:
      - cloudAgent
      - ciIntegration
    variants:
      - name: Copilot cloud agent (formerly "coding agent") and automations
        class: cloudAgent
        url: https://docs.github.com/en/copilot/concepts/agents/cloud-agent/about-cloud-agent
      - name: Copilot code review (agentic; PR approval in public preview since 2026-09-01)
        class: ciIntegration
        url: https://docs.github.com/en/copilot/concepts/agents/code-review
      - name: Partner coding agents — Anthropic Claude and OpenAI Codex (public preview)
        class: cloudAgent
        url: https://docs.github.com/en/copilot/concepts/agents/about-third-party-coding-agents
      - name: Agent apps (partner GitHub Apps exposing agents; "Agent apps" policy)
        class: cloudAgent
        url: https://docs.github.com/en/copilot/concepts/agents/agent-apps
      - name: GitHub Agentic Workflows (public preview; markdown compiled to a hardened .lock.yml)
        class: ciIntegration
        url: https://docs.github.com/en/copilot/concepts/agents/about-github-agentic-workflows
    architecture: archHostedAgentSessions
    status: ga
    asOf: "2026-09"
    summary:
      - "The cloud agent takes an issue, PR comment, chat hand-off or automation trigger and works in an
        ephemeral GitHub Actions environment (59-minute hard limit) on a copilot/ branch, pushing a draft PR
        that a human must review and merge. Code review, partner agents (Claude, Codex), agent apps and
        Agentic Workflows run on the same Actions substrate and share its mitigations; automations re-run the
        agent on schedules and repository events."
      - "Inference runs on the Copilot API against enterprise-enabled models; the runner talks to
        api.<plan>.githubcopilot.com behind an egress firewall that, by default, allows package registries and
        certificate authorities only. The GitHub MCP server is wired in with a read-only token scoped to the
        repository; other MCP servers run with whatever secrets the administrator places in the Agents secret
        type — and are used without approval prompts."
      - "Governance is enterprise-first: AI controls > Agents > Copilot Cloud Agent with Enabled for selected
        organisations (custom properties via REST), organisation and repository access controls, Actions
        workflow approval, validation tools (CodeQL, secret scanning, dependency review, Copilot review),
        runner type and the firewall. Sessions are visible at github.com/copilot/agents and in the audit log
        as actor:Copilot with agent_session_id."
    facts:
      - label: Plans
        value: >-
          All paid Copilot plans; Business and Enterprise require the cloud agent policy. Billing is GitHub
          Actions minutes plus AI credits; user-level budgets always hard-stop, organisation and enterprise budgets
          block only with "Stop usage when budget limit is reached" (off by default).
        url: https://docs.github.com/en/copilot/concepts/agents/cloud-agent/about-cloud-agent
      - label: Inference & routing
        value: >-
          Copilot API from the Actions runner (api.business / api.enterprise.githubcopilot.com); models per
          the enterprise Configure models policy; data-resident routing under the "Restrict Copilot to data
          residency compliant models" policy (+10% credits). Enterprise BYOK does not apply to the cloud
          agent.
        url: >-
          https://docs.github.com/en/enterprise-cloud@latest/admin/data-residency/github-copilot-with-data-residency
      - label: Data leaving the environment
        value: >-
          Repository contents, issue and PR text and tool output go to the Copilot API; outbound network from
          Bash tools is firewalled; MCP servers and copilot-setup-steps are not firewalled; session logs and
          commits persist on GitHub.
        url: >-
          https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-the-firewall
      - label: Data retention / training
        value: >-
          Ephemeral environment destroyed after the session; each agent commit links permanently to its
          session logs (application card). GitHub does not use Copilot Business or Enterprise customer data to
          train AI models; provider terms are per model on the model-hosting page (OpenAI and xAI zero
          retention, Anthropic per its ZDR documentation, Google no training).
        url: https://docs.github.com/en/copilot/reference/ai-models/model-hosting
      - label: Policy change 2026-09-28
        value: >-
          Copilot Chat on github.com, Chat in GitHub Mobile and the cloud agent merge under one policy on or
          after 2026-09-28; chat retention moves from 28 days to the life of the account. Admins must confirm
          the unified policy before that date.
        url: >-
          https://github.blog/changelog/2026-08-28-upcoming-changes-to-github-copilot-policies-and-billing/
      - label: Docs index
        value: "Cloud agent concepts: about, risks and mitigations, MCP, automations, access management."
        url: https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/risks-and-mitigations
    items:
      - title: Enablement, targeting and repository scope
        body:
          - "Enterprise > AI controls > Agents > Copilot Cloud Agent: Disabled (default), Enabled for all
            organizations, Enabled for selected organizations (UI, or by custom property through the REST
            API), or let organisations decide. Organisation owners then set Repository access (all or selected
            repositories); owners and users can opt individual repositories out. Only users with write access
            can trigger the agent, and automations ignore events from users without write access by default."
          - "Third-party agents and agent apps are separate policies: disabling the cloud agent does not
            disable Claude or Codex agents, and the \"Agent apps\" policy gates partner apps installed in the
            enterprise's organisations. Content exclusion does not apply to third-party agents."
        links:
          - title: Enabling the cloud agent in your enterprise
            url: >-
              https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-enterprise/manage-agents/enable-copilot-cloud-agent
          - title: Managing access to the cloud agent
            url: https://docs.github.com/en/copilot/concepts/enterprise/cloud-agent-access
          - title: Supported surfaces for policies
            url: https://docs.github.com/en/copilot/reference/supported-surfaces-for-policies
      - title: The environment — setup steps, secrets, runners, firewall
        body:
          - ".github/workflows/copilot-setup-steps.yml on the default branch (job name copilot-setup-steps;
            only steps, permissions, runs-on, services, snapshot and timeout-minutes are honoured; 59 minutes
            maximum) prepares the runner. Secrets and variables come only from the Agents type (repository or
            organisation Settings > Secrets and variables > Agents); COPILOT_MCP_* entries reach MCP servers
            only; Actions, Codespaces and Dependabot secrets are never exposed."
          - "The firewall is on by default with a recommended allowlist (OS and language package registries,
            container registries, certificate authorities, Playwright browser hosts); organisations and
            repositories add domain or URL rules or disable it. It applies only to processes the agent starts
            through its Bash tools — not MCP servers, not setup steps. Blocked requests are reported in the PR
            body or a comment. Runners default to a standard GitHub-hosted runner; organisation owners can set a
            Runner type and stop repositories overriding it. Larger and self-hosted runners (Ubuntu x64 or Windows
            64-bit; ephemeral single-use self-hosted runners recommended) need uploads.github.com,
            user-images.githubusercontent.com and api.<plan>.githubcopilot.com, and the firewall must be disabled
            on self-hosted runners."
        links:
          - title: Configure the development environment
            url: >-
              https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/customize-the-agent-environment
          - title: Configure secrets and variables for the cloud agent
            url: >-
              https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/configure-secrets-and-variables
          - title: Customizing or disabling the firewall
            url: >-
              https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-the-firewall
          - title: Configuring runners for the cloud agent in your organization
            url: >-
              https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-organization/configure-runner-for-coding-agent
      - title: Output controls — workflow approval, validation, code review approvals
        body:
          - "Repository Settings > Copilot > cloud agent: Validation tools (CodeQL, secret scanning,
            dependency advisories, Copilot code review; on by default) and Actions workflow approval (Require
            approval for workflow runs; keep it on — the docs warn about auto-running workflows on agent
            code). The agent cannot mark a PR ready, approve or merge; rulesets add one more approval when the
            PR is opened under the agent's app identity, and the requesting user cannot approve their own
            request."
          - "Copilot code review can be authorised to approve PRs (public preview): enterprise \"Allow Copilot
            to approve pull requests\" is Disabled everywhere by default, organisations choose whether
            approvals count toward merge requirements, repositories can limit that to file-path globs."
        links:
          - title: Configuring settings for the cloud agent
            url: >-
              https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/configuring-agent-settings
          - title: Risks and mitigations
            url: https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/risks-and-mitigations
          - title: Configure Copilot code review (approvals)
            url: >-
              https://docs.github.com/en/copilot/how-tos/copilot-on-github/set-up-copilot/configure-code-review
    riskNotes:
      - risk: riskPromptInjection
        note: >-
          Every trigger is attacker-reachable text (issues, PR bodies, comments, repository files). GitHub
          strips hidden characters and HTML comments before prompting and ignores non-write-access events for
          automations, but MCP tools run without approval, so an injection that reaches a write-capable MCP
          tool acts immediately.
      - risk: riskSensitiveDataDisclosure
        note: >-
          The firewall covers only Bash-spawned processes; MCP servers and copilot-setup-steps have
          unrestricted egress, and Agents secrets are plain environment variables inside the runner. Put
          nothing in the Agents secret type that a compromised MCP server should not see.
      - risk: riskAgenticDelegationConfusedDeputy
        note: >-
          Automations act under their creator's identity and cannot approve the resulting PRs; partner agents
          install as GitHub Apps (anthropic code agent, openai code agent) with their own permissions.
          Rulesets and the extra-approval rule are the boundary, not the agent.
      - risk: riskShadowAndUnknownAgents
        note: >-
          Cloud agent, third-party agents and agent apps are three independent policies; a "disabled" cloud
          agent still leaves Claude, Codex and any installed agent app enabled unless each is switched off.
    controls:
      - mitigation: D3-APA
        coverage: partial
        mechanism: >-
          Enterprise AI controls > Agents > Copilot Cloud Agent policy (REST policy_state enabled_for_all_orgs,
          disabled_for_all_orgs, enabled_for_selected_orgs, configured_by_org_admins) and the "Block Copilot
          cloud agent in all repositories" toggle; organisation Settings > Copilot > Cloud agent > Repository
          access, Allow automations, Runner type and Partner agents; trigger fixed by GitHub to users with write
          access
        steps:
          - title: Choose which organisations get the cloud agent
            body:
              - >-
                Enterprise > AI controls > Agents > Copilot Cloud Agent: select Enabled for selected
                organizations and pick them in the UI, or by a one-time custom-property match through the REST
                API, rather than enabling everywhere.
            url: >-
              https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-enterprise/manage-agents/enable-copilot-cloud-agent
          - title: Scope repositories and automations in each organisation
            body:
              - >-
                Organization Settings > Copilot > Cloud agent: set Repository access to Selected repositories,
                and turn the Allow automations toggle off unless automations have an owner and a reviewed tool
                set.
            url: >-
              https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-organization/add-copilot-cloud-agent
          - title: Lock where sessions run
            body:
              - >-
                Organization Settings > Copilot > Cloud agent > Runner type: choose the runner, then turn off
                Allow repositories to customize the runner type so copilot-setup-steps.yml cannot move sessions
                to other runners.
            url: >-
              https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-organization/configure-runner-for-coding-agent
          - title: Switch partner agents separately
            body:
              - >-
                On the same Cloud agent page, the Partner agents toggles enable Anthropic Claude and OpenAI
                Codex; agent apps are governed by the separate enterprise "agent apps" policy. Disabling the
                cloud agent does not disable either.
            url: >-
              https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-organization/manage-policies
        note: >-
          Rated partial on the hosted D3-APA rule. Enablement is administrable per organisation, repository and
          licensed user, and the runner, firewall (see egress) and partner-agent switches are admin-controlled,
          all enforced by GitHub server-side. But the trigger condition is fixed by GitHub, not configured: only
          users with write access can trigger or steer a session, comments from anyone else are never presented
          to the agent, and Slack guests and outside collaborators cannot start sessions. Two widening switches
          sit below the administrator: an automation's creator can opt in to events from users without write
          access, and a repository administrator can turn off Require approval for workflow runs.
          Custom-property selection of organisations is evaluated once and not kept in sync. Copilot Pro, Pro+
          and Max users have the agent on by default; in enterprise repositories only the Block toggle covers
          them.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityIga
          reviewRequired: false
          original:
            - capability: capabilityIga
              coverage: native
              mechanism: >-
                Enterprise policy Enabled for selected organizations (UI or custom properties via REST),
                organisation Repository access, per-repository opt-out; write access required to trigger
              steps:
                - title: Enable for selected organisations
                  body:
                    - "Enterprise > AI controls > Agents > Copilot Cloud Agent: choose Enabled for selected
                      organizations and pick organisations, or select them by custom property with the REST
                      API."
                  url: >-
                    https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-enterprise/manage-agents/enable-copilot-cloud-agent
                - title: Scope repositories
                  body:
                    - Organisation owners set Repository access to all or selected repositories; repository
                      owners can opt out. Only users with write access can trigger the agent.
                  url: https://docs.github.com/en/copilot/concepts/enterprise/cloud-agent-access
              verified: 2026-09-10
      - mitigation: D3-AA
        coverage: partial
        mechanism: >-
          Commits authored by Copilot and signed ("Verified") with the requester as co-author; audit events
          actor:Copilot with actor_is_agent and agent_session_id; pull requests attributed to the requesting
          person, or to Copilot's app identity from shared Slack or Teams contexts; automations attributed to
          their creator; partner agents act through the "anthropic code agent" and "openai code agent" GitHub
          Apps
        steps:
          - title: Attribute agent actions in the audit log
            body:
              - >-
                Enterprise Settings > Audit log: search actor:Copilot for agent activity (180 days on GitHub)
                and action:copilot for policy and configuration changes.
            url: >-
              https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-enterprise/review-audit-logs
          - title: Tie each event to a session and a person
            body:
              - >-
                Agentic events carry actor_is_agent=true, agent_session_id and the user who initiated the
                session; use them to separate agent actions from the person's own.
            url: https://docs.github.com/en/copilot/reference/enterprise-administrators/agentic-audit-log-events
          - title: Keep the extra approval for app-identity pull requests
            body:
              - >-
                In branch rulesets leave "Require an additional approval for unattributed Copilot pull requests"
                on (the default), so a pull request Copilot opens under its own app identity needs one more
                human approval.
            url: >-
              https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/available-rules-for-rulesets
          - title: Inventory partner-agent apps from the policy, not the installations list
            body:
              - >-
                Allow Claude coding agent installs "anthropic code agent" and Allow Codex coding agent installs
                "openai code agent"; their actions are in the audit log but the apps do not appear in the
                installations list.
            url: https://docs.github.com/en/copilot/concepts/agents/about-third-party-coding-agents
        note: >-
          Rated partial on the hosted D3-AA rule. The agent has a distinct actor for commits and audit events,
          but it is GitHub's identity, not an installation or service account the organisation inventories or
          revokes on its own. Its authority derives from the initiating user (write access to the repository;
          the agent tasks API accepts only user-to-server tokens), its pull requests are attributed to that
          person except in shared Slack or Teams contexts, and stopping it means disabling the policy, opting
          the repository out or removing the user's access — there is no per-agent credential to revoke. The
          GITHUB_COPILOT_GIT_TOKEN and GITHUB_COPILOT_API_TOKEN set in each job's sandbox are GitHub-issued;
          their lifetime is not documented. Partner-agent apps are installed by a policy toggle and are hidden
          from the organisation's app installations list.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityNhiManagement
          reviewRequired: false
          original:
            - capability: capabilityNhiManagement
              coverage: partial
              mechanism: >-
                The agent acts under its own app identity with signed ("Verified") commits, co-authored by the
                requesting human; audit events carry actor_is_agent and agent_session_id; partner agents install
                as named GitHub Apps
              note: >-
                The identity is GitHub's, not the customer's: there is no key custody or lifecycle to manage,
                only the app installations of partner agents and agent apps to review. Compared with Claude Tag:
                the organisation owns Tag's per-tool service accounts and their lifecycle; here GitHub owns the
                app identity, so the organisation manages only which installations are permitted. PR and commit
                actions carry the agent's app identity; workflow runs carry the repository's Actions token.
              steps:
                - title: Review partner-agent app installations
                  body:
                    - Enabling Claude or Codex agents installs the "anthropic code agent" / "openai code
                      agent" GitHub Apps; their actions appear in the audit log — review installations under
                      third-party access.
                  url: https://docs.github.com/en/copilot/concepts/agents/about-third-party-coding-agents
                - title: Attribute agent actions in the audit log
                  body:
                    - Filter actor:Copilot; agentic events carry actor_is_agent=true, agent_session_id and the
                      initiating user.
                  url: >-
                    https://docs.github.com/en/copilot/reference/enterprise-administrators/agentic-audit-log-events
              verified: 2026-09-10
      - mitigation: cap-agent-tool-registry
        coverage: partial
        mechanism: >-
          Enterprise custom agents in a designated .github-private governance repository (AI controls > Agents,
          "Protect agent files using rulesets", AI managers); AI controls agent sessions list (last 24 hours,
          filterable); the organisation Allow automations switch; repository configuration readable over REST;
          automations are private to their creator
        steps:
          - title: Publish approved agents from one governance repository
            body:
              - >-
                Create a .github-private repository, select it as the enterprise's source of governance, keep
                agent profiles under /agents/, and in AI controls > Agents use "Protect agent files using
                rulesets" > Create ruleset.
            url: >-
              https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-enterprise/manage-agents/prepare-for-custom-agents
          - title: Review what ran
            body:
              - >-
                Enterprise > AI controls > Agent sessions > View all lists sessions from the last 24 hours;
                filter by agent, organization, repository, status, timeframe and user.
            url: >-
              https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-enterprise/manage-agents/monitor-agentic-activity
          - title: Decide on automations as a class
            body:
              - >-
                Organization Settings > Copilot > Cloud agent > Allow automations: an automation is visible only
                to the user who created it, so leave it off where the organisation needs an inventory with
                owners.
            url: >-
              https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-organization/add-copilot-cloud-agent
          - title: Reconcile repository agent configuration
            body:
              - >-
                GET /repos/{owner}/{repo}/copilot/cloud-agent/configuration returns each repository's MCP server
                configuration, review tools, workflow-approval and firewall settings for a registry or SSPM tool
                to reconcile.
            url: https://docs.github.com/en/rest/copilot/copilot-cloud-agent-management
        note: >-
          Rated partial on the hosted registry rule. GitHub gives the enterprise a governed catalogue of custom
          agents and a 24-hour session list, but no administrator inventory of automations (each is private to
          its creator; even repository administrators cannot see it), MCP servers are registered per repository
          rather than in a registry the agent consults (the private MCP registry and its restriction do not
          apply to the cloud agent), partner-agent apps are hidden from the installations list, and nothing
          denies an agent or automation for being unregistered: the default agent and repository-level custom
          agents in .github/agents/ remain available. The only denies are class-wide — Allow automations and
          the agent policies.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAgentRegistry
          reviewRequired: false
          original:
            - capability: capabilityAgentRegistry
              coverage: partial
              mechanism: >-
                Enterprise-level custom agents (AI Controls, REST API), agent sessions list at
                github.com/copilot/agents, agent apps marketplace category
              note: >-
                The enterprise can publish approved custom agents and see sessions, but partner agents and agent
                apps are approved by policy toggle, not registered — and content exclusion and the registry
                restriction do not apply to them.
              steps:
                - title: Publish enterprise custom agents
                  body:
                    - Define custom agents at enterprise level under AI Controls or through the REST API and control who may
                      manage them.
                  url: https://docs.github.com/en/copilot/concepts/enterprise/agent-management
              verified: 2026-09-10
      - mitigation: AML.M0028
        coverage: partial
        mechanism: >-
          Repository Settings > Copilot > MCP servers "tools" arrays per server (repository administrators);
          enterprise "MCP servers in Copilot" policy (on/off); custom-agent "tools" lists; repository
          .github/hooks/*.json preToolUse deny; GitHub-fixed repository token (one branch, no git commands, no
          merge, approve or ready-for-review) under rulesets and branch protection; enterprise-managed
          permissions keys not supported on this surface
        steps:
          - title: Name the tools each MCP server may expose
            body:
              - >-
                Repository Settings > Copilot > MCP servers: set "tools" to specific read-only tool names rather
                than "*"; the agent uses configured tools autonomously and never asks for approval.
            url: https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/configure-mcp-servers
          - title: Decide the enterprise MCP switch
            body:
              - >-
                Enterprise > AI controls > MCP > "MCP servers in Copilot"; the "MCP Registry URL" and "Restrict
                MCP access to registry servers" policies do not apply to the cloud agent.
            url: >-
              https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-enterprise/manage-agents/enable-copilot-cloud-agent
          - title: Keep the GitHub MCP server on its repository-scoped token
            body:
              - >-
                By default the built-in GitHub MCP server uses a read-only token scoped to the current
                repository; do not widen it with a personal access token or GitHub App key unless the task needs
                it.
            url: https://docs.github.com/en/copilot/concepts/agents/cloud-agent/mcp-and-cloud-agent
          - title: Deny by argument with a preToolUse hook
            body:
              - >-
                Commit .github/hooks/*.json on the default branch with a preToolUse command hook returning
                permissionDecision "deny"; crashes and non-zero exits deny, timeouts allow, and "ask" is treated
                as deny.
            url: https://docs.github.com/en/copilot/reference/hooks-reference
        note: >-
          Downgraded from native to partial on the AML.M0028 rule applied to every vendor. The MCP "tools"
          arrays are per-tool on/off without argument scoping and are set per repository by its administrators,
          not locked by the organisation or enterprise; argument-level rules exist only as preToolUse hooks,
          which are repository code that anyone who can merge to the default branch can change and which fail
          open on timeout; the built-in bash, edit and view tools cannot be restricted by policy (a custom
          agent's "tools" list narrows them only when the user picks that agent); and the enterprise-managed
          permissions.deny, permissions.ask and allowedMcpServers keys are marked not supported for the cloud
          agent. There is no bypass mode to remove because every tool call is pre-approved. The strong part is
          the repository side, enforced by GitHub: one branch, no git push, no merge, approval or
          ready-for-review, subject to rulesets. Automations add a per-automation tool selection made by their
          creator; setup steps run with the GITHUB_TOKEN permissions their file declares.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityToolPermissionScoping
            - capabilityAgentRuntimeEnforcement
            - capabilityMcpToolSecurity
          reviewRequired: false
          original:
            - capability: capabilityToolPermissionScoping
              coverage: native
              mechanism: >-
                MCP configuration "tools" arrays, read-only GitHub MCP token scoped to the repository,
                per-automation tool selection, least-privilege permissions in copilot-setup-steps, no push to
                default branch / no merge
              steps:
                - title: Name the tools each MCP server may expose
                  body:
                    - In Repository Settings > Copilot > MCP servers set "tools" to the specific tool names
                      rather than "*"; Copilot uses configured tools autonomously and will not ask for
                      approval.
                  url: >-
                    https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/configure-mcp-servers
                - title: Pick tools per automation
                  body:
                    - When creating an automation choose exactly which tools it can use; Suggest tools
                      proposes a minimal set.
                  url: https://docs.github.com/en/copilot/concepts/agents/cloud-agent/about-automations
                - title: Keep setup-step permissions minimal
                  body:
                    - "Set permissions in copilot-setup-steps.yml to the lowest needed (contents: read only if
                      the step clones)."
                  url: >-
                    https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/customize-the-agent-environment
              note: >-
