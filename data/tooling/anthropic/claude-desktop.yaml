          trigger live in the organisation's TPRM platform. The Help Center lists the HIPAA-ready configuration,
          ISO 27001:2022, ISO/IEC 42001:2023 and SOC 2 Type I and Type II; the two desktop security overviews
          are behind a Trust Center access request. Assess the installer and updater as endpoint software
          (CVE-2026-22561 below); on Claude Desktop on 3P the compliance posture of inference follows the
          configured provider.
        verified: "2026-10-30"
      - mitigation: cap-sensitive-data-redaction
        coverage: partial
        mechanism: >-
          Inference hooks (Enterprise) hold each governed Claude Desktop chat request, including the results of
          local MCP and extension tool calls, for an allow or deny verdict from the organisation's DLP server;
          isLocalDevMcpEnabled and isDesktopExtensionEnabled remove the local sources; on 3P,
          quickEntryScreenshotsEnabled and quickEntryFileSharingEnabled stop Quick Entry capturing the screen or
          other apps' files
        steps:
          - title: Put your DLP inline (Enterprise)
            body:
              - >-
                At Organization settings > Data and privacy > Inference hooks turn on Allow for your
                organization, register the endpoint and signing secret, set Failure handling to Block the
                request and turn on Enforce verdicts.
            url: https://platform.claude.com/docs/en/manage-claude/inference-hooks-configuration
          - title: Turn off screen capture in Quick Entry (Claude Desktop on 3P)
            body:
              - >-
                Set quickEntryScreenshotsEnabled false (and quickEntryFileSharingEnabled false) where screenshots
                of other apps must not reach the model.
            url: https://claude.com/docs/third-party/claude-desktop/configuration
        note: >-
          Partial by the rule applied to toolClaudeWeb: the hook that can block is an attach point, and
          nothing in the app masks or tokenises a value. The hook never receives image bytes, so a Quick Entry
          screenshot is not inspected, and it is not available on Bedrock or Google Cloud. Removing local servers
          or capture is minimisation, not detection; quickEntryScreenshotsEnabled leaves a local server or
          extension that captures the screen untouched. Standard deployments have no Quick Entry key.
        verified: "2026-10-30"
      - mitigation: AML.M0028
        coverage: partial
        mechanism: >-
