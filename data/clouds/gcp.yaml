  - id: toolServiceInternalIngress
    name: "Ingress: Internal (Cloud Run), with the run.allowedIngress constraint"
    where: "Cloud Run › (MCP or tool service) › Networking › Ingress; Organization Policy › run.allowedIngress"
    setVia: [apiCli, cloudPolicy]
    area: network
    recommended: "Set ingress to Internal on every tool service and keep authentication required. Set run.allowedIngress to internal on the folder so a public tool service cannot be deployed."
    value: "Internal, authentication required"
    why: "Tool servers should answer only to calls that arrive through your VPC. The constraint applies to new deployments only, so audit existing services."
    mitigations: [D3-NI, D3-ACH]
    url: https://docs.cloud.google.com/run/docs/securing/ingress
    verified: "2026-11-18"
  - id: swpAgentRuntimeEgress
    name: "Secure Web Proxy in explicit proxy routing mode (Agent Runtime internet egress)"
    where: "Secure Web Proxy in an RFC 1918 subnet of the VPC the Private Service Connect interface attaches to; DNS peering for its hostname; proxy environment variables on the agent"
    setVia: [apiCli, code]
    area: network
    requires: "psc_interface_config on the agent. With a Private Service Connect interface, direct internet egress from the runtime is disabled."
    recommended: "Where an agent needs a public site, point it at Secure Web Proxy and allow only the destinations you approve in the proxy's policy. Give the attachment subnet no other route to the internet."
    value: "Through Secure Web Proxy, approved destinations only"
    why: "Agent Runtime gives no internet egress of its own once it is attached to your VPC, so the proxy becomes the single place where public destinations are allowed."
    mitigations: [cap-agent-egress-control]
    url: https://docs.cloud.google.com/architecture/multi-agent-private-networking-patterns
    verified: "2026-11-18"
  - id: cloudKmsAgentKey
    name: "Cloud KMS key for the Agent Runtime instance (CMEK)"
    where: "Cloud KMS › key ring in the instance's region, in a separate key project › key IAM: Cloud KMS CryptoKey Encrypter/Decrypter for the Agent Platform service agents"
    setVia: [apiCli, adminConsole]
    area: data
    default: "Google-owned and Google-managed keys."
    recommended: "A single-region key in the same region as the instance, held in a project another team administers. Grant use only to the Agent Platform and Agent Runtime service agents. Disable the key version to cut off access."
    value: "Single-region key, held by another team's project"
    why: "The key must exist before the instance and cannot be swapped afterwards, and it is the lever that makes sessions, memories and sandbox state unreadable."
