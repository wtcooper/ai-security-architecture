id: archAgenticBrowser
surface: surfaceEndpoint
title: Agentic browser and AI extension
abbrev: Agentic browser

summary:
  - >
    An agent driving a browser that is already logged into everything, or an extension reading
    every page the user opens. The page is simultaneously the untrusted input and the privileged
    context, and the session cookies are the credential.

description:
  - >
    Every other endpoint archetype has some separation between the content it reads and the
    authority it holds. Here there is none: the agent acts inside a session that is already
    authenticated to the user's mail, bank, source control and internal applications, and the
    instruction it is following arrives as text on a page served by whoever owns that page.
    Same-origin policy is the boundary the web is built on, and this archetype's job is to cross
    it — an agent that reads one origin and acts on another has done exactly what a decade of
    browser security is designed to prevent, with the user's cookies attached.
  - >
    Two variants share the shape. A dedicated agentic browser drives the session itself, with
    navigation and clicking as tools. An extension sits in the page and reads the DOM, sometimes
    with permission to act on it. The extension variant is the broader exposure in practice — host
    permissions on all sites see every page including the ones the user would never point an agent
    at, and the automatic update channel is a supply chain nobody enrolled.
  - >
    The controls that work constrain what the session can reach rather than what the agent may
    say. A separate browser profile with a narrow set of logged-in origins converts an unbounded
    blast radius into a bounded one, and is worth more than any prompt filter. In-browser
    inspection is the only vantage point with visibility into what the agent actually saw and
    clicked.
  - >
    There is no governance column in this drawing, and that absence is the finding. No policy
    engine sits between the page and the click, no audit sink records the session unless the
    browser itself does, and the applications being acted on cannot tell the agent from the user.
    What remains enforceable — profile scope, managed browser policy, egress inspection — has to
    be imposed on the endpoint from outside this architecture.

distinguishedBy:
  - >
    Against a coding agent: that one reads a repository the developer chose and acts on a
    filesystem. This one reads pages an attacker serves and acts through credentials the user
    already holds, with no working directory to scope it to.
  - >
    Against a desktop assistant with computer use: overlapping and often the same product, but the
    browser variant is worth separating because its authority is a set of authenticated web
    sessions rather than local files, and because the extension form has an update channel and a
    permission model the desktop form does not.

exemplars:
  - name: Agentic browsers
    note: >
      Browsers with a built-in agent that navigates, reads and clicks on the user's behalf inside
      their existing signed-in session.
    asOf: "2026-08"
  - name: Assistant sidebars in mainstream browsers
    note: >
      An assistant panel with access to the current page's content, and increasingly to act on it.
      Ships enabled to a very large installed base.
    asOf: "2026-08"
  - name: AI browser extensions
    note: >
      Third-party extensions requesting host permissions across all sites. The permission grant is
      one click, the update channel is automatic, and the reviewer is the store.
    asOf: "2026-08"

blocks:
  - id: user
    kind: actor
    title: User
    icon: person
    col: 0
    row: 1
    note: Sets the goal, and is usually not reading the pages the agent reads on the way to it.

  - id: agent
    kind: service
    title: Agent loop
    col: 1
    row: 1
    cosaiComponent: componentReasoningCore
    note: >
      Reads the extracted page, decides the next navigation or click, and repeats. Once page text
      is in context it is indistinguishable from the user's goal.
    items:
      - id: loop
        label: Agent loop
        icon: agent
        note: Plans the next action from the goal and everything the browser has shown it.
      - id: extraction
        label: Page extraction
        icon: doc
        note: >
          Turns a rendered page into context — the only point where hidden and off-screen content
          can be stripped before it becomes instruction, and the step most implementations skip.
      - id: actionGate
        label: Action confirmation
        icon: shield
        note: >
          Blocks before a consequential click — a purchase, a send, a permission change. Which
          actions count is a product decision, usually narrower than users assume.

  - id: provider
    kind: provider
    title: Model provider
    col: 1
    row: 0
    cosaiComponent: componentModelServing
    note: >
      The published inference interface. It receives page content from authenticated sessions,
      which is frequently more than the user realises they shared.
    items:
      - id: inference
        label: Inference API
        icon: model
        note: The completion that comes back selects the next click.

  - id: browser
    kind: service
    title: Browser runtime
    col: 2
    row: 1
    cosaiComponent: componentTools
    note: >
      Navigation, DOM reading and clicking, offered to the model as tools. Its authority is the
      profile's cookie jar, and from the browser's perspective the agent's action is the user's.
    items:
      - id: navigation
        label: Navigation & input
        icon: globe
        note: Clicks and keystrokes indistinguishable from the user's own.
      - id: domReader
        label: DOM reader
        icon: search
        note: Visible text, hidden text, alt attributes and comments — all of it becomes model input.
      - id: extensionHost
        label: Extension host & updates
        icon: plug
        note: >
          Where the extension variant lives. An automatic update channel into a component with
          permission to read every page.

  - id: profile
    kind: service
    title: Browser profile
    col: 2
    row: 2
    note: >
      Cookies, saved passwords and session tokens for every origin the user has signed into. The
      session cookies are the credential — narrowing this profile is the highest-value control in
      the archetype, and it is a configuration choice rather than a product feature.
    items:
      - id: cookies
        label: Session cookies
        icon: key
        note: Standing authentication to every signed-in origin, presented on every request.
      - id: savedLogins
        label: Saved passwords & autofill
        icon: doc
        note: Credentials the browser will happily type into a form the agent navigated to.

  - id: signedInApps
    kind: external
    title: Signed-in applications
    col: 3
    row: 1
    note: >
      Mail, banking, source control and internal tools. The agent acts on these as the user, and
      the applications cannot tell the difference — no grant was ever issued to an agent.
    items:
      - id: mailApps
        label: Mail & calendar
        icon: mail
        note: Readable and sendable as the user, on every turn.
      - id: financial
        label: Banking & payments
        icon: db
        note: Where a wrong click is a transaction.
      - id: internal
        label: Source control & internal apps
        icon: code
        note: Corporate surfaces reached through a consumer browser session.

  - id: openWeb
    kind: external
    title: Open web
    col: 3
    row: 0
    note: >
      Every page is authored by someone else, and the agent reads all of them with the same
      standing. A hostile page does not need a vulnerability — its text is already model input.
    items:
      - id: pages
        label: Arbitrary pages
        icon: globe
        note: Visible and hidden text alike, served by whoever owns the page.

edges:
  - from: user
    to: agent
    path: primary
    bidir: true
    label: goal / confirmation
    note: >
      The user states an outcome and answers confirmations. The pages that determine how the
      outcome is reached are not theirs.
  - from: agent
    to: provider
    path: primary
    bidir: true
    note: >
      Page content — including content from authenticated pages — leaves for inference; the
      completion that returns selects the next click and is not authenticated content.
  - from: agent
    to: browser
    path: primary
    bidir: true
    note: Actions out as navigation and clicks; extracted page content back in as context.
  - from: profile
    to: browser
    path: secondary
    label: session tokens
    note: >
      The cookie jar rides along on every request the agent causes. Whatever origins the profile
      is signed into, the agent can act on.
  - from: browser
    to: signedInApps
    path: external
    bidir: true
    note: >
      Authenticated requests out with the user's cookies; authenticated content — mail, records,
      internal pages — back in as model input.
  - from: browser
    to: openWeb
    path: external
    bidir: true
    route: vh
    note: >
      Browsing out; page text back in. The primary injection path — any page the agent reads can
      steer what it does on every other origin the profile reaches.

pins:
  risks:
    - risk: riskPromptInjection
      at: browser->openWeb
      note: >
        Page text is instruction once extracted — visible or hidden — and the author is whoever
        owns the page the agent happened to read.
    - risk: riskAgenticDelegationConfusedDeputy
      at: browser->signedInApps
      note: >
        Instructions from one origin act on another with the user's cookies attached. The
        application receives a request it cannot distinguish from the user's.
    - risk: riskRogueActions
      at: browser->signedInApps
      note: >
        A purchase, a send or a permission change is one click, and the set of actions the gate
        covers is narrower than users assume.
    - risk: riskSensitiveDataDisclosure
      at: agent->provider
      note: >
        Authenticated page content leaves for inference. The user consented to an assistant, not
        to a transcript of their mail.
    - risk: riskInsecureModelOutput
      at: agent->provider
      note: The completion selects a click on a real, signed-in application, and nothing authenticates its intent.
    - risk: riskCrossTenantCredentialPropagation
      at: profile
      note: >
        Every authenticated origin in the profile is in scope for every page the agent reads —
        authority pooled in one cookie jar.
    - risk: riskToolSourceProvenance
      at: browser
      note: >
        The extension update channel is automatic: one silent update changes the code that reads
        every page, with no further decision by anyone.
    - risk: riskShadowAndUnknownAgents
      at: browser
      note: >
        An extension is one click to install and appears in no inventory; assistant sidebars ship
        enabled to an installed base nobody enrolled.

  capabilities:
    - capability: capabilityCredentialIsolation
      at: profile
      note: >
        A dedicated profile with a narrow set of signed-in origins — the control that converts an
        unbounded blast radius into a bounded one.
    - capability: capabilityHitlControls
      at: agent
      note: >
        Confirmation before consequential clicks, with the covered set defined by consequence
        rather than by what the product found convenient.
    - capability: capabilityPromptInjectionDefense
      at: browser
      note: >
        Strip hidden and off-screen content at extraction, before the page becomes context. Bounds
        the injection rather than preventing it.
    - capability: capabilityBrowserDetectionResponse
      at: browser
      note: >
        In-browser inspection of what the agent read and clicked — the only vantage point that
        sees either, and often the only telemetry available.
    - capability: capabilityEgressControl
      at: browser->openWeb
      note: An allowlist on where the agent may browse and what may leave with it, enforced outside the loop.
    - capability: capabilityAiDlp
      at: agent->provider
      note: Classify and redact what page content may leave for inference, because the pages are authenticated ones.
    - capability: capabilityIga
      at: browser->signedInApps
      note: >
        Review and narrow the standing sessions the profile holds; each signed-in origin is
        authority the agent inherits.
    - capability: capabilityRateLimiting
      at: browser->signedInApps
      note: Bound the pace of authenticated actions, because the applications themselves will not distinguish agent from user.

scenarios:
  - title: A hostile page steers the agent
    steps:
      - follow: user->agent
        note: The user asks for something routine — compare prices, book a slot.
      - follow: agent->browser
        note: The agent navigates; the browser fetches whatever the task surfaces.
      - follow: openWeb->browser
        note: A page comes back carrying hidden text addressed to the agent.
      - follow: agent->provider
        note: The page becomes context, indistinguishable from the user's goal.
      - follow: browser->signedInApps
        note: The next click lands on a signed-in origin with the user's cookies attached.
  - title: Summarise my inbox
    steps:
      - follow: user->agent
        note: A legitimate request against the user's own mail.
      - follow: browser->signedInApps
        note: The browser fetches the inbox on the standing session.
      - follow: signedInApps->browser
        note: Mail content returns — including messages written by strangers, which are now model input.
      - follow: agent->provider
        note: The inbox leaves for inference, which is more than the user pictured sharing.
  - title: The extension updates itself
    steps:
      - follow: openWeb->browser
        note: >
          A silent update arrives over the store's channel into the extension host — the code that
          reads every page has changed with no decision by the user.
      - follow: browser->signedInApps
        note: The updated extension sees and can act on every authenticated page the profile reaches.

sources:
  - title: "OWASP Top 10 for Agentic Applications 2026 — ASI01 goal hijack, ASI03 privilege abuse"
    url: https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/
  - title: "OWASP Securing Agentic Applications Guide 1.0 — browser and computer-use agents"
    url: https://genai.owasp.org/resource/securing-agentic-applications-guide-1-0/
  - title: "OWASP Top 10 for LLM Applications 2026 — LLM01 prompt injection"
    url: https://genai.owasp.org/resource/owasp-genai-llm-top-10-2026/
  - title: "Five Eyes joint guidance — careful adoption of agentic AI services"
    url: https://www.ncsc.govt.nz/assets/guidance/Documents/Careful-adoption-of-agentic-AI-services_FINAL.pdf
