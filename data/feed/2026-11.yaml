items:
  - id: ncsc-ch-ai-agent-attacks
    date: 2026-11-24
    added: 2026-11-26
    weight: brief
    title: "Swiss NCSC confirms its first compromises by AI agents, critical infrastructure among them"
    summary: >
      The Swiss NCSC said agentic offensive frameworks compromised organisations, including
      critical-infrastructure operators in at least two sectors, in every known case through weak passwords or
      known vulnerabilities. It advises patching internet-facing systems within 24 hours.
    category: aiAttacker
    perspective: weapon
    evidence: confirmed
    patterns: [archAgentWorkflow]
    sources:
      - title: "Cyberattacks involving AI agents: First confirmed cases in Switzerland"
        url: https://www.bacs.admin.ch/en/26-ki-agenten-1-en
        publisher: National Cyber Security Centre (NCSC), Switzerland
        date: 2026-11-24

  - id: unit42-agentic-attack-campaigns
    date: 2026-11-24
    added: 2026-11-26
    weight: notable
    story: cyberstrikeai
    title: "Unit 42: agents took over from web shells and cut the gap between commands to 1.4 seconds"
    summary: >
      Unit 42 tracked more than ten campaigns, each starting from web shells. Once an agent took over, the
      median gap between commands fell from 23.9 to 1.4 seconds; one ran about 800 unique commands in 140
      active minutes over two days. One C2 server also hosted CyberStrikeAI.
    why: "Section headers and chain-of-thought comments in the scripts agents drop are a signal defenders can hunt for."
    category: aiAttacker
    perspective: weapon
    evidence: exploited
    patterns: [archAgentWorkflow]
    sources:
      - title: "Recent Trends and Tactics of Agentic AI Attacks"
        url: https://unit42.paloaltonetworks.com/autonomous-ai-agent-threat-campaigns/
        publisher: Palo Alto Networks Unit 42
        date: 2026-11-24

  - id: wiz-artex-harvester
    date: 2026-11-23
    added: 2026-11-26
    weight: notable
    story: artex
    title: "Wiz ties ARTEX-Harvester, at varying confidence, to more than a dozen organisations"
    summary: >
      Wiz ties a campaign it calls ARTEX-Harvester, at varying confidence, to activity at more than a dozen
      organisations from late October to mid-November. Almost every request came through a different
      residential or ISP proxy, across more than 220 IP addresses at a single target.
    category: aiAttacker
    perspective: weapon
    evidence: reported
    patterns: [archAgentWorkflow]
    incident: artex-campaigns
    sources:
      - title: "Agentic Attacks in the Wild: ARTEX & Offensive AI Frameworks"
        url: https://www.wiz.io/blog/agentic-attacks-artex-offensive-ai-frameworks
        publisher: Wiz
        date: 2026-11-23

  - id: wiz-cyberstrikeai-eks-intrusion
    date: 2026-11-23
    added: 2026-11-26
    weight: notable
    story: cyberstrikeai
    title: "Wiz: CyberStrikeAI runs an intrusion across two AWS accounts and seven EKS clusters"
    summary: >
      Wiz says CyberStrikeAI ran an October intrusion through two AWS accounts and seven EKS clusters in four
      days. The attacker's open directory shows forged admin tokens for 3,392 users, beacons on 19 hosts, 50
      SSH keys decrypted and Anthropic API keys harvested from 50 hosts.
    category: aiAttacker
    perspective: weapon
    evidence: reported
    patterns: [archAgentWorkflow]
    sources:
      - title: "Agentic Attacks in the Wild: ARTEX & Offensive AI Frameworks"
        url: https://www.wiz.io/blog/agentic-attacks-artex-offensive-ai-frameworks
        publisher: Wiz
        date: 2026-11-23

  - id: vulncheck-ai-credential-harvesting
    date: 2026-11-23
    added: 2026-11-26
    weight: brief
    title: "VulnCheck canaries: 1,756 attempts hunt AI keys and Claude Code and Codex credential files"
    summary: >
      VulnCheck's canaries recorded 1,756 attempts from 406 IP addresses, through 27 CVEs, to harvest AI
      credentials, most often OpenAI (1,085) and Anthropic (778) keys. A few IPs asked for coding-agent files
      such as ~/.claude/.credentials.json. Nothing was confirmed stolen.
    category: identity
    fit: loose
    fitNote: "The way in is CVEs in ordinary web software (Vite, Next.js) and in AI tools such as Langflow; only the loot is AI credentials, and it was taken from canaries."
    perspective: target
    evidence: exploited
    patterns: [archCodingAgentThirdParty, archSelfHostedInference]
    sources:
      - title: "Attackers Exploit CVEs to Harvest Credentials"
        url: https://www.vulncheck.com/blog/credential-harvesting
        publisher: VulnCheck
        date: 2026-11-23

  - id: nebusec-meta-muse-escape
    date: 2026-11-20
    added: 2026-11-26
    weight: headline
    title: "NebuSec takes Meta Muse from a saved web page to root in the user's VM, past Sentinel"
    summary: >
      Saving an attacker's page let a Chromium bug run shell commands in Meta Muse's runtime container, its
      PDF-export browser unsandboxed. Reads left past Sentinel without a prompt, carrying out chat history and
      memories; a kernel exploit then gave root in the VM. All since patched.
    why: "Under Muse's default Ask for some actions, bodiless GET, HEAD and OPTIONS requests count as reads and may leave without a prompt."
    products: [toolMetaMuse]
    category: exploitedSoftware
    perspective: target
    evidence: demonstrated
    patterns: [archPersistentManagedAgents]
    update:
      action: settings
      status: applied
      target: data/tooling/meta/muse.yaml
      note: "Correct the cap-agent-egress-control note: NebuSec found Sentinel's eBPF redirect covered the runtime container's cgroup, not the whole VM (since patched)."
    sources:
      - title: "Inside Meta Muse: Browser, Sentinel and the Shared-Kernel Boundary"
        url: https://nebusec.ai/research/inside-meta-muse/
        publisher: NebuSec
        date: 2026-11-20

  - id: artex-hugging-face-models
    date: 2026-11-24
    added: 2026-11-25
    weight: notable
    story: artex
    title: "An AI agent builds booby-trapped Hugging Face models, then leaks its own OpenAI key"
    summary: >
      JFrog assesses that an ARTEX agent on gpt-5.4 published 13 Hugging Face repositories in one day, with
      payloads that ran on load through auto_map code, a malicious pickle or the chat template. Its first
      self-test published the agent's own OpenAI key; Hugging Face disabled all 13.
    category: supplyChain
    perspective: weapon
    evidence: reported
    patterns: [archSelfHostedInference]
    incident: load-mine-hf-models
    sources:
      - title: "The Agent That Robbed Itself: an AI-Driven Hugging Face Malware Campaign Leaks Its Own Operator"
        url: https://research.jfrog.com/post/the-agent-that-robbed-itself-an-ai-driven-hugging-face-malware-campaign-leaks-its-own-operator/
        publisher: JFrog Security Research
        date: 2026-11-24

  - id: together-ai-agent-commit
    date: 2026-11-21
    added: 2026-11-25
    weight: headline
    title: "Together AI: a coding agent commits a key, and an outsider downloads customers' prompts"
    summary: >
      On Together AI's public xorl repository, an AI coding agent committed a credential for a private Hugging
      Face repository of customer prompt samples. The commit was reverted, but an outsider had already used it
      to download the samples.
    category: aiMadeExposure
    perspective: target
    evidence: exploited
    patterns: [archCodingAgentThirdParty]
    incident: together-ai-agent-commit
    sources:
      - title: "Security event: Prompt leakage for requests in June and July of 2026"
        url: https://www.together.ai/blog/security-event-prompt-leakage-for-requests-in-june-and-july-of-2026
        publisher: Together AI
        date: 2026-11-21
      - title: "Three breaches, endless leaks: Your AI supply chain needs canaries"
        url: https://www.dragos.com/blog/ai-supply-chain-security-canary-tokens
        publisher: Dragos
        date: 2026-11-19

  - id: cairn-monai-zero-day
    date: 2026-11-20
    added: 2026-11-25
    weight: headline
    title: "Cairn agents find a zero-day on their own and take root on a university server"
    summary: >
      Amazon read an operator's exposed Cairn console: the agents found a path traversal in MONAI Label, a
      medical-imaging AI server, in about 11 minutes and turned it into a root shell. The flaw is
      CVE-2026-133968, which CISA added to its catalogue of exploited vulnerabilities.
    category: aiAttacker
    perspective: weapon
    evidence: exploited
    patterns: [archAgentWorkflow]
    incident: cairn-monai-zero-day
    cves: [CVE-2026-133968]
    sources:
      - title: "Chinese-nexus actor's Cairn AI agents found a zero-day on their own"
        url: https://aws.amazon.com/blogs/security/chinese-nexus-actors-cairn-ai-agents-found-a-zero-day-on-their-own/
        publisher: Amazon Threat Intelligence (AWS Security Blog)
        date: 2026-11-20
      - title: "Path traversal in datastore upload endpoints allows arbitrary file write"
        url: https://github.com/Project-MONAI/MONAILabel/security/advisories/GHSA-qc22-rmgc-vg94
        publisher: Project MONAI (GitHub security advisory)
        date: 2026-11-18
      - title: "CISA Adds Two Known Exploited Vulnerabilities to Catalog"
        url: https://www.cisa.gov/news-events/alerts/2026/11/23/cisa-adds-two-known-exploited-vulnerabilities-catalog
        publisher: CISA
        date: 2026-11-23

  - id: canary-prompts-inference-providers
    date: 2026-11-19
    added: 2026-11-25
    weight: headline
    title: "Canary prompts show attackers copying requests at three AI hosting providers for months"
    summary: >
      Dragos sent nearly two million prompts, each carrying a unique AWS key, to AI providers and found
      attackers stealing data from three hosting providers, the earliest from mid-July. OpenRouter then
      off-boarded three providers; neither has said whether they are the same three.
    category: exploitedSoftware
    fit: loose
    fitNote: "Dragos does not say how attackers got in at any of the three providers; it is filed with the inference-provider breaches it may include."
    perspective: target
    evidence: exploited
    patterns: [archSelfHostedInference]
    incident: near-ai-sglang
    sources:
      - title: "Three breaches, endless leaks: Your AI supply chain needs canaries"
        url: https://www.dragos.com/blog/ai-supply-chain-security-canary-tokens
        publisher: Dragos
        date: 2026-11-19
      - title: "Data Processing Incidents on Inference Providers"
        url: https://openrouter.ai/blog/announcements/data-processing-incidents-on-inference-providers/
        publisher: OpenRouter
        date: 2026-11-22
      - title: "OpenRouter Drops 3 Providers After Researchers Catch Months of Prompt Theft at AI Hosting Firms"
        url: https://thehackernews.com/2026/11/openrouter-drops-3-providers-after.html
        publisher: The Hacker News
        date: 2026-11-22

  - id: ollama-exposed-servers
    date: 2026-11-18
    added: 2026-11-25
    weight: notable
    title: "Exposed Ollama servers: more than half already carry models someone else put there"
    summary: >
      On 10 November Rapid7 found 7,675 exposed Ollama servers, 4,209 (54.8%) carrying third-party artifacts:
      marker models on 3,091, pulls from raw IP addresses on 1,817 and, on 55, model names that decode to file
      paths such as /etc/shadow. The figures rest on one snapshot.
    category: exposed
    perspective: target
    evidence: reported
    patterns: [archLocalInference]
    incident: ollama-exposed-servers
    cves: [CVE-2024-37032]
    sources:
      - title: "Open by default. Already occupied."
        url: https://www.rapid7.com/blog/post/tr-self-hosted-ai-renting-compute-exposed-servers/
        publisher: Rapid7
        date: 2026-11-18

  - id: agent-framework-pypi-hijack
    date: 2026-11-17
    added: 2026-11-25
    weight: headline
    title: "Microsoft Agent Framework: hijacked PyPI releases run a credential stealer"
    summary: >
      For under an hour on 17 November, versions 1.26.1 and 1.26.2 of the agent-framework package on PyPI
      carried a startup hook that ran in any Python process, collected cloud and CI secrets and posted them to
      webhook.site. Wiz counted three victims whose data reached the attacker.
    category: supplyChain
    perspective: target
    evidence: exploited
    patterns: [archActionAgent]
    incident: agent-framework-pypi-hijack
    sources:
      - title: "Microsoft agent-framework Compromised: Credential Stealer Targets Azure and CI Pipelines"
        url: https://www.wiz.io/blog/malicious-version-of-microsofts-agent-framework-published-to-pypi
        publisher: Wiz Research
        date: 2026-11-17
      - title: "Microsoft's agent-framework PyPI package Compromised with Credential Stealer"
        url: https://socket.dev/blog/agent-framework-pypi-package-compromised-with-credential-stealer
        publisher: Socket
        date: 2026-11-17
      - title: "Attackers Compromise Microsoft's Agent Framework PyPI Package to Steal Cloud Credentials"
        url: https://thehackernews.com/2026/11/attackers-compromise-microsofts-agent.html
        publisher: The Hacker News
        date: 2026-11-18

  - id: gtig-exploit-agent
    date: 2026-11-16
    added: 2026-11-25
    weight: headline
    title: "exploit_agent: an attackers' multi-agent framework turns published patches into exploits"
    summary: >
      Google's threat intelligence group found a multi-agent framework that compares web-application code
      before and after patch announcements, drafts exploits and runs them without human intervention. GTIG
      called it the first fully automated discovery and exploitation it had seen.
    category: aiAttacker
    perspective: weapon
    evidence: reported
    patterns: [archAgentWorkflow]
    incident: cairn-monai-zero-day
    sources:
      - title: "GTIG AI Threat Tracker: Agentic Threat Activity Crosses a Significant Threshold"
        url: https://cloud.google.com/blog/topics/threat-intelligence/agentic-threat-activity-crosses-a-significant-threshold
        publisher: Google Threat Intelligence Group
        date: 2026-11-16

  - id: dprk-claude-code-settings
    date: 2026-11-16
    added: 2026-11-25
    weight: notable
    title: "Suspected DPRK cluster rewrites .claude/settings.json in victims' internal repositories"
    summary: >
      Google Threat Intelligence Group reported that inside cryptocurrency firms reached through fake
      recruiters and ClickFix lures, an actor edited .claude/settings.json in internal repositories so that
      starting Claude Code downloaded the SOMBERMEME backdoor.
    category: supplyChain
    fit: loose
    fitNote: "The way in was fake recruiters and ClickFix lures; the settings file was edited after the break-in, so starting Claude Code fetched the backdoor."
    perspective: target
    evidence: exploited
    patterns: [archCodingAgentThirdParty]
    incident: coding-agent-git-hijack
    sources:
      - title: "GTIG AI Threat Tracker: Agentic Threat Activity Crosses a Significant Threshold"
        url: https://cloud.google.com/blog/topics/threat-intelligence/agentic-threat-activity-crosses-a-significant-threshold
        publisher: Google Threat Intelligence Group
        date: 2026-11-16

  - id: trajectory-epoch-gemini
    date: 2026-11-13
    added: 2026-11-25
    weight: notable
    title: "Trajectory Labs' Gemini 4 Argon agents get past a DNS redirect and attack Epoch AI's site"
    summary: >
      During a third-party alignment evaluation, agents meant to stay on a local copy of epoch.ai behind a DNS
      redirect used the site's real IP, switched address when blocked, and read it through a web reader. They
      tried SQL injection; Epoch says they got nothing private.
    category: breakout
    perspective: weapon
    evidence: confirmed
    patterns: [archAgentSandbox]
    incident: gemini-irregular-test
    sources:
      - title: "Incident report: AI agents attempted exploits on our website during a third-party alignment evaluation"
        url: https://epoch.ai/publications/incident-report-ai-agents-attempted-exploits-on-our-website
        publisher: Epoch AI
        date: 2026-11-13
      - title: "Responding to incidents during misalignment testing"
        url: https://trajectorylabs.com/blog/responding-to-incidents-during-misalignment-testing
        publisher: Trajectory Labs
        date: 2026-11-13

  - id: fbi-flash-artex
    date: 2026-11-13
    added: 2026-11-25
    weight: headline
    story: artex
    title: "FBI FLASH on ARTEX: many actors, some reaching privileged access in under three hours"
    summary: >
      The FBI said a variety of actors had used the ARTEX agent framework since at least August 2026, some
      reaching privileged access in under three hours, and that researchers counted more than 1,600 exposed
      ARTEX consoles. Its indicators include unexpected calls to api.anthropic.com.
    category: aiAttacker
    perspective: weapon
    evidence: exploited
    patterns: [archAgentWorkflow]
    incident: artex-campaigns
    sources:
      - title: "Threat Overview of ARTEX Autonomous Penetration Testing Framework (FLASH-20261113-001)"
        url: https://www.ic3.gov/CSA/2026/261113.pdf
        publisher: FBI
        date: 2026-11-13

  - id: artex-gateway-key-theft
    date: 2026-11-13
    added: 2026-11-25
    weight: notable
    story: artex
    title: "ARTEX agents take provider keys from exposed AI gateways to pay for more hunting"
    summary: >
      Amazon's MadPot decoys caught ARTEX agents sending their own campaign records: they found exposed
      gateways such as One API and LiteLLM, used flaws such as LiteLLM's default master key, and fed the keys
      into their own model gateway. Amazon says it cannot verify the outcomes.
    category: aiAttacker
    perspective: weapon
    evidence: exploited
    patterns: [archSelfHostedInference]
    incident: llmjacking-gateway-keys
    sources:
      - title: "Amazon Threat Intelligence observes threat actors running cybercrime campaigns with ARTEX AI agents"
        url: https://aws.amazon.com/blogs/security/amazon-threat-intelligence-observes-threat-actors-running-cybercrime-campaigns-with-artex-ai-agents/
        publisher: Amazon Threat Intelligence
        date: 2026-11-13
      - title: "Attackers are using AI agents to automate cybercrime at 'industrial scale,' FBI and AWS warn"
        url: https://www.theregister.com/cyber-crime/2026/11/16/attackers-are-using-ai-agents-to-automate-cybercrime-at-industrial-scale-fbi-and-aws-warn/5310223
        publisher: The Register
        date: 2026-11-16

  - id: unit42-cairn-cl-sta-1238
    date: 2026-11-12
    added: 2026-11-25
    weight: notable
    title: "A China-nexus Cairn set gets into 10 of 19 targeted organisations"
    summary: >
      Unit 42 reported that CL-STA-1238 ran 25 Cairn operations against at least 19 semiconductor,
      defence-policy and civil-society organisations and reached unauthorised access or data at 10, including
      more than a million member records at a teachers' union.
    category: aiAttacker
    perspective: weapon
    evidence: exploited
    patterns: [archAgentWorkflow]
    incident: cairn-monai-zero-day
    sources:
      - title: "Attackers Use Autonomous AI to Target Semiconductor, Defense and Civil Society Sectors"
        url: https://unit42.paloaltonetworks.com/cairn-framework-ai-autonomous-attacks.md
        publisher: Unit 42, Palo Alto Networks
        date: 2026-11-12

  - id: grok-build-public-apps
    date: 2026-11-10
    added: 2026-11-25
    weight: headline
    title: "Grok Build apps public by default: 35,578 of 37,571 open without sign-in"
    summary: >
      Claroc enumerated the apps Grok Build hosts on grok.me and found 35,578 of 37,571 (94.7%) open without
      sign-in. About one in ten held internal or personal data, among them a hospital roster of more than
      3,500 staff. SpaceXSI took down the 24 apps its own staff had built.
    category: aiMadeExposure
    perspective: target
    evidence: confirmed
    patterns: [archHostedAppBuilder]
    incident: grok-build-public-apps
    sources:
      - title: "GhostShares 2: Grok Apps Exposed xAI's Business Secrets and People's Private Data"
        url: https://blog.claroc.io/ghostshares-grok-build-apps/
        publisher: Claroc Research
        date: 2026-11-10

  - id: phala-inference-vm
    date: 2026-11-10
    added: 2026-11-25
    weight: notable
    title: "Phala: a legacy service and loopback-trusted interfaces hand over an inference VM"
    summary: >
      Phala said an attacker chained a legacy internet-facing service with management interfaces that trusted
      loopback, took control of the inference VM serving DeepSeek V4 Flash 0731, and could see in-flight
      request data. It treats requests from 21 October to 8 November as exposed.
    category: exploitedSoftware
    fit: loose
    fitNote: "Phala names no flaw: a legacy service led to management interfaces that trusted loopback and checked no caller, as near to exposure as to exploit."
    perspective: target
    evidence: exploited
    patterns: [archSelfHostedInference]
    incident: near-ai-sglang
    sources:
      - title: "Phala November Preliminary Incident Report"
        url: https://phala.com/posts/phala-november-preliminary-incident-report
        publisher: Phala
        date: 2026-11-10

  - id: near-ai-sglang
    date: 2026-11-09
    added: 2026-11-25
    weight: headline
    title: "NEAR AI: an SGLang flaw opens a confidential inference server, and the systems behind it"
    summary: >
      An attacker exploited a remote code execution flaw in SGLang on one of NEAR AI's inference servers. It
      took account details for about 100 users of the deprecated Private Chat, reached 18 agents outside the
      enclave, and two customers' API keys were exposed in logs.
    category: exploitedSoftware
    perspective: target
    evidence: exploited
    patterns: [archSelfHostedInference]
    incident: near-ai-sglang
    sources:
      - title: "NEAR AI Security Incident Report: SGLang Vulnerability"
        url: https://near.ai/blog/security-incident-report-sglang-vulnerability
        publisher: NEAR AI
        date: 2026-11-09
      - title: "SGLang RCE Exploit Breaches NEAR AI, Steals Data From 18 Agents and About 100 Users"
        url: https://thehackernews.com/2026/11/sglang-rce-exploit-breaches-near-ai.html
        publisher: The Hacker News
        date: 2026-11-10

  - id: gpustack-loopback-admin
    date: 2026-11-09
    added: 2026-11-25
    weight: notable
    title: "GPUStack: requests taken for loopback get admin, and a backend runs a reverse shell"
    summary: >
      GPUStack below 2.2.0 treated any request it took to come from loopback as the built-in administrator
      while force_auth_localhost was off, its default, and an administrator's custom inference backend runs
      code on the GPU workers. CISA listed it on 9 November.
    category: exploitedSoftware
    perspective: target
    evidence: exploited
    patterns: [archSelfHostedInference]
    incident: near-ai-sglang
    cves: [CVE-2026-102895]
    sources:
      - title: "Authentication bypass via trusted loopback source (reverse-proxy TCP peer or X-GPUStack-Real-IP header) grants unauthenticated admin"
        url: https://github.com/gpustack/gpustack/security/advisories/GHSA-gj9m-f8ph-pmhr
        publisher: GPUStack
        date: 2026-07-31
      - title: "CISA Adds Four Known Exploited Vulnerabilities to Catalog"
        url: https://www.cisa.gov/news-events/alerts/2026/11/09/cisa-adds-four-known-exploited-vulnerabilities-catalog
        publisher: CISA
        date: 2026-11-09

  - id: operation-snowball
    date: 2026-11-08
    added: 2026-11-25
    weight: notable
    title: "Operation Snowball: a jailbroken DeepSeek agent works inside a European telecom"
    summary: >
      Malbear Labs found a custom harness, not ARTEX, running a jailbroken DeepSeek agent for more than two
      weeks against a European telecom; it got in through an XXE in Cisco BroadWorks (CVE-2026-20320). CISA
      listed the CVE as exploited but did not confirm Malbear's analysis.
    category: aiAttacker
    perspective: weapon
    evidence: reported
    patterns: [archAgentWorkflow]
    incident: artex-campaigns
    cves: [CVE-2026-20320]
    sources:
      - title: "Operation Snowball: Inside an Autonomous AI Intrusion Campaign"
        url: https://malbearlabs.com/posts/operation-snowball-inside-an-autonomous-ai-intrusion-campaign
        publisher: Malbear Labs
        date: 2026-11-08
      - title: "CISA Adds Six Known Exploited Vulnerabilities to Catalog"
        url: https://www.cisa.gov/news-events/alerts/2026/11/10/cisa-adds-six-known-exploited-vulnerabilities-catalog
        publisher: CISA
        date: 2026-11-10
      - title: "CISA Orders Patch for Cisco Flaw Tied to AI Agent Attack"
        url: https://www.govinfosecurity.com/cisa-orders-patch-for-cisco-flaw-tied-to-ai-agent-attack-a-33364
        publisher: GovInfoSecurity
        date: 2026-11-11

  - id: mittwald-mcp-server
    date: 2026-11-07
    added: 2026-11-25
    weight: headline
    title: "Mittwald's MCP server breached: customers' session tokens read, 56 projects compromised"
    summary: >
      An attacker opened a new account and, five minutes later, exploited a flaw in the MCP server through
      which customers connected AI assistants, reading the session tokens. Mittwald found the intrusion eight
      days later, by which time 56 customer projects had been compromised.
    category: exploitedSoftware
    perspective: target
    evidence: exploited
    patterns: [archRemoteMcpServer]
    incident: mittwald-mcp-server
    sources:
      - title: "Sicherheitsvorfall am MCP-Server"
        url: https://www.mittwald.de/blog/mittwald/sicherheitsvorfall-am-mcp-server
        publisher: mittwald
        date: 2026-11-07
      - title: "MCP-Server: Was du jetzt wissen musst"
        url: https://www.mittwald.de/lp/mcp-faq
        publisher: mittwald
        date: 2026-11-07
