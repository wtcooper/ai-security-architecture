id: archActionAgent
surface: surfaceCloud
rank: 1
title: Single agent workflow
abbrev: Single agent

summary:
  - >
    A single agent operating a business process end to end — reading a request, deciding, and
    writing to systems of record in seconds, with no human between the decision and the effect.
    The architecture where the design question is reversibility rather than accuracy.

description:
  - >
    Everything structural here follows from one fact: the agent writes. A retrieval assistant that
    is wrong produces a wrong sentence; this produces a refund, a provisioned account, a cancelled
    order. The controls that matter are the ones that bound what can be done and make it undoable,
    not the ones that improve the odds of being right.
  - >
    The tool services are the primary control, and here they should be a deterministic action
    catalogue. The model chooses among named, parameter-validated actions rather than composing
    arbitrary calls, and each action declares its own blast radius and its own compensating
    transaction. An agent that can
    call an arbitrary API is not an agent with a policy problem; it is an agent with no policy
    surface at all.
  - >
    The attacker is typically an authenticated customer. The request text is supplied by the
    person who benefits from the outcome, and it reaches the same context window as the system
    instruction — indirect prompt injection with a very short path to money. The second injection
    path arrives through retrieval: record content written months earlier, by requesters and by
    staff, re-enters the loop as context. That is why the approval threshold is tied to
    consequence rather than confidence, and why it must be rare — a gate on every action is a
    queue nobody reads, while below the threshold the compensating path, reversal rather than
    review, is what keeps a wrong action survivable.
  - >
    The agent needs an identity of its own. Actions taken as a shared service account are neither
    attributable nor separately revocable, which turns every incident into a full-service outage
    when the response is to disable the credential. And its calls leave through an AI gateway —
    brokered credentials, budget limits and the audit tap — the same crossing the durable
    multi-agent workflow draws, at single-agent scale.

distinguishedBy:
  - >
    Against the chat agent with tools: same loop, but there a human sits in the thread and
    approves as part of the conversation. Here the trigger is a queue or a timer, nobody is
    between the decision and the effect, and the catalogue, the threshold and the compensating
    transaction carry the weight the human carried there.
  - >
    Against the durable multi-agent workflow: that one is a durable, multi-agent process surviving crashes
    and replay across days. This is one agent on one fast path, deciding in seconds — no
    supervisor, no journal, no replay — and still consequential, which is why the catalogue,
    the threshold and the compensating transaction carry the weight instead of durability
    machinery. The relationship is nesting, not contrast: each of that architecture's subagents
    is this diagram one level down.

exemplars:
  - name: Autonomous customer service resolution
    note: >
      Agents that read a customer's request, consult policy and records, and issue the remedy
      without a human, escalating only above a value or confidence threshold.
    asOf: "2026-08"
  - name: Operations and fulfilment agents
    note: >
      Agents acting on orders, inventory or entitlements, where the action catalogue maps to
      existing business transactions that already have reversal semantics.
    asOf: "2026-08"

zones:
  - id: zoneUser
    owner: user
    note: >
      The requester — usually an authenticated customer, and usually the party who benefits
      from the action. Present at the start and absent for the rest of it.
  - id: zoneCloud
    owner: cloud
    note: >
      Everything we operate: the surface the request arrives on, what triggers the loop when
      nobody sends one, the loop itself, its state, the crossing every call leaves through, and
      our own tool servers and systems of record.
  - id: zoneExternal
    owner: external
    note: Outside the company — the model provider, third-party tool servers, and the services an action lands on.
  - id: zoneGovernance
    owner: governance
    note: >
      Drawn across every band because it governs every band. With no human in the loop, this
      band is the whole of the oversight — there is no in-thread approval to fall back on.

blocks:
  - id: events
    kind: service
    title: Triggers & schedules
    cosaiComponent: componentAgentUserQuery
    zone: zoneCloud
    col: 1
    row: 0
    note: >
      Queue messages, file drops, webhooks and timers that start the loop with no human in the
      room. In many deployments this is the common trigger and the front end is the exception,
      which is the fact that reorganises this architecture's whole control set.
    items:
      - id: schedules
        label: Schedules & events
        icon: clock
        note: The timer or queue message that starts a run nobody asked for interactively.

  - id: entry
    kind: service
    title: Application front end
    cosaiComponent: componentApplication
    zone: zoneCloud
    col: 1
    row: 1
    note: >
      The surface a request arrives on, and where the requester's identity is bound before the
      loop runs. Drawn even though triggers are the common path, because when a human does
      start a run this is the component that decides whose authority it carries.
    items:
      - id: api
        label: App & API endpoint
        icon: globe
        note: The published request surface.
      - id: authn
        label: Identity binding
        icon: shield
        note: Who is asking, bound before the loop runs — the identity the actions are taken on behalf of.

  - id: requester
    kind: actor
    title: Requester
    icon: person
    zone: zoneUser
    col: 0
    row: 1
    note: >
      Usually an authenticated customer, and usually the party who benefits from the action. Both
      the legitimate user and, on a bad day, the attacker.

  - id: localTools
    kind: service
    title: Tool services
    cosaiComponent: componentTools
    zone: zoneCloud
    parent: planner
    col: 0
    row: 1
    note: >
      The tools compiled into the application itself — decorated functions running in the
      loop's own process, under its identity, with its egress and its secrets. This is the
      default and most common way a tool gets attached, and the reason it is drawn: **the
      in-process tool set is invisible to any gateway**. Only what leaves over the network
      shows up at a chokepoint, so whatever lives here is governed by code review or by
      nothing.
    items:
      - id: inProcess
        label: Tool handlers
        icon: code
        note: Functions in the application, holding whatever the application holds.
      - id: connectors
        label: APIs & connectors
        icon: plug
        note: Ordinary outbound calls the application makes itself, without a broker in front.

  - id: planner
    kind: service
    title: Agent harness
    zone: zoneCloud
    col: 2
    row: 1
    cosaiComponent: componentReasoningCore
    note: >
      Chooses the next action from the catalogue, given the request and what it has read. Runs
      under its own workload identity, distinct from both the requester and the service.
    items:
      - id: loop
        label: Agent loop
        icon: agent
        note: Reads context, calls the model, proposes an action. The full cycle completes in seconds.
      - id: context
        label: Context assembly
        icon: doc
        note: Merges the instruction, the memory and the tool results into one prompt.

  - id: stateRetrieval
    kind: service
    title: Memory & state
    zone: zoneCloud
    col: 2
    row: 2
    cosaiComponent: componentDataStorage
    note: >
      The business policy, the customer's history and the working state of this case. Record
      content is the second injection path — written by requesters and staff, re-entering as
      context.
    items:
      - id: retrieval
        label: Search index
        icon: search
        cosaiComponent: componentRAGContent
        note: Reads scoped to the account under discussion, not to what the service can reach.
      - id: caseState
        label: Case state
        icon: folder
        cosaiComponent: componentMemory
        note: >
          Scoped to one case. Cross-case memory would let one requester's text influence
          another's outcome.

  - id: gateway
    kind: service
    title: AI gateway
    zone: zoneCloud
    col: 3
    row: 1
    note: >
      The one crossing every model and tool call leaves through. The agent tier holds no
      standing credentials; the gateway brokers them per call, meters spend and writes the
      audit trail as a tap on the crossing. Its items are the traffic classes it brokers — the
      checks it runs are the numbered pins on this block and its edges, and the call-outs
      beneath.
    pack: aiGatewayTraffic

  - id: internalTools
    kind: service
    title: Tool services
    zone: zoneCloud
    col: 4
    row: 3
    cosaiComponent: componentTools
    pack: toolServicesRemote
    note: >
      Our own action surface, and this architecture's primary control. Whatever the transport,
      what is admitted here should form a deterministic catalogue — named, parameter-validated
      actions with a declared blast radius and a compensating transaction — rather than
      arbitrary calls. With no human in the loop, this is what stands in for approval.

  - id: provider
    kind: provider
    title: Model provider
    zone: zoneExternal
    col: 5
    row: 1
    cosaiComponent: componentModelServing
    note: The published inference interface. What runs behind it is the provider's and is not drawn.
    items:
      - id: inference
        label: Inference API
        icon: model
        note: Returns the chosen action and its parameters — content the catalogue validates rather than trusts.

  - id: orgData
    kind: external
    title: Enterprise data
    zone: zoneCloud
    col: 4
    row: 4
    cosaiComponent: componentDataSources
    note: >
      The systems where effects land, and where reversal either exists or does not — and the
      source the tool surface reads back into context on the same hop. Record content written
      by requesters and staff is this architecture's second injection path, and it arrives by
      the same edge the writes leave on.
    items:
      - id: transactions
        label: Org data
        icon: db
        note: Orders, accounts and entitlements — the authoritative state the agent changes.
      - id: fileStorage
        label: File storage
        icon: folder
        note: Case documents and attachments, read back into context on a later run.

  - id: extTools
    kind: service
    title: Tool services
    zone: zoneExternal
    col: 5
    row: 2
    cosaiComponent: componentTools
    pack: toolServicesRemote
    items:
      - id: peers
        label: A2A peer agents
        icon: agent
        note: Cross-org delegation over the A2A protocol. A peer's output enters the loop as input.
    note: >
      Third-party servers, connectors and peer agents, out where nobody we contracted with
      operates them. Admitted by assessment at the crossing, or refused there.

  - id: downstream
    kind: external
    title: Downstream services
    cosaiComponent: componentDataSources
    zone: zoneExternal
    col: 5
    row: 3
    pack: downstreamPublic
    note: >
      Where an action lands outside the company — mail sent, tickets moved, calendar entries
      written on the requester's behalf — and where the untrusted content that returns enters
      the next model call.

  - id: govIdentity
    kind: governance
    title: Identity services
    icon: person
    zone: zoneGovernance
    col: 1
    row: 5
    capabilities: [capabilityIga, capabilityNhiManagement]
    note: >
      Issues the agent's workload identity and the requester's, and keeps them distinct. The
      loop runs as itself and acts on the requester's grant — conflating the two is how an
      unattended agent quietly acquires standing authority.

  - id: govSecrets
    kind: governance
    title: Secrets & key management
    icon: key
    zone: zoneGovernance
    col: 2
    row: 5
    capabilities: [capabilitySecretsManagement]
    note: Short-lived credentials minted per call, so a loop running with nobody watching holds no standing keys.

  - id: govPolicy
    kind: governance
    title: Policy & authorization
    icon: scale
    zone: zoneGovernance
    col: 3
    row: 5
    capabilities: [capabilityToolPermissionScoping, capabilityEgressControl, capabilityRateLimiting]
    note: >
      The bounds the tool surface enforces per invocation, authored and changed outside the
      loop — because the loop is the thing that may be misbehaving.

  - id: govSupplyChain
    kind: governance
    title: Supply-chain assurance
    icon: db
    zone: zoneGovernance
    col: 4
    row: 5
    capabilities: [capabilityAgentRegistry, capabilityModelEvals]
    note: >
      Which actions exist at all — admission, not discovery — and the behavioural checks in
      front of every model, prompt or catalogue change.

  - id: govObservability
    kind: governance
    title: Observability & response
    icon: eye
    zone: zoneGovernance
    col: 5
    row: 5
    capabilities: [capabilityAuditLogging, capabilityKillSwitch, capabilityHitlControls]
    note: >
      The decision audit and the stop, plus the approval threshold — keyed to irreversibility
      and value rather than model confidence, and rare enough that somebody actually reads it.

edges:
  - from: events
    to: planner
    path: primary
    label: trigger
    note: >
      A timer, queue message, file drop or webhook starts a run with nobody in the room. In
      many deployments this is the common path and the request surface is the exception.
  - from: requester
    to: entry
    path: primary
    bidir: true
    label: request / outcome
    note: >
      When a human does start a run, this is where their identity is bound — and the outcome
      is what they see rather than the reasoning that produced it.
  - from: entry
    to: planner
    path: primary
    bidir: true
    note: The request arrives with the requester's identity attached; the outcome returns the same way.
  - from: planner
    to: stateRetrieval
    path: primary
    bidir: true
    note: >
      Business policy, the customer's history and the working state of this case, read back as
      context and written forward as the run proceeds.
  - from: planner
    to: gateway
    path: primary
    bidir: true
    label: model & tool calls
    note: >
      Every call out of the loop crosses here on a brokered credential. The agent tier holds no
      standing keys of its own.
  - from: gateway
    to: provider
    path: external
    bidir: true
    note: >
      Inference on the brokered credential. The completion names the action and its parameters
      — content the tool surface validates rather than trusts.
  - from: gateway
    to: internalTools
    path: primary
    bidir: true
    route: vh
    label: internal tool calls
    note: >
      The proposed action, admitted against the catalogue and narrowed to a scoped grant before
      anything executes.
  - from: internalTools
    to: orgData
    path: primary
    bidir: true
    label: scoped reads & writes
    note: >
      Where the effect lands and where reversal either exists or does not — and where record
      content written by requesters and staff is read back into a later run as context.
  - from: gateway
    to: extTools
    path: external
    bidir: true
    label: brokered external calls
    route: vh
    note: Third-party servers and peer agents, reached only through the crossing that admitted them.
  - from: extTools
    to: downstream
    path: external
    bidir: true
    note: >
      Actions landing outside the company, and the untrusted content that returns into the next
      model call with nobody reading it first.

pins:
  risks:
    - risk: riskPromptInjection
      at: requester->entry
      note: >
        The request text is supplied by the person who benefits from the outcome, and it reaches
        the same context window as the system instruction.
    - risk: riskPromptInjection
      at: internalTools->orgData
      note: >
        Record content is the harder injection path — written months earlier, by someone handling
        a different case, re-entering as context now.
    - risk: riskRogueActions
      at: internalTools->orgData
      note: >
        Untrusted request text, a model choosing among real transactions, and a write path into
        records compound here.
    - risk: riskInsecureModelOutput
      at: gateway->provider
      note: The completion names an action and its parameters, and it is unauthenticated content.
    - risk: riskAgenticDelegationConfusedDeputy
      at: planner
      note: >
        The agent acts on a requester's behalf using authority broader than theirs. Keeping the
        requester's context alive through the loop is what closes the gap.
    - risk: riskSensitiveDataDisclosure
      at: internalTools->orgData
      note: Reads not scoped to the account under discussion pull other customers' records into context.
    - risk: riskRunawayAgentToolLoops
      at: planner
      note: A loop that retries and re-plans in seconds can spend and act faster than anyone notices.
    - risk: riskPromptResponseCachePoisoning
      at: stateRetrieval
      note: Case memory keyed loosely enough to collide across cases lets one requester's text steer another's outcome.
    - risk: riskToolRegistryTampering
      at: internalTools
      note: The catalogue is the policy surface; whoever can edit it programs the agent.
    - risk: riskEconomicDenialOfWallet
      at: gateway
      note: Per-token inference behind an open trigger surface makes unbounded requests a spend problem.

  capabilities:
    - capability: capabilityIga
      at: requester->entry
      note: >
        Who is asking, established before the loop runs — the identity every downstream action
        is taken on behalf of, and the thing that bounds the reachable set.
    - capability: capabilityAgentRegistry
      at: gateway->internalTools
      note: >
        Actions exist because the catalogue admitted them, not because a model named them.
        Admission, not discovery — the primary control in an architecture with no human gate.
    - capability: capabilityModelEvals
      at: gateway->provider
      note: >
        Behavioural checks in front of every model, prompt or catalogue change, because with
        nobody watching a run there is no later opportunity to notice the change was wrong.
    - capability: capabilityToolPermissionScoping
      at: gateway->internalTools
      note: >
        Named, parameter-validated actions with declared blast radius and a compensating
        transaction each — the deterministic surface everything else assumes.
    - capability: capabilityHitlControls
      at: internalTools->orgData
      note: >
        An approval gate keyed to irreversibility and value, rare enough to be read; below it,
        reversal rather than review.
    - capability: capabilityAgentRuntimeEnforcement
      at: gateway->internalTools
      note: >
        A per-invocation policy decision — this action, this record, this value, now — rather
        than a session-time grant.
    - capability: capabilityNhiManagement
      at: planner
      note: A distinct, revocable workload identity per agent, so actions are attributable and separately revocable.
    - capability: capabilityDataAccessGovernance
      at: internalTools->orgData
      note: Entitlement-filtered retrieval scoped to the account under discussion, enforced before fetching.
    - capability: capabilityPromptInjectionDefense
      at: requester->entry
      note: Classify request text before the loop; the caller cannot be trusted about their own request.
    - capability: capabilityMemoryProtection
      at: stateRetrieval
      note: Case-scoped memory with hard boundaries — no cross-case reads, ever.
    - capability: capabilitySecretsManagement
      at: planner->gateway
      note: Brokered, per-workload, expiring model credentials; the agent tier holds no standing key.
    - capability: capabilityRateLimiting
      at: gateway
      note: Quotas and cost ceilings on the crossing, before token spend and action volume are committed.
    - capability: capabilityEgressControl
      at: extTools->downstream
      note: >
        Named destinations only. The catalogue bounds what can be done; the egress allowlist
        bounds where it can land — the last boundary between a content-borne injection and an
        attacker's collection endpoint.
    - capability: capabilityAuditLogging
      at: govObservability
      note: >
        Every action with reasoning, inputs and identity, written where the agent can append and
        cannot amend.
    - capability: capabilityKillSwitch
      at: govObservability
      note: A halt that also revokes the agent's identity, and does not require a deploy.

flows:
  - id: F1
    title: A run nobody started
    moves: A timer, queue message, file drop or webhook, straight into the loop.
    path: [events->planner]
    threats: [A trigger nobody reviewed starting a run with real authority, File and webhook content read as instruction]
    controls: [capabilityNhiManagement, capabilityAgentRuntimeEnforcement]
    note: >
      The defining flow. In many deployments this is the common path and the request surface is
      the exception — which removes the human gate the chat agent leans on and pushes the whole
      control set onto the catalogue and the governance band.
  - id: F2
    title: A run a person started
    moves: A request in, the outcome back — with the requester's identity bound to it.
    path: [requester->entry, entry->planner]
    threats: [The request text is written by the party the action benefits, Identity of convenience rather than of the asker]
    controls: [capabilityIga, capabilityHitlControls]
    note: >
      The exception path, drawn because when a human does start a run this is where the
      authority it carries is decided.
  - id: F3
    title: Model inference
    moves: The request and everything read so far out; the chosen action and its parameters back.
    path: [planner->gateway, gateway->provider]
    threats: [Completion treated as a decision rather than a proposal, Runaway loop metered only by the invoice]
    controls: [capabilityModelEvals, capabilityRateLimiting]
    note: >
      What returns names an action. It is validated against the catalogue rather than trusted,
      which is the difference between this architecture and a script with a model in it.
  - id: F4
    title: The action lands
    moves: A validated, scoped action into our systems of record — and what it reads back.
    path: [planner->gateway, gateway->internalTools, internalTools->orgData]
    threats: [Irreversible effect with no compensating transaction, Grant wider than the case, Record content re-entering a later run as instruction]
    controls: [capabilityToolPermissionScoping, capabilityHitlControls, capabilityAgentRegistry]
    note: >
      The canonical chain, and where this archetype's real question is settled: whether the
      effect can be reversed. The approval threshold is keyed to irreversibility and value, not
      to model confidence.
  - id: F5
    title: Outside the company
    moves: Actions landing on third-party services, and the content that returns.
    path: [planner->gateway, gateway->extTools, extTools->downstream]
    threats: [Exfiltration with nobody reading the output, Untrusted content returning into the next model call, A peer agent's output entering the loop as input]
    controls: [capabilityEgressControl, capabilityPromptInjectionDefense, capabilityAuditLogging]
    note: >
      The same shape as every other architecture's external leg, and more dangerous here for
      one reason: no human reads what comes back before the next action runs on it.
  - id: F6
    title: The case persists
    moves: Policy, customer history and working state, read back and written forward.
    path: [planner->stateRetrieval]
    threats: [Cross-case memory letting one requester's text influence another's outcome, Record content as the second injection path]
    controls: [capabilityMemoryProtection, capabilityDataAccessGovernance]
    note: >
      Reads scoped to the account under discussion rather than to what the service can reach.
      That distinction is the whole of the control.

scenarios:
  - title: A customer asks for a refund
    steps:
      - follow: requester->entry
        note: The request arrives authenticated and bound to an account; the loop starts with that identity intact.
      - follow: planner->stateRetrieval
        note: Policy and the customer's history load as context, scoped to this account.
      - follow: planner->gateway
        note: The context leaves the loop through the gateway, on a brokered credential.
      - follow: gateway->provider
        note: The model proposes an action and parameters from the catalogue.
      - follow: gateway->internalTools
        note: The proposal is validated — well-formed, in policy, under the value threshold.
      - follow: internalTools->orgData
        note: The refund executes, with its compensating transaction on file.
      - follow: entry->requester
        note: The outcome returns within seconds; the audit holds the reasoning.
  - title: The request text is the attack
    steps:
      - follow: requester->entry
        note: >
          The text instructs the agent to ignore policy and refund in full; whatever survives
          classification enters the same context window as the system instruction.
      - follow: planner->gateway
        note: Whatever survived classification rides out with the context.
      - follow: gateway->provider
        note: A steered model proposes the most generous action available.
      - follow: gateway->internalTools
        note: The catalogue does not care what steered the model — parameters and policy bounds hold.
      - follow: internalTools->orgData
        note: Below the threshold the action is compensable; above it the approval gate fires.
  - title: The injection was written months ago
    steps:
      - follow: planner->stateRetrieval
        note: The loop reads the case history like any other.
      - follow: planner->gateway
        note: The loop crosses first — nothing on the agent tier reaches a tool surface directly.
      - follow: gateway->internalTools
        note: The lookup is admitted against the catalogue and narrowed to this case.
      - follow: internalTools->orgData
        note: A note written into a record long ago, in someone else's case, comes back as context.
      - follow: planner->gateway
        note: The assembled context — injected note included — leaves for the model.
      - follow: gateway->provider
        note: The model reads it beside the system instruction with nothing marking it apart.
      - follow: gateway->internalTools
        note: The catalogue and the per-call policy are the controls that were built for exactly this turn.

