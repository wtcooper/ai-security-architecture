id: archManagedAgentRuntime
surface: surfaceSaas
rank: 3
title: API/SDK managed agent runtime
abbrev: API/SDK runtime

summary:
  - >
    A vendor's API-driven hosted agent service: the loop, the memory, the sandbox and the tool
    gateway supplied as published, separately billed products, driven through an SDK or API
    rather than a builder UI. The customer owns the front end, the agent definitions, the tools
    admitted, the identities and the audit export. The governance plane arrives built in, and
    the trade is that it is configured rather than designed.

description:
  - >
    Every provider converged on the same decomposition: a runtime, a memory service, a tool
    gateway, an identity service, a code interpreter and browser, observability, evaluation and
    policy. That convergence is itself the finding — the governance plane most self-built agent
    architectures never get is exactly what these services sell. The provider blocks on this
    diagram are drawn because they are documented, separately addressable products, not
    inferred internals; the loop's execution behind them remains genuinely uninspectable.
  - >
    The consequential choice is between the managed harness and the code escape hatch. Every
    provider offers both: a declarative agent whose loop they run, and a bring-your-own-code
    runtime where they supply the sandbox and the identity but the loop is the customer's. The
    first inherits the platform's guardrails automatically; the second inherits only what it
    explicitly calls. Teams routinely start with the first, hit a limitation, move to the
    second, and do not notice which controls stopped applying.
  - >
    Managed memory is the component most likely to be switched on without a decision. Its scope
    — per session, per user, or shared across users — is a configuration flag with a
    data-protection consequence, and cross-user scope means one user's content can shape
    another's turn.
  - >
    The genuine advantage is agent identity: first-class, revocable principals distinct from
    the service and from the user, supplied as a service. Using them properly — rather than
    collapsing everything onto one service principal — is most of what separates a
    well-governed deployment from a poorly governed one on the same platform. The costs are
    portability and opacity: the policy language moves to no other provider, and debugging a
    misbehaviour means reading traces rather than code.

distinguishedBy:
  - >
    Against building the agent tier: the same components with the provider supplying them. The
    work moves from designing an identity model, a policy engine and a sandbox to configuring
    three, and from having to build observability to having to export it.
  - >
    Against the UI/low-code managed agent runtime: same hosting model, different author. Here
    engineers define agents in code against an SDK or API, and the software-delivery pipeline —
    review, versioning, staged rollout — still applies to the definition even though the loop
    is the vendor's. The low-code sibling replaces that pipeline with a builder UI and a
    publish button, which moves the risk from the definition to the population.

exemplars:
  - name: Frontier-lab managed agent APIs
    note: >
      Agent runtimes operated by the model vendor and driven entirely through an API — a hosted
      loop with a managed sandbox, invoked by the customer's code, with sessions and memory as
      API resources.
    asOf: "2026-08"
  - name: Hosted background coding agents
    note: >
      Vendor-run remote agents that take a task and a repository grant and work unattended in
      the vendor's environment, reporting back as pull requests or session transcripts.
    asOf: "2026-08"
  - name: Hyperscaler agent runtimes
    note: >
      Managed agent services decomposed into runtime, memory, gateway, identity, sandbox,
      observability, evaluation and policy, billed per component and driven through SDKs.
    asOf: "2026-08"
  - name: Managed harness with a code escape hatch
    note: >
      A declarative agent the provider runs, alongside a bring-your-own-code runtime for cases
      the declarative form cannot express. The pair is now standard across providers.
    asOf: "2026-08"

zones:
  - id: zoneUser
    owner: user
    note: The people the published agent serves.
  - id: zoneCloud
    owner: cloud
    note: >
      What we still own on a platform somebody else operates: the surface the request arrives
      on, the deployable that decides what the agent may do, and the gateway that admits the
      vendor's runtime back into our systems.
  - id: zoneVendor
    owner: vendor
    note: >
      The provider's environment, under an enterprise agreement — runtime, memory, sandbox and
      their tool brokerage, each a separately billed product behind one control plane. What
      they implement inside it is assured, not drawn.
  - id: zoneExternal
    owner: external
    note: Where the agent's actions land outside both environments.
  - id: zoneGovernance
    owner: governance
    note: >
      Drawn across every band because it governs every band. On a platform we do not operate,
      this band is most of what "our controls" can mean.

blocks:
  - id: endUser
    kind: actor
    title: End user
    icon: person
    zone: zoneUser
    col: 0
    row: 1
    note: >
      Whose identity should reach the tool call, rather than being replaced by the agent's along
      the way.

  - id: agentDef
    kind: service
    title: Agent definition & code
    zone: zoneCloud
    col: 1
    row: 0
    cosaiComponent: componentAgentSystemInstruction
    note: >
      The deployable artifact that decides what the agent may do — instructions, tool
      configuration, or the customer's own loop code. Treating it with less rigour than
      application code is common and unwarranted.
    items:
      - id: definition
        label: Declarative definition
        icon: doc
        note: Instructions and tool bindings the provider's harness runs, inheriting platform guardrails automatically.
      - id: customCode
        label: Custom loop code
        icon: code
        note: The escape hatch. It inherits only the controls it explicitly calls.

  - id: frontEnd
    kind: service
    title: Application front end
    zone: zoneCloud
    col: 1
    row: 1
    cosaiComponent: componentApplication
    note: >
      The customer's surface, where the user's identity is established — and where output
      handling still belongs, because only the application knows where the text will land.
    items:
      - id: ui
        label: App & API endpoint
        icon: globe
        note: The published entry point users and systems call.
      - id: identity
        label: Identity binding
        icon: shield
        note: Who is calling, bound here and carried into the runtime — or the agent acts as itself for everyone.

  - id: managedRuntime
    kind: provider
    title: Managed runtime
    zone: zoneVendor
    col: 3
    row: 1
    cosaiComponent: componentReasoningCore
    note: >
      The hosted loop, invoked and configured through published interfaces; the execution itself
      is not inspectable. Provider code in the path, released on the provider's schedule, with
      the customer's agent inside it.
    items:
      - id: runtimeApi
        label: Runtime API
        icon: plug
        note: Where agents are invoked and sessions managed — the published surface over an unreadable loop.
      - id: declarativeHarness
        label: Declarative harness
        icon: agent
        note: The provider runs the loop and applies guardrails automatically.
      - id: codeRuntime
        label: Custom-code runtime
        icon: code
        note: The customer's loop in the provider's container — sandbox and identity supplied, guardrails only on request.

  - id: managedMemory
    kind: provider
    title: Managed memory
    zone: zoneVendor
    col: 3
    row: 0
    cosaiComponent: componentDataStorage
    note: >
      A documented, separately billed memory service whose scope — session, user or cross-user —
      is selected by configuration. Cross-user scope means one user's content reaches another's
      turn, and it is a flag rather than a design review.
    items:
      - id: memoryStore
        label: Memory store
        icon: folder
        cosaiComponent: componentMemory
        note: What the agent keeps between turns and reads back as context.
      - id: scopeConfig
        label: Scope configuration
        icon: gear
        note: The whole control, in one flag.

  - id: managedSandbox
    kind: provider
    title: Managed sandbox
    zone: zoneVendor
    col: 3
    row: 3
    note: >
      Code interpreter and hosted browser, isolated by the provider. Among the strongest reasons
      to choose a managed runtime over building the tier — and the isolation guarantee is a
      vendor claim the customer cannot test. The direction of travel is hybrid: providers now
      offer sandboxes and even runtime compute that live in the customer's own perimeter,
      trading the untestable claim for operational ownership.
    items:
      - id: interpreter
        label: Code interpreter
        icon: code
        note: Generated code runs here, not in the application's process.
      - id: browser
        label: Hosted browser
        icon: globe
        note: Web content is fetched and rendered inside the provider's isolation.

  - id: toolGateway
    kind: provider
    title: Managed tool gateway
    zone: zoneVendor
    col: 4
    row: 1
    note: >
      The provider's brokered path to tools and MCP servers, with scoping and logging supplied.
      Reached automatically by a declarative agent and only on request by custom code — the
      asymmetry deployments most often lose coverage to.
    items:
      - id: brokering
        label: Scoped tool brokering
        icon: key
        note: >
          Per-tool grants under the agent's own identity, not a service-wide credential — with
          user tokens held in the platform's vault and exchanged on the user's behalf, never
          pasted into configuration.
      - id: mcpEndpoints
        label: MCP & connectors
        icon: plug
        note: The tool population the customer admits — the part of the tool plane the customer owns.

  - id: aiGateway
    kind: service
    title: AI gateway
    zone: zoneCloud
    col: 2
    row: 2
    note: >
      The customer-operated crossing where the vendor's hosted agents are admitted into org
      tools and data — the connector marketplace on the organisation's own gateway tier. The
      only way those agents get the access they need, and the place that access is governed:
      which connectors exist, on what scoped grants, recorded by whom.
    pack: aiGatewayTraffic

  - id: downstream
    kind: external
    title: Downstream services
    cosaiComponent: componentDataSources
    zone: zoneExternal
    col: 5
    row: 2
    note: >
      The records the agent acts on under grants the customer issues, and the external content
      it reads — which comes back as context nothing has authenticated.
    items:
      - id: records
        label: Org data
        icon: db
        note: Reached under grants issued to the platform, ideally per tool and per agent.
      - id: webContent
        label: Web & APIs
        icon: globe
        note: Documents and pages the agent reads; the platform's guardrails see it, nothing vouches for it.

  - id: govIdentity
    kind: governance
    title: Identity services
    icon: person
    zone: zoneGovernance
    col: 1
    row: 5
    capabilities: [capabilityIga, capabilityNhiManagement]
    note: >
      Agent identities issued and governed by us rather than minted inside the platform, so
      the question "whose authority did this run on" has an answer we own.

  - id: govSecrets
    kind: governance
    title: Secrets & key management
    icon: key
    zone: zoneGovernance
    col: 2
    row: 5
    capabilities: [capabilitySecretsManagement, capabilityEncryptionKeyManagement]
    note: >
      Our keys in their system. BYOK and customer-managed encryption are zone-2 controls — the
      configurable surface of a vendor platform, which is the part we can actually insist on.

  - id: govPolicy
    kind: governance
    title: Policy & authorization
    icon: scale
    zone: zoneGovernance
    col: 3
    row: 5
    capabilities: [capabilityToolPermissionScoping, capabilityEgressControl]
    note: >
      What the hosted agent may reach in our systems, decided at our gateway rather than in
      the vendor's console — the one control that does not depend on their implementation.

  - id: govSupplyChain
    kind: governance
    title: Supply-chain assurance
    icon: db
    zone: zoneGovernance
    col: 4
    row: 5
    capabilities: [capabilityAgentRegistry, capabilityAiTprm]
    note: >
      Which agents and tools are admitted, and the vendor assessment behind the platform
      itself. Their internals are assured here rather than drawn anywhere.

  - id: govObservability
    kind: governance
    title: Observability & response
    icon: eye
    zone: zoneGovernance
    col: 5
    row: 5
    capabilities: [capabilityAuditLogging, capabilityKillSwitch]
    note: >
      Their export fused with our gateway's record, because a trail that exists only in the
      vendor's console is a trail we cannot query during an incident.

edges:
  - from: endUser
    to: frontEnd
    path: primary
    bidir: true
    label: request / response
    note: The surface we still own, and where the user's identity is bound before anything is invoked.
  - from: agentDef
    to: frontEnd
    path: primary
    bidir: true
    label: deploy
    note: >
      The deployable that decides what the agent may do, pushed into an environment we do not
      operate. What it declares is the whole of the agent's behaviour contract.
  - from: frontEnd
    to: managedRuntime
    path: external
    bidir: true
    label: invoke agent
    note: >
      Out to the approved platform. Allowlisted because an assessment cleared it, and governed
      by the agreement once it arrives rather than inspected on the way.
  - from: managedRuntime
    to: managedMemory
    path: external
    bidir: true
    label: session & memory
    note: >
      A separately billed memory service whose scope is a configuration flag — which makes
      cross-session and cross-user reach a setting rather than an architecture.
  - from: managedRuntime
    to: managedSandbox
    path: external
    bidir: true
    label: code & browsing
    note: Provider-operated execution and browsing. The boundary is theirs, and so is our assurance of it.
  - from: managedRuntime
    to: toolGateway
    path: external
    bidir: true
    note: The provider's brokered path to tools, and the last hop still inside their environment.
  - from: toolGateway
    to: aiGateway
    path: external
    bidir: true
    route: vh
    label: vendor boundary
    note: >
      The zone-3 crossing: a hosted agent reaching back into our systems. Their gateway hands
      to ours rather than reaching in, which is the whole reason our gateway is drawn.
  - from: aiGateway
    to: downstream
    path: external
    bidir: true
    label: scoped tool calls / content
    note: >
      Scoped, short-lived grants issued by us — and the untrusted content that returns into a
      loop running somewhere we cannot see.

pins:
  risks:
    - risk: riskAgenticDelegationConfusedDeputy
      at: frontEnd->managedRuntime
      note: Three identities are in play — the application's, the user's and the agent's — and the failure is collapsing them into one.
    - risk: riskShadowAndUnknownAgents
      at: agentDef
      note: A managed runtime makes agents cheap to create, so the population grows faster than the inventory.
    - risk: riskInsecureIntegratedComponent
      at: managedRuntime
      note: The runtime, its memory, its gateway and its sandbox are the provider's code in the path, released on the provider's schedule.
    - risk: riskAgentDelegationChainOpacity
      at: managedRuntime
      note: The loop is not inspectable; traces are the only window, and they only exist where the platform emits them.
    - risk: riskSensitiveDataDisclosure
      at: managedMemory
      note: Cross-user memory scope puts one user's content in another user's turn, selected by a configuration flag.
    - risk: riskPromptInjection
      at: aiGateway->downstream
      note: Content read through tools re-enters the loop as context; the platform's guardrails see it, nothing authenticates it.
    - risk: riskRogueActions
      at: aiGateway->downstream
      note: Consequential writes on customer systems from a loop nobody watches, bounded only by the grants the marketplace issued.
    - risk: riskAgenticDelegationConfusedDeputy
      at: toolGateway->aiGateway
      note: >
        A hosted agent arriving with a connector grant is the vendor's infrastructure
        exercising the customer's authority — the crossing where a steered agent's request
        is indistinguishable from a legitimate one.
    - risk: riskStaleAgentIdentityBinding
      at: toolGateway->aiGateway
      note: Revocable per-agent principals only help if revocation actually happens when agents are retired or repurposed.
    - risk: riskToolRegistryTampering
      at: toolGateway
      note: The admitted tool list programs the agents; whoever writes it decides what every agent can be made to do.
    - risk: riskInsecureModelOutput
      at: frontEnd
      note: The runtime's response is unauthenticated content, and only the application knows whether it is about to be rendered or executed.

  capabilities:
    - capability: capabilityKillSwitch
      at: toolGateway->aiGateway
      note: >
        Revocation we can execute ourselves. On a platform we do not operate, the stop that
        matters is the one at our own boundary — theirs is a request, ours is a fact.
    - capability: capabilityNhiManagement
      at: govObservability
      note: Use the platform's per-agent identities — distinct, revocable principals — instead of collapsing every agent onto one service principal.
    - capability: capabilityIga
      at: endUser->frontEnd
      note: Establish the user's identity here and propagate it to the tool call, so authorization stays per-user.
    - capability: capabilitySecretsManagement
      at: aiGateway
      note: >
        Grants issued at the marketplace are short-lived, connector-scoped and backed by the
        organisation's own keys — the vendor's environment never holds a standing org
        credential it could lose.
    - capability: capabilityEncryptionKeyManagement
      at: govObservability
      note: >
        BYOK everywhere the platform supports it — the grants the marketplace issues and the
        data the vendor holds both sit on keys the organisation can revoke.
    - capability: capabilityEgressControl
      at: aiGateway->downstream
      note: >
        Hosted agents reach the connectors the marketplace names and nothing else — the org
        side of the boundary is deny-by-default.
    - capability: capabilityToolPermissionScoping
      at: managedRuntime->toolGateway
      note: >
        The standard permission gate between harness and tools: per-tool, per-agent grants
        enforced at the gateway, not a standing credential shared by everything.
    - capability: capabilityAgentRegistry
      at: agentDef
      note: Admit and inventory agent definitions like deployable code, because that is what they are.
    - capability: capabilityModelGuardrails
      at: managedRuntime
      note: Verify guardrail coverage on the custom-code path explicitly — declarative agents get it free, the escape hatch does not.
    - capability: capabilityMemoryProtection
      at: managedRuntime->managedMemory
      note: Set memory scope per session or per user as a reviewed decision; treat cross-user scope as a design exception.
    - capability: capabilityAiGovernancePlatform
      at: managedRuntime
      note: >
        Author the platform's per-invocation policy through governed intake and configuration —
        the customer's half of the shared-responsibility shape, enforced by the provider inside
        the loop.
    - capability: capabilityAgentObservability
      at: managedRuntime
      note: Traces of steps, tool calls and decisions are the only window into an unreadable loop; turn all of it on.
    - capability: capabilityAuditLogging
      at: govObservability
      note: Export the trail — a trace that lives only in the provider's console cannot be correlated with anything else.
    - capability: capabilityModelEvals
      at: agentDef
      note: Gate every definition change behind adversarial evaluation before it reaches a production alias.
    - capability: capabilityAiTprm
      at: managedRuntime->managedSandbox
      note: >
        Keep code execution and browsing on the provider's isolated path — and assure the
        isolation claim the way any critical vendor control is assured, because it cannot be
        tested from your side.

flows:
  - id: F1
    title: Deploy and invoke
    moves: The deployable that defines the agent, and the requests that then drive it.
    path: [agentDef->frontEnd, endUser->frontEnd, frontEnd->managedRuntime]
    threats: [A definition that declares more capability than the task needs, Identity bound at our surface but acted on in theirs]
    controls: [capabilityIga, capabilityAgentRegistry]
    note: >
      The deployable is the behaviour contract — on a runtime we do not operate, what it
      declares is very nearly the whole of what we control about the agent itself.
  - id: F2
    title: Inside the platform
    moves: Session state, memory and sandboxed execution, all provider-operated.
    path: [managedRuntime->managedMemory, managedRuntime->managedSandbox]
    threats: [Memory scope as a configuration flag rather than an architecture, Provider-operated execution we cannot inspect, Separately billed products with separately configured isolation]
    controls: [capabilityEncryptionKeyManagement, capabilityAiTprm]
    note: >
      Zone 1 and zone 2 side by side: what they implement is assured rather than drawn, and
      what we can configure — scope, retention, our own keys — is the part worth insisting on.
  - id: F3
    title: Back across the boundary
    moves: A hosted agent reaching into our systems, and the content that returns to it.
    path: [managedRuntime->toolGateway, toolGateway->aiGateway, aiGateway->downstream]
    threats: [Their infrastructure exercising our authority, Standing org credentials living in a vendor cloud, Untrusted content returning into a loop we cannot see]
    controls: [capabilityToolPermissionScoping, capabilitySecretsManagement, capabilityKillSwitch]
    note: >
      The zone-3 crossing, and the reason our own gateway is drawn at all: their gateway hands
      to ours rather than reaching in, so the grants are ours to scope and ours to revoke.

scenarios:
  - title: A user's request becomes a tool call
    steps:
      - follow: endUser->frontEnd
        note: The user's identity is established at the customer's own surface.
      - follow: frontEnd->managedRuntime
        note: The invocation carries two identities — the application's and the user's.
      - follow: managedRuntime->toolGateway
        note: The loop plans; the tool call leaves under the agent's own principal, scoped per tool.
      - follow: toolGateway->aiGateway
        note: The call crosses the vendor boundary and is admitted by the customer's own marketplace.
      - follow: aiGateway->downstream
        note: The action lands on customer systems under the scoped, BYOK-backed grant the marketplace issued.
      - follow: downstream->aiGateway
        note: Whatever was read returns as context nothing has authenticated.
      - follow: managedRuntime->frontEnd
        note: The response comes back; output handling is still the application's job.
  - title: A team takes the code escape hatch
    steps:
      - follow: agentDef->frontEnd
        note: The declarative definition is replaced with custom loop code after hitting a limitation.
      - follow: managedRuntime->toolGateway
        note: Tool brokering now happens only if the code calls the gateway — nothing routes it there automatically.
      - follow: managedRuntime->managedMemory
        note: The guardrails and scoping the declarative harness applied for free now apply only where the code asks. Nobody notices which controls stopped.
  - title: Memory scope crosses users
    steps:
      - follow: frontEnd->managedRuntime
        note: User A's turn runs, and the agent writes what it learned.
      - follow: managedRuntime->managedMemory
        note: The write lands in a store whose scope flag was left at a shared default.
      - follow: managedMemory->managedRuntime
        note: User B's turn reads it back as context — one user's content shaping another's session, looking like a feature.

