# Cursor Cloud Agents — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# Excluded: Cursor Origin (git forge, early beta 2026-08-17) — code hosting, not an agent runtime; its
# admin switch and the code-egress concern are recorded as facts below and in README Exclusions.
# 2026-09-15: added sandboxing, egress, runtime enforcement, credential isolation and MCP rows after the managed-runtime drawing pinned them; fetched cloud-agent/security, security-network, settings, identity, hooks, enterprise/model-and-integration-management (all 200).
# 2026-09-25: re-verified toolCursorCloudAgents against the MITRE capability rules; no redirects or failures (all URLs 200;
# docs read through the .md variants). Moved: Protected Git Scopes is documented on
# enterprise/model-and-integration-management, not security-hardening; automations' "Team Owned" is now Run as → Service
# account; the hooks page lists beforeMCPExecution as not available in cloud agents.
vendor: cursor
family: Cursor Cloud Agents
tools:
  - id: toolCursorCloudAgents
    name: Cursor Cloud Agents
    surfaceClasses:
      - cloudAgent
      - chatIntegration
      - ciIntegration
    variants:
      - name: Cursor Web (cursor.com/agents)
        class: cloudAgent
        url: https://cursor.com/docs/cloud-agent
      - name: Cursor for iOS
        class: cloudAgent
        url: https://cursor.com/docs/cloud-agent/mobile
      - name: Cloud Agents API / SDK
        class: cloudAgent
        url: https://cursor.com/docs/cloud-agent/api/endpoints
      - name: Self-Hosted Machines (My Machines, Team Pools)
        class: cloudAgent
        url: https://cursor.com/docs/cloud-agent/self-hosted
      - name: "@cursor in Slack"
        class: chatIntegration
        url: https://cursor.com/docs/integrations/slack
      - name: "@cursor in Linear"
        class: chatIntegration
        url: https://cursor.com/docs/cloud-agent
      - name: "@cursor on GitHub / Bitbucket pull requests"
        class: ciIntegration
        url: https://cursor.com/docs/integrations/github
      - name: Bugbot
        class: ciIntegration
        url: https://cursor.com/docs/bugbot
      - name: Security Agents (Security Reviewer, Vulnerability Scanner)
        class: ciIntegration
        url: https://cursor.com/docs/security-agents
      - name: Approval Agents (PR Routing & Approval) and Automations
        class: ciIntegration
        url: https://cursor.com/docs/approval-agents
    architecture: archHostedAgentSessions
    status: ga
    asOf: "2026-09"
    summary:
      - >-
        Cloud Agents (formerly Background Agents) run the Cursor agent in a Firecracker microVM in a dedicated
        AWS account, one VM boundary per agent rather than a shared process sandbox. They clone repositories
        through a Cursor GitHub / GitLab / Bitbucket / Azure DevOps app an account admin connected, work on a
        branch and hand back a draft pull request. Triggers are the web app, iOS, the Desktop Cloud dropdown,
        @cursor in Slack, Linear, GitHub or Bitbucket, the Cloud Agents API (public beta) and Automations that
        fire on schedules, source-control, Slack, Linear, Sentry, PagerDuty or webhook events. Bugbot,
        Security Agents and Approval Agents are Cloud Agents wired to pull-request events; Self-Hosted
        Machines move tool execution onto customer workers while the agent loop and inference stay in Cursor's
        cloud.
      - >-
        Inference runs on Cursor's hosted providers under Privacy Mode (Cloud Agents do not support Legacy
        Privacy Mode and never train on accessed code). Code is stored temporarily while a run executes;
        conversation state is retained indefinitely by default until deleted, VM snapshots are deleted after
        90 days idle. Data at rest is AES-256 with per-agent keys, TLS 1.2+ in transit, and Enterprise teams
        can bring a customer-managed KMS key (CMEK/BYOK). Egress leaves from published CIDR ranges
        (docs/ips.json) and a fixed three-IP git proxy; AWS PrivateLink or Cloudflare Tunnel reach private git
        servers and registries.
      - >-
        The admin surface is the dashboard's Cloud Agents section plus Enterprise settings: a network-access
        policy (Allow all / Default + allowlist / Allowlist only) that admins can lock org-wide, Runtime
        Secrets that are redacted from transcripts, tool output and commits, OIDC federation (issuer
        api.cursor.com, 5-minute RS256 tokens) so agents assume cloud roles without stored credentials,
        Protected Git Scopes and Repository Blocklist, and per-team toggles for agent summaries in Slack, Team
        follow-ups, Long running agents and Computer use. The default network policy is allow-all, and an
        Approval Agent can be configured to approve low-risk pull requests itself — both defaults an
        organisation should decide on deliberately.
    facts:
      - label: Plans
        value: >-
          Any paid Cursor plan can run Cloud Agents. Enterprise-only: network-policy lock, CMEK, PrivateLink /
          Cloudflare Tunnel, service accounts, Team Pools for Self-Hosted Machines, audit log and SIEM,
          OpenTelemetry export, Computer use toggle, Cloud Agent retention policies (early access). The Admin API,
          Bugbot Admin API included, is available on Teams and Enterprise.
        url: https://cursor.com/docs/cloud-agent
      - label: Inference & routing
        value: >-
          Self-Hosted Machines keep inference and planning in Cursor's cloud and send only the content the
          agent needs; workers connect outbound to api2.cursor.sh, api2direct.cursor.sh and the artifacts S3
          bucket.
        url: https://cursor.com/docs/cloud-agent/self-hosted/integrations
      - label: Data leaving the device
        value: >-
          Nothing runs on the developer's device; the repository, secrets and environment live in the VM.
          Slack, GitHub and Linear see agent summaries and diffs (file paths included) unless the Display
          agent summary toggles are off; Slack Connect guests are governed by a separate external-channels
          toggle.
        url: https://cursor.com/docs/cloud-agent/settings
      - label: Data retention / training
        value: >-
          Privacy Mode always: Cursor never trains on code accessed by Cloud Agents or on their prompts and
          responses. Conversation state is retained indefinitely by default and deletable on demand; VM
          snapshots auto-delete after 90 days of inactivity; the runtime workspace is recycled when idle.
          Secrets are KMS-encrypted at rest.
        url: https://cursor.com/docs/cloud-agent/security
      - label: Docs index
        value: >-
          Cloud Agents documentation (overview, security, secrets and network, identity, settings, private
          connectivity, self-hosted, automations, API).
        url: https://cursor.com/docs/cloud-agent
      - label: Isolation
        value: >-
          Firecracker microVMs in a dedicated AWS account segregated from other Cursor services; one VM
          boundary per agent.
        url: https://cursor.com/docs/cloud-agent/security
      - label: Egress
        value: >-
          Published CIDR ranges per cluster (us3p, us4p, us5p) at cursor.com/docs/ips.json and a three-IP git
          egress proxy (184.73.225.134, 3.209.66.12, 52.44.113.131); the default network allowlist matches the
          desktop sandbox's defaults.
        url: https://cursor.com/docs/cloud-agent/security-network
      - label: Private connectivity
        value: >-
          AWS PrivateLink (endpoint service com.amazonaws.vpce.us-east-1.vpce-svc-054b15427d4bea2b7 for the
          api2.cursor.sh webhook path) or Cloudflare Tunnel for GitHub Enterprise Server, GitLab Enterprise,
          Bitbucket Data Center and package registries; shared by Cloud Agents, Bugbot and backend services;
          Enterprise only, arranged via hi@cursor.com.
        url: https://cursor.com/docs/cloud-agent/private-connectivity
      - label: Cursor Origin (excluded surface)
        value: >-
          Cursor's git forge, early beta since 2026-08-17 on Pro, Teams and Enterprise, mirroring a GitHub
          repository one-way (GitHub stays the source of truth); admins can disable Origin for the team from
          the dashboard, and a namespace must be claimed before enabling. Left out of the registry as code
          hosting rather than an agent runtime; treat repositories mirrored into Origin as a code-egress path
          to review.
        url: https://cursor.com/docs/origin
      - label: Vendor ownership
        value: >-
          SpaceX closed its acquisition of Anysphere (Cursor) on 2026-08-15; Cloud Agent infrastructure and
          subprocessors should be re-confirmed under the new owner.
        url: https://techcrunch.com/2026/08/15/spacex-officially-closes-its-cursor-acquisition/
    riskNotes:
      - risk: riskPromptInjection
        note: >-
          A Cloud Agent reads repository content, PR comments, Slack threads and Linear issues as instructions
          and can browse the web; the vendor's stated mitigations are egress restriction, Runtime Secret
          redaction and the draft-PR gate. The default network policy is allow-all, so the first mitigation
          only exists once an admin locks Allowlist only.
      - risk: riskAgenticDelegationConfusedDeputy
        note: >-
          The GitHub App is installed with eight permission categories including Administration; the agent can
          only reach repositories the triggering user could, but Automations run under the `cursor` account or
          a service account and Approval Agents can approve PRs on their own criteria — a machine identity
          approving machine-authored changes unless you keep approvals off.
      - risk: riskCrossTenantCredentialPropagation
        note: >-
          OIDC tokens identify the whole run (cloud_agent_id, team_id, repo_urls) and any process on the VM
          can mint one from the local socket; scope IAM trust policies on aud and sub, not on the token
          existing. Egress IPs are shared across Cursor clusters, not per customer.
      - risk: riskSensitiveDataDisclosure
        note: >-
          Agent summaries and diffs are posted into Slack, GitHub and Linear by default; conversation state
          persists indefinitely. Turn off Display agent summary in external channels, mark credentials as
          Runtime Secrets and set a deletion routine through the API.
      - risk: riskShadowAndUnknownAgents
        note: >-
          Anyone on a paid plan can create Automations and any team member can create Private ones that run as
          and bill to themselves; Protected Git Scopes, admins' ability to view and disable Private automations,
          and an admin switching Run as to Service account are the levers that bring them under the team.
    controls:
      - mitigation: D3-APA
        coverage: partial
        mechanism: >-
          Source-control connection by a Cursor admin plus the Git provider admin's app install on chosen
          repositories; Protected Git Scopes (dashboard Integrations tab) and Repository Blocklist; Team follow-ups;
          Remote Control and Allow / Require Self-Hosted Machines under Dashboard → Cloud Agents → Self-Hosted
        steps:
          - title: Gate Cloud Agents behind the source-control connection
            body:
              - Cloud Agents start only after a Cursor admin connects source control and a Git provider admin
                installs the Cursor app on the repositories you choose; each user then connects their own Git
                account, and a run never reaches a repository the triggering user could not already reach.
            url: https://cursor.com/docs/cloud-agent/security
          - title: Lock the Git organisation to your Cursor organisation
            body:
              - Claim the scope under Protected Git Scopes from the dashboard's Integrations tab (a team admin who
                is also a Git provider admin) so only your teams run Cloud Agents, automations and Bugbot on it,
                and list sensitive repositories under Repository Blocklist (Enterprise).
            url: https://cursor.com/docs/enterprise/model-and-integration-management
          - title: Decide who may steer a running agent
            body:
              - Set Team follow-ups in the Cloud Agents security settings to Disabled or Service accounts only;
                All lets any teammate with repository access instruct an agent that holds another user's secrets.
            url: https://cursor.com/docs/cloud-agent/settings
          - title: Keep Remote Control off until someone owns it
            body:
              - Leave Remote Control off under Cursor Dashboard → Cloud Agents → Self-Hosted; when an admin enables
                it, Cursor also enables the team's self-hosted worker access.
            url: https://cursor.com/docs/cloud-agent/mobile
        note: >-
          Rated partial on the hosted rule. Enablement is organisation-level only: the gate is the admin's
          source-control connection, and no per-role or per-group Cloud Agents switch is documented, so any paid
          member with repository access can start runs. The trigger condition is not admin-configurable: @cursor
          in Slack, GitHub, Bitbucket and Linear admits any linked Cursor user with access to the repository,
          automation "Comment added" triggers name no restriction on the commenter, and Bugbot runs for all
          contributors to enabled repositories. The widening switches are admin-controlled and enforced by
          Cursor's control plane: Remote Control, Allow / Require Self-Hosted Machines
          (https://cursor.com/docs/cloud-agent/self-hosted), Team follow-ups, Computer use and Sync Skills for
          Cloud Agents. Protected Git Scopes covers cloud and self-hosted GitHub and GitLab.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityIga
          reviewRequired: false
          original:
            - capability: capabilityIga
              coverage: native
              mechanism: >-
                Team SSO / SCIM; source-control connection by an account admin; Protected Git Scopes; Remote
                Control and Self-Hosted enablement under Dashboard → Cloud Agents
              steps:
                - title: Gate who can trigger agents
                  body:
                    - Members authenticate through the team's SSO; a Cursor account admin must connect GitHub,
                      GitLab, Bitbucket or Azure DevOps before any agent can clone, and the GitHub App can be
                      installed on Selected repositories only.
                  url: https://cursor.com/docs/integrations/github
                - title: Lock your git organisation to your Cursor organisation
                  body:
                    - Enable Protected Git Scopes (needs GitHub org owner or admin) so only your Cursor teams
                      can use those repositories with Cloud Agents and Bugbot.
                  url: https://cursor.com/docs/enterprise/security-hardening
                - title: Decide on Remote Control and self-hosted workers
                  body:
                    - Under Cursor Dashboard → Cloud Agents → Self-Hosted enable or disable Remote Control for
                      members; enabling it also enables the team's self-hosted worker access.
                  url: https://cursor.com/docs/cloud-agent/mobile
              verified: 2026-09-10
      - mitigation: D3-AA
        coverage: partial
        mechanism: >-
          Per-run OIDC tokens (issuer https://api.cursor.com, 5-minute RS256, sub user:<id> or
          service_account:<id>); Enterprise service accounts under Dashboard → Settings → API Keys → Service
          Accounts; automation Run as → Service account; the Cursor GitHub App installation
        steps:
          - title: Give unattended work its own principal
            body:
              - Create Enterprise service accounts under Dashboard → Settings → API Keys → Service Accounts; keys
                are shown once, Rotate invalidates the old key immediately, Archive revokes every key, and runs a
                service account starts are visible to all team admins.
            url: https://cursor.com/docs/account/enterprise/service-accounts
          - title: Move automations off personal identities
            body:
              - Set an automation's Run as to Service account (team admins only) so it runs under its own
                automation-<id> service account instead of its creator's auth.
            url: https://cursor.com/docs/cloud-agent/automations
          - title: Authorize federated calls on the run's claims
            body:
              - Trust the issuer https://api.cursor.com, require your aud, and pin sub (user:<id>,
                service_account:<id>, or team_id via sub_claim) plus cloud_agent_id and repo_urls in the trust
                policy.
            url: https://cursor.com/docs/cloud-agent/identity
        note: >-
          Rated partial on the hosted rule. An interactive run acts as its triggering user: the OIDC sub is
          user:<id> by default, runs set to Run as Me open pull requests as the user's GitHub account, and the
          GitHub App reaches only what that user can. A distinct principal that is inventoried and revocable
          separately exists only for Enterprise service accounts (API runs and automations set to Run as Service
          account). The per-run OIDC token is a real workload credential bound to cloud_agent_id, but any process
          on the VM can mint it and nothing revokes it beyond its five-minute life. Issuance is Cursor's control
          plane, authorization your IAM trust policy, revocation archiving the service account or removing the
          member.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityNhiManagement
          reviewRequired: false
          original:
            - capability: capabilityNhiManagement
              coverage: native
              mechanism: >-
                OIDC federation (issuer https://api.cursor.com, discovery /.well-known/openid-configuration,
                keys /keys); Enterprise service accounts
              steps:
                - title: Federate agent identity instead of storing keys
                  body:
                    - Create an IAM OIDC provider (or GCP WIF, Azure federated credential, Vault JWT auth)
                      trusting https://api.cursor.com; agents mint 5-minute RS256 tokens from the VM socket
                      with claims sub (user:<id> or service_account:<id>), aud, cloud_agent_id, team_id,
                      repo_urls and agent_runtime=managed.
                  url: https://cursor.com/docs/cloud-agent/identity
                - title: Give automation its own identity
                  body:
                    - Create Enterprise service accounts under Dashboard → Settings → API Keys → Service
                      Accounts; keys are shown once, can be rotated, and archiving the account revokes them;
                      runs are visible to all team admins.
                  url: https://cursor.com/docs/account/enterprise/service-accounts
              note: The token identifies the run, not a process — any process with socket access can mint one.
              verified: 2026-09-10
      - mitigation: cap-agent-tool-registry
        coverage: partial
        mechanism: >-
          Automations list (team admins view and disable Private automations); Run as → Service account with
          automation-<id> service accounts; Cloud Agents dashboard Environments view; Bugbot /bugbot/repos
        steps:
          - title: Bring automations under the team
            body:
              - Team admins can view and disable any automation, Private ones included, and only admins can set
                Run as to Service account, which gives the automation its own service account billed to the team
                pool.
            url: https://cursor.com/docs/cloud-agent/automations
          - title: Review shared environments
            body:
              - The Environments view in the Cloud Agents dashboard lists each saved environment with its
                repositories, install script, runtime and build secrets, network access and version history.
            url: https://cursor.com/docs/cloud-agent/settings
          - title: Enumerate what Bugbot is enabled on
            body:
              - List repositories and their settings with /bugbot/repos and set enabled or manualTriggerOnly per
                repository with /bugbot/repo/update, using a team Admin API key.
            url: https://cursor.com/docs/bugbot
        note: >-
          Partial on the hosted rule. The dashboard lists automations, environments, self-hosted workers and
          service accounts, but nothing is denied for being unlisted: any paid member can start runs or create a
          Private automation billed to themselves, and there is no approval state or declared-capability record.
          Cursor's control plane holds the inventory; reconciliation against the organisation's register is the
          organisation's.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAgentRegistry
          reviewRequired: false
          original:
            - capability: capabilityAgentRegistry
              coverage: partial
              mechanism: >-
                Dashboard → Cloud Agents and Automations lists; service accounts visible to admins; Bugbot
                repository list via /bugbot/repos
              steps:
                - title: Bring automations under the team
                  body:
                    - Admins can view, disable and promote automations to Team Owned (regenerates webhook keys and OAuth);
                      Private and Team Visible automations otherwise bill and belong to their creator.
                  url: https://cursor.com/docs/cloud-agent/automations
                - title: Enumerate what Bugbot is enabled on
                  body:
                    - List repositories and settings with /bugbot/repos and set enabled or manualTriggerOnly per repository with
                      /bugbot/repo/update.
                  url: https://cursor.com/docs/bugbot
              note: >-
                No approval workflow or declared-capability record; the lists are inventories, not a register
                with reconciliation.
              verified: 2026-09-10
      - mitigation: AML.M0028
        coverage: partial
        mechanism: >-
          Enterprise team hooks (preToolUse, beforeShellExecution with failClosed) as the only per-call gate;
          Computer use and Long running agents team toggles; per-automation tools; Cursor app on chosen
          repositories, Protected Git Scopes and Repository Blocklist
        steps:
          - title: Scope repository reach
            body:
              - Give the Cursor app access only to the repositories agents need, list sensitive ones under
                Repository Blocklist (Enterprise), and claim the Git organisation under Protected Git Scopes.
            url: https://cursor.com/docs/enterprise/model-and-integration-management
          - title: Switch off built-in capabilities the team does not need
            body:
              - In the Cloud Agents dashboard's Team feature settings turn off Computer use (Enterprise) and Long
                running agents; changes apply to new agents immediately.
            url: https://cursor.com/docs/cloud-agent/settings
          - title: Give each automation only the tools it needs
            body:
              - Enable only the automation tools a workflow needs (Send to Slack, Read Slack channels, MCP server,
                Memories, Computer use); an MCP server tool exposes every tool that server offers.
            url: https://cursor.com/docs/cloud-agent/automations
          - title: Distribute a deny hook from the dashboard
            body:
              - Publish an Enterprise team hook on preToolUse (Shell, Read, Write, MCP tools, Task) that returns
                deny for disallowed tools or arguments, with failClosed true; any deny wins over project hooks.
            url: https://cursor.com/docs/hooks
        note: >-
          Rated partial on the rule applied to every vendor. Cursor ships no declarative per-tool or per-argument
          permission rules for Cloud Agents and the agent auto-runs every terminal command, so per-call allow and
          deny exists only as org-written hook code (an attach point) distributed as Enterprise team hooks, which
          do not run during the read-only exploratory turns and cannot use beforeMCPExecution in the cloud. The
          product-enforced levers bound repositories (app installation, Protected Git Scopes, Repository
          Blocklist), network (Lock Network Access Policy) and whole capabilities (Computer use, Long running
          agents, per-automation tools). Cursor does not scope the repository token to one branch; default-branch
          protection is the forge's branch protection. The Enterprise MCP allowlist page does not state that it
          applies to Cloud Agents, and users can add personal MCP servers at cursor.com/agents, so the connector
          allowlist is not credited here.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityToolPermissionScoping
            - capabilityAgentRuntimeEnforcement
            - capabilityMcpToolSecurity
          reviewRequired: false
          original:
            - capability: capabilityToolPermissionScoping
              coverage: native
              mechanism: >-
                GitHub App scope (Selected repositories; access never wider than the triggering user);
                Protected Git Scopes; Repository Blocklist; Team feature settings (Long running agents,
                Computer use); per-automation tool enablement; MCP allowlist
              steps:
                - title: Scope repository reach
                  body:
                    - Install the GitHub App on Selected repositories, keep the Repository Blocklist for
                      sensitive repos, and rely on the rule that a Cloud Agent can only reach repositories the
                      triggering user could.
                  url: https://cursor.com/docs/cloud-agent/security
                - title: Manage the blocklist by API
                  body:
                    - Read and update repository blocklist glob patterns through
                      /settings/repo-blocklists/repos.
                  url: https://cursor.com/docs/account/teams/admin-api
                - title: Switch off tools the team does not need
                  body:
                    - In Cloud Agent dashboard settings disable Computer use and Long running agents, and set
                      Team follow-ups to Disabled or Service accounts only.
                  url: https://cursor.com/docs/cloud-agent/settings
                - title: Keep the MCP allowlist in force
                  body:
                    - The Enterprise MCP Configuration applies to cloud runs; Automations only get the tools
                      (PRs, Slack, MCP, memory, computer use) you enable per automation.
                  url: https://cursor.com/docs/enterprise/model-and-integration-management
              note: >-
                Repository scope, blocklists and Protected Git Scopes limit resources; per-automation tool
                enablement hides tools; there is no pre-approval layer because runs are unattended. MCP tools
                follow the MCP allowlist.
              verified: 2026-09-10
            - capability: capabilityAgentRuntimeEnforcement
              coverage: partial
              mechanism: Command-based repository hooks (beforeShellExecution, beforeMCPExecution, preToolUse) with
                failClosed run in cloud agents once the environment is writable; Enterprise MCP Configuration
                Tools field; Protected Git Scopes and Repository Blocklist
              steps:
                - title: Commit fail-closed command hooks
                  body:
                    - Cloud agents run command-based hooks from the repository (prompt-based hooks are not
                      supported there); set failClosed true on beforeShellExecution and beforeMCPExecution so
                      a crashed or timed-out hook blocks rather than allows.
                  url: https://cursor.com/docs/hooks
                - title: Restrict MCP tools centrally
                  body:
                    - Use the Tools field per server in the Enterprise MCP Configuration to name the tools a
                      server may run; it applies to Cloud Agents as well as the IDE.
                  url: https://cursor.com/docs/enterprise/model-and-integration-management
              note: "Rated partial on the same rule as Copilot cloud: the hooks are repository code, writable by anyone with
                push access, not enterprise policy, and they do not run during the read-only exploratory turns
                a run starts with. The deterministic administrator rules bound tools and repositories, not
                individual shell commands."
              verified: 2026-09-15
            - capability: capabilityMcpToolSecurity
              coverage: native
              mechanism: "Enterprise MCP Configuration: allowlist by full command string or URL with wildcards, per-server
                network mode (Allow all, Allowlist, Deny all, No sandbox) and Tools field; applies to Cloud
                Agents"
              steps:
                - title: Allowlist servers for cloud runs
                  body:
                    - Add each permitted server by command string or URL pattern in the Enterprise MCP
                      Configuration and give local servers an Allowlist or Deny all network mode; the
                      configuration applies to Cloud Agents and Bugbot as well as the IDE.
                  url: https://cursor.com/docs/enterprise/model-and-integration-management
              note: "Rated native on the same rule as Cursor in the IDE: admission by identity, organisation-wide. Admission
                is not integrity — nothing pins the tool descriptions a server returns or detects a changed
                implementation between runs."
              verified: 2026-09-15
      - mitigation: AML.M0029
        coverage: partial
        mechanism: >-
          Draft pull request a person reviews and merges in the forge; PR Routing & Approval with risk-based
          approval left off; automation Comment on pull request tool with approvals disabled; Team follow-ups
        steps:
          - title: Keep the merge gate human
            body:
              - In PR Routing & Approval use routing only, or set approval criteria and Maximum Risk Threshold
                deliberately, because the agent can approve low-risk PRs; keep required human review in your forge.
            url: https://cursor.com/docs/approval-agents
          - title: Keep automations from approving
            body:
              - Leave approvals off on the Comment on pull request tool; with approvals enabled the agent can
                approve, request changes and dismiss reviews.
            url: https://cursor.com/docs/cloud-agent/automations
          - title: Restrict who can steer a running agent
            body:
              - Set Team follow-ups to Disabled or Service accounts only so only the creator can add instructions
                from Slack or the web.
            url: https://cursor.com/docs/cloud-agent/settings
        note: >-
          Partial by the hosted rule. A draft pull request a person reviews and merges approves the output, not
          the actions: Cloud Agents auto-run terminal commands, network calls and tool calls with no per-action
          approval (a preToolUse hook's ask is not enforced today), and all of it has happened when the reviewer
          arrives. PR Routing & Approval and automations with approvals enabled are AI reviewers and never count
          as human approval.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityHitlControls
          reviewRequired: false
          original:
            - capability: capabilityHitlControls
              coverage: partial
              mechanism: >-
                Draft pull request as the review gate; Team follow-ups; Approval Agent approval toggle; Bugbot
                manualTriggerOnly
              steps:
                - title: Keep the PR gate human
                  body:
                    - Cloud Agents deliver draft PRs; branch protection in your forge is the deterministic
                      gate. If you deploy PR Routing & Approval, leave approvals off unless you accept machine
                      approval of low-risk PRs.
                  url: https://cursor.com/docs/approval-agents
                - title: Restrict who can steer a running agent
                  body:
                    - Set Team follow-ups to Disabled or Service accounts only so only the owner can add
                      instructions from Slack or the web.
