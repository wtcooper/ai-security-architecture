id: archHostedAppBuilder
surface: surfaceSaas
rank: 6
title: Hosted AI app builder
abbrev: Hosted app builder

overview: >-
  A vendor's agent writes an app from a chat, creates its database, sign-in and secrets, and
  serves it at its own address on the vendor's domain. Unlike a software factory you run, every
  part sits in the vendor's tenancy, and the gate between code nobody read and real data is the
  maker's publish click, plus whatever the workspace admin has made the platform enforce.

summary:
  - >
    People describe an app to a vendor's AI builder, and the vendor's agent writes it, gives it a
    database, sign-in and secrets, and hosts it at a link of its own for others to use, people
    outside the organisation included. Every part runs in the vendor's tenancy. The organisation
    holds workspace settings and a contract, and the maker holds a publish button, so the drawing
    is about what those settings let through.

description:
  - >
    A maker, usually not a developer, describes an app and uploads files in the vendor's builder.
    The vendor's agent calls its model, writes the code into the project, creates the database and
    its row rules, turns on sign-in, stores secrets and shows each change in a preview.
  - >
    On publish the platform scans the app, the maker picks its audience, and the app goes live at
    its own address. Visitors' browsers load the front end and call the database directly with a
    public key, so the row rules decide what they read. Server functions hold the secrets and reach
    our records through the vendor's connectors.
  - >
    What sets it apart is who holds the gate: workspace settings the vendor enforces, the maker's
    click and a contract.

distinguishedBy:
  - >
    Against the agentic software factory: the same request, but here one vendor runs the agent, the
    project, the previews, the publish step, the hosting and each app's database and sign-in, in a
    tenancy every customer shares. The factory's deploy gate and the sign-in in front of every app
    become workspace settings the vendor enforces; what the organisation keeps is single sign-on,
    connector scopes, the inventory of published apps and the contract.
  - >
    Against the UI/low-code managed agent runtime: there what a maker publishes is an agent, which
    colleagues or events invoke, and the question is whose access it runs on. Here the agent is the
    builder, and what it publishes is an application with its own code, database, sign-in and
    users, at an address anyone may be able to open. Copilot Studio now offers both: its agents are
    that pattern, and its apps (in preview) are this one.
  - >
    Against the coding & desktop session managed agent runtime: there an engineer hands a task on a
    repository the organisation owns to a vendor's agent, reviews the pull request it returns, and
    the session ends. Here the code lives in the vendor's project store, nobody reviews or merges
    it, and the result runs in the vendor's hosting for as long as it is published.
  - >
    Against the coding agents on your devices: nothing here runs on a device you manage, and the
    agent's output goes live with a click. A builder's own command-line tool, such as the Grok
    Build CLI, is a coding agent; Build mode in Grok is this pattern.

exemplars:
  - name: Lovable
    note: >
      Lovable Cloud runs each app's backend on Supabase's open-source foundation: database, sign-in,
      storage and edge functions. Published apps default to anyone with the link, Business and
      Enterprise workspaces can limit them to the workspace, and blocking publishing on critical
      scan findings is off by default outside new Enterprise workspaces.
    url: https://docs.lovable.dev/features/privacy-and-security-settings
    asOf: "2026-11"
  - name: Replit
    note: >
      Replit Agent builds the app. Publishing creates a separate production database the agent
      cannot change, runs a security scan first, and offers public, password, workspace-only or
      invite-only access, which team policy can force to private.
    url: https://docs.replit.com/features/publishing/overview
    asOf: "2026-11"
  - name: Bolt.new
    note: >
      Bolt Cloud gives each app a database, sign-up and Google sign-in, public and private file
      storage and server functions, and publishes it at a bolt.host address or a custom domain.
    url: https://support.bolt.new/cloud/bolt-cloud
    asOf: "2026-11"
  - name: Base44
    note: >
      Wix's builder, with a built-in database and login. Apps are public, private or limited to the
      workspace; apps that act like public sites are set to public without login, and single sign-on
      enforcement makes every visitor sign in.
    url: https://docs.base44.com/Setting-up-your-app/Managing-access
    asOf: "2026-11"
  - name: Vercel v0
    note: >
      v0 deploys to the team's Vercel project, with databases from Marketplace integrations. Sign-in
      is code v0 writes, and an environment variable with the NEXT_PUBLIC_ prefix is exposed to
      browser code.
    url: https://v0.app/docs/deployments
    asOf: "2026-11"
  - name: Grok Build
    note: >
      Build mode in Grok publishes apps at a grok.me address to you, to anyone with the link or to
      the whole internet, with a database per app and sign-in buttons the agent writes. The Grok
      Build command-line tool is a coding agent, not this pattern.
    url: https://x.ai/news/grok-build-mode
    asOf: "2026-11"
  - name: ChatGPT Sites
    note: >
      Codex builds the site and OpenAI hosts it on chatgpt.site with a database and file storage.
      Sites are private by default, public publishing on Enterprise stays off until an admin turns
      it on, and Sign in with ChatGPT hands the app the visitor's identity.
    url: https://help.openai.com/articles/20001339-creating-and-managing-chatgpt-sites
    asOf: "2026-11"
  - name: Google AI Studio Build mode
    note: >
      The agent provisions Firestore and Firebase sign-in and drafts the security rules; apps publish
      to Cloud Run, in a Google-managed project on the Starter tier, and a published app is public.
      Deploying into your own Google Cloud project moves hosting into your cloud, which this drawing
      does not show.
    url: https://aistudio.google.com/docs/aistudio-deploying
    asOf: "2026-11"
  - name: Apps in Microsoft Copilot Studio (public preview)
    note: >
      Copilot builds the app and Microsoft hosts it inside the Microsoft 365 tenant boundary. Sharing
      follows organisation policy, connectors run under data policy, and published apps are listed
      in the Microsoft 365 admin center. In public preview since October 2026.
    url: https://www.microsoft.com/microsoft-copilot/blog/copilot-studio/build-apps-in-copilot-cowork-and-copilot-studio/
    asOf: "2026-11"

zones:
  - id: zoneUser
    owner: user
    note: >
      Three groups and the code they run: the maker who describes the app and picks its audience,
      the workspace admin who sets the defaults the platform enforces, and the app's visitors, who
      may be colleagues, invited guests or anyone with the link. The front end the agent wrote runs
      in each visitor's own browser.
  - id: zoneVendor
    owner: vendor
    gloss: "the vendor's cloud, one tenancy for all"
    note: >
      The whole system, in one tenancy shared by every customer of the platform, often on the
      vendor's own suppliers (a hosted database, a serverless host): the agent, every project, the
      previews, the publish step, the hosting and each app's backend and connectors. What we hold
      here is workspace settings.
  - id: zoneCloud
    owner: cloud
    gloss: "sign-in, data, code"
    note: >
      What is still ours: the identity provider makers and workspace visitors sign in through, the
      systems of record the connectors reach, and our code host, if a project is exported.
  - id: zoneExternal
    owner: external
    note: >
      The model provider behind the vendor's agent, the public package registries its builds install
      from, and the open web, where search engines and public name records make each app's address
      known. Nothing here connects in.
  - id: zoneGovernance
    owner: governance
    note: >
      Ours, drawn across every band. On this pattern most of it is workspace settings the vendor
      enforces, plus the inventory of published apps, the search for apps made outside the
      workspace, and the contract.

blocks:
  - id: maker
    kind: actor
    title: Maker
    summary: "describes the app, picks its audience"
    icon: person
    zone: zoneUser
    col: 0
    row: 3
    note: >
      Usually not a developer: a marketer, an analyst, a team lead in a hurry. Describes the app,
      uploads the files it should work from, tries the preview and presses publish. Their chat is
      the agent's instruction, and they cannot judge the code it writes or the rules it sets.

  - id: admin
    kind: actor
    title: Workspace admin
    summary: "sets the defaults the platform enforces"
    icon: person
    zone: zoneUser
    col: 0
    row: 2
    note: >
      Holds the workspace settings: who may build and publish, the default audience, whether a scan
      finding blocks publishing, which connectors are allowed and which login methods apps may offer.
      Where nothing is set the vendor's defaults decide, and on several platforms those default to
      anyone with the link.

  - id: visitors
    kind: actor
    title: App visitors
    summary: "colleagues, guests, anyone with the link"
    icon: people
    zone: zoneUser
    col: 0
    row: 0
    note: >
      The people the app was built for, and whoever else its audience setting lets in: workspace
      members, invited outsiders, or anyone on the internet who has, or finds, the link.

  - id: browser
    kind: service
    title: Browser
    summary: "the agent's front end, with a public key"
    cosaiComponent: componentAgentUserQuery
    zone: zoneUser
    col: 0
    row: 1
    note: >
      Each visitor's own browser, on a device nobody of ours manages, running the front end the
      agent wrote. On many builders it calls the app's database directly with a public key that
      ships in the page, so everything in that code, and any key pasted into it, is readable by
      every visitor.
    items:
      - id: frontEnd
        label: Generated front end
        icon: code
        note: The app's pages and scripts, written by the agent and served to every visitor.
      - id: publicKey
        label: Public database key
        icon: key
        note: >
          The key the page uses to call the database. Public by design: it identifies the app, and
          only the row rules decide what it may read or change.

  - id: builder
    kind: provider
    title: Builder agent
    summary: "the vendor's agent: writes the app and sets up its backend"
    cosaiComponent: componentReasoningCore
    zone: zoneVendor
    col: 1
    row: 3
    note: >
      The vendor's chat and coding agent in one. It reads the maker's request and uploads, calls its
      model on the vendor's key, writes the code, installs packages, creates the database and its row
      rules, turns on sign-in and stores secrets. Whether it can change the live app's data or only a
      development copy is the vendor's design, not a setting of ours.
    items:
      - id: builderChat
        label: Builder chat
        icon: chat
        note: The maker's conversation, with everything pasted into it, kept with the project.
      - id: uploads
        label: File upload
        icon: doc
        note: Screenshots, spreadsheets and documents the app should work from, read by the agent as instruction.
      - id: loop
        label: Agent loop
        icon: agent
        note: Plans, writes and fixes the app on the vendor's model key, in the vendor's build sandbox.

  - id: projectStore
    kind: external
    title: Project store
    summary: "the app's code and the chat that made it; its own access setting"
    cosaiComponent: componentDataStorage
    zone: zoneVendor
    col: 2
    row: 3
    note: >
      Where the vendor keeps each project: its code and versions, the chat that made it (with
      whatever the maker pasted, secrets included) and the templates it came from. Who may see or
      remix a project is a setting of its own, apart from who may open the app, and every customer
      of the platform shares the store, one authorisation check apart.
    items:
      - id: code
        label: App code & versions
        icon: code
        note: Every version the agent wrote, which the preview and the publish step take from here.
      - id: history
        label: Chat history
        icon: chat
        note: The conversation that made the app, kept with it, secrets the maker pasted included.
      - id: remixes
        label: Templates & remixes
        icon: doc
        note: Public projects and templates a new app was copied from, and the copies made of this one.

  - id: previews
    kind: service
    title: Preview environments
    summary: "a running copy of each change, at a link of its own"
    zone: zoneVendor
    col: 2
    row: 2
    note: >
      A running copy of each change for the maker to try. A preview has a link of its own, and on
      some products that link reaches the app past the audience set at publish. In the target state
      previews are private to the workspace and run on their own test data, never on the live app's.
    items:
      - id: previewApp
        label: App & API endpoint
        icon: globe
        note: The preview's own link, which can be shared.
      - id: testData
        label: Test data
        icon: db
        note: A development copy of the database, kept apart from the live app's records.

  - id: publish
    kind: service
    title: Deploy gate
    summary: "publish: scan, audience choice, approval where required"
    zone: zoneVendor
    col: 1
    row: 2
    note: >
      The publish step, which holds a version until it goes live. It runs the platform's scan, asks
      the maker who may open the app, and applies the workspace's rules: whether a finding blocks
      publishing, who may publish outside the workspace, and whether an app with connectors needs an
      admin's approval. Unless those are set, the maker's click is the approval.
    items:
      - id: environment
        label: Environment definition
        icon: gear
        note: The app's audience, login methods and connectors, chosen at publish within the workspace's defaults.
      - id: versions
        label: Published versions
        icon: db
        note: Each version that went live, kept so the last good one can be restored.

  - id: appHosting
    kind: service
    title: App hosting
    summary: "its own address · the platform's audience check · server code"
    cosaiComponent: componentApplication
    zone: zoneVendor
    col: 1
    row: 1
    note: >
      Where the app is served, at its own address on the vendor's domain or a custom one. The
      platform checks the audience here and, for an app limited to the workspace, signs visitors in
      through our identity provider. The app's server functions run here with its secrets; connector
      calls, and any model calls the app makes, start from them.
    items:
      - id: endpoint
        label: App & API endpoint
        icon: globe
        note: The app's own hostname on the vendor's domain, public in DNS from the day it goes live.
      - id: signin
        label: Identity binding
        icon: shield
        note: >
          The platform's audience check and sign-in in front of the app, separate from any sign-in the
          agent wrote into it, and shared by every app on the platform.
      - id: functions
        label: Server functions
        icon: code
        note: Code the agent wrote that runs on the server, with the app's secrets, and calls connectors.
      - id: vault
        label: Credential vault
        icon: key
        note: The app's secrets (outside services' keys, the database's service key), for server code only.

  - id: appData
    kind: external
    title: App data
    summary: "database with row rules · the app's own accounts · file storage"
    cosaiComponent: componentDataStorage
    zone: zoneVendor
    col: 1
    row: 0
    note: >
      The app's backend store: a database with row-level or security rules, the app's own user
      accounts and its files, run by the vendor or a supplier (a hosted Supabase, Firebase or
      serverless database, for example). Browsers reach it directly with the public key, so the
      rules the agent wrote alone decide what a visitor may read or change.
    items:
      - id: records
        label: Internal records
        icon: db
        note: The app's tables, each with its row rules, holding what visitors enter.
      - id: accounts
        label: App user accounts
        icon: person
        note: The app's own sign-up and sign-in, which the row rules check against.
      - id: files
        label: File storage
        icon: folder
        note: Uploads and exports, in buckets with rules of their own.

  - id: connectors
    kind: service
    title: Tool services
    summary: "the vendor's connectors to our SaaS and systems of record"
    cosaiComponent: componentTools
    zone: zoneVendor
    col: 2
    row: 1
    note: >
      The platform's connectors: prebuilt integrations to SaaS and business systems, each holding a
      grant made by the maker, an admin or each visitor. Which identity a connector uses decides what
      an app's visitors can read through it.
    items:
      - id: apis
        label: APIs & connectors
        icon: plug
        note: The vendor's prebuilt integrations, each with the grant it was connected on.
      - id: mcp
        label: Remote MCP servers
        icon: plug
        note: Tool servers a builder lets an app call, where it offers them.

  - id: codeHost
    kind: service
    title: Source control
    summary: "our code host, if the maker exports or syncs the project"
    cosaiComponent: componentDataSources
    zone: zoneCloud
    col: 3
    row: 3
    note: >
      Our own code host, reached only if the maker exports the project or turns on two-way sync,
      through an app the builder installs on named repositories. It is not a gate here: nothing is
      merged, and the live app is published from the vendor's project store, not from this
      repository.
    items:
      - id: repos
        label: Repositories & instruction files
        icon: code
        note: The exported code, and from then on a second copy that changes with every sync.

  - id: idp
    kind: service
    title: Identity provider
    summary: "our single sign-on, for makers and for workspace apps"
    zone: zoneCloud
    col: 3
    row: 0
    note: >
      Our identity provider, federated with the platform: an app limited to the workspace signs its
      visitors in through it, and makers sign in to the builder through the same federation. A login
      method the platform offers beside it (an emailed link, a personal account) is a way round it.
    items:
      - id: sso
        label: SSO login
        icon: person
        note: Single sign-on with a second factor, for the builder and for workspace apps.

  - id: orgData
    kind: external
    title: Enterprise data
    summary: "systems of record a connector reaches"
    cosaiComponent: componentDataSources
    zone: zoneCloud
    col: 3
    row: 1
    pack: enterpriseData
    note: >
      Our systems of record and files, reached only through the platform's connectors. An app reads
      them with whichever grant its connector holds, so a maker's own grant becomes every visitor's.

  - id: provider
    kind: provider
    title: Model provider
    summary: "the model the builder calls, on the vendor's key"
    cosaiComponent: componentModelServing
    zone: zoneExternal
    col: 4
    row: 1
    pack: modelProvider
    note: >
      The model service behind the builder's agent, on the vendor's agreement with its provider, not
      ours; some vendors run their own. We neither broker the call nor hold the key.

  - id: sources
    kind: external
    title: Public package sources
    summary: "public registries the build installs from"
    zone: zoneExternal
    col: 4
    row: 0
    note: >
      Where the vendor's build gets the packages the agent adds. Anyone can publish here, including
      under a name an agent is likely to invent, and no mirror of ours stands between.
    items:
      - id: registries
        label: Package registries
        icon: db
        note: npm and its kind, reached by the vendor's build sandbox.

  - id: openWeb
    kind: external
    title: Open web
    summary: "search engines and public name records that list each app"
    cosaiComponent: componentDataSources
    zone: zoneExternal
    col: 4
    row: 2
    note: >
      Here the open web is not something the agent reads: it is where each app's address becomes
      known. Certificate and passive DNS records list a hostname the day it is issued, and search
      engines index what is public, so an app published to anyone with the link can be found
      without guessing.
    items:
      - id: search
        label: Web search
        icon: search
        note: Search engines and link previews that index what an app shows without sign-in.
      - id: dns
        label: Passive DNS
        icon: search
        note: Certificate logs and DNS histories that list every new hostname on a builder's domain.

  - id: govIdentity
    kind: governance
    title: Identity services
    summary: "who may build and open apps; single sign-on for both"
    icon: person
    zone: zoneGovernance
    col: 0
    row: 5
    mitigations: [ D3-APA, D3-MFA ]
    note: >
      The identity provider behind three decisions: who may use the builder, who may open each app,
      and which login methods the platform may offer beside ours. Removing someone here should
      remove them from the builder and from every workspace app.

  - id: govSecrets
    kind: governance
    title: Secrets & key management
    summary: "keys out of the chat, the code and the page"
    icon: key
    zone: zoneGovernance
    col: 1
    row: 5
    mitigations: [ D3-CH ]
    note: >
      Where each app's keys are issued, rotated and revoked: into the platform's server-side secret
      store, never into the front end, the code or the builder's chat.

  - id: govPolicy
    kind: governance
    title: Policy & authorization
    summary: "row rules, approvals to publish wider, connector scopes"
    icon: scale
    zone: zoneGovernance
    col: 2
    row: 5
    mitigations: [ cap-data-access-governance, AML.M0029, AML.M0028 ]
    note: >
      The workspace's rules: what an app's row rules must allow, who approves an app published beyond
      the workspace or with connectors, and which connectors an app may use and on whose access.

  - id: govSupplyChain
    kind: governance
    title: Supply-chain assurance
    summary: "publish scan, previews apart, every app listed, the vendor assured"
    icon: db
    zone: zoneGovernance
    col: 3
    row: 5
    mitigations: [ D3-AVE, cap-staged-rollout-gate, D3-AI, cap-ai-vendor-assessment ]
    note: >
      The scan every app passes before it goes live, previews kept apart from the live app, the
      inventory of published apps with an owner for each, and the assessment of what only the vendor
      can fix: how one customer's projects, apps and sign-in are kept from another's.

  - id: govObservability
    kind: governance
    title: Observability & response
    summary: "apps made outside found; any app taken down; who published what"
    icon: eye
    zone: zoneGovernance
    col: 4
    row: 5
    mitigations: [ cap-shadow-ai-discovery, cap-agent-kill-switch, AML.M0024 ]
    note: >
      The search for apps built outside the workspace, a stop that takes any app offline and cancels
      its keys and connectors, and the record of who published what to whom.

edges:
  - from: maker
    to: builder
    crossing:
      kind: vendor
      via: "The builder's chat, signed in through our identity provider; what is typed is not inspected"
    path: external
    bidir: true
    label: describe & upload
    note: >
      What the maker wants, in their own words, with the files the app should work from; the agent's
      questions, plans and changes come back. Nothing of ours reads it on the way.
  - from: builder
    to: provider
    crossing:
      kind: vendor
      via: "The vendor's own model call on its own key: assured, not brokered by us"
    path: external
    outbound: true
    label: their model call
    note: >
      The request, the uploads and the code so far go out; plans and code come back. We are not on
      this path and hold no key for it.
  - from: builder
    to: sources
    crossing:
      kind: vendor
      via: "The vendor's build sandbox: no mirror of ours on the path"
    path: external
    outbound: true
    label: package installs
    note: >
      Every package the agent adds, installed by the vendor's build straight from the public
      registries. Whatever comes back runs in the build and ships in the app.
  - from: builder
    to: projectStore
    path: primary
    bidir: true
    label: code & chat history
    note: Each version the agent writes, and the conversation that asked for it, kept together.
  - from: builder
    to: appData
    path: primary
    bidir: true
    label: tables, rules & sign-in
    note: >
      The agent creates the tables, writes their row rules, turns on the app's sign-in and moves
      schema changes to the live database, on products where it reaches it. It reads the schema
      back to plan the next change.
  - from: projectStore
    to: previews
    path: primary
    label: a preview per change
    note: >
      Each version is built and run as a preview, on the preview's own data, and the maker tries it
      inside the builder. Its link can be shared, and on some products it opens the app to whoever
      holds it.
  - from: maker
    to: publish
    crossing:
      kind: person
      via: "The maker alone: picks the audience and presses publish, unless an admin must approve"
    path: external
    bidir: true
    label: publish & pick audience
    note: >
      The maker chooses who may open the app and presses publish; the scan's findings come back. On
      a workspace with no rules set, nothing else stands between the agent's code and real visitors.
  - from: admin
    to: publish
    crossing:
      kind: vendor
      via: "The workspace's admin settings, enforced by the vendor at publish"
    path: external
    bidir: true
    label: defaults & approvals
    note: >
      The admin's settings, applied to every publish: default audience, blocking on scan findings,
      who may publish outside the workspace, and approval for apps with connectors. The approvals
      themselves arrive here too.
  - from: projectStore
    to: publish
    path: primary
    label: this version
    note: The version the maker chose, taken from the project store with its scan results.
  - from: publish
    to: appHosting
    path: primary
    label: live at its own address
    note: >
      The approved version goes live at the app's own address, with its audience and login methods
      set; or the last good version, restored.
  - from: visitors
    to: browser
    path: primary
    bidir: true
    label: open the link
    note: A visitor opens the app's address and uses it in their own browser.
  - from: browser
    to: appHosting
    crossing:
      kind: vendor
      via: "The platform's audience check and sign-in, set at publish"
    path: external
    bidir: true
    label: page, sign-in & functions
    note: >
      The browser loads the app's pages after the platform's audience check, signs in where the
      audience requires it, and calls the app's server functions.
  - from: browser
    to: appData
    crossing:
      kind: direct
      via: "Nothing between: the public key, and the row rules the agent wrote"
    path: external
    bidir: true
    label: "public key: reads & writes"
    note: >
      The front end calls the database straight from the browser with the public key and the
      visitor's session, if any. The platform's audience check is not on this path: the row rules
      are.
  - from: browser
    to: openWeb
    crossing:
      kind: direct
      via: "Nothing between: the address is public in DNS once it is issued"
    path: external
    outbound: true
    label: finds the address
    note: >
      How a stranger finds an app nobody sent them: a search, a certificate log or a passive DNS
      history listing new hostnames on the builder's domain. Nothing has to be guessed.
  - from: appHosting
    to: appData
    path: primary
    bidir: true
    label: server reads & writes
    note: Server functions read and write the database with the service key, which never leaves the server.
  - from: appHosting
    to: idp
    crossing:
      kind: brokered
      via: "Identity provider: our single sign-on and second factor for visitors"
    path: external
    bidir: true
    label: visitor sign-in
    note: >
      For an app limited to the workspace, the platform sends each visitor to our identity provider
      before the app opens. An app published to anyone with the link asks nobody to sign in.
  - from: appHosting
    to: connectors
    path: primary
    bidir: true
    label: connector calls
    note: The app's server functions ask a connector for records, or to act, on the grant it holds.
  - from: connectors
    to: orgData
    crossing:
      kind: direct
      via: "Nothing between: the grant the connector holds, checked by our system of record"
    path: external
    bidir: true
    label: connector reads & writes
    note: >
      The vendor's connector calls our system's own interface with the grant it was connected on.
      No gateway of ours is on this path: what the grant allows, and whose it is, is all the
      control there is.
  - from: projectStore
    to: codeHost
    crossing:
      kind: direct
      via: "Nothing between: the builder's app on named repositories, under our code host's rules"
    path: external
    bidir: true
    label: export & sync
    note: >
      The project pushed to a repository of ours, and with two-way sync pulled back. The builder's
      app is installed on named repositories only; the live app does not come from here.

pins:
  risks:
    - risk: riskSensitiveDataDisclosure
      at: appHosting
      note: >
        Published to anyone with the link, which some builders preselect, the app answers whoever
        has or finds its address, with no sign-in in front of it. Researchers have opened tens of
        thousands of live apps on a single platform this way.
    - risk: riskSensitiveDataDisclosure
      at: browser->appData
      note: >
        A table with no row rule, or a rule that lets any visitor read every row, hands its records
        to anyone who copies the public key from the page. Tens of thousands of sites built this way
        have been found serving records on page load, and the audience check in front of the pages
        is not on this path.
    - risk: riskSensitiveDataDisclosure
      at: browser
      note: >
        A key the agent put in the front end, or a value marked for the browser, is readable by every
        visitor. Scans of apps built on these platforms keep finding keys in the page's scripts.
    - risk: riskSensitiveDataDisclosure
      at: previews
      note: >
        A preview link can open the app past the audience chosen at publish, and a preview that runs
        on the live app's data discloses it to whoever holds the link.
    - risk: riskSensitiveDataDisclosure
      at: browser->openWeb
      note: >
        Certificate logs and passive DNS list each app's hostname the day it is issued, so an app with
        an open audience is found without anyone guessing its address.
    - risk: riskInsecureModelOutput
      at: builder->appData
      note: >
        The sign-in and the row rules are model output nobody reads. An inverted check, or a sign-in
        that adds a visitor to the team before checking membership, passes every test and lets
        strangers in.
    - risk: riskRogueActions
      at: builder->appData
      note: >
        A chat edit can change the schema or delete records in the live database, on products where
        the agent works on production data rather than a copy.
    - risk: riskCrossTenantCredentialPropagation
      at: projectStore
      note: >
        Every customer's projects, and the chat histories with secrets in them, sit one authorisation
        check apart. One flaw in that check opens other customers' code and conversations to any
        user of the platform.
    - risk: riskCrossTenantCredentialPropagation
      at: appHosting
      note: >
        The platform's sign-in in front of apps is shared by all of them. A flaw in it, such as a
        registration call that accepts any app's id, lets anyone into every private app at once,
        single sign-on apps included.
    - risk: riskShadowAndUnknownAgents
      at: publish
      note: >
        An app is a chat away, made in a personal or free account, published to anyone with the link
        and owned by nobody accountable. It keeps running, with real data, after the reason and the
        maker have gone.
    - risk: riskPromptInjection
      at: maker->builder
      note: >
        Uploaded files and remixed templates become the agent's instructions. A hidden line can tell
        it to weaken sign-in or post a key somewhere, and the maker would not see it in the code.
    - risk: riskInsecureIntegratedComponent
      at: builder->sources
      note: >
        Agents ask for packages that do not exist, and attackers publish under exactly those names.
        Whatever the build installs ships in the app, with no mirror of ours in between.
    - risk: riskAgenticDelegationConfusedDeputy
      at: connectors->orgData
      note: >
        A connector that reads on its maker's grant hands every visitor the maker's access to our
        records: the app shows people what they could never open themselves.
  mitigations:
    - mitigation: D3-APA
      at: appHosting
      do: "Set the workspace's default audience to the workspace or to the maker alone, and let only admins publish an app to anyone with the link or to the whole internet."
      why: "Several builders default a new app to anyone with the link, so one click publishes it to whoever finds the address."
      note: >-
        Private by default: the workspace's default published audience is the maker or the
        workspace, and a maker cannot publish wider. Lovable, Replit, ChatGPT Sites and Base44 offer
        this with different defaults. Check what the platform does with apps that act like public
        sites (some set them public without login) and with preview links, which on some platforms
        bypass the published audience.
    - mitigation: D3-AVE
      at: publish
      do: "Turn on the setting that blocks publishing while the platform's security scan reports a critical issue or exposed personal data, for every maker in the workspace."
      why: "Where the scan is advice a maker may skip, the agent's mistakes go live with the app."
      note: >-
        The pre-publish scan made blocking rather than advisory, on critical findings and on
        unresolved sensitive-data findings. Off by default on some platforms outside their enterprise
        plans. A scan confirms only what it checks, which is why the row rules carry their own pin.
    - mitigation: cap-data-access-governance
      at: appData
      do: "Require a row rule on every table and file bucket before an app holds real data, and check what each rule allows, not only that it is switched on."
      why: "Browsers reach the database with a public key, so these rules alone decide who reads which records."
      note: >-
        Row-level or security rules on every table and bucket, each read for what it allows: rows
        owned per visitor rather than readable by anyone signed in, and nothing readable without
        sign-in unless it is meant to be public. Use the platform's check where it reads the rules'
        content, and a review where it only confirms they are enabled, as one widely used check did.
    - mitigation: D3-CH
      at: appHosting
      do: "Keep every key in the platform's server-side secret store, call outside services only from server functions, and refuse to publish while the front end holds any key but the public one."
      why: "Anything in the page is readable by every visitor, and a key pasted into the builder's chat stays in the project's history."
      note: >-
        Secrets server-side only: outside services' keys and the database's service key in the
        secret store, a model key behind the platform or a server function, never in client code or
        a variable exposed to the browser. A key pasted into the builder's chat is rotated, because
        the chat is kept with the project. Absorbed by App hosting, as the deviation records.
    - mitigation: cap-staged-rollout-gate
      at: previews
      do: "Keep previews private to the workspace and on their own test data, apart from the live app, and choose a builder that can restore the live app's data as well as its code."
      why: "A preview link or a chat edit should not be a way to reach, or to break, the live app."
      note: >-
        Preview and production apart: previews private, preview links off or behind a password, a
        development database separate from production with schema changes moved only at publish,
        and a restore that covers data as well as code. On some products restore covers code only.
    - mitigation: cap-staged-rollout-gate
      at: builder->appData
      do: "Use a builder whose agent works on a development copy of the database, and turn that separation on where it is a setting, so the live app's data changes only when someone publishes."
      why: "An agent that can reach live records can delete them in the middle of a chat."
      note: >-
        The agent's reach into the backend limited to the development copy; the production database
        is created at publish and the agent reads it, if at all, through a read-only replica, as
        Replit does. Where the product has no such split, it is a finding for the vendor assessment.
    - mitigation: D3-MFA
      at: idp
      do: "Make makers, and the visitors of apps limited to the workspace, sign in through your identity provider with a second factor, and turn off the platform's other login methods for both."
      why: "An emailed link or a personal account is a way round your sign-in, and round the day someone leaves."
      note: >-
        Single sign-on enforced for the builder and as the only login method for workspace apps,
        with multi-factor authentication at the identity provider and unmanaged login methods
        (emailed links, personal social accounts) blocked. Removing someone at the identity provider
        then removes them from the builder and from every workspace app.
    - mitigation: D3-APA
      at: maker->builder
      do: "Let only people in groups you approve build in the workspace, signed in through your identity provider."
      why: "Who may build is the first decision about what gets published."
      note: Builder access granted to groups at the identity provider, with the maker's identity recorded against each project and app.
    - mitigation: AML.M0029
      at: admin->publish
      do: "Require a workspace admin to approve an app before it is published outside the workspace or with a connector to your data, seeing its audience, its data and its connectors."
      why: "Otherwise the maker's click is the only decision between code nobody read and real records."
      note: >-
        Approval bound to the publish: an audience beyond the workspace, or any connector to
        enterprise data, needs an admin's approval of that version, and the maker cannot approve
        their own. Where the platform has no approval step, limit wider publishing to admins and
        review apps with connectors from the inventory.
    - mitigation: AML.M0028
      at: connectors->orgData
      do: "Approve each connector an app may use, limited to the records and actions it needs, and keep every other connector blocked for the workspace."
      why: "A connector reaches whatever its grant allows, whichever app calls it."
      note: >-
        A connector allowlist for the workspace and scopes per connector: read-only where the app
        only reads, named sites or tables, no broad admin grant. Enforced in the platform's connector
        policy where it has one, and in the grant itself at our system of record.
    - mitigation: cap-data-access-governance
      at: connectors->orgData
      do: "Make each connector read as the person using the app, not as its maker, and refuse a request that arrives with no signed-in visitor behind it."
      why: "An app that reads on its maker's access shows every visitor what the maker can see."
      note: >-
        Connectors acting as the viewer: each visitor connects their own account, or the connector
        carries the signed-in visitor's identity to the system of record, which decides what returns.
        A maker's own grant shared with an app's audience is the case the confused-deputy risk names.
    - mitigation: D3-CH
      at: connectors->orgData
      do: "Connect each connector on a grant your system of record issues for that use alone, short-lived where it can be, and be able to revoke it from your side without the vendor."
      why: "The vendor holds the grant, and it reaches your records for every app that uses the connector."
      note: >-
        The grant this crossing is made with, held in the vendor's connector store: issued for the
        connector and its scope alone, never an admin's or a shared account's, rotated, and
        revocable at our identity provider or system of record. Absorbed by the connector, as the
        deviation records.
    - mitigation: D3-CH
      at: projectStore->codeHost
      do: "Connect the builder to your code host only through an app installed on the named repositories, never with a person's own token, and remove it when the project no longer syncs."
      why: "A personal token reaches every repository its owner can, and stays with the vendor until someone revokes it."
      note: >-
        The export and sync credential: an installation on named repositories with push to a branch
        that branch protection governs, not a personal access token, and removed with the sync.
        Absorbed by the crossing, as the deviation records.
    - mitigation: D3-AI
      at: govSupplyChain
      do: "Keep an inventory of every published app in the workspace, with its maker, audience, data and connectors, review it on a schedule, and reassign or unpublish the apps of people who leave."
      why: "An app nobody listed is one nobody can take down, and apps outlive the people who made them."
      note: >-
        The platform's list of published apps, exported and reconciled: owner, audience, data class,
        connectors and last publish. Some platforms list them in their admin console; where none
        does, the workspace's projects are the starting point.
    - mitigation: cap-shadow-ai-discovery
      at: govObservability
      do: "Look for apps your people built outside the workspace, in personal or free accounts on the builders' domains, using your network logs and the public records of new web addresses."
      why: "Those apps hold company data under no setting of yours."
      note: >-
        Discovery on builder domains through network and browser telemetry and the cloud access
        broker, and through certificate transparency and passive DNS searched for the
        organisation's name, reconciled against the inventory. They are the same records an attacker
        searches.
    - mitigation: cap-agent-kill-switch
      at: govObservability
      do: "Make sure an admin can unpublish any app in the workspace at once, revoke its connectors and rotate its keys, and know how to ask the vendor to take down one made outside it."
      why: "An app leaking records has to stop in minutes, whoever made it."
      note: >-
        Unpublish from the admin console, connector grants revoked at our identity provider or system
        of record, keys rotated in the secret store, and the vendor's abuse route for apps on its
        domain that the workspace does not hold.
    - mitigation: AML.M0024
      at: govObservability
      do: "Send the workspace's audit log of publishes, audience changes and connector grants to your own log store, where the platform offers one."
      why: "When an app leaks, you need to know who opened it to whom, and when."
      note: >-
        Publish, audience, connector and membership events exported where we can query them and the
        maker cannot change them. Some platforms record only part of this, or only on enterprise
        plans; that is a question for the vendor assessment.
    - mitigation: cap-ai-vendor-assessment
      at: projectStore
      do: "Ask the vendor how one customer's projects, chat histories and apps are kept apart from another's, how quickly it acts on a reported flaw, and which suppliers hold your data, before rollout and every year."
      why: "Some of the largest exposures on these platforms were the vendor's own flaws, which no setting of yours could stop."
      note: >-
        Tenant isolation of the project store and of the hosting, triage of bug-bounty reports,
        subprocessors (database, hosting) and data residency, assured by assessment and contract
        because none of it is ours to inspect, and re-checked as the vendor ships.
    - mitigation: cap-ai-vendor-assessment
      at: appHosting
      do: "Ask the vendor how the sign-in in front of every app on the platform is tested, and how fast a flaw in it is fixed for all of them."
      why: "One flaw there opens every customer's private apps at once."
      note: >-
        The platform's shared sign-in layer and its registration and verification calls, assessed as
        the single point every private app on the platform depends on.
    - mitigation: cap-ai-vendor-assessment
      at: builder->sources
      do: "Ask the vendor how its builds choose and check packages, including names published only days ago, and how it removes a harmful package from every app once one is found."
      why: "The build installs straight from public registries, with no mirror of yours to catch a package an agent made up."
      note: >-
        Supply-chain intake on the vendor's side: package scanning and age rules in the build, a
        lockfile per app, and a way to find every app that ships a package later found harmful.
        None of it is ours to set, so it is assured by assessment; the publish scan's dependency
        check is the part the workspace can make blocking.

walkthrough:
  title: An app is built, published and goes live
  moves: >-
    A request in the builder's chat, through the vendor's agent, the project, a preview and the
    publish step, to an app at its own address.
  steps:
    - follow: maker->builder
      label: sign in, describe the app
      note: >
        A team lead signs in to the builder through our identity provider, the only login the
        workspace allows, and asks for an app to track equipment loans, uploading the spreadsheet the
        team uses today.
    - follow: builder->provider
      label: plan & write
      note: The agent sends the request, the spreadsheet and its plan to the vendor's model, on the vendor's key.
    - follow: provider->builder
      label: plans & code
      note: "Plans and code come back: model output, not yet checked by anything."
    - follow: builder->sources
      label: install packages
      note: The build installs the packages the agent chose, straight from the public registries.
    - follow: sources->builder
      label: packages
      note: The packages come back and the build runs.
    - follow: builder->projectStore
      label: code & chat saved
      note: The code and the conversation are saved together as a version of the project.
    - follow: builder->appData
      label: tables, rules, sign-in
      note: >
        The agent creates the loans table, writes a row rule so each person sees their own loans, and
        turns on sign-in. On this product it works on a development copy of the database.
    - follow: projectStore->previews
      label: a preview
      note: The version is built and runs as a preview on test data.
    - follow: maker->publish
      label: publish to the workspace
      note: >
        They press publish. The audience defaults to the workspace, and the app asks for one
        connector, to the asset register.
    - follow: projectStore->publish
      label: this version, scanned
      note: The publish step takes the version from the project and scans it; the scan finds nothing critical.
    - follow: admin->publish
      label: admin approves
      note: >
        Because the app uses a connector to company data, the workspace requires an admin's approval.
        The admin checks its audience, its data and its connector, and approves this version.
    - follow: publish->appHosting
      label: live at its own address
      note: The app goes live at its own address, limited to the workspace, and joins the inventory.
    - follow: publish->maker
      label: the link
      note: The team lead gets the link to share with the team.

scenarios:
  - title: A colleague uses the app
    steps:
      - follow: visitors->browser
        label: open the link
        note: A colleague opens the link the team lead shared.
      - follow: browser->appHosting
        label: audience check
        note: The platform checks the audience before anything loads; this app is for the workspace.
      - follow: appHosting->idp
        label: sign in
        note: The platform sends the colleague to our identity provider.
      - follow: idp->appHosting
        label: signed in
        note: Signed in with a second factor, they are let through.
      - follow: appHosting->browser
        label: the app's pages
        note: The front end loads in their browser, with the public database key in it.
      - follow: browser->appData
        label: "public key: my loans"
        note: >
          The page asks the database for loans directly, with the public key and the colleague's
          session; the row rule returns only their own.
      - follow: appData->browser
        label: their rows only
        note: Their own loans come back. Nothing from the platform's audience check was on this call.
      - follow: browser->visitors
        label: the page
        note: The colleague sees their loans and books a laptop.
  - title: The app looks up our records through a connector
    steps:
      - follow: browser->appHosting
        label: look up an asset
        note: A signed-in colleague asks the app for the laptop's asset record.
      - follow: appHosting->connectors
        label: server function calls connector
        note: A server function asks the asset register's connector, on the colleague's behalf.
      - follow: connectors->orgData
        label: as the colleague
        note: >
          The connector calls our asset register with the colleague's own grant, not the maker's, and
          only for the asset table it was approved for.
      - follow: orgData->connectors
        label: what they may see
        note: The asset register returns only what this colleague is entitled to see.
      - follow: connectors->appHosting
        label: the record
        note: The record comes back to the server function.
      - follow: appHosting->browser
        label: shown
        note: The app shows it. Had the connector run on the maker's grant, it would show the maker's view to everyone.
  - title: Published to anyone with the link, with no row rule
    steps:
      - follow: visitors->browser
        label: a stranger looks
        note: >
          In a workspace with no rules set, a maker published a customer sign-up app last week. The
          audience was preselected as anyone with the link, and the scan's warning was advice. A
          stranger who was never sent the link goes looking for apps on the builder's domain.
      - follow: browser->openWeb
        label: new hostnames
        note: They search certificate logs and passive DNS for new hostnames on the builder's domain.
      - follow: openWeb->browser
        label: the app's address
        note: The app's hostname was listed the day it was issued. Nothing had to be guessed.
      - follow: browser->appHosting
        label: no sign-in asked
        note: The platform asks the stranger for nothing, because the audience is anyone with the link.
      - follow: appHosting->browser
        label: pages, with the key
        note: The front end loads, with the public database key in it.
      - follow: browser->appData
        label: public key, whole table
        note: >
          The stranger copies the public key from the page and asks for the whole customers table.
          The agent never wrote a row rule for it.
      - follow: appData->browser
        label: every customer's record
        note: >
          Every record comes back. A blocking scan, a row-rule check that reads the rules, and a
          private default would each have stopped it; the inventory and the search for apps on the
          builder's domains would have found it.
  - title: An uploaded file tells the agent to open the data
    steps:
      - follow: maker->builder
        label: a file with hidden text
        note: >
          The maker uploads a supplier's spreadsheet. A cell in white text tells the agent to make the
          orders table readable without sign-in.
      - follow: builder->provider
        label: the model reads it
        note: The instruction reaches the model with the request, as if the maker had asked for it.
      - follow: provider->builder
        label: an open rule
        note: The plan includes a rule that lets anyone read the orders table.
      - follow: builder->appData
        label: rule written
        note: The agent writes the rule. The maker sees an app that works and has no reason to read the rule.
      - follow: maker->publish
        label: publish
        note: The maker presses publish.
      - follow: projectStore->publish
        label: scan reads the rule
        note: >
          The scan reads the rules and finds a table anyone can read; with blocking on, publishing
          stops until the rule is fixed. Where the check only asks whether rules are enabled, it passes.

deviations:
  - subject: The vendor's platform is drawn as several boxes
    reason: >
      Elsewhere a vendor platform is one box, assured rather than drawn (the three-zone rule). Here
      each part the builder runs (the agent, the project store, previews, the publish step, the
      hosting, the app's data and the connectors) carries settings the workspace chooses and a risk
      of its own, so each is drawn as a vendor surface the customer configures. What happens inside
      each is still assured, by the vendor assessment pinned on the project store and the hosting.
  - subject: Credential hardening is pinned where the keys are held, with no AI gateway
    reason: >
      Credential hardening (D3-CH) is embodied by an AI gateway on other patterns. No gateway of ours
      is on this one. An app's secrets live in the vendor's server-side secret store and are used by
      its server functions, so that pin sits on the hosting that holds them, and the check that no key
      ships in the front end is part of publishing. The grants the vendor holds into our systems are
      pinned on the two crossings they are used on: the connectors into our data, and the export
      into our code host.
  - subject: Enterprise data is reached without an AI gateway or Tool services of ours
    reason: >
      The canonical chain to data runs through our gateway and our tool servers, because that is how
      an agent reaches it. The published app is not an agent of ours: the vendor's connectors call
      our systems' own interfaces with the grant each holds. Where the organisation runs an API
      gateway in front of a system of record, it sits on this crossing and scopes the grant;
      otherwise the crossing is direct, and that is the finding.
  - subject: The app inventory is cited under Supply-chain assurance
    reason: >
      The asset inventory control (D3-AI) has no fixed governance group in the vocabulary. As on the
      agentic software factory, the inventory of generated apps sits with Supply-chain assurance.
  - subject: No input screening is pinned for uploads and remixed templates
    reason: >
      The standard pairing for untrusted content is the injection risk with input screening. No
      builder in the evidence lets a workspace screen uploads or remixed projects before the agent
      reads them, so the risk is pinned and what stands behind it is the blocking scan, the row-rule
      check and the approval to publish wider.
  - subject: The app's own model calls are not drawn
    reason: >
      An app that calls a model does so from its server functions, on a key in its secrets or, on
      some products, on the maker's own key for every visitor. Not every app does, so it is a note on
      App hosting rather than an arrow, and the secrets control covers the key.
  - subject: A builder that deploys into your own cloud is a different drawing
    reason: >
      Some builders can publish the app and its database into the customer's own cloud project while
      the agent and the code stay with the vendor (Google AI Studio's standard deployment does).
      That moves hosting and data into our cloud and adds a deploy credential the vendor holds, an
      either/or the drawing cannot carry. It is on watch until it is offered more widely.
  - subject: The makers' sign-in to the builder is not drawn as its own arrow
    reason: >
      Makers reach the builder through the same federation with our identity provider that the
      visitors' sign-in arrow shows. A second arrow from the builder to the identity provider crossed
      four others on the drawing, so it is stated on the maker's crossing, in the identity provider's
      note and in the single sign-on control, which covers both.
  - subject: The browser in the user zone is the visitor's own
    reason: >
      The Browser block is registered as a client on a device we manage. Here it stands with the
      people, because the front end runs on each visitor's own device, inside no boundary of ours or
      the vendor's.

