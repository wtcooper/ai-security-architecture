id: coding-agent-hijack
title: "Coding agents hijacked through the instruction files and settings they trust"
subtitle: >
  Coding agents read instruction files as standing orders and run the hooks in their own
  settings. In 2026 attackers wrote to both, first by hand and then with a worm.
date: 2026-08
dateRange: May – August 2026
category: promptInjection
perspective: target
# The developer's own machine: poisoned instruction files and settings reach a local agent through
# the packages it installs. The same year's comment-driven attacks on agents running as CI workflows
# replay on the hosted agent runs incident, with the cloud drawings.
archetype: archCodingAgentThirdParty
breaks:
  - control: AML.M0031
    how: "The agent writes only its own memory files, and any change to rules, hooks and settings is reviewed like code, so a planted directive or hook is seen before it runs."
  - control: cap-agent-action-policy-enforcement
    how: "Bound what the agent may run without a human confirming, and run only the hooks the organisation deploys, so a hook the worm writes into .claude/settings.json never fires."
  - control: D3-FA
    how: "Packages come from the mirror, scanned on admission, and .claude/ and .vscode/ are watched like a startup folder, so a worm-published version or a planted hook is caught."
summary:
  - >
    A coding agent's context is assembled from the repository around it: `CLAUDE.md`,
    `.cursorrules`, issue threads, PR comments, CI logs. Most of those are writable by people
    who have no commit access.
  - >
    Attackers used that. TrapDoor went upstream and poisoned instruction files distributed
    through npm, PyPI and crates.io, so the agent read the attacker's directives as its own.
    The same year's hostile GitHub comments reached agents running as CI workflows,
    and are told with the hosted agent runs.
  - >
    This is the only case in this set where the agent's *system instructions* are the target,
    which makes instruction files a supply-chain artefact that needs the same provenance
    controls as code.
  - >
    In August 2026 the pattern stopped needing an attacker at the keyboard. CHAINDROP is a
    self-propagating npm worm that writes its own persistence into an agent's configuration
    (a session-start hook in `.claude/settings.json`, a folder-open task in `.vscode/tasks.json`)
    and then republishes itself through every package its stolen credentials can reach. What
    TrapDoor did by hand to instruction files, CHAINDROP does at 1.3 billion monthly downloads.
patterns:
  - Config-as-Code Execution
  - Tool Poisoning
  - Credential Theft via AI Tools
  - Self-Propagating Supply Chain Worm
cves: []
risks:
  - riskPromptInjection
  - riskToolSourceProvenance
  - riskRogueActions
  - riskPromptResponseCachePoisoning
  - riskInsecureIntegratedComponent
  - riskSensitiveDataDisclosure
controls:
  - controlInputValidationAndSanitization
  - controlComponentIdentityProvenance
  - controlAgentExecutionBounds
  - controlAgentCredentialIsolation
  - controlAgentObservability
  - controlModelAndDataIntegrityManagement
steps:
  - n: 1
    title: Instruction files get poisoned at the source
    phase: introduced
    narrative: >
      TrapDoor planted malicious directives in `CLAUDE.md` and `.cursorrules` files shipped
      through npm, PyPI and crates.io. Developers pulled them in as ordinary dependencies. The
      agent read them as its own standing instructions.
    components:
      - actorExternalSources
      - componentAgentInputHandling
      - componentAgentSystemInstruction
    path: [toolPlane->registry, toolPlane->memory]
    risks:
      - riskToolSourceProvenance
      - riskPromptInjection
    sources:
      - title: "TrapDoor poisons CLAUDE.md and .cursorrules across npm, PyPI and crates.io"
        url: https://github.com/webpro255/awesome-ai-agent-attacks
        publisher: Awesome AI Agent Attacks timeline
        date: 2026-05-24
  - n: 2
    title: Poisoned context persists
    phase: exposed
    narrative: >
      Because the instruction lives in a checked-in file or a cached context, it fires again
      on the next run and the next developer. One injection becomes a standing capability.
    components:
      - componentMemory
      - componentAgentSystemInstruction
      - componentReasoningCore
    path: [toolPlane->memory]
    risks:
      - riskPromptResponseCachePoisoning
      - riskPromptInjection
    sources:
      - title: "Awesome AI agent attacks — 2026 timeline"
        url: https://github.com/webpro255/awesome-ai-agent-attacks
        publisher: webpro255
  - n: 3
    title: The agent's config file becomes a worm's home
    phase: exposed
    narrative: >
      4 August 2026: a maintainer's npm account falls, and CHAINDROP backdoors every package
      that account can publish to: over 400 packages within days,
      later past 1,300, together carrying more than a billion downloads a month. Its persistence
      is the new part. It writes a session-start hook into `.claude/settings.json` and a
      folder-open task into `.vscode/tasks.json`, each pointing at a copy of the dropper in the
      other directory, so removing one restores it from the other, and where a repository token
      allows, it commits those hooks to as many as fifty branches. Among the 300+ secret patterns
      it hunts are Anthropic, Claude, Codex, Cursor, OpenAI and Gemini credentials. Its
      command-and-control addresses live in an Ethereum smart contract, so the operators moved
      the entire infrastructure with a single transaction and no new malware.
    components:
      - actorExternalSources
      - componentAgentSystemInstruction
      - componentTools
      - componentOrchestrationOutputHandling
      - componentModelFrameworksAndCode
    path: [toolPlane->registry, toolPlane->memory]
    risks:
      - riskToolSourceProvenance
      - riskInsecureIntegratedComponent
      - riskSensitiveDataDisclosure
      - riskRogueActions
    sources:
      - title: "Shai-Hulud CHAINDROP: npm supply chain worm analysis"
        url: https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain
        publisher: Elastic Security Labs
        date: 2026-08-06
      - title: "CHAINDROP npm worm analysis"
        url: https://unit42.paloaltonetworks.com/chaindrop-npm-worm-analysis/
        publisher: Unit 42, Palo Alto Networks
        date: 2026-08-06
  - n: 4
    title: Where this chain breaks
    phase: mitigated
    narrative: >
      Treat instruction files as code: signed, reviewed, provenance-checked. Let the agent write
      only its own memory files, and review any change to its rules, hooks and settings the way
      you review code. Lock the permission rules and hooks through the vendor's managed
      settings, so only the hooks the organisation deploys ever fire. Take packages from a mirror
      that scans them on admission. And watch the agent's own configuration directories the way
      you would watch a startup folder: CHAINDROP is the proof that `.claude/` and `.vscode/`
      are now execution surfaces, not preferences.
    components:
      - componentAgentInputHandling
      - componentAgentSystemInstruction
      - componentReasoningCore
      - componentTools
      - componentOrchestrationInputHandling
    path: [toolPlane->memory, toolPlane->registry, sources->registry, vendorService, govSupplyChain]
    sources:
      - title: "Securing agentic apps: how to vet the tools your AI agents depend on"
        url: https://workos.com/blog/mcp-supply-chain-security
        publisher: WorkOS
alsoSeen:
  - title: "Comment and Control: GitHub comments steer Claude Code, Gemini CLI and Copilot agents into leaking their keys"
    date: April – June 2026
    note: >
      Pull-request titles, issue bodies and comments drove three vendors' agents into posting
      the API keys and tokens their jobs held, and the Claude Code GitHub Action's file-read
      tool was later shown to reach the runner's process environment. All of them ran as GitHub
      Actions workflows rather than on a developer's machine, so the chain is replayed with the
      hosted agent runs, on the cloud drawings.
    sources:
      - title: "Comment and Control: prompt injection through GitHub comments into hosted CI agents"
        url: https://labs.cloudsecurityalliance.org/research/csa-research-note-comment-control-github-prompt-injection-20/
        publisher: Cloud Security Alliance
        date: 2026-04-17
      - title: "Securing CI/CD in an agentic world: the Claude Code GitHub Action case"
        url: https://www.microsoft.com/en-us/security/blog/2026/06/05/securing-ci-cd-in-agentic-world-claude-code-github-action-case/
        publisher: Microsoft Security
        date: 2026-06-05
  - title: "Clinejection: a compromised release of an open-source coding agent CLI"
    date: 2026
    note: >
      The first-party half of this pattern: a harness release published with stolen publisher
      tokens, so the supply chain delivered the agent itself. Plays out on the first-party
      coding agent drawing, whose private-registry mirror and version pinning are the
      answering controls.
    sources:
      - title: "Clinejection — supply-chain compromise of an open-source coding agent CLI"
        url: https://adnanthekhan.com/posts/clinejection/
        publisher: Adnan Khan
  - title: "AWS Kiro rewrites its own MCP config from hidden web text (CVE-2026-10591)"
    date: July 2026
    note: An agent persuaded to edit its own configuration turns a one-off injection into persistence.
    sources:
      - title: "Awesome AI agent attacks — 2026 timeline"
        url: https://github.com/webpro255/awesome-ai-agent-attacks
        publisher: webpro255
  - title: "Week of sandbox escapes: Cursor, Codex, Gemini CLI and Antigravity (CVE-2026-48124)"
    date: July 2026
    note: Four coding agents breached from inside their own sandboxes in a single week.
    sources:
      - title: "Awesome AI agent attacks — 2026 timeline"
        url: https://github.com/webpro255/awesome-ai-agent-attacks
        publisher: webpro255
  - title: "PixelLeak: coding agents publish 13,000+ internal screenshots to public repos"
    date: September 2026
    note: >
      With no CLI path for PR images, agents improvised public repositories, mostly in developers' personal accounts; one vendor's workaround spread as a shared skill. No attacker involved. One vendor's research; the figures are unverified.
    sources:
      - title: "How AI agents exposed developer screenshots"
        url: https://www.glow.io/blogs/how-ai-agents-exposed-developer-screenshots-from-leading-tech-companies
        publisher: Glow
        date: 2026-09-29
