archetype: archPersistentManagedAgents
mode: use
status: draft
attribution: >-
  Authored in this repository. Pattern requirements are separate from the dated, sourced
  implementation coverage of individual products.

overview:
  - >-
    Govern the continuing agent, its retained context and its usable authority together.
    Closing a conversation, stopping compute, disconnecting an app and deleting retained data
    are different operations. Use scoped reads and draft outputs as the baseline; enable
    consequential effects only when the required approval and revocation controls are verified.

items:
  - title: Register the owner, audience and continuing authority
    mitigations: [D3-MFA, D3-APA, cap-agent-tool-registry]
    body:
      - >-
        Record each agent's owner, permitted callers, channels, schedules, tools, account grants,
        version, approval state and review date. Reconcile the actual tenant population against
        that record and deny admission to unapproved agents and grants. Where the product cannot
        enforce that boundary, restrict who may create agents and connect accounts before rollout.
        Require a second factor for access and privileged approvals. Configure
        who may create or share agents and change triggers or grants. Test an unauthorised
        channel participant and a departed owner: neither should start work on surviving authority.

  - title: Verify the account on each path
    mitigations: [AML.M0028, D3-CH, D3-CTS]
    body:
      - >-
        Treat backend OAuth, shared service secrets and browser sessions as separate credentials.
        Bind connector tokens to their intended recipient and scope account permissions to the
        task. Keep raw credentials out of prompts and work files. Confirm whether private and
        group invocations use the caller's account or a shared account; a shared computer is not
        proof of shared OAuth, and per-user OAuth does not isolate shared files or cookies.
        Probe both connector and browser routes with an account that lacks the requested access.

  - title: Gate consequential effects at dispatch
    mitigations: [AML.M0029, AML.M0028]
    body:
      - >-
        Require an authenticated approver to see the exact operation, arguments, account and
        target. Verify that refusal, expiry or altered arguments prevent the effect. Automated
        review and consent to a browser login do not establish this human gate. Leave writes
        unavailable when the product cannot enforce it; use read-only accounts and draft outputs.

  - title: Bound retained state across tasks and audiences
    mitigations: [AML.M0031]
    body:
      - >-
        Identify the actual scope of memory, conversation history, files, browser cookies and
        saved logins. Configure authorised readers and writers, track source provenance, and
        establish correction, retention and recovery procedures. Test what remains after ending
        a task, disconnecting a connector and deleting the agent. Material already acquired may
        persist independently. Limit sensitive durable use where selective removal or reliable
        isolation cannot be established; a machine restart is not evidence of data erasure.

  - title: Constrain browser reach separately
    mitigations: [cap-agent-egress-control, AML.M0028]
    body:
      - >-
        Apply and test destination restrictions on the hosted browser's actual route, including
        redirects and alternate fetch mechanisms. Limit accessible files and browser accounts
        independently of connector permissions. If the route cannot enforce the restrictions
        required by the data class, leave it disabled or use it only with nonsensitive context.
        Keep local execution, shell tools, private-network routes and agent delegation disabled
        until their actual paths and authority boundaries receive a separate review.

  - title: Bound recurring work and verify the stop
    mitigations: [AML.M0036, cap-agent-kill-switch]
    body:
      - >-
        Set task and aggregate limits for duration, iterations, tool use and spend, and give
        recurring triggers an owner and expiry. Exercise an incident stop: terminate active work,
        disable schedules and queued restarts, and revoke connector tokens and browser sessions
        at their issuers. Verify no new effect occurs. Data deletion is a separate governed step;
        stopping compute must neither imply erasure nor silently leave authority able to restart.

  - title: Export evidence and assess hidden provider controls
    mitigations: [cap-agent-tracing, cap-ai-vendor-assessment]
    body:
      - >-
        Correlate available agent, caller, trigger, approval, tool and downstream events in a
        customer-controlled record. Test whether a browser action and a scheduled connector call
        can be reconstructed; document fields or routes the product does not expose. Assess
        provider isolation, internal screening, credential handling and retention using current
        evidence. Do not treat those supplier claims as customer-configured runtime controls.

sources:
