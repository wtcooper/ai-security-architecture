# Controls guidance for the remote MCP server archetype. Audience: the teams building and
# publishing servers, and the risk/assessment teams setting the requirements they build to.
# This is a build pattern: each item is a property the design must have before it ships, with
# the assurance evidence the risk team collects. The build's derivation check fails this
# document if its cited capabilities stop being pinned on the architecture.
archetype: archRemoteMcpServer
mode: build
status: draft
attribution: >-
  Authored in this repository. Protocol claims follow the 2026-07-28 MCP revision, its
  authorization security considerations, and the stable enterprise-managed authorization
  extension (ID-JAG, June 2026); pattern-level by design.

overview:
  - >-
    A published MCP server is an OAuth resource server whose clients are language models:
    conventional multi-tenant service engineering, plus a small set of inversions that follow
    from the caller being a model. The tool descriptions you publish execute as instruction
    inside somebody else's agent; the arguments you receive were composed by a model that may
    have been steered; and the user who consented is not present at call time. Every
    requirement below is either ordinary service discipline applied with unusual force, or a
    direct consequence of one of those three facts.
  - >-
    The deployment shape to require is boring on purpose: a gateway tier in front, identity
    federated to the enterprise IdP, one stateless application, a secrets manager behind it,
    and a governance plane that owns scopes, tool text, registry listing, audit and
    revocation. Teams should not be designing novel session schemes or token flows — the
    protocol deleted sessions and specifies the auth model; the review question is whether
    the build matches it.

items:
  - title: Front the endpoint, and decide the three identity flows before any tool code is written
    capabilities: [capabilityRateLimiting, capabilityIga, capabilityNhiManagement]
    body:
      - >-
        Require a gateway tier in front of the service: WAF, per-client and per-tenant rate
        limits sized for machine callers, and routing on the protocol's method and tool-name
        headers so metering never needs to parse bodies. Then require the build to name which
        of the three caller types it serves and implement each by the book. Enterprise
        callers: enterprise-managed authorization — single sign-on at the IdP, an ID-JAG
        exchanged there under the administrator's app registry and policy, redeemed at our
        authorization server with the JWT-bearer grant, no per-server consent. Public clients
        with no prior relationship: the authorization-code grant with PKCE (S256), `resource`
        on both requests, a client-ID metadata document as the client identity, `iss` checked
        on the response, and a consent screen that names the client and its redirect host.
        Autonomous workloads: `client_credentials` with `private_key_jwt` under the workload's
        own registered identity, with scopes narrower than any user's. Dynamic client
        registration is deprecated and fails review. Evidence: the gateway config, the IdP's
        app-registry entry for this server, the authorization-server metadata showing the
        grant profiles, and one token per flow from a test client showing audience, expiry
        and scopes.
      - >-
        Tokens are validated on every request — signature or introspection, audience equals
        this server's canonical URI, expiry, scope against the tool being called, subject —
        and audience validation is the server's own obligation even when the gateway
        pre-checks. Prefer introspection where revocation must reach running agents; local
        JWT validation is faster and blind to it. A server that accepts a token issued for any
        other audience fails the assessment.
      - >-
        Scopes are a catalogue owned outside the service: narrow, no omnibus scope, minimal
        set at first grant, and every scope an operation needs emitted in one
        `insufficient_scope` challenge so the client steps up in one round trip. Under
        enterprise-managed authorization a step-up is another exchange at the IdP, and the
        organisation's policy answers; under the public flow it is a consent screen listing
        exactly the added scope. Assessment probe: call a write tool with a read token and
        confirm a single 403 challenge names every scope the write needs.

  - title: Build stateless; a state handle is a name, not a capability
    capabilities: [capabilityTransportSecurity]
    body:
      - >-
        The current protocol has no sessions: every request is self-contained, which is what
        makes the tier horizontally scalable. Where tools need cross-call state, the server
        mints opaque handles — high-entropy, bound to the token's subject, expiring, and
        re-authorized against the presenting token on every request. Possession of a handle
        must prove nothing. Reject designs that carry trust in the handle, vary tool listings
        per connection, or reimplement session affinity. Require Origin validation and TLS
        termination evidence at the edge. Assessment probe: present a valid handle with a
        different subject's token and confirm the request fails.

  - title: The caller's token never travels upstream
    capabilities: [capabilitySecretsManagement, capabilityEgressControl, capabilityDataAccessGovernance, capabilityCredentialIsolation]
    body:
      - >-
        Most servers wrap existing systems, and the one rule with no exceptions is at that
        boundary: the inbound token stops at the service. Two shapes pass review. On-behalf-of:
        the handler exchanges the inbound token at the authorization server for one whose
        audience is the upstream and whose scope is narrowed to the tool, so the upstream
        sees who is really asking and applies its own authorization — the preferred shape for
        internal systems that already understand the user. Service credential: the handler
        calls as itself on a credential the secrets manager issues, scopes and rotates, where
        no delegation exists. The third shape — forwarding the inbound token — is the confused
        deputy the protocol forbids by name, and the finding most often discovered in
        production. Bound egress to named upstream destinations; unbounded outbound reach from
        a tool server is the exfiltration path a steered agent is looking for.
      - >-
        On the data path, require the dual check on every operation — the scope permits it,
        and the tenant on the token matches the tenant on the record — enforced in a shared
        layer rather than re-implemented per handler. Assessment probe: a valid token for
        tenant A requesting tenant B's record by identifier, on a read as well as a write.

  - title: Ship tool text like code, and list the server like a dependency
    capabilities: [capabilityMcpToolSecurity, capabilityAiRedTeaming]
    body:
      - >-
        Descriptions, schemas and error text execute inside the caller's model, so they ship
        through the same pipeline as code: versioned, reviewed as a security artifact,
        adversarially read for what a model will do with the words, and published with
        provenance. Publish to the registry or private subregistry consuming clients admit
        from, with versions pinned, so a definition that changes after approval is detectable
        by the people trusting it. Make consequential handlers return `input_required` and
        execute only on the retry that carries the confirmation — annotations are hints a
        client must treat as untrusted, so elicitation is the lever the server actually holds
        — and keep results bounded in size, because output lands in someone else's context
        window.

  - title: Test it like the published application it is
    capabilities: [capabilityAppSecTesting, capabilityAiVulnMgmt]
    body:
      - >-
        Behind the protocol this is an ordinary HTTP application with ordinary attack surface,
        and it ships through the ordinary release gate: dependency and code scanning, dynamic
        testing against the deployed endpoint, and the tenant-isolation checks exercised as
        tests rather than trusted as intentions. A tool server that skipped AppSec because "it
        is just MCP" skipped it for the one application whose caller is a machine that retries.

  - title: Audit per call, and design revocation before launch
    capabilities: [capabilityAuditLogging, capabilityToolPermissionScoping, capabilityKillSwitch]
    body:
      - >-
        The audit record is per tool call — client, user, tenant, tool, arguments, result,
        with trace context propagated — because it is both the incident trail and the answer
        to a customer asking what their agent did. Scope design is where a hijacked agent's
        blast radius is decided: a catalogue of narrow scopes owned outside the service, no
        omnibus scope, and step-up challenges rather than over-asking at consent. Revocation
        must work at three grains without a deploy: a user (at the IdP — a group removal ends
        every new ID-JAG at once), a client (at the authorization server), and a tool (at the
        definition layer) — and it must reach tokens already issued, which is what
        introspection, short access-token lifetimes and rotating refresh tokens buy.
        Assessment probe: remove a test user from the granting group and confirm the agent's
        next call fails within one token lifetime, and that its refresh and re-exchange both
        fail.

