    verified: "2026-11-18"
  - id: bigQueryRowLevelSecurity
    name: "Row-level security (row access policies)"
    where: "BigQuery › (table the agent's tools query) › row access policies"
    setVia: [apiCli]
    area: data
    default: "No row access policy. Anyone with table access reads every row."
    recommended: "Add row access policies whose grantee list or SESSION_USER() filter names the end users and groups, and have the tool query with the user's delegated credential and not the agent's own identity."
    value: "Row access policies; queries use the user's credential"
    why: "A filter in the store holds whatever the agent asks for. A query run as the agent's identity returns everything that identity can read."
    mitigations: [cap-data-access-governance]
    url: https://docs.cloud.google.com/bigquery/docs/row-level-security-intro
    verified: "2026-11-18"
  # <<< managed agent service rows
  # >>> software factory rows (the settings that build and guard the factory and the apps it makes)
  - id: agentRepoCustomRole
    name: "Custom role granted on a Secure Source Manager repository"
    product: "Secure Source Manager"
    where: "IAM › Roles › custom role copied from Repository Writer without securesourcemanager.pullRequests.merge; Secure Source Manager › (app's repository) › IAM, for that app's agent service account"
    setVia: [cloudPolicy, apiCli]
    area: identity
    default: "Repository Writer includes merge"
    recommended: "Grant the agent's per-app service account Instance Accessor on the instance and the custom role on its own repository only. Grant it no Cloud Run, Cloud Build, Cloud Deploy or Service Account User role anywhere."
    value: "Push and open pull requests on one repository; no merge"
    why: "The agent can put code on a branch and ask for review, but cannot merge, release or deploy, so whatever it is talked into stays on a branch."
    mitigations: [AML.M0028]
    url: https://docs.cloud.google.com/iam/docs/roles-permissions/securesourcemanager
    verified: "2026-11-21"
  - id: ssmBranchRule
    name: "Branch protection rule (Require a pull request before merging, Require status checks)"
    product: "Secure Source Manager"
    where: "Secure Source Manager › (repository) › Settings › Branch rule, branch filter set to the default branch"
    setVia: [adminConsole, apiCli]
    area: tools
    recommended: "Require a pull request with one approval from a Repository Pull Request Approver (never the agent), linear history and Block merge on stale reviews. Required status checks must be triggers-file triggers, so a webhook-started pipeline is enforced by Binary Authorization instead."
    value: "Pull request, 1 approval, pipeline checks"
    why: "Nothing reaches the default branch without passing checks and a review by someone other than the agent, and a commit pushed after approval cancels that approval."
    mitigations: [AML.M0028]
    url: https://docs.cloud.google.com/secure-source-manager/docs/branch-protection-overview
    verified: "2026-11-21"
  - id: ssmSecretScanning
    name: "Secret scanning"
    product: "Secure Source Manager"
    where: "Secure Source Manager › (repository) › Settings › Secret scanning toggle, with an optional Sensitive Data Protection inspection template"
    setVia: [adminConsole, apiCli]
    area: data
    recommended: "On for every app repository from creation, with an inspection template for your own key formats. Users with appropriate permissions can force-push past it and Google does not name the permission, so test that the agent's custom role cannot."
    value: "On for every repository"
    why: "A commit holding a private key, cloud credential, OAuth client secret or similar is rejected at push, or its pull request blocked, before anyone else reads it."
    mitigations: [D3-CH]
    url: https://docs.cloud.google.com/secure-source-manager/docs/enable-data-loss-prevention
    verified: "2026-11-21"
  - id: buildTriggerInlineConfig
    name: "Webhook trigger with an inline build configuration"
    product: "Cloud Build"
    where: "Cloud Build › Triggers › webhook trigger › Configuration: Inline, Service account, private pool; Secure Source Manager › (repository) › Settings › Webhooks › Trigger on Push"
    setVia: [cloudPolicy, apiCli]
    area: tools
    default: "SSM triggers file; build config read from the pushed branch"
    recommended: "Start builds from an SSM push webhook into a Cloud Build webhook trigger whose inline config clones the branch, set the trigger's service account, and run in a private pool with egressOption NO_PUBLIC_EGRESS. Do not use the repository's triggers file."
    value: "Inline config in the trigger, not in the repository"
    why: "The pipeline's steps then live in a trigger the platform team owns, so a commit cannot change what the pipeline checks or which identity it runs as."
    mitigations: [AML.M0028, D3-NI]
    url: https://docs.cloud.google.com/build/docs/triggers
    verified: "2026-11-21"
  - id: buildSandboxFlags
    name: "Cloud Run sandboxes (sandbox do; --allow-egress only for installs)"
    where: "Cloud Run › (app's agent job) › --sandbox-launcher; the harness runs every agent command with sandbox do, adding --allow-egress only to dependency installs"
    setVia: [apiCli, code]
    area: tools
    default: "Off"
    requires: "Preview; second generation execution environment"
    recommended: "Run every shell command, build and test in a sandbox deleted afterwards, moving the workspace in and out as tar archives. Give only install steps --allow-egress, which then reach what the job's VPC path allows, and pass no secrets with --env."
    value: "Every command sandboxed; egress only on installs"
    why: "Generated code and its packages run first in a sandbox with no host secrets, no metadata server credentials and, outside installs, no network."
    mitigations: [D3-EI, cap-agent-egress-control]
    url: https://docs.cloud.google.com/run/docs/code-execution
    verified: "2026-11-21"
  - id: admittedPackageRepo
    name: "Virtual repository whose only upstream is a standard repository of admitted packages"
    where: "Artifact Registry › standard Python and npm repositories only your intake job writes; the virtual repository the sandbox reads; remote repositories readable by the intake job alone"
    setVia: [cloudPolicy, apiCli]
    area: tools
    default: "Clients read remote repositories directly"
    recommended: "Your intake job checks each requested version's publish date, name similarity and the OpenSSF malicious packages list, then copies it into the standard repository. Agent identities get Artifact Registry Reader on the virtual repository only."
    value: "Sandbox installs admitted versions only"
    why: "Remote repositories cache whatever the upstream serves, with no age hold or look-alike check, so an invented package is refused only if admission happens first."
    mitigations: [D3-FA]
