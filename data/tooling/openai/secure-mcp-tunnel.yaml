# Secure MCP Tunnel — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
#
# Verified 2026-09-10 against developers.openai.com/api/docs/guides/secure-mcp-tunnels and the
# openai/tunnel-client repository. Placed on archEnterpriseAiChat because its job is to let
# ChatGPT connectors (and the Responses API and Codex) reach private MCP servers.
# 2026-09-25: re-verified toolOpenaiMcpTunnel against the MITRE capability rules; tunnel-client docs read through the GitHub API at master (release v0.0.15, published 2026-09-25; no published security advisories); developers.openai.com .../organization/subresources/audit_logs/methods/list and .../projects/subresources/api_keys/methods/delete redirect to .../admin/subresources/organization/...; learn.chatgpt.com/docs/enterprise/secure-mcp-tunnels 404 and no learn.chatgpt.com admin page mentions tunnels; platform.openai.com settings pages 403 (sign-in); help.openai.com developer-mode article 403 (plan policy unverified); trust.openai.com read from its server-rendered HTML.
# 2026-10-30: added settings: to toolOpenaiMcpTunnel; guide re-read at developers.openai.com (.md, 200) and the
# tunnel-client docs at raw.githubusercontent.com/openai/tunnel-client/master/docs (github.com pages 403 to this
# session's proxy). Corrections: ChatGPT "developer mode" is now the Upload plugins with custom MCP servers / Create
# plugins with MCPs permissions and tunnels attach at ChatGPT Plugins > Add custom MCP server > Connection: Tunnel;
# tunnel-client now supports AWS workload identity in place of a static runtime key.
vendor: openai
family: Secure MCP Tunnel
tools:
  - id: toolOpenaiMcpTunnel
    name: Secure MCP Tunnel (tunnel-client)
    surfaceClasses:
      - chatIntegration
    variants:
      - name: tunnel-client (binary and ghcr.io/openai/tunnel-client container)
        class: chatIntegration
        url: https://github.com/openai/tunnel-client
    architecture: archEnterpriseAiChat
    status: ga
    asOf: "2026-09"
    summary:
      - >-
        Secure MCP Tunnel lets a private or localhost MCP server serve ChatGPT custom MCP plugins, the
        Responses API and Codex without inbound exposure: a customer-run tunnel-client polls api.openai.com
        (or mtls.api.openai.com) over outbound HTTPS, forwards each request to the local stdio or HTTP MCP
        server, and returns the response through the same tunnel.
      - >-
        The tunnel itself carries no inference; it is the connectivity leg between OpenAI's hosted chat and
        the organisation's tool server, which is why it sits on the enterprise-chat architecture. Tunnels are
        created, edited and deleted in Platform tunnel settings and associated with one or more Platform
        organisations or ChatGPT workspaces; tunnel-client authenticates with a Restricted runtime API key
        (CONTROL_PLANE_API_KEY, Tunnels Read + Use) created and revoked on the Platform API keys page,
        optionally adds control-plane mTLS, can present its own mTLS certificate to the MCP server, and
        supports outbound proxies and custom CA bundles.
      - >-
        Audit is split: tunnel.created / updated / deleted appear in Platform audit logs, but control-plane
        tunnel traffic is not emitted as Compliance Platform app events; app-level invocation and
        auth-lifecycle logging still applies when ChatGPT reaches the app through the tunnel.
    facts:
      - label: Plans
        value: >-
          Platform organisation permissions (Tunnels Read / Read + Manage / Read + Use); adding custom MCP
          servers in ChatGPT is a separate workspace permission (Create plugins with MCPs).
        url: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels
      - label: Inference & routing
        value: >-
          No inference; requests are polled from api.openai.com:443 or mtls.api.openai.com:443 and forwarded
          to the private MCP server.
        url: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels
      - label: Data leaving the device
        value: >-
          MCP requests and responses transit OpenAI's control plane; the MCP server address stays private to
          the tunnel-client environment.
        url: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels
      - label: Retention & training
        value: >-
          Tunnel traffic is not emitted as Compliance Platform app events; app-level logs apply. API data is
          not used for training by default.
        url: https://developers.openai.com/api/docs/guides/your-data
      - label: Docs index
        value: developers.openai.com/api/docs/guides/secure-mcp-tunnels
        url: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels
    riskNotes:
      - risk: riskAgenticDelegationConfusedDeputy
        note: >-
          The tunnel presents one runtime key; per-user authorization has to happen in the MCP server or the
          app's auth flow.
    controls:
      - mitigation: D3-APA
        coverage: partial
        mechanism: >-
          Platform RBAC: Tunnels Read, Use and Manage (api.organization.tunnel.read / use / write) in custom
          organisation roles assigned to groups; the ChatGPT custom-MCP permissions (Upload plugins with custom MCP
          servers, Create plugins with MCPs) granted separately by the workspace admin
        steps:
          - title: Split managing from using
            body:
              - >-
                Under Organization settings create a tunnel-managers role (Tunnels Read + Manage) and a
                tunnel-runtime-users role (Tunnels Read + Use), assign each to a group — SCIM-synced from the IdP
                where possible — and allow up to 30 minutes for changes to propagate.
            url: https://developers.openai.com/api/docs/guides/rbac
          - title: Gate who can build on a tunnel
            body:
              - >-
                Grant Create plugins with MCPs (and Upload plugins with custom MCP servers) only to the app
                creators who should attach tunnels; they add the server at ChatGPT Plugins > + > Add custom MCP
                server and choose Tunnel under Connection.
            url: https://learn.chatgpt.com/docs/enterprise/apps-and-connectors
        note: >-
          Partial by the rule (both halves needed for native): the product administers group-based
          authorisation over the tunnel itself — who creates and deletes it, who runs or attaches it, which
          organisations and workspaces see it — but documents no target-side admin-consent path. On this path
          the target is our own MCP server, and consent there is its OAuth authorisation server's: the tunnel
          preserves protected-resource and authorisation-server metadata so the flow works, but sets none of
          its policy. The workspace side is the ChatGPT custom-MCP permissions, rated on toolChatgptDesktop.
        verified: "2026-10-30"
        migration:
          from:
            - capabilityIga
            - capabilityDataAccessGovernance
          reviewRequired: false
          original:
            - capability: capabilityIga
              coverage: native
              mechanism: >-
                Organisation-level Platform permissions Tunnels Read, Read + Manage, Read + Use;
                developer-mode grant in the ChatGPT workspace
              steps:
                - title: Separate managing from using
                  body:
                    - Read + Manage creates, edits and deletes tunnels; Read + Use runs tunnel-client or
                      selects the tunnel in a connector.
                  url: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels
              verified: 2026-09-10
            - capability: capabilityDataAccessGovernance
              coverage: external
              mechanism: The MCP server behind the tunnel enforces per-user access
              note: >-
                The tunnel forwards the caller's identity context only insofar as the MCP protocol carries it;
                whether retrieval is delegated or service-owned is decided by how the MCP server behind the
                tunnel authenticates callers.
              evidence:
                - title: Vendor docs index, reviewed for the integration point (2026-09-10)
                  url: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels
              verified: 2026-09-10
      - mitigation: D3-OTF
        coverage: external
        mechanism: >-
          None in the product — no tenant-restriction header and no destination policy for the tunnel host;
          the organisation's egress firewall or proxy enforces, reached through tunnel-client's explicit proxy
          settings
        evidence:
          - title: Secure MCP Tunnel — Network requirements (checked 2026-09-25)
            url: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels
          - title: tunnel-client configuration — Outbound HTTP proxy
            url: https://github.com/openai/tunnel-client/blob/master/docs/configuration.md
          - title: tunnel-client — bundled Cloudflare Tunnel companion
            url: https://github.com/openai/tunnel-client/blob/master/docs/deployment/cloudflared.md
        note: >-
          External by the drawing rule: there is no tenant-restriction header, so the network layer is the only
          lever. The pin's browser objective is toolChatgptDesktop's. On the tunnel host — the one workload on
          this path that runs in our network, so our proxy does control its egress — the guide lists the only
          destinations: api.openai.com:443 (mtls.api.openai.com:443 with control-plane mTLS) on /v1/tunnel/*,
          plus the configured MCP server, with nothing inbound. tunnel-client enforces no destination list of
          its own and cannot be pinned to the corporate organisation, so a host holding a personal Platform
          organisation's runtime key (the guide supports personal organisations) exposes a private server
          through the same allowed hostname. Integration point: --control-plane.http-proxy, --mcp.http-proxy,
          --harpoon.http-proxy or the global --http-proxy, with --ca-bundle; an explicit proxy flag ignores
          HTTP(S)_PROXY and NO_PROXY for that target. The repository's Cloudflare flavor supervises a bundled
          cloudflared whose connection to Cloudflare is not in the guide's network table. Where requests can
          land inside our network (configured bindings, labelled Harpoon targets) is credited under AML.M0028.
        verified: "2026-09-25"
        migration:
          from:
            - capabilitySse
            - capabilityEgressControl
          reviewRequired: false
          original:
            - capability: capabilitySse
              coverage: notApplicable
              mechanism: Not applicable — the tunnel replaces inbound exposure; it does not broker employee access
              note: >-
                The tunnel is server-side connectivity, not an employee access path; SSE applies to the
                ChatGPT clients, not to the tunnel.
              evidence:
                - title: Vendor docs index, reviewed for applicability (2026-09-10)
                  url: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels
              verified: 2026-09-10
            - capability: capabilityEgressControl
              coverage: partial
              mechanism: Outbound-only to api.openai.com:443 / mtls.api.openai.com:443, outbound proxy and CA bundle
                support, Harpoon targets by label
              steps:
                - title: Allow only the two control-plane hosts
                  body:
                    - tunnel-client needs api.openai.com:443 (or mtls.api.openai.com:443 with mTLS) plus the
                      private MCP server; nothing inbound.
                  url: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels
                - title: Route through the corporate proxy
                  body:
                    - The sample_mcp_enterprise_proxy profile shows env-backed proxy and CA bundle references.
                  url: https://github.com/openai/tunnel-client
              note: "Outbound-only to OpenAI's endpoints is a design property, not an administrator-defined destination
                policy: the operator cannot narrow or widen where the client connects beyond choosing a proxy
                and CA bundle. Enforce destinations for the tunnel host in the network layer."
              verified: 2026-09-10
      - mitigation: cap-sensitive-data-redaction
        coverage: external
        mechanism: >-
          None in tunnel-client; the organisation's AI/MCP gateway that tunnel-client forwards to classifies and
          masks tool results before they leave
        evidence:
          - title: tunnel-client architecture — Auth and data flow matrix (checked 2026-09-25)
            url: https://github.com/openai/tunnel-client/blob/master/docs/architecture.md
          - title: Secure MCP Tunnel — Logging boundaries
            url: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels
        note: >-
          The pin's objective — classifying what an employee sends — belongs to endpoint or browser DLP and to
          toolChatgptDesktop. On the tunnel path, MCP JSON-RPC requests, tool arguments, responses and any
          connector-forwarded Authorization bearer all cross OpenAI's tunnel service; only the final
          tunnel-client-to-MCP hop is local, and the architecture page says strict-local-auth is not supported.
          tunnel-client detects and masks nothing. Integration point: set --mcp.server-url to the AI/MCP
          gateway (authenticating to it with MCP_EXTRA_HEADERS or MCP-side mTLS) so records are classified
          before tunnel-client posts them back. Raw HTTP logging off by default (--log.http-raw-unsafe) and the
          redacted support export are log hygiene, not detection.
        verified: "2026-09-25"
