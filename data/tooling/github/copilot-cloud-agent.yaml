      - mitigation: cap-input-guardrails
        coverage: partial
        mechanism: >-
          GitHub strips hidden characters and HTML comments from issue and comment text before prompting;
          comments from users without write access are never presented; automations ignore events from those
          users by default; repository postToolUse hooks can replace a tool result (modifiedResult) before the
          model sees it; no classifier
        steps:
          - title: Leave untrusted-event handling at its default
            body:
              - >-
                When creating an automation keep events from users without write access ignored (the default);
                the opt-in is per automation, so review automations whose tool set is not read-only.
            url: https://docs.github.com/en/copilot/concepts/agents/cloud-agent/about-automations
          - title: Attach an inspector with a postToolUse hook
            body:
              - >-
                Commit .github/hooks/*.json with a postToolUse command hook that sends each tool result to your
                classifier and returns modifiedResult to replace flagged output; hook traffic is subject to the
                agent firewall.
            url: https://docs.github.com/en/copilot/reference/hooks-reference
          - title: Use Agentic Workflows for event-driven automation that must be hardened
            body:
              - >-
                Agents run read-only; writes are buffered as safe outputs, scanned by a detection job and
                executed by a separate job, with @mention neutralisation, size limits and min-integrity
                filtering of inputs.
            url: https://github.github.com/gh-aw/introduction/architecture/
        note: >-
          Rated partial on the input-screening rule. GitHub's hidden-character and HTML-comment filtering
          normalises one input class and is not admin-configurable; the postToolUse hook is an attach point —
          repository code, changeable by anyone who can merge to the default branch, that screens nothing until
          the organisation attaches a classifier, and that fails open on timeout. Repository files, command
          output and MCP tool results are not screened by GitHub. Putting instruction files, hooks and setup
          steps under CODEOWNERS with "Require review from Code Owners" (GitHub's own guidance) is a process
          control, credited here, not screening. Agentic Workflows adds input sanitisation and an AI
          threat-detection job on outputs; that is a variant, not this agent's default path.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityPromptInjectionDefense
          reviewRequired: false
          original:
            - capability: capabilityPromptInjectionDefense
              coverage: partial
              mechanism: >-
                Hidden-character and HTML-comment stripping before prompting, automations ignore non-write
                events, a content safety system on prompts and responses; Agentic Workflows sanitise user
                content and gate writes behind a threat-detection job
              note: >-
                No customer-configurable classifier; the structural gates (firewall, tool selection, workflow
                approval) carry the weight once injection succeeds.
              steps:
                - title: Leave untrusted-event handling at its default
                  body:
