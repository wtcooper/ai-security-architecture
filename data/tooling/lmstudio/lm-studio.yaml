# LM Studio — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# Exclusions: LM Studio Bionic (a separate agent app; its cloud models, web search, organisation-managed MCPs
# and Team-organisation credit billing belong to the agent, not to this runtime); Locally (the iPhone/iPad
# client that reaches LM Studio models over LM Link and serves nothing itself); the lmstudio-python and
# lmstudio-js SDKs and the LM Studio Hub (client libraries and a preset/plugin sharing site, recorded as facts).
# 2026-09-25: onboarded toolLmStudio against the MITRE capability rules; lmstudio.ai/docs answers 307 with no
# Location (docs/app used as the index), /work and /teams -> /enterprise, /privacy -> /app-privacy, /terms ->
# /app-terms, /docs/app/plugins/mcp -> /docs/app/mcp, /docs/cli/server-start -> /docs/cli/serve/server-start;
# lmstudio.ai/security is a Hub profile page, not a security page; /docs/enterprise 404; no SECURITY.md or
# published advisories in the lmstudio-ai GitHub repos; NVD keyword "lmstudio" returned 0 CVEs.
vendor: lmstudio
family: LM Studio
tools:
  - id: toolLmStudio
    name: LM Studio
    surfaceClasses:
      - desktopApp
      - selfHostedServer
      - endpointCli
    variants:
      - name: LM Studio desktop app
        class: desktopApp
        url: https://lmstudio.ai/docs/app
        note: >-
          GUI for search, download, chat and the local server (Developer tab > Start server). With "run the LLM
          server on login" checked, closing the app leaves the server running from the system tray.
      - name: llmster (headless daemon)
        class: selfHostedServer
        url: https://lmstudio.ai/docs/developer/core/headless
        note: >-
          The desktop app's core without the GUI, installed per user by install.sh / install.ps1 and started
          with lms daemon up; the docs' Linux startup task is a systemd unit at
          /etc/systemd/system/lmstudio.service running ~/.lmstudio/bin/lms as the named user.
      - name: lms CLI
        class: endpointCli
        url: https://lmstudio.ai/docs/cli
        note: >-
          Ships with either the app or llmster and drives both (lms get / import / load / server start / log
          stream); ls, load and ps accept --host to operate a reachable remote instance.
    architecture: archLocalInference
    status: ga
    asOf: "2026-09"
    summary:
      - >-
        Element Labs' desktop application for running open-weights models on the user's own machine (LM Studio
        0.4.25, 2026-09-19): a GUI over the llama.cpp engine (GGUF) and, on Apple Silicon, Apple MLX, with a
        local server that speaks OpenAI-compatible /v1, Anthropic-compatible /v1/messages and a native REST
        /api/v1, on port 1234 by default. The same core ships headless as llmster, driven by the lms CLI. Models are
        downloaded from Hugging Face (Discover tab, lms get, or the REST download endpoint) straight into
        ~/.lmstudio/models.
      - >-
        Inference stays on the device. What leaves it, per the App Privacy Policy: update checks, anonymised
        model search and download requests, engine (runtime) downloads, LM Link discovery through the LM Studio
        Hub with traffic between the user's devices over Tailscale, and — only if bought and used — Cloud
        Services (cloud models, web search) processed under zero data retention.
      - >-
        The admission settings are per-user app toggles in Developer > Server Settings: Serve on Local Network
        (the CLI binds 127.0.0.1 by default), Require Authentication with API tokens (off by default, 0.4.0+),
        Enable CORS (off by default), Just in Time Model Loading, and two MCP-over-API switches. No managed or
        locked settings file, MDM key or admin console for them is documented at any tier; only the bind has a
        non-GUI channel (lms server start --bind, LMS_SERVER_HOST). The Enterprise and Teams page sells the
        Bionic agent, not runtime policy.
    facts:
      - label: Plans
        value: >-
          The LM Studio app, llmster and lms are free, proprietary software under the App Terms. The pricing
          page now sells Bionic (Free; Bionic+ $20 and Pro $100 USD/month for US-hosted cloud models); teams get
          "centralized billing ... using inference credits" through an organisation, with team subscription
          plans "coming soon". The Enterprise and Teams page is a contact form for Bionic (ZDR cloud, own
          infrastructure or edge). No SSO, admin console, policy or MDM control for the runtime is documented
          at any tier; the changelog's "enterprise internal network model endpoint" mode (0.4.20, API key
          support 0.4.21) has no documentation page.
        url: https://lmstudio.ai/pricing
      - label: Inference & routing
        value: >-
          Local engines only: llama.cpp for GGUF (macOS, Windows, Linux), MLX on Apple Silicon, and the Splash
          engine on M3+ Macs (0.4.25); engines are packaged as hot-swappable runtime extension packs. Callers use
          http://localhost:1234 — /v1/models, /v1/responses, /v1/chat/completions, /v1/embeddings,
          /v1/completions, /v1/messages and /api/v1/*. With LM Link on, a request for a model held on another
          linked device is routed there over Tailscale through the same localhost call.
        url: https://lmstudio.ai/docs/developer/openai-compat
      - label: Data leaving the device
        value: >-
          Local chats, attached documents and API traffic stay on the machine. Update checks send app version,
          OS and IP; model search and download reach huggingface.co (or LM Studio's Hugging Face proxy option,
          0.3.9) and LM Studio receives anonymised search queries; engine downloads and LM Link discovery
          (through the LM Studio Hub) also go out.
          Cloud Services (cloud models, web search) send the request only when purchased and used. An API
          caller can also make the runtime connect out: POST /api/v1/models/download fetches any Hugging Face
          URL, and "Allow per-request MCPs" lets a request name a remote MCP server.
        url: https://lmstudio.ai/app-privacy
      - label: Retention & training
        value: >-
          No telemetry or user-specific tracking in local use; prompts and responses are not retained; Cloud
          Services requests are processed transiently under ZDR and not used for training (App Privacy Policy,
          effective June 2026). Conversations are stored locally as JSON in ~/.lmstudio/conversations
          (%USERPROFILE%\.lmstudio\conversations on Windows).
        url: https://lmstudio.ai/app-privacy
      - label: Docs index
        value: lmstudio.ai/docs/app and lmstudio.ai/docs/developer (full text at lmstudio.ai/llms-full.txt)
        url: https://lmstudio.ai/llms-full.txt
      - label: Offline operation
        value: >-
          Chat, document chat (RAG) and the local server work fully offline once a model is on disk. Model
          search, downloads, the Discover catalog, runtime downloads and app update checks need connectivity;
          updates are offered, not forced (notification to update now or later).
        url: https://lmstudio.ai/docs/app/offline
      - label: Model storage
        value: >-
          ~/.lmstudio/models/<publisher>/<model>/<file> by default, preserving the Hugging Face layout; the
          directory is changed in My Models. lms import moves (or --copy / --hard-link / --symbolic-link) a
          GGUF from elsewhere into that layout; no checksum is documented on download or import.
        url: https://lmstudio.ai/docs/app/advanced/import-model
      - label: MCP
        value: >-
          The app is an MCP client (0.3.17+) configured in mcp.json (Program tab > Install > Edit mcp.json); the
          chat UI asks before each tool call with allow-once or always-allow, managed in App Settings > Tools &
          Integrations. Through the API, "Allow calling servers from mcp.json" (requires Require
          Authentication) and "Allow per-request MCPs" (ephemeral remote servers) are server switches (defaults
          not documented), narrowed per request by allowed_tools; no human confirmation is documented for API
          calls.
        url: https://lmstudio.ai/docs/developer/core/mcp
      - label: LM Link
        value: >-
          Signed-in devices (LM Studio account) form a Tailscale-based network and use each other's models as
          if local, through localhost:1234. Off switch: Settings > LM Link > Enable LM Link off, or lms link
          disable for llmster. Whether Require Authentication applies to requests arriving over LM Link is not
          documented.
        url: https://lmstudio.ai/docs/lmlink/basics/faq
      - label: Vendor ownership
        value: Element Labs, Inc. (Delaware); privacy@lmstudio.ai; bugs reported at lmstudio-ai/lmstudio-bug-tracker
        url: https://lmstudio.ai/app-privacy
    items:
      - title: Server baseline for a managed device
        body:
          - "Developer > Server Settings: Require Authentication on (create one token per consuming application
            under Manage Tokens; clients send Authorization: Bearer or x-api-key), Serve on Local Network off,
            Enable CORS off, Allow per-request MCPs off, Allow calling servers from mcp.json off unless an
            application needs it, Just in Time Model Loading off on shared machines."
          - "These are per-user app settings; no managed settings file or MDM key is documented, so device
            management can only launch the server with lms server start --bind 127.0.0.1 (no --cors) or set
            LMS_SERVER_HOST=127.0.0.1, and must detect drift in the rest. Turn LM Link off (Settings > LM
            Link, or lms link disable) where the machine should serve only itself."
        links:
          - title: Server settings
            url: https://lmstudio.ai/docs/developer/core/server/settings
          - title: Authentication
            url: https://lmstudio.ai/docs/developer/core/authentication
          - title: lms server start
            url: https://lmstudio.ai/docs/cli/serve/server-start
      - title: Model supply chain
        body:
          - "Discover, lms get and POST /api/v1/models/download pull from Hugging Face directly into the loadable
            models directory — there is no quarantine step and no documented digest check. For a promotion
            flow, fetch and scan outside LM Studio, then bring approved GGUFs in with lms import --user-repo
            <org>/<repo> --copy, and point My Models at a directory only the promotion job can write."
          - "Loaders are limited to GGUF (llama.cpp) and MLX safetensors; the GGUF chat template still runs on
            every request, and since 0.4.17 a template override can be set per model in My Models > Load
            Parameters > Advanced > Chat Template."
        links:
          - title: lms import
            url: https://lmstudio.ai/docs/cli/local-models/import
          - title: Download a model (REST)
            url: https://lmstudio.ai/docs/developer/rest/download
          - title: LM Studio 0.4.17 release notes
            url: https://lmstudio.ai/changelog/lmstudio/lmstudio-v0.4.17
    riskNotes:
      - risk: riskMaliciousLoaderDeserialization
        note: >-
          No pickle loader ships: GGUF goes to llama.cpp and MLX models load with trust_remote_code off in the
          open-source MLX engine. The remaining classes are the GGUF parser (native code in fast-moving engine
          packs) and the embedded Jinja chat template, which runs on every request; answering Pillar Security on
          2025-06-20, LM Studio put template vetting on users. A per-model Chat Template override (0.4.17)
          replaces the embedded one for models the organisation has reviewed.
      - risk: riskModelSourceTampering
        note: >-
          Any Hugging Face URL is accepted by Discover, lms get and the REST download endpoint; the publisher
          name becomes the directory name and no digest verification is documented, so the file on disk is
          whatever the hub (or LM Studio's Hugging Face proxy) served.
      - risk: riskDenialOfMLService
        note: >-
          With Just in Time Model Loading on, any caller can make the runtime load any downloaded model into
          memory; batching is per model (Max Concurrent Predictions, default 4) with nothing per caller, and the
          API is unauthenticated by default. LM Link adds every signed-in device of the account as a caller.
      - risk: riskInsecureIntegratedComponent
        note: >-
          A proprietary desktop app plus llama.cpp / MLX engine packs that update separately from the
          app, an in-app updater (Linux AppImage and .deb since 0.4.22) and lms daemon update (stable or --beta,
          no version pinning). The vendor publishes no advisories: 0.4.16 lists only "Security hardening".
      - risk: riskExcessiveDataHandlingDuringInference
        note: >-
          The local API can send work off the machine: LM Link routes a localhost request to a model on another
          device, an API caller with "Allow per-request MCPs" on can make the runtime call any remote MCP server,
          and the privacy policy's paid Cloud Services send prompts to LM Studio's ZDR cloud.
      - risk: riskModelDeploymentTampering
        note: >-
          What is served can be changed through the API itself — /api/v1/models/download, /load and /unload —
          by any local process while Require Authentication is off, and by anyone on the network once Serve on
          Local Network is on; a file swapped in ~/.lmstudio/models is served on the next load with no check.
      - risk: riskModelExfiltration
        note: >-
          Model files, including any organisation adapters placed beside them, sit under ~/.lmstudio/models with
          the user's permissions, and LM Link exposes the loaded models to every device on the account's link.
    controls:
      - mitigation: D3-FA
        coverage: partial
        mechanism: >-
          Loader surface limited to GGUF (llama.cpp engine) and MLX safetensors — no pickle loader, MLX engine
          trust_remote_code off by default; no digest check, content scan or quarantine documented; lms import
          lets a scanned file be promoted from outside
        steps:
          - title: Point the runtime at promoted storage only
            body:
              - >-
                In My Models set the models directory to a location only the promotion job can write, so in-app
                downloads cannot land beside approved files unreviewed.
            url: https://lmstudio.ai/docs/app/basics/download-model
          - title: Promote scanned files with lms import
            body:
              - >-
                After the model scanner passes a GGUF in quarantine, run lms import <file> --user-repo
                <org>/<repo> --copy (with --dry-run first) instead of downloading it in the app.
            url: https://lmstudio.ai/docs/cli/local-models/import
          - title: Close the API download path
            body:
              - >-
                Turn on Require Authentication in Developer > Server Settings so POST /api/v1/models/download,
                which accepts catalog ids and any Hugging Face URL, needs an API token.
            url: https://lmstudio.ai/docs/developer/rest/download
        note: >-
          Partial by the drawing's rule (native needs verification before load; partial covers safe formats
          without it). The pickle and remote-code axis is closed by construction: the only engines are llama.cpp
          for GGUF and MLX for safetensors, and the open-source MLX engine loads with trust_remote_code=False and
          vendors model-specific code instead. Nothing inspects a file before load: no digest check on download
          or import is documented, no content scan ships, and Discover, lms get and the REST download endpoint
          write straight into the loadable directory, so fetch and promotion collapse. The GGUF chat template
          executes on every request, past any static scan (LM Studio's 2025-06-20 reply to Pillar Security put
          vetting on users), and the GGUF parser is itself native code. Format and content inspection at
          quarantine is an external model scanner in the artifact repository or promotion pipeline.
        verified: "2026-09-25"
      - mitigation: D3-MFA
        coverage: external
        mechanism: >-
          No human sign-in on the local server; API tokens (Require Authentication) and a loopback bind are the
          integration points for an authenticating reverse proxy / IdP
        evidence:
          - title: LM Studio docs — Authentication (API tokens, off by default)
            url: https://lmstudio.ai/docs/developer/core/authentication
          - title: LM Studio docs — lms server start (--bind, LMS_SERVER_HOST)
            url: https://lmstudio.ai/docs/cli/serve/server-start
          - title: LM Link FAQ (account-linked devices use each other's models)
            url: https://lmstudio.ai/docs/lmlink/basics/faq
        note: >-
          External on the drawing's rule: the runtime has no human sign-in to put a second factor on. The API
          accepts a static bearer token (Developer > Server Settings > Require Authentication; tokens from Manage
          Tokens; Authorization: Bearer or x-api-key) — one factor, held by software. Caller identity with MFA
          comes from an authenticating reverse proxy or IdP-aware gateway in front: keep the server on
          127.0.0.1 (lms server start --bind 127.0.0.1 or LMS_SERVER_HOST), give the proxy the only token, and
          publish only the proxy. The LM Studio account sign-in (lms login, used for LM Link and the Hub) is
          not a gate on the local API and documents no second-factor requirement; LM Link lets devices on the
          same account reach this machine's models, and whether Require Authentication applies to them is not
          documented, so turn LM Link off where the proxy must be the only path.
        verified: "2026-09-25"
      - mitigation: cap-output-guardrails
        coverage: external
        mechanism: >-
          No content classification in the runtime; prompt-preprocessor plugins see only chat-UI user input, not
          API traffic or model output
        evidence:
          - title: LM Studio docs — Prompt Preprocessors (called when the user hits Send)
            url: https://lmstudio.ai/docs/typescript/plugins/prompt-preprocessor
          - title: LM Studio docs — OpenAI-compatible endpoints
            url: https://lmstudio.ai/docs/developer/openai-compat
        note: >-
          External: LM Studio ships no harm-category, denied-topic or policy classifier on either direction, and
          the API returns raw model output. Prompt preprocessors (plugins) run when a user presses Send in the
          chat window, see only the current user message and never the response, and are not documented for
          server requests, so they are not an attach point on the api->runtime path. The class is an AI gateway
          or guardrail model served beside it: bind LM Studio to 127.0.0.1, turn on Require Authentication and
          give the gateway the only token so callers cannot bypass it. Whatever refusal behaviour the weights
          carry is the whole in-product defence.
        verified: "2026-09-25"
      - mitigation: AML.M0004
        coverage: partial
        mechanism: >-
          Per-model Max Concurrent Predictions (default 4), per-load context length and the JIT loading switches;
          API tokens name a caller but carry no documented rate limit or quota
        steps:
          - title: Cap concurrent predictions per model
            body:
              - >-
                In the model loader turn on Manually choose model load parameters and Show advanced settings, and
                set Max Concurrent Predictions (default 4) for each model the server exposes.
            url: https://lmstudio.ai/docs/app/advanced/parallel-requests
          - title: Stop callers loading models on demand
            body:
              - >-
                In Developer > Server Settings turn Just in Time Model Loading off, or keep Auto Unload Unused JIT
                Models and Only Keep Last JIT Loaded Model on, so a caller cannot fill memory with models.
            url: https://lmstudio.ai/docs/developer/core/server/settings
          - title: Issue one token per consuming application
            body:
              - >-
                With Require Authentication on, create a named token per application under Manage Tokens so a
                runaway caller can be identified and its token deleted.
            url: https://lmstudio.ai/docs/developer/core/authentication
        note: >-
          Partial by the drawing's rule (global concurrency, queue and context limits that are not per caller).
          Max Concurrent Predictions batches up to N requests per loaded model and queues the rest (lms ps --json
          reports the queue), and the context length bounds one request, but no limit attaches to a token, a
          process or a device: one caller can hold every slot. With JIT loading on, any caller can force a model
          load; LM Link adds the account's other devices as callers. Per-caller rates and quotas are gateway rate
          limiting in front of a loopback-bound server (external).
        verified: "2026-09-25"
      - mitigation: D3-MAN
        coverage: partial
        mechanism: >-
          Loopback bind by default (Serve on Local Network; lms server start --bind, LMS_SERVER_HOST), Require
          Authentication with API tokens (off by default), Enable CORS (off by default); no Host or Origin
          validation documented; per-user app settings with no managed channel except the bind
        steps:
          - title: Require API tokens
            body:
              - >-
                In Developer > Server Settings turn on Require Authentication and create tokens under Manage
                Tokens; every REST, SDK and /v1/messages request then needs Authorization: Bearer or x-api-key.
            url: https://lmstudio.ai/docs/developer/core/authentication
          - title: Pin the bind to loopback from device management
            body:
              - >-
                Leave Serve on Local Network off, and launch managed servers with lms server start --bind
                127.0.0.1 or set LMS_SERVER_HOST=127.0.0.1, the only non-GUI channel for these settings.
            url: https://lmstudio.ai/docs/cli/serve/server-start
          - title: Keep CORS and the MCP switches off
            body:
              - >-
                Leave Enable CORS off (never pass --cors) and keep Allow per-request MCPs and Allow calling
                servers from mcp.json off unless an authenticated application needs them.
            url: https://lmstudio.ai/docs/developer/core/server/settings
          - title: Turn off LM Link where the machine serves only itself
            body:
              - >-
                Set Settings > LM Link > Enable LM Link off in the app, or run lms link disable for llmster.
            url: https://lmstudio.ai/docs/lmlink/basics/faq
        note: >-
          Partial by the drawing's rule (native needs a loopback default, an auth option and Host/Origin
          validation, all configurable). Loopback default: yes — --bind defaults to 127.0.0.1 and the docs warn
          that any other bind needs authentication. Auth option: yes, off by default since it arrived in 0.4.0;
          tokens have editable permissions whose names are not documented, and the docs name REST, SDK and
          Anthropic-compatible requests as covered without saying so for /v1 OpenAI-compatible calls. Host and
          Origin validation: not documented — CORS off only stops a page reading replies, and DNS rebinding is
          not addressed. Delivery is the weak point: Require Authentication, CORS and Serve on Local Network are
          per-user app toggles with no documented managed or locked settings file, so the device's user can
          undo them and device management can only pin the bind and detect drift. LM Link is a second
          reachability path over Tailscale, and lms ls / load / ps --host operate any instance they can reach.
        verified: "2026-09-25"
      - mitigation: AML.M0005
        coverage: external
        mechanism: >-
          Model files under ~/.lmstudio/models (or the My Models directory) with the user's file permissions;
          not content-addressed, no digest on download or load; Require Authentication gates only the REST
          download / load / unload endpoints
        evidence:
          - title: LM Studio docs — models directory layout and lms import
            url: https://lmstudio.ai/docs/app/advanced/import-model
          - title: LM Studio docs — REST download endpoint (no verification documented)
            url: https://lmstudio.ai/docs/developer/rest/download
        note: >-
          External on the drawing's rule (partial needs at least a digest on download or content-addressed
          storage, which is what puts toolOllama's sha256 blob store at partial). Files are stored by
          publisher/model/file name as served by Hugging Face, readable and replaceable by any process running
          as the user, and nothing checks them at load, so a swapped or altered GGUF is served on the next
          load without notice. Restrictive permissions and swap detection are OS controls and file-integrity
          monitoring on the models directory; the product's contribution is the My Models directory setting
          (point it at storage the user cannot write) and Require Authentication, which keeps unauthenticated
          API callers from downloading, loading or unloading models but does nothing for the files themselves.
        verified: "2026-09-25"
      - mitigation: D3-ORA
        coverage: external
        mechanism: >-
          The decision lives in the organisation's GRC / AI governance register; LM Studio publishes a privacy
          policy and terms but no security policy, assurance report or advisory feed, and has no model-source
          allowlist setting
        evidence:
          - title: LM Studio Desktop App Privacy Policy (effective June 2026)
            url: https://lmstudio.ai/app-privacy
          - title: LM Studio App Terms of Use
            url: https://lmstudio.ai/app-terms
          - title: lmstudio-bug-tracker (no security policy file or published advisories)
            url: https://github.com/lmstudio-ai/lmstudio-bug-tracker
          - title: LM Studio Enterprise and Teams page (Bionic contact form)
            url: https://lmstudio.ai/enterprise
        note: >-
          External: whether local inference may run, from which sources and on which machines is recorded in the
          organisation's GRC, AI governance or TPRM platform. Vendor evidence for that record is thin: the App
          Privacy Policy and App Terms; no SOC 2 or ISO report, no trust or security page (lmstudio.ai/security
          resolves to a Hub profile), no SECURITY.md or advisories in the lmstudio-ai repositories, and fixes
          described only as "Security hardening" in the changelog. No device setting enforces a source decision:
          Discover, lms get and the REST download endpoint accept any Hugging Face URL, and the Hugging Face proxy
          option reroutes rather than restricts. Enforcement is the models-directory location, Require
          Authentication on the download endpoint, egress rules to huggingface.co at the device firewall or
          proxy, and application allow/deny through MDM.
        verified: "2026-09-25"
      - mitigation: D3-PA
        coverage: external
        mechanism: >-
          EDR over the LM Studio app and llmster processes; integration points are port 1234, ~/.lmstudio/bin/lms,
          the documented systemd unit, lms log stream and lms ps --json
        evidence:
          - title: LM Studio docs — llmster Linux startup task (systemd unit, binary path, port)
            url: https://lmstudio.ai/docs/developer/core/headless_llmster
          - title: LM Studio docs — lms log stream
            url: https://lmstudio.ai/docs/cli/serve/log-stream
          - title: LM Studio docs — lms daemon update
            url: https://lmstudio.ai/docs/cli/daemon/daemon-update
        note: >-
          External: process behaviour, vulnerable-version discovery and containment belong to the EDR. Points it
          can key on: the server on TCP 1234 (curl http://localhost:1234/v1/models answers with no token by
          default), ~/.lmstudio/bin/lms and the llmster daemon it starts (lms daemon up, lms daemon status
          --json), the desktop app kept in the tray by "run the LLM server on login", and
          /etc/systemd/system/lmstudio.service where the docs' Linux startup task is used. lms log stream
          --source server --json streams server logs and --source model the exact model input and output (no
          on-disk log path is documented); lms ps --json lists loaded models and queued requests. Version
          tracking must cover the app, llmster (lms daemon update, stable or --beta) and the llama.cpp / MLX
          engine packs, which update separately.
        verified: "2026-09-25"
      - mitigation: AML.M0023
        coverage: external
        mechanism: >-
          Local lists only (lms ls --json, GET /api/v1/models) with publisher, key, format, quantization and size
          — no digest, source URL or revision; no fleet inventory
        evidence:
          - title: LM Studio docs — GET /api/v1/models response fields
            url: https://lmstudio.ai/docs/developer/rest/list
          - title: LM Studio docs — lms ls
            url: https://lmstudio.ai/docs/cli/local-models/ls
        note: >-
          External on the drawing's rule (partial needs a local list with digests and source that fleet
          tooling can collect, as toolOllama's does; native a fleet inventory). LM Studio's lists — lms ls
          --json (or --host for a reachable instance) and GET /api/v1/models — give publisher, key, format
          (gguf/mlx), quantization, size_bytes and variants, but no hash, source URL or hub revision, and
          nothing aggregates across machines. An AI BOM needs MDM or EDR inventory scripts that hash files
          under ~/.lmstudio/models/<publisher>/<model>/ and record the source; the directory layout preserves
          the Hugging Face repository name, not its revision.
        verified: "2026-09-25"
      - mitigation: cap-shadow-ai-discovery
        coverage: external
        mechanism: >-
          EDR / MDM software inventory and network scanning; LM Studio reports nothing to an organisation
        evidence:
          - title: LM Studio docs — headless mode and llmster install
            url: https://lmstudio.ai/docs/developer/core/headless
          - title: LM Studio docs — Serve on Local Network
            url: https://lmstudio.ai/docs/developer/core/server/serve-on-network
          - title: LM Studio Desktop App Privacy Policy (no telemetry)
            url: https://lmstudio.ai/app-privacy
        note: >-
          External: nothing in the product registers an install with the organisation — local use carries no
          telemetry, and the Team organisation offers credit billing, not a device list. Signals for endpoint and
          network discovery: the LM Studio app install, the per-user ~/.lmstudio tree (models, bin/lms,
          conversations, hub), llmster installed per user by curl -fsSL
          https://lmstudio.ai/install.sh | bash or irm https://lmstudio.ai/install.ps1 | iex, a listener on TCP
          1234 (routable when Serve on Local Network or --bind 0.0.0.0 is set) answering GET /v1/models, and LM
          Link's Tailscale traffic to other devices.
        verified: "2026-09-25"
      - mitigation: AML.M0008
        coverage: external
        mechanism: >-
          No security evaluation ships; an evaluation harness or red-team tool calls the local API before a model
          is promoted into the models directory
        evidence:
          - title: LM Studio docs — OpenAI-compatible endpoints (harness target)
            url: https://lmstudio.ai/docs/developer/openai-compat
          - title: LM Studio docs — lms log stream (exact model input and output)
            url: https://lmstudio.ai/docs/cli/serve/log-stream
        note: >-
          External: LM Studio has no backdoor, leakage or adversarial test suite and no gate on what loads — any
          downloaded model is loadable, and JIT-loadable by any API caller. Evaluation harnesses and red-team
          tooling run against the OpenAI-compatible endpoint in a staging copy before a model is promoted;
          lms log stream --source model --filter input,output shows the exact templated prompt, which exposes
          chat-template behaviour to the evaluator. Catalog curation (staff picks, lmstudio-community uploads)
          is not an evaluation.
        verified: "2026-09-25"
