      - title: "Durable Extension"
        url: https://learn.microsoft.com/en-us/agent-framework/hosting/durable-extension
      - title: "Quickstart: Host a Durable Task SDK App on Azure Container Apps"
        url: https://learn.microsoft.com/en-us/azure/durable-task/sdks/quickstart-container-apps-durable-task-sdk
