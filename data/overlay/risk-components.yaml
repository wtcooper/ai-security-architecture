# Per-risk component highlights for the map tour.
#
# CoSAI-RM ships tourContent PROSE for introduced/exposed/mitigated but not the component
# ID lists needed to light up boxes on a map. This file supplies them.
#
#   source: saif      -> translated from data/overlay/saif-tour-seed.json, the highlight sets
#                        used by Google's original public SAIF Map, mapped onto CoSAI ids.
#   source: authored  -> written for the 21 risks CoSAI added after the SAIF donation,
#                        derived from that risk's own tourContent prose and cross-checked
#                        against the components its mapped controls protect.
#
# `mitigated` may be the literal `derived`, which resolves to the union of
# control.components across risk.controls. See data/PROVENANCE.md.
#
# SAIF box -> CoSAI component translation (applied when seeding, kept here for review):
#   box_DataSources      -> componentDataSources
#   box_DataFiltering    -> componentDataFilteringAndProcessing
#   box_TrainingData     -> componentTrainingData
#   box_DataStorage      -> componentDataStorage
#   box_ModelFrameworks  -> componentModelFrameworksAndCode
#   box_Evaluation       -> componentModelEvaluation
#   box_TrainingTuning   -> componentModelTrainingTuning
#   box_ModelStorage     -> componentModelStorage
#   box_ModelServing     -> componentModelServing
#   box_Model            -> componentTheModel
#   box_InputHandling    -> componentApplicationInputHandling
#   box_OutputHandling   -> componentApplicationOutputHandling
#   box_Application      -> componentApplication
#   box_AgentPlugin      -> componentReasoningCore + componentTools + componentMemory + componentRAGContent
#   box_Perception       -> componentAgentInputHandling
#   box_UserQuery        -> componentAgentUserQuery
#   box_SystemInstructions -> componentAgentSystemInstruction
#   box_Rendering        -> componentAgentOutputHandling
#   box_ReasoningCore    -> componentReasoningCore
#   box_Tools            -> componentTools
#   box_ContentRAG       -> componentRAGContent
#   box_Memory           -> componentMemory
#   box_Agent, box_Orchestration -> containers, no highlight of their own

