                The primary owner enables the Compliance API at Organization settings > API and creates a key
                with read:compliance_activities and read:compliance_user_data only.
            url: https://platform.claude.com/docs/en/manage-claude/compliance-api-access
          - title: Pull conversations with their tool calls
            body:
              - >-
                Walk /v1/compliance/apps/chats with order_by=updated_at and fetch each chat's messages with
                tool_result_max_chars and tool_use_input_max_chars set to -1 so inputs and results are not cut at
                10,000 characters.
            url: https://platform.claude.com/docs/en/api/compliance/apps/chats/messages/list
          - title: Stream the Activity Feed to the SIEM
            body:
              - >-
                Poll /v1/compliance/activities from the last saved cursor and correlate its events with your
                gateway's records.
            url: https://platform.claude.com/docs/en/manage-claude/compliance-activity-feed
        note: >-
          Native by the rule: an administrator exports conversation content with each connector call's tool,
          arguments, server and result, plus connector and policy events, programmatically. Boundaries: Enterprise
          only (Team has neither the API nor audit logs); pull-based, so a chat a member deletes before the next
          poll comes back with deleted_at and no content, and retention deletions are final; non-text tool
          results are omitted; transcripts of Cowork and Claude Code sessions are separate endpoints; integrity
          and retention beyond Anthropic's are the SIEM's. Inference hooks can push each governed transcript in
          real time as an archival alternative.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAuditLogging
          reviewRequired: false
          original:
            - capability: capabilityAuditLogging
              coverage: native
              mechanism: >-
                Enterprise audit logs (30+ event types, 180-day export) and the Compliance API Activity Feed
                with actor, IP, user agent and device; session transcripts for Cowork, Claude Code, M365 and
                Science
              steps:
                - title: Export or stream audit events
                  body:
                    - Owners export logs from Organization settings > Data and privacy, or query GET
                      /v1/compliance/activities continuously into the SIEM.
                  url: https://support.claude.com/en/articles/9970975-access-audit-logs
              note: >-
                Vendor-held audit log with a 180-day export window and the Activity Feed; durable retention
                and tamper evidence beyond that window are the organisation's archive. Events are attributed,
                not signed.
              verified: 2026-09-10
      - mitigation: cap-agent-kill-switch
        coverage: partial
        mechanism: >-
          Member removal (Organization settings > Members > Remove from team, or SCIM) ends access immediately;
          an Owner removes a connector for everyone at Organization settings > Connectors or sets its tools to
          Blocked; the Chat capability off on custom roles (up to 15 minutes); an Inference hooks deny for an
          account (Enterprise, beta); isLocalDevMcpEnabled and isDesktopExtensionEnabled false on devices
        steps:
          - title: Cut a member off
            body:
              - >-
                Select Remove from team at Organization settings > Members, or remove the person from the IdP app
                with SCIM; they lose access to the organisation immediately.
            url: https://support.claude.com/en/articles/13133750-manage-members-on-team-and-enterprise-plans
          - title: Remove a connector for everyone
            body:
              - >-
                At Organization settings > Connectors click Remove (or the three dots) on the connector, or set
                all of its tools to Blocked, then revoke the app's grant at the source (Entra, Google, your IdP).
            url: https://support.claude.com/en/articles/11175166-get-started-with-custom-connectors-using-remote-mcp
          - title: Refuse inference for an account (Enterprise, beta)
            body:
              - >-
                With Enforce verdicts on, have your AI security server deny that member's requests; turning
                enforcement on or off reaches every Anthropic server in about a minute.
            url: https://platform.claude.com/docs/en/manage-claude/inference-hooks-configuration
          - title: Remove device-side tools
            body:
              - >-
                Set isLocalDevMcpEnabled and isDesktopExtensionEnabled false in com.anthropic.claudefordesktop or
                HKLM\SOFTWARE\Policies\Claude.
            url: >-
              https://support.claude.com/en/articles/12622667-enterprise-configuration-for-claude-desktop
        note: >-
          Partial by the rule: there is no organisation-wide switch for claude.ai chat (the Chat capability can be
          turned off only on custom roles, and built-in roles keep it); removing a connector disables it for every
          member, but revocation of the grants at the source is not documented, so revoke them there; and the
          effect of either on a research run or tool loop already in progress is not documented (delay not
          documented; role changes up to 15 minutes). Member removal is documented as immediate. An Inference
          hooks deny refuses the next inference request, which halts a running tool loop at its next step, but
          only on Enterprise and only while the hook is enforcing.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityKillSwitch
          reviewRequired: false
          original:
            - capability: capabilityKillSwitch
              coverage: native
              mechanism: >-
                SCIM deprovisioning, member removal, connector disable (revokes for all), extension allowlist
                force-delete, device keys (isClaudeCodeForDesktopEnabled, secureVmFeaturesEnabled,
                isDesktopExtensionEnabled), Compliance API delete
              steps:
                - title: Cut access and remove data
                  body:
                    - Remove the member or SCIM group, disable the connector at Organization settings > Connectors, and delete
                      chats, files or projects through the Compliance API.
                  url: https://platform.claude.com/docs/en/manage-claude/compliance-api
              note: >-
                Seat removal and connector disable apply at the next request; a connector call in flight
                completes. The docs state no propagation delay, so measure it.
              verified: 2026-09-10
