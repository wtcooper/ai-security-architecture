    why: "A tool steered by injected text cannot send data to an arbitrary host, because every outbound connection from the cluster passes the firewall's allow list."
    mitigations: [D3-OTF]
    url: https://learn.microsoft.com/en-us/azure/aks/egress-outboundtype
    verified: "2026-11-18"
  - id: amlEndpointPublicNetworkAccess
    name: "public_network_access (managed online endpoint)"
    where: "Azure Machine Learning › Endpoints › (endpoint) YAML or az ml online-endpoint update --set public_network_access=disabled; needs a private endpoint on the workspace"
    setVia: [apiCli, cloudPolicy]
    area: network
    default: "enabled"
    recommended: "disabled, so scoring requests arrive only through the workspace private endpoint in the virtual network that API Management is joined to."
    value: "disabled"
    why: "Callers cannot skip the gateway, its rate limits and its content checks by calling the endpoint's public address directly."
    mitigations: [D3-NI]
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-secure-online-endpoint
    verified: "2026-11-18"
  - id: amlEndpointAadToken
    name: "auth_mode: aad_token (Microsoft Entra token authentication)"
    where: "Azure Machine Learning › Endpoints › (endpoint) YAML auth_mode; the caller's identity holds a role with Microsoft.MachineLearningServices/workspaces/onlineEndpoints/score/action"
    setVia: [apiCli, identityProvider]
    area: identity
    default: "key"
    recommended: "aad_token, with the scoring action granted only to API Management's managed identity, which requests a token for the resource https://ml.azure.com."
    value: "aad_token"
    why: "Scoring then needs an identity and a role assignment that can be revoked, instead of a static key that never expires."
    mitigations: [D3-AA]
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-authenticate-online-endpoint
    verified: "2026-11-18"
  - id: amlOnlineDeploymentInstances
    name: "instance_type and instance_count (one deployment per sensitivity tier)"
    where: "Azure Machine Learning › Endpoints › (endpoint) › deployment YAML: instance_type, instance_count"
    setVia: [apiCli, configFile]
    area: tools
    default: "Each deployment gets its own virtual machine instances"
    recommended: "Serve each sensitivity tier from its own endpoint and deployment, so its model and prompts run on virtual machine instances that no other tier's deployment uses."
    value: "Own endpoint and deployment per sensitivity tier"
    why: "Azure ML assigns virtual machines to a deployment and blocks deployments from connecting to each other, which gives the tier separation that tainted node pools gave on AKS."
    mitigations: [D3-HBPI]
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-endpoints-online
    verified: "2026-11-18"
  - id: amlEndpointTraffic
    name: "Endpoint traffic and mirror traffic"
    where: "Azure Machine Learning › Endpoints › (endpoint) › Update traffic; az ml online-endpoint update --traffic and --mirror-traffic"
    setVia: [apiCli]
    area: tools
    default: "A new deployment receives no live traffic"
    recommended: "Deploy each release as a new deployment at 0%, mirror a share of live traffic to it, then move a small percentage before all of it; keep the previous deployment until the new one is accepted."
    value: "0%, then mirrored, then a small share, then all"
    why: "A bad release is caught on mirrored or limited traffic and rolled back by changing percentages, without redeploying."
    mitigations: [cap-staged-rollout-gate]
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-safely-rollout-online-endpoints
    verified: "2026-11-18"
  - id: amlEndpointIdentity
    name: "Endpoint managed identity (user-assigned)"
    where: "Azure Machine Learning › Endpoints › (endpoint) YAML identity.type: user_assigned; AcrPull on the registry and Storage Blob Data Reader on the workspace default datastore"
    setVia: [apiCli, identityProvider]
    area: identity
    default: "System-assigned identity; the identity cannot be changed after the endpoint is created"
    recommended: "Create the endpoint with a user-assigned identity that holds only AcrPull and Storage Blob Data Reader and no write role. For a model deployed from a registry, Microsoft says to assign both roles at subscription level, so the scope is wider than one registry and one store."
    value: "User-assigned, AcrPull and Blob Data Reader only"
    why: "The serving container reads its image and weights with a credential it never sees and cannot use to alter the release."
    mitigations: [AML.M0005, D3-CH]
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-access-resources-from-endpoints-managed-identities
    verified: "2026-11-18"
  - id: amlEndpointDiagnostics
    name: "Diagnostic setting on the online endpoint"
    where: "Azure portal › (resource group) › (online endpoint resource) › Monitoring › Diagnostic settings; AmlOnlineEndpointTrafficLog, AmlOnlineEndpointConsoleLog and AmlOnlineEndpointEventLog to Log Analytics"
    setVia: [cloudPolicy, apiCli]
    area: audit
    default: "Not collected"
    recommended: "Send all three log categories to the Log Analytics workspace that already holds the API Management gateway logs, and join them on the request ID."
    value: "All three categories, joined to gateway logs"
    why: "The gateway log shows who asked; these logs show what reached the model server and what its container did, which the cluster's own logging used to provide."
    mitigations: [AML.M0024]
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-monitor-online-endpoints
    verified: "2026-11-18"
  - id: amlKubernetesComputeIdentity
    name: "Managed identity on the Kubernetes compute target"
    where: "az ml compute attach --type Kubernetes --identity-type SystemAssigned or UserAssigned; or Azure Machine Learning studio › Compute › Attached compute › (compute) › edit managed identity"
    setVia: [apiCli, identityProvider]
    area: identity
    default: "No managed identity on the compute target"
    recommended: "Attach the training namespace as its own compute target with a user-assigned identity that holds AcrPull on the workspace registry and read access to the training corpus and write access to the job output container only; keep datastores on identity-based access."
    value: "User-assigned identity, scoped to the job's data"
    why: "The job reaches data and images as a named identity with narrow roles, not with storage keys, and that identity is separate from the evaluation and promotion identities."
    mitigations: [D3-AA]
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-attach-kubernetes-to-workspace
    verified: "2026-11-18"
  - id: amlKubernetesInstanceType
    name: "Instance types (nodeSelector and resource limits)"
    where: "InstanceType custom resources in the cluster (kubectl apply), each with a nodeSelector and resource requests and limits; selected per job with resources.instance_type"
    setVia: [configFile, clusterPolicy]
    area: tools
    default: "defaultinstancetype, created at attach with minimal resources"
    recommended: "Define an instance type per trust level whose nodeSelector matches only that level's tainted GPU node pool, and set it explicitly in every training job; do not leave jobs on the default instance type."
    value: "One instance type per trust level, set in every job"
    why: "Training jobs land only on the node pool reserved for them, so job code does not share nodes with the extension's own pods or with other teams' workloads."
    mitigations: [D3-EI]
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-kubernetes-instance-types
    verified: "2026-11-18"
  - id: amlKubernetesNamespace
    name: "Kubernetes namespace of the compute target"
    where: "az ml compute attach --type Kubernetes --namespace <namespace>; the namespace is created in the cluster before the attach"
    setVia: [apiCli]
    area: network
    default: "The default namespace; all of the compute target's workloads run in the namespace named at attach"
    recommended: "Give training its own namespace and compute target, with a default-deny network policy in that namespace that allows only the workspace, storage and registry endpoints the job needs."
    value: "Own namespace with a default-deny network policy"
    why: "All of a compute target's jobs are placed in its namespace, which makes the namespace the unit to which network policy and Kubernetes access control are applied."
    mitigations: [D3-NI]
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-attach-kubernetes-to-workspace
    verified: "2026-11-18"
  # <<< more hosting rows
  # >>> managed agent service rows (the cloud controls around the provider's agent service)
  - id: storePrivateEndpoints
    name: "Private endpoints on the standard-setup stores (Azure Cosmos DB, Azure Storage, Foundry IQ (Azure AI Search))"
    where: "Azure Cosmos DB (sub-resource Sql), Storage account (blob) and Foundry IQ (Azure AI Search; sub-resource searchService) › Networking › private endpoint; Public network access: Disabled"
    setVia: [apiCli, adminConsole]
    area: network
    default: "Not created with the Foundry resource"
    requires: "Private DNS zones privatelink.documents.azure.com, privatelink.blob.core.windows.net and privatelink.search.windows.net linked to the virtual network"
    recommended: "Create a private endpoint for each store in your private endpoint subnet and set Public network access to Disabled on all three. Confirm from inside the virtual network that each name resolves to a private address."
    value: "A private endpoint per store, public access Disabled"
    why: "Agent Service reads and writes these stores directly. Their private endpoints are not created with the Foundry resource, so each store stays reachable from the internet until you close it."
    mitigations: [D3-NI]
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/virtual-networks
    verified: "2026-11-18"
  - id: apimInternalVnet
    name: "Virtual network: Internal (API Management)"
    where: "API Management › Network › Virtual network › Internal access type (classic Developer and Premium tiers); virtual network injection on Premium v2; an inbound private endpoint on Basic, Standard and Standard v2 (not available on Basic v2)"
    setVia: [adminConsole, apiCli]
    area: network
    default: "Public endpoint"
    recommended: "Give the gateway a private address only, and allow inbound traffic from the delegated agent subnet and the front end's subnet alone. A gateway created from the Foundry portal is public until you change it in the Azure portal."
    value: "Internal; private address only"
    why: "The agent's tool calls leave your delegated subnet and must find the gateway inside your network. A public gateway would accept a valid token from anywhere."
    mitigations: [D3-NI]
    url: https://learn.microsoft.com/en-us/azure/api-management/virtual-network-concepts
    verified: "2026-11-18"
  - id: cosmosCmk
    name: "Customer-managed key (Azure Cosmos DB)"
    where: "Azure Cosmos DB account › Encryption step at creation › Customer-managed key › Key URI; keyVaultKeyUri in Bicep or ARM"
    setVia: [apiCli, adminConsole]
    area: data
    default: "Service-managed keys"
    requires: "Key Vault with soft delete and purge protection, reachable publicly or through the trusted Microsoft services bypass"
    recommended: "Create the account that holds conversations with a key from your Key Vault before you name it in the project's capability settings. An existing account follows a separate procedure to add a key."
    value: "A key from your Key Vault, set at account creation"
    why: "Conversation history and agent definitions are written here. Your key adds a second layer of encryption that you hold, rotate and can withdraw; the account needs the key to stay reachable."
    mitigations: [AML.M0012]
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-setup-customer-managed-keys
    verified: "2026-11-18"
  - id: searchCmk
    name: "Customer-managed keys for Foundry IQ (Azure AI Search): service-level key (preview) or encryptionKey per object"
    where: "Foundry IQ (Azure AI Search) service › service-level customer-managed key (Search Management REST API 2026-03-01-preview or later); encryptionKey on each index"
    setVia: [apiCli]
    area: data
    default: "Microsoft-managed keys"
    requires: "Key Vault Crypto Service Encryption User for the search service's managed identity"
    recommended: "Set a service-level key so that indexes created later inherit it, and assign the Azure Policy definition that reports search services without customer-managed keys. A key cannot be added to an index that already exists."
    value: "A service-level key, inherited by new indexes"
    why: "Vector stores are indexes that Agent Service creates in your search service. Without a default key they are encrypted with Microsoft-managed keys only."
    mitigations: [AML.M0012]
    url: https://learn.microsoft.com/en-us/azure/search/search-security-manage-encryption-keys
    verified: "2026-11-18"
  - id: policyAiServicesNetworkAccess
    name: "Azure AI Services resources should restrict network access"
    where: "Azure Policy › Definitions › built-in (Azure AI Services) › assign at management group or subscription scope, effect Deny"
    setVia: [cloudPolicy]
    area: network
    default: "Not assigned"
    recommended: "Assign with effect Deny above every subscription that may hold a Foundry resource. Add the Deny definitions Azure Cosmos DB should disable public network access and Azure AI Search services should disable public network access for the stores."
    value: "Deny, above every Foundry subscription"
    why: "A Foundry resource is public unless someone closes it. With Deny, a deployment that leaves network access open is refused before the resource exists."
    mitigations: [D3-ACH, D3-NI]
    url: https://learn.microsoft.com/en-us/azure/governance/policy/samples/built-in-policies
    verified: "2026-11-18"
  - id: policyAiServicesKeyAccess
    name: "Azure AI Services resources should have key access disabled (disable local authentication)"
    where: "Azure Policy › Definitions › built-in (Azure AI Services) › assign at management group or subscription scope, effect Deny"
    setVia: [cloudPolicy]
    area: identity
    default: "Not assigned"
    recommended: "Assign with effect Deny. Add Cosmos DB database accounts should have local authentication methods disabled so the conversation store also accepts Microsoft Entra tokens only."
    value: "Deny"
    why: "Agent endpoints never accept API keys, but the model endpoints of the same Foundry resource do until key access is disabled. Policy stops a later deployment switching keys back on."
    mitigations: [D3-ACH, D3-CH]
    url: https://learn.microsoft.com/en-us/azure/governance/policy/samples/built-in-policies
    verified: "2026-11-18"
  - id: policyAiServicesCmk
    name: "Azure AI Services resources should encrypt data at rest with a customer-managed key (CMK)"
    where: "Azure Policy › Definitions › built-in (Cognitive Services) › assign at management group or subscription scope, effect Deny"
    setVia: [cloudPolicy]
    area: data
    default: "Not assigned"
    recommended: "Assign with effect Deny. Add Azure Cosmos DB accounts should use customer-managed keys to encrypt data at rest (Deny) and Azure AI Search services should use customer-managed keys to encrypt data at rest (audit only)."
    value: "Deny"
    why: "Microsoft says this definition is not assessed by default. Assigning it means a Foundry resource or conversation store without your key cannot be created."
    mitigations: [D3-ACH, AML.M0012]
    url: https://learn.microsoft.com/en-us/azure/governance/policy/samples/built-in-policies
    verified: "2026-11-18"
  - id: policyAllowedLocations
    name: "Allowed locations"
    where: "Azure Policy › Definitions › built-in (General) › assign at management group or subscription scope, effect Deny"
    setVia: [cloudPolicy]
    area: data
    default: "Not assigned"
    recommended: "List only the regions you have approved. The Foundry resource must be in the same region as its virtual network, and its key vault in the same region as the resource."
    value: "Only your approved regions"
    why: "Region decides where agent state rests. The definition excludes resources that use the 'global' region, and it does not govern where a Global deployment type processes prompts."
    mitigations: [D3-ACH]
    url: https://learn.microsoft.com/en-us/azure/governance/policy/samples/built-in-policies
    verified: "2026-11-18"
  - id: foundryDiagnosticSetting
    name: "Diagnostic setting on the Foundry resource (Audit, RequestResponse)"
    where: "Azure portal › Foundry resource › Monitoring › Diagnostic settings › Add diagnostic setting › Send to Log Analytics workspace"
    setVia: [adminConsole, apiCli]
    area: audit
    default: "No diagnostic setting"
    recommended: "Select Audit and RequestResponse and send them to your own workspace. Assign Diagnostic logs in Azure AI services resources should be enabled so a resource without the setting is reported."
    value: "Audit and RequestResponse to your own workspace"
    why: "Resource logs are not collected until a diagnostic setting exists. They record data-plane requests to the Foundry resource, which the activity log does not."
    mitigations: [cap-agent-tracing]
    url: https://learn.microsoft.com/en-us/azure/ai-services/diagnostic-logging
    verified: "2026-11-18"
  - id: activityLogExport
    name: "Export Activity Logs (subscription diagnostic setting)"
    where: "Azure Monitor › Activity log › Export Activity Logs › Send to Log Analytics workspace"
    setVia: [adminConsole, apiCli]
    area: audit
    default: "Kept for 90 days, not exported"
    recommended: "Export the activity log of every subscription that holds Foundry resources to the workspace that receives the traces and the gateway log (AzureActivity table), and limit who can read it."
    value: "Exported to the trace workspace, read access limited"
    why: "The activity log shows who created or changed the Foundry resource, its projects, network rules and role assignments. Azure deletes it after 90 days unless you export it."
    mitigations: [cap-agent-tracing]
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/fundamentals/activity-log
    verified: "2026-11-18"
  - id: entraAgentSignInLogs
    name: "Microsoft Entra Agent ID logs (agent sign-in and audit logs)"
    where: "Microsoft Entra admin center › Entra ID › Monitoring & health › Sign-in logs (agent filters) and Audit logs (agentType)"
    setVia: [identityProvider]
    area: audit
    recommended: "Review agent sign-ins and audit events with the Foundry traces. Match the agent identity's application ID, which is the azp or appid claim of its tokens, to the caller your gateway records."
    value: "Reviewed with the Foundry traces"
    why: "These logs show which agent identity obtained a token for which resource, and on behalf of which user. That is the join between the service's traces and your gateway's record."
    mitigations: [cap-agent-tracing, D3-AA]
    url: https://learn.microsoft.com/en-us/entra/agent-id/sign-in-audit-logs-agents
    verified: "2026-11-18"
  - id: storeDataPlaneRoles
    name: "Runtime roles of the project managed identity on the stores"
    where: "Access control (IAM): Cosmos DB Operator and Storage Account Contributor at account level; Cosmos DB Built-in Data Contributor on database enterprise_memory; Storage Blob Data Contributor and Storage Blob Data Owner on the two project containers; Search Index Data Contributor and Search Service Contributor"
    setVia: [apiCli, adminConsole]
    area: identity
    recommended: "Grant the project's managed identity only the documented roles, at database and container scope where the role allows it. Give each trust group its own project, and for production its own Foundry resource."
    value: "Only the documented roles, at the narrowest scope"
    why: "Agents reach their state as the project's managed identity with no stored key. Every agent in a project shares that identity and the same files, conversations and indexes."
    mitigations: [D3-CH, AML.M0031]
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/standard-agent-setup
    verified: "2026-11-18"
  - id: webSearchSubscriptionBlock
    name: "OpenAI.BlockedTools.web_search (subscription feature registration)"
    where: "Subscription › resource provider Microsoft.CognitiveServices › feature OpenAI.BlockedTools.web_search, registered with the Azure CLI"
    setVia: [apiCli]
    area: tools
    default: "Web search available"
    recommended: "Register the feature on every subscription whose agents must not search the web. It disables the web search tool for all Foundry accounts in the subscription and needs Contributor at subscription scope."
    value: "Registered where agents must not search the web"
    why: "Web search is called from Microsoft's side over public endpoints and bypasses the agent subnet, so your firewall cannot limit it. This switch removes the tool for a whole subscription."
    mitigations: [cap-agent-egress-control]
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/web-search
    verified: "2026-11-18"
  # <<< managed agent service rows
  # >>> software factory rows (the settings that build and guard the factory and the apps it makes)
  - id: ghAppInstallationTokenScope
    name: "Installation access token, restricted with repositories and permissions"
    where: "GitHub App (factory agent) › POST /app/installations/{installation_id}/access_tokens with repositories or repository_ids and permissions"
    setVia: [code, apiCli]
    area: identity
    default: "All repositories and permissions the installation was granted"
    recommended: "Have the orchestrator, not the agent, mint each build's token for the one app repository with contents and pull requests write only. The token expires after an hour; the app is never a bypass actor on any ruleset."
    value: "One repository; contents and pull requests write"
    why: "The agent can push a branch and open a pull request in its own app's repository and nothing else, so whatever it is talked into stays on a branch."
    mitigations: [AML.M0028]
    url: https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/generating-an-installation-access-token-for-a-github-app
    verified: "2026-11-21"
  - id: ghDefaultBranchRuleset
    name: "Branch rulesets on the default branch (Require a pull request, Require status checks, Require workflows to pass before merging, Restrict updates)"
    where: "GitHub organisation › Settings › Rulesets › New branch ruleset, targeting every factory repository"
    setVia: [adminConsole, apiCli]
    area: tools
    default: "No ruleset; any writer can push or merge to the default branch"
    recommended: "Active, empty bypass list: Require a pull request before merging, Require status checks to pass with the pipeline app as source, platform build and IaC workflows (no CodeQL in ruleset workflows), Block force pushes. Second ruleset: Restrict updates, merge app bypass only."
    value: "Active; pipeline checks required; only pipeline merges"
    why: "The agent cannot merge, skip a check or fake a status, and the build and scan definitions run from a repository it cannot write to."
    mitigations: [AML.M0028, D3-SYSVA]
    url: https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/available-rules-for-rulesets
    verified: "2026-11-21"
  - id: ghPushRulesetWorkflowPaths
    name: "Restrict file paths (push ruleset)"
    where: "GitHub organisation › Settings › Rulesets › New push ruleset › Restrict file paths: .github/**"
    setVia: [adminConsole, apiCli]
    area: tools
    default: "Any writer can push changes to workflow files"
    recommended: "Block pushes that touch .github/** (workflows, CODEOWNERS, Copilot setup steps) in every factory repository, with only the platform team able to bypass. Push rules apply to the whole fork network."
    value: ".github/** blocked for all but the platform team"
    why: "A workflow the agent wrote could request the preview deploy identity's token or drop a step. Blocking the path keeps pipeline definitions out of its reach."
    mitigations: [AML.M0028]
    url: https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/available-rules-for-rulesets
    verified: "2026-11-21"
  - id: ghEnvRequiredReviewers
    name: "Required reviewers with self-review prevented (production environment)"
    where: "GitHub repository › Settings › Environments › production › Deployment protection rules"
    setVia: [adminConsole, apiCli]
    area: identity
    default: "No reviewers; administrators can bypass protection rules"
    recommended: "Required reviewers: the app's owner team only, never the requester; prevent self-review on; administrator bypass disallowed; deployment branches limited to the default branch. Environment secrets stay unavailable until the owner approves the run."
    value: "Owner team required, prevent self-review, no bypass"
    why: "The named owner approves each exact release run before it meets real data, and nobody, administrators included, can deploy around that decision."
    mitigations: [AML.M0029]
    url: https://docs.github.com/en/actions/reference/workflows-and-actions/deployments-and-environments
    verified: "2026-11-21"
  - id: deployIdentityFederated
    name: "Federated identity credential, entity type Environment (deploy identity)"
    where: "Managed Identities › (app's deploy identity) › Federated credentials › GitHub Actions deploying Azure resources › Entity type: Environment"
    setVia: [cloudPolicy, apiCli]
    area: identity
    default: "Microsoft's walkthrough stores a Contributor service principal secret in GitHub"
    recommended: "One user-assigned identity per app, trusting only that repository's production environment, holding a custom role on the app's resource group without Microsoft.App/containerApps/listSecrets. Built-in Container Apps Contributor and Operator can read secret values."
    value: "OIDC, production environment only; no listSecrets"
