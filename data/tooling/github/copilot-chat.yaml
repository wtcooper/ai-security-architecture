# GitHub Copilot Chat on github.com — one entity per product × reference architecture. Facts are
# dated (asOf) and cite the vendor's own documentation; re-verify before enforcing. Schema:
# data/tooling/README.md. Excluded: knowledge bases (replaced by Spaces), GitHub Models (retired
# 2026-07-30), Copilot Extensions (retired 2025-11-10).
vendor: github
family: GitHub Copilot Chat
tools:
  - id: toolCopilotChatGithub
    name: GitHub Copilot Chat on github.com
    surfaceClasses:
      - saasChat
    variants:
      - name: Copilot Chat on github.com (immersive and panel)
        class: saasChat
        url: https://docs.github.com/en/copilot/how-tos/chat-with-copilot/chat-in-github
      - name: Copilot Chat in GitHub Mobile
        class: saasChat
        url: https://docs.github.com/en/copilot/concepts/chat
      - name: Copilot Spaces (curated context, organisation-owned or personal)
        class: saasChat
        url: https://docs.github.com/en/copilot/concepts/context/spaces
      - name: Copilot Memory (public preview; used by cloud agent, code review and CLI)
        class: saasChat
        url: https://docs.github.com/en/copilot/concepts/agents/copilot-memory
    architecture: archEnterpriseAiChat
    status: ga
    asOf: "2026-09"
    summary:
      - "Copilot Chat on github.com and Mobile answers over repositories, issues and PRs the user
        can see, attaches images and PDFs, searches the web when the policy allows, and calls a
        fixed GitHub MCP server to do a limited set of tasks (branches, merges) on request; a chat
        can hand off into a cloud agent session. Spaces bundle repositories, files, issues and
        uploads as reusable context; Memory keeps repository facts and user preferences for the
        agents."
      - "Inference runs on the Copilot API with enterprise-enabled models; retrieval runs with the
        user's own permissions (viewers of a Space only see sources they can access). Conversations
        are stored by GitHub: today 100 conversations with 28-day message retention, moving to
        life-of-account on or after 2026-09-28 when chat, Mobile chat and the cloud agent merge under
        one policy. Business and Enterprise prompts are not used for training."
      - "Admin levers are the \"Copilot in GitHub.com\" policy (soon the unified policy), the web
        search, Memory and models policies, content exclusion, and administrator export / delete
        of Memory. Spaces have no dedicated policy on the pages fetched; the MCP policy does not
        apply to Chat in GitHub."
    facts:
      - label: Plans
        value: "All plans; Business and Enterprise gate it with Copilot in GitHub.com and, from 2026-09-28, a single policy shared with Mobile chat and the cloud agent."
        url: https://github.blog/changelog/2026-08-28-upcoming-changes-to-github-copilot-policies-and-billing/
      - label: Inference & routing
        value: "Copilot API; models selectable per conversation within the enterprise Configure models policy; enterprise BYOK custom models appear in Chat; data-resident routing under the data residency policy."
        url: https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-enterprise/use-your-own-api-keys
      - label: Data leaving the browser
        value: "Prompts, attached files, repository context and (when enabled) web search results to the Copilot API; nothing runs on the device."
        url: https://docs.github.com/en/copilot/responsible-use/chat
      - label: Data retention / training
        value: "Up to 100 recent conversations, messages kept 28 days — changing to retention for the life of the account on or after 2026-09-28; Memory entries expire after 28 days unused; Business and Enterprise data is not used for training."
        url: https://docs.github.com/en/copilot/how-tos/chat-with-copilot/chat-in-github
      - label: Docs index
        value: "Copilot Chat concepts, Spaces and Memory."
        url: https://docs.github.com/en/copilot/concepts/chat
    items:
      - title: Policies that reach chat on github.com
        body:
          - "Copilot in GitHub.com (feature toggle; opt-in preview features and feedback
            collection hang off it), Copilot can search the web, Configure models and Configure
            custom models, Copilot Memory, content exclusion — all honoured by Chat in GitHub per
            the supported-surfaces table. MCP servers in Copilot and the registry restriction are
            not: chat's GitHub MCP server is fixed. Across a user's organisations the least
            restrictive setting wins for most policies, but web search and public-code matching
            follow the most restrictive."
        links:
          - title: Supported surfaces for policies
            url: https://docs.github.com/en/copilot/reference/supported-surfaces-for-policies
          - title: Policy conflicts
            url: https://docs.github.com/en/copilot/reference/enterprise-administrators/policy-conflicts
      - title: Memory administration and the 2026-09-28 change
        body:
          - "Copilot Memory is enabled per user under an enterprise or organisation policy; admins
            export (JSONL) or delete user-level preferences per user or in bulk from Organization
            Settings > Copilot > Access or the enterprise licensing page. Memory does not apply
            to IDEs or the Copilot app. From 2026-09-28 chat retention becomes life-of-account;
            administrators who do not confirm the unified policy lose Copilot on github.com and
            Mobile for their users."
        links:
          - title: Managing Copilot Memory for an organisation or enterprise
            url: https://docs.github.com/en/copilot/how-tos/use-copilot-agents/copilot-memory/manage-as-administrator
          - title: Upcoming changes to Copilot policies and billing
            url: https://github.blog/changelog/2026-08-28-upcoming-changes-to-github-copilot-policies-and-billing/
    riskNotes:
      - risk: riskPromptInjection
        note: >-
          CamoLeak (2025) turned hidden PR-description comments into silent exfiltration through
          GitHub's own Camo image proxy; the fix was to stop rendering images in chat. Chat still
          reads every issue and PR the user can see, and can now act through the GitHub MCP server.
      - risk: riskSensitiveDataDisclosure
        note: >-
          Retention moves from 28 days to life-of-account on 2026-09-28; Spaces accept uploads
          and free text that are then shareable to organisation members or publicly; Memory
          quotes users' own words back into other sessions.
      - risk: riskExcessiveDataHandlingDuringInference
        note: >-
          Web search and image/PDF attachments widen the inference input beyond repository data;
          both are policy-controlled (web search) or user-controlled (attachments) rather than
          inspected.
      - risk: riskRetrievalVectorStorePoisoning
        note: >-
          Spaces and Memory are the retrieval stores; anyone with editor access to an
          organisation Space, or push access to a repository, can shape what the model reads.
    controls:
      - capability: capabilityIga
        coverage: native
        mechanism: Copilot seat assignment (enterprise teams, IdP-synced under EMU), Copilot in GitHub.com policy, SAML SSO
        steps:
          - title: Assign seats and enable the feature
            body:
              - Grant licences from Enterprise > Billing and licensing > Licensing > Copilot (users, enterprise teams or organisations); enable Copilot in GitHub.com under AI controls > Copilot > Configure features & clients.
            url: https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-enterprise/manage-access/grant-access
          - title: Confirm the unified policy before 2026-09-28
            body:
              - Review the single policy replacing Copilot Chat on github.com, Chat in Mobile and the cloud agent; opting out removes chat on github.com and Mobile.
            url: https://github.blog/changelog/2026-08-28-upcoming-changes-to-github-copilot-policies-and-billing/
        verified: "2026-09-10"
      - capability: capabilitySse
        coverage: external
        mechanism: No vendor feature; github.com chat traffic is ordinary HTTPS to github.com
        note: >-
          An SSE or CASB can only see the browser session; the model traffic originates from
          GitHub's side. Tenancy enforcement must rely on SSO and seat assignment.
        verified: "2026-09-10"
      - capability: capabilityAiDlp
        coverage: partial
        mechanism: Content exclusion (honoured by Chat on GitHub and Mobile) and the web-search policy; no inspection of prompts or uploads
        steps:
          - title: Exclude sensitive paths at enterprise scope
            body:
              - "Enterprise > AI controls > Copilot > Content exclusion: fnmatch patterns per repository or \"*\" — applied to chat on the GitHub website and Mobile, not to third-party agents."
            url: https://docs.github.com/en/copilot/concepts/context/content-exclusion
          - title: Decide on web search
            body:
              - Set Copilot can search the web at enterprise level; it is one of the policies where the most restrictive organisation setting wins.
            url: https://docs.github.com/en/copilot/reference/enterprise-administrators/policy-conflicts
        verified: "2026-09-10"
      - capability: capabilityBrowserDetectionResponse
        coverage: external
        mechanism: No vendor feature; paste and upload controls belong to a browser security product
        note: >-
          Chat accepts JPEG, PNG, GIF, WEBP, PDF, HEIC and HEIF attachments; only a browser
          control can stop uploads of classified documents.
        verified: "2026-09-10"
      - capability: capabilityEgressControl
        coverage: partial
        mechanism: Web-search policy; image rendering disabled in chat (post-CamoLeak); GitHub MCP server limited to a fixed task set
        note: >-
          The model's reach is GitHub data plus web search; there is no domain allowlist for
          chat, and the vendor's remaining lever is to keep web search off.
        steps:
          - title: Turn web search off where exfiltration risk matters
            body:
              - Disable Copilot can search the web; it applies to IDEs and Chat in GitHub.
            url: https://docs.github.com/en/copilot/reference/supported-surfaces-for-policies
        verified: "2026-09-10"
      - capability: capabilityAiGovernancePlatform
        coverage: partial
        mechanism: Enterprise AI controls tab (features, privacy, models, Memory, MCP), audit log for policy changes
        note: >-
          Switches and evidence of switching exist; catalogue and intake are external.
        steps:
          - title: Manage policies from the AI controls tab
            body:
              - Enterprise > AI controls > Copilot > Configure features & clients holds the chat-relevant policies; organisation settings sit under Settings > Code, planning, and automation > Copilot.
            url: https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-enterprise/manage-enterprise-policies
        verified: "2026-09-10"
      - capability: capabilityHitlControls
        coverage: partial
        mechanism: GitHub MCP actions run "at your request" in the conversation; agent hand-offs land in the cloud agent's draft-PR and workflow-approval gates
        note: >-
          The chat page documents no per-action approval prompt for the built-in MCP tasks; the
          human gate is the conversation itself and, downstream, PR review.
        steps:
          - title: Keep the downstream gates
            body:
              - Chat can create branches or merge PRs on request and can start cloud agent sessions; branch protections, rulesets and workflow approval remain the enforced approvals.
            url: https://docs.github.com/en/copilot/concepts/chat
        verified: "2026-09-10"
      - capability: capabilityPromptInjectionDefense
        coverage: partial
        mechanism: Vendor-side mitigations (image rendering disabled after CamoLeak; hidden-character filtering for agent hand-offs); no customer configuration
        steps:
          - title: Know what the vendor changed
            body:
              - Image rendering in Copilot Chat was disabled on 2025-08-14 to close the Camo exfiltration channel; hidden HTML comments in issues and PRs are filtered before agent prompts.
            url: https://www.legitsecurity.com/blog/camoleak-critical-github-copilot-vulnerability-leaks-private-source-code
        verified: "2026-09-10"
      - capability: capabilityNhiManagement
        coverage: none
        mechanism: Chat acts as the signed-in user; there is no separate agent identity to manage
        note: >-
          Actions taken through chat's GitHub MCP server are the user's own; attribution is the
          user account.
        verified: "2026-09-10"
      - capability: capabilityVendorAssurance
        coverage: external
        mechanism: Policy state is visible in the UI and audit log; an SSPM tool reads it via the audit log stream and REST APIs
        verified: "2026-09-10"
      - capability: capabilityDspm
        coverage: partial
        mechanism: Conversation retention (28 days → life of account from 2026-09-28), Memory export / delete and 28-day expiry, Spaces visibility settings
        steps:
          - title: Export or delete Memory when required
            body:
              - "Organization Settings > Copilot > Access: Export Copilot memories / Delete Copilot memories per user, or Download / Delete user memories in bulk (JSONL, 10 exports per hour)."
            url: https://docs.github.com/en/copilot/how-tos/use-copilot-agents/copilot-memory/manage-as-administrator
          - title: Plan for life-of-account chat retention
            body:
              - After 2026-09-28 chat conversations are retained for the life of the account rather than 28 days; treat chat history as a data store in retention policy.
            url: https://github.blog/changelog/2026-08-28-upcoming-changes-to-github-copilot-policies-and-billing/
        verified: "2026-09-10"
      - capability: capabilityAiTprm
        coverage: external
        mechanism: No vendor feature; model-hosting page lists providers and retention terms
        steps:
          - title: Record the provider set
            body:
              - OpenAI on Azure, Anthropic on AWS / Anthropic / GCP (Claude Fable 5 / 5.1 retain by default), Google, xAI, Moonshot on Foundry / Fireworks.
            url: https://docs.github.com/en/copilot/reference/ai-models/model-hosting
        verified: "2026-09-10"
      - capability: capabilityEncryptionKeyManagement
        coverage: none
        mechanism: No customer-managed keys; regional routing via the data residency policy
        note: >-
          "Restrict Copilot to data residency compliant models" (off by default, +10% credits)
          keeps inference in the US or EU boundary; keys remain GitHub's.
        verified: "2026-09-10"
      - capability: capabilitySecretsManagement
        coverage: none
        mechanism: Not applicable — chat holds no agent credentials; secret scanning covers repository content, not chat uploads
        note: >-
          Uploaded files and pasted text are not secret-scanned; content exclusion of secret paths
          is the only vendor lever.
        verified: "2026-09-10"
      - capability: capabilityToolPermissionScoping
        coverage: partial
        mechanism: Fixed GitHub MCP server with a limited task set; MCP policy and registry restriction do not apply to Chat in GitHub; web-search policy
        note: >-
          The tool set cannot be narrowed by the customer; only web search can be switched off.
        steps:
          - title: Accept the fixed tool set or disable the surface
            body:
              - The supported-surfaces table shows MCP servers in Copilot as not applicable to Copilot Chat in GitHub; the built-in GitHub MCP server performs a limited set of tasks at the user's request.
            url: https://docs.github.com/en/copilot/reference/supported-surfaces-for-policies
        verified: "2026-09-10"
      - capability: capabilityDataAccessGovernance
        coverage: partial
        mechanism: Retrieval runs as the user; Space viewers only see sources they have access to; no remediation of over-shared repositories
        steps:
          - title: Rely on repository permissions and Space visibility
            body:
              - Organisation-owned Spaces grant admin / editor / viewer or No access; viewers only see sources they can already access — fix repository over-sharing first.
            url: https://docs.github.com/en/copilot/concepts/context/spaces
        verified: "2026-09-10"
      - capability: capabilityAgentRegistry
        coverage: partial
        mechanism: Organisation-owned Spaces with role-based sharing; enterprise custom agents and the Agent apps policy; no registry for Spaces
        note: >-
          Anyone with a Copilot licence, including Free, can create a Space; there is no
          dedicated Spaces policy on the pages fetched — only visibility settings per Space.
        steps:
          - title: Prefer organisation-owned Spaces
            body:
              - Create shared Spaces under the organisation so access is admin / editor / viewer by member rather than public or user-by-user.
            url: https://docs.github.com/en/copilot/concepts/context/spaces
        verified: "2026-09-10"
      - capability: capabilityAuditLogging
        coverage: partial
        mechanism: Audit log records policy, licensing and Memory administration events (180 days, streamable); chat prompts are not logged
        steps:
          - title: Stream policy and licensing events
            body:
              - Filter action:copilot in the enterprise audit log and stream to a SIEM; client and chat prompts are not recorded.
            url: https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-enterprise/review-audit-logs
        verified: "2026-09-10"
      - capability: capabilityShadowAiDiscovery
        coverage: external
        mechanism: No vendor feature; personal Copilot accounts on github.com are invisible to the enterprise
        verified: "2026-09-10"
      - capability: capabilityKillSwitch
        coverage: native
        mechanism: Copilot in GitHub.com policy Disabled everywhere (unified policy from 2026-09-28); seat removal; Memory policy Disabled everywhere with bulk delete
        steps:
          - title: Disable at enterprise scope
            body:
              - Set Copilot in GitHub.com to Disabled everywhere; across enterprises the most restrictive policy applies, within one enterprise set it at enterprise level.
            url: https://docs.github.com/en/copilot/concepts/policies
          - title: Purge Memory
            body:
              - Set Copilot Memory to Disabled everywhere and use Delete user memories in bulk.
            url: https://docs.github.com/en/copilot/how-tos/use-copilot-agents/copilot-memory/manage-as-administrator
        verified: "2026-09-10"
    advisories:
      - title: "CamoLeak — hidden PR-comment prompt injection exfiltrates private repository content through GitHub's Camo image proxy (Legit Security, fixed 2025-08-14; no CVE and no first-party advisory — the CVE-2025-59145 id circulated in press belongs to an unrelated npm record)"
        url: https://www.legitsecurity.com/blog/camoleak-critical-github-copilot-vulnerability-leaks-private-source-code
        date: "2025-10"
      - title: "CVE-2025-59145 — CVE Program record (color-name npm malware), cited here only to show it is not the CamoLeak identifier"
        url: https://cveawg.mitre.org/api/cve/CVE-2025-59145
        date: "2025-09"
