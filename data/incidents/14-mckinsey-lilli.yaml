id: mckinsey-lilli
title: "McKinsey's Lilli: an autonomous agent finds open endpoints and writable system prompts"
subtitle: >
  A red-team startup's autonomous agent found 22 unauthenticated API endpoints on McKinsey's
  internal AI platform, turned one into a SQL injection, and reached the database that held the
  chat history and all 95 system prompts — in about two hours.
date: 2026-03
dateRange: Late February – 9 March 2026
category: exposed
perspective: target
archetype: archEnterpriseAiChat
caveat: >
  The access figures are CodeWall's own; McKinsey's forensic review found no evidence that client
  data was accessed.
breaks:
  - capability: D3-APA
    how: "No endpoint of an AI platform answers without an access policy — 22 did, and their documentation was public."
  - capability: D3-DI
    how: "Know what sits in the platform's database: chat history, files and the system prompts, side by side."
  - capability: cap-sensitive-data-redaction
    how: "Chat history kept in plaintext is the prize; redact or minimise it before it is stored."
summary:
  - >
    Lilli is McKinsey's internal generative AI platform, used by about 72% of its staff and
    handling more than 500,000 prompts a month. CodeWall's security agent chose it as a target
    itself, citing McKinsey's public responsible-disclosure policy, and went in with no
    credentials and no human in the loop.
  - >
    The flaws were not AI flaws. Public API documentation listed 22 endpoints that asked for no
    authentication; one wrote user search queries and concatenated JSON keys into SQL. The AI
    part is what sat behind them: CodeWall claims 46.5 million plaintext chat messages, 728,000
    files, 57,000 accounts — and write access to the 95 system prompts that shape every answer
    Lilli gives.
  - >
    CodeWall disclosed on 1 March; McKinsey closed the endpoints, took the development
    environment offline and pulled the public documentation by 2 March. Its forensic review
    found no evidence that client data was accessed by CodeWall or anyone else, and an analyst
    called the chain "plausible" but the claimed impact "not fully evidenced".
risks:
  - riskInsecureIntegratedComponent
  - riskSensitiveDataDisclosure
  - riskInsecureModelOutput
steps:
  - n: 1
    title: The agent picks its own target
    phase: introduced
    narrative: >
      CodeWall's agent suggested McKinsey, citing its public responsible-disclosure policy and
      recent updates to Lilli. It had no credentials and no insider knowledge; CodeWall calls the
      run "fully autonomous from researching the target, analysing, attacking, and reporting".
    path: [openWeb]
    sources:
      - title: "AI vs AI: Agent hacked McKinsey's chatbot and gained full read-write access in just two hours"
        url: https://www.theregister.com/2026/03/09/mckinsey_ai_chatbot_hacked
        publisher: The Register
        date: 2026-03-09
  - n: 2
    title: Twenty-two endpoints that never asked who was calling
    phase: exposed
    narrative: >
      Publicly exposed API documentation listed more than 200 endpoints. Twenty-two of them
      required no authentication at all, and the agent could call them straight from the
      internet.
    path: [openWeb->vendor]
    risks:
      - riskInsecureIntegratedComponent
    sources:
      - title: "Autonomous agent hacked McKinsey's AI in 2 hours"
        url: https://www.govinfosecurity.com/autonomous-agent-hacked-mckinseys-ai-in-2-hours-a-31007
        publisher: GovInfoSecurity
        date: 2026-03-13
  - n: 3
    title: JSON keys concatenated into SQL
    phase: exposed
    narrative: >
      One open endpoint wrote user search queries. Its JSON keys were concatenated into SQL and
      reflected verbatim in database error messages — which, as the agent iterated, began
      returning live production data. CodeWall says it had full read and write access within two
      hours: 46.5 million chat messages in plaintext, 728,000 files and 57,000 accounts.
    path: [openWeb->vendor, vendor]
    risks:
      - riskInsecureIntegratedComponent
      - riskSensitiveDataDisclosure
    sources:
      - title: "AI vs AI: Agent hacked McKinsey's chatbot and gained full read-write access in just two hours"
        url: https://www.theregister.com/2026/03/09/mckinsey_ai_chatbot_hacked
        publisher: The Register
        date: 2026-03-09
  - n: 4
    title: The system prompts were in the same database
    phase: exposed
    narrative: >
      Lilli's 95 system prompts lived alongside the data, and all were writable. An attacker
      could have rewritten the answers, guardrails and cited sources that tens of thousands of
      consultants rely on — "no code change, just a single UPDATE statement wrapped in a single
      HTTP call".
    path: [vendor, vendor->browser, browser->employee]
    risks:
      - riskInsecureModelOutput
    sources:
      - title: "AI vs AI: Agent hacked McKinsey's chatbot and gained full read-write access in just two hours"
        url: https://www.theregister.com/2026/03/09/mckinsey_ai_chatbot_hacked
        publisher: The Register
        date: 2026-03-09
  - n: 5
    title: Where this chain breaks
    phase: mitigated
    narrative: >
      Every endpoint of an AI platform sits behind an access policy, and its documentation is not
      published to the internet. Know what the platform's database holds — chat history, files
      and the prompts that govern every answer — and do not keep the history in plaintext. The
      system prompts are configuration that changes behaviour for every user: keep them out of
      the application database, under change control.
    path: [openWeb->vendor, vendor, govIdentity, govPolicy]
    sources:
      - title: "Autonomous agent hacked McKinsey's AI in 2 hours"
        url: https://www.govinfosecurity.com/autonomous-agent-hacked-mckinseys-ai-in-2-hours-a-31007
        publisher: GovInfoSecurity
        date: 2026-03-13
