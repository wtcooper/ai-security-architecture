          built-in browser downloads to the Downloads folder, files a task fetches or plugins it installs.
          Endpoint anti-malware and EDR analyse downloaded files; a package mirror with scanning covers
          dependencies local commands install. Site-rule Downloads Block and marketplace source pinning are
          admission controls, not file analysis. No model weights load on the device.
        verified: "2026-10-30"
    # The security-relevant settings, each with the baseline value (data/tooling/BASELINE.md). Workspace switches live
    # in Admin Console › Permissions; device requirements in Admin Console › Agent security (Global baseline, Local
    # overrides), the system requirements.toml or macOS MDM (com.openai.codex), which ranks highest for local
    # execution. Verified 2026-10-30 at learn.chatgpt.com/docs.
    settings:
      - id: workLocal
        name: Use Work locally (or Allow members to use Codex and Work Locally)
        where: Admin Console › Permissions › Work Local (or the combined Codex and Work Local section)
        setVia: [adminConsole, identityProvider]
        area: tools
        recommended: On only for groups on managed devices that carry the Agent security or MDM requirements
        why: Work Local reads files, drives apps and sends excerpts and screenshots from the device; the combined control also grants local Codex.
        mitigations: [cap-agent-kill-switch]
        url: https://learn.chatgpt.com/docs/enterprise/roles-and-workspace-permissions
        verified: "2026-10-30"
      - id: workLocalComputerAccess
        name: Allow local computer access
        where: Admin Console › Permissions › Work Cloud › Allow local computer access
        setVia: [adminConsole]
        area: tools
        default: "Off"
        recommended: "Off until the Agent security Global baseline is reviewed; then On for Work Local groups only"
        why: Cloud-orchestrated tasks reach the connected computer's files and tools; turning it off interrupts running turns, so it doubles as a stop.
        mitigations: [AML.M0028, cap-agent-kill-switch]
        url: https://learn.chatgpt.com/docs/enterprise/cloud-local-access
        verified: "2026-10-30"
      - id: desktopWorkspacePin
        name: allowed_login_methods and allowed_chatgpt_workspaces
        where: System requirements.toml or macOS MDM (com.openai.codex); ignored in cloud-managed requirements
        setVia: [mdm, configFile]
        area: identity
        default: Unset (any login method and workspace)
        recommended: '["chatgpt"] and your workspace UUID'
        why: The desktop app's local runtime signs in only to the corporate workspace, not a personal account or API key.
        mitigations: [D3-MFA, cap-shadow-ai-discovery]
        url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
        verified: "2026-10-30"
      - id: cliAuthCredentialsStore
        name: cli_auth_credentials_store
        where: System requirements.toml or macOS MDM requirements_toml_base64 → cli_auth_credentials_store
        setVia: [mdm, configFile]
        area: identity
        recommended: '"keyring"'
        why: The local runtime's cached ChatGPT credential lives in the OS credential store rather than a readable file a command could copy; cloud-managed values are ignored.
        mitigations: [D3-CH]
        url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
        verified: "2026-10-30"
      - id: desktopFeatureAvailability
        name: Desktop feature availability
        where: Admin Console › Agent security › Global › Requirements › Desktop feature availability (In-app browser, Browser use, External browser use, Computer use, Full CDP access)
        setVia: [cloudPolicy, mdm]
        area: tools
        default: Features allowed
        recommended: Full CDP access set to Block user opt-in; the others allowed
        why: Browser and computer use stay available with their approvals, while developer-level control of the browser is removed.
        mitigations: [AML.M0028]
        url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
        verified: "2026-10-30"
      - id: browserSiteRules
        name: Site rules (Site access, Downloads, Uploads, Debug/CDP)
        where: Admin Console › Agent security › Requirements › Desktop browser controls › Site rules, or [browser_use.default_origin_policy] and [browser_use.origins]
        setVia: [cloudPolicy, mdm, configFile]
        area: network
        default: No site rules (normal approvals apply)
        recommended: Default row Site access Allow with Debug/CDP Block; Block rules for the file-sharing and webmail sites your proxy already blocks
        why: The agent's browser cannot be talked into a site the firm forbids, and a member's approval cannot override the admin's Block.
        mitigations: [cap-agent-action-policy-enforcement, AML.M0028, cap-agent-egress-control]
        url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
        verified: "2026-10-30"
      - id: computerUseAppRules
        name: App rules (App access)
        where: Admin Console › Agent security › Requirements › Desktop app controls › App rules, or [computer_use] default_app_access with macos.bundle_ids, windows.aumids and windows.exes
        setVia: [cloudPolicy, mdm, configFile]
        area: tools
        default: No app rules (each app approved by the member)
        recommended: Default row Allow; Block for the web browsers and the password manager
        why: Computer Use cannot drive a browser outside the Browser use site rules or open the password vault; other desktop apps stay usable.
        mitigations: [cap-agent-action-policy-enforcement, AML.M0028]
        url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
        verified: "2026-10-30"
      - id: computerUsePersistentApproval
        name: computer_use.allow_persistent_approval
        where: Agent security › Global › Edit as TOML, or requirements.toml → [computer_use] allow_persistent_approval
        setVia: [cloudPolicy, mdm, configFile]
        area: tools
        default: Unset (members can save app approvals)
        recommended: "false"
        why: Approval to drive a desktop app lasts for the session, not for every later task.
        mitigations: [AML.M0029]
        url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
        verified: "2026-10-30"
      - id: browserPersistentApproval
        name: browser_use.allow_global_persistent_approval
        where: Agent security › Global › Edit as TOML, or requirements.toml → [browser_use]
        setVia: [cloudPolicy, mdm, configFile]
        area: tools
        default: Unset
        recommended: "false"
        why: Members cannot give the local browser standing access to every site; each origin is approved on its own.
        mitigations: [AML.M0029]
        url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
        verified: "2026-10-30"
      - id: lockedComputerUse
        name: Allow use while locked
        where: Admin Console › Agent security › Global › Requirements › Desktop app controls, or [computer_use] allow_locked_computer_use
        setVia: [cloudPolicy, mdm]
        area: tools
        default: The member's local setting
        recommended: Disabled
        why: Computer use cannot keep driving apps on a Mac nobody is watching; it does not turn off Locked Use already enabled.
        mitigations: [AML.M0029]
        url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
        verified: "2026-10-30"
      - id: browserHistoryAccess
        name: browser_use.allow_history_access
        where: Agent security › Requirements › Desktop browser controls › Browser history, or requirements.toml → [browser_use] allow_history_access
        setVia: [cloudPolicy, mdm, configFile]
        area: data
        default: Unset (ChatGPT asks per request)
        recommended: "false"
        why: Internal URLs, search terms and signed-in activity in browsing history never enter a task's context, where injected page content could copy them out.
        mitigations: [cap-input-guardrails, cap-sensitive-data-redaction]
        url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
        verified: "2026-10-30"
      - id: allowAppshots
        name: allow_appshots
        where: Agent security › Global › Edit as TOML, or a local requirements source → allow_appshots
        setVia: [cloudPolicy, mdm, configFile]
        area: data
        default: Unset (Appshots available)
        recommended: Unset — Appshots are a member-initiated attachment of the frontmost window
        why: Treated like attaching a file; regulated teams set false, since an Appshot carries the window's text beyond what is visible.
        mitigations: []
        url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
        verified: "2026-10-30"
      - id: computerHistory
        name: Enable Computer History
        where: Workspace Settings › Permissions & roles › Computer History › (role) › Enable Computer History
        setVia: [adminConsole]
        area: data
        default: "Off"
        recommended: "Off"
        why: Turns recent on-screen app and website activity into memories ChatGPT and Codex can use, which on a consultant's Mac is client material.
        mitigations: [AML.M0031]
        requires: Business or Enterprise (by role on Enterprise)
        url: https://learn.chatgpt.com/docs/enterprise/roles-and-workspace-permissions
        verified: "2026-10-30"
      - id: sandboxModes
        name: Sandbox modes (allowed_sandbox_modes)
        where: Admin Console › Agent security › Global › Requirements › Policy guardrails › Sandbox modes
        setVia: [cloudPolicy, mdm, configFile]
        area: tools
        default: Unset (any mode, including full access)
        recommended: '["read-only", "workspace-write"]'
        why: Local Work's file edits and shell commands stay inside the OS sandbox; full access is refused.
        mitigations: [D3-EI]
        url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
        verified: "2026-10-30"
      - id: managedHooks
        name: Managed hooks (allow_managed_hooks_only; mcp_tool handlers for local computer access)
        where: Agent security › Global › Edit as TOML → [hooks], allow_managed_hooks_only
        setVia: [cloudPolicy, mdm, configFile]
        area: tools
        default: Unset (user, project and plugin hooks run in local-only threads)
        recommended: allow_managed_hooks_only = true, with your inspection hook where you run one
        why: Only hooks the firm deploys run, and with cloud orchestration only admin mcp_tool hooks are supported at all; test failure behaviour, since an error does not block.
        mitigations: [cap-agent-action-policy-enforcement, cap-input-guardrails, cap-sensitive-data-redaction]
        url: https://learn.chatgpt.com/docs/enterprise/agent-security
        verified: "2026-10-30"
      - id: mcpServersAllowlist
        name: mcp_servers.<id>.identity
        where: Agent security › Global › Edit as TOML → [mcp_servers.<id>] identity
        setVia: [cloudPolicy, mdm, configFile]
        area: tools
        default: Unset (any server)
        recommended: Your approved servers, stdio by executable and args, HTTP by url
        why: A local MCP server whose name and identity are not on the list is disabled, plugin-bundled servers included.
        mitigations: [cap-mcp-tool-integrity, cap-agent-tool-registry, AML.M0028]
        url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
        verified: "2026-10-30"
      - id: managedNetworking
        name: Manage Networking with Only allow domains added by admins
        where: Admin Console › Agent security › Requirements › Manage Networking ([experimental_network] enabled, managed_allowed_domains_only, domains)
        setVia: [cloudPolicy, mdm, configFile]
        area: network
        default: Not set
        recommended: On / On, allowing your source control, package mirror and approved APIs
        why: Local commands reach only admin-listed hosts; experimental, so validate per client version and hold back on Windows.
        mitigations: [cap-agent-egress-control]
        url: https://learn.chatgpt.com/docs/enterprise/agent-security
        verified: "2026-10-30"
      - id: applicationNetwork
        name: application.network
        where: Agent security › Global › Edit as TOML → [application.network] enabled, [application.network.domains]
        setVia: [cloudPolicy, mdm, configFile]
        area: network
        default: Absent (no destination restriction)
        recommended: Absent — enforce the app's destinations at the corporate proxy
        why: The exact-domain list must name every OpenAI and plugin host, does not cover native modules or spawned processes, and is unsupported with local computer access; regulated teams enable it after testing.
        mitigations: [cap-agent-egress-control]
        url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
        verified: "2026-10-30"
      - id: otelExporter
        name: otel.exporter
        where: managed_config.toml or MDM config_toml_base64 → [otel] exporter, environment, log_user_prompt
        setVia: [mdm, configFile]
        area: audit
        default: '"none" (nothing sent)'
        recommended: otlp-http to your collector, log_user_prompt = false
        why: Local execution and Browser Use decision events reach the SIEM; cloud orchestration events never do, so collect the Compliance API as well.
        mitigations: [cap-agent-tracing]
        url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
        verified: "2026-10-30"
      - id: allowRemoteControl
        name: allow_remote_control
        where: Agent security › Global › Edit as TOML, or a local requirements source → allow_remote_control
        setVia: [cloudPolicy, mdm, configFile]
        area: sharing
        default: Unset (follows product availability)
        recommended: "false, unless a team needs to steer local sessions from a phone"
        why: A local session with the member's files and signed-in apps cannot be driven from another device; SSH remote connections are separate.
        mitigations: [cap-agent-kill-switch]
        url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
        verified: "2026-10-30"
      - id: inAppUpdates
        name: features.in_app_updates
        where: Agent security or Managed configuration › requirements.toml → [features] in_app_updates
        setVia: [cloudPolicy, mdm, configFile]
        area: tools
        default: Updater on
        recommended: Unset — keep the built-in updater on
        why: Older app versions get no separate security patches; turn it off only where your deployment tool ships every release promptly.
        mitigations: []
        url: https://learn.chatgpt.com/docs/enterprise/manage-app-updates
        verified: "2026-10-30"
