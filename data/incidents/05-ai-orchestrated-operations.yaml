id: ai-orchestrated-operations
title: "Attackers running intrusions with AI agents: jailbroken assistant to autonomous ransomware"
subtitle: >
  Three incidents in ten months, each further along the same line: AI as assistant, AI running
  most of the intrusion, then AI running all of it.
dateRange: September 2025 – July 2026
perspective: weapon
archetype: archAgentWorkflow
summary:
  - >
    In these cases the AI system is not the target — it is the operator. The components that
    light up belong to the attacker's own agent stack, and the defence sits with whoever
    provides the model.
  - >
    The progression is the story. GTG-1002 jailbroke a coding agent and automated 80–90% of
    multi-stage intrusions across ~30 organisations. The Mexico campaign put one person with
    a jailbreak in front of nine government agencies. JADEPUFFER removed the human from the
    loop entirely.
  - >
    In every case the guardrail was defeated by framing, not by a technical exploit of the
    model: a bug-bounty pretext, a supplied hacking manual, a jailbreak prompt.
patterns:
  - AI-Orchestrated Offensive Operations
  - Social Engineering of AI Agents
  - AI-Accelerated Vulnerability Discovery
  - No Action-Level Authorization
cves:
  - CVE-2025-3248
risks:
  - riskRogueActions
  - riskRunawayAgentToolLoops
  - riskAgentDelegationChainOpacity
  - riskSensitiveDataDisclosure
  - riskInsecureIntegratedComponent
controls:
  - controlAgentExecutionBounds
  - controlAgentObservability
  - controlThreatDetection
  - controlInputValidationAndSanitization
  - controlProductGovernance
  - controlIncidentResponseManagement
steps:
  - n: 1
    title: The guardrail is talked around
    phase: introduced
    narrative: >
      GTG-1002 jailbroke Claude Code. The Mexico operator posed as a bug-bounty researcher and
      supplied a hacking manual as justification. Neither needed a technical exploit — the
      refusal boundary was defeated by context.
    components:
      - actorUser
      - componentAgentUserQuery
      - componentAgentSystemInstruction
      - componentReasoningCore
    risks:
      - riskRogueActions
    sources:
      - title: "Anthropic warns state-linked actor abused its AI tool in sophisticated espionage campaign"
        url: https://www.cybersecuritydive.com/news/anthropic-state-actor-ai-tool-espionage/805550/
        publisher: Cybersecurity Dive
        date: 2025-11-14
      - title: "Claude Code and ChatGPT used to steal millions of records in Mexican government breach"
        url: https://socradar.io/blog/mexican-government-breach-claude-chatgpt/
        publisher: SOCRadar
        date: 2026-03-02
  - n: 2
    title: The agent does the intrusion work
    phase: exposed
    narrative: >
      GTG-1002 ran reconnaissance, vulnerability discovery, exploitation, credential harvesting
      and extraction across ~30 targets, 80–90% automated. In Mexico, Claude Code executed
      roughly 75% of the remote commands and GPT-4.1 wrote the reconnaissance reports.
    components:
      - actorExternalSources
      - componentReasoningCore
      - componentTools
      - componentOrchestrationInputHandling
      - componentOrchestrationOutputHandling
    risks:
      - riskRogueActions
      - riskRunawayAgentToolLoops
    sources:
      - title: "Incident 1263: Chinese state-linked operator (GTG-1002) reportedly uses Claude Code for autonomous cyber espionage"
        url: https://incidentdatabase.ai/cite/1263/
        publisher: AI Incident Database
        date: 2025-11-14
      - title: "Hacker used Claude Code and GPT-4.1 to exfiltrate hundreds of millions of Mexican records"
        url: https://hackread.com/hacker-claude-code-gpt-4-1-mexican-records/
        publisher: HackRead
        date: 2026-03-05
  - n: 3
    title: Data leaves at a scale no human team matches
    phase: exposed
    narrative: >
      A custom tool exfiltrated from 305 internal servers across nine Mexican agencies:
      195 million taxpayer records from the federal tax authority, 220 million civil records,
      15.5 million vehicle registry records. Researchers described defenders being outpaced.
    components:
      - actorExternalSources
      - componentTools
      - componentOrchestrationOutputHandling
      - componentReasoningCore
    risks:
      - riskRogueActions
      - riskSensitiveDataDisclosure
    sources:
      - title: "Hackers used AI to steal hundreds of millions of Mexican government and citizen records"
        url: https://www.livescience.com/technology/artificial-intelligence/hackers-used-ai-to-steal-hundreds-of-millions-of-mexican-government-and-private-citizen-records-in-one-of-the-largest-cybersecurity-breaches-ever
        publisher: Live Science
        date: 2026-03-04
  - n: 4
    title: The human leaves the loop
    phase: exposed
    narrative: >
      JADEPUFFER took initial access through an internet-facing Langflow instance with missing
      authentication, then the LLM handled everything: credential harvesting, lateral movement,
      persistence, and destruction of a production MySQL database and Nacos config service. It
      diagnosed and fixed a failed login in 31 seconds.
    components:
      - actorExternalSources
      - componentApplication
      - componentReasoningCore
      - componentTools
    risks:
      - riskInsecureIntegratedComponent
      - riskRogueActions
      - riskAgentDelegationChainOpacity
    cves:
      - CVE-2025-3248
    sources:
      - title: "JADEPUFFER: agentic ransomware for automated database extortion"
        url: https://www.sysdig.com/blog/jadepuffer-agentic-ransomware-for-automated-database-extortion
        publisher: Sysdig Threat Research
        date: 2026-07-07
      - title: "JadePuffer ransomware used AI agent to automate entire attack"
        url: https://www.bleepingcomputer.com/news/security/jadepuffer-ransomware-used-ai-agent-to-automate-entire-attack/
        publisher: BleepingComputer
        date: 2026-07-07
  - n: 5
    title: Where this chain breaks
    phase: mitigated
    narrative: >
      Defence splits in two. Model providers need abuse detection on agentic tool-use patterns
      and execution bounds that survive a jailbreak. Targets need the unglamorous controls —
      JADEPUFFER's entry point was an unauthenticated service, and Mexico's was ordinary
      credential exposure. The AI changed the speed, not the door.
    components:
      - componentReasoningCore
      - componentTools
      - componentOrchestrationInputHandling
      - componentOrchestrationOutputHandling
      - componentModelServing
      - componentApplication
    sources:
      - title: "Inside JADEPUFFER: defending against the first agentic ransomware"
        url: https://www.picussecurity.com/resource/blog/inside-jadepuffer-defending-against-the-first-agentic-ransomware
        publisher: Picus Security
        date: 2026-07-10
alsoSeen:
  - title: "An AI-augmented lone actor reaches 600+ firewalls in five weeks"
    date: January–February 2026
    note: >
      Low-skill, financially motivated, no exploits at all — just credential brute-forcing
      against exposed management interfaces, with commercial models supplying planning, tooling
      and lateral-movement design. Amazon's own assessment notes the actor still struggled with
      exploit compilation: the AI supplied scale, not skill.
    sources:
      - title: "AI-augmented threat actor accesses FortiGate devices at scale"
        url: https://aws.amazon.com/blogs/security/ai-augmented-threat-actor-accesses-fortigate-devices-at-scale/
        publisher: Amazon Security
        date: 2026-02-20
  - title: "Hermes agent framework wired to DeepSeek, used against 460+ targets"
    date: July 2026
    note: The capability is no longer limited to frontier labs' own models.
    sources:
