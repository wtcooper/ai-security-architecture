pattern: archPersistentManagedAgents
reviewed: "2026-11-24"
summary: >-
  A vendor-hosted agent keeps working across tasks from its own cloud computer, with a browser
  signed in to work apps, standing connector grants, memory, files and schedules. Its owner, team
  channels and its own schedules give it work, and it reaches our tool servers and code host
  through two crossings we control. Every saved login is a standing grant, any page or email it
  reads can steer clicks in any app it is signed in to, and what it keeps carries an injection
  into later tasks. A new conversation resets nothing, so the stop must revoke and clear.
concentrates: >-
  Where an agent signed in to many apps reads pages and mail that outsiders wrote, keeps what it
  reads, takes work from a channel wider than its owner, and can act or send through a logged-in
  browser without an approval bound to the exact action.
scope: >-
  A vendor-hosted agent with a persistent cloud computer and browser, signed in to work SaaS,
  with standing connector grants, memory and schedules. Its owner, team channels and schedules
  give it work; it reaches our tools through our gateway and our code through a scoped app.
  Laptop access is off.
lists: [owasp-llm-2026, owasp-agentic, owasp-mcp]
assets:
  - "Every app the hosted browser is signed in to, and its saved logins and cookies"
  - "Connector grants to mail, files, calendars and other SaaS"
  - "Memory, files and history the agent keeps between tasks"
  - "Records behind our tool servers, and repositories on our code host"
  - "The owner's name on everything the agent sends, posts or changes"
actors:
  - who: "Outside writer"
    access: "Writes a page, email, document or invite the agent will read while signed in"
    wants: "Clicks, sends or disclosures through the agent's logins"
  - who: "Channel member"
    access: "Gives the agent work in a team channel and reads what it posts there"
    wants: "Results built on the owner's access, not their own"
  - who: "Malicious publisher"
    access: "Publishes or takes over a package or skill the agent installs on its persistent computer"
    wants: "Code beside saved logins that stays for later tasks"
  - who: "The agent itself, no adversary"
    access: "Continues on its own schedule with standing grants and retained context"
    wants: "To finish recurring work, past what was approved"
  - who: "Vendor"
    access: "Runs the loop, the hosted computer, its storage and the approval surface under its own terms"
    wants: "To operate the product; trusted, but outside our control"
threats:
  - id: T1
    title: "A page or email steers the signed-in browser to act in any app it can open"
    rating: critical
    evidence: disclosed
    story: >-
      Computer use reaches every app the agent is signed in to, not only what a connector scopes,
      so a page, email or document it reads can steer clicks, typing and sends. Browser agents
      have been led to copy private data from logged-in accounts into an attacker's page and to
      post a one-time password read from mail.
    at: [nativeTools->openWeb, nativeTools, managedRuntime->vendorTools]
    risks: [riskPromptInjection, riskRogueActions]
    atlas: [AML.T0051.001, AML.T0100, AML.T0086]
    owasp: [LLM01:2026, ASI01, ASI02, MCP06:2025]
    controls: [AML.M0029, AML.M0028, cap-agent-egress-control, cap-input-guardrails, D3-CH]
    refs:
      - title: "Embrace The Red: ChatGPT Operator prompt injection exploits"
        url: https://embracethered.com/blog/posts/2025/chatgpt-operator-prompt-injection-exploits/
      - title: "Brave: indirect prompt injection in Perplexity Comet"
        url: https://brave.com/blog/comet-prompt-injection/
  - id: T2
    title: "An instruction kept in memory or files fires again in later tasks"
    rating: high
    evidence: observed
    story: >-
      What the agent reads can be written into its memory or files and shape later tasks for other
      audiences, long after the source is gone. Links from ordinary companies told assistants to
      remember them as trusted sources; in a disclosed case a fetch tool carried data out and a
      memory write made the injection persist.
    at: [managedRuntime, managedRuntime->vendorTools, nativeTools->openWeb]
    risks: [riskPromptInjection, riskSensitiveDataDisclosure]
    atlas: [AML.T0080.000, AML.T0094, AML.T0051.001]
    owasp: [LLM07:2026, ASI06]
    controls: [AML.M0031, AML.M0043, cap-input-guardrails, cap-agent-kill-switch]
    incidents: [prompt-injection-lineage]
    refs:
      - title: "Microsoft Security: AI Recommendation Poisoning"
        url: https://www.microsoft.com/en-us/security/blog/2026/02/10/ai-recommendation-poisoning/
  - id: T3
    title: "Anyone in a team channel gets work done on the owner's standing grants"
    rating: high
    evidence: theoretical
    story: >-
      A channel admits more people than the grant's owner, and the agent acts on the owner's or a
      service account's standing grants, not as the person who typed. A member can ask for what
      they could never open, and the answer is posted to the whole channel. No incident is public;
      rated on the mechanism.
    at: [remoteDevice->vendorService, vendorService->managedRuntime, managedRuntime->vendorTools]
    risks: [riskAgenticDelegationConfusedDeputy, riskSensitiveDataDisclosure]
    atlas: [AML.T0051.000, AML.T0085.001]
    owasp: [LLM02:2026, ASI03, MCP10:2025]
    controls: [D3-APA, AML.M0028, D3-CTS, AML.M0029]
  - id: T4
    title: "Saved logins and grants outlive the task, the owner and the stop"
    rating: high
    evidence: observed
    story: >-
      Connector grants, cookies and saved logins persist between tasks, and ending a conversation
      revokes none of them. A forgotten integration credential and a compromised AI tool's OAuth
      grant were the routes into the named 2026 breaches; an agent's standing logins are the same
      kind of access.
    at: [managedRuntime, nativeTools, vendorService]
    risks: [riskStaleAgentIdentityBinding, riskAgenticDelegationConfusedDeputy]
    atlas: [AML.T0091.000, AML.T0098]
    owasp: [ASI03, MCP01:2025]
    controls: [D3-CH, AML.M0043, cap-agent-kill-switch, cap-agent-tool-registry]
    incidents: [identity-and-shadow-ai]
  - id: T5
    title: "The agent reaches our tools and code on a grant wider than the task"
    rating: high
    evidence: observed
    story: >-
      Its calls into our gateway and its pushes to our code host are steered by whatever it read
      or kept. If the gateway admits the vendor's service identity, or the install can push or
      merge, an injected instruction reaches those systems. Issue text steering hosted agents that
      hold repository tokens was observed in 2026.
    at: [managedRuntime->aiGateway, aiGateway->internalTools, managedRuntime->sourceControl]
    risks: [riskAgenticDelegationConfusedDeputy, riskRogueActions]
    atlas: [AML.T0053, AML.T0085.001]
    owasp: [LLM03:2026, MCP02:2025, MCP07:2025]
    controls: [AML.M0028, D3-APA, AML.M0029, cap-input-guardrails, D3-CH]
    incidents: [hosted-agent-hijack]
  - id: T6
    title: "A package or skill on the persistent computer runs beside saved logins"
    rating: high
    evidence: observed
    story: >-
      The agent installs packages and skills on a computer that persists, so a malicious one runs
      beside retained files and saved logins and stays for later tasks; a publish to an allowed
      registry carries out what it finds. Hundreds of malicious skills, mostly an infostealer,
      were found in one skill registry in 2026.
    at: [nativeTools->sources, nativeTools]
    risks: [riskInsecureIntegratedComponent, riskSensitiveDataDisclosure]
    atlas: [AML.T0011.001, AML.T0010.005, AML.T0086]
    owasp: [LLM04:2026, ASI04, ASI05, MCP04:2025]
    controls: [cap-agent-egress-control, D3-EI, D3-CTS, cap-ai-vendor-assessment]
    incidents: [personal-agent-exposure]
  - id: T7
    title: "Unregistered agents and schedules keep running, and loops keep billing"
    rating: medium
    evidence: theoretical
    story: >-
      An agent or schedule created outside the approved inventory continues on its grants, and
      recurring tasks and retries consume budget after the requester has stopped watching.
      Recurrence renews no authority, yet nothing ends it until schedules are disabled and grants
      revoked. Rated on the mechanism.
    at: [vendorService, vendorService->managedRuntime, managedRuntime]
    risks: [riskShadowAndUnknownAgents, riskRunawayAgentToolLoops]
    atlas: [AML.T0034.002]
    owasp: [LLM06:2026, ASI10]
    controls: [cap-agent-tool-registry, AML.M0036, cap-agent-kill-switch, D3-APA, cap-agent-tracing]
coverage:
  - id: "LLM05:2026"
    why: "No model is trained or tuned here; poisoned memory is context poisoning, covered as instructions kept for later tasks."
  - id: "LLM08:2026"
    why: "The agent's instructions hold no secrets in the reference deployment; its credentials sit in grants and saved logins, covered as standing access."
  - id: "LLM09:2026"
    why: "No retrieval index of ours is drawn; what the agent retains is handled as memory, not as a vector store we run."
  - id: "LLM10:2026"
    why: "The agent's output acts through the browser and connectors, covered as tool misuse; no downstream interpreter of ours runs its text."
  - id: "ASI07"
    why: "Delegation to coding sessions or other agents is not drawn in the reference deployment; each continuing agent is governed alone."
  - id: "ASI08"
    why: "No chain of agents is drawn for an error to cascade through; recurring work is bounded as a runaway loop."
  - id: "ASI09"
    why: "Approval is asked in the vendor's authenticated app with the exact action shown; how far owners trust its proposals is a design-review question."
  - id: "MCP03:2025"
    why: "Our MCP servers are reached only through our gateway's reviewed catalogue; the vendor's own connectors are assessed with the vendor."
  - id: "MCP05:2025"
    why: "Commands run on the vendor's hosted computer by design; command handling in our tool servers belongs to their pattern."
  - id: "MCP08:2025"
    why: "Not a threat on its own: whether the vendor's export correlates requester, schedule and tool calls is a design-review question."
  - id: "MCP09:2025"
    why: "Only our gateway's catalogue admits MCP servers of ours; unregistered agents and schedules are covered as their own threat."
questions:
  - "Which apps is each agent's hosted browser signed in to, and does any read-only task hold a write-capable login?"
  - "Is every consequential action, including clicks in an app, held for an approval bound to the exact action in an authenticated app?"
  - "Who can give the agent work in each channel, and whose grants does that work run on?"
  - "What does the agent keep in memory and files, who can read and correct it, and what does deletion actually clear?"
  - "Does our stop disable schedules, revoke connector and browser grants and clear retained state, and has it been tested?"
  - "Is the hosted computer separate for each agent, or shared by all of a person's agents across their teams?"
  - "Which package registries can the hosted computer reach, and are publishes and other writes to them blocked?"
