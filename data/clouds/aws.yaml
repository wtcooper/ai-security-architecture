          - { name: "Amazon API Gateway with a Cognito user pool or JWT authorizer", kind: commercial, url: "https://docs.aws.amazon.com/apigateway/latest/developerguide/http-api-jwt-authorizer.html", note: "The API checks the user's token itself: Cognito authorizers on REST APIs, JWT authorizers on HTTP APIs, before the integration runs." }
