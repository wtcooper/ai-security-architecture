  - id: ollama-pull-path-traversal
    date: 2026-10-08
    title: "CVE-2026-103663: an unauthenticated Ollama model pull writes a file that runs as root on restart"
    summary: >
      CERT Polska reported a path traversal in the layer digest sent to Ollama's pull API that lets an
      unauthenticated remote attacker write a binary outside the model store, into /usr/lib/ollama where the
      server can write there, as in most Ollama Docker images; it runs as root on the next restart. Versions
      from 0.14.3 were affected until 0.35.0 fixed it.
