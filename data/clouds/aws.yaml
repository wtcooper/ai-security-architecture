    area: tools
    default: "buildspec.yml at the root of the source"
    recommended: "Define each app's build, test and scan commands in its CodeBuild project, not in the repository, and keep project and pipeline in the platform's tooling account where neither the agent nor the app can change them."
    value: "Project-defined, not from the repository"
    why: "With the default, the agent's own branch decides what the build runs, scans included. A buildspec held in the project keeps the pipeline out of the agent's reach."
    mitigations: [AML.M0028, D3-SYSVA]
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/build-spec-ref.html
    verified: "2026-11-21"
  - id: inspectorScanAction
    name: "InspectorScan action (CriticalThreshold, HighThreshold)"
    product: "AWS CodePipeline"
    where: "AWS CodePipeline › build stage › action provider InspectorScan, InspectorRunMode SourceCodeScan, then ECRImageScan on the pushed image"
    setVia: [apiCli]
    area: tools
    recommended: "Run InspectorScan on the source and on the image with CriticalThreshold 0 and HighThreshold 0, so any critical or high finding fails the stage, and keep the SBOM output artifact with the release."
    value: "Fail on any critical or high finding"
    why: "Nobody reads this code, so the scan has to stop the release by itself; its SBOM output is the bill of materials for the release."
    mitigations: [D3-SYSVA, AML.M0023]
    requires: "InspectorScan checks the packages in an SBOM, so a SAST finding stops a release only with a SAST step of your own. Inspector Code Security scans the default branch and a pull request when opened; with pull request triggers only, just the top 25 critical or high findings appear, in GitHub alone"
