          for local MCP servers in the Enterprise MCP Configuration
        steps: &a1
          - title: Set Allowlist only and lock it
            body:
              - In Team settings choose Allowlist only with the domains agents need, then enable Lock Network Access
                Policy so members and environments cannot widen it; core Cursor services and your
                source-control provider stay reachable.
            url: https://cursor.com/docs/cloud-agent/security-network
          - title: Make environments inherit the policy
            body:
              - Saved environments can inherit the user or team policy, add an environment allowlist or define their own
                mode; keep them on inheritance so the lock applies.
            url: https://cursor.com/docs/cloud-agent/settings
        note: >-
