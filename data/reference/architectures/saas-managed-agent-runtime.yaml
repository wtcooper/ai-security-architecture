id: archManagedAgentRuntime
surface: surfaceSaas
rank: 3
title: API/SDK managed agent runtime
abbrev: API/SDK runtime

summary:
  - >
    A vendor's API-driven hosted agent service: the loop, the memory, the sandbox and the tool
    gateway supplied as published, separately billed products, driven through an SDK or API
    rather than a builder UI. The customer owns the front end, the agent definitions, the tools
    admitted, the identities and the audit export. The governance plane arrives built in, and
    the trade is that it is configured rather than designed.

description:
  - >
    Every provider converged on the same decomposition: a runtime, a memory service, a tool
    gateway, an identity service, a code interpreter and browser, observability, evaluation and
    policy. That convergence is itself the finding — the governance plane most self-built agent
    architectures never get is exactly what these services sell. The provider blocks on this
    diagram are drawn because they are documented, separately addressable products, not
    inferred internals; the loop's execution behind them remains genuinely uninspectable.
  - >
    The consequential choice is between the managed harness and the code escape hatch. Every
    provider offers both: a declarative agent whose loop they run, and a bring-your-own-code
    runtime where they supply the sandbox and the identity but the loop is the customer's. The
    first inherits the platform's guardrails automatically; the second inherits only what it
    explicitly calls. Teams routinely start with the first, hit a limitation, move to the
    second, and do not notice which controls stopped applying.
  - >
    Managed memory is the component most likely to be switched on without a decision. Its scope
    — per session, per user, or shared across users — is a configuration flag with a
    data-protection consequence, and cross-user scope means one user's content can shape
    another's turn.
  - >
    The genuine advantage is agent identity: first-class, revocable principals distinct from
    the service and from the user, supplied as a service. Using them properly — rather than
    collapsing everything onto one service principal — is most of what separates a
    well-governed deployment from a poorly governed one on the same platform. The costs are
    portability and opacity: the policy language moves to no other provider, and debugging a
    misbehaviour means reading traces rather than code.

distinguishedBy:
  - >
    Against building the agent tier: the same components with the provider supplying them. The
    work moves from designing an identity model, a policy engine and a sandbox to configuring
    three, and from having to build observability to having to export it.
  - >
    Against the UI/low-code managed agent runtime: same hosting model, different author. Here
    engineers define agents in code against an SDK or API, and the software-delivery pipeline —
    review, versioning, staged rollout — still applies to the definition even though the loop
    is the vendor's. The low-code sibling replaces that pipeline with a builder UI and a
    publish button, which moves the risk from the definition to the population.

exemplars:
  - name: Frontier-lab managed agent APIs
    note: >
      Agent runtimes operated by the model vendor and driven entirely through an API — a hosted
      loop with a managed sandbox, invoked by the customer's code, with sessions and memory as
      API resources.
    asOf: "2026-08"
  - name: Hosted background coding agents
    note: >
      Vendor-run remote agents that take a task and a repository grant and work unattended in
      the vendor's environment, reporting back as pull requests or session transcripts.
    asOf: "2026-08"
  - name: Hyperscaler agent runtimes
    note: >
      Managed agent services decomposed into runtime, memory, gateway, identity, sandbox,
      observability, evaluation and policy, billed per component and driven through SDKs.
    asOf: "2026-08"
  - name: Managed harness with a code escape hatch
    note: >
      A declarative agent the provider runs, alongside a bring-your-own-code runtime for cases
      the declarative form cannot express. The pair is now standard across providers.
    asOf: "2026-08"

zones:
  - id: zoneUser
    owner: user
    note: The people the published agent serves, and the team that defined it.
  - id: zoneVendor
    owner: vendor
    note: >
      The provider's environment, and where the agent actually runs. Drawn before our own band
      because that is the direction of the work: a request reaches the vendor first, and the
      vendor reaches back into us second. What they operate inside it is assured, not drawn.
  - id: zoneCloud
    owner: cloud
    note: >
      What we still own on somebody else's platform: the definition that decides what the agent
      may do, the gateway that admits it back into our systems, and the systems themselves.
  - id: zoneExternal
    owner: external
    note: Where the agent's actions land outside both environments.
  - id: zoneGovernance
    owner: governance
    note: >
      On a platform we do not operate, this band is most of what "our controls" can mean — and
      the identity the agent runs as is not one of them by default.

blocks:
  - id: endUser
    kind: actor
    title: End user
    icon: person
    zone: zoneUser
    col: 0
    row: 1
    note: The person a session runs for, and whose credentials it acts on if we set it up that way.

  - id: managedRuntime
    kind: provider
    title: Managed runtime
    cosaiComponent: componentReasoningCore
    zone: zoneVendor
    col: 1
    row: 1
    note: >
      The provider hosts the agent loop itself — tool-call decisions, error recovery, context
      compaction — along with session state and a sandbox per session. Defined declaratively
      over an API rather than shipped as a container, which makes the definition the whole of
      the behaviour contract.
      Two limits worth knowing before adopting it: sessions in the provider's cloud are not
      eligible for zero-retention or a healthcare BAA, and moving execution onto our own
      infrastructure keeps orchestration with them regardless, because tool inputs and outputs
      still cross back.
    items:
      - id: agentLoop
        label: Agent loop
        icon: agent
        note: Their harness running our definition, with the reasoning and the retries theirs to operate.
      - id: managedMemory
        label: Memory store
        icon: folder
        note: Session and long-term state they hold, whose scope is a configuration flag rather than an architecture.
      - id: sandbox
        label: Sandboxed tools
        icon: shield
        note: Provider-operated code execution and browsing, one container per session.

  - id: agentDef
    kind: service
    title: Agent definition & code
    cosaiComponent: componentAgentSystemInstruction
    zone: zoneCloud
    col: 2
    row: 0
    note: >
      Model, prompt, tools, MCP servers and skills, declared and pushed to the provider. On a
      runtime we do not operate this artifact is very nearly the whole of what we control about
      the agent, which makes reviewing it a release gate rather than a formality.
    items:
      - id: declarative
        label: Declarative definition
        icon: doc
        note: What the agent may do, in a form somebody can read and approve before it ships.

  - id: aiGateway
    kind: service
    title: AI gateway
    zone: zoneCloud
    col: 2
    row: 1
    note: >
      The customer-operated crossing where a vendor-hosted agent is admitted into our systems.
      The one component on that path we run, and therefore the only place the reach is scoped,
      credentialed and recorded on our terms rather than theirs.
    pack: aiGatewayTraffic

  - id: internalTools
    kind: service
    title: Tool services
    cosaiComponent: componentTools
    zone: zoneCloud
    col: 3
    row: 2
    pack: toolServicesRemote
    note: >
      Our own MCP servers and connectors — the repositories, ticketing and systems of record a
      hosted agent is adopted in order to reach.

  - id: orgData
    kind: external
    title: Enterprise data
    cosaiComponent: componentDataSources
    zone: zoneCloud
    col: 3
    row: 3
    pack: enterpriseData
    note: The systems of record behind those servers, reached on grants we scope per session.

  - id: downstream
    kind: external
    title: Downstream services
    cosaiComponent: componentDataSources
    zone: zoneExternal
    col: 4
    row: 1
    pack: downstreamPublic
    note: Where an action lands outside both environments, and where untrusted content returns from.

  - id: govIdentity
    kind: governance
    title: Identity services
    icon: person
    zone: zoneGovernance
    col: 1
    row: 4
    capabilities: [capabilityIga, capabilityNhiManagement]
    note: >
      The gap worth naming: a hosted agent has no principal of its own. It acts as whatever
      credential the per-user vault supplies, so "who did this" resolves to a credential rather
      than to an agent identity we issued. Mapping vault entries back to our own user records
      is ours to maintain.

  - id: govSecrets
    kind: governance
    title: Secrets & key management
    icon: key
    zone: zoneGovernance
    col: 2
    row: 4
    capabilities: [capabilitySecretsManagement, capabilityEncryptionKeyManagement]
    note: >
      Per-user credential vaults, with one edge sharp enough to plan around: they are scoped to
      the workspace, so any API key with workspace access can reference them, and a session
      whose credential does not match simply connects unauthenticated. Customer-managed keys
      cover the platform's data but explicitly not the vault secrets themselves.

  - id: govPolicy
    kind: governance
    title: Policy & authorization
    icon: scale
    zone: zoneGovernance
    col: 3
    row: 4
    capabilities: [capabilityToolPermissionScoping, capabilityHitlControls, capabilityEgressControl]
    note: >
      What the hosted agent may reach in our systems, decided at our gateway rather than in
      their console — and the per-tool approval their connector configuration defaults to,
      which is worth leaving on.

  - id: govObservability
    kind: governance
    title: Observability & response
    icon: eye
    zone: zoneGovernance
    col: 4
    row: 4
    capabilities: [capabilityAgentObservability, capabilityAuditLogging, capabilityAiTprm, capabilityAgentRegistry]
    note: >
      Their session event log fused with our gateway's record, plus the assessment behind
      adopting the platform at all. A trail that exists only in their console is one we cannot
      query during an incident.

edges:
  - from: endUser
    to: managedRuntime
    path: external
    bidir: true
    label: request / response
    note: >
      Straight to the provider, which is the point of buying a managed runtime: there is no tier
      of ours in front of the agent, and nothing of ours on this hop.
  - from: agentDef
    to: managedRuntime
    path: external
    bidir: true
    label: deploy
    note: >
      The definition is pushed into an environment we do not operate. What it declares is the
      behaviour contract, and reviewing it is the last point at which we decide anything about
      the agent itself.
  - from: managedRuntime
    to: aiGateway
    path: external
    bidir: true
    label: back into our systems
    note: >
      The crossing this architecture exists to govern. Their runtime reaches our gateway rather
      than reaching past it, so the grants are ours to scope and ours to revoke — over a
      connector, an outbound-only tunnel, or a worker of ours that polls them, depending on how
      much of the execution we chose to take back.
  - from: aiGateway
    to: internalTools
    path: primary
    bidir: true
    label: brokered tool calls
    note: Which of our servers a hosted agent may call, on short-lived grants we issue.
  - from: internalTools
    to: orgData
    path: primary
    bidir: true
    label: scoped reads & writes
    note: The repositories and records the agent was adopted to work on.
  - from: aiGateway
    to: downstream
    path: external
    bidir: true
    label: outbound actions
    note: Actions landing outside, and untrusted content returning into a loop we cannot see.

pins:
  risks:
    - risk: riskAgenticDelegationConfusedDeputy
      at: managedRuntime->aiGateway
      note: >
        Their infrastructure exercising our authority. The grant is the only thing bounding it,
        and the grant is issued at our gateway — which is the entire argument for drawing one.
    - risk: riskSensitiveDataDisclosure
      at: endUser->managedRuntime
      note: >
        Requests, context and tool results all live on their side. Cloud sessions are not
        eligible for zero-retention or a healthcare BAA, so this is a contractual position
        rather than a technical one.
    - risk: riskStaleAgentIdentityBinding
      at: managedRuntime
      note: >
        The agent has no principal of its own; it is whatever the vault holds. A credential that
        outlives the person it belonged to keeps acting as them.
    - risk: riskShadowAndUnknownAgents
      at: agentDef->managedRuntime
      note: >
        An agent is an API call away. Without a registry the population is unbounded and
        invisible, and the definition is the only artifact that ever existed for review.
    - risk: riskRogueActions
      at: internalTools->orgData
      note: Writes into systems of record from a loop running somewhere we cannot watch.
    - risk: riskPromptInjection
      at: aiGateway->downstream
      note: Content returning from an outbound action re-enters a context we do not hold.

  capabilities:
    - capability: capabilityIga
      at: endUser->managedRuntime
      note: Which of our people a session runs for, established before it starts rather than inferred from a token.
    - capability: capabilityNhiManagement
      at: managedRuntime
      note: >
        Treat the vault entry as the agent's identity, because nothing else is — and give it a
        lifecycle, since the platform will not.
    - capability: capabilitySecretsManagement
      at: managedRuntime->aiGateway
      note: >
        Per-user vaults rather than a service credential, and the placeholder-substituted kind
        where the platform offers it, so the secret is swapped in at egress and the agent never
        holds the value.
    - capability: capabilityEncryptionKeyManagement
      at: managedRuntime
      note: >
        Customer-managed keys over their storage — with the exclusion recorded: vault credential
        values sit under their keys, not ours.
    - capability: capabilityAgentRegistry
      at: agentDef->managedRuntime
      note: Every definition registered and reviewed before deploy; there is no other artifact to review.
    - capability: capabilityToolPermissionScoping
      at: aiGateway->internalTools
      note: Which servers, which tools, whose grant — decided at our tier because theirs is not ours to configure.
    - capability: capabilityHitlControls
      at: aiGateway->internalTools
      note: >
        Per-tool approval, which their connector configuration defaults to. Leaving that default
        on is the cheapest control on this page.
    - capability: capabilityEgressControl
      at: aiGateway->downstream
      note: Named destinations for actions leaving our side of the boundary.
    - capability: capabilityAiTprm
      at: managedRuntime
      note: >
        Their isolation, retention and tenancy assured by assessment rather than drawn — the
        only representation a vendor-internal control gets.
    - capability: capabilityAgentObservability
      at: managedRuntime->aiGateway
      note: Their session event log fused with our own record, so an incident has one queryable trail.
    - capability: capabilityAuditLogging
      at: govObservability
      note: Retained on our side, because a trail only in their console is one we cannot search.
    - capability: capabilityModelGuardrails
      at: managedRuntime
      note: >
        Their runtime applies the model-side checks; ours is a zone-2 configuration choice on
        their surface rather than a tier we operate.
    - capability: capabilityMemoryProtection
      at: managedRuntime
      note: >
        Memory scope is a flag on their platform, and the default is wider than most adopters
        assume. Setting it deliberately is the whole control.
    - capability: capabilityModelEvals
      at: agentDef->managedRuntime
      note: Behavioural checks against the definition before it ships, since the definition is all we control.
    - capability: capabilityAiGovernancePlatform
      at: govObservability
      note: The population view across every agent somebody deployed with an API call.

flows:
  - id: F1
    title: A request reaches the hosted agent
    moves: A person's request, straight to a runtime somebody else operates.
    path: [endUser->managedRuntime]
    threats: [Context and results living on their side, No zero-retention or BAA eligibility for cloud sessions]
    controls: [capabilityIga, capabilityAiTprm]
    note: >
      There is no tier of ours in front of this. Buying a managed runtime means the first hop is
      already outside, which is what makes the return hop the one that matters.
  - id: F2
    title: The definition ships
    moves: Model, prompt, tools and skills, declared and pushed to the provider.
    path: [agentDef->managedRuntime]
    threats: [An agent an API call away with nobody reviewing it, A definition claiming more capability than the task needs]
    controls: [capabilityAgentRegistry, capabilityModelEvals]
    note: >
      On a runtime we do not operate, this artifact is very nearly the whole of what we control
      about the agent. Reviewing it is a release gate, not a formality.
  - id: F3
    title: The agent reaches back into our systems
    moves: Tool calls from their cloud into our repositories and records.
    path: [managedRuntime->aiGateway, aiGateway->internalTools, internalTools->orgData]
    threats: [Their infrastructure exercising our authority, Vault credentials scoped to a workspace rather than a session, A session with no matching credential connecting unauthenticated]
    controls: [capabilitySecretsManagement, capabilityToolPermissionScoping, capabilityHitlControls]
    note: >
      The crossing the architecture exists to govern, and the one place our controls are ours.
      Their gateway hands to ours rather than reaching past it — the difference between a grant
      we scope and one we merely hope about.
  - id: F4
    title: Actions land outside
    moves: Outbound calls, and the untrusted content that returns.
    path: [aiGateway->downstream]
    threats: [Content returning into a context we do not hold, Exfiltration through an action nobody reviewed]
    controls: [capabilityEgressControl, capabilityAuditLogging]
    note: Whatever comes back re-enters a loop running somewhere we cannot see.

scenarios:
  - title: A user's request becomes a tool call on our systems
    steps:
      - follow: endUser->managedRuntime
        note: The request goes straight to the provider; nothing of ours is on this hop.
      - follow: managedRuntime->aiGateway
        note: Their runtime reaches our gateway rather than reaching past it into the tool surface.
      - follow: aiGateway->internalTools
        note: Admitted to a named server on a short-lived, per-user grant.
      - follow: internalTools->orgData
        note: The read or write happens on our side, which is the only reason it is bounded.
  - title: A credential outlives its owner
    steps:
      - follow: agentDef->managedRuntime
        note: An agent is deployed with a vault reference rather than an identity of its own.
      - follow: managedRuntime->aiGateway
        note: >
          Sessions keep presenting that credential after the person has gone, because nothing in
          the platform ties it to their lifecycle.
      - follow: aiGateway->internalTools
        note: Our gateway is where that can be noticed and cut, since it is the only hop we watch.

