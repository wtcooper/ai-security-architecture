id: archOssCodingAgent
surface: surfaceEndpoint
rank: 2
title: Open-source coding & desktop agents
abbrev: OSS coding agents
summary:
  - >
    The same engine as the vendored coding agents without the vendor: an open-source harness a
    developer installs from a community registry and runs with their own keys. The interaction
    model is identical; what is missing is every control the vendor column supplied — session
    credentials, managed settings, audit export, an owner-bound remote relay — and nothing
    replaces them by default.

description:
  - >
    Architecturally this is the vendored coding agent with the vendor service column deleted.
    The harness, the tool surface, the memory layer and the untrusted-content ingress are the
    same drawing; the differences are custody and supply chain. Credentials are pasted,
    long-lived keys that sit in plaintext configuration in most of the harnesses; governance
    is files on the same disk the agent can edit; and the binary itself arrives through
    community package registries and marketplaces — the category's landmark incident is a
    compromised harness release published with stolen publisher tokens.
  - >
    The target state routes every model and remote call through an AI gateway the organisation
    operates — the credential broker that vaults the key the user would otherwise paste, the
    egress allowlist, the audit tap. The common state has nothing at that crossing: the
    harness calls the provider directly and the only record is the provider's bill. The
    gateway is drawn because this catalogue draws architectures as they should be built; the
    deviation records the distance.
  - >
    Remote control exists here too, with a weaker admission model than the vendor products.
    The harnesses ship server modes — a listening port on the machine, localhost by default,
    with auth ranging from a mandatory shared secret down to none at all — plus official
    mobile clients over relay tunnels, and a fast-growing ecosystem of chat bridges that put
    messaging-platform identity in front of the loop. None of it binds admission to an owner
    account the way the vendor relays do, which is why the remote surface here is drawn with
    the same seriousness as the personal agent's channels.
  - >
    There is no governance plane, and that absence is the finding: no managed settings tier,
    no session audit export, no admin toggle for the remote surface. Where enterprise
    controls exist for this category they are bolt-on — managed configuration paths and
    enterprise policy services a team must adopt deliberately — and the sanctioned posture is
    something the organisation publishes, not something the software ships.

distinguishedBy:
  - >
    Against the vendored coding agents: the same loop, the same tool surface, the same
    human-present default. What changes is custody — pasted keys instead of expiring session
    credentials, community registries instead of signed vendor channels, bearer secrets and
    platform identity instead of an owner-bound relay — and the absence of any control plane
    an administrator could switch on.
  - >
    Against the personal autonomous agent: this one is still invoked by a present developer
    and scoped to a workspace, with no heartbeat and no ambient senders. But the drift is
    real and one-directional — server modes, chat bridges, scheduled recipes — and a deployed
    OSS harness that listens on channels and runs unattended has become the personal agent
    and should be read on that page.

exemplars:
  - name: Terminal harnesses
    note: >
      The opencode/Crush class: TUIs over a client/server core, with headless serve modes and
      web surfaces. The most popular open-source agents, and the clearest expression of the
      pattern.
    asOf: "2026-08"
  - name: IDE-extension harnesses
    note: >
      The Cline family and its forks: marketplace-distributed extensions plus emerging
      standalone cores. The distribution channel is the marketplace — which is also the
      attack surface the category's worst incident used.
    asOf: "2026-08"
  - name: Desktop and mobile-remote harnesses
    note: >
      Goose-class agents with desktop apps, server binaries, scheduled recipes, and an
      official mobile client over a relay tunnel — the furthest drift toward the personal
      agent's shape, and the category's strongest remote-admission model.
    asOf: "2026-08"

blocks:
  - id: remoteDevice
    kind: service
    title: Remote device
    cosaiComponent: componentAgentUserQuery
    col: 0
    row: 0
    note: >
      The steering surfaces away from the machine — real in this category, with a weaker
      admission story than the vendor products: a serve port with optional or absent auth, a
      relay tunnel, or a chat bridge admitting whoever the platform admits. No owner account
      binds any of it; the controls are a mandatory secret, pinned transport, and an
      allowlist the operator maintains.
    items:
      - id: phoneWeb
        label: Phone & web apps
        icon: phone
        note: Web UIs served by the harness itself, and mobile clients reaching it over relay tunnels.
      - id: chatChannels
        label: Chat channels
        icon: chat
        note: >
          Community bridges put messaging platforms in front of the loop — admission becomes
          platform identity, exactly the personal agent's model.

  - id: developer
    kind: actor
    title: User
    icon: person
    col: 0
    row: 1
    note: >
      Present, watching, and the approval gate — the same posture as the vendored products,
      enforced by nothing but the harness's own permission prompts.

  - id: repoOrigin
    kind: external
    title: Repos, docs & screen
    cosaiComponent: componentDataSources
    col: 0
    row: 2
    note: >
      Everything the agent reads: repository content, documents, screenshots. Contributed to
      by people who are not the user, and read into context as though it were instruction.
    items:
      - id: code
        label: Code & project docs
        icon: doc
        note: A repository is a document the attacker may have contributed to.
      - id: dotfile
        label: Tool config dotfile
        icon: gear
        note: >
          The tool-server declaration that ships with the code — and in this category, the
          rules and configuration files are the governance surface too.

  - id: client
    kind: service
    title: Agent harness
    col: 1
    row: 1
    cosaiComponent: componentReasoningCore
    note: >
      The loop behind the terminal or editor, running as the user. The same engine as the
      vendored products — several of these harnesses began as forks or reimplementations of
      them — addressable remotely wherever its server mode is on.
    items:
      - id: loop
        label: Agent loop
        icon: agent
        note: Decides the next edit or command from the task and everything it has read so far.
      - id: context
        label: Context assembly
        icon: doc
        note: Merges the instruction, the memory and the tool results into one prompt.
      - id: apiServer
        label: Local API server
        icon: plug
        note: >
          The serve mode: a listening port, localhost by default, auth ranging from a
          mandatory shared secret to none. The remote surface, and the exposure scans'
          target.

  - id: memory
    kind: service
    title: Memory & state
    col: 1
    row: 3
    cosaiComponent: componentDataStorage
    note: >
      The converged cross-session layer: rules files and agent-written memory read back as
      instruction on the next task — repo-committed rules are authored by whoever last
      committed.
    items:
      - id: memoryFiles
        label: Memory files
        icon: folder
        note: Agent-written notes and memory banks, loaded into later sessions as context.
      - id: rules
        label: Rules & instructions
        icon: doc
        note: The AGENTS.md-class files — user-level and repo-committed, portable across harnesses.

  - id: toolPlane
    kind: service
    title: Tool services
    col: 2
    row: 2
    cosaiComponent: componentTools
    note: >
      The action surface, running as the user on a machine that also holds their SSH keys,
      cloud credentials and browser sessions. Admission is configuration files on the same
      disk the agent can edit.
    items:
      - id: editTools
        label: File & edit tools
        icon: folder
        note: Read and write across the working tree and the user's documents.
      - id: shell
        label: Shell commands
        icon: code
        note: Command execution with the user's full authority — the category default is bare-host.
      - id: mcp
        label: Local & remote MCP
        icon: plug
        note: Local child processes with the user's privileges, and remote servers on standing grants.
      - id: skills
        label: Installed skills
        icon: gear
        note: Packaged instructions and helpers, increasingly shared across harnesses' skill directories.
      - id: sandboxedTools
        label: Sandboxed tools
        icon: shield
        note: >
          Largely absent in this category — the vendor harnesses ship kernel sandboxes, the
          community ones mostly punt. The item is the target state.

  - id: gateway
    kind: service
    title: AI gateway
    col: 2
    row: 0
    note: >
      The organisation-operated crossing that replaces the missing vendor column: the vault
      for the key the user would otherwise paste, deny-by-default egress, and the only audit
      trail this architecture can have. Target state — the common install calls the provider
      directly and leaves no record but the bill.
    items:
      - id: credBroker
        label: Credential broker
        icon: key
        note: Short-lived provider credentials injected per call; the harness holds no key at rest.
      - id: allowlist
        label: Egress allowlist
        icon: shield
        note: Deny by default; providers, registries and remote tool servers each named explicitly.
      - id: auditTap
        label: Audit tap
        icon: doc
        note: Every crossing recorded as a side effect — nothing else in this architecture writes a log.

  - id: provider
    kind: provider
    title: Model provider
    col: 3
    row: 0
    cosaiComponent: componentModelServing
    note: >
      The inference API, called on whatever credential the crossing supplies — or a local
      runtime standing in for it, which is this catalogue's local model runtime architecture.
    items:
      - id: inference
        label: Inference API
        icon: model
        note: The published interface. The completion it returns drives file writes and commands.

  - id: registry
    kind: external
    title: Private pkg registry
    cosaiComponent: componentDataSources
    col: 3
    row: 2
    note: >
      The organisation-maintained mirror of approved harnesses, extensions and skills — this
      architecture's supply chain includes the agent itself, and the community channels it
      ships through have already carried a compromised release. The private mirror moves the
      review; the risk stays until it happens.
    items:
      - id: hub
        label: Approved packages
        icon: db
        note: Harness releases, extensions and skills — reviewed, pinned and mirrored before installation.

  - id: downstream
    kind: external
    title: Downstream services
    cosaiComponent: componentDataSources
    col: 2
    row: 3
    note: >
      What the tool plane reaches over the network — and where fetched content comes back in
      as context indistinguishable from the user's instruction.
    items:
      - id: registries
        label: Package registries
        icon: db
        note: Dependencies and their metadata, authored by strangers and read into context.
      - id: web
        label: Web & APIs
        icon: globe
        note: Attacker-writable content that re-enters the loop as context, and the exfiltration path out.
      - id: saas
        label: SaaS
        icon: mail
        note: Accounts reached through standing grants that outlive the conversation.

edges:
  - from: developer
    to: client
    path: primary
    bidir: true
    label: task / approval
    note: >
      The user states the task and answers the approval prompts — the same gate as the
      vendored products, with no managed tier able to make any of it non-overridable.
  - from: developer
    to: remoteDevice
    path: primary
    label: away from the machine
    note: The same person, not at the keyboard — or, through a chat bridge, not necessarily the same person.
  - from: remoteDevice
    to: client
    path: primary
    label: serve port / relay / bridge
    note: >
      Three shapes, one crossing: a direct connection to the harness's listening port, a
      relay tunnel the harness dials out to, or a chat bridge forwarding platform messages.
      Admission is a bearer secret at best — never an owner-bound account.
  - from: repoOrigin
    to: client
    path: external
    label: read into context
    note: >
      Repository content, documents and screenshots are read into context as instruction —
      and in this category the configuration that governs the agent ships the same way.
  - from: client
    to: memory
    path: primary
    bidir: true
    note: The loop writes what it learns and reads it back as instruction on the next task.
  - from: client
    to: gateway
    path: primary
    bidir: true
    route: vh
    label: model & remote calls
    note: >
      The target-state crossing: brokered credentials, named destinations, a recorded call.
      The common state skips it entirely — a pasted key and a direct connection.
  - from: gateway
    to: provider
    path: primary
    bidir: true
    label: model inference
    note: Inference on a brokered credential; the completion that returns is unauthenticated content.
  - from: client
    to: toolPlane
    path: primary
    bidir: true
    label: tool calls
    note: >
      Tool calls out with whatever scope the harness's permission model granted; file
      contents and command output back into context.
  - from: toolPlane
    to: downstream
    path: external
    bidir: true
    note: >
      Remote tool calls, package fetches and connector reads out; content authored by
      strangers back in as model input.
  - from: toolPlane
    to: registry
    path: external
    label: installs & updates
    note: >
      The install path for the harness, its extensions and its skills. In the common state
      this is a public marketplace on publisher self-attestation; the mirror is the target.

pins:
  risks:
    - risk: riskPromptInjection
      at: repoOrigin->client
      note: >
        Source files, manifests and documents are unrelated paths into the same context
        window, none of which is the user's instruction.
    - risk: riskPromptInjection
      at: memory
      note: >
        Memory files and rules are prose a later session treats as instruction — including
        rules committed by whoever last touched the repo.
    - risk: riskMCPTransportHijacking
      at: remoteDevice->client
      note: >
        A serve port with optional auth, a guessable bearer secret, or an over-broad chat
        allowlist hands the loop — and the machine behind it — to whoever finds it. The
        exposure-scan history of the neighbouring personal-agent category is the precedent.
    - risk: riskSensitiveDataDisclosure
      at: client->gateway
      note: >
        The credential story: the key the gateway is meant to vault sits, in the common
        state, in plaintext configuration on disk — readable by the agent, its tools, and
        any repository script they run.
    - risk: riskShadowAndUnknownAgents
      at: client
      note: >
        A binary anyone can install from a package manager, in no inventory, with no vendor
        tenancy to enumerate. Discovery is entirely the organisation's problem.
    - risk: riskToolRegistryTampering
      at: toolPlane
      note: >
        Configuration admits the whole tool plane, arrives with the clone, and is writable
        by the agent itself — governance and attack surface in the same files.
    - risk: riskInsecureIntegratedComponent
      at: toolPlane
      note: Local MCP servers and skills are third-party code running as the user.
    - risk: riskToolSourceProvenance
      at: toolPlane->registry
      note: >
        The harness, its extensions and its skills all arrive through community channels on
        publisher self-attestation — and a compromised release of the harness itself has
        already shipped once.
    - risk: riskInsecureModelOutput
      at: gateway->provider
      note: The completion is unauthenticated content, and it drives file writes and shell commands.
    - risk: riskRogueActions
      at: client
      note: >
        The approval gate is the harness's own prompt, with no managed tier behind it — one
        --yolo flag from being no gate at all.

  capabilities:
    - capability: capabilitySecretsManagement
      at: gateway
      note: >
        Vault the provider keys behind the gateway's broker — keychain-backed where the
        harness supports it, never plaintext in a dotfile a repository script can read.
    - capability: capabilityEgressControl
      at: gateway
      note: >
        Deny-by-default egress at the crossing: providers, registries and remote tool
        servers each named — the control the missing vendor column will never supply.
    - capability: capabilityRateLimiting
      at: gateway
      note: Spend ceilings at the crossing, because the only native meter is the provider's invoice.
    - capability: capabilityAgentRuntimeEnforcement
      at: remoteDevice->client
      note: >
        The remote surface is admitted deliberately or not at all: mandatory shared secret,
        pinned transport, named allowlist — and off by default on any managed machine.
    - capability: capabilityToolPermissionScoping
      at: client->toolPlane
      note: >
        The standard permission gate between harness and tools — per-tool grants scoped to
        the working tree, configured outside the repository the agent works on.
    - capability: capabilityAgentSandboxing
      at: toolPlane
      note: >
        The category ships bare-host by default: sanction the harnesses that support
        sandboxed execution, and treat its absence as a finding in harness selection.
    - capability: capabilityCredentialIsolation
      at: toolPlane
      note: >
        Keep SSH keys, cloud credentials and browser profiles outside the agent's reachable
        filesystem and environment.
    - capability: capabilityMemoryProtection
      at: client->memory
      note: >
        Treat memory and rules as untrusted input on read; a repo-committed rules change is
        a code change.
    - capability: capabilityPromptInjectionDefense
      at: repoOrigin->client
      note: Treat repository and document content as untrusted on read; it cannot be authenticated, only bounded.
    - capability: capabilityMcpToolSecurity
      at: toolPlane->registry
      note: >
        Pin harness, extension and skill versions against the mirror; an update is a
        decision, because the update channel is the category's proven attack path.
    - capability: capabilityHitlControls
      at: client
      note: >
        Keep the approval gate real: dangerous-command detection on, auto-approve flags
        banned on managed machines, prompts rare enough to read.
    - capability: capabilityShadowAiDiscovery
      at: client
      note: Find the installs nobody registered — package-manager and process telemetry, not self-reporting.

scenarios:
  - title: The user asks for a change
    steps:
      - follow: developer->client
        note: The task is stated by a human who stays for the session.
      - follow: client->gateway
        note: The turn's model call crosses on a brokered credential — or, in the common state, does not cross here at all.
      - follow: gateway->provider
        note: The completion returns and is treated as the plan.
      - follow: client->toolPlane
        note: Edits and commands execute with whatever scope the harness's permission model granted.
      - follow: client->developer
        note: The diff comes back to the person who asked.
  - title: A phone reaches the serve port
    steps:
      - follow: developer->remoteDevice
        note: The instruction is written on a phone, a web UI, or a chat thread.
      - follow: remoteDevice->client
        note: >
          Admission is whatever the deployment configured — a shared secret, a tunnel, a
          platform allowlist. Nothing checks that the sender is the owner.
      - follow: client->toolPlane
        note: Execution is local, with the machine's full context and the user's credentials around it.
  - title: The harness updates itself
    steps:
      - follow: toolPlane->registry
        note: A new release of the harness or one of its extensions is pulled — the supply chain's proven path.
      - follow: toolPlane->client
        note: The update loads into the process with everything the agent has — a compromised release is code execution as the user.

deviations:
  - subject: No governance plane is drawn
    reason: >
      The category has none: no managed settings tier, no session audit export, no admin
      toggle. Where enterprise control exists it is bolt-on and adopted per team. The empty
      space beside this drawing is the finding, exactly as it is for the personal agent.
  - subject: The AI gateway is drawn although the common install lacks it
    reason: >
      This catalogue draws target states. The gateway is the organisation's replacement for
      the missing vendor column — key vault, egress policy, audit — and the common state,
      a pasted key calling the provider directly, is recorded here rather than drawn as a
      second model path.
  - subject: The package registry is drawn as this architecture's supply chain, not just the tools'
    reason: >
      The registry delivers the harness itself, its extensions and its skills. The category's
      landmark incident was a compromised harness release on a community channel, so the
      install edge carries the provenance risk and the pinning control.

