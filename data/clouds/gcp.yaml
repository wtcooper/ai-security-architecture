      - { block: localTools, service: ADK function tools and Code Execution }
      - { block: orchestration, service: ADK coordinator agent (resumable), note: "ResumabilityConfig: the session's event history is the journal a stopped workflow resumes from." }
      - { block: subagents, service: "ADK subagents, each on its own service account" }
      - { block: state, service: "Agent Platform Sessions, Firestore, Agent Search", note: "Event history in Sessions; shared working memory in Firestore; the index in Agent Search." }
      - { block: gateway, service: Apigee (AI gateway), note: "Agent Gateway is the Agent Platform's own gateway — Google-managed for agents on Agent Runtime, early preview for Cloud Run." }
