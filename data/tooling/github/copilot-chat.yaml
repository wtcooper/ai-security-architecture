        url: https://docs.github.com/en/copilot/responsible-use/chat
      - title: Chat in GitHub (retention, attachments)
        url: https://docs.github.com/en/copilot/how-tos/chat-with-copilot/chat-in-github
      - title: Copilot Spaces
        url: https://docs.github.com/en/copilot/concepts/context/spaces
      - title: About Copilot Memory
        url: https://docs.github.com/en/copilot/concepts/agents/copilot-memory
      - title: Managing policies for Copilot in your organization
        url: https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-organization/manage-policies
      - title: Enable custom models (enterprise BYOK)
        url: https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-enterprise/enable-custom-models
      - title: Copilot with data residency
        url: https://docs.github.com/en/enterprise-cloud@latest/admin/data-residency/github-copilot-with-data-residency
