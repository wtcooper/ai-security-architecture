# The AI tooling registry: named products, one entity per product × reference architecture,
# under data/tooling/<vendor>/<family>.yaml. This is the only layer of the repository that
# names vendors, so the exemplar rule applies to every entry: dated (asOf), sourced from the
# vendor's own documentation, and every operator step linking to the page that documents it.
# An entry older than six months is flagged for re-verification by `npm run audit`.
attribution: >-
  Authored in this repository. Facts are distilled from each vendor's own documentation,
  fetched and verified on the asOf date recorded per entry; nothing here is recalled from
  model memory. Verify against the vendor's current pages before enforcing.

vendors:
  - id: anthropic
    name: Anthropic
    url: https://www.anthropic.com
    trust: https://trust.anthropic.com
  - id: openai
    name: OpenAI
    url: https://openai.com
    trust: https://trust.openai.com
  - id: cursor
    name: Cursor
    url: https://cursor.com
    trust: https://trust.cursor.com
  - id: github
    name: GitHub
    url: https://github.com/features/copilot
    trust: https://resources.github.com/copilot-trust-center/
  - id: openclaw
    name: OpenClaw (open source)
    url: https://openclaw.ai
  - id: nous
    name: Nous Research
    url: https://nousresearch.com
