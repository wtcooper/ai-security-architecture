  - architecture: archRemoteMcpServer
    asOf: "2026-10"
    # >>> checked against the vendor's documentation
    verified: "2026-11-18"
    sources:
      idp: https://docs.cloud.google.com/identity-platform/docs/multi-tenancy
      gateway: https://docs.cloud.google.com/apigee/docs/api-platform/apigee-mcp/manage-mcp-tool-access
      authServer: https://docs.cloud.google.com/apigee/docs/api-platform/security/oauth/oauth-home
      service: https://docs.cloud.google.com/run/docs/host-mcp-servers
      orgData: https://docs.cloud.google.com/run/docs/configuring/services/secrets
    differences:
      - at: service->authServer
        text: "The Cloud Run service never sees or checks the caller's token. Apigee checks it, then calls Cloud Run with its own Google identity token, and offers no token-exchange grant. Have Apigee pass the verified app, user and tenant on to the service."
        url: https://docs.cloud.google.com/apigee/docs/api-platform/security/google-auth/overview
      - at: callers->authServer
        text: "Apigee does not host a sign-in or consent page. Its authorization-code flow redirects to a login app that you build and run; that app signs the user in (here with Identity Platform) and then asks Apigee to issue the code."
        url: https://docs.cloud.google.com/apigee/docs/api-platform/security/oauth/oauth-v2-policy-authorization-code-grant-type
      - at: callers->idp
        text: "Identity Platform signs each customer's users in through their tenant's SAML or OIDC provider, but its documentation describes no identity assertion grant (ID-JAG) for agents. Plan on browser sign-in through your login app only, unless you add another identity product."
        url: https://docs.cloud.google.com/identity-platform/docs/concepts-authentication
      - at: gateway->service
        text: "By default a Cloud Run service's run.app address can be reached from the internet. Require authentication, give the invoker role only to Apigee's proxy service account, and restrict ingress or disable the default address so callers cannot go round Apigee."
        url: https://docs.cloud.google.com/run/docs/securing/ingress
      - at: callers->gateway
        text: "MCP clients find the authorization server through a metadata document at /.well-known/oauth-protected-resource/mcp; Apigee answers 404 when it is not configured. Make sure your proxy serves it, and put an external load balancer in front of Apigee for internet callers."
        url: https://docs.cloud.google.com/apigee/docs/api-platform/apigee-mcp/troubleshoot-mcp-deployments
      - at: service
        text: "Deploying with the functional-type flag also lists the server in your organisation's Agent Registry, and the setting cannot be changed afterwards. It is a Preview feature. Google's own guides then protect such servers with IAP and Google sign-in, not Apigee."
        url: https://docs.cloud.google.com/run/docs/ai/agent-platform-features
    alsoNeeded:
      - service: "External Application Load Balancer (with Private Service Connect to Apigee)"
        role: ingress
        why: "Internet callers reach Apigee through an external load balancer; Apigee is not directly exposed."
        url: https://docs.cloud.google.com/apigee/docs/api-platform/get-started/networking-options
      - service: "Apigee proxy service account (IAM)"
        role: identity
        why: "Apigee calls Cloud Run as a named service account that needs the Cloud Run invoker role."
        url: https://docs.cloud.google.com/apigee/docs/api-platform/security/google-auth/overview
      - service: "Login and consent app (your own, for example on Cloud Run)"
        role: other
        why: "Apigee's authorization-code flow needs a login app you host to sign users in and record consent."
        url: https://docs.cloud.google.com/apigee/docs/api-platform/security/oauth/oauth-v2-policy-authorization-code-grant-type
      - service: "Artifact Registry"
        role: registry
        why: "Holds the MCP server's container image that Cloud Run deploys and Artifact Analysis scans."
        url: https://docs.cloud.google.com/artifact-analysis/docs/enable-automatic-scanning
      - service: "Private Service Connect or VPC peering from Apigee to the backend"
        role: network
        why: "Apigee reaches backends in your network over VPC peering or Private Service Connect, which you set up."
        url: https://docs.cloud.google.com/apigee/docs/api-platform/get-started/networking-options
      - service: "Secret Manager"
        role: secrets
        why: "Holds each upstream credential the handlers use."
        url: https://docs.cloud.google.com/run/docs/configuring/services/secrets
      - service: "Secure Web Proxy with a VPC network"
        role: network
        why: "Filters the service's outbound traffic to an allowed list."
        url: https://docs.cloud.google.com/secure-web-proxy/docs/overview
      - service: "Cloud Logging"
        role: logging
        why: "Receives Apigee's per-call logs; the proxy's service account needs the log writer role."
        url: https://docs.cloud.google.com/apigee/docs/api-platform/reference/policies/message-logging-policy
    quickstart:
      - title: "Build and deploy a remote MCP server on Cloud Run"
        url: https://docs.cloud.google.com/run/docs/tutorials/deploy-remote-mcp-server
      - title: "Manage MCP tool access"
        url: https://docs.cloud.google.com/apigee/docs/api-platform/apigee-mcp/manage-mcp-tool-access
    # <<< checked
    reference:
      - title: Host MCP servers on Cloud Run
        url: https://docs.cloud.google.com/run/docs/host-mcp-servers
      - title: Get started with Apigee and MCP
        url: https://docs.cloud.google.com/apigee/docs/api-platform/apigee-mcp/apigee-mcp-quickstart
      - title: Single-agent AI system using ADK and Cloud Run — MCP security considerations
        url: https://docs.cloud.google.com/architecture/single-agent-ai-system-adk-cloud-run
    summary:
      - >-
        Your MCP server on Cloud Run, published only through an Apigee MCP proxy that is also the
        OAuth 2.0 authorization server: clients are registered developer apps whose API products
        name the tools they may see, so every token is bound to this proxy and checked, with its
        app, on each request. Customer callers sign in through their own IdP, federated as an
        Identity Platform tenant. Google's own reference protects Cloud Run MCP servers with IAP
        and Agent Gateway, which serve internal callers rather than a server published to other
        organisations.
    bindings:
      - block: idp
        service: "Identity Platform (a tenant per customer)"
        note: "Each customer organisation's IdP federated as its tenant's SAML or OIDC provider; your own staff through your workforce IdP."
        options:
          - { name: "Identity Platform (a tenant per customer)", kind: commercial, url: "https://docs.cloud.google.com/identity-platform/docs/multi-tenancy", note: "Each customer organisation's SAML or OIDC IdP federated into its own tenant.", packs: [googleCloudNative] }
          - { name: "Auth0", kind: commercial, url: "https://auth0.com/ai/docs/mcp/overview", note: "Customer identity service whose Auth for MCP signs users in through their own IdP, such as Okta, Entra ID, Ping or Google Workspace." }
          - { name: "Keycloak on GKE", kind: open, url: "https://www.keycloak.org/docs/latest/server_admin/index.html", note: "Self-run realms that broker each customer's OIDC or SAML IdP, and can also be the MCP authorization server.", packs: [openSourceOnGke] }
      - block: gateway
        service: "Apigee (MCP proxy)"
        note: "ParsePayload reads the JSON-RPC method and tool, so authorization, quotas and logging are per tool."
        options:
          - { name: "Apigee (MCP proxy)", kind: commercial, url: "https://docs.cloud.google.com/apigee/docs/api-platform/apigee-mcp/apigee-mcp-overview", note: "Parses JSON-RPC so authorisation, quotas and logs apply per tool; clients are registered developer apps.", packs: [googleCloudNative] }
          - { name: "Kong AI MCP Proxy with AI MCP OAuth2", kind: commercial, url: "https://developer.konghq.com/plugins/ai-mcp-proxy/", note: "Per-tool ACLs and OAuth 2.0 for MCP clients from Kong Gateway 3.12; both plugins need AI Gateway Enterprise.", packs: [kongAiGateway] }
          - { name: "LiteLLM Proxy on GKE or Cloud Run", kind: open, url: "https://docs.litellm.ai/docs/mcp", note: "MCP gateway with one endpoint for all tools and access by key or team; JWT sign-in of callers needs its Enterprise licence.", packs: [openSourceOnGke] }
          - { name: "agentgateway", kind: open, url: "https://agentgateway.dev/", note: "Linux Foundation project: an MCP gateway that scopes and records every tool call, standalone or on Kubernetes." }
          - { name: "Agent Gateway with Model Armor", kind: commercial, url: "https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/gateways/agent-gateway-overview", note: "Client-to-Agent mode authenticates callers and screens prompts for MCP servers on GKE (Preview) or Cloud Run (Limited Preview)." }
      - block: authServer
        service: "Apigee OAuth 2.0 token endpoints"
        note: "Clients are pre-registered as developer apps, so no client-metadata document is fetched; Google Cloud workloads present their own service-account identity, checked by VerifyIAM."
        options:
          - { name: "Apigee OAuth 2.0 token endpoints", kind: commercial, url: "https://docs.cloud.google.com/apigee/docs/api-platform/apigee-mcp/apigee-mcp-overview", note: "Clients are pre-registered developer apps whose API products name the tools they may see.", packs: [googleCloudNative] }
          - { name: "Auth0 Auth for MCP", kind: commercial, url: "https://auth0.com/ai/docs/mcp/overview", note: "Standards-based discovery and client registration, resource-scoped tokens and on-behalf-of token exchange for MCP servers." }
          - { name: "Keycloak as MCP authorization server", kind: open, url: "https://www.keycloak.org/securing-apps/mcp-authz-server", note: "Keycloak's guide sets out which MCP specification versions, to 2026-07-28, it serves as an authorization server.", packs: [openSourceOnGke] }
      - { block: service, service: Your MCP server on Cloud Run, note: "Deployed with --functional-type=mcp-server and invoked only by Apigee's service account." }
      - { block: toolDefs, service: Tool definitions in your repository, build: true, note: "Versioned with the release and pinned by hash where the server loads them." }
      - { block: orgData, service: Your systems of record, build: true, note: "Reached on the service's own identity or a Secret Manager credential for that upstream, never the caller's token." }
    # >>> hosting options (compared against the vendor's pages; one is the mapping itself)
    hosting:
      - id: cloudRun
        kind: runtime
        name: "Cloud Run"
        url: https://docs.cloud.google.com/run/docs/host-mcp-servers
        asOf: "2026-11"
        mapped: true
        compare:
          runs: "Your MCP server container runs as a Cloud Run service; Google runs the instances and starts and stops them with traffic."
          patching: "Google patches the infrastructure; you rebuild your image, or enable automatic base image updates so that Google patches its OS and runtime layers."
          data: "Requests and tool results are processed in instances in the region you choose; instances are stateless, so anything kept goes to a store you choose."
          network: "Ingress settings and IAM limit who can call it; Direct VPC egress sends outbound traffic into your VPC, otherwise it leaves through Google's shared internet egress."
          identity: "Each revision runs as the service account set as its service identity; if you set none it uses the Compute Engine default service account."
          accepts: "Whatever is in your container image or, with sandbox templates, in up to 10 other images; processes can add tools with apt, pip or npm; headless browsers are documented."
          workload: "Responses can stream and a request can run for up to 60 minutes (5 by default); session affinity is off by default and can still move a client to another instance."
          portability: "It is a standard container image, so the same image runs on GKE; the Cloud Run service settings, IAM bindings and ingress settings do not carry over."
          effort: "You operate the server code, its image and the service configuration; there is no cluster, node or autoscaler for you to run."
          fits: "Google names Cloud Run for deploying custom tools as scalable HTTP endpoints without managing infrastructure, and for stateless request-driven services."
        sources:
          - https://docs.cloud.google.com/run/docs/host-mcp-servers
          - https://docs.cloud.google.com/run/docs/tutorials/deploy-remote-mcp-server
          - https://docs.cloud.google.com/run/docs/ai/authenticate-mcp-servers
