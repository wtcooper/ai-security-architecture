# Replit: one entity per product × reference architecture. Facts are dated (asOf) and cite the vendor's own
# documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# Scope: Replit Agent building apps in the Project Editor, the development and production databases, publishing
# (Autoscale, Static, Reserved VM and Scheduled deployments at replit.app or a custom domain), connectors, the
# Security Center, and the account and Workspace administration of Enterprise (Settings › Advanced, Workspace
# settings, the Admin API).
# Exclusions: Replit Design and the Chat surface used without a project; Code with Replit (environment builds
# from an existing repository, an early-access coding-session workflow nearer the coding & desktop session
# runtime); Workspace Reps; Bring your own cloud; mobile apps published to app stores; the Replit mobile app.
# 2026-11-25: onboarded on archHostedAppBuilder. Every docs.replit.com page was read as Markdown (<path>.md, from
# docs.replit.com/llms.txt and /_llms/en/features.txt), all 200; the URLs below are the same pages without .md.
# Two pages disagree on SAML: the SAML guide says Enterprise admins configure it themselves under Advanced ›
# Authentication, the Enterprise Advanced Settings page says to contact Replit to enable it; both say disabling
# needs the account manager. The connector governance controls are labelled early access; the Admin API is beta.
# The publishing page now states the default audience: Public in a personal Workspace, a private option in an
# organization Workspace. Not read: trust.replit.com (portal, client-rendered). The audit event names come from
# the public schema catalog at replit.com/security/audit-logs (200).
# 2026-11-25 (daily feed): added tunnelEndpoints (Tunnels, early access) from replit.com/blog/build-with-private-data-
# using-tunnels and docs.replit.com/features/security/tunnels (.md, both 200). The blog says tunnel traffic carries
# connector sign-ins, Agent tool calls and published apps' requests; the docs describe the Development Environment
# path and add that revoking an enrollment key does not end connector sessions already open.
vendor: replit
family: Replit
tools:
  - id: toolReplit
    name: Replit (Replit Agent, databases and Deployments)
    surfaceClasses:
      - saasAgentPlatform
    variants:
      - name: Replit Agent in the Project Editor (web)
        class: saasAgentPlatform
        url: https://docs.replit.com/features/agent/overview
      - name: Replit Deployments (Autoscale, Static, Reserved VM, Scheduled)
        class: saasAgentPlatform
        url: https://docs.replit.com/features/publishing/deployment-types
    architecture: archHostedAppBuilder
    status: ga
    asOf: "2026-11"
    summary:
      - >-
        Replit Agent builds the app in a Replit project against a development database it can change, behind a
        development URL that is private by default. Publishing creates a separate production database the Agent
        can read only through a read-only replica, runs a security scan, and serves the app at a replit.app address
        or a custom domain to the public, to holders of a password, to the Workspace or to invited people and
        groups. The app reaches its database from its own server; secrets sync from development to the deployment
        at publish.
      - >-
        Administration is the Enterprise account's: Settings › Advanced (Authentication, Identity & Governance,
        Security, Privacy settings, Deployment settings, Requests, Disable features, Source control), Settings ›
        Integrations for connector governance, the Workspace Security Center, audit logs streamed through WorkOS,
        and the Admin API (beta). Core and Pro have one account admin and no SSO, audit logs or publishing
        policies; on those plans each builder chooses the audience.
    facts:
      - label: Plans
        value: >-
          Starter (free), Core, Pro and Enterprise. Enterprise adds SAML SSO, SCIM, custom groups, separate
          Workspace admins, audit logs with SIEM streaming, the Compliance API, the Advanced settings publishing and
          scan policies, model controls, custom OAuth clients and the Admin API (beta).
        url: https://docs.replit.com/billing/plans/replit-enterprise
      - label: Inference & routing
        value: >-
          Agent runs on models from OpenAI, Anthropic, Google and others, picked by Auto mode or the model selector;
          Enterprise model controls enable providers and models per Workspace (at least one model each from OpenAI,
          Anthropic and Google must stay on), and Enterprise can bring its own OpenAI key through connectors.
        url: https://docs.replit.com/features/collaboration/enterprise-model-controls
      - label: Data leaving the device
        value: >-
          Projects, chat and data are processed in Replit's cloud, primarily Google Cloud in the United States with
          an optional India region; a published app and its resources are locked to the deployment geography chosen
          at publish (North America, South America, Europe (EU), Asia or Australia).
        url: https://docs.replit.com/teams/information-security/overview
      - label: Retention & training
        value: >-
          Replit does not use Enterprise customer content to train its models; Pro users can opt out under
          Personalization › Model Improvement, and the page offers no opt-out on other plans. Audit logs are kept 30
          days in the portal and deployment logs 30 days.
        url: https://docs.replit.com/legal-and-security-info/model-improvement
      - label: Docs index
        value: docs.replit.com (index at docs.replit.com/llms.txt); Enterprise administration under Teams and Enterprise.
        url: https://docs.replit.com/teams/welcome
      - label: Compliance scope
        value: >-
          SOC 2 Type 2 attestation; hosting on Google Cloud (ISO 27001, SOC 2 Type 2); Trust Center at
          trust.replit.com. The shared responsibility model leaves the published app's user management, access
          control, data and penetration testing to the customer.
        url: https://docs.replit.com/features/security/shared-responsibility-model
    items:
      - title: Where each control lives
        body:
          - >-
            Settings › Advanced holds the account policies: Authentication (SAML single sign-on, Idle session
            timeout), Identity & Governance (SCIM, Audit logs), Security (Auto-Protect, Require security scan, Block
            publishing at severity, alert recipients), Privacy settings (Private deployments, public publishing
            exceptions, password-protected deployments, private development URLs, export and upload bans),
            Deployment settings, Requests (Require publish approval), Disable features and Source control. An
            account admin can set each as an account policy, an exception for one Workspace, or Workspace managed.
        links:
          - title: Enterprise Advanced Settings
            url: https://docs.replit.com/teams/enterprise-privacy-settings
          - title: Advanced settings (account policies, exceptions, delegation, requests)
            url: https://docs.replit.com/teams/advanced-settings
      - title: Two databases, two restores
        body:
          - >-
            The Agent changes only the development database; schema changes reach production at publish, after
            Replit flags destructive changes and offers a publish preview on a migrated copy. Checkpoint rollback
            restores code and, optionally, the development database, never production; production has its own
            point-in-time recovery and scheduled backups.
        links:
          - title: Development and production databases
            url: https://docs.replit.com/features/data-and-storage/development-and-production
          - title: Data recovery
            url: https://docs.replit.com/features/data-and-storage/data-recovery
    riskNotes:
      - risk: riskSensitiveDataDisclosure
        note: >-
          Apps in a personal Workspace publish Public by default, and Private deployments applies only to apps
          published after it is set; changing a live app's audience requires unpublishing and publishing again.
      - risk: riskRogueActions
        note: >-
          In July 2025 Replit Agent deleted a production database during a code freeze; the Agent now changes only
          the development database and reads production through a read-only replica.
      - risk: riskShadowAndUnknownAgents
        note: >-
          Claiming email domains for SSO forces SSO sign-in but does not add accounts to the organization, so a
          person keeps a personal Workspace whose apps publish Public by default.
      - risk: riskAgenticDelegationConfusedDeputy
        note: >-
          Connections belong to the Replit account that made them and are reused across that person's apps, so a
          published app's connector calls run on its builder's or a shared account's grant, not the visitor's.
      - risk: riskInsecureIntegratedComponent
        note: >-
          Package Firewall (Socket) blocks known-malicious and compromised npm, yarn, pnpm, pip and Go packages at
          install, on by default with no setting, aimed at typosquats and hallucinated names.
      - risk: riskInsecureModelOutput
        note: >-
          The app's own authorization is code the Agent writes; the publish check covers dependency
          vulnerabilities, and a source-code review needs a Level 2 Agent security scan.
    settings:
      - id: privateDeployments
        name: Private deployments (Public deployments in the account-policy view)
        where: Settings › Advanced › Privacy settings (listed as Public deployments among the account policies)
        setVia: [adminConsole]
        area: sharing
        default: Not stated on the settings page; organization Workspace apps default to a private audience
        recommended: Require for non-admins (Enabled for admins only in the Public deployments view), set as an account policy rather than Workspace managed
        value: "Require for non-admins"
        why: Only an administrator can publish an app to the public; every other new app is Workspace only or Invite only.
        mitigations: [D3-APA]
        requires: Enterprise
        url: https://docs.replit.com/teams/privacy-and-deployment-settings#private-deployments
        verified: "2026-11-25"
      - id: publicPublishingExceptions
        name: Public publishing exceptions
        where: Settings › Advanced › Privacy settings › Public publishing exceptions › Manage
        setVia: [adminConsole]
        area: sharing
        default: None
        recommended: Reviewed each quarter, with exceptions for apps no longer public-facing revoked
        value: "Reviewed quarterly"
        why: Projects allowed to publish publicly despite the policy stay a short, current list.
        mitigations: [D3-APA]
        requires: Enterprise
        url: https://docs.replit.com/teams/privacy-and-deployment-settings#public-publishing-exceptions
        verified: "2026-11-25"
      - id: passwordProtectedDeployments
        name: Password-protected deployments
        where: Settings › Advanced › Privacy settings
        setVia: [adminConsole]
        area: sharing
        default: Not stated
        recommended: Disabled
        why: A shared password identifies nobody and survives people leaving; private apps use signed-in identity instead.
        mitigations: [D3-APA]
        requires: Enterprise
        url: https://docs.replit.com/teams/privacy-and-deployment-settings#password-protected-deployments
        verified: "2026-11-25"
      - id: scimProvisioning
        name: Automatic member provisioning (SCIM)
        where: Settings › Advanced › Identity & Governance › Enable SCIM
        setVia: [identityProvider, adminConsole]
        area: identity
        default: "Off"
        recommended: On, with roles assigned through synced IdP groups
        value: "On"
        why: Who builds follows your directory, and people who leave are deprovisioned from the account.
        mitigations: [D3-APA]
        requires: Enterprise
        url: https://docs.replit.com/teams/identity-and-access-management/scim
        verified: "2026-11-25"
      - id: requireSecurityScan
        name: Require security scan
        where: Settings › Advanced › Security
        setVia: [adminConsole]
        area: tools
        default: Not stated (Off lets members choose)
        recommended: Require
        why: Every publish runs the scan, rather than only when the builder asks for one; admins cannot skip it either.
        mitigations: [D3-AVE]
        requires: Enterprise
        url: https://docs.replit.com/teams/security#require-security-scans-before-publishing
        verified: "2026-11-25"
      - id: blockPublishingAtSeverity
        name: Block publishing at severity
        where: Settings › Advanced › Security
        setVia: [adminConsole]
        area: tools
        default: Critical
        recommended: Critical
        why: A required scan that finds a critical vulnerability stops the publish; Disabled would leave only the global CVE blocklist.
        mitigations: [D3-AVE]
        requires: Enterprise
        url: https://docs.replit.com/teams/security#block-publishing-by-severity
        verified: "2026-11-25"
      - id: autoProtect
        name: Auto-Protect for security vulnerabilities
        where: Settings › Advanced › Security
        setVia: [adminConsole]
        area: tools
        default: "Off"
        recommended: High (and above)
        value: "High"
        why: A newly disclosed CVE in a published app's dependencies gets a tested patch prepared for its builder to apply and republish.
        mitigations: [D3-AVE]
        requires: Account admin; patches are billed as Agent work
        url: https://docs.replit.com/teams/security#enable-auto-protect
        verified: "2026-11-25"
      - id: securityAlertRecipients
        name: Security alert recipients
        where: Settings › Advanced › Security
        setVia: [adminConsole]
        area: audit
        default: Every Workspace admin
        recommended: Your security team's distribution list
        why: Dependency CVE digests reach the people who triage them, not only the Workspace admins.
        mitigations: [D3-AVE]
        requires: Enterprise
        url: https://docs.replit.com/teams/security#choose-security-alert-recipients
        verified: "2026-11-25"
      - id: externalAccessTokens
        name: External access tokens
        where: Publishing › Adjust settings › Security › External access tokens
        setVia: [adminConsole]
        area: identity
        default: None
        recommended: Production tokens only for named services, with the shortest expiration, revoked when unused
        value: "Named services, shortest expiry"
        why: A token reaches a private deployment without sign-in for as long as it lives, so it is issued for one caller and expires.
        mitigations: [D3-CH]
        requires: In Enterprise Workspaces only Workspace admins manage tokens
        url: https://docs.replit.com/features/deployment-customization/external-access-tokens
        verified: "2026-11-25"
      - id: privateRemotes
        name: Private remotes
        where: Settings › Advanced › Source control settings
        setVia: [adminConsole]
        area: data
        default: Not stated
        recommended: Require
        why: Code synced from Replit lands only in private repositories.
        mitigations: [D3-CH]
        requires: Enterprise
        url: https://docs.replit.com/teams/enterprise-privacy-settings#source-control-settings
        verified: "2026-11-25"
      - id: allowedGitRemoteTargets
        name: Allowed Git provider and Whitelisted organizations
        where: Settings › Advanced › Source control settings
        setVia: [adminConsole]
        area: data
        default: Any provider; no allowlist
        recommended: Your Git provider, with your organizations listed
        value: "Your provider and organizations"
        why: Repositories can be created only in your organizations, with personal repositories disabled, so exported code stays under your branch rules.
        mitigations: [D3-CH]
        requires: Enterprise
        url: https://docs.replit.com/teams/enterprise-privacy-settings#allowed-git-remote-targets
        verified: "2026-11-25"
      - id: customOAuthClients
        name: Provider configuration (Custom) and Connector scopes
        where: Settings › Integrations › Workspace integrations (admin) › configuration
        setVia: [adminConsole]
        area: tools
        default: Replit defaults (Replit's provider app)
        recommended: Custom, your organisation's OAuth client, with only the scopes each app needs
        value: "Your OAuth client, minimum scopes"
        why: The grant is issued to your own client, so you can see and revoke it at your identity provider or service, not only in Replit.
        mitigations: [D3-CH, AML.M0028]
        requires: Enterprise for custom OAuth clients; the governance view is early access
        url: https://docs.replit.com/teams/connector-governance#provider-configuration-and-scopes
        verified: "2026-11-25"
      - id: regenerateProductionCredentials
        name: Regenerate production database credentials
        where: Database › Production › Settings
        setVia: [adminConsole]
        area: data
        recommended: Regenerated whenever a production connection string may have been exposed
        value: "On any suspected exposure"
        why: Old production connection strings stop working at once.
        mitigations: [D3-CH]
        requires: Neon production database; the app owner or a Workspace administrator
        url: https://docs.replit.com/features/data-and-storage/connection-details#regenerate-production-database-credentials
        verified: "2026-11-25"
      - id: requirePrivateDevelopmentUrls
        name: Require private development URLs
        where: Settings › Advanced › Privacy settings
        setVia: [adminConsole]
        area: sharing
        default: "Off (development URLs are private by default, and builders can make one public)"
        recommended: "On"
        why: No builder can make an in-progress app public; development URLs require sign-in, through SSO where SAML is on, and the policy applies to existing apps.
        mitigations: [cap-staged-rollout-gate]
        requires: Enterprise
        url: https://docs.replit.com/teams/privacy-and-deployment-settings#protect-development-previews
        verified: "2026-11-25"
      - id: pitrRecoveryWindow
        name: Point-in-time recovery (Recovery window)
        where: Database › Production › Settings › Advanced › Point-in-time recovery
        setVia: [adminConsole]
        area: data
        default: 7 days
        recommended: 28 days
        why: Live data can be put back to any second in the last four weeks, separately from rolling back code.
        mitigations: [cap-staged-rollout-gate]
        requires: 28 days needs Pro, Teams or Enterprise
        url: https://docs.replit.com/features/data-and-storage/data-recovery#change-the-retention-window
        verified: "2026-11-25"
      - id: scheduledBackups
        name: Scheduled backups (Keep backups for)
        where: Database › Production › Settings › Advanced › Scheduled backups
        setVia: [adminConsole]
        area: data
        default: "Off"
        recommended: 28 days
        why: A daily full copy of production exists that does not depend on the recovery window.
        mitigations: [cap-staged-rollout-gate]
        requires: Core, Pro, Teams or Enterprise; 14 and 28 days need Pro, Teams or Enterprise
        url: https://docs.replit.com/features/data-and-storage/data-recovery#schedule-daily-production-backups
        verified: "2026-11-25"
      - id: requireGitRemote
        name: Require Git remote
        where: Settings › Advanced › Source control settings
        setVia: [adminConsole]
        area: data
        default: Not stated
        recommended: Require for non-admins
        why: Every change is pushed to your repository before it is published, so each live version has a commit to review and return to.
        mitigations: [cap-staged-rollout-gate]
        requires: Enterprise
        url: https://docs.replit.com/teams/enterprise-privacy-settings#source-control-settings
        verified: "2026-11-25"
      - id: samlSso
        name: SAML single sign-on (with Email domains)
        where: Settings › Advanced › Authentication › SAML single sign-on
        setVia: [adminConsole, identityProvider]
        area: identity
        default: "Off"
        recommended: Active, with every corporate email domain and alias claimed and MFA at the identity provider
        value: "Active, all corporate domains claimed"
        why: Everyone on a claimed domain, makers and visitors signing in to private apps alike, can sign in only through your identity provider.
        mitigations: [D3-MFA]
        requires: Enterprise
        url: https://docs.replit.com/teams/identity-and-access-management/saml
        verified: "2026-11-25"
      - id: idleSessionTimeout
        name: Idle session timeout
        where: Settings › Advanced › Authentication
        setVia: [adminConsole]
        area: identity
        default: Not stated
        recommended: 8 hours
        why: An unattended signed-in session ends and the next sign-in goes back through your identity provider.
        mitigations: [D3-MFA]
        requires: Enterprise
        url: https://docs.replit.com/teams/enterprise-privacy-settings#authentication
        verified: "2026-11-25"
      - id: requirePublishApproval
        name: Require publish approval
        where: Settings › Advanced › Requests › (Workspace) › Requests
        setVia: [adminConsole, apiCli]
        area: sharing
        default: "Off"
        recommended: "On"
        why: Members cannot publish directly; nothing goes live until an admin approves the request, in Settings or through the Admin API.
        mitigations: [AML.M0029]
        requires: Enterprise
        url: https://docs.replit.com/teams/advanced-settings#configure-requests-for-a-workspace
        verified: "2026-11-25"
      - id: requestPublicPublish
        name: Request to publish an app as public
        where: Settings › Advanced › Requests › (Workspace) › Requests
        setVia: [adminConsole]
        area: sharing
        default: Not stated
        recommended: Enabled, alongside Private deployments set to Require for non-admins
        value: "Enabled"
        why: A builder who needs a public app asks an admin, who sees the requester, reason and project before allowing it.
        mitigations: [AML.M0029]
        requires: Enterprise
        url: https://docs.replit.com/teams/advanced-settings#access-requests
        verified: "2026-11-25"
      - id: connectorAudience
        name: Who has access (configuration audience)
        where: Settings › Integrations › Workspace integrations (admin)
        setVia: [adminConsole]
        area: tools
        default: Chosen when the configuration is created
        recommended: Selected people and groups
        why: Each connector configuration is usable only by the teams approved for it, not by everyone in the Workspace.
        mitigations: [AML.M0028]
        requires: Early access; group grants need Enterprise
        url: https://docs.replit.com/teams/connector-governance#audience-and-roles
        verified: "2026-11-25"
      - id: tunnelEndpoints
        name: Tunnels (Endpoints)
        where: Settings › Workspace overview › Tunnels › (tunnel) › Endpoints › Add endpoint, through a connector IT runs inside the private network
        setVia: [adminConsole]
        area: network
        default: No tunnel (Tunnels needs early access from Replit)
        recommended: Only the private services the Workspace's apps need, each behind its own login with a least-privilege account; the enrollment key kept in the secrets manager
        value: "Only the services the Workspace needs"
        why: The Workspace's projects, Agent and published apps reach these hosts and nothing else on the private network; each service's own login decides what they can read or change, and revoking a key leaves open sessions up.
        mitigations: [AML.M0028, cap-data-access-governance]
        requires: Early access (Enterprise)
        url: https://docs.replit.com/features/security/tunnels
        verified: "2026-11-25"
      - id: workspaceAgentPermissionLimits
        name: Workspace Agent Permission Limits
        where: Settings › Integrations › Your integrations › Workspace limit
        setVia: [adminConsole]
        area: tools
        default: Not stated
        recommended: All integrations set to Decide for me; Always ask for connectors to systems of record
        value: "Decide for me"
        why: Agent asks before actions it detects as dangerous on a connector, for running Agents too; it does not prompt in apps or unattended runs.
        mitigations: [AML.M0028]
        requires: Early access
        url: https://docs.replit.com/teams/connector-governance#agent-permission-choices-and-workspace-limits
        verified: "2026-11-25"
      - id: adminApiProjects
        name: Admin API Projects (read projects by visibility or deployment status)
        where: Settings › Developer › API keys › Create API key (read-only)
        setVia: [apiCli]
        area: audit
        default: No key
        recommended: A read-only key that exports published projects to your inventory each week
        value: "Weekly export to your inventory"
        why: Every project across Team Workspaces, with its visibility and deployment status, reaches your inventory.
        mitigations: [D3-AI]
        requires: Enterprise account admin; the Admin API is in beta
        url: https://docs.replit.com/teams/admin-api#what-you-can-do
        verified: "2026-11-25"
      - id: unpublishDeployment
        name: Unpublish (shut down the deployment)
        where: Publishing tool › shut down deployment; Workspace Security Center › bulk unpublish
        setVia: [adminConsole]
        area: sharing
        recommended: Workspace admins hold the stop for every app and use the Security Center's bulk unpublish in an incident
        value: "Admins unpublish, in bulk if needed"
        why: The live deployment stops and Production external access tokens are revoked; code and data stay for investigation.
        mitigations: [cap-agent-kill-switch]
        url: https://docs.replit.com/help/deployment-and-publishing
        verified: "2026-11-25"
      - id: disconnectSharedAccount
        name: Disconnect shared account / Remove configuration
        where: Settings › Integrations › Workspace integrations (admin)
        setVia: [adminConsole]
        area: tools
        recommended: Used in an incident, followed by revoking the grant at the provider
        value: "Disconnect, then revoke at the provider"
        why: Every app using the connection loses access at once; Replit does not revoke the authorization at the provider.
        mitigations: [cap-agent-kill-switch]
        requires: Early access
        url: https://docs.replit.com/teams/connector-governance#logout-shared-disconnect-and-removal
        verified: "2026-11-25"
      - id: auditLogs
        name: Audit logs (Enable audit logs, Set up SIEM integration)
        where: Settings › Advanced › Identity & Governance › Audit logs
        setVia: [adminConsole]
        area: audit
        default: Off until an account admin enables it; kept 30 days
        recommended: Enabled and streamed to your SIEM
        value: "Enabled, streamed to your SIEM"
        why: Deployment creation, visibility changes, connector grants, secrets and access changes reach your own store in real time.
        mitigations: [AML.M0024]
        requires: Enterprise
        url: https://docs.replit.com/teams/identity-and-access-management/audit-logs
        verified: "2026-11-25"
      - id: complianceApi
        name: Compliance API (compliance:messages:read)
        where: Settings › Developer › Create API key › Messages › Read
        setVia: [apiCli]
        area: audit
        default: No key
        recommended: One key for your SIEM or DLP pipeline, with a short expiration
        value: "One key for your SIEM or DLP"
        why: The prompt text behind project.message_sent events is available to an investigation, for example to trace a pasted key or an injected upload.
        mitigations: [AML.M0024]
        requires: Enterprise account admin
        url: https://docs.replit.com/teams/identity-and-access-management/compliance-api
        verified: "2026-11-25"
      - id: deploymentGeography
        name: Deployment geography
        where: Settings › Advanced › Deployment settings
        setVia: [adminConsole]
        area: data
        default: All geographies
        recommended: Your approved region
        why: Members publish only to the geography your contracts allow; it governs hosting, not every service an app calls.
        mitigations: []
        requires: Enterprise
        url: https://docs.replit.com/teams/privacy-and-deployment-settings#choose-deployment-geography
        verified: "2026-11-25"
      - id: modelProviders
        name: Model providers (Account policy)
        where: Settings › Advanced › Agent modes and model providers
        setVia: [adminConsole]
        area: data
        default: Not stated
        recommended: Enable selected, limited to the providers and models your firm has approved
        value: "Enable selected"
        why: Agent and Auto mode route only to approved providers and models.
        mitigations: []
        requires: Enterprise account admin
        url: https://docs.replit.com/features/collaboration/enterprise-model-controls
        verified: "2026-11-25"
      - id: modelImprovement
        name: Model Improvement
        where: Settings › Personalization
        setVia: [adminConsole]
        area: data
        default: Content used for model improvement
        recommended: Opted out on every Pro account
        value: "Opted out"
        why: New prompts and responses from Pro accounts are not used to develop Replit's models; Enterprise content never is.
        mitigations: []
        requires: Pro (per user)
        url: https://docs.replit.com/legal-and-security-info/model-improvement
        verified: "2026-11-25"
      - id: banSourceCodeExport
        name: Ban source code export
        where: Settings › Advanced › Privacy settings
        setVia: [adminConsole]
        area: data
        default: Not stated
        recommended: "On"
        why: Builders cannot download project source as a ZIP; Replit notes code can still leave by other routes.
        mitigations: []
        requires: Enterprise
        url: https://docs.replit.com/teams/privacy-and-deployment-settings#restrict-exports-and-uploads
        verified: "2026-11-25"
    controls:
      - mitigation: D3-APA
        coverage: native
        mechanism: >-
          Private deployments (Off, Require, Require for non-admins; shown as Public deployments with Enabled,
          Enabled for admins only and Disabled among the account policies), public publishing exceptions,
          Password-protected deployments and SCIM, enforced at publish by Replit's sign-in screen and access checks
          in front of the deployment
        steps:
          - title: Keep public publishing with admins
            body:
              - >-
                Set Private deployments to Require for non-admins under Settings › Advanced › Privacy settings
                (Public deployments set to Enabled for admins only, in the account-policy view), as an account
                policy rather than Workspace managed.
            url: https://docs.replit.com/teams/privacy-and-deployment-settings#private-deployments
          - title: Turn off shared passwords
            body:
              - Set Password-protected deployments to Disabled.
            url: https://docs.replit.com/teams/privacy-and-deployment-settings#password-protected-deployments
          - title: Review public exceptions
            body:
              - Open Public publishing exceptions › Manage and revoke the projects that no longer need to be public.
            url: https://docs.replit.com/teams/privacy-and-deployment-settings#public-publishing-exceptions
        note: >-
          Native on the rule applied to the three builders onboarded on 2026-11-25: an admin sets the default
          audience of new apps and stops non-admins publishing beyond the Workspace, and the platform enforces both
          at publish. Boundaries: Enterprise only; the policies apply to newly published apps, so existing public
          apps are reviewed separately; an external access token reaches a private deployment without sign-in;
          personal Workspaces, outside the policy, publish Public by default.
        verified: "2026-11-25"
      - mitigation: D3-AVE
        coverage: partial
        mechanism: >-
          A vulnerability scan before every publish (dependency and package checks), a lightweight check of the
          files the Agent changes for insecure patterns and hardcoded secrets while it builds (no separate report),
          Require security scan and Block publishing at severity as account policies,
          Auto-Protect patches and the Workspace Security Center for dependency CVEs
        steps:
          - title: Require the scan at publish
            body:
              - Set Require security scan to Require under Settings › Advanced › Security.
            url: https://docs.replit.com/teams/security#require-security-scans-before-publishing
          - title: Block on critical findings
            body:
              - Keep Block publishing at severity at Critical or stricter.
            url: https://docs.replit.com/teams/security#block-publishing-by-severity
          - title: Patch new CVEs in published apps
            body:
              - Choose a minimum severity for Auto-Protect for security vulnerabilities.
            url: https://docs.replit.com/teams/security#enable-auto-protect
        note: >-
          Partial on the rule applied to every builder on this drawing: native would need a block on scan findings
          that only someone other than the maker can clear. With the block on, publishing waits until a critical
          issue is "resolved or dismissed", and the builder can dismiss it; the publish check does not run the Level
          2 code review or the Level 3 test of the running app, and Replit states that a passing check is no
          guarantee.
        verified: "2026-11-25"
      - mitigation: cap-data-access-governance
        coverage: none
        mechanism: >-
          No setting: the database is reachable only from the app's server, and which rows a visitor reads, and
          whose grant a connector uses, are the app's own code and the builder's connection
        evidence:
          - title: Development and production databases (connection security)
            url: https://docs.replit.com/features/data-and-storage/development-and-production
          - title: Agent Integrations (connections tied to your Replit account)
            url: https://docs.replit.com/features/integrations/overview
          - title: Replit shared responsibility model (usage policy and access control are yours)
            url: https://docs.replit.com/features/security/shared-responsibility-model
        note: >-
          None on the rule for this drawing, which needs rules limiting rows to the visitor and connectors that read
          as the visitor. Replit's design removes the browser-to-database path the drawing pins (no public key in
          the page), but no setting checks the access logic the Agent writes, and the pages describe no connector
          that acts as a published app's visitor. Instead: review each app's authorization with a Level 2 Agent
          security scan before it holds real data, and connect shared connectors with read-only service accounts.
        verified: "2026-11-25"
      - mitigation: D3-CH
        coverage: partial
        mechanism: >-
          The Secrets tool (AES-256, environment variables, synced to the deployment at publish), the build-time
          check of files the Agent changes for hardcoded secrets, external access tokens with expirations, custom
          OAuth clients, production credential regeneration and the Source control policies
        steps:
          - title: Keep code in your organizations
            body:
              - >-
                Set Private remotes to Require, Allowed Git provider to your provider and list your organizations
                under Whitelisted organizations.
            url: https://docs.replit.com/teams/enterprise-privacy-settings#source-control-settings
          - title: Issue connector grants to your own client
            body:
              - >-
                Use a Custom provider configuration with your OAuth client and the minimum Connector scopes.
            url: https://docs.replit.com/teams/connector-governance#provider-configuration-and-scopes
          - title: Limit external access tokens
            body:
              - Create Production tokens per service with the shortest expiration and revoke them when unused.
            url: https://docs.replit.com/features/deployment-customization/external-access-tokens
        note: >-
          Partial on the rule for this drawing: the platform keeps outside keys in a server-side store, but only
          the lightweight check of the files the Agent changes looks for hardcoded secrets, while it builds and
          with no report of its own; the pages read do not say the publish check looks for them, so no admin
          setting refuses a publish while the front end holds a key. Each connector's grant sits in Replit's store;
          disconnecting does not revoke it at the provider. The Workspace GitHub App with selected repositories is
          part of an early-access workflow.
        verified: "2026-11-25"
      - mitigation: cap-staged-rollout-gate
        coverage: native
        mechanism: >-
          Separate development and production databases by design (the Agent cannot modify production and reads it
          through a read-only replica), migrations reviewed at publish with a publish preview on a migrated copy,
          Require private development URLs, production point-in-time recovery and scheduled backups
        steps:
          - title: Keep previews private
            body:
              - Turn on Require private development URLs under Settings › Advanced › Privacy settings.
            url: https://docs.replit.com/teams/privacy-and-deployment-settings#protect-development-previews
          - title: Lengthen production recovery
            body:
              - Set Point-in-time recovery to 28 days and turn on Scheduled backups on each production database.
            url: https://docs.replit.com/features/data-and-storage/data-recovery
          - title: Test schema changes on a copy
            body:
              - Use Create preview deploy in the Publish pane before applying database changes.
            url: https://docs.replit.com/features/data-and-storage/publish-database-changes
        note: >-
          Native on the rule for this drawing: the agent cannot change the live app's data and live data can be
          restored apart from code. The split is Replit's design rather than a setting. Boundaries: checkpoint
          rollback never restores production, so code and data are returned to the same moment in two steps; a
          builder can edit production data manually with Enable Editing; legacy Neon apps shared one database until
          June 2026.
        verified: "2026-11-25"
      - mitigation: D3-MFA
        coverage: native
        mechanism: >-
          SAML single sign-on with claimed email domains (every account on them must sign in through the identity
          provider), private deployments and development URLs that sign visitors in through Replit, and Idle
          session timeout
        steps:
          - title: Activate SAML and claim every domain
            body:
              - >-
                Under Settings › Advanced › Authentication set up SAML single sign-on and list every corporate email
                domain and alias; require MFA at the identity provider.
            url: https://docs.replit.com/teams/identity-and-access-management/saml
          - title: Shorten idle sessions
            body:
              - Set Idle session timeout under Settings › Advanced › Authentication.
            url: https://docs.replit.com/teams/enterprise-privacy-settings#authentication
        note: >-
          Native on this drawing's rule: the admin can make the identity provider the only sign-in for makers and for
          visitors of workspace apps, the second factor being the identity provider's as the pin states. Visitors of
          a private app sign in through Replit, so claimed domains put them through SSO too. Boundaries: Guests must
          use an email outside the SSO domains and sign in another way; password-protected deployments bypass sign-in
          unless disabled; Replit documents no second-factor requirement of its own.
        verified: "2026-11-25"
      - mitigation: AML.M0029
        coverage: native
        mechanism: >-
          Require publish approval per Workspace (members request, an admin publishes or approves), Request to
          publish an app as public, approvals in Settings › Advanced › Requests or through the Admin API
        steps:
          - title: Require approval to publish
            body:
              - >-
                In Settings › Advanced › Requests open the Workspace's Requests dropdown and turn on Require publish
                approval.
            url: https://docs.replit.com/teams/advanced-settings#configure-requests-for-a-workspace
          - title: Review pending requests
            body:
              - Review the requester, reason and project under Pending requests, then Approve or Deny.
            url: https://docs.replit.com/teams/advanced-settings#manage-pending-requests
        note: >-
          Native on the rule for this drawing: an admin's approval is required before a member's publish, and
          nothing publishes until an admin approves. Boundaries: the request shows the requester, reason and
          project, not the app's connectors or scan findings; it is set per Workspace by an account admin; admins
          publish without a request.
        verified: "2026-11-25"
      - mitigation: AML.M0028
        coverage: partial
        mechanism: >-
          Connector governance (early access): configuration audience, account type (Personal, Shared, Service
          account), Connector scopes, Workspace Agent Permission Limits; Enterprise group grants and custom OAuth
          scopes; Disable features › Integrations for the whole account
        steps:
          - title: Limit each connector to approved teams
            body:
              - Set Who has access on each Workspace configuration to Selected people and groups.
            url: https://docs.replit.com/teams/connector-governance#audience-and-roles
          - title: Narrow scopes
            body:
              - Choose only the Connector scopes each configuration needs, on your own OAuth client.
            url: https://docs.replit.com/teams/connector-governance#provider-configuration-and-scopes
          - title: Set Agent permission limits
            body:
              - Set Workspace Agent Permission Limits for All integrations and stricter limits for systems of record.
            url: https://docs.replit.com/teams/connector-governance#agent-permission-choices-and-workspace-limits
        note: >-
          Partial on the rule for this drawing: native where an admin allows or blocks each connector for the
          workspace and the platform enforces it for apps. The controls are early access and depend on the
          Workspace; Replit warns that some permission selectors only save a preference, the limits do not prompt in
          apps or unattended runs, and members can still connect personal accounts unless Integrations is disabled
          for everyone.
        verified: "2026-11-25"
      - mitigation: D3-AI
        coverage: partial
        mechanism: >-
          Admin API (beta) Projects read across Team Workspaces by visibility or deployment status; Workspace
          Security Center lists projects with dependency findings by owner, publishing status and visibility; the
          connector Connections view lists published projects per configuration
        steps:
          - title: Export projects through the Admin API
            body:
              - >-
                Create a read-only Admin API key under Settings › Developer and export projects filtered by
                deployment status to your inventory.
            url: https://docs.replit.com/teams/admin-api
          - title: Review exposure in the Security Center
            body:
              - >-
                Filter the Workspace Security Center by publishing status and visibility and use Notify owners.
            url: https://docs.replit.com/features/security/workspace-security-center
        note: >-
          Partial on the rule for this drawing: native where the admin console lists every app with its owner,
          audience and connectors and exports it. The complete list is the beta Admin API (Enterprise account
          admins); the Security Center's views are built around dependency vulnerabilities, and connectors per app
          are a separate view.
        verified: "2026-11-25"
      - mitigation: cap-shadow-ai-discovery
        coverage: external
        mechanism: >-
          Nothing in the product lists Replit accounts or personal Workspaces on the organisation's domain; claimed
          SSO domains force SSO sign-in for those accounts but do not bring them into the organization
        evidence:
          - title: Single sign-on (SAML SSO), FAQ on existing accounts
            url: https://docs.replit.com/teams/identity-and-access-management/saml
          - title: Who can access your app (personal Workspace default Public)
            url: https://docs.replit.com/features/publishing/private-deployments
        note: >-
          External by the rule applied to every vendor: the product lists no accounts or apps made outside the
          workspace. Claiming email domains is prevention of password and social sign-in only, credited here; the
          personal Workspace and its Public-by-default apps remain. Discovery is the SSE or CASB's (replit.com,
          replit.app and replit.dev in proxy logs) and certificate-transparency searches on replit.app.
        verified: "2026-11-25"
      - mitigation: cap-agent-kill-switch
        coverage: native
        mechanism: >-
          Shut down the deployment from the Publishing tool, or bulk unpublish from the Workspace Security Center;
          unpublishing revokes Production external access tokens; Disconnect shared account cuts every app using a
          connection
        steps:
          - title: Take apps offline
            body:
              - Select the affected projects in the Workspace Security Center and unpublish them in bulk.
            url: https://docs.replit.com/features/security/workspace-security-center
          - title: Cut shared connections
            body:
              - Disconnect the shared account in Workspace integrations, then revoke the grant at the provider.
            url: https://docs.replit.com/teams/connector-governance#logout-shared-disconnect-and-removal
        note: >-
          Native on the rule for this drawing: one admin action outside the agent takes the app offline, and the
          database answers only the app's own server, so the data path stops with it. Boundaries: Replit does not
          revoke a connector's authorization at the provider; a leaked production connection string stays valid until
          the credentials are regenerated; an app in a personal Workspace needs Replit's abuse route.
        verified: "2026-11-25"
      - mitigation: AML.M0024
        coverage: native
        mechanism: >-
          Audit Logs V2 (deployment.created, deployment.visibility_changed, deployment.domain_added, connector and
          secret events, project.message_sent) in the WorkOS portal for 30 days, streamed to Datadog, Splunk,
          Amazon S3 or an HTTP endpoint; the Compliance API for prompt text
        steps:
          - title: Enable and stream audit logs
            body:
              - >-
                Under Settings › Advanced › Identity & Governance select Enable audit logs, then Set up SIEM
                integration.
            url: https://docs.replit.com/teams/identity-and-access-management/audit-logs
          - title: Add prompt text for investigations
            body:
              - Create a key with compliance:messages:read and enrich project.message_sent events.
            url: https://docs.replit.com/teams/identity-and-access-management/compliance-api
        note: >-
          Native on the rule for this drawing: an admin sends the publish, audience and connector events to the
          organisation's own store. Boundaries: Enterprise only; the Compliance API offers no completion watermark,
          so overlapping polls are needed.
        verified: "2026-11-25"
      - mitigation: cap-ai-vendor-assessment
        coverage: external
        mechanism: >-
          SOC 2 Type 2 attestation, the Trust Center, the shared responsibility model and the information security
          overview feed the organisation's third-party risk platform
        evidence:
          - title: Information Security
            url: https://docs.replit.com/teams/information-security/overview
          - title: Replit shared responsibility model
            url: https://docs.replit.com/features/security/shared-responsibility-model
          - title: Package Firewall
            url: https://docs.replit.com/features/security/package-firewall
        note: >-
          External, as for every vendor: the assessment, its evidence and the reassessment trigger live in the
          organisation's third-party risk platform. Points to cover: isolation between Workspaces and between
          deployments on shared infrastructure, the sign-in screen in front of every private deployment, the Package
          Firewall (Socket) on every install, and which subprocessors hold development and production data. The
          Trust Center renders client-side and was not read.
        verified: "2026-11-25"
