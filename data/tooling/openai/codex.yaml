                webhooks in Environments > GitLab activity > Manage groups.
            url: https://learn.chatgpt.com/docs/third-party/gitlab
          - title: Review scheduled tasks
            body:
              - Open Scheduled to see active, paused and completed tasks and their recent runs.
            url: https://learn.chatgpt.com/docs/automations
        note: >-
          Partial: environments, connectors and scheduled tasks are listed where they are configured, but no page
          documents an org-wide admin inventory of every user's environments and scheduled tasks with an owner, no
          approval state is recorded, and nothing refuses an environment or task that was never registered.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAgentRegistry
          reviewRequired: false
          original:
            - capability: capabilityAgentRegistry
              coverage: partial
              mechanism: Environments page and connector settings at chatgpt.com/codex/settings
              note: >-
                Environments, repositories and connectors are listed centrally; there is no approval workflow
                or ownership record beyond who can edit.
