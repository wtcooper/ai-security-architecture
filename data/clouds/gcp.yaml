            what: "An agent in any language, deployed as a container image from Artifact Registry or built from your Dockerfile, that listens on port 8080 and follows the runtime contract."
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/runtime-contract
