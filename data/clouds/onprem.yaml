  - architecture: archAgentSandbox
    asOf: "2026-11"
    verified: "2026-11-18"
    reference:
      - title: "Sandbox controller, for example agent-sandbox: Documentation"
        url: https://agent-sandbox.sigs.k8s.io/docs/
      - title: "Sandbox runtime, for example gVisor: Security Model"
        url: https://gvisor.dev/docs/architecture_guide/security/
      - title: "Inference server, for example vLLM: Security"
        url: https://docs.vllm.ai/en/latest/usage/security/
    summary:
      - "Each rollout is a fresh sandbox, a lightweight virtual machine or a user-space-kernel runtime, created and deleted by your orchestrator on dedicated nodes. Network rules let a rollout reach only the offline web, the package mirror and the platform services it needs; the model under test is served on separate GPU nodes, and checkpoints and graders sit where no rollout identity can read them. Weights, trajectories and prompts stay in the data centre, and you carry what a cloud provider would run: hardware, virtualisation, registries, logs and patching; each box lists example products."
    bindings:
      - block: graders
        service: "Grader and reward model serving"
        note: "The orchestrator hands each grader the episode; graders read the end state through it and no sandbox has a route or a credential to them."
        options:
          - { name: "vLLM", kind: open, url: "https://docs.vllm.ai/en/latest/serving/online_serving/", note: "Serves grader and reward models on their own GPU pool", packs: [upstreamOpenSource, redHatOpenShiftAi] }
          - { name: "SGLang", kind: open, url: "https://docs.sglang.io/", note: "Alternative open engine for grader models" }
          - { name: "NVIDIA NIM", kind: commercial, url: "https://docs.nvidia.com/nim/large-language-models/latest/reference/architecture.html", note: "Packaged model endpoints, including NemoGuard safety models" }
          - { name: "NeMo Gym verifiers", kind: open, url: "https://docs.nvidia.com/nemo/gym/latest/index.html", note: "Environments with verifiers that score rollouts for evaluation and RL" }
          - { name: "Inspect scorers", kind: open, url: "https://inspect.aisi.org.uk/", note: "Scorer components that grade episodes outside the sandbox" }
          - { name: "VMware Model Runtime endpoint", kind: commercial, url: "https://techdocs.broadcom.com/us/en/vmware-cis/vcf/vcf-9-0-and-later/9-1/design/design-library/private-ai-platform-detailed-design/private-ai-services.html", note: "An OpenAI-compatible endpoint a grader can call", packs: [vmwarePrivateAi] }
          - { name: "NIM or NeMo Gym verifiers", kind: open, url: "https://docs.nvidia.com/nemo/gym/latest/index.html", packs: [nvidiaAiEnterprise] }
          - { name: "MLIS model endpoints", kind: commercial, url: "https://support.hpe.com/hpesc/public/docDisplay?docId=a00aie112hen_us&page=pcai/GenAI/model-endpoints.html", packs: [hpePrivateCloudAi] }
      - block: platform
        service: "Telemetry, secrets and shared storage services"
        note: "The only services a sandbox node may reach; each one checks the task's short-lived token."
        options:
          - { name: "OpenTelemetry Collector", kind: open, url: "https://opentelemetry.io/docs/collector/", note: "Vendor-agnostic collector for traces, metrics and logs" }
          - { name: "OpenBao", kind: open, url: "https://openbao.org/docs/configuration/seal/pkcs11/", note: "Open-source secrets manager with a PKCS#11 HSM seal" }
          - { name: "HashiCorp Vault", kind: commercial, url: "https://developer.hashicorp.com/vault/docs/configuration/seal/pkcs11", note: "Secrets and short-lived credentials; HSM auto-unseal needs Vault Enterprise" }
          - { name: "Ceph Object Gateway", kind: open, url: "https://docs.ceph.com/en/latest/radosgw/", note: "Shared storage with per-task STS credentials" }
          - { name: "OpenShift observability and Data Foundation", kind: commercial, url: "https://docs.nvidia.com/enterprise-reference-architectures/ai-factory-inference-hub-reference-design/latest/red-hat-ai-factory-with-nvidia-reference-implementation.html", note: "Platform monitoring exported over OpenTelemetry and Prometheus on OpenShift", packs: [redHatOpenShiftAi] }
          - { name: "OpenTelemetry Collector, Vault or OpenBao, Ceph Object Gateway", kind: open, url: "https://opentelemetry.io/docs/collector/", packs: [upstreamOpenSource] }
      - block: orchestrator
        service: "Your RL or evaluation orchestrator"
        build: true
        note: "Creates one sandbox per rollout (with agent-sandbox, a SandboxClaim), collects trajectories and holds the stop: it suspends the training job and deletes the sandboxes."
        options:
          - { name: "Kubeflow Trainer", kind: open, url: "https://www.kubeflow.org/docs/components/trainer/overview/", note: "Runs the trainer; suspending the TrainJob is part of the stop", packs: [upstreamOpenSource, canonicalCharmedKubeflow] }
          - { name: "Ray on Kubernetes (KubeRay)", kind: open, url: "https://docs.ray.io/en/latest/cluster/kubernetes/index.html", note: "Actor-based RL loops; used by verl and OpenShift AI GRPO", packs: [hpePrivateCloudAi] }
          - { name: "verl", kind: open, url: "https://verl.readthedocs.io/en/latest/", note: "RL post-training framework integrating FSDP, Megatron-LM, vLLM and SGLang" }
          - { name: "NeMo RL with NeMo Gym", kind: open, url: "https://docs.nvidia.com/nemo/rl/latest/index.html", note: "NVIDIA's RL library and environments; Helix runs GRPO with sandboxed Gym", packs: [nvidiaAiEnterprise] }
          - { name: "Inspect", kind: open, url: "https://inspect.aisi.org.uk/sandboxing.html", note: "Evaluation orchestrator with sandboxes on Docker, Kubernetes and other back ends" }
          - { name: "Red Hat Training Hub", kind: commercial, url: "https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/3.5/pdf/release_notes/Red_Hat_OpenShift_AI_Self-Managed-3.5-Release_notes-en-US.pdf", note: "GRPO and fine-tuning algorithms on Kubeflow Trainer or Ray" }
          - { name: "Your loop with Training Hub GRPO on Kubeflow Trainer or Ray", kind: commercial, url: "https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/3.5/pdf/release_notes/Red_Hat_OpenShift_AI_Self-Managed-3.5-Release_notes-en-US.pdf", packs: [redHatOpenShiftAi] }
      - block: sandbox
        service: "Isolated sandbox per rollout"
        options:
          - { name: "agent-sandbox (Kubernetes SIG)", kind: open, url: "https://agent-sandbox.sigs.k8s.io/docs/", note: "Sandbox, template, claim and warm-pool CRDs; runtime-agnostic" }
          - { name: "Kata Containers", kind: open, url: "https://katacontainers.io/", note: "Each pod in a lightweight VM with its own kernel; needs hardware virtualisation", watch: [{ text: "Runs each pod in its own lightweight virtual machine, so sandbox nodes need hardware virtualisation (nested virtualisation where the nodes are themselves virtual machines); the runtime is yours to install and patch.", url: "https://agent-sandbox.sigs.k8s.io/docs/use-cases/examples/kata-containers/" }] }
          - { name: "gVisor", kind: open, url: "https://gvisor.dev/docs/", note: "Memory-safe application kernel per pod through the runsc OCI runtime" }
          - { name: "Red Hat build of Agent Sandbox", kind: commercial, url: "https://docs.redhat.com/en/documentation/openshift_sandboxed_containers/1.13/html/deploying_red_hat_build_of_agent_sandbox/discover-agent-sandbox_agent-sandbox", note: "agent-sandbox with OpenShift sandboxed containers (Kata); Technology Preview", packs: [redHatOpenShiftAi], watch: [{ text: "Technology Preview in sandboxed containers 1.13; RHCOS workers only. OpenShell is a Developer Preview in OpenShift AI 3.5.", url: "https://docs.redhat.com/en/documentation/openshift_sandboxed_containers/1.13/html/deploying_red_hat_build_of_agent_sandbox/discover-agent-sandbox_agent-sandbox" }] }
          - { name: "NVIDIA OpenShell", kind: open, url: "https://docs.nvidia.com/openshell/about/overview", note: "Sandbox runtime: egress only to approved destinations, Landlock and seccomp; 0.1.x releases" }
          - { name: "OpenSandbox", kind: open, url: "https://github.com/opensandbox-group/OpenSandbox", note: "Agentic AI Foundation sandbox runtime with a Kubernetes lifecycle API; Helix pairs it with Kata" }
          - { name: "agent-sandbox with Kata Containers or gVisor", kind: open, url: "https://agent-sandbox.sigs.k8s.io/docs/", packs: [upstreamOpenSource], watch: [{ text: "Kata needs worker nodes with hardware virtualisation; gVisor is the fallback where that is not available.", url: "https://agent-sandbox.sigs.k8s.io/docs/getting_started/overview/" }] }
          - { name: "OpenSandbox on Kata (Helix GRPO) or NVIDIA OpenShell", kind: open, url: "https://docs.nvidia.com/nemo-helix/latest/documentation/kubernetes-deployment/setup/helm/sandboxed-grpo", note: "Kata gives each sandbox its own kernel but does not limit network; Helix adds per-step NetworkPolicy.", packs: [nvidiaAiEnterprise] }
      - { block: harness, service: "Your episode loop inside the sandbox", build: true, note: "Holds a per-run credential and no weights; it samples actions over the API only." }
      - { block: localTools, service: "Shell, files and browser inside the sandbox", build: true, note: "Real tools in the task image; their network is the template's short egress list and nothing else." }
      - block: storage
        service: "Policy checkpoint storage"
        note: "Written by the trainer and read by the inference service; never mounted into, or reachable from, a sandbox."
        options:
          - { name: "Ceph Object Gateway", kind: open, url: "https://docs.ceph.com/en/latest/radosgw/", note: "Checkpoint bucket written by the trainer only", packs: [upstreamOpenSource] }
          - { name: "Red Hat OpenShift Data Foundation", kind: commercial, url: "https://docs.redhat.com/en/documentation/red_hat_openshift_data_foundation/4.20", note: "S3 buckets on OpenShift", packs: [redHatOpenShiftAi] }
          - { name: "NeMo Helix job storage", kind: open, url: "https://docs.nvidia.com/nemo-helix/latest/documentation/kubernetes-deployment/setup/helm/sandboxed-grpo", note: "ReadWriteMany PVC shared by RL jobs", packs: [nvidiaAiEnterprise] }
          - { name: "Ezmeral Data Fabric Object Store", kind: commercial, url: "https://support.hpe.com/hpesc/public/docDisplay?docId=a00aie112hen_us&page=ManageClusters/connect-object-stores.html", packs: [hpePrivateCloudAi] }
      - block: inference
        service: "Inference service for the model under test"
        note: "Rollouts reach only the model's sampling API, each with a credential scoped to its run: either the network admits sandbox pods to the API paths alone, or an authenticating proxy or AI gateway in front (for example LiteLLM, or Envoy with external authorisation) issues per-run keys."
        options:
          - { name: "vLLM", kind: open, url: "https://docs.vllm.ai/en/latest/deployment/k8s.html", note: "Serves the policy under test; its --api-key is one static key that covers only some paths", packs: [upstreamOpenSource, nvidiaAiEnterprise], watch: [{ text: "Only the episode broker and vLLM ports should be reachable from the sandbox.", url: "https://docs.nvidia.com/nemo-helix/latest/documentation/kubernetes-deployment/setup/helm/sandboxed-grpo" }, { text: "--api-key is one static key covering /v1, /v2, /inference and /cohere only: pooling, scoring and the pause and resume controls stay open. KServe is the alternative.", url: "https://docs.vllm.ai/en/latest/usage/security/" }, { text: "Loads its cache directories without integrity checks, including formats that can run code, so the policy reload reads checkpoints only from storage the trainer alone writes, mounted read-only, never from storage a rollout or a shared user can write.", url: "https://docs.vllm.ai/en/latest/usage/security/" }] }
          - { name: "SGLang", kind: open, url: "https://docs.sglang.io/", note: "Alternative open engine, used by several RL frameworks" }
          - { name: "KServe with llm-d", kind: open, url: "https://kserve.github.io/website/docs/model-serving/generative-inference/llmisvc/llmisvc-overview", note: "Declared serving with KV-aware routing", packs: [redHatOpenShiftAi, canonicalCharmedKubeflow] }
          - { name: "NVIDIA NIM", kind: commercial, url: "https://docs.nvidia.com/nim/large-language-models/latest/reference/architecture.html", note: "Packaged endpoint for the model under test" }
          - { name: "NVIDIA Dynamo", kind: open, url: "https://docs.nvidia.com/dynamo/latest/index.html", note: "Distributed serving for large policies" }
          - { name: "VMware Model Runtime", kind: commercial, url: "https://techdocs.broadcom.com/us/en/vmware-cis/vcf/vcf-9-0-and-later/9-1/design/design-library/private-ai-platform-detailed-design/private-ai-services.html", note: "OpenAI-compatible endpoints on VKS", packs: [vmwarePrivateAi] }
          - { name: "MLIS or Kubeflow KServe model endpoints", kind: commercial, url: "https://support.hpe.com/hpesc/public/docDisplay?docId=a00aie112hen_us&page=pcai/GenAI/infer-model-endpoint.html", packs: [hpePrivateCloudAi] }
      - block: offlineWeb
        service: "Offline web: cached pages and search index"
        build: true
        note: "Search answers come only from your own index of the cached pages; the crawler that fills the cache runs outside the sandbox network."
        options:
          - { name: "SearXNG", kind: open, url: "https://docs.searxng.org/", note: "Self-hosted metasearch engine; point its engines at your own index of cached pages", packs: [upstreamOpenSource] }
          - { name: "OpenSearch", kind: open, url: "https://docs.opensearch.org/latest/about/", note: "Search index for cached pages; Canonical ships Charmed OpenSearch" }
          - { name: "pywb", kind: open, url: "https://pywb.readthedocs.io/en/latest/", note: "Web archive capture and replay (Wayback-style) for cached sites" }
          - { name: "Kiwix", kind: open, url: "https://kiwix.org/en/", note: "Offline copies of Wikipedia and other knowledge sources" }
      - block: registry
        service: "Internal package mirror, read-only to rollouts"
        options:
          - { name: "Pulp", kind: open, url: "https://pulpproject.org/pulpcore/docs/user/learn/on-demand-downloading/", note: "Immediate syncs keep the copy fixed; on_demand fetches upstream on request" }
          - { name: "Sonatype Nexus Repository", kind: commercial, url: "https://help.sonatype.com/en/nexus-repository-tiers-and-feature-availability.html", note: "CE limit of 100,000 requests a day is reached by large rollout fleets", watch: [{ text: "Community Edition supports up to 40,000 components and 100,000 requests a day; thousands of rollouts installing packages pass the request limit, so size the mirror to the rollout volume (Pulp, or a paid edition).", url: "https://help.sonatype.com/en/ce-onboarding.html" }] }
          - { name: "JFrog Artifactory", kind: commercial, url: "https://docs-redirect.jfrog.com/help/r/jfrog-artifactory-documentation/remote-repositories", note: "Remote repositories for PyPI and npm with caching" }
          - { name: "bandersnatch", kind: open, url: "https://bandersnatch.readthedocs.io/en/latest/", note: "PyPI mirror client built on the PEP 691 Simple API, synced ahead of runs" }
          - { name: "Verdaccio", kind: open, url: "https://verdaccio.org/docs/what-is-verdaccio", note: "Private npm registry and cache" }
          - { name: "Red Hat Python index", kind: commercial, url: "https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/3.5/html/customize_models_for_gen_ai_and_agentic_ai_applications/set-up-your-working-environment_custom-models", note: "Curated supported packages to mirror into your own host", packs: [redHatOpenShiftAi] }
          - { name: "Pulp or Nexus Repository", kind: open, url: "https://pulpproject.org/", note: "Pulp's on_demand policy fetches upstream when a package is first requested; an immediate sync keeps the copy fixed.", packs: [upstreamOpenSource], watch: [{ text: "Nexus Community Edition is capped at 40,000 components and 100,000 requests a day, which a large rollout fleet exceeds.", url: "https://pulpproject.org/" }] }
      - { block: openWeb, service: "The public internet, crawl source only", note: "Reached only by the crawler, through your egress control's allowlist." }
      - { block: sources, service: "Public package registries", note: "Reached only by the mirror's admission pipeline, through your egress control." }
      - block: govIdentity
        service: "Identity provider and workload identity"
        options:
          - { name: "Keycloak", kind: open, url: "https://www.keycloak.org/securing-apps/token-exchange", note: "People and service clients in one realm, with token exchange for hand-offs.", packs: [upstreamOpenSource] }
          - { name: "Red Hat build of Keycloak", kind: commercial, url: "https://access.redhat.com/products/red-hat-build-keycloak/", note: "Supported Keycloak build from Red Hat.", packs: [redHatOpenShiftAi] }
          - { name: "Kubernetes ServiceAccount tokens", kind: open, url: "https://kubernetes.io/docs/concepts/security/service-accounts/", note: "Short-lived projected tokens give each workload an identity the IdP and vault can verify.", packs: [upstreamOpenSource] }
          - { name: "SPIFFE and SPIRE", kind: open, url: "https://spiffe.io/docs/latest/spire-about/", note: "Attested workload identities and trust-domain federation, an alternative to keys per client." }
          - { name: "Red Hat zero trust workload identity manager", kind: commercial, url: "https://www.redhat.com/en/blog/zero-trust-workload-identity-manager-11-generally-available-red-hat-openshift", note: "Red Hat's SPIRE operator, GA 1.1 (July 2026), with Vault and cert-manager as upstream authorities.", packs: [redHatOpenShiftAi] }
          - { name: "Gravitee Access Management", kind: commercial, url: "https://documentation.gravitee.io/am/4.11/guides/developer-contributions/using-oauth-2.0-token-exchange", note: "Gravitee's IdP and authorisation server, with delegated token exchange." }
      - block: govSecrets
        service: "Secrets manager with a hardware root"
        options:
          - { name: "HashiCorp Vault", kind: commercial, url: "https://developer.hashicorp.com/vault/docs/deploy/kubernetes/vso", note: "Dynamic credentials, transit keys and the Vault Secrets Operator; HSM auto-unseal needs Vault Enterprise.", packs: [upstreamOpenSource] }
          - { name: "OpenBao", kind: open, url: "https://openbao.org/docs/configuration/seal/pkcs11/", note: "Open-source fork of Vault under the Linux Foundation's OpenSSF; documents a PKCS#11 HSM seal.", packs: [upstreamOpenSource] }
          - { name: "External Secrets Operator", kind: open, url: "https://external-secrets.io/latest/", note: "Syncs secrets from an external store into Kubernetes Secrets; pairs with any vault here." }
          - { name: "External Secrets Operator for Red Hat OpenShift", kind: commercial, url: "https://developers.redhat.com/articles/2025/11/11/introducing-external-secrets-operator-openshift", note: "Red Hat-supported ESO, GA for OpenShift 4.20+, syncing from Vault or CyberArk Conjur.", packs: [redHatOpenShiftAi] }
          - { name: "Idira Secrets Manager, self-hosted (Palo Alto Networks)", kind: commercial, url: "https://www.paloaltonetworks.com/idira/machine/secrets-management", note: "The former CyberArk line now under Palo Alto's Idira brand; SaaS or self-hosted for air-gapped sites." }
      - block: govPolicy
        service: "Network, admission and guardrail policy"
        options:
          - { name: "Kubernetes", kind: open, url: "https://kubernetes.io/docs/concepts/overview/", note: "The container platform each platform pack here runs on, upstream or as a distribution (OpenShift, VKS, Canonical Kubernetes).", packs: [upstreamOpenSource, redHatOpenShiftAi, nvidiaAiEnterprise, vmwarePrivateAi, canonicalCharmedKubeflow, hpePrivateCloudAi] }
          - { name: "Cilium", kind: open, url: "https://docs.cilium.io/en/stable/security/policy/", packs: [upstreamOpenSource] }
          - { name: "Squid outbound proxy", kind: open, url: "https://www.squid-cache.org/Doc/config/access_log/", note: "The single exit for search and page fetches, with an access log for review.", packs: [upstreamOpenSource] }
          - { name: "LiteLLM Proxy", kind: open, url: "https://docs.litellm.ai/docs/simple_proxy", note: "Models, MCP servers and A2A agents behind one proxy with per-key and per-team grants; some features need its Enterprise licence.", packs: [upstreamOpenSource] }
      - block: govSupplyChain
        service: "Mirrors, scanners and signing in the pipeline"
        options:
          - { name: "pip", kind: open, url: "https://pip.pypa.io/en/stable/topics/secure-installs/", packs: [upstreamOpenSource] }
          - { name: "Trivy", kind: open, url: "https://trivy.dev/docs/latest/guide/scanner/vulnerability/", packs: [upstreamOpenSource] }
          - { name: "Harbor", kind: open, url: "https://goharbor.io/docs/2.16.0/administration/configure-proxy-cache/", note: "Image registry with a proxy cache and Trivy scanning; images, not PyPI or npm.", packs: [upstreamOpenSource] }
      - block: govObservability
        service: "Logs, traces and SIEM off the workload's path"
        options:
          - { name: "OpenTelemetry Collector", kind: open, url: "https://opentelemetry.io/docs/collector/", note: "Vendor-neutral pipeline that receives gateway logs and traces and forwards them to stores the agent cannot write.", packs: [upstreamOpenSource] }
          - { name: "Grafana Loki", kind: open, url: "https://grafana.com/docs/loki/latest/", note: "Log store; turn retention on, or logs are kept for ever.", packs: [upstreamOpenSource] }
          - { name: "Langfuse (self-hosted)", kind: open, url: "https://langfuse.com/self-hosting", note: "Self-hosted LLM tracing and evaluation, with a documented LiteLLM integration.", packs: [upstreamOpenSource] }
          - { name: "MLflow Tracing", kind: open, url: "https://mlflow.org/docs/latest/genai/tracing/", note: "Agent and LLM tracing; GA in OpenShift AI 3.5, where the visual agent-trace view is Technology Preview.", packs: [redHatOpenShiftAi] }
          - { name: "Elastic Security", kind: commercial, url: "https://www.elastic.co/docs/solutions/security", note: "SIEM and detection engine; one example of where detections on gateway, egress and audit logs run." }
          - { name: "Tetragon", kind: open, url: "https://tetragon.io/docs/concepts/tracing-policy/", packs: [upstreamOpenSource] }
    sources:
      harness: https://agent-sandbox.sigs.k8s.io/docs/getting_started/overview/
      localTools: https://agent-sandbox.sigs.k8s.io/docs/use-cases/examples/network-policies/
      openWeb: https://www.squid-cache.org/Doc/config/acl/
      sources: https://pulpproject.org/pulp_python/docs/user/guides/sync/
    alsoNeeded:
      - service: "Sandbox nodes that suit the runtime"
        role: other
        why: "With a virtual-machine runtime such as Kata Containers each pod runs in a lightweight virtual machine, which needs virtualisation extensions on the hosts or nested virtualisation you operate; a user-space-kernel runtime such as gVisor does not."
        url: https://katacontainers.io/
      - service: "GPU servers with their drivers, container toolkit and device plugin"
        role: other
        why: "Drivers, the container toolkit and device plugins for the inference and grader nodes are yours to install and upgrade (for example with the NVIDIA GPU Operator)."
        url: https://docs.nvidia.com/datacenter/cloud-native/gpu-operator/latest/index.html
      - service: "The container platform's control plane, highly available"
        role: other
        why: "Thousands of short-lived pods load the API server and its datastore (etcd on Kubernetes); sizing, backup and upgrades are your own work."
        url: https://kubernetes.io/docs/tasks/administer-cluster/configure-upgrade-etcd/
      - service: "Identity provider for researchers' sign-in"
        role: identity
        why: "Researchers reach the orchestrator through single sign-on with group-based access (for example Keycloak), which no provider console supplies."
        url: https://www.keycloak.org/guides
      - service: "Egress control for the crawler and the mirror"
        role: network
        why: "The only route to the open web and the public registries, used by the two pipelines that fill the offline web and the mirror, never by a rollout (for example a Squid forward proxy with an allowlist per pipeline)."
        url: https://www.squid-cache.org/
      - service: "Private container registry with scanning and a proxy cache"
        role: registry
        why: "Task images, the runtime and the platform images are stored and scanned inside the data centre; public images enter only through it (for example Harbor with Trivy)."
        url: https://goharbor.io/docs/2.16.0/administration/configure-proxy-cache/
      - service: "Secrets manager for task and service credentials"
        role: secrets
        why: "Issues the short-lived credentials that stand in for a cloud token service (for example OpenBao or HashiCorp Vault). Sealing Vault with a hardware security module needs Vault Enterprise; OpenBao offers a pkcs11 seal plugin."
        url: https://openbao.org/docs/configuration/seal/pkcs11/
      - service: "Certificate issuance from an internal authority"
        role: keys
        why: "Every hop between the sandbox nodes and the platform services needs a certificate from an authority you run (for example cert-manager with your internal CA)."
        url: https://cert-manager.io/docs/
      - service: "Host and run monitoring, a log store and the SIEM"
        role: logging
        why: "Host and run records must land in a store outside the sandbox nodes, with alert rules that drive the automatic stop (for example Prometheus, Loki and Tetragon)."
        url: https://tetragon.io/docs/overview/
      - service: "Mirrored vulnerability databases for the scanners"
        role: other
        why: "Scanning inside a closed network needs the scanners' vulnerability databases (for example Trivy's) mirrored and refreshed by you."
        url: https://trivy.dev/docs/latest/guide/advanced/self-hosting/
      - service: "Kernel, runtime and cluster patching"
        role: other
        why: "A sandbox escape is closed by a kernel, runtime or kubelet patch that nobody else will apply for you."
        url: https://kubernetes.io/docs/tasks/administer-cluster/cluster-upgrade/
    quickstart:
      - title: "Sandbox controller, for example agent-sandbox: Overview"
        url: https://agent-sandbox.sigs.k8s.io/docs/getting_started/overview/
      - title: "Sandbox runtime, for example Kata Containers with agent-sandbox"
        url: https://agent-sandbox.sigs.k8s.io/docs/use-cases/examples/kata-containers/
      - title: "Inference server, for example vLLM: Using Kubernetes"
        url: https://docs.vllm.ai/en/latest/deployment/k8s/
    # >>> hosting options (compared against the vendor's pages; one is the mapping itself)
    hosting:
      - id: kubernetes
        kind: cluster
        name: "Kubernetes (agent-sandbox on Kata Containers)"
        url: https://agent-sandbox.sigs.k8s.io/docs/use-cases/kata-containers-isolation/
        asOf: "2026-11"
        mapped: true
        compare:
          runs: "Your orchestrator creates and deletes each agent-sandbox Sandbox; Kata Containers runs every pod in a lightweight virtual machine with its own kernel."
          patching: "Your organisation patches the nodes, Kubernetes, the agent-sandbox controller, Kata's hypervisor and guest kernel, and the task images."
          data: "Code, files and results of a run stay in the sandbox pod and its volumes on your nodes until your orchestrator collects or deletes them."
          network: "Pods accept and send all traffic by default; NetworkPolicy or Cilium rules limit each sandbox to the offline web, the mirror and platform services."
          identity: "A sandbox pod runs as a Kubernetes ServiceAccount; a task holds a short-lived projected token only if the pod template mounts one."
          accepts: "Any OCI image, so any language and tools; Kata needs nodes with virtualisation extensions and, in the agent-sandbox guide, the containerd runtime."
          workload: "Warm pools hand out pre-started sandboxes; one lives until its shutdownTime or deletion, can keep volumes, and many run in parallel across nodes."
          portability: "Sandbox objects and images move to any Kubernetes cluster that has agent-sandbox; the RuntimeClass name is the only runtime-specific part."
          effort: "Your team operates the cluster, the agent-sandbox controller and router, Kata Containers on dedicated nodes, and the warm pools."
          fits: "agent-sandbox points to Kata Containers where hardware-level isolation is wanted, such as multi-tenant platforms or highly untrusted code."
        sources:
          - https://agent-sandbox.sigs.k8s.io/
          - https://raw.githubusercontent.com/kubernetes-sigs/agent-sandbox/main/README.md
          - https://agent-sandbox.sigs.k8s.io/docs/getting_started/overview/
          - https://agent-sandbox.sigs.k8s.io/docs/use-cases/kata-containers-isolation/
          - https://agent-sandbox.sigs.k8s.io/docs/sandbox/lifecycle/
          - https://raw.githubusercontent.com/kata-containers/kata-containers/main/README.md
          - https://kubernetes.io/docs/concepts/services-networking/network-policies/
          - https://kubernetes.io/docs/concepts/security/service-accounts/
      - id: gvisor
        kind: cluster
        name: "Kubernetes (agent-sandbox on gVisor)"
        url: https://agent-sandbox.sigs.k8s.io/docs/use-cases/gvisor-isolation/
        asOf: "2026-11"
        compare:
          runs: "Your orchestrator creates and deletes each agent-sandbox Sandbox; gVisor's runsc gives every pod a user-space kernel that handles its system calls."
          patching: "Your organisation patches the nodes, Kubernetes, the agent-sandbox controller, the runsc binaries on every sandbox node, and the task images."
          data: "Code, files and results stay in the sandbox pod on your nodes; by default writes to the root file system go to an overlay and leave the image untouched."
          network: "Each sandbox uses gVisor's own network stack by default; what a pod may reach is still set by NetworkPolicy or Cilium, as gVisor itself advises."
          identity: "A sandbox pod runs as a Kubernetes ServiceAccount; a task holds a short-lived projected token only if the pod template mounts one."
          accepts: "Any OCI image on x86_64 or ARM64 nodes with Linux 5.6 or later; not every system call is implemented, and io_uring is disabled by default."
          workload: "No virtual machine is booted per sandbox; warm pools, shutdownTime and volumes work as for any pod, and agent-sandbox documents snapshots only on GKE."
          portability: "Sandbox objects and images are unchanged on any cluster with agent-sandbox; only runtimeClassName differs, and images must be retested per runtime."
          effort: "Your team operates the cluster, the agent-sandbox controller and router, runsc and its containerd shim on the nodes, and compatibility testing."
          fits: "agent-sandbox points to gVisor for user-space isolation on hosts without nested virtualisation; gVisor advises its KVM platform on bare metal."
        sources:
          - https://agent-sandbox.sigs.k8s.io/
          - https://raw.githubusercontent.com/kubernetes-sigs/agent-sandbox/main/README.md
          - https://agent-sandbox.sigs.k8s.io/docs/getting_started/overview/
          - https://agent-sandbox.sigs.k8s.io/docs/use-cases/gvisor-isolation/
          - https://agent-sandbox.sigs.k8s.io/docs/use-cases/kata-containers-isolation/
          - https://agent-sandbox.sigs.k8s.io/docs/sandbox/lifecycle/
          - https://agent-sandbox.sigs.k8s.io/docs/sandbox/snapshots/
          - https://gvisor.dev/docs/
          - https://gvisor.dev/docs/architecture_guide/platforms/
          - https://gvisor.dev/docs/user_guide/platforms/
          - https://gvisor.dev/docs/user_guide/containerd/quick_start/
          - https://gvisor.dev/docs/user_guide/containerd/configuration/
          - https://gvisor.dev/docs/user_guide/install/
          - https://gvisor.dev/docs/user_guide/networking/
          - https://gvisor.dev/docs/user_guide/compatibility/
          - https://gvisor.dev/docs/architecture_guide/security/
          - https://gvisor.dev/docs/user_guide/production/
          - https://gvisor.dev/docs/user_guide/filesystem/
          - https://gvisor.dev/docs/tutorials/falco/
          - https://gvisor.dev/blog/2022/08/01/threat-detection/
          - https://falco.org/blog/falco-0-44-0/
          - https://github.com/falcosecurity/falco/releases/tag/0.44.0
        summary: "The same agent-sandbox pods run under the gVisor RuntimeClass instead of Kata. Each pod gets a user-space kernel (runsc) that intercepts its system calls, so nodes need no hardware virtualisation: any x86_64 or ARM64 node with Linux 5.6 or later will do. In exchange the wall is a user-space kernel on a shared host kernel, not a virtual machine; some system calls and devices are missing, and every task image has to be tested under it."
        bindings:
          - { block: sandbox, service: "agent-sandbox Sandbox on gVisor (RuntimeClass gvisor)", note: "runsc, its gvisor-bin directory and containerd-shim-runsc-v1 are installed on each sandbox node and the pod template sets runtimeClassName: gvisor. gVisor advises the KVM platform on bare-metal nodes for performance.", url: https://agent-sandbox.sigs.k8s.io/docs/use-cases/gvisor-isolation/, watch: [{ text: "The wall is a user-space kernel, not a virtual machine: the default systrap platform intercepts system calls with seccomp, and the KVM platform uses virtualisation for address-space isolation and is advised on bare metal for performance. gVisor warns that virtualisation hardware does not by itself make a sandbox more secure, and it gives no protection against hardware side channels, so the scheduling rows still apply.", url: "https://gvisor.dev/docs/architecture_guide/security/" }, { text: "Not every system call or /proc and /sys file is implemented: io_uring is disabled by default, KVM cannot be used inside a sandbox, iptables is only partly supported, and block-device file systems and most custom device files are unavailable. Test each task image, browser and computer-use tool under runsc before a run depends on it.", url: "https://gvisor.dev/docs/user_guide/compatibility/" }] }
        addSettings: [gvisorRunscPlatform, gvisorRuntimeMonitoring]
        alsoNeeded:
          - service: "runsc and containerd-shim-runsc-v1 on every sandbox node"
            role: other
            why: "Installed from gVisor's apt repository or release archive, which since July 2026 also carries a gvisor-bin directory that must stay beside runsc, and registered as a containerd runtime; they take the place of the Kata packages and hypervisor."
            url: https://gvisor.dev/docs/user_guide/install/
          - service: "A receiver for gVisor's trace points on the sandbox nodes"
            role: logging
            why: "Only Falco 0.43.x or earlier can receive gVisor's trace points; Falco 0.44.0 removed its gVisor engine, so with a current Falco runtime monitoring needs a monitoring process of your own."
            url: https://gvisor.dev/docs/tutorials/falco/
        quickstart:
          - title: "agent-sandbox: gVisor Isolation"
            url: https://agent-sandbox.sigs.k8s.io/docs/use-cases/gvisor-isolation/
          - title: "gVisor: containerd quick start (RuntimeClass)"
            url: https://gvisor.dev/docs/user_guide/containerd/quick_start/
          - title: "gVisor: installation"
            url: https://gvisor.dev/docs/user_guide/install/
    # <<< hosting options
    settings:
      - k8sRuntimeClassSandbox
      - agentSandboxTemplate
      - agentSandboxShutdown
      - k8sPodSecurityRestricted
      - k8sDedicatedNodeTaints
      - k8sCpuManagerStatic
      - k8sNetworkPolicyDefaultDeny
      - ciliumHostFirewall
      - ciliumFqdnEgress
      - egressProxyAllowlist
      - pulpSyncAllowlist
      - nexusProxyAllowlist
      - pipRequireHashes
      - trivyScanPipeline
      - harborVulnerabilityGate
      - k8sServiceAccountTokens
      - vaultKubernetesAuth
      - cephRgwStsWebIdentity
      - litellmVirtualKeys
      - vllmApiKey
      - objectStoreBucketPolicy
      - k8sRbacLeastPrivilege
      - tetragonTracingPolicy
      - otelCollectorPipeline
      - lokiRetentionImmutability
      - k8sAuditLogging
      - kubeflowTrainJobSuspend
      - sandboxRunStop
      - trivyK8sCompliance
      - sandboxContainmentRedTeam

  - architecture: archAgentFederation
    asOf: "2026-11"
    verified: "2026-11-18"
    reference:
      - title: "Agent2Agent (A2A) Protocol Specification"
        url: https://a2a-protocol.org/latest/specification/
      - title: "Identity provider, for example Keycloak: Server Administration Guide"
        url: https://www.keycloak.org/docs/latest/server_admin/index.html
      - title: "AI gateway, for example LiteLLM Proxy: Production Best Practices"
        url: https://docs.litellm.ai/docs/proxy/prod
    summary:
      - "Your A2A agent runs on infrastructure you operate. Your identity provider signs users in and your authorisation server issues one client and key per agent per partnership and a fresh, narrower token at every hand-off. An AI gateway that handles A2A holds the reviewed record of each peer agent, decides which credential may call which agent, screens and logs messages, and fronts your models. Only your egress control can reach a peer. Data stays in the data centre unless a task sends it to a peer, and you carry what a cloud provider would otherwise run; each box lists example products."
    bindings:
      - block: idp
        service: "Identity provider for your users"
        note: "Where people sign in and where the groups approved for each partnership are kept. Federates your directory if you have one."
        options:
          - { name: "Keycloak", kind: open, url: "https://www.keycloak.org/securing-apps/token-exchange", note: "Open-source IdP and authorisation server: standard token exchange within a realm, client scopes and audience mappers; you run it HA.", packs: [upstreamOpenSource] }
          - { name: "Red Hat build of Keycloak", kind: commercial, url: "https://access.redhat.com/products/red-hat-build-keycloak/", note: "Red Hat-supported Keycloak (26.6 is the latest version listed); the IdP in Red Hat's Connectivity Link guides.", packs: [redHatOpenShiftAi], watch: [{ text: "Red Hat's supported Keycloak; 26.6 is the latest version listed.", url: "https://access.redhat.com/products/red-hat-build-keycloak/" }] }
          - { name: "Gravitee Access Management", kind: commercial, url: "https://documentation.gravitee.io/am/4.11/guides/developer-contributions/using-oauth-2.0-token-exchange", note: "Token exchange with delegation (act claim) in AM 4.11; MCP Server resources with per-tool scopes are in preview.", packs: [graviteeAgentMesh], watch: [{ text: "Token exchange with delegation (act claim) in AM 4.11; federates to your directory.", url: "https://documentation.gravitee.io/am/4.11/guides/developer-contributions/using-oauth-2.0-token-exchange" }] }
          - { name: "PingFederate", kind: commercial, url: "https://docs.pingidentity.com/pingfederate/13.1/introduction_to_pingfederate/pf_token_exchange_grant.html", note: "Self-managed commercial server; RFC 8693 token exchange through processor policies, with an ID-JAG token type in 13.1." }
          - { name: "ZITADEL", kind: open, url: "https://zitadel.com/docs/guides/integrate/token-exchange", note: "Open-source, self-hostable IdP with RFC 8693 token exchange for impersonation and delegation." }
      - block: entry
        service: "Front door with single sign-on"
        options:
          - { name: "Envoy Gateway", kind: open, url: "https://gateway.envoyproxy.io/docs/tasks/security/oidc/", note: "Gateway API implementation; a SecurityPolicy with oidc signs users in at any OIDC provider (its docs show Google, Keycloak, Entra).", packs: [upstreamOpenSource], watch: [{ text: "A SecurityPolicy with oidc against Keycloak binds who is asking before a turn reaches the agent.", url: "https://gateway.envoyproxy.io/docs/tasks/security/oidc/" }] }
          - { name: "Red Hat Connectivity Link (Kuadrant)", kind: commercial, url: "https://developers.redhat.com/articles/2026/02/12/build-zero-trust-environment-red-hat-connectivity-link", note: "OIDC and auth policies enforced by Authorino on Gateway API routes, shown with a Red Hat build of Keycloak realm.", packs: [redHatOpenShiftAi], watch: [{ text: "Kuadrant and Authorino enforce sign-in on Gateway API routes against a Keycloak realm.", url: "https://developers.redhat.com/articles/2026/02/12/build-zero-trust-environment-red-hat-connectivity-link" }] }
          - { name: "Kong Gateway OpenID Connect plugin", kind: commercial, url: "https://developer.konghq.com/plugins/openid-connect/", note: "Enterprise plugin: authorization code sign-in with a session cookie, and RFC 8693 token exchange from 3.14.", packs: [kongAiGateway], watch: [{ text: "Enterprise plugin with authorization code sign-in; works with your IdP (Kong's how-tos use Keycloak or Okta).", url: "https://developer.konghq.com/plugins/openid-connect/" }] }
          - { name: "OAuth2 Proxy", kind: open, url: "https://oauth2-proxy.github.io/oauth2-proxy/", note: "Small reverse proxy or auth service that adds OIDC sign-in in front of an ingress that lacks it." }
      - block: authServer
        service: "Authorization server for agent and peer clients"
        note: "The identity provider and the authorisation server can be one product (for example Keycloak, as one realm or two) or two (a corporate identity provider federated to a separate authorisation server). Where they are one, the federation between them is configuration inside it, and who approves a partnership and who issues its client is a split of administrator roles to set up."
        options:
          - { name: "Keycloak", kind: open, url: "https://www.keycloak.org/securing-apps/token-exchange", note: "Open-source IdP and authorisation server: standard token exchange within a realm, client scopes and audience mappers; you run it HA.", packs: [upstreamOpenSource], watch: [{ text: "Can be the same product as the identity provider, as one realm or two. One client per agent per partnership, Signed JWT keys, standard token exchange.", url: "https://www.keycloak.org/securing-apps/token-exchange" }, { text: "Standard token exchange covers tokens of your own realm: a peer's token is not exchanged directly, and cross-organisation trust runs through identity brokering or the JWT Authorization Grant; delegation is a preview feature.", url: "https://www.keycloak.org/securing-apps/token-exchange" }] }
          - { name: "Red Hat build of Keycloak", kind: commercial, url: "https://access.redhat.com/products/red-hat-build-keycloak/", note: "Red Hat-supported Keycloak (26.6 is the latest version listed); the IdP in Red Hat's Connectivity Link guides.", packs: [redHatOpenShiftAi], watch: [{ text: "Red Hat's supported Keycloak; 26.6 is the latest version listed.", url: "https://access.redhat.com/products/red-hat-build-keycloak/" }] }
          - { name: "Gravitee Access Management", kind: commercial, url: "https://documentation.gravitee.io/am/4.11/guides/developer-contributions/using-oauth-2.0-token-exchange", note: "Token exchange with delegation (act claim) in AM 4.11; MCP Server resources with per-tool scopes are in preview.", packs: [graviteeAgentMesh], watch: [{ text: "Token exchange with delegation (act claim) in AM 4.11; federates to your directory.", url: "https://documentation.gravitee.io/am/4.11/guides/developer-contributions/using-oauth-2.0-token-exchange" }] }
          - { name: "PingFederate", kind: commercial, url: "https://docs.pingidentity.com/pingfederate/13.1/introduction_to_pingfederate/pf_token_exchange_grant.html", note: "Self-managed commercial server; RFC 8693 token exchange through processor policies, with an ID-JAG token type in 13.1." }
          - { name: "ZITADEL", kind: open, url: "https://zitadel.com/docs/guides/integrate/token-exchange", note: "Open-source, self-hostable IdP with RFC 8693 token exchange for impersonation and delegation." }
      - block: harness
        service: "Your A2A agent"
        build: true
        note: "A2A client and server. It calls peers only through the gateway (with LiteLLM, /a2a/{agent_id}) and verifies each Agent Card itself."
        options:
          - { name: "Kubernetes Deployment", kind: open, url: "https://kubernetes.io/docs/setup/production-environment/", note: "Your agent as an ordinary workload on a cluster you run; any framework.", packs: [upstreamOpenSource] }
          - { name: "Knative Serving", kind: open, url: "https://knative.dev/docs/serving/", note: "Request-driven scaling down to zero; OpenShift Serverless is Red Hat's Knative-based product." }
          - { name: "kagent", kind: open, url: "https://kagent.dev/", note: "CNCF Sandbox project to deploy and govern agents on Kubernetes, reached over A2A or MCP, with gVisor sandboxes." }
          - { name: "Your A2A agent on OpenShift", kind: commercial, url: "https://developers.redhat.com/articles/2026/07/20/architect-open-blueprint-cloud-native-ai-agents", note: "Red Hat's blueprint calls A2A interoperability not yet settled and lists only upstream A2A projects.", packs: [redHatOpenShiftAi] }
      - block: localTools
        service: "Tool handlers inside the agent"
        build: true
        note: "Run in the agent process and are unseen by the gateway, so they call the gateway's guardrail endpoint (with LiteLLM, /guardrails/apply_guardrail) before storing a peer's artefact."
        options:
          - { name: "agent-sandbox with gVisor", kind: open, url: "https://agent-sandbox.sigs.k8s.io/", note: "Kubernetes SIG Apps controller (v1beta1 API) for per-task sandboxes and warm pools; gVisor intercepts system calls in user space." }
          - { name: "Kata Containers", kind: open, url: "https://katacontainers.io/", note: "RuntimeClass giving each sandbox pod its own lightweight VM and kernel; works under agent-sandbox or plain pods." }
          - { name: "Red Hat build of Agent Sandbox with OpenShift sandboxed containers", kind: commercial, url: "https://www.redhat.com/en/blog/whats-new-red-hat-openshift-confidential-computing-and-sandboxing", note: "Downstream agent-sandbox, Technology Preview (Aug 2026), with Kata VMs from sandboxed containers 1.13.", packs: [redHatOpenShiftAi], watch: [{ text: "Agent Sandbox is Technology Preview (Aug 2026); sandboxed containers 1.13 run each pod in its own Kata VM.", url: "https://www.redhat.com/en/blog/whats-new-red-hat-openshift-confidential-computing-and-sandboxing" }] }
          - { name: "NVIDIA OpenShell", kind: open, url: "https://docs.nvidia.com/openshell/about/overview", note: "Open-source agent runtime that wraps the sandbox in a declarative YAML policy; early 0.1.x releases." }
          - { name: "Your handlers, screening artefacts via LiteLLM apply_guardrail", kind: open, url: "https://docs.litellm.ai/docs/apply_guardrail", packs: [upstreamOpenSource] }
      - block: memory
        service: "Task state and received-artefact store"
        note: "Artefacts are stored against the task that received them, under row security."
        options:
          - { name: "PostgreSQL with pgvector", kind: open, url: "https://github.com/pgvector/pgvector", note: "Rows and vectors in one database, so PostgreSQL row security also applies to vector queries." }
          - { name: "Valkey", kind: open, url: "https://valkey.io/", note: "BSD-licensed key/value store, compatible with Redis OSS, for sessions and short-lived task state." }
          - { name: "Milvus", kind: open, url: "https://milvus.io/docs/overview.md", note: "Apache-2.0 vector database under the LF AI & Data Foundation, for large indexes kept apart from row data." }
          - { name: "Redis Software", kind: commercial, url: "https://redis.io/docs/latest/operate/rs/", note: "Self-managed commercial Redis with vendor support, for session and cache state." }
          - { name: "EDB Postgres AI for CloudNativePG", kind: commercial, url: "https://www.enterprisedb.com/docs/postgres_for_kubernetes/latest/", note: "EDB's supported build of the CloudNativePG operator, for PostgreSQL and pgvector with a support contract." }
          - { name: "PostgreSQL with pgvector; Valkey for task state", kind: open, url: "https://github.com/pgvector/pgvector", packs: [upstreamOpenSource] }
      - block: gateway
        service: "AI gateway for models, MCP and A2A"
        options:
          - { name: "LiteLLM Proxy", kind: open, url: "https://docs.litellm.ai/docs/simple_proxy", note: "Models, MCP servers and A2A agents behind one proxy with per-key and per-team grants; some features need its Enterprise licence.", packs: [upstreamOpenSource], watch: [{ text: "Calls peers at /a2a/{agent_id} with per-key and per-team access; it does not verify Agent Card signatures.", url: "https://docs.litellm.ai/docs/a2a" }, { text: "LiteLLM documents an A2A agent gateway, so it is bound for the A2A path as well as for models and MCP. It does not verify card signatures.", url: "https://docs.litellm.ai/docs/a2a" }, { text: "Its Agent Gateway proxies A2A but lists the Agent Card signatures field as unsupported: it stores a curated card and shows a diff on re-sync, without checking AgentCardSignature.", url: "https://docs.litellm.ai/docs/a2a_agent_card" }, { text: "Task methods such as tasks/get are forwarded to the peer unchanged, outside the messaging paths (message/send, message/stream) it integrates, so screen artefacts fetched that way in the agent before they reach memory.", url: "https://docs.litellm.ai/docs/a2a" }] }
          - { name: "agentgateway", kind: open, url: "https://agentgateway.dev/", note: "Linux Foundation project donated by Solo.io: one data plane for LLM, MCP and A2A traffic with JWT, OIDC, ext_authz and tool scoping." }
          - { name: "Gravitee API Management (Agent Management)", kind: commercial, url: "https://documentation.gravitee.io/apim/4.10/agent-mesh", note: "LLM, MCP and A2A proxy API types on one gateway, fully self-hostable; Enterprise licence for the AI features.", packs: [graviteeAgentMesh], watch: [{ text: "A2A proxy needs APIM 4.11+ and the Enterprise AI Agent Management pack; flows route on HTTP selectors.", url: "https://documentation.gravitee.io/apim/create-and-configure-apis/gravitee-api-definitions/a2a-proxy-api-type" }] }
          - { name: "Kong Gateway Enterprise with AI Gateway", kind: commercial, url: "https://developer.konghq.com/plugins/ai-mcp-proxy/", note: "Plugins on Services and Routes: AI Proxy Advanced (lists vLLM), AI MCP Proxy with per-tool ACLs, AI A2A Proxy from 3.14.", packs: [kongAiGateway], watch: [{ text: "3.14+: rewrites Agent Card URLs to the gateway and traces A2A calls; no task-state handling, and no card signature check is documented.", url: "https://developer.konghq.com/plugins/ai-a2a-proxy/" }] }
          - { name: "OpenShift AI Models-as-a-Service with the Connectivity Link MCP gateway", kind: commercial, url: "https://www.redhat.com/en/blog/model-context-protocol-gateway-red-hat-openshift-now-generally-available", note: "Kuadrant-based; MCP gateway GA in Connectivity Link 1.5 (Oct 2026), MaaS GA since OpenShift AI 3.4; MCP workflows in OpenShift AI 3.5 are TP; no A2A gateway.", packs: [redHatOpenShiftAi], watch: [{ text: "Bring an A2A-capable gateway for peer calls (Red Hat's blueprint names LiteLLM among gateway options).", url: "https://www.redhat.com/en/blog/model-context-protocol-gateway-red-hat-openshift-now-generally-available" }] }
      - { block: internalTools, service: "Your MCP tool servers, behind the gateway", build: true, note: "Called by the gateway with a token exchanged at your authorisation server for that server's audience, never the peer's token." }
      - { block: orgData, service: "Your systems of record", build: true, note: "Reached only by tool services, inside the exchanged token's scope." }
      - { block: peerVendor, service: "Vendor platform agent (A2A), outside", note: "Stays outside. Registered on the gateway; reached through your egress control; trusts your identity provider for the users you approved." }
      - block: provider
        service: "Open-weight models you host, or a hosted model API"
        note: "Either open-weight models served on GPU servers you run, or a hosted model API under your agreement with its provider. The pattern reaches it through the gateway either way."
        options:
          - { name: "vLLM", kind: open, url: "https://docs.vllm.ai/en/latest/", note: "Open-source inference server with an OpenAI-compatible API.", packs: [upstreamOpenSource], watch: [{ text: "Called by LiteLLM as a hosted_vllm provider; KServe is the common alternative.", url: "https://docs.litellm.ai/docs/providers/vllm" }, { text: "Your own open-weights models in the same data centre, called by LiteLLM as hosted_vllm/. KServe is the alternative.", url: "https://docs.vllm.ai/en/latest/" }] }
          - { name: "KServe", kind: open, url: "https://kserve.github.io/website/", note: "Kubernetes model serving through InferenceService resources, with vLLM and llm-d backends." }
          - { name: "llm-d", kind: open, url: "https://llm-d.ai/", note: "Distributed inference on Kubernetes (router plus vLLM); GA inside OpenShift AI 3.5." }
          - { name: "Red Hat AI Inference (vLLM)", kind: commercial, url: "https://www.redhat.com/en/products/ai/inference", note: "Red Hat's supported vLLM build, GA in OpenShift AI 3.5." }
          - { name: "NVIDIA NIM", kind: commercial, url: "https://docs.nvidia.com/nim/large-language-models/about-nim-llm/overview", note: "NVIDIA's prebuilt, optimised inference containers for LLMs on NVIDIA GPUs." }
          - { name: "SGLang", kind: open, url: "https://docs.sglang.io/", note: "Open-source high-throughput serving framework for language and multimodal models." }
          - { name: "A hosted model API, via the gateway", kind: commercial, url: "https://docs.litellm.ai/docs/providers", note: "A model provider's API, reached only from the gateway, which holds the key." }
          - { name: "Red Hat AI Inference (vLLM), with KServe or llm-d", kind: commercial, url: "https://access.redhat.com/articles/rhoai-supported-configs", note: "All three GA in OpenShift AI 3.5 per Red Hat's supported-configurations list.", packs: [redHatOpenShiftAi] }
      - { block: partner, service: "Partner organisation's agent (A2A), outside", note: "Stays outside. No user federation: your agent presents its own client identity and scopes only." }
      - block: govIdentity
        service: "Workload identity and trust with peers"
        options:
          - { name: "Keycloak", kind: open, url: "https://www.keycloak.org/securing-apps/token-exchange", note: "People and service clients in one realm, with token exchange for hand-offs.", packs: [upstreamOpenSource] }
          - { name: "Red Hat build of Keycloak", kind: commercial, url: "https://access.redhat.com/products/red-hat-build-keycloak/", note: "Supported Keycloak build from Red Hat.", packs: [redHatOpenShiftAi] }
          - { name: "Kubernetes ServiceAccount tokens", kind: open, url: "https://kubernetes.io/docs/concepts/security/service-accounts/", note: "Short-lived projected tokens give each workload an identity the IdP and vault can verify.", packs: [upstreamOpenSource] }
          - { name: "SPIFFE and SPIRE", kind: open, url: "https://spiffe.io/docs/latest/spire-about/", note: "Attested workload identities and trust-domain federation, an alternative to keys per client.", packs: [upstreamOpenSource] }
          - { name: "Red Hat zero trust workload identity manager", kind: commercial, url: "https://www.redhat.com/en/blog/zero-trust-workload-identity-manager-11-generally-available-red-hat-openshift", note: "Red Hat's SPIRE operator, GA 1.1 (July 2026), with Vault and cert-manager as upstream authorities.", packs: [redHatOpenShiftAi] }
          - { name: "Gravitee Access Management", kind: commercial, url: "https://documentation.gravitee.io/am/4.11/guides/developer-contributions/using-oauth-2.0-token-exchange", note: "Gravitee's IdP and authorisation server, with delegated token exchange.", packs: [graviteeAgentMesh] }
          - { name: "Zero trust workload identity manager (SPIRE) with federation", kind: commercial, url: "https://www.redhat.com/en/blog/zero-trust-workload-identity-manager-11-generally-available-red-hat-openshift", note: "Federation across clusters through Service Mesh; Vault or cert-manager as the upstream authority.", packs: [redHatOpenShiftAi] }
      - block: govSecrets
        service: "Signing keys and secrets with a hardware root"
        options:
          - { name: "HashiCorp Vault", kind: commercial, url: "https://developer.hashicorp.com/vault/docs/deploy/kubernetes/vso", note: "Dynamic credentials, transit keys and the Vault Secrets Operator; HSM auto-unseal needs Vault Enterprise.", packs: [upstreamOpenSource] }
          - { name: "OpenBao", kind: open, url: "https://openbao.org/docs/configuration/seal/pkcs11/", note: "Open-source fork of Vault under the Linux Foundation's OpenSSF; documents a PKCS#11 HSM seal.", packs: [upstreamOpenSource] }
          - { name: "External Secrets Operator", kind: open, url: "https://external-secrets.io/latest/", note: "Syncs secrets from an external store into Kubernetes Secrets; pairs with any vault here." }
          - { name: "External Secrets Operator for Red Hat OpenShift", kind: commercial, url: "https://developers.redhat.com/articles/2025/11/11/introducing-external-secrets-operator-openshift", note: "Red Hat-supported ESO, GA for OpenShift 4.20+, syncing from Vault or CyberArk Conjur.", packs: [redHatOpenShiftAi], watch: [{ text: "GA for OpenShift 4.20+; it syncs from a vault you run, such as HashiCorp Vault or CyberArk Conjur.", url: "https://developers.redhat.com/articles/2025/11/11/introducing-external-secrets-operator-openshift" }] }
          - { name: "Idira Secrets Manager, self-hosted (Palo Alto Networks)", kind: commercial, url: "https://www.paloaltonetworks.com/idira/machine/secrets-management", note: "The former CyberArk line now under Palo Alto's Idira brand; SaaS or self-hosted for air-gapped sites." }
      - block: govPolicy
        service: "Network, admission and guardrail policy"
        options:
          - { name: "Kubernetes", kind: open, url: "https://kubernetes.io/docs/concepts/overview/", note: "The container platform each platform pack here runs on, upstream or as a distribution (OpenShift, VKS, Canonical Kubernetes).", packs: [upstreamOpenSource, redHatOpenShiftAi] }
      - block: govSupplyChain
        service: "Mirrors, scanners and signing in the pipeline"
        options:
          - { name: "Harbor", kind: open, url: "https://goharbor.io/docs/2.16.0/administration/configure-proxy-cache/", note: "Image registry with a proxy cache and Trivy scanning; images, not PyPI or npm.", packs: [upstreamOpenSource] }
      - block: govObservability
        service: "Logs, traces and SIEM off the agent's path"
        options:
          - { name: "OpenTelemetry Collector", kind: open, url: "https://opentelemetry.io/docs/collector/", note: "Vendor-neutral pipeline that receives gateway logs and traces and forwards them to stores the agent cannot write.", packs: [upstreamOpenSource] }
          - { name: "Grafana Loki", kind: open, url: "https://grafana.com/docs/loki/latest/", note: "Log store; turn retention on, or logs are kept for ever.", packs: [upstreamOpenSource] }
          - { name: "Langfuse (self-hosted)", kind: open, url: "https://langfuse.com/self-hosting", note: "Self-hosted LLM tracing and evaluation, with a documented LiteLLM integration.", packs: [upstreamOpenSource] }
          - { name: "MLflow Tracing", kind: open, url: "https://mlflow.org/docs/latest/genai/tracing/", note: "Agent and LLM tracing; GA in OpenShift AI 3.5, where the visual agent-trace view is Technology Preview.", packs: [redHatOpenShiftAi], watch: [{ text: "MLflow is GA in OpenShift AI 3.5; the visual agent-trace view is Technology Preview. The SIEM is yours.", url: "https://www.redhat.com/en/blog/red-hat-ai-35-scaling-and-governing-ai-agents-production" }] }
          - { name: "Elastic Security", kind: commercial, url: "https://www.elastic.co/docs/solutions/security", note: "SIEM and detection engine; one example of where detections on gateway, egress and audit logs run." }
    sources:
      internalTools: https://docs.litellm.ai/docs/mcp
      orgData: https://developer.hashicorp.com/vault/docs/secrets/databases
      peerVendor: https://a2a-protocol.org/latest/specification/
      partner: https://a2a-protocol.org/latest/specification/
    differences:
      - at: gateway->provider
        text: "Where the organisation serves its own models (the self-hosted inference pattern), the model provider sits inside the data centre and prompts and completions do not leave it. Where it calls an external model API instead, the provider stays outside and the call leaves through the organisation's egress control."
        change: "Conditional on the organisation's choice, not on the platform: when models are self-hosted, move the provider box from the external zone into the Enterprise data centre boundary and link it to archSelfHostedInference, so gateway->provider no longer crosses the boundary; when an external model API is used, leave the drawing as it is."
    alsoNeeded:
      - service: "The container platform's control plane on your own servers"
        role: other
        why: "No provider runs the platform: highly available control plane nodes, backups of its datastore (etcd on Kubernetes), upgrades and node patching are yours."
        url: https://kubernetes.io/docs/setup/production-environment/
      - service: "GPU servers with their drivers, container toolkit and device plugin"
        role: other
        why: "Where you serve your agent's models yourself: drivers, the container toolkit and the device plugin on every GPU node (for example with the NVIDIA GPU Operator)."
        url: https://docs.nvidia.com/datacenter/cloud-native/gpu-operator/latest/index.html
      - service: "Secrets manager and signing keys"
        role: secrets
        why: "Issues and rotates each agent's signing key per partnership and holds the gateway's root keys (for example HashiCorp Vault or OpenBao, delivered to workloads by an operator such as the Vault Secrets Operator). LiteLLM's own Vault integration, if you use LiteLLM, is Enterprise only."
        url: https://developer.hashicorp.com/vault/docs/deploy/kubernetes/vso
      - service: "A protected root for the keys that identify you"
        role: keys
        why: "Keys that identify your organisation to partners deserve a root no one person or file holds: a hardware security module (OpenBao documents a PKCS#11 seal) or key shares held by several people."
        url: https://openbao.org/docs/configuration/seal/pkcs11/
      - service: "Certificates: a public one for the A2A endpoint, internal ones inside"
        role: keys
        why: "Peers verify your agent's TLS certificate against authorities they trust, so the published endpoint needs a public or mutually agreed authority; inside, an internal one (for example cert-manager with both issuers)."
        url: https://cert-manager.io/docs/
      - service: "Public DNS and an internet-facing address for your agent"
        role: ingress
        why: "Peers call in over the internet: a published name, an edge firewall and denial-of-service protection in front of your front door are yours to provide."
        url: https://gateway.envoyproxy.io/docs/
      - service: "Network policy enforcement and egress control"
        role: network
        why: "Deny by default inside the cluster and an exit that opens only for each approved peer's host (for example Cilium with a Squid forward proxy, or an egress gateway)."
        url: https://docs.cilium.io/en/stable/security/dns/
      - service: "SPIFFE and SPIRE, where a peer accepts workload identities"
        role: identity
        why: "An alternative to keys per partnership: federated trust domains exchange bundles so each side can verify the other's workloads. Keycloak's SPIFFE identity provider, if you use Keycloak, is a preview feature."
        url: https://spiffe.io/docs/latest/architecture/federation/readme/
      - service: "Database operations and backups"
        role: other
        why: "The identity provider, the gateway and task memory live in databases you run (for example PostgreSQL under CloudNativePG, with Velero for cluster backups). LiteLLM, if you use it, falls back to unrestricted agent access when its database is unreachable, so availability here is a security property."
        url: https://cloudnative-pg.io/
      - service: "Log collection and your SIEM"
        role: logging
        why: "Collects gateway, identity provider, proxy and platform audit logs and forwards them to the SIEM, where task records are matched with what the partner exports (for example the OpenTelemetry Collector and Loki)."
        url: https://opentelemetry.io/docs/collector/configuration/
      - service: "Time synchronisation on every node"
        role: other
        why: "Signed client assertions are valid for seconds and both organisations' task records are matched by time (for example chrony)."
        url: https://chrony-project.org/documentation.html
    quickstart:
      - title: "A2A gateway, for example LiteLLM Proxy: Agent Gateway (A2A Protocol) Overview"
        url: https://docs.litellm.ai/docs/a2a
      - title: "Authorisation server, for example Keycloak: Configuring and using token exchange"
        url: https://www.keycloak.org/securing-apps/token-exchange
      - title: "AI gateway, for example LiteLLM Proxy: Deploy with Helm"
        url: https://docs.litellm.ai/docs/proxy/deploy/helm
    # >>> hosting options (compared against the vendor's pages; one is the mapping itself)
    hosting:
      - id: kubernetes
        kind: cluster
        name: "Kubernetes"
        url: https://kubernetes.io/docs/concepts/overview/
        asOf: "2026-11"
        mapped: true
        compare:
          runs: "Your own code runs the loop in pods you deploy; Kubernetes schedules and restarts the pods and provides no application-level services."
          patching: "You do: you upgrade the control plane, drain and upgrade each node, and keep the node operating system and third-party plugins current."
          data: "Prompts, tool results and state stay in your pods and the stores you run on your own servers; Secrets sit unencrypted in etcd unless you configure encryption."
          network: "Pods accept and open all connections by default; NetworkPolicy isolates them only if your network plugin enforces it, and it cannot log or do anything TLS related."
          identity: "Each pod runs as a ServiceAccount, the namespace's default unless you set one, and gets a short-lived, rotating token mounted as a projected volume."
          accepts: "Any language or framework that runs in a container; the project says it does not limit the types of application supported."
          workload: "Deployments keep pods running, Jobs run to completion and CronJobs run on a schedule; durable waits need an engine you run yourself, such as Temporal."
          portability: "The agent is a container image plus Kubernetes manifests on a platform the project calls portable; your stores, plugins and policies move separately."
          effort: "You operate and are on call for the control plane, etcd backups, certificates, nodes, the network plugin, upgrades, logging, monitoring and every add-on."
          fits: "The project says any application that can run in a container should run on it, naming stateless, stateful and data-processing workloads."
        sources:
          - https://kubernetes.io/docs/concepts/overview/
          - https://kubernetes.io/docs/concepts/workloads/
          - https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/
          - https://kubernetes.io/docs/concepts/security/service-accounts/
          - https://kubernetes.io/docs/concepts/services-networking/network-policies/
          - https://kubernetes.io/docs/tasks/administer-cluster/cluster-upgrade/
          - https://kubernetes.io/docs/setup/production-environment/
          - https://kubernetes.io/docs/concepts/security/secrets-good-practices/
          - https://docs.temporal.io/workers
          - https://docs.temporal.io/workflow-execution
          - https://docs.temporal.io/production-deployment/worker-deployments
      - id: knative
        kind: runtime
        name: "Knative Serving"
        url: https://knative.dev/docs/serving/
        asOf: "2026-11"
        compare:
          runs: "Your own code runs the loop in a container that Knative Serving starts and scales on HTTP requests, on a cluster you operate; Knative runs no agent logic."
          patching: "You do: the cluster and its nodes as before, plus Knative Serving, Eventing and the networking layer, which you upgrade one minor version at a time."
          data: "Processed in your pods on your own servers; Knative expects little or no state in an instance and may reclaim idle ones, so state lives in stores you run."
          network: "Services are private on the cluster domain until you configure a domain name; Knative relies on the cluster, so outbound control stays your NetworkPolicy and proxy."
          identity: "A Revision's pods run as the namespace's default ServiceAccount unless serviceAccountName is set; tokens and RBAC are those of Kubernetes, which you manage."
          accepts: "Any language or framework, provided the container accepts HTTP requests; Knative describes its target as stateless, request-triggered containers."
          workload: "A request must finish within timeoutSeconds (default 300, at most 600 unless you raise it); idle Revisions scale to zero; PingSource sends events on a cron schedule."
          portability: "The agent stays an ordinary HTTP container; moving off means replacing the Knative Service, its routing and autoscaling with Kubernetes objects you write."
          effort: "You still operate everything: the cluster, Knative Serving with its activator and autoscaler, a networking layer, Eventing if used, and all their upgrades."
          fits: "Knative's docs list API development, event-driven applications, inference services and microservices as use cases; Serving targets stateless HTTP services."
        sources:
          - https://knative.dev/docs/
          - https://knative.dev/docs/serving/
          - https://knative.dev/docs/serving/request-flow/
          - https://knative.dev/docs/serving/autoscaling/scale-to-zero/
          - https://knative.dev/docs/serving/autoscaling/scale-bounds/
          - https://knative.dev/docs/serving/autoscaling/autoscaler-types/
          - https://knative.dev/docs/serving/autoscaling/concurrency/
          - https://knative.dev/docs/serving/configuration/config-defaults/
          - https://knative.dev/docs/serving/configuration/feature-flags/
          - https://knative.dev/docs/serving/services/private-services/
          - https://knative.dev/docs/serving/deploying-from-private-registry/
          - https://knative.dev/docs/serving/tag-resolution/
          - https://knative.dev/docs/serving/config-network-adapters/
          - https://knative.dev/docs/serving/traffic-management/
          - https://knative.dev/docs/serving/rolling-out-latest-revision/
          - https://knative.dev/docs/serving/istio-authorization/
          - https://knative.dev/docs/reference/security/threat-model/
          - https://knative.dev/docs/install/upgrade/upgrade-installation/
          - https://knative.dev/docs/install/yaml-install/serving/install-serving-with-yaml/
          - https://knative.dev/docs/eventing/
          - https://knative.dev/docs/eventing/sources/ping-source/
          - https://github.com/knative/specs/blob/main/specs/serving/runtime-contract.md
          - https://github.com/knative/serving/blob/main/pkg/apis/serving/fieldmask.go
          - https://knative.dev/blog/articles/gateway-api-ingress-with-knative-operator/
          - https://gateway.envoyproxy.io/docs/tasks/security/oidc/
        summary: "The A2A agent is a Knative Service on your cluster, behind your front door wired in through Knative's networking layer (the Gateway API plugin is beta). Serving scales its pods with requests and to zero when no user or peer is calling. Task state already lives in external stores, which matters more here: an idle instance can be reclaimed, so a task that runs for days moves on only when a request arrives. You install and upgrade Knative, and you still operate everything."
        bindings:
          - { block: harness, service: "Your A2A agent as a Knative Service (Knative Serving)", build: true, note: "A2A server and client over HTTP. Pods scale with requests and to zero when idle, so task state must be written to an external store before each response is sent.", url: https://knative.dev/docs/serving/, watch: [{ text: "An instance may be killed when no request is active and should use CPU only during requests, so an A2A task that stays open for days moves on only when a user, peer or timer calls, and each step writes its state to an external store before it responds.", url: "https://github.com/knative/specs/blob/main/specs/serving/runtime-contract.md" }, { text: "A call to a peer through the gateway runs inside the inbound request that caused it, and that request ends at timeoutSeconds (default 300, at most 600 unless raised); a peer task that outlasts it is picked up by a later request, with its task id kept in the store.", url: "https://knative.dev/docs/serving/configuration/config-defaults/" }] }
          - { block: entry, service: "Front door with single sign-on, wired in through Knative's networking layer", note: "Knative generates the routes on the Gateway named in config-gateway, so the sign-in policy targets that Gateway (with Envoy Gateway, its OIDC SecurityPolicy). The Gateway API plugin is beta; Knative tests it against the Istio, Contour and Envoy Gateway implementations.", url: https://knative.dev/docs/serving/config-network-adapters/ }
        addSettings: [knativeScaleBounds, knativeRequestLimits, knativeGatewayApiIngress, k8sRbacLeastPrivilege, harborProxyCache, knativeActivatorIngress, knativeLocalGatewayAccess]
        differences:
          - at: entry->harness
            text: "On Knative Serving, a request reaches the agent through the queue-proxy sidecar and, at low or zero traffic, the activator, a component shared by every Knative Service in the knative-serving namespace. Network rules must admit that hop, and the first request after idle waits for a pod to start."
            url: https://knative.dev/docs/serving/request-flow/
            change: "Knative option only: insert a 'Knative activator (shared) and queue-proxy' hop on entry->harness, drawn inside the cluster."
          - at: harness
            text: "Knative also serves the agent on a cluster-local address through the shared local gateway, which has no front-door sign-in, so it is a second way into the agent from inside the cluster. Limit which workloads reach it."
            url: https://knative.dev/docs/serving/config-network-adapters/
            change: "Knative option only: draw the 'Knative local gateway' as a second entrance into the harness from inside the cluster, beside entry->harness, that does not pass the front end."
        alsoNeeded:
          - service: "Knative Serving (controller, autoscaler, activator)"
            role: other
            why: "Runs and scales the agent's Service. You install it on your cluster and upgrade it one minor version at a time; the activator and autoscaler are shared by every Service."
            url: https://knative.dev/docs/install/yaml-install/serving/install-serving-with-yaml/
          - service: "A Knative networking layer that keeps your front door"
            role: ingress
            why: "Knative routes every request through one networking layer (Kourier, Contour, Istio or the Gateway API plugin); the Gateway API plugin is beta and lets an existing front door such as Envoy Gateway stay in front, with the external and local Gateways named in config-gateway."
            url: https://knative.dev/blog/articles/gateway-api-ingress-with-knative-operator/
          - service: "Your container registry, reachable and trusted by the Serving controller"
            role: registry
            why: "Serving resolves image tags to digests when it creates a Revision, so its controller must reach your registry, trust its certificate and use your proxy settings."
            url: https://knative.dev/docs/serving/tag-resolution/
        quickstart:
          - title: "Install Serving with YAML"
            url: https://knative.dev/docs/install/yaml-install/serving/install-serving-with-yaml/
          - title: "Configure Knative networking"
            url: https://knative.dev/docs/serving/config-network-adapters/
          - title: "Managing Gateway API ingress with the Knative Operator"
            url: https://knative.dev/blog/articles/gateway-api-ingress-with-knative-operator/
