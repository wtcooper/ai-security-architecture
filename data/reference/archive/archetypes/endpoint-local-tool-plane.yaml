    url: https://modelcontextprotocol.io/specification/2026-07-28/basic/security_best_practices
  - title: "Model Context Protocol — authorization"
    url: https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization
  - title: "OWASP — a practical guide for secure MCP server development"
    url: https://genai.owasp.org/resource/agentic-ai-threats-and-mitigations/
  - title: "OWASP Top 10 for Agentic Applications 2026 — ASI02, ASI04, ASI10"
    url: https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/
