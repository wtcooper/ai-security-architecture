# Hermes Agent — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
#
# Fetch log (2026-09-10): docs live under https://hermes-agent.nousresearch.com/docs/<path>; the
# same paths without the /docs prefix (as the pages link to each other) return 404. The section
# index pages /docs/user-guide/egress/index, /docs/user-guide/secrets/index and
# /docs/user-guide/messaging/index 404 — drop "/index" and they resolve. The GitHub
# security-advisories HTML page returned 429 to automated fetch and the repository advisories API
# lists no repo-published advisories unauthenticated; the advisories below come from the GitHub
# Advisory Database (api.github.com/advisories?ecosystem=pip&affects=hermes-agent), each html_url
# confirmed 200.
# 2026-09-25: re-verified all 21 rows (cap-input-guardrails, cap-output-guardrails,
# cap-sensitive-data-redaction, D3-APA, cap-agent-action-policy-enforcement, D3-MAN, AML.M0031, D3-EI,
# AML.M0028, D3-CTS, D3-CH, cap-mcp-tool-integrity, AML.M0029, AML.M0036, AML.M0024,
# cap-agent-kill-switch, cap-shadow-ai-discovery, cap-agent-tool-registry, D3-PA, cap-agent-egress-control,
# D3-FA) against the MITRE capability rules; every cited URL answered 200 with no redirect. Page text was
# read from the docs source (raw.githubusercontent.com/NousResearch/hermes-agent/main/website/docs/<path>.md;
# secrets is secrets/index.md) and key phrases confirmed on the rendered pages. The repository
# security-advisories API returns an empty list unauthenticated, GHSA-3vpc-7q5r-276h and GHSA-5qr3-c538-wm9j
# (cited in the docs) return 404 publicly, and the Advisory Database has no hermes-agent entry after
# 2026-06-17; releases v0.21.2-v0.21.5 (2026-09-11 to 09-24) carry no security notes.
vendor: nous
family: Hermes Agent
tools:
  - id: toolHermes
    name: Hermes Agent
    surfaceClasses:
      - endpointCli
    architecture: archPersonalAgent
    status: ga
    asOf: "2026-09"
    summary:
      - An open-source (MIT) personal agent runtime (v0.21.5, 2026-09-24) — a competing product to OpenClaw,
        not a variant of it, with a one-command migration from it (hermes claw migrate). Its posture centres
        on per-command approval with dangerous-command detection, DM pairing, fully isolated per-profile
        state, and sandboxed execution across multiple terminal backends.
      - "The operator model is the single trusted user: whoever runs Hermes is its administrator, so every
        control below is a key in ~/.hermes/config.yaml or ~/.hermes/.env, a CLI command or an approval policy
        that user sets — the optional /etc/hermes managed scope only pins values against a non-root user and
        is advisory against the agent itself."
    items:
      - title: Approval-first execution and isolated state
        body:
          - Execution goes through command approval with dangerous-command detection — blocked actions return
            a tool error naming the denied command rather than silently proceeding — and an unknown DM gets a
            one-time pairing code the owner approves from the CLI (the FAQ still words this as the first DM
            claiming access). Profiles are fully isolated (own memory store, session database
            and skills directory), subagents run isolated, and sandboxed execution spans local, Docker, SSH,
            Singularity, Modal, Daytona and Vercel Sandbox backends with container hardening and namespace
            isolation.
          - "The governance trade-off to weigh: Hermes is a self-improving agent that writes its own skills
            from experience, which is also the feature demanding the most trust — an organisation sanctioning
            it should decide whether self-modification is acceptable and pin the approval policy accordingly."
        links:
          - title: Hermes Agent — official site
            url: https://hermes-agent.nousresearch.com/
          - title: Hermes Agent FAQ (approvals, pairing, profile isolation)
            url: https://github.com/NousResearch/hermes-agent/blob/main/website/docs/reference/faq.md
          - title: NousResearch/hermes-agent README (seven terminal backends, isolated subagents, migration)
            url: https://github.com/NousResearch/hermes-agent
    controls:
      - mitigation: cap-input-guardrails
        coverage: partial
        mechanism: >-
          Pattern scanners block flagged context files (AGENTS.md, .cursorrules, a profile-distributed SOUL.md),
          memory entries and hub, URL and project skills, and inbound A2A text is filtered and framed as untrusted;
          the transform_tool_result and pre_gateway_dispatch plugin hooks are the attach points for tool results and
          inbound channel messages
        steps:
          - title: Keep context-file scanning on and treat its blocks as findings
            body:
              - "The built-in scanner drops an AGENTS.md, .cursorrules or profile-distributed SOUL.md that carries
                ignore-prior-instructions text, hidden HTML comments, secret reads, curl exfiltration or invisible
                Unicode with a '[BLOCKED: ... potential prompt injection]' banner; your own SOUL.md loads with a
                warning in /context instead, so review any hit you did not write."
            url: https://hermes-agent.nousresearch.com/docs/user-guide/security
          - title: Screen tool results with a transform_tool_result plugin
            body:
              - "Register a transform_tool_result callback in a plugin listed under plugins.enabled; it receives
                tool_name, args and the model-bound result after every call, and the first string it returns
                replaces the result, so your classifier can quarantine a poisoned web_extract, browser or MCP result
                before the model reads it."
            url: https://hermes-agent.nousresearch.com/docs/user-guide/features/hooks
          - title: Screen inbound channel messages with pre_gateway_dispatch
            body:
              - "A pre_gateway_dispatch plugin callback sees every incoming non-internal message before
                authorization, pairing and dispatch and can return skip or rewrite, which is where an injection
                classifier for Telegram, Discord, Slack or email traffic plugs in."
            url: https://hermes-agent.nousresearch.com/docs/user-guide/features/hooks
        note: >-
          Partial by the input-screening rule: the shipped scanners are pattern heuristics (the security page calls
          them "heuristics, not semantic intent detection") on context files, memory writes and skills, and A2A input
          is labelled untrusted rather than classified. Nothing screens messaging-channel messages or web_extract,
          browser, MCP and file-read results; those need your own classifier on the transform_tool_result and
          pre_gateway_dispatch plugin hooks. tirith scans commands before they run, which is action screening and is
          credited under action policy, not here. CVE-2026-9366 and CVE-2026-10223 were bypasses of the context-file
          and memory scanners, fixed in 0.15.0.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityPromptInjectionDefense
          reviewRequired: false
          original:
            - capability: capabilityPromptInjectionDefense
              coverage: partial
              mechanism: >-
                Heuristic scanners on project context files, memory writes and inbound A2A text, plus tirith
                content scanning of shell commands before execution (security.tirith_*); nothing classifies
                fetched web or tool content
              steps:
                - title: Keep context-file scanning on
                  body:
                    - 'AGENTS.md, .cursorrules and SOUL.md are scanned for ignore-prior-instructions text, hidden HTML
                      comments, secret reads, curl exfiltration and invisible Unicode before entering the system
                      prompt; a hit is dropped with a "[BLOCKED: ... potential prompt injection]" warning, so treat
                      that banner as a finding, not noise.'
                  url: https://hermes-agent.nousresearch.com/docs/user-guide/security
                - title: Make tirith fail closed
                  body:
                    - "In ~/.hermes/config.yaml set security.tirith_enabled: true and security.tirith_fail_open: false
                      so homograph URLs, pipe-to-interpreter and terminal-injection patterns block a command when the
                      scanner is unavailable instead of letting it through (the default fails open)."
                  url: https://hermes-agent.nousresearch.com/docs/user-guide/security
                - title: Gate memory writes as well as scanning them
                  body:
                    - "Memory entries are scanned for injection and exfiltration patterns before they are accepted;
                      add memory.write_approval: true so an unprompted background save still needs your approval
                      before it can reach the next session's system prompt."
                  url: https://hermes-agent.nousresearch.com/docs/user-guide/features/memory
              note: >-
                The scanners are pattern heuristics on files, memory and commands — web_extract, browser and
                MCP results are not classified. Rely on approvals.mode manual, an isolated terminal backend
                and the egress proxy for anything a poisoned page could trigger.
              verified: 2026-09-10
      - mitigation: cap-output-guardrails
        coverage: partial
        mechanism: >-
          No built-in harm, denied-topic or blocked-term classifier; a transform_llm_output plugin hook can replace
          the final response before delivery, and model.base_url (Custom endpoint) can route inference through an AI
          gateway that applies policy to requests and responses
        steps:
          - title: Attach a response classifier with transform_llm_output
            body:
              - "Register a transform_llm_output callback in a plugin listed under plugins.enabled; it receives the
                final response_text before post_llm_call and delivery, and the first non-empty string it returns
                replaces the response, so a policy classifier can substitute a refusal."
            url: https://hermes-agent.nousresearch.com/docs/user-guide/features/hooks
          - title: Route model traffic through an AI gateway for the request leg
            body:
              - "Choose Custom endpoint in hermes model (saved in config.yaml as model.base_url) and point it at an
                OpenAI-compatible AI gateway that classifies requests and responses; route auxiliary.*.provider there
                too, since compression, vision and smart-approval calls also send conversation content to a model."
            url: https://hermes-agent.nousresearch.com/docs/integrations/providers
        note: >-
          Partial by the attach-point rule: Hermes ships no content policy of its own (the FAQ says it does not turn
          its execution controls into a content-refusal layer and that provider controls such as Amazon Bedrock
          Guardrails apply when configured), and the one hook that can change model output is transform_llm_output
          on the final response. The request leg has observer hooks only (pre_api_request ignores its return and
          pre_llm_call can only add context), so blocking a request needs an AI gateway in front of the provider;
          streamed deltas and interim messages also have observer hooks only.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityModelGuardrails
          reviewRequired: false
          original:
            - capability: capabilityModelGuardrails
              coverage: none
              mechanism: >-
                No harm-category, denied-topic or blocked-term filtering of prompts or responses ships with
                the product
              note: >-
                The only content policies are security.redact_secrets on tool output and the website_blocklist
                on URLs. To add a guardrail, register a pre_llm_call / post_llm_call hook that calls your own
                classifier, or rely on moderation at the model provider.
              evidence:
                - title: Hermes Agent — official site, reviewed; no setting for this control (2026-09-10)
                  url: https://hermes-agent.nousresearch.com/
              verified: 2026-09-10
      - mitigation: cap-sensitive-data-redaction
        coverage: partial
        mechanism: >-
          security.redact_secrets (on by default) masks credential-shaped strings in tool output before it enters
          context and logs; privacy.redact_pii hashes sender IDs and phone numbers in the gateway system prompt; A2A
          replies and MCP error text are scrubbed; transform_llm_output and pre_tool_call plugin hooks are the attach
          points for the reply and tool-call legs
        steps:
          - title: Keep secret redaction on
            body:
              - "Leave security.redact_secrets: true in ~/.hermes/config.yaml (the default) so API-key, token and
                password patterns in tool output are redacted before the model or the logs see them, and reads of
                .env files, shell rc files and config.yaml return a non-reusable «redacted-secret» marker."
            url: https://hermes-agent.nousresearch.com/docs/user-guide/configuration
          - title: Hash sender identifiers on messaging platforms
            body:
              - "Set privacy.redact_pii: true so WhatsApp, Signal and Telegram user IDs, phone numbers and chat IDs
                reach the model as user_<sha256> hashes; Discord and Slack are excluded because mentions need the
                real ID."
            url: https://hermes-agent.nousresearch.com/docs/user-guide/configuration
          - title: Inspect replies and tool-call arguments with plugin hooks
            body:
              - "Register a transform_llm_output callback (replaces the final reply) and a pre_tool_call callback
                (blocks or modifies the arguments of web_search, browser, MCP and messaging calls) in a plugin listed
                under plugins.enabled, each calling your own DLP classifier."
            url: https://hermes-agent.nousresearch.com/docs/user-guide/features/hooks
          - title: Redact before sharing history
            body:
              - "Use hermes sessions export backup.jsonl --redact for anything you hand to others; --redact scrubs API
                keys, tokens and credentials from the exported content."
            url: https://hermes-agent.nousresearch.com/docs/user-guide/sessions
        note: >-
          Partial by the redaction rule: the product detects credential-shaped strings by pattern on the way into
          the model (tool output) and scrubs A2A replies, but inspects nothing it sends — the reply to a messaging
          channel and the arguments of outbound tool calls (a web_search query, a browser form, an MCP or email call)
          carry whatever the model puts there unless your own transform_llm_output or pre_tool_call hook checks them.
          PII handling is limited to hashing sender identifiers on three platforms; security.website_blocklist and
          the SSRF guard are destination controls, not detection.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAiDlp
          reviewRequired: false
          original:
            - capability: capabilityAiDlp
              coverage: partial
              mechanism: >-
                security.redact_secrets scrubs key-shaped strings from tool output and logs,
                security.website_blocklist blocks destinations for web and browser tools, A2A replies are
                credential-redacted and session exports take --redact; no classifier on prompts or uploads
              steps:
                - title: Keep secret redaction on
                  body:
                    - "security.redact_secrets: true (the default) redacts API-key, token and password patterns in
                      tool output before they enter the conversation context or logs; set it to false only for
                      debugging."
                  url: https://hermes-agent.nousresearch.com/docs/user-guide/configuration
                - title: Block sensitive destinations
                  body:
                    - 'Set security.website_blocklist.enabled: true with domains such as "*.internal.company.com" or a
                      shared_files rule list; web_search, web_extract, browser_navigate and every URL-capable tool
                      refuse a match.'
                  url: https://hermes-agent.nousresearch.com/docs/user-guide/configuration#website-blocklist
                - title: Redact before sharing history
                  body:
                    - Use hermes sessions export --redact for anything you hand to others; outbound A2A replies are
                      scrubbed of credential-shaped strings automatically.
                  url: https://hermes-agent.nousresearch.com/docs/user-guide/sessions
              note: >-
                Detection is pattern-based and aimed at credentials; personal or business data in prompts to
                the model provider is not inspected — enforce that at the provider or a proxy in front of it.
              verified: 2026-09-10
      - mitigation: D3-APA
        coverage: partial
        mechanism: >-
          One ordered authorization check for every messaging adapter — per-platform *_ALLOW_ALL_USERS, the
          DM-pairing approved list, per-platform *_ALLOWED_USERS, GATEWAY_ALLOWED_USERS, GATEWAY_ALLOW_ALL_USERS,
          then default deny — set in ~/.hermes/.env, with unauthorized_dm_behavior in config.yaml and hermes pairing
          approve / revoke; A2A peers and the API server admit callers by their own tokens
        steps:
          - title: Keep every bridge on explicit allowlists
            body:
              - "Set GATEWAY_ALLOWED_USERS and per-platform lists such as TELEGRAM_ALLOWED_USERS or SLACK_ALLOWED_USERS
                in ~/.hermes/.env; with no list configured every user is denied, and never set GATEWAY_ALLOW_ALL_USERS,
                a per-platform *_ALLOW_ALL_USERS flag or gateway.allow_all_users: true."
            url: https://hermes-agent.nousresearch.com/docs/user-guide/security
          - title: Admit new senders by pairing, or refuse them
            body:
              - "Set unauthorized_dm_behavior: pair (or ignore / decline, per platform) in ~/.hermes/config.yaml and
                approve codes with hermes pairing approve <platform> <code>; codes expire after one hour, and five
                failed approvals lock the platform for an hour."
            url: https://hermes-agent.nousresearch.com/docs/user-guide/security
          - title: Re-check the approved list yourself
            body:
              - "A pairing approval is permanent, so review hermes pairing list on a schedule and remove anyone who
                should no longer reach the agent with hermes pairing revoke <platform> <user-id>."
            url: https://hermes-agent.nousresearch.com/docs/user-guide/security
          - title: Name the peers allowed over A2A
            body:
              - "Give each peer its own token in A2A_PEER_TOKENS, list the identities allowed to send tasks in
                A2A_TRUSTED_PEERS and leave A2A_ALLOW_ALL_USERS at false."
            url: https://hermes-agent.nousresearch.com/docs/user-guide/messaging/a2a
        note: >-
          Partial on the D3-APA rule: one default-deny decision function covers every chat bridge, but a paired
          sender is "permanently approved" — nothing expires or re-checks the approval, so revocation is manual — and
          identities are platform user IDs, not directory-bound accounts. Per-platform allow-all flags open a bridge
          wholesale, and the A2A server (A2A_TRUSTED_PEERS, A2A_PEER_TOKENS), the API server (API_SERVER_KEY),
          webhook platforms and the dashboard each admit callers by a separate mechanism, so there is no single
          admission decision across every ingress. The FAQ still describes pairing as "first user to message claims
          access"; the security page's owner-approved code flow is the documented behaviour.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityIga
          reviewRequired: false
          original:
            - capability: capabilityIga
              coverage: partial
              mechanism: >-
                Gateway user allowlists and DM pairing in ~/.hermes/.env and config.yaml (default deny),
                username/password auth on a non-loopback dashboard, API_SERVER_KEY bearer on the API server;
                no MFA or IdP integration
              steps:
                - title: Keep the gateway on explicit allowlists
                  body:
                    - Set GATEWAY_ALLOWED_USERS and per-platform lists such as TELEGRAM_ALLOWED_USERS or
                      DISCORD_ALLOWED_USERS in ~/.hermes/.env; with no allowlist configured every user is
                      denied, and the docs say never to set GATEWAY_ALLOW_ALL_USERS=true on a machine you care
                      about.
                  url: https://hermes-agent.nousresearch.com/docs/user-guide/security
                - title: Approve new senders through DM pairing
                  body:
                    - "Leave unauthorized_dm_behavior: pair in config.yaml (or ignore to drop unknown DMs
                      silently), approve codes with hermes pairing approve <platform> <code> and remove access
                      with hermes pairing revoke <platform> <user-id>; codes expire after one hour and five
                      failed approvals lock the platform for an hour."
                  url: https://hermes-agent.nousresearch.com/docs/user-guide/security
                - title: Protect a remotely reachable dashboard
                  body:
                    - A dashboard bound off loopback fails closed unless HERMES_DASHBOARD_BASIC_AUTH_USERNAME,
                      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD and HERMES_DASHBOARD_BASIC_AUTH_SECRET are set in
                      .env; --insecure no longer bypasses the gate.
                  url: https://hermes-agent.nousresearch.com/docs/user-guide/features/web-dashboard
                - title: Key the OpenAI-compatible API server
                  body:
                    - Enable it only with API_SERVER_ENABLED=true and a strong API_SERVER_KEY in
                      ~/.hermes/.env; every request must carry it as a bearer token and the server binds
                      127.0.0.1 by default.
                  url: https://hermes-agent.nousresearch.com/docs/user-guide/features/api-server
              note: >-
                Identity is platform user IDs plus static shared secrets; there is no phishing-resistant MFA,
                so put any exposed dashboard or API port behind your own identity-aware proxy.
              verified: 2026-09-10
      - mitigation: cap-agent-action-policy-enforcement
        coverage: partial
        mechanism: >-
          approvals.deny fnmatch globs over normalised terminal commands (checked before --yolo and approvals.mode
          off, on every backend) and the code-shipped hardline blocklist; HERMES_WRITE_SAFE_ROOT and the
          protected-path list for write_file and patch; security.website_blocklist for URL tools; hooks.pre_tool_call
          entries that can block, escalate or modify any tool call; all read from ~/.hermes/config.yaml or .env
        steps:
          - title: Declare commands that must never run
            body:
              - "Add quoted fnmatch globs under approvals.deny in ~/.hermes/config.yaml (for example 'git push --force*'
                or 'dd if=* of=/dev/*'); they match normalised command variants on every terminal backend before
                --yolo or approvals.mode off is consulted and return a BLOCKED error to the model."
            url: >-
              https://hermes-agent.nousresearch.com/docs/user-guide/security#user-defined-deny-rules-approvalsdeny
          - title: Fence file writes to a safe root
            body:
              - "Set HERMES_WRITE_SAFE_ROOT=/path/to/project:/home/you/.hermes so write_file and patch outside those
                prefixes are hard-blocked with no approval prompt; OS and Hermes credential stores stay blocked even
                inside the root."
            url: https://hermes-agent.nousresearch.com/docs/user-guide/security#file-write-safety
          - title: Decide every other tool call in a fail-closed pre_tool_call hook
            body:
              - "Declare hooks.pre_tool_call entries in config.yaml with a matcher regex, a command and fail_closed:
                true; the script reads the tool name and arguments as JSON and can block the call, send it to
                approval or rewrite its arguments, and a crash or timeout blocks the call."
            url: https://hermes-agent.nousresearch.com/docs/user-guide/features/hooks#shell-hooks
          - title: Pin the rules where the agent cannot write them
            body:
              - "Put approvals.deny and approvals.mode in a root-owned /etc/hermes/config.yaml, which wins over
                ~/.hermes/config.yaml for the keys it names, fix HERMES_MANAGED_DIR in the service unit and run the
                gateway as a non-root user."
            url: https://hermes-agent.nousresearch.com/docs/user-guide/managed-scope
        note: >-
          Partial: every decision is deterministic and taken outside the model, but the rules sit in
          ~/.hermes/config.yaml, which the agent's own write_file and patch can overwrite (the security page lists
          config.yaml among control files that are "read-denied but stay writable") and a local-backend terminal
          can edit, and approval-config edits apply without a restart. The vendor scopes the engine itself: deny
          rules are "a guardrail against an honest-but-wrong agent", "not a complete shell interpreter or an OS
          capability sandbox", and managed scope is "a management-convenience boundary against a normal user, not
          an un-escapable sandbox". Per-call argument rules cover terminal commands, file writes and URLs; MCP,
          browser and computer_use calls are decided only by a pre_tool_call hook you write. Unattended turns:
          cron_mode, single_query_mode and unattended_mode deny flagged commands and webhook runs get the read-only
          hermes-webhook toolset, but command_allowlist entries still run there. tirith (security.tirith_enabled,
          tirith_fail_open false) adds content scanning of commands, routed to approval.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAgentRuntimeEnforcement
          reviewRequired: false
          original:
            - capability: capabilityAgentRuntimeEnforcement
              coverage: native
              mechanism: >-
                approvals.deny glob rules and the code-shipped hardline blocklist run before --yolo or
                approvals.mode off; HERMES_WRITE_SAFE_ROOT hard-blocks writes; pre_tool_call shell and plugin
                hooks can block or escalate any tool call and fail closed
              steps:
                - title: Declare commands that must never run
                  body:
                    - Add quoted fnmatch globs under approvals.deny in ~/.hermes/config.yaml (for example "git push
                      --force*", "dd if=* of=/dev/*"); they are matched against normalised command variants on
                      every backend, return a BLOCKED error to the model and take effect without a restart.
                  url: >-
                    https://hermes-agent.nousresearch.com/docs/user-guide/security#user-defined-deny-rules-approvalsdeny
                - title: Fence file writes to a safe root
                  body:
                    - Set HERMES_WRITE_SAFE_ROOT=/path/to/project:/home/you/.hermes in ~/.hermes/.env; write_file
                      and patch outside those prefixes are hard-blocked with no approval prompt, and credential
                      paths such as ~/.ssh and .env stay blocked even inside the root.
                  url: https://hermes-agent.nousresearch.com/docs/user-guide/security#file-write-safety
                - title: Add a pre_tool_call policy hook
                  body:
                    - 'Declare hooks.pre_tool_call entries in config.yaml with a matcher regex, a command and
                      fail_closed: true; the script reads the tool call as JSON on stdin and blocks it by returning
                      {"action": "block", "message": ...} or exiting 2, and a timeout blocks rather than proceeds.'
                  url: https://hermes-agent.nousresearch.com/docs/user-guide/features/hooks#shell-hooks
                - title: Keep the approval mode manual on a work machine
                  body:
                    - "Set approvals.mode: manual so every flagged command prompts you instead of the smart mode's
                      auxiliary-LLM auto-approval, and leave approvals.timeout at 300 so an unanswered prompt is
                      denied."
                  url: https://hermes-agent.nousresearch.com/docs/guides/secure-hermes-on-a-work-machine
              note: >-
                Deny globs and the hardline blocklist are deterministic; pre_tool_call hooks are an
                integration point that must be set fail_closed. Delegated subagents inherit approvals; MCP
                tool calls pass the hooks, a server's own actions do not.
              verified: 2026-09-10
      - mitigation: D3-MAN
        coverage: partial
        mechanism: >-
          hermes dashboard binds 127.0.0.1:9119 behind a DNS-rebinding Host-header guard and, off loopback, refuses to
          start without a password, OAuth or OIDC provider (dashboard.basic_auth or HERMES_DASHBOARD_BASIC_AUTH_*),
          but has no login on loopback; the API server binds 127.0.0.1:8642 and requires API_SERVER_KEY even there;
          the A2A server binds 127.0.0.1 until a token is set
        steps:
          - title: Keep the dashboard on loopback and tunnel to it
            body:
              - "Run hermes dashboard without --host so it binds 127.0.0.1 and reach it over an SSH tunnel or
                Tailscale; --insecure is a no-op and no longer disables authentication."
            url: https://hermes-agent.nousresearch.com/docs/user-guide/features/web-dashboard
          - title: Configure an auth provider before any remote bind
            body:
              - "Set HERMES_DASHBOARD_BASIC_AUTH_USERNAME, HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH and
                HERMES_DASHBOARD_BASIC_AUTH_SECRET (or the OAuth or OIDC provider) before --host 0.0.0.0 or a
                non-loopback public URL; without one the dashboard fails closed at startup."
            url: https://hermes-agent.nousresearch.com/docs/user-guide/features/web-dashboard
