  - id: toolCodexCloud
    name: Codex cloud
    surfaceClasses:
      - cloudAgent
      - ciIntegration
      - chatIntegration
    variants:
      - name: Codex cloud (web, chatgpt.com/codex)
        class: cloudAgent
        url: https://learn.chatgpt.com/docs/cloud
      - name: Codex GitHub connector and code review (@codex review, security review preview)
        class: ciIntegration
        url: https://learn.chatgpt.com/docs/third-party/github
      - name: Codex GitLab connector (Beta)
        class: ciIntegration
        url: https://learn.chatgpt.com/docs/third-party/gitlab
      - name: Codex in Slack
        class: chatIntegration
        url: https://learn.chatgpt.com/docs/third-party/slack
      - name: Codex in Linear
        class: chatIntegration
        url: https://learn.chatgpt.com/docs/third-party/linear
      - name: Scheduled tasks (automations)
        class: cloudAgent
        url: https://learn.chatgpt.com/docs/automations
    architecture: archManagedAgentRuntime
    status: ga
    asOf: "2026-09"
    summary:
      - >-
        Codex cloud runs coding tasks in OpenAI-hosted containers built from the universal image
        plus a per-environment setup script, checked out from a GitHub or GitLab repository and
        started from the web, the IDE extension, Slack, Linear, a pull request comment or a
        schedule. The same hosted harness is what ChatGPT Work calls Work Cloud, which the vendor
        describes as VM-backed sandboxes on OpenAI infrastructure.
      - >-
        Inference and execution are both at OpenAI: the repository, environment variables and
        the prompt leave the organisation, and the agent's output returns as a diff or pull
        request for a human to merge. Internet access during the agent phase is off by default and
        is set per environment (Off, On, On with controls with a domain allowlist and GET/HEAD/
        OPTIONS-only methods); secrets are encrypted, exposed only to setup scripts and removed
        before the agent phase.
      - >-
        Admin gating is by workspace role (Work Cloud / Codex cloud toggles, GitHub connector),
        by environment (internet, repositories, secrets) and by connector setting (the Slack
        posting toggle, Codex for Linear). Compliance API records are retained 30 days; the BAA
        does not cover Codex cloud.
    facts:
      - label: Plans
        value: Cloud features require Plus, Pro, Business, Enterprise or Edu; not available on Free, Go or API-key sign-in.
        url: https://learn.chatgpt.com/docs/pricing
      - label: Inference & routing
        value: Tasks run in OpenAI-hosted containers behind an HTTP/HTTPS proxy; caches are shared across users with access to the environment on Business and Enterprise.
        url: https://learn.chatgpt.com/docs/environments/cloud-environment
      - label: Data leaving the device
        value: The repository checkout, environment variables, uploaded context, Slack thread history or Linear issue content are sent to create the cloud chat.
        url: https://learn.chatgpt.com/docs/third-party/slack
      - label: Docs index
        value: learn.chatgpt.com/docs/cloud
        url: https://learn.chatgpt.com/docs/cloud
      - label: Data retention / training
        value: Conversations follow workspace retention with deletion scheduled within 30 days; execution snapshots and Library files follow separate lifecycles; Compliance Logs Platform keeps records 30 days.
        url: https://learn.chatgpt.com/docs/enterprise/chatgpt-work-cloud-security
    riskNotes:
      - risk: riskPromptInjection
        note: >-
          The internet-access page shows hidden instructions in fetched web content driving secret
          exfiltration; the default Off and GET-only controls are the mitigation.
      - risk: riskSensitiveDataDisclosure
        note: >-
          Cached containers are shared across every user with access to the environment for up to
          12 hours, so anything a setup script writes is visible to the next user's task.
      - risk: riskRogueActions
        note: >-
          Output is a diff or PR, but automatic reviews and Slack posting act without a prompt;
          scope the GitHub app and the "post answers" toggle.
      - risk: riskToolSourceProvenance
        note: Environments and setup scripts are editable by anyone with access; they run with internet on.
    controls:
      - capability: capabilityIga
        coverage: native
        mechanism: Workspace roles (Work Cloud / Codex cloud permission) and SCIM groups
        steps:
          - title: Gate cloud execution by role
            body:
              - Workspace settings > Permissions & roles carries Work Cloud and Work Local as
                distinct toggles; enable Work Cloud selectively.
            url: https://learn.chatgpt.com/docs/enterprise/chatgpt-work-cloud-security
          - title: Provision membership from the IdP
            body:
              - SCIM provisions membership and group assignment; groups need explicit role grants
                and an Off in any role denies.
            url: https://learn.chatgpt.com/docs/enterprise/groups-and-provisioning
        verified: "2026-09-10"
      - capability: capabilityNhiManagement
        coverage: partial
        mechanism: Service accounts (SCIM userType ServiceAccount) and the GitLab service-account token
        note: Runs attribute to a service account; the GitHub App identity itself is vendor-owned.
        steps:
          - title: Create a non-human workspace identity
            body:
              - Owners and admins create service accounts with their own plugins, role and tokens;
                disabling the account revokes every token.
            url: https://learn.chatgpt.com/docs/enterprise/service-accounts
          - title: Scope the GitLab connector
            body:
              - Use an existing service account with Developer access to selected groups or
                projects; admins can revoke and regenerate its token in Codex Cloud settings.
            url: https://learn.chatgpt.com/docs/third-party/gitlab
        verified: "2026-09-10"
      - capability: capabilitySecretsManagement
        coverage: native
        mechanism: Environment secrets (encrypted, setup-script only) versus environment variables
        steps:
          - title: Put credentials in Secrets, not variables
            body:
              - Secrets get an additional layer of encryption, are only available to setup
                scripts and are removed before the agent phase; environment variables persist.
            url: https://learn.chatgpt.com/docs/environments/cloud-environment
        verified: "2026-09-10"
      - capability: capabilityEncryptionKeyManagement
        coverage: partial
        mechanism: Vendor-managed encryption under the SOC 2 / ISO 27001 scope; residency settings honoured
        note: No customer-managed key for ChatGPT workspaces is documented; Enterprise Key Management is an API-platform feature.
        steps:
          - title: Confirm scope from the trust portal
            body:
              - SOC 2 Type 2 (2025-07-01 to 2026-06-30) covers ChatGPT Enterprise, Edu and Team.
            url: https://trust.openai.com/
        verified: "2026-09-10"
      - capability: capabilityAgentRegistry
        coverage: partial
        mechanism: Environments page and connector settings at chatgpt.com/codex/settings
        note: Environments, repositories and connectors are listed centrally; there is no approval workflow or ownership record beyond who can edit.
        steps:
          - title: Review environments
            body:
              - Each environment fixes the repository, image, setup script, secrets and internet
                mode; customise them from Codex settings.
            url: https://learn.chatgpt.com/docs/environments/cloud-environment
        verified: "2026-09-10"
      - capability: capabilityStagedRollout
        coverage: partial
        mechanism: Per-environment configuration and branch/commit checkout
        note: Environment definitions are not versioned and have no rollback; the reviewable diff is the release gate.
        steps:
          - title: Pin the checkout
            body:
              - Codex checks out the repository at the selected branch or commit SHA; containers
                cache up to 12 hours.
            url: https://learn.chatgpt.com/docs/environments/cloud-environment
        verified: "2026-09-10"
      - capability: capabilityToolPermissionScoping
        coverage: native
        mechanism: Per-environment internet mode and plugin action controls
        steps:
          - title: Set internet to Off or On with controls
            body:
              - Choose Off, On or On with controls per environment; presets are None, Common
                dependencies or All, and methods can be restricted to GET, HEAD and OPTIONS.
            url: https://learn.chatgpt.com/docs/cloud/internet-access
          - title: Restrict connected-app actions
            body:
              - Action control allows read-only, all or a custom set per connection, including
                how newly added actions are handled.
            url: https://learn.chatgpt.com/docs/enterprise/apps-and-connectors
        verified: "2026-09-10"
      - capability: capabilityHitlControls
        coverage: native
        mechanism: Diff / PR review before merge and website approval levels (Always ask, Auto approve, Always allow)
        steps:
          - title: Keep the merge with a human
            body:
              - Tasks return a diff to inspect before merging; automatic reviews only post
                comments.
            url: https://learn.chatgpt.com/docs/cloud
          - title: Limit website approval levels
            body:
              - Administrators can limit the approval settings users may pick; Always allow removes
                interactive review without expanding app permissions.
            url: https://learn.chatgpt.com/docs/enterprise/chatgpt-work-cloud-security
        verified: "2026-09-10"
      - capability: capabilityPromptInjectionDefense
        coverage: partial
        mechanism: Internet off by default, GET-only method allowlist, automated risk checks on Auto approve
        note: The vendor documents the injection path explicitly; there is no admin-configurable detector.
        steps:
          - title: Leave agent-phase internet off
            body:
              - Setup scripts keep internet; the agent phase is blocked by default and the page
                shows a hidden-instruction exfiltration example.
            url: https://learn.chatgpt.com/docs/cloud/internet-access
        verified: "2026-09-10"
      - capability: capabilityAiTprm
        coverage: external
        mechanism: Trust portal evidence into the organisation's TPRM platform
        note: Codex cloud is inside the ChatGPT Enterprise SOC 2 scope; the HIPAA page states the BAA does not cover Codex cloud.
        steps:
          - title: Record the BAA exclusion
            body:
              - Do not use Codex cloud with PHI; the BAA does not cover it.
            url: https://learn.chatgpt.com/docs/hipaa-configuration
        verified: "2026-09-10"
      - capability: capabilityAgentObservability
        coverage: partial
        mechanism: Task logs and diffs in the web UI; Compliance API export of Work prompts and responses
        note: Not structured traces; connected-app calls are logged separately and source-system audits vary.
        steps:
          - title: Export prompts and responses
            body:
              - Enterprise and Edu export supported Work prompts and responses through the
                Compliance Logs Platform (30-day retention).
            url: https://learn.chatgpt.com/docs/enterprise/chatgpt-work-cloud-security
        verified: "2026-09-10"
      - capability: capabilityAuditLogging
        coverage: partial
        mechanism: Compliance API (30-day source retention) and Analytics API
        steps:
          - title: Pull compliance records continuously
            body:
              - Set COMPLIANCE_API_KEY and export on a schedule; the source retention window does
                not replace your retention policy.
            url: https://learn.chatgpt.com/docs/enterprise/compliance-api
          - title: Use the Analytics API for aggregates only
            body:
              - It returns aggregated Codex usage per workspace with a Platform organisation key;
                audit needs the Compliance API.
            url: https://learn.chatgpt.com/docs/enterprise/analytics-api
        verified: "2026-09-10"
      - capability: capabilityModelGuardrails
        coverage: partial
        mechanism: Vendor safety review pauses a task
        note: Tasks may pause for safety review with findings to read; no admin-defined topic or term filters.
        steps:
          - title: Expect safety pauses
            body:
              - Follow the notice and review findings before continuing.
            url: https://learn.chatgpt.com/docs/get-started-with-work
        verified: "2026-09-10"
      - capability: capabilityMemoryProtection
        coverage: partial
        mechanism: Container cache lifetime and workspace retention
        note: Caches are shared across all users with access to the environment; treat setup-script writes as shared state.
        steps:
          - title: Know the cache scope
            body:
              - Containers cache up to 12 hours and, on Business and Enterprise, are shared across
                users of the environment.
            url: https://learn.chatgpt.com/docs/environments/cloud-environment
        verified: "2026-09-10"
      - capability: capabilityModelEvals
        coverage: none
        mechanism: Not offered
        note: No customer-run evaluation harness for the hosted agent; run your own against the PR output.
        verified: "2026-09-10"
      - capability: capabilityAiGovernancePlatform
        coverage: external
        mechanism: Workspace analytics and the Analytics API feed an external governance system
        note: The Codex analytics dashboard at admin.openai.com/analytics/codex is adoption reporting, not a system of record.
        verified: "2026-09-10"
      - capability: capabilityRateLimiting
        coverage: partial
        mechanism: Plan rate limits, credits and workspace usage limits / spend controls
        steps:
          - title: Set usage limits
            body:
              - Enterprise and Edu manage usage limits and overage; Business manages credits;
                user-level guardrails and notifications are plan-dependent.
            url: https://learn.chatgpt.com/docs/enterprise/usage-limits
        verified: "2026-09-10"
      - capability: capabilityKillSwitch
        coverage: native
        mechanism: Work Cloud role toggle, connector revocation, service-account disable
        steps:
          - title: Turn Work Cloud off
            body:
              - Set the Work Cloud permission to Off in Permissions & roles.
            url: https://learn.chatgpt.com/docs/enterprise/chatgpt-work-cloud-security
          - title: Cut the Slack and Linear paths
            body:
              - Disable "Allow Codex Slack app to post answers on task completion" and Codex for
                Linear in connector settings.
            url: https://learn.chatgpt.com/docs/third-party/slack
        verified: "2026-09-10"
      - capability: capabilityVendorAssurance
        coverage: external
        mechanism: Compliance, Analytics and Admin APIs consumed by an SSPM product
        note: The vendor exposes the streams; posture checking against your policy is a third-party product.
        verified: "2026-09-10"
    advisories:
      - title: "CVE-2025-59532 (GHSA-w5fx-fh39-j5rw): sandbox bypass in the Codex runtime, fixed 0.39.0 — the seed's 'cloud branch-name injection' label did not match the advisory text"
        url: https://github.com/advisories/GHSA-w5fx-fh39-j5rw
        date: "2025-09"
