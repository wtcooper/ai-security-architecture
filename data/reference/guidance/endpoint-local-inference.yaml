# Controls guidance for the local model runtime archetype. Audience: admins, architects and
# security teams. Individuals install these runtimes themselves, so governing the archetype
# means publishing a sanctioned posture and finding the installs that never asked. The build's
# derivation check fails this document if its cited capabilities stop being pinned.
archetype: archLocalInference
mode: use
status: draft
attribution: >-
  Authored in this repository. Pattern-level by design; runtime products are named only in
  cited sources, not in the items.

overview:
  - >-
    A local model runtime is a network service one person installs in an afternoon: it binds a
    port, speaks an OpenAI-compatible API, and in the flagship implementations ships without
    authentication by design — the vendors point at VPNs and reverse proxies rather than
    shipping auth. Everything a hosted API supplied — guardrails, rate limits, abuse
    monitoring, patching — is absent unless the device owner adds it, and the organisation's
    problem starts with not knowing the runtime exists.
  - >-
    Two facts should anchor the policy. Exposure is real and growing: internet scans keep
    finding these runtimes by the tens of thousands, bound to routable interfaces by users who
    never made that decision consciously. And the model files themselves are attack surface:
    formats that execute code on load, native parsers whose memory bugs are a code-execution
    class, and embedded templates that execute at inference time.

items:
  - title: Publish a sanctioned runtime posture, and enforce it from the device
    capabilities: [capabilityAiGovernancePlatform, capabilityTransportSecurity]
    body:
      - >-
        Take a position: whether local inference may run at all, on which runtimes, bound to
        loopback only, with authentication in front of the port — a reverse proxy or
        token-authenticated wrapper where the runtime itself refuses to ship auth. Locality is
        not authorization: a browser tab is local too, and a permissive cross-origin policy
        lets any visited page drive the runtime. Device management is the enforcement point,
        because there is no server side to enforce from.

  - title: Put format policy and scanning in front of the fetch
    capabilities: [capabilityModelScanning, capabilityModelWeightProtection]
    body:
      - >-
        The runtime is usually the thing doing the fetching, so the control must sit in front
        of it: safe-by-construction tensor formats required, executable formats refused, and
        scanning before load — a scan after the runtime opens the file has documented an
        incident, not prevented one. Treat "safe" formats as reduced surface rather than no
        surface: their native parsers carry their own code-execution bug class. Protect the
        artifacts on disk with restrictive permissions and integrity checks, so a swapped
        file is detectable.

  - title: Replace the provider floor the callers assume is there
    capabilities: [capabilityModelGuardrails, capabilityModelEvals, capabilityRateLimiting]
    body:
      - >-
        Local applications call the local API the way they would a hosted one, assuming a
        safety floor that is not there. Where local inference is sanctioned for real use,
        require the missing pieces on the request path: input and output classification, a
        per-caller rate bound on the shared unmetered port, and an evaluation of what the
        weights actually do before other software builds on them — there is no provider
        evaluation to inherit, and refusal behaviour is removable by fine-tune.

  - title: Inventory what is running, and find what never registered
    capabilities: [capabilityAiBom, capabilityShadowAiDiscovery]
    body:
      - >-
        Every response to a bad model release, a parser CVE or an exposure report presumes the
        organisation knows which machines run which runtimes serving which models from which
        sources. Build that inventory from the device — process, port and model-file telemetry
        — rather than from self-reporting, because this archetype spreads one install at a
        time and appears in no procurement record.

sources:
  - title: "Cisco Talos — detecting exposed LLM servers: a Shodan case study on Ollama"
    url: https://blogs.cisco.com/security/detecting-exposed-llm-servers-shodan-case-study-on-ollama
  - title: "llama.cpp security advisories — GGUF parser memory-safety class"
    url: https://github.com/ggml-org/llama.cpp/security
  - title: "CISA and NSA — deploying AI systems securely"
    url: https://www.cisa.gov/resources-tools/resources/deploying-ai-systems-securely
