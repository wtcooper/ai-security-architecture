# Claude in Chrome — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# Fetch log 2026-09-10: trust.anthropic.com and trust.anthropic.com/resources render client-side
# and returned only a page title (certifications taken from privacy.claude.com instead);
# www.anthropic.com/trust and www.anthropic.com/security 404; chromeenterprise.google/policies
# returned navigation only (policy text taken from the Chromium policy_definitions source and
# support.google.com/chrome/a); support.google.com/chrome/a/answer/9945456 404;
# cloud.google.com/chrome-enterprise-premium/docs 301 -> docs.cloud.google.com.
vendor: anthropic
family: Claude in Chrome
tools:
  - id: toolClaudeChrome
    name: Claude in Chrome (Claude for Chrome)
    surfaceClasses:
      - browserExtension
    variants:
      - name: Claude in Chrome side panel (runs as a Cowork session on Max/Team, rolling out to Pro)
        class: browserExtension
        url: https://support.claude.com/en/articles/12012173-get-started-with-claude-in-chrome
      - name: Browser tools for Claude Code (claude --chrome, VS Code extension)
        class: browserExtension
        url: https://code.claude.com/docs/en/chrome
        note: >-
          Exposed to Claude Code as the claude-in-chrome MCP server over a native messaging host and
          bridge.claudeusercontent.com; requires a claude.ai login (not API keys or third-party providers).
      - name: "Browser use from Cowork (Preferred browser: Claude in Chrome or the built-in browser)"
        class: browserExtension
        url: >-
          https://support.claude.com/en/articles/16635803-set-up-browser-use-in-claude-cowork-for-team-and-enterprise-plans
    architecture: archAgenticBrowser
    status: ga
    asOf: "2026-09"
    summary:
      - >-
        A Chrome extension (Chrome Web Store id fcoeoabgfenejglbffodgkkbkcdhcgfn, version 1.0.91 on 4
        September 2026) that lets Claude read, click, type and navigate in the user's own browser with the
        user's live login state, from the side panel, from Cowork, or as tools for Claude Code. Inference runs
        on the Anthropic API under the signed-in claude.ai account (Pro, Max, Team, Enterprise); page content,
        screenshots and actions leave the browser to Anthropic, and side-panel sessions are saved to history
        and synced across devices. It is the vendor-extension shape of the browser-agent drawing: no runtime
        of its own, the browser's APIs as its tools, and the profile's cookie jar as its credential, so the
        controls that bound it are the managed profile, browser extension policy and the secure web gateway
        the organisation supplies, plus the site lists and toggle in the vendor console.
      - >-
        Anthropic's safeguards are model training, injection and action-screening classifiers, default-blocked
        site categories (adult, piracy; financial sites need explicit permission), prohibited actions
        (purchases, account creation, captcha solving, permanent deletions, "completing instructions from
        emails or web content") and always-confirm actions (downloads, sensitive data entry, granting
        authorisations). Admin controls sit in the claude.ai console at Organization settings > Claude in
        Chrome: an org enable toggle (on by default on Team; on Enterprise it turns on by default starting 10
        September 2026 unless an owner already turned it off), site allowlists and blocklists that override
        user permissions, a per-role capability on Enterprise, and forceLoginOrgUUID as a Chrome enterprise
        policy. Users choose Manually approve, Automatically approve or Skip all approvals per task; the
        console does not pin the mode. Zero data retention is not supported for Claude in Chrome, and the
        product does not yet honour role-level model or effort restrictions.
    facts:
      - label: Plans
        value: >-
          Pro, Max, Team and Enterprise; extension 1.0.36+ for Claude Code; not through Bedrock, Vertex or
          Foundry.
        url: https://code.claude.com/docs/en/chrome
      - label: Inference & routing
        value: >-
          Anthropic API with the claude.ai login; Claude Code sessions reach the extension through
          bridge.claudeusercontent.com, which must share the proxy egress used for claude.ai when IP
          allowlisting is on.
        url: https://code.claude.com/docs/en/network-config
      - label: Data leaving the device
        value: >-
          Page content, DOM and screenshots of the tabs Claude works in, console and network readers when
          used, and uploaded files (up to 10 MB) go to Anthropic; GIF recordings capture everything visible
          including logged-in account details.
        url: https://code.claude.com/docs/en/chrome
      - label: Retention & training
        value: >-
          Follows the account's plan policy (commercial: no training, 30-day retention); side-panel sessions
          are Cowork sessions saved to history; zero data retention is not supported for Claude in Chrome.
        url: https://support.claude.com/en/articles/13065128-claude-in-chrome-admin-controls
      - label: Docs index
        value: >-
          support.claude.com Claude in Chrome articles (get started, safety, permissions, admin controls) and
          code.claude.com/docs/en/chrome
        url: https://support.claude.com/en/articles/13065128-claude-in-chrome-admin-controls
      - label: Network requirements
        value: >-
          claude.ai, api.anthropic.com, platform.claude.com and wss://bridge.claudeusercontent.com; the bridge
          must leave through the same proxy egress as claude.ai when IP allowlisting is enabled, or that
          egress address must be on the org allowlist.
        url: https://code.claude.com/docs/en/network-config
      - label: Supported browsers
        value: >-
          The support article says only Google Chrome; the Claude Code page says Chrome and Edge, with
          detection in Brave, Arc, Vivaldi and Opera (not WSL). Plan for the wider set.
        url: https://support.claude.com/en/articles/12012173-get-started-with-claude-in-chrome
      - label: Usage & model governance
        value: >-
          Side-panel work consumes as Cowork agentic work against organisation, group and user spend limits
          (managed under Organization settings > Cowork); model access and effort-level restrictions by role
          do not yet apply to Claude in Chrome.
        url: https://support.claude.com/en/articles/14782391-claude-enterprise-consumption-guide
      - label: Extension permissions
        value: >-
          Requests sidePanel, storage, scripting, debugger, tabGroups, tabs, alarms, notifications,
          system.display, webNavigation, declarativeNetRequestWithHostAccess, offscreen, nativeMessaging,
          downloads and unlimitedStorage; the Web Store listing declares handling of personal communications,
          web history, user activity and website content.
        url: https://support.claude.com/en/articles/12012173-get-started-with-claude-in-chrome
    riskNotes:
      - risk: riskPromptInjection
        note: >-
          Web content is the attack surface; ShadowPrompt (March 2026, fixed 1.0.41) let any site inject
          prompts through a trusted *.claude.ai subdomain, and Anthropic's own safety article says the risk of
          a successful attack "is not zero". Allowlists and separate browser profiles are the practical
          containment.
      - risk: riskAgenticDelegationConfusedDeputy
        note: >-
          Claude acts inside every session the user is logged into (Gmail, GitHub, Drive, banking if
          permitted) with no separate identity; ClaudeBleed (May 2026) showed another zero-permission
          extension could issue commands to it.
      - risk: riskInsecureIntegratedComponent
        note: >-
          The extension requests debugger, scripting, nativeMessaging and downloads permissions and updates
          automatically from the Chrome Web Store (1.0.91 on 4 September 2026); the native messaging host for
          Claude Code is started by the browser, outside Claude Code's corporate launcher.
      - risk: riskRogueActions
        note: >-
          "Skip all approvals" disables safety checks entirely; "Automatically approve" is the Cowork default
          and nothing in the admin console pins the mode. Publishing, sending messages and payments still
          require confirmation in the approving modes.
      - risk: riskSensitiveDataDisclosure
        note: >-
          Screenshots and page text of authenticated apps leave the browser; Anthropic advises against use for
          financial, legal, medical or regulated data, and zero data retention is not available for this
          product.
