pattern: archPersonalAgent
reviewed: "2026-11-24"
summary: >-
  A personal agent is a daemon that listens, acts on a timer with nobody watching, and rereads its
  memory files as instructions, holding the owner's pasted keys and accounts on a device it runs
  on as the user. In 2026 tens of thousands of such gateways were found reachable from the
  internet, a web page could take one over through the owner's own browser, and hundreds of
  malicious skills on its public hub delivered a stealer. No console can switch any of it off, so
  the controls that matter wrap the whole agent: a sandbox holding no keys, and a gateway that adds
  them on the way out.
concentrates: >-
  A daemon on the host with pasted keys, skills from a public hub, open egress and a heartbeat: one
  hostile page, message or skill then runs as the owner, persists in memory and re-runs unattended
  until someone kills the process.
scope: >-
  A user assembles a personal agent (for example OpenClaw) on a work device: a daemon with chat
  bridges, a heartbeat, memory files, skills from a public hub and pasted long-lived keys, run on
  the host with no sandbox, no gateway and its control port and pairing at their defaults.
lists: [owasp-llm-2026, owasp-agentic, owasp-mcp]
assets:
  - "The device, and everything readable as the owner: files, keychains, SSH keys, sessions"
  - "Pasted model keys and the chat platform tokens the bridges hold"
  - "The owner's accounts and the organisation's records the agent can reach"
  - "Memory and startup files the agent reads back as instruction"
  - "What the agent sends: replies to chats, requests to the web, calls to models"
actors:
  - who: "Anyone who can reach the control port"
    access: "A host on the internet, or a web page in the owner's browser calling a loopback gateway"
    wants: "Commands on the host, the owner's credentials"
  - who: "Publisher of a skill on a public hub"
    access: "A skill the owner or the agent installs into the agent's own process, admitted on its own description"
    wants: "A stealer on the device, persistence"
  - who: "A sender the chat platform admits"
    access: "Any group member, forwarded contact or phone number a bridge's pairing record lets through"
    wants: "To instruct an agent that holds someone else's keys"
  - who: "Author of content the agent reads"
    access: "Writes a page, document or record the agent fetches on a turn nobody reads"
    wants: "Persistent control of the agent"
  - who: "The agent itself, no adversary"
    access: "The owner's whole reach, on a heartbeat"
    wants: "None; loses a constraint, acts past its task, ignores a stop"
threats:
  - id: T1
    title: "The control port or dashboard lets a stranger drive the agent"
    rating: critical
    evidence: observed
    story: >-
      The daemon listens. Scans in early 2026 found tens of thousands of gateways reachable from the
      internet, many without authentication; one link could leak the gateway token, and a web page
      could brute-force a loopback gateway through the owner's own browser. Each gave commands on
      the host.
    at: [harness, owner->harness]
    risks: [riskInsecureIntegratedComponent, riskShadowAndUnknownAgents]
    atlas: [AML.T0132, AML.T0049, AML.T0091.000]
    owasp: [ASI03, ASI05, MCP07:2025]
    controls: [D3-MAN, D3-EI, cap-shadow-ai-discovery, D3-PA]
    incidents: [personal-agent-exposure]
  - id: T2
    title: "A malicious skill from the public hub runs as the owner"
    rating: critical
    evidence: observed
    story: >-
      Skills are prose plus code, admitted on the publisher's own description and installed into
      the agent's own process. Hundreds of malicious skills were found on one agent's hub in 2026,
      most fetching a stealer through a 'prerequisites' step no model scanner inspects, and some
      outlasted the scanning added afterwards.
    at: [toolPlane->registry, sources->registry, toolPlane]
    risks: [riskToolSourceProvenance, riskToolRegistryTampering, riskInsecureIntegratedComponent]
    atlas: [AML.T0115.002, AML.T0010.005, AML.T0011.002]
    owasp: [LLM04:2026, ASI04, MCP03:2025, MCP04:2025, MCP09:2025]
    controls: [cap-mcp-tool-integrity, D3-FA, D3-EI, cap-agent-egress-control]
    incidents: [personal-agent-exposure]
  - id: T3
    title: "Injected content runs unattended and persists in memory"
    rating: critical
    evidence: research
    story: >-
      A fetched page, a document or a message tells the agent to run a script and write
      instructions into its memory or startup files. The next turn reads them as its own and the
      heartbeat re-runs them with nobody watching: researchers turned the agent into a
      command-and-control client this way.
    at: [toolPlane->openWeb, toolPlane->memory, memory, harness]
    risks: [riskPromptInjection, riskInsecureModelOutput]
    atlas: [AML.T0051.001, AML.T0080.000, AML.T0094, AML.T0050]
    owasp: [LLM01:2026, LLM10:2026, ASI01, ASI06, MCP05:2025, MCP06:2025]
    controls: [AML.M0031, cap-input-guardrails, cap-output-guardrails, cap-agent-action-policy-enforcement, D3-EI]
  - id: T4
    title: "Pasted keys and the owner's sessions are taken from the host"
    rating: high
    evidence: observed
    story: >-
      Model keys, platform tokens and the owner's accounts sit in files the agent and its skills can
      read. An exposed gateway's configuration gave a researcher credentials to connected apps, and
      the hub's stealer took keychains, SSH keys and chat sessions; with no gateway, nothing narrows
      a key to a task.
    at: [harness, harness->gateway, gateway->internalTools]
    risks: [riskSensitiveDataDisclosure, riskAgenticDelegationConfusedDeputy, riskCrossTenantCredentialPropagation]
    atlas: [AML.T0083, AML.T0055, AML.T0098]
    owasp: [LLM02:2026, ASI03, MCP01:2025, MCP02:2025]
    controls: [D3-CH, D3-CTS, D3-EI, cap-agent-kill-switch]
    incidents: [personal-agent-exposure]
  - id: T5
    title: "Anyone the chat platform admits can instruct the agent"
    rating: high
    evidence: theoretical
    story: >-
      Each bridge decides who reaches the loop, and its pairing record is the owner's to widen. A
      group member, a forwarded contact or a phone number then writes model input to an agent
      holding the owner's keys and tools, and the reply goes wherever the message named, past any
      gateway.
    at: [relay->platform, bridges->relay, bridges->harness]
    risks: [riskPromptInjection, riskSensitiveDataDisclosure]
    atlas: [AML.T0051.000, AML.T0086]
    owasp: [LLM01:2026, ASI01, ASI09, MCP10:2025]
    controls: [D3-APA, cap-input-guardrails, cap-sensitive-data-redaction]
  - id: T6
    title: "Unattended turns act on the owner's accounts and do not stop"
    rating: high
    evidence: observed
    story: >-
      The heartbeat starts turns nobody reads, on tokens with the owner's whole reach. Told only to
      suggest what to archive, one owner's agent began deleting hundreds of emails in 2026 and
      ignored 'STOP' sent from her phone; she had to reach the machine to kill it.
    at: [harness, gateway->internalTools, internalTools->orgData]
    risks: [riskRogueActions, riskRunawayAgentToolLoops, riskAgenticDelegationConfusedDeputy]
    atlas: [AML.T0101, AML.T0053, AML.T0034.002]
    owasp: [LLM03:2026, LLM06:2026, ASI02, ASI10]
    controls: [cap-agent-kill-switch, cap-agent-action-policy-enforcement, AML.M0029, AML.M0036, D3-CTS]
    incidents: [personal-agent-exposure]
    refs:
      - { title: "TechCrunch: an OpenClaw agent ran amok on a Meta researcher's inbox", url: "https://techcrunch.com/2026/02/23/a-meta-ai-security-researcher-said-an-openclaw-agent-ran-amok-on-her-inbox/" }
coverage:
  - { id: "LLM05:2026", why: "Memory written by injected content is T3; the agent trains no model, and the provider's model is the provider's." }
  - { id: "LLM07:2026", why: "A wrong answer matters less than a wrong action taken on a heartbeat, which T6 covers." }
  - { id: "LLM08:2026", why: "The agent's startup files are the owner's; an attacker gains more by writing them (T3) than by reading them." }
  - { id: "LLM09:2026", why: "Memory here is files read back whole as context, not an embedding index; T3 covers what is written to them." }
  - { id: "ASI07", why: "One agent per daemon in this drawing; agents built on the same harness that message each other belong to the multi-agent patterns." }
  - { id: "ASI08", why: "One owner's agent; harm spreading to other agents or systems has no incident here beyond the stolen keys in T4." }
  - { id: "MCP08:2025", why: "With no gateway the daemon's own log is the only record; no threat here turns on a missing log, and the gateway's trace answers it." }
questions:
  - "Do you know which devices run a personal agent, and how would you find one nobody registered?"
  - "What is the control port bound to, does every client present a token, and can a web page in the owner's browser reach it?"
  - "Where do skills come from: signed, pinned and reviewed for behaviour, or installed from a public hub on their description?"
  - "Does the agent run inside a sandbox it cannot edit, with no keys inside and only the gateway, mirror and relay as ways out?"
  - "Who may message the agent on each bridge, and can the owner widen that without anyone seeing?"
  - "Can the agent write its own startup rules, and is each memory's source recorded and reviewable?"
  - "What may an unattended turn do, and can you revoke the agent's identity and stop its schedule from outside in seconds?"
