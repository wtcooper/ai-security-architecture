# Microsoft Foundry Agent Service — one entity per product × reference architecture. Facts are dated (asOf)
# and cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# Exclusions: Foundry workflows (the portal's visual low-code builder) are in preview and retire on 2026-12-01, so
# they are recorded as a fact here and not onboarded on the low-code drawing. Microsoft Agent Framework (the SDK
# Microsoft names as the workflow replacement) is an SDK the customer hosts or packs into a hosted agent, not this
# runtime. Classic agents and Azure OpenAI Assistants are the predecessor surface (a tag disables them; recorded as
# a setting). Microsoft Copilot Studio is its own entity (toolCopilotStudio). Foundry Models, Foundry IQ (Azure AI
# Search), Foundry Memory, Toolbox, guardrails (RAI policies), Foundry governance (formerly Foundry Control Plane),
# Microsoft Entra Agent ID, Microsoft Agent 365 and AI Gateway are components or planes recorded on this entity's
# rows, not entities. Foundry Canvas (preview, a GitHub Copilot App extension) and the Foundry Toolkit for Visual
# Studio Code are authoring tools with no admin surface of their own. Autopilots (an agent with its own Entra agent
# user account through Agent 365) and routines (one trigger, one agent) are recorded as facts.
# Rating convention used in this file: a row is native only where a mechanism Microsoft documents without a preview
# label meets the architecture's rule; where the deciding mechanism is preview-only (Memory, cost controls, agent
# guardrails at tool call and tool response, project tool controls, tool and agent-kind policies) the row is partial
# and says so.
# 2026-11-18: onboarded. About 120 pages read as markdown (Accept: text/markdown) from the docs tree listed in
# learn.microsoft.com/en-us/azure/foundry/toc.json, all 200 unless listed here. Redirects and misses:
# /azure/ai-foundry/agents/overview -> /azure/foundry/agents/overview (the whole tree moved from ai-foundry to
# foundry; older links inside pages still say ai-foundry); agents/concepts/foundry-agent-canvas (as the table of
# contents links it) -> agents/concepts/foundry-canvas; how-to/configure-capability-settings ->
# agents/environment-setup; foundry/how-to/disable-local-auth 404 (the page is /azure/ai-services/disable-local-auth);
# azure.microsoft.com/pricing/details/foundry-agent-service/ -> /en-us/pricing/details/foundry-agent-service/ and
# pricing/details/ai-foundry/ -> /en-us/pricing/details/microsoft-foundry/ (pricing pages not read for rates).
# msrc.microsoft.com/update-guide pages render client-side; the four advisories were read from
# msrc.microsoft.com/csaf/advisories/2026/msrc_cve-<id>.json. servicetrust.microsoft.com answers 200 but its reports
# need sign-in, so no certification list is asserted. Pages disagree on traffic splitting between agent versions:
# agents/how-to/deploy-hosted-agent-production (2026-09-21) walks through a 90/10 canary on versionSelector, while
# agents/concepts/hosted-agents (2026-11-09), agents/how-to/manage-hosted-agent (2026-10-15) and
# agents/how-to/configure-agent (2026-10-15) say traffic splitting isn't supported; recorded on the rollout row.
# 2026-11-18 (validation pass): 17 imprecise claims corrected against the validator's pages, each reopened; the
# connection authType AgenticIdentityToken is shown on agents/how-to/tools/agent-to-agent, not on mcp-authentication;
# "legacy" for capability hosts was not found on the pages (how-to/configure-capability-settings still redirects to
# agents/environment-setup), so that row says only that the capability hosts article is retained for reference.
# The hosted agents and prompt agents pages carry no preview label and no explicit GA sentence; status rests on the
# limits page ("Foundry Agent Service is generally available (GA). Some sub-features are in public preview").
vendor: microsoft
family: Microsoft Foundry Agent Service
tools:
  - id: toolFoundryAgentService
    name: Microsoft Foundry Agent Service (prompt agents, hosted agents, Responses API)
    surfaceClasses:
      - managedRuntime
    variants:
      - name: "Prompt agents (configuration only: model, instructions, tools; Foundry runs the loop)"
        class: managedRuntime
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/prompt-agents
        note: >-
          Authored in the Foundry portal, the SDK, the REST API or azd; a saved, versioned resource in a Foundry
          project invoked through the agent's Responses endpoint. No preview label on the page.
      - name: Prompt agents on the Microsoft Copilot harness (preview)
        class: managedRuntime
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/use-tools-skills-copilot-harness
        note: >-
          Public preview. Still a prompt agent, but Foundry runs a harness with file read, file write, shell, web
          fetch and subagent tools (all five on by default) in a service-managed sandbox and a workspace per
          conversation. Chosen only at creation; no bring-your-own model and no Foundry Memory.
      - name: Voice-based prompt agents (real-time voice through Voice Live)
        class: managedRuntime
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/quickstarts/prompt-voice-agent
        note: >-
          Generally available, with GPT-Live, inline subagents and handoff, SIP, telephony campaigns and post-call
          delivery in preview behind the VoiceAgents=V1Preview opt-in. Sessions last at most 60 minutes.
      - name: Hosted agents (your code as a container image or a .zip of source, in a VM-isolated sandbox per session)
        class: managedRuntime
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/hosted-agents
        note: >-
          Agent Framework, LangGraph, OpenAI Agents SDK, Anthropic Agent SDK, Copilot SDK or custom code in Python or
          C#; Foundry supplies the endpoint, a dedicated Entra agent identity, scaling and session state. No preview
          label on the page; draft versions and the long-running resilience features are preview.
      - name: Responses API without a saved agent (ephemeral agent defined per request)
        class: managedRuntime
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/quickstarts/responses-api
        note: >-
          The definition lives in the calling application and can change on every request; there is no agent
          resource to create, update or delete in Foundry, so no harness and no prompt-agent optimizer.
    architecture: archCloudManagedAgent
    fills: [managedRuntime]
    platform: cloudAzure
    status: ga
    asOf: "2026-11"
    summary:
      - >-
        Microsoft's managed agent runtime inside Microsoft Foundry (documentation now under /azure/foundry/, moved
        from /azure/ai-foundry/; policy definitions and CVE records still say Azure AI Foundry, Azure AI Services or
        Cognitive Services). Microsoft states the service is generally available with some sub-features in public
        preview. An application calls an agent's own endpoint, whether Responses, Invocations, Invocations (WebSocket),
        Activity for Teams and Microsoft 365, A2A (v1.0 GA, v0.3 preview) or MCP (preview), with a Microsoft Entra
        token; API keys are not accepted on agent endpoints. As documented on 2026-11-18 it offers three agent types: prompt agents (configuration only,
        a model, instructions and tools, authored in the Foundry portal, SDK, REST API or azd and run by Foundry),
        voice-based prompt agents (generally available, some features in preview) and hosted agents (the
        customer's own code, shipped as a container image or as a .zip of source that Foundry builds, run in a
        VM-isolated sandbox per session). A prompt agent can instead be created on the Microsoft Copilot harness
        (preview), and an application can call the project's Responses API with no saved agent at all.
      - >-
        Workflow, multi-agent and low-code: workflows (the portal's visual, declarative builder for sequential,
        group-chat and human-in-the-loop orchestration of agents) are in preview and retire on 2026-12-01;
        Microsoft says to use Microsoft Agent Framework for new workflows, and hosted agents were never supported
        in the workflow designer. What remains for multi-agent work is orchestration written in hosted-agent code,
        the A2A tool and A2A endpoint (v1.0 generally available, v0.3 preview), subagents in the Copilot harness
        (preview) and in voice agents (inline subagents in preview), multi-agent orchestration in the Azure OpenAI
        Responses API (preview, GPT-5.6 deployments, multi_agent.enabled), routines (one timer, schedule or event
        trigger invoking one agent) and autopilots (an agent with its own Entra agent user account through Agent
        365, which needs the Agent 365 Frontier preview). No other low-code builder is documented inside the
        service: Microsoft's workflow migration guide names Azure Logic Apps as the low-code visual path, outside
        Agent Service, and Foundry Canvas (preview) is a GitHub Copilot App side panel for creating hosted agents
        and harness prompt agents, not a runtime.
      - >-
        Governance is Azure's own control plane: Azure RBAC at project or single-agent scope, a Microsoft Entra agent
        identity and blueprint per agent, connections that hold tool credentials and inject them service-side,
        guardrails (RAI policies) for content and for hosted-agent network egress, Azure Policy definitions for
        tools, agent kinds, container images and egress, and traces in the customer's own Application Insights. The
        gaps are defaults and preview status rather than missing parts: tracing is off, a hosted agent has no
        guardrail and public egress unless a policy is attached, the endpoint follows the latest version, a
        guardrail that names a missing policy fails open, and the tenant floors (project tool controls, tool,
        agent-kind, image and egress policies, cost controls) are preview, several only in three regions.
    facts:
      - label: Plans
        value: >-
          Pay per use on an Azure subscription: per-call model inference and tool usage for prompt agents, plus
          container compute (CPU and memory during active sessions) for hosted agents; Code Interpreter per
          session, file search by vector storage, Voice Live and telephony for voice agents. Service stated as GA
          with some sub-features in public preview; rates were not read.
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
      - label: Inference & routing
        value: >-
          Models from the Foundry model catalog deployed in the customer's Foundry resource (Azure OpenAI models and
          several Foundry Models sold by Azure; availability varies by region and tool). Hosted-agent code calls the
          project endpoint's Responses API. Bring-your-own models behind Azure AI Gateway, Azure API Management or a
          supported non-Azure gateway are allowed (not with the Copilot harness) and are Non-Microsoft Products.
          Deployment types labelled Global or DataZone may process outside the resource's region.
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/limits-quotas-regions
      - label: Data leaving the device
        value: >-
          Everything runs in Azure: prompts, tool inputs and outputs, files, conversations and session state in the
          Foundry resource's region (endpoints are regional). Data leaves Microsoft's boundary when an agent calls a
          non-Microsoft MCP server, tool, model or endpoint; Grounding with Bing is a Microsoft-as-controller service
          outside the Data Protection Addendum; Claude models can be hosted on Anthropic infrastructure, with
          Anthropic an independent processor; publishing to Teams and Microsoft 365 stores data in those services.
        url: https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/agents/data-privacy-security
      - label: Retention & training
        value: >-
          Conversations, responses, files and vector stores persist until deleted. Basic setup keeps them in
          Microsoft-managed storage; standard setup in the customer's own Azure Storage, Cosmos DB and Foundry IQ
          (Azure AI Search). A hosted session's state is deleted after 30 days of inactivity; stored voice
          conversations and Microsoft-managed audio are kept 60 days; traces follow the connected Application
          Insights retention. Prompts and outputs are not available to other customers, nor to OpenAI, Meta, Cohere
          or Mistral, and are not used to improve those providers' models; Microsoft does not use the data for
          training. Claude models are an exception to provider access: Anthropic acts as an independent data
          processor for Claude prompts and outputs.
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/faq
      - label: Docs index
        value: What is Microsoft Foundry Agent Service? (agent types, tools and toolboxes, identity, networking, publishing)
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
      - label: Agent types
        value: >-
          Prompt agents (configuration, portal or code; no preview label). Prompt agents on the Microsoft Copilot
          harness (public preview). Voice-based prompt agents (GA, some features preview). Hosted agents (your code
          as a container image or source .zip; no preview label). Responses API without a saved agent. Workflows
          (visual low-code multi-agent builder): preview, retiring 2026-12-01 in favour of Microsoft Agent
          Framework. Routines carry no preview label; the .NET SDK needs 2.1.0-beta.4 preview packages, Python
          uses azure-ai-projects 2.4.0 or later with operations under client.beta.routines. Autopilots carry no
          preview label on the overview page, but creating one requires enrolling the tenant in the Agent 365
          Frontier preview program, accepting the Agent 365 terms and a Frontier preview licence seat.
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
      - label: Workflow retirement
        value: >-
          "Microsoft Foundry is retiring workflows on December 1, 2026"; the page carries a migration guide, and
          code-based orchestration inside hosted agents is not affected.
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/workflow
      - label: Setup modes
        value: >-
          Basic setup: Microsoft-managed storage and Microsoft-managed keys only. Standard setup: the customer's
          own storage resources, where customer-managed keys can be set on each. A hosted session's $HOME is always
          on platform-managed storage and is not encrypted with a customer-managed key; routines do not support
          customer-managed keys.
        url: https://learn.microsoft.com/en-us/azure/foundry/concepts/customer-managed-keys
      - label: Network modes
        value: >-
          Default is fully public: the endpoint is reachable from the internet and agents egress publicly. Options
          are a private endpoint for inbound, and for outbound a bring-your-own virtual network (a subnet delegated
          to Microsoft.App/environments, /27 or larger) or a managed virtual network. Memory stores do not support
          virtual networks. In network-isolated projects Fabric Data Agent, Logic Apps, Computer Use and Image
          Generation are not supported; Browser Automation is supported through the VNet subnet in Playwright
          Workspaces. Inside a toolbox, Microsoft lists Work IQ and browser automation as not supported in
          network-isolated projects.
        url: https://learn.microsoft.com/en-us/azure/foundry/how-to/configure-private-link
      - label: Sovereign cloud
        value: >-
          Azure Government (US Gov Virginia, US Gov Arizona): prompt agents yes, workflows preview, voice-based and
          hosted agents no, with a reduced tool list.
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/azure-government
      - label: Predecessor
        value: >-
          Classic agents and Azure OpenAI Assistants are the earlier surface; Microsoft documents migration to the
          new agent service and a resource tag that blocks creating them. Agent applications are an earlier
          publishing model with their own stop and start operations.
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/disable-classic-agents
    items:
      - title: Change four defaults before production
        body:
          - >-
            Connect Application Insights (tracing is off by default), pin the agent endpoint to a version (the
            default routing policy is Always use latest), attach a guardrail to every hosted agent and test it (an
            agent with no rai_config has no content safety guardrail, and one that names a missing policy deploys
            as active with no filtering), and give hosted agents an egress policy with default action Deny (there
            is none by default).
        links:
          - title: Set up tracing for AI agents
            url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/trace-agent-setup
          - title: Configure and share your agent (traffic routing)
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/configure-agent
          - title: Add guardrails to a hosted agent
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/add-hosted-agent-guardrails
      - title: Separate who builds from who calls
        body:
          - >-
            Foundry User at project scope can create and update every agent in the project, call them all and read
            every user's sessions. Give applications and end users Foundry Agent Consumer on the single agent they
            call, keep Foundry User for builders and the delivery pipeline, and disable key-based authentication on
            the Foundry resource, because a key grants full access without role restrictions.
        links:
          - title: Role-based access control for Microsoft Foundry
            url: https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry
          - title: Agent endpoint authorization
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/agent-endpoint-authorization
    riskNotes:
      - risk: riskPromptInjection
        note: >-
          The default guardrail screens user prompts for jailbreak attempts only; indirect-attack screening of what a
          tool returns is a preview intervention point that works for a listed set of tools which does not include
          MCP. Microsoft says remote MCP servers are not tested or verified and their tool descriptions are
          untrusted input; Copilot harness agents fetch web content and run shell commands by default.
      - risk: riskRogueActions
        note: >-
          A harness prompt agent starts with file write, shell, web and subagents enabled, and during the preview
          the service, not the customer, sets the approval policy for those tools. A hosted agent is the customer's
          own code: tool policies do not inspect it, and require_approval on a toolbox tool is enforced only if the
          agent's runtime honours it.
      - risk: riskAgenticDelegationConfusedDeputy
        note: >-
          Legacy agents share one project agent identity. A tool connection using the project managed identity or a
          stored key gives every caller the same downstream authority. A middle tier holding the
          UserIdentityImpersonation action names the end user in a header the platform does not validate, and
          delegated users are not fenced from each other's sessions.
      - risk: riskSensitiveDataDisclosure
        note: >-
          Traces capture prompts, responses, system instructions and tool arguments and results into Application
          Insights, readable by anyone with Log Analytics Reader until the content table is set to Protected.
          People with access to a project can read an API key stored in a project connection. Code Interpreter
          containers are not isolated per agent or per user within a project.
      - risk: riskShadowAndUnknownAgents
        note: >-
          Ephemeral agents built on the Responses API have no agent resource, so they appear in no agent inventory.
          Classic agents and Azure OpenAI assistants are not in the Fleet inventory, and agents created before
          2026-10-23 16:00 UTC keep running when their Entra identity is blocked.
      - risk: riskToolSourceProvenance
        note: >-
          MCP servers are declared by URL; an empty allowed_tools list admits every tool the server exposes, now
          and later. A toolbox version is an immutable snapshot of the tool configuration, not of what a remote
          server serves, and the consumer endpoint always serves the default version.
      - risk: riskInsecureIntegratedComponent
        note: >-
          Hosted agents run a customer-built image from a registry (projects created before 2026-06-25 need the
          registry reachable publicly); the image allowlist policy is preview and in three regions. Skills are
          instructions, scripts and assets Microsoft says to treat as code and review before attaching.
    controls:
      - mitigation: cap-agent-tool-registry
        coverage: native
        mechanism: >-
          Agents and immutable agent versions as project resources (list agents, list versions); the Manage > Fleet
          > Agents inventory across projects in a subscription; a Microsoft Entra agent identity and blueprint per
          agent in the tenant-wide Entra inventory, with Agent 365 registry sync for published agents; Azure RBAC on
          agents/write; Azure Policy definitions for agent kinds, hosted-agent container images and approved tools
          (preview)
        steps:
          - title: Read the inventory
            body:
              - >-
                In the Foundry portal select Manage > Fleet > Agents: prompt agents, workflows and hosted agents in
                every project you can access are discovered automatically, with status and policy impact.
            url: https://learn.microsoft.com/en-us/azure/foundry/control-plane/how-to-manage-agents
          - title: Restrict who can create or change a definition
            body:
              - >-
                Creating an agent or a version needs Microsoft.CognitiveServices/accounts/AIServices/agents/write at
                project scope (Foundry User, Foundry Project Manager, Foundry Owner); assign those roles to builders
                and the delivery pipeline only.
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/hosted-agent-permissions
          - title: Deny unapproved agent kinds and images
            body:
              - >-
                Assign "[Preview]: Microsoft Foundry agents should not use denied agent kinds" and "[Preview]:
                Microsoft Foundry hosted agents should only use allowed container images" with effect Deny after an
                Audit period.
            url: https://learn.microsoft.com/en-us/azure/foundry/how-to/agent-deployment-policy
          - title: Govern the identities in Entra
            body:
              - >-
                Review each agent's identity and blueprint in the Microsoft Entra admin center, where Foundry agents
                sit beside agents from other services, and set owners and sponsors.
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/agent-identity
        note: >-
          Native on the registry rule (as on toolBedrockAgentcore and toolVertexAgentEngine): a listable inventory
          of agents, versions and identities, and the tenant gates create and update by Azure RBAC. Not an approval
          workflow: nothing approves a definition before it runs, and any Foundry User in the project can create or
          update an agent. Outside the inventory: ephemeral agents (a Responses API call with no agent resource),
          classic agents and Azure OpenAI assistants, and hosted-agent code, which no policy inspects. The
          agent-kind and container-image policies are preview, a deny list and an allow list respectively, and
          available only in Canada Central, Spain Central and Korea Central; the Fleet overview page is labelled
          preview.
        verified: "2026-11-18"
      - mitigation: cap-staged-rollout-gate
        coverage: partial
        mechanism: >-
          Immutable agent versions (any change creates one; up to 1,000 per agent); the agent endpoint's
          version_selector, Always use latest (default) or pinned with one FixedRatio rule at 100%, as the rollback
          pointer; candidate sessions pinned by version_ref; draft versions (preview); toolbox versions with a
          default_version promoted by hand; scheduled and continuous evaluation rules beside the release
        steps:
          - title: Pin production to a version
            body:
              - >-
                In the agent's Publish dropdown choose a specific version, or PATCH agent_endpoint.version_selector
                with one FixedRatio rule (agent_version, traffic_percentage 100); when pinned, new versions do not
                change what is served.
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/configure-agent#select-the-active-agent-version
          - title: Release a candidate without changing production
            body:
              - >-
                Record and pin production, create the candidate, wait for status active, test a fresh session
                created with a version_indicator of type version_ref, then move the selector; restoring the previous
                selector is the rollback.
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/manage-hosted-agent
          - title: Score the candidate
            body:
              - >-
                Create scheduled or continuous evaluation rules so the candidate's traces and responses are scored
                on the Evaluations page before a person moves the selector.
            url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/continuous-scheduled-evaluation
        note: >-
          Partial (as on toolClaudeManagedAgents): versioning and pointer-flip rollback are met, progressive release
          is not. Two Microsoft pages disagree: the azd production guide (2026-09-21) shows a 90/10 canary with two
          FixedRatio rules, while the hosted agents concept page, the manage and configure pages (October and
          November 2026) say traffic splitting isn't supported and the endpoint routes 100% to one version; prefer
          the reference pages and set one rule at 100% explicitly. Evaluation scores beside the release and blocks
          nothing; a person moves the selector. The default routing follows the latest version, so an unpinned
          endpoint ships every save at once. Existing hosted sessions stay bound to their version, a running
          Copilot harness environment keeps the previous version until it goes idle, and the selector rolls back
          neither toolboxes, connections, guardrail contents nor role assignments.
        verified: "2026-11-18"
      - mitigation: D3-CTS
        coverage: native
        mechanism: >-
          Project connections carry the authentication type per tool target (custom keys, project managed identity,
          agent identity, OAuth identity passthrough (oauth2) or a user Entra token), and Agent Service acquires,
          refreshes and injects the credential service-side; agent identity tokens are requested per audience;
          on-behalf-of-user delegation; for hosted-agent egress, managedIdentityRef and secretRef header transforms
          applied by the egress proxy (preview)
        steps:
          - title: Put the credential on the connection, not in the agent
            body:
              - >-
                Create each MCP or A2A target as a connection with its own auth type (azd ai connection create
                --kind remote-tool --auth-type ...), so Foundry injects the credential for that target only.
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/tool-authentication
          - title: Use per-user access for user data
            body:
              - >-
                Choose OAuth identity passthrough or Microsoft Entra client user delegation so each downstream call
                carries the signed-in user's authority; keep key-based connections for shared, non-user data.
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/mcp-authentication
          - title: Scope the agent's own identity
            body:
              - >-
                For application-only calls select agent identity authentication with the downstream audience, and
                grant that identity roles at resource or resource-group scope, not subscription scope.
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/agent-identity
        note: >-
          Native on the credential-scoping rule (as on toolClaudeManagedAgents; toolBedrockAgentcore is native only
          on its gateway): on the connection and toolbox path the credential is held outside the agent, presented
          only to the target it is keyed to, and per-user scoping is available. Paths outside it: hosted-agent code
          obtains tokens for its own agent identity from the token service and can read values placed in
          environment variables or resolved from ${{connections.<name>.credentials.<field>}} placeholders; MCP
          headers passed at runtime instead of a connection; a key-based or project-managed-identity connection is
          one shared authority for every caller. The agent identity acting on behalf of the user is preview and
          needs the AgentBlueprint scheme; secretRef headers are preview in two regions and cannot reach a Key
          Vault behind a private endpoint.
        verified: "2026-11-18"
      - mitigation: cap-agent-action-policy-enforcement
        coverage: partial
        mechanism: >-
          Project tool controls (properties.toolControls: defaultAction Deny, allowedTools by tool type, MCP
          serverUrl or connectorId) enforced at runtime (preview); Azure Policy "[Preview]: Microsoft Foundry agents
          and toolboxes should only use approved tools" on create and update; guardrail controls at the tool call
          intervention point and Task Adherence (both preview classifiers); gateway policies on MCP traffic routed
          through AI Gateway or Azure API Management
        steps:
          - title: Set a runtime tool allow list on the project
            body:
              - >-
                PATCH the project's properties.toolControls with defaultAction Deny and an allowedTools array naming
                each approved tool type and each MCP serverUrl or connectorId; test in a non-production project,
                because there is no audit mode.
            url: https://learn.microsoft.com/en-us/azure/foundry/control-plane/govern-tools
          - title: Block unapproved tool configurations at save time
            body:
              - >-
                Assign the approved-tools policy at the Foundry account scope with approvedToolTypes,
                approvedMcpEndpoints and approvedMcpConnectors, in Audit first and then Deny.
            url: https://learn.microsoft.com/en-us/azure/foundry/control-plane/govern-tools
          - title: Put argument-level rules in a gateway
            body:
              - >-
                Configure the MCP route in AI Gateway or Azure API Management, enter the gateway-routed endpoint as
                the tool's server URL, and apply the gateway's policies; Foundry no longer registers the route
                itself.
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/governance
        note: >-
          Partial on the architecture rule (toolBedrockAgentcore and toolVertexAgentEngine are native on a
          declarative per-call policy at a provider gateway): Foundry's deterministic controls decide which tools
          and MCP servers may be used, as a project floor a builder without ARM write on the project cannot lower,
          but they do not evaluate a call's arguments or target resource, and both are preview. The policy checks
          toolboxes and prompt agents without the Copilot harness; harness prompt agents are not evaluated and
          hosted-agent code is never inspected. Tool-call guardrail controls and Task Adherence are classifiers, not
