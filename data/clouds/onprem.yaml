    setVia: [clusterPolicy]
    area: tools
    default: "networkPolicyManagement is Managed: the controller keeps a shared NetworkPolicy for the template. With networkPolicy omitted it applies its own default, ingress only from the Sandbox Router and egress to the public internet only (private ranges and the metadata server blocked), the opposite of a drawing where only named services are reachable; a networkPolicy whose rule list is empty blocks all traffic in that direction"
    recommended: "One template per task family: runtimeClassName set, no service account token unless the task needs one, no volume beyond scratch, and an explicit networkPolicy holding only the egress that family needs (the gateway, the mirror, source control); or networkPolicyManagement: Unmanaged where the network plugin's own policies own the sandbox rules. Either way deny by default is in place before the first rollout, and the orchestrator creates one claim per rollout or build"
