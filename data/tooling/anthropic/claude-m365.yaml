      - mitigation: cap-shadow-ai-discovery
        coverage: partial
        mechanism: >-
          Enterprise domain claiming (Organization settings > Organization and access > Security, Migrate
          accounts using your domain) lists personal Free, Pro and Max accounts on verified domains with plan
          and last-active date and a CSV export; the add-ins' Claude-account sign-in uses those same accounts
        steps:
          - title: Review personal accounts on your domains
            body:
              - >-
                Turn on Migrate accounts using your domain and review the list of existing personal accounts
                (email, plan, creation and last active dates), exported as CSV, before claiming them.
            url: https://support.claude.com/en/articles/14625619-claim-and-migrate-accounts-on-your-domain
        note: >-
          Partial by the rule: the domain-claim list is a genuine discovery signal for personal Claude accounts
          on verified domains — the accounts a user would sign in to the add-in with — though not for which of
          them used the add-in. Personal accounts on other addresses, add-ins users installed themselves
          (Integrated apps does not list them) and third-party manifests pointed at an unsanctioned gateway
          are found by SSE, CASB or endpoint inventory. The tenant-restriction header and closing the Office
          Store are prevention, credited here only in this note.
        verified: "2026-09-25"
        migration:
