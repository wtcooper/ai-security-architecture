    summary:
      - >-
        Your Agent Framework agent on Azure Container Apps speaks A2A both ways through API
        Management's A2A agent APIs, with Microsoft Entra ID as identity provider and authorization
        server: our agent holds an Entra agent identity, each peer agent we admit is a registered
        client with its own certificate and app roles per skill, and our users' identity reaches the
        vendor platform only through its Entra enterprise application. Admitted cards live in API
        Center; nothing is resolved live.
