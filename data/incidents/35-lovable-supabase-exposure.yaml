id: lovable-supabase-exposure
title: "Lovable-built apps: 24,664 sites hand their Supabase records to anyone who loads them"
subtitle: >
  Crissy Field and Handelsblatt went through 159,041 Lovable projects in Common Crawl: of 34,545
  on Supabase, 24,664 sent database records on page load to a visitor who had not signed in. The
  page calls the database with a public key, so each table's row rules are all that stands between
  a visitor and its rows.
date: 2026-11
dateRange: December 2025 – September 2026 (published 2 November 2026)
category: aiMadeExposure
perspective: target
# Lovable's agent wrote the apps, ran the migrations on their Supabase databases and Lovable published them; the browser's direct call to the app's database is this pattern's crossing. The databases were Supabase projects connected to Lovable, drawn as App data run by a supplier; Lovable Cloud was not examined.
archetype: archHostedAppBuilder
caveat: >
  Crissy Field's report, written with Handelsblatt, is the only first-hand account, and Techzine
  repeats it. The report names no technical cause beyond poorly configured access and does not
  say which audience or scan settings the apps had; the mechanism told here (a public key in the
  page, row-level rules deciding what it returns) comes from Lovable's own documentation and Matt
  Palmer's 2025 advisory. The researchers say their sample is not representative, that they
  retrieved only parts of the data, and that the 30% with email addresses is not a confirmed leak
  rate. Misuse was not established.
breaks:
  - control: cap-data-access-governance
    how: "A row rule on every table, read for what it allows, decides what the public key returns; Lovable's own docs call missing rules the most common way app data gets exposed."
  - control: D3-AVE
    how: "Blocking publishing on critical findings, off by default outside new Enterprise workspaces, keeps a table with no rule from going live."
  - control: D3-AI
    how: "A list of published apps with the data each holds tells security which ones to test signed out before a researcher does."
  - control: cap-shadow-ai-discovery
    how: "Looking for the organisation's apps on builder domains in public records, as the researchers did with Common Crawl, finds those built outside the workspace."
  - control: cap-ai-vendor-assessment
    how: "Ask whether the platform's check reads what each rule allows; in 2025 Lovable's confirmed only that rules were enabled."
summary:
  - >
    Lovable's agent designs an app's tables and runs the migrations on the Supabase project
    behind it, and the front end it writes calls that database straight from the browser with a
    public key. Row-level security policies decide what the key returns, and Lovable's own
    documentation calls missing ones the most common way app data gets exposed.
  - >
    On 2 November 2026 Crissy Field, working with Handelsblatt, reported 24,664 Lovable-built
    sites that sent Supabase records as they loaded, with no login. With further read-only
    requests on the same key it found email addresses in 10,560 tables on 7,403 sites, and records
    that included passport numbers, payment details and more than 200,000 chat messages.
  - >
    The lesson is where the check sits. The audience setting in front of the pages is not on the
    path from the browser to the database; each table's rule is, and the agent writes it or leaves
    it out while a scan may confirm only that rules are switched on. The same chain was disclosed
    for Lovable in 2025 as CVE-2025-48757.
patterns:
  - Public Database Key in the Page
  - Missing or Permissive Row Rules
risks:
  - riskSensitiveDataDisclosure
  - riskInsecureModelOutput
steps:
  - n: 1
    title: The agent designs the tables and runs the migrations
    phase: introduced
    narrative: >
      Lovable's documentation describes the division of work. "Lovable designs the tables,
      columns, and relationships for you" from a plain-language description, wires the pages to
      the Supabase project and, once the maker approves, "executes the migration on your Supabase
      project". The row-level security policies that decide who reads which rows are something the
      maker is told to ask Lovable to review, and the same page says "Missing RLS policies are the
      most common way app data gets exposed."
    path: [maker->builder, builder->appData]
    risks:
      - riskInsecureModelOutput
    sources:
      - title: "Connect to Supabase"
        url: https://docs.lovable.dev/integrations/supabase
        publisher: Lovable
  - n: 2
    title: The page calls the database with a public key
    phase: introduced
    narrative: >
      Matt Palmer's 2025 advisory, CVE-2025-48757, describes how the front ends Lovable generates
      "make direct REST API calls against the database from the client, using a public and
      unprivileged anon key", so they rely "exclusively on RLS" for privacy and integrity. Whoever
      loads the page holds the key.
    path: [visitors->browser, browser->appData]
    risks:
      - riskSensitiveDataDisclosure
    sources:
      - title: "CVE-2025-48757"
        url: https://mattpalmer.io/posts/CVE-2025-48757/
        publisher: Matt Palmer
        date: 2025-05-29
  - n: 3
    title: "Publish: a check for rules, and an audience of anyone"
    phase: introduced
    narrative: >
      Lovable's checks look at the database configuration, including RLS coverage, before
      publishing. "Block publishing with critical issues" is off by default except on new
      Enterprise workspaces Lovable creates, and a project's default audience the first time it is
      published is "Anyone with the link". In 2025 Palmer found the publish check would ensure RLS
      was enabled on every table "but doesn't necessarily indicate if they are sufficient". The
      report does not say which of these settings the exposed sites had.
    path: [projectStore->publish, maker->publish, publish->appHosting]
    risks:
      - riskSensitiveDataDisclosure
    sources:
      - title: "Privacy & security settings"
        url: https://docs.lovable.dev/features/privacy-and-security-settings
        publisher: Lovable
      - title: "Connect to Supabase"
        url: https://docs.lovable.dev/integrations/supabase
        publisher: Lovable
      - title: "CVE-2025-48757"
        url: https://mattpalmer.io/posts/CVE-2025-48757/
        publisher: Matt Palmer
        date: 2025-05-29
  - n: 4
    title: 24,664 sites send records as they load
    phase: exposed
    narrative: >
      Using the Common Crawl web archive, Crissy Field identified 159,041 Lovable projects from
      December 2025 to September 2026. 34,545 used Supabase, and 24,664 sent database records
      from Supabase as soon as they loaded, with no login or other interaction. The researchers
      note that this alone is not a security issue, since data may be meant for public display.
      They did not examine Lovable's own database features, introduced in late 2025.
    path: [browser->appHosting, browser->appData]
    risks:
      - riskSensitiveDataDisclosure
    sources:
      - title: "Lovable: Many Apps Built on the Platform Expose Sensitive Data"
        url: https://www.crissyfield.de/research/lovable-en/
        publisher: Crissy Field GmbH
        date: 2026-11-02
      - title: "Thousands of Lovable apps are leaking personal data"
        url: https://www.techzine.eu/news/security/145550/thousands-of-lovable-apps-are-leaking-personal-data/
        publisher: Techzine
        date: 2026-11-04
  - n: 5
    title: The same key reads further
    phase: exposed
    narrative: >
      With further read-only requests on the same API key, the researchers found email addresses
      in 10,560 tables on 7,403 of those sites, about 30%. A German lifestyle forum exposed more
      than 80,000 profiles and more than 200,000 chat messages; a service provider more than 1,000
      identity records with passport numbers; event organisers and restaurants tens of thousands
      of ticket and food sales with payment information; another provider 280,000 emails sent to
      its customers. The researchers could not establish whether any of it had been misused.
      Handelsblatt contacted Lovable; the report gives no reply.
    path: [browser->appData, appData]
    risks:
      - riskSensitiveDataDisclosure
    sources:
      - title: "Lovable: Many Apps Built on the Platform Expose Sensitive Data"
        url: https://www.crissyfield.de/research/lovable-en/
        publisher: Crissy Field GmbH
        date: 2026-11-02
      - title: "Thousands of Lovable apps are leaking personal data"
        url: https://www.techzine.eu/news/security/145550/thousands-of-lovable-apps-are-leaking-personal-data/
        publisher: Techzine
        date: 2026-11-04
  - n: 6
    title: Where this chain breaks
    phase: mitigated
    narrative: >
      Require a row rule on every table and file bucket before an app holds real data, and read
      what each one allows: a check that confirms only that rules are switched on passes a rule
      that lets anyone read every row. Make critical findings block publishing for every maker in
      the workspace. Limiting the audience to the workspace does not help on its own, because the
      browser reaches the database directly. Keep a list of published apps and the data each
      holds, load them signed out to see what the page is sent, look for the organisation's apps
      built outside the workspace, and ask the vendor whether its check reads what a rule allows.
    path: [govPolicy, govSupplyChain, govObservability, appData, publish, builder->appData, browser->appData, projectStore->publish, admin->publish]
    sources:
      - title: "Lovable: Many Apps Built on the Platform Expose Sensitive Data"
        url: https://www.crissyfield.de/research/lovable-en/
        publisher: Crissy Field GmbH
        date: 2026-11-02
      - title: "Privacy & security settings"
        url: https://docs.lovable.dev/features/privacy-and-security-settings
        publisher: Lovable
alsoSeen:
  - title: "CVE-2025-48757: missing row-level security in Lovable-generated apps"
    date: March – May 2025
    note: >
      Matt Palmer found that Lovable-generated front ends call the database with the public anon
      key, so a Lovable project with a database, created on or before 15 April 2025, could give
      anyone read access, and in some cases insert, update or delete, through missing or
      insufficient row-level security: user records, third-party API keys and payment data among
      them. Lovable's publish step checked that RLS was enabled, not that it was sufficient. Replit
      reported the issue independently.
    sources:
      - title: "CVE-2025-48757"
        url: https://mattpalmer.io/posts/CVE-2025-48757/
        publisher: Matt Palmer
        date: 2025-05-29
