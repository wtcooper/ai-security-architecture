# EXAMPLE organisation catalogues. This file ships with the repository so the org layer renders
# something; every badge it produces is labelled "example". To use your own, copy this
# directory to data/org/local/ and replace the content — the build prefers local/ when it
# exists, and upstream never ships that path. See data/org/README.md.
#
# Each framework is one of your catalogues (a control standard, a risk register, a policy).
# Entries are authored your way round — your id, your label, and the CoSAI controls,
# capabilities and risks it corresponds to. The build inverts them into the cross-reference the
# Frameworks tab, the cards and the architecture pages read. An entry that maps to nothing is
# allowed and shown as a gap, because that is a finding about your standard.
organisation:
  name: Example Corp
  shortName: EX

frameworks:
  - id: org-example-ais
    name: Example AI Security Standard
    fullName: Example Corp AI Security Standard (AIS)
    version: "2026.1"
    url: https://intranet.example/standards/ais
    description: >-
      An illustrative control standard of the kind an enterprise security function publishes:
      numbered requirements grouped by domain, each owned by a team, each cross-mapped here to
      the CoSAI control it satisfies and the capability class that implements it.
    entries:
      - id: AIS-1.1
        label: Inventory of approved AI tooling
        description: All AI assistants, agents and model endpoints in use are recorded in the approved-tooling register with an owner and a risk tier.
        group: Governance
        controls: [controlAgentInventoryManagement, controlModelAndDataInventoryManagement]
        capabilities: [capabilityShadowAiDiscovery, capabilityAgentRegistry]
        risks: [riskShadowAndUnknownAgents]
      - id: AIS-1.2
        label: Vendor AI assessment before adoption
        description: A third-party AI product is assessed against this standard before it is approved for use with company data.
        group: Governance
        controls: [controlProductGovernance]
        capabilities: [capabilityAiTprm, capabilityVendorAssurance]
        risks: [riskInsecureIntegratedComponent]
      - id: AIS-2.1
        label: Agent tool permissions are scoped and administered
        description: The tools an agent may call, and the actions it may take without approval, are set by an administrator outside the repository the agent operates on.
        group: Agent runtime
        controls: [controlAgentPluginPermissions]
        capabilities: [capabilityToolPermissionScoping, capabilityMcpToolSecurity]
        risks: [riskRogueActions, riskToolRegistryTampering]
      - id: AIS-2.2
        label: Agent execution is sandboxed
        description: Commands an agent runs are confined to the workspace with network egress denied by default.
        group: Agent runtime
        controls: [controlAgentExecutionBounds]
        capabilities: [capabilityAgentSandboxing, capabilityEgressControl]
        risks: [riskRogueActions]
      - id: AIS-2.3
        label: Agent credentials are brokered, never pasted
        description: Agents obtain provider and tool credentials from a broker with short lifetimes; long-lived keys in dotfiles are prohibited.
        group: Agent runtime
        controls: [controlAgentCredentialIsolation]
        capabilities: [capabilityCredentialIsolation, capabilitySecretsManagement]
      - id: AIS-3.1
        label: Sensitive data is controlled at the AI boundary
        description: Prompts, uploads and connector reads are inspected for regulated data before they leave company custody.
        group: Data
        controls: [controlUserDataManagement]
        capabilities: [capabilityAiDlp, capabilityPromptRedaction]
        risks: [riskSensitiveDataDisclosure, riskExcessiveDataHandlingDuringInference]
      - id: AIS-4.1
        label: Prompt injection defences are deployed
        description: Untrusted content reaching an agent is screened, and instructions found in it are not acted on without a person.
        group: Runtime input
        controls: [controlInputValidationAndSanitization]
        capabilities: [capabilityPromptInjectionDefense, capabilityHitlControls]
        risks: [riskPromptInjection]
      - id: AIS-5.1
        label: AI activity is logged centrally
        description: Every agent session, tool call and administrative decision is logged to the security platform with the acting identity.
        group: Assurance
        controls: [controlAgentObservability, controlThreatDetection]
        capabilities: [capabilityAuditLogging, capabilityAgentObservability]
      - id: AIS-7.1
        label: AI use-case approval board
        description: New AI use cases are approved by the review board before build. A process requirement with no technology behind it, so it maps to nothing here — shown deliberately as a gap.
        group: Governance

  - id: org-example-top-risks
    name: Example AI Top Risks
    fullName: Example Corp AI Top Risks, 2026 edition
    version: "2026"
    description: >-
      An illustrative top-five list of the kind a risk function keeps: the organisation's own
      wording, cross-mapped to the CoSAI risks each one is made of, so it lights the map and
      appears on the architecture pages next to the CoSAI tags.
    entries:
      - id: TR-01
        label: Prompt injection through agent tools
        description: Content an agent reads redirects it into actions the user never asked for.
        risks: [riskPromptInjection, riskRogueActions]
      - id: TR-02
        label: Company data leaking to AI vendors
        description: Sensitive data leaves custody through prompts, uploads and connectors.
        risks: [riskSensitiveDataDisclosure, riskExcessiveDataHandlingDuringInference]
      - id: TR-03
        label: Unsanctioned agents and tool servers
        description: AI agents and MCP servers nobody registered, running with real credentials.
        risks: [riskShadowAndUnknownAgents, riskZombieShadowMCPServers]
      - id: TR-04
        label: Compromised agent supply chain
        description: A tool, plugin or extension the agent trusts is malicious or hijacked.
        risks: [riskToolSourceProvenance, riskToolRegistryTampering, riskInsecureIntegratedComponent]
      - id: TR-05
        label: Runaway agent cost and loops
        description: Autonomous agents consume budget or spin without bound.
        risks: [riskRunawayAgentToolLoops, riskEconomicDenialOfWallet]
