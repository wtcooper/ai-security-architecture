    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/resource-based-policies.html
    verified: "2026-11-18"
  - id: harnessAdminScp
    name: "Deny harness create and update outside the pipeline role"
    where: "AWS Organizations › Service control policies › Deny CreateHarness, UpdateHarness, CreateHarnessEndpoint, UpdateHarnessEndpoint, CreateAgentRuntime, UpdateAgentRuntime, CreateGateway, CreateGatewayTarget, and InvokeAgentRuntimeCommand and InvokeAgentRuntimeCommandShell outside a break-glass role; on JWT-authorised harnesses list in allowedClients only the front end's client"
    setVia: [cloudPolicy]
    area: identity
