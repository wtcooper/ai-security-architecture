      - { between: ["Models-as-a-Service", "Red Hat Connectivity Link", "llm-d"], what: "MaaS needs Connectivity Link 1.4 (Kuadrant, Authorino) and serves llm-d models; vLLM runtime is Technology Preview", url: "https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/3.5/pdf/govern_llm_access_with_models-as-a-service/Red_Hat_OpenShift_AI_Self-Managed-3.5-Govern_LLM_access_with_Models-as-a-Service-en-US.pdf" }
