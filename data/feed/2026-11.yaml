  - id: llmjacking-gateway-keys
    date: 2026-11-02
    title: "LLMjacking: a bought LiteLLM key is lifted to proxy admin, and stolen model access is resold"
    summary: >
      Google Threat Intelligence Group and Mandiant described crews that steal cloud identities and AI keys,
      test them with one-token calls and sell them. At one victim a crew made bought LiteLLM virtual keys
      into PROXY_ADMIN credentials through a flaw GTIG gives as CVE-2026-40217, whose record describes another
      flaw; CISA listed it on 18 November. One resale service passed nearly $1 million in token costs to one
      victim.
    category: identity
    perspective: target
    evidence: exploited
    patterns: [archSelfHostedInference]
