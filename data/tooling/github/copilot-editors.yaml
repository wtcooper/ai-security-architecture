# GitHub Copilot — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# Excluded: Copilot Extensions (GitHub Apps, retired 2025-11-10), the `gh copilot` extension
# (retired 2025-10-25), Copilot Workspace and GitHub Spark (retired 2026-08-31) — not shipped.
# 2026-09-25: re-verified toolGithubCopilot against the MITRE capability rules; redirects:
# concepts/context/content-exclusion -> concepts/security-governance-and-network-settings/content-exclusion,
# the Visual Studio admin page lands on ?view=visualstudio; copilot.github.trust.page renders client-side
# (read in a browser).
vendor: github
family: GitHub Copilot
tools:
  - id: toolGithubCopilot
    name: GitHub Copilot in editors
    surfaceClasses:
      - ideExtension
    variants:
      - name: >-
          Copilot in VS Code (chat, edit and agent mode; Agent Host sessions incl. Claude and Codex adapters)
        class: ideExtension
        url: https://code.visualstudio.com/docs/enterprise/ai-settings
      - name: Copilot in Visual Studio
        class: ideExtension
        url: https://learn.microsoft.com/en-us/visualstudio/ide/visual-studio-github-copilot-admin?view=visualstudio
      - name: Copilot in JetBrains IDEs (agent mode via Copilot CLI ACP server)
        class: ideExtension
        url: https://docs.github.com/en/copilot/concepts/agents/copilot-in-jetbrains
      - name: Copilot for Xcode
        class: ideExtension
        url: https://docs.github.com/en/copilot/how-tos/set-up/install-copilot-extension
      - name: Copilot for Eclipse
        class: ideExtension
        url: https://docs.github.com/en/copilot/how-tos/set-up/install-copilot-extension
      - name: Copilot for Vim/Neovim (inline suggestions only)
        class: ideExtension
        url: https://docs.github.com/en/copilot/how-tos/set-up/install-copilot-extension
    architecture: archCodingAgentThirdParty
    status: ga
    asOf: "2026-09"
    summary:
      - "Governance runs through the enterprise AI-controls tab and organisation Copilot settings: Feature,
        Privacy and Models policies set enterprise-first (enable, disable, or let organisations decide), with
        content exclusion and MCP governance layered on for Business and Enterprise plans."
      - "Inference runs on GitHub's Copilot API (api.*.githubcopilot.com per plan) against models hosted on
        Azure, AWS Bedrock, Anthropic, GCP, xAI and Fireworks; with local BYOK the prompts go straight from
        the editor to the chosen provider and bypass GitHub. Prompts, open-file context, tool arguments and
        (in agent mode) shell output leave the device; the audit log never sees them — only an OpenTelemetry
        export the enterprise pins in managed settings does."
      - "Two admin planes overlap in VS Code: device policy (Windows registry
        Software\\Policies\\Microsoft\\VSCode, macOS configuration profiles, /etc/vscode/policy.json) and
        GitHub's managed-settings.json (MDM key HKLM\\SOFTWARE\\Policies\\GitHubCopilot / com.github.copilot,
        then server-managed copilot/managed-settings.json, then a local file). Where both set the same policy
        the Copilot managed setting wins. JetBrains honours the managed file for MCP, plugins, telemetry and
        bypass-mode lockout (2026-08-18) and a managed sandbox in preview (2026-09-08); Visual Studio is
        ADMX-only."
    facts:
      - label: Plans
        value: >-
          Free, Pro, Pro+, Max; Business and Enterprise carry policies, content exclusion, MCP governance and
          managed settings.
        url: https://docs.github.com/en/copilot/get-started/plans
      - label: Inference & routing
        value: >-
          GitHub Copilot API by plan (*.business / *.enterprise.githubcopilot.com); OpenAI on Azure, Anthropic
          on AWS Bedrock / Anthropic / GCP, Gemini on GCP, xAI, Moonshot on Foundry/Fireworks. Data residency
          (US, EU) is a policy at +10% credits.
        url: https://docs.github.com/en/copilot/reference/ai-models/model-hosting
      - label: Data leaving the device
        value: >-
          Prompts, file context and tool outputs to the Copilot API; telemetry to collector.github.com and
          copilot-telemetry.githubusercontent.com; local BYOK sends prompts directly to the provider;
          enterprise BYOK stays server-side.
        url: https://docs.github.com/en/copilot/concepts/models/bring-your-own-key
      - label: Data retention / training
        value: >-
          Business and Enterprise prompts are not used for training; model providers run under
          zero-data-retention except Claude Fable 5 / 5.1, which retain by default with a ZDR exemption
          available through end-2026.
        url: https://docs.github.com/en/copilot/reference/ai-models/model-hosting
      - label: Docs index
        value: "GitHub Copilot documentation, plus the VS Code enterprise policy reference."
        url: https://docs.github.com/en/copilot
    items:
      - title: Enterprise and organisation policy framework
        body:
          - "Policies gate which Copilot features, agents and models users can access — named policies include
            MCP servers in Copilot, restricting MCP to registry servers, allowed models, custom models, web
            search, Copilot Memory and suggestions-matching-public-code (blocked by default for Business
            seats). Conflict rules matter for design: within one enterprise the least restrictive setting wins
            across a user's organisations, so a lockdown must be set at the enterprise level to be a
            lockdown."
        links:
          - title: Copilot policy concepts
            url: https://docs.github.com/en/copilot/concepts/enterprise/policies
          - title: Supported surfaces for policies
            url: https://docs.github.com/en/copilot/reference/supported-surfaces-for-policies
      - title: MCP governance and content exclusion
        body:
          - The MCP policy gates whether MCP servers run at all across Copilot clients; server allowlisting
            comes in two strengths — a GitHub-hosted Managed Settings File (GA, matched on name, URL and stdio
            command, not user-bypassable) and a Custom MCP Registry (preview, name matching only, bypassable
            by editing local config). Content exclusion (Business and Enterprise) applies at repository,
            organisation and enterprise scope with fnmatch patterns, but is not honoured by the edit and agent
            modes of Chat in VS Code and other editors, nor by third-party agents — scope guidance
            accordingly.
        links:
          - title: MCP management concepts
            url: https://docs.github.com/en/copilot/concepts/enterprise/mcp-management
          - title: Excluding content from Copilot
            url: >-
              https://docs.github.com/en/copilot/how-tos/configure-content-exclusion/exclude-content-from-copilot
      - title: Audit surface and network posture
        body:
          - The organisation audit log records Copilot licensing, settings and policy changes (action:copilot)
            and the cloud agent's website activity (actor:Copilot) with 180-day retention — it does not
            capture client-side prompts, so IDE-level telemetry needs its own answer. Proxy and firewall
            allowlists are documented per-plan, with a /meta API endpoint for the current domain set.
        links:
          - title: Reviewing audit logs for GitHub Copilot
            url: >-
              https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-enterprise/review-audit-logs
          - title: Proxy and firewall settings for Copilot
            url: https://docs.github.com/en/copilot/reference/copilot-allowlist-reference
      - title: VS Code device policies and the Copilot managed-settings plane
        body:
          - "VS Code's ADMX/plist/policy.json set carries the agent lockdown: ChatAgentMode,
            ChatToolsAutoApprove, ChatToolsTerminalEnableAutoApprove, ChatAgentSandbox*,
            ChatAgentNetworkFilter with allowed/denied domains, ChatMCP / ChatAllowedMcpServers /
            ChatDeniedMcpServers / ChatAllowManagedMcpServersOnly, McpGalleryServiceUrl, ChatPlugins* and
            ChatStrictMarketplaces, ChatHooks / ChatAllowManagedHooksOnly, Claude3PIntegration /
            Codex3PIntegration, ChatApprovedAccountOrganizations and the CopilotOtel* export keys. Developer:
            Policy Diagnostics shows which source won."
          - "The same keys arrive through GitHub's managed-settings.json (permissions deny/ask/allow,
            disableBypassPermissionsMode, allowedMcpServers, enabledPlugins, telemetry). Precedence in VS Code
            1.128+: MDM-delivered managed settings, then server-managed, then the local file — and a Copilot
            managed setting outranks the equivalent VS Code policy."
        links:
          - title: VS Code enterprise policy reference
            url: https://code.visualstudio.com/docs/enterprise/policies
          - title: VS Code AI settings for enterprises
            url: https://code.visualstudio.com/docs/enterprise/ai-settings
          - title: Enterprise managed settings reference
            url: >-
              https://docs.github.com/en/copilot/reference/enterprise-administrators/enterprise-managed-settings
    riskNotes:
      - risk: riskPromptInjection
        note: >-
          Three of the four 2025–26 CVEs on this surface are prompt injection turned into code execution
          (settings-file rewrite in VS Code, shell metacharacters in the JetBrains plugin, consent-prompt
          bypass in the extension host). The vendor mitigations are approval prompts and the sandbox; the
          enterprise controls that survive a successful injection are ChatToolsAutoApprove=false,
          ChatAgentSandboxEnabled and the network filter.
      - risk: riskZombieShadowMCPServers
        note: >-
          The registry-based restriction matches on server name only and is bypassable by editing mcp.json;
          only the managed-settings allowlist (name, URL, stdio command) is a real boundary. Starting a server
          straight from mcp.json also skips the trust prompt.
      - risk: riskSensitiveDataDisclosure
        note: >-
          Content exclusion is not honoured by edit and agent modes, and the IDE can still surface semantic
          information from excluded files. Local BYOK moves prompts off GitHub's ZDR contracts onto whatever
          the developer's provider retains.
      - risk: riskShadowAndUnknownAgents
        note: >-
          Agent Host sessions can run Claude Agent SDK and Codex runtimes inside VS Code; unless
          Claude3PIntegration / Codex3PIntegration are set to false, a "Copilot" seat is also a third-party
          agent seat, with its own model and data path.
    controls:
      - mitigation: D3-MFA
        coverage: partial
        mechanism: >-
          GitHub's own second-factor requirement (Enterprise > Settings > Authentication security > "Require
          two-factor authentication for the enterprise and all of its organizations", optionally "Only allow
          secure two-factor methods") plus client pinning in VS Code (ChatApprovedAccountOrganizations) and
          Visual Studio (ADMX Copilot Settings); the JetBrains, Xcode, Eclipse and Vim plugins cannot be pinned
        steps:
          - title: Require two-factor authentication for every organization
            body:
              - >-
                Enterprise > Settings > Authentication security: select "Require two-factor authentication for
                the enterprise and all of its organizations" and "Only allow secure two-factor methods"; members
                without 2FA cannot reach organization resources until they enable it. The policy is not
                available to Enterprise Managed Users, whose second factor is the IdP's.
            url: >-
              https://docs.github.com/en/enterprise-cloud@latest/admin/enforcing-policies/enforcing-policies-for-your-enterprise/enforcing-policies-for-security-settings-in-your-enterprise
          - title: Pin VS Code to your organizations
            body:
              - >-
                Set the ChatApprovedAccountOrganizations policy to your organization logins; chat, agents and
                inline suggestions stay disabled (the policy is fail-closed) until the signed-in GitHub account
                belongs to one of them and its account-side policy has resolved.
            url: https://code.visualstudio.com/docs/enterprise/ai-settings
          - title: Block personal Copilot plans in Visual Studio
            body:
              - >-
                Deploy the Visual Studio ADMX templates and under Computer Configuration > Administrative
                Templates > Visual Studio > Copilot Settings disable Copilot for individual accounts (17.10+) and
                Copilot Free (17.13+).
            url: >-
              https://learn.microsoft.com/en-us/visualstudio/ide/visual-studio-github-copilot-admin?view=visualstudio
        note: >-
          Partial by the rule applied to every vendor. GitHub's identity layer can require a second factor for
          every organization member, but this entity can pin its client to the organization account only in VS
          Code (ChatApprovedAccountOrganizations, fail-closed) and Visual Studio (ADMX blocks individual and
          Copilot Free plans); the JetBrains, Xcode, Eclipse and Vim plugins document no account pin, so a
          personal account works there. VS Code alone meets the native definition. With Enterprise Managed Users
          the 2FA policy is unavailable: MFA is configured in the IdP and, per GitHub, enforced only at IdP
          sign-in. Paths that skip the second factor once issued: the OAuth token each editor keeps (lifetime not
          documented) and fine-grained PATs (Enterprise > Policies > Personal access tokens can cap lifetime and
          require approval for organization resources; whether that governs the Copilot Requests account
          permission is not documented). In VS Code, Codex sessions can run on a ChatGPT sign-in
          (chat.agentHost.allowSignedOutWhenUsable); Codex3PIntegration=false closes that path.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityIga
          reviewRequired: false
          original:
            - capability: capabilityIga
              coverage: native
              mechanism: >-
                Enterprise licensing (seat assignment, enterprise teams synced from the IdP) plus the VS Code
                ChatApprovedAccountOrganizations device policy and Visual Studio ADMX
              steps:
                - title: Assign seats through enterprise teams or organisations
                  body:
                    - "Enterprise > Billing and licensing > Licensing > Copilot > Manage: assign licences to
                      users or enterprise teams; with Enterprise Managed Users, sync the team to an IdP group
                      so access follows the IdP."
                  url: >-
                    https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-enterprise/manage-access/grant-access
                - title: Gate VS Code chat to approved GitHub organisations
                  body:
                    - Set the ChatApprovedAccountOrganizations policy to the list of organisation logins;
                      chat, agents and inline suggestions stay off until the signed-in account belongs to one,
                      which forces the organisation's policies to apply before any AI feature works.
                  url: https://code.visualstudio.com/docs/enterprise/policies
                - title: Block personal Copilot accounts in Visual Studio
                  body:
                    - Deploy the Visual Studio ADMX templates and use Computer Configuration > Administrative
                      Templates > Visual Studio > Copilot Settings to disable Copilot for individual accounts
                      or Copilot Free.
                  url: https://learn.microsoft.com/en-us/visualstudio/ide/visual-studio-github-copilot-admin
              verified: 2026-09-10
      - mitigation: cap-agent-action-policy-enforcement
        coverage: partial
        mechanism: >-
          Managed permissions.deny / ask / allow (Shell, Read, Edit, Domain selectors) and machine-wide Copilot
          Policy Hooks (preToolUse deny) in VS Code Copilot sessions on Agent Host only; Local-harness sessions
          have ChatToolsEligibleForAutoApproval and Preview PreToolUse hooks (ChatAllowManagedHooksOnly)
        steps:
          - title: Pin deny / ask / allow rules in the managed file
            body:
              - >-
                In copilot/managed-settings.json set permissions.deny, permissions.ask and permissions.allow with
                Shell(...), Read(...), Edit(...) and Domain(...) selectors; deny from any source wins and a managed
                ask cannot be satisfied by bypass mode, auto-approval, a hook or a saved grant. VS Code applies
                these rules only to Copilot sessions that use Agent Host.
            url: >-
              https://docs.github.com/en/copilot/reference/enterprise-administrators/enterprise-managed-settings
          - title: Deploy a machine-wide policy hook
            body:
              - >-
                Install a root-owned hook file in /etc/github-copilot/policy.d/ (Windows
                C:\ProgramData\GitHub\Copilot\policy.d\ or HKLM\Software\Policies\GitHub\Copilot) whose preToolUse
                hook calls your policy service and returns permissionDecision "deny"; policy hooks load first and
                disableAllHooks cannot switch them off.
            url: https://docs.github.com/en/copilot/reference/hooks-reference
          - title: Move editor chat onto the harness that runs them
            body:
              - >-
                Set ChatEditorPreferCopilotHarness=true (VS Code 1.134+) so new editor-chat sessions use the
                Copilot SDK harness, which loads Policy Hooks, and ChatAllowManagedHooksOnly=true so Local-harness
                hooks come only from managed sources and policy-enabled plugins.
            url: https://code.visualstudio.com/docs/enterprise/ai-settings
        note: >-
          Partial by the rule applied to every vendor: the rules cover only some sessions. Inside: VS Code
          Copilot sessions on Agent Host, where managed deny/ask/allow govern shell, file and domain operations
          and a Policy Hook can deny any tool, MCP included (command hooks fail closed on error but open on
          timeout; HTTP preToolUse hooks fail open). Outside: Local-harness sessions (ChatToolsEligibleForAutoApproval
          only forces a prompt, a false terminal rule "does not block the command", and Local PreToolUse hooks
          are Preview), Claude and Codex harness sessions (their own permission
          models), JetBrains (honours only permissions.disableBypassPermissionsMode among the permission keys)
          and Visual Studio, Xcode and Eclipse (no rule engine; Visual Studio can only disable agent mode).
          Managed selectors do not name MCP tools; only a hook does. VS Code's AI-settings page still warns that
          the granular permissions are "supported only in GitHub Copilot CLI" while GitHub's reference and the
          2026-09-09 changelog list VS Code Agent Host sessions — test before relying on them.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAgentRuntimeEnforcement
          reviewRequired: false
          original:
            - capability: capabilityAgentRuntimeEnforcement
              coverage: native
              mechanism: >-
                managed-settings.json permissions.deny / ask / allow (Shell, Read, Edit, Domain selectors; GA
                2026-09-09) for VS Code Agent Host sessions, plus PreToolUse hooks
              steps:
                - title: Pin deny / ask / allow rules in the managed file
                  body:
                    - Write permissions.deny, permissions.ask and permissions.allow with Shell(...), Read(...), Edit(...) and
                      Domain(...) selectors. Deny wins from any source, ask forces a fresh approval that bypass mode
                      cannot satisfy, and the effective allow list is the intersection of all sources.
                  url: >-
                    https://docs.github.com/en/copilot/reference/enterprise-administrators/enterprise-managed-settings
                - title: Confirm the client honours managed permissions
                  body:
                    - Managed permissions are enforced in VS Code sessions that use Agent Host, the Copilot app and the CLI; the
                      reference matrix shows JetBrains honouring only permissions.disableBypassPermissionsMode, so
                      JetBrains lockdown relies on that key and the sandbox.
                  url: >-
                    https://github.blog/changelog/2026-09-09-enterprise-managed-permissions-for-github-copilot-agent-operations/
                - title: Add a PreToolUse hook as a second gate
                  body:
                    - VS Code runs .github/hooks/*.json and ~/.copilot/hooks; a PreToolUse hook returns permissionDecision allow
                      / deny / ask. Set ChatAllowManagedHooksOnly so only enterprise-managed hooks and
                      policy-enabled plugins can register.
                  url: https://code.visualstudio.com/docs/agent-customization/hooks
              note: >-
                Component-specific: managed permissions and PreToolUse hooks apply to VS Code Agent Host
                sessions (enterprise-managed settings page); the VS Code enterprise AI settings page governs
                editor policies and auto-approval, a different scope. JetBrains, Visual Studio and the other
                plugins have no runtime rule engine. Where the two pages appear to conflict, the
                enterprise-managed settings reference is the narrower and authoritative one.
              verified: 2026-09-10
      - mitigation: cap-ai-vendor-assessment
        coverage: external
        mechanism: >-
          No vendor feature; the organisation's TPRM platform assesses GitHub and each model provider from the
          GitHub Copilot Trust Center and the model-hosting page
        evidence:
          - title: GitHub Copilot Trust Center (compliance reports; most documents behind Request access)
            url: https://copilot.github.trust.page/
          - title: Hosting of models for GitHub Copilot (providers and retention terms)
            url: https://docs.github.com/en/copilot/reference/ai-models/model-hosting
        note: >-
          External: the organisation's TPRM platform owns the assessment. Rendered in a browser on 2026-09-25 the
          trust center lists SOC 1, SOC 2 and SOC 3 (SOC 1 Type 2 and SOC 2 Type 2 reports), ISO 27001:2013,
          ISO/IEC 42001:2023, CSA STAR Level 2, TISAX, a 2026 CAIQ, a PCI DSS AOC and bug-bounty letters, most
          behind Request access; no penetration-test summary is listed. Treat GitHub plus each model provider as
          the subprocessor set: OpenAI on Azure, Anthropic models on AWS, Anthropic and Google Cloud (Claude
          Fable 5 / 5.1 retain prompts and outputs by default outside the ZDR agreement; a ZDR exemption can be
          requested through end-2026), Google, xAI, and Moonshot models on Azure AI Foundry and Fireworks. The
          hosting page changes with each model launch; local BYOK moves prompts to whatever provider the
          developer configures.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAiTprm
          reviewRequired: false
          original:
            - capability: capabilityAiTprm
              coverage: external
              mechanism: >-
                No vendor feature; the assessment inputs are the model-hosting page (providers, ZDR terms) and
                the Copilot Trust Center
              note: >-
                Treat GitHub plus each model provider (OpenAI on Azure, Anthropic on AWS/GCP/Anthropic,
                Google, xAI, Moonshot on Foundry/Fireworks) as the subprocessor set; the hosting page is the
                only first-party list and it changes with every model launch. The trust centre page did not
                render for automated fetch on 2026-09-10.
              steps:
                - title: Record the model-provider set and their retention terms
                  body:
                    - Use the hosting page to enumerate where each model runs and which retain data (Claude Fable 5 / 5.1 retain
                      by default; request the ZDR exemption).
                  url: https://docs.github.com/en/copilot/reference/ai-models/model-hosting
              verified: 2026-09-10
      - mitigation: cap-sensitive-data-redaction
        coverage: partial
        mechanism: >-
          No built-in detector; Copilot Policy Hooks in VS Code Copilot sessions on Agent Host can rewrite or
          deny prompt and tool traffic (userPromptTransformed, preToolUse modifiedArgs, postToolUse
          modifiedResult); content exclusion as data minimisation
        steps:
          - title: Hand prompt and tool traffic to your inspector
            body:
              - >-
                In a root-owned /etc/github-copilot/policy.d/*.json policy hook, return modifiedTransformedPrompt
                from userPromptTransformed with secrets masked, and have preToolUse and postToolUse call your DLP
                service and deny or return modifiedArgs / modifiedResult.
            url: https://docs.github.com/en/copilot/reference/hooks-reference
          - title: Route editor chat through the harness that runs the hooks
            body:
              - >-
                Set ChatEditorPreferCopilotHarness=true; Local-harness sessions do not load Policy Hooks.
            url: https://code.visualstudio.com/docs/enterprise/ai-settings
          - title: Exclude secret-bearing paths
            body:
              - >-
                Enterprise > AI controls > Copilot > Content exclusion (or the organization's Copilot > Content
                exclusion): add fnmatch entries such as "*": ["**/.env"]; changes can take up to 30 minutes to
                reach IDEs that already loaded the settings.
            url: >-
              https://docs.github.com/en/copilot/how-tos/configure-content-exclusion/exclude-content-from-copilot
        note: >-
          Partial by the rule applied to every vendor: no Copilot editor detects secrets or PII itself; the
          Agent Host Copilot harness exposes inline hooks that can block or rewrite prompt and tool content, an
          attach point that works only once the organisation attaches a detector (userPromptSubmitted
          config-file hooks cannot change the prompt; userPromptTransformed can). Content exclusion is path
          filtering, credited as data minimisation: VS Code honours it in chat but not in Edit or Agent mode,
          Xcode and Eclipse chat do not honour it, symlinks and remote filesystems are exempt, and IDE-provided
          type information from excluded files can still reach the model. Local-harness, Claude and Codex
          sessions and the other editors have no such hook; endpoint DLP or an SSE / AI gateway covers them.
          telemetry.captureContent=false with lockCaptureContent keeps prompts out of the OTel export — data
          minimisation of telemetry, not redaction.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAiDlp
          reviewRequired: false
          original:
            - capability: capabilityAiDlp
              coverage: partial
              mechanism: >-
                Content exclusion (repository / organisation / enterprise) plus telemetry.captureContent=false
                with lockCaptureContent
              note: >-
                Content exclusion is a context filter, not DLP: it does not apply to edit and agent modes,
                symlinks or remote filesystems, and IDE-provided type information can still leak. Inline
                inspection of the prompt stream needs an SSE or endpoint DLP product.
              steps:
                - title: Exclude secret-bearing paths at enterprise scope
                  body:
                    - 'Enterprise > AI controls > Copilot > Content exclusion (or Organization Settings > Copilot > Content
                      exclusion): add fnmatch entries such as "*": ["**/.env"] and per-repository paths; changes
                      propagate within 30 minutes.'
                  url: >-
                    https://docs.github.com/en/copilot/how-tos/configure-content-exclusion/exclude-content-from-copilot
                - title: Keep prompt content out of the telemetry export
                  body:
                    - In managed-settings.json set telemetry.captureContent to false and telemetry.lockCaptureContent to true so
                      users cannot turn content capture on.
                  url: https://code.visualstudio.com/docs/enterprise/ai-settings
              verified: 2026-09-10
      - mitigation: cap-input-guardrails
        coverage: partial
        mechanism: >-
          No classifier; a Copilot Policy Hook's postToolUse can replace a tool result before the model sees it
          (VS Code Copilot sessions on Agent Host); URL response review and Workspace Trust are human review and
          admission
        steps:
          - title: Screen tool results with a post-tool hook
            body:
              - >-
                In a policy hook, have postToolUse send each result to your classifier and return modifiedResult
                (a replacement textResultForLlm) or a failure when it flags injected instructions.
            url: https://docs.github.com/en/copilot/reference/hooks-reference
          - title: Keep fetched content under review
            body:
              - >-
                Leave chat.tools.urls.autoApprove without approveResponse: true entries so fetched pages are shown
                for review before they are added to the chat context.
            url: https://code.visualstudio.com/docs/agents/run/approvals
        note: >-
          Partial by the rule applied to every vendor: GitHub ships no injection classifier for tool results,
          fetched pages or repository files in any editor. The post-tool hook is an attach point in VS Code
          Copilot sessions on Agent Host only; URL response approval is a person reading content, and Workspace
          Trust and MCP server trust are admission decisions, not screening. For Local-harness, Claude and Codex
          sessions and the other editors the answer is external: an AI or MCP gateway classifier on the brokered
          path. Prompt injection produced code execution on this surface (CVE-2025-53773, CVE-2026-21516).
        verified: "2026-09-25"
        migration:
          from:
            - capabilityPromptInjectionDefense
          reviewRequired: false
          original:
            - capability: capabilityPromptInjectionDefense
              coverage: partial
              mechanism: >-
                VS Code two-step URL approval, Workspace Trust restricted mode, edit review flow; no
                configurable injection classifier
              note: >-
                Defences are structural (approvals, trust boundaries, sandbox), not detection. Prompt
                injection has produced RCE on this surface twice (CVE-2025-53773, CVE-2026-21516), so pair
                these with tool scoping and egress control rather than relying on them.
              steps:
                - title: Keep the structural defences on
                  body:
                    - Leave URL fetching on the two-step trust-domain-then-review flow, keep Workspace Trust so untrusted
                      folders open in restricted mode with agents disabled, and require edit review before commits.
                  url: https://code.visualstudio.com/docs/agents/run/security
              verified: 2026-09-10
      - mitigation: AML.M0028
