# Mastra: one entity per product × reference architecture. Facts are dated (asOf) and cite the vendor's
# own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# Exclusions: Mastra Factory and createCodingAgent() (a coding agent built on the framework), Agent Builder (EE),
# Connect (public beta, OAuth-managed SaaS toolsets), channels (Slack, Teams, Discord and others), voice, the
# browser tools and ACP are features of the same packages and are not assessed here; they are named only where a
# row depends on them. Mastra Gateway and the Mastra platform (Server, Studio, Observability) are recorded as
# variants and in the rows where the framework docs wire them in. Knowledge is alpha (added in @mastra/core 1.82.0).
# 2026-11-21: onboarded for @mastra/core 1.85.0 (published 2026-11-18). Every mastra.ai page cited was read as its
# .md variant through mastra.ai/llms.txt and answered 200; the HTML URLs written here answered 200 with no
# redirect. api.npmjs.org (downloads) and registry.npmjs.org answered 200; www.npmjs.com answered 403 to curl.
# github.com answered 403 to curl and the GitHub API is limited to this session's repositories, so the
# repository's security-advisories pages and github.com/advisories were read with WebFetch; OSV
# (api.osv.dev) listed the June 2026 malicious-release records for the @mastra scope.
# Independent check 2026-11-21: mastra.ai/pricing (HTML, 200) gives the platform's plan trace retention, which
# differs from the platform observability docs; NVD and OSV give CVE-2025-61685's fixed version as 0.13.20.
vendor: mastra
family: Mastra
tools:
  - id: toolMastra
    name: Mastra
    surfaceClasses:
      - sdkFramework
    variants:
      - name: "@mastra/core (TypeScript: Agent, createTool, workflows, processors, memory, workspaces)"
        class: sdkFramework
        url: https://mastra.ai/docs/agents/overview
      - name: "@mastra/mcp (MCP client and server)"
        class: sdkFramework
        url: https://mastra.ai/docs/connections/mcp
      - name: "@mastra/observability (tracing, exporters, SensitiveDataFilter)"
        class: sdkFramework
        url: https://mastra.ai/docs/observability/overview
      - name: "mastra CLI and Mastra Server (mastra build: a Hono server for agents, workflows, MCP and A2A)"
        class: sdkFramework
        url: https://mastra.ai/docs/deployment/mastra-server
      - name: "Mastra platform (Server, Studio and Observability on projects.mastra.ai; Mastra Gateway)"
        class: sdkFramework
        url: https://mastra.ai/docs/mastra-platform/overview
    architecture: archChatAgent
    fills: [agent]
    builder:
      kind: framework
      what: "Open-source TypeScript framework for agents with tools, memory, workflows that suspend and resume, MCP and A2A, guardrails, evals and tracing."
      languages: ["TypeScript"]
      usage:
        downloads: 14556426
        registry: npm
        package: "@mastra/core"
        asOf: "2026-11"
        url: https://www.npmjs.com/package/@mastra/core
      also:
        - architecture: archActionAgent
          fills: [planner]
          url: https://mastra.ai/docs/harness/overview
        - architecture: archAgentWorkflow
          fills: [harness, orchestration, subagents]
          url: https://mastra.ai/docs/subagents
        - architecture: archAgentFederation
          fills: [harness]
          url: https://mastra.ai/docs/connections/a2a
    status: ga
    asOf: "2026-11"
    summary:
      - >-
        An open-source TypeScript framework (Apache-2.0, with source-available Enterprise features under ee/)
        that runs the agent loop inside the customer's own Node.js process: an Agent with tools, subagents and
        workflows as tools, a model router that calls the provider directly with that provider's key from the
        environment (or Mastra Gateway with a mastra/ model ID), Memory (threads, working memory, semantic recall),
        workflows that suspend and resume from snapshots, an MCP client and server, an A2A client and server, and
        workspaces whose sandbox is a LocalSandbox on the host or a container or remote provider. mastra build
        produces a Hono server that exposes agents, workflows, tools, memory, MCP and A2A over HTTP, self-hosted
        or deployed to the Mastra platform.
      - >-
        State lives in the storage adapter the application configures (in-memory by default, lost on restart):
        threads and messages, working memory, suspended-run snapshots, traces and eval scores. What leaves the
        process: prompts, history and tool results to the model provider, the same text to whatever model each
        LLM-backed guardrail processor names, spans only to the exporters configured (Mastra platform when
        MASTRA_PLATFORM_ACCESS_TOKEN is set), and usage telemetry to Mastra unless MASTRA_TELEMETRY_DISABLED=1.
      - >-
        Switches it has: server.auth (none by default, so every route and Studio are public), mapUserToResourceId,
        RBAC and FGA (Enterprise licence in production), requireApproval and requireToolApproval, maxSteps (5 by
        default), modelSettings.timeout, shipped processors (PromptInjectionDetector, PIIDetector,
        RegexFilterProcessor, TokenCostControl), MCP allowedHosts and per-server approval, SensitiveDataFilter on
        by default in tracing, and LocalSandbox native isolation. Code the deployer writes: the policy in
        beforeToolCall, screening of tool results in processToolResult, binding an approval to its arguments,
        rate limiting, and egress control for everything outside a sandbox.
    facts:
      - label: Plans
        value: >-
          Free, Apache-2.0 framework (npm install @mastra/core). Code under ee/ (RBAC, FGA, a Studio sign-in screen
          with a third-party provider, Agent Builder) needs a Mastra Enterprise licence in MASTRA_LICENSE_KEY in
          production; without it the server does not start with RBAC or FGA configured. The Mastra platform (a Free
          tier, then Starter, Team and Enterprise plans) and Mastra Gateway (prepaid credit or BYOK) are separate
          services of the same vendor.
        url: https://mastra.ai/docs/license
      - label: Inference & routing
        value: >-
          Model router strings (provider/model) read that provider's key from the environment (for example
          ANTHROPIC_API_KEY) and call the provider directly; model fallbacks can switch provider at the application
          level. A gateway such as OpenRouter is named the same way, as provider/model-name.
        url: https://mastra.ai/models
      - label: Data leaving the device
        value: >-
          From the customer's server: prompts, files, tool definitions and tool results to the model provider or
          Gateway, and to each model-backed processor's own model. Spans, logs and metrics go only to the exporters
          configured; MastraPlatformExporter sends them to the Mastra platform when MASTRA_PLATFORM_ACCESS_TOKEN is
          set.
        url: https://mastra.ai/docs/observability/overview
      - label: Retention & training
        value: >-
          The framework keeps data in the application's storage; growth tables (messages, threads, spans, run
          records) are kept forever until retention maxAge is declared and storage.prune() runs. Training on prompts
          is governed by the model provider's terms; Mastra documents no training use of its own.
        url: https://mastra.ai/reference/storage/retention
      - label: Docs index
        value: >-
          mastra.ai/llms.txt (every page also as .md; reference at mastra.ai/reference); @mastra/core 1.85.0 on npm,
          published 2026-11-18.
        url: https://mastra.ai/llms.txt
      - label: Usage telemetry
        value: >-
          The CLI, server and Studio send usage telemetry to Mastra by default (OS, Mastra and Node.js versions,
          token counts per model, component counts, hashed or platform project IDs; no prompts or responses);
          MASTRA_TELEMETRY_DISABLED=1 turns all of it off.
        url: https://mastra.ai/reference/cli/mastra
      - label: Server defaults
        value: >-
          CORS origin defaults to '*'; OpenAPI and Swagger are off in production; the built-in MCP endpoint is served
          in production only when server.auth is set; requests time out after 180000 ms and bodies are limited to
          4.5 MB; without mapUserToResourceId built-in routes trust the client-supplied resource ID.
        url: https://mastra.ai/reference/configuration
      - label: Mastra platform observability retention
        value: >-
          Trace retention on the platform is 15 days on Free, 60 days on Starter, 180 days on Team and custom on
          Enterprise, per the pricing page; the platform observability docs still give 15 days on Starter and 6 months
          on Teams, and defer to pricing for current limits.
        url: https://mastra.ai/pricing
      - label: Mastra platform region
        value: >-
          Server and Studio deploys run on Railway compute in the us zone (Portland by default) or eu (Amsterdam),
          fixed when the environment is created; hosted databases and observability follow the environment's region.
        url: https://mastra.ai/docs/mastra-platform/deploy/regions
      - label: Mastra Gateway
        value: >-
          A mastra/<provider>/<model> model ID sends calls through Mastra Gateway, one managed API that fails over
          between providers, supports bring-your-own-key connections and can limit each key to named models.
        url: https://mastra.ai/docs/mastra-platform/gateway/overview
      - label: Mastra Gateway limits and logs
        value: >-
          Prepaid credit or BYOK; per-key limits of 2,000 requests a minute and 400 per 10 seconds, an optional
          organisation-wide per-minute cap and an organisation spend cap; Gateway logs do not store prompts,
          completions, images or audio.
        url: https://mastra.ai/docs/mastra-platform/gateway/usage-and-limits
    items:
      - title: Configure server.auth before the first deploy
        body:
          - >-
            A Mastra server with no auth provider serves every agent, workflow, memory, MCP and A2A route
            anonymously, on the platform too. Set MastraJwtAuth with your IdP's jwksUri and issuer (or the IdP's
            Mastra provider) and mapUserToResourceId before exposing the URL.
        links:
          - title: Auth
            url: https://mastra.ai/docs/auth/overview
          - title: Server on Mastra platform
            url: https://mastra.ai/docs/mastra-platform/deploy/server
      - title: Pin the @mastra packages
        body:
          - >-
            On 2026-06-17 about 140 @mastra/* releases, @mastra/core 1.42.1 among them, were republished through a
            former contributor's npm account with a dependency whose postinstall script ran a dropper. Commit a
            lockfile, install through a scanning mirror, and check lockfiles for releases from that day.
        links:
          - title: GHSA-pp62-grrw-hvfp (Malware in @mastra/core)
            url: https://github.com/advisories/GHSA-pp62-grrw-hvfp
    riskNotes:
      - risk: riskPromptInjection
        note: >-
          PromptInjectionDetector screens input messages only and fails open by default (errorStrategy 'warn'); the
          MCP client states that it does not sanitise tool responses, so tool and MCP results reach the model
          unscreened unless the deployer adds a processToolResult processor.
      - risk: riskRogueActions
        note: >-
          Tools run as soon as the model calls them unless requireApproval or requireToolApproval is set, workspace
          shell and file tools default to requireApproval false, and approving without a toolCallId resumes the most
          recent suspended call.
      - risk: riskAgenticDelegationConfusedDeputy
        note: >-
          Without server.auth every route is public, and without mapUserToResourceId built-in routes trust the
          resource ID the client sends; FGA does not check direct createRun().start(), resume() or restart() calls.
      - risk: riskRunawayAgentToolLoops
        note: >-
          maxSteps defaults to 5 and a supervisor model cannot raise a subagent above its defaultOptions.maxSteps,
          but onDelegationStart modifiedMaxSteps can; TokenCostControl is approximate and fast runs can overshoot it.
      - risk: riskToolSourceProvenance
        note: >-
          The June 2026 npm scope takeover republished about 140 @mastra/* packages with a caret-ranged dependency
          that resolved to a malicious release at install time; stdio MCP servers start from whatever command or npx
          package the application names.
      - risk: riskInsecureIntegratedComponent
        note: >-
          LocalSandbox runs commands on the host with the application's permissions until isolation is set, and a
          static sandbox is shared across every request and thread that uses the agent.
      - risk: riskExcessiveDataHandlingDuringInference
        note: >-
          Model-backed guardrails (PromptInjectionDetector, PIIDetector, ModerationProcessor) send the text they
          inspect to their own configured model, and spans carry inputs and outputs except fields SensitiveDataFilter
          matches by name.
      - risk: riskToolRegistryTampering
        note: >-
          listTools() returns whatever each MCP server serves at that moment, with no pinning of definitions, and
          when two servers produce the same namespaced tool name the later server's tool replaces the earlier one
          with only a logged warning.
    controls:
      - mitigation: cap-agent-tool-registry
        coverage: partial
        mechanism: >-
          Tools, subagents and workflows declared per Agent in code (static or resolved from requestContext) and
          registered on the Mastra instance; activeTools per call; Studio editor draft and published versions for
          database-backed agents; MCP tool lists fetched from each server at runtime
        steps:
          - title: Declare each agent's catalogue in reviewed code
            body:
              - >-
                Give every Agent an explicit tools, agents and workflows map (or a tools function of requestContext)
                and narrow it per call with activeTools.
            url: https://mastra.ai/reference/agents/agent
          - title: Serve only published agent versions
            body:
              - >-
                For database-backed agents edited in Studio, load them with mastra.getAgentById(id, { status:
                'published' }) so saved drafts are never served.
            url: https://mastra.ai/docs/studio/editor
        note: >-
          Partial by this drawing's rule, as for toolVercelAiSdk (tools declared in code per call; native only with an
          enforced registry): the framework knows exactly what each agent was given, and stored agents carry draft
          and published versions, but there is no record of owner or approval state for tools and MCP servers,
          nothing consults a registry before a tool is offered, and MCP tool lists come from the server at runtime.
          FGA can deny a user an agent or tool, which is authorisation, not an inventory.
        verified: "2026-11-21"
      - mitigation: cap-staged-rollout-gate
        coverage: partial
        mechanism: >-
          runEvals gates, thresholds and a single verdict for CI; datasets and experiments; Studio editor draft and
          published versions with selection by version ID; Mastra platform environments (production, staging,
          preview) with deploy history and redeploy of a prior artifact
        steps:
          - title: Gate the release on an eval verdict
            body:
              - >-
                Run runEvals with gates (scorers that must score 1.0) and thresholds against a protected dataset in CI
                and fail the job unless result.verdict is 'passed'.
            url: https://mastra.ai/docs/evals/gates-and-verdicts
          - title: Deploy to a staging environment first
            body:
              - >-
                Deploy the change with mastra deploy --env staging, which has its own URL, variables and deploy
                history, before deploying to production.
            url: https://mastra.ai/docs/mastra-platform/deploy/environments
          - title: Keep the rollback path
            body:
              - >-
                Roll back by redeploying the last known-good artifact from the environment's deploy history in the
                dashboard.
            url: https://mastra.ai/docs/mastra-platform/deploy/overview
        note: >-
          Partial, not external as for toolVercelAiSdk and toolOpenaiAgentsSdk, because Mastra ships the
          evaluation-gate primitive (gates that must score 1.0 and one verdict) and, on its platform, per-environment
          deploy history with redeploy of a prior artifact. The deployer owns the CI job that blocks the release and
          the protection of the test set; no canary traffic split or automatic rollback trigger is documented, and
          rollback is a manual redeploy.
        verified: "2026-11-21"
      - mitigation: AML.M0029
        coverage: native
        mechanism: >-
          requireApproval on createTool; requireToolApproval on stream() and generate() (true or a function over
          toolName, args and requestContext) and on MCP server definitions; tools.requireApproval on workspace
          tools; the run suspends with a tool-call-approval chunk (toolCallId, toolName, args) saved as a snapshot
          and continues on approveToolCall or declineToolCall for that toolCallId; listSuspendedRuns rediscovers
          pending approvals after a restart
        steps:
          - title: Mark consequential tools for approval
            body:
              - >-
                Set requireApproval: true on each tool that writes, sends, deletes or spends, and requireToolApproval
                on MCP servers and workspaces whose tools change data.
            url: https://mastra.ai/docs/agents/human-in-the-loop
          - title: Answer the exact call by its ID
            body:
              - >-
                Show toolName and args from the tool-call-approval chunk and call approveToolCall or declineToolCall
                with the runId and that toolCallId, with persistent storage configured so the snapshot survives.
            url: https://mastra.ai/docs/agents/human-in-the-loop
          - title: Bind the approval to the arguments
            body:
              - >-
                Fingerprint toolName and args when the request is shown and refuse in beforeToolCall when the
                executing call's fingerprint was not the one approved, stored per user, run and tool call.
            url: https://mastra.ai/docs/agents/human-in-the-loop
        note: >-
          Native on the same rule as toolVercelAiSdk and toolOpenaiAgentsSdk: a built-in primitive holds the exact
          call after schema validation until the application records a decision for that toolCallId, approvals from
          subagents surface at the supervisor, and a requireToolApproval function that throws requires approval. The
          deployer supplies the approver's authentication, the UI and expiry; Mastra keeps a decline reason but no
          approver identity, and binding to the arguments is the fingerprint pattern the docs show, in the
          deployer's code. Boundaries: approval is opt-in (workspace tools default to false); a call answered without
          toolCallId resumes the most recent suspended call; durable and stored agents accept only a boolean;
          autoResumeSuspendedTools fills suspend() answers from the next chat message but never approves a
          requireApproval tool; recoverResume re-runs an approved tool once a claim is abandoned for 60 seconds; a
          classifier deciding requireToolApproval is not human approval.
        verified: "2026-11-21"
      - mitigation: D3-APA
        coverage: partial
        mechanism: >-
          server.auth providers (MastraJwtAuth with a secret or JWKS and issuer, IdP integrations, custom providers);
          mapUserToResourceId and the reserved request-context keys enforcing thread ownership; RBAC and FGA providers
          (Enterprise licence) checked at agent, workflow, tool, MCP tool, thread and route lifecycle points, with
          requireForProtectedRoutes and auditProtectedRoutes
        steps:
          - title: Authenticate every route
            body:
              - >-
                Set server.auth to MastraJwtAuth({ jwksUri, issuer }) or your IdP's provider, and update
                server.auth.protected and public if you change server.apiPrefix.
            url: https://mastra.ai/docs/auth/overview
          - title: Take identity from authentication
            body:
              - >-
                Set mapUserToResourceId so the server, not the request body, sets MASTRA_RESOURCE_ID_KEY for memory
                and thread checks.
            url: https://mastra.ai/reference/configuration
          - title: Administer resource-level policy
            body:
              - >-
                Configure server.fga with resourceMapping and permissionMapping, requireForProtectedRoutes: true,
                auditProtectedRoutes: 'error' and validatePermissions at start-up.
            url: https://mastra.ai/docs/auth/fga
        note: >-
          Partial on the rule applied to toolVercelAiSdk (the deployer's auth and policy store; name the framework's
          enforcement points): once a provider is configured Mastra enforces the decision at its built-in lifecycle
          points, but it authenticates nobody itself, holds no policy (FGA delegates to WorkOS or a custom
          IFGAProvider) and needs the Enterprise licence for RBAC and FGA in production. Defaults are open: with no
          server.auth every route and Studio are public; without mapUserToResourceId built-in routes trust a
          client-supplied resource ID; FGA does not check direct createRun().start(), resume() or restart() calls,
          or MCP resources, prompts and subscriptions.
        verified: "2026-11-21"
      - mitigation: AML.M0028
        coverage: native
        mechanism: >-
          Per-agent tools (static or a function of requestContext) and activeTools per call; inputSchema validated
          before execute and before an approval is requested; requestContextSchema checked before execute;
          outputSchema with outputValidation 'strict' by default; FGA tools:execute checked for the user on each
          agent tool (agentId:toolName) and MCP tool call
        steps:
          - title: Expose only the user's tools
            body:
              - >-
                Resolve tools from requestContext on the Agent, or pass activeTools computed from the authenticated
                user's role on each generate() or stream() call.
            url: https://mastra.ai/reference/agents/generate
          - title: Validate every argument and the caller
            body:
              - >-
                Give each tool a bounded inputSchema (enums, ranges, patterns) and a requestContextSchema that
                requires the authenticated user's ID.
            url: https://mastra.ai/reference/tools/create-tool
          - title: Authorise each tool for the user
            body:
              - >-
                With server.fga configured, map tools:execute to your policy store; agent tool checks use the
                resource ID agentId:toolName.
            url: https://mastra.ai/docs/auth/fga
        note: >-
          Native on this drawing's rule as applied to toolVercelAiSdk (tool selection and schema validation enforced
          outside the model, with a per-principal decision): invalid arguments and a missing authenticated context
          never reach execute, and with FGA configured the user's permission is checked on each agent tool call.
          Boundaries: FGA needs the Enterprise licence and decides per tool, not per record or argument, so
          record-level checks live in the tool or in beforeToolCall; activeTools defaults to every tool; MCP tool
          schemas come from the server; client tools run in the browser; every tool runs with the process's
          credentials unless it selects the caller's from requestContext.
        verified: "2026-11-21"
      - mitigation: D3-AA
        coverage: partial
        mechanism: >-
          server.auth verifying callers, agents and services calling the A2A and MCP endpoints included (MastraJwtAuth
          with JWKS and issuer, IdP providers); MCPOAuthClientProvider giving the application its own OAuth client
          identity at each MCP server; A2A agent-card signing and verifyAgentCard; Mastra Gateway project keys with
          expiry; per-deploy Gateway keys on the platform (rolling out)
        steps:
          - title: Authenticate agents that call yours
            body:
              - >-
                Set server.auth to MastraJwtAuth with your IdP's jwksUri and issuer so A2A and MCP callers present
                IdP-issued tokens.
            url: https://mastra.ai/reference/auth/jwt
          - title: Give your agent its own client at tool servers
            body:
              - >-
                Configure MCPOAuthClientProvider with a clientMetadataUrl (or pre-registered clientInformation) on
                each OAuth-protected MCP server instead of a shared bearer key.
            url: https://mastra.ai/reference/tools/mcp-client
          - title: Verify peers before delegating
            body:
              - >-
                Set verifyAgentCard on each A2AAgent to require the expected provider, endpoint and a signature from
                a key you trust.
            url: https://mastra.ai/docs/connections/a2a
        note: >-
          Partial by the rule for this drawing (the framework authenticates with what the host supplies and mints no
          agent identity). Agent IDs and names label spans and routes but are not principals; every agent in a
          Mastra instance shares the process's provider keys and MCP credentials unless the application gives each
          its own; per-deploy Gateway keys are still rolling out. Issuance, rotation and revocation of workload
          identities are the IdP's or the platform's.
        verified: "2026-11-21"
      - mitigation: D3-CH
        coverage: partial
        mechanism: >-
          Provider keys read from environment variables by the model router; Mastra platform variables stored as
          write-only encrypted secrets by default; Gateway keys stored as a hash, with expiry and allowed models;
          MCPOAuthClientProvider tokens bound to the validated issuer; stdio MCP servers given a curated environment;
          LocalSandbox passing only PATH by default; SensitiveDataFilter redacting credential-named span fields
        steps:
          - title: Keep keys in write-only secrets
            body:
              - >-
                Store provider and Gateway keys as platform Secrets (the default for new variables) or in your secret
                manager, and deploy with a reviewed --env-file.
            url: https://mastra.ai/docs/mastra-platform/deploy/environments
          - title: Use expiring, narrow keys
            body:
              - >-
                Create one project-scoped Gateway key per deployment with an Expiry and Allowed models; revoke and
                replace it rather than editing.
            url: https://mastra.ai/docs/mastra-platform/gateway/keys-and-byok
          - title: Select tool credentials in trusted code
            body:
              - >-
                Read the tenant from requestContext inside the tool and fetch a least-privilege credential there,
                keeping tokens out of instructions, tool arguments and tool results.
            url: https://mastra.ai/docs/guides/authentication-identity
        note: >-
          Partial by this drawing's rule (native only where short-lived credentials are configured through the
          product): only Gateway keys with an expiry, per-deploy keys being rolled out and OAuth-managed MCP tokens
          can be short-lived; provider keys are standing environment variables, and the docs state that Mastra has
          no backend-neutral credential broker for sandboxes, so a variable passed to a sandbox command is readable by
          code there. Storage of OAuth tokens and tool credentials is the application's, and SensitiveDataFilter
          matches field names, not secrets in free text.
        verified: "2026-11-21"
      - mitigation: AML.M0031
        coverage: partial
        mechanism: >-
          Memory threads owned by a resourceId fixed at creation; MASTRA_RESOURCE_ID_KEY (set by
          mapUserToResourceId) forcing the authenticated resource, with 403 on threads it does not own; subagent
          memory isolated per delegation; working memory and semantic recall scoped to the resource by default or to
          the thread; FGA memory permissions; storage retention with prune()
        steps:
          - title: Bind memory to the authenticated user
            body:
              - >-
                Set mapUserToResourceId (and MASTRA_THREAD_ID_KEY where middleware pins the thread) so the server
                rejects threads the caller does not own.
            url: https://mastra.ai/docs/server/request-context
          - title: Keep recall inside the conversation where needed
            body:
              - >-
                Set working memory and semantic recall to scope 'thread' for agents whose conversations must not share
                facts or embeddings.
            url: https://mastra.ai/docs/memory/overview
          - title: Expire history
            body:
              - >-
                Declare retention maxAge for memory messages and threads and run storage.prune() from a scheduled
                maintenance job.
            url: https://mastra.ai/reference/storage/retention
        note: >-
          Partial by this drawing's rule (session objects the deployer scopes, as for toolVercelAiSdk): the server
          enforces thread ownership only when the resource ID comes from authentication, and working memory and
          semantic recall default to resource scope, so facts and embeddings are shared across a user's threads and
          across agents given the same resourceId. Nothing validates what a turn writes; tool results and
          working-memory updates persist as written. Mastra adds no encryption of its own (that is the storage
          backend's), retention is opt-in and unconfigured data is kept forever, and the default in-memory store
          loses suspended runs on restart.
        verified: "2026-11-21"
      - mitigation: cap-data-access-governance
        coverage: partial
        mechanism: >-
          Knowledge (alpha) returning only the pages and notes the run's server-set scopes reach; reserved
          request-context keys and FGA for threads; a per-tenant vectorStore resolver and a server-set filter on
          createVectorQueryTool; request-scoped credentials selected in tool code or forwarded by an MCPClient custom
          fetch
        steps:
          - title: Set run scopes from authentication
            body:
              - >-
                In server middleware set MASTRA_SCOPES_KEY from the authenticated user (org, team, resource) and set
                MASTRA_RESOURCE_ID_KEY to the same user.
            url: https://mastra.ai/docs/knowledge/scopes-and-access
          - title: Retrieve within the caller's tenant
            body:
              - >-
                Build createVectorQueryTool with a vectorStore resolver that picks the tenant's store from
                requestContext, and set the filter in requestContext on the server.
            url: https://mastra.ai/reference/tools/vector-query-tool
          - title: Call data sources on the user's credential
            body:
              - >-
                Select a tenant-scoped credential from the authenticated user in the tool, or send the token intended
                for an MCP server from MASTRA_AUTH_TOKEN_KEY.
            url: https://mastra.ai/docs/guides/authentication-identity
        note: >-
          Partial by the rule applied to toolVercelAiSdk (external unless the framework ships retrieval with identity
          passthrough): Mastra's own Knowledge store enforces the run's scopes on every tool call, but it is alpha, has
          no guardrail against an agent holding two scopes copying between them, and covers only content loaded into
          it. Vector stores, MCP servers and other sources apply the user's entitlements only when tool code passes
          that user's tenant or token; oversharing analysis and remediation of the source repositories are outside
          the framework.
        verified: "2026-11-21"
      - mitigation: cap-retrieval-grounding-checks
        coverage: partial
        mechanism: >-
          Knowledge scopes keeping each tenant's pages and notes separate (alpha); a per-tenant vectorStore resolver
          on the vector query tool; faithfulness and hallucination scorers for evaluation runs; no ingest screening or
          run-time grounding gate
        steps:
          - title: Isolate each tenant's index
            body:
              - >-
                Declare one Knowledge scope per tenant, or have the vectorStore resolver select the tenant's index
                from requestContext.
            url: https://mastra.ai/docs/knowledge/scopes-and-access
          - title: Score grounding before release
            body:
              - >-
                Run the faithfulness and hallucination scorers with thresholds in runEvals so a retrieval change that
                lowers grounding fails CI.
            url: https://mastra.ai/reference/evals/faithfulness
        note: >-
          Partial: of the two checks this pin names, Mastra delivers per-tenant index isolation for its own Knowledge
          store (alpha) and a per-tenant store choice on the vector query tool; trust-tiering of sources, poisoning
          screening at ingest and a run-time check that a response is supported by its sources before the harness acts
          are not offered, and scorers gate nothing at run time. Rated partial rather than notApplicable (the rule for
          toolVercelAiSdk and toolOpenaiAgentsSdk) because Mastra ships a corpus and retrieval tools of its own.
        verified: "2026-11-21"
      - mitigation: cap-input-guardrails
        coverage: partial
        mechanism: >-
          PromptInjectionDetector (an LLM classifier on input messages with block, warn, filter or rewrite and
          errorStrategy 'warn' by default), UnicodeNormalizer and ModerationProcessor as input processors;
          processToolResult as the attach point for screening tool and MCP results before they enter the message list;
          forwardInstructions off by default for MCP servers
        steps:
          - title: Classify user turns before the loop
            body:
              - >-
                Add UnicodeNormalizer, then PromptInjectionDetector with strategy 'block' and errorStrategy 'strict',
                to the agent's inputProcessors.
            url: https://mastra.ai/reference/processors/prompt-injection-detector
          - title: Screen tool results before they reach the model
            body:
              - >-
                Add a processor whose processToolResult runs your injection classifier on each tool and MCP result and
                calls abort() or replaces the result on a hit.
            url: https://mastra.ai/reference/processors/processor-interface
          - title: Keep server instructions out of the system prompt
            body:
              - >-
                Leave forwardInstructions unset (false) on third-party MCP servers and review getServerInstructions()
                before enabling it.
            url: https://mastra.ai/reference/tools/mcp-client
        note: >-
          Partial by this drawing's rule (native needs a shipped classifier on every untrusted block): Mastra ships the
          direct-injection classifier, but it reads input messages through processInput only and fails open by
          default; indirect injection in tool results, MCP results and fetched pages needs the deployer's
          processToolResult processor, which does not fire when execute throws. The MCP client documents that it does
          not sanitise tool responses, and the classifier sends the text it checks to its own configured model.
        verified: "2026-11-21"
      - mitigation: cap-output-encoding
        coverage: partial
        mechanism: >-
          No renderer in the framework (@mastra/react and the supported agentic UIs hand typed parts to the
          application); output processors and RegexFilterProcessor on phase 'output' (the urls preset or custom
          rules) as the server-side attach point; stream data redaction of system prompts and tool definitions, which
          is not encoding
        steps:
          - title: Strip outbound-loading content before it reaches the client
            body:
              - >-
                Add a RegexFilterProcessor with phase 'output', strategy 'redact' and rules that remove markdown images
                and links to origins outside your allowlist.
            url: https://mastra.ai/reference/processors/regex-filter-processor
        note: >-
          Partial by this drawing's rule (as for toolVercelAiSdk: an optional server-side filter, the renderer the
          application's): Mastra renders nothing, and the application's UI decides how model text becomes HTML or
          markdown. An output RegexFilterProcessor can remove URLs or image syntax from the stream, which closes the
          auto-loaded image exfiltration path, but it is pattern matching, not context-aware encoding, and the urls
          preset removes legitimate links too. Encoding for the actual interpreter and content-security policy are the
          application's.
        verified: "2026-11-21"
      - mitigation: cap-sensitive-data-redaction
        coverage: partial
        mechanism: >-
          PIIDetector (LLM; input and output; mask, hash, remove or placeholder), RegexFilterProcessor presets pii and
          secrets (deterministic; input and output), SystemPromptScrubber, processToolResult for tool payloads, tool
          transform for display and transcript, SensitiveDataFilter for spans
        steps:
          - title: Mask identifiers on the inference path
            body:
              - >-
                Add PIIDetector with strategy 'redact' and errorStrategy 'strict', and a RegexFilterProcessor with
                presets ['pii', 'secrets'], to input and output processors.
            url: https://mastra.ai/reference/processors/pii-detector
          - title: Redact tool payloads
            body:
              - >-
                In processToolResult replace sensitive fields through messageList.updateToolInvocation, and set a tool
                transform for the display and transcript targets.
            url: https://mastra.ai/reference/processors/processor-interface
          - title: Keep values out of traces
            body:
              - >-
                Keep sensitiveDataFilter on with your own field names added, and set tracingOptions hideInput and
                hideOutput on runs that handle client material.
            url: https://mastra.ai/reference/observability/tracing/processors/sensitive-data-filter
        note: >-
          Partial by the rule applied to toolVercelAiSdk, with more shipped: Mastra includes detectors that block or
          mask user input and model output, but they read input messages and the output stream, not tool or MCP
          results, which need the deployer's processToolResult; the LLM detectors fail open by default and send what
          they inspect to their own configured model; history the application persists keeps raw values unless a
          transform or processor removes them.
        verified: "2026-11-21"
      - mitigation: AML.M0004
        coverage: external
        mechanism: >-
          None in the framework; a rate limit in server.middleware or an API gateway or WAF in front of the Mastra
          server; Mastra Gateway's per-key limits (2,000 requests a minute, 400 per 10 seconds) and an optional
          organisation-wide per-minute cap apply per key, not per user
        evidence:
          - title: Middleware (server.middleware runs before the agent routes)
            url: https://mastra.ai/docs/server/middleware
          - title: Gateway usage, pricing and limits (per-key and organisation rate limits)
            url: https://mastra.ai/docs/mastra-platform/gateway/usage-and-limits
          - title: TokenCostControl (a spend budget, assessed under AML.M0036)
            url: https://mastra.ai/reference/processors/token-cost-control
        note: >-
          External (API gateway, WAF or a rate-limit store in server middleware), on the same rule as toolVercelAiSdk:
          Mastra counts no requests per user or session. Integration points: server.middleware before the agent routes,
          keyed on the authenticated user; Mastra Gateway's caps limit the whole deployment's model calls, not one
          user's. TokenCostControl's per-user cost window is a spend budget, rated under AML.M0036.
        verified: "2026-11-21"
      - mitigation: cap-agent-tracing
        coverage: native
        mechanism: >-
          An Observability instance with exporters (OtelExporter on the GenAI semantic conventions,
          MastraStorageExporter, MastraPlatformExporter, Langfuse, Datadog and others): spans for agent runs, model
          calls, tool executions with inputs and outputs, memory operations and workflow steps; trace context sent to
          MCP servers; SensitiveDataFilter applied by default; sampling 'always' by default
        steps:
          - title: Export to your own collector
            body:
              - >-
                Add an OtelExporter with your collector's endpoint to the observability config's exporters, keeping
                MastraStorageExporter if Studio needs the traces.
            url: https://mastra.ai/reference/observability/tracing/exporters/otel
          - title: Correlate runs to the caller
            body:
              - >-
                Set requestContextKeys (for example user.id and tenantId) on the config so every span carries the
                authenticated principal.
            url: https://mastra.ai/reference/observability/tracing/configuration
          - title: Flush before the runtime exits
            body:
              - >-
                Call await mastra.observability.flush() before a serverless function pauses or exits.
            url: https://mastra.ai/docs/observability/overview
        note: >-
          Native on the rule applied to toolVercelAiSdk: once Observability is configured, every agent run, model call,
          tool call with arguments and results, memory operation and workflow step is a span in one trace exported to
          the customer's store. Limits: nothing is traced until observability is configured; ratio or custom sampling
          drops runs; hideInput and hideOutput remove payloads per trace; approval decisions are not among the traced
          operations the docs list; MastraPlatformExporter sends spans, logs and metrics to Mastra platform whenever
          MASTRA_PLATFORM_ACCESS_TOKEN is set. Emission is not tamper resistance.
        verified: "2026-11-21"
      - mitigation: cap-agent-kill-switch
        coverage: partial
        mechanism: >-
          abortSignal on generate() and stream(), forwarded to delegated subagents; POST
          /api/agents/:agentId/threads/abort (with clearPendingSignals) reaching the thread's active owner through
          PubSub; Run.cancel() for workflows, nested and suspended runs included; modelSettings.timeout totalMs;
          revoking Gateway keys and platform access tokens
        steps:
          - title: Stop a live thread from outside
            body:
              - >-
                Call POST /api/agents/:agentId/threads/abort with the threadId and clearPendingSignals: true from an
                operator control; it needs agents:execute permission.
            url: https://mastra.ai/reference/server/routes
          - title: Cancel workflow runs
            body:
              - >-
                Call run.cancel() on the workflow run; nested and suspended runs are cancelled with it, and steps that
                check abortSignal stop.
            url: https://mastra.ai/reference/workflows/run-methods/cancel
          - title: Revoke what it authenticates with
            body:
              - >-
                Revoke the Gateway key the deployment uses (revoked keys return 401) and rotate provider keys held in
                its environment.
            url: https://mastra.ai/docs/mastra-platform/gateway/keys-and-byok
        note: >-
          Partial by the rule for this drawing (as for toolVercelAiSdk; native needs a documented, verified stop of live
          sessions): Mastra documents a server-side stop that reaches the thread's owner in another process, but
          cancellation is cooperative, so a tool that ignores its abortSignal keeps running; a remote abort reports
          that the request was sent, not acknowledged; Run.cancel() resolves before running steps stop. Revoking a key
          refuses later model calls only. Quarantine from peer agents and deletion of stored memory and snapshots are
          the deployer's steps.
        verified: "2026-11-21"
      - mitigation: cap-agent-action-policy-enforcement
        coverage: partial
        mechanism: >-
          hooks.beforeToolCall on the agent or per call, returning { proceed: false, output } to skip a call, across
          assigned, memory, client, agent, workflow and workspace tools; requireToolApproval functions as the escalate
          path; FGA tools:execute per user and agent tool; delegation.onDelegationStart to reject a delegation; no
          declarative policy language over arguments
        steps:
          - title: Decide each call in a hook
            body:
              - >-
                Set hooks.beforeToolCall to check the requestContext user, the tool and its input against your policy
                and return { proceed: false, output } on deny.
            url: https://mastra.ai/docs/agents/tools
          - title: Escalate instead of deny
            body:
              - >-
                Return true from a requireToolApproval function for calls the policy refers to a person.
            url: https://mastra.ai/docs/agents/human-in-the-loop
          - title: Gate delegation
            body:
              - >-
                In delegation.onDelegationStart return { proceed: false, rejectionReason } when the subagent is not
                allowed for this caller.
            url: https://mastra.ai/docs/subagents
        note: >-
          Partial by this drawing's rule (native needs built-in enforcement of an approval bound to the action, its
          arguments and the session): the hook runs outside the model before every call and allow, deny and escalate
          are all expressible, but the rules are the deployer's code and binding an approval to arguments is a pattern
          the deployer writes. FGA adds a framework-enforced per-user check per tool, not per argument or record, under
          the Enterprise licence. afterToolCall does not see skipped or declined calls, so log decisions where they
          are made.
        verified: "2026-11-21"
      - mitigation: AML.M0036
        coverage: partial
        mechanism: >-
          maxSteps (5 by default), with a subagent's budget capped at its defaultOptions.maxSteps; modelSettings.timeout
          totalMs, stepMs and firstChunkMs; TokenLimiterProcessor bounding prompt and output tokens per call;
          TokenCostControl blocking on estimated cost per run, thread, user, resource or organisation over a window;
          toolCallConcurrency; abortSignal forwarded to subagents
        steps:
          - title: Cap steps and wall clock
            body:
              - >-
                Set maxSteps and modelSettings.timeout { totalMs, stepMs } on every agent, and defaultOptions.maxSteps on
                each subagent.
            url: https://mastra.ai/reference/agents/generate
          - title: Cap spend per run and per user
            body:
              - >-
                Add TokenCostControl input processors with scope 'run' and with scope 'user' and a window, strategy
                'block'.
            url: https://mastra.ai/reference/processors/token-cost-control
          - title: Bound tokens per call
            body:
              - >-
                Add TokenLimiterProcessor with a limit so each provider prompt and each response stays within budget.
            url: https://mastra.ai/reference/processors/token-limiter-processor
        note: >-
          Partial by this drawing's rule (as for toolVercelAiSdk: native needs step and token limits that end a turn):
          step count and wall clock end the run and Mastra ships a spend ceiling, but TokenCostControl is documented as
          approximate (metrics persist asynchronously, so fast runs overshoot), counts only agent-attributed model calls
          and needs observability storage with metric aggregation; TokenLimiterProcessor trims per call rather than
          ending the run on cumulative tokens; onDelegationStart modifiedMaxSteps can raise a subagent above its cap.
        verified: "2026-11-21"
      - mitigation: D3-CTS
        coverage: external
        mechanism: >-
          None in the framework (no token exchange); MCPClient sends the headers, OAuth token or custom-fetch
          credentials configured for one server, validates redirect hops against allowedHosts and drops Authorization
          across origins; OAuth tokens bound to the validated issuer
        evidence:
          - title: MCPClient reference (requestInit, authProvider, fetch, allowedHosts, OAuth issuer binding)
            url: https://mastra.ai/reference/tools/mcp-client
          - title: MCP authentication and authorization (keep tokens at their audience)
            url: https://mastra.ai/docs/guides/mcp-authentication-authorization
        note: >-
          External (an MCP or API gateway that exchanges the user's token for one scoped to the next hop), on the same
          rule as toolVercelAiSdk: Mastra performs no token exchange. The client scopes what it sends to the configured
          server and the docs tell deployers never to forward an MCP token to an upstream API, but a token the
          application puts in requestInit headers or forwards through a custom fetch is passed as it is.
        verified: "2026-11-21"
      - mitigation: cap-mcp-tool-integrity
        coverage: partial
        mechanism: >-
          MCP servers declared in code per MCPClient; requireToolApproval per server; allowedHosts; forwardInstructions
          off by default; tool names namespaced by server; typegen schema snapshots (not enforced at run time); A2A
          verifyAgentCard and signed cards for remote agents; no hashing or pinning of tool definitions
        steps:
          - title: Admit only known servers and hosts
            body:
              - >-
                Declare each MCP server with its url and allowedHosts set to that server and its authorization server.
            url: https://mastra.ai/reference/tools/mcp-client
          - title: Approve calls to third-party servers
            body:
              - >-
                Set requireToolApproval: true on servers you do not operate, so a tool they add later still waits for a
                person.
            url: https://mastra.ai/reference/tools/mcp-client
          - title: Verify remote agents' cards
            body:
              - >-
                Set verifyAgentCard on each A2AAgent and require a signature from the peer's trusted key.
            url: https://mastra.ai/docs/connections/a2a
        note: >-
          Partial by core rule 1 (as for toolOpenaiAgentsSdk): declared servers, host allowlists and approval admit and
          gate servers but verify nothing they serve; the docs describe no hashing or re-approval when a definition
          changes, and typegen contracts record a schema snapshot while extra live tools stay available at run time. A
          deployer who needs pinning compares what listTools() returns with a stored baseline before giving the tools
          to the agent. Name collisions between servers resolve to the later server with only a warning.
        verified: "2026-11-21"
      - mitigation: cap-agent-egress-control
        coverage: partial
        mechanism: >-
          LocalSandbox native isolation (bwrap or seatbelt) blocking network unless allowNetwork is set; remote sandbox
          settings such as DaytonaSandbox networkBlockAll with domainAllowList; MCPClient allowedHosts per HTTP
          server; webFetchTool refusing localhost and private addresses; in-process tools on the host's network
        steps:
          - title: Cut sandbox networking
            body:
              - >-
                Create LocalSandbox with isolation 'bwrap' (Linux) or 'seatbelt' (macOS) and leave nativeSandbox
                allowNetwork at false.
            url: https://mastra.ai/reference/workspace/local-sandbox
          - title: Allowlist a remote sandbox
            body:
              - >-
                On DaytonaSandbox set networkBlockAll: true and a domainAllowList of the package mirror and the hosts
                the task needs.
            url: https://mastra.ai/docs/sandbox/overview
          - title: Bound the MCP client
            body:
              - >-
                Set allowedHosts on every HTTP MCP server whose URL comes from configuration.
            url: https://mastra.ai/reference/tools/mcp-client
        note: >-
          Partial on the same finding as toolOpenaiAgentsSdk: Mastra offers network controls per execution backend (on
          or off for LocalSandbox, a domain allowlist on Daytona) and host allowlists on the MCP client, and the docs
          say no one network policy applies to every sandbox. In-process tools, the model router, webFetchTool (which
          blocks private addresses but reaches any public host) and subagents leave through the application host's
          network, which the deployer restricts with an egress proxy.
        verified: "2026-11-21"
      - mitigation: D3-FA
        coverage: external
        mechanism: >-
          None in the framework; admission scanning at the npm mirror the build, stdio MCP servers and sandboxes
          install from
        evidence:
          - title: GHSA-pp62-grrw-hvfp, malware in @mastra/core 1.42.1 (2026-06-17)
            url: https://github.com/advisories/GHSA-pp62-grrw-hvfp
          - title: MCP (stdio servers start from a command or package the application names)
            url: https://mastra.ai/docs/connections/mcp
        note: >-
          External (package firewall or artifact-repository scanning at the mirror): Mastra scans nothing it installs or
          loads. The June 2026 takeover of the @mastra npm scope showed the path, about 140 releases gaining a
          caret-ranged dependency whose postinstall script ran a dropper, so a lockfile pinned to reviewed versions and
          a scanning mirror are the controls. Integration points: point npm at the scanning mirror, pin @mastra/* in
          the lockfile, and run stdio MCP servers from pinned versions. No model weights load; inference is remote.
        verified: "2026-11-21"
      - mitigation: D3-EI
        coverage: partial
        mechanism: >-
          Workspace sandboxes: LocalSandbox with isolation 'none' by default, or bwrap or seatbelt native isolation;
          DockerSandbox (privileged false by default, capDrop, readonlyRootfs, memory and CPU limits); E2B, Daytona,
          Modal, Vercel and other remote providers; code mode runs model-written programs in the workspace sandbox or an
          in-process V8 isolate; ordinary tools run in the application process
        steps:
          - title: Choose a sandbox that isolates
            body:
              - >-
                Use LocalSandbox with isolation 'bwrap' or 'seatbelt', or DockerSandbox or a remote provider, for any
                agent whose commands follow untrusted input.
            url: https://mastra.ai/reference/workspace/local-sandbox
          - title: Harden the container
            body:
              - >-
                On DockerSandbox set capDrop: ['ALL'], readonlyRootfs: true, memory and CPU limits, and keep privileged
                false.
            url: https://mastra.ai/integrations/sandboxes/docker
          - title: Run generated code in the sandbox
            body:
              - >-
                Give code mode a workspace sandbox, or use IsolatedVmCodeModeTransport for a separate V8 isolate, so
                model-written programs never run in the application's own context.
            url: https://mastra.ai/docs/agents/code-mode
        note: >-
          Partial on the core sandbox rule (as on toolVercelAiSdk, toolOpenaiAgentsSdk and toolClaudeAgentSdk): Mastra
          offers isolation backends, but LocalSandbox runs commands on the host with the application's permissions until
          isolation is set, and a static sandbox is shared across every request and thread unless a resolver keyed on
          the user is used. Outside any sandbox: the agent loop, every createTool tool, stdio MCP servers and the tools
          code mode bridges to, which run on the host. A remote provider's boundary is that provider's to document.
        verified: "2026-11-21"
    # The security-relevant settings, each with the baseline value (data/tooling/BASELINE.md).
    # The framework runs inside the application, so most rows are constructor options, call options or processors
    # the deployer sets in code; the last two are Mastra platform settings. Verified 2026-11-21 against
    # mastra.ai (.md variants) for @mastra/core 1.85.0.
    settings:
      - id: serverAuth
        name: server.auth
        where: "new Mastra({ server: { auth } }): MastraJwtAuth({ jwksUri, issuer }) or an IdP provider (Okta, WorkOS, Auth0, Clerk and others)"
        setVia: [code, identityProvider]
        area: identity
        default: Not configured (every route and Studio public)
        recommended: MastraJwtAuth with your IdP's jwksUri and issuer, or the IdP's Mastra provider; update server.auth.protected and public if server.apiPrefix changes
        value: "IdP-verified JWT on every route"
        why: Without it the agent, workflow, memory, MCP and A2A routes accept anonymous calls; a custom apiPrefix leaves built-in routes outside the default protected pattern.
        mitigations: [D3-APA, D3-AA]
        url: https://mastra.ai/docs/auth/overview
        verified: "2026-11-21"
      - id: mapUserToResourceId
        name: mapUserToResourceId
        where: server.auth › mapUserToResourceId (sets MASTRA_RESOURCE_ID_KEY on the request context)
        setVia: [code]
        area: identity
        default: Unset (built-in routes trust the client-supplied resource ID; startup warning)
        recommended: The authenticated user's ID (or a tenant-qualified ID), so memory, thread and stored-resource checks use the verified identity
        value: "The authenticated user's ID"
        why: The server forces memory to that resource and returns 403 for threads it does not own, instead of trusting memory.resource from the request body.
        mitigations: [AML.M0031, D3-APA, cap-data-access-governance]
        url: https://mastra.ai/reference/configuration
        verified: "2026-11-21"
      - id: serverFga
        name: server.fga
        where: "new Mastra({ server: { fga: <IFGAProvider>, storedResources: { scope: true } } }), requireForProtectedRoutes on the provider"
        setVia: [code, identityProvider]
        area: identity
        default: Not configured (FGA checks skipped)
        requires: Mastra Enterprise licence (MASTRA_LICENSE_KEY) in production
        recommended: An FGA provider mapping agents:execute, tools:execute and memory permissions to your policy store, with requireForProtectedRoutes true and auditProtectedRoutes 'error'
        value: "Provider set; protected routes must resolve"
        why: Each agent run, agent tool call (agentId:toolName), MCP tool call and thread access is checked for the user; direct createRun().start() calls are not checked.
        mitigations: [D3-APA, AML.M0028, cap-agent-action-policy-enforcement]
        url: https://mastra.ai/docs/auth/fga
        verified: "2026-11-21"
      - id: requireApproval
        name: requireApproval
        where: "createTool({ ..., requireApproval: true })"
        setVia: [code]
        area: tools
        default: Not set (the tool runs when the model calls it)
        recommended: true on every tool that writes, sends, deletes or spends, answered with approveToolCall or declineToolCall for its toolCallId
        value: "true on every consequential tool"
        why: The call pauses after input validation with a tool-call-approval chunk until a person decides; the snapshot needs persistent storage to survive a restart.
        mitigations: [AML.M0029]
        url: https://mastra.ai/docs/agents/human-in-the-loop
        verified: "2026-11-21"
      - id: requireToolApproval
        name: requireToolApproval
        where: stream() / generate() option or the agent's defaultOptions; true or a function of toolName, args and requestContext
        setVia: [code]
        area: tools
        default: Not set
        recommended: A function returning true for every write tool by name and argument threshold; durable and stored agents accept only a boolean, so set true there
        value: "Function returning true for write tools"
        why: One rule covers every tool on the call, tools added later included; a function that throws requires approval, so the rule fails closed.
        mitigations: [AML.M0029, cap-agent-action-policy-enforcement]
        url: https://mastra.ai/docs/agents/human-in-the-loop
        verified: "2026-11-21"
      - id: mcpRequireToolApproval
        name: requireToolApproval (MCP server)
        where: "new MCPClient({ servers: { <name>: { url, requireToolApproval } } })"
        setVia: [code]
        area: tools
        default: Not set
        recommended: true on MCP servers the organisation does not operate, or a function over toolName and args for its own servers
        value: "true on third-party MCP servers"
        why: A tool the server adds or renames still waits for a person; the annotations a function can read are advertised by the server itself.
        mitigations: [AML.M0029, cap-mcp-tool-integrity]
        url: https://mastra.ai/reference/tools/mcp-client
        verified: "2026-11-21"
      - id: workspaceToolsRequireApproval
        name: tools.requireApproval (workspace tools)
        where: "new Workspace({ sandbox, tools: { requireApproval, [WORKSPACE_TOOLS.SANDBOX.EXECUTE_COMMAND]: { ... } } })"
        setVia: [code]
        area: tools
        default: "false"
        recommended: true for execute_command and the file write, edit and delete tools; enabled false on tools the agent does not need
        value: "true for command and write tools"
        why: Shell commands and file changes the model proposes wait for a person instead of running in the sandbox, or on the host when LocalSandbox has no isolation.
        mitigations: [AML.M0029, D3-EI]
        url: https://mastra.ai/reference/workspace/workspace-class
        verified: "2026-11-21"
      - id: beforeToolCall
        name: hooks.beforeToolCall
        where: "new Agent({ hooks: { beforeToolCall } }), or per call in generate() / stream()"
        setVia: [code]
        area: tools
        default: None
        recommended: A policy check over the requestContext user, tool name and input that returns { proceed false, output } on deny, and refuses a sensitive call whose argument fingerprint was not approved
        value: "Policy check; deny with proceed false"
        why: The check covers assigned, memory, client, agent, workflow and workspace tools; afterToolCall never sees skipped or declined calls, so log decisions in the hook.
        mitigations: [cap-agent-action-policy-enforcement, AML.M0029]
        url: https://mastra.ai/docs/agents/tools
        verified: "2026-11-21"
      - id: activeTools
        name: activeTools
        where: generate() / stream() option (or tools as a function of requestContext on the Agent)
        setVia: [code]
        area: tools
        default: Every tool the agent has
        recommended: Only the tools the authenticated user's role needs, computed on the server from requestContext
        value: "The user's entitled tools only"
        why: The model is offered only the active set for that call, and a tools function keyed on requestContext keeps other tenants' tools out of the agent.
        mitigations: [AML.M0028, cap-agent-tool-registry]
        url: https://mastra.ai/reference/agents/generate
        verified: "2026-11-21"
      - id: toolInputSchema
        name: inputSchema / requestContextSchema
        where: "createTool({ inputSchema, requestContextSchema, outputSchema, outputValidation })"
        setVia: [code]
        area: tools
        default: outputValidation 'strict'
        recommended: Bounded schemas (enums, ranges, patterns) on every tool and a requestContextSchema requiring the authenticated user's ID; keep outputValidation 'strict' except where side effects already ran
        value: "Bounded schemas; user context required"
        why: Arguments that fail validation never reach execute, and a tool called without the authenticated context returns an error instead of running.
        mitigations: [AML.M0028]
        url: https://mastra.ai/reference/tools/create-tool
        verified: "2026-11-21"
      - id: mcpAllowedHosts
        name: allowedHosts
        where: "MCPClient servers.<name>.allowedHosts (HTTP servers)"
        setVia: [code]
        area: network
        default: Unset (no restriction)
        recommended: Exactly the server's host and its authorization server's host
        value: "The server and its auth server only"
        why: The client refuses other hosts and every redirect hop before sending and drops Authorization across origins; with a custom fetch, redirect hops are checked only after the response.
        mitigations: [cap-agent-egress-control, cap-mcp-tool-integrity]
        url: https://mastra.ai/reference/tools/mcp-client
        verified: "2026-11-21"
      - id: mcpOAuthProvider
        name: authProvider (MCPOAuthClientProvider)
        where: "MCPClient servers.<name>.authProvider = new MCPOAuthClientProvider({ clientMetadataUrl or clientInformation, ... })"
        setVia: [code, identityProvider]
        area: identity
        default: Unset (static headers in requestInit, if any)
        recommended: An OAuth client per server registered for the agent application, with tokens held per user, instead of a static bearer key in requestInit headers
        value: "OAuth client per server, not a static key"
        why: Tokens are refreshed by the flow and bound to the validated issuer, so they are never sent to another authorization server; keep one user's tokens from serving another.
        mitigations: [D3-AA, D3-CH, cap-data-access-governance]
        url: https://mastra.ai/reference/tools/mcp-client
        verified: "2026-11-21"
      - id: promptInjectionDetector
        name: PromptInjectionDetector
        where: "new Agent({ inputProcessors: [new PromptInjectionDetector({ model, strategy, errorStrategy, threshold })] })"
        setVia: [code]
        area: tools
        default: Not attached; errorStrategy 'warn' (fail-open) once attached
        recommended: strategy 'block' and errorStrategy 'strict', on a small classifier model from an approved provider, after UnicodeNormalizer
        value: "block, errorStrategy strict"
        why: User turns classified as injection, jailbreak or system override stop with a tripwire before the model call; it reads input messages, not tool results.
        mitigations: [cap-input-guardrails]
        url: https://mastra.ai/reference/processors/prompt-injection-detector
        verified: "2026-11-21"
      - id: toolResultProcessor
        name: processToolResult
        where: A Processor implementing processToolResult (the docs' ScanToolResult and RedactToolResult examples), attached to the agent
        setVia: [code]
        area: tools
        default: None (tool results enter context unscreened)
        recommended: A processor that runs your injection classifier and secret and PII detector on each tool and MCP result, replacing it or calling abort() on a hit
        value: "Classifier and redaction on every result"
        why: Content from web pages, MCP servers and records is screened or redacted before it is stored or fed to the next model call; it does not fire when execute throws.
        mitigations: [cap-input-guardrails, cap-sensitive-data-redaction]
        url: https://mastra.ai/reference/processors/processor-interface
        verified: "2026-11-21"
      - id: piiDetector
        name: PIIDetector
        where: "inputProcessors and outputProcessors: new PIIDetector({ model, strategy, redactionMethod, errorStrategy })"
        setVia: [code]
        area: data
        default: Not attached
        recommended: strategy 'redact' with redactionMethod 'mask' on input and output, errorStrategy 'strict', after BatchPartsProcessor on output
        value: "redact on input and output, strict"
        why: Identifiers are masked before the provider sees user text and before a response reaches the user; the detector sends that text to its own configured model.
        mitigations: [cap-sensitive-data-redaction]
        url: https://mastra.ai/reference/processors/pii-detector
        verified: "2026-11-21"
      - id: regexFilterProcessor
        name: RegexFilterProcessor
        where: "new RegexFilterProcessor({ presets, rules, strategy, phase }) in input and output processors"
        setVia: [code]
        area: data
        default: Not attached (strategy 'block', phase 'all' once attached)
        recommended: presets ['secrets', 'pii'] with strategy 'redact' on phase 'all', plus an output rule removing markdown images and links to origins outside your allowlist
        value: "secrets and pii redacted; foreign links out"
        why: With no model call, keys and identifiers are removed from input and streamed output, and an injected image or link cannot carry chat data to an outside server.
        mitigations: [cap-sensitive-data-redaction, cap-output-encoding]
        url: https://mastra.ai/reference/processors/regex-filter-processor
        verified: "2026-11-21"
      - id: maxSteps
        name: maxSteps
        where: generate() / stream() option, or defaultOptions.maxSteps on the agent and each subagent
        setVia: [code]
        area: tools
        default: "5"
        recommended: An explicit number per agent, and defaultOptions.maxSteps on each subagent, which caps what a supervisor model can pass
        value: "Explicit per agent and subagent"
        why: A looping run stops at a known number of model calls; onDelegationStart modifiedMaxSteps can lift a subagent above its own cap, so never set it from model input.
        mitigations: [AML.M0036]
        url: https://mastra.ai/reference/agents/generate
        verified: "2026-11-21"
      - id: runTimeout
        name: modelSettings.timeout
        where: "generate() / stream() modelSettings.timeout { totalMs, stepMs, firstChunkMs }"
        setVia: [code]
        area: tools
        recommended: totalMs and stepMs on every user-facing agent, below the HTTP server.timeout (180000 ms by default)
        value: "totalMs and stepMs set"
        why: The whole run, tool calls and retries included, ends with MastraTimeoutError at a hard deadline instead of running until the request times out.
        mitigations: [AML.M0036, cap-agent-kill-switch]
        url: https://mastra.ai/reference/agents/generate
        verified: "2026-11-21"
      - id: tokenCostControl
        name: TokenCostControl
        where: "inputProcessors: new TokenCostControl({ maxCost, scope, window, strategy })"
        setVia: [code]
        area: tools
        default: Not attached (scope 'resource', window 7 days once attached)
        requires: Observability storage with getMetricAggregate support
        recommended: A per-user daily cap (scope 'user', window '24h') and a per-run cap, strategy 'block', with onViolation wired to alerting
        value: "Per-user daily and per-run cost caps"
        why: Model calls stop once the estimated spend for that user or run passes the cap; metrics persist asynchronously, so a fast run can overshoot it.
        mitigations: [AML.M0036]
        url: https://mastra.ai/reference/processors/token-cost-control
        verified: "2026-11-21"
      - id: observabilityExporters
        name: Observability exporters
        where: "new Mastra({ observability: new Observability({ configs: { default: { serviceName, exporters: [new OtelExporter({ provider })] } } }) })"
        setVia: [code]
        area: audit
        default: Nothing traced until Observability is configured; sampling 'always' once it is
        recommended: OtelExporter to the firm's collector (plus MastraStorageExporter where Studio needs traces), sampling 'always'
        value: "OTel exporter to your collector, always"
        why: Agent runs, model calls, tool calls with inputs and outputs, memory operations and workflow steps become spans in the organisation's own store.
        mitigations: [cap-agent-tracing]
        url: https://mastra.ai/docs/observability/overview
        verified: "2026-11-21"
      - id: sensitiveDataFilter
        name: sensitiveDataFilter
        where: "new Observability({ sensitiveDataFilter: { sensitiveFields, redactionStyle } }); tracingOptions hideInput / hideOutput per call"
        setVia: [code]
        area: audit
        default: "true (password, token, secret, key, authorization, jwt, ssn and other field names)"
        recommended: Leave on and pass the default field list plus your own credential and client-identifier field names (the option replaces the list); hideInput and hideOutput on runs with client material
        value: "On, with your field names added"
        why: Matching fields are redacted from span attributes, input, output and request context before export; free text in prompts is not matched by field name.
        mitigations: [cap-agent-tracing, cap-sensitive-data-redaction, D3-CH]
        url: https://mastra.ai/reference/observability/tracing/processors/sensitive-data-filter
        verified: "2026-11-21"
      - id: localSandboxIsolation
        name: isolation (LocalSandbox)
        where: "new LocalSandbox({ isolation, nativeSandbox: { allowNetwork, readOnlyPaths } }), or DockerSandbox or a remote provider"
        setVia: [code]
        area: tools
        default: "'none' (commands run on the host as the application)"
        recommended: "'bwrap' on Linux or 'seatbelt' on macOS with allowNetwork false, or DockerSandbox or a remote provider for untrusted code"
        value: "bwrap, allowNetwork false"
        why: Commands the agent runs are confined in file system and network at the OS level; without isolation they reach whatever the application can, on its network.
        mitigations: [D3-EI, cap-agent-egress-control]
        url: https://mastra.ai/reference/workspace/local-sandbox
        verified: "2026-11-21"
      - id: threadAbort
        name: abortSignal / threads/abort
        where: "abortSignal on generate() / stream(); POST /api/agents/:agentId/threads/abort { threadId, clearPendingSignals }"
        setVia: [code, apiCli]
        area: tools
        default: Unset
        recommended: An operator stop that calls the thread abort route with clearPendingSignals true, and an abortSignal that every long-running tool honours
        value: "Operator abort route; tools honour signal"
        why: The run and in-flight subagent runs stop at their next step; a tool that ignores its abortSignal keeps running, and a remote owner's abort is sent, not acknowledged.
        mitigations: [cap-agent-kill-switch]
        url: https://mastra.ai/reference/server/routes
        verified: "2026-11-21"
      - id: knowledgeScopes
        name: Knowledge scopes and access rules
        where: "new Knowledge({ scopes: { '<type>:$id': { access: [...] } } }); run scopes set in server middleware on MASTRA_SCOPES_KEY"
        setVia: [code]
        area: data
        default: No built-in scope types
        requires: "@mastra/core 1.82.0 or later; Knowledge is alpha"
        recommended: One scope per tenant, set only by authenticated server middleware, and a separate agent per tenant where content must not move between scopes
        value: "One scope per tenant, set by the server"
        why: Knowledge tools return only pages and notes the run's scopes reach and a hidden page looks missing; an agent holding two scopes can still copy between them.
        mitigations: [cap-data-access-governance, cap-retrieval-grounding-checks, AML.M0031]
        url: https://mastra.ai/docs/knowledge/scopes-and-access
        verified: "2026-11-21"
      - id: runEvalsGates
        name: runEvals gates and thresholds
        where: "runEvals({ data, target, gates, scorers: [{ scorer, threshold }] }) in the CI test suite"
        setVia: [code]
        area: tools
        default: No gate
        recommended: A protected dataset with tool-call and safety gates, the release job failing unless result.verdict is 'passed'
        value: "Release blocked unless verdict is passed"
        why: A model, prompt or tool change that calls the wrong tool or misses a threshold fails CI; the job, the dataset's protection and promotion are the deployer's.
        mitigations: [cap-staged-rollout-gate]
        url: https://mastra.ai/docs/evals/gates-and-verdicts
        verified: "2026-11-21"
      - id: a2aVerifyAgentCard
        name: verifyAgentCard
        where: "new A2AAgent({ url, verifyAgentCard: { verify } }); getAgentCard({ verifySignature }) on the client"
        setVia: [code]
        area: identity
        default: Not set (unsigned cards accepted as fetched)
        recommended: Require a signature from the peer's trusted key and the expected provider and endpoint before delegating; sign your own cards with server.a2a.agentCardSigning
        value: "Signed card from a trusted key required"
        why: A spoofed or altered agent card is refused before the parent agent sends the remote agent any work or data.
        mitigations: [D3-AA, cap-mcp-tool-integrity]
        url: https://mastra.ai/docs/connections/a2a
        verified: "2026-11-21"
      - id: gatewayKeyRestrictions
        name: Restrict a key (Expiry, Allowed models)
        where: Mastra platform › Gateway › API keys › create key (Label, Expiry, Allowed models, Disable failover)
        setVia: [adminConsole]
        area: identity
        requires: Mastra Gateway
        recommended: One project key per deployment with an expiry and only the approved models, stored as a platform secret; revoke and replace rather than edit
        value: "Project key, expiry, approved models"
        why: A leaked key expires and cannot call unapproved models; expiry and models are fixed at creation, and revoked or expired keys return 401.
        mitigations: [D3-CH, D3-AA]
        url: https://mastra.ai/docs/mastra-platform/gateway/keys-and-byok
        verified: "2026-11-21"
      - id: platformSecrets
        name: Secret (environment variable)
        where: Mastra platform › project › environment › Environment variables › Secret toggle
        setVia: [adminConsole]
        area: data
        default: Secret (write-only) for new variables
        recommended: Every key and token kept as a secret, deployed with --env-file pointing at a reviewed file so local secrets are not uploaded
        value: "Secret, never config"
        why: Secrets are encrypted, delivered only at boot and never shown by the dashboard or mastra env vars pull; config values are stored and shown as plain text.
        mitigations: [D3-CH]
        url: https://mastra.ai/docs/mastra-platform/deploy/environments
        verified: "2026-11-21"
