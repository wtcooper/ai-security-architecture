  - id: openai-securing-openclaw-persistent-agents
    kind: research
    date: '2026-11-12'
    title: >-
      How OpenAI secures persistent OpenClaw agents: split gateway, brokered secrets, managed egress,
      auto-review
    summary: 'OpenAI runs the OpenClaw Gateway in a separate cluster from the agent harness, treats the
      agent as untrusted, and sandboxes network, workspace, process and secrets. Admin requirements.toml
      limits sandbox and web search modes; secrets go through a broker; egress uses an org allowlist that
      denies paste sites and 169.254.169.254; a second LLM auto-reviews every action; each agent has its
      own service account.

      '
    why: >-
      A lab's own deployment of a personal agent; it reserves humans for high-value approvals to avoid
      fatigue.
    vendor: OpenAI
    products: [toolOpenclaw, toolCodex]
    controls: [cap-agent-egress-control, D3-CTS, AML.M0029, cap-agent-tracing]
    patterns: [archPersonalAgent, archPersistentManagedAgents]
    update:
      action: controlGuidance
      status: proposed
      target: AML.M0029
      note: >-
        Note OpenAI's model reviewer on every action to cut review fatigue; it triages, it does not replace
        human approval.
    sources:
    - {title: Securing persistent agents like OpenClaw at OpenAI, url: 'https://developers.openai.com/blog/securing-persistent-agents-like-openclaw-at-openai',
      publisher: OpenAI, date: '2026-11-12'}
  - id: microsoft-post-training-backdoors-coding-agents
    kind: research
    date: '2026-11-12'
    title: >-
      Microsoft AI Red Team: poisoned fine-tuning data and checkpoints can turn coding agents on their
      users
    summary: 'In lab work, 90 poisoned examples in about 9,000 conversations gave a 78% attack success
      rate on harnesses seen in training; a backdoored checkpoint reached 84.1% to 94.8% on unseen repos
      across harnesses. One public dataset held rows pairing benign requests with unsafe tool calls. Advice:
      pin datasets by hash, evaluate checkpoints in the production harness, and enforce authorization
      at the tool layer.

      '
    why: Benchmarks do not show a checkpoint is free of triggers; the tool boundary has to hold if one
      fires.
    vendor: Microsoft
    controls: [AML.M0008, AML.M0014, AML.M0025, AML.M0028]
    patterns: [archTrainingPipeline, archSelfHostedInference, archCodingAgentFirstParty]
    update:
      action: controlGuidance
      status: proposed
      target: AML.M0008
      note: >-
        Treat third-party checkpoints as untrusted: test in the production harness; benchmark passes are
        not backdoor-free evidence.
    sources:
    - title: 'Trained to betray: How post-training supply chain attacks hijack coding agents'
      url: >-
        https://www.microsoft.com/en-us/security/blog/2026/11/12/trained-to-betray-how-post-training-supply-chain-attacks-hijack-coding-agents/
      publisher: Microsoft Security
      date: '2026-11-12'
