        steps:
          - title: Require folder trust
            body:
              - Set security.folderTrust.enabled to true in the system settings; untrusted folders then skip
                workspace settings, .env, MCP servers, extensions, custom commands and automatic context
                loading. Do not ship GEMINI_CLI_TRUST_WORKSPACE=true or --skip-trust outside CI.
            url: https://geminicli.com/docs/cli/trusted-folders/
          - title: Keep auto memory off
            body:
              - Leave experimental.autoMemory false; when enabled it mines ~/.gemini/tmp/<project>/chats and
                proposes memory and skill updates that still need user approval.
            url: https://geminicli.com/docs/cli/auto-memory/
          - title: Fix the context file names
            body:
              - Set context.fileName in the system settings to the reviewed file names the organisation uses
                and require folder trust so untrusted clones do not inject context.
            url: https://geminicli.com/docs/cli/gemini-md/
