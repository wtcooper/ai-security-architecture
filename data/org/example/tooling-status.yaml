# EXAMPLE tool posture. Which tools the organisation has approved, and for each capability in
# the tool's reference control set (its architecture's pins), whether the control is switched
# on. Statuses reuse the capability posture enum: inPlace | partial | gap | needsAssessment.
# A capability with no key is "not applicable / not assessed"; `controls` may be omitted for a
# tool with only an adoption decision. (This file is the shipped example; replace it in
# data/org/local/.)
tools:
  - tool: toolClaudeCode
    adoption: approved
    note: Approved for engineering on managed laptops; managed settings pushed by MDM.
    controls:
      capabilityToolPermissionScoping: { status: inPlace, note: permissions.deny and allowManagedPermissionRulesOnly in managed-settings.json, evidence: CHG-1042 }
      capabilityMcpToolSecurity: { status: inPlace, note: allowedMcpServers allowlist, managed-mcp.json }
      capabilityEgressControl: { status: partial, note: Gateway enforced for inference; sandbox network policy not yet rolled out }
      capabilityAgentSandboxing: { status: gap, note: sandbox.enabled pending bubblewrap packaging }
      capabilityAuditLogging: { status: partial, note: OTel export to the SIEM from a pilot group }
      capabilityCredentialIsolation: { status: inPlace, note: forceLoginOrgUUID; API keys blocked }
  - tool: toolCursor
    adoption: pilot
    note: Pilot with one team; Privacy Mode enforced, MCP allowlist under evaluation.
    controls:
      capabilityToolPermissionScoping: { status: partial }
      capabilityMcpToolSecurity: { status: needsAssessment }
      capabilityAgentSandboxing: { status: gap }
  - tool: toolCodex
    adoption: unassessed
    controls: {}
