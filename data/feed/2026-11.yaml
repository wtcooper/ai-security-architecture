  - id: openai-inside-codex-sandbox
    kind: research
    date: '2026-11-18'
    title: >-
      OpenAI explains the Codex sandbox: Seatbelt, bubblewrap and seccomp, with egress through a loopback
      proxy
    summary: 'Codex constrains commands in the user''s own environment: Seatbelt deny-by-default on macOS,
      bubblewrap plus seccomp-bpf and no_new_privs on Linux, Microsoft''s MXC on Windows. Network is off
      by default; when allowed, traffic goes through a proxy with allow and deny domain rules that resolves
      a host only once approved. Writes stay in the workspace with .git and .codex read-only; reads stay
      broad.

      '
    why: >-
      States the limits: readable config files with keys, DNS exfiltration via wildcards, and node_modules
      run later outside.
    vendor: OpenAI
    products: [toolCodex]
    controls: [D3-EI, cap-agent-egress-control]
    patterns: [archCodingAgentThirdParty]
    sources:
    - {title: Inside the Codex sandbox, url: 'https://openai.com/index/inside-the-codex-sandbox/', publisher: OpenAI,
      date: '2026-11-18'}
