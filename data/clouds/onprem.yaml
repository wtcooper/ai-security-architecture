    where: "LiteLLM Proxy › config.yaml guardrails: guardrail: tool_permission, rules (tool_name, decision, allowed_param_patterns), default_action, on_disallowed_action"
    setVia: [configFile]
    area: tools
    recommended: "default_action: deny, one allow rule per approved tool, allowed_param_patterns on argument values that matter (recipients, paths, amounts), on_disallowed_action: block"
