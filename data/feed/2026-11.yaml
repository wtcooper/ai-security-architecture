  - id: replit-sandbox-microvms
    kind: guidance
    date: 2026-11-04
    added: 2026-11-25
    weight: notable
    title: "Replit moves its agent sandboxes from shared-kernel containers to microVMs"
    summary: >
      Replit now runs each sandbox on its own minimal guest kernel under KVM. Egress is enforced by a
      host-side proxy that checks TLS hostnames and filters DNS, which the guest cannot disable. Credential
      brokers attach upstream keys, so workloads never hold the account key.
    why: "A hosted app builder's reasoning for moving agent code off the shared host kernel."
    vendor: Replit
    products: [toolReplit]
    controls: [D3-HBPI, D3-EI, cap-agent-egress-control, D3-CTS]
    patterns: [archHostedAppBuilder]
    sources:
      - title: "Inside Replit's New Sandbox Engine, Part 1: The Path to MicroVMs"
        url: https://frontier.replit.com/sandbox-engine-microvms-part-1/
        publisher: Replit
        date: 2026-11-04

  - id: csa-autonomous-pentest-assurance-standard
    kind: guidance
    date: 2026-11-04
    added: 2026-11-25
    weight: brief
    title: "CSA's Autonomous Pentest Assurance Standard: stop control outside the agent, fail closed"
    summary: >
      APAS sets requirements for AI agents that run penetration tests: an authorization declaration with scope
      and rules of engagement; a stop mechanism outside the agent's decision loop, with loss of oversight
      halting activity; tamper-evident logs; and hashed evidence.
    why: "First assurance standard for autonomous offensive agents; its stop and logging rules apply to any agent."
    vendor: Cloud Security Alliance
    controls: [cap-agent-kill-switch, cap-agent-tracing, AML.M0029]
    patterns: [archActionAgent, archAgentSandbox]
    update:
      action: controlGuidance
      status: applied
      target: cap-agent-kill-switch
      note: "Add fail-closed: loss of oversight or of the stop channel halts the agent (APAS-CORE-10.2.2, 10.2.3)."
    sources:
      - title: "Autonomous Pentest Assurance Standard (APAS)"
        url: https://cloudsecurityalliance.org/artifacts/autonomous-pentest-assurance-standard-apas
        publisher: Cloud Security Alliance
        date: 2026-11-04

  - id: anthropic-flashprove-provable-inference
    kind: research
    date: 2026-11-02
    added: 2026-11-25
    weight: brief
    title: "Anthropic open-sources FlashProve, a prototype that proves which model produced a reply"
    summary: >
      FlashProve lets a provider commit to one set of weights and attach a zkSNARK proof to each reply that
      anyone can check on a CPU in seconds. It is a research prototype: Llama 4 Maverick only, greedy
      decoding, 1,024 tokens, about 72 to 94 times vLLM's GPU cost, unmaintained.
    why: "A first working way to verify an inference provider served the committed model, not a substitute."
    vendor: Anthropic
    controls: [cap-ai-vendor-assessment, AML.M0014]
    patterns: []
    sources:
      - title: "Progress on provable inference for large language models"
        url: https://www.anthropic.com/research/provable-inference
        publisher: Anthropic
        date: 2026-11-02
      - title: "anthropics/FlashProve"
        url: https://github.com/anthropics/FlashProve
        publisher: Anthropic
