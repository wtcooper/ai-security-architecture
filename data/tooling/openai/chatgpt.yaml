      - mitigation: cap-sensitive-data-redaction
        coverage: partial
        mechanism: >-
          SharePoint app Safety & Security Controls > Excluded sensitivity labels without encryption (label-based
          restriction); no in-product inspection of prompts, uploads or responses in Chat or Work
        steps:
          - title: Exclude labelled SharePoint files
            body:
              - >-
                In the SharePoint app's Safety & Security Controls enter each non-encrypting Microsoft Purview
                label GUID under Excluded sensitivity labels without encryption; files with encrypting labels are
                already excluded.
            url: https://help.openai.com/en/articles/20001502-managing-sharepoint-site-access-and-sensitivity-label-exclusions
          - title: Inspect prompts at the endpoint or browser
            body:
              - >-
                Apply endpoint, browser or SSE DLP inline to chatgpt.com; the desktop and mobile apps need the
                proxy certificate added to their pin list by MDM before SSL inspection works.
            url: https://help.openai.com/en/articles/20001323-corporate-network-controls-in-chatgpt-enterprise
          - title: Scan conversations after the fact
            body:
              - >-
                Have a workspace owner create an Admin key with Conversation messages and app-log access and feed
                the Compliance Logs Platform to a DLP partner such as Microsoft Purview, Netskope, Cyberhaven,
                Forcepoint or Palo Alto Networks.
            url: https://help.openai.com/en/articles/9261474-openai-compliance-platform-for-enterprise-and-edu-customers
        note: >-
          Partial only by the label-restriction clause of the rule applied to every vendor: the SharePoint
          sensitivity-label exclusion, enforced by OpenAI, keeps labelled files out of SharePoint app results
          (supported Office, PDF and MP4 files; TXT and CSV are treated as unlabelled; OneDrive is separate).
          Nothing in Chat or Work detects identifiers, secrets or classified content in what an employee types or
          uploads, in connector payloads or in responses, and nothing masks them; Prisma AIRS external guardrails
          scan Codex prompts only. The pin's objective — classification before material leaves the person — is
          met by endpoint or browser DLP inline; Compliance Logs Platform partners scan conversations after they
          reach OpenAI (detection after the fact, 30-day source window). Action controls, parameter constraints,
          deny_read and allow_appshots limit where data can go or what the agent can read but inspect nothing.
        verified: "2026-09-25"
        migration:
