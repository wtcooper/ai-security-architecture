  - id: toolClaudeCoworkCloud
    name: Claude Cowork in the cloud
    surfaceClasses:
      - cloudAgent
    variants:
      - name: Cowork on web, mobile and the Chrome side panel (sessions on Anthropic servers)
        class: cloudAgent
        url: >-
          https://support.claude.com/en/articles/15520349-use-claude-cowork-on-web-desktop-and-mobile
      - name: Cowork in Claude Desktop with "Cloud" selected
        class: cloudAgent
        url: https://claude.com/docs/cowork/overview
      - name: Dispatch (background tasks) and scheduled tasks
        class: cloudAgent
        url: https://claude.com/docs/cowork/guide/dispatch
        note: Unattended runs on the same cloud runtime, owned by the person who scheduled them.
    architecture: archHostedAgentSessions
    status: beta
    asOf: "2026-09"
    summary:
      - >-
        The Cowork engine run on Anthropic's servers instead of the device: the agent loop and code execution
        run in a per-session ephemeral sandbox, sessions and files are saved to the account and keep working
        with every device offline, and the session can only touch local folders while the desktop app on that
        device is open, over an Anthropic-brokered connection. Every byte leaving the sandbox passes a
        mandatory proxy the sandbox cannot reconfigure; the network policy is the organisation's existing
        network-access setting ("no access" by default on Enterprise). Connector tokens never enter the
        sandbox — calls are made server-side.
      - >-
        Modelled as a vendor-hosted agent session because the loop has left the machine: the doors are the web
        and mobile apps, the desktop app's Cloud option, Dispatch and the scheduler, and the admin plane is
        the claude.ai console only — device managed configuration (allowedWorkspaceFolders,
        coworkEgressAllowedHosts, disabledBuiltinTools) reaches local sessions and not these. Organisation
        settings > Cowork carries "Run Cowork in the cloud" (Team on by default; Enterprise off by default and
        granted through custom roles), the network-access policy under Capabilities, the "Automatically
        approve" and "Always allow for connector tools" toggles, trusted-device enrolment and the OTLP
        collector; the Compliance API captures remote Cowork sessions, including agent-owned scheduled runs.
        Cowork is not covered by zero data retention.
    facts:
      - label: Plans
        value: >-
          Web and mobile in beta for Pro, Max and Team, and for Enterprise where an owner or a custom role
          enables it; the desktop Cloud option follows the same setting.
        url: >-
          https://support.claude.com/en/articles/15520349-use-claude-cowork-on-web-desktop-and-mobile
      - label: Inference & routing
        value: >-
          Anthropic API only. Cloud sessions run on Anthropic infrastructure and are not available when Claude
          Desktop is configured for Bedrock, Vertex, Foundry or a gateway.
        url: https://support.claude.com/en/articles/14479288-claude-cowork-architecture-overview
      - label: Data leaving the device
        value: >-
          Prompts, connector data, browser page content and the session's files live in the account; a
          device's local folders are reachable only while the desktop app is open on it, through the brokered
          connection.
        url: https://support.claude.com/en/articles/14479288-claude-cowork-architecture-overview
      - label: Retention & training
        value: >-
          Cloud sessions are saved to the account (remote transcripts 6 years unless deleted) and captured by
          the Compliance API; Cowork is not covered by ZDR. Commercial terms: no training.
        url: https://platform.claude.com/docs/en/manage-claude/compliance-sessions
      - label: Docs index
        value: >-
          claude.com/docs/cowork plus the Help Center architecture overview and Team/Enterprise admin article
        url: https://claude.com/docs/cowork/overview
    items:
      - title: Enable cloud sessions per role, not per organisation
        body:
          - Organization settings > Cowork > "Run Cowork in the cloud" is off by default on Enterprise; grant
            it through custom roles to the groups that need unattended or device-independent sessions, and
            leave "Enable for your organization" scoped the same way.
        links:
          - title: Use Claude Cowork on Team and Enterprise plans
            url: >-
              https://support.claude.com/en/articles/13455879-use-claude-cowork-on-team-and-enterprise-plans
      - title: Set the network-access policy before the first session
        body:
          - Cloud sandboxes inherit the organisation's network-access setting under Organization settings >
            Capabilities; the Enterprise default is no access. Device keys such as coworkEgressAllowedHosts do
            not reach cloud sessions.
        links:
          - title: Claude Cowork architecture overview
            url: https://support.claude.com/en/articles/14479288-claude-cowork-architecture-overview
    riskNotes:
      - risk: riskPromptInjection
        note: >-
          Documents, connector results and browser pages enter an unattended session as instruction; the
          network-access policy and the connector approval toggles are the containment, and "Automatically
          approve" removes the per-tool prompt.
      - risk: riskShadowAndUnknownAgents
        note: >-
          Dispatch and scheduled tasks run with no device and no person present; the Compliance API's list of
          remote sessions, including agent-owned scheduled runs, is the inventory.
      - risk: riskSensitiveDataDisclosure
        note: >-
          Sessions and their files are saved to the account and retained for years unless deleted; the session
          can reach a device's folders whenever the desktop app is open there.
    controls:
      - mitigation: D3-APA
        coverage: unknown
        mechanism: >-
          "Run Cowork in the cloud" per custom role; trusted-device enrolment; SSO at the account layer
        steps:
          - title: Gate cloud sessions by role
            body:
              - On Enterprise the cloud toggle is off by default and granted through custom roles; Team turns
                it on by default, so turn it off there deliberately.
            url: >-
              https://support.claude.com/en/articles/13455879-use-claude-cowork-on-team-and-enterprise-plans
        evidence: []
        note: >-
          Capability scope changed: reassess this function. Retained configuration and evidence describe the
          former capability, not verified coverage of every replacement.


          [capabilityIga]
        migration:
          from:
            - capabilityIga
          reviewRequired: true
          original:
            - capability: capabilityIga
              coverage: native
              mechanism: >-
                "Run Cowork in the cloud" per custom role; trusted-device enrolment; SSO at the account layer
              steps:
                - title: Gate cloud sessions by role
                  body:
                    - On Enterprise the cloud toggle is off by default and granted through custom roles; Team
                      turns it on by default, so turn it off there deliberately.
                  url: >-
                    https://support.claude.com/en/articles/13455879-use-claude-cowork-on-team-and-enterprise-plans
              verified: 2026-09-17
      - mitigation: D3-EI
        coverage: native
        verified: "2026-09-17"
        mechanism: Per-session ephemeral sandbox on Anthropic servers; always on, no toggle
        steps:
          - title: Read the architecture overview
            body:
              - Each cloud session runs in its own ephemeral sandbox with no access to the organisation's
