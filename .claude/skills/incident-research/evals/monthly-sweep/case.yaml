schema_version: "1.1"
name: monthly-sweep
expected_outcome: |
  Any incident added is a new file under data/incidents/ that builds cleanly, replays on an
  existing pattern, cites sources read during the run, and ends on a mitigated step whose breaks
  are controls pinned on that pattern. A dated log under docs/research/incidents/ records the
  window, what was added, what was rejected and why, and the search log. If nothing qualified,
  the log says so and no incident file was added.
