  - architecture: archActionAgent
    asOf: "2026-10"
    reference:
      - title: "Building serverless architectures for agentic AI on AWS — Pattern 2: Agentic AI orchestration with Amazon Bedrock"
        url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-serverless/pattern-agentic-ai-orchestration.html
      - title: Tool-based agents for calling functions (AWS Prescriptive Guidance)
        url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-patterns/tool-based-agents-for-calling-functions.html
      - title: Security for agentic AI on AWS (AWS Prescriptive Guidance)
        url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-security/introduction.html
    summary:
      - >-
        Your own agent on AgentCore Runtime, started only by EventBridge rules, SQS queues and
        schedules through a Lambda function whose role carries the run's authority, choosing actions
        from a catalogue of Lambda and API targets on AgentCore Gateway that Policy in AgentCore
        decides call by call. AWS's serverless pattern puts Amazon Bedrock Agents in the loop's
        place; that managed agent is the API/SDK managed agent runtime drawing, so this one keeps the
        loop in your code. Approvals above the threshold go to an operator queue and resume the run
        as an event.
    bindings:
      - { block: events, service: "Amazon EventBridge, SQS and Lambda", note: "The ingress function validates the message and invokes the runtime under the run's grant: its own role, or an on-behalf-of token carried on the message." }
      - { block: planner, service: Your agent on AgentCore Runtime (Strands), note: "Amazon Bedrock Agents and AgentCore harness are the managed alternatives." }
      - { block: localTools, service: AgentCore Code Interpreter }
      - { block: stateRetrieval, service: AgentCore Memory and Knowledge Bases, note: "Case state keyed by case id as the memory session." }
      - { block: gateway, service: Amazon Bedrock AgentCore Gateway, note: "Inference targets broker model calls; tool targets broker the action catalogue; Policy in AgentCore decides each call." }
      - { block: internalTools, service: "Your action Lambdas, as gateway targets", note: "Each action a Lambda target with an inline tool schema, its parameters validated and its compensating action beside it." }
      - { block: provider, service: Amazon Bedrock foundation models }
      - { block: orgData, service: Your systems of record, build: true, note: "Amazon DynamoDB, Amazon RDS, Amazon S3 — where orders, accounts and case files live." }
      - { block: openWeb, service: Brave or Tavily Search as a gateway target }
      - { block: sources, service: "Public registries (PyPI, npm)" }
      - { block: registry, service: AWS CodeArtifact repository }
