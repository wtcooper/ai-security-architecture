      - mitigation: D3-CH
        coverage: partial
        mechanism: >-
          Team Secrets (Enterprise; encrypted, never shown again after saving, admin-managed, up to 100 per team);
          write-only per-Bot Secrets; connector OAuth tokens on Cursor's backend; no vendor tunnel (the
          organisation's own networking client through Team Setup)
        steps:
          - title: Store fleet credentials as Team Secrets
            body:
              - Add each credential under Team Secrets on the Grok Bot page as a name and value; Cursor stores it
                encrypted, never shows it again, and Replace rotates it on the next script run.
            url: https://cursor.com/docs/grok-bot/teams
          - title: Roll a rotation out now
            body:
              - Run Recreate VMs from Grok Bot Computers so Team Setup re-runs with the rotated value instead of
                waiting for the periodic refresh.
            url: https://cursor.com/docs/grok-bot/computers
          - title: Scope the networking-client credential
            body:
              - Prefer interactive login in the computer's browser; a reusable tagged Tailscale auth key stored as
                a Team Secret joins every team computer under the same tags, so scope its ACLs and revoke
                computers from your own admin console.
            url: https://cursor.com/docs/grok-bot/private-networks
        note: >-
          Partial on the hosted rule. Team Secrets and per-Bot secrets are encrypted and write-only, and Team
          Secrets are admin-scoped to setup scripts with output redaction, but a rotation reaches computers only
          when scripts re-run, a Team Secret spans the whole team (there are no group-level secrets), and the
          credentials a Bot actually uses in the browser are long-lived web sessions on the durable disk rather
          than short-lived issued tokens. Tunnel: Grok Bot has no vendor tunnel or connector; private reach is a
          member's desktop route or the organisation's own networking client installed by Team Setup, whose key
          is issued, rotated and revoked in that vendor's console, not Cursor's. Team Secrets are dashboard-only
          (not in the Admin API).
        verified: "2026-09-25"
