      - mitigation: cap-sensitive-data-redaction
        coverage: partial
        mechanism: >-
          access_policies statements that deny addin.access on an open document, or file.upload of an attached
          file, by Microsoft Purview sensitivity label GUID (mip_label_guid), label name or file path, with an
          allow-list mode and fail-closed handling of unreadable labels (manifest or bootstrap); Microsoft's
          Allow programmatic access = false label option keeps Outlook add-ins off encrypted mail; no content
          detection, and Inference hooks do not cover the add-ins
        steps:
          - title: Block the add-in on labelled content
            body:
              - >-
                Add access_policies deny statements for addin.access with an open_file resource matching your
                restricted sublabel GUIDs, and for file.upload with an uploaded_file resource on the same
                labels, and deliver the array in the manifest or bootstrap response.
            url: https://github.com/anthropics/financial-services/blob/main/claude-for-msft-365-install/commands/access-policies.md
          - title: Keep Outlook add-ins off encrypted mail
            body:
              - >-
                For sensitivity labels that encrypt mail, set the Allow programmatic access custom policy option
                to false; Outlook add-ins do not activate on those items.
            url: https://learn.microsoft.com/en-us/office/dev/add-ins/outlook/outlook-add-ins-overview
          - title: Scan transcripts after the fact
            body:
              - >-
                Pull office_agents/* local session transcripts from the Compliance API into your DLP scanner;
                this detects after the prompt was sent and cannot block it.
            url: https://platform.claude.com/docs/en/manage-claude/compliance-sessions
        note: >-
          Partial by the rule: label-based restriction without content detection. access_policies reads the
          label, not the content — an unlabelled document carrying card numbers passes unless labels are
          allow-listed (the first allow flips that scope to default-deny, and exists: false refuses unlabelled
          files). It gates only the open document and uploaded attachments: text the user types or pastes,
          mail read through Graph (thread retrieval, search, attachments read inline), connector results and
          cross-app context are not documented as label-checked, and the key is documented for manifest and
          bootstrap delivery, not the AppSource install with Claude sign-in. Microsoft Purview lists DLP and
          sensitivity labels as unsupported for Anthropic Claude interactions, Anthropic's Inference hooks
          govern claude.ai, Cowork, Claude Code and Claude Tag but not the add-ins, and the OpenTelemetry
          collector and Compliance API see prompts only after they were sent. Preventive inspection of typed
          content is the endpoint DLP or SSE product's.
        verified: "2026-09-25"
        migration:
