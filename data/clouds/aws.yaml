  - architecture: archAgentSandbox
    asOf: "2026-10"
    # >>> checked against the vendor's documentation
    verified: "2026-11-18"
    sources:
      graders: https://docs.aws.amazon.com/sagemaker/latest/dg/realtime-endpoints.html
      platform: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-vpc.html
      orchestrator: https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod.html
      sandbox: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-sessions.html
      harness: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agents-tools-runtime.html
      localTools: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/browser-tool.html
      storage: https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html
      inference: https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-model-deployment-deploy-ftm.html
      offlineWeb: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/what-is.html
      registry: https://docs.aws.amazon.com/codeartifact/latest/ug/welcome.html
      sources: https://docs.aws.amazon.com/codeartifact/latest/ug/external-connection.html
    differences:
      - at: sources->registry
        text: "A CodeArtifact repository with an external connection fetches any missing public package the moment a client asks for it. A rollout could pull in unreviewed packages that way. Give rollouts a repository with no external connection upstream, filled by a separate admission pipeline."
        url: https://docs.aws.amazon.com/codeartifact/latest/ug/external-connection.html
      - at: localTools->offlineWeb
        text: "The browser is not inside the rollout's microVM. The rollout drives a separate AgentCore Browser session through the AgentCore API. Create a custom browser in VPC mode on the sandbox subnets, grant the rollout role only browser actions, and stop that session with the episode."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/browser-tool.html
      - at: localTools->platform
        text: "Every session receives the runtime's execution-role credentials from a metadata endpoint that any code in the microVM, including the model, can read. That role can write the runtime's own logs. Keep it minimal, scope it by session ID, and record trajectories from the orchestrator side."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/security-credentials-management.html
      - at: orchestrator->harness
        text: "The orchestrator never connects to a sandbox directly. It calls the AgentCore API (InvokeAgentRuntime, InvokeAgentRuntimeCommand) with a session ID. Default quotas are 25 new sessions a second and 5,000 active sessions per account in two US regions, 2,500 elsewhere; request increases early."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/bedrock-agentcore-limits.html
      - at: graders->harness
        text: "When a session stops, its microVM and disk are destroyed. End-state checks must run through InvokeAgentRuntimeCommand before StopRuntimeSession, or the orchestrator must copy the state out. Do not attach shared file systems, which every session can see; session storage persists under a reused session ID."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-filesystem-configurations.html
      - at: harness->inference
        text: "HyperPod publishes the vLLM deployment as a SageMaker endpoint. The episode loop calls it through a SageMaker Runtime interface endpoint, signed with the rollout role, so that role needs invoke permission on that one endpoint and nothing else in SageMaker."
        url: https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-model-deployment-deploy-ftm.html
      - at: sandbox
        text: "In VPC mode AWS shares network interfaces across all runtimes that use the same subnets and security groups. Firewall and flow logs may therefore not tell one rollout from another. Use separate subnets and security groups for each trust level or experiment."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-vpc.html
    alsoNeeded:
      - service: "Amazon ECR"
        role: registry
        why: "Holds the rollout container image; VPC-mode runtimes need ECR and S3 endpoints to pull it."
        url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/what-is-ecr.html
      - service: "SageMaker Runtime interface endpoint (AWS PrivateLink)"
        role: network
        why: "Private path from the sandbox subnets to the vLLM endpoint; the listed endpoints name Bedrock instead."
        url: https://docs.aws.amazon.com/sagemaker/latest/dg/interface-vpc-endpoint.html
      - service: "Amazon VPC with AWS Network Firewall and Route 53 Resolver DNS Firewall"
        role: network
        why: "Private subnets in supported Availability Zones, with no NAT route for rollouts."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-vpc.html
      - service: "IAM roles and EKS Pod Identity"
        role: identity
        why: "Separate roles for rollouts, orchestrator, inference and graders."
        url: https://docs.aws.amazon.com/eks/latest/userguide/pod-identities.html
      - service: "AWS IAM Identity Center"
        role: identity
        why: "Workforce sign-in for the researchers who submit runs and read results."
        url: https://docs.aws.amazon.com/singlesignon/latest/userguide/what-is.html
      - service: "AWS KMS"
        role: keys
        why: "Customer managed keys for checkpoint and trajectory buckets and log groups."
        url: https://docs.aws.amazon.com/kms/latest/developerguide/overview.html
      - service: "Amazon CloudWatch Logs and AWS CloudTrail"
        role: logging
        why: "Runtime logs and traces, plus data events for every session call."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/observability-configure.html
      - service: "AWS Organizations service control policy"
        role: other
        why: "Carries the deny rule that forces approved subnets and security groups on every runtime and browser."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/security-vpc-condition.html
    quickstart:
      - title: "Get started with AgentCore Runtime using the AgentCore CLI"
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-get-started-cli.html
      - title: "Amazon SageMaker HyperPod quickstart"
        url: https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-quickstart.html
      - title: "Deploy models from Amazon S3, Amazon FSx, or Hugging Face Hub using kubectl"
        url: https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-model-deployment-deploy-ftm.html
