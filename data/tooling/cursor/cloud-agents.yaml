    architecture: archHostedAgentSessions
    status: ga
    asOf: "2026-09"
    summary:
      - >-
        Cloud Agents (formerly Background Agents) run the Cursor agent in a Firecracker microVM in a dedicated
        AWS account, one VM boundary per agent rather than a shared process sandbox. They clone repositories
        through a Cursor GitHub / GitLab / Bitbucket / Azure DevOps app an account admin connected, work on a
        branch and hand back a draft pull request. Triggers are the web app, iOS, the Desktop Cloud dropdown,
        @cursor in Slack, Linear, GitHub or Bitbucket, the Cloud Agents API (public beta) and Automations that
        fire on schedules, source-control, Slack, Linear, Sentry, PagerDuty or webhook events. Bugbot,
        Security Agents and Approval Agents are Cloud Agents wired to pull-request events; Self-Hosted
        Machines move tool execution onto customer workers while the agent loop and inference stay in Cursor's
        cloud.
      - >-
        Inference runs on Cursor's hosted providers under Privacy Mode (Cloud Agents do not support Legacy
        Privacy Mode and never train on accessed code). Code is stored temporarily while a run executes;
        conversation state is retained indefinitely by default until deleted, VM snapshots are deleted after
        90 days idle. Data at rest is AES-256 with per-agent keys, TLS 1.2+ in transit, and Enterprise teams
        can bring a customer-managed KMS key (CMEK/BYOK). Egress leaves from published CIDR ranges
        (docs/ips.json) and a fixed three-IP git proxy; AWS PrivateLink or Cloudflare Tunnel reach private git
        servers and registries.
      - >-
        The admin surface is the dashboard's Cloud Agents section plus Enterprise settings: a network-access
        policy (Allow all / Default + allowlist / Allowlist only) that admins can lock org-wide, Runtime
        Secrets that are redacted from transcripts, tool output and commits, OIDC federation (issuer
        api.cursor.com, 5-minute RS256 tokens) so agents assume cloud roles without stored credentials,
        Protected Git Scopes and Repository Blocklist, and per-team toggles for agent summaries in Slack, Team
        follow-ups, Long running agents and Computer use. The default network policy is allow-all, and an
        Approval Agent can be configured to approve low-risk pull requests itself — both defaults an
        organisation should decide on deliberately.
    facts:
      - label: Plans
        value: >-
          Any paid Cursor plan can run Cloud Agents. Enterprise-only: network-policy lock, CMEK, PrivateLink /
          Cloudflare Tunnel, service accounts, Team Pools for Self-Hosted Machines, audit log and SIEM,
          OpenTelemetry export, Bugbot Admin API.
        url: https://cursor.com/docs/cloud-agent
      - label: Inference & routing
        value: >-
          Self-Hosted Machines keep inference and planning in Cursor's cloud and send only the content the
          agent needs; workers connect outbound to api2.cursor.sh, api2direct.cursor.sh and the artifacts S3
          bucket.
        url: https://cursor.com/docs/cloud-agent/self-hosted/integrations
      - label: Data leaving the device
        value: >-
          Nothing runs on the developer's device; the repository, secrets and environment live in the VM.
          Slack, GitHub and Linear see agent summaries and diffs (file paths included) unless the Display
          agent summary toggles are off; Slack Connect guests are governed by a separate external-channels
          toggle.
        url: https://cursor.com/docs/cloud-agent/settings
      - label: Data retention / training
        value: >-
          Privacy Mode always: Cursor never trains on code accessed by Cloud Agents or on their prompts and
          responses. Conversation state is retained indefinitely by default and deletable on demand; VM
          snapshots auto-delete after 90 days of inactivity; the runtime workspace is recycled when idle.
          Secrets are KMS-encrypted at rest.
        url: https://cursor.com/docs/cloud-agent/security
      - label: Docs index
        value: >-
          Cloud Agents documentation (overview, security, secrets and network, identity, settings, private
          connectivity, self-hosted, automations, API).
        url: https://cursor.com/docs/cloud-agent
      - label: Isolation
        value: >-
          Firecracker microVMs in a dedicated AWS account segregated from other Cursor services; one VM
          boundary per agent.
        url: https://cursor.com/docs/cloud-agent/security
      - label: Egress
        value: >-
          Published CIDR ranges per cluster (us3p, us4p, us5p) at cursor.com/docs/ips.json and a three-IP git
          egress proxy (184.73.225.134, 3.209.66.12, 52.44.113.131); the default network allowlist matches the
          desktop sandbox's defaults.
        url: https://cursor.com/docs/cloud-agent/security-network
      - label: Private connectivity
        value: >-
          AWS PrivateLink (endpoint service com.amazonaws.vpce.us-east-1.vpce-svc-054b15427d4bea2b7 for the
          api2.cursor.sh webhook path) or Cloudflare Tunnel for GitHub Enterprise Server, GitLab Enterprise,
          Bitbucket Data Center and package registries; shared by Cloud Agents, Bugbot and backend services;
          Enterprise only, arranged via hi@cursor.com.
        url: https://cursor.com/docs/cloud-agent/private-connectivity
      - label: Cursor Origin (excluded surface)
        value: >-
          Cursor's git forge, early beta since 2026-08-17 on Pro, Teams and Enterprise, mirroring a GitHub
          repository one-way (GitHub stays the source of truth); admins can disable Origin for the team from
          the dashboard, and a namespace must be claimed before enabling. Left out of the registry as code
          hosting rather than an agent runtime; treat repositories mirrored into Origin as a code-egress path
          to review.
        url: https://cursor.com/docs/origin
      - label: Vendor ownership
        value: >-
          SpaceX closed its acquisition of Anysphere (Cursor) on 2026-08-15; Cloud Agent infrastructure and
          subprocessors should be re-confirmed under the new owner.
        url: https://techcrunch.com/2026/08/15/spacex-officially-closes-its-cursor-acquisition/
    riskNotes:
      - risk: riskPromptInjection
        note: >-
          A Cloud Agent reads repository content, PR comments, Slack threads and Linear issues as instructions
          and can browse the web; the vendor's stated mitigations are egress restriction, Runtime Secret
          redaction and the draft-PR gate. The default network policy is allow-all, so the first mitigation
          only exists once an admin locks Allowlist only.
      - risk: riskAgenticDelegationConfusedDeputy
        note: >-
          The GitHub App is installed with eight permission categories including Administration; the agent can
          only reach repositories the triggering user could, but Automations run under the `cursor` account or
          a service account and Approval Agents can approve PRs on their own criteria — a machine identity
          approving machine-authored changes unless you keep approvals off.
      - risk: riskCrossTenantCredentialPropagation
        note: >-
          OIDC tokens identify the whole run (cloud_agent_id, team_id, repo_urls) and any process on the VM
          can mint one from the local socket; scope IAM trust policies on aud and sub, not on the token
          existing. Egress IPs are shared across Cursor clusters, not per customer.
      - risk: riskSensitiveDataDisclosure
        note: >-
          Agent summaries and diffs are posted into Slack, GitHub and Linear by default; conversation state
          persists indefinitely. Turn off Display agent summary in external channels, mark credentials as
          Runtime Secrets and set a deletion routine through the API.
      - risk: riskShadowAndUnknownAgents
        note: >-
          Anyone on a paid plan can create Automations and any team member can create Private ones billed to
          their own account; Protected Git Scopes and admin promotion to Team Owned are the levers that bring
          them under the team's view.
