    alsoNeeded:
      - service: "AWS IAM Identity Center"
        role: identity
        why: "Workforce sign-in with MFA for requesters, owners and app users; one SAML application per app whose assignments decide who may sign in; the owner's approval permission set."
        url: https://docs.aws.amazon.com/singlesignon/latest/userguide/assignuserstoapp.html
      - service: "Amazon Cognito user pool in each app account"
        role: identity
        why: "Federates to that app's Identity Center application and backs the ALB's authenticate-cognito action."
        url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/listener-authenticate-users.html
      - service: "AgentCore Identity"
        role: identity
        why: "Keeps the GitHub App credential and provider API keys in its token vault and hands the session short-lived tokens."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/identity-idp-github.html
      - service: "AWS CodeConnections"
        role: other
        why: "Connects each app pipeline to GitHub for push and pull request triggers."
        url: https://docs.aws.amazon.com/codepipeline/latest/userguide/connections-github.html
      - service: "Amazon VPC with NAT gateway and AWS Network Firewall"
        role: network
        why: "VPC-mode sessions get no internet from public subnets; private subnets route through NAT and the firewall's domain allowlist."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-vpc.html
      - service: "Amazon VPC Lattice service network, shared with AWS RAM"
        role: network
        why: "Carries connector traffic from approved app accounts to enterprise systems without peering."
        url: https://docs.aws.amazon.com/vpc-lattice/latest/ug/auth-policies.html
      - service: "AWS Certificate Manager"
        role: ingress
        why: "ALB sign-in actions work only on HTTPS listeners, which need a certificate."
        url: https://docs.aws.amazon.com/acm/latest/userguide/acm-overview.html
      - service: "AWS KMS"
        role: keys
        why: "A customer managed key per app account for its store, logs and secrets."
        url: https://docs.aws.amazon.com/kms/latest/developerguide/overview.html
      - service: "AWS Secrets Manager"
        role: secrets
        why: "Each app's secrets in its own account, injected by ECS at task start; backs AgentCore Identity's vault."
        url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/secrets-envvar-secrets-manager.html
      - service: "Amazon ECR with managed signing"
        role: registry
        why: "Holds the agent image and each app's images; managed signing signs on push with AWS Signer."
        url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/managed-signing.html
      - service: "Your app register"
        role: registry
        why: "AWS Service Catalog AppRegistry is closed to new customers, so the register is the account tags plus the factory's own table."
        url: https://docs.aws.amazon.com/servicecatalog/latest/arguide/intro-app-registry.html
      - service: "Amazon CloudWatch, AWS CloudTrail and AWS Config"
        role: logging
        why: "Agent traces, the record of approvals and deployments, and the organisation-wide resource inventory."
        url: https://docs.aws.amazon.com/config/latest/developerguide/querying-AWS-resources.html
      - service: "Amazon GuardDuty Malware Protection for S3"
        role: other
        why: "Scans the intake's upload bucket before a file reaches the spec."
        url: https://docs.aws.amazon.com/guardduty/latest/ug/gdu-malware-protection-s3.html
