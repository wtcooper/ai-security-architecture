# Controls guidance for the UI/low-code managed agent runtime archetype. Audience: admins,
# architects and security teams. This is a use pattern: the platform is the vendor's and no
# control can be inserted into its execution, so every control here is a population control.
# The build's derivation check fails this document if its cited capabilities stop being pinned.
archetype: archLowCodeAgentBuilder
mode: use
status: draft
attribution: >-
  Authored in this repository. Pattern-level by design; incidents are cited, vendors are not
  named in the items.

overview:
  - >-
    The unit of risk in this archetype is the population, not the agent: hundreds of
    near-identical agents, each simple, each holding connector grants, many authored by
    people who have left. There is no code review between an afternoon's work and something
    that acts on production data unless the platform's gates are turned on — and several of
    the platform defaults (sharing scope, agent-to-agent discovery, soft-enabled policy) are
    set for adoption, not governance.
  - >-
    The decisive technical question when evaluating or configuring any platform in this
    class: does a published agent execute on its author's credentials or its invoker's?
    Author-credential execution turns publishing into a privilege grant — a user who could
    not read a table reads it through an agent someone else built — and no amount of
    population management compensates for getting this one wrong.

items:
  - title: Build the inventory first; everything else depends on it
    capabilities: [capabilityAgentRegistry, capabilityAuditLogging, capabilityKillSwitch]
    body:
      - >-
        Every agent, its author, its connector set, its audience, its sharing mode and its
        last use — the platforms now report this, and the vendors sell fleet-level control
        planes over it. Pair the inventory with run history per agent and per consumer: it is
        the basis for retiring what nobody uses, investigating what someone did, and noticing
        the agents shared to "anyone with the link" on the vendor's own domain, where
        exposure research keeps finding them by the thousands.

  - title: Decide who may build, and demand invoker-credential execution
    capabilities: [capabilityIga, capabilityNhiManagement, capabilityCredentialIsolation]
    body:
      - >-
        Restricting who may build is the bluntest and often most effective population
        control — by default, creating an agent requires the same permission as opening a
        document. Require per-invoker authorisation so the organisation's existing access
        model survives publication, and use the platforms' per-agent identities: a directory
        principal per agent is the hook that lets conditional access, policy and revocation
        attach to one agent instead of the whole population, and the handle for transferring
        ownership when authors leave.

  - title: Author connector policy centrally, and gate publication
    capabilities: [capabilityToolPermissionScoping, capabilityHitlControls]
    body:
      - >-
        Blocking a connector pairing scales where reviewing agents does not: a source of
        confidential data plus a path that sends mail is the pairing worth banning outright.
        Check the enforcement default on whatever platform is in use — some enforce centrally
        out of the box, others ship policy soft-enabled where makers never feel it. Turn on
        the publication gate so review stands between an author and an audience; it is the
        nearest available thing to code review, and it is frequently off.

  - title: Treat grounding sources as instruction channels
    capabilities: [capabilityPromptInjectionDefense, capabilityDataAccessGovernance, capabilityDspm, capabilityAiDlp]
    body:
      - >-
        A shared agent's knowledge source is frequently a folder anyone can write to — an
        instruction channel wearing a grounding label, where one planted document steers the
        agent for every user. Restrict attachable locations to ones with governed write
        access, govern by classification what connectors may reach at all, and know what
        sensitive data sits inside connector reach before hundreds of agents find it. Assume
        agent-to-agent discovery is on by default and decide deliberately whether it should
        be: one steered agent recruiting a teammate's stronger connectors is the documented
        second-order path.

  - title: Publish in stages, and watch the population for drift
    capabilities: [capabilityStagedRollout, capabilityBehavioralDriftDetection]
    body:
      - >-
        Publication is delivery: versioned agents, a limited audience before the whole team,
        and unpublish as the rollback everyone knows how to invoke. Over a population of
        hundreds, drift is the signal worth automating — the agent whose connector mix or run
        pattern moved from its baseline is the one to quarantine before an incident names it.
        Test what can be tested: vendor internals are opaque, but a published agent, its
        policies and its connector boundaries are all black-box testable, and should be.

  - title: Own the tunnel host like the crossing it is
    capabilities: [capabilitySecretsManagement, capabilityEncryptionKeyManagement]
    body:
      - >-
        The on-premises gateway caches connection credentials on a host somebody must patch:
        rotate those secrets on a schedule, revoke them without redeploying the host, monitor
        its health, and decommission it deliberately when the last connection moves off it.
        Customer-managed keys over the platform's stored data are a planned change, not a
        toggle — managed tier only, not retroactive — so decide them at adoption.

  - title: Run it as a programme, and assure what you cannot test
    capabilities: [capabilityAiGovernancePlatform, capabilityAiTprm, capabilityVendorAssurance]
    body:
      - >-
        Maker governance is ongoing: environments and licensing, lifecycle and ownership
        transfer, retirement as somebody's actual job — the population grows by default and
        shrinks only on purpose. The platform's execution, isolation and guardrail claims
        cannot be tested from your side; assure them the way any critical vendor control is
        assured, and revisit when the vendor ships the features that change the answer.

sources:
  - title: "ForcedLeak — indirect prompt injection exfiltrating CRM data from a low-code agent platform"
    url: https://thehackernews.com/2025/09/salesforce-patches-critical-forcedleak.html
  - title: "Microsoft — Copilot Studio agent security: top 10 risks, detection and prevention"
    url: https://www.microsoft.com/en-us/security/blog/2026/02/12/copilot-studio-agent-security-top-10-risks-detect-prevent/
  - title: "Gartner — six steps to manage AI agent sprawl"
    url: https://www.gartner.com/en/newsroom/press-releases/2026-04-28-gartner-identifies-six-steps-to-manage-artificial-intelligence-agent-sprawl
