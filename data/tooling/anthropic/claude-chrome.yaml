          policy, which only the header covers. Team plans cannot claim existing personal accounts.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityIga
          reviewRequired: false
          original:
            - capability: capabilityIga
              coverage: native
              mechanism: >-
                Org enable toggle "Enable for your team" at Organization settings > Claude in Chrome, per-role
                capability on Enterprise custom roles (separate from Cowork access), forceLoginOrgUUID
                deployable as a Chrome enterprise policy
              steps:
                - title: Decide who gets the extension
                  body:
                    - At Organization settings > Claude in Chrome set "Enable for your team" (Team default on;
                      Enterprise turns on by default starting 10 September 2026 unless already disabled) and
                      grant the Claude in Chrome capability per custom role on Enterprise.
                  url: https://support.claude.com/en/articles/13065128-claude-in-chrome-admin-controls
                - title: Pin the extension to your organisation
                  body:
                    - Deploy forceLoginOrgUUID through Chrome enterprise policy so the extension can only be
                      used with your Claude organisation.
                  url: https://support.claude.com/en/articles/13065128-claude-in-chrome-admin-controls
              verified: 2026-09-10
      - mitigation: cap-agent-action-policy-enforcement
        coverage: partial
        mechanism: >-
          Organisation allowlist and blocklist enforced by the extension regardless of user permissions;
          vendor-fixed prohibited action classes (including "completing instructions from emails or web
          content") and always-ask actions; the user-chosen approval mode; in Claude Code, managed permission
          rules on mcp__claude-in-chrome__ tools with allowManagedPermissionRulesOnly, and deniedMcpServers
        steps:
          - title: Enforce the site lists centrally
            body:
              - >-
                Add approved sites to the allowlist and forbidden sites to the blocklist at Organization settings >
                Claude in Chrome; the blocklist applies regardless of user settings.
            url: https://support.claude.com/en/articles/13065128-claude-in-chrome-admin-controls
          - title: Gate browser tools in Claude Code
            body:
              - >-
                Deploy permissions.deny or permissions.ask rules on mcp__claude-in-chrome__* tools with
                allowManagedPermissionRulesOnly in managed settings.
            url: https://code.claude.com/docs/en/permissions
        note: >-
          Partial by the architecture rule: the site lists are admin-delivered and non-overridable, but the
          blocked action classes are vendor-chosen (no admin can add one), the approval mode is the user's to
          change, and "completing instructions from emails or web content" can only be judged by a classifier.
          The extension's managed policy schema carries forceLoginOrgUUID and an undocumented blockedUrlPatterns
          key; no key pins the approval mode or blocks an action class. Only Claude Code sessions take
          admin-authored per-tool rules, matched by tool name, with decisions made on the device.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAgentRuntimeEnforcement
          reviewRequired: false
          original:
            - capability: capabilityAgentRuntimeEnforcement
              coverage: partial
              mechanism: >-
                Org allowlist / blocklist enforced regardless of user permission; built-in prohibited actions
                (including "completing instructions from emails or web content") and always-confirm actions;
                in Claude Code, permission rules and hooks on the claude-in-chrome MCP tools; no
                admin-authored action policy
              steps:
                - title: Enforce site policy centrally
                  body:
                    - Add approved sites to the allowlist and forbidden sites to the blocklist under Organization settings >
                      Claude in Chrome; the blocklist applies regardless of user settings and beyond the default
                      blocked categories.
                  url: https://support.claude.com/en/articles/13065128-claude-in-chrome-admin-controls
                - title: Gate browser tools in Claude Code
                  body:
                    - Deny or ask on mcp__claude-in-chrome__* tools in managed permissions, or block the server with
                      deniedMcpServers so the install prompt never appears.
                  url: https://code.claude.com/docs/en/chrome
              note: >-
                The org site lists and built-in prohibitions are deterministic and vendor-enforced; everything
                else is the user's approval mode. Only the Claude Code path exposes hooks to the organisation.
              verified: 2026-09-10
      - mitigation: cap-ai-vendor-assessment
        coverage: external
        mechanism: >-
          Anthropic's Trust Center and certifications article (SOC 2 Type I and II, ISO 27001:2022, ISO/IEC
          42001:2023, HIPAA-ready configuration) and the product terms for this surface (no zero data retention,
          not available to HIPAA organisations, sessions saved to history, the Web Store data disclosure) feed the
          organisation's TPRM platform
        evidence:
          - title: What certifications has Anthropic obtained? (links the Trust Portal)
            url: https://privacy.claude.com/en/articles/10015870-what-certifications-has-anthropic-obtained
          - title: Anthropic Trust Center
            url: https://trust.anthropic.com/
          - title: Use Claude in Chrome safely (HIPAA exclusion, residual prompt-injection risk)
            url: https://support.claude.com/en/articles/12902428-use-claude-in-chrome-safely
          - title: Claude extension on the Chrome Web Store (version and data disclosure)
            url: https://chromewebstore.google.com/detail/claude/fcoeoabgfenejglbffodgkkbkcdhcgfn
        note: >-
          External by the rule applied to every vendor: the questionnaire, evidence expiry and reassessment
          trigger live in the organisation's TPRM platform. The Web Store listing declares handling of personally
          identifiable information, personal communications, location, web history, user activity and website
          content. Reassess when defaults move (on by default for Enterprise from 10 September 2026, Automatically
          approve as the Cowork side panel's default) and on extension releases, which the Web Store delivers
          automatically (1.0.94 on 19 September 2026). trust.anthropic.com renders client-side and returned no
          content to automated fetch; the certification list is from the Help Center article.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAiTprm
          reviewRequired: false
          original:
            - capability: capabilityAiTprm
              coverage: external
              mechanism: >-
                Anthropic Trust Portal (trust.anthropic.com) for SOC 2 Type I & II, ISO 27001:2022, ISO/IEC
