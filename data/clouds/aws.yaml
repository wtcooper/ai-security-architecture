        EventBridge and SQS, checkpointing every step and suspending on callbacks for days when a step
        needs an operator. Every model and tool call leaves through AgentCore Gateway on a token minted
        for the calling agent, and Policy in AgentCore decides each one. AWS's guidance composes the
        same pattern from Step Functions and Lambda; the durable function keeps the graph in one
        process, which is what this drawing shows.
    bindings:
