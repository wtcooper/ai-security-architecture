        summary: "The MCP server becomes a function app on the Flex Consumption plan: each tool is an MCP tool trigger function, or an existing SDK-built server runs unchanged as a custom handler (preview). The same built-in MCP authorisation as App Service still serves the discovery document. The builder now carries a host storage account, the extension's system key and cold starts, and no longer sizes an App Service plan."
        bindings:
