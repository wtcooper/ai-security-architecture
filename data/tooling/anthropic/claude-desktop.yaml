            url: https://support.claude.com/en/articles/13930452-manage-custom-roles-on-enterprise-plans
        note: >-
          Partial by the rule applied to every vendor: administrators admit or remove whole extensions and
          servers, but a local server's tools cannot be scoped per tool or per argument on standard deployments,
          and an admitted extension acts with whatever the user's account can reach on the device. Per-tool
