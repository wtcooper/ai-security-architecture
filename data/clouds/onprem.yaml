  - architecture: archActionAgent
    asOf: "2026-11"
    verified: "2026-11-18"
    reference:
      - title: "AI gateway, for example LiteLLM Proxy: Production Best Practices"
        url: https://docs.litellm.ai/docs/proxy/prod
      - title: "Inference server, for example vLLM: Security"
        url: https://docs.vllm.ai/en/latest/usage/security/
      - title: "Durable workflow engine, for example Temporal: Platform security features"
        url: https://docs.temporal.io/self-hosted-guide/security
    summary:
      - "Your agent runs as a durable run on infrastructure you operate, started only by triggers from queues, webhooks or timers. Every model and tool call passes a self-hosted AI gateway that holds the agent's credential, its catalogue of reviewed actions, a policy check on each call and spend ceilings, and calls the models you serve or an approved external model API. Costly actions wait for an operator's approval, and generated code runs in a fresh sandbox per task. You carry everything a cloud provider would otherwise run; each box lists example products."
    bindings:
      - block: events
        service: "Event bus, webhooks and schedules"
        options:
          - { name: "Apache Kafka", kind: open, url: "https://kafka.apache.org/documentation/", note: "Durable event log with per-topic ACLs, so producers and consumers can be scoped." }
          - { name: "NATS JetStream", kind: open, url: "https://docs.nats.io/nats-concepts/jetstream", note: "Lighter broker; JetStream adds persistence and at-least-once delivery with replay." }
          - { name: "Argo Events", kind: open, url: "https://argoproj.github.io/argo-events/", note: "Turns webhooks, Kafka messages and calendars into Kubernetes or workflow starts." }
          - { name: "Red Hat Streams for Apache Kafka", kind: commercial, url: "https://developers.redhat.com/products/streams-for-apache-kafka", note: "Red Hat-supported Kafka on OpenShift, built on Strimzi operators.", packs: [redHatOpenShiftAi], watch: [{ text: "Strimzi-based Kafka supported on OpenShift.", url: "https://developers.redhat.com/products/streams-for-apache-kafka" }] }
          - { name: "Confluent Platform", kind: commercial, url: "https://docs.confluent.io/platform/current/overview.html", note: "Self-managed commercial Kafka distribution with vendor support." }
          - { name: "Kong Event Gateway (in front of Kafka)", kind: commercial, url: "https://developer.konghq.com/event-gateway/", note: "Kafka proxy with policies; data planes self-managed, control plane in Konnect or on-prem via Kong Operator.", packs: [kongAiGateway], watch: [{ text: "A Kafka proxy, not a broker; control plane in Konnect or on-prem via Kong Operator.", url: "https://developer.konghq.com/event-gateway/" }] }
          - { name: "Apache Kafka, Argo Events and Kubernetes CronJobs", kind: open, url: "https://argoproj.github.io/argo-events/eventsources/setup/kafka/", packs: [upstreamOpenSource], watch: [{ text: "One consumer turns a message, webhook or timer into a Workflow start and binds the run's identity there. NATS is the alternative to Kafka.", url: "https://argoproj.github.io/argo-events/" }] }
      - block: localTools
        service: "Tool handlers and a sandbox for generated code"
        options:
          - { name: "agent-sandbox with gVisor", kind: open, url: "https://agent-sandbox.sigs.k8s.io/", note: "Kubernetes SIG Apps controller (v1beta1 API) for per-task sandboxes and warm pools; gVisor intercepts system calls in user space." }
          - { name: "Kata Containers", kind: open, url: "https://katacontainers.io/", note: "RuntimeClass giving each sandbox pod its own lightweight VM and kernel; works under agent-sandbox or plain pods." }
          - { name: "Red Hat build of Agent Sandbox with OpenShift sandboxed containers", kind: commercial, url: "https://www.redhat.com/en/blog/whats-new-red-hat-openshift-confidential-computing-and-sandboxing", note: "Downstream agent-sandbox, Technology Preview (Aug 2026), with Kata VMs from sandboxed containers 1.13.", packs: [redHatOpenShiftAi], watch: [{ text: "Agent Sandbox is Technology Preview (Aug 2026); sandboxed containers 1.13 run each pod in its own Kata VM.", url: "https://www.redhat.com/en/blog/whats-new-red-hat-openshift-confidential-computing-and-sandboxing" }] }
          - { name: "NVIDIA OpenShell", kind: open, url: "https://docs.nvidia.com/openshell/about/overview", note: "Open-source agent runtime that wraps the sandbox in a declarative YAML policy; early 0.1.x releases." }
          - { name: "agent-sandbox with gVisor, or Kata Containers", kind: open, url: "https://agent-sandbox.sigs.k8s.io/", packs: [upstreamOpenSource], watch: [{ text: "In-process handlers stay in the agent's pod; generated code runs in a Sandbox pod of its own. Kata Containers is the alternative runtime.", url: "https://agent-sandbox.sigs.k8s.io/" }] }
      - block: planner
        service: "Your agent on a durable workflow engine"
        build: true
        note: "One durable run for each case (with Temporal, a Workflow, each action an Activity), so a failed run can execute the compensating actions in order."
        options:
          - { name: "Temporal (self-hosted)", kind: open, url: "https://docs.temporal.io/self-hosted-guide", note: "MIT-licensed server that journals each step as Event History and replays it after a crash; you run its database.", packs: [upstreamOpenSource], watch: [{ text: "Each action an Activity, so a failed run can run its compensations in order.", url: "https://docs.temporal.io/workflow-execution" }] }
          - { name: "DBOS Transact", kind: open, url: "https://github.com/dbos-inc/dbos-transact-py", note: "MIT library that makes workflows durable inside your own process, with state in PostgreSQL; no separate server." }
          - { name: "Dapr Workflow", kind: open, url: "https://docs.dapr.io/developing-applications/building-blocks/workflow/workflow-overview/", note: "Durable execution in the Dapr sidecar, persisting each completed step to a workflow-capable state store." }
          - { name: "Restate", kind: commercial, url: "https://raw.githubusercontent.com/restatedev/restate/main/LICENSE", note: "Durable execution runtime for agents and services; source-available under BSL 1.1, turning Apache-2.0 after four years." }
          - { name: "Camunda 8 Self-Managed", kind: commercial, url: "https://docs.camunda.io/docs/components/agentic-orchestration/ai-agents/", note: "BPMN orchestration with an AI Agent connector; production Self-Managed use needs a Camunda licence." }
      - block: stateRetrieval
        service: "Case state and retrieval index"
        options:
          - { name: "PostgreSQL with pgvector", kind: open, url: "https://github.com/pgvector/pgvector", note: "Rows and vectors in one database, so PostgreSQL row security also applies to vector queries." }
          - { name: "Valkey", kind: open, url: "https://valkey.io/", note: "BSD-licensed key/value store, compatible with Redis OSS, for sessions and short-lived task state." }
          - { name: "Milvus", kind: open, url: "https://milvus.io/docs/overview.md", note: "Apache-2.0 vector database under the LF AI & Data Foundation, for large indexes kept apart from row data." }
          - { name: "Redis Software", kind: commercial, url: "https://redis.io/docs/latest/operate/rs/", note: "Self-managed commercial Redis with vendor support, for session and cache state." }
          - { name: "EDB Postgres AI for CloudNativePG", kind: commercial, url: "https://www.enterprisedb.com/docs/postgres_for_kubernetes/latest/", note: "EDB's supported build of the CloudNativePG operator, for PostgreSQL and pgvector with a support contract." }
          - { name: "OGX vector stores (OpenShift AI)", kind: commercial, url: "https://www.redhat.com/en/blog/red-hat-ai-35-scaling-and-governing-ai-agents-production", note: "Built-in RAG through OGX is GA in Red Hat AI 3.5; the database behind it is one you run.", packs: [redHatOpenShiftAi], watch: [{ text: "Built-in RAG through OGX is GA in Red Hat AI 3.5; AutoRAG pgvector support is TP. The session cache is yours.", url: "https://www.redhat.com/en/blog/red-hat-ai-35-scaling-and-governing-ai-agents-production" }] }
          - { name: "PostgreSQL with pgvector; Valkey for case state", kind: open, url: "https://github.com/pgvector/pgvector", packs: [upstreamOpenSource], watch: [{ text: "Row security keyed on the case and customer, and a partition for each tenant in the index.", url: "https://github.com/pgvector/pgvector" }] }
      - block: gateway
        service: "Self-hosted AI gateway for models and tools"
        options:
          - { name: "LiteLLM Proxy", kind: open, url: "https://docs.litellm.ai/docs/simple_proxy", note: "Models, MCP servers and A2A agents behind one proxy with per-key and per-team grants; some features need its Enterprise licence.", packs: [upstreamOpenSource], watch: [{ text: "Models, MCP servers and search tools behind per-agent virtual keys.", url: "https://docs.litellm.ai/docs/simple_proxy" }, { text: "Needs its own PostgreSQL and Redis. Reading keys from Vault needs an Enterprise licence, so mount the master key and salt key from a Kubernetes Secret.", url: "https://docs.litellm.ai/docs/simple_proxy" }, { text: "Checking your identity provider's tokens itself (JWT auth) needs an Enterprise licence. In the open-source build the agent presents its own virtual key, so the gateway takes the user's identity on the agent's word: limit a call to the user with the token exchanged for each tool server.", url: "https://docs.litellm.ai/docs/proxy/token_auth" }] }
          - { name: "Kong Gateway Enterprise with AI Gateway", kind: commercial, url: "https://developer.konghq.com/plugins/ai-mcp-proxy/", note: "Plugins on Services and Routes: AI Proxy Advanced (lists vLLM), AI MCP Proxy with per-tool ACLs, AI A2A Proxy from 3.14.", packs: [kongAiGateway], watch: [{ text: "AI Gateway Enterprise; per-tool ACLs from 3.13; the MCP plugin does not apply AI Guardrails to MCP traffic.", url: "https://developer.konghq.com/plugins/ai-mcp-proxy/" }] }
          - { name: "Gravitee API Management (Agent Management)", kind: commercial, url: "https://documentation.gravitee.io/apim/4.10/agent-mesh", note: "LLM, MCP and A2A proxy API types on one gateway, fully self-hostable; Enterprise licence for the AI features.", packs: [graviteeAgentMesh], watch: [{ text: "Enterprise licence; routes to OpenAI, Gemini, Bedrock or any OpenAI-compatible endpoint you host.", url: "https://documentation.gravitee.io/apim/ai-agent-management/llm-proxy/proxy-your-llms" }] }
          - { name: "OpenShift AI Models-as-a-Service with the Connectivity Link MCP gateway", kind: commercial, url: "https://www.redhat.com/en/blog/model-context-protocol-gateway-red-hat-openshift-now-generally-available", note: "Kuadrant-based; MCP gateway GA in Connectivity Link 1.5 (Oct 2026), MaaS GA since OpenShift AI 3.4; MCP workflows in OpenShift AI 3.5 are TP; no A2A gateway.", packs: [redHatOpenShiftAi], watch: [{ text: "MaaS GA (showback TP). MCP gateway GA in Connectivity Link 1.5; OpenShift AI 3.5 MCP workflows through it are TP. No A2A or web-search gateway.", url: "https://www.redhat.com/en/blog/model-context-protocol-gateway-red-hat-openshift-now-generally-available" }] }
          - { name: "agentgateway", kind: open, url: "https://agentgateway.dev/", note: "Linux Foundation project donated by Solo.io: one data plane for LLM, MCP and A2A traffic with JWT, OIDC, ext_authz and tool scoping." }
          - { name: "Agent Router (formerly Envoy AI Gateway)", kind: open, url: "https://theagentrouter.ai/", note: "Envoy-based, now an Agentic AI Foundation project: LLM routing and one MCP tool catalogue; A2A is not listed." }
      - { block: internalTools, service: "Your action services, behind the gateway", build: true, note: "Each action validates its input and ships with a compensating action. Registered on the gateway and reachable from the gateway only." }
      - block: provider
        service: "Open-weight models you host, or a hosted model API"
        note: "Either open-weight models served on GPU servers you run, or a hosted model API under your agreement with its provider. The pattern reaches it through the gateway either way."
        options:
          - { name: "vLLM", kind: open, url: "https://docs.vllm.ai/en/latest/", note: "Open-source inference server with an OpenAI-compatible API.", packs: [upstreamOpenSource], watch: [{ text: "Called by LiteLLM as a hosted_vllm provider; KServe is the common alternative.", url: "https://docs.litellm.ai/docs/providers/vllm" }, { text: "Your own open-weights models, in the same data centre. Tool calling needs --enable-auto-tool-choice and a --tool-call-parser. KServe is the alternative.", url: "https://docs.vllm.ai/en/latest/" }, { text: "No authentication unless --api-key is set, and the key then covers only /v1, /v2, /inference and /cohere: /invocations, /tokenize and other paths answer without it, so only the gateway should reach it at the network.", url: "https://docs.vllm.ai/en/latest/usage/security/" }, { text: "Sends anonymous usage data to its maintainers unless VLLM_NO_USAGE_STATS=1 or DO_NOT_TRACK=1 is set on every serving pod; the self-hosted inference pattern lists the serving settings.", url: "https://docs.vllm.ai/en/latest/usage/usage_stats/" }] }
          - { name: "KServe", kind: open, url: "https://kserve.github.io/website/", note: "Kubernetes model serving through InferenceService resources, with vLLM and llm-d backends." }
          - { name: "llm-d", kind: open, url: "https://llm-d.ai/", note: "Distributed inference on Kubernetes (router plus vLLM); GA inside OpenShift AI 3.5." }
          - { name: "Red Hat AI Inference (vLLM)", kind: commercial, url: "https://www.redhat.com/en/products/ai/inference", note: "Red Hat's supported vLLM build, GA in OpenShift AI 3.5." }
          - { name: "NVIDIA NIM", kind: commercial, url: "https://docs.nvidia.com/nim/large-language-models/about-nim-llm/overview", note: "NVIDIA's prebuilt, optimised inference containers for LLMs on NVIDIA GPUs." }
          - { name: "SGLang", kind: open, url: "https://docs.sglang.io/", note: "Open-source high-throughput serving framework for language and multimodal models." }
          - { name: "A hosted model API, via the gateway", kind: commercial, url: "https://docs.litellm.ai/docs/providers", note: "A model provider's API, reached only from the gateway, which holds the key." }
          - { name: "Red Hat AI Inference (vLLM), with KServe or llm-d", kind: commercial, url: "https://access.redhat.com/articles/rhoai-supported-configs", note: "All three GA in OpenShift AI 3.5 per Red Hat's supported-configurations list.", packs: [redHatOpenShiftAi] }
      - { block: orgData, service: "Your systems of record", build: true, note: "Yours to run. Enforce who may read which row in the store itself, for example with PostgreSQL row security." }
      - block: openWeb
        service: "Web search through the outbound proxy"
        options:
          - { name: "SearXNG", kind: open, url: "https://docs.searxng.org/admin/settings/settings_outgoing.html", note: "Self-hosted metasearch; its outgoing settings can send every engine request through your proxy." }
          - { name: "A commercial search API via the gateway (for example Brave Search API)", kind: commercial, url: "https://docs.litellm.ai/docs/search/", note: "Gateways list many providers (LiteLLM lists 20, including Brave, Tavily and Exa); queries leave your network." }
          - { name: "Squid outbound proxy", kind: open, url: "https://www.squid-cache.org/Doc/config/access_log/", note: "The single exit for search and page fetches, with an access log for review." }
          - { name: "SearXNG through the Squid outbound proxy", kind: open, url: "https://docs.searxng.org/admin/settings/settings_outgoing.html", packs: [upstreamOpenSource], watch: [{ text: "SearXNG runs inside and is registered on LiteLLM as a tool; it and page fetches leave only through the proxy.", url: "https://docs.searxng.org/" }] }
      - { block: sources, service: "Public package registries", note: "Outside the organisation. Only the package mirror may reach them, through your egress control." }
      - block: registry
        service: "Internal package mirror"
        options:
          - { name: "Sonatype Nexus Repository", kind: commercial, url: "https://help.sonatype.com/en/ce-onboarding.html", note: "PyPI and npm proxies with routing rules; Community Edition is free but stops adding components past 40,000 or 100,000 requests a day.", packs: [upstreamOpenSource], watch: [{ text: "PyPI and npm proxy repositories; Pulp is the open-source alternative.", url: "https://help.sonatype.com/en/pypi-repositories.html" }, { text: "Proxy and hosted repositories for PyPI and npm. Community Edition has usage caps; Pulp is the alternative.", url: "https://help.sonatype.com/en/sonatype-nexus-repository.html" }, { text: "Routing rules allow or block by request path only and detect no malicious or look-alike package; Sonatype's separate, paid Repository Firewall quarantines those. Without it, a quarantine repository and your own check come before promotion.", url: "https://help.sonatype.com/en/routing-rules.html" }] }
          - { name: "JFrog Artifactory", kind: commercial, url: "https://docs.jfrog.com/artifactory/docs/remote-repositories", note: "Remote repositories cache npm, PyPI and others on demand; self-managed or SaaS; Curation can block risky packages." }
          - { name: "Pulp", kind: open, url: "https://pulpproject.org/", note: "Open-source content manager: npm pull-through cache, PyPI by syncing from a remote, containers and RPMs." }
          - { name: "GitLab package registry", kind: commercial, url: "https://docs.gitlab.com/user/packages/pypi_repository/", note: "Hosts your own packages; PyPI requests it lacks go to pypi.org by default; no npm or PyPI caching proxy.", packs: [gitlabUltimate] }
          - { name: "GitHub Packages on Enterprise Server", kind: commercial, url: "https://docs.github.com/en/enterprise-server@3.22/packages/learn-github-packages/introduction-to-github-packages", note: "Hosts npm, Maven, NuGet, RubyGems and container packages; no PyPI and no documented proxying of public registries." }
      - block: govIdentity
        service: "Identity provider and workload identity"
        options:
          - { name: "Keycloak", kind: open, url: "https://www.keycloak.org/securing-apps/token-exchange", note: "People and service clients in one realm, with token exchange for hand-offs.", packs: [upstreamOpenSource] }
          - { name: "Red Hat build of Keycloak", kind: commercial, url: "https://access.redhat.com/products/red-hat-build-keycloak/", note: "Supported Keycloak build from Red Hat.", packs: [redHatOpenShiftAi], watch: [{ text: "ZTWIM 1.1 GA July 2026; SPIRE in OpenShift Service Mesh 3.5 is GA in sidecar mode, not yet in ambient mode.", url: "https://www.redhat.com/en/blog/zero-trust-workload-identity-manager-11-generally-available-red-hat-openshift" }] }
          - { name: "Kubernetes ServiceAccount tokens", kind: open, url: "https://kubernetes.io/docs/concepts/security/service-accounts/", note: "Short-lived projected tokens give each workload an identity the IdP and vault can verify.", packs: [upstreamOpenSource] }
          - { name: "SPIFFE and SPIRE", kind: open, url: "https://spiffe.io/docs/latest/spire-about/", note: "Attested workload identities and trust-domain federation, an alternative to keys per client." }
          - { name: "Red Hat zero trust workload identity manager", kind: commercial, url: "https://www.redhat.com/en/blog/zero-trust-workload-identity-manager-11-generally-available-red-hat-openshift", note: "Red Hat's SPIRE operator, GA 1.1 (July 2026), with Vault and cert-manager as upstream authorities.", packs: [redHatOpenShiftAi] }
          - { name: "Gravitee Access Management", kind: commercial, url: "https://documentation.gravitee.io/am/4.11/guides/developer-contributions/using-oauth-2.0-token-exchange", note: "Gravitee's IdP and authorisation server, with delegated token exchange.", packs: [graviteeAgentMesh], watch: [{ text: "Token exchange with delegation (act claim) in AM 4.11; federates to your directory.", url: "https://documentation.gravitee.io/am/4.11/guides/developer-contributions/using-oauth-2.0-token-exchange" }] }
      - block: govSecrets
        service: "Secrets manager with a hardware root"
        options:
          - { name: "HashiCorp Vault", kind: commercial, url: "https://developer.hashicorp.com/vault/docs/deploy/kubernetes/vso", note: "Dynamic credentials, transit keys and the Vault Secrets Operator; HSM auto-unseal needs Vault Enterprise.", packs: [upstreamOpenSource] }
          - { name: "OpenBao", kind: open, url: "https://openbao.org/docs/configuration/seal/pkcs11/", note: "Open-source fork of Vault under the Linux Foundation's OpenSSF; documents a PKCS#11 HSM seal.", packs: [upstreamOpenSource] }
          - { name: "External Secrets Operator", kind: open, url: "https://external-secrets.io/latest/", note: "Syncs secrets from an external store into Kubernetes Secrets; pairs with any vault here." }
          - { name: "External Secrets Operator for Red Hat OpenShift", kind: commercial, url: "https://developers.redhat.com/articles/2025/11/11/introducing-external-secrets-operator-openshift", note: "Red Hat-supported ESO, GA for OpenShift 4.20+, syncing from Vault or CyberArk Conjur.", packs: [redHatOpenShiftAi], watch: [{ text: "GA for OpenShift 4.20+; it syncs from a vault you run, such as HashiCorp Vault or CyberArk Conjur.", url: "https://developers.redhat.com/articles/2025/11/11/introducing-external-secrets-operator-openshift" }] }
          - { name: "Idira Secrets Manager, self-hosted (Palo Alto Networks)", kind: commercial, url: "https://www.paloaltonetworks.com/idira/machine/secrets-management", note: "The former CyberArk line now under Palo Alto's Idira brand; SaaS or self-hosted for air-gapped sites." }
      - block: govPolicy
        service: "Network, admission and guardrail policy"
        options:
          - { name: "Kubernetes", kind: open, url: "https://kubernetes.io/docs/concepts/overview/", note: "The container platform each platform pack here runs on, upstream or as a distribution (OpenShift, VKS, Canonical Kubernetes).", packs: [upstreamOpenSource, redHatOpenShiftAi] }
          - { name: "LLM Guard", kind: open, url: "https://protectai.github.io/llm-guard/input_scanners/prompt_injection/", packs: [upstreamOpenSource] }
          - { name: "Cilium", kind: open, url: "https://docs.cilium.io/en/stable/security/policy/", packs: [upstreamOpenSource] }
      - block: govSupplyChain
        service: "Mirrors, scanners and signing in the pipeline"
        options:
          - { name: "promptfoo", kind: open, url: "https://www.promptfoo.dev/docs/intro/", note: "Open-source CLI and library for LLM evaluation and red teaming; agreed to be acquired by OpenAI (March 2026) and says it stays open source", packs: [upstreamOpenSource] }
          - { name: "Trivy", kind: open, url: "https://trivy.dev/docs/latest/guide/scanner/vulnerability/", packs: [upstreamOpenSource] }
      - block: govObservability
        service: "Logs, traces and SIEM off the agent's path"
        options:
          - { name: "OpenTelemetry Collector", kind: open, url: "https://opentelemetry.io/docs/collector/", note: "Vendor-neutral pipeline that receives gateway logs and traces and forwards them to stores the agent cannot write.", packs: [upstreamOpenSource] }
          - { name: "Grafana Loki", kind: open, url: "https://grafana.com/docs/loki/latest/", note: "Log store; turn retention on, or logs are kept for ever.", packs: [upstreamOpenSource] }
          - { name: "Langfuse (self-hosted)", kind: open, url: "https://langfuse.com/self-hosting", note: "Self-hosted LLM tracing and evaluation, with a documented LiteLLM integration.", packs: [upstreamOpenSource] }
          - { name: "MLflow Tracing", kind: open, url: "https://mlflow.org/docs/latest/genai/tracing/", note: "Agent and LLM tracing; GA in OpenShift AI 3.5, where the visual agent-trace view is Technology Preview.", packs: [redHatOpenShiftAi], watch: [{ text: "MLflow is GA in OpenShift AI 3.5; the visual agent-trace view is Technology Preview. The SIEM is yours.", url: "https://www.redhat.com/en/blog/red-hat-ai-35-scaling-and-governing-ai-agents-production" }] }
          - { name: "Elastic Security", kind: commercial, url: "https://www.elastic.co/docs/solutions/security", note: "SIEM and detection engine; one example of where detections on gateway, egress and audit logs run." }
    sources:
      internalTools: https://docs.litellm.ai/docs/mcp
      orgData: https://www.postgresql.org/docs/current/ddl-rowsecurity.html
      sources: https://pypi.org/
    differences:
      - at: gateway->provider
        text: "Where the organisation serves its own models (the self-hosted inference pattern), the model provider sits inside the data centre and prompts and completions do not leave it. Where it calls an external model API instead, the provider stays outside and the call leaves through the organisation's egress control."
        change: "Conditional on the organisation's choice, not on the platform: when models are self-hosted, move the provider box from the external zone into the Enterprise data centre boundary and link it to archSelfHostedInference, so gateway->provider no longer crosses the boundary; when an external model API is used, leave the drawing as it is."
    alsoNeeded:
      - service: "Identity provider and authorisation server, highly available"
        role: identity
        why: "The sign-in service and the OAuth authorization server for people, services and token exchange (for example Keycloak, with its own database). A cloud would have run it for you."
        url: https://www.keycloak.org/documentation
      - service: "Secrets manager with a protected root key"
        role: secrets
        why: "It holds the gateway's master key, database credentials and signing keys (for example HashiCorp Vault or OpenBao). Protect its root key so that no one person or file unseals it: an HSM seal (PKCS#11 auto-unseal needs Vault Enterprise; OpenBao has an open-source pkcs11 seal) or key shares held by several people."
        url: https://openbao.org/docs/configuration/seal/pkcs11/
      - service: "Certificate issuance and renewal from an internal authority"
        role: keys
        why: "Every service-to-service connection needs a certificate that is issued and renewed without a person, from a private authority you control (for example cert-manager with your internal CA)."
        url: https://cert-manager.io/docs/
      - service: "Network policy enforcement and egress control"
        role: network
        why: "A network plugin enforces the policies, and outbound traffic leaves only to approved destinations and is recorded (for example Cilium with a Squid forward proxy, or an egress gateway). Without both, every pod can reach every other pod and the internet."
        url: https://docs.cilium.io/en/stable/security/policy/
      - service: "Ingress that ends TLS and checks tokens, for webhooks and the operator console"
        role: ingress
        why: "Webhooks and the approval screen need a way in that terminates TLS and checks tokens (for example Envoy Gateway). Do not build on ingress-nginx: it was retired in March 2026 and gets no security fixes."
        url: https://gateway.envoyproxy.io/docs/
      - service: "Private container registry that scans and serves signed images"
        role: registry
        why: "The cluster pulls the agent, gateway, inference and sandbox images from a registry inside the data centre, scanned and signed, not from the internet (for example Harbor with Trivy and Cosign)."
        url: https://goharbor.io/docs/
      - service: "Log, trace and agent-trace stores the agent cannot write"
        role: logging
        why: "They receive the gateway's logs and traces and keep them where the agent cannot write (for example the OpenTelemetry Collector, Grafana Loki and self-hosted Langfuse). Loki keeps logs for ever unless retention is turned on."
        url: https://opentelemetry.io/docs/collector/
      - service: "Your SIEM, fed by the collector and the platform's audit logs"
        role: logging
        why: "Detections on blocked calls, denied egress and key use have to run somewhere. On Kubernetes the API server logs nothing until an audit policy file is set."
        url: https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
      - service: "The container platform's control plane on your own servers"
        role: other
        why: "You build and run the highly available control plane, its datastore and its certificates that a managed service would have provided (on Kubernetes, the API servers and etcd)."
        url: https://kubernetes.io/docs/setup/production-environment/
      - service: "GPU servers with their drivers, container toolkit and device plugin"
        role: other
        why: "Where you serve your own models, the hardware and its drivers, container toolkit and device plugin are yours to buy, install and keep working (for example with the NVIDIA GPU Operator). Capacity is what you own."
        url: https://docs.nvidia.com/datacenter/cloud-native/gpu-operator/latest/index.html
      - service: "Cluster and volume backup with tested restores"
        role: other
        why: "Cluster resources and the volumes behind the databases, the identity provider, the secrets manager and the logs need tested backups in a second location you run (for example Velero)."
        url: https://velero.io/docs/
      - service: "Patching and upgrades of the platform and every component"
        role: other
        why: "Nobody else patches the cluster, the nodes, the gateway, the inference servers or the identity provider for you. Plan regular upgrades and a way to roll them back."
        url: https://kubernetes.io/docs/tasks/administer-cluster/cluster-upgrade/
    quickstart:
      - title: "AI gateway, for example LiteLLM Proxy: Deploy with Helm"
        url: https://docs.litellm.ai/docs/proxy/deploy/helm
      - title: "Inference server, for example vLLM: Using Kubernetes"
        url: https://docs.vllm.ai/en/latest/deployment/k8s/
      - title: "Durable workflow engine, for example Temporal: Self-hosted Temporal Service guide"
        url: https://docs.temporal.io/self-hosted-guide
    # >>> hosting options (compared against the vendor's pages; one is the mapping itself)
    hosting:
      - id: kubernetes
        kind: cluster
        name: "Kubernetes"
        url: https://kubernetes.io/docs/concepts/overview/
        asOf: "2026-11"
        mapped: true
        compare:
          runs: "Your own code runs the loop in pods you deploy; Kubernetes schedules and restarts the pods and provides no application-level services."
          patching: "You do: you upgrade the control plane, drain and upgrade each node, and keep the node operating system and third-party plugins current."
          data: "Prompts, tool results and state stay in your pods and the stores you run on your own servers; Secrets sit unencrypted in etcd unless you configure encryption."
          network: "Pods accept and open all connections by default; NetworkPolicy isolates them only if your network plugin enforces it, and it cannot log or do anything TLS related."
          identity: "Each pod runs as a ServiceAccount, the namespace's default unless you set one, and gets a short-lived, rotating token mounted as a projected volume."
          accepts: "Any language or framework that runs in a container; the project says it does not limit the types of application supported."
          workload: "Deployments keep pods running, Jobs run to completion and CronJobs run on a schedule; durable waits need an engine you run yourself, such as Temporal."
          portability: "The agent is a container image plus Kubernetes manifests on a platform the project calls portable; your stores, plugins and policies move separately."
          effort: "You operate and are on call for the control plane, etcd backups, certificates, nodes, the network plugin, upgrades, logging, monitoring and every add-on."
          fits: "The project says any application that can run in a container should run on it, naming stateless, stateful and data-processing workloads."
        sources:
          - https://kubernetes.io/docs/concepts/overview/
          - https://kubernetes.io/docs/concepts/workloads/
          - https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/
          - https://kubernetes.io/docs/concepts/security/service-accounts/
          - https://kubernetes.io/docs/concepts/services-networking/network-policies/
          - https://kubernetes.io/docs/tasks/administer-cluster/cluster-upgrade/
          - https://kubernetes.io/docs/setup/production-environment/
          - https://kubernetes.io/docs/concepts/security/secrets-good-practices/
          - https://docs.temporal.io/workers
          - https://docs.temporal.io/workflow-execution
          - https://docs.temporal.io/production-deployment/worker-deployments
    # <<< hosting options
    settings:
      - keycloakClientScopes
      - kafkaAcls
      - temporalAuthorizer
      - litellmVirtualKeys
      - k8sServiceAccountTokens
      - litellmKeyRotation
      - temporalTerminateWorkflows
      - litellmMcpGateway
      - litellmMcpToolAllowlist
      - litellmMcpPinnedTools
      - litellmMcpPolicyGuardrail
      - temporalApprovalSignal
      - litellmGuardrailsInput
      - litellmBudgetsRateLimits
      - litellmAgentSessionLimits
      - litellmFallbacksRouting
      - promptfooEvalGate
      - postgresRowSecurity
      - valkeyAclPerService
      - ingestScanBeforeIndex
      - vaultDynamicSecrets
      - k8sNetworkPolicyDefaultDeny
      - ciliumFqdnEgress
      - egressProxyAllowlist
      - k8sRuntimeClassSandbox
      - agentSandboxShutdown
      - nexusProxyAllowlist
      - packageMalwareCheck
      - trivyScanPipeline
      - langfuseTracing
      - litellmLoggingCallbacks

  - architecture: archAgentWorkflow
    asOf: "2026-11"
    verified: "2026-11-18"
    reference:
      - title: "Durable workflow engine, for example Temporal: Self-hosted Temporal Service guide"
        url: https://docs.temporal.io/self-hosted-guide
      - title: "AI gateway, for example LiteLLM Proxy: Production Best Practices"
        url: https://docs.litellm.ai/docs/proxy/prod
      - title: "Container platform, for example Kubernetes: Production environment"
        url: https://kubernetes.io/docs/setup/production-environment/
    summary:
      - "Your agents run on infrastructure you operate. A durable workflow engine journals every step; a self-hosted AI gateway is the one door to models, tool services and web search; generated code runs in a fresh sandbox per task. Each agent has its own workload identity, client and gateway credential, and network rules and egress control close every other path. You carry what a cloud provider would otherwise run: hardware, the platform, identity, keys, patching and logs; each box lists example products."
    bindings:
      - block: events
        service: "Triggers that start workflow runs"
        options:
          - { name: "Argo Events", kind: open, url: "https://argoproj.github.io/argo-events/", note: "Turns webhooks, Kafka messages and calendars into Kubernetes or workflow starts." }
          - { name: "Apache Kafka", kind: open, url: "https://kafka.apache.org/documentation/", note: "Durable event log with per-topic ACLs, so producers and consumers can be scoped." }
          - { name: "Temporal Schedules", kind: open, url: "https://docs.temporal.io/schedule", note: "Schedules held by Temporal itself, starting workflows on a calendar or an interval." }
          - { name: "NATS JetStream", kind: open, url: "https://docs.nats.io/nats-concepts/jetstream", note: "Lighter broker; JetStream adds persistence and at-least-once delivery with replay." }
          - { name: "Red Hat Streams for Apache Kafka", kind: commercial, url: "https://developers.redhat.com/products/streams-for-apache-kafka", note: "Red Hat-supported Kafka on OpenShift, built on Strimzi operators.", packs: [redHatOpenShiftAi] }
          - { name: "Knative Eventing (OpenShift Serverless)", kind: open, url: "https://knative.dev/docs/eventing/", note: "Brokers and triggers route events from sources to services; OpenShift Serverless is Red Hat's build." }
          - { name: "Argo Events, Kafka and Temporal Schedules", kind: open, url: "https://docs.temporal.io/schedule", packs: [upstreamOpenSource], watch: [{ text: "Each trigger starts a Workflow as its own Keycloak client, with write on one Temporal namespace only.", url: "https://argoproj.github.io/argo-events/" }] }
      - block: harness
        service: "Agent workers on your container platform"
        build: true
        note: "One worker deployment; each agent has its own workload identity, identity-provider client and gateway credential."
        options:
          - { name: "Kubernetes Deployment", kind: open, url: "https://kubernetes.io/docs/setup/production-environment/", note: "Your agent as an ordinary workload on a cluster you run; any framework.", packs: [upstreamOpenSource] }
          - { name: "OGX on Red Hat OpenShift AI", kind: commercial, url: "https://access.redhat.com/articles/rhoai-supported-configs", note: "Server-side agent loop behind the Responses API; GA in OpenShift AI 3.5 but supported only through 3.5 Full Support." }
          - { name: "kagent", kind: open, url: "https://kagent.dev/", note: "CNCF Sandbox project to deploy and govern agents on Kubernetes, reached over A2A or MCP, with gVisor sandboxes." }
          - { name: "Your agents on OpenShift", kind: commercial, url: "https://developers.redhat.com/articles/2026/07/20/architect-open-blueprint-cloud-native-ai-agents", note: "Red Hat's blueprint leaves the harness to your framework and workflow state to a durable store you choose.", packs: [redHatOpenShiftAi] }
      - block: localTools
        service: "Tool handlers and a sandbox for generated code"
        build: true
        note: "Handlers run in the worker. Code an agent wrote runs only in a sandbox of its own (for example an agent-sandbox pod with a gVisor or Kata RuntimeClass)."
        options:
          - { name: "agent-sandbox with gVisor", kind: open, url: "https://agent-sandbox.sigs.k8s.io/", note: "Kubernetes SIG Apps controller (v1beta1 API) for per-task sandboxes and warm pools; gVisor intercepts system calls in user space." }
          - { name: "Kata Containers", kind: open, url: "https://katacontainers.io/", note: "RuntimeClass giving each sandbox pod its own lightweight VM and kernel; works under agent-sandbox or plain pods." }
          - { name: "Red Hat build of Agent Sandbox with OpenShift sandboxed containers", kind: commercial, url: "https://www.redhat.com/en/blog/whats-new-red-hat-openshift-confidential-computing-and-sandboxing", note: "Downstream agent-sandbox, Technology Preview (Aug 2026), with Kata VMs from sandboxed containers 1.13.", packs: [redHatOpenShiftAi], watch: [{ text: "Agent Sandbox is Technology Preview (Aug 2026); sandboxed containers 1.13 run each pod in its own Kata VM.", url: "https://www.redhat.com/en/blog/whats-new-red-hat-openshift-confidential-computing-and-sandboxing" }] }
          - { name: "NVIDIA OpenShell", kind: open, url: "https://docs.nvidia.com/openshell/about/overview", note: "Open-source agent runtime that wraps the sandbox in a declarative YAML policy; early 0.1.x releases." }
          - { name: "agent-sandbox with gVisor, or Kata Containers", kind: open, url: "https://agent-sandbox.sigs.k8s.io/", packs: [upstreamOpenSource] }
      - block: orchestration
        service: "Your supervisor on a durable workflow engine"
        build: true
        note: "The durable workflow engine you run (for example a self-hosted Temporal Service) journals and replays each step; the supervisor logic is your code."
        options:
          - { name: "Temporal (self-hosted)", kind: open, url: "https://docs.temporal.io/self-hosted-guide", note: "MIT-licensed server that journals each step as Event History and replays it after a crash; you run its database.", packs: [upstreamOpenSource] }
          - { name: "DBOS Transact", kind: open, url: "https://github.com/dbos-inc/dbos-transact-py", note: "MIT library that makes workflows durable inside your own process, with state in PostgreSQL; no separate server." }
          - { name: "Dapr Workflow", kind: open, url: "https://docs.dapr.io/developing-applications/building-blocks/workflow/workflow-overview/", note: "Durable execution in the Dapr sidecar, persisting each completed step to a workflow-capable state store." }
          - { name: "Restate", kind: commercial, url: "https://raw.githubusercontent.com/restatedev/restate/main/LICENSE", note: "Durable execution runtime for agents and services; source-available under BSL 1.1, turning Apache-2.0 after four years." }
          - { name: "Camunda 8 Self-Managed", kind: commercial, url: "https://docs.camunda.io/docs/components/agentic-orchestration/ai-agents/", note: "BPMN orchestration with an AI Agent connector; production Self-Managed use needs a Camunda licence." }
      - { block: subagents, service: "Your specialist agents as child workflows", build: true, note: "Each specialist calls the gateway with its own credential and a token exchanged for the task, never the supervisor's." }
      - block: state
        service: "Workflow journal, shared memory and index"
        options:
          - { name: "Temporal persistence (Event History)", kind: open, url: "https://docs.temporal.io/workflow-execution", note: "The workflow journal itself, replayed on recovery; stored in the database you run for Temporal." }
          - { name: "PostgreSQL with pgvector", kind: open, url: "https://github.com/pgvector/pgvector", note: "Rows and vectors in one database, so PostgreSQL row security also applies to vector queries." }
          - { name: "Valkey", kind: open, url: "https://valkey.io/", note: "BSD-licensed key/value store, compatible with Redis OSS, for sessions and short-lived task state." }
          - { name: "DBOS on PostgreSQL", kind: open, url: "https://docs.dbos.dev/", note: "Workflow state checkpointed into PostgreSQL by a library, beside your own tables." }
          - { name: "Milvus", kind: open, url: "https://milvus.io/docs/overview.md", note: "Apache-2.0 vector database under the LF AI & Data Foundation, for large indexes kept apart from row data." }
          - { name: "Redis Software", kind: commercial, url: "https://redis.io/docs/latest/operate/rs/", note: "Self-managed commercial Redis with vendor support, for session and cache state." }
          - { name: "Temporal Event History, PostgreSQL with pgvector, Valkey", kind: open, url: "https://docs.temporal.io/self-hosted-guide", packs: [upstreamOpenSource], watch: [{ text: "Event History is the journal; pgvector tables hold the index and shared memory under row security; Valkey holds session state.", url: "https://github.com/pgvector/pgvector" }] }
          - { name: "OGX vector stores over a database you run", kind: commercial, url: "https://www.redhat.com/en/blog/red-hat-ai-35-scaling-and-governing-ai-agents-production", note: "Built-in RAG through OGX is GA in Red Hat AI 3.5; AutoRAG pgvector support is TP. The session cache is yours.", packs: [redHatOpenShiftAi] }
      - block: gateway
        service: "Self-hosted AI gateway for models, MCP and search"
        options:
          - { name: "LiteLLM Proxy", kind: open, url: "https://docs.litellm.ai/docs/simple_proxy", note: "Models, MCP servers and A2A agents behind one proxy with per-key and per-team grants; some features need its Enterprise licence.", packs: [upstreamOpenSource], watch: [{ text: "Models, MCP servers and search tools behind per-agent virtual keys.", url: "https://docs.litellm.ai/docs/simple_proxy" }, { text: "Models, MCP servers and search tools behind virtual keys. It is the one door only if network policy allows nothing else.", url: "https://docs.litellm.ai/docs/proxy/deploy" }, { text: "Short-lived tokens checked at the gateway (JWT auth) need an Enterprise licence. In the open-source build each agent holds a virtual key, a bearer secret, whose short life comes from key duration and rotation, and from identity-provider tokens on the tool side.", url: "https://docs.litellm.ai/docs/proxy/token_auth" }, { text: "Its MCP gateway has no server-side approval step per tool call, so the approval pause is held in your workflow.", url: "https://docs.litellm.ai/docs/proxy/security_owasp_llm_top10" }] }
          - { name: "Kong Gateway Enterprise with AI Gateway", kind: commercial, url: "https://developer.konghq.com/plugins/ai-mcp-proxy/", note: "Plugins on Services and Routes: AI Proxy Advanced (lists vLLM), AI MCP Proxy with per-tool ACLs, AI A2A Proxy from 3.14.", packs: [kongAiGateway], watch: [{ text: "AI Gateway Enterprise; per-tool ACLs from 3.13; the MCP plugin does not apply AI Guardrails to MCP traffic.", url: "https://developer.konghq.com/plugins/ai-mcp-proxy/" }] }
          - { name: "Gravitee API Management (Agent Management)", kind: commercial, url: "https://documentation.gravitee.io/apim/4.10/agent-mesh", note: "LLM, MCP and A2A proxy API types on one gateway, fully self-hostable; Enterprise licence for the AI features.", packs: [graviteeAgentMesh], watch: [{ text: "Enterprise licence; routes to OpenAI, Gemini, Bedrock or any OpenAI-compatible endpoint you host.", url: "https://documentation.gravitee.io/apim/ai-agent-management/llm-proxy/proxy-your-llms" }] }
          - { name: "OpenShift AI Models-as-a-Service with the Connectivity Link MCP gateway", kind: commercial, url: "https://www.redhat.com/en/blog/model-context-protocol-gateway-red-hat-openshift-now-generally-available", note: "Kuadrant-based; MCP gateway GA in Connectivity Link 1.5 (Oct 2026), MaaS GA since OpenShift AI 3.4; MCP workflows in OpenShift AI 3.5 are TP; no A2A gateway.", packs: [redHatOpenShiftAi], watch: [{ text: "MaaS GA (showback TP). MCP gateway GA in Connectivity Link 1.5; OpenShift AI 3.5 MCP workflows through it are TP. No A2A or web-search gateway.", url: "https://www.redhat.com/en/blog/model-context-protocol-gateway-red-hat-openshift-now-generally-available" }] }
          - { name: "agentgateway", kind: open, url: "https://agentgateway.dev/", note: "Linux Foundation project donated by Solo.io: one data plane for LLM, MCP and A2A traffic with JWT, OIDC, ext_authz and tool scoping." }
          - { name: "Agent Router (formerly Envoy AI Gateway)", kind: open, url: "https://theagentrouter.ai/", note: "Envoy-based, now an Agentic AI Foundation project: LLM routing and one MCP tool catalogue; A2A is not listed." }
      - block: provider
        service: "Open-weight models you host, or a hosted model API"
        note: "Either open-weight models served on GPU servers you run, or a hosted model API under your agreement with its provider. The pattern reaches it through the gateway either way."
        options:
          - { name: "vLLM", kind: open, url: "https://docs.vllm.ai/en/latest/", note: "Open-source inference server with an OpenAI-compatible API.", packs: [upstreamOpenSource], watch: [{ text: "Called by LiteLLM as a hosted_vllm provider; KServe is the common alternative.", url: "https://docs.litellm.ai/docs/providers/vllm" }, { text: "Your own open-weights models in the same data centre, called by LiteLLM as hosted_vllm/. KServe is the alternative.", url: "https://docs.vllm.ai/en/latest/" }, { text: "--api-key protects only /v1, /v2, /inference and /cohere; other endpoints such as /invocations and /classify answer without it. Treat the key as one layer and limit at the network who reaches the server.", url: "https://docs.vllm.ai/en/latest/usage/security/" }] }
          - { name: "KServe", kind: open, url: "https://kserve.github.io/website/", note: "Kubernetes model serving through InferenceService resources, with vLLM and llm-d backends." }
          - { name: "llm-d", kind: open, url: "https://llm-d.ai/", note: "Distributed inference on Kubernetes (router plus vLLM); GA inside OpenShift AI 3.5." }
          - { name: "Red Hat AI Inference (vLLM)", kind: commercial, url: "https://www.redhat.com/en/products/ai/inference", note: "Red Hat's supported vLLM build, GA in OpenShift AI 3.5." }
          - { name: "NVIDIA NIM", kind: commercial, url: "https://docs.nvidia.com/nim/large-language-models/about-nim-llm/overview", note: "NVIDIA's prebuilt, optimised inference containers for LLMs on NVIDIA GPUs." }
          - { name: "SGLang", kind: open, url: "https://docs.sglang.io/", note: "Open-source high-throughput serving framework for language and multimodal models." }
          - { name: "A hosted model API, via the gateway", kind: commercial, url: "https://docs.litellm.ai/docs/providers", note: "A model provider's API, reached only from the gateway, which holds the key." }
          - { name: "Red Hat AI Inference (vLLM), with KServe or llm-d", kind: commercial, url: "https://access.redhat.com/articles/rhoai-supported-configs", note: "All three GA in OpenShift AI 3.5 per Red Hat's supported-configurations list.", packs: [redHatOpenShiftAi] }
      - { block: internalTools, service: "Your MCP tool servers, behind the gateway", build: true, note: "Registered on the gateway; ingress allowed from the gateway only; they accept an exchanged token for their own audience." }
      - { block: orgData, service: "Your systems of record", build: true, note: "Reached by tool services with the exchanged token or short-lived database credentials from the vault." }
      - block: openWeb
        service: "Web search through the outbound proxy"
        options:
          - { name: "SearXNG", kind: open, url: "https://docs.searxng.org/admin/settings/settings_outgoing.html", note: "Self-hosted metasearch; its outgoing settings can send every engine request through your proxy.", packs: [upstreamOpenSource], watch: [{ text: "LiteLLM search_tools with search_provider: searxng; SearXNG reaches search engines through the outbound proxy only.", url: "https://docs.searxng.org/" }] }
          - { name: "A commercial search API via the gateway (for example Brave Search API)", kind: commercial, url: "https://docs.litellm.ai/docs/search/", note: "Gateways list many providers (LiteLLM lists 20, including Brave, Tavily and Exa); queries leave your network." }
          - { name: "Squid outbound proxy", kind: open, url: "https://www.squid-cache.org/Doc/config/access_log/", note: "The single exit for search and page fetches, with an access log for review." }
      - { block: sources, service: "Public package registries", note: "Reached only by the package mirror, through your egress control." }
      - block: registry
        service: "Internal package mirror"
        options:
          - { name: "Sonatype Nexus Repository", kind: commercial, url: "https://help.sonatype.com/en/ce-onboarding.html", note: "PyPI and npm proxies with routing rules; Community Edition is free but stops adding components past 40,000 or 100,000 requests a day.", packs: [upstreamOpenSource], watch: [{ text: "PyPI and npm proxy repositories; Pulp is the open-source alternative.", url: "https://help.sonatype.com/en/pypi-repositories.html" }, { text: "PyPI and npm proxy repositories with routing rules. Community Edition has usage caps; Pulp is the alternative.", url: "https://help.sonatype.com/en/ce-onboarding.html" }, { text: "Community Edition has routing rules but not the malware quarantine of Repository Firewall, which needs a paid licence, and stops adding components above 40,000 components or 100,000 requests a day; with it, screening for malicious and look-alike packages is your own pipeline step.", url: "https://help.sonatype.com/en/nexus-repository-feature-matrix.html" }] }
          - { name: "JFrog Artifactory", kind: commercial, url: "https://docs.jfrog.com/artifactory/docs/remote-repositories", note: "Remote repositories cache npm, PyPI and others on demand; self-managed or SaaS; Curation can block risky packages." }
          - { name: "Pulp", kind: open, url: "https://pulpproject.org/", note: "Open-source content manager: npm pull-through cache, PyPI by syncing from a remote, containers and RPMs." }
          - { name: "GitLab package registry", kind: commercial, url: "https://docs.gitlab.com/user/packages/pypi_repository/", note: "Hosts your own packages; PyPI requests it lacks go to pypi.org by default; no npm or PyPI caching proxy.", packs: [gitlabUltimate] }
          - { name: "GitHub Packages on Enterprise Server", kind: commercial, url: "https://docs.github.com/en/enterprise-server@3.22/packages/learn-github-packages/introduction-to-github-packages", note: "Hosts npm, Maven, NuGet, RubyGems and container packages; no PyPI and no documented proxying of public registries." }
      - block: govIdentity
        service: "Identity provider and workload identity"
        options:
          - { name: "Keycloak", kind: open, url: "https://www.keycloak.org/securing-apps/token-exchange", note: "People and service clients in one realm, with token exchange for hand-offs.", packs: [upstreamOpenSource] }
          - { name: "Red Hat build of Keycloak", kind: commercial, url: "https://access.redhat.com/products/red-hat-build-keycloak/", note: "Supported Keycloak build from Red Hat.", packs: [redHatOpenShiftAi], watch: [{ text: "ZTWIM 1.1 GA July 2026; SPIRE in OpenShift Service Mesh 3.5 is GA in sidecar mode, not yet in ambient mode.", url: "https://www.redhat.com/en/blog/zero-trust-workload-identity-manager-11-generally-available-red-hat-openshift" }] }
          - { name: "Kubernetes ServiceAccount tokens", kind: open, url: "https://kubernetes.io/docs/concepts/security/service-accounts/", note: "Short-lived projected tokens give each workload an identity the IdP and vault can verify.", packs: [upstreamOpenSource] }
          - { name: "SPIFFE and SPIRE", kind: open, url: "https://spiffe.io/docs/latest/spire-about/", note: "Attested workload identities and trust-domain federation, an alternative to keys per client." }
          - { name: "Red Hat zero trust workload identity manager", kind: commercial, url: "https://www.redhat.com/en/blog/zero-trust-workload-identity-manager-11-generally-available-red-hat-openshift", note: "Red Hat's SPIRE operator, GA 1.1 (July 2026), with Vault and cert-manager as upstream authorities.", packs: [redHatOpenShiftAi] }
          - { name: "Gravitee Access Management", kind: commercial, url: "https://documentation.gravitee.io/am/4.11/guides/developer-contributions/using-oauth-2.0-token-exchange", note: "Gravitee's IdP and authorisation server, with delegated token exchange.", packs: [graviteeAgentMesh], watch: [{ text: "Token exchange with delegation (act claim) in AM 4.11; federates to your directory.", url: "https://documentation.gravitee.io/am/4.11/guides/developer-contributions/using-oauth-2.0-token-exchange" }] }
      - block: govSecrets
        service: "Secrets manager with a hardware root"
        options:
          - { name: "HashiCorp Vault", kind: commercial, url: "https://developer.hashicorp.com/vault/docs/deploy/kubernetes/vso", note: "Dynamic credentials, transit keys and the Vault Secrets Operator; HSM auto-unseal needs Vault Enterprise.", packs: [upstreamOpenSource] }
          - { name: "OpenBao", kind: open, url: "https://openbao.org/docs/configuration/seal/pkcs11/", note: "Open-source fork of Vault under the Linux Foundation's OpenSSF; documents a PKCS#11 HSM seal.", packs: [upstreamOpenSource] }
          - { name: "External Secrets Operator", kind: open, url: "https://external-secrets.io/latest/", note: "Syncs secrets from an external store into Kubernetes Secrets; pairs with any vault here." }
          - { name: "External Secrets Operator for Red Hat OpenShift", kind: commercial, url: "https://developers.redhat.com/articles/2025/11/11/introducing-external-secrets-operator-openshift", note: "Red Hat-supported ESO, GA for OpenShift 4.20+, syncing from Vault or CyberArk Conjur.", packs: [redHatOpenShiftAi], watch: [{ text: "GA for OpenShift 4.20+; it syncs from a vault you run, such as HashiCorp Vault or CyberArk Conjur.", url: "https://developers.redhat.com/articles/2025/11/11/introducing-external-secrets-operator-openshift" }] }
          - { name: "Idira Secrets Manager, self-hosted (Palo Alto Networks)", kind: commercial, url: "https://www.paloaltonetworks.com/idira/machine/secrets-management", note: "The former CyberArk line now under Palo Alto's Idira brand; SaaS or self-hosted for air-gapped sites." }
      - block: govPolicy
        service: "Network, admission and guardrail policy"
        options:
          - { name: "Kubernetes", kind: open, url: "https://kubernetes.io/docs/concepts/overview/", note: "The container platform each platform pack here runs on, upstream or as a distribution (OpenShift, VKS, Canonical Kubernetes).", packs: [upstreamOpenSource, redHatOpenShiftAi] }
          - { name: "Cilium", kind: open, url: "https://docs.cilium.io/en/stable/security/policy/", packs: [upstreamOpenSource] }
          - { name: "Squid outbound proxy", kind: open, url: "https://www.squid-cache.org/Doc/config/access_log/", note: "The single exit for search and page fetches, with an access log for review.", packs: [upstreamOpenSource] }
      - block: govSupplyChain
        service: "Mirrors, scanners and signing in the pipeline"
        options:
          - { name: "Trivy", kind: open, url: "https://trivy.dev/docs/latest/guide/scanner/vulnerability/", packs: [upstreamOpenSource] }
          - { name: "promptfoo", kind: open, url: "https://www.promptfoo.dev/docs/intro/", note: "Open-source CLI and library for LLM evaluation and red teaming; agreed to be acquired by OpenAI (March 2026) and says it stays open source", packs: [upstreamOpenSource] }
      - block: govObservability
        service: "Logs, traces and SIEM off the agent's path"
        options:
          - { name: "OpenTelemetry Collector", kind: open, url: "https://opentelemetry.io/docs/collector/", note: "Vendor-neutral pipeline that receives gateway logs and traces and forwards them to stores the agent cannot write.", packs: [upstreamOpenSource] }
          - { name: "Grafana Loki", kind: open, url: "https://grafana.com/docs/loki/latest/", note: "Log store; turn retention on, or logs are kept for ever.", packs: [upstreamOpenSource] }
          - { name: "Langfuse (self-hosted)", kind: open, url: "https://langfuse.com/self-hosting", note: "Self-hosted LLM tracing and evaluation, with a documented LiteLLM integration.", packs: [upstreamOpenSource] }
          - { name: "MLflow Tracing", kind: open, url: "https://mlflow.org/docs/latest/genai/tracing/", note: "Agent and LLM tracing; GA in OpenShift AI 3.5, where the visual agent-trace view is Technology Preview.", packs: [redHatOpenShiftAi], watch: [{ text: "MLflow is GA in OpenShift AI 3.5; the visual agent-trace view is Technology Preview. The SIEM is yours.", url: "https://www.redhat.com/en/blog/red-hat-ai-35-scaling-and-governing-ai-agents-production" }] }
          - { name: "Elastic Security", kind: commercial, url: "https://www.elastic.co/docs/solutions/security", note: "SIEM and detection engine; one example of where detections on gateway, egress and audit logs run." }
    sources:
      subagents: https://docs.temporal.io/develop/python/workflows/message-passing
      internalTools: https://docs.litellm.ai/docs/mcp
      orgData: https://developer.hashicorp.com/vault/docs/secrets/databases
      sources: https://pypi.org/
    differences:
      - at: gateway->provider
        text: "Where you serve your own models (the self-hosted inference pattern), the provider sits inside the data centre: prompts and completions stay in, and you carry capacity, patching and the weights, with the hop only as trusted as the server's key and network rules. Where you call an external model API, the provider stays outside and the call leaves through your egress control."
        change: "Conditional on the organisation's choice, not on the platform: when models are self-hosted, move the provider box from the external zone into the Enterprise data centre boundary and link it to archSelfHostedInference, so gateway->provider no longer crosses the boundary; when an external model API is used, leave the drawing as it is."
    alsoNeeded:
      - service: "The container platform's control plane on your own servers"
        role: other
        why: "No provider runs the platform: highly available control plane nodes, backups of its datastore (etcd on Kubernetes), upgrades and node patching are yours."
        url: https://kubernetes.io/docs/setup/production-environment/
      - service: "GPU servers with their drivers, container toolkit and device plugin"
        role: other
        why: "Where you serve your own models: drivers, the container toolkit and the device plugin on every GPU node (for example with the NVIDIA GPU Operator), plus capacity planning for the models the agents call many times per run."
        url: https://docs.nvidia.com/datacenter/cloud-native/gpu-operator/latest/index.html
      - service: "Identity provider and token exchange"
        role: identity
        why: "Issues the agents' and operators' tokens and performs token exchange (for example Keycloak). It is not a box on this drawing but every credential hand-out depends on it."
        url: https://www.keycloak.org/
      - service: "Secrets manager and delivery to workloads"
        role: secrets
        why: "Holds the gateway's root keys, the journal's encryption key and dynamic database credentials (for example HashiCorp Vault or OpenBao), delivered to workloads by an operator such as the Vault Secrets Operator or External Secrets Operator. LiteLLM's own Vault integration, if you use LiteLLM, is Enterprise only."
        url: https://developer.hashicorp.com/vault/docs/deploy/kubernetes/vso
      - service: "A protected root key for the secrets manager"
        role: keys
        why: "The root of every key above, protected so that no one person or file unseals it: a hardware security module (OpenBao documents a PKCS#11 seal; in Vault it needs Enterprise) or key shares held by several people in a recorded ceremony."
        url: https://openbao.org/docs/configuration/seal/pkcs11/
      - service: "Certificate issuance and renewal from an internal authority"
        role: keys
        why: "TLS between agents, the gateway, the workflow engine, the identity provider and the databases, and client certificates for the engine's mTLS, issued and renewed without a public authority (for example cert-manager with your internal CA)."
        url: https://cert-manager.io/docs/
      - service: "Network policy enforcement and egress control"
        role: network
        why: "The network policy engine and the controlled exit that the egress settings rely on (for example Cilium with a Squid forward proxy, or an egress gateway)."
        url: https://docs.cilium.io/en/stable/security/dns/
      - service: "Ingress with sign-in for operator-facing endpoints"
        role: ingress
        why: "The approval service, the workflow engine's web UI and the gateway's admin UI need an ingress with OIDC sign-in at your identity provider (for example Envoy Gateway)."
        url: https://gateway.envoyproxy.io/docs/tasks/security/oidc/
      - service: "Private container registry"
        role: registry
        why: "The private registry for agent, tool and sandbox images; the cluster pulls from nowhere else (for example Harbor)."
        url: https://goharbor.io/docs/2.16.0/
      - service: "Database operations and backups"
        role: other
        why: "Workflow history, the gateway's keys and budgets, the identity provider and agent memory all live in databases you run (for example PostgreSQL under CloudNativePG, with Velero for cluster backups); replication, backup and restore tests are yours."
        url: https://cloudnative-pg.io/
      - service: "Log and trace collection and your SIEM"
        role: logging
        why: "Collects gateway, workflow engine, platform audit and proxy logs and forwards them to the SIEM where detections run (for example the OpenTelemetry Collector and Grafana Loki)."
        url: https://opentelemetry.io/docs/collector/configuration/
      - service: "Time synchronisation on every node"
        role: other
        why: "Token expiry, workflow timers and the order of trace events all depend on clocks that agree (for example chrony)."
        url: https://chrony-project.org/documentation.html
    quickstart:
      - title: "Durable workflow engine, for example Temporal: Deploying a Temporal Service"
        url: https://docs.temporal.io/self-hosted-guide/deployment
      - title: "AI gateway, for example LiteLLM Proxy: Deploy with Helm"
        url: https://docs.litellm.ai/docs/proxy/deploy/helm
      - title: "Inference server, for example vLLM: Using Kubernetes"
        url: https://docs.vllm.ai/en/latest/deployment/k8s/
    # >>> hosting options (compared against the vendor's pages; one is the mapping itself)
    hosting:
      - id: kubernetes
        kind: cluster
        name: "Kubernetes"
        url: https://kubernetes.io/docs/concepts/overview/
        asOf: "2026-11"
        mapped: true
        compare:
          runs: "Your own code runs the loop in pods you deploy; Kubernetes schedules and restarts the pods and provides no application-level services."
          patching: "You do: you upgrade the control plane, drain and upgrade each node, and keep the node operating system and third-party plugins current."
          data: "Prompts, tool results and state stay in your pods and the stores you run on your own servers; Secrets sit unencrypted in etcd unless you configure encryption."
          network: "Pods accept and open all connections by default; NetworkPolicy isolates them only if your network plugin enforces it, and it cannot log or do anything TLS related."
          identity: "Each pod runs as a ServiceAccount, the namespace's default unless you set one, and gets a short-lived, rotating token mounted as a projected volume."
          accepts: "Any language or framework that runs in a container; the project says it does not limit the types of application supported."
          workload: "Deployments keep pods running, Jobs run to completion and CronJobs run on a schedule; durable waits need an engine you run yourself, such as Temporal."
          portability: "The agent is a container image plus Kubernetes manifests on a platform the project calls portable; your stores, plugins and policies move separately."
          effort: "You operate and are on call for the control plane, etcd backups, certificates, nodes, the network plugin, upgrades, logging, monitoring and every add-on."
          fits: "The project says any application that can run in a container should run on it, naming stateless, stateful and data-processing workloads."
        sources:
          - https://kubernetes.io/docs/concepts/overview/
          - https://kubernetes.io/docs/concepts/workloads/
          - https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/
          - https://kubernetes.io/docs/concepts/security/service-accounts/
          - https://kubernetes.io/docs/concepts/services-networking/network-policies/
          - https://kubernetes.io/docs/tasks/administer-cluster/cluster-upgrade/
          - https://kubernetes.io/docs/setup/production-environment/
          - https://kubernetes.io/docs/concepts/security/secrets-good-practices/
          - https://docs.temporal.io/workers
          - https://docs.temporal.io/workflow-execution
          - https://docs.temporal.io/production-deployment/worker-deployments
