            why: "Journals steps, retries them and waits for approvals, which the durable execution engine in Lambda did."
            url: https://docs.aws.amazon.com/step-functions/latest/dg/concepts-activities.html
          - service: "EKS Pod Identity Agent (EKS add-on; built into EKS Auto Mode)"
            role: identity
            why: "Serves the pod its role credentials, which Lambda supplied from the function's execution role."
