          - title: Enterprise configuration for Claude Desktop
            url: >-
              https://support.claude.com/en/articles/12622667-enterprise-configuration-for-claude-desktop
        note: >-
          None: Anthropic describes desktop extensions as giving "direct filesystem access", control of desktop
          applications and access to systems behind the firewall with the user's own authenticated context, and
          local plugin MCP servers run natively on the device. The organisation's choices are to remove them
          (isLocalDevMcpEnabled, isDesktopExtensionEnabled), to deliver tools as remote connectors instead, or to
          run the work in Cowork, whose VM is the isolation boundary (toolClaudeCowork). Cloud sessions reaching
