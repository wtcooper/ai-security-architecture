id: archAgentWorkflow
surface: surfaceCloud
rank: 2
title: Multi-agent workflow
abbrev: Multi-agent

summary:
  - >
    A hosted agent system doing real work over business records: requests, schedules and events
    start it, a durable orchestration layer plans and delegates across subagents, and every tool
    call leaves through one governed gateway. The shape agent deployments converge on once the work outlives
    a single request.

description:
  - >
    The spine is a trigger path: requests, schedules and events start the process, and it runs
    through supervisor agent, subagents, AI gateway, tool services and downstream systems —
    there is no user interface, because nobody is conversing with it. The architecture's security posture lives almost entirely
    in one decision — that agents do not hold credentials or reach tools directly. Every
    network tool call, model call and connector call leaves through the gateway, which brokers short-lived
    credentials, enforces policy per call, applies rate and budget limits, and writes the audit
    trail as a tap rather than a favour asked of the agent.
  - >
    Orchestration is durable: a supervisor decomposes work for subagents and an engine journals
    every step so the process survives crashes. Durability has two consequences nobody expects
    from reliability machinery. Everything a step returns is written down, so a step that returns
    a credential has persisted it. And the engine replays steps to recover, so a side effect that
    is not idempotent can execute more than once — including a payment.
  - >
    Delegation is the other axis. Each subagent is, structurally, the single agent workflow
    nested one level down — the same loop, the same gateway crossing, a narrower grant. A
    subagent should inherit a narrowed slice of the supervisor's authority, not all of it;
    delegation that does not narrow is privilege distribution. And
    inter-agent messages are model output becoming model input — one confused agent propagates
    through the graph, which is what distinguishes multi-agent failure from a single agent with
    more tools.
  - >
    The governance plane is drawn as its own column because it is what the personal-agent
    archetype lacks: a logical principal for every agent — short-lived tokens minted and
    constrained at the gateway, revocable per specialist even though the specialists share one
    process — a registry deciding what may run and
    which tools are admitted, evaluation gates in front of change, an append-only audit sink, and
    a stop that works while a process is mid-flight.

distinguishedBy:
  - >
    Against the endpoint personal agent: the loop is nearly identical; the governance is not.
    Hosting buys an identity per agent, a policy boundary on every tool call, an audit trail and
    an administrator — none of which the endpoint pattern supplies.
  - >
    Against the single agent workflow: each subagent here is that architecture nested one level
    down. What this page adds is everything the nesting brings — a supervisor whose routing is
    itself steerable, durable state that outlives any single request, replay that can re-execute
    side effects, and delegation chains that must narrow at every hop.

exemplars:
  - name: Temporal
    note: >
      Durable execution journaling every step and replaying to recover, with agent invocations
      as activities alongside conventional ones. Only the SDK worker runs in-process with the
      harness; the service holding the event history — the step journal — is a separate tier,
      self-hosted or Temporal Cloud.
    url: https://docs.temporal.io
    asOf: "2026-09"
  - name: LangGraph
    note: >
      Supervisor/subagent orchestration as a stateful graph with checkpointing at every step —
      the specialists are objects in one process, exactly as this drawing nests them.
    url: https://www.langchain.com/langgraph
    asOf: "2026-09"
  - name: Microsoft Agent Framework
    note: >
      The unified successor to AutoGen and Semantic Kernel: graph-based multi-agent workflows
      with durable state, packaged for exactly this supervisor-and-specialists shape.
    url: https://learn.microsoft.com/en-us/agent-framework/
    asOf: "2026-09"

zones:
  - id: zoneUser
    owner: user
    note: >
      The initiator — present to start the process and absent for the rest of it. The approval
      they gave at the start is the only human decision until something escalates.
  - id: zoneCloud
    owner: cloud
    note: >
      Everything we operate: the surface the request arrives on, what triggers the workflow
      when nobody sends one, the supervisor and its specialists, the durable state beneath
      them, the crossing every call leaves through, and our own tool servers and data.
  - id: zoneExternal
    owner: external
    note: Outside the company — the model provider, third-party tool servers, and where effects land.
  - id: zoneGovernance
    owner: governance
    note: >
      Drawn across every band because it governs every band. A workflow that runs for days with
      nobody watching has no in-flight human gate, so this band carries the whole of the
      oversight.

blocks:
  - id: initiator
    kind: actor
    title: Initiator
    icon: person
    zone: zoneUser
    col: 0
    row: 0
    note: >
      Starts the process and is absent for the rest of it. The approval they gave at the start is
      the only human decision until something escalates.

  - id: events
    kind: service
    title: Triggers & schedules
    cosaiComponent: componentAgentUserQuery
    zone: zoneCloud
    col: 2
    row: 0
    note: >
      Timers, webhooks and queue messages that start work with no human in the room — and the
      resumptions that wake a workflow which has been suspended for hours or days.
    items:
      - id: schedules
        label: Schedules & events
        icon: clock
        note: The timer or queue message that starts a run, and the signal that resumes a suspended one.

  - id: entry
    kind: service
    title: Application front end
    cosaiComponent: componentApplication
    zone: zoneCloud
    col: 1
    row: 1
    note: >
      Where a request arrives and the initiator's identity is bound to the workflow it starts.
      That binding has to outlive the session, because the work does.
    items:
      - id: api
        label: App & API endpoint
        icon: globe
        note: The published surface a process is started from.
      - id: authn
        label: Identity binding
        icon: shield
        note: >
          Whose authority the workflow carries for its whole life — days, in some deployments,
          after the person who granted it has gone.

  - id: harness
    kind: service
    title: Agent harness
    cosaiComponent: componentReasoningCore
    zone: zoneCloud
    col: 2
    row: 1
    note: >
      One runtime, not a fleet of services. A supervisor and its specialists are objects in the
      same process, dispatched by the graph's own scheduler — no service boundary, no network
      hop, no separate identity, unless somebody deliberately introduces one. Drawing them
      nested says that, where drawing them side by side implied a deployment that does not
      exist.

  - id: localTools
    kind: service
    title: Tool services
    cosaiComponent: componentTools
    zone: zoneCloud
    parent: harness
    col: 0
    row: 1
    note: >
      The tools compiled into the application itself — decorated functions running in the
      loop's own process, under its identity, with its egress and its secrets. This is the
      default way a tool gets attached, and the reason it is drawn: **the in-process tool set
      is invisible to any gateway**. Only what leaves over the network appears at a chokepoint,
      so whatever lives here is governed by code review or by nothing.
    items:
      - id: inProcess
        label: Tool handlers
        icon: code
        note: Functions in the application, holding whatever the application holds.
      - id: connectors
        label: APIs & connectors
        icon: plug
        note: Ordinary outbound calls the application makes itself, with no broker in front.
      - id: sandboxedTools
        label: Sandboxed tools
        icon: shield
        note: >
          Code execution in an isolated runtime inside the harness's own tool surface — the
          loop writes code, only the sandbox runs it, and what it installs comes from the
          mirror and nowhere else. Bash is where the package manager lives.

  - id: orchestration
    kind: service
    parent: harness
    title: Supervisor agent
    zone: zoneCloud
    col: 0
    row: 0
    cosaiComponent: componentReasoningCore
    note: >
      Decomposes the goal, routes work to the subagents and owns the process; the durable
      engine journals every step and replays to recover. Delegation should narrow authority at
      every hop.
    items:
      - id: supervisor
        label: Agent loop
        icon: agent
        note: Decomposes the goal and routes work to specialists.
      - id: engine
        label: Durable engine
        icon: gear
        note: Journals results and replays to recover. Replay without re-authorisation re-executes side effects.

  - id: subagents
    kind: service
    title: Subagents
    zone: zoneCloud
    parent: harness
    col: 1
    row: 0
    cosaiComponent: componentReasoningCore
    note: >
      The specialists the supervisor drives, each with its own context and tool set.
      Structurally each one is the single agent workflow nested one level down — the
      supervisor above it is the only real difference.
    items:
      - id: specialists
        label: Specialist agents
        icon: agent
        note: Each runs the same loop as the single agent workflow, under its own workload identity.
      - id: messages
        label: Inter-agent messages
        icon: chat
        note: Model output becoming model input — one confused agent propagates through the graph.

  - id: state
    kind: service
    title: Memory & state
    zone: zoneCloud
    col: 2
    row: 3
    cosaiComponent: componentDataStorage
    note: >
      What the workflow knows and what it has done. The journal is a reliability feature and a
      secrets sink in the same breath.
    items:
      - id: journal
        label: Step journal
        icon: doc
        note: >
          Everything a step returns is persisted here. A returned credential is a stored one —
          and when the engine is a hosted service, the journal lives with the vendor, payloads
          included, unless a payload codec encrypts them under our keys.
      - id: index
        label: Vector index
        icon: search
        note: Retrieval context for the agents.
      - id: memory
        label: Shared memory
        icon: folder
        note: Cross-step working state the agents read back as context.

  - id: gateway
    kind: service
    title: AI gateway
    zone: zoneCloud
    col: 3
    row: 1
    note: >
      The one door for everything that leaves over the network. Agents hold no credentials and
      reach nothing directly; every network model and tool call is brokered, policy-checked,
      rate-limited and logged here — the in-process tool set is the drawn exception. Its items
      are the traffic classes it brokers — the checks it runs are the numbered pins on this
      block and its edges, and the call-outs beneath.
    pack: aiGatewayTraffic

  - id: provider
    kind: provider
    title: Model provider
    zone: zoneExternal
    col: 4
    row: 0
    cosaiComponent: componentModelServing
    note: >
      The published inference interface, called many times across the process. Everything behind
      it is the provider's, and is not drawn.
    items:
      - id: inference
        label: Inference API
        icon: model
        note: Reached only through the gateway, on brokered credentials.

  - id: internalTools
    kind: service
    title: Tool services
    zone: zoneCloud
    col: 3
    row: 2
    cosaiComponent: componentTools
    pack: toolServicesRemote
    note: >
      Our own action surface, admitted by the registry and reached only through the gateway.
      The same component as the external surface, at a different band.

  - id: orgData
    kind: external
    title: Enterprise data
    zone: zoneCloud
    col: 3
    row: 3
    cosaiComponent: componentDataSources
    note: >
      The systems of record the agents write to — where a wrong action becomes a real one, and
      where a workflow that ran for two days did most of its damage before anyone looked.
    items:
      - id: records
        label: Org data
        icon: db
        note: The authoritative state the workflow changes.
      - id: fileStorage
        label: File storage
        icon: folder
        note: Artifacts a step produced and a later step reads back as context.

  - id: extTools
    kind: service
    title: Tool services
    zone: zoneExternal
    col: 4
    row: 1
    cosaiComponent: componentTools
    pack: toolServicesRemote
    items:
      - id: peers
        label: A2A peer agents
        icon: agent
        note: Cross-org delegation over the A2A protocol. A peer's output enters this graph as input.
    note: >
      Third-party servers, connectors and peer agents, out where nobody we contracted with
      operates them. Admitted by assessment at the crossing, or refused there.

  - id: downstream
    kind: external
    title: Downstream services
    cosaiComponent: componentDataSources
    zone: zoneExternal
    col: 4
    row: 2
    pack: downstreamPublic
    note: >
      Where effects land outside the company, and where the untrusted content that returns
      enters a graph in which one confused agent propagates to all the others.

  - id: govIdentity
    kind: governance
    title: Identity services
    icon: person
    zone: zoneGovernance
    col: 0
    row: 4
    capabilities: [capabilityIga, capabilityNhiManagement]
    note: >
      One workload identity per agent, so a supervisor and its specialists are distinguishable
      in the audit and revocable separately. A graph of agents sharing one identity is a graph
      with no accountability in it.

  - id: govSecrets
    kind: governance
    title: Secrets & key management
    icon: key
    zone: zoneGovernance
    col: 1
    row: 4
    capabilities: [capabilitySecretsManagement, capabilityCredentialIsolation, capabilityEncryptionKeyManagement]
    note: >
      Short-lived credentials fetched at step time rather than held for the process's life —
      which matters more here than anywhere, because the process's life may be days.

  - id: govPolicy
    kind: governance
    title: Policy & authorization
    icon: scale
    zone: zoneGovernance
    col: 2
    row: 4
    capabilities: [capabilityToolPermissionScoping, capabilityEgressControl, capabilityRateLimiting, capabilityHitlControls]
    note: >
      A per-call decision about this agent, this tool, this argument — never a standing grant,
      and the brake on a loop that would otherwise be metered only by the invoice.

  - id: govSupplyChain
    kind: governance
    title: Supply-chain assurance
    icon: db
    zone: zoneGovernance
    col: 4
    row: 4
    capabilities: [capabilityAgentRegistry, capabilityModelEvals, capabilityMcpToolSecurity, capabilityAiBom]
    note: >
      Which agents and tools exist at all. In a multi-agent graph the registry is also the
      inventory: an agent nobody registered is an agent nobody can revoke.

  - id: govObservability
    kind: governance
    title: Observability & response
    icon: eye
    zone: zoneGovernance
    col: 5
    row: 4
    capabilities: [capabilityAuditLogging, capabilityKillSwitch, capabilityAgentObservability]
    note: >
      The trail is recorded by the gateway, not volunteered by the agents — and the stop has to
      reach a workflow that is suspended mid-flight, not just one that is currently running.

  - id: registry
    kind: external
    title: Private pkg registry
    cosaiComponent: componentDataSources
    zone: zoneCloud
    col: 1
    row: 2
    note: >
      The organisation-maintained mirror that serves whatever the sandbox installs: a
      dependency the agent's generated code needs, a tool package a step pulls in. Read-only
      to agents, because a writable cache is a message board between sandboxes and an escape
      route — the OpenAI–Hugging Face incident began there.
    items:
      - id: hub
        label: Approved packages
        icon: db

edges:
  - from: initiator
    to: entry
    path: primary
    bidir: true
    label: request / result
    note: >
      The process is started and the initiator's identity is bound to it. They are absent for
      everything that follows.
  - from: entry
    to: harness
    path: primary
    bidir: true
    note: The request reaches the supervisor carrying whose authority the workflow will run on.
  - from: events
    to: harness
    path: primary
    label: trigger
    note: >
      Timers, webhooks and queue messages that start work with no human in the room — and the
      signals that resume a workflow suspended for hours or days.
  - from: harness
    to: state
    path: primary
    bidir: true
    route: vh
    note: >
      The journal, the shared memory and the retrieval context. Durable by design, which is why
      everything a step returns is persisted — including things that should not be.
  - from: orchestration
    to: subagents
    path: primary
    bidir: true
    route: vh
    label: delegate / results
    note: >
      Work handed down and results handed back. A specialist's output becomes the supervisor's
      input, which is how one confused agent propagates through the graph.
  - from: harness
    to: gateway
    path: primary
    bidir: true
    label: model & tool calls
    note: Every network call the agents make crosses here on a brokered, step-scoped credential.
  - from: localTools
    to: registry
    path: primary
    bidir: true
    route: vh
    label: pinned installs
    note: >
      What the harness's sandbox installs — a package manager running as a shell command —
      is pulled straight from the mirror, pinned by digest, never from a public registry. The
      gateway is the other doorway into the harness, for inference, MCP, skills and APIs; it
      is not on this path.
  - from: gateway
    to: provider
    path: external
    bidir: true
    route: vh
    note: Inference on the brokered credential, for every agent in the graph.
  - from: gateway
    to: internalTools
    path: primary
    bidir: true
    label: internal tool calls
    note: Admitted against the registry and narrowed to a scoped grant before anything executes.
  - from: internalTools
    to: orgData
    path: primary
    bidir: true
    label: scoped reads & writes
    note: >
      Where the workflow's effects land on systems of record, and where artifacts a later step
      reads back as context are stored.
  - from: gateway
    to: extTools
    path: external
    bidir: true
    label: brokered external calls
    note: Third-party servers and peer agents, reached only through the crossing that admitted them.
  - from: extTools
    to: downstream
    path: external
    bidir: true
    note: >
      Effects landing outside the company, and untrusted content returning into a graph where
      it becomes several agents' input at once.

pins:
  risks:
    - risk: riskPromptInjection
      at: internalTools->orgData
      note: >
        Records, documents and API responses read over the process's lifetime are chances to
        steer an agent whose output another agent will trust.
    - risk: riskPromptInjection
      at: gateway->extTools
      note: >
        Content returning from third-party servers and peer agents enters a graph in which one
        confused agent propagates to all the others — classified at the crossing or trusted by
        every specialist at once.
    - risk: riskPromptInjection
      at: initiator->entry
      note: >
        The initiator's request text is model input like any other — it reaches the same
        context window as the system instruction, and the workflow acts on it for days.
    - risk: riskInsecureModelOutput
      at: orchestration->subagents
      note: Inter-agent messages are model output landing in another agent's context as instruction.
    - risk: riskInsecureModelOutput
      at: gateway->provider
      note: >
        The completion decides the next delegation and the next tool call, and it is
        unauthenticated content — the provider return is where it enters the graph.
    - risk: riskAgenticDelegationConfusedDeputy
      at: orchestration->subagents
      note: A subagent that inherits its parent's full authority is privilege distribution, not delegation.
    - risk: riskAgentDelegationChainOpacity
      at: orchestration
      note: >
        Three hops in, nobody can say which agent decided what on whose behalf — the chain the
        shared subagents block exists to carry, legible only if delegation is traced as it
        happens.
    - risk: riskOrchestratorRouteHijacking
      at: orchestration
      note: >
        Steer the supervisor's routing — through injected content or a tampered route
        definition — and every specialist downstream works from the attacker's plan without
        any individual agent misbehaving.
    - risk: riskInsecureIntegratedComponent
      at: localTools
      note: >
        Handlers compiled into the harness's process hold whatever the process holds and cross
        no chokepoint — a vulnerable or malicious in-process tool is invisible to every drawn
        control.
    - risk: riskSensitiveDataDisclosure
      at: state
      note: >
        The journal records everything a step returns — a returned secret is a persisted one,
        and every writer is in scope: the specialists journal to the same store, so the
        secrets-sink risk multiplies with the agent count.
    - risk: riskRogueActions
      at: internalTools->orgData
      note: >
        Consequential writes with no human present — and replay can execute a non-idempotent one
        twice.
    - risk: riskRunawayAgentToolLoops
      at: harness
      note: >
        The loop materializes here — agents re-planning against each other can run for as long
        as nobody notices; the gateway's ceilings are the brake, not the site.
    - risk: riskPromptInjection
      at: state
      note: >
        Shared memory is cross-step instruction: an injection journaled on day one re-enters
        every agent's context for the rest of the process — memory poisoning by its OWASP name.
    - risk: riskEconomicDenialOfWallet
      at: gateway
      note: Inference called many times across days of process is a spend surface worth a brake.
    - risk: riskToolRegistryTampering
      at: gateway->internalTools
      note: The admission list is the tool supply chain; whoever writes it programs the agents.

    - risk: riskRetrievalVectorStorePoisoning
      at: harness->state
      note: >
        The vector index is written by steps and read by every later one; a poisoned entry is
        retrieved into the context of an agent that never saw it arrive.
    - risk: riskToolSourceProvenance
      at: localTools->registry
      note: >
        What the sandbox installs is code the agent chose, on a name it read in a task or a tool
        result; the mirror decides which build answers to that name, and whoever can write to
        the mirror programs every sandbox that pulls from it.
  capabilities:
    - capability: capabilityMemoryProtection
      at: state
      note: >
        Shared memory is what lets one branch of the graph steer another. Scoping it per run,
        and treating what a step wrote as untrusted when a later step reads it, is the control.
    - capability: capabilityModelEvals
      at: govSupplyChain
      note: >
        Behavioural checks in front of every model, prompt or agent change — the last point at
        which a change can be caught before it runs unattended for days.
    - capability: capabilityAgentObservability
      at: govObservability
      note: >
        The delegation graph has to be legible after the fact: which agent decided what, on
        whose behalf, and what it passed to the next one — assembled here from the traces the
        gateway and the engine record.
    - capability: capabilityIga
      at: initiator->entry
      note: The user's identity and a delegated grant scoped to this request, not a standing power.
    - capability: capabilityNhiManagement
      at: orchestration
      note: >
        A logical principal for the supervisor, distinct from any user — its short-lived tokens
        minted and constrained at the gateway, so the chain starts attributable.
    - capability: capabilityNhiManagement
      at: subagents
      note: >
        A logical principal per specialist — not the supervisor's shared one — so every step in
        the chain is attributable and separately revocable at the gateway. The specialists
        share one process; a compromise of the harness is a compromise of every principal it
        speaks for, which is what the sandbox and the narrowed grants bound.
    - capability: capabilitySecretsManagement
      at: harness->gateway
      note: >
        Credentials brokered at step time, short-lived and scoped; agents hold none for
        network calls — the in-process tool set is the drawn exception.
    - capability: capabilityAgentRuntimeEnforcement
      at: gateway->internalTools
      note: A policy decision on every tool call — agent, tool, arguments — outside the loop.
    - capability: capabilityToolPermissionScoping
      at: gateway->internalTools
      note: Each delegation hop carries a narrower grant than its parent.
    - capability: capabilityCredentialIsolation
      at: orchestration->subagents
      note: >
        Authority narrows where it is handed down: a specialist receives tokens scoped to its
        task, never the supervisor's credentials — delegation that does not narrow is
        privilege distribution.
    - capability: capabilityRateLimiting
      at: gateway
      note: Rate and budget ceilings on the crossing that end loops the agents cannot end themselves.
    - capability: capabilityPromptInjectionDefense
      at: gateway
      note: >
        Returned record content — and the initiator's own request text on its way in — is
        classified at the crossing before it reaches any agent's context.
    - capability: capabilityPromptInjectionDefense
      at: gateway->extTools
      note: >
        The external return gets the same classification at the crossing — third-party content
        is the widest author set on the drawing.
    - capability: capabilityAiDlp
      at: state
      note: >
        Redaction on what steps may journal, because the journal outlives the process — and
        every writer is in scope, the specialists included.
    - capability: capabilityHitlControls
      at: internalTools->orgData
      note: >
        An approval gate on consequential writes, sized to the blast radius. The engine
        suspends the step and resumes only on an approval bound to the exact action and
        workflow state — see the escalation scenario.
    - capability: capabilityDataAccessGovernance
      at: internalTools->orgData
      note: >
        Reads scoped to the workflow's grant rather than the service's reach — the same
        entitlement filter the siblings enforce on this edge.
    - capability: capabilityAgentSandboxing
      at: internalTools
      note: >
        Generated code and browsing run in an isolated runtime with its own filesystem and
        network — never on the orchestration tier.
    - capability: capabilityAgentRegistry
      at: govSupplyChain
      note: >
        Admission for agents and tools — nothing runs or is offered by default, and in a
        multi-agent graph the registry is also the inventory: an agent nobody registered is an
        agent nobody can revoke. The gateway enforces the resulting list per call.
    - capability: capabilityAuditLogging
      at: govObservability
      note: An append-only trail that can reconstruct who delegated what to whom.
    - capability: capabilityKillSwitch
      at: govObservability
      note: A stop that works mid-flight, because these processes run for days.
    - capability: capabilityAiDetectionResponse
      at: govObservability
      note: >
        Somebody correlating the trail while the process is still running — coordinated
        fan-out, anomalous delegation and autonomous persistence are visible in the traces
        only if something is actually reading them.

    - capability: capabilityEncryptionKeyManagement
      at: state
      note: >
        Payloads in the journal encrypted under keys we hold, so a hosted engine stores
        ciphertext and a returned credential is not a vendor-readable one.
    - capability: capabilityRagSecurity
      at: state
      note: >
        Per-run index scoping and ingest trust on what enters the corpus — the answer to a
        poisoned index, distinct from scoping what a step may read.
    - capability: capabilityMcpToolSecurity
      at: govSupplyChain
      note: >
        Admission is change-time; the rug-pull is a tool whose definition changes after
        admission. Content-hash pinning of admitted tool descriptions is what catches it.
    - capability: capabilityAiBom
      at: registry
      note: >
        Digest and signature verification at admission to the mirror, and an inventory of which
        packages a sandbox may pull — the registered embodiment of artifact scanning.
    - capability: capabilityDataAccessGovernance
      at: registry
      note: >
        Read-only to agents. A cache a sandbox can write to is a shared medium between agent
        instances that were meant to be isolated, and a proxying mirror is a road to the
        internet the sandbox was not supposed to have.
    - capability: capabilityEgressControl
      at: localTools
      note: >
        The sandbox's network policy: the only routes out are the AI gateway and the package
        mirror. Shell commands, fetches and anything else a tool emits are bounded here — not at
        the gateway, which brokers model, MCP and API calls and sees nothing else.
    - capability: capabilityToolPermissionScoping
      at: gateway->extTools
      note: >
        The gateway's own allowlist: which external MCP servers, APIs and peer agents are
        registered, and which tools each key may call on them. Configuration of a broker, not a
        network control.
walkthrough:
  title: A user asks the agent to act
  moves: >-
    A long-running process: work delegated to specialists, journalled at every step.
  steps:
    - follow: initiator->entry
      note: >
        The request arrives authenticated, and a delegated grant scoped to this workflow is
        bound to it — a binding that must outlive the session, because the work does.
    - follow: entry->harness
      note: The request reaches the supervisor carrying whose authority the workflow will run on.
    - follow: harness->state
      note: >
        The run is journaled from its first step — everything a step returns will persist
        here, which is the durability the drawing exists to show.
    - follow: state->harness
      note: The journal acknowledges; the run now has a durable identity.
    - follow: harness->gateway
      note: >
        The supervisor's first call is for a plan — nothing is delegated before the goal is
        decomposed — and every network call any agent makes funnels through this one door.
    - follow: gateway->provider
      note: Inference on brokered credentials, limits applied.
    - follow: provider->gateway
      note: The decomposition comes back across the crossing.
    - follow: gateway->harness
      note: Into the supervisor as a plan — unauthenticated content, now the work breakdown.
    - follow: orchestration->subagents
      note: >
        The supervisor delegates; each specialist takes its task with a narrowed grant, not
        the supervisor's authority.
    - follow: harness->gateway
      note: A specialist's model and tool calls leave through the same door, on its own grant.
    - follow: gateway->internalTools
      note: Tool calls carry the narrowed per-step grant.
    - follow: internalTools->orgData
      note: >
        The write lands — behind the approval gate when it is consequential; the escalation
        scenario walks that suspension.
    - follow: orgData->internalTools
      note: The record confirms the write.
    - follow: internalTools->gateway
      note: The result crosses back through the same door.
    - follow: gateway->extTools
      note: Work reaches third parties through the same crossing.
    - follow: extTools->gateway
      note: What returns is classified before any agent reads it, because one confused agent propagates.
    - follow: gateway->harness
      note: Results land with the specialist that asked.
    - follow: subagents->orchestration
      note: >
        Each specialist reports its slice back to the supervisor, which checkpoints the step
        to the journal. Days may pass before an event wakes the run — the journal is what it
        wakes into.
    - follow: harness->entry
      note: The result heads back to the surface.
    - follow: entry->initiator
      note: The result returns, possibly days after the request.

scenarios:
  - title: A step replays after a crash
    steps:
      - follow: state->harness
        note: The engine rebuilds state from the journal — including anything a step persisted.
      - follow: orchestration->subagents
        note: Replayed steps land on their specialists again.
      - follow: harness->gateway
        note: Replayed steps re-request credentials; nothing survives from the first run.
      - follow: gateway->internalTools
        note: Idempotency fencing decides whether the side effect may run again.
      - follow: internalTools->orgData
        note: Without fencing, the payment executes twice. The journal replays; the world does not.
  - title: A consequential write escalates for approval
    steps:
      - follow: harness->gateway
        note: A step proposes a write above the threshold.
      - follow: gateway->internalTools
        note: The per-call policy trips the threshold; the engine suspends the workflow rather than executing.
      - follow: internalTools->gateway
        note: The suspension comes back as the step's result.
      - follow: gateway->harness
        note: The supervisor parks the step in the journal.
      - follow: harness->entry
        note: The proposal surfaces toward a human.
      - follow: entry->initiator
        note: >
          Bound to the exact action, arguments and workflow state, with an expiry.
      - follow: initiator->entry
        note: >
          The approval returns and is validated against the suspended step — a blanket
          "resume" approves nothing in particular.
      - follow: entry->harness
        note: The suspended step resumes.
      - follow: harness->gateway
        note: Only then does the action leave.
      - follow: gateway->internalTools
        note: Under the same per-call policy as before.
      - follow: internalTools->orgData
        note: The write lands, attributable to both the workflow and the approver.
  - title: An event fires days into the process
    steps:
      - follow: events->harness
        note: >
          A timer or webhook resumes work with nobody watching — the waiting step wakes days
          after the request that started the process.
      - follow: harness->gateway
        note: >
          The supervisor re-plans from the journal, on credentials fetched now — the ones from
          day one would be stale authority.
      - follow: gateway->provider
        note: Inference on the fresh grant.
      - follow: provider->gateway
        note: The plan for the waking step comes back.
      - follow: gateway->harness
        note: Into the supervisor.
      - follow: orchestration->subagents
        note: Delegation re-narrows — the waking specialist gets its slice, not the initiator's.
      - follow: harness->gateway
        note: The specialist's call leaves through the same door.
      - follow: gateway->internalTools
        note: The action proceeds under the same per-call policy as an attended run.

  - title: A dependency arrives with the task
    steps:
      - follow: localTools->registry
        note: >
          A sandboxed step needs a package its generated code imports; the package manager
          runs as a shell command inside the harness's own tool surface and pulls from the
          mirror — the one destination the sandbox's network policy allows.
      - follow: registry->localTools
        note: >
          The admitted build comes back, pinned by digest — the hop a poisoned package actually
          arrives on. The mirror stays read-only to the sandbox: a cache it could write to
          would be a message board between sandboxes.

deviations:
  - subject: In-process tool handlers are drawn with no edges
    reason: >
      The localTools block warns rather than models: tools compiled into the application run
      in its process, so their calls traverse no drawable path of ours, and drawing edges
      would assert a governed hop that does not exist. The bound is code review at admission,
      which is why the risk is pinned on the block itself.
  - subject: The gateway's Skills catalogue item has no drawn supply path
    reason: >
      The aiGatewayTraffic pack is byte-identical across the catalogue, and this drawing keeps
      it whole because the tier brokers skills traffic in deployments that use skills. The
      supply chain behind the item — a private package registry and its signing pipeline — is
      deliberately outside this runtime drawing's scope; the endpoint personal agent draws the
      pull path.
  - subject: Subagents are drawn as one block
    reason: >
      There are several, with different contexts and tools. They share one block because the
      risks — inherited authority, message propagation, chain opacity — are properties of the
      delegation pattern rather than of any particular specialist; each specialist individually
      is the single agent workflow, one level down.
  - subject: Two of this architecture's risks have no CoSAI equivalent
    reason: >
      OWASP's agentic taxonomy names memory poisoning and cascading hallucination as distinct
      threats; CoSAI's risk set has neither. They are pinned here as prompt injection and insecure
      model output, the nearest true statements, which lose the compounding that makes both
      dangerous in a multi-agent system. Recorded rather than papered over.

