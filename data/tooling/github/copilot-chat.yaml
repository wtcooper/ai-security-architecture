              steps:
                - title: Disable at enterprise scope
                  body:
                    - Set Copilot in GitHub.com to Disabled everywhere; across enterprises the most restrictive policy applies,
                      within one enterprise set it at enterprise level.
                  url: https://docs.github.com/en/copilot/concepts/enterprise/policies
                - title: Purge Memory
                  body:
                    - Set Copilot Memory to Disabled everywhere and use Delete user memories in bulk.
                  url: >-
                    https://docs.github.com/en/copilot/how-tos/use-copilot-agents/copilot-memory/manage-as-administrator
              note: >-
                The policy applies at the next request; a hand-off already running in the cloud agent is
                stopped from that agent's session log, not from the chat policy.
              verified: 2026-09-10
