implementations:
  - architecture: archChatAgent
    asOf: "2026-10"
    # >>> checked against the vendor's documentation
    verified: "2026-11-18"
    sources:
      entry: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html
      events: https://docs.aws.amazon.com/scheduler/latest/UserGuide/what-is-scheduler.html
      agent: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agents-tools-runtime.html
      localTools: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/code-interpreter-tool.html
      memory: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/memory.html
      gateway: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway.html
      provider: https://docs.aws.amazon.com/bedrock/latest/userguide/what-is-bedrock.html
      internalTools: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-supported-targets.html
      openWeb: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-integrations.html
      registry: https://docs.aws.amazon.com/codeartifact/latest/ug/welcome.html
    differences:
      - at: agent->gateway
        text: "AWS's documented runtime role lets the agent call Bedrock models directly, and AWS samples do so. Model calls cross the gateway only if you add inference targets, point the model client at the gateway, and remove bedrock:InvokeModel from the agent's role."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-permissions.html
      - at: entry->agent
        text: "A load balancer cannot forward to AgentCore Runtime. You need front-end code (Lambda or containers) behind it that calls the runtime with the user's token. AWS's cited reference solution uses CloudFront, API Gateway and Lambda instead."
        url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-target-groups.html
      - at: events->agent
        text: "A runtime accepts either AWS-signed (IAM) calls or JWT tokens, never both. With JWT sign-in for users, the scheduled Lambda cannot call with its IAM role; it must obtain a Cognito machine token, or you deploy a second, IAM-authorised runtime."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-oauth.html
      - at: provider
        text: "Amazon Nova models can search the web themselves (Web Grounding) inside the Bedrock call, where no gateway policy sees it. It needs bedrock:InvokeTool on the nova_grounding system tool; leave that permission out of the agent's role."
        url: https://docs.aws.amazon.com/nova/latest/nova2-userguide/web-grounding.html
      - at: gateway->openWeb
        text: "AWS also has its own web search. As a gateway connector it stays behind the gateway, but the InvokeWebSearch API and AgentCore Browser are called directly with IAM and skip it. Do not grant those permissions to the agent's role."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/web-search-api.html
      - at: gateway->openWeb
        text: "The gateway is AWS-managed and reaches public targets itself; it enters your VPC only for targets given a private endpoint. Your Network Firewall therefore does not filter gateway calls. Control them through the target list, policies and who may create targets."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-vpc-egress.html
      - at: localTools
        text: "Code Interpreter is a separate managed service, not in-process, and runs outside your VPC unless you choose VPC mode. Sandbox mode is not fully closed: it still allows Amazon S3 access, so scope its execution role tightly."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/code-interpreter-resource-management.html
      - at: localTools->registry
        text: "Packages are normally installed when the agent's container image is built, not at run time. Code Interpreter in Sandbox mode is documented as reaching only Amazon S3, so run-time installs from CodeArtifact would need VPC mode."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/code-interpreter-resource-management.html
    alsoNeeded:
      - service: "Amazon Cognito"
        role: identity
        why: "User pool that signs users in and issues the JWTs the runtime and gateway validate."
        url: https://docs.aws.amazon.com/cognito/latest/developerguide/what-is-amazon-cognito.html
      - service: "AgentCore Identity"
        role: identity
        why: "Workload identity for each agent and credential providers for outbound tokens."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/identity.html
      - service: "Front-end compute (AWS Lambda or Amazon ECS)"
        role: other
        why: "Runs the chat application behind the load balancer and calls InvokeAgentRuntime with the user's token."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-invoke-agent.html
      - service: "Amazon VPC with NAT gateway"
        role: network
        why: "VPC-mode runtimes get no internet from public subnets; private subnets need a NAT route."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-vpc.html
      - service: "AWS Network Firewall"
        role: network
        why: "The egress filter for traffic leaving the runtime's subnets."
        url: https://docs.aws.amazon.com/network-firewall/latest/developerguide/what-is-aws-network-firewall.html
      - service: "AWS KMS"
        role: keys
        why: "Customer managed keys for gateway, memory and token vault; defaults are AWS-owned keys."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-encryption.html
      - service: "AWS Secrets Manager"
        role: secrets
        why: "AgentCore Identity credential providers keep OAuth client secrets and API keys there."
        url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html
      - service: "Amazon ECR"
        role: registry
        why: "Holds the agent's container image; the documented runtime role pulls from it."
        url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/what-is-ecr.html
      - service: "AWS Certificate Manager"
        role: ingress
        why: "Load balancer sign-in actions work only on HTTPS listeners, which need a certificate."
        url: https://docs.aws.amazon.com/acm/latest/userguide/acm-overview.html
      - service: "AWS WAF"
        role: ingress
        why: "Web ACL on the load balancer; the gateway takes one web ACL too."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-waf.html
      - service: "Amazon CloudWatch and AWS CloudTrail"
        role: logging
        why: "Transaction Search must be switched on once; data events are off by default."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/observability-configure.html
    quickstart:
      - title: "Get started with AgentCore Runtime using the AgentCore CLI"
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-get-started-cli.html
      - title: "Get started with AgentCore Gateway"
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-quick-start.html
      - title: "Getting started with Policy in AgentCore"
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/policy-getting-started.html
    # <<< checked
    reference:
      - title: Generative AI Application Builder on AWS
        url: https://aws.amazon.com/solutions/implementations/generative-ai-application-builder-on-aws/
      - title: Security for agentic AI on AWS (AWS Prescriptive Guidance)
        url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-security/introduction.html
    summary:
      - >-
        Your own agent on Amazon Bedrock AgentCore Runtime behind an Application Load Balancer that
        signs users in through Amazon Cognito, reaching Bedrock models and your tools through
        AgentCore Gateway with Policy in AgentCore, inside a VPC whose outbound traffic leaves through
        AWS Network Firewall. AgentCore harness can run the loop for you; that managed harness is the
        API/SDK managed agent runtime drawing, so this one keeps the loop in your code.
    bindings:
      - { block: entry, service: Application Load Balancer with AWS WAF, note: "authenticate-cognito against a Cognito user pool federated to IAM Identity Center or your corporate IdP." }
      - { block: events, service: EventBridge Scheduler and AWS Lambda }
      - { block: agent, service: Your agent on AgentCore Runtime, builtWith: Strands Agents, note: "AgentCore harness, which runs the loop as configuration, is the managed alternative. Amazon ECS or EKS serve where you run the containers yourself." }
      - { block: localTools, service: AgentCore Code Interpreter }
      - { block: memory, service: AgentCore Memory and Knowledge Bases }
      - { block: gateway, service: Amazon Bedrock AgentCore Gateway, note: "Inference targets broker model calls; MCP and HTTP targets broker tools; Policy in AgentCore decides each call." }
      - { block: provider, service: Amazon Bedrock foundation models }
      - { block: internalTools, service: "Your MCP servers and APIs, as gateway targets" }
      - { block: orgData, service: Your systems of record, build: true, note: "Amazon S3, Amazon RDS, SharePoint — whatever the tools act on." }
      - { block: openWeb, service: Brave or Tavily Search as a gateway target, note: "From AgentCore Gateway's built-in integration templates." }
      - { block: sources, service: "Public registries (PyPI, npm)" }
      - { block: registry, service: AWS CodeArtifact repository }
    # >>> hosting options (compared against the vendor's pages; one is the mapping itself)
    hosting:
      - id: agentCoreRuntime
        kind: runtime
        name: "Amazon Bedrock AgentCore Runtime"
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agents-tools-runtime.html
        asOf: "2026-11"
        mapped: true
        compare:
          runs: "Your code runs the loop, in any framework or none, packaged as a container image or code zip that AWS hosts with one microVM per session."
          patching: "AWS patches the host, the OS kernel and, for direct code deployments, the language runtime; you rebuild container images from patched base images."
          data: "Prompts and tool results are processed in a per-session microVM that AWS runs and ends with the session; lasting state goes to AgentCore Memory or mounted storage."
          network: "Network mode is PUBLIC or VPC; VPC mode puts network interfaces in your subnets under your security groups, with no internet route unless you add a NAT gateway."
          identity: "An IAM execution role that AgentCore Runtime assumes, plus a workload identity in AgentCore Identity; callers are checked by IAM SigV4 or an OAuth JWT authoriser."
          accepts: "Any framework or custom code, such as Strands Agents, LangGraph, CrewAI, Google ADK or OpenAI Agents SDK, serving HTTP, MCP, A2A or AG-UI from ARM64 containers."
          workload: "Sessions run up to 8 hours on microVMs or 14 days on Instances and end after 15 idle minutes by default; schedules and events arrive through a caller that invokes it."
          portability: "The agent is a container serving /invocations and /ping, so it can run elsewhere; sessions and inbound auth need replacing, and AgentCore services stay callable."
          effort: "You own agent code, image rebuilds, IAM and resource policies, session-to-user mapping, input validation and VPC settings; AWS runs scaling, isolation and patching."
          fits: "AWS guidance: the code-defined path when you need custom orchestration or multi-agent patterns in any framework; microVMs are called the best starting point."
        sources:
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agents-tools-runtime.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-how-it-works.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-instances-how-it-works.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-security-best-practices.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-vpc.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-permissions.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-long-run.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-lifecycle-settings.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-http-protocol-contract.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/using-any-agent-framework.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-vs-runtime.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-filesystem-configurations.html
          - https://docs.aws.amazon.com/bedrock/latest/userguide/agents-classic-maintenance-mode.html
          - https://docs.aws.amazon.com/decision-guides/latest/decision-guides/genai-guide.html
          - https://aws.amazon.com/bedrock/agentcore/faqs/
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
      - id: eks
        kind: cluster
        name: "Amazon Elastic Kubernetes Service (Amazon EKS)"
        url: https://docs.aws.amazon.com/eks/latest/userguide/what-is-eks.html
        asOf: "2026-11"
        compare:
          runs: "Your code runs the loop in containers you build and deploy as Kubernetes workloads; EKS runs the control plane and schedules the pods."
          patching: "AWS patches the control plane; you patch node operating systems and images, unless EKS Auto Mode is on, where AWS patches nodes and replaces them within 21 days."
          data: "Prompts, tool results and state are processed in pods on EC2 nodes in your account and VPC; lasting state sits in whichever stores you attach."
          network: "Pods get VPC addresses with no traffic restriction by default; Kubernetes network policies, security groups for Pods and your VPC routing control outbound traffic."
          identity: "An IAM role bound to the pod's Kubernetes service account by an EKS Pod Identity association, with credentials served by the Pod Identity Agent on the node."
          accepts: "Any framework or language that runs in a container; an AWS example of agents on EKS Auto Mode uses the Strands Agents SDK."
          workload: "Pods run as Deployments or Jobs with no session limit, though Auto Mode replaces nodes within 21 days; HPA or KEDA scale them, and durable waits need an engine you add."
          portability: "The agent ships as containers on the Kubernetes API, which AWS notes eases moves across clouds and on premises; IAM, load balancer and add-on bindings change."
          effort: "You operate cluster version upgrades, add-ons, node capacity, ingress, network policy, autoscaling and telemetry; EKS Auto Mode takes over nodes and core add-ons."
          fits: "AWS guidance: choose EKS for the Kubernetes API and ecosystem, portability across clouds and on premises, or existing Kubernetes skills and tooling."
        sources:
          - https://docs.aws.amazon.com/eks/latest/userguide/what-is-eks.html
          - https://docs.aws.amazon.com/eks/latest/userguide/security.html
          - https://docs.aws.amazon.com/eks/latest/userguide/automode.html
          - https://docs.aws.amazon.com/eks/latest/userguide/ml-on-eks.html
          - https://docs.aws.amazon.com/eks/latest/userguide/pod-identities.html
          - https://docs.aws.amazon.com/eks/latest/userguide/cni-network-policy.html
          - https://docs.aws.amazon.com/eks/latest/userguide/auto-net-pol.html
          - https://docs.aws.amazon.com/eks/latest/userguide/security-groups-for-pods.html
          - https://docs.aws.amazon.com/eks/latest/userguide/sandboxing.html
          - https://docs.aws.amazon.com/eks/latest/userguide/horizontal-pod-autoscaler.html
          - https://docs.aws.amazon.com/eks/latest/userguide/ml-inference-autoscaling-hpa-keda.html
          - https://docs.aws.amazon.com/eks/latest/userguide/sample-deployment.html
          - https://docs.aws.amazon.com/eks/latest/userguide/cluster-endpoint.html
          - https://docs.aws.amazon.com/eks/latest/best-practices/identity-and-access-management.html
          - https://docs.aws.amazon.com/decision-guides/latest/decision-guides/choosing-aws-container-service.html
          - https://docs.aws.amazon.com/step-functions/latest/dg/connect-eks.html
          - https://aws.amazon.com/blogs/containers/observability-patterns-for-ai-agents-on-amazon-eks/
          - https://docs.aws.amazon.com/eks/latest/userguide/alb-ingress.html
        summary: "The turn loop runs in pods on Amazon EKS; the Application Load Balancer forwards each turn to the pods, and scheduled runs arrive on an SQS queue. Gateway, Memory, Knowledge Bases and Code Interpreter are unchanged. You now carry what Runtime did for each conversation: the microVM around the session, validation of the caller's token, the execution role binding, VPC placement and session stop, plus node patching, scaling and telemetry."
        bindings:
          - { block: agent, service: "Your agent in pods on Amazon EKS", builtWith: "Strands Agents", note: "A Deployment behind an Ingress that the AWS Load Balancer Controller or EKS Auto Mode turns into ALB target groups. Conversations share pods.", url: https://docs.aws.amazon.com/eks/latest/userguide/alb-ingress.html }
          - { block: events, service: "EventBridge Scheduler and Amazon SQS", note: "The schedule's SendMessage target puts a message on a queue that the agent pods poll; no Lambda function invokes a runtime.", url: https://docs.aws.amazon.com/scheduler/latest/UserGuide/managing-targets-templated.html }
        dropSettings: [runtimeInboundJwt, runtimeExecutionRole, runtimeVpcMode, runtimeStopSession]
        addSettings: [eksPodIdentity, eksNetworkPolicy, agentWorkloadIdentity, sqsQueueAccessPolicy, eksImdsHopLimit, eksAppNetworkPolicy, eksIsolatedPods, eksAgentQuarantine, eksClusterAccessEntries, eksControlPlaneLogs, eksPrivateEndpoint, albOidcClaimsVerify]
        differences:
          - at: entry->agent
            text: "Runtime validated the caller's JWT and gave every conversation its own microVM. On EKS the load balancer forwards to pod addresses (target type ip), pods are shared by many users, and the agent must verify the signature and signer of the x-amzn-oidc-data header and keep conversations apart in code. Pod ingress has to be limited to the load balancer."
            url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/listener-authenticate-users.html
          - at: agent->gateway
            text: "Kubernetes places no restriction on pod traffic by default, and enforcement must be switched on first (enableNetworkPolicy on the VPC CNI add-on, or the Auto Mode Network Policy Controller ConfigMap). Until a policy selects the agent pods they can reach any address the VPC routes to, not only the gateway."
            url: https://docs.aws.amazon.com/eks/latest/userguide/cni-network-policy.html
          - at: agent
            text: "Unless instance metadata is restricted (IMDSv2 with hop limit 1), a pod's containers can also obtain the node's IAM role, and a pod with hostNetwork always can. On Runtime the agent's credentials came only from the runtime's execution role."
            url: https://docs.aws.amazon.com/eks/latest/userguide/pod-identities.html
          - at: events->agent
            text: "A scheduled run is a queue message that a pod picks up under its own Pod Identity role, not an invocation carrying the user's token. The user the run acts for has to travel in the message, and the queue's access policy decides who can start one."
            url: https://docs.aws.amazon.com/scheduler/latest/UserGuide/managing-targets-templated.html
          - at: agent
            text: "StopRuntimeSession has no equivalent: ending one conversation is your application's job. Stopping the agent means scaling it to zero and deleting its Pod Identity association, and credentials already issued can stay valid until expiry unless the role's sessions are revoked in IAM."
            url: https://docs.aws.amazon.com/eks/latest/APIReference/API_DeletePodIdentityAssociation.html
        alsoNeeded:
          - service: "AWS Load Balancer Controller (built into EKS Auto Mode)"
            role: ingress
            why: "Creates the Application Load Balancer target groups for the agent's pods from an Ingress; Runtime exposed its own endpoint."
            url: https://docs.aws.amazon.com/eks/latest/userguide/alb-ingress.html
          - service: "EKS Pod Identity Agent (EKS add-on; built into EKS Auto Mode)"
            role: identity
            why: "Serves the pod its role credentials, which Runtime supplied from the runtime's execution role."
            url: https://docs.aws.amazon.com/eks/latest/userguide/pod-id-agent-setup.html
          - service: "Amazon VPC CNI network policy agent, or the EKS Auto Mode Network Policy Controller"
            role: network
            why: "Enforces pod-level network policy; it is off until you enable it, and without it no policy takes effect."
            url: https://docs.aws.amazon.com/eks/latest/userguide/cni-network-policy-configure.html
          - service: "ADOT SDK settings and an agent log group in CloudWatch"
            role: logging
            why: "Agents hosted outside AgentCore Runtime need their own log group and the OpenTelemetry environment variables before AgentCore Observability shows their traces."
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/observability-configure.html
          - service: "Amazon CloudWatch Observability EKS add-on"
            role: logging
            why: "Collects container logs and metrics from the nodes; Runtime wrote the agent's logs to CloudWatch without an agent to install."
            url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/install-CloudWatch-Observability-EKS-addon.html
          - service: "Horizontal Pod Autoscaler or KEDA, with Karpenter or EKS Auto Mode for nodes"
            role: other
            why: "Pods and nodes scale by rules you write; Runtime started and stopped a microVM per session for you."
            url: https://docs.aws.amazon.com/eks/latest/userguide/autoscaling.html
        quickstart:
          - title: "Get started with Amazon EKS: EKS Auto Mode"
            url: https://docs.aws.amazon.com/eks/latest/userguide/getting-started-automode.html
          - title: "Learn how EKS Pod Identity grants pods access to AWS services"
            url: https://docs.aws.amazon.com/eks/latest/userguide/pod-identities.html
          - title: "Observability patterns for AI agents on Amazon EKS (AWS Containers blog)"
            url: https://aws.amazon.com/blogs/containers/observability-patterns-for-ai-agents-on-amazon-eks/
      - id: agentCoreHarness
        kind: managed
        name: "Amazon Bedrock AgentCore harness"
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness.html
        asOf: "2026-11"
        pattern: archCloudManagedAgent
        tool: toolBedrockAgentcore
        compare:
          runs: "AWS runs the loop, powered by Strands Agents; you declare the model, system prompt, tools, memory and limits as configuration and call InvokeHarness."
          patching: "AWS patches the infrastructure, the OS kernel and the managed harness runtime; you rebuild any custom container image you bring."
          data: "Each session runs in its own microVM on AgentCore Runtime; conversation state persists in AgentCore Memory, which the service provisions unless you configure your own."
          network: "Sessions run on the public network by default and can be placed in your VPC; tools are reached through AgentCore Gateway, remote MCP servers or built-in tools."
          identity: "An IAM execution role you own, which the harness assumes; callers use IAM SigV4 or a JWT authoriser, and per-user identity reaches tools only with JWT."
          accepts: "No framework choice: one managed loop with models from Amazon Bedrock, OpenAI, Google Gemini or LiteLLM-compatible providers; graph and workflow patterns are unsupported."
          workload: "A microVM session lasts up to 8 hours, with iteration, time and token limits per invocation; a Step Functions task can call InvokeHarness for up to 15 minutes."
          portability: "Export to code turns the configuration into a Strands Agents Python agent for AgentCore Runtime; Gateway, Browser and Code Interpreter tools are rewired by hand."
          effort: "You own the configuration, IAM, caller authorisation, input validation, skill sources and network settings; AWS runs the loop, compute and scaling."
          fits: "AWS guidance: use the harness unless you need to own the loop; it is also the recommended target for Amazon Bedrock Agents Classic, now in maintenance mode."
        sources:
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-vs-runtime.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-security.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-tools.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-memory.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-environment.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-operations.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-export.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-versioning.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
          - https://docs.aws.amazon.com/bedrock/latest/userguide/agents-classic-maintenance-mode.html
          - https://docs.aws.amazon.com/step-functions/latest/dg/connect-bedrockagentcore.html
          - https://docs.aws.amazon.com/bedrock/latest/userguide/bedrock-managed-agents-openai.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-get-started-bma.html
          - https://aws.amazon.com/bedrock/agentcore/faqs/
        offers:
          - name: "AgentCore harness"
            what: "A managed agent loop, generally available per the developer guide, that you define with a model, system prompt and tools and invoke with one API call, each session in its own microVM."
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness.html
          - name: "Harness in a custom environment (container image)"
            what: "The same managed loop running inside a linux/arm64 container image that you build and push to Amazon ECR, for agents that need their own dependencies and tools."
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-environment.html
          - name: "Subagent delegation (built-in subagent tool)"
            what: "The agent hands a self-contained task to a fresh child agent, which is not a separately configured harness, and receives its result; AWS describes wider multi-agent collaboration as limited."
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-tools.html
          - name: "Human-in-the-loop agent (inline function tools)"
            what: "Tool schemas that execute on the client side: the harness pauses, returns the call to your code and resumes when you send the result, which is the documented pattern for approvals."
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-tools.html
          - name: "Harness as a workflow step (AgentCore InvokeHarness state)"
