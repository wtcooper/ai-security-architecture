# Controls guidance for the agentic software factory pattern. Audience: platform teams, security
# architects and the business owners who approve releases, where a factory the organisation runs
# turns a chat request into a hosted application. This is a build pattern whose subject is the
# gate between code an agent wrote and an app that runs against real data, and the app's life
# after launch. The build's derivation check fails this document if its cited controls stop
# being pinned on the pattern.
archetype: archSoftwareFactory
mode: build
status: draft
attribution: >-
  Authored in this repository. Pattern-level by design; delivery products are named only as
  examples on the pattern itself.

overview:
  - >-
    A software factory does two jobs, and they need different controls. The factory itself is an
    agent writing code from instructions anyone could have shaped, so contain it: a sandbox per
    task, a short network list, a token that can push a branch and nothing more, and packages
    admitted at the mirror. The apps it makes are ordinary software with users and data of their
    own, so govern them the way you would any application, with one difference: nobody has read
    the code.
  - >-
    That difference decides the gate. Automated checks stand in for the code review that will not
    happen, and an accountable owner stands in for the judgement that the checks cannot make:
    whether this app should see this data at all. Then give every app an owner and an end date,
    because the hardest app to govern is the one that is still running after everyone who wanted
    it has gone.

items:
  - title: Keep deploying out of the agent's hands
    mitigations: [AML.M0028, D3-EI, cap-agent-egress-control, D3-CH]
    body:
      - >-
        Give the agent a token for its own app's repository that can push a branch and open a pull
        request, and nothing else: no merge, no changes to branch protection or pipeline
        definitions, no cloud credential that reaches hosting. Run everything it executes in a
        sandbox made for one task, with a network that reaches only the gateway, the mirror and
        that repository, and keep real secrets in the vault where the agent cannot read them. Then
        whatever an injected instruction makes the agent do, the result is a branch the pipeline
        will scan.

  - title: Let checks do the review nobody will do, then let an owner decide
    mitigations: [D3-SYSVA, D3-ACH, AML.M0029, cap-staged-rollout-gate]
    body:
      - >-
        Scan the generated code, its packages and its settings on every push, and make serious
        findings stop the release rather than appear in a report. Check the app's settings against
        a baseline (sign-in in front, no public storage, only approved connectors), because a
        setting can expose an app whose code is clean. Then ask the app's named owner, not the
        requester, to approve that exact release after trying the preview: they are approving what
        the app does and what it may reach. Release to a few users first and keep the last good
        version ready. A dark factory, with no owner's approval, keeps all of this except the
        decision that the app may meet real data; confine it to apps that reach none.

  - title: Give every app its own walls, its own sign-in and its own data scope
    mitigations: [D3-NI, D3-APA, D3-MFA, cap-data-access-governance, D3-CTS]
    body:
      - >-
        Run each app in its own cloud account or project and network, with its own identity and
        store, so one faulty app cannot reach another or the factory. Put the identity provider in
        front of every app by default, with a second factor, whatever the generated code does
        about sign-in. Approve connectors per app, give each app an identity only those connectors
        accept, and carry the signed-in user's entitlements to the system of record, so an app
        never shows a user more than they could see themselves.

  - title: Treat the request as untrusted, and packages as hostile until admitted
    mitigations: [cap-input-guardrails, D3-FA, AML.M0023]
    body:
      - >-
        The request and the uploads are the agent's instructions, written by people who are not
        thinking about attackers and by whoever wrote the files they upload. Screen them at intake,
        and expect the screening to miss some. At the mirror, refuse malware, look-alike names and
        packages too new to have a history, which is what catches the names agents invent. Keep a
        bill of materials for every release, so that when a package turns bad you can find every
        app that uses it.

  - title: Give every app an owner and an end date, and look for the ones built elsewhere
    mitigations: [D3-AI, cap-agent-kill-switch, cap-shadow-ai-discovery, cap-agent-tracing]
    body:
      - >-
        Record every app with its owner, the data it may touch and an end date, and have the
        deploy gate refuse releases to an app that is unregistered or expired. At the end date the
        owner renews it against today's checks or it is taken offline, its credentials cancelled
        and its data archived; when an owner leaves, ownership passes to their manager. Keep a
        stop that takes any app offline in minutes without the factory, one record from request to
        release, and a search for apps built with AI outside the factory, because those have no
        owner, no checks and no end date at all.

sources:
  - title: "OWASP Top 10 for Agentic Applications for 2026"
    url: https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/
  - title: "Spracklen et al., We Have a Package for You! A Comprehensive Analysis of Package Hallucinations by Code Generating LLMs (USENIX Security 2025)"
    url: https://arxiv.org/abs/2406.10279
  - title: "GitHub Docs: Deployments and environments"
    url: https://docs.github.com/en/actions/reference/workflows-and-actions/deployments-and-environments
