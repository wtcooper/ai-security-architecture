      - { block: provider, service: Gemini on Agent Platform, note: "Gemini Enterprise Agent Platform, formerly Vertex AI." }
      - { block: orgData, service: Your systems of record, build: true, note: "Cloud SQL, applications on Compute Engine, systems outside Google Cloud." }
      - { block: openWeb, service: Grounding with Google Search }
