      - mitigation: cap-agent-tracing
        coverage: native
        mechanism: >-
          OpenTelemetry traces (claude_code.interaction / llm_request / tool / hook spans), metrics and log
          events exported by the CLI subprocess; W3C trace context propagated from the host application;
          OTEL_RESOURCE_ATTRIBUTES for enduser.id / tenant.id
        steps:
          - title: Turn on OTLP export
            body:
              - Set CLAUDE_CODE_ENABLE_TELEMETRY=1, OTEL_METRICS_EXPORTER / OTEL_LOGS_EXPORTER /
                OTEL_TRACES_EXPORTER=otlp and OTEL_EXPORTER_OTLP_ENDPOINT in the container environment; add
                CLAUDE_CODE_ENHANCED_TELEMETRY_BETA=1 for traces.
            url: https://code.claude.com/docs/en/agent-sdk/observability
          - title: Attribute actions to end users
            body:
              - Inject enduser.id and tenant.id through OTEL_RESOURCE_ATTRIBUTES per query() so tool_decision,
                tool_result and mcp_server_connection events form a per-user audit trail for the SIEM.
            url: https://code.claude.com/docs/en/agent-sdk/observability
          - title: Ship security events to the SIEM
            body:
              - Export OTEL_LOGS_EXPORTER=otlp with enduser.id attributes; the events are named with a
                claude_code. prefix and carry the decision source.
            url: https://code.claude.com/docs/en/agent-sdk/observability
          - title: Build detections on the exported events
            body:
              - Correlate tool_decision rejections, permission_mode_changed and mcp_server_connection events
                with enduser.id in your SIEM.
            url: https://code.claude.com/docs/en/agent-sdk/observability
        note: >-
          Traces cover interactions, model requests, tool calls and hooks with W3C correlation; content is off
          unless enabled. Emitting traces is not detection or an audit record — the collector's rules and
          retention supply those.


