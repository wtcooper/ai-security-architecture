          data: "Tool calls pass through the gateway to your backend API; tool arguments and results are not captured unless you enable payload logging for the MCP server."
          network: "Depending on tier, the instance can be injected into or integrated with a virtual network to reach private backends, and can take an inbound private endpoint."
          identity: "The instance has a system-assigned or user-assigned managed identity, and credential manager can attach OAuth tokens to the backend calls a tool makes."
          accepts: "Any HTTP-compatible REST API managed in the instance; it exposes MCP tools only, with no resources or prompts, and does not work in workspaces."
          workload: "Each tool call becomes one backend API request; policies must not read the response body, because buffering breaks the streaming that MCP needs."
          portability: "The tools exist only as API Management configuration over your API; moving off means writing an MCP server that calls the same API."
          effort: "Your team maintains the backend API, the choice of operations and the instance's policies and logging; there is no MCP server code to operate."
          fits: "Microsoft describes it for reusing APIs already managed in API Management as agent tools without building a server."
        sources:
          - https://learn.microsoft.com/en-us/azure/api-management/mcp-server-overview
          - https://learn.microsoft.com/en-us/azure/api-management/export-rest-mcp-server
          - https://learn.microsoft.com/en-us/azure/api-management/secure-mcp-servers
          - https://learn.microsoft.com/en-us/azure/api-management/monitor-mcp-servers
          - https://learn.microsoft.com/en-us/azure/api-management/manage-mcp-servers-rest-api
          - https://learn.microsoft.com/en-us/azure/api-management/virtual-network-concepts
          - https://learn.microsoft.com/en-us/azure/api-management/api-management-howto-use-managed-service-identity
          - https://learn.microsoft.com/en-us/azure/api-management/credentials-overview
          - https://learn.microsoft.com/en-us/azure/api-management/configure-service-update-settings
          - https://learn.microsoft.com/en-us/azure/api-management/expose-existing-mcp-server
        offers:
          - name: "Expose a REST API as an MCP server"
            what: "In the portal under APIs › MCP Servers you pick a managed HTTP-compatible API and the operations to expose, and API Management publishes them as tools at a server URL ending in /mcp."
            url: https://learn.microsoft.com/en-us/azure/api-management/export-rest-mcp-server
          - name: "Tool selection after creation"
            what: "The operations exposed as tools can be changed later in the Tools blade of the MCP server."
            url: https://learn.microsoft.com/en-us/azure/api-management/export-rest-mcp-server
          - name: "Policies at MCP server scope"
            what: "Policies such as rate limiting, token validation, IP filtering and caching apply to all tools of the server together, after any global policies; they cannot be set per tool."
            url: https://learn.microsoft.com/en-us/azure/api-management/mcp-server-overview
          - name: "Inbound authentication"
            what: "Callers can be required to present a subscription key or a Microsoft Entra token checked by the validate-azure-ad-token policy, and the Authorization header can be forwarded to the backend with an explicit policy."
            url: https://learn.microsoft.com/en-us/azure/api-management/secure-mcp-servers
          - name: "Credential manager for backend calls"
            what: "API Management can fetch an OAuth 2.0 token from a configured credential provider and attach it to the backend request a tool makes."
            url: https://learn.microsoft.com/en-us/azure/api-management/secure-mcp-servers
          - name: "MCP telemetry and payload logging"
            what: "Each MCP request is written to Application Insights with MCP-specific dimensions such as the tool, and logging of tool arguments and results can be switched on per MCP server."
            url: https://learn.microsoft.com/en-us/azure/api-management/monitor-mcp-servers
          - name: "Programmatic management"
            what: "MCP servers can be created and managed with the REST API, ARM templates, Bicep, the Azure CLI and Terraform, using API version 2025-09-01-preview or later."
            url: https://learn.microsoft.com/en-us/azure/api-management/manage-mcp-servers-rest-api
          - name: "Service tiers and self-hosted gateway"
            what: "MCP server features are available in the Developer, Basic, Standard and Premium tiers and the v2 tiers, and the self-hosted gateway can serve MCP servers in your own infrastructure."
            url: https://learn.microsoft.com/en-us/azure/api-management/mcp-server-overview
          - name: "Existing MCP server pass-through"
            what: "The same feature can instead front an MCP server you host elsewhere, which is how the App Service option uses API Management as the gateway."
            url: https://learn.microsoft.com/en-us/azure/api-management/expose-existing-mcp-server
