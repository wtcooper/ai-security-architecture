  - architecture: archAgentWorkflow
    asOf: "2026-11"
    verified: "2026-11-18"
    reference:
      - title: "Self-hosted Temporal Service guide"
        url: https://docs.temporal.io/self-hosted-guide
      - title: "Production Best Practices"
        url: https://docs.litellm.ai/docs/proxy/prod
      - title: "Production environment"
        url: https://kubernetes.io/docs/setup/production-environment/
    summary:
      - "Your agents run as Temporal Workers on Kubernetes in your own data centre. A self-hosted Temporal Service journals every step, LiteLLM Proxy is the one door to your vLLM models, MCP tool services and web search, and generated code runs in throwaway gVisor sandboxes. Each agent has its own service account, Keycloak client and LiteLLM key; network policy and one outbound proxy close every other path. Data, prompts and weights never leave the data centre, and the organisation carries what a cloud provider would otherwise run: hardware, the cluster, identity, keys, patching and logs."
    bindings:
      - { block: events, service: "Argo Events, Kafka and Temporal Schedules", note: "Each trigger starts a Workflow as its own Keycloak client, with write on one Temporal namespace only." }
      - { block: harness, service: "Your agents as Temporal Workers on Kubernetes", build: true, note: "One Worker deployment; each agent has its own ServiceAccount, Keycloak client and LiteLLM virtual key." }
      - { block: localTools, service: "Your handlers; agent-sandbox with gVisor for code", build: true, note: "Handlers run in the Worker. Code an agent wrote runs only in a Sandbox pod with a gVisor or Kata RuntimeClass." }
      - { block: orchestration, service: "Your supervisor as a Temporal Workflow", build: true, note: "The self-hosted Temporal Service journals and replays each step; the supervisor logic is your code." }
      - { block: subagents, service: "Your specialists as Child Workflows and Activities", build: true, note: "Each specialist calls LiteLLM with its own key and an exchanged Keycloak token for the task, never the supervisor's." }
      - { block: state, service: "Temporal history, PostgreSQL with pgvector, Valkey", note: "Event History is the journal; pgvector tables hold the index and shared memory under row security; Valkey holds session state." }
      - { block: gateway, service: "LiteLLM Proxy on Kubernetes", note: "Models, MCP servers and search tools behind virtual keys. It is the one door only if network policy allows nothing else." }
      - { block: provider, service: "vLLM on GPU nodes (NVIDIA GPU Operator)", note: "Your own open-weights models in the same data centre, called by LiteLLM as hosted_vllm/. KServe is the alternative." }
      - { block: internalTools, service: "Your MCP servers on Kubernetes", build: true, note: "Registered on LiteLLM as mcp_servers; ingress allowed from LiteLLM only; they accept an exchanged token for their own audience." }
      - { block: orgData, service: "Your systems of record", build: true, note: "Reached by tool services with the exchanged token or short-lived database credentials from the vault." }
      - { block: openWeb, service: "SearXNG (self-hosted) as a LiteLLM search tool", note: "LiteLLM search_tools with search_provider: searxng; SearXNG reaches search engines through the outbound proxy only." }
      - { block: sources, service: "Public registries (PyPI, npm)", note: "Reached only by the package mirror, through the outbound proxy." }
      - { block: registry, service: "Sonatype Nexus Repository (Community Edition)", note: "PyPI and npm proxy repositories with routing rules. Community Edition has usage caps; Pulp is the alternative." }
    sources:
      events: https://argoproj.github.io/argo-events/
      harness: https://docs.temporal.io/production-deployment/worker-deployments/worker-versioning
      localTools: https://agent-sandbox.sigs.k8s.io/
      orchestration: https://docs.temporal.io/self-hosted-guide
      subagents: https://docs.temporal.io/develop/python/workflows/message-passing
      state: https://github.com/pgvector/pgvector
      gateway: https://docs.litellm.ai/docs/proxy/deploy
      provider: https://docs.vllm.ai/en/latest/
      internalTools: https://docs.litellm.ai/docs/mcp
      orgData: https://developer.hashicorp.com/vault/docs/secrets/databases
      openWeb: https://docs.searxng.org/
      sources: https://pypi.org/
      registry: https://help.sonatype.com/en/ce-onboarding.html
    differences:
      - at: gateway->provider
        text: "The model provider is inside. LiteLLM routes to your own vLLM servers (hosted_vllm/ with an api_base in the same data centre), so no prompt or completion leaves. You carry capacity, patching and the weights yourself, and the hop is only as trusted as the vLLM API key and the network policy around it."
        url: https://docs.litellm.ai/docs/providers/vllm
      - at: harness->gateway
        text: "Nothing forces agents through LiteLLM. Kubernetes pods are non-isolated by default, so an agent could call vLLM, a tool service or the internet directly. The one door exists only once a default-deny policy leaves LiteLLM, Temporal, the memory store and the package mirror as the agents' only destinations."
        url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
      - at: gateway
        text: "LiteLLM's MCP gateway is open until a list is set: a key with no list reaches every registered server. It also has no server-side approval step per tool call. Set require_key_mcp_access_defined and per-key tool lists, and keep the approval pause in the Temporal Workflow."
        url: https://docs.litellm.ai/docs/proxy/security_owasp_llm_top10
      - at: harness
        text: "Short-lived tokens issued at the gateway are not in the open-source edition: LiteLLM's JWT-based auth needs an Enterprise licence. Each agent holds a LiteLLM virtual key, a bearer secret, so the short life comes from key expiry and rotation, and from Keycloak tokens on the tool side."
        url: https://docs.litellm.ai/docs/proxy/token_auth
      - at: orchestration->state
        text: "Temporal's defaults are open. With no Authorizer set, every API call is allowed, and step inputs and results reach Event History unencrypted unless a Payload Codec is used. Configure the JWT claim mapper against Keycloak, mTLS on the frontend, and a codec whose key stays in your vault."
        url: https://docs.temporal.io/self-hosted-guide/security
      - at: provider
        text: "vLLM's --api-key protects only the /v1, /v2, /inference and /cohere paths. Other endpoints, such as /invocations and /classify, answer without it. Treat the key as one layer and let network policy admit only LiteLLM to the vLLM pods."
        url: https://docs.vllm.ai/en/latest/usage/security/
      - at: registry
        text: "Nexus Repository Community Edition has routing rules but not the malware quarantine of Repository Firewall, which needs a paid licence, and it stops adding components above 40,000 components or 100,000 requests a day. Screening for malicious and look-alike packages is your own pipeline step."
        url: https://help.sonatype.com/en/nexus-repository-feature-matrix.html
    alsoNeeded:
      - service: "Kubernetes control plane and etcd, on your own servers"
        role: other
        why: "No provider runs the cluster: highly available control plane nodes, etcd backups, upgrades and node patching are yours."
        url: https://kubernetes.io/docs/setup/production-environment/
      - service: "GPU servers with the NVIDIA GPU Operator"
        role: other
        why: "Drivers, the container toolkit and the device plugin on every GPU node, plus capacity planning for the models the agents call many times per run."
        url: https://docs.nvidia.com/datacenter/cloud-native/gpu-operator/latest/index.html
      - service: "Keycloak"
        role: identity
        why: "Issues the agents' and operators' tokens and performs token exchange. It is not a box on this drawing but every credential hand-out depends on it."
        url: https://www.keycloak.org/
      - service: "HashiCorp Vault (or OpenBao)"
        role: secrets
        why: "Holds the LiteLLM master and salt keys, the Payload Codec key and dynamic database credentials. LiteLLM's own Vault integration is Enterprise only, so sync with the Vault Secrets Operator."
        url: https://developer.hashicorp.com/vault/docs/deploy/kubernetes/vso
      - service: "Hardware security module for the vault seal"
        role: keys
        why: "The root of every key above. OpenBao documents a PKCS#11 seal for an HSM; without one the unseal keys are a manual ceremony."
        url: https://openbao.org/docs/configuration/seal/pkcs11/
      - service: "cert-manager with an internal certificate authority"
        role: keys
        why: "TLS between agents, LiteLLM, Temporal, Keycloak and the databases, and the client certificates for Temporal mTLS, issued and renewed without a public authority."
        url: https://cert-manager.io/docs/
      - service: "Cilium and a Squid outbound proxy"
        role: network
        why: "The network policy engine and the single exit that the egress settings rely on."
        url: https://docs.cilium.io/en/stable/security/dns/
      - service: "Envoy Gateway for operator-facing endpoints"
        role: ingress
        why: "The approval service, the Temporal Web UI and the LiteLLM admin UI need an ingress with OIDC sign-in against Keycloak."
        url: https://gateway.envoyproxy.io/docs/tasks/security/oidc/
      - service: "Harbor"
        role: registry
        why: "The private registry for agent, tool and sandbox images; the cluster pulls from nowhere else."
        url: https://goharbor.io/docs/2.16.0/
      - service: "PostgreSQL operations (CloudNativePG) and Velero backups"
        role: other
        why: "Temporal history, LiteLLM keys and budgets, Keycloak and agent memory all live in PostgreSQL; replication, backup and restore tests are yours."
        url: https://cloudnative-pg.io/
      - service: "OpenTelemetry Collector, Loki and your SIEM"
        role: logging
        why: "Collects gateway, Temporal, Kubernetes audit and proxy logs and forwards them to the SIEM where detections run."
        url: https://opentelemetry.io/docs/collector/configuration/
      - service: "Time synchronisation (chrony) on every node"
        role: other
        why: "Token expiry, Temporal timers and the order of trace events all depend on clocks that agree."
        url: https://chrony-project.org/documentation.html
    quickstart:
      - title: "Deploying a Temporal Service"
        url: https://docs.temporal.io/self-hosted-guide/deployment
      - title: "Deploy with Helm"
        url: https://docs.litellm.ai/docs/proxy/deploy/helm
      - title: "Using Kubernetes"
        url: https://docs.vllm.ai/en/latest/deployment/k8s/
    settings:
      - litellmVirtualKeys
      - litellmKeyRotation
      - litellmBudgetsRateLimits
      - litellmGuardrailsInput
      - litellmGuardrailsOutput
      - litellmApplyGuardrail
      - litellmMcpGateway
      - litellmMcpToolAllowlist
      - litellmToolPermissionGuardrail
      - litellmMcpPinnedTools
      - litellmMcpTokenExchange
      - litellmLoggingCallbacks
      - temporalAuthorizer
      - temporalPayloadCodec
      - temporalApprovalUpdate
      - temporalTerminateWorkflows
      - keycloakK8sClientAuth
      - keycloakTokenExchange
      - keycloakTokenLifetimes
      - k8sNetworkPolicyDefaultDeny
      - ciliumFqdnEgress
      - egressProxyAllowlist
      - k8sRuntimeClassSandbox
      - agentSandboxShutdown
      - nexusProxyAllowlist
      - trivyScanPipeline
      - promptfooEvalGate
      - postgresRowSecurity
      - langfuseTracing
      - lokiRetentionImmutability

  - architecture: archRemoteMcpServer
    asOf: "2026-11"
    verified: "2026-11-18"
    reference:
      - title: "Integrating with Model Context Protocol (MCP) - Keycloak"
        url: https://www.keycloak.org/securing-apps/mcp-authz-server
      - title: "MCP Deployment Guide | liteLLM"
        url: https://docs.litellm.ai/docs/mcp_deployment
      - title: "Production Best Practices | liteLLM"
        url: https://docs.litellm.ai/docs/proxy/prod
    summary:
      - "Your MCP server runs as a stateless service on your own Kubernetes cluster behind Envoy Gateway and the LiteLLM MCP gateway. Keycloak signs people in and issues short-lived tokens that name this server as their audience; the gateway shows each caller only its own tools and serves pinned tool definitions; Vault issues a separate short-lived credential for each system of record. Data, prompts and tool results stay in the organisation's own data centre, and the organisation runs what a cloud provider would otherwise supply: the cluster, ingress, certificates, keys, logging and patching."
    bindings:
      - { block: idp, service: "Keycloak, federated to your corporate directory", note: "Callers from another organisation sign in at their own identity provider; your Keycloak accepts its assertion through the JWT Authorization Grant." }
      - { block: gateway, service: "LiteLLM Proxy MCP gateway behind Envoy Gateway", note: "Envoy Gateway ends TLS, checks the token's issuer and audience and applies rate limits; LiteLLM applies the per-tool rules." }
      - { block: authServer, service: "Keycloak realm as the OAuth authorization server", note: "Audience binding uses an Audience mapper; resource indicators and client ID metadata documents are experimental features." }
      - { block: service, service: "Your MCP server on Kubernetes", build: true, note: "Must check issuer, audience, expiry and scope on every call itself; the gateway in front does not replace that." }
      - { block: toolDefs, service: "Versioned tool definitions in your Git repository", build: true, note: "Released as a signed bundle (Cosign) and baked into the service image; the fingerprint recorded at review travels with the release." }
      - { block: orgData, service: "Your systems of record (PostgreSQL and internal APIs)", build: true, note: "Reached with per-system credentials from Vault; tenant separation is enforced in the handlers and again by row security." }
    sources:
      idp: https://www.keycloak.org/guides
      gateway: https://docs.litellm.ai/docs/mcp
      authServer: https://www.keycloak.org/securing-apps/mcp-authz-server
      service: https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization
      toolDefs: https://docs.sigstore.dev/cosign/signing/signing_with_blobs/
      orgData: https://www.postgresql.org/docs/current/ddl-rowsecurity.html
    differences:
      - at: callers->gateway
        text: "LiteLLM's own JWT authentication of callers needs an Enterprise licence. In the open-source build a caller presents a LiteLLM virtual key in x-litellm-api-key and its Keycloak token in Authorization, so the token's issuer and audience must be checked at Envoy Gateway and again in the MCP service."
        url: https://docs.litellm.ai/docs/proxy/token_auth
      - at: gateway->service
        text: "Nothing forces calls through LiteLLM. Unless a network policy admits only the gateway's pods, or the service verifies the gateway's signed JWT (the mcp_jwt_signer guardrail), any workload that can reach the service bypasses the per-tool rules."
        url: https://docs.litellm.ai/docs/mcp_zero_trust
      - at: gateway
        text: "LiteLLM serves model routes on the same port as MCP, and a registered MCP server is visible to external callers by default (available_on_public_internet is true). Run a separate LiteLLM deployment for the published server, or block the model routes at Envoy Gateway."
        url: https://docs.litellm.ai/docs/mcp_deployment
      - at: authServer
        text: "Keycloak supports the 2025-03-26 MCP authorization profile as shipped; later profiles are experimental. Resource indicators (RFC 8707) and client ID metadata documents must be switched on with --features, so bind the audience with an Audience mapper on a client scope until you accept those features."
        url: https://www.keycloak.org/securing-apps/mcp-authz-server
      - at: callers->idp
        text: "The identity assertion grant (ID-JAG) is experimental in Keycloak, which can only receive such a grant, not issue one, and warns against production use. For a policy-checked grant between two domains today, use Standard token exchange in the caller's realm and the JWT Authorization Grant in yours."
        url: https://www.keycloak.org/securing-apps/identity-assertion-jwt-authorization-grant
      - at: service->authServer
        text: "Revocation does not chain: revoking a caller's access token does not revoke a token already exchanged from it, and pushing a not-before policy reaches only clients that use the Keycloak adapter. Keep exchanged tokens short-lived, or have the service ask the introspection endpoint on each call."
        url: https://www.keycloak.org/securing-apps/token-exchange
    alsoNeeded:
      - service: "Kubernetes control plane and etcd, highly available"
        role: other
        why: "No provider runs the cluster for you: three control-plane nodes, etcd backups and version upgrades are your own work."
        url: https://kubernetes.io/docs/setup/production-environment/
      - service: "Public DNS, an edge load balancer and DDoS protection"
        role: ingress
        why: "A published server needs a public name and address in front of Envoy Gateway, and volumetric attacks must be absorbed before they reach the data centre."
        url: https://gateway.envoyproxy.io/docs/
      - service: "cert-manager with public and internal certificate issuers"
        role: keys
        why: "The published endpoint needs a publicly trusted certificate and every internal hop needs one from your own authority, both renewed automatically."
        url: https://cert-manager.io/docs/
      - service: "OpenBao or Vault, sealed with a hardware security module"
        role: secrets
        why: "Holds upstream credentials, the LiteLLM master and salt keys and signing keys. Vault's PKCS#11 seal needs Vault Enterprise; OpenBao offers a pkcs11 seal as a plugin."
        url: https://openbao.org/docs/configuration/seal/pkcs11/
      - service: "Keycloak in a highly available deployment"
        role: identity
        why: "Every call depends on token issue and exchange, so the authorization server needs the same availability as the service it protects."
        url: https://www.keycloak.org/high-availability/introduction
      - service: "PostgreSQL, replicated, for Keycloak and LiteLLM"
        role: other
        why: "Virtual keys, MCP permissions, pinned tool lists and Keycloak's realm data live in databases you must run, replicate and restore."
        url: https://docs.litellm.ai/docs/proxy/prod
      - service: "A Redis-compatible store (Valkey) for shared counters"
        role: other
        why: "Envoy Gateway's global rate limit and LiteLLM's limits across several replicas keep their counters in a shared store."
        url: https://gateway.envoyproxy.io/docs/tasks/traffic/global-rate-limit/
      - service: "Harbor registry with Trivy scanning"
        role: registry
        why: "The signed service and gateway images are stored, scanned and served from a registry inside the data centre."
        url: https://goharbor.io/docs/2.16.0/
      - service: "OpenTelemetry Collector, Loki, Prometheus and the SIEM"
        role: logging
        why: "Tool-call records, gateway logs and Keycloak events need a searchable store and detections that you operate."
        url: https://opentelemetry.io/docs/collector/
      - service: "Velero backups and tested restores"
        role: other
        why: "Cluster objects and volumes are not backed up unless you do it, and a restore has to be rehearsed."
        url: https://velero.io/docs/v1.19/
      - service: "Time synchronisation (chrony) on every node"
        role: other
        why: "Five-minute tokens and signed assertions fail or outlive their lifetime when clocks drift."
        url: https://chrony-project.org/documentation.html
    quickstart:
      - title: "Deploy with Helm | liteLLM"
        url: https://docs.litellm.ai/docs/proxy/deploy/helm
      - title: "MCP Overview | liteLLM"
        url: https://docs.litellm.ai/docs/mcp
      - title: "Keycloak Operator Installation - Keycloak"
        url: https://www.keycloak.org/operator/installation
    settings:
      - keycloakGroupsAccess
      - keycloakClientScopes
      - keycloakClientSignedJwt
      - keycloakTokenLifetimes
      - keycloakTokenExchange
      - keycloakCimdTrustedDomains
      - ciliumFqdnEgress
      - egressProxyAllowlist
      - k8sNetworkPolicyDefaultDeny
      - envoyGatewayJwt
      - envoyGatewayRateLimit
      - litellmVirtualKeys
      - litellmMcpGateway
      - litellmMcpToolAllowlist
      - litellmMcpPinnedTools
      - litellmBudgetsRateLimits
      - litellmKeyRotation
      - litellmLoggingCallbacks
      - otelCollectorPipeline
      - mcpToolDefinitionDigest
      - kyvernoVerifyImages
      - trivyScanPipeline
      - harborVulnerabilityGate
      - promptfooMcpRedTeam
      - postgresRowSecurity
      - mcpTenantScopedHandlers
      - vaultDynamicSecrets
      - vaultKubernetesAuth

  - architecture: archSelfHostedInference
    asOf: "2026-11"
    verified: "2026-11-18"
    reference:
      - title: "Production Best Practices"
        url: https://docs.litellm.ai/docs/proxy/prod
      - title: "Security"
        url: https://docs.vllm.ai/en/latest/usage/security.html
      - title: "Outbound Requests and Offline Mode"
        url: https://docs.litellm.ai/docs/proxy/outbound_requests
    summary:
      - "Applications call LiteLLM Proxy on Kubernetes with a virtual key per team; it applies quotas, guardrails and logging, then calls vLLM on tainted GPU nodes that only the gateway can reach. Weights enter through a separate intake job: fetched at a pinned revision through the one outbound proxy, scanned, signed, recorded in MLflow and written to a versioned Ceph bucket. vLLM starts offline and verifies the signature. Data, prompts and weights stay in the organisation's own data centre, and the organisation carries what a cloud provider would otherwise run."
    bindings:
      - { block: consumers, service: "Your applications and agents on Kubernetes", build: true, note: "Each calls LiteLLM with its own virtual key. None holds the vLLM key or has a network path to the vLLM Service." }
      - { block: gateway, service: "LiteLLM Proxy on Kubernetes (Helm chart)", note: "Needs PostgreSQL for keys, teams and spend, and Redis when more than one instance runs. Run LITELLM_OFFLINE_MODE=true." }
      - { block: api, service: "vLLM OpenAI-compatible server (ClusterIP Service)", note: "--api-key protects only the /v1, /v2, /inference and /cohere paths; network policy must keep every other caller out." }
      - { block: runtime, service: "vLLM on GPU nodes (NVIDIA GPU Operator)", note: "One Deployment per model on a tainted GPU pool, started with HF_HUB_OFFLINE=1 and a local model path." }
      - { block: storage, service: "Ceph Object Gateway weights bucket (versioned)", note: "Written only by the release job. vLLM reads a read-only volume filled from it, or streams with --load-format runai_streamer." }
      - { block: sources, service: "Hugging Face Hub (reached only by the intake job)", note: "Stays outside. An intake job downloads a pinned revision through the outbound proxy; serving nodes have no route to it." }
      - { block: registry, service: "MLflow Model Registry", note: "Holds the version, digest, scan result and approval for each release, whether trained in-house or taken from the Hub." }
    sources:
      consumers: https://docs.litellm.ai/docs/proxy/virtual_keys
      gateway: https://docs.litellm.ai/docs/proxy/deploy/helm
      api: https://docs.vllm.ai/en/latest/serving/online_serving/
      runtime: https://docs.vllm.ai/en/latest/deployment/k8s.html
      storage: https://docs.ceph.com/en/latest/radosgw/
      sources: https://huggingface.co/docs/hub/index
      registry: https://mlflow.org/docs/latest/ml/model-registry/
    differences:
      - at: gateway->api
        text: "Nothing in Kubernetes puts LiteLLM in the path. Pods are non-isolated by default, so any pod in the cluster can call the vLLM Service directly and skip identity, quotas, guardrails and logging. The drawing holds only with a default-deny policy that admits the gateway's pods alone to the serving namespace."
        url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
      - at: api
        text: "vLLM has no authentication unless --api-key is set, and the key then covers only the /v1, /v2, /inference and /cohere paths. /invocations, /pooling, /classify, /score, /rerank, /tokenize and /metrics stay open, and vLLM's own guide says not to rely on the key alone. Treat network policy as the control and the key as a second lock."
        url: https://docs.vllm.ai/en/latest/usage/security.html
      - at: runtime
        text: "Out of the box vLLM collects anonymous usage data (VLLM_USAGE_STATS_SERVER defaults to https://stats.vllm.ai) and, given a Hub model id, downloads weights at start. With no route out, both must be switched off: VLLM_NO_USAGE_STATS=1, DO_NOT_TRACK=1, HF_HUB_OFFLINE=1 and a local model path."
        url: https://docs.vllm.ai/en/latest/configuration/env_vars.html
      - at: gateway
        text: "LiteLLM Proxy makes outbound requests by default: the model cost map and other catalogues from raw.githubusercontent.com, a latest-release lookup at docs.litellm.ai and api.github.com, a breached-password check and tokeniser downloads from huggingface.co. LITELLM_OFFLINE_MODE=true stops them, and it works only as an environment variable, not in config.yaml."
        url: https://docs.litellm.ai/docs/proxy/outbound_requests
      - at: sources->storage
        text: "The serving network has no route to the Hub, so weights cannot be pulled the way the drawing suggests. An intake job in its own namespace runs hf download with --revision pinned to a commit through the outbound proxy; the files are scanned, signed and copied to the Ceph bucket. No GPU node ever calls the Hub."
        url: https://huggingface.co/docs/huggingface_hub/guides/cli
      - at: gateway
        text: "Several gateway controls are LiteLLM Enterprise features: JWT or OIDC sign-in of callers against Keycloak, the built-in HashiCorp Vault secret manager, key regeneration and scheduled rotation, allowed_routes and audit logs. The open-source build uses virtual keys, secrets synced from Vault and path rules at the ingress instead."
        url: https://docs.litellm.ai/docs/proxy/token_auth
      - at: storage->runtime
        text: "vLLM loads whatever is at the model path; its documentation describes no signature or digest check. Verification at load exists only if you add it: an init container that runs model_signing verify with the release key and stops the pod on a mismatch."
        url: https://github.com/sigstore/model-transparency
    alsoNeeded:
      - service: "Kubernetes control plane you operate"
        role: other
        why: "A cloud runs the API servers and etcd for you. Here you run at least three control plane machines, a load balancer in front of the API server, regular etcd backups and every upgrade."
        url: https://kubernetes.io/docs/setup/production-environment/
      - service: "GPU servers with the NVIDIA GPU Operator"
        role: other
        why: "Drivers, container toolkit and device plugin are yours to install and patch. With no route out, the operator's images and the driver packages come from your own registry and package mirror."
        url: https://docs.nvidia.com/datacenter/cloud-native/gpu-operator/latest/install-gpu-operator-air-gapped.html
      - service: "Harbor registry with Trivy"
        role: registry
        why: "The only image source the nodes can reach. LiteLLM, vLLM and operator images arrive through proxy cache projects, are scanned there and are pulled by digest."
        url: https://goharbor.io/docs/latest/administration/configure-proxy-cache/
      - service: "Keycloak"
        role: identity
        why: "Sign-in for the people who administer the gateway, registry and cluster, and the OpenID Connect provider the object gateway trusts when it issues temporary credentials."
        url: https://www.keycloak.org/docs/latest/server_admin/
      - service: "HashiCorp Vault (or OpenBao) with a hardware security module"
        role: secrets
        why: "Holds every secret and key the platform needs and must itself be unsealed, backed up and audited. PKCS11 auto-unseal needs Vault Enterprise; OpenBao offers a pkcs11 seal through its KMS plugin."
        url: https://developer.hashicorp.com/vault/docs/configuration/seal/pkcs11
      - service: "cert-manager with an internal certificate authority"
        role: keys
        why: "Issues and renews the TLS certificates for every service inside the boundary; there is no public certificate service to lean on."
        url: https://cert-manager.io/docs/
      - service: "Cilium and a Squid outbound proxy"
        role: network
        why: "Cilium enforces the network policies; Squid is the one exit, used only by intake jobs. Firewalls, routing and internal DNS around them are also yours."
        url: https://docs.cilium.io/en/stable/security/policy/index.html
      - service: "Envoy Gateway"
        role: ingress
        why: "Terminates TLS and routes consumers to LiteLLM's inference paths only. Ingress NGINX was retired in March 2026 and receives no further fixes, so do not build on it."
        url: https://gateway.envoyproxy.io/docs/
      - service: "PostgreSQL and Redis for LiteLLM"
        role: other
        why: "Virtual keys, teams, budgets and spend live in PostgreSQL, and Redis 7 or newer is needed once more than one proxy instance runs. Both need patching, TLS and backup."
        url: https://docs.litellm.ai/docs/proxy/prod
      - service: "OpenTelemetry Collector, Loki and the SIEM"
        role: logging
        why: "Nothing collects logs unless you run it: the collector gathers gateway, cluster audit and workload records, Loki keeps them, and the SIEM holds the detections."
        url: https://opentelemetry.io/docs/collector/
      - service: "Velero and off-site backup"
        role: other
        why: "Backs up cluster resources and persistent volumes; the buckets, databases and the vault need their own backup and restore tests."
        url: https://velero.io/docs/main/
      - service: "Time sync, power, cooling and physical security"
        role: other
        why: "Token expiry, certificates and log order depend on synchronised clocks (chrony). Access to the halls, hardware disposal and spare capacity are now part of protecting the model."
        url: https://chrony-project.org/
    quickstart:
      - title: "Deploy with Helm"
        url: https://docs.litellm.ai/docs/proxy/deploy/helm
      - title: "Using Kubernetes"
        url: https://docs.vllm.ai/en/latest/deployment/k8s.html
      - title: "Install NVIDIA GPU Operator in Air-Gapped Environments"
        url: https://docs.nvidia.com/datacenter/cloud-native/gpu-operator/latest/install-gpu-operator-air-gapped.html
    settings:
