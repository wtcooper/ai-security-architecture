            url: >-
              https://support.claude.com/en/articles/13455879-use-claude-cowork-on-team-and-enterprise-plans
          - title: Allowlist hosts on third-party deployments
            body:
              - Set coworkEgressAllowedHosts in Claude Desktop on 3P managed configuration.
            url: https://claude.com/docs/third-party/claude-desktop/configuration
        note: >-
          Native by the rule: an admin-set domain allowlist members cannot change, enforced around the commands
          the agent executes. Outside it: web fetch and web search (server-side; turn web search off at
          Organization settings > Capabilities), connectors and MCP servers including Claude in Chrome, plugin MCP
