id: archEnterpriseAiChat
surface: surfaceSaas
rank: 1
title: Enterprise AI chat with connectors
abbrev: Enterprise chat

summary:
  - >
    A general-purpose assistant subscription for the workforce, where each user connects their own
    data sources and uploads their own files. The grant model is per user and per connector, which
    makes the organisation's total exposure a sum nobody computes.

description:
  - >
    Both grant models live in this one product now, and the archetype covers both. An
    administrator can attach corpus-wide connectors once — the old tenant-assistant pattern,
    merged into this page — and each user authorises their own besides: a repository, a
    drive, a ticket system. The admin-granted class is a permissions-governance problem with
    one accountable decision behind it; the user-granted class makes the organisation's data
    path the union of thousands of individual modal-dialog decisions. Any single grant is
    usually appropriate; what nobody has is the aggregate, which makes the archetype's core
    problem visibility rather than permission.
  - >
    File upload is the parallel path and often the larger one. A user pasting a document into a
    chat window has moved data across the boundary with no connector, no grant and no record
    beyond what inspection catches. Every control that watches connectors misses this entirely,
    which is why in-browser and network inspection carry more weight here than the vendor's own
    administrative surface does.
  - >
    The remaining structural question is the boundary between the enterprise tenant and the
    consumer product. The same vendor typically offers both, the consumer one has different
    retention and training terms, and the difference between being in your tenant and being
    signed into a personal account is a session cookie. Tenant restriction enforced at the edge is
    what makes the enterprise agreement — retention limits, training opt-out, audit export —
    apply to the traffic at all.

distinguishedBy:
  - >
    Against the UI/low-code managed agent runtime: building is incidental and admin-gated here.
    Every exemplar now lets a user assemble a custom agent from prompts and actions, but the
    product is the assistant, the workforce is the user base, and the control set is tenant
    configuration, discovery and aggregate visibility. When the population of user-built
    agents becomes the concern, read the low-code sibling.
  - >
    Against the API/SDK managed agent runtime: no definition, no deploy edge, no delivery
    pipeline — the vendor ships the whole behaviour and the customer configures a tenant. What
    survives of "our controls" is the crossing back into our systems and the governance band,
    which is why those carry this page's weight.

exemplars:
  - name: ChatGPT Enterprise
    note: >
      The workforce assistant subscription with per-user connector authorisation, tenant
      retention and training controls, and a consumer sibling one login away — the shape this
      page draws, feature for feature. Verify connector policy and audit-export behaviour per
      edition.
    url: https://openai.com/chatgpt/enterprise/
    asOf: "2026-09"
  - name: Claude Enterprise
    note: >
      The same archetype with tenant-managed retention, SSO and connector controls — and the
      customer-managed-key trade-off this page's key-management note records is the class of
      caveat to verify here per product.
    url: https://www.anthropic.com/enterprise
    asOf: "2026-09"
  - name: Microsoft 365 Copilot
    note: >
      The admin-granted end of the spectrum: corpus-wide grounding attached by tenant
      administrators, with user-level connectors beside it — the merged tenant-assistant
      pattern, and the archetype the zero-click exfiltration incidents were published against.
    url: https://learn.microsoft.com/en-us/copilot/microsoft-365/
    asOf: "2026-09"

zones:
  - id: zoneUser
    owner: user
    note: The employee, and the prompt and attachment they are about to send somewhere else.
  - id: zoneEndpoint
    owner: endpoint
    note: >
      The managed device. There is one thing on it and it is a browser — the vendor's client,
      running where we can at least see it.
  - id: zoneVendor
    owner: vendor
    note: >
      The vendor's assistant backend under an enterprise agreement. Drawn to the left of our
      own band because that is the direction of the work: the employee reaches the vendor
      first, and the vendor reaches back into us second. One block, deliberately — how they
      build their harness is assured, not drawn.
  - id: zoneCloud
    owner: cloud
    note: >
      What we still run, and the reason this is not simply a picture of a SaaS product: our
      own gateway and tool services, which the vendor's product can be pointed at so an
      employee's chat can reach our internal MCP servers.
  - id: zoneExternal
    owner: external
    note: >
      The same vendor's unmanaged offering, one login away and carrying none of the enterprise
      terms — and the services each employee connects on their own authority, some of them our
      own tenants under our agreement, the rest with none.
  - id: zoneGovernance
    owner: governance
    note: >
      On a bought product this band and the tenant configuration are the entire control set.
      Everything else is assurance.

blocks:
  - id: employee
    kind: actor
    title: Employee
    icon: person
    zone: zoneUser
    col: 0
    row: 1
    note: >
      The person, and the party who decides how much context to paste in. Every control on this
      page is downstream of a judgement they already made.

  - id: browser
    kind: service
    title: Browser
    cosaiComponent: componentAgentUserQuery
    zone: zoneEndpoint
    col: 1
    row: 1
    note: >
      The vendor's client on a device we manage — a browser tab, or their desktop app. It is
      not a surface we built and it does nothing we control; it is drawn because it is the last
      place the material is still on our equipment.
    items:
      - id: session
        label: Browser / client
        icon: chat
        note: Where the prompt is typed.
      - id: uploads
        label: File upload
        icon: doc
        note: >
          The parallel path and often the larger one: a document pasted or attached crosses
          the boundary with no connector, no grant and no record beyond what inspection
          catches.

  - id: vendor
    kind: provider
    title: Vendor chat service
    cosaiComponent: componentApplication
    zone: zoneVendor
    col: 2
    row: 1
    note: >
      Their backend and the published surfaces of its control plane. One block on purpose: what
      they run inside it is assured through assessment, never drawn — the rule that stops this
      page becoming a guess about somebody else's architecture.
    items:
      - id: tenantConfig
        label: Tenant configuration
        icon: gear
        note: >
          Retention, training use, connector policy — including the admin-granted corpus-wide
          connectors — and the admin toggles that are the zone-2 surface.
      - id: agentModes
        label: Agent modes
        icon: agent
        note: >
          The vendor's agentic features — scheduled tasks, code execution, autonomous research
          — each a tenant toggle that changes the risk profile of every session.
      - id: tenantCorpus
        label: Tenant corpus
        icon: db
        note: >
          The admin-granted corpus — the mailbox, drive and site indexes the assistant grounds
          on inside the vendor's own tenant. No connector, no tunnel and no gateway are on this
          path; it is where the zero-click exfiltration incidents actually ran, and the
          primary control on it is what the tenant admin granted.
      - id: auditExport
        label: Session audit export
        icon: eye
        note: Their record of what was asked, which is not ours until it is exported.

  - id: tunnel
    kind: service
    title: Tunnel connector
    cosaiComponent: componentAgentUserQuery
    zone: zoneCloud
    col: 3
    row: 2
    note: >
      Vendor-supplied software we run inside our own network so their cloud can reach an MCP
      server that is not publicly exposed. The topology is inverted and outbound-only: this
      client long-polls the vendor for work and posts results back, so no inbound firewall rule
      is opened and the MCP server stays on a private address.
      Two things it does not do, both from the vendor's own architecture notes. It does not
      make the data path local — requests, responses and auth artifacts still traverse their
      cloud — and it does not authenticate to our MCP server, which we still do ourselves. The
      runtime credential on this host is the load-bearing secret.
    items:
      - id: tunnelClient
        label: Outbound connector
        icon: plug
        note: Long-polls the vendor for work; opens nothing inbound.

  - id: aiGateway
    kind: service
    title: AI gateway
    zone: zoneCloud
    col: 3
    row: 1
    note: >
      Where a vendor-hosted chat is admitted into our systems, and the only component on that
      path we operate. Everything about what the product may reach — which servers, on whose
      grant, recorded by whom — is decided here rather than in their console.
    items:
      - id: gwTools
        label: MCP & API gateway
        icon: plug
        note: Which of our servers the vendor's assistant may reach, and on whose grants.

  - id: internalTools
    kind: service
    title: Tool services
    cosaiComponent: componentTools
    zone: zoneCloud
    col: 4
    row: 1
    pack: toolServicesRemote
    note: >
      Our own MCP servers and connectors, offered to a product we did not build. This is the
      thing the tunnel exists for.

  - id: orgData
    kind: external
    title: Enterprise data
    cosaiComponent: componentDataSources
    zone: zoneCloud
    col: 4
    row: 2
    pack: enterpriseData
    note: The systems of record behind those servers, reached on grants we scope and record.

  - id: consumerTenant
    kind: external
    title: Consumer product
    cosaiComponent: componentApplication
    zone: zoneExternal
    col: 5
    row: 0
    note: >
      The same client, a personal login, and none of the enterprise terms — different
      retention, different training use, a tenant we cannot enumerate or export. The sharpest
      control on this page is simply telling the two apart.
    items:
      - id: personal
        label: Personal accounts
        icon: person
        note: Indistinguishable from sanctioned use at the keyboard, and entirely different in contract.

  - id: extTools
    kind: service
    title: Tool services
    cosaiComponent: componentTools
    zone: zoneExternal
    col: 5
    row: 3
    pack: toolServicesRemote
    note: >
      Services each employee connects on their own authority — two classes wearing one
      block. Our own SaaS tenants sit under our agreement and their admin-consent policy is
      our lever; unassessed third parties have neither. The union of the individual consents
      is the organisation's real data path, and nobody chose it.

  - id: govIdentity
    kind: governance
    title: Identity services
    icon: person
    zone: zoneGovernance
    col: 0
    row: 4
    capabilities: [capabilityIga]
    note: >
      Which tenant an employee lands in, enforced by domain capture and forced account
      consolidation. The single most consequential control here — and one that governs only
      accounts on domains we own. A personal address on a corporate device is a proxy problem,
      not a tenant one.

  - id: govSecrets
    kind: governance
    title: Secrets & key management
    icon: key
    zone: zoneGovernance
    col: 2
    row: 4
    capabilities: [capabilitySecretsManagement, capabilityEncryptionKeyManagement]
    note: >
      The tunnel host's runtime credential — the load-bearing secret on the one path we run —
      and customer-managed keys over the vendor's storage, with their cost recorded: on at
      least one vendor, enabling them disables conversation search, project retrieval and
      audit log export.

  - id: govPolicy
    kind: governance
    title: Policy & authorization
    icon: scale
    zone: zoneGovernance
    col: 3
    row: 4
    capabilities: [capabilitySse, capabilityAiDlp, capabilityDataAccessGovernance]
    note: >
      What may leave, inspected on the one path we can see, plus the tenant policy that
      decides retention and training use — authored here, enforced at the browser and the
      vendor's configuration surface.

  - id: govSupplyChain
    kind: governance
    title: Supply-chain assurance
    icon: db
    zone: zoneGovernance
    col: 4
    row: 4
    capabilities: [capabilityAiTprm, capabilityAgentRegistry]
    note: >
      The vendor assessment, and the connector inventory. Their internals are assured here
      rather than drawn anywhere, which is the whole of what a bought product allows.

  - id: govObservability
    kind: governance
    title: Observability & response
    icon: eye
    zone: zoneGovernance
    col: 5
    row: 4
    capabilities: [capabilityAuditLogging, capabilityShadowAiDiscovery, capabilityKillSwitch]
    note: >
      Their export fused with our own record, and the discovery of the personal accounts nobody
      enrolled. The second is usually the larger number.

edges:
  - from: employee
    to: browser
    path: primary
    bidir: true
    label: prompt & attachment
    note: The question, the pasted excerpt and the uploaded file — the moment the material leaves the person.
  - from: browser
    to: vendor
    path: external
    bidir: true
    label: to the corporate tenant
    note: >
      Straight out to the vendor, bypassing our cloud entirely, which is why our band sits to
      the right of theirs rather than between. Allowlisted because an assessment cleared it,
      governed by the agreement once it arrives rather than inspected on the way.
  - from: browser
    to: consumerTenant
    path: external
    route: vh
    label: blocked or logged
    note: >
      The same client with a personal login. Retention, training use and tenancy all differ,
      and distinguishing the two at this point is the control the archetype turns on.
  - from: vendor
    to: tunnel
    path: external
    bidir: true
    label: outbound-only tunnel
    route: vh
    note: >
      Their cloud reaching our internal MCP servers through software they publish and we run.
      Note the direction: our side dials out and polls, so nothing is opened inbound and the
      server stays private.
  - from: tunnel
    to: aiGateway
    label: tool call / result
    path: primary
    bidir: true
    note: The tunnel hands to our gateway rather than reaching past it into the tool surface directly.
  - from: aiGateway
    to: internalTools
    path: primary
    bidir: true
    label: brokered tool calls
    note: Which of our servers a vendor product may call, on grants we issue and record.
  - from: internalTools
    to: orgData
    path: primary
    bidir: true
    label: scoped reads & writes
    note: The systems of record behind our own MCP servers.
  - from: vendor
    to: extTools
    path: external
    bidir: true
    label: user-authorised connectors
    route: vh
    note: >
      The vendor's backend reaching services each employee connected individually. This path
      never touches our network, so no component of ours can sit on it — the limitation is
      recorded rather than papered over.

pins:
  risks:
    - risk: riskSensitiveDataDisclosure
      at: browser->vendor
      note: >
        More context leaves than the task needed, and it leaves under whatever terms the tenant
        was configured with. Once the session is pinned TLS to an approved destination, nothing
        we run can see how much.
    - risk: riskShadowAndUnknownAgents
      at: browser->consumerTenant
      note: >
        Same software, personal login, no enterprise terms. Domain capture governs accounts on
        our domains and nothing else, so a personal address on a managed device is invisible to
        every tenant-side control.
    - risk: riskAgenticDelegationConfusedDeputy
      at: tunnel
      note: >
        A vendor-hosted assistant exercising our authority against our own MCP servers. The
        grant is what bounds it, and our gateway is what issues the grant.
    - risk: riskExcessiveDataHandlingDuringInference
      at: aiGateway->internalTools
      note: A chat product with connector access reads far more than any single question warranted.
    - risk: riskPromptInjection
      at: vendor->extTools
      note: >
        A document planted in any connected source returns into the conversation as model
        input — the zero-click exfiltration class published against exactly this archetype,
        arriving on a path nothing of ours can inspect.
    - risk: riskStaleAgentIdentityBinding
      at: vendor->extTools
      note: >
        A connector grant that outlives the person who authorised it keeps flowing — the
        dormant integration credentials the joined breach lineage turned on.
    - risk: riskToolSourceProvenance
      at: vendor->extTools
      note: >
        The vendor's connector gallery mixes vendor-published connectors with third-party MCP
        servers any user can install, and the description a connector publishes is what the
        assistant reads as instruction. Provenance of what is in the gallery is the vendor's
        claim, checked by nobody on our side.
    - risk: riskRogueActions
      at: internalTools->orgData
      note: Writes into systems of record from a conversation nobody else read.
    - risk: riskPromptInjection
      at: internalTools->orgData
      note: >
        Our own records ground the vendor's answers, and many hands wrote them — the internal
        return is untrusted input to a loop we cannot see.
    - risk: riskRetrievalVectorStorePoisoning
      at: vendor
      note: >
        The assistant indexes connected mailboxes and drives; a planted document persists in
        their retrieval and fires on later queries — the persistence half of the injection
        story, distinct from the transient return.
    - risk: riskCrossTenantCredentialPropagation
      at: tunnel
      note: >
        The runtime credential on the tunnel host is the load-bearing secret on this path — a
        stolen token here propagates our authority through infrastructure nobody watches.

    - risk: riskPromptInjection
      at: vendor
      note: >
        A document anyone could write into the admin-granted corpus is retrieved as grounding
        and read as instruction — the transient half of the injection story, on a path nothing
        of ours touches.
  capabilities:
    - capability: capabilityIga
      at: browser->vendor
      note: >
        Verified domains, forced consolidation and SSO so an employee lands in the corporate
        tenant by construction. The control that decides which of the two paths on this page a
        session takes.
    - capability: capabilitySse
      at: browser
      note: >
        The one path we can inspect, and only in the sense of admitting the destination — a
        pinned session to an approved vendor is not readable, and pretending otherwise would
        assert a control nobody operates.
    - capability: capabilityAiDlp
      at: employee->browser
      note: Classification before the material leaves the person, because after this hop it is somebody else's.
    - capability: capabilityBrowserDetectionResponse
      at: browser
      note: >
        In-browser inspection of pastes and uploads — the only record this path produces,
        because the session past the browser is pinned and unreadable.
    - capability: capabilityEgressControl
      at: browser
      note: >
        Restricting which tenant is reachable from a corporate network. One vendor supports a
        workspace-restriction header for exactly this; without it the enterprise terms are
        effectively optional on any device we do not inspect.
    - capability: capabilityAiGovernancePlatform
      at: vendor
      note: >
        The tenant configuration itself — agent modes, connector policy, retention, training
        use. Zone-2 controls: theirs to implement, ours to set, and the only surface of their
        product we can actually operate.
    - capability: capabilityHitlControls
      at: aiGateway->internalTools
      note: >
        Write-capable connectors gated on approval, bound to the exact action — surfaced
        through the protocol's elicitation into the vendor's client, enforced by our gateway
        refusing the write without it. A chat that can read is a disclosure question; a chat
        that can write is an action question.
    - capability: capabilityPromptInjectionDefense
      at: vendor
      note: >
        The vendor's own returned-content defenses, configured as zone 2 — theirs to
        implement, ours to switch on and verify in assessment, because nothing on the
        connector path is ours to inspect.
    - capability: capabilityNhiManagement
      at: vendor
      note: >
        Each connector grant is a non-human identity with its own lifecycle — inventoried and
        expired through the tenant's connector administration, or it outlives the person who
        authorised it.
    - capability: capabilityVendorAssurance
      at: vendor
      note: >
        Continuous posture over the tenant: configuration drift detection and the vendor's
        audit stream ingested as it changes — the standing counterpart to the point-in-time
        assessment, and the practical substitute for every control we cannot deploy inside
        someone else's product.
    - capability: capabilityDspm
      at: orgData
      note: >
        Know what is behind the connectors before attaching them. Classification is what turns
        "the assistant can reach the drive" into a decision rather than a discovery.
    - capability: capabilityAiTprm
      at: vendor
      note: >
        Their controls, retention terms and tenancy assured through assessment rather than
        drawn — the only representation a vendor-internal control gets.
    - capability: capabilityEncryptionKeyManagement
      at: vendor
      note: >
        Customer-managed keys over their storage, with the trade-off recorded rather than
        assumed: on at least one vendor this disables conversation history search, project
        knowledge retrieval and audit log export.
    - capability: capabilitySecretsManagement
      at: tunnel
      note: >
        The tunnel carries traffic but does not authenticate to our server — we still do that
        ourselves — and the runtime credential sitting on the tunnel host is the load-bearing
        secret on this path.
    - capability: capabilityToolPermissionScoping
      at: aiGateway->internalTools
      note: Which of our MCP servers the product may reach, and on whose grant, decided at our tier.
    - capability: capabilityDataAccessGovernance
      at: internalTools->orgData
      note: Scoped, recorded access to the systems of record behind our servers.
    - capability: capabilityAgentRegistry
      at: govSupplyChain
      note: >
        The connector inventory — which sources users attached on their own authority, and
        which corpora administrators granted. We cannot sit on those paths, so knowing what
        is on them is the control.
    - capability: capabilityAuditLogging
      at: govObservability
      note: Their export fused with our gateway's record; a trail only in their console is one we cannot query.
    - capability: capabilityShadowAiDiscovery
      at: govObservability
      note: Finding the personal accounts and unsanctioned connectors nobody enrolled.

    - capability: capabilityDataAccessGovernance
      at: vendor
      note: >
        The scope of the admin-granted corpus — which sites, drives and mailboxes the assistant
        may index, per user's own permissions — is the primary control on a vendor assistant
        grounding on our tenant.
    - capability: capabilityDspm
      at: vendor
      note: >
        Classification and oversharing findings across the corpus the assistant can reach,
        because the assistant surfaces whatever the permissions already allowed.
    - capability: capabilityIga
      at: extTools
      note: >
        Admin consent on the target tenant — our own workspace, code-hosting or CRM tenant
        decides whether the chat vendor's app may be granted at all. The only customer
        enforcement point on a SaaS-to-SaaS grant.
    - capability: capabilityKillSwitch
      at: govObservability
      note: >
        Disable the app in the tenant and revoke every connector grant — the SaaS form of the
        stop, and the response the departed-author and shadow-account scenarios actually invoke.
    - capability: capabilityPromptInjectionDefense
      at: aiGateway
      note: >
        Records read through our gateway are classified before they go back to the vendor's
        cloud as grounding — the one return leg we can inspect.
walkthrough:
  title: An employee asks the assistant a work question
  moves: >-
    A question from a managed browser to a vendor's assistant, answered from our own systems.
  steps:
    - follow: employee->browser
      label: question (enterprise tenant)
      note: >
        Typed into the managed browser, signed in with the enterprise tenant — the one control
        that separates this from the walk below it.
    - follow: browser->vendor
      label: to vendor service
      note: >
        Out to the vendor's service. Nothing of ours sits on this hop; what governs it is the
        agreement and the tenant configuration, not a tier we run.
    - follow: vendor->extTools
      label: user-authorised connectors
      note: >
        Their connectors reach services each employee authorised individually — a path that
        never touches our network, so the only levers are the connector policy in their
        tenant configuration and the inventory we keep ourselves.
    - follow: extTools->vendor
      label: connector content
      note: What those services return enters the assistant's context.
    - follow: vendor->tunnel
      label: tunnel request
      note: >
        To answer, their cloud reaches back through software they publish and we run —
        outbound-only, so nothing is opened inbound. The data path is not local, and the
        tunnel does not authenticate for us.
    - follow: tunnel->aiGateway
      label: across our edge
      note: Across our edge, which is the first and only control of ours on the whole journey.
    - follow: aiGateway->internalTools
      label: admitted, scoped grant
      note: Admitted against the catalogue and narrowed to a grant scoped to this employee.
    - follow: internalTools->orgData
      label: grounding records
      note: The records that ground the answer, read on our terms and recorded on our side.
    - follow: orgData->internalTools
      label: records
      note: The records come back.
    - follow: internalTools->aiGateway
      label: recorded read
      note: Through our gateway, which is where the read is recorded.
    - follow: aiGateway->tunnel
      label: into connector
      note: And into the connector, bound for their cloud.
    - follow: tunnel->vendor
      label: grounded result
      note: The grounded result travels back the way the request came, through the tunnel we run.
    - follow: vendor->browser
      label: assembled answer
      note: Their service assembles the answer and returns it to the client.
    - follow: browser->employee
      label: answer
      note: And to the person who asked — the whole round trip crossing ours exactly once.

scenarios:
  - title: An employee pastes a contract into the assistant
    steps:
      - follow: employee->browser
        label: contract pasted
        note: >
          The material leaves the person — and this hop is the only one where classification
          can still read it. Whatever the browser-side inspection misses is gone.
      - follow: browser->vendor
        label: pinned session, unreadable
        note: >
          Out to the corporate tenant on a pinned session the network can admit but not read:
          the paste produces no record anywhere we can query, which is the mechanism — not a
          breach, a blind spot the agreement papers over.
  - title: The same person, signed in personally
    steps:
      - follow: employee->browser
        label: same client, personal login
        note: >
          Identical software, identical interface, one different login. Telling the two
          walks apart is most of what governing a bought product means.
      - follow: browser->consumerTenant
        label: no enterprise terms
        note: >
          A personal login, and none of the enterprise terms follow. If the address is not on a
          domain we verified, no tenant-side control sees this at all.
  - title: The assistant queries an internal system
    steps:
      - follow: vendor->tunnel
        label: request through tunnel
        note: Their cloud asks for work through the connector we run inside our network.
      - follow: tunnel->aiGateway
        label: to our gateway
        note: Handed to our gateway rather than reaching past it.
      - follow: aiGateway->internalTools
        label: admitted, scoped
        note: Admitted to a named server on a scoped grant, and recorded.
      - follow: internalTools->orgData
        label: read on our side
        note: The read happens on our side of the boundary, which is the only reason it is bounded at all.

deviations:
  - subject: The vendor band is drawn before our cloud band
    reason: >
      Band order is left-to-right by convention; here the vendor sits first because that is
      the direction of the work — the employee reaches the vendor first, and the vendor
      reaches back into us second. The same break, for the same reason, as both SaaS
      siblings.
  - subject: The tunnel absorbs secrets consumption
    reason: >
      capabilitySecretsManagement is embodied by the AI gateway, but the load-bearing secret
      on this path is the runtime credential on the tunnel host — the pin sits where the
      credential lives, the management story in the governance call-out. Consumption here,
      issuance and rotation there.
  - subject: The AI gateway carries tool and data traffic only
    reason: >
      The vendor calls its own model inside its own cloud — no Model provider block exists on
      this drawing — and nothing fetches skills through our crossing. The gateway is drawn
      with its one real traffic class rather than the registered aiGatewayTraffic pack,
      following the low-code builder's precedent: the honest signal that a gateway is not on
      the model path is its own contents.
  - subject: Inline inspection and egress control are pinned on the browser with no secure-edge component drawn
    reason: >
      On a bought product there is no tier of ours between the client and the vendor, and
      drawing one would assert a control nobody operates. What actually exists is inspection at
      the network or in the managed browser, so capabilitySse, capabilityEgressControl and the
      browser-side detection pin sit on the browser block and the absorption is recorded here. A previous version of this drawing invented an
      "Identity & secure edge" component to satisfy the same pin; that component was a control
      wearing a component's name and has been removed.
  - subject: No customer MCP gateway is drawn on the connector path
    reason: >
      The dominant connector class is user-authorised SaaS-to-SaaS — the vendor's broker
      calling another vendor's API on a grant the user issued — and no customer component can
      sit on that path. The organisation's MCP gateway governs the other class, custom
      connectors into org systems: that admission is carried here by the tenant connector
      allowlist and the grant pins rather than a block. Where custom connectors into org
      systems dominate a deployment, read the API/SDK managed runtime's drawing, which draws
      the gateway explicitly.

