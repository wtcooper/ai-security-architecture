# EXAMPLE enterprise layer. Per capability (data/overlay/capabilities.yaml ids), per surface, the
# technology the organisation deploys around its AI tools and whether it is in place. This is the
# only source of the status shown on the Capabilities tab and beside the enterprise-capability
# modules on each architecture's Tools tab. One vocabulary everywhere: enabled | inProgress | gap;
# a capability × surface not listed reads as a gap when "Show status" is on. (This file is the
# shipped example; replace it in data/org/local/.)
capabilities:
  AML.M0020:
    surfaceEndpoint:
      status: inProgress
      technology: Example endpoint DLP agent
      note: >-
        Capability scope changed: reassess this function. Retained configuration and evidence describe the
        former capability, not verified coverage of every replacement.


        [capabilityAiDlp] Inspects prompts and uploads in the browser and the desktop apps.


        [capabilityPromptInjectionDefense] No runtime guardrail in front of the endpoint agents.
      migration:
        from:
          - capabilityAiDlp
          - capabilityPromptInjectionDefense
        reviewRequired: true
        original:
          - capability: capabilityAiDlp
            status: enabled
            technology: Example endpoint DLP agent
            note: Inspects prompts and uploads in the browser and the desktop apps.
          - capability: capabilityPromptInjectionDefense
            status: gap
            note: No runtime guardrail in front of the endpoint agents.
    surfaceSaas:
