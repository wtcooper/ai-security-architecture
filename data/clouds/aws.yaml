implementations:
  - architecture: archChatAgent
    asOf: "2026-10"
    # >>> checked against the vendor's documentation
    verified: "2026-11-18"
    sources:
      entry: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html
      events: https://docs.aws.amazon.com/scheduler/latest/UserGuide/what-is-scheduler.html
      agent: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agents-tools-runtime.html
