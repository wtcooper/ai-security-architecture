      - title: AI gateway capabilities in Azure API Management
        url: https://learn.microsoft.com/en-us/azure/api-management/genai-gateway-capabilities
    summary:
      - >-
        Your own agent on Azure Container Apps, started by a Service Bus queue message rather than a
        person, reaching models and tools through API Management and leaving the virtual network only
        through Azure Firewall. Azure's orchestration guide calls this a single agent with tools —
        the right default before any multiagent pattern. Approvals above the threshold go to an
        operator queue; below it, the action's compensating transaction is the safety net.
    bindings:
      - { block: events, service: "Azure Service Bus queues and Container Apps jobs", note: "The only way in: each message carries the grant the run acts on. Event Grid is not a documented Container Apps trigger; an event-driven job runs per queue message and a scheduled job covers timers." }
      - { block: planner, service: Your agent on Azure Container Apps, builtWith: Microsoft Agent Framework, note: "Foundry Agent Service is the managed alternative — the API/SDK managed agent runtime drawing." }
      - { block: localTools, service: Container Apps dynamic sessions (code interpreter) }
      - { block: stateRetrieval, service: Azure Cosmos DB and Azure AI Search }
      - { block: gateway, service: Azure API Management (AI gateway) }
      - { block: internalTools, service: Your action catalogue as MCP servers and APIs, build: true, note: "Named, parameter-validated actions, each with a compensating transaction, exposed only through API Management." }
      - { block: provider, service: Azure OpenAI in Foundry Models }
      - { block: orgData, service: Your systems of record, build: true, note: "Azure SQL, Blob Storage, line-of-business systems — whatever the actions change." }
      - { block: openWeb, service: Grounding with Bing Search }
      - { block: sources, service: "Public registries (PyPI, npm)" }
      - { block: registry, service: Azure Artifacts feed }
