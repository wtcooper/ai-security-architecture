  - id: sfnStopExecution
    name: "StopExecution"
    where: "AWS Step Functions API, called from your incident runbook for every running execution of the workflow"
    setVia: [apiCli]
    area: tools
    recommended: "Runbook order: disable the rule or pipe, call StopExecution on each running execution, then scale the agent Deployments to zero and revoke their roles' sessions."
    value: "Disable rule, stop executions, scale to zero, revoke"
    why: "Stopping the execution ends the journalled run, but a pod that already holds an activity task keeps working until it is stopped as well."
    mitigations: [cap-agent-kill-switch]
    url: https://docs.aws.amazon.com/step-functions/latest/apireference/API_StopExecution.html
    verified: "2026-11-18"
  - id: sfnEncryptionConfig
    name: "Customer managed key (encryption configuration)"
    where: "AWS Step Functions › state machine and each activity › encryption configuration (KMS key and data key reuse period)"
    setVia: [apiCli, adminConsole]
    area: data
    default: "Encrypted at rest with an AWS owned key"
    recommended: "Choose a customer managed KMS key when creating the state machine and each activity, and grant use of the key only to the workflow role, the agent roles and incident reviewers."
    value: "Customer managed KMS key, used by named roles only"
    why: "Execution history now holds every step's input and output. The key decides who can read that journal, as KMSKeyArn in DurableConfig did."
    mitigations: []
    url: https://docs.aws.amazon.com/step-functions/latest/dg/encryption-at-rest.html
    verified: "2026-11-18"
  - id: albOidcClaimsVerify
    name: "Verify x-amzn-oidc-data (user claims signature and signer)"
    where: "Your agent code, on every request from the load balancer; pod ingress limited to the load balancer"
    setVia: [code]
    area: identity
    recommended: "Verify the signature of the x-amzn-oidc-data header with the load balancer's public key, check that the signer field is your load balancer's ARN, take the user only from those claims and reject requests without the header."
    value: "Signature and signer verified; user from claims only"
    why: "Runtime validated the caller's token before the agent saw a request. In a pod nothing does, so a neighbouring workload could call the agent as any user."
    mitigations: [D3-APA, D3-CTS]
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/listener-authenticate-users.html
    verified: "2026-11-18"
  # <<< hosting rows
  # >>> more hosting rows (settings used only by a hosting variant of the server, inference, training and sandbox patterns)
  - id: eksSandboxNodes
    name: "Nitro Enclaves enabled on sandbox nodes (EnclaveOptions.Enabled)"
    where: "Amazon EC2 › node group launch template › EnclaveOptions.Enabled=true, a Nitro Sandbox AMI and a supported instance type; or an EKS Auto Mode NodePool for the sandbox pods"
    setVia: [apiCli, configFile]
    area: tools
    default: "Off; nodes advertise no sandbox capacity unless Auto Mode provisions them"
    requires: "Kubernetes 1.36 or later and an instance type that supports Nitro Sandboxes"
    recommended: "Run rollouts only on a dedicated, tainted node pool that advertises sandbox capacity. On your own node groups set EnclaveOptions.Enabled=true and build the Nitro Sandbox AMI; on Auto Mode keep the NodePool off FIPS, GPU and Neuron AMIs."
    value: "Dedicated, tainted pool with sandbox capacity"
    why: "A node that does not advertise sandbox capacity cannot run an isolated pod. Dedicated sandbox nodes keep every rollout behind the Nitro hypervisor and away from other workloads."
    mitigations: [D3-HBPI]
    url: https://docs.aws.amazon.com/eks/latest/userguide/sandboxing-isolated-setup.html
    verified: "2026-11-18"
  - id: eksSandboxNetworkIsolated
    name: "sandbox.amazonaws.com/network-isolated annotation"
    where: "Amazon EKS › rollout pod template › metadata.annotations (with runtimeClassName isolated-sandbox)"
    setVia: [configFile]
    area: network
    default: "Not set; the pod has a network device, a limited metadata service and Pod Identity credentials"
    recommended: "Set the annotation to \"true\" on every rollout that only runs code and needs no network. Use exec probes, and collect results over exec or logs, which still work."
    value: "Set to true on every rollout that needs no network"
    why: "The sandbox boots with no network interface, DNS, metadata service or Pod Identity credentials, so there is no route to filter and no credential to steal."
    mitigations: [D3-NI, cap-agent-egress-control]
    url: https://docs.aws.amazon.com/eks/latest/userguide/sandboxing-network-isolation.html
    verified: "2026-11-18"
  - id: eksSandboxPodSpecRbac
    name: "RBAC and admission control on sandbox pod specs"
    where: "Kubernetes › Role and RoleBinding in the run namespace; ValidatingAdmissionPolicy on pods and SandboxClaims that use the isolated-sandbox runtime class"
    setVia: [clusterPolicy]
    area: identity
    default: "Anyone with pod create permission in the namespace can author a sandbox pod"
    recommended: "Only the orchestrator's identity may create or change pods and SandboxClaims in the run namespace; an admission policy fixes the runtime class, image registry, mounts and service account and rejects anything else."
    value: "Orchestrator only, specs fixed by admission policy"
    why: "AWS treats the pod spec as trusted input: whoever writes it chooses the image and the mounts. A rollout must never be able to submit or edit one."
    mitigations: [D3-APA]
    url: https://docs.aws.amazon.com/eks/latest/userguide/sandboxing-security-model.html
    verified: "2026-11-18"
  - id: microVmPerRollout
    name: "One MicroVM per rollout (run-microvm, maximum duration)"
    where: "AWS Lambda MicroVMs › run-microvm --maximum-duration-in-seconds and --idle-policy; one MicroVM per rollout, never reused"
    setVia: [apiCli, code]
    area: tools
    default: "Maximum duration up to 8 hours; snapshot content is shared by every MicroVM run from one image version"
    recommended: "Call run-microvm for every rollout with the maximum duration set to the task budget, and terminate it when the episode ends. Generate IDs and secrets in the /run hook, not at image build."
    value: "One MicroVM per rollout, capped at the task budget"
    why: "Each rollout gets its own Firecracker microVM, so nothing one episode does reaches another. The duration cap ends a run that never stops by itself."
    mitigations: [D3-EI, D3-HBPI]
    url: https://docs.aws.amazon.com/lambda/latest/dg/microvms-launching.html
    verified: "2026-11-18"
  - id: microVmVpcEgress
    name: "Egress network connector (VpcEgressConfiguration)"
    where: "AWS Lambda › create-network-connector (SubnetIds, SecurityGroupIds, operator role); referenced by ARN on run-microvm"
    setVia: [apiCli]
    area: network
    default: "Public internet access on the egress path"
    requires: "An IAM operator role that lets Lambda create network interfaces in the VPC"
    recommended: "Create one connector on the sandbox subnets and security groups, behind Network Firewall and DNS Firewall, and pass it on every run-microvm call; let only the orchestrator role call run-microvm."
    value: "One connector behind Network and DNS Firewall"
    why: "A MicroVM has public internet access unless a VPC egress connector is attached. With it, outbound traffic is subject to your security groups, routes and firewalls."
    mitigations: [cap-agent-egress-control, D3-NI]
    url: https://docs.aws.amazon.com/lambda/latest/dg/microvms-networking.html
    verified: "2026-11-18"
  - id: microVmExecutionRole
    name: "Execution role (MicroVM runtime)"
    where: "AWS Lambda MicroVMs › execution role (an IAM role trusted by lambda.amazonaws.com), separate from the build role"
    setVia: [cloudPolicy, apiCli]
    area: identity
    default: "None; the MicroVM cannot call AWS services or write logs"
    recommended: "A role separate from the build role, allowed only to write the rollout log group and call the one inference endpoint and package repository the episode needs."
    value: "Separate role: its log group, endpoint and repository"
    why: "Code in the MicroVM acts with this role, so it is the whole of what a rollout can do in AWS. Lambda runs the runtime lifecycle hooks under the same role."
    mitigations: [D3-AA]
    url: https://docs.aws.amazon.com/lambda/latest/dg/microvms-security.html
    verified: "2026-11-18"
  - id: microVmIngressTokens
    name: "Ingress connector and port-scoped auth tokens"
    where: "AWS Lambda MicroVMs › run-microvm --ingress-network-connectors (HTTP_INGRESS or NO_INGRESS); create-microvm-auth-token --allowed-ports --expiration-in-minutes"
    setVia: [apiCli, cloudPolicy]
    area: identity
    default: "Requests need a valid token; you choose its ports and expiry"
    recommended: "Use NO_INGRESS where the episode starts from the /run hook; otherwise HTTP_INGRESS with tokens of 15 to 30 minutes scoped to the harness port, minted only by the orchestrator role. Never attach SHELL_INGRESS."
    value: "NO_INGRESS, or 15 to 30 minute port-scoped tokens"
    why: "A token is the only gate on a MicroVM endpoint, and a token for the hook port can call the lifecycle hooks. Short, port-scoped tokens keep that with the orchestrator."
    mitigations: [D3-APA]
    url: https://docs.aws.amazon.com/lambda/latest/dg/microvms-networking.html
    verified: "2026-11-18"
  - id: microVmTerminate
    name: "terminate-microvm"
    where: "AWS Lambda MicroVMs API, called from your incident runbook for every MicroVM listed by list-microvms for the image"
    setVia: [apiCli]
    area: tools
    default: "MicroVMs run until terminated, suspended past their limit or past the maximum duration"
    recommended: "Runbook order: stop the orchestrator queue, list MicroVMs for the image version, terminate each, then revoke the execution role sessions in IAM."
    value: "Stop queue, terminate each MicroVM, revoke sessions"
    why: "Suspended MicroVMs keep memory and disk and can resume on traffic, so a stop must terminate them, not wait for them to idle out."
    mitigations: [cap-agent-kill-switch]
    url: https://docs.aws.amazon.com/lambda/latest/dg/microvms-launching.html
    verified: "2026-11-18"
  - id: albJwtValidation
    name: "jwt-validation action (Verify JWTs)"
    where: "Application Load Balancer › HTTPS listener › rule actions (jwt-validation before the forward action)"
    setVia: [apiCli, adminConsole]
    area: identity
    default: "No token check; the listener forwards every request"
    requires: "An HTTPS listener; RS256-signed tokens; a publicly accessible JWKS endpoint whose response is at most 150 KB and 10 keys"
    recommended: "Add a jwt-validation action on the internal load balancer's HTTPS listener with your issuer and JWKS endpoint, and required claims for audience and scope; validate again in the server if handlers read the tenant."
    value: "jwt-validation with issuer, audience and scope"
    why: "Runtime's inbound authoriser no longer checks tokens before your code runs. The load balancer rejects a call whose token is not from your issuer or not meant for this server."
    mitigations: [D3-APA, D3-CTS]
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/listener-verify-jwt.html
    verified: "2026-11-18"
  - id: gatewayMcpPrivateEndpoint
    name: "Private endpoint (privateEndpoint) on the MCP server target"
    where: "AgentCore Gateway › MCP server target › privateEndpoint (managedVpcResource: VPC, subnets, security groups)"
    setVia: [apiCli]
    area: network
    default: "Targets are reached at a public address"
    requires: "An internal load balancer with a certificate the gateway trusts"
    recommended: "Give the MCP server target a privateEndpoint in the cluster VPC and allow inbound traffic to the internal load balancer only from that endpoint's security group."
    value: "privateEndpoint in the cluster VPC"
    why: "The server no longer sits behind Runtime's endpoint. A private target keeps the load balancer off the internet, so callers reach the server only through the gateway."
    mitigations: []
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-vpc-egress.html
    verified: "2026-11-18"
  - id: apiGatewayJwtAuthorizer
    name: "JWT authorizer (HTTP API)"
    where: "Amazon API Gateway › HTTP API › Authorization › JWT authorizer (Issuer, Audience) attached to the /mcp route with authorizationScopes"
    setVia: [apiCli, adminConsole]
    area: identity
    default: "Routes are open until an authoriser is attached"
    requires: "RSA-signed tokens from an issuer with a JWKS endpoint"
    recommended: "Attach a JWT authoriser to the /mcp route with your user pool as issuer, this server's resource as audience and the tool scopes as authorizationScopes. Where the gateway signs with SigV4, use IAM authorisation instead."
    value: "JWT authoriser on /mcp with audience and scopes"
    why: "Runtime's inbound authoriser no longer checks tokens before your code runs. API Gateway rejects a call whose token is from another issuer, for another audience or without the scope."
    mitigations: [D3-APA, D3-CTS]
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/http-api-jwt-authorizer.html
    verified: "2026-11-18"
  - id: smModelExecutionRole
    name: "Execution role (ExecutionRoleArn) per model"
    where: "SageMaker AI › CreateModel ExecutionRoleArn; one IAM role per endpoint"
    setVia: [cloudPolicy, apiCli]
    area: identity
    default: "Whatever role the model is given"
    recommended: "One role per served model, allowed to read only that release prefix in the artifact bucket, pull its image from ECR and write its logs; passed only by the deployment pipeline."
    value: "One role per model, reading only its release prefix"
    why: "SageMaker reads the weights with this role in place of a pod's role, so an endpoint can load its own release and nothing else."
    mitigations: [D3-AA, AML.M0005]
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-roles.html
    verified: "2026-11-18"
  - id: smInvokeEndpointPolicy
    name: "sagemaker:InvokeEndpoint and sagemaker:CallWithBearerToken permissions"
    where: "IAM › identity policies and service control policies on sagemaker:InvokeEndpoint and sagemaker:InvokeEndpointWithResponseStream scoped to the endpoint ARN, plus sagemaker:CallWithBearerToken, which only accepts Resource \"*\""
    setVia: [cloudPolicy]
    area: identity
    default: "Any identity in the account whose policies allow the actions can invoke"
    recommended: "Allow these actions on the serving endpoints to the gateway's role only, conditioned on your SageMaker Runtime interface endpoint; deny them to every application role. Keep bearer tokens to minutes, not the 12-hour default."
    value: "Gateway's role only, via your interface endpoint"
    why: "The endpoint has no API key of its own. IAM on the invoke actions is what stops an application calling the model directly and skipping the gateway."
    mitigations: [D3-AA, D3-ACH]
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/realtime-endpoints-openai-compatible.html
    verified: "2026-11-18"
  - id: smEndpointPerTier
    name: "One endpoint per sensitivity tier (ProductionVariants)"
    where: "SageMaker AI › CreateEndpointConfig ProductionVariants (InstanceType, InitialInstanceCount); one endpoint configuration per tier"
    setVia: [apiCli]
    area: network
    default: "You choose what each endpoint hosts"
    recommended: "Deploy each sensitivity tier to its own endpoint and endpoint configuration; do not co-host tiers as inference components or containers on one endpoint."
    value: "Own endpoint per sensitivity tier, no co-hosting"
    why: "Models sharing an endpoint share its instances and GPUs. A separate endpoint gives each tier its own instances, as a tainted node pool did on EKS."
    mitigations: [D3-HBPI]
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/realtime-endpoints-deploy-models.html
    verified: "2026-11-18"
  - id: smModelPackageDeploy
    name: "Deploy from the approved model package (ModelPackageName)"
    where: "SageMaker AI › CreateModel Containers.ModelPackageName (the approved version ARN in Model Registry); digest check in the deployment pipeline"
    setVia: [apiCli, code]
    area: data
    default: "A model can point at any S3 location"
    recommended: "Create the model from the approved model package ARN, never from a bare S3 path, after the pipeline has checked the artifact's SHA-256 and signature against the registry record."
    value: "Approved model package ARN only, never an S3 path"
    why: "There is no init container to hash the weights: SageMaker copies them in itself. Deploying by package ARN ties the endpoint to the approved version, and the pipeline does the check."
    mitigations: [AML.M0014]
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/model-registry-deploy.html
    verified: "2026-11-18"
  - id: smDeploymentGuardrails
    name: "Deployment guardrails (blue/green with canary or linear traffic shifting)"
    where: "SageMaker AI › UpdateEndpoint DeploymentConfig › BlueGreenUpdatePolicy and AutoRollbackConfiguration (CloudWatch alarms)"
    setVia: [apiCli]
    area: tools
    default: "Updates use a blue/green deployment; the traffic shifting mode and alarms are yours to set"
    recommended: "Update endpoints with canary traffic shifting, a baking period and auto-rollback alarms on error rate and latency."
    value: "Canary shifting, baking period, auto-rollback alarms"
    why: "A new release takes a small share of traffic first and rolls back by itself if its alarms trip, on top of the weighted route at the gateway."
    mitigations: [cap-staged-rollout-gate]
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/deployment-guardrails-blue-green.html
    verified: "2026-11-18"
  - id: smEndpointKms
    name: "KmsKeyId on the endpoint configuration"
    where: "SageMaker AI › CreateEndpointConfig KmsKeyId (storage volume of the ML instances)"
    setVia: [cloudPolicy, apiCli]
    area: data
    default: "No customer managed key on the volume"
    recommended: "Your customer managed key, with a key policy that lets only the endpoint's execution role and SageMaker use it."
    value: "Your customer managed key, endpoint role only"
    why: "The copy of the weights on the EBS storage volume is encrypted under a key you control and can revoke. On Nitro instance types with local NVMe storage, a hardware module encrypts that storage and the KMS key does not apply."
    mitigations: [AML.M0005]
    url: https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_CreateEndpointConfig.html
    verified: "2026-11-18"
  - id: s3DefaultSseKms
    name: "Default encryption (SSE-KMS) on the bucket"
    where: "Amazon S3 › (dataset, candidate and checkpoint buckets) › Properties › Default encryption (PutBucketEncryption); the same key on the EBS or FSx volumes the job mounts"
    setVia: [cloudPolicy, apiCli]
    area: data
    default: "SSE-S3 (Amazon S3 managed keys)"
    recommended: "Set default encryption to SSE-KMS with your customer managed key and an S3 Bucket Key; grant kms:Decrypt and kms:GenerateDataKey to the training role only, and encrypt the job's volumes with the same key."
    value: "SSE-KMS with your customer managed key"
    why: "No job parameter encrypts volumes and output here as CreateTrainingJob did. Bucket default encryption puts checkpoints and candidates under your key unless a request names other encryption; deny that in the bucket policy."
    mitigations: [AML.M0012]
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/default-bucket-encryption.html
    verified: "2026-11-18"
  - id: hyperPodVpcConfig
    name: "VpcConfig (cluster) and OverrideVpcConfig (instance group)"
    where: "SageMaker AI › CreateCluster VpcConfig (subnets, security groups); ClusterInstanceGroupSpecification OverrideVpcConfig"
    setVia: [apiCli, cloudPolicy]
    area: network
    default: "Mandatory for Amazon EKS orchestration; optional for Slurm"
    requires: "Enough network interface quota for the cluster"
    recommended: "Private subnets with no NAT or internet gateway route, an S3 gateway endpoint and interface endpoints for the AWS services jobs call, and security groups that allow traffic only within the cluster."
    value: "Private subnets, no NAT or internet route"
    why: "A HyperPod node has no network isolation flag. What a training job can reach is whatever the cluster subnets route to, so the VPC is the wall."
    mitigations: [D3-NI]
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-prerequisites.html
    verified: "2026-11-18"
  - id: hyperPodVolumeKms
    name: "VolumeKmsKeyId (ClusterEbsVolumeConfig)"
    where: "SageMaker AI › CreateCluster instance group storage configuration › ClusterEbsVolumeConfig (RootVolume, VolumeKmsKeyId)"
    setVia: [apiCli]
    area: data
    default: "Root volume encrypted with an AWS owned key"
    recommended: "Your customer managed key on the secondary volume and, with RootVolume set to True, on the root volume of every instance group that runs training."
    value: "Your customer managed key on root and secondary volumes"
    why: "Datasets and checkpoints staged on cluster nodes are encrypted under a key you control; by default the root volume uses an AWS owned key."
    mitigations: [AML.M0012]
    url: https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_ClusterEbsVolumeConfig.html
    verified: "2026-11-18"
  # <<< more hosting rows
  # >>> managed agent service rows (the cloud controls around the provider's agent service)
  - id: agentCoreInterfaceEndpoints
    name: "Interface VPC endpoints for AgentCore, with endpoint policies"
    where: "Amazon VPC › Endpoints › com.amazonaws.<region>.bedrock-agentcore, bedrock-agentcore-control and bedrock-agentcore.gateway"
    setVia: [apiCli, cloudPolicy]
    area: network
    default: "No endpoint; calls use the public regional endpoint"
    requires: "For JWT callers the policy principal must be *; only SigV4 callers can be named"
    recommended: "Create all three with private DNS in the application and agent VPCs. Endpoint policy: only InvokeHarness and InvokeAgentRuntime on your harness ARNs for the application role, and InvokeGateway on your gateway. Endpoint security group: the application and agent subnets only."
    value: "All three, private DNS, scoped endpoint policies"
    why: "The default endpoint policy allows full access to AgentCore. A scoped policy keeps the private path from being used to reach other accounts' agents or other actions."
    mitigations: [D3-NI]
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/vpc-interface-endpoints.html
    verified: "2026-11-18"
  - id: agentCoreNetworkPerimeterScp
    name: "Network perimeter policy (aws:SourceVpc, aws:SourceVpce)"
    where: "AWS Organizations › Service control policies › Deny bedrock-agentcore invoke and control actions unless the request arrives through your VPC endpoints"
    setVia: [cloudPolicy]
    area: network
    default: "Not set"
    requires: "Applies to IAM principals in your organisation only; AWS documents resource-based policies for runtimes, gateways and memory, not for a harness ARN, so JWT callers of a harness are not covered"
    recommended: "Deny InvokeHarness, InvokeAgentRuntime, InvokeAgentRuntimeCommand and InvokeGateway unless aws:SourceVpce is one of your endpoints, with an exception where aws:ViaAWSService is true and for the pipeline role."
    value: "Deny invokes unless via your endpoints"
    why: "The AgentCore API endpoint stays reachable from the internet. This makes a stolen role credential useless from outside your network."
    mitigations: [D3-NI, D3-ACH]
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_condition-keys.html
    verified: "2026-11-18"
  - id: gatewayIamInboundPolicy
    name: "AWS_IAM inbound authoriser and resource-based policy on the gateway"
    where: "AgentCore Gateway › (gateway) › Inbound Auth AWS_IAM; PutResourcePolicy on the gateway ARN"
    setVia: [apiCli, cloudPolicy]
    area: identity
    default: "No resource-based policy"
    requires: "Harness tool type agentcore_gateway with outboundAuth awsIam"
    recommended: "Allow bedrock-agentcore:InvokeGateway only to the execution roles of the harnesses that use this gateway, and deny when aws:SourceVpce is not your gateway endpoint. Give each execution role InvokeGateway on that one gateway ARN."
    value: "InvokeGateway for the harness roles only, via endpoint"
    why: "The harness then signs each tool call with short-lived credentials for its own role, so no key is stored and the gateway can tell agents apart."
    mitigations: [D3-CH, D3-AA, D3-NI, AML.M0028]
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/resource-based-policies.html
    verified: "2026-11-18"
  - id: harnessAdminScp
    name: "Deny harness create and update outside the pipeline role"
    where: "AWS Organizations › Service control policies › Deny CreateHarness, UpdateHarness, CreateHarnessEndpoint, UpdateHarnessEndpoint, CreateAgentRuntime, UpdateAgentRuntime, CreateGateway, CreateGatewayTarget, and InvokeAgentRuntimeCommand and InvokeAgentRuntimeCommandShell outside a break-glass role; on JWT-authorised harnesses list in allowedClients only the front end's client"
    setVia: [cloudPolicy]
    area: identity
    default: "Not set"
    recommended: "Deny these actions unless aws:PrincipalArn is the delivery pipeline's deployment role, and require your ownership tags with aws:RequestTag. Give engineers read and invoke permissions only, in non-production accounts."
    value: "Deny unless the pipeline's deployment role"
    why: "Anyone holding the create actions can otherwise stand up an agent nobody reviewed. A harness also needs CreateAgentRuntime and CreateMemory, so denying those closes the same door."
    mitigations: [cap-agent-tool-registry, D3-ACH]
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-security.html
    verified: "2026-11-18"
  - id: regionDenyScp
    name: "Region deny (aws:RequestedRegion)"
    where: "AWS Organizations › Service control policies › Deny bedrock-agentcore:* and bedrock:* when aws:RequestedRegion is outside your list"
    setVia: [cloudPolicy]
    area: data
    default: "Not set"
    recommended: "List only the Regions you operate in. If you allow global inference profiles, the policy must also allow aws:RequestedRegion unspecified; leave that out to hold inference inside your geography."
    value: "Only the Regions you operate in"
    why: "A harness, its memory and its model calls can otherwise be created in any Region the account can reach."
    mitigations: [D3-ACH]
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html
    verified: "2026-11-18"
  - id: bedrockModelAllowlistScp
    name: "Deny inference on unapproved models"
    where: "AWS Organizations › Service control policies (and each harness execution role) › Deny bedrock:InvokeModel and bedrock:InvokeModelWithResponseStream on foundation models and inference profiles outside your list"
    setVia: [cloudPolicy]
    area: tools
    default: "Not set"
    recommended: "Deny all model ARNs except the approved foundation models and the geographic inference profiles you chose. Remove sts:AssumeRole from execution roles. Set model on every harness, since the service default is a global profile and can change."
    value: "Deny all but approved models and inference profiles"
    why: "The harness calls Bedrock on its execution role, so this stops a model override on InvokeHarness. It does not cover OpenAI, Gemini or LiteLLM endpoints, or Bedrock Mantle calls (bedrock-mantle:CreateInference), which need their own deny."
