# Cursor — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
vendor: cursor
family: Cursor
tools:
  - id: toolCursor
    name: Cursor
    surfaceClasses:
      - desktopApp
      - endpointCli
    variants:
      - name: Cursor IDE
        class: desktopApp
      - name: Cursor CLI (cursor-agent)
        class: endpointCli
    architecture: archCodingAgentThirdParty
    status: ga
    asOf: 2026-08
    summary:
      - Enterprise governance spans SAML SSO with SCIM, MDM device policies, org-enforced Privacy
        Mode, model and MCP access control, agent run-mode policies, Enterprise-only audit logs with
        SIEM streaming, and a Basic-auth Admin API. Most controls are labelled Enterprise-tier in
        the documentation.
    items:
      - title: Identity and device management
        body:
          - SAML 2.0 SSO (password auth can be blocked), SCIM provisioning with group sync, and
            three dashboard roles. MDM policies for macOS and Windows cover Allowed Team IDs (blocks
            personal-account login on corporate devices), an Allowed Extensions allowlist (Cursor
            2.1+) and Workspace Trust enforcement.
        links:
          - title: Cursor enterprise identity and access management
            url: https://cursor.com/docs/enterprise/identity-and-access-management
      - title: Privacy, model and MCP control
        body:
          - Privacy Mode is default-on for Enterprise teams and admins can enforce it so members
            cannot disable it; model access is set per team and per organisation group, and BYOK API
            keys can be blocked. MCP servers are governed by a dashboard allowlist with wildcard
            matching, per-server tool restrictions and per-server network policies, distributable to
            endpoints as ~/.cursor/permissions.json via MDM — admin settings take precedence over
            the local file and editor settings.
        links:
          - title: Model and integration management
            url: https://cursor.com/docs/enterprise/model-and-integration-management
          - title: Privacy and data governance
            url: https://cursor.com/docs/enterprise/privacy-and-data-governance
      - title: Agent run-mode policies and audit
        body:
          - Enterprise Run Mode policies (Cursor 3.6+) set the terminal posture — Auto-review,
            Allowlist, or Run Everything — and the docs are candid that the allowlist is
            best-effort, not a security boundary; hooks can scan prompts, block commands and redact
            secrets, and .cursorignore is likewise documented as not a boundary. Enterprise audit
            logs record admin and account events (explicitly not agent responses or generated code),
            stream to SIEM, and the Admin API exposes members, usage, spend, repo blocklists and
            model access.
        links:
          - title: LLM safety and controls
            url: https://cursor.com/docs/enterprise/llm-safety-and-controls
          - title: Compliance and monitoring
            url: https://cursor.com/docs/enterprise/compliance-and-monitoring
    controls: []
    sources:
      - title: Cursor enterprise documentation hub
        url: https://cursor.com/docs/enterprise
      - title: Cursor admin API
        url: https://cursor.com/docs/account/teams/admin-api
