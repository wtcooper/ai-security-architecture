# Sourced categories; all implementation and cross-framework relationships are authored here.
attribution: OWASP provides the primary AI solution categories, supplemented by ENISA and ECSO technology
  categories. CISA TIC functions and NIST CSF outcomes are supplementary mappings. All tech-* identifiers and
  category-entry slugs are repository keys, not official IDs. CoSAI remains the core taxonomy. Descriptions
  and crosswalk rationales are authored here.
capabilities:
  - id: tech-llm-firewall
    title: LLM Firewall
    category: AI security
    description: Enforces policies at LLM request and response boundaries. Input inspection, output filtering, and
      exfiltration prevention require separate feature verification.
    surfaces:
      surfaceEndpoint:
        applies: true
        note: Runs as a local proxy or agent hook that inspects prompts and responses before they leave the
          device, including from CLI and desktop agents; the same process can often bypass a client-side
          filter, so treat it as weaker than a network or gateway placement.
      surfaceCloud:
        applies: true
        note: Sits inline at the gateway or application boundary around your own inference path, where input
          screening, output filtering and exfiltration checks are enforced server-side and are fully yours
          to tune.
      surfaceSaas:
        applies: true
        note: Reaches vendor AI only when the session is proxied through your network path; the vendor's own
          filters are not yours to configure, and in-vendor agent-to-tool calls never traverse the firewall.
    primarySource:
      framework: owasp-solutions
      entry: llm-firewall
    frameworkMappings:
      - framework: owasp-solutions
        entry: llm-firewall
        relationship: same-category
        rationale: Uses the published category; the display name may expand an acronym or normalize spelling.
      - framework: nist-csf
        entry: PR.DS
        relationship: supports
        rationale: Sensitive-content filtering can contribute to data protection.
      - framework: nist-csf
        entry: DE.CM
        relationship: supports
        rationale: Inspection telemetry can contribute to runtime monitoring.
    mitigationMappings:
      - mitigation: AML.M0020
        rationale: Can implement input/output guardrail checks at a model boundary.
      - mitigation: D3-OTF
        rationale: Can restrict outbound content where the firewall mediates that path.
  - id: tech-llm-benchmarking
    title: LLM Automated Benchmarking
    category: AI security
    description: Automated security evaluation, including vulnerability scanning. This category does not imply
      that automated tests replace an independent red team.
    surfaces:
      surfaceEndpoint:
        applies: true
        note: Evaluates the agent configuration, tool set and sandbox as deployed on devices before rollout;
          the model itself is usually remote, so what is benchmarked is the local harness.
      surfaceCloud:
        applies: true
        note: Full access to test the system you built at any depth, integrated with the deployment gate as
          a managed platform service.
      surfaceSaas:
        applies: true
        note: You can run your own evaluation suite against vendor outputs and API tenancy, but not their
          internals, and adversarial testing is constrained by the vendor's acceptable-use terms.
    primarySource:
      framework: owasp-solutions
      entry: llm-benchmarking
    frameworkMappings:
      - framework: owasp-solutions
        entry: llm-benchmarking
        relationship: same-category
        rationale: Uses the published category; the display name may expand an acronym or normalize spelling.
      - framework: nist-csf
        entry: ID.RA
        relationship: supports
        rationale: Security testing identifies weaknesses.
      - framework: nist-csf
        entry: ID.IM
        relationship: supports
        rationale: Test findings inform improvement.
      - framework: ecso-market
        entry: vulnerability
        relationship: narrower
        rationale: AI model testing contributes to broader vulnerability management.
    mitigationMappings:
      - mitigation: AML.M0008
        rationale: Evaluations can test model behavior against defined expectations.
      - mitigation: AML.M0035
        rationale: Adversarial test automation can assist a scoped AI red-team exercise.
  - id: tech-llm-guardrails
    title: LLM Guardrails
    category: AI security
    description: Runtime policies for model inputs, context, and outputs. Overlaps with LLM firewalls; these are
      alternative source categories and should not be counted as independent protection.
    surfaces:
      surfaceEndpoint:
        applies: true
        note: Client-side guardrails are possible, increasingly hooked at the pre-tool-call boundary of
          local coding agents, but the same process can often bypass them.
      surfaceCloud:
        applies: true
        note: Native, policy-configurable and enforced server-side; a named guardrail-service feature on
          every major inference platform.
      surfaceSaas:
        applies: true
        note: The vendor's filters are fixed from your side; your own guardrails apply only to traffic you
          proxy, and validation of agent inputs and outputs inside a fused chat product is not reachable.
    primarySource:
      framework: owasp-solutions
      entry: llm-guardrails
    frameworkMappings:
      - framework: owasp-solutions
        entry: llm-guardrails
        relationship: same-category
        rationale: Uses the published category; the display name may expand an acronym or normalize spelling.
      - framework: nist-csf
        entry: PR.DS
        relationship: supports
        rationale: Data-handling guardrails can protect sensitive content.
    mitigationMappings:
      - mitigation: AML.M0020
        rationale: Implements selected runtime guardrail functions; each boundary must be assessed.
      - mitigation: AML.M0033
        rationale: Validation components can constrain agent inputs and outputs.
  - id: tech-ai-spm
    title: AI Security Posture Management (AI-SPM)
    category: AI security
    description: Discovers AI assets and assesses their configuration, exposure, and vulnerabilities. The category
      does not imply runtime blocking.
    surfaces:
      surfaceEndpoint:
        applies: false
        note: Posture management targets hosted workloads; local agents, models and tool servers on devices
          are inventoried and assessed through device management and endpoint tooling instead.
      surfaceCloud:
        applies: true
        note: The primary surface, a cloud-plane capability by construction; discovers models, datasets,
          agents and their configuration directly in the accounts you operate.
      surfaceSaas:
        applies: true
        note: Limited to what vendor configuration APIs expose about your tenant; a bill of materials for
          the vendor's own stack is not obtainable, only its attestations.
    primarySource:
      framework: owasp-solutions
      entry: ai-spm
    frameworkMappings:
      - framework: owasp-solutions
        entry: ai-spm
        relationship: same-category
        rationale: Uses the published category; the display name may expand an acronym or normalize spelling.
      - framework: nist-csf
        entry: ID.AM
        relationship: supports
        rationale: Discovery supports AI asset management.
      - framework: nist-csf
        entry: ID.RA
        relationship: supports
        rationale: Findings support risk assessment.
      - framework: cisa-tic
        entry: 3.UNI.INVENT
        relationship: supports
        rationale: Asset discovery contributes to inventory.
      - framework: cisa-tic
        entry: 3.UNI.CMANA
        relationship: supports
        rationale: Configuration assessment detects posture deviations.
    mitigationMappings:
      - mitigation: D3-AI
        rationale: Discovery can maintain an AI asset inventory.
      - mitigation: D3-CI
        rationale: Posture assessment inventories AI configuration.
      - mitigation: D3-AVE
        rationale: Assessments enumerate vulnerabilities in AI assets.
      - mitigation: AML.M0023
        rationale: AI-SPM implementations that generate and maintain an AI bill of materials can inventory models,
          datasets, agents, and their dependencies. Verify export content, completeness, and refresh cadence;
          discovery alone does not guarantee a complete BOM or artifact integrity.
        sources:
          - title: Snyk Labs — AI-BOM and the Future of AI Security Posture Management
            url: https://labs.snyk.io/resources/future-aispm/
      - mitigation: D3-DI
        rationale: AI-SPM dataset discovery can maintain an inventory of data used by AI services. Scope depends
          on connected environments; inventory does not establish dataset lineage or sanitization.
        sources:
          - title: Palo Alto Networks — AI Agent Discovery with Cortex Cloud
            url: https://docs.paloaltonetworks.com/ai-runtime-security/administration/agent-discovery/ai-agent-discovery-with-cortex-cloud
  - id: tech-agentic-security
    title: Agentic AI App Security
    category: AI security
    description: An emerging umbrella for agent identity, action authorization, and runtime oversight. Assess the
      actual functions supplied by each implementation.
    surfaces:
      surfaceEndpoint:
        applies: true
        note: Permission modes, tool allow-lists and the interactive approval prompt in a local coding agent
          are this category in its simplest form; scope-drift detection needs traces shipped off the device.
      surfaceCloud:
        applies: true
        note: Enforced in the agent framework and at the gateway, with action policy expressed as code and
          approval implemented as workflow checkpoints.
      surfaceSaas:
        applies: true
        note: Limited to the connector scopes, confirmation steps and interaction telemetry a vendor
          exposes; API/SDK managed runtimes evaluate a per-tool permission policy you author, but a fused
          chat product's loop admits no decision point of yours.
    primarySource:
      framework: owasp-solutions
      entry: agentic-security
    frameworkMappings:
      - framework: owasp-solutions
        entry: agentic-security
        relationship: same-category
        rationale: Uses the published category; the display name may expand an acronym or normalize spelling.
      - framework: nist-csf
        entry: PR.AA
        relationship: supports
        rationale: Agent authorization supports controlled access.
      - framework: nist-csf
        entry: DE.CM
        relationship: supports
        rationale: Agent behavior monitoring contributes to detection.
    mitigationMappings:
      - mitigation: AML.M0028
        rationale: Permission enforcement can restrict tools available to agents.
      - mitigation: AML.M0037
        rationale: Authority checks can constrain delegated privilege expansion.
      - mitigation: AML.M0038
        rationale: Agent monitoring can detect scope drift.
      - mitigation: AML.M0029
        rationale: Action policy can route high-impact actions for human approval.
  - id: tech-dlp
    title: Data Loss Prevention (DLP)
    category: Data security
    description: Detects sensitive data and restricts its transfer. AI coverage depends on inspecting the relevant
      prompt, upload, response, or tool channel.
    surfaces:
      surfaceEndpoint:
        applies: true
        note: Device-resident inspection sees prompts, pastes and uploads before they leave, including in
          native apps and CLI agents.
      surfaceCloud:
        applies: true
        note: Enforced inline at the application or gateway boundary around your own inference path,
          covering prompt, response and tool channels.
      surfaceSaas:
        applies: true
        note: Reaches vendor AI only through the edges you own, browser, endpoint agent or network path; the
          vendor's internal data handling stays beyond inspection.
    primarySource:
      framework: enisa-ecsmaf
      entry: dlp
    frameworkMappings:
      - framework: enisa-ecsmaf
        entry: dlp
        relationship: same-category
        rationale: Uses the published category; the display name may expand an acronym or normalize spelling.
      - framework: ecso-market
        entry: dlp
        relationship: same-category
        rationale: Same technology category under ECSO terminology.
      - framework: cisa-tic
        entry: 3.PEP.FI.DLPRE
        relationship: supports
        rationale: File inspection can enforce file DLP policies.
      - framework: cisa-tic
        entry: 3.PEP.WE.DLPRE
        relationship: supports
        rationale: Web inspection can enforce web DLP policies.
      - framework: nist-csf
        entry: PR.DS
        relationship: supports
        rationale: Leakage prevention contributes to data confidentiality.
    mitigationMappings:
      - mitigation: AML.M0020
        rationale: Sensitive-data screening can implement the data-leakage subset of AI guardrails; it does not imply
          injection defense.
      - mitigation: D3-OTF
        rationale: Egress enforcement can block sensitive outbound content.
  - id: tech-casb
    title: Cloud Access Security Brokers (CASB)
    category: Cloud security
    description: Applies security policy around cloud-service access and usage. API-based and inline
      implementations expose different enforcement boundaries.
    surfaces:
      surfaceEndpoint:
        applies: true
        note: Inline brokering depends on the device agent or forward proxy to see traffic from managed
          devices when it does not traverse a corporate network; API-mode CASB adds nothing on the device
          itself.
      surfaceCloud:
        applies: false
        note: Brokering targets sanctioned cloud applications; AI you operate is fronted by your own gateway
          and identity provider, and workload egress to external model providers is a gateway and firewall
          function rather than a broker's.
      surfaceSaas:
        applies: true
        note: The primary case, sanctioned-app discovery, session analysis and inline policy for vendor AI
          where no API or agent hook exists; API-mode integrations reach whatever the vendor's admin APIs
          expose.
    primarySource:
      framework: enisa-ecsmaf
      entry: casb
    frameworkMappings:
      - framework: enisa-ecsmaf
        entry: casb
        relationship: same-category
        rationale: Uses the published category; the display name may expand an acronym or normalize spelling.
      - framework: ecso-market
        entry: casb
        relationship: same-category
        rationale: Same technology category under ECSO terminology.
      - framework: nist-csf
        entry: PR.AA
        relationship: supports
        rationale: Cloud access enforcement supports authorization.
      - framework: nist-csf
        entry: DE.CM
        relationship: supports
        rationale: Cloud-session analysis supports monitoring.
    mitigationMappings:
      - mitigation: D3-AMED
        rationale: Brokered cloud access can enforce authorization decisions.
      - mitigation: D3-WSAA
        rationale: Session analysis can identify suspicious cloud usage.
      - mitigation: D3-OTF
        rationale: Inline enforcement can restrict cloud-bound traffic.
  - id: tech-cspm
    title: Cloud Security Posture Management (CSPM)
    category: Cloud security
    description: Evaluates cloud configurations and exposure. AI-SPM remains a separate category focused on AI assets.
    surfaces:
      surfaceEndpoint:
        applies: false
        note: Posture management evaluates cloud accounts and services; there is no cloud configuration to
          assess on a managed device.
      surfaceCloud:
        applies: true
        note: The canonical surface, evaluating the accounts, networks and managed services that host your
          inference and agent workloads.
      surfaceSaas:
        applies: false
        note: The vendor's infrastructure is not in your cloud accounts; your tenant's settings in a vendor
          AI service are a SaaS-posture or vendor-assurance question, not CSPM.
    primarySource:
      framework: enisa-ecsmaf
      entry: cspm
    frameworkMappings:
      - framework: enisa-ecsmaf
        entry: cspm
        relationship: same-category
        rationale: Uses the published category; the display name may expand an acronym or normalize spelling.
      - framework: cisa-tic
        entry: 3.UNI.CMANA
        relationship: supports
        rationale: Configuration assessment identifies deviations.
      - framework: nist-csf
        entry: PR.PS
        relationship: supports
        rationale: Configuration findings support platform hardening.
    mitigationMappings:
      - mitigation: D3-CI
        rationale: Maintains cloud configuration records.
      - mitigation: D3-AVE
        rationale: Identifies exposed or vulnerable cloud assets.
  - id: tech-cwpp
    title: Cloud Workload Protection Platforms (CWPP)
    category: Cloud security
    description: Protects compute workloads; coverage depends on the operating system, container, and runtime
      features deployed.
    surfaces:
      surfaceEndpoint:
        applies: false
        note: Workload protection targets servers, containers and serverless runtimes; devices are covered
          by endpoint protection, a separate category.
      surfaceCloud:
        applies: true
        note: Host and container coverage of the servers running inference and agent workloads, with process
          analysis, isolation and file integrity monitoring where configured.
      surfaceSaas:
        applies: false
        note: No agent can be installed on vendor infrastructure; protection of the workloads behind a
          vendor AI service is entirely theirs.
    primarySource:
      framework: enisa-ecsmaf
      entry: cwpp
    frameworkMappings:
      - framework: enisa-ecsmaf
        entry: cwpp
        relationship: same-category
        rationale: Uses the published category; the display name may expand an acronym or normalize spelling.
      - framework: nist-csf
        entry: PR.PS
        relationship: supports
        rationale: Workload protections support platform security.
      - framework: nist-csf
        entry: DE.CM
        relationship: supports
        rationale: Runtime telemetry supports monitoring.
    mitigationMappings:
      - mitigation: D3-PA
        rationale: Runtime process analysis can detect workload compromise.
      - mitigation: D3-EI
        rationale: Workload isolation can constrain execution.
      - mitigation: D3-FIM
        rationale: CWPP host monitoring can detect changes to protected files when file integrity monitoring is
          supported and the relevant paths and rules are configured. This does not verify artifact signatures
          or restore changed files.
        sources:
          - title: Prisma Cloud — May 2025 runtime security features
            url: https://docs.prismacloud.io/en/enterprise-edition/rn/prisma-cloud-release-info/features-introduced-in-2025/features-introduced-in-may-2025
          - title: Prisma Cloud — Host Defender Architecture
            url: https://docs.prismacloud.io/en/enterprise-edition/content-collections/runtime-security/install/deploy-defender/host/host-defender-architecture
  - id: tech-encryption
    title: Encryption Software
    category: Data security
    description: Protects stored or transmitted information using cryptography. Key custody and execution-time
      protection are separate considerations.
    surfaces:
      surfaceEndpoint:
        applies: true
        note: Disk encryption and OS key stores protect local model caches, agent memory files and
          credentials on the device.
      surfaceCloud:
        applies: true
        note: Customer-managed keys over stores, logs and model artifacts, and encrypted transport between
          the components you operate.
      surfaceSaas:
        applies: false
        note: The vendor encrypts the data it holds with its own software and keys; a customer-managed-key
          option is vendor configuration rather than encryption software you deploy, and transport inside
          the vendor's service is invisible to you.
    primarySource:
      framework: enisa-ecsmaf
      entry: encryption
    frameworkMappings:
      - framework: enisa-ecsmaf
        entry: encryption
        relationship: same-category
        rationale: Uses the published category; the display name may expand an acronym or normalize spelling.
      - framework: ecso-market
        entry: encryption
        relationship: same-category
        rationale: Same technology category under ECSO terminology.
      - framework: nist-csf
        entry: PR.DS
        relationship: supports
        rationale: Encryption contributes to confidentiality.
    mitigationMappings:
      - mitigation: AML.M0012
        rationale: Encrypts sensitive AI information.
      - mitigation: D3-MENCR
        rationale: Encrypts inter-component messages.
  - id: tech-tokenisation
    title: Tokenisation Software
    category: Data security
    description: Replaces sensitive values with tokens. Re-identification and token-vault access remain relevant
      to privacy.
    surfaces:
      surfaceEndpoint:
        applies: false
        note: Tokenisation is applied where data is stored or at an application boundary, not by
          device-resident software; a local agent sees whatever the user can see, tokenised or not.
      surfaceCloud:
        applies: true
        note: Tokenise sensitive fields before they enter prompts, retrieval indexes or logs you operate,
          with the vault and re-identification path under your control.
      surfaceSaas:
        applies: true
        note: Achievable only by tokenising through a proxy before the request reaches the vendor, most
          practical for API traffic; the vendor never holds the vault, and its own filters are not a
          substitute.
    primarySource:
      framework: enisa-ecsmaf
      entry: tokenisation
    frameworkMappings:
      - framework: enisa-ecsmaf
        entry: tokenisation
        relationship: same-category
        rationale: Uses the published category; the display name may expand an acronym or normalize spelling.
      - framework: nist-csf
        entry: PR.DS
        relationship: supports
        rationale: Reduces exposure of original sensitive values.
    mitigationMappings:
      - mitigation: AML.M0020
        rationale: Token replacement can implement sensitive-data transformation at AI boundaries.
  - id: tech-access
    title: Access Management
    category: Identity and access
    description: Applies policy decisions to user, service, and agent resource access.
    surfaces:
      surfaceEndpoint:
        applies: true
        note: Device posture feeds the access decision for agents running locally, and resource-scoped roles
          govern what the user identity those agents act under can reach.
      surfaceCloud:
        applies: true
        note: Fully yours across models, datasets, agents and configuration stores, with policy administered
          and mediated in the resource layer you operate.
      surfaceSaas:
        applies: true
        note: Enforced at federation; conditional access gates entry to the vendor application, and tenant
          roles limit which connectors and features a user may enable.
    primarySource:
      framework: enisa-ecsmaf
      entry: access
    frameworkMappings:
      - framework: enisa-ecsmaf
        entry: access
        relationship: same-category
        rationale: Uses the published category; the display name may expand an acronym or normalize spelling.
      - framework: ecso-market
        entry: access
        relationship: same-category
        rationale: Same technology category under ECSO terminology.
      - framework: cisa-tic
        entry: 3.UNI.LPRIV
        relationship: supports
        rationale: Resource policies can enforce least privilege.
      - framework: nist-csf
        entry: PR.AA
        relationship: supports
        rationale: Access decisions directly support access control.
    mitigationMappings:
      - mitigation: D3-AMED
        rationale: Mediates resource requests.
      - mitigation: D3-APA
        rationale: Administers access policies.
      - mitigation: AML.M0005
        rationale: Restricts access to AI models and datasets.
      - mitigation: D3-SCP
        rationale: Access management can restrict configuration reads and changes through resource-scoped roles.
          The configuration store must enforce those roles; this does not automatically protect local prompts,
          manifests, or files outside the managed access boundary.
        sources:
          - title: Microsoft — Azure App Configuration role-based access control
            url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/concept-enable-rbac
  - id: tech-iga
    title: Identity Governance and Administration (IGA)
    category: Identity and access
    description: Manages identity lifecycles and entitlement review, including service identities when supported.
    surfaces:
      surfaceEndpoint:
        applies: true
        note: Lifecycle and entitlement review cover the human accounts local agents act under;
          deprovisioning cuts off what an agent on a departed user's device can still reach.
      surfaceCloud:
        applies: true
        note: Governs workload, service and agent identities alongside human ones where the platform
          supports them, with entitlement review over model, data and tool access.
      surfaceSaas:
        applies: true
        note: Provisioning and deprovisioning of seats in the vendor application flow through SCIM or
          federation, and entitlement review covers the connectors users have authorised.
    primarySource:
      framework: enisa-ecsmaf
      entry: iga
    frameworkMappings:
      - framework: enisa-ecsmaf
        entry: iga
        relationship: same-category
        rationale: Uses the published category; the display name may expand an acronym or normalize spelling.
      - framework: ecso-market
        entry: identity
        relationship: narrower
        rationale: Identity governance and administration is a subset of the broader identity-management group.
      - framework: cisa-tic
        entry: 3.PEP.ID.EIAMA
        relationship: supports
        rationale: Identity lifecycle administration supports enterprise IAM.
      - framework: nist-csf
        entry: PR.AA
        relationship: supports
        rationale: Entitlement review supports appropriate access.
    mitigationMappings:
      - mitigation: D3-APA
        rationale: Maintains and reviews entitlement policies.
      - mitigation: D3-CR
        rationale: Deprovisioning can revoke obsolete credentials.
  - id: tech-pam
    title: Privileged Access Management (PAM)
    category: Identity and access
    description: Controls privileged sessions and credentials. Agent credentials require explicit support rather
      than assumed coverage.
    surfaces:
      surfaceEndpoint:
        applies: true
        note: Local agent configuration files are a notorious home for long-lived plaintext tokens; vaulting
          and brokered, short-lived credentials remove them from the device.
      surfaceCloud:
        applies: true
        note: Brokered credentials with per-session scope, rotation and revocation are directly achievable
          for the workloads and agents you operate.
      surfaceSaas:
        applies: true
        note: Partial. You govern the admin accounts and connector credentials you authorise for the vendor
          tenant; the vendor manages its own internal secrets.
    primarySource:
      framework: enisa-ecsmaf
      entry: pam
    frameworkMappings:
      - framework: enisa-ecsmaf
        entry: pam
        relationship: same-category
        rationale: Uses the published category; the display name may expand an acronym or normalize spelling.
      - framework: cisa-tic
        entry: 3.PEP.ID.SMANA
        relationship: supports
        rationale: Credential vaulting and lifecycle controls support secrets management.
      - framework: cisa-tic
        entry: 3.UNI.LPRIV
        relationship: supports
        rationale: Just-in-time privilege can constrain administrative access.
      - framework: nist-csf
        entry: PR.AA
        relationship: supports
        rationale: Privileged-access enforcement supports authorization.
    mitigationMappings:
      - mitigation: D3-CRO
        rationale: Can rotate managed privileged credentials.
      - mitigation: D3-CH
        rationale: Vaulting and policy can harden credentials.
      - mitigation: D3-CR
        rationale: Can revoke privileged credentials.
  - id: tech-authentication
    title: Multi-factor and User Authentication Software
    category: Identity and access
    description: Verifies identities with suitable factors. Human MFA and machine authentication are distinct
      implementation paths.
    surfaces:
      surfaceEndpoint:
        applies: true
        note: MFA gates the user session a local agent inherits, and device-bound credentials can anchor the
          agent's own identity.
      surfaceCloud:
        applies: true
        note: Human MFA and machine authentication for services and agents are both yours to implement
          across the planes you operate.
      surfaceSaas:
        applies: true
        note: Enforced at federation; the identity provider requires MFA before the vendor application is
          reached, and vendor agents authenticate to your systems as registered identities.
    primarySource:
      framework: enisa-ecsmaf
      entry: authentication
    frameworkMappings:
      - framework: enisa-ecsmaf
        entry: authentication
        relationship: same-category
        rationale: Uses the published category; the display name may expand an acronym or normalize spelling.
      - framework: ecso-market
        entry: authentication
        relationship: narrower
        rationale: Multi-factor user authentication is within ECSO’s broader authentication group.
      - framework: cisa-tic
        entry: 3.UNI.SAUTH
        relationship: supports
        rationale: Robust authentication supports identity verification.
      - framework: nist-csf
        entry: PR.AA
        relationship: supports
        rationale: Authentication establishes identity for access decisions.
    mitigationMappings:
      - mitigation: D3-MFA
        rationale: Implements multi-factor verification for supported identities.
      - mitigation: D3-AA
        rationale: Authentication services can authenticate software agents.
  - id: tech-endpoint
    title: Endpoint Protection / Endpoint Detection and Response
    category: Infrastructure protection
    description: Monitors endpoints and provides prevention, investigation, and response functions. It does not by
      itself inspect every model interaction.
    surfaces:
      surfaceEndpoint:
        applies: true
        note: The primary surface, the only place with kernel-level visibility into what an agent actually
          did on the device.
      surfaceCloud:
        applies: true
        note: Host-level coverage of the servers running inference and agent workloads, typically delivered
          through the same agent or its workload-protection sibling.
      surfaceSaas:
        applies: false
        note: No agent can be installed on vendor infrastructure.
    primarySource:
      framework: enisa-ecsmaf
      entry: endpoint
    frameworkMappings:
      - framework: enisa-ecsmaf
        entry: endpoint
        relationship: same-category
        rationale: Uses the published category; the display name may expand an acronym or normalize spelling.
      - framework: ecso-market
        entry: endpoint
        relationship: same-category
        rationale: Same technology category under ECSO terminology.
      - framework: nist-csf
        entry: DE.CM
        relationship: supports
        rationale: Endpoint telemetry supports monitoring.
      - framework: nist-csf
        entry: RS.MI
        relationship: supports
        rationale: Endpoint containment contributes to incident mitigation.
    mitigationMappings:
      - mitigation: D3-PA
        rationale: Analyzes endpoint processes.
      - mitigation: D3-FA
        rationale: Examines suspicious files.
      - mitigation: D3-PT
        rationale: Can terminate malicious processes.
  - id: tech-swg
    title: Secure Web Gateways (SWG)
    category: Infrastructure protection
    description: Inspects and restricts web traffic where the gateway is on the traffic path.
    surfaces:
      surfaceEndpoint:
        applies: true
        note: Delivered by the device agent when traffic does not traverse a corporate network, keeping
          inspection with the user wherever the agent runs.
      surfaceCloud:
        applies: true
        note: Applies to workload egress toward external model providers and to internally hosted AI
          interfaces reached through the browser.
      surfaceSaas:
        applies: true
        note: The primary inspection point for vendor AI, and often the only one available; in-vendor calls
          that never cross your network path are out of reach.
    primarySource:
      framework: enisa-ecsmaf
      entry: swg
    frameworkMappings:
      - framework: enisa-ecsmaf
        entry: swg
        relationship: same-category
        rationale: Uses the published category; the display name may expand an acronym or normalize spelling.
      - framework: cisa-tic
        entry: 3.PEP.WE.DLPRE
        relationship: supports
        rationale: A gateway with DLP inspection can protect sensitive web transfers.
      - framework: nist-csf
        entry: PR.IR
        relationship: supports
        rationale: Gateway access policy supports network protection.
    mitigationMappings:
      - mitigation: D3-OTF
        rationale: Enforces outbound web policies.
      - mitigation: D3-WSAA
        rationale: Can inspect suspicious web sessions.
  - id: tech-siem
    title: Security Information and Event Management (SIEM)
    category: Security operations
    description: Collects and correlates security telemetry. AI events must be supplied by instrumented
      applications and services.
    surfaces:
      surfaceEndpoint:
        applies: true
        note: Fed by endpoint telemetry from local agents and their tool calls, which requires shipping logs
          off the device; local-only logs are not evidence.
      surfaceCloud:
        applies: true
        note: The deepest signal set, straight from your own inference and agent planes, with immutable
          retention.
      surfaceSaas:
        applies: true
        note: Only as good as the vendor's exported audit events, which are usually coarse and delayed;
          ingesting them is still the main visibility you get.
    primarySource:
      framework: enisa-ecsmaf
      entry: siem
    frameworkMappings:
      - framework: enisa-ecsmaf
        entry: siem
        relationship: same-category
        rationale: Uses the published category; the display name may expand an acronym or normalize spelling.
      - framework: ecso-market
        entry: siem
        relationship: same-category
        rationale: Same technology category under ECSO terminology.
      - framework: cisa-tic
        entry: 3.UNI.AACCO
        relationship: supports
        rationale: Central log retention supports auditing.
      - framework: nist-csf
        entry: DE.AE
        relationship: supports
        rationale: Event correlation supports analysis.
      - framework: nist-csf
        entry: DE.CM
        relationship: supports
        rationale: Telemetry collection supports monitoring.
    mitigationMappings:
      - mitigation: AML.M0024
        rationale: Can ingest and retain AI telemetry supplied by applications.
      - mitigation: D3-RAPA
        rationale: Correlated access events can support resource-access analysis.
  - id: tech-soar
    title: Security Orchestration, Automation and Response (SOAR)
    category: Security operations
    description: Coordinates incident workflows and response integrations; action execution depends on connected
      enforcement systems.
    surfaces:
      surfaceEndpoint:
        applies: true
        note: Playbooks can isolate a device, terminate an agent process and revoke the credentials it held
          through endpoint and identity integrations.
      surfaceCloud:
        applies: true
        note: Full control through platform integrations; stop the workload, revoke the identity and purge
          the state as automated response steps.
      surfaceSaas:
        applies: true
        note: Reduces to disabling the application and revoking sessions and connector authorisations
          through the identity provider; nothing inside the vendor can be acted on directly.
    primarySource:
      framework: enisa-ecsmaf
      entry: soar
    frameworkMappings:
      - framework: enisa-ecsmaf
        entry: soar
        relationship: same-category
        rationale: Uses the published category; the display name may expand an acronym or normalize spelling.
      - framework: cisa-tic
        entry: 3.UNI.IRPIH
        relationship: supports
        rationale: Response automation supports incident handling.
      - framework: nist-csf
        entry: RS.MA
        relationship: supports
        rationale: Playbooks coordinate incident response.
      - framework: nist-csf
        entry: RS.MI
        relationship: supports
        rationale: Integrated actions can contain incidents.
    mitigationMappings:
      - mitigation: D3-CR
        rationale: Can orchestrate credential revocation through an identity integration.
      - mitigation: D3-PT
        rationale: Can orchestrate process termination through an endpoint integration.
  - id: tech-ast
    title: Application Security Testing
    category: Assurance
    description: Tests application code and running behavior for weaknesses. Model-specific evaluations remain
      separately identified.
    surfaces:
      surfaceEndpoint:
        applies: true
        note: Highly relevant; coding agents on developer machines generate code that needs the same testing
          gates, and local tool servers are code too.
      surfaceCloud:
        applies: true
        note: Runs in the pipeline that builds and deploys your AI application, including dynamic testing of
          the running system.
      surfaceSaas:
        applies: false
        note: You have no access to the vendor's application code or running system to test; its findings
          come through attestations.
    primarySource:
      framework: enisa-ecsmaf
      entry: ast
    frameworkMappings:
      - framework: enisa-ecsmaf
        entry: ast
        relationship: same-category
        rationale: Uses the published category; the display name may expand an acronym or normalize spelling.
      - framework: ecso-market
        entry: ast
        relationship: narrower
        rationale: Testing is one part of the broader application-security category.
      - framework: nist-csf
        entry: ID.RA
        relationship: supports
        rationale: Testing identifies vulnerabilities.
      - framework: nist-csf
        entry: PR.PS
        relationship: supports
        rationale: Security testing contributes to secure development.
    mitigationMappings:
      - mitigation: D3-DA
        rationale: Dynamic testing can analyze executed application behavior.
      - mitigation: D3-SYSVA
        rationale: Testing can assess application/system vulnerabilities.
  - id: tech-vulnerability
    title: Vulnerability Assessment
    category: Assurance
    description: Discovers and evaluates weaknesses in assets and software. Remediation is a separate workflow.
    surfaces:
      surfaceEndpoint:
        applies: true
        note: Covers agent runtimes, extensions and locally installed tool servers on the device.
      surfaceCloud:
        applies: true
        note: The full stack is yours to scan and assess, from hosts and containers to model-serving
          dependencies.
      surfaceSaas:
        applies: false
        note: Scanning the vendor's stack is neither permitted nor possible; patching it is the vendor's
          obligation and you get attestations at best.
    primarySource:
      framework: enisa-ecsmaf
      entry: vulnerability
    frameworkMappings:
      - framework: enisa-ecsmaf
        entry: vulnerability
        relationship: same-category
        rationale: Uses the published category; the display name may expand an acronym or normalize spelling.
      - framework: ecso-market
        entry: vulnerability
        relationship: narrower
        rationale: Assessment is the discovery and analysis subset of vulnerability management.
      - framework: cisa-tic
        entry: 3.UNI.VMANG
        relationship: supports
        rationale: Assessment supplies findings for vulnerability management.
      - framework: nist-csf
        entry: ID.RA
        relationship: supports
        rationale: Findings inform risk assessment.
    mitigationMappings:
      - mitigation: D3-AVE
        rationale: Enumerates known asset vulnerabilities.
      - mitigation: D3-SYSVA
        rationale: Assesses system vulnerability exposure.
  - id: tech-vendor-risk
    title: Vendor Risk Management
    category: Governance
    description: Assesses supplier security exposure and tracks evidence relevant to supplied AI services and artifacts.
    surfaces:
      surfaceEndpoint:
        applies: true
        note: Applies to the agent and extension vendors whose software runs on your devices.
      surfaceCloud:
        applies: true
        note: Covers model providers, hosting platforms and framework suppliers behind the systems you
          operate.
      surfaceSaas:
        applies: true
        note: The dominant control for vendor AI, where most other capabilities cannot reach.
    primarySource:
      framework: enisa-ecsmaf
      entry: vendor-risk
    frameworkMappings:
      - framework: enisa-ecsmaf
        entry: vendor-risk
        relationship: same-category
        rationale: Uses the published category; the display name may expand an acronym or normalize spelling.
      - framework: ecso-market
        entry: supply-chain
        relationship: narrower
        rationale: Vendor risk assessment contributes to broader supply-chain monitoring.
      - framework: nist-csf
        entry: GV.SC
        relationship: supports
        rationale: Supplier assessment supports supply-chain risk management.
    mitigationMappings:
      - mitigation: D3-ORA
        rationale: Supplier assessment can inform operational risk decisions.
  - id: tech-audit
    title: Audit and Compliance Management
    category: Governance
    description: Organizes control evidence and assessment workflows. A recorded mapping is not evidence that a
      control operates effectively.
    surfaces:
      surfaceEndpoint:
        applies: true
        note: Collects evidence that agent rollout, permission and logging controls are actually configured
          across the device fleet.
      surfaceCloud:
        applies: true
        note: The richest evidence, populated directly from the platforms and pipelines you operate.
      surfaceSaas:
        applies: true
        note: Organises the vendor's attestations, contract terms and exported tenant settings as evidence;
          a recorded mapping is still not proof the vendor's control operates.
    primarySource:
      framework: enisa-ecsmaf
      entry: audit
    frameworkMappings:
      - framework: enisa-ecsmaf
        entry: audit
        relationship: same-category
        rationale: Uses the published category; the display name may expand an acronym or normalize spelling.
      - framework: ecso-market
        entry: grc
        relationship: narrower
        rationale: Audit/compliance management is part of the broader GRC group.
      - framework: nist-csf
        entry: GV.OV
        relationship: supports
        rationale: Assessment evidence informs governance oversight.
    mitigationMappings:
      - mitigation: D3-ORA
        rationale: Assurance evidence can support operational risk assessment.
  - id: tech-enclaves
    title: Secure Enclaves
    category: Infrastructure protection
    description: Protects execution within a hardware-backed isolation boundary, subject to platform guarantees
      and configuration.
    surfaces:
      surfaceEndpoint:
        applies: false
        note: Device enclaves exist but are not an available deployment target for agent workloads.
      surfaceCloud:
        applies: true
        note: Offered as confidential VM and accelerator families you can select for inference and training.
      surfaceSaas:
        applies: false
        note: An internal vendor architecture decision, not a customer control.
    primarySource:
      framework: enisa-ecsmaf
      entry: enclaves
    frameworkMappings:
      - framework: enisa-ecsmaf
        entry: enclaves
        relationship: same-category
        rationale: Uses the published category; the display name may expand an acronym or normalize spelling.
      - framework: nist-csf
        entry: PR.DS
        relationship: supports
        rationale: Protected execution can reduce exposure of data in use.
    mitigationMappings:
      - mitigation: D3-HBPI
        rationale: Implements hardware-based isolation for protected processes.
  - id: tech-firewalls
    title: Firewalls / Next-generation Firewalls
    category: Infrastructure protection
    description: Enforces traffic policy between network boundaries. Model-aware content inspection requires
      additional features.
    surfaces:
      surfaceEndpoint:
        applies: true
        note: Host firewall and the device's own network stack, together with agent sandbox configuration,
          restrict where a local agent can connect.
      surfaceCloud:
        applies: true
        note: Subnet, firewall and egress-proxy policy around inference and agent workloads, enforcing
          segmentation between planes.
      surfaceSaas:
        applies: false
        note: Perimeter rules can only permit or deny the path to the vendor's published endpoints;
          segmentation inside the vendor's service is theirs, and AI-specific policy at that edge belongs to
          the gateway and CASB.
    primarySource:
      framework: enisa-ecsmaf
      entry: firewalls
    frameworkMappings:
      - framework: enisa-ecsmaf
        entry: firewalls
        relationship: same-category
        rationale: Uses the published category; the display name may expand an acronym or normalize spelling.
      - framework: ecso-market
        entry: firewalls
        relationship: same-category
        rationale: Same technology category under ECSO terminology.
      - framework: nist-csf
        entry: PR.IR
        relationship: supports
        rationale: Traffic restrictions support network protection.
    mitigationMappings:
      - mitigation: D3-OTF
        rationale: Restricts outbound traffic.
      - mitigation: D3-NI
        rationale: Enforces network-segment isolation.
  - id: tech-sandbox
    title: Sandboxing
    category: Infrastructure protection
    description: Runs untrusted code in a constrained environment. Detonation for analysis is one specialized sandbox use.
    surfaces:
      surfaceEndpoint:
        applies: true
        note: The main containment mechanism for CLI and desktop coding agents on developer machines.
      surfaceCloud:
        applies: true
        note: Per-session isolated runtimes for hosted agents, torn down after each task, plus instrumented
          sandboxes for analysing untrusted code and files.
      surfaceSaas:
        applies: false
        note: The vendor's agents execute in the vendor's own isolation; where a managed runtime exposes a
          session sandbox it is vendor configuration, not sandboxing software you deploy.
    primarySource:
      framework: ecso-market
      entry: sandbox
    frameworkMappings:
      - framework: ecso-market
        entry: sandbox
        relationship: same-category
        rationale: Uses the published category; the display name may expand an acronym or normalize spelling.
      - framework: cisa-tic
        entry: 3.PEP.FI.DCHAM
        relationship: supports
        rationale: An analysis sandbox can implement a detonation chamber; ordinary isolation alone does not.
      - framework: nist-csf
        entry: PR.PS
        relationship: supports
        rationale: Execution restrictions can protect the platform.
    mitigationMappings:
      - mitigation: D3-EI
        rationale: Constrains untrusted execution.
      - mitigation: D3-DA
        rationale: Instrumented sandboxes can analyze runtime behavior.
