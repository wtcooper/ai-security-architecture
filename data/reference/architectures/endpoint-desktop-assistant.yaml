id: archDesktopAssistant
surface: surfaceEndpoint
title: Desktop assistant with computer use
abbrev: Desktop assistant

summary:
  - >
    A consumer-shaped desktop application that reads local files and drives the graphical
    interface — moving the pointer, typing, and clicking through applications that have no API and
    no concept of an agent operating them.

description:
  - >
    Computer use is the distinguishing capability and the distinguishing problem. When an agent
    acts through the GUI it inherits every application already open and signed in, through an
    interface built entirely on the assumption that a human is driving. There is no authorization
    decision available at the point of action: the application receives a click. Tool permission
    scoping works when tools are named and enumerable; here the tool is "the screen", and the
    reachable action set is everything a person at that desk could do. The controls that remain
    are containment — a contained desktop with its own filesystem and accounts — and the approval
    gate.
  - >
    The input side is broad. The assistant reads whatever the user points it at: documents,
    spreadsheets, mail, screenshots. Any of those may have been authored by someone else, and
    screenshot text carries no provenance at all. Connectors are the third axis: standing OAuth
    grants into mail, calendar and storage, authorised once in a moment of enthusiasm, scoped to a
    service rather than a task, and outliving the conversation that prompted them.
  - >
    There is no governance column here, and its absence is the finding. The only policy plane in
    this architecture is the operating system's permission prompts — one-time consent dialogs
    gating file access, screen recording and input control, granted per capability and never per
    action. They are drawn on the request path because every screen and file operation crosses a
    grant made once; nothing organisational sits behind them unless device management is imposed
    on the endpoint from outside this drawing.

distinguishedBy:
  - >
    Against the agentic browser: that one's authority is a cookie jar and its input is a web page.
    This one's authority includes the local filesystem and every open desktop application, and its
    input includes screenshots — where an injection can be a picture of text.
  - >
    Against the coding agent: same vendor discipline around credentials and updates, but no
    working directory to scope to and no repository to blame. The coding agent's blast radius is a
    project; this one's is a desktop.

exemplars:
  - name: Desktop assistants with a computer-use mode
    note: >
      A consumer application with local file access and an opt-in mode that drives the GUI,
      usually inside a contained virtual desktop rather than the user's own session.
    asOf: "2026-08"
  - name: OS-integrated assistants
    note: >
      Assistants shipped with the operating system, holding read access across local content and
      increasingly the ability to act in first-party applications.
    asOf: "2026-08"

blocks:
  - id: user
    kind: actor
    title: User
    icon: person
    col: 0
    row: 1
    note: >
      Grants access, sets the task, and approves the actions the product decides to ask about.
      The broadest authorization decisions here are the ones made once, in a dialog.

  - id: content
    kind: external
    title: Docs & screen content
    col: 0
    row: 2
    note: >
      Files, mail, spreadsheets and screenshots the assistant reads. Any of them may have been
      authored by someone else, and screenshot text has no provenance at all — the hardest input
      on this diagram to filter.
    items:
      - id: documents
        label: Documents & mail
        icon: doc
        note: Authored by anyone, read into context as though the user wrote it.
      - id: screenshots
        label: Screenshots
        icon: eye
        note: Text as pixels — an injection can be a picture of an instruction.

  - id: provider
    kind: provider
    title: Model provider
    col: 1
    row: 0
    cosaiComponent: componentModelServing
    note: >
      The inference API and the vendor's connector broker — the published surfaces. Everything
      behind them is the vendor's, and is not drawn.
    items:
      - id: inference
        label: Inference API
        icon: model
        note: Receives document text and screenshots; the completion drives a click on a real application.
      - id: connectorBroker
        label: Connector broker
        icon: plug
        note: Holds the OAuth grants into the user's services and exercises them on the assistant's behalf.

  - id: assistant
    kind: service
    title: Assistant application
    col: 1
    row: 1
    cosaiComponent: componentReasoningCore
    note: >
      The window the user talks to and the loop behind it: reads content, plans, and issues file
      operations or screen actions. Installed by the user, and in no inventory.
    items:
      - id: loop
        label: Agent loop
        icon: agent
        note: Plans the next file operation or screen action from the task and everything read so far.
      - id: fileTools
        label: Local file tools
        icon: folder
        note: >
          Read and often write across the user's documents. Folder selection is a preference, not
          an enforced boundary.
      - id: approval
        label: Action approval
        icon: shield
        note: >
          The only authorization point available for GUI actions, because the applications being
          driven have none. Its coverage is a product decision.

  - id: osPerms
    kind: service
    title: OS permission layer
    col: 2
    row: 1
    note: >
      The operating system's consent prompts — file access, screen recording, input control — are
      the only policy plane this architecture has. Each is granted once, per capability, and
      covers every future action that capability enables.
    items:
      - id: screenGrant
        label: Screen recording grant
        icon: eye
        note: Approved once; every subsequent capture rides the same consent.
      - id: inputGrant
        label: Input control grant
        icon: gear
        note: The grant that turns a completion into a click.
      - id: fileGrant
        label: File access grant
        icon: folder
        note: Folder-level consent that the assistant's tools inherit wholesale.

  - id: vm
    kind: service
    title: Contained desktop
    col: 3
    row: 1
    cosaiComponent: componentTools
    note: >
      A separate virtual desktop with its own filesystem and accounts, where computer use runs in
      the target state. Where products run uncontained, these actions land on the user's own
      desktop and the approval prompt is the sole control.
    items:
      - id: screenControl
        label: Screen & input control
        icon: gear
        note: Pointer, keyboard and capture — the tool that cannot be enumerated.
      - id: guiApps
        label: GUI applications
        icon: globe
        note: Driven through interfaces that cannot tell an agent from a person.
      - id: workspace
        label: Contained workspace
        icon: folder
        note: The files and sessions the agent can reach when containment is on.

  - id: connected
    kind: external
    title: Connected services
    col: 3
    row: 0
    note: >
      Mail, calendar and storage reached through standing OAuth grants. Authorised once, scoped to
      a service rather than a task, and outliving the conversation that prompted them — this
      archetype's reach extends well beyond the machine.
    items:
      - id: mailCal
        label: Mail & calendar
        icon: mail
        note: The grant that reads one invite reads the whole calendar, on every turn.
      - id: storage
        label: File storage
        icon: db
        note: Cloud documents pulled into context through a grant the user forgot they gave.

edges:
  - from: user
    to: assistant
    path: primary
    bidir: true
    label: task / approval
    note: >
      The task in and the approvals back. The consent that matters most was granted once, in a
      dialog, and covers every future turn.
  - from: content
    to: assistant
    path: external
    label: read into context
    note: >
      Documents and screenshots become context. Screenshot text has no provenance, so nothing
      upstream can classify who wrote it.
  - from: assistant
    to: provider
    path: primary
    bidir: true
    note: >
      Document text and screenshots leave for inference — usually more than the user pictured —
      and the completion that returns drives a click on a real application.
  - from: assistant
    to: osPerms
    path: primary
    bidir: true
    label: capability use
    note: >
      Every file, screen and input operation crosses a grant the OS collected once. The prompt is
      per capability, never per action.
  - from: osPerms
    to: vm
    path: primary
    bidir: true
    label: screen actions
    note: >
      Granted actions land in the contained desktop; screen content comes back as context. Without
      containment this edge points at the user's own session instead.
  - from: provider
    to: connected
    path: external
    bidir: true
    note: >
      The broker exercises standing grants; mail and documents return and re-enter context — the
      same indirect injection path as retrieval, through a grant nobody is watching.

pins:
  risks:
    - risk: riskPromptInjection
      at: content->assistant
      note: >
        Documents, mail and screenshots all reach the same context window, and the screenshot path
        carries text with no provenance at all.
    - risk: riskPromptInjection
      at: provider->connected
      note: >
        Connector content — mail written by strangers, shared documents — re-enters context
        through a standing grant, on every turn.
    - risk: riskExcessiveDataHandlingDuringInference
      at: assistant->provider
      note: Documents and screenshots leave for inference, which is usually more than the user pictured sharing.
    - risk: riskInsecureModelOutput
      at: assistant->provider
      note: The completion drives a pointer on a real application, and nothing authenticates whose intent it encodes.
    - risk: riskRogueActions
      at: osPerms->vm
      note: >
        The driven application receives a click. There is no authorization decision available at
        the point of action — only containment and the approval prompt upstream.
    - risk: riskAgenticDelegationConfusedDeputy
      at: vm
      note: >
        GUI applications carry whatever authority is already signed in, and cannot tell an agent
        from the person the session belongs to.
    - risk: riskExcessiveDataHandling
      at: provider->connected
      note: >
        Standing grants scoped to a service, not a task. Each was consented to individually; the
        reach is their union, and nobody consented to that.
    - risk: riskShadowAndUnknownAgents
      at: assistant
      note: >
        A consumer application installed by the user, appearing in no inventory, with the OS
        consent dialogs as the only policy anyone applied.

  capabilities:
    - capability: capabilityAgentSandboxing
      at: vm
      note: >
        Keep computer use in the contained desktop with its own filesystem and accounts — never
        the user's own session. The archetype's primary control.
    - capability: capabilityHitlControls
      at: assistant
      note: >
        Approval before consequential actions, with coverage set by consequence — it is the only
        authorization the GUI path will ever have.
    - capability: capabilityPromptInjectionDefense
      at: content->assistant
      note: Classify documents and extracted screenshot text on the way in; bound what an embedded instruction can achieve.
    - capability: capabilityToolPermissionScoping
      at: osPerms
      note: >
        Narrow the OS grants — folder-scoped file access, screen recording only for the contained
        display — so the one-time consents cover less.
    - capability: capabilityAiDlp
      at: assistant->provider
      note: Redact what document and screen content may leave for inference, because the inputs are the user's private files.
    - capability: capabilityEgressControl
      at: vm
      note: Default-deny network from the contained desktop, so a hijacked session cannot deliver its findings.
    - capability: capabilityIga
      at: provider->connected
      note: Review and narrow the standing connector grants; expire the ones no task has used.
    - capability: capabilityCredentialIsolation
      at: vm
      note: The contained desktop gets its own accounts and sessions, not the user's — containment includes credentials.
    - capability: capabilityEdr
      at: assistant
      note: >
        Endpoint telemetry on the assistant process and its file reach — screen action sequences
        are the hardest thing here to reconstruct after the fact.

scenarios:
  - title: Summarise this folder
    steps:
      - follow: user->assistant
        note: A routine request against the user's own documents.
      - follow: content->assistant
        note: The folder is read into context — including files the user never opened themselves.
      - follow: assistant->provider
        note: The documents leave for inference.
      - follow: assistant->user
        note: The summary returns; the data already left in step three.
  - title: A poisoned document drives the screen
    steps:
      - follow: content->assistant
        note: An instruction embedded in a shared document — or in a screenshot as pixels — enters context.
      - follow: assistant->provider
        note: The instruction shapes the completion, which the loop treats as the plan.
      - follow: assistant->osPerms
        note: The grants were given weeks ago; no new consent is requested.
      - follow: osPerms->vm
        note: >
          Clicks land on GUI applications. Contained, the blast radius is the virtual desktop;
          uncontained, it is everything signed in.
  - title: The connector grant outlives the task
    steps:
      - follow: assistant->provider
        note: The assistant asks the broker for calendar context.
      - follow: provider->connected
        note: The standing grant reads the whole calendar, as it can on any turn.
      - follow: connected->provider
        note: Content authored by strangers returns through the broker.
      - follow: provider->assistant
        note: It re-enters context with the same standing as the user's words.

sources:
  - title: "OWASP Securing Agentic Applications Guide 1.0 — computer use and desktop agents"
    url: https://genai.owasp.org/resource/securing-agentic-applications-guide-1-0/
  - title: "OWASP Top 10 for Agentic Applications 2026 — ASI03 identity and privilege abuse"
    url: https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/
  - title: "Five Eyes joint guidance — careful adoption of agentic AI services"
    url: https://www.ncsc.govt.nz/assets/guidance/Documents/Careful-adoption-of-agentic-AI-services_FINAL.pdf
