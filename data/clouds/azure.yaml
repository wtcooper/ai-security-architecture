      - id: dynamicSessions
        kind: runtime
        name: "Azure Container Apps dynamic sessions (custom container session pools)"
        url: https://learn.microsoft.com/en-us/azure/container-apps/sessions-custom-container
        asOf: "2026-11"
        compare:
          runs: "The session pool starts your image in Hyper-V sandboxes, hands one to each session identifier, and destroys it on stop, idle cooldown or container exit."
          patching: "The platform runs the hosts and sandbox layer; you rebuild your image and update the pool to a new tag, because the pool caches the image it was given."
          data: "Code, files and results exist inside the session and go when it is destroyed; console output can be sent to your Log Analytics workspace."
          network: "Outbound traffic is off by default and is one on-or-off setting per pool; requests enter only through the pool management endpoint with a Microsoft Entra token."
          identity: "Session code has no identity unless the pool's managed identity is deliberately exposed to it; callers need the Azure ContainerApps Session Executor role."
          accepts: "Any container image that serves HTTP on a target port, in any language, with CPU and memory set per session and pulled from a registry by key or managed identity."
          workload: "Prewarmed sessions are allocated in under a second; a session ends after 300 to 3,600 idle seconds or a maximum alive period; pools cap concurrent sessions."
          portability: "The image runs anywhere containers run; allocation by identifier, the management API calls and pool settings are specific to session pools."
          effort: "Your team owns the image, the pool's ready and maximum session counts, session identifiers, role assignments and logs; there are no nodes or cluster to run."
          fits: "Microsoft names it for sandboxes that need a custom runtime, libraries, binaries or tools that the built-in interpreters do not provide."
        sources:
          - https://learn.microsoft.com/en-us/azure/container-apps/sessions
          - https://learn.microsoft.com/en-us/azure/container-apps/session-pool
          - https://learn.microsoft.com/en-us/azure/container-apps/sessions-custom-container
          - https://learn.microsoft.com/en-us/azure/container-apps/sessions-usage
          - https://learn.microsoft.com/en-us/azure/container-apps/billing
          - https://learn.microsoft.com/en-us/rest/api/resource-manager/containerapps/container-apps-session-pools/create-or-update
          - https://learn.microsoft.com/en-us/azure/azure-monitor/reference/supported-logs/microsoft-app-managedenvironments-logs
        summary: "Each rollout's sandbox becomes a session in a custom container session pool: your image in a Hyper-V sandbox that the platform allocates, isolates and destroys. The Kata node pools and their sizing go away. Because a session has no outbound network by default and only an on-or-off switch, the harness moves outside and drives a tool server in the session over HTTP; the orchestrator, graders, inference and offline web stay on AKS."
        bindings:
          - { block: sandbox, service: "Container Apps custom container session pool", note: "One Hyper-V isolated session per rollout, allocated from prewarmed instances by a session identifier the orchestrator generates, and destroyed by stopSession, cooldown or container exit.", url: https://learn.microsoft.com/en-us/azure/container-apps/sessions-custom-container }
          - { block: harness, service: "Your episode harness on AKS, driving the session over HTTP", build: true, note: "Runs beside the orchestrator, not in the sandbox, because a session with outbound traffic disabled cannot call the inference runtime; it sends each action through the pool management endpoint.", url: https://learn.microsoft.com/en-us/azure/container-apps/sessions-usage }
          - { block: localTools, service: "Shell, file and browser tool server in the session image", build: true, note: "An HTTP server in your image on the pool's target port; anything after the management endpoint in the request path is forwarded to it.", url: https://learn.microsoft.com/en-us/azure/container-apps/sessions-usage }
          - { block: platform, service: "Azure Monitor session logs (Log Analytics)", note: "Console output and session lifecycle events reach Log Analytics through the environment's logging. Sessions get no identity by default, and no shared volume is documented.", url: https://learn.microsoft.com/en-us/azure/container-apps/sessions-custom-container }
        dropSettings: [aksPodSandboxing, aksFqdnFiltering]
        addSettings: [sessionPoolEgress, sessionExecutorRole, sessionPoolIdentityLifecycle, sessionPoolLifecycle, sessionStopApi, sessionPoolLogs]
        differences:
          - at: harness->inference
            text: "By default a session cannot make outbound requests, so a harness inside the sandbox cannot sample actions from the inference runtime. The documented way in is the pool management endpoint, so the harness runs outside and sends each action in. Enabling egress to call inference from inside would open the sandbox to the internet as well."
            url: https://learn.microsoft.com/en-us/azure/container-apps/sessions-usage
          - at: localTools->offlineWeb
            text: "Session networking is one setting with two values, EgressDisabled and EgressEnabled; Microsoft's warning for the second is that code in the session can access the internet. The pages read describe no destination list or route for session traffic, so a browsing task cannot be held to the offline web here. Keep such tasks on the AKS option."
            url: https://learn.microsoft.com/en-us/azure/container-apps/session-pool
          - at: localTools->registry
            text: "With outbound traffic disabled a rollout cannot install packages at run time, pinned or not. Everything it needs is built into the session image from the private feed beforehand. The pool caches that image, and changes reach sessions only when the pool is updated to a new, unique image tag."
            url: https://learn.microsoft.com/en-us/azure/container-apps/session-pool
          - at: graders->harness
            text: "The pages read describe one data-plane role: a token holder can create and enter any session in the pool, so graders cannot be given read-only access to a sandbox. Have the orchestrator fetch the end state through your tool server and hand it to the graders. Session identifiers alone separate rollouts, so generate them unpredictably and never take one from model output."
            url: https://learn.microsoft.com/en-us/azure/container-apps/sessions-usage
          - at: localTools->platform
            text: "There is no token issuance to the sandbox unless the pool's managed identity is exposed with lifecycle Main, which lets any code in the session act as that identity. No shared volume is documented either, so files and results leave only through your tool server's HTTP API, and logs are collected by the platform from console output."
            url: https://learn.microsoft.com/en-us/azure/container-apps/sessions-usage
        alsoNeeded:
          - service: "Container Apps environment with workload profiles"
            role: other
            why: "A custom container session pool must be created in a workload profiles environment, which also holds its logging configuration."
            url: https://learn.microsoft.com/en-us/azure/container-apps/session-pool
          - service: "Azure Container Registry with a user-assigned managed identity for image pull"
            role: registry
            why: "The pool pulls the session image itself; a managed identity avoids storing a registry password in the pool definition."
            url: https://learn.microsoft.com/en-us/azure/container-apps/sessions-usage
          - service: "Log Analytics workspace"
            role: logging
            why: "Session console and lifecycle logs are emitted only when the environment sends them to a workspace."
            url: https://learn.microsoft.com/en-us/azure/container-apps/sessions-custom-container
          - service: "Microsoft Entra role assignment for the caller"
            role: identity
            why: "The orchestrator and harness reach sessions with tokens and the Session Executor role instead of Kubernetes credentials."
            url: https://learn.microsoft.com/en-us/azure/container-apps/sessions-usage
        quickstart:
          - title: "Custom container sessions in Azure Container Apps"
            url: https://learn.microsoft.com/en-us/azure/container-apps/sessions-custom-container
          - title: "Use session pools in Azure Container Apps"
            url: https://learn.microsoft.com/en-us/azure/container-apps/session-pool
          - title: "Use dynamic sessions in Azure Container Apps"
            url: https://learn.microsoft.com/en-us/azure/container-apps/sessions-usage
      - id: dynamicSessionsCodeInterpreter
        kind: managed
        name: "Azure Container Apps dynamic sessions (code interpreter session pools)"
        url: https://learn.microsoft.com/en-us/azure/container-apps/sessions-code-interpreter
        asOf: "2026-11"
        compare:
          runs: "The platform runs a built-in Python, Node.js or shell interpreter in a Hyper-V sandbox for each session identifier and removes it after the idle cooldown."
          patching: "Microsoft supplies and maintains the built-in interpreter containers and the hosts; there is no image for you to build or publish."
          data: "Code and uploaded files live in the session, under /mnt/data, until it is deleted; outputs come back in the API response and are not written to Log Analytics."
          network: "Outbound traffic is off by default and is one on-or-off setting per pool; calls go to a regional dynamicsessions.io management endpoint with a Microsoft Entra token."
          identity: "Callers need a Microsoft Entra token for https://dynamicsessions.io and the Azure ContainerApps Session Executor role; the interpreter is given no identity of yours."
          accepts: "Python, Node.js or shell code through a REST API or framework plug-ins, with files up to 128 MB; Python sessions include packages such as NumPy and pandas."
          workload: "Sessions are allocated from a prewarmed pool in under a second; each execution may run 220 seconds; a session ends after 300 to 3,600 idle seconds; 600 per pool at most."
          portability: "Calls use the session pool REST API or its LangChain, LlamaIndex and Semantic Kernel integrations; moving off means another interpreter service or your own image."
          effort: "Your team sets the pool's limits and network status, manages session identifiers and role assignments, and nothing else."
          fits: "Microsoft names it for running AI-generated or user-submitted code quickly without managing a runtime environment."
        sources:
          - https://learn.microsoft.com/en-us/azure/container-apps/sessions
          - https://learn.microsoft.com/en-us/azure/container-apps/session-pool
          - https://learn.microsoft.com/en-us/azure/container-apps/sessions-code-interpreter
          - https://learn.microsoft.com/en-us/azure/container-apps/sessions-usage
          - https://learn.microsoft.com/en-us/azure/container-apps/billing
          - https://learn.microsoft.com/en-us/azure/container-apps/mcp-overview
          - https://learn.microsoft.com/en-us/azure/container-apps/mcp-authentication
          - https://learn.microsoft.com/en-us/azure/container-apps/sessions-tutorial-shell
          - https://learn.microsoft.com/en-us/azure/templates/microsoft.app/sessionpools
        offers:
          - name: "Code interpreter session pools"
            what: "A pool created with container type PythonLTS, NodeLTS or Shell gives each session identifier a preconfigured interpreter in its own Hyper-V sandbox; NodeLTS and Shell exist only in preview API versions, and the shell tutorial is marked preview."
            url: https://learn.microsoft.com/en-us/azure/container-apps/session-pool
          - name: "Code execution API"
            what: "A REST call runs code in a session and returns the result, including stdout and stderr; each execution is limited to 220 seconds."
            url: https://learn.microsoft.com/en-us/azure/container-apps/sessions-code-interpreter
          - name: "File upload, download and listing"
            what: "Files up to 128 MB can be uploaded to the session's /mnt/data directory, listed and downloaded through the pool's API."
            url: https://learn.microsoft.com/en-us/azure/container-apps/sessions-code-interpreter
          - name: "Preinstalled packages"
            what: "Python sessions include popular packages such as NumPy, pandas and scikit-learn; the list can be printed from inside a session."
            url: https://learn.microsoft.com/en-us/azure/container-apps/sessions-code-interpreter
          - name: "LLM framework integrations"
            what: "Tools and plug-ins for LangChain, LlamaIndex and Semantic Kernel call the pool and handle token acquisition."
            url: https://learn.microsoft.com/en-us/azure/container-apps/sessions-code-interpreter
          - name: "Platform-managed MCP server for session pools (preview)"
            what: "When MCP is enabled on a pool the platform exposes an endpoint with three fixed tools (launchShell, runShellCommandInRemoteEnvironment, runPythonCodeInRemoteEnvironment), authenticated by a pool-wide API key unless that is disabled."
            url: https://learn.microsoft.com/en-us/azure/container-apps/mcp-overview
          - name: "Session management"
            what: "API calls return a session's details, list the sessions in a pool and delete a session before its cooldown expires."
            url: https://learn.microsoft.com/en-us/azure/container-apps/sessions-code-interpreter
          - name: "Network status and pool limits"
            what: "A pool sets outbound traffic to EgressDisabled (the default) or EgressEnabled, a maximum of concurrent sessions up to 600, and an idle cooldown of 300 to 3,600 seconds."
            url: https://learn.microsoft.com/en-us/azure/container-apps/session-pool
          - name: "Authentication and authorisation"
            what: "Every management API call needs a Microsoft Entra token with the audience https://dynamicsessions.io from an identity that holds the Azure ContainerApps Session Executor role on the pool."
            url: https://learn.microsoft.com/en-us/azure/container-apps/sessions-usage
          - name: "Billing by allocated session"
            what: "Code interpreter sessions are billed for the time each session is allocated, in increments of one hour."
            url: https://learn.microsoft.com/en-us/azure/container-apps/billing
