        mechanism: >-
          Per-session runtime state under COPILOT_HOME/session-state/{sessionId}, sessionFs to route state
          into application storage, sessionIdleTimeoutSeconds, application-enforced ownership checks
        steps:
          - title: Isolate and expire session state
            body:
              - Encode tenant and user in session IDs, verify ownership before resume or delete, set
                sessionIdleTimeoutSeconds (15–30 minutes for chat) and use baseDirectory / sessionFs to keep
                state per process or in your own store.
            url: https://docs.github.com/en/copilot/how-tos/copilot-sdk/setup/multi-tenancy
        evidence: []
        note: >-
          Isolation and retention are the application's: sessionFs decides where state lives, ownership checks
          decide who reads it, and idle timeouts bound retention. Nothing validates or restores memory.
