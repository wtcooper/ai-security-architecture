id: archManagedAgentRuntime
surface: surfaceCloud
title: Managed agent runtime
abbrev: Managed agent runtime

summary:
  - >
    A cloud provider's hosted agent service — the loop, the memory, the tool gateway, the sandbox
    and the identity all supplied as managed components. The governance plane arrives built in,
    and the trade is that it is configured rather than designed.

description:
  - >
    Every provider converged on the same decomposition during 2026: a runtime, a memory service, a
    gateway for tools, an identity service, a code interpreter, a browser, observability, an
    evaluation service and a policy engine. That convergence is itself the finding — the governance
    plane the risk-map taxonomy has no components for is exactly what these services sell.
  - >
    The consequential choice is between the managed harness and the code escape hatch. Every
    provider offers both: a declarative agent whose loop they run, and a bring-your-own-code
    runtime where they supply the sandbox and the identity but the loop is the customer's. The
    first inherits the platform's guardrails automatically; the second inherits only what it
    explicitly calls. Teams routinely start with the first, hit a limitation, move to the second,
    and do not notice which controls stopped applying.
  - >
    Managed memory deserves specific attention because it is the component most likely to be
    switched on without a decision. Its scope — per session, per user, or shared across users — is
    a configuration flag with a data-protection consequence, and cross-user memory means one user's
    content can influence another's turn.
  - >
    The genuine advantage is agent identity. These platforms issue agents first-class, revocable
    identities distinct from the service and from the user, which is the control most self-built
    agent architectures never get around to. Using it properly — rather than running everything as
    one service principal — is most of what separates a well-governed deployment from a poorly
    governed one on the same platform.
  - >
    The costs are portability and opacity. The decomposition differs enough between providers that
    the agent, its memory model and its policy expressions do not move; and the loop's internals
    are not inspectable, so debugging a misbehaviour means reading traces rather than code.

distinguishedBy:
  - >
    Against building the agent tier: the same components with the provider supplying them. The work
    moves from designing an identity model, a policy engine and a sandbox to configuring three, and
    from having to build observability to having to export it.
  - >
    Against the vendor in-app action agent: that agent belongs to a SaaS product and acts on its
    records. This is a platform for building the customer's own agents on the customer's own data,
    with the loop hosted rather than the application.

exemplars:
  - name: Hyperscaler agent runtimes
    note: >
      Managed agent services decomposed into runtime, memory, gateway, identity, sandbox,
      observability, evaluation and policy, billed per component.
    asOf: "2026-08"
  - name: Managed harness with a code escape hatch
    note: >
      A declarative agent the provider runs, alongside a bring-your-own-code runtime for cases the
      declarative form cannot express. The pair is now standard across providers.
    asOf: "2026-08"

zones:
  - id: outside
    type: outsideWorld
    personas: []
    note: Users, and the content agents read from systems the platform does not govern.

  - id: app
    type: compute
    personas: [personaApplicationDeveloper]
    note: The customer's own front end and the agent definitions or code it deploys.

  - id: runtime
    type: vendorOpaque
    personas: [personaAgenticProvider, personaPlatformProvider]
    note: >
      The loop and its managed components. Configurable through published interfaces; the execution
      itself is not observable.

  - id: data
    type: data
    personas: [personaDataProvider]
    note: The systems the agent reaches, reached through grants the customer issues.

  - id: governance
    type: management
    personas: [personaGovernance, personaAgenticProvider]
    note: >
      Supplied by the platform and configured by the customer — the shared-responsibility shape
      that defines this archetype.

nodes:
  - id: endUser
    type: humanUser
    zone: outside
    label: End user
    note: Whose identity should reach the tool call, rather than being replaced by the agent's.
    risks: [riskAgenticDelegationConfusedDeputy]
    capabilities: [capabilityIga, capabilityNhiManagement]

  - id: externalContent
    type: untrustedSource
    zone: outside
    label: External content
    note: >
      Documents, web pages and records the agent reads. The platform's guardrails see it; nothing
      about it is authenticated.
    risks: [riskPromptInjection]
    capabilities: [capabilityPromptInjectionDefense, capabilityModelGuardrails]

  - id: frontEnd
    type: appUi
    zone: app
    label: Application front end
    note: The customer's surface, and where the user's identity is established.
    risks: [riskSensitiveDataDisclosure]
    capabilities: [capabilityAiDlp, capabilityRateLimiting]

  - id: agentDef
    type: harness
    zone: app
    label: Agent definition or code
    note: >
      Either a declarative agent the provider runs, or the customer's own loop in the provider's
      runtime. The choice decides which platform guardrails apply automatically and which have to
      be called explicitly.
    risks: [riskInsecureIntegratedComponent, riskShadowAndUnknownAgents]
    capabilities: [capabilityAgentRegistry, capabilityStagedRollout, capabilityAiBom]

  - id: runtimeApi
    type: apiEndpoint
    zone: runtime
    label: Runtime interface
    note: >
      Where agents are invoked and their sessions managed. The published surface; the loop behind
      it is not inspectable.
    risks: [riskRogueActions, riskExcessiveDataHandlingDuringInference]
    capabilities: [capabilityAiTprm, capabilityVendorAssurance, capabilityAgentObservability]

  - id: managedGateway
    type: connector
    zone: runtime
    published: true
    label: Managed tool gateway
    note: >
      A documented service the customer configures directly, not an inferred internal.
      The provider's brokered path to tools and MCP servers, with scoping and logging supplied.
      Reached automatically by a declarative agent and only on request by custom code.
    risks: [riskRogueActions, riskToolRegistryTampering, riskZombieShadowMCPServers]
    capabilities: [capabilityToolPermissionScoping, capabilityMcpToolSecurity, capabilityAgentRegistry]

  - id: managedMemory
    type: memoryStore
    zone: runtime
    published: true
    label: Managed memory
    note: >
      A documented, separately addressable and separately billed service, not an inferred internal.
      Session, user or cross-user scope, selected by configuration. Cross-user scope means one
      user's content can shape another's turn, and it is a flag rather than a design review.
    risks: [riskPromptInjection, riskSensitiveDataDisclosure, riskCrossTenantCredentialPropagation]
    capabilities: [capabilityMemoryProtection, capabilityDataAccessGovernance, capabilityEncryptionKeyManagement]

  - id: managedSandbox
    type: codeSandbox
    zone: runtime
    published: true
    label: Managed sandbox
    note: >
      A documented service with its own API and its own isolation guarantee, not an inferred internal.
      Code interpreter and browser, isolated by the provider. Among the strongest reasons to choose
      a managed runtime over building the tier.
    risks: [riskRogueActions, riskCrossTenantCredentialPropagation]
    capabilities: [capabilityAgentSandboxing, capabilityEgressControl, capabilityConfidentialComputing]

  - id: customerData
    type: corpus
    zone: data
    label: Customer systems
    note: Records and services the agent reaches, under grants the customer issues to the platform.
    risks: [riskExcessiveDataHandling, riskSensitiveDataDisclosure]
    capabilities: [capabilityDataAccessGovernance, capabilityDspm, capabilityIga]

  - id: agentIdentity
    type: agentIdentity
    zone: governance
    label: Managed agent identity
    note: >
      A first-class, revocable principal per agent. The control most self-built architectures never
      implement, supplied here as a service — and frequently collapsed back into one shared service
      principal by teams who do not use it.
    risks: [riskAgenticDelegationConfusedDeputy, riskStaleAgentIdentityBinding, riskShadowAndUnknownAgents]
    capabilities: [capabilityNhiManagement, capabilityIga, capabilityAgentRegistry]

  - id: managedPolicy
    type: policyEngine
    zone: governance
    label: Managed policy
    note: >
      Per-invocation authorization expressed in the platform's own policy language. Portable to no
      other provider.
    risks: [riskRogueActions, riskExcessiveDataHandling]
    capabilities: [capabilityAgentRuntimeEnforcement, capabilityToolPermissionScoping, capabilityAiGovernancePlatform]

  - id: managedGuardrail
    type: guardrail
    zone: governance
    label: Managed guardrails
    note: >
      Content and injection filtering, applied automatically to declarative agents and explicitly
      by custom code. The difference is where most deployments quietly lose coverage.
    risks: [riskPromptInjection, riskInsecureModelOutput, riskModelEvasion]
    capabilities: [capabilityModelGuardrails, capabilityPromptInjectionDefense, capabilityOutputEncoding]

  - id: observability
    type: auditSink
    zone: governance
    label: Managed observability
    note: >
      Traces of steps, tool calls and decisions. The only window into a loop that cannot be read,
      which makes exporting it a requirement rather than an option.
    risks: [riskAgentDelegationChainOpacity, riskShadowAndUnknownAgents]
    capabilities: [capabilityAgentObservability, capabilityAuditLogging, capabilityAiDetectionResponse]

  - id: managedEvals
    type: evaluationHarness
    zone: governance
    label: Managed evaluations
    note: Behaviour testing against the deployed configuration, including adversarial suites.
    risks: [riskModelEvasion, riskInsecureModelOutput]
    capabilities: [capabilityModelEvals, capabilityAiRedTeaming, capabilityStagedRollout]

edges:
  - from: endUser
    to: frontEnd
    label: request
    control:
      kind: userIdentity
      note: >
        The identity established here has to be carried into the runtime, or the agent acts as
        itself for everyone.
    risks: [riskAgenticDelegationConfusedDeputy]

  - from: frontEnd
    to: runtimeApi
    label: invoke agent
    control:
      kind: workloadIdentity
      note: >
        Two identities on one call: the application's, and the user it is acting for. Dropping the
        second is what turns per-user authorization into a service-wide grant.
    risks: [riskAgenticDelegationConfusedDeputy, riskStaleAgentIdentityBinding]

  - from: agentDef
    to: runtimeApi
    label: deploy agent
    control:
      kind: artifactIntegrity
      note: >
        An agent definition is a deployable artifact. Treating it with less rigour than application
        code is common and unwarranted — it is the thing that decides what the agent may do.
    risks: [riskInsecureIntegratedComponent, riskShadowAndUnknownAgents]

  - from: externalContent
    to: managedGateway
    label: content read through tools
    control:
      kind: contentInspection
      note: >
        The platform's guardrail applies automatically to a declarative agent and only on request
        to custom code — the asymmetry teams most often lose coverage to.
    risks: [riskPromptInjection]

  - from: runtimeApi
    to: managedMemory
    label: session and memory
    control:
      kind: memoryScope
      note: >
        The scope flag is the whole control. Cross-user scope is a supported configuration and its
        consequence is that one user's content reaches another's turn.
    risks: [riskSensitiveDataDisclosure, riskPromptInjection]

  - from: runtimeApi
    to: managedSandbox
    label: code and browser execution
    control:
      kind: isolation
      note: >
        Provider-operated isolation, which is one of the strongest arguments for this archetype
        over building the tier.
    risks: [riskRogueActions]

  - from: managedGateway
    to: customerData
    label: tool call into customer systems
    control:
      kind: agentIdentity
      note: >
        Per tool rather than per agent where the platform allows it. This is where the managed
        identity earns its place, and where collapsing everything onto one principal undoes it.
    risks: [riskExcessiveDataHandling, riskRogueActions, riskSensitiveDataDisclosure]

  - from: runtimeApi
    to: frontEnd
    label: response
    control:
      kind: transport
      note: Output handling is still the application's, because only it knows where the text will land.
    risks: [riskInsecureModelOutput]

  - from: agentIdentity
    to: managedGateway
    label: per-agent principal
    kind: control
    control:
      kind: agentIdentity
      note: >
        Distinct and revocable per agent. Available by default here, which is the single biggest
        governance advantage of the archetype.
    risks: [riskAgenticDelegationConfusedDeputy, riskStaleAgentIdentityBinding]

  - from: managedPolicy
    to: runtimeApi
    label: per-invocation authorization
    kind: control
    control:
      kind: tenantConfiguration
      note: >
        The customer authors the policy and the provider enforces it inside a loop the customer
        cannot see — the shared-responsibility shape, with the verification gap that comes with it.
    risks: [riskRogueActions]

  - from: managedGuardrail
    to: runtimeApi
    label: content filtering
    kind: control
    control:
      kind: contentInspection
      note: >
        The most consequential asymmetry on this diagram. Moving to the code escape hatch silently
        drops guardrails that a declarative agent got for free.
    risks: [riskPromptInjection, riskInsecureModelOutput]

  - from: runtimeApi
    to: observability
    label: step and tool traces
    kind: control
    control:
      kind: auditTrail
      note: >
        Export it. A trace that lives only in the provider's console is unavailable to the systems
        that would correlate it with anything else.
    risks: [riskAgentDelegationChainOpacity]

  - from: managedEvals
    to: agentDef
    label: pre-deployment evaluation
    kind: control
    control:
      kind: evaluationGate
      note: >
        Gating rather than reporting. An agent definition that has not been evaluated against
        adversarial input should not reach a production alias.
    risks: [riskModelEvasion]

crossCutting:
  - risk: riskShadowAndUnknownAgents
    note: >
      A managed runtime makes agents cheap to create, so the population grows faster than the
      inventory. The platform's own registry answers this if it is used; nothing else will.
  - risk: riskAgenticDelegationConfusedDeputy
    note: >
      Three identities in play — the application's, the user's and the agent's — and the failure is
      collapsing them. The platform supplies the machinery to keep them separate and does not
      require anyone to use it.
  - risk: riskInsecureIntegratedComponent
    note: >
      The runtime, its memory, its gateway and its sandbox are all the provider's code in the path,
      released on the provider's schedule, with the customer's agent inside them.

risks:
  - riskAgenticDelegationConfusedDeputy
  - riskShadowAndUnknownAgents
  - riskPromptInjection
  - riskRogueActions
  - riskSensitiveDataDisclosure
  - riskExcessiveDataHandling
  - riskInsecureIntegratedComponent
  - riskStaleAgentIdentityBinding
  - riskCrossTenantCredentialPropagation
  - riskAgentDelegationChainOpacity
  - riskInsecureModelOutput
  - riskModelEvasion
  - riskToolRegistryTampering
  - riskZombieShadowMCPServers
  - riskExcessiveDataHandlingDuringInference

capabilities:
  - capabilityNhiManagement
  - capabilityAgentRegistry
  - capabilityAgentRuntimeEnforcement
  - capabilityToolPermissionScoping
  - capabilityAgentSandboxing
  - capabilityMemoryProtection
  - capabilityAgentObservability
  - capabilityAuditLogging
  - capabilityModelGuardrails
  - capabilityPromptInjectionDefense
  - capabilityModelEvals
  - capabilityAiRedTeaming
  - capabilityIga
  - capabilityDataAccessGovernance
  - capabilityMcpToolSecurity
  - capabilityAiTprm
  - capabilityVendorAssurance
  - capabilityStagedRollout
  - capabilityAiBom
  - capabilityEgressControl
  - capabilityConfidentialComputing
  - capabilityEncryptionKeyManagement
  - capabilityDspm
  - capabilityAiDlp
  - capabilityRateLimiting
  - capabilityOutputEncoding
  - capabilityAiDetectionResponse
  - capabilityAiGovernancePlatform

deviations:
  - subject: Three components are drawn inside the vendor zone
    reason: >
      Every other vendor zone in this catalogue contains only the interfaces a provider publishes,
      because drawing a vendor's internals means inventing them. Here the memory service, the
      sandbox and the tool gateway are documented, separately addressable and separately billed
      products, so drawing them is reporting. Each carries an explicit claim to that effect, and the
      build refuses the claim anywhere it would not be true.
  - subject: The runtime is a vendorOpaque zone although the customer operates the system
    reason: >
      This is a cloud archetype and most of it is the customer's. The runtime zone is marked opaque
      because the loop's execution is genuinely not inspectable — the customer configures it and
      cannot read it — and marking it as owned would imply a level of control that does not exist.
  - subject: Managed guardrails, policy and identity are drawn in the control plane, not the runtime
    reason: >
      The provider operates them, so they could sit in the runtime zone. They are drawn in the
      control plane because the customer configures them and because their being separately
      addressable services is the whole shape of this product category — which is also the finding
      that CoSAI's component taxonomy has nowhere to put any of them.
  - subject: The declarative-versus-code choice is drawn as one node
    reason: >
      They are two quite different deployments. They share every other component on the diagram, and
      the difference is captured where it actually bites — on the guardrail edge, which applies
      automatically to one and only on request to the other.

