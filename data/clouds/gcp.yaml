    where: "Organization Policy › constraints/gcp.restrictNonCmekServices and constraints/gcp.restrictCmekCryptoKeyProjects, on the agent folder"
    setVia: [cloudPolicy]
    area: data
    default: "Not set. Resources can be created without a customer-managed key."
    recommended: "Deny aiplatform.googleapis.com, storage.googleapis.com and artifactregistry.googleapis.com in the first constraint, and allow only your key project in the second. Test that an agent instance without encryption_spec is refused."
