# Claude Agent SDK — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# 2026-09-25: re-verified toolClaudeAgentSdk (21 rows) against the MITRE capability rules; every code.claude.com/docs/en/agent-sdk page cited answered 200 with no redirect (read with WebFetch and the pages' .md variants); the Claude Code pages reused from claude-code.yaml were not re-fetched beyond the authentication page; GHSA-h4mw-j7qp-8mwm added from the Python SDK repository's security advisories.
vendor: anthropic
family: Claude Agent SDK
tools:
  - id: toolClaudeAgentSdk
    name: Claude Agent SDK
    surfaceClasses:
      - sdkFramework
    variants:
      - name: "@anthropic-ai/claude-agent-sdk (TypeScript)"
        class: sdkFramework
        url: https://code.claude.com/docs/en/agent-sdk/quickstart
      - name: claude-agent-sdk (Python)
        class: sdkFramework
        url: https://code.claude.com/docs/en/agent-sdk/quickstart
      - name: Headless CLI (claude -p) as a subprocess from other languages
        class: sdkFramework
        url: https://code.claude.com/docs/en/agent-sdk/overview
    architecture: archAgentWorkflow
    status: ga
    asOf: "2026-09"
    summary:
      - >-
        A library (Python and TypeScript) that runs the Claude Code agent loop inside the customer's own
        process: each query() spawns a bundled claude CLI subprocess that owns a shell, a working directory
        and JSONL transcripts on local disk, and calls the Anthropic API (or Bedrock, Vertex, Foundry, Claude
        Platform on AWS) with an API key from the host's environment. Nothing is hosted by Anthropic;
        sandboxing, egress, credential injection, multi-tenant isolation and session persistence are the
        deployer's responsibility, and the docs describe container, gVisor and Firecracker patterns with a
        credential-injecting egress proxy.
      - >-
        Its controls are Claude Code's, reachable as options: permissionMode, allowedTools / disallowedTools,
        a canUseTool callback, programmatic PreToolUse hooks that run before every other check, settingSources
        to stop reading filesystem settings, mcpServers, maxTurns, and OpenTelemetry export inherited from the
        environment. Managed policy on the host (MDM, managed-settings.json) and server-managed settings
        fetched with an organisation credential still apply and cannot be disabled from the SDK. Anthropic
        does not allow third parties to offer claude.ai login through SDK-built products.
    facts:
      - label: Plans
        value: >-
          Anthropic API key (Console), Bedrock (CLAUDE_CODE_USE_BEDROCK), Claude Platform on AWS, Google
          Cloud's Agent Platform (CLAUDE_CODE_USE_VERTEX) or Microsoft Foundry (CLAUDE_CODE_USE_FOUNDRY);
          governed by Anthropic's Commercial Terms.
        url: https://code.claude.com/docs/en/agent-sdk/quickstart
      - label: Inference & routing
        value: >-
          Direct to api.anthropic.com or the provider's regional endpoint; ANTHROPIC_BASE_URL or HTTPS_PROXY
          route model calls through a proxy that can inject the key outside the container.
        url: https://code.claude.com/docs/en/agent-sdk/secure-deployment
      - label: Data leaving the device
        value: >-
          Prompts, tool results and file contents to the model provider; OTLP telemetry only to the collector
          you configure (content redacted unless OTEL_LOG_* opt-ins are set); transcripts on local disk or a
          SessionStore you provide.
        url: https://code.claude.com/docs/en/agent-sdk/observability
      - label: Retention & training
        value: >-
          API: retained data is never used for training without express permission; conversation content is
          not retained by default except for Covered Models (Claude Fable 5 / 5.1, Mythos 5 / 5.1), which
          require 30-day retention and are outside ZDR; ZDR available for API organisations. Local transcripts
          under ~/.claude/projects/ or CLAUDE_CONFIG_DIR are swept after cleanupPeriodDays (30 days by
          default); a SessionStore keeps whatever its adapter's retention keeps.
        url: https://platform.claude.com/docs/en/manage-claude/api-and-data-retention
      - label: Docs index
        value: >-
          code.claude.com/docs/en/agent-sdk (overview, permissions, hooks, hosting, secure deployment)
        url: https://code.claude.com/docs/en/agent-sdk/overview
    riskNotes:
      - risk: riskPromptInjection
        note: >-
          The SDK's own guide opens with prompt injection as the threat model and recommends defence in depth:
          bare-name deny rules, PreToolUse hooks, read-only mounts, --network none containers and a
          credential-injecting proxy.
      - risk: riskAgentDelegationChainOpacity
        note: >-
          Subagents inherit the parent's permission mode (never bypassPermissions unless the parent has it)
          and hooks fire inside them with agent_id / agent_type; tracing nests subagent spans under the parent
          tool span only when CLAUDE_CODE_ENHANCED_TELEMETRY_BETA is on.
      - risk: riskRunawayAgentToolLoops
        note: >-
          There is no wall-clock deadline for a session or a subagent, and the stall watchdog
          (CLAUDE_ASYNC_AGENT_STALL_TIMEOUT_MS) is not one. The bounds are maxTurns (per query and per
          subagent), maxBudgetUsd (counts subagent spend and stops running background subagents), and the
          subagent depth (default 3) and concurrency (default 20) limits; cost is a client-side estimate.
      - risk: riskSensitiveDataDisclosure
        note: >-
          Default query() options read user, project and local settings, CLAUDE.md and auto memory from the
          host filesystem, and load claude.ai connectors when a claude.ai login is present; multi-tenant
          deployments must set settingSources [] and per-tenant CLAUDE_CONFIG_DIR / cwd.
      - risk: riskToolSourceProvenance
        note: >-
          MCP servers are whatever the deployer configures; .mcp.json in the working directory is loaded when
          the project setting source is on. Managed host policy (allowedMcpServers,
          strictPluginOnlyCustomization) still applies to SDK sessions.
    controls:
      - mitigation: AML.M0031
        coverage: partial
        mechanism: >-
          Sessions keyed by session UUID and working directory; settingSources [],
          CLAUDE_CODE_DISABLE_AUTO_MEMORY=1 and a per-tenant CLAUDE_CONFIG_DIR and cwd; a per-tenant
          SessionStore whose delete() backs deleteSession(); PreToolUse hooks on Write and Edit as the only
          place to check a memory write
        steps:
          - title: Isolate each tenant's state
            body:
              - >-
                Pass settingSources [] (Python setting_sources=[]), set CLAUDE_CODE_DISABLE_AUTO_MEMORY=1 and a
                per-tenant CLAUDE_CONFIG_DIR in env, and a per-tenant cwd on every query().
            url: https://code.claude.com/docs/en/agent-sdk/hosting
          - title: Keep one store per tenant and delete on schedule
            body:
              - >-
                Give each tenant its own SessionStore (or key prefix), implement delete so deleteSession()
                cascades to subagent transcripts, and set expiry in the backend, because the SDK never deletes
                from the store.
            url: https://code.claude.com/docs/en/agent-sdk/session-storage
          - title: Check writes to memory files
            body:
              - >-
                Register a hooks.PreToolUse callback with matcher "Write|Edit" that denies or validates writes
                to CLAUDE.md, .claude/rules and the auto-memory directory.
            url: https://code.claude.com/docs/en/agent-sdk/hooks
        note: >-
          Partial by the rule for this drawing: per-session and per-tenant scoping and deletion are
          configuration, but nothing ships that validates what a step writes. Auto memory and CLAUDE.md are
          plain files the agent edits with Write and Edit, and every subagent in a session shares the working
          directory, so one branch's writes are read as trusted context by the next; the hook is only an
          attach point for that check. Auto memory loads into the system prompt regardless of settingSources
          unless it is turned off. SessionStore mirrors transcripts only (memory files and working-directory
          artifacts need their own storage), its writes are best-effort (mirror_error), and the CLI writes
          the local transcript first.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityMemoryProtection
          reviewRequired: false
          original:
            - capability: capabilityMemoryProtection
              coverage: partial
              mechanism: >-
                settingSources [] plus CLAUDE_CODE_DISABLE_AUTO_MEMORY=1 and per-tenant CLAUDE_CONFIG_DIR and
                cwd; SessionStore adapter for transcripts; no memory validation or rollback
              steps:
                - title: Isolate tenants' memory and settings
                  body:
                    - Pass settingSources [] (Python setting_sources=[]), set
                      CLAUDE_CODE_DISABLE_AUTO_MEMORY=1 and a per-tenant CLAUDE_CONFIG_DIR in env, and a
                      per-tenant cwd on every query().
                  url: https://code.claude.com/docs/en/agent-sdk/hosting
                - title: Control where transcripts persist
                  body:
                    - Configure a SessionStore adapter (S3, Redis, Postgres) and alert on mirror_error
                      messages; do not share a store across tenants.
                  url: https://code.claude.com/docs/en/agent-sdk/hosting
              note: >-
                Isolation only: per-tenant directories and disabled auto-memory bound where memory lives.
                Nothing validates what is written, detects poisoning or restores a known-good state — recovery
                is the SessionStore's backups.
              verified: 2026-09-10
      - mitigation: AML.M0008
        coverage: external
        mechanism: >-
          None in the SDK; an evaluation or red-team platform in the deployer's CI drives query() headless
        evidence:
          - title: Agent SDK overview (no evaluation harness or release gate documented)
            url: https://code.claude.com/docs/en/agent-sdk/overview
          - title: How the agent loop works (result subtypes to gate on)
            url: https://code.claude.com/docs/en/agent-sdk/agent-loop
        note: >-
          External (an evaluation or red-team platform in CI): the SDK ships no evaluation harness and nothing
          that gates a model, prompt or agent-definition change. Integration points: run query() headless in
          CI with a pinned model and outputFormat, and gate on the result message's subtype, structured
          output and total_cost_usd; the test set, its protection and the release decision are the
          platform's.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityModelEvals
          reviewRequired: false
          original:
            - capability: capabilityModelEvals
              coverage: none
              note: >-
                The SDK ships no evaluation harness or release gate; build evals in your CI around query() and
                the result message subtypes yourself.
              evidence:
                - title: Vendor docs index, reviewed; no setting for this control (2026-09-10)
                  url: https://code.claude.com/docs/en/agent-sdk/overview
              verified: 2026-09-10
      - mitigation: cap-agent-tracing
        coverage: native
        mechanism: >-
          OpenTelemetry traces from the CLI subprocess (claude_code.interaction, llm_request, tool with
          blocked_on_user and execution child spans, hook), subagent spans nested under the parent's tool span,
          W3C trace context injected from the host application, and tool_decision / tool_result /
          mcp_server_connection log events; OTEL_LOG_TOOL_DETAILS and OTEL_LOG_TOOL_CONTENT add arguments and
          results
        steps:
          - title: Export all three signals
            body:
              - >-
                Set CLAUDE_CODE_ENABLE_TELEMETRY=1, CLAUDE_CODE_ENHANCED_TELEMETRY_BETA=1,
                OTEL_TRACES_EXPORTER, OTEL_METRICS_EXPORTER and OTEL_LOGS_EXPORTER to otlp and
                OTEL_EXPORTER_OTLP_ENDPOINT in the container environment or the env option.
            url: https://code.claude.com/docs/en/agent-sdk/observability
          - title: Capture arguments and results
            body:
              - >-
                Set OTEL_LOG_TOOL_DETAILS=1 for tool arguments and OTEL_LOG_TOOL_CONTENT=1 for file contents
                and Bash output on the tool span, only where the collector is approved to hold them.
            url: https://code.claude.com/docs/en/agent-sdk/observability
          - title: Join runs to the application's trace and user
            body:
              - >-
                Call query() inside an active span so the SDK injects TRACEPARENT, and pass enduser.id and
                tenant.id in OTEL_RESOURCE_ATTRIBUTES on each query().
            url: https://code.claude.com/docs/en/agent-sdk/observability
          - title: Surface export failures
            body:
              - >-
                Set CLAUDE_CODE_OTEL_DIAG_STDERR=1 and read the stderr callback; without it the CLI drops
                telemetry silently when the collector is unreachable.
            url: https://code.claude.com/docs/en/agent-sdk/observability
        note: >-
          Native: the CLI traces every turn, model request and tool call, including the wait for permission,
          nests each subagent's spans under the Agent tool span so the delegation chain is one trace, and
          exports to the customer's collector. Limits: tracing is beta and span names may change; hook spans
          need the separate detailed beta tracing; arguments and results appear only with the opt-ins; a
          killed process loses its unexported batch; memory writes show as Write and Edit tool spans, not
          memory events; identity attributes name the service credential unless the application injects
          enduser.id. Emission is not tamper resistance or detection — the collector and SIEM supply those.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAgentObservability
            - capabilityAuditLogging
            - capabilityAiDetectionResponse
          reviewRequired: false
          original:
            - capability: capabilityAgentObservability
              coverage: native
              mechanism: >-
                OpenTelemetry traces (claude_code.interaction / llm_request / tool / hook spans), metrics and
                log events exported by the CLI subprocess; W3C trace context propagated from the host
                application; OTEL_RESOURCE_ATTRIBUTES for enduser.id / tenant.id
              steps:
                - title: Turn on OTLP export
                  body:
                    - Set CLAUDE_CODE_ENABLE_TELEMETRY=1, OTEL_METRICS_EXPORTER / OTEL_LOGS_EXPORTER / OTEL_TRACES_EXPORTER=otlp
                      and OTEL_EXPORTER_OTLP_ENDPOINT in the container environment; add
                      CLAUDE_CODE_ENHANCED_TELEMETRY_BETA=1 for traces.
                  url: https://code.claude.com/docs/en/agent-sdk/observability
                - title: Attribute actions to end users
                  body:
                    - Inject enduser.id and tenant.id through OTEL_RESOURCE_ATTRIBUTES per query() so tool_decision, tool_result
                      and mcp_server_connection events form a per-user audit trail for the SIEM.
                  url: https://code.claude.com/docs/en/agent-sdk/observability
              note: >-
                Traces cover interactions, model requests, tool calls and hooks with W3C correlation; content
                is off unless enabled. Emitting traces is not detection or an audit record — the collector's
                rules and retention supply those.
              verified: 2026-09-10
            - capability: capabilityAuditLogging
              coverage: partial
              mechanism: OTLP log events (tool_decision, tool_result, mcp_server_connection, permission_mode_changed) to
                your collector; transcripts on disk or in a SessionStore; the Console Usage and Cost API
              steps:
                - title: Ship security events to the SIEM
                  body:
                    - Export OTEL_LOGS_EXPORTER=otlp with enduser.id attributes; the events are named with a
                      claude_code. prefix and carry the decision source.
                  url: https://code.claude.com/docs/en/agent-sdk/observability
              note: Records live in your infrastructure; tamper evidence is what your collector provides.
              verified: 2026-09-10
            - capability: capabilityAiDetectionResponse
              coverage: external
              mechanism: OTLP events and traces correlated in your SIEM; no vendor-side detections for SDK workloads
              steps:
                - title: Build detections on the exported events
                  body:
                    - Correlate tool_decision rejections, permission_mode_changed and mcp_server_connection
                      events with enduser.id in your SIEM.
                  url: https://code.claude.com/docs/en/agent-sdk/observability
              note: "The traces and events are the feed; the detections (unexpected tool sequences, egress to new hosts,
                permission denials spiking) and the response playbook are written in the SIEM. Required fields
                for that: session id, tool name, decision, host."
              verified: 2026-09-10
      - mitigation: D3-APA
        coverage: external
        mechanism: >-
          None in the SDK; an API gateway and IdP in front of the application's endpoint decide who may start,
          resume or stop a run
        evidence:
          - title: Hosting the Agent SDK (inbound auth at a gateway; the subprocess does not listen)
            url: https://code.claude.com/docs/en/agent-sdk/hosting
          - title: Authentication (Console roles for API-key creation)
            url: https://code.claude.com/docs/en/authentication
        note: >-
          External (API gateway / IdP): the SDK has no listener and no authorization policy over who may start,
          steer, resume or cancel a run — the hosting guide puts authentication at a gateway in front of the
          container and says the agent should not validate user tokens. Integration points: the application's
          HTTP or WebSocket endpoint that calls query(); the resume session ID, whose ownership the application
          must check before resuming (see the Python SDK's resume advisory); enduser.id and tenant.id in
          OTEL_RESOURCE_ATTRIBUTES for attribution. Console roles (the Claude Code role creates only Claude Code
          keys) govern who mints the model credential, not who may run the agent.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityIga
            - capabilityDataAccessGovernance
          reviewRequired: false
          original:
            - capability: capabilityIga
              coverage: partial
              mechanism: >-
                Authentication of end users happens at your gateway; the agent receives pre-authenticated
                requests. Claude Console roles and SSO govern who can mint API keys
              steps:
                - title: Put user authentication in front of the agent
                  body:
                    - The hosting guide says the agent should not be the component that validates user tokens;
                      terminate auth at a gateway and pass identity as resource attributes.
                  url: https://code.claude.com/docs/en/agent-sdk/hosting
                - title: Control who can create API keys
                  body:
                    - Use Console roles (Claude Code role can only create Claude Code keys) and Console SSO
                      for the humans who provision credentials.
                  url: https://code.claude.com/docs/en/authentication
              note: >-
                Rated partial on the same rule as the Copilot SDK and Codex SDK: Console roles, SSO and
                workload identity federation govern who can mint the credentials the agent uses;
                authentication and authorisation of the application's end users happen at the deployer's
                gateway, which the SDK does not provide.
              verified: 2026-09-10
            - capability: capabilityDataAccessGovernance
              coverage: external
              mechanism: Retrieval runs with whatever filesystem mounts and MCP credentials the deployer grants
              note: >-
                The SDK reads whatever the working directory and MCP servers expose; least-privilege mounts
                and per-user MCP credentials are your responsibility.
              steps:
                - title: Mount only what the task needs
                  body:
                    - Mount code read-only, give each session its own cwd, and use per-tenant MCP credentials
                      so retrieval runs as the requesting user.
                  url: https://code.claude.com/docs/en/agent-sdk/secure-deployment
              verified: 2026-09-10
      - mitigation: D3-AA
        coverage: partial
        mechanism: >-
          Inline mcpServers on an AgentDefinition (a server config with its own headers or env for that
          subagent); agent_id / agent_type on hooks, canUseTool and spans; the process authenticates to
          Anthropic once, with an API key, apiKeyHelper or a Workload Identity Federation service account
        steps:
          - title: Give a subagent its own tool credential
            body:
              - >-
                Define the subagent's MCP server inline in AgentDefinition.mcpServers with headers carrying a
                token minted for that agent, and leave that server out of the parent's mcpServers.
            url: https://code.claude.com/docs/en/agent-sdk/typescript
          - title: Federate the workload identity
            body:
              - >-
                Set ANTHROPIC_FEDERATION_RULE_ID and ANTHROPIC_ORGANIZATION_ID in env so the process exchanges
                its OIDC token through a Console service account instead of holding ANTHROPIC_API_KEY.
            url: https://code.claude.com/docs/en/authentication
        note: >-
          Partial by the rule for this drawing: per-agent credentials can be configured (a subagent's inline
          MCP server config) but every agent shares the process identity — one model credential, one
          environment and filesystem, and Bash in every subagent runs as the same OS user. agent_id is a runtime
          label for correlation, not an authenticated principal; no per-agent token is issued, and minting,
          rotating and revoking per-agent credentials is the application's work.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityNhiManagement
          reviewRequired: false
          original:
            - capability: capabilityNhiManagement
              coverage: partial
              mechanism: >-
                Console service accounts with workload identity federation (OIDC exchange, no static keys)
                identify the workload to Anthropic; no per-agent identity beyond the API key or service
                account
              steps:
                - title: Give the workload a federated identity
                  body:
                    - Exchange the runtime's OIDC token (GitHub Actions, AWS, GCP, Kubernetes, Entra, Okta,
                      SPIFFE) for Claude API access through a Console service account instead of shipping
                      ANTHROPIC_API_KEY; Claude Code reads ANTHROPIC_FEDERATION_RULE_ID and
                      ANTHROPIC_ORGANIZATION_ID.
                  url: https://code.claude.com/docs/en/authentication
              note: >-
                The workload identity authenticates the deployment to Anthropic; every agent and subagent in
                it shares that identity, and tool calls to other systems carry whatever credential the
                application supplies. A per-agent principal is the application's to mint.
              verified: 2026-09-10
      - mitigation: D3-CH
        coverage: partial
        mechanism: >-
          apiKeyHelper passed through the settings option (re-run after five minutes and on a 401), Workload
          Identity Federation (ANTHROPIC_FEDERATION_RULE_ID), ANTHROPIC_BASE_URL to a key-injecting proxy,
          ${VAR} expansion in MCP headers, CLAUDE_CODE_SUBPROCESS_ENV_SCRUB
        steps:
          - title: Fetch short-lived model credentials
            body:
              - >-
                Pass apiKeyHelper in the settings option pointing at a script that reads your vault (the Agent
                SDK honours it; CLAUDE_CODE_API_KEY_HELPER_TTL_MS sets the refresh), or use Workload Identity
                Federation instead of a static ANTHROPIC_API_KEY.
            url: https://code.claude.com/docs/en/authentication
          - title: Keep secrets outside the agent's container
            body:
              - >-
                Set ANTHROPIC_BASE_URL to a proxy that injects the model key, and route tool calls through a
                credential-injecting proxy so the agent never holds those secrets.
            url: https://code.claude.com/docs/en/agent-sdk/secure-deployment
          - title: Scrub credentials from agent subprocesses
            body:
              - >-
                Set CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=1 in env to strip Anthropic, cloud-provider and other
                recognised credentials from Bash, hook and stdio MCP server environments.
            url: https://code.claude.com/docs/en/env-vars
        note: >-
          Partial by the rule for this drawing: the SDK takes secret references and helper hooks (apiKeyHelper,
          env, header variable expansion) but brokers nothing at step time — no credential provider issues a
          short-lived, scoped credential per tool call, and the proxy pattern keeps secrets outside the agent
          only where the deployer builds it. Anything passed in env or MCP headers lives in the CLI process;
          the subprocess inherits the host environment unless the TypeScript env option replaces it (Python
          only merges over it). The model sees a secret only if a tool returns it.
        verified: "2026-09-25"
        migration:
          from:
            - capabilitySecretsManagement
          reviewRequired: false
          original:
            - capability: capabilitySecretsManagement
              coverage: partial
              mechanism: >-
                ANTHROPIC_API_KEY from your secret manager, ANTHROPIC_BASE_URL to a key-injecting proxy,
                apiKeyHelper, workload identity federation; tool credentials via proxy injection
              steps:
                - title: Keep credentials outside the agent container
                  body:
                    - Route model calls through a proxy that injects the key (ANTHROPIC_BASE_URL) and outbound
                      tool calls through a TLS-terminating or custom-tool proxy so the agent never holds the
                      secret.
                  url: https://code.claude.com/docs/en/agent-sdk/secure-deployment
                - title: Strip secrets from mounted directories
                  body:
                    - Exclude .env, ~/.aws, ~/.ssh, .npmrc, *.pem and similar files before mounting code even
                      read-only.
                  url: https://code.claude.com/docs/en/agent-sdk/secure-deployment
              note: >-
                Storage is the deployer's secret manager; ephemeral issuance exists only where apiKeyHelper or
                workload identity federation is used. Readers: the SDK process holds the provider key; shell
                commands and MCP servers read whatever environment the application passes them; the model sees
                a secret only if a tool returns it.
              verified: 2026-09-10
      - mitigation: cap-agent-action-policy-enforcement
        coverage: native
        mechanism: >-
          Declarative deny and ask rules (disallowedTools such as Bash(rm *) and Edit(//secrets/**),
          permissions.deny / ask in the settings option or a managed-settings file in the image) evaluated
          before the permission mode on every call, and PreToolUse hooks that run first; each decision is a
          claude_code.tool_decision event
        steps:
          - title: Pass declarative deny and ask rules
            body:
              - >-
                Set disallowedTools to scoped rules such as Bash(curl *) and Edit(//etc/**), and put
                permissions.ask entries in the settings option; deny holds in every mode, including
                bypassPermissions.
            url: https://code.claude.com/docs/en/agent-sdk/permissions
          - title: Lock the rules below the application
            body:
              - >-
                Bake permissions.deny with allowManagedPermissionRulesOnly into a managed-settings file in the
                image; managed policy loads whatever settingSources the code passes.
            url: https://code.claude.com/docs/en/permissions
          - title: Gate every call in a hook
            body:
              - >-
                Register hooks.PreToolUse callbacks that return permissionDecision "deny", "ask" or "defer"; a
                hook that times out leaves the tool unrun, and any deny wins over other hooks.
            url: https://code.claude.com/docs/en/agent-sdk/hooks
          - title: Log every decision
            body:
              - >-
                Export OTEL_LOGS_EXPORTER=otlp so each claude_code.tool_decision event, with its decision and
                source, reaches your collector.
            url: https://code.claude.com/docs/en/agent-sdk/observability
        note: >-
          Native on the Claude Code rule (declarative permissions decide every call outside the model; hooks
          alone would be partial): deny and ask rules over tool, argument and path patterns are evaluated for
          every built-in and MCP tool call, in the main agent and its subagents, before any mode can approve
          it, and ask escalates to the application's canUseTool. Boundaries: Bash rules match the command as
          written; a bare allowedTools entry pre-approves the whole tool and skips canUseTool; the application
          can loosen its own options mid-session (setPermissionMode, applyFlagSettings) unless the rules come
          from managed settings; in-process custom tools are matched by name, with argument checks only in a
          hook; the auto-mode classifier is a second, non-deterministic gate.
