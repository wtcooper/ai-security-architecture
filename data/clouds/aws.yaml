  - architecture: archRemoteMcpServer
    asOf: "2026-10"
    # >>> checked against the vendor's documentation
    verified: "2026-11-18"
    sources:
      idp: https://docs.aws.amazon.com/singlesignon/latest/userguide/what-is.html
      gateway: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway.html
      authServer: https://docs.aws.amazon.com/cognito/latest/developerguide/token-endpoint.html
      service: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-mcp.html
      toolDefs: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/registry-supported-record-types.html
      orgData: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/on-behalf-of-token-exchange.html
    differences:
      - at: gateway->service
        text: "A Runtime keeps its own public address, so a caller holding a valid token can skip the gateway, its WAF, rate limits and interceptors. Set allowedWorkloadConfiguration on the Runtime's JWT authorizer so it accepts calls only from your gateway."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-security-best-practices.html
      - at: gateway->service
        text: "The gateway does not pass the caller's token to an MCP server target. It signs in again with client credentials, token exchange, SigV4 or an API key. Only token exchange keeps the user and tenant in the token your service sees; Cognito cannot do it."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-MCPservers.html
      - at: service->authServer
        text: "Runtime's inbound authorizer checks the token's signature, issuer, client, audience and scopes before your code runs. Your handlers see the token only if Authorization is on the request header allowlist. Add that if handlers must read the tenant or check revocation."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-header-allowlist.html
      - at: callers->authServer
        text: "Gateway and Runtime each trust one token issuer, given as a single discovery URL. Tokens minted by your own auth service for the grant types Cognito lacks come from a second issuer. Make one of them the only issuer callers receive tokens from."
        url: https://docs.aws.amazon.com/bedrock-agentcore-control/latest/APIReference/API_CustomJWTAuthorizerConfiguration.html
      - at: callers->authServer
        text: "AWS's Runtime tutorial switches from Cognito to Auth0 when it needs dynamic client registration, and AWS's sample requires clients pre-configured in Cognito. Pre-create each MCP client as a Cognito app client listed in allowedClients, or have your auth service register them."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-mcp.html
      - at: authServer
        text: "The guidance page still draws a separate MCP auth service that issues its own tokens. The sample code it links to removed that service, token storage and client registration in version 2.0.0; there Cognito is the authorization server and servers publish protected-resource metadata."
        url: https://raw.githubusercontent.com/aws-solutions-library-samples/guidance-for-deploying-model-context-protocol-servers-on-aws/main/README.md
      - at: callers->idp
        text: "In AWS's worked example the identity-assertion grant is issued by Okta and redeemed at Okta's authorization server; AgentCore Identity does the redeeming with its JWT_AUTHORIZATION_GRANT setting. Cognito plays no part, so plan for an authorization server that accepts that grant."
        url: https://aws.amazon.com/blogs/machine-learning/govern-ai-agent-access-with-okta-cross-app-access-and-amazon-bedrock-agentcore-part-1/
      - at: toolDefs->service
        text: "Callers receive tool names and descriptions from the gateway's stored catalogue, not from your service. A hash check inside the service does not cover what callers see. Load the reviewed schema into mcpToolSchema on every release; a static schema cannot be re-synchronised."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-MCPservers.html
      - at: toolDefs
        text: "The gateway renames every tool to targetName___toolName, so the names a caller's model sees differ from the ones in your repository. Review and version the names as the gateway publishes them."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-rate-limits-dimensions.html
      - at: callers->gateway
        text: "The gateway advertises an AWS-owned hostname in its OAuth metadata. For your own domain, put a proxy such as CloudFront in front, set domainOverride, and have the proxy overwrite the domain header. The resource address clients request tokens for must match."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-inbound-auth.html
    alsoNeeded:
      - service: "Amazon Bedrock AgentCore Identity"
        role: identity
        why: "Stores the gateway's and service's outbound OAuth clients and API keys and performs on-behalf-of token exchange."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/identity.html
      - service: "Amazon VPC (Runtime VPC network mode)"
        role: network
        why: "AWS's Runtime example deploys with public networking; VPC mode is needed to reach private systems of record."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-vpc.html
      - service: "AWS PrivateLink interface endpoints"
        role: network
        why: "Private path from your VPC to AgentCore and the stores the service reads."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/vpc-interface-endpoints.html
      - service: "AWS KMS"
        role: keys
        why: "Customer managed key for the gateway, which otherwise uses a service-managed key."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-encryption.html
      - service: "AWS Secrets Manager"
        role: secrets
        why: "Holds upstream credentials and Cognito client secrets."
        url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotate-secrets_turn-on-for-other.html
      - service: "Amazon ECR"
        role: registry
        why: "Stores the container image the Runtime pulls, unless you use direct code deployment."
        url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/what-is-ecr.html
      - service: "Amazon CloudWatch and AWS CloudTrail"
        role: logging
        why: "Traces need CloudWatch Transaction Search switched on once; gateway calls are CloudTrail data events."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/observability-configure.html
      - service: "AWS WAF"
        role: ingress
        why: "Regional web ACL attached to the gateway; it fails closed by default if WAF is unreachable."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-waf.html
      - service: "Amazon CloudFront"
        role: ingress
        why: "Needed only for a custom public domain in front of the gateway."
        url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html
      - service: "AWS Lambda"
        role: other
        why: "Runs the gateway's request interceptor."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-interceptors.html
      - service: "AWS Fargate, Application Load Balancer and Amazon DynamoDB"
        role: other
        why: "Host and session store for your MCP auth service, as the guidance page draws it."
        url: https://docs.aws.amazon.com/solutions/deploying-model-context-protocol-servers-on-aws/
    quickstart:
      - title: "Get started with AgentCore Gateway"
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-quick-start.html
      - title: "Guidance for Deploying Model Context Protocol Servers on AWS"
        url: https://docs.aws.amazon.com/solutions/deploying-model-context-protocol-servers-on-aws/
    # <<< checked
    reference:
      - title: Guidance for Deploying Model Context Protocol Servers on AWS
        url: https://aws.amazon.com/solutions/guidance/deploying-model-context-protocol-servers-on-aws/
      - title: Tool-based agents for servers (AWS Prescriptive Guidance)
        url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-patterns/tool-based-agents-for-servers.html
      - title: Deploy MCP servers in AgentCore Runtime
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-mcp.html
    summary:
      - >-
        A stateless MCP server on AgentCore Runtime, published through AgentCore Gateway with AWS
        WAF, taking tokens from an Amazon Cognito user pool that federates to your identity provider.
        AWS's guidance fronts the servers with CloudFront, WAF and a load balancer and runs its own
        MCP auth service beside Cognito; the gateway here adds per-tool rate limits, interceptors and
        a static tool schema. Cognito's token endpoint takes authorization code, refresh and client
        credentials grants, so the enterprise-managed (ID-JAG) and token-exchange profiles are the
        part you add.
    bindings:
      - { block: idp, service: Your corporate identity provider, build: true, note: "IAM Identity Center or a third-party IdP, federated to the Cognito user pool. The identity-assertion grant (ID-JAG) is that IdP's feature, where it has one." }
      - { block: gateway, service: AgentCore Gateway with AWS WAF, note: "AWS's MCP guidance uses CloudFront, AWS WAF and an Application Load Balancer here." }
      - { block: authServer, service: Amazon Cognito and your MCP auth service, note: "Cognito issues and revokes the tokens; the auth service (on ECS in AWS's guidance) adds the grant profiles Cognito does not take." }
      - { block: service, service: Your MCP server on AgentCore Runtime, note: "Stateless streamable HTTP at /mcp. Amazon ECS or Lambda behind the load balancer is the guidance's alternative." }
      - { block: toolDefs, service: Versioned tool definitions in your repository, build: true, note: "Published as an approved MCP record in AWS Agent Registry." }
      - { block: orgData, service: Your systems of record, build: true, note: "Each reached on its own vaulted credential or an exchanged downstream token." }
