id: mittwald-mcp-server
title: "Mittwald: a flaw in the web host's own MCP server hands over customers' session tokens and 56 projects"
subtitle: >
  A German web host published an MCP server so customers could run its hosting platform from
  their AI assistants. An attacker with a five-minute-old account exploited a flaw in it, read
  the session tokens of the customers who used it, and compromised 56 projects before anyone
  noticed, eight days later.
date: 2026-11
dateRange: 21 October – 7 November 2026 (disclosed 7 November)
category: exploitedSoftware
perspective: target
# Mittwald ran this server for its own customers' assistants; the flaw and the tokens were on the publisher's side of the protocol, not a client's.
archetype: archRemoteMcpServer
caveat: >
  Every figure and date comes from Mittwald itself; the press reports repeat them and none has
  confirmed them independently. Mittwald has not said what the flaw was or how the tokens were
  used to reach the projects, and the detailed account it promised for the following week had
  not appeared by 25 November. Its view that AI tools were used rests on the speed of the steps
  in its logs; The Record notes it offered no other evidence. Born's blog dates the discovery
  to 5 November; Mittwald says 4 November.
breaks:
  - control: D3-SYSVA
    how: "Test the published server like any internet-facing application: anyone who could register an account could reach the flaw, and this attacker probed it for six days first."
  - control: D3-CH
    how: "What the server holds to act for a customer is short-lived and limited to the tools it serves, so a token read from it is not a session that opens the customer's projects."
  - control: D3-CR
    how: "Revocation that reaches tokens already issued, ready before it is needed: the tokens read on 27 October were revoked only when the intrusion was found, eight days later."
  - control: AML.M0024
    how: "Every tool call logged with the customer it acted for: an account minutes old reaching other customers' tokens is the line worth an alert."
summary:
  - >
    Mittwald, a hosting provider for web agencies in North Rhine-Westphalia, ran an MCP server
    through which customers connected AI assistants to its mStudio hosting platform. On 27
    October an attacker registered a new account and, five minutes later, exploited a flaw in
    that server. Mittwald's FAQ says the attacker read the session tokens of the interface's
    users, not their passwords. Mittwald found the intrusion on 4 November, eight days later,
    and by then 56 customer projects had been compromised.
  - >
    The root cause is not public. Mittwald has said only that the gap was in its MCP server, and
    The Record reported it was unclear whether it lay in Mittwald's own code or in the
    open-source MCP libraries. Mittwald's developer documentation describes OAuth 2.1 sign-in
    with scoped, expiring tokens and long-lived API tokens for headless use; it has not said
    which of these were read or where the server held them. The steps below keep to what
    Mittwald has stated.
  - >
    What it shows about a published MCP server: the server acts for every customer who connects,
    so what it holds to act with is worth stealing, and one flaw in it reached 56 customer
    projects. Mittwald shut the server down, revoked the tokens and told customers to change
    passwords and check the keys and tokens in their projects. On 12 November it reported
    renewed attacks that compromised its company website; it did not tie those to the MCP
    server.
patterns:
  - Exploit Public-Facing Application
  - Session Token Theft
  - Cross-Tenant Account Takeover
cves: []
risks:
  - riskInsecureIntegratedComponent
  - riskCrossTenantCredentialPropagation
  - riskSensitiveDataDisclosure
steps:
  - n: 1
    title: A regular user, probing the MCP server
    phase: introduced
    narrative: >
      On the evening of 21 October, while (in Mittwald's words) the whole IT world was busy with
      PHP2Shell, the attacker first tested a vulnerability in Mittwald's MCP server. From 23
      October they moved around the platform as a regular user: registering test accounts, using
      extensions and making simple injection attempts.
    path: [callers->gateway, gateway->service]
    risks:
      - riskInsecureIntegratedComponent
    sources:
      - title: "Sicherheitsvorfall am MCP-Server"
        url: https://www.mittwald.de/blog/mittwald/sicherheitsvorfall-am-mcp-server
        publisher: mittwald
        date: 2026-11-07
  - n: 2
    title: A five-minute-old account exploits the flaw
    phase: exposed
    narrative: >
      On 27 October at 14:58 the attacker registered another account, and at 15:03 used it to
      exploit the gap it had found in the MCP server. Mittwald has not said what kind of flaw it
      was. Its logs show the attacker working through its systems with sometimes only seconds
      between steps, which Mittwald reads as a sign of AI tools.
    path: [callers->gateway, gateway->service, service]
    risks:
      - riskInsecureIntegratedComponent
    sources:
      - title: "Sicherheitsvorfall am MCP-Server"
        url: https://www.mittwald.de/blog/mittwald/sicherheitsvorfall-am-mcp-server
        publisher: mittwald
        date: 2026-11-07
      - title: "Alleged AI-aided cyberattack exploits assistant interface to breach German web host"
        url: https://therecord.media/cyberattack-germany-ai-mittwald
        publisher: The Record
        date: 2026-11-09
  - n: 3
    title: The server's users' session tokens are read
    phase: exposed
    narrative: >
      Through the flaw the attacker read the tokens of the server's users: session tokens,
      Mittwald's FAQ says, not passwords, and only those of customers who had used the MCP
      interface. Its developer documentation describes OAuth 2.1 with PKCE, with tokens that are
      scoped, expire and can be revoked, and API tokens that the server checks with the mittwald
      API for headless use. Mittwald has not said which of these the attacker read or where the
      server kept them.
    path: [service]
    risks:
      - riskCrossTenantCredentialPropagation
      - riskSensitiveDataDisclosure
    sources:
      - title: "MCP-Server: Was du jetzt wissen musst"
        url: https://www.mittwald.de/lp/mcp-faq
        publisher: mittwald
        date: 2026-11-07
      - title: "Getting Connected | mittwald Developer Portal"
        url: https://developer.mittwald.de/docs/v2/mcp/getting-connected/
        publisher: mittwald
  - n: 4
    title: 56 customer projects, eight days unseen
    phase: exposed
    narrative: >
      The attacker went on to compromise 56 customer projects; Mittwald has not said how the
      tokens were used to reach them. It treats all data in those projects from 27 October onward
      as compromised, and told affected customers to change their mStudio password, turn on
      two-factor authentication, check the API keys, project tokens and SSH keys in their
      projects, and renew third-party credentials stored there. Nobody noticed until 4 November,
      eight days later.
    path: [orgData]
    risks:
      - riskCrossTenantCredentialPropagation
      - riskSensitiveDataDisclosure
    sources:
      - title: "Sicherheitsvorfall am MCP-Server"
        url: https://www.mittwald.de/blog/mittwald/sicherheitsvorfall-am-mcp-server
        publisher: mittwald
        date: 2026-11-07
      - title: "MCP-Server: Was du jetzt wissen musst"
        url: https://www.mittwald.de/lp/mcp-faq
        publisher: mittwald
        date: 2026-11-07
      - title: "Mittwald Traces a Breach of 56 Customer Projects to Its MCP Server"
        url: https://webhosting.today/2026/11/09/mittwald-traces-a-breach-of-56-customer-projects-to-its-mcp-server/
        publisher: webhosting.today
        date: 2026-11-09
  - n: 5
    title: Found, shut down, revoked
    phase: exposed
    narrative: >
      On the morning of 4 November Mittwald saw unusual behaviour in one of its systems, blocked
      the attacker's first account at 11:11, identified the MCP server as the way in and shut it
      down. It revoked the tokens and blocked API keys as a precaution. Shortly after midnight it
      blocked projects and paused new registrations, and on 5 November suspended mStudio logins
      and SSH access to customer projects, brought in external forensic experts and informed the
      authorities. mStudio and SSH returned on 7 November; the MCP server stays offline until
      further notice.
    path: [govObservability, service, authServer]
    sources:
      - title: "Sicherheitsvorfall am MCP-Server"
        url: https://www.mittwald.de/blog/mittwald/sicherheitsvorfall-am-mcp-server
        publisher: mittwald
        date: 2026-11-07
      - title: "MCP-Server: Was du jetzt wissen musst"
        url: https://www.mittwald.de/lp/mcp-faq
        publisher: mittwald
        date: 2026-11-07
  - n: 6
    title: Where this chain breaks
    phase: mitigated
    narrative: >
      With the flaw unpublished, the first control is the general one: test a published MCP
      server as the internet-facing application it is, because anyone who can register an
      account can reach it. Then limit what a stolen token is worth: whatever the server holds to
      act for a customer should be short-lived and scoped to the tools it serves, not a session
      that opens the customer's whole account. Make revocation reach tokens already issued, and
      know how long it takes. And log every tool call with the customer it acted for, so an
      account minutes old reaching other customers' tokens raises an alert on 27 October, not a
      question on 4 November.
    path: [gateway->service, service->authServer, service->orgData, govObservability]
    sources:
      - title: "Sicherheitsvorfall am MCP-Server"
        url: https://www.mittwald.de/blog/mittwald/sicherheitsvorfall-am-mcp-server
        publisher: mittwald
        date: 2026-11-07
