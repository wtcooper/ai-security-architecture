id: archRemoteMcpServer
surface: surfaceCloud
rank: 4
title: Remote MCP server you publish
abbrev: Remote MCP server

summary:
  - >
    A tool server operated as a service for other people's agents: an OAuth resource server
    whose clients are language models. The scopes, the tenancy and the tool descriptions are all
    your design decisions — and the descriptions execute as instruction inside somebody else's
    model.

description:
  - >
    The inversion is what makes this its own architecture. Every other cloud archetype here
    calls tools; this one is the tool. The caller is an autonomous agent acting for a user, the
    arguments were produced by a model, and the tool descriptions this server publishes become
    instructions inside that model's context. A poorly worded description causes misuse; a
    deliberately worded one is an attack on the caller. Publishing a server means treating
    changes to descriptions and error messages with the seriousness of an API contract change.
  - >
    Authorization is the second inversion. Standard OAuth answers "may this client act for this
    user", and here that is necessary and not sufficient: the client is an agent that may have
    been steered by content it read elsewhere. Scopes therefore need to be narrow enough that a
    hijacked agent's blast radius is bounded, and consequential operations need confirmation
    semantics the protocol can express, rather than relying on the client to prompt its user.
    In an enterprise deployment the identity work is federated rather than invented: the user
    signs in at the IdP the organisation already governs, an identity assertion is exchanged
    for an audience-bound token, and admin policy and revocation stay where the organisation
    already enforces them. Client registration is pre-arranged or metadata-document based —
    the self-service dynamic registration of the early protocol is deprecated.
  - >
    The deployment shape is deliberately conventional: a gateway tier in front terminating
    hostile machine traffic, one stateless application behind it, data and upstream systems
    behind that. The protocol is stateless by design — there are no sessions to bind, only
    server-minted state handles whose possession proves nothing — so the service scales
    horizontally like any web tier, and every request re-verifies authorization from the
    token. The ordinary multi-tenant disciplines apply with unusual force: every read and
    write checks both that the scope permits the operation and that the tenant on the token
    matches the tenant on the record; rate limits are sized for machine callers that retry,
    loop and parallelise; and results are bounded in size, because an oversized result is
    both a cost problem for the caller and a way to crowd their context window. There is no
    model anywhere in this service — every distinctive control follows from the client being
    one.
  - >
    The one rule with no exceptions is at the back: the caller's token never travels upstream.
    A handler that reaches another system does so as its own OAuth client, on a credential a
    secrets manager issued to this service — passing the inbound token onward is the confused
    deputy the protocol documents by name, and it turns one compromised agent into a
    multi-service problem.

distinguishedBy:
  - >
    Against a third-party MCP server you consume: opposite side of the same boundary. There the
    scopes are someone else's design and the work is admission and observation; here the scopes,
    the tenancy and the descriptions are all design decisions.
  - >
    Against an AI-augmented API backend: that one has AI inside it and a conventional client.
    This one has no AI inside it at all and a model as the client. The security work is entirely
    about the caller's nature.

exemplars:
  - name: GitHub MCP server
    note: >
      A product vendor publishing a remote tool server for its own product, so customer agents
      can act without a bespoke integration — the archetype's most-consumed instance.
    url: https://github.com/github/github-mcp-server
    asOf: "2026-09"
  - name: Atlassian Remote MCP Server
    note: >
      The same publisher shape over an OAuth resource server with tenant scoping across
      products — the multi-tenant discipline this page pins, shipped commercially.
    url: https://www.atlassian.com/platform/remote-mcp-server
    asOf: "2026-09"
  - name: Cloudflare remote MCP hosting
    note: >
      Gateway-fronted fleets: many servers behind one edge tier with identity, metering and
      audit centralised — the mediation the protocol's routing headers were designed for.
    url: https://developers.cloudflare.com/agents/model-context-protocol/
    asOf: "2026-09"

zones:
  - id: zoneCloud
    owner: cloud
    note: >
      Everything we build and run. This architecture is drawn from the publisher's chair, so
      almost all of it is ours — which is unusual in this catalogue and is the reason it earns
      a page: the controls that matter when you *publish* an MCP server have nowhere else to
      live.
  - id: zoneExternal
    owner: external
    note: What our own implementation reaches outward on its own credential, past the point the caller's delegation bounds anything.
  - id: zoneGovernance
    owner: governance
    note: >
      Deliberately light. For a published server the governed questions are what the catalogue
      admits and what the tool descriptions say — because both execute inside somebody else's
      model.

blocks:
  - id: callers
    kind: origin
    title: MCP clients
    zone: zoneCloud
    col: 0
    row: 0
    note: >
      Deliberately unnamed. Agents, chat products and other services all reach a published server
      the same way, and naming any one of them would make the drawing about that integration rather
      than about the server we are building. Three kinds of caller matter for identity: a public
      client nobody pre-registered (a developer's tool, identified by a client-ID metadata
      document), an enterprise client the IdP knows (single sign-on, no per-server consent), and
      an autonomous workload with no user behind it (its own workload identity).

  - id: idp
    kind: service
    title: Identity provider
    zone: zoneCloud
    col: 0
    row: 2
    note: >
      The enterprise identity provider, drawn because tokens flow through it: under
      enterprise-managed authorization the caller signs in here once, and trades that login
      for an identity-assertion grant (ID-JAG) naming this server — after the IdP has checked
      its own registry of approved MCP servers, the user's groups and roles, and any
      conditional-access rule. Nobody consents per server; the administrator decided once.
      For a customer organisation's callers this is their IdP, federated to our authorization
      server by trusting its issuer and keys — the same mechanism, somebody else's policy.
    items:
      - id: sso
        label: SSO login
        icon: person
        note: >
          The corporate sign-in the client already does. The ID token it yields is the
          subject token for everything that follows.
      - id: exchange
        label: Token exchange
        icon: key
        note: >
          RFC 8693 at the IdP: `grant_type=token-exchange`, `subject_token` = the ID token,
          `requested_token_type` = `id-jag`, `audience` = our authorization server's issuer,
          `resource` = this server's canonical URI, `scope` as requested. The answer is a
          signed JWT (`typ: oauth-id-jag+jwt`) with `iss`, `sub`, `aud`, `client_id`,
          `resource`, `scope`, `jti`, `exp` — or a policy denial.
      - id: policy
        label: App registry & policy
        icon: scale
        note: >
          Which MCP servers exist for this organisation, who may reach each, with which
          scopes, under which conditions. Evaluated at every exchange, so removing a user
          from a group is revocation for every new token from that moment.

  - id: gateway
    kind: service
    title: AI gateway
    zone: zoneCloud
    col: 1
    row: 1
    note: >
      The entry point, and for the first time genuinely useful on MCP traffic. The 2026-07
      revision requires every request to mirror its method and tool name into `Mcp-Method` and
      `Mcp-Name` headers, so this tier can route, meter and authorize **per tool** without
      parsing bodies. That only holds if it enforces the matching rule: a server that processes
      the body must reject any request whose headers disagree with it, because a gateway
      routing on the header while the server executes the body is a policy-bypass primitive.
      One operating concern survives the stateless revision: a subscription is a long-lived
      POST stream, so this tier's idle timeouts and response buffering are configuration, not
      defaults.
    items:
      - id: gwTools
        label: MCP & API gateway
        icon: plug
        note: The one traffic class this gateway carries — MCP calls, routed and metered per tool.

  - id: authServer
    kind: service
    title: Authorization server
    zone: zoneCloud
    col: 2
    row: 0
    note: >
      Token issuance for the server we publish, and the one place every identity flow converges.
      It speaks three grant profiles: the authorization-code grant with PKCE and `resource` for a
      public client through a consent screen; the JWT-bearer grant that accepts an ID-JAG from a
      trusted identity provider and issues an access token without any redirect (enterprise-managed
      authorization); and `client_credentials` with `private_key_jwt` for an autonomous workload.
      It also performs the token exchange a handler needs to call an upstream system on the caller's
      behalf — a downstream-audience token, never the inbound one. Every token it mints is
      audience-bound to this server by canonical URI and short-lived; refresh tokens rotate.
    items:
      - id: tokenIssuance
        label: Token issuance
        icon: key
        note: Audience-bound to this server by name, so a token minted for another is refused.
      - id: grantProfiles
        label: Grant profiles
        icon: scale
        note: >
          Advertised in the authorization-server metadata: `code_challenge_methods_supported`
          (S256, or the client must refuse to proceed), `client_id_metadata_document_supported`,
          `authorization_grant_profiles_supported` including `id-jag`, and the token-exchange
          grant for on-behalf-of calls upstream. Dynamic client registration is deprecated and
          absent.
      - id: consent
        label: Consent records
        icon: doc
        note: >
          What each client was granted, by whom — the record a per-client review reads, and
          the thing the enterprise profile replaces with the consuming organisation's policy.
      - id: clientReg
        label: Client registration
        icon: gear
        note: >
          Dynamic registration is deprecated in favour of client metadata documents, where the
          client's identifier is a URL we fetch — which quietly makes this component an
          outbound HTTP client, and a new SSRF surface.

  - id: service
    kind: service
    title: MCP service
    cosaiComponent: componentApplication
    zone: zoneCloud
    col: 2
    row: 1
    note: >
      A stateless HTTP application — in practice an ASGI app, mounted on its own or inside an
      existing API. Stateless is not a style choice: sticky sessions do not work reliably with MCP
      clients, so horizontal scale requires it. The 2026-07 revision removed protocol sessions
      entirely, which moved a security property with it: there is nothing to validate once and trust
      afterwards, so every request carries a bearer token and every request is validated —
      signature or introspection, audience equals this server's canonical URI, expiry, scope against
      the tool being called, and the subject the handler will act as. What it does with the token
      stops there: never forwarded, never accepted for another audience.
    items:
      - id: endpoint
        label: Protocol endpoint
        icon: plug
        note: One POST endpoint. GET and DELETE are gone, along with the session header and stream resumability.
      - id: handles
        label: State handles
        icon: key
        note: >
          Server-minted, opaque, expiring, and bound to the authenticated principal. Possession
          is not authentication — the protocol will not enforce that for us.
      - id: handlers
        label: Tool handlers
        icon: code
        note: >
          Ordinary application code behind the protocol, and ordinary attack surface. A
          consequential handler returns `input_required` and executes only on the retry that
          carries the caller's confirmation — tool annotations are hints the client must treat
          as untrusted, so this is the confirmation lever the server actually holds.
      - id: resourceMeta
        label: Resource metadata
        icon: doc
        note: >
          The Protected Resource Metadata document every client reads first, naming which
          authorization server this resource trusts. Unauthenticated and public by design, and
          a security artifact: a tampered one points every caller at somebody else's server.

  - id: toolDefs
    kind: service
    title: Tool definitions
    cosaiComponent: componentTools
    zone: zoneCloud
    col: 2
    row: 2
    note: >
      Names, descriptions and schemas. Versioned content that executes as instruction inside a
      caller's model, which makes a wording change a release rather than a copy edit. The spec
      gives no integrity mechanism and no tool-level version field, so pinning by hash at the
      gateway is something we build rather than something we get.
    items:
      - id: descriptions
        label: Tool descriptions
        icon: doc
        note: Text that lands in somebody else's context window and steers their agent.
      - id: schemas
        label: Input schemas
        icon: code
        note: What the server will accept — and, where a parameter is header-mirrored, what a gateway can route on.

  - id: orgData
    kind: external
    title: Enterprise data
    cosaiComponent: componentDataSources
    zone: zoneCloud
    col: 3
    row: 2
    note: >
      The records the service reaches on the caller's behalf. Per-tenant scoping is entirely
      ours to build: the protocol has no notion of a tenant, so nothing is isolated by default.
    items:
      - id: records
        label: Org data
        icon: db
        note: Reached only within the delegation the presented token carries.

  - id: downstream
    kind: external
    title: Downstream services
    cosaiComponent: componentDataSources
    zone: zoneExternal
    col: 4
    row: 1
    pack: downstreamPublic
    note: >
      What our implementation depends on. Reached on **our** credential, not the caller's — the
      spec forbids forwarding a caller's token — which is exactly why this hop is where the
      delegation chain stops bounding anything.

  - id: govIdentity
    kind: governance
    title: Identity services
    icon: person
    zone: zoneGovernance
    col: 0
    row: 3
    capabilities: [capabilityIga, capabilityNhiManagement]
    note: >
      Scope design and the delegation model. The scopes we publish should be the minimal set
      for basic function, with more granted by step-up — a wildcard or omnibus scope is the
      named anti-pattern, and claimed scopes in a token are never sufficient without our own
      authorization logic behind them.

  - id: govSecrets
    kind: governance
    title: Secrets & key management
    icon: key
    zone: zoneGovernance
    col: 1
    row: 3
    capabilities: [capabilitySecretsManagement]
    note: >
      The upstream credentials this service calls outward on — issued, scoped and rotated by a
      secrets manager, one per upstream, never the caller's token forwarded.

  - id: govPolicy
    kind: governance
    title: Policy & authorization
    icon: scale
    zone: zoneGovernance
    col: 2
    row: 3
    capabilities: [capabilityRateLimiting, capabilityToolPermissionScoping, capabilityTransportSecurity, capabilityEgressControl]
    note: >
      Per-tenant limits sized for callers that retry, loop and parallelise — limits tuned for
      human clients are not limits here — plus origin validation against DNS rebinding and the
      egress policy that keeps our own outbound calls and discovery fetches off internal
      addresses.

  - id: govSupplyChain
    kind: governance
    title: Supply-chain assurance
    icon: db
    zone: zoneGovernance
    col: 3
    row: 3
    capabilities: [capabilityMcpToolSecurity, capabilityAppSecTesting, capabilityAiRedTeaming]
    note: >
      Description review and definition pinning. Our tool text is a security property of
      somebody else's system, so it is reviewed like code; and behind the protocol this is a
      published application that deserves ordinary application testing.

  - id: govObservability
    kind: governance
    title: Observability & response
    icon: eye
    zone: zoneGovernance
    col: 4
    row: 3
    capabilities: [capabilityAuditLogging, capabilityKillSwitch, capabilityAiVulnMgmt]
    note: >
      Per-call audit attributable to a tenant and a delegation, and revocation that reaches
      tokens already minted rather than only future ones.

edges:
  - from: callers
    to: idp
    path: external
    bidir: true
    label: SSO & exchange / ID-JAG
    note: >
      The enterprise path. The client signs the user in at the IdP once and keeps the ID token;
      when a server requires enterprise-managed authorization it comes back here to exchange
      that ID token for an identity-assertion grant naming this server — and the IdP's policy
      says yes or no before our authorization server ever sees a request. Repeat exchanges
      happen at token expiry and at every scope step-up, so a policy change bites within one
      token lifetime.
  - from: callers
    to: authServer
    path: external
    bidir: true
    label: authorization / tokens
    note: >
      Where every grant is redeemed. A public client arrives through the browser: the PKCE
      authorization-code flow with `resource` naming this server, a client-ID metadata document as
      its identity, a consent screen showing the client's name and redirect host, and an `iss` in
      the response the client checks before it will redeem the code. An enterprise client arrives
      with an ID-JAG and no browser at all. An autonomous workload arrives with a signed client
      assertion. All three leave with the same thing: a short-lived access token whose audience is
      this server and nothing else.
  - from: callers
    to: gateway
    path: external
    bidir: true
    label: tool calls / results
    note: >
      Whoever they are. Machine traffic at machine rates, arriving with the method and tool
      name mirrored into headers so this tier can act on them without reading bodies.
  - from: gateway
    to: service
    path: primary
    bidir: true
    label: routed call
    note: The admitted request reaches the application, and the result — including our tool descriptions — returns.
  - from: service
    to: authServer
    path: primary
    bidir: true
    label: validate & exchange / verdict
    note: >
      Audience, scope, expiry and subject are verified per request, because there is no session
      left to verify them once. Drawn as introspection — the deliberate choice here, because it is
      also how revocation reaches a token that has not yet expired; the common alternative is local
      JWT validation against the issuer's keys, which is faster and blind to revocation. The same
      edge carries the on-behalf-of exchange: a handler that must call an upstream system swaps
      the inbound token for one whose audience is the upstream, scoped down, so the caller's token
      never leaves this service.
  - from: toolDefs
    to: service
    path: primary
    label: published schemas
    note: >
      Versioned content loaded by the service and served to callers as instruction. The list
      a caller sees is filtered by its scopes, so the hash consumers pin is computed per
      scope-set — or the description-edit scenario false-alarms on every scope change.
  - from: service
    to: orgData
    path: primary
    bidir: true
    label: scoped read & write / records
    note: >
      Bounded by the delegation the token carries. One tenant's agent reaching another tenant's
      records is this architecture's defining failure, and nothing in the protocol prevents it.
  - from: service
    to: downstream
    path: external
    bidir: true
    label: downstream-audience token / result
    note: >
      Where our implementation calls outward. Two honest shapes: a token exchanged on the caller's
      behalf (audience = the upstream, scope narrowed to what this tool needs), so the upstream
      sees who is really asking; or our own service credential where no delegation exists. The
      one forbidden shape is the third — forwarding the caller's token — which the spec rules out
      outright, because it breaks audit, rate limits and the trust boundary in one move.

pins:
  risks:
    - risk: riskPromptInjection
      at: gateway->service
      note: >
        The reverse direction is the dangerous one: what we return is read as instruction by a
        model we do not operate. Our tool descriptions are the payload.
    - risk: riskToolRegistryTampering
      at: toolDefs->service
      note: >
        A changed description changes somebody else's agent behaviour. The protocol offers no
        integrity mechanism and no version field, so an unnoticed edit is a silent change to a
        system we do not run.
    - risk: riskCrossTenantCredentialPropagation
      at: service->orgData
      note: >
        The protocol has no notion of a tenant. Every isolation guarantee here is application
        code we wrote, and the failure is one caller reaching another's records.
    - risk: riskAgenticDelegationConfusedDeputy
      at: authServer
      note: >
        A static client identifier with no per-user record of which clients a user already
        approved is the classic confused deputy at the registration surface. Consent must be
        per client and recorded before the flow proceeds.
    - risk: riskAgenticDelegationConfusedDeputy
      at: service->downstream
      note: >
        Token passthrough — forwarding the caller's token upstream — is the confused deputy
        the protocol documents by name: one compromised agent becomes a multi-service problem
        wearing our audit identity.
    - risk: riskSensitiveDataDisclosure
      at: service->downstream
      note: >
        Our credential, not theirs. Whatever we reach outward, we reach with our own authority
        regardless of who asked, and the audit trail downstream shows us rather than them.
    - risk: riskEconomicDenialOfWallet
      at: callers->gateway
      note: >
        The spec has no quotas and no back-pressure. A looping agent will hammer a tool until
        the backend behind it falls over, and nothing in the protocol slows it down.
    - risk: riskMCPTransportHijacking
      at: service
      note: >
        With protocol sessions gone, cross-call state is server-minted handles carried as
        arguments — a handle that is guessable, unexpiring or unbound to its principal is the
        session-hijacking risk reborn in application code, where it is the most likely thing
        to get wrong.
    - risk: riskZombieShadowMCPServers
      at: service
      note: A published server that outlives the team that wrote it, still holding live grants into org data.

    - risk: riskInsecureIntegratedComponent
      at: gateway->service
      note: >
        The service is built on the official SDK, and the SDK's CVE stream is ours to ship — the
        2026 request-handling flaws reached every server built on it, up to 200,000 instances by
        the disclosed count.
    - risk: riskInsecureIntegratedComponent
      at: gateway
      note: >
        A LiteLLM-class tier with its own CVE stream and its own release channel — the
        backdoored gateway release is this component, fronting everything we publish.
    - risk: riskStaleAgentIdentityBinding
      at: service->authServer
      note: >
        A token issued a minute before the IdP removed the user is still cryptographically valid;
        local JWT validation would honour it until expiry. Introspection, short lifetimes and
        rotating refresh tokens are what make revocation real for a running agent.
    - risk: riskAgenticDelegationConfusedDeputy
      at: callers->authServer
      note: >
        The mix-up: a client that talks to many authorization servers can be steered into redeeming
        an honest code at an attacker's token endpoint. Recording the issuer before redirecting and
        checking `iss` in the response is the mitigation; PKCE alone does not stop it.
  capabilities:
    - capability: capabilityIga
      at: service->authServer
      note: >
        Tokens audience-bound to this server by name, and refused if minted for anything else;
        the `resource` audience is asserted at issuance and checked on every request. The
        Protected Resource Metadata that names our authorization server is integrity-protected
        like code, because a client trusts whatever it says. Under the enterprise-managed
        profile the consuming organisation's own policy decides issuance, which is what makes
        revocation immediate and central.
    - capability: capabilityNhiManagement
      at: callers->gateway
      note: The caller is a machine identity; treat it as one, with its own lifecycle rather than a shared key.
    - capability: capabilityRateLimiting
      at: callers->gateway
      note: >
        Per-client and per-tenant, sized for callers that retry and parallelise. This is ours to
        build entirely — the protocol provides no quota mechanism at all.
    - capability: capabilityTransportSecurity
      at: callers->gateway
      note: HTTPS throughout, and `Origin` validated against DNS rebinding on the inbound leg.
    - capability: capabilityEgressControl
      at: authServer
      note: >
        Client metadata documents make this component an outbound HTTP client: its discovery
        fetches are blocked from private and metadata addresses — the SSRF surface the move
        away from dynamic registration newly created, answered where the fetch happens.
    - capability: capabilityToolPermissionScoping
      at: gateway->service
      note: >
        Minimal scopes with step-up rather than an omnibus grant, and the whole set needed for
        an operation emitted in one challenge instead of drip-fed. The tool list is filtered
        by the presenting token's scopes on every request — a tool the caller cannot invoke
        is never shown to its model.
    - capability: capabilityMcpToolSecurity
      at: toolDefs->service
      note: >
        Pin definitions by hash and alert on any change between sessions. The spec gives no
        integrity mechanism, so this is built at the gateway or it does not exist.
    - capability: capabilityAppSecTesting
      at: service
      note: Behind the protocol this is a published application, and its handlers are ordinary attack surface.
    - capability: capabilityDataAccessGovernance
      at: service->orgData
      note: Per-tenant scoping enforced in our own code, because the protocol has no tenants.
    - capability: capabilitySecretsManagement
      at: service->downstream
      note: >
        A separate credential for each upstream we call, never the caller's token forwarded —
        which the spec forbids outright, because forwarding breaks audit, rate limiting and the
        trust boundary in one move.
    - capability: capabilityEgressControl
      at: service->downstream
      note: Named destinations only for the calls our implementation makes as itself.
    - capability: capabilityAuditLogging
      at: govObservability
      note: Every invocation with its parameters, its tenant and its delegation, retained where an incident can query it.
    - capability: capabilityKillSwitch
      at: govObservability
      note: Revocation that reaches tokens already issued, not merely future ones.
    - capability: capabilityAiRedTeaming
      at: govSupplyChain
      note: Probe our own descriptions the way an adversarial caller would, since they run in somebody else's model.

    - capability: capabilityAiVulnMgmt
      at: govObservability
      note: >
        The SDK, the gateway and the handlers behind them tracked as a patch stream with an
        owner and a clock; a published server ages like any other application.
    - capability: capabilityIga
      at: callers->idp
      note: >
        Identity governance where it already lives: the IdP's registry of approved MCP servers, the
        groups and roles that may reach each, and the conditional-access rules — evaluated at every
        ID-JAG exchange. Joiners get access by group; leavers lose every new token at once.
    - capability: capabilityNhiManagement
      at: authServer
      note: >
        An autonomous workload is a client with no user: it authenticates with `private_key_jwt`
        under `client_credentials`, its key registered against its own identity, and receives
        narrower scopes than a delegated user would — no consent, no step-up, no borrowed authority.
    - capability: capabilityCredentialIsolation
      at: service->authServer
      note: >
        The inbound token stops at the service. A handler that needs an upstream system exchanges it
        for a downstream-audience token scoped to the tool, or calls as the service on its own
        credential — and the exchange is logged as a delegation step, so the chain stays legible.

walkthrough:
  title: A public client authorizes and invokes a tool
  moves: >-
    Discovery, consent and a bounded token — then one tool call inside that bound.
  steps:
    - follow: callers->gateway
      note: >
        An unauthenticated first call. The answer is a 401 whose `WWW-Authenticate` header carries
        `resource_metadata` — the URL of this server's Protected Resource Metadata — and the
        `scope` this operation needs, so the client asks for no more than that.
    - follow: gateway->callers
      note: >
        The 401 goes back. The client now knows where to read the metadata and which scopes to request.
    - follow: callers->gateway
      note: >
        The client fetches the Protected Resource Metadata: `resource` (this server's canonical URI),
        `authorization_servers`, `scopes_supported`, `bearer_methods_supported`. Fetched over
        HTTPS, private address ranges refused — the metadata URL came from a stranger.
    - follow: gateway->callers
      note: >
        The document returns; the client picks an authorization server from the list and keeps
        separate client state for it — credentials for one issuer are never reused at another.
    - follow: callers->authServer
      note: >
        Authorization-server metadata discovery: RFC 8414 well-known first, OpenID discovery second,
        path components handled in the specified order. The client verifies `issuer` in the document
        equals the URL it built, refuses to proceed unless `code_challenge_methods_supported` is
        present, and notes `client_id_metadata_document_supported`.
    - follow: authServer->callers
      note: >
        The metadata returns and the client records the issuer it will hold every later response to.
    - follow: callers->authServer
      note: >
        The authorization request through the user's browser: `client_id` is the HTTPS URL of the
        client's metadata document, `redirect_uri` one of those it lists, PKCE `S256`, `resource`
        naming this server, `state`, and the challenged scopes. The authorization server fetches the
        metadata document (private ranges blocked), checks `client_id` matches the URL and the
        redirect URI matches exactly, applies its domain trust policy, and shows a consent screen
        naming the client and the redirect host — with a warning if that host is `localhost`.
    - follow: authServer->callers
      note: >
        The user approves; the code returns with `iss`. The client compares `iss` to the issuer it
        recorded before redirecting and abandons the code on any mismatch — the mix-up defence.
    - follow: callers->authServer
      note: >
        The token request: code, `code_verifier`, `resource`. For a public client the `state` was
        single-use and the code is bound to the verifier, so an intercepted code is worthless.
    - follow: authServer->callers
      note: >
        An access token audience-bound to this server's canonical URI, short-lived, with the granted
        scopes — possibly fewer than asked — and a refresh token that rotates on every use.
    - follow: callers->gateway
      note: >
        The tool call, `Authorization: Bearer`, never in the query string, with `Mcp-Method` and
        `Mcp-Name` mirrored into headers so the gateway can route, meter and authorize per tool.
    - follow: gateway->service
      note: >
        Routed and metered per tool without the body being parsed — and the service checks the
        headers against the body, refusing a mismatch outright.
    - follow: service->authServer
      note: >
        Per-request validation: signature or introspection, `aud` equals this server, not expired,
        scope covers this tool, and the subject the handler will act as.
    - follow: authServer->service
      note: >
        Valid. The delegation the token carries is now the bound on the call — and the tenant on the
        token is what the handler must match against the record.
    - follow: service->orgData
      note: >
        The read happens inside that delegation, and not one record wider.
    - follow: orgData->service
      note: >
        The record comes back inside the same delegation.
    - follow: service->gateway
      note: >
        The result — bounded in size, because it lands in somebody else's context window.
    - follow: gateway->callers
      note: >
        Logged per call against client, user, tenant and tool, and returned.
scenarios:
  - title: Enterprise-managed authorization — sign in once, no per-server consent
    steps:
      - follow: callers->idp
        note: >
          The client already signed the user in at the corporate IdP and kept the ID token. It declares
          support for the `enterprise-managed-authorization` extension in its request capabilities.
      - follow: idp->callers
        note: >
          The ID token is the subject token for what follows; nothing else from the login is reused.
      - follow: callers->gateway
        note: >
          The first tool call, unauthenticated, is answered with a 401 and the resource metadata URL.
      - follow: gateway->callers
        note: >
          The client reads the Protected Resource Metadata and finds this server's authorization server.
      - follow: callers->authServer
        note: >
          Authorization-server metadata: `authorization_grant_profiles_supported` includes `id-jag`,
          so the client knows to use the enterprise flow and does not open a browser.
      - follow: authServer->callers
        note: >
          The client records the issuer — it becomes the `audience` of the exchange it is about to ask for.
      - follow: callers->idp
        note: >
          Token exchange at the IdP: `grant_type=token-exchange`, `subject_token` = the ID token,
          `requested_token_type` = `id-jag`, `audience` = our authorization server's issuer,
          `resource` = this server's canonical URI, `scope` = what the challenge asked for. The IdP
          evaluates its policy — is this server approved for this organisation, is this user in a
          group that may reach it with these scopes, do conditional-access rules pass.
      - follow: idp->callers
        note: >
          An ID-JAG: a signed JWT, `typ: oauth-id-jag+jwt`, with `iss` (the IdP), `sub` (the user),
          `aud` (our authorization server), `client_id`, `resource` (this server), `scope`, `jti`, `exp`.
          Or a policy denial the client surfaces as such — no token, no consent screen, nothing to retry.
      - follow: callers->authServer
        note: >
          The JWT-bearer grant: `grant_type=jwt-bearer`, `assertion` = the ID-JAG, `client_id`, and
          `private_key_jwt` client authentication where the client has a key. Our server validates the
          assertion against the IdP's published keys, checks `iss` is a trusted IdP, `aud` is itself,
          `exp` and `jti` unused, and links the account by `sub` — `email` only as a fallback for
          accounts that predate the federation.
      - follow: authServer->callers
        note: >
          An access token audience-bound to the `resource` in the assertion, scopes no wider than the
          ID-JAG carried. The user never saw a consent screen for this server; their administrator
          decided once, in the IdP.
      - follow: callers->gateway
        note: >
          The tool call, bearer token in the header, method and tool name mirrored into headers.
      - follow: gateway->service
        note: >
          Routed and metered per tool.
      - follow: service->authServer
        note: >
          Validated per request — audience, scope, expiry, subject — exactly as for any other token.
      - follow: authServer->service
        note: >
          Valid; the delegation bounds the call.
      - follow: service->orgData
        note: >
          The read, inside the tenant and the scope the token names.
      - follow: orgData->service
        note: >
          The record comes back.
      - follow: service->gateway
        note: >
          The result, bounded and logged against client, user, tenant and tool.
      - follow: gateway->callers
        note: >
          Returned. Onboarding was a group membership; offboarding will be its removal.
  - title: Step-up — a consequential tool needs a scope the token lacks
    steps:
      - follow: callers->gateway
        note: >
          A call to a write tool with a token that carries only the read scopes it started with —
          least privilege at first grant, by design.
      - follow: gateway->service
        note: >
          Routed and metered like any call.
      - follow: service->authServer
        note: >
          The token is valid — audience, expiry, subject all good — but its scopes do not cover this tool.
      - follow: authServer->service
        note: >
          Insufficient, not invalid.
      - follow: service->gateway
        note: >
          A 403 with `WWW-Authenticate: Bearer error="insufficient_scope"`, `scope` listing every
          scope this operation needs in one challenge, and `resource_metadata`. One round trip, not
          one scope per retry.
      - follow: gateway->callers
        note: >
          The client computes the union of what it already holds and what was challenged, so nothing
          previously granted is lost.
      - follow: callers->idp
        note: >
          For an enterprise client the step-up is another token exchange, with the wider scope — and
          the IdP's policy decides again. A user who may read but not write is told so here, by the
          organisation, not by a consent screen.
      - follow: idp->callers
        note: >
          A new ID-JAG with the widened scope, or a denial the client treats as final after a few tries.
      - follow: callers->authServer
        note: >
          The JWT-bearer grant again (a public client would re-run the authorization-code flow and
          see a consent screen listing exactly the added scope).
      - follow: authServer->callers
        note: >
          A new token with the union of scopes.
      - follow: callers->gateway
        note: >
          The original request, retried once.
      - follow: gateway->service
        note: >
          Routed and metered.
      - follow: service->orgData
        note: >
          The write, inside the widened delegation — and, for a consequential action, only on the retry
          that carries the confirmation the tool asked for through `input_required`.
      - follow: orgData->service
        note: >
          The record confirms the change.
      - follow: service->gateway
        note: >
          Logged with the scope elevation that preceded it, so the audit shows why this token could write.
  - title: A handler calls an upstream system on the caller's behalf
    steps:
      - follow: callers->gateway
        note: >
          An ordinary call to a tool whose handler wraps an existing internal API.
      - follow: gateway->service
        note: >
          The handler has the caller's token in hand, and the upstream wants a credential.
      - follow: service->authServer
        note: >
          Not that one. The service exchanges the inbound token: `grant_type=token-exchange`,
          `subject_token` = the caller's access token, `audience` = the upstream API, `scope`
          narrowed to what this tool needs — an on-behalf-of token that still names the user.
      - follow: authServer->service
        note: >
          A downstream-audience token. The exchange is logged as a delegation step: who asked, through
          which tool, for which upstream, with which scope.
      - follow: service->downstream
        note: >
          The upstream call carries that token, so the upstream sees who is really asking and applies
          its own authorization — instead of a service account that can see everything, or the
          caller's token forwarded, which the spec forbids outright.
      - follow: downstream->service
        note: >
          The upstream result returns.
      - follow: service->gateway
        note: >
          Composed into the tool result, bounded in size.
      - follow: gateway->callers
        note: >
          Returned, with two audit lines that join on the same delegation: ours and the upstream's.
  - title: An autonomous workload calls with no user behind it
    steps:
      - follow: callers->authServer
        note: >
          A scheduled agent, not a person. `grant_type=client_credentials`, authenticated with
          `private_key_jwt` under its own registered identity, `resource` naming this server, and the
          scopes its registration allows — narrower than any user's, because nobody will be asked to
          approve a step-up.
      - follow: authServer->callers
        note: >
          An access token whose subject is the workload itself. No consent, because there is no
          resource owner; the registration of that identity was the approval.
      - follow: callers->gateway
        note: >
          The tool call, on the workload's token and its own rate limits.
      - follow: gateway->service
        note: >
          Routed and metered against a machine identity.
      - follow: service->authServer
        note: >
          Validated per request. The handler notes the subject is a workload and applies the policy
          for autonomous callers: no delegation chain to honour, so the scopes are the whole bound.
      - follow: authServer->service
        note: >
          Valid.
      - follow: service->orgData
        note: >
          The read, inside what the workload's registration permits — and nothing a human's
          membership would have added.
      - follow: orgData->service
        note: >
          The record comes back, logged against a non-human identity with its own lifecycle.
  - title: A token minted for another server is refused
    steps:
      - follow: callers->gateway
        note: >
          A call carrying a perfectly valid token — issued by the same authorization server, for a
          different MCP server, or for an upstream API the client also uses.
      - follow: gateway->service
        note: >
          Routed like any call; the gateway may pre-check the audience but the service must not rely on it.
      - follow: service->authServer
        note: >
          Validation: signature good, not expired — and `aud` is not this server's canonical URI.
      - follow: authServer->service
        note: >
          Refused. A server that accepts a token issued for any other audience is the passthrough
          failure in its first form, and everything downstream of it inherits the confusion.
      - follow: service->gateway
        note: >
          A 401 with the resource metadata, so an honest client can start the right flow.
      - follow: gateway->callers
        note: >
          Returned. The client that keeps per-issuer, per-resource token state never sends this.
  - title: Revocation reaches an agent mid-task
    steps:
      - follow: callers->gateway
        note: >
          An agent mid-task calls again with a token issued a minute ago — and in that minute the user
          left the group that grants this server, or an administrator pulled the client.
      - follow: gateway->service
        note: >
          Routed like any call.
      - follow: service->authServer
        note: >
          Introspection, not local validation: the authorization server knows the grant was revoked,
          because revocation at the IdP propagated to it — the reason introspection was the choice here.
      - follow: authServer->service
        note: >
          Revoked.
      - follow: service->gateway
        note: >
          A 401. Nothing the agent holds works any more, including the refresh token.
      - follow: gateway->callers
        note: >
          The agent tries to recover the way an honest client would.
      - follow: callers->idp
        note: >
          A fresh token exchange — and the IdP's policy, which is the source of truth, says no.
      - follow: idp->callers
        note: >
          Denied. The revocation was one change in one place and it reached every client of every
          server within one token lifetime, which is the argument for lifetimes measured in minutes.
  - title: A description edit ships
    steps:
      - follow: toolDefs->service
        note: A wording change is deployed like any other content change.
      - follow: service->gateway
        note: The next tools/list response carries it outward, past the hash pin that should notice.
      - follow: gateway->callers
        note: >
          And it lands in every consuming agent's context as instruction. Nothing in the
          protocol versions this, which is why the pin is a hash we hold rather than a field we
          read.
  - title: One tenant's agent asks for another tenant's record
    steps:
      - follow: callers->gateway
        note: A syntactically perfect request — the object id just belongs to somebody else.
      - follow: gateway->service
        note: Routed and metered like any call; nothing at this tier knows what the id means.
      - follow: service->authServer
        note: The token is checked — audience, scope and subject.
      - follow: authServer->service
        note: All valid. The protocol is satisfied.
      - follow: service->orgData
        note: >
          The tenant check in our own application code is the only thing left standing, because
          the protocol has no notion of a tenant at all. This architecture's defining failure
          happens on this hop or nowhere.
  - title: A handler forwards the caller's token
    steps:
      - follow: callers->gateway
        note: An ordinary call to a tool whose handler reaches an upstream system.
      - follow: gateway->service
        note: The handler has the caller's token in hand, and the upstream wants a credential.
      - follow: service->downstream
        note: >
          Forwarding it is the confused deputy the spec forbids outright: audit, rate limits
          and the trust boundary all break in one move. The handler calls as itself, on a
          credential the secrets manager issued to this service, or the design is wrong.

  - title: The header lies about the body
    steps:
      - follow: callers->gateway
        note: >
          `Mcp-Name: read_ticket` in the headers; `delete_ticket` in the body. The gateway
          routes and meters on the header, because that is what the header is for.
      - follow: gateway->service
        note: >
          Routed and metered as a read. The service parses the body — and must refuse the
          mismatch outright, or the meter, the per-tool policy and the audit line all
          describe a call that never happened.

deviations:
  - subject: The AI gateway carries MCP traffic only
    reason: >
      There is no model anywhere in this service, so a Model proxy item would be false, and
      nothing fetches skills through this crossing either. The gateway is drawn with its one
      real traffic class rather than the registered aiGatewayTraffic pack, following the
      low-code builder's precedent: the honest signal that a gateway is not on the model path
      is its own contents.
  - subject: The service is drawn as one application block, not protocol stages
    reason: >
      Transport, router and handlers deploy as one stateless service, so they are one block
      with items — the thing a team ships and scales. Tool definitions stay separate because
      they are a different artifact class: versioned content with a review pipeline, whose
      distinctive edge runs into the caller's context rather than through the service.
  - subject: The identity provider is drawn because tokens flow through it
    reason: >
      The catalogue keeps identity providers as a governance call-out, drawn as a block only where
      tokens genuinely flow through them. Here they do: under enterprise-managed authorization the
      client's ID token is exchanged at the IdP for an identity-assertion grant, and the IdP's policy
      is the authorization decision. For a customer organisation's callers the block stands for their
      IdP, federated by trusting its issuer and keys; the mechanism is identical and the policy is
      theirs. The authorization server's trust in the IdP — issuer allowlist and key fetch — is
      configuration rather than a data path, and is carried on the Grant profiles item rather than
      drawn as an edge (2026-09-03).
  - subject: The callers origin sits in our cloud band as a layout necessity
    reason: >
      Whoever calls a published server — internal agents, chat products, other services — the
      drawing deliberately claims no ownership over them: the origin is unnamed and its band
      placement is geometry, not custody. Moving it to the external band would split that band
      across the drawing; the origin kind exists precisely so an edge can arrive from an
      unclaimed source.
  - subject: Outbound secrets and egress are absorbed by the service and its platform
    reason: >
      capabilitySecretsManagement and capabilityEgressControl are embodied by the AI gateway,
      which sits on the inbound side only. On the outbound hop the service itself holds the
      brokered upstream credential and the platform's network policy enforces the destination
      list — recorded here rather than drawing an egress tier that nobody runs.
  - subject: Definition pinning is enforced on the data path
    reason: >
      capabilityMcpToolSecurity is a management capability, and the supply-chain call-out
      cites it — but the hash pin is checked where definitions load and serve, so the chip
      sits on the toolDefs edge. The locus departure is deliberate: built at the gateway or it
      does not exist.
  - subject: The authorization server's metadata fetch path is not drawn
    reason: >
      Fetching a client metadata document is a single outbound HTTP request to a URL the
      client chose; drawing a standing edge for it would overstate it. The surface is carried
      on the clientReg item and answered by the egress pin on the block.
  - subject: Sessions are gone because the protocol removed them
    reason: >
      The current protocol revision deleted sessions and the initialize handshake; cross-call
      state is explicit server-minted handles carried as arguments. The old session-hijacking
      risk is drawn as state-handle hijacking on the service instead.

