# Gemini CLI — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# Excluded: Antigravity CLI (the consumer replacement since 2026-06-18) and the run-gemini-cli
# GitHub Action (a CI runtime; its advisory is recorded here because it patched the CLI itself).
# The Gemini Code Assist IDE extensions are a separate product family and are not onboarded.
# 2026-09-25: re-verified toolGeminiCli against the MITRE capability rules; every geminicli.com and
# docs.cloud.google.com URL resolved without redirect; goo.gle/manage-gemini-cli (the Management Console link)
# still lands on the geminicli.com home page; support.google.com/a/answer/9176657 and /1668854 redirect to
# knowledge.workspace.google.com/admin/security/*; cloud.google.com/security/compliance redirects to
# cloud.google.com/compliance.
vendor: google
family: Gemini CLI
tools:
  - id: toolGeminiCli
    name: Gemini CLI
    surfaceClasses:
      - endpointCli
    variants:
      - name: Gemini CLI (npm @google/gemini-cli, v0.61.0 stable 2026-09-23)
        class: endpointCli
        url: https://github.com/google-gemini/gemini-cli/releases
    architecture: archCodingAgentThirdParty
    status: ga
    asOf: "2026-09"
    summary:
      - "Google's open-source terminal coding agent (Apache-2.0, npm @google/gemini-cli): a ReAct loop over
        built-in file, shell, web-fetch and search tools, MCP servers, hooks, extensions, sub-agents and
        skills, driven by a present developer. Inference is remote — Gemini via the Code Assist service
        (Google Workspace account with a Gemini Code Assist Standard or Enterprise licence and a Google Cloud
        project), a Gemini API key, or Vertex AI; the developer runs the harness on their own machine."
      - "Prompts, file contents and tool output leave the device for the chosen Google endpoint; session
        transcripts, checkpoints and the shadow-git history stay under ~/.gemini. Usage statistics go to
        Google unless privacy.usageStatisticsEnabled is false; OpenTelemetry export is off unless
        telemetry.enabled is set, and logPrompts decides whether prompt text rides along."
      - "Two admin planes. Locally, a root-owned system settings.json (/etc/gemini-cli,
        C:\\ProgramData\\gemini-cli, /Library/Application Support/GeminiCli) takes final precedence over user
        and workspace settings and carries tools.core, mcp.allowed, tools.sandbox, security.auth.enforcedType,
        security.disableYoloMode and telemetry.*; admin-tier policy TOML files under the same directory
        outrank every other policy tier. Remotely, the Enterprise Admin Controls page describes a Management
        Console (strict mode, extensions, MCP on/off, an MCP allowlist that strips local command/args/env,
        required MCP servers, unmanaged capabilities) that the client enforces and users cannot override — the
        console itself is reached through a go-link that resolves only to geminicli.com, so its location and
        licence gating could not be verified."
      - "The consumer path is closing: the vendor's authentication page states that Gemini CLI was replaced by
        Antigravity CLI on 2026-06-18 for unpaid-tier and Google One users, and the Code Assist for
        individuals notice says Login with Google no longer serves the CLI for individual, Google AI Pro and
        Ultra tiers. Organisations stay on Code Assist Standard/Enterprise, an API key or Vertex AI."
    facts:
      - label: Plans
        value: >-
          Gemini Code Assist Standard (1,500 requests/user/day) and Enterprise (2,000) include the CLI, with
          quota shared with Code Assist agent mode; Gemini API key (unpaid 250/day Flash-only, or paid) and
          Vertex AI (express or pay-as-you-go) are the other paths. The quota page still lists the free
          Google-account tier, but the authentication page says that tier moved to Antigravity CLI on
          2026-06-18.
        url: https://geminicli.com/docs/resources/quota-and-pricing/
      - label: Inference & routing
        value: >-
          Remote only: Code Assist API for licensed Workspace/Cloud accounts (needs GOOGLE_CLOUD_PROJECT and
          the Gemini for Cloud API), Gemini API with GEMINI_API_KEY, or Vertex AI with ADC / service-account
          JSON / GOOGLE_API_KEY. GOOGLE_GEMINI_BASE_URL (API-key auth) and GOOGLE_VERTEX_BASE_URL (Vertex
          auth) redirect those calls through an organisation proxy; the Code Assist path has no documented
          base-URL override.
        url: https://geminicli.com/docs/get-started/authentication/
      - label: Data leaving the device
        value: >-
          Prompts, context files, tool output and file contents to the model endpoint; anonymous usage
          statistics to Google (privacy.usageStatisticsEnabled, default true); OTLP telemetry to a local
          collector or Google Cloud Logging/Trace/Monitoring only when telemetry.enabled is set, with
          telemetry.logPrompts governing prompt text.
        url: https://geminicli.com/docs/cli/telemetry/
      - label: Retention & training
        value: >-
          Code Assist Standard/Enterprise: stateless service, prompts and responses are not stored in Google
          Cloud unless the admin turns on logging to a Cloud Logging bucket; "Google doesn't use your data to
          train our models without your permission". API-key and Vertex paths fall under the Gemini API
          (unpaid/paid) and Google Cloud terms respectively.
        url: https://docs.cloud.google.com/gemini/docs/codeassist/security-privacy-compliance
      - label: Enterprise admin planes
        value: >-
          System settings.json and admin policy TOML on the machine (GEMINI_CLI_SYSTEM_SETTINGS_PATH overrides
          the path); Management Console controls (strict mode, extensions, MCP allowlist and required servers,
          unmanaged capabilities) enforced by the client and non-overridable locally.
        url: https://geminicli.com/docs/admin/enterprise-controls/
      - label: Docs index
        value: >-
          geminicli.com/docs — Enterprise configuration, Settings reference, Policy engine, Sandboxing,
          Trusted folders, Hooks, MCP servers, Extensions, Telemetry, Terms & privacy.
        url: https://geminicli.com/docs/
    items:
      - title: Settings precedence and the system override file
        body:
          - "Settings merge in the order system defaults (system-defaults.json), user
            (~/.gemini/settings.json), workspace (.gemini/settings.json), then the system override
            (settings.json in /etc/gemini-cli, C:\\ProgramData\\gemini-cli or /Library/Application
            Support/GeminiCli), which wins; arrays such as includeDirectories and objects such as mcpServers
            are merged rather than replaced. Environment variables and command-line flags sit above the files.
            GEMINI_CLI_SYSTEM_SETTINGS_PATH and GEMINI_CLI_SYSTEM_DEFAULTS_PATH relocate the system files, so
            pin them or the directory ACLs with MDM."
        links:
          - title: Enterprise configuration
            url: https://geminicli.com/docs/cli/enterprise/
          - title: Settings reference
            url: https://geminicli.com/docs/reference/configuration/
      - title: Policy engine tiers
        body:
          - "Tool calls are decided by TOML rules (toolName, mcpName, argsPattern, commandPrefix /
            commandRegex, decision allow / deny / ask_user, priority 0-999, modes, interactive). Tiers are
            default 1, extension 2, workspace 3 (currently disabled), user 4, admin 5; admin rules in the
            system policies directory always outrank user rules, and a global deny removes the tool from the
            model's context. ask_user is treated as deny in headless runs. Out of the box, read-only tools are
            allowed and write tools and run_shell_command ask; yolo mode adds a high-priority allow-all rule."
        links:
          - title: Policy engine reference
            url: https://geminicli.com/docs/reference/policy-engine/
      - title: Management Console controls
        body:
          - "The Enterprise Admin Controls page lists Strict Mode (blocks yolo mode), an Extensions toggle, an
            MCP toggle, an MCP allowlist (locally configured servers not in the list are ignored, and the
            client clears command, args, env and cwd so only remote servers survive), Required MCP Servers
            (injected, overriding same-named local entries, with authProviderType / targetServiceAccount /
            oauth fields) and Unmanaged Capabilities (currently Agent Skills). All are described as enforced
            globally and immutable locally. The page's console link (goo.gle/manage-gemini-cli) redirected to
            the geminicli.com home page on 2026-09-10, so treat the delivery path as unverified."
        links:
          - title: Enterprise admin controls
            url: https://geminicli.com/docs/admin/enterprise-controls/
    riskNotes:
      - risk: riskPromptInjection
        note: >-
          GEMINI.md context files are loaded from the repository, its parents and any directory a tool
          touches; the first public exploit (Tracebit, 2025-07) hid instructions in a README.md the CLI pulled
          into context and chained a payload behind an allowlisted grep. Trusted folders keep workspace
          settings (and with them project hooks), .env files, MCP servers and custom commands off until the user
          trusts the folder; the page does not list GEMINI.md context loading among them, and nothing classifies
          the content.
      - risk: riskRogueActions
        note: >-
          --yolo and per-session "always allow" remain user choices unless the admin sets
          security.disableYoloMode / security.disableAlwaysAllow or Strict Mode; GHSA-wpqr-6v78-jr5g (CVSS
          10.0) showed yolo mode ignoring the tool allowlist and headless runs trusting the workspace
          automatically.
      - risk: riskToolSourceProvenance
        note: >-
          Extensions install from any GitHub URL or local path and bundle MCP servers, hooks, commands,
          sub-agents and skills; only the admin extensions toggle and the MCP allowlist bound the source, and
          neither pins content.
      - risk: riskSensitiveDataDisclosure
        note: >-
          API keys live in plaintext in .gemini/.env or shell profiles; telemetry.logPrompts defaults to true
          on the telemetry page, the settings reference states no default and the enterprise page recommends
          false, so set it explicitly in the system file.
    controls:
      - mitigation: D3-MFA
        coverage: native
        mechanism: >-
          Google Workspace / Cloud Identity 2-Step Verification enforcement (Admin console > Security >
          Authentication > 2-step verification > Enforcement) on the accounts holding Gemini Code Assist
          Standard/Enterprise licences; security.auth.enforcedType "oauth-personal" in the system settings.json
          pins the CLI to Sign in with Google; the X-GeminiCodeAssist-Allowed-Domains header pins the account
          domain
        steps:
          - title: Enforce 2-Step Verification on the licensed accounts
            body:
              - In the Google Admin console go to Security > Authentication > 2-step verification, select the
                organizational unit or group that holds Code Assist users, check Allow users to turn on 2-Step
                Verification and set Enforcement to On; keep the New user enrollment period short and leave
                Allow user to trust the device unchecked.
            url: https://knowledge.workspace.google.com/admin/security/deploy-2-step-verification
          - title: Pin the CLI to Google sign-in
            body:
              - In the system settings.json (/etc/gemini-cli, C:\ProgramData\gemini-cli or /Library/Application
                Support/GeminiCli) set security.auth.enforcedType to "oauth-personal"; a user configured for
                another method is prompted to switch, and non-interactive runs exit with an error.
            url: https://geminicli.com/docs/cli/enterprise/
          - title: Pin the account domain
            body:
              - On the organisation's TLS-inspecting proxy inject X-GeminiCodeAssist-Allowed-Domains with the
                organisation's domains into requests to https://cloudcode-pa.googleapis.com, so the Code Assist
                backend rejects any other Google account.
            url: https://docs.cloud.google.com/gemini/docs/codeassist/network-access
        note: >-
          Rated native: the vendor's own account layer can require the second factor for every org member, and
          the client can be pinned to that account. 2SV is enforced by Google sign-in for Google-managed
          Workspace or Cloud Identity accounts; where the organisation federates to a third-party IdP the
          second factor is that IdP's policy instead. It covers interactive Sign in with Google only. Paths
          that skip it: the locally cached OAuth credential reused by later and headless runs (its lifetime is
          not documented on the authentication page), GEMINI_API_KEY, Google Cloud API keys and Vertex
          service-account JSON keys. enforcedType makes the CLI refuse those, but it lives in a local file that
          a user with local administrator rights, or one who re-points GEMINI_CLI_SYSTEM_SETTINGS_PATH without
          the enterprise page's wrapper script, can bypass; the domain header binds only traffic that crosses
          the organisation's proxy. Consumer Login with Google stopped serving the CLI on 2026-06-18, so a
          personal account is refused by the service itself. A 2SV enforcement date or new-user enrollment
          period allows password-only sign-in until it ends.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityIga
          reviewRequired: false
          original:
            - capability: capabilityIga
              coverage: native
              mechanism: >-
                Google account sign-in gated by a Gemini Code Assist licence and Google Cloud project IAM;
                security.auth.enforcedType in the system settings file
              steps:
                - title: Force the organisation's auth path
                  body:
                    - In the system settings.json set security.auth.enforcedType (the enterprise page's
                      example is "oauth-personal") so a mismatched cached credential triggers
                      re-authentication rather than silently using an API key.
                  url: https://geminicli.com/docs/cli/enterprise/
                - title: Licence and project
                  body:
                    - Company, school and Workspace accounts need a Gemini Code Assist licence,
                      GOOGLE_CLOUD_PROJECT set, the Gemini for Cloud API enabled and IAM access on that
                      project; without them Sign in with Google does not serve the CLI.
                  url: https://geminicli.com/docs/get-started/authentication/
              verified: 2026-09-10
      - mitigation: cap-agent-action-policy-enforcement
        coverage: native
        mechanism: >-
          Admin-tier policy engine TOML in the system policies directory (toolName, mcpName, argsPattern,
          commandPrefix / commandRegex, subagent; decision allow / deny / ask_user); hooks.BeforeTool in the
          system settings as an organisation-written attach point
        steps:
          - title: Ship admin policies
            body:
              - Place [[rule]] TOML files in /etc/gemini-cli/policies (macOS /Library/Application
                Support/GeminiCli/policies, Windows C:\ProgramData\gemini-cli\policies), root-owned and not
                writable by group or others or the CLI ignores them; match shell calls with commandPrefix or
                commandRegex, MCP tools with mcpName, arguments with argsPattern, and set decision "deny" with a
                denyMessage.
            url: https://geminicli.com/docs/reference/policy-engine/
          - title: Add a BeforeTool gate
            body:
              - A hooks.BeforeTool command in the system settings receives tool_name and tool_input and blocks
                the call with decision "deny" or exit code 2; treat it as defence in depth behind the admin
                policy tier.
            url: https://geminicli.com/docs/hooks/reference/
        note: >-
          Native: admin policies are declarative rules over tool name, arguments and target, evaluated by the
          harness before every built-in, MCP and sub-agent tool call, and the admin tier outranks extension,
          user and default rules (yolo's allow-all is a default-tier rule); supplemental --admin-policy and
          adminPolicyPaths files are ignored once the standard directory holds TOML. The decision is logged in
          the gemini_cli.tool_call telemetry event when telemetry is on. Boundary: enforced by the CLI on the
          device, per machine rather than per user principal; the enterprise page warns that a user with local
          administrator rights can circumvent its controls; an underscore in an MCP server name makes mcpName
          rules fail silently; a remote server's own downstream actions are outside it. Hooks are not
          admin-locked (project and user hooks rank above system hooks, /hooks disable-all turns them off, and
          non-JSON output is treated as allow). security.enableConseca (off by default) adds an LLM-generated
          per-prompt policy, non-deterministic and credited as a supplement only. The workspace policy tier is
          currently non-functional; the page gives the admin tier base 5 in its table and 4 in its text.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAgentRuntimeEnforcement
          reviewRequired: false
          original:
            - capability: capabilityAgentRuntimeEnforcement
              coverage: native
              mechanism: Admin-tier policy engine TOML plus BeforeTool hooks in the system settings file
              steps:
                - title: Ship admin policies
                  body:
                    - "Place [[rule]] files in /etc/gemini-cli/policies (or the macOS / Windows equivalents): admin
                      tier 5 outranks user and workspace tiers; use commandPrefix / commandRegex for shell, mcpName
                      for servers, decision deny with denyMessage."
                  url: https://geminicli.com/docs/reference/policy-engine/
                - title: Add a BeforeTool gate
                  body:
                    - 'A hooks.BeforeTool command in the system settings receives tool_name and tool_input and
                      blocks with {"decision": "deny"} or exit code 2. The hooks page ranks project and user
                      settings above system settings for hooks, so treat the admin policy tier as the enforced
                      layer and the hook as defence in depth.'
                  url: https://geminicli.com/docs/hooks/reference/
              note: >-
                The policy engine TOML is deterministic and admin-tiered; BeforeTool hooks are an integration
                point whose logic the organisation writes. Sub-agents and MCP tools pass through the same
                engine; a remote server's own actions are outside it.
              verified: 2026-09-10
      - mitigation: cap-ai-vendor-assessment
        coverage: external
        mechanism: >-
          The organisation's TPRM platform, consuming Google Cloud's Gemini certifications page and the Code
          Assist security, privacy and compliance page
        evidence:
          - title: >-
              Certifications and security for Gemini products in Google Cloud (SOC 1/2/3, ISO 27001/27017/27018/
              27701, ISO 42001 listed)
            url: https://docs.cloud.google.com/gemini/docs/discover/certifications
          - title: Security, privacy and compliance for Gemini Code Assist Standard and Enterprise
            url: https://docs.cloud.google.com/gemini/docs/codeassist/security-privacy-compliance
          - title: Gemini CLI terms and privacy notices by authentication path
            url: https://geminicli.com/docs/resources/tos-privacy/
        note: >-
          External: the assessment is the organisation's TPRM process; Google publishes the evidence. The
          certifications page lists BSI C5, CSA STAR, HIPAA, HITRUST CSF, ISO 27001/27017/27018/27701, ISO
          42001, PCI-DSS v4.0.1 and SOC 1/2/3 as compliant for Gemini products in Google Cloud (not for Code
          Assist on GitHub). The Code Assist Standard/Enterprise page describes a stateless service, no training
          on customer data without permission and VPC Service Controls, and the Code Assist Gemini CLI page says
          those practices apply to the CLI for Standard and Enterprise users. API-key (Gemini API unpaid or
          paid) and Vertex paths carry different terms, listed on the CLI's Terms and Privacy page, so assess
          the path the organisation enforces.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAiTprm
          reviewRequired: false
          original:
            - capability: capabilityAiTprm
              coverage: external
              mechanism: >-
                Google Cloud terms and the Code Assist security, privacy and compliance page consumed by the
                organisation's TPRM platform
              note: >-
                The CLI is covered by the Gemini Code Assist Standard/Enterprise commitments (stateless
                service, no training without permission, VPC Service Controls) when used with that licence;
                the API-key and Vertex paths carry different terms, listed on the CLI's Terms and Privacy
                page.
              steps:
                - title: Record which terms apply
                  body:
                    - Match the auth path the organisation enforces to its terms row on the Terms and Privacy page
                      and file the Code Assist compliance page as the vendor evidence.
                  url: https://geminicli.com/docs/resources/tos-privacy/
              verified: 2026-09-10
      - mitigation: cap-sensitive-data-redaction
        coverage: partial
        mechanism: >-
          hooks.BeforeModel / AfterModel in the system settings as the attach point for an organisation
          inspector; security.environmentVariableRedaction for secret-named variables in tool environments; no
          vendor DLP
        steps:
          - title: Wire an inspection hook
            body:
              - Configure hooks.BeforeModel in the system settings to pass llm_request to the organisation's DLP
                inspector and return decision "deny" (or exit code 2) to abort the turn, or
                hookSpecificOutput.llm_request to rewrite it; add hooks.AfterModel to replace response chunks
                with hookSpecificOutput.llm_response.
            url: https://geminicli.com/docs/hooks/reference/
          - title: Redact secrets from tool environments
            body:
              - Set security.environmentVariableRedaction.enabled to true in the system settings (off by
                default) so secret-named and secret-valued variables are withheld from shell commands, and add
                names to security.environmentVariableRedaction.blocked.
            url: https://geminicli.com/docs/reference/configuration/
        note: >-
          Partial on the rule applied to every vendor: BeforeModel is an inline hook that can hand prompt
          content to an organisation inspector and block; Gemini CLI itself detects nothing in prompts or tool
          traffic. Boundary: hooks run on the device and are not admin-locked (project and user hooks rank
          above system hooks, /hooks disable-all switches them off, non-JSON output is treated as allow).
          Environment redaction masks secrets in child-process environments (stdio MCP servers get it by
          default unless a variable is declared in the server's env block), not in content sent to the model.
          .geminiignore and context.fileFiltering keep files out of context — data minimisation, not detection.
          The inline alternative is an AI gateway at GOOGLE_GEMINI_BASE_URL / GOOGLE_VERTEX_BASE_URL (API-key
          and Vertex auth only; the Code Assist path has no documented base-URL override) or endpoint DLP.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAiDlp
          reviewRequired: false
          original:
            - capability: capabilityAiDlp
              coverage: partial
              mechanism: BeforeModel / AfterModel hooks for redaction; no vendor DLP
              note: >-
                Hooks can rewrite the outbound request and filter the response, and inherited environment
                variables matching TOKEN / SECRET / PASSWORD / KEY patterns are redacted before MCP servers
                see them; content inspection of prompts and uploads is the organisation's own hook or a proxy
                at GOOGLE_GEMINI_BASE_URL.
              steps:
                - title: Wire a redaction hook
                  body:
                    - Configure hooks.BeforeModel and hooks.AfterModel commands in the system settings file to
                      inspect and redact the request and response payloads.
                  url: https://geminicli.com/docs/hooks/
              verified: 2026-09-10
      - mitigation: cap-input-guardrails
        coverage: partial
        mechanism: >-
          hooks.AfterTool (a deny replaces the tool result the model sees) and hooks.BeforeModel as attach points
          for an organisation classifier; no vendor injection screening
        steps:
          - title: Screen tool results
            body:
              - Register a hooks.AfterTool command in the system settings that sends tool_response to the
                organisation's injection classifier; decision "deny" (or exit code 2) hides the real output and
                the reason text replaces the result sent back to the model.
            url: https://geminicli.com/docs/hooks/reference/
          - title: Screen the assembled request
            body:
              - A hooks.BeforeModel command receives llm_request, including context files, fetched pages and MCP
                results already in the conversation, and can return decision "deny" to abort the turn.
            url: https://geminicli.com/docs/hooks/reference/
        note: >-
          Partial on the rule applied to every vendor: a post-tool hook that can block or replace output before
          the model sees it is an attach point; nothing classifies content until the organisation attaches a
          classifier. No injection or jailbreak classifier is documented. security.enableConseca judges
          proposed tool calls (credited under action policy); web_fetch's block on private and internal
          addresses and the policy engine's redirection check constrain actions; trusted folders and project-hook
          fingerprinting are admission. None of these screens content. Hooks are user-disableable and fail open
          (see the redaction row). GEMINI.md files load from the workspace, its ancestors and any directory a
          tool touches; treat them, MCP responses and fetched pages as untrusted. The external alternative is
          an AI gateway or MCP gateway classifier on the brokered path.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityPromptInjectionDefense
          reviewRequired: false
          original:
            - capability: capabilityPromptInjectionDefense
              coverage: partial
              mechanism: Not offered; structural mitigations only
              steps:
                - title: Attach a detector in hooks
                  body:
                    - Register a BeforeModel hook in the system settings file that sends the assembled prompt
                      (GEMINI.md context, MCP results, fetched pages) to your classifier and rejects on a hit;
                      without it nothing detects an injected instruction.
                  url: https://geminicli.com/docs/hooks/
              note: >-
                Rated like Copilot CLI and the Copilot SDK: no injection or jailbreak classifier is
                documented, but BeforeModel and AfterModel hooks are the attach point for one, and the
                post-2025-07 shell-command validation blocks a class of injected commands. Trusted folders and
                ask_user policies contain; they do not detect. Treat every GEMINI.md, MCP response and fetched
                page as untrusted.
              evidence:
                - title: Vendor docs index, reviewed; no setting for this control (2026-09-10)
                  url: https://geminicli.com/docs/
              verified: 2026-09-10
      - mitigation: AML.M0028
        coverage: native
        mechanism: >-
          Admin-tier policy engine TOML (toolName, mcpName, argsPattern, commandPrefix / commandRegex,
          subagent); tools.core and per-server includeTools / excludeTools with mcp.allowed in the system
          settings; security.disableYoloMode and security.disableAlwaysAllow
        steps:
          - title: Scope tools in the admin tier
            body:
              - In /etc/gemini-cli/policies (or the macOS / Windows equivalent) write deny, ask_user or allow
                rules by toolName with argsPattern on the arguments or commandPrefix for shell commands, and
                mcpName plus toolName for MCP tools; admin rules outrank user, extension and default rules.
            url: https://geminicli.com/docs/reference/policy-engine/
          - title: Narrow the tool surface
            body:
              - In the system settings.json set tools.core to the permitted built-ins (for example ReadFileTool,
                GlobTool, ShellTool(ls)), define approved mcpServers with includeTools and list their names in
                mcp.allowed.
            url: https://geminicli.com/docs/cli/enterprise/
          - title: Remove the bypass modes
            body:
              - Set security.disableYoloMode and security.disableAlwaysAllow to true in the system settings and
                keep security.enablePermanentToolApproval false.
            url: https://geminicli.com/docs/reference/configuration/
        note: >-
          Native: admin-delivered rules over tool, arguments and target, enforced by the CLI outside the model,
          with yolo and "Always allow" removable by the administrator. Boundary: rules bind the machine, not
          the user principal (the subagent field scopes by calling sub-agent). tools.core and mcp.allowed live
          in the system settings file, which environment variables and command-line flags outrank:
          GEMINI_CLI_SYSTEM_SETTINGS_PATH can re-point it unless the enterprise page's wrapper script pins it,
          and --allowed-mcp-server-names and --allowed-tools are session flags whose interaction with
          mcp.allowed and admin rules is not documented. The admin policy directory is checked for root
          ownership and is not affected by that variable. tools.exclude is deprecated in favour of deny rules.
          The enterprise page warns that a user with local administrator rights can circumvent all of it.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityToolPermissionScoping
          reviewRequired: false
          original:
            - capability: capabilityToolPermissionScoping
              coverage: native
              mechanism: >-
                tools.core allowlist, tools.confirmationRequired, per-server includeTools / excludeTools,
                mcp.allowed / mcp.excluded in the system settings file
              steps:
                - title: Allowlist built-in tools
                  body:
                    - Set tools.core in the system settings (for example ReadFileTool, GlobTool,
                      ShellTool(ls)); tools.exclude is deprecated in favour of the allowlist.
