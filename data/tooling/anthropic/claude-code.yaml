# Claude Code — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# Exclusions: Claude Code in Slack (the earlier per-user @Claude routing) is being retired on Team
# and Enterprise in favour of Claude Tag (see claude-tag.yaml); Code Review, Routines and
# Ultrareview are features of the cloud runtime, recorded on toolClaudeCodeWeb, not entities.
# Bedrock / Vertex (Google Cloud's Agent Platform) / Foundry / Claude apps gateway / LLM gateway
# routing are facts on toolClaudeCode, not entities.
# 2026-09-15: toolClaudeCodeWeb gained sandboxing, egress, runtime enforcement, credential isolation and MCP rows after the managed-runtime drawing pinned them; fetched cloud-environments, claude-code-on-the-web, server-managed-settings, managed-mcp (all 200).
# 2026-09-25: re-verified toolClaudeCode, toolClaudeCodeWeb against the MITRE capability rules; every code.claude.com, platform.claude.com and support.claude.com page cited answered 200 with no redirect; code.claude.com/docs/en/claude-tag returned 403 (Cloudflare challenge, not cited); trust.anthropic.com renders client-side and was read in a browser; no iam page exists in the docs map.
vendor: anthropic
family: Claude Code
tools:
  - id: toolClaudeCode
    name: Claude Code
    surfaceClasses:
      - endpointCli
      - ideExtension
      - desktopApp
      - ciIntegration
    variants:
      - name: Claude Code CLI
        class: endpointCli
        url: https://code.claude.com/docs/en/quickstart
      - name: Claude Code for VS Code
        class: ideExtension
        url: https://code.claude.com/docs/en/vs-code
      - name: Claude Code for JetBrains IDEs
        class: ideExtension
        url: https://code.claude.com/docs/en/jetbrains
        note: >-
          The plugin runs a local, unauthenticated-transport (ws://) MCP server bound to loopback; the docs
          warn that acceptEdits mode can write IDE config files the IDE auto-executes.
      - name: Claude Code Desktop (Code tab in Claude Desktop, local / SSH / WSL sessions)
        class: desktopApp
        url: https://code.claude.com/docs/en/desktop
        note: >-
          Local sessions read the device's managed settings; cloud sessions started from the Code tab are
          toolClaudeCodeWeb. Desktop-only keys: disableDesktopLocalSessions, sshHostAllowlist,
          disableBrowserExternalNavigation, disableMobileSimulatorTools.
      - name: Remote Control (claude.ai/code or the mobile app driving a local session)
        class: endpointCli
        url: https://code.claude.com/docs/en/remote-control
        note: >-
          Execution stays on the developer's machine; the transcript is stored on Anthropic servers while
          connected. Off by default on Team/Enterprise until an Owner enables it; managed disableRemoteControl
          turns it off per device; unavailable under ZDR.
      - name: Claude Code GitHub Actions (anthropics/claude-code-action)
        class: ciIntegration
        url: https://code.claude.com/docs/en/github-actions
        note: >-
          Runs the Agent SDK on GitHub-hosted runners. Auth by ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN
          secret, or keyless via workload identity federation (anthropic_federation_rule_id);
          Bedrock/Vertex/Foundry via OIDC. Tools are opt-in with --allowedTools in claude_args; triggering
          actor must have write access and be human.
    architecture: archCodingAgentThirdParty
    status: ga
    asOf: "2026-09"
    summary:
      - >-
        Anthropic's agentic coding tool, run by a present developer as a CLI, an IDE extension (VS Code,
        JetBrains), the Code tab of Claude Desktop, or unattended as a GitHub Action. Inference runs on the
        Anthropic API by default; organisations can route it to Amazon Bedrock, Google Cloud's Agent Platform
        (Vertex), Microsoft Foundry, Claude Platform on AWS, a self-hosted Claude apps gateway, or any LLM
        gateway via ANTHROPIC_BASE_URL. All prompts, tool results and file contents Claude reads leave the
        device to the configured provider over TLS; usage metrics go to Anthropic by default on the Anthropic API
        (error reports only for Pro and Max sign-ins) and are off on cloud providers.
      - >-
        Two admin channels share one top-precedence managed tier: endpoint-managed settings delivered as files
        or OS policies via MDM/GPO (macOS com.anthropic.claudecode plist, HKLM\SOFTWARE\Policies\ClaudeCode,
        managed-settings.json plus managed-settings.d/), and server-managed settings configured by Owners at
        claude.ai Admin Settings > Claude Code > Managed settings (Team/Enterprise) and fetched at startup
        with hourly polling. Managed settings outrank command-line flags and all user and project files. The
        docs state server-managed settings are a client-side control, not a security boundary, and that they
        are skipped when CLAUDE_CODE_USE_BEDROCK/VERTEX/FOUNDRY or a non-default ANTHROPIC_BASE_URL is set;
        endpoint policy or a Claude apps gateway is the enforcement channel there.
      - >-
        The enforcement points that matter are permissions.deny (evaluated before everything, cannot be
        overridden by any mode or the auto-mode classifier), PreToolUse hooks (fire in every permission mode
        including bypassPermissions), the OS-enforced Bash sandbox (Seatbelt / bubblewrap with a
        domain-allowlisting proxy and credential masking), managed MCP allow/deny lists, plugin marketplace
        allowlists, and OpenTelemetry export of every tool decision to the organisation's collector.
    facts:
      - label: Plans
        value: >-
          Pro, Max, Team and Enterprise (claude.ai login), Claude Console API keys or keyless Console sign-in,
          and Bedrock / Vertex / Foundry / Claude Platform on AWS credentials. Server-managed settings,
          analytics dashboard and SSO need Team/Enterprise; SCIM, Compliance API and ZDR need Enterprise.
        url: https://code.claude.com/docs/en/feature-availability
      - label: Inference & routing
        value: >-
          Anthropic API by default. CLAUDE_CODE_USE_BEDROCK / CLAUDE_CODE_USE_VERTEX / CLAUDE_CODE_USE_FOUNDRY
          / CLAUDE_CODE_USE_ANTHROPIC_AWS select a cloud provider; ANTHROPIC_BASE_URL plus
          ANTHROPIC_AUTH_TOKEN route through an LLM gateway; forceLoginMethod "gateway" plus
          forceLoginGatewayUrl pin sessions to a self-hosted Claude apps gateway that holds the upstream
          credential, maps IdP groups to models and managed settings, and relays OTLP telemetry. Third-party
          routing disables server-managed settings, Remote Control, cloud sessions and the Chrome integration.
        url: https://code.claude.com/docs/en/claude-apps-gateway
      - label: Data leaving the device
        value: >-
          Prompts, model outputs and everything a tool returns go to the model provider over TLS 1.2+. Metrics
          (no code, prompts or file paths) go to Anthropic and third-party logging infrastructure by default on
          the Anthropic API; redacted error reports go to a third-party error tracker by default only for Pro and
          Max sign-ins; DISABLE_TELEMETRY, DISABLE_ERROR_REPORTING or
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC turn them off. WebFetch sends each hostname to
          api.anthropic.com for a safety-blocklist check (skipWebFetchPreflight disables). /feedback uploads
          the transcript.
        url: https://code.claude.com/docs/en/data-usage
      - label: Retention & training
        value: >-
          Commercial (Team, Enterprise, API): no training; 30-day retention; ZDR available to qualified
          Enterprise accounts (disables cloud sessions, Remote Control, Claude Tag, artifacts and feedback).
          Consumer plans follow the user's training preference (5-year or 30-day retention). Local transcripts
          sit in plaintext under ~/.claude/projects/ for 30 days by default (cleanupPeriodDays).
        url: https://code.claude.com/docs/en/zero-data-retention
      - label: Network requirements
        value: >-
          api.anthropic.com, claude.ai, claude.com, platform.claude.com, mcp-proxy.anthropic.com (claude.ai
          connectors), downloads.claude.ai, registry.npmjs.org, bridge.claudeusercontent.com (Chrome), plus
          optional Datadog intake hosts for telemetry. HTTPS_PROXY, NODE_EXTRA_CA_CERTS and
          CLAUDE_CODE_CLIENT_CERT/KEY mTLS are supported; SOCKS is not.
        url: https://code.claude.com/docs/en/network-config
      - label: Docs index
        value: code.claude.com/docs (machine-readable map at claude_code_docs_map.md)
        url: https://code.claude.com/docs/en/claude_code_docs_map.md
    items:
      - title: Managed settings via MDM, GPO or the admin console
        body:
          - "Endpoint paths: macOS /Library/Application Support/ClaudeCode/managed-settings.json (plus a
            managed-settings.d/ drop-in directory), Linux and WSL /etc/claude-code/managed-settings.json,
            Windows C:\\Program Files\\ClaudeCode\\managed-settings.json — the legacy ProgramData path is no
            longer read as of v2.1.75 (CVE-2026-35603). OS-policy channels: the macOS managed-preference
            domain com.anthropic.claudecode and the Windows registry key HKLM\\SOFTWARE\\Policies\\ClaudeCode
            (HKCU is a user-writable fallback, not an enforcement channel)."
          - "Server-managed settings cover the same keys from Admin Settings > Claude Code > Managed settings
            (Owner role), with a caveat the docs state plainly: it is a client-side control, not a security
            boundary, and it is skipped when routing through Bedrock, Vertex, Foundry or a custom base URL.
            Endpoint management via MDM is the stronger channel; forceRemoteSettingsRefresh makes the server
            channel fail closed at startup. Cloud sessions read only server-managed settings; Cowork sessions
            never fetch them."
        links:
          - title: Claude Code settings reference (precedence, paths, keys)
            url: https://code.claude.com/docs/en/settings-reference
          - title: Deploy managed settings (delivery mechanisms, precedence within the managed tier)
            url: https://code.claude.com/docs/en/managed-settings
          - title: Server-managed settings
            url: https://code.claude.com/docs/en/server-managed-settings
      - title: Permission, MCP and hook lockdown
        body:
          - Pin permission rules with permissions.allow / deny / ask, and set allowManagedPermissionRulesOnly
            to block user- and project-level rules (and --allowedTools) entirely.
            permissions.disableBypassPermissionsMode and permissions.disableAutoMode remove the bypass and
            auto modes; autoMode.environment / hard_deny / soft_deny tune the auto-mode classifier, which the
            docs describe as a second gate after permissions.deny.
          - "MCP admission: allowedMcpServers is the allowlist — undefined means unrestricted and an empty
            array is a full lockdown — with deniedMcpServers winning on conflict, allowManagedMcpServersOnly,
            managedMcpServers to push remote servers, and a managed-mcp.json file for exclusive control of MCP
            configuration. Hooks and sideloading close the remaining gaps: allowManagedHooksOnly,
            disableAllHooks, allowedHttpHookUrls, strictPluginOnlyCustomization, strictKnownMarketplaces /
            blockedMarketplaces, disableCommandPluginSources, and disableSideloadFlags to reject --plugin-dir,
            --plugin-url, --agents and --mcp-config at the command line."
        links:
          - title: Claude Code settings reference
            url: https://code.claude.com/docs/en/settings-reference
          - title: Control MCP server access for your organization
            url: https://code.claude.com/docs/en/managed-mcp
      - title: Forced login, credentials and audit telemetry
        body:
          - forceLoginMethod and forceLoginOrgUUID pin sessions to the organisation; forceLoginOrgUUID also
            blocks startup on ambient API-key credentials (ANTHROPIC_API_KEY, ANTHROPIC_AUTH_TOKEN,
            apiKeyHelper). apiKeyHelper substitutes a managed credential script for stored keys; credentials
            otherwise live in the macOS Keychain or a 0600 ~/.claude/.credentials.json.
          - "Fleet-wide audit: set CLAUDE_CODE_ENABLE_TELEMETRY=1 and the OTEL_* exporter variables in the
            managed env block; when the exporter endpoint comes from managed settings, conflicting
            developer-set OTel variables are removed at startup. Sessions then emit per-tool decision events,
            prompt and API events (text redacted by default) and usage metrics to the organisation's
            collector. Enterprise organisations can also pull local Claude Code session transcripts through
            the Compliance API."
        links:
          - title: Authentication
            url: https://code.claude.com/docs/en/authentication
          - title: Monitoring and OpenTelemetry
            url: https://code.claude.com/docs/en/monitoring-usage
    riskNotes:
      - risk: riskPromptInjection
        note: >-
          Every file, web page, MCP result and IDE selection Claude reads is untrusted input. Anthropic's own
          mitigations are the permission prompts, an auto-mode classifier, an isolated context window for
          WebFetch and command-injection detection; the docs are explicit that no system is immune and
          recommend VMs for untrusted content. The hard controls are permissions.deny, PreToolUse hooks and
          the sandbox network allowlist.
      - risk: riskToolRegistryTampering
        note: >-
          Project files (.mcp.json, .claude/settings.json hooks, CLAUDE.md) are configuration the repository
          author controls. CVE-2025-59536 and CVE-2026-21852 showed they could execute code or redirect
          ANTHROPIC_BASE_URL before the trust prompt. allowManagedPermissionRulesOnly, allowManagedHooksOnly,
          strictPluginOnlyCustomization and allowManagedMcpServersOnly move those decisions to the managed
          tier.
      - risk: riskSensitiveDataDisclosure
        note: >-
          Read-only Bash commands can read the whole machine by default, including ~/.aws and ~/.ssh;
          sandbox.credentials deny/mask entries, sandbox.filesystem.denyRead and Read() deny rules are how an
          organisation fences secrets. Session transcripts are stored in plaintext locally and, with Remote
          Control, on Anthropic servers.
      - risk: riskRunawayAgentToolLoops
        note: >-
          Auto mode is the built-in starting mode on Pro, Max and Team. There is no managed per-session token
          or turn budget in the CLI; spend is bounded at the organisation level (admin spend limits, Console
          workspace limits, or gateway per-user limits) and per run only through --max-turns and --max-budget-usd
          in print mode and GitHub Actions use.
      - risk: riskShadowAndUnknownAgents
        note: >-
          Background agents (claude agents, --bg), agent teams, cross-session messaging and Remote Control all
          start Claude Code processes outside the developer's terminal; disableAgentView, processWrapper
          (corporate launcher), crossSessionInbound and disableRemoteControl are the switches.
    controls:
      - mitigation: D3-MFA
        coverage: partial
        mechanism: >-
          Require SSO for Claude (claude.ai/admin-settings/organization, Authentication) hands every
          interactive claude.ai login to the IdP's MFA; managed forceLoginMethod "claudeai" and
          forceLoginOrgUUID pin the client to the organisation; forceLoginMethod "gateway" with
          forceLoginGatewayUrl sends cloud-provider deployments through a Claude apps gateway's OIDC sign-in
        steps:
          - title: Require SSO so the IdP's MFA governs every login
            body:
              - >-
                After verifying your domain, turn on Require SSO for Claude (and Require SSO for Console) in
                the Authentication section at claude.ai/admin-settings/organization, and enforce MFA on the
                Claude app in your IdP.
            url: https://support.claude.com/en/articles/13132885-set-up-single-sign-on-sso
          - title: Pin the client to your organisation
            body:
              - >-
                Deploy forceLoginMethod "claudeai" and forceLoginOrgUUID through MDM or managed-settings.json,
                and in server-managed settings too; a managed forceLoginOrgUUID rejects other organisations'
                claude.ai logins and blocks startup on ANTHROPIC_API_KEY, ANTHROPIC_AUTH_TOKEN and
                apiKeyHelper credentials.
            url: https://code.claude.com/docs/en/authentication
          - title: On Bedrock, Vertex or Foundry, sign in through a Claude apps gateway
            body:
              - >-
                Set forceLoginMethod "gateway" and forceLoginGatewayUrl in an on-machine managed source so
                developers sign in with corporate SSO and hold short-lived gateway tokens that lapse within
                the one-hour default session lifetime after IdP deprovisioning.
            url: https://code.claude.com/docs/en/claude-apps-gateway
        note: >-
          Partial on the MFA rule applied to every vendor: Claude has no organisation "require 2FA" switch of
          its own, so the second factor is whatever the IdP enforces behind Require SSO, and the client pin
          makes the organisation's SSO login the only claude.ai login Claude Code accepts. Paths that skip
          that interactive login: Console logins (the terminal login screen pre-selects but doesn't enforce
          forceLoginMethod, and forceLoginOrgUUID doesn't check a Console credential's organisation); the
          one-year CLAUDE_CODE_OAUTH_TOKEN that claude setup-token mints (setup-token and /install-github-app
          honour only forceLoginMethod, so they can mint in another organisation); cloud-provider credentials
          and Anthropic profile or federation credentials, which the keys don't block. Server-managed settings
          can't redirect a first login, so deliver the keys by MDM; the tenant-restriction header at the proxy
          is the network-side backstop. Remote Control alone adds a device-bound step-up: Require trusted
          devices (beta) under Organization settings > Capabilities > Remote sessions.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityIga
          reviewRequired: false
          original:
            - capability: capabilityIga
              coverage: native
              mechanism: >-
                claude.ai login pinned to the organisation (forceLoginMethod, forceLoginOrgUUID) with SSO/SCIM
                at the org level; Claude apps gateway for IdP sign-in on third-party providers
              steps:
                - title: Pin logins to your organisation
                  body:
                    - Deploy forceLoginMethod ("claudeai" or "console") and forceLoginOrgUUID (your org UUID
                      from claude.ai/admin-settings/organization) through MDM or managed-settings.json;
                      sessions on ANTHROPIC_API_KEY, ANTHROPIC_AUTH_TOKEN or apiKeyHelper are then blocked at
                      startup.
                  url: https://code.claude.com/docs/en/authentication
                - title: Enforce SSO and SCIM at the organisation
                  body:
                    - Turn on "Require SSO for Claude" at claude.ai/admin-settings/organization after domain
                      verification; Enterprise adds SCIM group-to-role mapping and automatic deprovisioning.
                  url: https://support.claude.com/en/articles/13132885-set-up-single-sign-on-sso
                - title: On Bedrock, Vertex or Foundry use the Claude apps gateway
                  body:
                    - Run claude gateway with an OIDC IdP; developers sign in with corporate SSO, receive
                      short-lived bearer tokens, and lose access when deprovisioned in the IdP.
                  url: https://code.claude.com/docs/en/claude-apps-gateway
              verified: 2026-09-10
      - mitigation: cap-agent-action-policy-enforcement
        coverage: native
        mechanism: >-
          Managed permissions.deny / ask / allow rules with allowManagedPermissionRulesOnly, and managed
          PreToolUse hooks (command, http, mcp_tool) under allowManagedHooksOnly, evaluated by the harness
          before every tool call in every permission mode; each decision is emitted as a
          claude_code.tool_decision event
        steps:
          - title: Author deny and ask rules no mode can override
            body:
              - >-
                Put permissions.deny and permissions.ask rules such as Bash(curl *), Read(./secrets/**) and
                mcp__server__tool in managed settings and set allowManagedPermissionRulesOnly so user,
                project, local, --settings and --allowedTools rules are ignored.
            url: https://code.claude.com/docs/en/permissions
          - title: Add a managed PreToolUse policy hook
            body:
              - >-
                Deploy a managed hooks.PreToolUse entry whose command or HTTP endpoint returns
                permissionDecision "deny" or "ask"; PreToolUse hooks fire before any permission-mode check,
                and a deny holds even with --dangerously-skip-permissions.
            url: https://code.claude.com/docs/en/hooks-guide
          - title: Run only the organisation's hooks
            body:
              - >-
                Set allowManagedHooksOnly true in managed settings so user, project, local and non-forced
                plugin hooks are blocked and only managed hooks decide.
            url: https://code.claude.com/docs/en/settings-reference
          - title: Log every decision
            body:
              - >-
                Set CLAUDE_CODE_ENABLE_TELEMETRY and OTEL_LOGS_EXPORTER in the managed env block so each
                claude_code.tool_decision event, with its decision and source (config, hook or user), reaches
                your collector.
            url: https://code.claude.com/docs/en/monitoring-usage
        note: >-
          Native: deterministic, admin-locked rules and hooks decide every built-in and MCP tool call outside
          the model, in every mode including bypassPermissions, and the decision is logged. Outside the
          decision point: files pulled in with an @ reference (no tool call; use a Read deny rule),
          EndConversation, what a remote MCP server does after the call, and processes a plugin's hooks or MCP
          servers start on their own. Bash deny patterns match the command as written, so pair them with a
          hook or the sandbox. The auto-mode classifier is a second, non-deterministic gate that deny and ask
          rules precede. Server-managed delivery is a client-side control; MDM delivery is the stronger
          channel.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAgentRuntimeEnforcement
          reviewRequired: false
          original:
            - capability: capabilityAgentRuntimeEnforcement
              coverage: native
              mechanism: >-
                permissions.deny / ask / allow rules in managed settings plus PreToolUse hooks (command, http,
                mcp_tool); deny rules and hooks run before every permission mode, including bypassPermissions
                and the auto-mode classifier
              steps:
                - title: Author deny rules that no mode can override
                  body:
                    - Put permissions.deny entries such as Bash(curl *), Read(./.env), Read(./secrets/**) and mcp__* patterns in
                      managed settings and set allowManagedPermissionRulesOnly so user, project and --allowedTools
                      rules are ignored.
                  url: https://code.claude.com/docs/en/permissions
                - title: Add a PreToolUse policy hook
                  body:
                    - Deploy a managed hooks.PreToolUse entry whose command or HTTP endpoint returns permissionDecision "deny"
                      or "ask"; hooks fire in every permission mode and a hook deny applies even with
                      --dangerously-skip-permissions.
                  url: https://code.claude.com/docs/en/hooks
                - title: Constrain the auto-mode classifier
                  body:
                    - Deliver an autoMode block (environment, hard_deny, soft_deny, allow, classifyAllShell) through managed
                      settings; note the docs call the classifier a second gate that permissions.deny always
                      precedes.
                  url: https://code.claude.com/docs/en/auto-mode-config
              note: >-
                Deny rules and hooks are deterministic and run before every mode, including bypass; the
                auto-mode classifier is not deterministic. Subagents inherit the rules; MCP tools are matched
                by mcp_tool hooks; a remote MCP server's own side effects are outside the hook.
              verified: 2026-09-10
      - mitigation: cap-ai-vendor-assessment
        coverage: external
        mechanism: Anthropic Trust Center artifacts feed the organisation's TPRM platform
        evidence:
          - title: Anthropic Trust Center (compliance table and Request access)
            url: https://trust.anthropic.com/
          - title: Claude Code security page (links the Trust Center)
            url: https://code.claude.com/docs/en/security
        note: >-
          External: the assessment, its evidence expiry and the reassessment trigger live in the
          organisation's TPRM platform, not in Claude Code. The Trust Center lists SOC 2 Type 2, ISO 27001,
          ISO 42001, CSA STAR, HIPAA and NIST 800-171 coverage for Claude Enterprise and the Anthropic API
          (Claude Team: all but HIPAA), with the reports, questionnaires and an infrastructure diagram behind
          Request access.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAiTprm
          reviewRequired: false
          original:
            - capability: capabilityAiTprm
              coverage: external
              mechanism: Anthropic Trust Center (SOC 2 Type 2, ISO 27001 artifacts) feeds the buyer's TPRM platform
              note: >-
                Vendor assurance artifacts are published at trust.anthropic.com and linked from the security
                page; the reassessment cadence and evidence expiry live in the organisation's own TPRM
                tooling, not in Claude Code.
              steps:
                - title: Collect vendor evidence from the Trust Center
                  body:
                    - Download the SOC 2 Type 2 report and ISO 27001 certificate referenced on the Claude Code security page and
                      attach them to the vendor record.
                  url: https://code.claude.com/docs/en/security
              verified: 2026-09-10
      - mitigation: cap-sensitive-data-redaction
        coverage: partial
        mechanism: >-
          Inference hooks (Enterprise, beta) send each governed Claude Code request, with its tool calls and
          results, to the organisation's AI security server for an allow/deny verdict; a managed
          UserPromptSubmit hook can block a typed prompt; sandbox.credentials mask entries give sandboxed
          commands a placeholder; Read deny rules keep named paths out
        steps:
          - title: Inspect governed requests with Inference hooks
            body:
              - >-
                In claude.ai Organization settings > Data and privacy > Inference hooks, turn on Allow for
                your organization, register your AI security server and choose failure handling; Anthropic
                holds each governed request until the server returns allow or deny.
            url: https://platform.claude.com/docs/en/manage-claude/inference-hooks-configuration
          - title: Block prompts on the device
            body:
              - >-
                Deploy a managed UserPromptSubmit hook that passes the prompt to your DLP inspector and
                returns decision "block", which stops the prompt and erases it from context.
            url: https://code.claude.com/docs/en/hooks
          - title: Mask named secrets in the sandbox
            body:
              - >-
                List secrets under sandbox.credentials.envVars and sandbox.credentials.files with mode "mask"
                and set sandbox.network.tlsTerminate, so sandboxed commands see a placeholder and the proxy
                substitutes the value only for allowed hosts.
            url: https://code.claude.com/docs/en/sandboxing
          - title: Keep secret files out of context
            body:
              - >-
                Add managed permissions.deny rules such as Read(./.env) and Read(./secrets/**); matching files
                are excluded from discovery and reads.
            url: https://code.claude.com/docs/en/permissions
        note: >-
          Partial by the rule: detection is the organisation's own inspector at two attach points —
          Anthropic-side Inference hooks (Enterprise claude.ai logins only; not Console API keys, Bedrock or
          Google Cloud) and a device-side hook — plus product masking of the secrets you list, inside the
          sandbox only. Inference hooks allow or deny (no redaction), read extracted attachment text but not
          images, have no response-side event yet, and fail open or closed by your failure-handling setting.
          Read deny rules are data minimisation, not detection.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAiDlp
          reviewRequired: false
          original:
            - capability: capabilityAiDlp
              coverage: partial
              mechanism: >-
                Read() / Edit() deny rules, sandbox.credentials masking and sandbox.filesystem.denyRead keep
                named secrets out of the context; Enterprise Inference hooks send each governed prompt to the
                organisation's AI security server for an allow/deny verdict
              steps:
                - title: Exclude sensitive files from the context
                  body:
                    - Add permissions.deny rules such as Read(./.env), Read(./.env.*) and Read(//**/.pem) in managed settings;
                      the JetBrains and VS Code extensions honour Read deny rules for selection sharing too.
                  url: https://code.claude.com/docs/en/permissions
                - title: Mask credentials inside the sandbox
                  body:
                    - Set sandbox.credentials.files and sandbox.credentials.envVars with mode deny or mask so sandboxed commands
