    summary:
      - >-
        Open-weights models served by vLLM on Amazon EKS GPU node pools, one tainted pool per
        sensitivity tier, reached only through AgentCore Gateway, which authenticates each tenant,
        meters tokens, salts the prefix cache and applies content policy. Weights load from an S3
        bucket only the promotion pipeline writes, and only releases Approved in SageMaker Model
        Registry are deployed. AWS's EKS guidance puts LiteLLM in the gateway's place; SageMaker AI
        endpoints are the managed alternative for the serving tier.
    bindings:
