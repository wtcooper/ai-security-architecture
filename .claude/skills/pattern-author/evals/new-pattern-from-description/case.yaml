schema_version: "1.1"
name: new-pattern-from-description
expected_outcome: |
  A new pattern exists: an architecture file, a finder entry and a guidance file. The build
  passes, the drawing audit reports 0 findings for the new pattern, and the tests pass. The
  pattern reuses the cloud agent family's shared structure and registered names, pins controls
  and risks, authors a crossing for every flow that crosses a boundary, and has a walkthrough
  and at least two scenarios. The report to the user states what it shares with its sibling,
  where it differs, and any open question or deviation.
