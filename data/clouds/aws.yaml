settings:
  # --- Identity & access ---------------------------------------------------------------
  - id: idcAppAssignment
    name: Assigned users
    where: IAM Identity Center › Applications › (the application your Cognito user pool federates to) › Assigned users
    setVia: [identityProvider]
    area: identity
    recommended: Assigned to the groups that use the app, never to individual users
    why: Only assigned groups can sign in to the application at all, so access is a group decision and leavers lose it with their group.
    mitigations: [D3-APA]
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/assignuserstoapp.html
    verified: "2026-10-30"
  - id: cognitoResourceBinding
    name: Resource binding
    product: "Amazon Cognito"
    where: Amazon Cognito › User pool › Resource servers; clients send resource= on the /oauth2/authorize request (managed login only)
    setVia: [identityProvider, apiCli]
    area: identity
    default: Not requested
    recommended: "A resource server per published service, named by its canonical URI, and every user grant bound to it. Machine-to-machine clients such as peer agents cannot be bound, so limit those by app client and custom scopes"
    value: "A resource server per service, user grants bound"
    why: "An access token names the one server it is for in its aud claim, so a user token minted for another service is refused here. Binding works only for user grants through managed login, never for client-credentials tokens."
    mitigations: [D3-CTS]
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pools-define-resource-servers.html
    verified: "2026-11-18"
  - id: cognitoM2mClients
    name: Machine-to-machine application (client credentials grant)
    product: "Amazon Cognito"
    where: Amazon Cognito › User pool › App clients; custom scopes on the resource server
    setVia: [identityProvider, apiCli]
    area: identity
    default: No machine-to-machine clients
    recommended: One app client per autonomous workload, custom scopes narrower than a delegated user's, client secret held in Secrets Manager and rotated
    value: "One app client per workload, narrow scopes"
    why: A workload with no user behind it gets its own identity and a narrow grant, never a borrowed human session. Cognito authenticates these clients with a secret, not private_key_jwt.
    mitigations: [D3-AA]
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/user-pool-settings-client-apps.html
    verified: "2026-10-30"
  - id: cognitoTokenLifetime
    name: Access token expiration
    product: "Amazon Cognito"
    where: Amazon Cognito › User pool › App clients › (app client) › Token expiration; token revocation and refresh token rotation on
    setVia: [identityProvider, apiCli]
    area: identity
    default: One hour; token revocation on for new app clients
    recommended: "One hour for user clients that sign in through managed login, which resource binding requires: a shorter value does not shorten the one-hour managed login cookie that re-issues tokens. 15 minutes for machine-to-machine clients. Token revocation and refresh token rotation on"
    value: "One hour for users, 15 minutes for machine clients"
    why: "A revoked token stays valid wherever a JWT is verified locally, so a short lifetime is what makes revocation reach tokens already issued. With managed login the floor is its one-hour sign-in cookie, so also send signed-out users to the logout endpoint, which clears it."
    mitigations: [D3-CR]
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/amazon-cognito-user-pools-using-the-access-token.html
    verified: "2026-11-18"
  - id: albAuthenticate
    name: authenticate-cognito action (OnUnauthenticatedRequest)
    where: Application Load Balancer › HTTPS listener › rule actions
    setVia: [cloudPolicy, apiCli]
    area: identity
    default: OnUnauthenticatedRequest = authenticate (once an authenticate action exists)
    recommended: authenticate-cognito on every rule, OnUnauthenticatedRequest = deny for the API paths
    value: "authenticate-cognito on every rule; deny on API paths"
    why: The load balancer rejects every unauthenticated request before your code runs and hands the app the signed-in user's claims.
    mitigations: [D3-APA]
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/listener-authenticate-users.html
    verified: "2026-10-30"
  - id: runtimeInboundJwt
    name: customJWTAuthorizer (Inbound JWT authorization)
    where: AgentCore Runtime › (agent runtime) › Inbound Auth
    setVia: [cloudPolicy, apiCli]
    area: identity
    default: IAM (SigV4) inbound authorization
    recommended: "JWT from your Cognito user pool, with allowedClients set to the clients admitted to it and, where callers are users, allowedAudience set to this runtime's own resource. Cognito puts an aud claim only in user tokens that asked for resource binding, so a runtime that machine-to-machine clients call is limited by allowedClients and allowedScopes instead. Where a gateway fronts the runtime, set allowedWorkloadConfiguration so the authorizer accepts calls only from that gateway"
    value: "Cognito JWT, limited to admitted clients"
    why: "Each session runs as the caller whose token opened it, and a token from a client or audience that is not admitted is refused before the code runs. The authorizer checks every field you set, so an allowedAudience turns away machine tokens, which carry no aud claim. A runtime keeps its own address, so without allowedWorkloadConfiguration a caller holding a valid token skips the gateway's policy, WAF and interceptors."
    mitigations: [D3-APA, D3-CTS]
    requires: "One inbound type per runtime: with JWT, AWS-signed callers such as a scheduled Lambda function need a Cognito machine-to-machine token, or a separate IAM-authorised runtime"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-oauth.html
    verified: "2026-11-24"
  - id: runtimeRequestHeaderAllowlist
    name: Request header allowlist (requestHeaderConfiguration)
    where: AgentCore Runtime › (agent runtime) › requestHeaderConfiguration on CreateAgentRuntime or UpdateAgentRuntime (requestHeaderAllowlist in the AgentCore CLI's agentcore.json)
    setVia: [apiCli, configFile]
    area: identity
    default: Only allowlisted headers reach your code, so handlers do not see the caller's token
    recommended: Allowlist Authorization on a runtime with a customJWTAuthorizer wherever handlers read the tenant from the token or check it for revocation; allowlist no other header that carries a credential
    value: Authorization allowlisted where handlers read the token
    why: The inbound authorizer checks the token before your code runs, but a handler sees it only if Authorization is allowlisted, so the tenant is taken from the validated token, not from the request body.
    mitigations: [D3-CTS]
    requires: A customJWTAuthorizer on the runtime; up to 20 headers per runtime
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-header-allowlist.html
    verified: "2026-11-24"
  - id: runtimeResourcePolicy
    name: Resource-based policy on the agent runtime
    where: AgentCore Runtime › (agent runtime and its endpoint) › Resource-based policy
    setVia: [cloudPolicy, apiCli]
    area: identity
    default: No resource-based policy (any principal with InvokeAgentRuntime in the account)
    recommended: InvokeAgentRuntime allowed only for the ingress function's role, everything else denied
    value: "Ingress function's role only; all else denied"
    why: A run starts only from the trigger that binds its authority (a queue message or schedule), and nobody can start the agent sideways with their own credentials.
    mitigations: [D3-APA]
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/resource-based-policies.html
    verified: "2026-10-30"
    check:
      command: "aws bedrock-agentcore-control get-resource-policy --resource-arn <agent-runtime-arn> --region <region> --query policy --output text"
      expect: "The policy document allows bedrock-agentcore:InvokeAgentRuntime only for the ingress function's role and denies every other principal; an empty or missing policy is a fail."
      url: https://docs.aws.amazon.com/cli/latest/reference/bedrock-agentcore-control/get-resource-policy.html
  - id: lambdaInvokePolicy
    name: Resource-based policy (aws:SourceArn)
    where: Lambda › (workflow function alias) › Configuration › Permissions › Resource-based policy statements
    setVia: [cloudPolicy, apiCli]
    area: identity
    default: No statements (only identities in the account with lambda:InvokeFunction)
    recommended: "One statement for the EventBridge rule, limited by aws:SourceArn, and no others. The SQS mapping needs no statement: Lambda polls the queue with the function's execution role (AWSLambdaSQSQueueExecutionRole), so limit who may send to the queue and who may create event source mappings"
    value: "One statement for the EventBridge rule, by aws:SourceArn"
    why: A workflow starts only from the trigger that binds its grant, so nobody starts a days-long run sideways on their own authority.
    mitigations: [D3-APA]
    url: https://docs.aws.amazon.com/lambda/latest/dg/access-control-resource-based.html
    verified: "2026-11-18"
  - id: runtimeExecutionRole
    name: Execution role and workload identity
    where: AgentCore Runtime › (agent runtime) › Permissions; AgentCore Identity › Agent identity directory
    setVia: [cloudPolicy]
    area: identity
    default: Workload identity created automatically; execution role as you scope it
    recommended: "One runtime per agent. Start from the documented role (ECR pull, CloudWatch Logs, X-Ray, metrics) and add only the gateway, memory or other actions this workload calls. Remove the sample's bedrock:InvokeModel on all foundation models unless the agent calls Bedrock directly"
    value: "One runtime per agent, only the actions it calls"
    why: "The agent authenticates with platform-issued, expiring credentials under its own identity: no key in its configuration to steal or share. Any code in the session, the model's included, can read these credentials from the microVM metadata service, so the role holds only what that code may do."
    mitigations: [D3-AA, D3-CH]
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-permissions.html
    verified: "2026-11-24"
    check:
      command: "aws iam get-account-authorization-details --filter Role --query \"RoleDetailList[?RoleName=='<execution-role-name>'].{inline:RolePolicyList,attached:AttachedManagedPolicies}\""
      expect: "For the role named in the runtime's roleArn, the inline and attached policies allow only the gateway, memory and model actions this one agent calls, with no wildcard actions or resources."
      url: https://docs.aws.amazon.com/cli/latest/reference/iam/get-account-authorization-details.html
  - id: agentWorkloadIdentity
    name: Workload identity per agent
    where: AgentCore Identity › Agent identity directory (CreateWorkloadIdentity); one OAuth client per agent in your user pool; the token calls in your step code
    setVia: [apiCli, cloudPolicy, code]
    area: identity
    default: "None. Only AgentCore Runtime and Gateway obtain workload access tokens for an agent automatically, one identity per runtime, and a Runtime-managed identity cannot fetch a token itself"
    recommended: "One workload identity and client per agent (supervisor and each specialist). On Lambda nothing delivers the workload access token, so each step calls GetWorkloadAccessTokenForJWT itself (ForUserId only where no user JWT exists), then fetches the outbound token from the token vault"
    value: "One workload identity and client per agent"
    why: "Each agent in the graph is attributable and revocable on its own, and holds a short-lived token for its step rather than a credential for the process's life. In one process nothing on AWS stops one agent's code using another's token, so the code that attaches them is what keeps them apart."
    mitigations: [D3-AA, D3-CH]
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/get-workload-access-token.html
    verified: "2026-11-24"
  - id: secretsRotation
    name: Automatic rotation
    where: AWS Secrets Manager › (secret) › Rotation configuration
    setVia: [cloudPolicy, apiCli]
    area: identity
    default: "Off"
    recommended: On for every upstream credential the service holds, one secret per upstream, read only by that service's role
    value: "On for every upstream credential"
    why: A credential stolen from the service is scoped to one upstream and stops working at the next rotation.
    mitigations: [D3-CH]
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotate-secrets_turn-on-for-other.html
    verified: "2026-10-30"
  - id: eksPodIdentity
    name: EKS Pod Identity association
    where: Amazon EKS › (cluster) › Access › Pod Identity associations (namespace and service account to IAM role)
    setVia: [cloudPolicy, apiCli]
    area: identity
    default: No association
    recommended: One association per workload, its role granted only the bucket prefixes and APIs that workload needs
    value: "One per workload, only the access it needs"
    why: "Each workload reads with its own short-lived credentials scoped to its prefixes: the serving tier reads weights and nothing else can, and a training job reads its corpus and writes only its candidate."
    mitigations: [AML.M0005, D3-AA]
    requires: "On SageMaker HyperPod, eks-auth:AssumeRoleForPodIdentity on the instance group's role, which every job on the group shares, so that role stays minimal"
    url: https://docs.aws.amazon.com/eks/latest/userguide/pod-identities.html
    verified: "2026-11-24"
  - id: smTrainingRole
    name: Execution role (RoleArn) per training job
    product: "SageMaker AI training jobs"
    where: SageMaker AI › CreateTrainingJob RoleArn; IAM role per pipeline stage
    setVia: [cloudPolicy, apiCli]
    area: identity
    default: Whatever role the job is given
    recommended: A role per run, reading only the dataset version its approved spec names and writing only its own candidate prefix; no kms:Sign, no registry write
    value: "A role per run, scoped to its own data and prefix"
    why: "The job that produced a candidate cannot also approve or sign it, which is the separation the promotion gate rests on. With network isolation the training code gets no AWS credentials: SageMaker downloads the data and uploads the result with this role, so its S3 permissions are the control."
    mitigations: [D3-AA]
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-roles.html
    verified: "2026-11-24"
  - id: kmsReleaseSigning
    name: Sign (asymmetric SIGN_VERIFY KMS key)
    where: AWS KMS › asymmetric key with KeyUsage SIGN_VERIFY; key policy granting kms:Sign to the promotion role only
    setVia: [cloudPolicy, apiCli]
    area: identity
    default: No signing key
    recommended: Each promoted release's digest manifest signed at promotion, after the human approval, by an identity the training job never holds
    value: "Every promoted release signed after human approval"
    why: A signature proves the release passed the gate, and the serving tier verifies it with the public key alone.
    mitigations: [AML.M0013]
    url: https://docs.aws.amazon.com/kms/latest/APIReference/API_Sign.html
    verified: "2026-10-30"
  - id: identityClientCredentials
    name: OAuth2 credential provider (client credentials grant)
    where: AgentCore Identity › Outbound Auth › one credential provider per peer platform, its secret in the token vault
    setVia: [cloudPolicy, apiCli]
    area: identity
    default: None
    recommended: One provider per peer registration, our agent's own client and key at each peer, rotated by its owner
    value: "One provider per peer registration"
    why: Our agent presents a distinct, revocable identity to each peer, and the harness never sees the secret behind it.
    mitigations: [D3-AA, D3-CH]
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/common-use-cases.html
    verified: "2026-10-30"
  - id: bedrockDenyApiKeys
    name: Deny bedrock:CallWithBearerToken
    where: AWS Organizations › Service control policies (or the IAM identities that call Bedrock)
    setVia: [cloudPolicy]
    area: identity
    default: Amazon Bedrock API keys usable by any identity allowed to create them
    recommended: Denied organisation-wide, with bedrock-mantle:CallWithBearerToken
    why: Model calls need SigV4 credentials from a role; a Bedrock API key copied from a config file opens nothing.
    mitigations: [D3-CH]
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/api-keys-permissions.html
    verified: "2026-10-30"
    check:
      command: "aws organizations describe-policy --policy-id <scp-id> --query Policy.Content --output text"
      expect: "The policy content has a Deny statement whose Action lists both bedrock:CallWithBearerToken and bedrock-mantle:CallWithBearerToken."
      url: https://docs.aws.amazon.com/cli/latest/reference/organizations/describe-policy.html
  - id: bedrockDenySystemTools
    name: "bedrock:InvokeTool on system-tool/amazon.nova_grounding (Web Grounding)"
    where: IAM › agent execution roles, and service control policies on accounts that run agents › bedrock:InvokeTool on arn:aws:bedrock::<account>:system-tool/amazon.nova_grounding
    setVia: [cloudPolicy]
    area: tools
    default: Allowed to any role with BedrockFullAccess or an InvokeTool grant on the system tool
    recommended: Leave bedrock:InvokeTool on Bedrock system tools out of agent roles and deny it by SCP in accounts that run agents, so a Nova model cannot search the web inside the model call
    value: Denied to agent roles
    why: Web Grounding searches the web inside the Bedrock call, where the gateway's policy and record never see it, so the gateway is the agent's only way to the web only while agent roles cannot invoke the tool.
    mitigations: [cap-agent-egress-control]
    url: https://docs.aws.amazon.com/nova/latest/nova2-userguide/web-grounding.html
    verified: "2026-11-24"
  - id: gatewayInboundJwt
    name: CUSTOM_JWT inbound authorizer
    product: "AgentCore Gateway"
    where: AgentCore Gateway › (gateway) › Inbound Auth; SCP on bedrock-agentcore:GatewayAuthorizerType
    setVia: [cloudPolicy, apiCli]
    area: identity
    default: Chosen at creation; NONE and AUTHENTICATE_ONLY, where the gateway makes no authorization decision, are allowed
    recommended: "CUSTOM_JWT with allowedClients = the agents and clients admitted to it, allowedAudience = this gateway where tokens carry an aud claim, and allowedScopes, which is one list for the whole gateway. Per-tool checks go in the policy engine or an interceptor. NONE and AUTHENTICATE_ONLY denied by SCP"
    value: "CUSTOM_JWT; NONE and AUTHENTICATE_ONLY denied"
    why: "The gateway verifies who is calling and for which audience before any model or tool call goes through, and no gateway can be created without authorization. Scopes are not per tool, so which tool a caller may use is decided by the policy engine or an interceptor."
    mitigations: [D3-AA, AML.M0028, D3-CTS]
    requires: "One inbound authorizer and one token issuer (a single discovery URL) per gateway, as on a runtime: users' and peer agents' tokens come from the same issuer, told apart by client ID and scopes, or peers get a separate gateway"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-inbound-auth.html
    verified: "2026-11-24"
    check:
      command: "aws bedrock-agentcore-control get-gateway --gateway-identifier <gateway-id> --region <region> --query '{authorizerType:authorizerType,jwt:authorizerConfiguration.customJWTAuthorizer.{discoveryUrl:discoveryUrl,allowedAudience:allowedAudience,allowedClients:allowedClients,allowedScopes:allowedScopes}}'"
      expect: "authorizerType is CUSTOM_JWT, allowedAudience lists this gateway's address, allowedClients lists only the agents and clients admitted to it, and allowedScopes is not empty."
      url: https://docs.aws.amazon.com/cli/latest/reference/bedrock-agentcore-control/get-gateway.html
  - id: gatewayOboExchange
    name: "OAuth (token exchange): on-behalf-of"
    product: "AgentCore Gateway"
    where: AgentCore Identity › OAuth credential provider (onBehalfOfTokenExchangeConfig, TOKEN_EXCHANGE or JWT_AUTHORIZATION_GRANT); AgentCore Gateway › target › Outbound Auth
    setVia: [cloudPolicy, apiCli]
    area: identity
    default: Chosen per target; token passthrough and no authorization are available
    recommended: "On-behalf-of exchange on every target that acts as the user, against an authorization server that supports the token-exchange (RFC 8693) or JWT-bearer (RFC 7523) grant; Microsoft is the one preconfigured provider. Cognito's token endpoint takes neither grant, so run the exchange against your corporate IdP. Token passthrough not used"
    value: "On-behalf-of exchange; no token passthrough"
    why: "The user's token is swapped for one scoped to that tool, carrying user and agent both, so the inbound token is never forwarded or reused. AgentCore Identity only brokers the request, and your authorization server decides whether to grant it."
    mitigations: [D3-CTS]
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/on-behalf-of-token-exchange.html
    verified: "2026-11-18"

  # --- Data & retention ----------------------------------------------------------------
  - id: memoryEventExpiry
    name: Short-term memory (raw event) expiration (eventExpiryDuration)
    product: "AgentCore Memory"
    where: AgentCore Memory › (memory) › Short-term memory (raw event) expiration
    setVia: [cloudPolicy, apiCli]
    area: data
    recommended: 30 days for raw events, keyed by actorId and sessionId; and recordExpiryDurationDays on every long-term strategy (minimum 31), because extracted records otherwise never expire
    why: Conversation state ages out instead of accumulating client material, and each read is scoped to one user's session.
    mitigations: [AML.M0031]
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/memory-create-a-memory-store.html
    verified: "2026-10-30"
    check:
      command: "aws bedrock-agentcore-control get-memory --memory-id <memory-id> --region <region> --query memory.eventExpiryDuration"
      expect: "The output is 30, the number of days after which raw memory events expire."
      url: https://docs.aws.amazon.com/cli/latest/reference/bedrock-agentcore-control/get-memory.html
  - id: tenantIsolation
    name: Tenant-scoped data access
    where: "Your service code: tenant taken from the validated token, applied to every query and every upstream call"
    setVia: [code]
    area: data
    default: The protocol has no tenant; nothing is isolated
    recommended: Every handler resolves the tenant from the token and scopes reads and writes to it, with per-tenant credentials or row filters
    value: "Every read and write scoped to the token's tenant"
    why: One tenant's call cannot read or change another's records, whatever the arguments say.
    mitigations: [cap-data-access-governance]
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-multitenant/enforcing-tenant-isolation.html
    verified: "2026-10-30"
  - id: kbMetadataFilter
    name: Manual metadata filtering
    where: Bedrock Knowledge Bases › Retrieve / RetrieveAndGenerate › retrievalConfiguration filter, set by your tool code
    setVia: [apiCli, code]
    area: data
    default: No filter (every chunk the knowledge base holds is retrievable)
    recommended: Every query filtered on the asking user's tenant and access-group metadata
    value: "Filtered on the user's tenant and access groups"
    why: Retrieval returns only chunks tagged for the asking user, so the index cannot become a way round the source system's permissions.
    mitigations: [cap-data-access-governance, cap-retrieval-grounding-checks]
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-config.html
    verified: "2026-10-30"
  - id: guardrailGrounding
    name: Contextual grounding check
    where: Amazon Bedrock Guardrails › (guardrail) › Contextual grounding check
    setVia: [cloudPolicy, apiCli]
    area: data
    default: "Off"
    recommended: Grounding and relevance on for answers built from retrieval
    why: An answer that strays from, or was steered away from, its sources is flagged before the user acts on it.
    mitigations: [cap-retrieval-grounding-checks]
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-contextual-grounding-check.html
    verified: "2026-10-30"
    check:
      command: "aws bedrock get-guardrail --guardrail-identifier <guardrail-id> --guardrail-version <guardrail-version> --region <region> --query contextualGroundingPolicy.filters"
      expect: "The list has one filter of type GROUNDING and one of type RELEVANCE, each with a threshold, action BLOCK and enabled not set to false."
      url: https://docs.aws.amazon.com/cli/latest/reference/bedrock/get-guardrail.html
  - id: guardrailPiiMask
    name: Sensitive information filters (Mask)
    where: Amazon Bedrock Guardrails › (guardrail) › Sensitive information filters, called with ApplyGuardrail before a turn or step result is stored
    setVia: [cloudPolicy, code]
    area: data
    default: Not configured
    recommended: Mask the PII types your firm handles before anything is written to memory or a journal
    value: "Mask the PII types your firm handles"
    why: Personal data a user pasted is not kept in the thread for every later turn, and every later reader, to see. It checks text only, not tool-call arguments.
    mitigations: [cap-sensitive-data-redaction]
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-sensitive-filters.html
    verified: "2026-10-30"

  - id: durableConfig
    name: DurableConfig (ExecutionTimeout, RetentionPeriodInDays, KMSKeyArn)
    where: Lambda › (workflow function) › durable configuration, set at creation
    setVia: [cloudPolicy, apiCli]
    area: data
    default: 14 days' history; Lambda's default encryption
    recommended: ExecutionTimeout set to the longest legitimate run; history retained 14 days, encrypted under your customer managed KMS key
    value: "Bounded run; 14 days, under your KMS key"
    why: A run cannot go on past its longest legitimate length; checkpoints hold every step's payload, so your key decides who can read the journal, and it does not outlive the debugging window.
    mitigations: [AML.M0036, AML.M0012]
    url: https://docs.aws.amazon.com/lambda/latest/dg/durable-configuration.html
    verified: "2026-10-30"

  - id: s3ModelBucketPolicy
    name: Bucket policy
    where: Amazon S3 › (dataset, candidate and model artifact buckets) › Permissions › Bucket policy; S3 Block Public Access on
    setVia: [cloudPolicy]
    area: data
    default: Access as the account's IAM policies allow
    recommended: Each bucket written by the one pipeline role that owns it and read only by the roles that need it, everything else denied
    value: "Owning pipeline writes, named roles read, rest denied"
    why: Datasets and weights are written by one identity and read by the few that need them, so copying or replacing them takes a role nobody else holds.
    mitigations: [AML.M0005]
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/bucket-policies.html
    verified: "2026-10-30"
  - id: guardDutyS3Malware
    name: GuardDuty Malware Protection for S3
    where: Amazon GuardDuty › Malware Protection for S3 › protected bucket (the ingest prefix)
    setVia: [cloudPolicy, adminConsole]
    area: data
    default: Not enabled
    recommended: On for every bucket where external artifacts land, with untagged or infected objects blocked from promotion
    value: "On for every bucket where external artifacts land"
    why: A file carrying known malware is flagged before anything can promote or load it. Pickle and format inspection is a step you add in the same promotion pipeline.
    mitigations: [D3-FA]
    url: https://docs.aws.amazon.com/guardduty/latest/ug/gdu-malware-protection-s3.html
    verified: "2026-10-30"
  - id: releaseDigestCheck
    name: Verify the release digest at load
    where: "Your loader: an init container that computes the artifact's SHA-256 and checks it, and the release signature, against the registry record before the server starts"
    setVia: [code]
    area: data
    default: The server loads whatever files are at the path. S3's default checksum is CRC64NVME, not SHA-256
    recommended: "Load refused unless the digest matches the approved release and its signature verifies. Request the SHA256 checksum algorithm at upload if S3 is to hold the digest; S3 has no part in model signatures, so verifying them is entirely your loader's code. Where weights stream from S3 straight into GPU memory, no loader sees the bytes on disk: compare S3's stored SHA-256 checksum and version ID with the release record, or load from disk and hash there"
    value: "Refuse load unless digest and signature verify"
    why: A file swapped in storage, digest and all, does not load, because the approved digest lives in the registry outside the bucket's write path.
    mitigations: [AML.M0014]
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/checking-object-integrity.html
    verified: "2026-11-24"
  - id: eksGpuTaints
    name: Taint accelerated nodes
    where: Amazon EKS › GPU node groups or Karpenter NodePools › taints, with tolerations only on that tier's serving pods
    setVia: [cloudPolicy, configFile]
    area: data
    default: Any pod can schedule on any node
    recommended: A tainted GPU node pool per sensitivity tier; no GPU sharing across tiers
    value: "Tainted GPU pool per sensitivity tier, no sharing"
    why: "One tier's model and cache never share an accelerator or host with another tier's, so a process escape does not reach their memory. Isolated pods cannot use GPUs, so for GPU work a dedicated, tainted pool is the separation."
    mitigations: [D3-HBPI]
    url: https://docs.aws.amazon.com/eks/latest/userguide/ml-workload-taints.html
    verified: "2026-11-24"

  - id: comprehendPii
    name: Detecting PII entities
    where: Amazon Comprehend PII detection (English and Spanish text), called from the curation processing job beside your quality and safety filters
    setVia: [apiCli, code]
    area: data
    default: Not called
    recommended: "Every internal record scanned and its PII removed before it is written to a dataset version. The real-time call only locates entities, in documents up to 100 KB, so the curation job redacts the spans itself; Comprehend's own redaction is an asynchronous batch job"
    value: "Every internal record scanned, PII removed"
    why: "Restricted personal data is removed while it is still a deletion, not something the model has already memorised. Detection covers English and Spanish only, so text in other languages needs another detector."
    mitigations: [AML.M0007]
    url: https://docs.aws.amazon.com/comprehend/latest/dg/how-pii.html
    verified: "2026-11-18"
  - id: smLineage
    name: Amazon SageMaker ML Lineage Tracking
    product: "SageMaker"
    where: SageMaker AI › lineage entities for datasets, processing jobs, training jobs and model packages
    setVia: [apiCli, code]
    area: data
    default: Created automatically for SageMaker jobs and pipelines; external sources as you record them
    recommended: Every dataset version, its sources and licences, and every run recorded as lineage, external sources included
    value: "Every dataset and run recorded, external sources too"
    why: A poisoning or licence problem found later can be traced to the runs and releases it touched.
    mitigations: [AML.M0025, AML.M0023]
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/lineage-tracking.html
    verified: "2026-10-30"
  - id: smTrainingKms
    name: ML storage volume and output encryption (KMS key)
    product: "SageMaker AI training jobs"
    where: SageMaker AI › CreateTrainingJob ResourceConfig VolumeKmsKeyId and OutputDataConfig KmsKeyId
    setVia: [cloudPolicy, apiCli]
    area: data
    default: AWS managed keys
    recommended: "Your customer managed key on every training volume, checkpoint and output. Traffic between the nodes of a multi-node run is not covered by these keys: also set EnableInterContainerTrafficEncryption to True on the job, which can lengthen training"
    value: "Your customer managed key; inter-container encryption on"
    why: The checkpoints and candidates a run writes are readable only by principals your key policy names.
    mitigations: [AML.M0012]
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/encryption-at-rest-nbi.html
    verified: "2026-11-18"

  # --- Tools & extensions --------------------------------------------------------------
  - id: policyGuardrailPromptAttack
    name: "Guardrails in policies: PromptAttack"
    product: "AgentCore Gateway"
    where: Policy in AgentCore › policy engine on the gateway › forbid (context.input) and suppressOutput (context.output) policies
    setVia: [cloudPolicy]
    area: tools
    default: No guardrail condition
    recommended: "JAILBREAK and PROMPT_INJECTION checked on every request and on every tool and model response. Guardrails in policies run in seven Regions only (N. Virginia, Ohio, Oregon, Sydney, Tokyo, London, Stockholm); in any other Region call Amazon Bedrock Guardrails from a gateway interceptor or your agent code"
    value: "JAILBREAK and PROMPT_INJECTION, requests and responses"
    why: Injected instructions in the user's turn, a tool result or a fetched page are refused or withheld at the gateway before the model reads them.
    mitigations: [cap-input-guardrails]
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/policy-guardrails-in-policies.html
    verified: "2026-11-18"
    check:
      command: "aws bedrock-agentcore-control list-policies --policy-engine-id <policy-engine-id> --region <region> --query 'policies[].{name:name,status:status,enforcementMode:enforcementMode,definition:definition}'"
      expect: "ACTIVE policies include a forbid statement and a suppressOutput statement whose guardrails condition calls BedrockGuardrails::PromptAttack with JAILBREAK and PROMPT_INJECTION, on context.input and context.output respectively."
      url: https://docs.aws.amazon.com/cli/latest/reference/bedrock-agentcore-control/list-policies.html
  - id: policyGuardrailOutput
    name: "Guardrails in policies: ContentFilter and SensitiveInformation"
    product: "AgentCore Gateway"
    where: Policy in AgentCore › policy engine on the gateway › forbid on context.input and suppressOutput on context.output
    setVia: [cloudPolicy]
    area: tools
    default: No guardrail condition
    recommended: "Harmful-content and sensitive-information checks on every request and response that crosses the gateway. Guardrails in policies run in seven Regions only (N. Virginia, Ohio, Oregon, Sydney, Tokyo, London, Stockholm), not in Frankfurt, Ireland or Paris; in any other Region call Amazon Bedrock Guardrails from a gateway interceptor or the calling service"
    value: "Content and sensitive-information checks on all traffic"
    why: "A completion, task payload or artifact that breaks content policy or carries personal data is refused or withheld at the crossing: the policy no provider applies for you."
    mitigations: [cap-output-guardrails, cap-sensitive-data-redaction]
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/policy-guardrails-in-policies.html
    verified: "2026-11-18"
  - id: policyEngineEnforce
    name: Policy engine enforcement mode
    product: "AgentCore Gateway"
    where: AgentCore Gateway › policyEngineConfiguration.mode; bedrock-agentcore:UpdateGateway held by the platform team only
    setVia: [cloudPolicy, apiCli]
    area: tools
    default: No policy engine
    recommended: ENFORCE, with policies per agent, tool and argument written in Cedar or in Dogwood, the open-source language AgentCore also accepts for session-aware and guardrail conditions; new policies proved in LOG_ONLY first
    value: "ENFORCE, after proving new policies in LOG_ONLY"
    why: Every tool call is decided outside the loop on who is calling, which tool and with what, and whoever can flip the gateway to LOG_ONLY is a short list.
    mitigations: [cap-agent-action-policy-enforcement, AML.M0028, AML.M0037]
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/policy-enforcement-modes.html
    verified: "2026-11-18"
    check:
      command: "aws bedrock-agentcore-control get-gateway --gateway-identifier <gateway-id> --region <region> --query policyEngineConfiguration"
      expect: "The output shows the arn of your policy engine and mode ENFORCE; null or mode LOG_ONLY is a fail."
      url: https://docs.aws.amazon.com/cli/latest/reference/bedrock-agentcore-control/get-gateway.html
  - id: gatewayRateLimits
    name: Gateway rate limits
    product: "AgentCore Gateway"
    where: AgentCore Gateway › Rate limits (dimension keys for target, tool, model, JWT claims or IAM identity)
    setVia: [cloudPolicy, apiCli]
    area: tools
    default: Service-managed limits only
    recommended: "Tokens per minute on inference targets and requests per minute on each target and tool, bucketed per agent and per user by a JWT claim. Keep a concurrency cap at the serving tier too, since AWS advises against relying on rate limits alone"
    value: "Per-agent and per-user limits on every target and tool"
    why: A looping turn or a retrying client hits a ceiling at the gateway before it runs up cost or action volume. Rate limits fail open, are skipped when a dimension cannot be resolved and are approximate at low per-minute rates, so they are a brake, not a security boundary.
    mitigations: [AML.M0036, AML.M0004]
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-rate-limits.html
    verified: "2026-11-24"
    check:
      command: "aws bedrock-agentcore-control list-gateway-rate-limits --gateway-identifier <gateway-id> --region <region> --query 'rateLimits[].{id:rateLimitId,status:status,dimensionKeys:dimensionKeys,entries:entries}'"
      expect: "The list has ACTIVE rate limits whose dimensionKeys include a JWT claim or the IAM principal, with entries that set tokens per minute for inference targets and requests per minute for tools."
      url: https://docs.aws.amazon.com/cli/latest/reference/bedrock-agentcore-control/list-gateway-rate-limits.html
  - id: gatewayMcpToolSchema
    name: mcpToolSchema (static tool schema)
    product: "AgentCore Gateway"
    where: AgentCore Gateway › MCP server target › CreateGatewayTarget / UpdateGatewayTarget
    setVia: [apiCli]
    area: tools
    default: DEFAULT listing mode (tools fetched from the server at create, update and SynchronizeGatewayTargets)
    recommended: Static mcpToolSchema from the reviewed release on every MCP server target
    value: "Static schema from the reviewed release"
    why: The gateway serves the definitions you reviewed, not whatever the server now advertises, so a changed description changes nothing until a reviewed update.
    mitigations: [cap-mcp-tool-integrity]
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-MCPservers.html
    verified: "2026-10-30"
    check:
      command: "aws bedrock-agentcore-control get-gateway-target --gateway-identifier <gateway-id> --target-id <target-id> --region <region> --query targetConfiguration.mcp.mcpServer"
      expect: "The output for each MCP server target includes mcpToolSchema, with an s3 uri or inlinePayload that matches the reviewed release, next to the endpoint."
      url: https://docs.aws.amazon.com/cli/latest/reference/bedrock-agentcore-control/get-gateway-target.html
  - id: gatewayMcpSupportedVersions
    name: supportedVersions (protocolConfiguration.mcp)
    product: "AgentCore Gateway"
    where: "AgentCore Gateway › protocolConfiguration.mcp.supportedVersions, set by CreateGateway or UpdateGateway; UpdateGateway replaces the whole gateway configuration, so send the complete list and every other field you keep"
    setVia: [apiCli]
    area: tools
    default: "The versions chosen at creation. Gateways created before 28 July 2026 lack 2026-07-28, and a request without a version header is served as 2025-03-26"
    recommended: "2026-07-28 only on the gateway that publishes your server. An older version stays listed only while a named client still needs it, and comes off once that client has moved"
    value: "2026-07-28 only"
    why: "The Mcp-Method and Mcp-Name headers, and the gateway's refusal of a header-bound field that contradicts the body, exist only in 2026-07-28; older versions keep the initialize handshake and Mcp-Session-Id. Where the account is not enabled for version updates, the list is fixed at creation."
    mitigations: [AML.M0028]
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-using-mcp-call.html
    verified: "2026-11-21"
    check:
      command: "aws bedrock-agentcore-control get-gateway --gateway-identifier <gateway-id> --region <region> --query protocolConfiguration.mcp.supportedVersions"
      expect: "The list is 2026-07-28 alone, or also names an older version only while a named client is still moving."
      url: https://docs.aws.amazon.com/cli/latest/reference/bedrock-agentcore-control/get-gateway.html
  - id: gatewayRequestInterceptor
    name: REQUEST interceptor
    product: "AgentCore Gateway"
    where: AgentCore Gateway › Interceptors (a Lambda function); its execution role limited to that function
    setVia: [code, cloudPolicy]
    area: tools
    default: No interceptor
    recommended: tools/list and tools/call checked against the presenting token's scopes on every request
    value: "Check tools/list and tools/call against token scopes"
    why: A tool the caller's token does not cover is never listed to its model and cannot be called.
    mitigations: [AML.M0028]
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-fine-grained-access-control.html
    verified: "2026-10-30"
  - id: toolDefinitionPinning
    name: Hash-pinned tool definitions at load
    where: "Your service code: definitions loaded from the approved AWS Agent Registry record or release, checked against the recorded hash"
    setVia: [code]
    area: tools
    default: Definitions load from whatever is deployed
    recommended: Refuse to serve any definition whose hash differs from the one recorded at review
    value: "Refuse any definition whose hash changed since review"
    why: An edit to a description that skipped review never reaches a caller's model. The registry checks schema only, so the consumer-side check is yours.
    mitigations: [cap-mcp-tool-integrity]
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/registry-data-protection.html
    verified: "2026-10-30"
  - id: agentRegistryApproval
    name: Auto-approval
    where: AWS Agent Registry console › Registry › (registry) › Record approval. The registry now sits under the agent-registry namespace; AWS set 30 October 2026 as the end of support for the preview bedrock-agentcore namespace
    setVia: [adminConsole, apiCli]
    area: tools
    default: Chosen at creation
    recommended: "Off. A curator approves every MCP server, agent and skill record before it becomes searchable. Approval does not gate gateway targets, so create targets only from approved records in your own pipeline and limit bedrock-agentcore:CreateGatewayTarget to that pipeline's role"
    value: "Off; a curator approves every record"
    why: The list of tools an agent may be given is a governed registry with an owner per record, not whatever someone wired in. AWS does not tie an approved record to a gateway target, so that link is yours to build.
    mitigations: [cap-agent-tool-registry]
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/registry-create-manage.html
    verified: "2026-11-18"
    check:
      command: "aws bedrock-agentcore-control get-registry --registry-id <registry-id> --region <region> --query approvalConfiguration.autoApproval"
      expect: "The output is false (or null, since false is the default), meaning records need explicit approval."
      url: https://docs.aws.amazon.com/cli/latest/reference/bedrock-agentcore-control/get-registry.html
  - id: a2aCardVerification
    name: AgentCardSignature verification and hash pin
    where: "Your gateway interceptor: every peer card's JWS checked against the key pinned at admission, its hash against the approved registry record, on admission and each task"
    setVia: [code]
    area: tools
    default: "Cards are trusted as fetched. AWS Agent Registry approval governs discovery only: it adds or removes no gateway target and checks no card signature"
    recommended: Refuse any task to or from a peer whose card signature fails or whose card changed since its record was approved
    value: "Refuse peers with a failed or changed card"
    why: A tampered or silently changed card cannot redirect our tasks or widen a peer's skills; a change is a new approval, not a surprise.
    mitigations: [cap-mcp-tool-integrity]
    url: https://a2a-protocol.org/latest/specification/
    verified: "2026-11-24"
  - id: peerVendorAssessment
    name: Peer platform assessment
    where: Your third-party risk process, before the agreement and the federation are signed off
    setVia: [code]
    area: tools
    default: No assessment
    recommended: "Assessed before federation and yearly: assertion handling, tenant isolation, card signing, audit export, task cancellation"
    value: "Before federation, then yearly"
    why: The questions A2A leaves to the implementation are answered in the contract before our users' identity travels there.
    mitigations: [cap-ai-vendor-assessment]
    url: https://a2a-protocol.org/latest/topics/enterprise-ready/
    verified: "2026-10-30"
  - id: strandsInterrupts
    builtWith: Strands Agents
    name: Interrupts (human in the loop)
    where: "Your agent code: Strands Agents BeforeToolCallEvent hook raising an interrupt on consequential tools"
    setVia: [code]
    area: tools
    default: Tools run without approval
    recommended: "Approval before every consequential write: in the thread when the user is present, from an operator queue when nobody is"
    value: "Required on every consequential write"
    why: A person confirms each consequential action, with its arguments, before it happens, and never the requester approving their own remedy.
    mitigations: [AML.M0029]
    url: https://strandsagents.com/latest/documentation/docs/user-guide/concepts/interrupts/
    verified: "2026-10-30"
  - id: durableCallbackApproval
    name: Callback (wait for an external approval)
    where: "Your workflow code: durable execution SDK callback on consequential steps; only the approval service may call SendDurableExecutionCallbackSuccess"
    setVia: [code, cloudPolicy]
    area: tools
    default: Steps run without approval
    recommended: Consequential writes suspend on a callback that only the operator approval service can complete, with the action and its arguments in the payload
    value: "Consequential writes wait for operator approval"
    why: "The step resumes only on an approval for this exact action, possibly days later, and the agent cannot approve itself. Approvals do not return through EventBridge or SQS: the approval service calls SendDurableExecutionCallbackSuccess with the callback ID, so who holds that permission decides who can approve."
    mitigations: [AML.M0029]
    url: https://docs.aws.amazon.com/lambda/latest/dg/durable-security.html
    verified: "2026-11-24"
  - id: vllmApiKey
    name: --api-key (VLLM_API_KEY)
    product: "vLLM"
    where: vLLM server arguments on the serving pods; the key in Secrets Manager, presented by the gateway's API-key outbound auth
    setVia: [configFile]
    area: tools
    default: No authentication; runtime LoRA updating off unless VLLM_ALLOW_RUNTIME_LORA_UPDATING is set
    recommended: "Set, with VLLM_ALLOW_RUNTIME_LORA_UPDATING unset and --trust-remote-code left at its default of off. Do not rely on --load-format safetensors: the flag takes one value, and loading from S3 with runai_streamer uses it, so check the weights format in the promotion pipeline"
    value: "Set; runtime LoRA updating and remote code off"
    why: "Only the gateway can call the /v1 API, and no caller can load an adapter or remote code into the server. The key covers only the /v1, /v2, /inference and /cohere prefixes and leaves paths such as /invocations, /pooling, /score, /tokenize and /metrics open, so the network policy that admits only the gateway still matters."
    mitigations: [D3-ACH]
    url: https://docs.vllm.ai/en/latest/usage/security.html
    verified: "2026-11-18"
  - id: vllmCacheSalt
    name: cache_salt
    product: "vLLM"
    where: AgentCore Gateway REQUEST interceptor, setting the field on every inference request
    setVia: [code]
    area: tools
    default: Prefix cache shared across every caller of the server
    recommended: A secret per-tenant salt on every request, overwriting any the caller sent
    value: "Secret per-tenant salt on every request"
    why: One tenant cannot probe another's cached prompts through timing; the vLLM guide is clear it is mitigation, not an isolation boundary.
    mitigations: [D3-ACH]
    url: https://docs.vllm.ai/en/latest/usage/security.html
    verified: "2026-10-30"
  - id: outputSanitisation
    name: Sanitise rendered model output
    where: Your front-end code
    setVia: [code]
    area: tools
    default: Depends on your renderer
    recommended: Render as text or sanitised markdown; strip HTML, block external images, set a Content Security Policy
    value: "Text or sanitised markdown, with a Content Security Policy"
    why: A model-written image link or script cannot carry the conversation to an attacker the moment it renders.
    mitigations: [cap-output-encoding]
    url: https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
    verified: "2026-10-30"
  - id: codeInterpreterSandbox
    name: "Network settings: Sandbox mode"
    product: "AgentCore Code Interpreter"
    where: AgentCore Code Interpreter › custom code interpreter › Network settings
    setVia: [cloudPolicy, apiCli]
    area: tools
    default: The system code interpreter (aws.codeinterpreter.v1) uses the most restrictive settings; custom ones choose Sandbox, Public or VPC
    recommended: Sandbox
    why: Code the agent writes runs in an isolated session reaching only Amazon S3; where it must install packages, VPC mode in a subnet routed only to CodeArtifact is the alternative, never Public.
    mitigations: [D3-EI, cap-agent-egress-control]
    requires: "Sandbox mode still reaches Amazon S3, and any code in a session can read the interpreter's execution-role credentials, so scope that role to what the code may touch. Run-time installs from CodeArtifact need VPC mode; packages in the agent's own image are installed when it is built"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/code-interpreter-resource-management.html
    verified: "2026-11-24"
    check:
      command: "aws bedrock-agentcore-control get-code-interpreter --code-interpreter-id <code-interpreter-id> --region <region> --query networkConfiguration.networkMode"
      expect: "The output is \"SANDBOX\", not PUBLIC."
      url: https://docs.aws.amazon.com/cli/latest/reference/bedrock-agentcore-control/get-code-interpreter.html
  - id: gatewayWeightedRoute
    name: weightedRoute (gateway rules)
    product: "AgentCore Gateway"
    where: AgentCore Gateway › Rules › model routing on the inference target
    setVia: [apiCli]
    area: tools
    default: Requests route to the model they name
    recommended: A newly promoted model version takes a small weighted share, with the previous version kept as the fallback leg
    value: "Small weighted share, previous version as fallback"
    why: A new checkpoint serves a slice of traffic before it serves everyone, and rollback is a weight change rather than a re-download.
    mitigations: [cap-staged-rollout-gate]
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-rules-fallback.html
    verified: "2026-10-30"
  - id: smConditionStep
    name: Condition step (evaluation gate)
    product: "SageMaker Pipelines"
    where: SageMaker Pipelines › a Processing step that runs the evaluation and writes its report, then one Condition step in front of the Register model step
    setVia: [code]
    area: tools
    default: Registration does not depend on evaluation
    recommended: Capability, safety, backdoor and memorisation results must pass thresholds before the candidate is registered; benchmark data in a bucket the run's authors cannot write. Put every threshold in one Condition step, because condition steps cannot be nested
    value: "Register only after every threshold passes"
    why: A candidate that fails evaluation never reaches the registry, so promotion is blocked rather than advised. Pipelines has no evaluation step type, so the evaluation is a Processing job whose report the condition reads.
    mitigations: [AML.M0008]
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/build-and-manage-steps-types.html
    verified: "2026-11-18"
  - id: runtimeIsolatedSessions
    name: Isolated sessions (dedicated microVM per session)
    where: AgentCore Runtime › microVM compute type; a new runtimeSessionId per rollout, maxLifetime set to the task's budget
    setVia: [code, apiCli]
    area: tools
    default: microVM per session; sessions end after 15 minutes idle or 8 hours
    recommended: microVM compute (not Instances), one fresh session per rollout, stopped when the episode ends
    value: "Fresh microVM session per rollout, stopped at episode end"
    why: Each rollout runs in its own microVM with isolated CPU, memory and filesystem, terminated and sanitised afterwards, so nothing it did persists or reaches another rollout.
    mitigations: [D3-EI, D3-HBPI]
    requires: "End-state checks run through InvokeAgentRuntimeCommand before StopRuntimeSession, since a stopped session's microVM and disk are destroyed; no shared file system mounts, which every session sees, and a new session ID per rollout, since session storage persists under a reused one"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-sessions.html
    verified: "2026-11-24"
  - id: codeArtifactRepoPolicy
    name: Repository policy (codeartifact:ReadFromRepository)
    product: "CodeArtifact"
    where: AWS CodeArtifact › (repository) › Repository policy; rollout roles in IAM
    setVia: [cloudPolicy]
    area: tools
    default: Access as the account's IAM policies allow
    recommended: Rollout and agent roles may read only; PublishPackageVersion held by build pipelines alone
    value: "Read only; publish by build pipelines alone"
    why: A rollout can install from the mirror but never write to it, so the package cache cannot become a message board between rollouts.
    mitigations: [AML.M0028]
    url: https://docs.aws.amazon.com/codeartifact/latest/ug/repo-policies.html
    verified: "2026-10-30"
  - id: containmentRedTeam
    name: Containment red team before each run
    where: "Your run checklist: agents attacking your own sandbox configuration (network rules, roles, endpoint policies), inside the AWS penetration testing policy"
    setVia: [code]
    area: tools
    default: Not done
    recommended: Required before any run that widens tools or egress; findings block the run until fixed. AWS's policy forbids assessing AWS infrastructure or the services themselves and lists AgentCore under services prohibited for outbound testing, so attacks on the microVM boundary or platform services, and any test involving SageMaker, need agreement from AWS Support first
    value: "Required before any run that widens tools or egress"
    why: Escape routes through your own network rules, roles and endpoints are found by the red team, not by the model being trained. The platform's isolation boundary is not yours to attack without AWS's agreement.
    mitigations: [D3-SYSVA]
    url: https://aws.amazon.com/security/penetration-testing/
    verified: "2026-11-18"
  - id: gatewayAbTesting
    name: A/B testing (target-based)
    product: "AgentCore Gateway"
    where: AgentCore Gateway › A/B test scored by online evaluation; runtime endpoints pinned to versions
    setVia: [apiCli]
    area: tools
    default: The DEFAULT endpoint follows the latest runtime version
    recommended: Production endpoint pinned to a version; a new agent, prompt or model version takes a small traffic share after its batch evaluation passes
    value: "Production pinned; new versions take a small share"
    why: A change that behaves badly reaches a few sessions and rolls back by repointing an endpoint, not by redeploying.
    mitigations: [cap-staged-rollout-gate]
    requires: "For an agent hosted outside AgentCore Runtime (Lambda, EKS or ECS), each variant registered as an HTTP passthrough target with Gateway tracing on, so it needs an HTTP entry point"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/ab-testing.html
    verified: "2026-11-24"
    check:
      command: "aws bedrock-agentcore get-ab-test --ab-test-id <ab-test-id> --region <region> --query '{executionStatus:executionStatus,gatewayArn:gatewayArn,variants:variants[].{name:name,weight:weight,target:variantConfiguration.target.name},evaluationConfig:evaluationConfig}'"
      expect: "gatewayArn is your gateway, variant C and variant T1 each name a gateway target, T1 carries a small weight, and evaluationConfig names an online evaluation configuration."
      url: https://docs.aws.amazon.com/cli/latest/reference/bedrock-agentcore/get-ab-test.html
  - id: agentCoreBatchEvaluation
    name: Batch evaluation
    where: AgentCore Evaluations › batch evaluation job, run from your release pipeline
    setVia: [apiCli]
    area: tools
    default: Not run
    recommended: A passing batch evaluation against a curated session set before any agent, prompt or model version is published to the alias the triggers invoke
    value: "Must pass before any version is published"
    why: A change is scored on known scenarios before it runs unattended, which is the last point at which anyone is watching.
    mitigations: [cap-staged-rollout-gate]
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/batch-evaluations.html
    verified: "2026-10-30"
  - id: inspectorCodeSecurity
    name: Amazon Inspector Code Security
    where: Amazon Inspector › Code Security › scan configuration on your repositories
    setVia: [adminConsole, apiCli]
    area: tools
    default: Not activated
    recommended: On for every service repository, scanning source, dependencies and infrastructure as code on each change
    value: "On for every service repository"
    why: Handler code and its dependencies are tested and enumerated like any published application's, before and after release.
    mitigations: [D3-SYSVA, D3-AVE]
    url: https://docs.aws.amazon.com/inspector/latest/user/code-security-assessments.html
    verified: "2026-10-30"
  - id: ecrEnhancedScanning
    name: Enhanced scanning
    where: Amazon ECR › Private registry › Scanning configuration (Amazon Inspector)
    setVia: [cloudPolicy, apiCli]
    area: tools
    default: Basic scanning
    recommended: Enhanced, continuous scanning on every repository the workload pulls from
    value: "Enhanced, continuous, on every repository pulled from"
    why: Every image actually deployed is matched against new CVEs as they are published, not only when it was pushed.
    mitigations: [D3-AVE]
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/image-scanning-enhanced.html
    verified: "2026-10-30"
  - id: codeArtifactOrigin
    name: Package origin controls
    product: "CodeArtifact"
    where: AWS CodeArtifact › (repository) › (package) › Origin controls; package group origin controls for the whole domain
    setVia: [adminConsole, apiCli]
    area: tools
    default: "Set by how the first version arrives: a published package gets Publish ALLOW and Upstream BLOCK, a package first ingested from a public registry gets Publish BLOCK and Upstream ALLOW"
    recommended: Upstream BLOCK on every internal package name, and a package group that limits EXTERNAL_UPSTREAM to the one ingest repository. A public package keeps Upstream ALLOW, so new public versions enter whenever a client asks; for a fixed mirror, set Upstream to BLOCK once the reviewed versions are in
    value: "Upstream BLOCK on every internal package name"
    why: The agent's tools install from your repository, and a public package cannot shadow an internal one. An external connection is not a pinned mirror, and malware scanning of what is ingested is not a CodeArtifact feature, so run it where packages are promoted.
    mitigations: [D3-FA]
    url: https://docs.aws.amazon.com/codeartifact/latest/ug/package-origin-controls.html
    verified: "2026-11-18"
    check:
      command: "aws codeartifact describe-package --domain <domain> --repository <repository> --format <format> --package <internal-package-name> --region <region> --query package.originConfiguration.restrictions"
      expect: "For each internal package name, upstream is BLOCK and publish is ALLOW."
      url: https://docs.aws.amazon.com/cli/latest/reference/codeartifact/describe-package.html

  # --- Network -------------------------------------------------------------------------
  - id: runtimeVpcMode
    name: networkMode VPC
    where: AgentCore Runtime › (agent runtime) › Network configuration (networkMode VPC, subnets, security groups); SCP on bedrock-agentcore:subnets and bedrock-agentcore:securityGroups
    setVia: [cloudPolicy, apiCli]
    area: network
    default: Chosen at creation (PUBLIC or VPC)
    recommended: "VPC, private subnets and security groups that reach only the services the workload needs, enforced by an SCP that denies CreateAgentRuntime, UpdateAgentRuntime, CreateCodeInterpreter and CreateBrowser unless they name approved subnets and security groups. A custom browser that an agent drives goes in VPC mode on the same subnets"
    value: "VPC, approved subnets and security groups, by SCP"
    why: The harness and its tools leave only through your VPC's routes and firewall, never straight to the internet or sideways to another workload.
    mitigations: [cap-agent-egress-control, D3-NI]
    requires: "Private subnets with a route to a NAT gateway for any internet access; a public subnet gives none"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/security-vpc-condition.html
    verified: "2026-11-24"
    check:
      command: "aws bedrock-agentcore-control get-agent-runtime --agent-runtime-id <agent-runtime-id> --region <region> --query networkConfiguration"
      expect: "networkMode is VPC and networkModeConfig lists your private subnets and the security groups meant for this workload."
      url: https://docs.aws.amazon.com/cli/latest/reference/bedrock-agentcore-control/get-agent-runtime.html
  - id: lambdaVpcConfig
    name: VPC configuration (lambda:SubnetIds)
    where: Lambda › (function) › Configuration › VPC; SCP on lambda:VpcIds and lambda:SubnetIds
    setVia: [cloudPolicy, apiCli]
    area: network
    default: Not attached to a VPC (public internet access)
    recommended: Private subnets routed through Network Firewall, enforced for agent functions by the condition keys
    value: "Private subnets via Network Firewall"
    why: The harness and its in-process tools leave only through your routes and firewall, never straight to the internet.
    mitigations: [cap-agent-egress-control]
    requires: "Interface endpoints or a NAT route for the AWS services the function calls"
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-vpc.html
    verified: "2026-11-24"
  - id: networkFirewallDomains
    name: Stateful domain list rule group (Allow)
    where: AWS Network Firewall › Firewall policy › Stateful rule groups; private subnet route tables to the firewall endpoint
    setVia: [cloudPolicy]
    area: network
    default: Direct outbound through a NAT gateway
    recommended: All outbound from agent subnets through Network Firewall, with an Allow list of the hosts the tools need on TLS_SNI and HTTP_HOST, the AWS_ROUTE_53_RESOLVED_DOMAIN target type added, and stateful rules that drop every other protocol
    value: "Through Network Firewall, allow list of tool hosts"
    why: The agent and its tools reach only the hosts you list. A plain Allow list trusts the server name or Host header the client states, drops other HTTP and HTTPS only under default action order, and leaves other protocols to your other rules.
    mitigations: [cap-agent-egress-control]
    url: https://docs.aws.amazon.com/network-firewall/latest/developerguide/stateful-rule-groups-domain-names.html
    verified: "2026-11-18"
    check:
      command: "aws network-firewall describe-rule-group --rule-group-arn <rule-group-arn> --region <region> --query RuleGroup.RulesSource.RulesSourceList"
      expect: "GeneratedRulesType is ALLOWLIST, TargetTypes has TLS_SNI and HTTP_HOST, and Targets lists only the hosts the tools need."
      url: https://docs.aws.amazon.com/cli/latest/reference/network-firewall/describe-rule-group.html
  - id: metadataFetchSsrf
    name: Block private and metadata addresses on outbound fetches
    where: "Your authorization service code: client metadata document fetches; its subnet egress through Network Firewall"
    setVia: [code, cloudPolicy]
    area: network
    default: Fetches go wherever the client's URL resolves
    recommended: HTTPS only, resolved address checked against private, link-local and 169.254.169.254 ranges before connecting, IMDSv2 required
    value: "HTTPS only; private and metadata addresses blocked"
    why: A client that names an internal URL as its identifier cannot turn the authorization server into a proxy into your network.
    mitigations: [D3-OTF]
    url: https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
    verified: "2026-10-30"
  - id: eksNetworkPolicy
    name: ClusterNetworkPolicy (admin network policy)
    where: Amazon EKS with the VPC CNI network policy agent › cluster-wide policy on the serving namespaces
    setVia: [configFile, cloudPolicy]
    area: network
    default: "No restrictions between pods, and no policy takes effect until enforcement is on: enableNetworkPolicy on the VPC CNI add-on, or the Network Policy Controller ConfigMap in EKS Auto Mode"
    recommended: "Deny by default. Each workload admits only its caller (serving pods only the gateway's VPC egress, an MCP server only its load balancer) and sends only to what it calls, such as the gateway; inter-node ports open only between a model's own pods"
    value: "Deny by default, gateway-only access to serving pods"
    why: "Until a policy selects them, pods reach any address the VPC routes to and any pod in the cluster can call them, skipping the gateway. With it, each workload is reached only by its caller, and the serving plane's unauthenticated job and inter-node channels by nothing but themselves."
    mitigations: [D3-NI]
    url: https://docs.aws.amazon.com/eks/latest/userguide/cni-network-policy.html
    verified: "2026-11-24"
  - id: smNetworkIsolation
    name: EnableNetworkIsolation
    product: "SageMaker AI training jobs"
    where: SageMaker AI › CreateTrainingJob (and CreateModel); VpcConfig with private subnets and an S3 gateway endpoint
    setVia: [cloudPolicy, apiCli]
    area: network
    default: "false (containers are internet-enabled)"
    recommended: "true"
    why: "The container makes no outbound call at all and receives no AWS credentials; SageMaker stages data, weights and results in and out for it."
    mitigations: [D3-NI]
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/mkt-algo-model-internet-free.html
    verified: "2026-11-24"
  - id: dnsFirewall
    name: Route 53 Resolver DNS Firewall
    where: Amazon Route 53 › Resolver › DNS Firewall rule groups associated with the sandbox VPC
    setVia: [cloudPolicy]
    area: network
    default: Any name resolves
    recommended: Allow list of the offline web, mirror and platform endpoints; every other name blocked
    value: "Allow list only; every other name blocked"
    why: DNS resolves only to the run's own list, which closes the tunnel-out-through-DNS path that a firewall on TCP alone leaves open.
    mitigations: [cap-agent-egress-control]
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver-dns-firewall.html
    verified: "2026-10-30"
  - id: privateLinkEndpoints
    name: Interface VPC endpoints (AWS PrivateLink)
    where: "Amazon VPC › Endpoints: one for each AWS service the workload calls from its VPC, each with an endpoint policy"
    setVia: [cloudPolicy]
    area: network
    default: Calls leave over public AWS endpoints
    recommended: "An endpoint per service the workload calls, its policy limited to your accounts and resources. AgentCore: bedrock-agentcore and bedrock-agentcore.gateway. Bedrock models called directly: bedrock-runtime. VPC-mode runtimes: ecr.api, ecr.dkr, logs and an S3 gateway endpoint. SageMaker jobs: the SageMaker API and Runtime endpoints and those of the stores, registries and keys they use"
    value: "An endpoint per service called, limited to your accounts"
    why: "Calls to AWS services stay on the AWS network from your VPC, and the endpoint policy limits what can be reached through it. Endpoint policies cannot restrict OAuth (JWT) callers of AgentCore, who need Principal * there, so the JWT authorizer is the control on that path."
    mitigations: []
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/privatelink-access-aws-services.html
    verified: "2026-11-18"
    check:
      command: "aws ec2 describe-vpc-endpoints --filters Name=vpc-id,Values=<vpc-id> --region <region> --query 'VpcEndpoints[].{service:ServiceName,type:VpcEndpointType,state:State,policy:PolicyDocument}'"
      expect: "There is an Interface endpoint for bedrock-runtime, bedrock-agentcore and each store the agent uses, and each policy document limits access to your own accounts instead of allowing everyone."
      url: https://docs.aws.amazon.com/cli/latest/reference/ec2/describe-vpc-endpoints.html
  - id: wafRateRule
    name: Rate-based rule statement
    where: AWS WAF web ACL on the load balancer, CloudFront distribution or AgentCore Gateway
    setVia: [cloudPolicy]
    area: network
    default: No rate limit
    recommended: Per-client rate limit on every public endpoint
    why: A runaway client or scripted abuse is throttled at the edge, before it spends tokens or triggers actions.
    mitigations: [AML.M0004]
    url: https://docs.aws.amazon.com/waf/latest/developerguide/waf-rule-statement-type-rate-based.html
    verified: "2026-10-30"

  # --- Audit & monitoring --------------------------------------------------------------
  - id: agentCoreObservability
    name: AgentCore Observability (CloudWatch Transaction Search)
    where: CloudWatch › Application Signals › Transaction search; agent code instrumented with OpenTelemetry (ADOT)
    setVia: [code, cloudPolicy]
    area: audit
    default: Transaction Search off; agent code not instrumented
    recommended: On, tracing every agent turn, tool call and gateway hop, logs exported to your SIEM
    value: "On, every turn and tool call traced, logs to your SIEM"
    why: Each tool call, its arguments and its result are traceable per user and session when something goes wrong.
    mitigations: [cap-agent-tracing, AML.M0024]
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/observability-configure.html
    verified: "2026-10-30"
    check:
      command: "aws xray get-trace-segment-destination --region <region>"
      expect: "Destination is CloudWatchLogs and Status is ACTIVE, which is what Transaction Search needs."
      url: https://docs.aws.amazon.com/cli/latest/reference/xray/get-trace-segment-destination.html
  - id: bedrockInvocationLogging
    name: Model invocation logging
    where: Amazon Bedrock › Settings › Model invocation logging (S3 or CloudWatch Logs)
    setVia: [cloudPolicy, apiCli]
    area: audit
    default: Disabled
    recommended: Enabled to an S3 bucket in the log archive account
    why: Every prompt and completion is kept off the agent's write path, so the record of what the model was told survives the session.
    mitigations: [cap-agent-tracing]
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
    verified: "2026-10-30"
    check:
      command: "aws bedrock get-model-invocation-logging-configuration --region <region> --query loggingConfig"
      expect: "loggingConfig is not null and s3Config.bucketName is the bucket in your log archive account."
      url: https://docs.aws.amazon.com/cli/latest/reference/bedrock/get-model-invocation-logging-configuration.html
  - id: cloudTrailDataEvents
    name: CloudTrail data events
    where: AWS CloudTrail › organisation trail › Data events (AgentCore, Bedrock, SageMaker and S3 resource types)
    setVia: [cloudPolicy]
    area: audit
    default: Not logged (management events only)
    recommended: Logged for the resource types the workload uses, to the log archive account
    value: "Logged for the workload's resource types"
    why: Who invoked which gateway, runtime, model or object is recorded by AWS, append-only and out of the workload's reach.
    mitigations: [cap-agent-tracing, AML.M0024]
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/logging-data-events-with-cloudtrail.html
    verified: "2026-10-30"
    check:
      command: "aws cloudtrail get-event-selectors --trail-name <trail-arn> --region <region> --query AdvancedEventSelectors"
      expect: "The selectors include eventCategory Equals Data with a resources.type entry for each AgentCore, Bedrock, SageMaker and S3 resource type the workload uses."
      url: https://docs.aws.amazon.com/cli/latest/reference/cloudtrail/get-event-selectors.html
  - id: gatewayResponseInterceptor
    name: REQUEST and RESPONSE interceptors (audit record)
    product: "AgentCore Gateway"
    where: AgentCore Gateway › Interceptors (Lambda functions writing to the log archive bucket)
    setVia: [code, cloudPolicy]
    area: audit
    default: No interceptor
    recommended: The REQUEST interceptor writes each request with its tenant identity (passRequestHeaders on) and the RESPONSE interceptor writes the completion, the two joined on the gateway's REQUEST_ID. Sensitive fields masked, in an archive the serving tier cannot write
    value: "REQUEST and RESPONSE interceptors, joined on REQUEST_ID"
    why: The record of what was asked and answered comes from the crossing every caller shares, not from the callers' own logs. For inference targets the RESPONSE interceptor receives no request and no caller identity, runs in buffered mode only, and must skip bodies that would pass Lambda's 6 MB limit.
    mitigations: [AML.M0024]
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-interceptors-types.html
    verified: "2026-11-18"
  - id: smModelApproval
    name: Model approval status
    product: "SageMaker Model Registry"
    where: Amazon SageMaker Model Registry › model package group › version › Update status
    setVia: [adminConsole, apiCli]
    area: audit
    default: Set at registration (PendingManualApproval, Approved or Rejected)
    recommended: "Registered as PendingManualApproval; only a separate approver role may change approval status (UpdateModelPackage), after evaluation, so no pipeline or training role approves its own version; the deployment records which version serves where"
    value: "PendingManualApproval; approved by a separate approver"
    why: The question "what is running, and who cleared it" has an answer in one place, and nothing unapproved reaches a server.
    mitigations: [AML.M0023, cap-model-documentation]
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/model-registry-approve.html
    verified: "2026-11-24"
  - id: smModelCards
    name: Amazon SageMaker Model Cards
    product: "SageMaker Model Registry"
    where: SageMaker AI › Model Cards, attached to the model package in Model Registry
    setVia: [adminConsole, apiCli]
    area: audit
    default: None
    recommended: A card for every registered version (intended use, training data, evaluation results) required before approval
    value: "Required for every version before approval"
    why: What the artifact is and what it was trained on travel with it to whoever deploys it.
    mitigations: [cap-model-documentation]
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/model-cards.html
    verified: "2026-10-30"
  - id: runtimeStopSession
    name: StopRuntimeSession
    where: AgentCore Runtime data plane API, called from your incident runbook with the session IDs your application recorded
    setVia: [apiCli]
    area: audit
    default: Sessions run until they end or idle out
    recommended: Your front end or orchestrator records every live runtimeSessionId, and the runbook's first step calls StopRuntimeSession for each. Browser and code interpreter sessions are stopped separately, with StopBrowserSession and StopCodeInterpreterSession
    value: "Every live session stopped as the runbook's first step"
    why: Live conversations, and any streaming response mid-action, end at once without a deploy. The call stops one session by its ID and no API lists a runtime's live sessions, so the stop is only as complete as your own record.
    mitigations: [cap-agent-kill-switch]
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-stop-session.html
    verified: "2026-11-18"
  - id: durableStopExecution
    name: StopDurableExecution
    where: Lambda API, called from your incident runbook for every running or suspended execution
    setVia: [apiCli]
    area: audit
    default: Executions run until they complete or time out (up to a year)
    recommended: The runbook's first step stops every execution of the workflow, suspended ones included
    value: "Every execution stopped first, suspended ones too"
    why: A workflow halfway through a multi-day run, or parked waiting on a callback, moves to STOPPED and cannot be resumed.
    mitigations: [cap-agent-kill-switch]
    url: https://docs.aws.amazon.com/lambda/latest/api/API_StopDurableExecution.html
    verified: "2026-10-30"
  - id: registryDeprecate
    name: Deprecate (registry record)
    where: AWS Agent Registry › record › Deprecate; then the peer's Cognito app client and gateway target removed
    setVia: [adminConsole, apiCli]
    area: audit
    default: Records stay discoverable until deprecated
    recommended: "The peer cut-off runbook: deprecate its card's record, delete its app client, forbid its principal in the policy engine, cancel the tasks delegated to it"
    value: "Deprecated in the peer cut-off runbook"
    why: A peer is cut off in one sequence at the registry, the token issuer and the gateway, without a deploy; deprecation is terminal.
    mitigations: [cap-agent-kill-switch]
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/registry-deprecating-records.html
    verified: "2026-10-30"
  - id: iamRevokeSessions
    name: Revoke active sessions
    where: IAM › Roles › (the agent's execution role) › Revoke sessions
    setVia: [cloudPolicy, apiCli]
    area: audit
    default: Role sessions valid until they expire
    recommended: Part of the incident runbook, followed by a deny policy until the incident closes
    value: "Revoked in the incident runbook, then a deny policy"
    why: AWSRevokeOlderSessions denies every credential the agent already holds within about 30 seconds, without redeploying anything.
    mitigations: [cap-agent-kill-switch]
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_revoke-sessions.html
    verified: "2026-10-30"
  - id: eksRunAccessEntry
    name: "EKS access entry for Kubernetes groups (SageMaker HyperPod on Amazon EKS)"
    where: "Amazon EKS › (the HyperPod cluster's EKS cluster) › Access › Access entries; aws eks create-access-entry --principal-arn --kubernetes-groups, with a Role and RoleBinding for that group in the run namespace"
    setVia: [apiCli, configFile, identityProvider]
    area: identity
    recommended: "One access entry per research group. The principal is the IAM role that group signs in to through your identity provider; map it to a Kubernetes group bound to a Role for run objects in its namespace only. Use authentication mode API; review every other entry."
    value: "One per research group, scoped to its namespace"
    why: "The access entry lets the group's role reach the Kubernetes API and the bound Role limits it to runs. Other entries, access policies, the cluster creator's admin entry and aws-auth mappings can grant the same access."
    mitigations: [D3-APA]
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-eks-setup-rbac.html
    verified: "2026-11-18"
  # >>> hosting rows (settings used only by a hosting variant)
  - id: eksImdsHopLimit
    name: "Instance metadata options (IMDSv2 required, hop limit 1)"
    where: "Amazon EC2 › node group launch template › Metadata options (HttpTokens required, HttpPutResponseHopLimit 1)"
    setVia: [apiCli]
    area: identity
    default: "Varies: nodes created by eksctl or the CloudFormation template get hop limit 2; AL2023 managed node groups and EKS Auto Mode get hop limit 1"
    requires: "Every pod that needs AWS access uses EKS Pod Identity or IRSA"
    recommended: "Require IMDSv2 and set the hop limit to 1 on every node that runs agent pods (aws ec2 modify-instance-metadata-options --http-tokens required --http-put-response-hop-limit 1, or the same in the launch template). Do not give agent pods hostNetwork."
    value: "IMDSv2 required, hop limit 1"
    why: "Unless instance metadata is restricted, a pod's containers can also use the node's IAM role, which is wider than the role bound to the agent's service account."
    mitigations: [D3-CH]
    url: https://docs.aws.amazon.com/eks/latest/best-practices/identity-and-access-management.html
    verified: "2026-11-18"
  - id: eksAppNetworkPolicy
    name: "ApplicationNetworkPolicy (DNS-based network policy)"
    where: "Amazon EKS Auto Mode › Network Policy Controller › ApplicationNetworkPolicy in the agent namespace (egress domainNames)"
    setVia: [clusterPolicy]
    area: network
    default: "No policy; the Network Policy Controller is off until the amazon-vpc-cni ConfigMap enables it"
    requires: "EKS Auto Mode nodes, with enable-network-policy-controller set to true; on standard clusters, an FQDN-capable policy engine (AWS's agent-sandbox blueprint chains Cilium)"
    recommended: "One policy selecting the agent pods, policyTypes Egress, that allows CoreDNS and the domainNames of the AgentCore Gateway endpoint and of the AWS service endpoints the agent calls, and nothing else."
    value: "Egress only to CoreDNS and named endpoints"
    why: "Kubernetes allows all pod traffic by default. A domain allow list at the pod keeps the gateway the agent's only way out, ahead of the Network Firewall rules on the subnet. Policies and security groups are enforced on the node, outside an isolated pod's sandbox, so a compromised workload cannot switch them off."
    mitigations: [cap-agent-egress-control]
    url: https://docs.aws.amazon.com/eks/latest/userguide/auto-net-pol.html
    verified: "2026-11-24"
  - id: eksIsolatedPods
    name: "Isolated pods (runtimeClassName isolated-sandbox)"
    where: "Amazon EKS › agent Deployment pod spec › runtimeClassName; EKS Auto Mode, or node groups on an AMI built with the Nitro Sandbox runtime"
    setVia: [configFile]
    area: tools
    default: "Off; pods use the default container runtime and share the node's kernel"
    requires: "Kubernetes 1.36 or later and an EC2 instance type that supports Nitro Sandboxes; no GPU or device passthrough and no snapshot and restore, so fast starts come from warm pools you size"
    recommended: "Set runtimeClassName: isolated-sandbox on the agent pods so each runs in its own Nitro Sandbox; add the annotation sandbox.amazonaws.com/network-isolated: \"true\" to any pod that only runs generated code."
    value: "runtimeClassName: isolated-sandbox on agent pods"
    why: "Containers on a node share one Linux kernel, so a container escape can expose other workloads. An isolated pod runs in its own hardware-isolated sandbox with its own kernel. It separates pods, not the runs, conversations or tasks that one pod serves, which stay apart only in code."
    mitigations: [D3-EI]
    url: https://docs.aws.amazon.com/eks/latest/userguide/sandboxing.html
    verified: "2026-11-24"
  - id: eksAgentQuarantine
    name: "Delete the Pod Identity association and scale to zero"
    where: "Amazon EKS › (cluster) › Access › Pod Identity associations › Delete; the agent Deployment set to zero replicas, from your incident runbook"
    setVia: [apiCli]
    area: identity
    recommended: "Runbook order: set the agent Deployment to zero replicas (for a build, delete its Job), delete its Pod Identity association (aws eks delete-pod-identity-association), then revoke the role's active sessions in IAM."
    value: "Scale to zero, delete association, revoke sessions"
    why: "EKS has no session to stop. Credentials already issued to a pod can stay valid until they expire, so deleting the association needs the session revocation beside it."
    mitigations: [cap-agent-kill-switch]
    url: https://docs.aws.amazon.com/eks/latest/APIReference/API_DeletePodIdentityAssociation.html
    verified: "2026-11-24"
  - id: sqsQueueAccessPolicy
    name: "Queue access policy (aws:SourceArn)"
    where: "Amazon SQS › (the run queue) › Access policy; IAM policy on the agent's Pod Identity role"
    setVia: [apiCli, adminConsole]
    area: identity
    recommended: "Allow sqs:SendMessage to events.amazonaws.com only where aws:SourceArn is the one rule's ARN (or to the one schedule's execution role); allow sqs:ReceiveMessage and sqs:DeleteMessage to the agent's Pod Identity role alone."
    value: "Send from the one rule only, receive by the agent role"
    why: "On EKS a message on the queue is what starts a run, so the queue's policy takes the place of the resource-based policy on the runtime. No invocation carries the user's token, so the user a run acts for travels in the message and the agent validates it there."
    mitigations: [D3-APA]
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-use-resource-based.html
    verified: "2026-11-24"
  - id: eksClusterAccessEntries
    name: "Access entries with namespace-scoped access policies"
    where: "Amazon EKS › (cluster) › Access › IAM access entries; access policy with access scope type namespace"
    setVia: [apiCli, adminConsole]
    area: identity
    recommended: "Give the deployment pipeline role and the on-call role access entries whose access policies are scoped to the agent namespace (--access-scope type=namespace,namespaces=...); keep no standing cluster-wide administrator entry."
    value: "Namespace-scoped entries; no standing cluster admin"
    why: "Whoever can change or exec into the agent's pods can act with the agent's role. On EKS that power sits behind the Kubernetes API, so cluster access needs the same care as the role."
    mitigations: [D3-APA]
    url: https://docs.aws.amazon.com/eks/latest/userguide/access-policies.html
    verified: "2026-11-18"
  - id: eksControlPlaneLogs
    name: "Control plane logging (audit and authenticator)"
    where: "Amazon EKS › (cluster) › Control plane logging › audit and authenticator log types, sent to CloudWatch Logs"
    setVia: [apiCli, adminConsole]
    area: audit
    default: "Off; each log type is turned off"
    recommended: "Turn on the audit and authenticator log types for the agent cluster and keep the log group with the organisation's other audit logs."
    value: "Audit and authenticator logs on"
    why: "Changes to the running agent, such as a new image or an exec into a pod, are calls to the cluster's API server. The Kubernetes audit log is the record of them."
    mitigations: [cap-agent-tracing, AML.M0024]
    url: https://docs.aws.amazon.com/eks/latest/userguide/control-plane-logs.html
    verified: "2026-11-18"
  - id: eksPrivateEndpoint
    name: "Cluster endpoint access (private)"
    where: "Amazon EKS › (cluster) › Networking › Cluster endpoint access (endpoint private access, endpoint public access, public access CIDRs)"
    setVia: [apiCli, adminConsole]
    area: network
    default: "Public endpoint enabled, private endpoint disabled"
    recommended: "Enable endpoint private access and disable public access, or limit public access to named CIDR blocks."
    value: "Private on, public off or limited to named CIDRs"
    why: "By default the Kubernetes API server that controls the agent's pods is reachable from the internet, with IAM and Kubernetes RBAC as its only gate."
    mitigations: [D3-NI]
    url: https://docs.aws.amazon.com/eks/latest/userguide/cluster-endpoint.html
    verified: "2026-11-18"
  - id: gatewayTargetPrivateEndpoint
    name: "Private endpoint (privateEndpoint) on the gateway target"
    product: "AgentCore Gateway"
    where: "AgentCore Gateway › HTTP passthrough target for the agent › privateEndpoint (Amazon VPC Lattice resource gateway in the cluster VPC)"
    setVia: [apiCli]
    area: network
    requires: "An internal load balancer in front of the A2A server; managed or self-managed VPC Lattice resources"
    recommended: "Register the A2A server as an HTTP passthrough target with protocolType A2A and a privateEndpoint, and allow inbound traffic to its internal load balancer only from the resource gateway's security group."
    value: "A2A passthrough target with a privateEndpoint"
    why: "The agent no longer sits behind Runtime's endpoint. A private target keeps the A2A server off the internet, so a peer reaches it only through the gateway."
    mitigations: [D3-NI]
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-vpc-egress.html
    verified: "2026-11-18"
  - id: runtimeLifecycleConfig
    name: "Lifecycle configuration (idleRuntimeSessionTimeout, maxLifetime)"
    where: "AgentCore Runtime › (agent runtime) › lifecycleConfiguration"
    setVia: [apiCli]
    area: tools
    default: "idleRuntimeSessionTimeout 900 seconds, maxLifetime 28800 seconds"
    recommended: "Set maxLifetime to the longest a single run may compute and keep idleRuntimeSessionTimeout short, so a run that waits on an operator releases its microVM and resumes from saved state."
    value: "maxLifetime the longest run; idle timeout short"
    why: "A durable function suspends at no cost while it waits. A runtime session holds its microVM until the idle timeout, and these two limits are what bound a runaway run. Ending the session does not end the run: the approval event invokes the runtime again with the same session ID, a new microVM starts, and the supervisor reloads its state."
    mitigations: [AML.M0036]
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-lifecycle-settings.html
    verified: "2026-11-24"
  - id: sfnStartExecutionRole
    name: "Execution role on the rule target (states:StartExecution)"
    where: "Amazon EventBridge › rule › target › RoleArn, or pipe › execution role (RoleArn); IAM policy on that role"
    setVia: [apiCli]
    area: identity
    recommended: "One role per rule or pipe, allowed states:StartExecution on the workflow's state machine ARN only; no other principal holds that action on it."
    value: "One role per rule or pipe, this state machine only"
    why: "Starting an execution is what starts a run. The target's role takes the place of the function's resource-based policy tied to the rule. No invocation binds the run's grant, so it travels in the execution input and each agent checks it."
    mitigations: [D3-APA]
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-targets.html
    verified: "2026-11-24"
  - id: sfnTaskTokenApproval
    name: "Wait for a Callback with Task Token (.waitForTaskToken)"
    where: "AWS Step Functions › state machine › Task state before consequential steps; states:SendTaskSuccess and states:SendTaskFailure held by the approval service only"
    setVia: [configFile, apiCli]
    area: tools
    recommended: "Put a .waitForTaskToken task before each consequential step, pass the token only to the approval service and set a timeout. Agent roles hold SendTaskSuccess as activity workers, so guard the token."
    value: "Approval task token before each consequential step"
    why: "The workflow pauses, for up to a year, until the token comes back. Whoever can return the token approves the step."
    mitigations: [AML.M0029]
    url: https://docs.aws.amazon.com/step-functions/latest/dg/connect-to-resource.html
    verified: "2026-11-18"
  - id: sfnStopExecution
    name: "StopExecution"
    where: "AWS Step Functions API, called from your incident runbook for every running execution of the workflow"
    setVia: [apiCli]
    area: tools
    recommended: "Runbook order: disable the rule or pipe, call StopExecution on each running execution, then scale the agent Deployments to zero and revoke their roles' sessions."
    value: "Disable rule, stop executions, scale to zero, revoke"
    why: "Stopping the execution ends the journalled run, but a pod that already holds an activity task keeps working until it is stopped as well."
    mitigations: [cap-agent-kill-switch]
    url: https://docs.aws.amazon.com/step-functions/latest/apireference/API_StopExecution.html
    verified: "2026-11-18"
  - id: sfnEncryptionConfig
    name: "Customer managed key (encryption configuration)"
    where: "AWS Step Functions › state machine and each activity › encryption configuration (KMS key and data key reuse period)"
    setVia: [apiCli, adminConsole]
    area: data
    default: "Encrypted at rest with an AWS owned key"
    recommended: "Choose a customer managed KMS key when creating the state machine and each activity, and grant use of the key only to the workflow role, the agent roles and incident reviewers."
    value: "Customer managed KMS key, used by named roles only"
    why: "Execution history now holds every step's input and output, readable for 90 days after the run. The key decides who can read that journal, as KMSKeyArn in DurableConfig did."
    mitigations: [AML.M0012]
    url: https://docs.aws.amazon.com/step-functions/latest/dg/encryption-at-rest.html
    verified: "2026-11-24"
  - id: albOidcClaimsVerify
    name: "Verify x-amzn-oidc-data (user claims signature and signer)"
    where: "Your agent code, on every request from the load balancer; pod ingress limited to the load balancer"
    setVia: [code]
    area: identity
    recommended: "Verify the signature of the x-amzn-oidc-data header with the load balancer's public key, check that the signer field is your load balancer's ARN, take the user only from those claims and reject requests without the header."
    value: "Signature and signer verified; user from claims only"
    why: "Runtime validated the caller's token before the agent saw a request. In a pod nothing does, so a neighbouring workload could call the agent as any user. Many users share a pod, so each conversation's state is kept apart in code too."
    mitigations: [D3-APA, D3-CTS]
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/listener-authenticate-users.html
    verified: "2026-11-24"
  # <<< hosting rows
  # >>> more hosting rows (settings used only by a hosting variant of the server, inference, training and sandbox patterns)
  - id: eksSandboxNodes
    name: "Nitro Enclaves enabled on sandbox nodes (EnclaveOptions.Enabled)"
    where: "Amazon EC2 › node group launch template › EnclaveOptions.Enabled=true, a Nitro Sandbox AMI and a supported instance type; or an EKS Auto Mode NodePool for the sandbox pods"
    setVia: [apiCli, configFile]
    area: tools
    default: "Off; nodes advertise no sandbox capacity unless Auto Mode provisions them"
    requires: "Kubernetes 1.36 or later and an instance type that supports Nitro Sandboxes"
    recommended: "Run rollouts only on a dedicated, tainted node pool that advertises sandbox capacity. On your own node groups set EnclaveOptions.Enabled=true and build the Nitro Sandbox AMI; on Auto Mode keep the NodePool off FIPS, GPU and Neuron AMIs."
    value: "Dedicated, tainted pool with sandbox capacity"
    why: "A node that does not advertise sandbox capacity cannot run an isolated pod. Dedicated sandbox nodes keep every rollout behind the Nitro hypervisor and away from other workloads."
    mitigations: [D3-HBPI]
    url: https://docs.aws.amazon.com/eks/latest/userguide/sandboxing-isolated-setup.html
    verified: "2026-11-18"
  - id: eksSandboxNetworkIsolated
    name: "sandbox.amazonaws.com/network-isolated annotation"
    where: "Amazon EKS › rollout pod template › metadata.annotations (with runtimeClassName isolated-sandbox)"
    setVia: [configFile]
    area: network
    default: "Not set; the pod has a network device, a limited metadata service and Pod Identity credentials"
    recommended: "Set the annotation to \"true\" on every rollout that only runs code and needs no network. Use exec probes, and collect results over exec or logs, which still work."
    value: "Set to true on every rollout that needs no network"
    why: "The sandbox boots with no network interface, DNS, metadata service or Pod Identity credentials, so there is no route to filter and no credential to steal."
    mitigations: [D3-NI, cap-agent-egress-control]
    url: https://docs.aws.amazon.com/eks/latest/userguide/sandboxing-network-isolation.html
    verified: "2026-11-18"
  - id: eksSandboxPodSpecRbac
    name: "RBAC and admission control on sandbox pod specs"
    where: "Kubernetes › Role and RoleBinding in the run namespace; ValidatingAdmissionPolicy on pods and SandboxClaims that use the isolated-sandbox runtime class"
    setVia: [clusterPolicy]
    area: identity
    default: "Anyone with pod create permission in the namespace can author a sandbox pod"
    recommended: "Only the orchestrator's identity may create or change pods and SandboxClaims in the run namespace; an admission policy fixes the runtime class, image registry, mounts and service account and rejects anything else."
    value: "Orchestrator only, specs fixed by admission policy"
    why: "AWS treats the pod spec as trusted input: whoever writes it chooses the image and the mounts. A rollout must never be able to submit or edit one."
    mitigations: [D3-APA]
    url: https://docs.aws.amazon.com/eks/latest/userguide/sandboxing-security-model.html
    verified: "2026-11-18"
  - id: microVmPerRollout
    name: "One MicroVM per rollout (run-microvm, maximum duration)"
    where: "AWS Lambda MicroVMs › run-microvm --maximum-duration-in-seconds and --idle-policy; one MicroVM per rollout, never reused"
    setVia: [apiCli, code]
    area: tools
    default: "Maximum duration up to 8 hours; snapshot content is shared by every MicroVM run from one image version"
    recommended: "Call run-microvm for every rollout with the maximum duration set to the task budget, and terminate it when the episode ends. Generate IDs and secrets in the /run hook, not at image build."
    value: "One MicroVM per rollout, capped at the task budget"
    why: "Each rollout gets its own Firecracker microVM, so nothing one episode does reaches another. The duration cap ends a run that never stops by itself."
    mitigations: [D3-EI, D3-HBPI]
    url: https://docs.aws.amazon.com/lambda/latest/dg/microvms-launching.html
    verified: "2026-11-18"
  - id: microVmVpcEgress
    name: "Egress network connector (VpcEgressConfiguration)"
    where: "AWS Lambda › create-network-connector (SubnetIds, SecurityGroupIds, operator role); referenced by ARN on run-microvm"
    setVia: [apiCli]
    area: network
    default: "Public internet access on the egress path"
    requires: "An IAM operator role that lets Lambda create network interfaces in the VPC"
    recommended: "Create one connector on the sandbox subnets and security groups, behind Network Firewall and DNS Firewall, and pass it on every run-microvm call; let only the orchestrator role call run-microvm."
    value: "One connector behind Network and DNS Firewall"
    why: "A MicroVM has public internet access unless a VPC egress connector is attached. With it, outbound traffic is subject to your security groups, routes and firewalls. Connectors are fixed when run-microvm is called and cannot change while the MicroVM runs."
    mitigations: [cap-agent-egress-control, D3-NI]
    url: https://docs.aws.amazon.com/lambda/latest/dg/microvms-networking.html
    verified: "2026-11-24"
  - id: microVmExecutionRole
    name: "Execution role (MicroVM runtime)"
    where: "AWS Lambda MicroVMs › execution role (an IAM role trusted by lambda.amazonaws.com), separate from the build role"
    setVia: [cloudPolicy, apiCli]
    area: identity
    default: "None; the MicroVM cannot call AWS services or write logs"
    recommended: "A role separate from the build role, allowed only to write the rollout log group and call the one inference endpoint and package repository the episode needs."
    value: "Separate role: its log group, endpoint and repository"
    why: "Code in the MicroVM acts with this role, so it is the whole of what a rollout can do in AWS. Lambda runs the runtime lifecycle hooks under the same role."
    mitigations: [D3-AA]
    url: https://docs.aws.amazon.com/lambda/latest/dg/microvms-security.html
    verified: "2026-11-18"
  - id: microVmIngressTokens
    name: "Ingress connector and port-scoped auth tokens"
    where: "AWS Lambda MicroVMs › run-microvm --ingress-network-connectors (HTTP_INGRESS or NO_INGRESS); create-microvm-auth-token --allowed-ports --expiration-in-minutes"
    setVia: [apiCli, cloudPolicy]
    area: identity
    default: "Requests need a valid token; you choose its ports and expiry"
    recommended: "Use NO_INGRESS where the episode starts from the /run hook; otherwise HTTP_INGRESS with tokens of 15 to 30 minutes scoped to the harness port, minted only by the orchestrator role. Never attach SHELL_INGRESS. Host the lifecycle hooks on a dedicated port, so a token for the harness port cannot reach them."
    value: "NO_INGRESS, or 15 to 30 minute port-scoped tokens"
    why: "A token is the only gate on a MicroVM endpoint, and a token for the hook port can call the lifecycle hooks. Short, port-scoped tokens keep that with the orchestrator."
    mitigations: [D3-APA]
    url: https://docs.aws.amazon.com/lambda/latest/dg/microvms-networking.html
    verified: "2026-11-24"
  - id: microVmTerminate
    name: "terminate-microvm"
    where: "AWS Lambda MicroVMs API, called from your incident runbook for every MicroVM listed by list-microvms for the image"
    setVia: [apiCli]
    area: tools
    default: "MicroVMs run until terminated, suspended past their limit or past the maximum duration"
    recommended: "Runbook order: stop the orchestrator queue, list MicroVMs for the image version, terminate each, then revoke the execution role sessions in IAM."
    value: "Stop queue, terminate each MicroVM, revoke sessions"
    why: "Suspended MicroVMs keep memory and disk and can resume on traffic, so a stop must terminate them, not wait for them to idle out. With an idle policy, a MicroVM that gets no endpoint traffic is suspended with its memory and disk, so a rollout that works without inbound traffic needs automatic suspension off, and its end state is read before termination."
    mitigations: [cap-agent-kill-switch]
    url: https://docs.aws.amazon.com/lambda/latest/dg/microvms-launching.html
    verified: "2026-11-24"
  - id: albJwtValidation
    name: "jwt-validation action (Verify JWTs)"
    where: "Application Load Balancer › HTTPS listener › rule actions (jwt-validation before the forward action)"
    setVia: [apiCli, adminConsole]
    area: identity
    default: "No token check; the listener forwards every request"
    requires: "An HTTPS listener; RS256-signed tokens; a publicly accessible JWKS endpoint whose response is at most 150 KB and 10 keys. AgentCore Gateway cannot sign SigV4 to a load balancer, so its target authenticates with OAuth client credentials or an API key"
    recommended: "Add a jwt-validation action on the internal load balancer's HTTPS listener with your issuer and JWKS endpoint, and required claims for audience and scope; validate again in the server if handlers read the tenant."
    value: "jwt-validation with issuer, audience and scope"
    why: "Runtime's inbound authoriser no longer checks tokens before your code runs. The load balancer rejects a call whose token is not from your issuer or not meant for this server."
    mitigations: [D3-APA, D3-CTS]
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/listener-verify-jwt.html
    verified: "2026-11-24"
  - id: gatewayMcpPrivateEndpoint
    name: "Private endpoint (privateEndpoint) on the MCP server target"
    product: "AgentCore Gateway"
    where: "AgentCore Gateway › MCP server target › privateEndpoint (managedVpcResource: VPC, subnets, security groups)"
    setVia: [apiCli]
    area: network
    default: "Targets are reached at a public address"
    requires: "An internal load balancer with a certificate the gateway trusts"
    recommended: "Give the MCP server target a privateEndpoint in the cluster VPC and allow inbound traffic to the internal load balancer only from that endpoint's security group."
    value: "privateEndpoint in the cluster VPC"
    why: "The server no longer sits behind Runtime's endpoint. A private target keeps the load balancer off the internet, so callers reach the server only through the gateway."
    mitigations: []
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-vpc-egress.html
    verified: "2026-11-18"
  - id: apiGatewayJwtAuthorizer
    name: "JWT authorizer (HTTP API)"
    where: "Amazon API Gateway › HTTP API › Authorization › JWT authorizer (Issuer, Audience) attached to the /mcp route with authorizationScopes"
    setVia: [apiCli, adminConsole]
    area: identity
    default: "Routes are open until an authoriser is attached"
    requires: "RSA-signed tokens from an issuer with a JWKS endpoint"
    recommended: "Attach a JWT authoriser to every route but health, with your user pool as issuer, this server's resource as audience and the tool scopes as authorizationScopes, so ID tokens, which carry no scopes, are refused. Where the gateway signs with SigV4, which API Gateway verifies, use IAM authorisation instead."
    value: "JWT authoriser on /mcp with audience and scopes"
    why: "Runtime's inbound authoriser no longer checks tokens before your code runs. API Gateway rejects a call whose token is from another issuer, for another audience or without the scope."
    mitigations: [D3-APA, D3-CTS]
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/http-api-jwt-authorizer.html
    verified: "2026-11-24"
  - id: smModelExecutionRole
    name: "Execution role (ExecutionRoleArn) per model"
    where: "SageMaker AI › CreateModel ExecutionRoleArn; one IAM role per endpoint"
    setVia: [cloudPolicy, apiCli]
    area: identity
    default: "Whatever role the model is given"
    recommended: "One role per served model, allowed to read only that release prefix in the artifact bucket, pull its image from ECR and write its logs; passed only by the deployment pipeline."
    value: "One role per model, reading only its release prefix"
    why: "SageMaker reads the weights with this role in place of a pod's role, so an endpoint can load its own release and nothing else."
    mitigations: [D3-AA, AML.M0005]
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-roles.html
    verified: "2026-11-18"
  - id: smInvokeEndpointPolicy
    name: "sagemaker:InvokeEndpoint and sagemaker:CallWithBearerToken permissions"
    where: "IAM › identity policies and service control policies on sagemaker:InvokeEndpoint and sagemaker:InvokeEndpointWithResponseStream scoped to the endpoint ARN, plus sagemaker:CallWithBearerToken, which only accepts Resource \"*\""
    setVia: [cloudPolicy]
    area: identity
    default: "Any identity in the account whose policies allow the actions can invoke"
    recommended: "Allow these actions on each endpoint only to the role meant to call it (the gateway's role in front of a serving tier, the rollout role for a policy server), conditioned on your SageMaker Runtime interface endpoint; deny them to every other role. Keep bearer tokens to minutes, not the 12-hour default."
    value: "Gateway's role only, via your interface endpoint"
    why: "The endpoint has no API key of its own. IAM on the invoke actions is what stops an application or a rollout calling a model directly and skipping the gateway."
    mitigations: [D3-AA, D3-ACH]
