      - { between: ["OpenShift AI", "NVIDIA NIM"], what: "An NVIDIA NIM model serving platform deploys NIM through the OpenShift AI dashboard", url: "https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/3.5/html/deploying_models/deploying_models_on_the_nvidia_nim_model_serving_platform" }
      - { between: ["Model catalog", "Model registry", KServe], what: "Discover in the catalog, register and version, then deploy to a serving runtime", url: "https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/3.5/html/managing_model_registries/overview-of-model-registries_managing-model-registries" }
      - { between: [EvalHub, garak, MLflow], what: "Red teaming runs through EvalHub or KFP; EvalCards land as MLflow or OCI artifacts", url: "https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/3.5/pdf/release_notes/Red_Hat_OpenShift_AI_Self-Managed-3.5-Release_notes-en-US.pdf" }
      - { between: ["Red Hat build of Agent Sandbox", "OpenShift sandboxed containers"], what: "Sandboxes pick VM isolation through runtimeClassName kata", url: "https://docs.redhat.com/en/documentation/openshift_sandboxed_containers/1.13/html/deploying_red_hat_build_of_agent_sandbox/discover-agent-sandbox_agent-sandbox" }
      - { between: ["Training Hub", "Kubeflow Trainer"], what: "Training Hub fine-tuning distributes across nodes through Kubeflow Trainer", url: "https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/3.5/html/customize_models_for_gen_ai_and_agentic_ai_applications/overview-of-the-model-customization-workflow_custom-models" }
      - { between: ["Red Hat Connectivity Link", "Red Hat build of Keycloak"], what: "OIDC and auth policies validate Keycloak-issued tokens on Gateway API routes.", url: "https://developers.redhat.com/articles/2026/02/12/build-zero-trust-environment-red-hat-connectivity-link" }
      - { between: ["Red Hat Connectivity Link", "Models-as-a-Service"], what: "TokenRateLimitPolicy meters token use per subscription tier on a MaaS endpoint.", url: "https://developers.redhat.com/articles/2026/02/18/manage-ai-resource-use-tokenratelimitpolicy" }
