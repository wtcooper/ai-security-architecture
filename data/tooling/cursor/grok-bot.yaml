      - mitigation: cap-agent-kill-switch
        coverage: partial
        mechanism: >-
          Grok Bot Computers → Terminate VMs (organisation admins, Enterprise); Manage Group Access or Enable Grok
          Bot off (/grok-bot/disable); member removal; identity-provider session revocation
        steps:
          - title: Stop running work
            body:
              - Open Grok Bot Computers → Manage, select members, and choose Manage selected → Terminate VMs;
                running work stops, the operation runs on Cursor's side, and a progress card reports each member
                as complete, skipped or failed.
            url: https://cursor.com/docs/grok-bot/computers
          - title: Keep it stopped
            body:
              - Terminating does not remove access, so turn the member's group off in Manage Group Access or turn
                Enable Grok Bot off, remove the member from the team, and revoke their identity-provider sessions.
            url: https://cursor.com/docs/grok-bot/teams
        note: >-
          For personal/member computers, an organisation admin (team admin rights are not enough; Enterprise only)
          can stop running Bots for any member, in bulk, from the vendor control plane, and the dashboard reports
          each stop as complete or failed. Delay: no time bound is published (members are processed in batches
          and large operations take a while), so the per-member result is the evidence. A terminated computer
          restarts on the member's next message on the same durable disk, and the enable switch and group
          removal block future work without saying whether they stop a running turn, so pair terminate with
          access removal. Stopping does not undo completed actions; grok_bot_vm and grok_bot_vm_bulk audit events
          record the kill. Termination coverage for shared Team Bot computers and independently running
          delegated Cloud Agents must be verified separately; the personal-computer operation does not
          establish an atomic stop across those paths.
        verified: "2026-10-03"
        migration:
          from:
