      - at: gateway->internalTools
        text: "In Microsoft's baseline, tool traffic leaves through the agent's subnet and Azure Firewall, not through API Management. Putting your tool servers behind API Management is this mapping's choice."
        url: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/baseline-microsoft-foundry-chat
