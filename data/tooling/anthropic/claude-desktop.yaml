                Turn on "Require trusted devices" at Organization settings > Capabilities > Remote sessions.
            url: https://code.claude.com/docs/en/remote-control#trusted-devices
        note: >-
          Partial by the rule applied to toolClaudeCowork: MFA is configured in the IdP, not in Claude, which
          documents no second-factor requirement of its own. Paths that skip a fresh challenge: the desktop's
          signed-in session (kept while the user stays active unless Shortened session length is set) and
          personal accounts on unmanaged devices. Trusted Devices is a beta and applies only to sessions started
          after it is turned on. Claude Desktop on 3P has no Anthropic identity unless managed from the admin
          console; sign-in is the provider's or the organisation's IdP.
        verified: "2026-10-30"
      - mitigation: cap-agent-action-policy-enforcement
        coverage: partial
        mechanism: >-
          Standard deployments: on/off device keys for local MCP servers (isLocalDevMcpEnabled) and desktop
          extensions (isDesktopExtensionEnabled) and the extension allowlist, with no per-tool rule for a local
          server; Claude Desktop on 3P: managedMcpServers toolPolicy (allow / ask / blocked per tool name, with
          wildcards) enforced in the desktop host process, plus allowedPluginMcpServers and
          deniedPluginMcpServers
        steps:
          - title: Remove local tools where they are not needed
            body:
              - >-
                Set isLocalDevMcpEnabled false and, unless you govern extensions with the allowlist,
                isDesktopExtensionEnabled false in the Claude Desktop policy.
            url: >-
              https://support.claude.com/en/articles/12622667-enterprise-configuration-for-claude-desktop
          - title: Write per-tool policy for managed servers (Claude Desktop on 3P)
            body:
              - >-
                Give each managedMcpServers entry a toolPolicy, for example "*": "blocked" with exact "allow"
                entries for approved tools; when isLocalDevMcpEnabled false comes from the same MDM profile, only
                that profile's local managed servers start.
            url: https://claude.com/docs/third-party/claude-desktop/configuration
        note: >-
          Partial by the rule: on standard deployments the decision is whole-server or whole-extension, because
          connector permissions "don't govern connectors a member runs locally on their own machine", and
          nothing matches a local tool's arguments. The 3P toolPolicy is a deterministic per-tool decision
          enforced outside the prompt UI, but it matches tool names only and covers only servers listed in
          managedMcpServers; Claude Code's own managed settings take priority in Code sessions. Policy for the
          Code and Cowork tabs is on toolClaudeCode and toolClaudeCowork.
        verified: "2026-10-30"
      - mitigation: cap-ai-vendor-assessment
        coverage: external
        mechanism: >-
