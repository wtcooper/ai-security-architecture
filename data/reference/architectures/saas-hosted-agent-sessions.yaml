id: archHostedAgentSessions
surface: surfaceSaas
rank: 3
title: Coding & desktop session managed agent runtime
abbrev: Coding & desktop runtime

summary:
  - >
    A vendor-operated agent performs bounded coding or desktop work in a hosted task environment.
    Vendor interfaces, repository events or schedules initiate the session. The coding profile
    shown here produces a reviewed change; desktop work requires authorization before application
    or file effects, with an explicit lifetime for retained sessions and artifacts.

description:
  - >
    The provider operates the loop and task environment. Verify the selected product's isolation
    unit, credentials, retained state and cleanup behavior; ending compute does not necessarily
    delete conversation history, files or grants. Persistent personal and shared teammates belong
    to the persistent managed agent reference even when they delegate bounded coding sessions here.
  - >
    For coding tasks, repository content, issue text and review comments enter as untrusted
    material. Authorize triggers separately from the content they carry. Limit branch and
    repository permissions, require human review before merge, and gate privileged workflows.
    A merge gate does not authorize earlier network requests or connector effects.
  - >
    For general desktop tasks, the completion gate is the permitted application or file action,
    not a pull request. Apply the supported tool, destination and approval controls before that
    effect. Saved files, browser sessions and connector grants need their own retention and
    revocation rules. Local-computer access is a separate optional execution path.
  - >
    In the provider-hosted mode represented here, inference stays with the provider. A customer
    gateway governs only traffic actually routed through it. Shell network policy, repository
    access, backend connectors and browser access may have separate enforcement paths; verify
    each enabled path rather than assuming one allowlist covers the service.
  - >
    Record the initiator, workload identity and downstream credential separately. Products may
    use user grants, a repository App, or a shared automation account. These choices determine
    who can start a task, what it can change, and which grants must be revoked when it stops.

  - >
    The critical boundary is the way back in. To be useful the agent needs our code bases and
    data, and it reaches them through exactly two controlled crossings: a GitHub App installed
    on named repositories of our GitHub Enterprise Cloud, admitted only from the vendor's
    published IPs, for code; and an outbound-only tunnel we run to our AI gateway, for tool
    calls to our tool servers and the data behind them. Source control is never behind the
    gateway, and nothing else of the vendor's crosses into our systems.
distinguishedBy:
  - >
    Against endpoint coding and desktop agents: the loop and selected task environment are hosted.
    Optional local access or customer-operated workers require their own execution controls;
    endpoint policy does not automatically follow the hosted session.
  - >
    Against the API/SDK managed agent runtime: vendor product surfaces normally initiate and
    present the task. In the API reference, a customer-built application integrates the loop,
    binds callers to sessions, and handles custom tools and approval events.
  - >
    Against persistent managed agents: this is a bounded task service. Durable artifacts alone
    do not make it a continuing teammate with ongoing cross-task authority. That drawing lists
    the differences: retained state, channel and scheduled triggers, standing grants, approval
    at dispatch, and a stop that must also clear what the agent kept.

exemplars:
  - name: OpenAI Codex cloud
    note: >
      Hosted coding tasks in configured environments, producing changes for review. Cloud
      environment and network settings govern this mode; local Codex settings are a separate surface.
    url: https://learn.chatgpt.com/docs/cloud
    asOf: "2026-10"
  - name: Cursor Cloud Agents
    note: >
      Hosted coding agents started from Cursor and supported integrations. Review repository
      grants, environment network policy and whether the initiator is a person or shared automation.
    url: https://cursor.com/docs/cloud-agent
    asOf: "2026-10"
  - name: GitHub Copilot cloud agent
    note: >
      Coding work through GitHub's hosted agent workflow and pull requests. Repository permissions,
      workflow approval and human review define the promotion boundary.
    url: https://docs.github.com/en/copilot/concepts/agents/cloud-agent/about-cloud-agent
    asOf: "2026-10"
  - name: Claude Code in the cloud
    note: >
      Claude Code sessions on managed task environments, with repository and network configuration.
      Self-hosted execution changes the worker boundary while provider orchestration remains separate.
    url: https://code.claude.com/docs/en/claude-code-on-the-web
    asOf: "2026-10"
  - name: Claude Cowork in the cloud
    note: >
      General work in temporary hosted session environments with retained sessions and files.
      App actions need their own authorization; availability and cloud defaults vary by plan and rollout.
    url: https://support.claude.com/en/articles/14479288-claude-cowork-architecture-overview
    asOf: "2026-10"
  - name: ChatGPT Work Cloud
    note: >
      General tasks in a selected cloud environment. Check local-access and execution-location
      settings; application effects require authorization independently of any coding review workflow.
    url: https://learn.chatgpt.com/docs/get-started-with-work
    asOf: "2026-10"

zones:
  - id: zoneUser
    owner: user
    note: >
      The developer at the keyboard for the hand-off and the review, and the same person — or,
      on a chat surface, not necessarily the same person — steering from a phone, a browser or
      a channel while the session runs.
  - id: zoneEndpoint
    owner: endpoint
    note: >
      The local harness is only a door on this drawing: it pushes a branch and a conversation
      summary up, and pulls the cloud branch back on teleport. Nothing on the machine executes
      on the session's behalf.
  - id: zoneCloud
    owner: cloud
    note: >
      Our GitHub Enterprise Cloud tenant, reached by the vendor's GitHub App; the tunnel the
      vendor's connector calls arrive through; our gateway, and the tool servers and systems
      behind it.
  - id: zoneVendor
    owner: vendor
    note: >
      Two blocks for the agent vendor, because a session is admitted by one and executed by
      the other: the control plane — settings, environments, the relay and the scheduler — and
      the runtime that holds the loop, the model and the sandbox. Beneath the runtime, the
      vendor's connectors to the SaaS we approved. What they operate inside each is assured,
      not drawn.
  - id: zoneExternal
    owner: external
    note: >
      What the session reaches out to under its egress policy: package registries in the setup
      phase, public repositories and the open web in the agent phase. Every edge here is opened
      from the vendor's side; nothing in this band connects back in.
  - id: zoneGovernance
    owner: governance
    note: >
      On a runtime we do not operate, this band is where the vendor's exports are fused with
      our record — and where "stop this agent" has to be defined with its delay, because
      revoking an App or a seat does not stop a running session.

blocks:
  - id: developer
    kind: actor
    title: Developer
    icon: person
    zone: zoneUser
    col: 0
    row: 1
    note: >
      Present at the start and at the end — the hand-off and, on the coding profile, the merge
      — and absent for the run in between. General desktop work has no merge: its approval
      comes before each consequential application or file effect.

  - id: remoteDevice
    kind: service
    title: Remote device
    cosaiComponent: componentAgentUserQuery
    zone: zoneUser
    col: 0
    row: 0
    note: >
      The doors that start and steer a session with nobody at the machine: the vendor's web
      and mobile apps (claude.ai/code, chatgpt.com/codex, GitHub's agents panel), and an
      @-mention in a chat channel. Admission is the vendor's account
      binding for the first and whoever the channel admits for the second — the widest
      admission decision on the drawing.
    items:
      - id: phoneWeb
        label: Vendor apps
        icon: phone
        note: The vendor's phone and browser apps on the owner's device, signed into the vendor account the session is bound to.
      - id: chatChannels
        label: Chat channels
        icon: chat
        note: >
          A session raised from Slack, Teams or Linear runs on the vendor's cloud under a
          shared channel identity on most products — not as the person who typed.

  - id: harness
    kind: service
    title: Local applications
    cosaiComponent: componentApplication
    zone: zoneEndpoint
    col: 1
    row: 1
    note: >
      The vendor's application on the machine — CLI, editor extension or desktop app — drawn
      only as far as this drawing uses it: the app that starts or hands off a session. "Continue in the cloud", a prefix on the prompt or a delegate command pushes the
      working branch and a summary of the conversation up and starts a session from it;
      teleport brings the cloud branch and its history back. The full anatomy — native tools,
      memory, the local model path — is the endpoint drawing's, and nothing of it executes
      on this drawing's path.
    items:
      - id: apps
        label: Desktop, CLI & IDE apps
        icon: code
        note: >
          The vendor's desktop app, CLI or editor extension starting or handing off a session —
          choosing cloud for a task, "continue in the cloud", or a delegate command. The loop
          itself runs in the managed runtime.

  - id: sourceControl
    kind: service
    title: Source control
    cosaiComponent: componentDataSources
    zone: zoneCloud
    col: 3
    row: 2
    note: >
      The one tier that is ingress, egress, definition and gate at once on the coding profile.
      Issue text, comments and review threads enter the session as instruction; a branch and a
      draft pull request come back out; the instruction files, setup scripts and environment
      configuration committed beside the code are the session's definition; review, merge and
      "approve and run workflows" are the gate. It is our GitHub Enterprise Cloud tenant, so it
      sits in our band, and the vendor reaches it only through a GitHub App installed on named
      repositories, admitted by the enterprise IP allow list from the vendor's published IPs —
      under branch protection, CODEOWNERS on the agent's own configuration and a rule for who
      may trigger a run.
    items:
      - id: repos
        label: Repositories & instruction files
        icon: code
        note: >
          The code, and CLAUDE.md, AGENTS.md, setup scripts, hooks and MCP configuration —
          content that executes as instruction and is versioned like code because it is code.
      - id: threads
        label: Issues & PR threads
        icon: chat
        note: >
          Writable by anyone the repository admits, read by the session as instruction. Hidden
          characters and HTML comments carry payloads the human reviewer never sees.
      - id: prs
        label: Pull requests & CI
        icon: shield
        note: >
          The draft the session opens, the review a person gives, the workflows the pull
          request would fire — and the single branch the session may write.

  - id: managedRuntime
    kind: provider
    title: Managed runtime
    cosaiComponent: componentReasoningCore
    zone: zoneVendor
    col: 5
    row: 0
    rowSpan: 4
    note: >
      The vendor's own agent, hosted: the loop, context assembly and compaction, the
      model, session state and one sandbox per session, on compute the vendor operates. What
      we configure about it — the environment, the network policy, the credentials it may
      draw — is drawn as pins on this block and on the sandbox nested inside it; the execution
      behind them is assured, not inspected. Product-specific caveats — retention, session
      sharing, snapshot lifetimes, which plans get proxied credentials — belong on the
      exemplars and the tool records, not here.
    items:
      - id: agentLoop
        label: Agent harness
        icon: agent
        note: >
          Their harness running the repository's instructions — the loop, context assembly,
          compaction and retries, theirs to operate — with the built-in tools nested beneath.
      - id: inference
        label: Model inference
        icon: model
        note: >
          Their model, called inside their boundary. It does not cross our AI gateway in the
          hosted mode drawn here; verify per product, including the worker variants.
      - id: managedMemory
        label: Memory store
        icon: folder
        note: >
          Agent-written memory and session transcripts the vendor holds: persisted after the
          browser closes, shareable on some plans, and merged into later sessions on the
          products that ship auto-memory.
      - id: vault
        label: Credential vault
        icon: key
        note: >
          The git proxy that substitutes a scoped credential so the sandbox never holds the
          repository token, the environment secrets that exist only in the setup phase, and
          the runtime secrets redacted from transcripts — each a different product's answer to
          the same requirement, and the plan-gated gaps recorded per product.
      - id: mcpClient
        label: MCP client
        icon: plug
        note: >
          The harness's own MCP client. On most products its calls leave through the vendor's
          connector proxy, outside the sandbox's network policy — which is why the path to our
          servers is drawn from the runtime rather than from Native tools, and why the
          connector allowlist is a control-plane setting rather than a sandbox one.

  - id: nativeTools
    kind: provider
    title: Native tools
    cosaiComponent: componentTools
    zone: zoneVendor
    parent: managedRuntime
    col: 0
    row: 0
    note: >
      The sandbox: a microVM or container created for the session and reclaimed after it,
      holding the file tools, the shell, the skills the repository names and the hosted
      browser where the product offers one. Two phases where the product has them — setup
      with network for dependencies, then the agent phase under the environment's allowlist.
      Drawn because what it may reach is ours to author; where a product moves execution to a
      worker we run, this block is what moves.
    items:
      - id: editTools
        label: File & edit tools
        icon: folder
        note: Read, write, edit, glob and grep across the cloned repository.
      - id: shell
        label: Shell commands
        icon: code
        note: >
          Command execution inside the session sandbox — and the place a hook, a task file or
          a virtual-environment interpreter written now is executed later by a tool nobody
          sandboxed.
      - id: skills
        label: Installed skills
        icon: gear
        note: >
          Packaged instructions the repository or the environment names, downloaded at session
          start — content that executes as instruction.
      - id: computerUse
        label: Computer use
        icon: eye
        note: >
          The hosted browser and remote desktop, where offered: the widest reach a session can
          be given, and the one whose content returns unclassified.

  - id: vendorService
    kind: provider
    title: Vendor service
    cosaiComponent: componentApplication
    zone: zoneVendor
    col: 4
    row: 0
    note: >
      The published surfaces of the vendor's control plane: the settings that reach a hosted
      session (server-managed, never the device's), the shared environments an owner defines,
      the org-level switch for the hosted mode, the relay behind the phone and the channel,
      the scheduler behind routines and automations, and where connectors and the GitHub App are
      configured and approved. This is the tier a hosted session is admitted by and steered
      through; it runs nothing and opens no connection of its own — every data path leaves the
      runtime beside it, the tier the session executes in.
    items:
      - id: managedSettings
        label: Managed settings
        icon: gear
        note: >
          Server-managed settings and organisation-shared environments — network access level,
          environment variables, setup script — plus the toggles that enable hosted mode at all.
      - id: auditExport
        label: Session audit export
        icon: eye
        note: >
          Session logs, agentic audit events and compliance exports — whose coverage of the
          hosted surface differs by product and plan, and is verified rather than assumed.
      - id: remoteSessions
        label: Remote & scheduled sessions
        icon: phone
        note: >
          The relay that admits a phone or a channel to a running session, and the scheduler
          that starts one with nobody present at all.

  - id: tunnel
    kind: service
    title: Tunnel connector
    cosaiComponent: componentAgentUserQuery
    zone: zoneCloud
    col: 3
    row: 3
    note: >
      Vendor-supplied software we run inside our own network so the hosted runtime's MCP calls
      can reach our gateway without an inbound rule: it dials out, holds the connection open
      and carries the vendor's MCP requests in. Transport only — it does not authenticate to
      the upstream, and the payloads still traverse the vendor's cloud — so tool calls go to the
      AI gateway, never straight to a tool server or the data. Git uses neither the tunnel nor
      the gateway: it reaches our GitHub Enterprise Cloud through the vendor's GitHub App. The tunnel token and the TLS key on this host
      are the load-bearing secrets. Both first-party vendors ship one for their connectors
      (OpenAI's Secure MCP Tunnel for ChatGPT and Codex; Anthropic's MCP tunnels, an
      Enterprise research preview, for claude.ai connectors); where a product has none, the
      reach-back is an internet-facing gateway endpoint, recorded as a deviation.
    items:
      - id: tunnelClient
        label: Outbound connector
        icon: plug
        note: Dials out to the vendor's edge; opens nothing inbound.

  - id: aiGateway
    kind: service
    title: AI gateway
    zone: zoneCloud
    col: 2
    row: 3
    note: >
      The customer-operated crossing where the hosted runtime's MCP calls are admitted to our
      MCP servers: the one component on the reach-back path where the grant is ours to scope
      and revoke and the call is recorded on our terms. Not on the inference path: the hosted
      loop's model calls stay with the vendor.
    items:
      - id: gwTools
        label: MCP & API gateway
        icon: plug
        note: Which of our servers a hosted session may reach, and on whose grants.

  - id: internalTools
    kind: service
    title: Tool services
    cosaiComponent: componentTools
    zone: zoneCloud
    col: 2
    row: 4
    pack: toolServicesRemote
    note: >
      Our own MCP servers and connectors — ticketing, documentation, systems of record — that
      a hosted session is adopted in order to reach beyond the repository.

  - id: orgData
    kind: external
    title: Enterprise data
    cosaiComponent: componentDataSources
    zone: zoneCloud
    col: 3
    row: 4
    pack: enterpriseData
    note: The systems of record behind those servers, reached on grants we scope per session.

  - id: sources
    kind: external
    title: Public package sources
    zone: zoneExternal
    col: 6
    row: 3
    note: >
      What the setup phase installs from under the environment's allowlist. The reviewed setup
      script installs only pinned versions verified against lockfile hashes or signatures, and
      fails on a mismatch. A registry is also a write-capable host every allowlist permits.
    items:
      - id: registries
        label: Package registries
        icon: db
        note: PyPI, npm and the rest — pinned versions, verified against lockfile hashes at install.
      - id: hubs
        label: Skill & extension hubs
        icon: gear
        note: Skills and plugins the repository or the environment names, pinned to reviewed versions.

  - id: openWeb
    kind: external
    title: Open web
    cosaiComponent: componentDataSources
    zone: zoneExternal
    col: 6
    row: 2
    note: >
      What the sandbox searches and fetches in the agent phase, where the environment allows
      it. Every page is someone else's text, and it enters a loop nobody is watching as
      instruction.
    items:
      - id: webSearch
        label: Web search
        icon: search
        note: Results ranked by someone else, read as context.
      - id: pages
        label: Arbitrary pages
        icon: globe
        note: Visible and hidden text alike, served by whoever owns the page.

  - id: publicRepos
    kind: service
    title: Source control
    cosaiComponent: componentDataSources
    zone: zoneExternal
    col: 6
    row: 1
    note: >
      Public source control: open repositories a session clones read-only — an upstream
      dependency, an example, a project to patch. Untrusted like any page: the instruction
      files and issue text in someone else's repository are someone else's instructions.
    items:
      - id: publicRepositories
        label: Public repositories
        icon: code
        note: Cloned read-only, never with the session's write credential.

  - id: vendorTools
    kind: service
    title: Tool services
    cosaiComponent: componentTools
    zone: zoneVendor
    col: 5
    row: 4
    pack: toolServicesRemote
    note: >
      The vendor's connectors to the SaaS we approved — ticketing, chat, documents — called
      from the runtime under our agreement, on tokens the vendor holds, outside both the
      sandbox's egress policy and our gateway. A service outside any agreement is not
      connected.

  - id: govIdentity
    kind: governance
    title: Identity services
    icon: person
    zone: zoneGovernance
    col: 0
    row: 6
    mitigations: [ D3-APA ]
    note: >
      Who may start a session and as whom it runs: federated login and trusted devices at the
      vendor's account layer, and approved initiators at the repository host. The App
      installations, service identities and user-bound sessions a product acts through are
      inventoried in the registry, each with an owner and an expiry.

  - id: govSecrets
    kind: governance
    title: Secrets & key management
    icon: key
    zone: zoneGovernance
    col: 1
    row: 6
    mitigations: [ D3-CTS, D3-CH ]
    note: >
      The repository credential the proxy substitutes, the environment secrets that exist only
      in the setup phase, and the tunnel token and TLS key on the host we run for the
      reach-back — with the plan-gated gaps recorded per product rather than assumed of the
      class.

  - id: govPolicy
    kind: governance
    title: Policy & authorization
    icon: scale
    zone: zoneGovernance
    col: 2
    row: 6
    mitigations: [ AML.M0028, AML.M0029, AML.M0036, AML.M0031, cap-agent-egress-control, cap-input-guardrails ]
    note: >
      One branch, no merge, a human reviewer who is not the initiator, workflows that wait for
      approval, a network allowlist an administrator locks, a connector allowlist the session
      cannot widen — and a session budget, because an unattended loop bills by the minute.

  - id: govSupplyChain
    kind: governance
    title: Supply-chain assurance
    icon: db
    zone: zoneGovernance
    col: 3
    row: 6
    mitigations: [ cap-agent-tool-registry, cap-ai-vendor-assessment ]
    note: >
      Routines, automations, environments and connector registrations inventoried like agents,
      each with an owner; the platform assessed on a clock because its defaults move.

  - id: govObservability
    kind: governance
    title: Observability & response
    icon: eye
    zone: zoneGovernance
    col: 4
    row: 6
    mitigations: [ cap-agent-tracing, cap-agent-kill-switch ]
    note: >
      The vendor's session logs and agentic audit events exported and fused with the
      repository host's record and our gateway's — one trail per session, from trigger to
      merge — and a stop whose delay is known: disabling the App or the seat prevents the next
      session, not the one that is running.

edges:
  - from: developer
    to: harness
    path: primary
    bidir: true
    label: local session
    note: >
      The person at the keyboard, in the CLI, the editor or the desktop app — the same
      pattern as the endpoint drawings, used here only as far as the hand-off.
  - from: developer
    to: remoteDevice
    path: primary
    bidir: true
    label: away from the machine
    note: The same person on a phone or in a browser — or, on a chat surface, whoever the channel admits.
  - from: harness
    to: managedRuntime
    path: external
    bidir: true
    label: hand-off / teleport
    note: >
      The local conversation and the working branch become a hosted session; the cloud branch
      and its history come back the same way. Asymmetric on most products: a terminal session
      cannot be pushed up mid-task, but the desktop app can, and a finished cloud session can
      be pulled down.
  - from: remoteDevice
    to: vendorService
    path: external
    bidir: true
    label: start & steer session
    note: >
      The phone, the browser or the channel talks to the vendor's relay directly. Nothing we
      operate is on this path — a personal device on a cell network has no reason to traverse
      our egress — so admission is the vendor's account binding and whatever the managed
      settings allow, and on a channel it is whoever the channel admits.
  - from: vendorService
    to: managedRuntime
    path: primary
    bidir: true
    label: admission & settings
    note: >
      The control plane admitting a session to the runtime: which environment it runs in, what
      the server-managed settings permit, which connectors it may call, and — from the
      scheduler — sessions that start with nobody present at all. Status and results come back
      the same way for the person steering.
  - from: managedRuntime
    to: sourceControl
    path: external
    bidir: true
    label: GitHub App · IP allowlist
    note: >
      Both directions of our GitHub Enterprise Cloud tenant, on a GitHub App installed on named
      repositories and admitted by the enterprise IP allow list only from the vendor's published
      IPs; the vendor's git proxy holds the credential outside the sandbox. Inward: the code,
      instruction files and threads, and the events that start or steer work. Outward: the push to
      the session's own branch and the draft pull request — the only writes the installation
      allows. It never rides the tunnel or the AI gateway.
  - from: developer
    to: sourceControl
    path: primary
    bidir: true
    route: vh
    label: review & merge
    note: >
      The gate. A person reviews the draft, approves the workflows it would fire, and merges —
      or does not. Require that the initiator's approval does not count and that the agent
      cannot approve, mark ready or merge; verify that each product enforces both.
  - from: managedRuntime
    to: vendorTools
    path: external
    bidir: true
    label: approved connectors
    note: >
      The runtime's connectors calling the SaaS we approved from the vendor's side, on grants the
      vault holds. Its allowlist is a control-plane setting the session cannot widen; what
      these connectors return reaches the loop without crossing anything we run.
  - from: managedRuntime
    to: tunnel
    path: external
    bidir: true
    label: outbound-only tunnel
    note: >
      The reach-back path, and the crossing this drawing exists to govern: compute we do not
      operate calling back into our systems for data connectors, down a connection our side
      opened, so nothing is exposed inbound. Git does not use it: it reaches our GitHub
      Enterprise Cloud through the vendor's GitHub App. The public-endpoint form — the runtime calling an internet-facing
      gateway URL, admitted at our edge by the vendor's IP ranges — is recorded as a deviation
      rather than drawn as a second path.
  - from: tunnel
    to: aiGateway
    path: primary
    bidir: true
    label: tool call / result
    note: >
      Tool calls the tunnel hands to our gateway's aggregate MCP endpoint, never straight to a tool
      server or the data; git never comes this way — it reaches our GitHub Enterprise Cloud through the vendor's GitHub App:
      admitted on audience-bound tokens and per-user grants our own authorization server
      issued, per-call policy evaluated at the gateway, the servers and tools scoped to a named
      list, and every call recorded against the grant. The vendor's identity and IP ranges
      admit the caller; they authorise nothing.
  - from: aiGateway
    to: internalTools
    path: primary
    bidir: true
    label: brokered tool calls
    note: Which of our servers a hosted session may call, on short-lived grants we issue.
  - from: internalTools
    to: orgData
    path: primary
    bidir: true
    label: scoped reads & writes
    note: The records and systems the session was adopted to reach beyond the repository.
  - from: nativeTools
    to: sources
    path: external
    outbound: true
    label: setup installs
    note: >
      The setup phase installing the reviewed setup script's pinned, hash-verified
      dependencies under the environment's allowlist; a changed or unpinned package fails the
      install before the agent phase. That phase has network before the agent does and caches
      its result for the next user of the environment. The registry is also a write-capable
      host every allowlist permits, which is what makes it an exfiltration channel.
  - from: nativeTools
    to: openWeb
    path: external
    outbound: true
    route: hv
    label: web fetch under egress policy
    note: >
      The sandbox's own reach to the web in the agent phase, where the environment allows it —
      closed by default on some products, open by default on others — and the content that
      comes back as instruction.
  - from: managedRuntime
    to: publicRepos
    path: external
    outbound: true
    label: clone public repos
    note: >
      A read-only clone of a public repository — through the sandbox's egress or the vendor's
      git proxy, depending on the product — under the same allowlist. The session's scoped
      write credential belongs to the rented host alone.

pins:
  risks:
    - risk: riskPromptInjection
      at: managedRuntime->sourceControl
      note: >
        Issue text, comments, review threads and instruction files enter the session as
        instruction, and most are writable by people with no commit access. The dominant
        ingress of the archetype, and the one every 2026 incident used.
    - risk: riskPromptInjection
      at: nativeTools->openWeb
      note: >
        A fetched page enters a loop nobody is watching. On the products where the agent phase
        has internet by default this is the unclassified ingress the environment policy exists
        to close.
    - risk: riskSensitiveDataDisclosure
      at: nativeTools->sources
      note: >
        The package registries every setup allowlist permits are write-capable: a package
        publish carries whatever the sandbox holds to a public index, the route stolen tokens
        took in the vendor's own 2026 evaluation incidents.
    - risk: riskSensitiveDataDisclosure
      at: managedRuntime
      note: >
        The repository, the transcript, tool output and environment variables all live on
        their side under their retention terms; sessions persist after the browser closes,
        snapshots outlive the run, and on some plans a session can be shared publicly with
        private-repository content inside it.
    - risk: riskRogueActions
      at: managedRuntime->sourceControl
      note: >
        A push, a pull request, a reply on the thread — from a loop that reads its own
        thread. An agent's reply can fire comment-triggered automation, and an automation
        configured to approve low-risk pull requests removes the gate this drawing rests on.
    - risk: riskAgenticDelegationConfusedDeputy
      at: managedRuntime->sourceControl
      note: >
        The session exercises the user's grant, an App installation's, or a shared service
        identity's — whichever the product uses — and the repository host cannot tell an
        injected instruction from an intended one. What bounds it is the token's scope: one
        repository, one branch, no merge.
    - risk: riskInsecureIntegratedComponent
      at: nativeTools->sources
      note: >
        A malicious or compromised package or skill runs as root in the setup phase, with
        network, before the agent starts. Pinning and hash verification stop a changed
        artifact; they do not make a reviewed version benign.
    - risk: riskShadowAndUnknownAgents
      at: vendorService
      note: >
        A channel raises sessions for whoever it admits, a schedule runs them for an owner who
        may have left — on a grant nobody revoked — and none of it appears in any inventory we
        keep unless the vendor's export is queried.
    - risk: riskRunawayAgentToolLoops
      at: vendorService->managedRuntime
      note: >
        Automations that re-run on CI failure and review comments, and sessions that reply to
        their own threads, make a loop with no natural end — billed by the minute and bounded
        only by the budget the tenant sets.
    - risk: riskAgenticDelegationConfusedDeputy
      at: tunnel->aiGateway
      note: >
        Their infrastructure exercising our authority, steered by whatever the session read.
        The grant is the only thing bounding it, and the grant is issued at our gateway — which
        is the entire argument for drawing one and for never letting the vendor's tunnel or
        allowlisted IP range reach past it.
    - risk: riskPromptInjection
      at: managedRuntime->vendorTools
      note: >-
        Ticket text, chat messages and documents the vendor's connectors return enter the loop as model
        input, on a path nothing of ours inspects.
  mitigations:
    - mitigation: D3-APA
      at: vendorService
      note: >-
        Hosted mode is an organisation decision: enabled per role or group behind federated login and
        trusted-device enrolment, the relay bound to the owner's account, and the switches that widen it —
        personal-token setup, self-hosted runners, remote control — off until someone owns them. Zone-2
        configuration, because nothing we operate is on the remote path.
    - mitigation: AML.M0028
      at: vendorService
      note: >-
        The environment an administrator owns and locks: the connector and MCP allowlist the session
        cannot widen, the built-in tools enabled and the permission mode, with bypass modes removed.
        Unattended runs have no prompt to answer, so these settings are the whole of the in-session
        control.
    - mitigation: AML.M0036
      at: vendorService
      note: >-
        Session budgets, usage ceilings and automation caps in the tenant, because an unattended loop that
        re-triggers itself bills by the minute and nobody is watching the meter.
    - mitigation: D3-APA
      at: sourceControl
      note: >-
        The repository host's trigger policy admits only approved initiators — people with write access, and
        registered automations or schedules with a named owner and a bounded identity — to start or steer a
        session; non-collaborators and unregistered Apps or bots are refused. The setting that decides whether
        a public issue is an attack surface.
    - mitigation: D3-CTS
      at: managedRuntime
      note: >-
        The repository credential and the secrets stay out of the sandbox: the vendor's git proxy substitutes
        a scoped credential for a placeholder, and setup-phase secrets are removed before the agent runs.
        Environment variables are treated as visible to the model and to everyone who shares the environment.
        Where a product does not proxy, the credential is in the sandbox and the finding says so.
    - mitigation: AML.M0031
      at: managedRuntime
      note: >-
        What persists and who can read it: agent-written memory merged into later sessions, transcripts that
        can be shared, snapshots that outlive the run — each a setting whose default is wider than most
        adopters assume, set deliberately.
    - mitigation: cap-ai-vendor-assessment
      at: managedRuntime
      note: >-
        Their isolation, retention and tenancy assured by assessment rather than drawn — the only
        representation a vendor-internal control gets — and re-assessed on a clock, because the defaults move:
        egress on or off, self-approving automations, which plan gets proxied credentials, whether the audit
        export covers this surface.
    - mitigation: D3-EI
      at: nativeTools
      note: >-
        One microVM or container per session around the built-in tools, created for the run and
        reclaimed after it, with no shared filesystem between sessions. The vendor provides it, so it is
        verified per product — whether follow-up runs reuse the same machine, what survives between them
        — and the choices the product exposes, such as which runner a session uses, are ours to set.
    - mitigation: cap-agent-egress-control
      at: nativeTools
      note: >-
        The environment's network policy, authored by us and enforced by the vendor around the sandbox: an
        allowlist, locked by an administrator, with the setup phase separated from the agent phase and write
        methods restricted on the hosts the list must permit. Paths outside the sandbox's network — the git
        proxy, the connector proxy, inference — are verified per product and bounded elsewhere.
    - mitigation: AML.M0028
      at: sourceControl
      note: >-
        A token that reaches one repository and one branch, cannot push the default branch, mark ready,
        approve or merge; protected scopes and repository blocklists on the products that have them; a session
        that can reach only repositories its trigger could already reach.
    - mitigation: AML.M0029
      at: sourceControl
      note: >-
        The gate: a draft pull request a person reviews and merges, an initiator whose approval does not
        count, workflows that wait for "approve and run", and the agent's own configuration — instruction
        files, hooks, setup scripts, MCP config — under CODEOWNERS. It approves the output, not the actions
        taken to produce it: a session's tool calls and network effects have already happened when the
        reviewer arrives, which is why the sandbox and egress pins exist.
    - mitigation: D3-CH
      at: tunnel
      note: >-
        The tunnel token and TLS private key on this host are the load-bearing secrets on the path — issued
        scoped, rotated like a service credential, and revocable without redeploying the host. The tunnel
        carries traffic on them but never authenticates to our server; that is the gateway's job.
    - mitigation: AML.M0028
      at: aiGateway->internalTools
      note: >-
        Which servers and tools a hosted session may reach, on whose grant — a per-user, audience-bound grant
        our authorization server issued, never the vendor's service identity: one aggregate endpoint fronting a
        named list per vendor, read-mostly unless a write has a named owner. A marketplace that admits every
        server to every caller is the failure this pin exists to name.
    - mitigation: cap-input-guardrails
      at: aiGateway
      note: >-
        Tool and connector content returned through this gateway is classified here before it goes back to a
        loop we cannot see. Connectors the vendor calls directly never cross it, so this pin covers none of
        their content.
    - mitigation: cap-agent-tool-registry
      at: govSupplyChain
      note: >-
        Routines, automations, scheduled tasks, shared environments and App installations inventoried like
        agents, with an owner each — the population a hosted runtime makes cheap enough to sprawl.
    - mitigation: cap-agent-tracing
      at: govObservability
      note: >-
        The vendor's session logs — every commit linking to the session that made it — exported to our side and
        fused with the repository host's audit events and our gateway's record, so one session has one trail
        from trigger to merge. The export's coverage of the hosted surface is a per-product fact to verify.
    - mitigation: cap-agent-kill-switch
      at: govObservability
      note: >-
        Disable hosted mode in the tenant, uninstall the App, revoke the seat — and know the delay: none of it
        stops a session that is already running, so the stop for that is the vendor's cancel, and the finding
        names how long it takes.

walkthrough:
  title: A task handed to the cloud comes back as a pull request
  moves: >-
    A developer's conversation becomes a hosted session, the session works on the repository
    and reaches our systems through our gateway, and a person merges what it made. This is the
    coding profile; general desktop work ends at an authorized application or file action instead.
  steps:
    - follow: developer->harness
      label: local session
      note: The task starts at the keyboard, in the CLI, the editor or the desktop app.
    - follow: harness->managedRuntime
      label: hand-off
      note: >
        The working branch and a summary of the conversation go up; a session starts from
        them on the vendor's compute.
    - follow: vendorService->managedRuntime
      label: environment applied
      note: >
        The control plane admits the session to a shared environment: network access level,
        setup script, connectors, permission mode — the settings that reach a hosted session,
        none of which came from the device.
    - follow: managedRuntime->sourceControl
      label: clone via git proxy
      note: The sandbox clones through the proxy on a scoped credential it never sees.
    - follow: sourceControl->managedRuntime
      label: instructions & threads in context
      note: >
        The instruction files, the issue and the review thread enter the session as
        instruction — classified on the way in, because most of them were not written by us.
    - follow: nativeTools->sources
      label: pinned, verified installs
      note: >
        The reviewed setup script installs pinned dependencies verified against lockfile
        hashes — a mismatch fails the setup — and caches the result; then the network closes
        and the agent phase begins.
    - follow: managedRuntime->tunnel
      label: tool call down the tunnel
      note: >
        The runtime's MCP client calls back into us — the one crossing on the drawing where
        external compute reaches our systems — down the outbound-only connection our tunnel
        holds open.
    - follow: tunnel->aiGateway
      label: to our gateway
      note: >
        The tunnel hands the request to our gateway's aggregate MCP endpoint: admitted on a
        per-user grant we issued, evaluated per call, scoped to a named server list, recorded
        against the grant.
    - follow: aiGateway->internalTools
      label: per-session grant
      note: Admitted to a named server on a short-lived grant scoped to this session.
    - follow: internalTools->orgData
      label: read on our side
      note: The read happens on our side, which is the only reason it is bounded.
    - follow: orgData->internalTools
      label: record
      note: The record comes back.
    - follow: internalTools->aiGateway
      label: recorded
      note: Through the crossing, where the call is recorded against the grant.
    - follow: aiGateway->tunnel
      label: into the tunnel
      note: Classified at the gateway, then back into the connector.
    - follow: tunnel->managedRuntime
      label: tool result
      note: And back to the session.
    - follow: managedRuntime->sourceControl
      label: push branch, open draft PR
      note: >
        The session pushes to its own branch and opens a draft — the only write the token
        allows. Commits are signed and link back to the session.
    - follow: sourceControl->developer
      label: review & merge
      note: >
        A person reviews the draft, approves the workflows it would fire, and merges. The gate
        approves the output; everything the session did to produce it already happened.

scenarios:
  - title: A comment becomes a command
    steps:
      - follow: sourceControl->managedRuntime
        label: hostile issue in context
        note: >
          Someone with no commit access files an issue whose hidden text is an instruction.
          A session starts on it — or reads it while working on something else.
      - follow: nativeTools->openWeb
        label: attacker page fetched
        note: >
          The instruction sends the sandbox to a page the attacker controls, where the second
          stage waits — on a product where the agent phase has internet, or an environment
          where someone opened it.
      - follow: nativeTools->sources
        label: exfiltration via an allowed host
        note: >
          What the sandbox holds — environment variables, the clone, whatever the setup phase
          left behind — leaves through a host the allowlist permits: a package publish. The
          list said where the sandbox may talk, not what it may say.
      - follow: managedRuntime->sourceControl
        label: hook committed, PR opened
        note: >
          The session commits a hook, a task file or a workflow change into its branch and
          opens the draft. The payload is now in the repository, waiting for a tool nobody
          sandboxed to execute it.
      - follow: sourceControl->developer
        label: the gate holds — or not
        note: >
          A person is the last check: CODEOWNERS on the agent's configuration directories,
          required review, and workflows that wait for approval are what stand between the
          branch and the default branch.
  - title: "Nobody at the machine: a channel and a schedule"
    steps:
      - follow: developer->remoteDevice
        label: from a phone or a channel
        note: The owner on a phone — or, in a shared channel, anyone the channel admits.
      - follow: remoteDevice->vendorService
        label: session raised on the relay
        note: >
          The relay admits whoever the account binding or the channel allows; a session raised
          from a channel runs under a shared identity on most products.
      - follow: vendorService->managedRuntime
        label: scheduled & re-triggered runs
        note: >
          A routine fires on a schedule; an automation re-runs the session on every CI failure
          and review comment. The loop has no natural end and no person in it.
      - follow: managedRuntime->vendorTools
        label: the ticket, through a connector
        note: The run reads the ticket or thread it was raised from through the vendor's connector.
      - follow: vendorTools->managedRuntime
        label: its author's text, as input
        note: >
          Whatever the ticket's author wrote enters the loop as model input, on a path nothing of
          ours inspects.
      - follow: managedRuntime->sourceControl
        label: replies that trigger automation
        note: >
          The session's own replies on the thread fire comment-triggered automation — and an
          automation configured to approve low-risk pull requests approves its own.
  - title: "Variant: execution moves to a worker we run"
    steps:
      - follow: harness->managedRuntime
        label: same hand-off
        note: >
          In this variant the environment names a self-hosted runner. Orchestration and
          inference stay with the vendor; the sandbox, drawn here in the Vendor band, would
          run in our cloud.
      - follow: managedRuntime->sourceControl
        label: clone on our credentials
        note: >
          The git proxy leaves the path: our deployment supplies the git credential, our
          firewall becomes the egress policy, and isolation becomes our responsibility.
      - follow: nativeTools->sources
        label: installs through our firewall
        note: >
          Setup still installs pinned, verified packages from the public index, now through
          our firewall. Tool inputs and outputs still cross to the vendor's loop, and inference
          stays with the vendor.

deviations:
  - subject: The local harness is drawn as Local applications, a door rather than an anatomy
    reason: >
      The endpoint drawings carry the full Agent harness — Native tools, Memory & state, the
      local model path — and the registered data-chain pattern rightly requires any drawing
      with that block to reach our data through the gateway. Here nothing on the machine
      executes on the session's behalf: the local application appears because the hand-off
      pushes a branch and a conversation up and teleport pulls the cloud branch back, which is
      a real data crossing. It is drawn under the registered Local applications title with the
      loop item only, so a reader flipping between the drawings sees that the engine moved
      rather than that the endpoint lost something, and the pattern is not asserted of a block
      that does not carry it.
  - subject: Our source control is reached through a scoped GitHub App
    reason: >
      Our GitHub Enterprise Cloud tenant sits in our band: the policy on the data path — App
      installation scope, the enterprise IP allow list, branch protection, CODEOWNERS on agent
      configuration, who may trigger a run, "approve and run workflows" — is ours. Every major
      provider connects the same way: a GitHub App on named repositories, its credential held in
      the vendor's git proxy, admitted from the vendor's published IPs. A self-hosted GitHub
      Enterprise Server changes only the network path: the vendor's IPs allowlisted at our
      firewall, private connectivity where a vendor offers it (AWS PrivateLink or Cloudflare
      Tunnel), or execution moved inside on self-hosted runners — recorded here rather than drawn.
      The endpoint drawings reach the same block from the local agent's git, on the developer's
      own credentials; public repositories a session only clones are a second Source control
      block, in the External band.
  - subject: Two vendor blocks for one vendor
    reason: >
      The three-zone rule draws a vendor as one block. This drawing has two for the agent
      vendor because a session is admitted by one tier and executed by another, and the
      controls sit on different ones: the control plane carries the settings, the connector and
      App approvals, the relay and the scheduler, all of which we configure; the runtime carries
      the loop, the model, the sandbox and every connection out — git, tool calls and
      connectors — of which we configure only the reach. The endpoint drawing has the first,
      the API/SDK drawing the second; this one needs both.
  - subject: The tunnel is drawn; the public-endpoint reach-back is recorded
    reason: >
      The target state is the API/SDK sibling's: the vendor reaches our gateway through an
      outbound-only tunnel, so no MCP endpoint of ours faces the internet. Where a product has
      no tunnel, the runtime calls an internet-facing gateway URL instead,
      admitted at our edge by the vendor's published IP ranges — the same crossing with a
      weaker admission, because an inbound listener now exists. Either way the gateway, not
      the transport, is the control. Products whose tool calls leave from compute we run — a
      self-hosted runner or a privately networked one — reach the gateway from inside our
      network and need neither. Source control is not on this path: a rented code host is
      reached by the vendor over the internet, and a self-hosted one over the vendor's private
      connectivity where it offers any.
  - subject: The self-hosted execution variant is recorded as a scenario, not drawn
    reason: >
      Several products offer execution on workers we run — self-hosted environments, team
      pools, self-hosted runners — with orchestration and inference staying with the vendor.
      It would move the nested Native tools block into our cloud band and remove the git proxy
      from the path. It is a variant scenario here until an organisation adopts it, because a
      drawing that shows both at once implies a choice nobody has made; the scenario names the
      two facts to carry into that drawing when it comes — the credential proxy is gone, and
      inference stays with the vendor.
  - subject: Identity binding is absorbed into the vendor's account layer
    reason: >
      Access policy (D3-APA) is embodied by an identity provider, an authorization server or an
      Identity binding item elsewhere in the catalogue. On this drawing the binding is the
      vendor's account layer for the remote path and the repository host's write-access check
      for the event path; neither is a tier we run, so the capability is pinned on the control
      plane and on the event edge and the embodiment is absorbed into them.
  - subject: The AI gateway carries tool traffic only
    reason: >
      The vendor calls its own model inside its own runtime — drawn as the Model inference item
      on the Managed runtime block, with no Model provider block on this drawing — and the
      hosted mode drawn here does not route the loop's inference through us. The gateway is
      drawn with its one real traffic class rather than the registered aiGatewayTraffic pack,
      following the SaaS siblings: the honest signal that a gateway is not on the model path is
      its own contents.
  - subject: Native tools nest inside the Managed runtime, the fused-runtime exception
    reason: >
      The same exception the API/SDK sibling records (2026-09-09): the built-in tools are the
      vendor's coding-agent tool surface, bounded by an environment egress policy we author,
      and in the self-hosted variant they execute on a worker we run. What we configure, we
      draw. Unlike the sibling, edges do leave the nested block here — setup installs and web
      fetch — because the setup phase needs package registries and the agent phase may be
      given the web; the reference requires pinned, verified installs and an
      administrator-locked allowlist on both. Public clones leave from the runtime, because
      depending on the product they take the sandbox's egress or the vendor's git proxy.

