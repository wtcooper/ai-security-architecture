      - mitigation: D3-AA
        coverage: partial
        mechanism: >-
          tunnel_id plus a Restricted runtime API key (Tunnels Read + Use) authenticating tunnel-client to the
          control plane, optionally bound to a client certificate with a CEL filter; tunnels and keys listed
          and revoked in Platform settings and the Admin API; optional MCP-side mTLS toward our server
        steps:
          - title: Give each deployment its own runtime identity
            body:
              - >-
                On the Platform API keys page create a Restricted key with Tunnels Read + Use for each
                tunnel-client deployment, owned by a principal in the tunnel-runtime group, and never run the
                daemon on an admin key or an All key.
            url: https://github.com/openai/tunnel-client/blob/master/docs/permissions.md
          - title: Require a certificate from the workload
            body:
              - >-
                Upload and activate a trust anchor at Organization settings > Security > Mutual TLS for the
                key's organisation or project, optionally with a CEL filter on subject or SAN, and set
                control_plane.client_cert and client_key so tunnel-client polls mtls.api.openai.com.
            url: https://developers.openai.com/api/docs/guides/mutual-tls
          - title: Inventory and expire the identities
            body:
              - >-
                List tunnels with GET /v1/tunnels (tunnel-client admin tunnels list, admin key) and project API
                keys through the Admin API, and set a maximum API key lifetime in Platform settings so new
                runtime keys must expire.
            url: https://developers.openai.com/api/docs/guides/production-best-practices
          - title: Authenticate the tunnel to our server
            body:
              - >-
                Where the MCP server should see the tunnel as a caller, set MCP_CLIENT_CERT and MCP_CLIENT_KEY
                (MCP-side mTLS, HTTP bindings only) — a static credential that identifies the tunnel, not the
                user.
            url: https://github.com/openai/tunnel-client/blob/master/docs/configuration.md
        note: >-
          Partial by the rule: the tunnel's own workload identity is authenticated (runtime key, optionally a
          certificate OpenAI verifies), inventoried, expirable and revocable, but the pin's subject — each user's
          connector grant through the tunnel — is a ChatGPT app authorisation administered in ChatGPT
          (toolChatgptDesktop) and at the MCP server's authorisation server; the tunnel only forwards the
          connector's Authorization header to the configured MCP origin. By default the tunnel does not
          authenticate to our MCP server at all; MCP-side mTLS or a static MCP_EXTRA_HEADERS value are opt-in
          and static. Binding a user-owned runtime key to its owner's lifecycle rests on the RBAC rule that a
          key's permissions must also be held by its user (role and SCIM group changes propagate within 30
          minutes) — not documented for tunnels specifically; the tunnel-client permissions guide, checked by
          the vendor on 2026-04-24, also names a predefined per-tunnel User role.
        verified: "2026-09-25"
