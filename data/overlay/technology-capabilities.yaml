      - framework: nist-csf
        entry: PR.AA
        relationship: supports
        rationale: Authentication establishes identity for access decisions.
    mitigationMappings:
      - mitigation: D3-MFA
        rationale: Implements multi-factor verification for supported identities.
      - mitigation: D3-AA
        rationale: Authentication services can authenticate software agents.
  - id: tech-endpoint
