      - id: managedOnlineEndpoints
        kind: runtime
        name: "Azure Machine Learning managed online endpoints"
        url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-endpoints-online
        asOf: "2026-11"
        compare:
          runs: "Azure Machine Learning provisions virtual machines and runs your container or scoring script behind an endpoint; you supply the model, environment and instance size."
          patching: "Azure updates the host operating system image at least monthly; you redeploy to pick up patched base images and maintain any image you bring yourself."
          data: "Prompts and completions are processed on the deployment's virtual machines in the workspace region; weights are a registered model Azure ML mounts into the container."
          network: "The endpoint's public_network_access flag and the workspace private endpoint control inbound traffic; the workspace managed virtual network controls outbound traffic."
          identity: "The endpoint runs as a system-assigned or user-assigned managed identity fixed at creation; callers use a key, an Azure ML token or a Microsoft Entra token."
          accepts: "MLflow and Triton models without code, a scoring script on curated images, or your own container image such as Triton, TorchServe or TensorFlow Serving."
          workload: "Each deployment has its own GPU or CPU instances, scaled by hand or by Azure Monitor autoscale rules but never to zero; a request can run for 180 seconds at most."
          portability: "A custom container and its weights move as they are; endpoint and deployment definitions, scoring routes, autoscale rules and traffic settings are Azure ML constructs."
          effort: "Your team owns the serving image, model versions, scaling rules and quota; Azure ML handles node provisioning, host updates and node recovery."
          fits: "Microsoft calls it the recommended way to use online endpoints, for teams that want managed deployment in place of running Kubernetes themselves."
        sources:
          - https://learn.microsoft.com/en-us/azure/machine-learning/concept-endpoints-online
          - https://learn.microsoft.com/en-us/azure/machine-learning/how-to-deploy-online-endpoints
          - https://learn.microsoft.com/en-us/azure/machine-learning/how-to-deploy-custom-container
          - https://learn.microsoft.com/en-us/azure/machine-learning/concept-secure-online-endpoint
          - https://learn.microsoft.com/en-us/azure/machine-learning/how-to-access-resources-from-endpoints-managed-identities
          - https://learn.microsoft.com/en-us/azure/machine-learning/how-to-authenticate-online-endpoint
          - https://learn.microsoft.com/en-us/azure/machine-learning/how-to-autoscale-endpoints
          - https://learn.microsoft.com/en-us/azure/machine-learning/how-to-safely-rollout-online-endpoints
          - https://learn.microsoft.com/en-us/azure/machine-learning/concept-vulnerability-management
          - https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-quotas
          - https://learn.microsoft.com/en-us/azure/machine-learning/reference-yaml-deployment-managed-online
          - https://learn.microsoft.com/en-us/azure/machine-learning/reference-yaml-endpoint-online
          - https://learn.microsoft.com/en-us/azure/machine-learning/how-to-monitor-online-endpoints
          - https://learn.microsoft.com/en-us/azure/machine-learning/how-to-deploy-models-from-huggingface
          - https://learn.microsoft.com/en-us/azure/machine-learning/how-to-share-models-pipelines-across-workspaces-with-registries
          - https://learn.microsoft.com/en-us/azure/machine-learning/concept-endpoints
        summary: "The model server runs as a container you supply on GPU virtual machines that Azure Machine Learning provisions, patches and replaces, behind a managed online endpoint that API Management calls. The cluster, node pools, ingress and network policy of the mapping disappear. In exchange the weights load from a registered model rather than your own Blob account, requests are capped at 180 seconds, and network isolation follows the workspace."
        bindings:
          - { block: api, service: "Azure ML managed online endpoint (scoring URI)", note: "One HTTPS scoring address per endpoint with Microsoft Entra token authentication; with public network access disabled, API Management reaches it through the workspace private endpoint.", url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-endpoints-online }
          - { block: runtime, service: "Your container on an Azure ML managed online deployment", note: "A serving image you bring, on GPU instances Azure ML provisions; Microsoft's guide shows TensorFlow Serving, TorchServe and Triton. One deployment per release, with traffic split across them.", url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-deploy-custom-container }
          - { block: storage, service: "Azure ML registered model, mounted into the deployment", note: "The deployment names a model version in the workspace or a registry and Azure ML mounts its files into the container, replacing the separate serving Blob account.", url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-deploy-custom-container }
        dropSettings: [aksGpuNodeTaints, aksNetworkPolicy]
        addSettings: [amlManagedNetwork, amlEndpointPublicNetworkAccess, amlEndpointAadToken, amlOnlineDeploymentInstances, amlEndpointTraffic, amlEndpointIdentity, amlEndpointDiagnostics]
        differences:
          - at: gateway->api
            text: "A managed online endpoint is public unless public_network_access is set to disabled, and it authenticates with a key by default. To keep the gateway as the only door, disable public access, join API Management to a network that reaches the workspace private endpoint, and have it call with a Microsoft Entra token for https://ml.azure.com."
            url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-secure-online-endpoint
          - at: api
            text: "A request to a managed online endpoint times out after 5 seconds by default and 180 seconds at most (request_timeout_ms). Long generations must stream or finish inside that limit; there is no such platform cap in front of a vLLM service on AKS."
            url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-quotas
          - at: storage->runtime
            text: "Azure Machine Learning mounts the registered model into the container; the server does not pull from a Blob account you manage. The signature check must therefore run inside your image before it starts serving. The platform may re-read the model and image at any time, so deleting either breaks the deployment on the next reimage."
            url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-deploy-custom-container
          - at: registry->storage
            text: "The copy step of the AKS mapping is not needed: Microsoft documents deploying a model from a registry directly to an online endpoint in a workspace. The release record becomes the registry model name and version named in the deployment. For an endpoint with a user-assigned identity, Microsoft says the identity needs AcrPull and Storage Blob Data Reader at subscription level."
            url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-share-models-pipelines-across-workspaces-with-registries
          - at: runtime
            text: "Azure updates the host operating system image at least once a month by itself, but a patched base image reaches a deployment only when you redeploy, and an image you bring is yours to rebuild. Azure ML also reserves 20% extra quota on some virtual machine sizes for these upgrades."
            url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-vulnerability-management
        alsoNeeded:
          - service: "Azure Machine Learning workspace (with its storage account, Key Vault and container registry)"
            role: other
            why: "Endpoints and deployments are workspace resources; the AKS mapping needed only the registry."
            url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-deploy-online-endpoints
          - service: "Private endpoint for the workspace"
            role: network
            why: "With public network access disabled, scoring requests arrive only through the workspace's private endpoint."
            url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-secure-online-endpoint
          - service: "Workspace managed virtual network (allow only approved outbound)"
            role: network
            why: "It is what limits where a deployment can send data, in place of cluster network policy and a firewall."
            url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-secure-online-endpoint
          - service: "Azure Monitor autoscale"
            role: other
            why: "Scaling rules for a deployment are Azure Monitor autoscale settings rather than a Kubernetes autoscaler."
            url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-autoscale-endpoints
        quickstart:
          - title: "Deploy a model in a custom container to an online endpoint"
            url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-deploy-custom-container
          - title: "Secure your managed online endpoints with network isolation"
            url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-secure-online-endpoint
          - title: "Safe rollout for online endpoints"
            url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-safely-rollout-online-endpoints
      - id: foundryModels
        kind: managed
        name: "Microsoft Foundry Models (serverless API and managed compute deployments)"
        url: https://learn.microsoft.com/en-us/azure/foundry/concepts/deployments-overview
        asOf: "2026-11"
        compare:
