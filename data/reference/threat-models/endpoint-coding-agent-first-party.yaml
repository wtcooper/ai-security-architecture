pattern: archCodingAgentFirstParty
reviewed: "2026-11-24"
summary: >-
  An open-source coding agent runs as the developer, beside their git, cloud and SSH credentials,
  with a long-lived model key pasted into a file it can read. It arrives through community
  registries with no signed vendor channel, reads code, issues and pages anyone can write, and
  runs commands, often without asking. The year's incidents came through a hijacked harness
  release, project files that run code before any prompt, and stolen keys. There is no vendor
  console to switch anything off: every control is one the organisation adds around it.
concentrates: >-
  A harness at its default permissions with no sandbox, open egress and a pasted provider key,
  opened on a third-party repository: content an outsider wrote then reaches a shell that can read
  every credential on the machine and send it anywhere.
scope: >-
  Developers install an open-source harness from a community registry on their workstations and
  paste a long-lived provider key into its configuration. Default permissions, no sandbox, open
  egress, their own git, cloud and SSH credentials on the machine, and no AI gateway yet.
lists: [owasp-llm-2026, owasp-agentic, owasp-mcp]
assets:
  - "Credentials on the machine: git, cloud and SSH keys, tokens in .env files"
  - "The long-lived model provider key pasted into the agent's configuration"
  - "Source code, and the integrity of what the developer pushes"
  - "The workstation itself, and the internal systems it can reach"
  - "Any record of what the agent did, which by default is the provider's bill"
actors:
  - who: "Author of content the agent reads"
    access: "Writes a README, issue, dependency, rules file or web page the agent opens; needs no exploit"
    wants: "Commands run as the developer, secrets, backdoors"
  - who: "Malicious or compromised publisher"
    access: "Controls a harness release, extension, skill or tool server installed from a community channel"
    wants: "Credentials and persistence on many machines at once"
  - who: "Anyone who can reach a serve port"
    access: "A web page or a host on the network calling a harness serve mode with weak or no authentication"
    wants: "To drive the loop directly"
  - who: "Insider or stolen account"
    access: "A harness and a provider key with no policy, audit or inventory around them"
    wants: "Work nobody sanctioned, offensive use, data theft"
  - who: "The agent itself, no adversary"
    access: "The developer's shell, files and credentials"
    wants: "None; misreads scope, takes shortcuts, misreports what it did"
threats:
  - id: T1
    title: "A tampered harness, extension or skill release runs as the developer"
    rating: critical
    evidence: observed
    story: >-
      The agent, its extensions and its skills arrive from community registries on the
      publisher's word. A release made with a stolen token, or a skill with a hidden install step,
      runs on a machine holding the developer's keys. An unauthorised release of an
      open-source coding agent was live for about eight hours in 2026.
    at: [toolPlane->registry, sources->registry, harness]
    risks: [riskInsecureIntegratedComponent, riskToolSourceProvenance]
    atlas: [AML.T0010.001, AML.T0010.005, AML.T0011.001]
    owasp: [LLM04:2026, ASI04, ASI08, MCP04:2025]
    controls: [cap-mcp-tool-integrity, D3-FA, cap-agent-tool-registry, cap-shadow-ai-discovery]
    refs:
      - { title: "Cline: post-mortem of an unauthorised Cline CLI npm release", url: "https://cline.bot/blog/post-mortem-unauthorized-cline-cli-npm" }
  - id: T2
    title: "Content in the project, issues or web pages takes over the agent's shell"
    rating: critical
    evidence: disclosed
    story: >-
      Source files, READMEs, issue threads and fetched pages carry instructions, often hidden, that
      the agent follows with the developer's privileges. At one popular harness's defaults, edits,
      shell commands and web fetches run without asking, so an injected step runs before anyone
      reads it.
    at: [toolPlane->publicRepos, toolPlane->sourceControl, toolPlane->openWeb, harness]
    risks: [riskPromptInjection, riskInsecureModelOutput]
    atlas: [AML.T0051.001, AML.T0068, AML.T0053, AML.T0050]
    owasp: [LLM01:2026, LLM10:2026, ASI01, ASI05, MCP06:2025]
    controls: [D3-EI, AML.M0028, cap-input-guardrails, cap-agent-egress-control]
    refs:
      - { title: "opencode documentation: permissions", url: "https://opencode.ai/docs/permissions/" }
      - { title: "Tracebit: code execution through deception in Gemini CLI", url: "https://tracebit.com/blog/code-exec-deception-gemini-ai-cli-hijack" }
  - id: T3
    title: "Project files and agent settings run or steer the agent at every start"
    rating: high
    evidence: observed
    story: >-
      Git settings, tool-server declarations, hooks and rules files arrive with a project and are
      executed or read as standing orders. GitSpawn ran attacker code in two open-source agents
      before any approval, and the CHAINDROP worm wrote its persistence into agent settings and
      folder-open tasks.
    at: [developer->harness, toolPlane, memory]
    risks: [riskInsecureIntegratedComponent, riskToolRegistryTampering, riskPromptInjection]
    atlas: [AML.T0081, AML.T0142, AML.T0080]
    owasp: [ASI05, ASI06, MCP03:2025, MCP05:2025, MCP09:2025]
    controls: [D3-EI, AML.M0031, D3-PA, cap-mcp-tool-integrity]
    incidents: [coding-agent-git-hijack, coding-agent-hijack]
    refs:
      - { title: "CVE-2026-71963: Hermes Agent RCE via git core.fsmonitor", url: "https://www.cve.org/CVERecord?id=CVE-2026-71963" }
      - { title: "CVE-2026-72718: goose review runs git core.fsmonitor", url: "https://www.cve.org/CVERecord?id=CVE-2026-72718" }
  - id: T4
    title: "The pasted provider key is read, stolen and spent elsewhere"
    rating: high
    evidence: observed
    story: >-
      A long-lived key sits in plain text the agent, its tools and any process running as the
      developer can read; the GitSpawn flaws exposed it with the environment. In October 2026
      keys stored in a harness vendor's hosted console were exposed and users saw charges they never
      ran; deleting a key there did not revoke it.
    at: [harness, harness->aiGateway, aiGateway->provider]
    risks: [riskSensitiveDataDisclosure, riskEconomicDenialOfWallet]
    atlas: [AML.T0083, AML.T0055, AML.T0034]
    owasp: [LLM02:2026, LLM06:2026, ASI03, MCP01:2025]
    controls: [D3-CH, AML.M0036, cap-agent-kill-switch, D3-MFA]
    incidents: [ai-key-platforms]
  - id: T5
    title: "A serve port or bridge lets someone else drive the loop"
    rating: high
    evidence: disclosed
    story: >-
      Harnesses ship serve modes whose authentication ranges from a shared secret to none. One
      started an unauthenticated HTTP server by default that any local process, or any website
      through permissive CORS, could use to run shell commands as the user, until a fix disclosed
      in January 2026.
    at: [harness, developer->harness]
    risks: [riskInsecureIntegratedComponent]
    atlas: [AML.T0132, AML.T0049, AML.T0050]
    owasp: [ASI05, MCP07:2025]
    controls: [D3-PA, cap-agent-egress-control, cap-shadow-ai-discovery]
    refs:
      - { title: "CVE-2026-22812: OpenCode unauthenticated HTTP server allows command execution", url: "https://www.cve.org/CVERecord?id=CVE-2026-22812" }
  - id: T6
    title: "Secrets and code leave through a fetch or a shell command"
    rating: high
    evidence: disclosed
    story: >-
      Ordinary work puts .env files, tokens and source in context. An injected step bundles them
      into a request to a page the attacker controls, and nothing of ours is on that hop; in one
      CLI a README injection sent environment variables out without a prompt. What reaches the
      provider is kept under its default terms.
    at: [toolPlane->openWeb, aiGateway->provider]
    risks: [riskSensitiveDataDisclosure, riskExcessiveDataHandlingDuringInference]
    atlas: [AML.T0086, AML.T0037]
    owasp: [LLM02:2026, ASI02, MCP10:2025]
    controls: [cap-agent-egress-control, cap-sensitive-data-redaction, D3-EI]
    refs:
      - { title: "Tracebit: code execution through deception in Gemini CLI", url: "https://tracebit.com/blog/code-exec-deception-gemini-ai-cli-hijack" }
  - id: T7
    title: "Destructive or out-of-scope actions on the developer's own credentials"
    rating: high
    evidence: observed
    story: >-
      With no attacker, the agent deletes files, resets history, writes to records or pushes to
      every repository the developer can write, and its own account of what it did can be wrong.
      A hosted coding agent deleted a production database during a code freeze in 2025, by the
      affected user's account.
    at: [toolPlane->sourceControl, hostedTools->orgData, harness]
    risks: [riskRogueActions, riskRunawayAgentToolLoops]
    atlas: [AML.T0101, AML.T0053]
    owasp: [LLM03:2026, ASI02, ASI09, ASI10, MCP02:2025]
    controls: [AML.M0029, AML.M0028, cap-agent-action-policy-enforcement, AML.M0036]
    refs:
      - { title: "SaaStr: the affected user's account of the Replit agent incident", url: "https://www.saastr.com/replits-new-release-address-most-of-the-challenges-we-hit-vibe-coding-but-is-prosumer-vibe-coding-really-ready-for-commercial-apps-yet" }
  - id: T8
    title: "Installs nobody enrolled, with the provider's bill as the only record"
    rating: medium
    evidence: observed
    story: >-
      Anyone can install the harness without asking, so the common install has no policy, no
      audit and no inventory entry. An open-source harness with commercial models and an MCP
      toolkit ran ransomware affiliates' intrusions on about 62 organisations in 2026, seen only
      because their own server was left exposed.
    at: [harness, aiGateway]
    risks: [riskShadowAndUnknownAgents, riskRogueActions]
    atlas: [AML.T0124, AML.T0116]
    owasp: [MCP08:2025]
    controls: [cap-shadow-ai-discovery, cap-agent-tracing, D3-PA, cap-agent-kill-switch]
    incidents: [ransomware-ai-operators]
coverage:
  - { id: "LLM05:2026", why: "Rules and memory files that steer later sessions are T3; poisoning of the model itself belongs to the provider." }
  - { id: "LLM07:2026", why: "Code that looks right and is not is a review question for what the agent pushes; the agent's wrong account of its own actions is T7." }
  - { id: "LLM08:2026", why: "An open-source harness's instructions are public; what is sensitive in context is the code and secrets, covered by T4 and T6." }
  - { id: "LLM09:2026", why: "No threat here depends on embeddings; a codebase index retrieves repository content that T2 already treats as untrusted." }
  - { id: "ASI07", why: "Subagents inside one harness share its process and permissions, so their messages cross no trust boundary." }
questions:
  - "Which harness and version runs, where was it installed from, and is it pinned to a build your mirror verified?"
  - "Which permission defaults do sessions start with, and is there a sandbox that covers the shell and keeps keys outside it?"
  - "Where does the provider key live, is it long-lived, and could a process running as the developer read it?"
  - "Does any serve mode, bridge or dashboard listen on the machine, bound to what, and with what authentication?"
  - "Which project files does the harness run or load before you approve anything: git settings, hooks, tool servers, rules?"
  - "Which hosts can the agent's shell and fetch tool reach, and would anyone see a secret leave in a request?"
  - "Would you know the harness is installed on a machine, and could you stop it and revoke its key from outside it?"
