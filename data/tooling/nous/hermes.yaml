              evidence: *a1
              verified: 2026-09-10
      - mitigation: cap-sensitive-data-redaction
        coverage: partial
        mechanism: >-
          security.redact_secrets scrubs key-shaped strings from tool output and logs,
          security.website_blocklist blocks destinations for web and browser tools, A2A replies are
          credential-redacted and session exports take --redact; no classifier on prompts or uploads
        steps: &a1
          - title: Keep secret redaction on
            body:
              - "security.redact_secrets: true (the default) redacts API-key, token and password patterns in tool output
                before they enter the conversation context or logs; set it to false only for debugging."
            url: https://hermes-agent.nousresearch.com/docs/user-guide/configuration
          - title: Block sensitive destinations
            body:
              - 'Set security.website_blocklist.enabled: true with domains such as "*.internal.company.com" or a
                shared_files rule list; web_search, web_extract, browser_navigate and every URL-capable tool
                refuse a match.'
            url: https://hermes-agent.nousresearch.com/docs/user-guide/configuration#website-blocklist
          - title: Redact before sharing history
            body:
              - Use hermes sessions export --redact for anything you hand to others; outbound A2A replies are scrubbed of
                credential-shaped strings automatically.
            url: https://hermes-agent.nousresearch.com/docs/user-guide/sessions
        note: >-
          Detection is pattern-based and aimed at credentials; personal or business data in prompts to the
          model provider is not inspected — enforce that at the provider or a proxy in front of it.
        verified: 2026-09-10
        migration:
          from:
            - capabilityAiDlp
          reviewRequired: false
          original:
            - capability: capabilityAiDlp
              coverage: partial
              mechanism: >-
