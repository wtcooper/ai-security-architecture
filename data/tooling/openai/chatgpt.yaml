      - mitigation: cap-input-guardrails
        coverage: partial
        mechanism: >-
          Vendor-operated screening of returned content (online and offline monitoring of MCP content for prompt
          injection, policy screening of MCP prompts, known-malicious-domain blocking, link-generation controls,
          a cloud-browser sign-in review model); none of it is admin-configurable
        steps:
          - title: Verify the vendor's returned-content defenses
            body:
              - >-
                Assess the app and MCP safeguards the App security whitepaper describes (injection monitoring,
                malicious-domain blocking, link-generation controls) and record that no admin toggle, threshold
                or detection event exists for them.
            url: https://cdn.openai.com/business-guides-and-resources/app-security-whitepaper.pdf
          - title: Limit untrusted MCP sources
            body:
              - >-
                In Permissions & roles grant Upload plugins with custom MCP servers and Create plugins with MCPs
                only to vetted builders; only admins and owners can publish a custom app.
            url: https://learn.chatgpt.com/docs/enterprise/apps-and-connectors
          - title: Put high-risk groups in a Lockdown Mode role
            body:
              - >-
                Designate a custom role as a Lockdown Mode role and assign the groups that handle sensitive data,
                which turns off live browsing, agent mode and deep research; it limits exfiltration and does not
                screen content.
            url: https://help.openai.com/en/articles/20001061-lockdown-mode
        note: >-
          Partial by the rule applied to every vendor: OpenAI documents vendor-internal screening of returned
          content — online and offline monitoring for prompt injection originating from MCP servers, policy
          screening of MCP prompts, blocking of known malicious domains, link-generation controls against
          URL-based exfiltration and a review model on cloud-browser sign-in pages — but none of it can be
          switched on, tuned or set to block by the admin, and no detection event is a documented Compliance Logs
          Platform type. Lockdown Mode cuts outbound paths and, per the vendor, does not prevent prompt injections
          from appearing in the content ChatGPT processes; Auto approve and Important actions classify
          actions, not input; the frozen tool snapshot of custom MCP apps guards definitions, not results; Prisma
          AIRS (Codex only) screens prompts, not tool results. Records read through the organisation's own MCP
          tier can be classified by its gateway (the drawing's second pin).
        verified: "2026-10-30"
        migration:
