# Framework material that is NOT CoSAI's.
#
# Everything else on the Frameworks tab is CoSAI's own cross-reference: CoSAI decides that a
# risk maps to LLM01, and we render it. This file is the exception, and it is kept separate
# and badged in the UI so the two are never confused.
#
# Two kinds of thing live here:
#
#   frameworks: — a framework CoSAI does not carry at all, with mappings authored here.
#   notes:      — editorial notes attached to a framework CoSAI does carry, where something
#                 about it has changed upstream since CoSAI pinned its version.
#
# The build checks every id in here against the compiled dataset, and every entry identifier
# against data/frameworks/entries.yaml.

frameworks:
  - id: owasp-agentic
    name: OWASP Agentic Top 10
    fullName: OWASP Top 10 for Agentic Applications
    description: >
      The ten most critical security risks specific to agentic AI — systems where the model
      is an actor with tools it can invoke, memory it carries between sessions, and
      consequences it can set in motion downstream.
    baseUri: https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/
    documentUri: https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/
    version: "2026"
    versionId: owasp-agentic@2026
    lastUpdated: "2025-12-09"
    applicableTo:
      - risks
    authored: true
    attribution: >
      CoSAI does not carry this framework. Its `frameworks.yaml` lists six, and the OWASP
      entry among them is the LLM Top 10; nothing in CoSAI's risks, controls or personas
      references an ASI identifier. The framework itself is OWASP's, published 9 December
      2025 by the OWASP GenAI Security Project — but every mapping below is a judgement made
      in this repository, not CoSAI's, and should be read as such.
    mappingRationale: >
      A CoSAI risk is mapped to an ASI entry only where the ASI entry describes that risk as
      it occurs in an agentic system. 15 of CoSAI's 36 risks are not agentic in that sense —
      training-data poisoning, model exfiltration, side channels — and are deliberately left
      unmapped rather than stretched to fit. ASI09 has nothing mapped to it because CoSAI has
      no risk for a human over-trusting an agent; that gap is shown, not hidden.

    # ---------------------------------------------------------------------------
    # Supply chain and development
    # ---------------------------------------------------------------------------
    mappings:
      risks:
        # Tampered model code is a compromised component the agent is built on.
        riskModelSourceTampering: [ASI04]
        # An unsafe loader is both a supply-chain artefact and an execution path.
        riskMaliciousLoaderDeserialization: [ASI04, ASI05]
        # Unvetted registries and MCP manifests are the agentic supply chain exactly.
        riskToolSourceProvenance: [ASI04]

        # -----------------------------------------------------------------------
        # Deployment and infrastructure
        # -----------------------------------------------------------------------
        riskInsecureIntegratedComponent: [ASI04, ASI05]
        riskAdapterPEFTInjection: [ASI04]
        riskToolRegistryTampering: [ASI04]
        # Opacity is an identity problem and a message-passing problem at once.
        riskAgentDelegationChainOpacity: [ASI03, ASI07]
        riskStaleAgentIdentityBinding: [ASI03]
        # MCP transport is the inter-agent channel, and the server is a supplied component.
        riskMCPTransportHijacking: [ASI04, ASI07]
        # An unregistered agent holding valid credentials is the rogue-agent case.
        riskShadowAndUnknownAgents: [ASI03, ASI10]
        riskAgenticDelegationConfusedDeputy: [ASI03]
        riskCrossTenantCredentialPropagation: [ASI03]
        riskZombieShadowMCPServers: [ASI04, ASI10]

        # -----------------------------------------------------------------------
        # Runtime input security
        # -----------------------------------------------------------------------
        # OWASP's own ASI01 example is EchoLeak, an indirect prompt injection.
        riskPromptInjection: [ASI01]
        # A loop is tool misuse that amplifies through the system.
        riskRunawayAgentToolLoops: [ASI02, ASI08]

        # -----------------------------------------------------------------------
        # Runtime data security
        # -----------------------------------------------------------------------
        riskPromptResponseCachePoisoning: [ASI06]
        riskRetrievalVectorStorePoisoning: [ASI06]

        # -----------------------------------------------------------------------
        # Runtime output security
        # -----------------------------------------------------------------------
        # Unvalidated output reaching a downstream interpreter is the execution path.
        riskInsecureModelOutput: [ASI05]
        riskRogueActions: [ASI02, ASI10]
        riskOrchestratorRouteHijacking: [ASI01, ASI07]
        # Agent instances signalling each other through their own outputs.
        riskCovertChannelsInModelOutputs: [ASI07]

  - id: owasp-llm-2026
    name: OWASP LLM Top 10
    fullName: OWASP Top 10 for LLM Applications 2026
    description: >
      The ten most critical security risks for applications built on large language models,
      2026 edition — the first ranked partly on real incident data rather than expert vote
      alone.
    baseUri: https://genai.owasp.org/resource/owasp-genai-llm-top-10-2026/
    documentUri: https://genai.owasp.org/resource/owasp-genai-llm-top-10-2026/
    version: "2026"
    versionId: owasp-llm-2026@2026
    lastUpdated: "2026-08-04"
    applicableTo:
      - risks
      - controls
    authored: true
    attribution: >
      The framework and all entry text are OWASP's, from the 2026 edition published 4 August
      2026 and licensed CC BY-SA 4.0. What is authored here is the renumbering: CoSAI's data
      maps to the 2025 edition, and each of those mappings has been carried onto its 2026
      identifier. OWASP kept all ten risks and changed their order, so no mapping was created,
      dropped or reinterpreted — every one of them is CoSAI's judgement, relabelled.
    mappingRationale: >
      The translation follows OWASP's own renumbering, one identifier to one identifier:
      Supply Chain 03 to 04, Data and Model Poisoning 04 to 05, Improper Output Handling 05 to
      10, Excessive Agency 06 to 03, System Prompt Leakage 07 to 08 as Hidden Context Exposure,
      Vector and Embedding Weaknesses 08 to 09, Misinformation 09 to 07, Unbounded Consumption
      10 to 06. Prompt Injection and Sensitive Information Disclosure keep their numbers. The
      2025 edition as CoSAI actually publishes it is still on this tab, one pill along.
    mappings:
      risks:
        riskDataPoisoning: [LLM05:2026]
        riskModelSourceTampering: [LLM04:2026]
        riskExcessiveDataHandling: [LLM02:2026]
        riskExcessiveDataHandlingDuringInference: [LLM02:2026]
        riskModelDeploymentTampering: [LLM01:2026, LLM04:2026]
        riskDenialOfMLService: [LLM06:2026]
        riskInsecureIntegratedComponent: [LLM03:2026, LLM04:2026]
        riskPromptInjection: [LLM01:2026]
        riskModelEvasion: [LLM01:2026]
        riskSensitiveDataDisclosure: [LLM02:2026, LLM08:2026]
        riskInferredSensitiveData: [LLM02:2026, LLM07:2026]
        riskInsecureModelOutput: [LLM07:2026, LLM10:2026]
        riskRogueActions: [LLM03:2026]
        riskToolRegistryTampering: [LLM03:2026]
        riskToolSourceProvenance: [LLM03:2026, LLM04:2026]
        riskRunawayAgentToolLoops: [LLM06:2026]
        riskAgenticDelegationConfusedDeputy: [LLM03:2026]
        riskCrossTenantCredentialPropagation: [LLM03:2026]
        riskZombieShadowMCPServers: [LLM04:2026]
      controls:
        controlInputValidationAndSanitization: [LLM01:2026]
        controlOutputValidationAndSanitization: [LLM02:2026, LLM10:2026]
        controlApplicationAccessManagement: [LLM06:2026]
        controlAgentPluginPermissions: [LLM03:2026]
        controlAgentCredentialIsolation: [LLM03:2026]
        controlInterComponentTransportSecurity: [LLM04:2026]
        controlAgentExecutionBounds: [LLM06:2026]

notes:
  owasp-top10-llm:
    headline: Superseded. This is the 2025 edition, which is what CoSAI maps to; OWASP published the 2026 edition on 4 August 2026.
    body: >
      This is the edition CoSAI's data actually maps to, kept because every identifier here
      is CoSAI's own. It is no longer the current list: OWASP published the 2026 edition on
      4 August 2026, which keeps all ten risks but reorders most of them and renames one.
      **OWASP LLM Top 10** — the neighbouring pill — is that 2026 edition with these same
      mappings carried across, and is the one to use unless you specifically need CoSAI's
      published identifiers. Each entry below carries its 2026 position.
    sourceNote: >
      Descriptions here are OWASP's 2025 text, which is still what OWASP's own per-risk
      pages at genai.owasp.org/llm-top-10 serve. The 2026 positions were read from the 2026
      document itself.
    link:
      label: OWASP Top 10 for LLM Applications 2026
      url: https://genai.owasp.org/resource/owasp-genai-llm-top-10-2026/
    # 2025 identifier -> what the same risk is called in the 2026 edition.
    crosswalk:
      - from: "LLM01:2025"
        to: "LLM01:2026"
        title: Prompt Injection
        change: Unchanged at number one; scope expanded to cross-modal attacks, memory persistence and agentic blast radius.
      - from: "LLM02:2025"
        to: "LLM02:2026"
        title: Sensitive Information Disclosure
        change: Unchanged.
      - from: "LLM03:2025"
        to: "LLM04:2026"
        title: Supply Chain
        change: Moved down one place.
      - from: "LLM04:2025"
        to: "LLM05:2026"
        title: Data and Model Poisoning
        change: Moved down one place.
      - from: "LLM05:2025"
        to: "LLM10:2026"
        title: Improper Output Handling
        change: Moved from fifth to tenth; now explicitly covers terminal and IDE sinks, and renderers that auto-fetch external resources.
      - from: "LLM06:2025"
        to: "LLM03:2026"
        title: Excessive Agency
        change: Moved up from sixth to third.
      - from: "LLM07:2025"
        to: "LLM08:2026"
        title: System Prompt Leakage → Hidden Context Exposure
        change: Renamed and widened to cover all hidden operational context, not only the system prompt.
      - from: "LLM08:2025"
        to: "LLM09:2026"
        title: Vector and Embedding Weaknesses
        change: Moved down one place; scope unchanged.
      - from: "LLM09:2025"
        to: "LLM07:2026"
        title: Misinformation
        change: Moved up from ninth to seventh.
      - from: "LLM10:2025"
        to: "LLM06:2026"
        title: Unbounded Consumption
        change: Moved up from tenth to sixth.
