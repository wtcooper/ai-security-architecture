# MITRE-only capability selection and authored CoSAI/deployment crosswalk.
# Canonical names and definitions are loaded from checksum-pinned data/mitre snapshots.
attribution: Canonical capability identifiers, names and definitions come directly from MITRE D3FEND
  1.6.0 and MITRE ATLAS 2026.09. This repository authors only the selection, implementation
  guidance, deployment scope and supporting CoSAI mappings. No custom capability identifiers are
  added. A mapping does not establish control fulfillment or MITRE endorsement.
surfaces:
  - id: surfaceEndpoint
    title: Endpoint
    description:
      - >
        AI agents and assistants running on managed devices — desktop and CLI agents with local
        file, tool, and credential access. The organisation owns the whole stack, so device-native
        controls reach everything.
  - id: surfaceCloud
    title: Cloud & hosted
    description:
      - >
        Production AI systems the organisation deploys and operates in cloud or datacenter
        environments. The richest control surface: identity, gateways, guardrail APIs, and posture
        management all apply natively.
  - id: surfaceSaas
    title: Third-party SaaS
    description:
      - >
        Vendor-operated AI consumed as a service. The internals are opaque; the control plane
        collapses to the edges — browser, identity, network path, connectors, and contract.
capabilities:
  - id: AML.M0020
    kind: function
    category: controlsData
    implementation: "Assess guardrails by the features actually implemented: instruction-attack
      screening, content policy, sensitive-data blocking/transformation, grounding, retrieval checks
      and action checks. Verify each input, context, output and tool boundary. One feature
      establishes only partial coverage of this broad mitigation; grounding does not establish
      source trust."
    examples:
      - endpoint DLP agents
      - network and API DLP inspection
      - in-session prompt and upload controls
      - PII and secret detectors
      - de-identification and masking services
      - context minimization filters
      - retrieval source trust scoring
      - per-tenant index isolation
      - ingest and retrieval anomaly detection
      - prompt-attack and jailbreak classifiers
      - indirect injection screening of retrieved content
      - invisible-character and encoding sanitization
      - harm-category content filters
      - denied topics and term blocklists
      - custom policy classifiers
      - contextual grounding checks
      - claim-to-source verification
      - tool-call validation before execution
    controls:
      - controlInputValidationAndSanitization
      - controlOutputValidationAndSanitization
      - controlRuntimePrivacyEnhancingTechnologies
      - controlRetrievalAndVectorSystemIntegrity
      - controlUserDataManagement
    controlMappings:
      - control: controlInputValidationAndSanitization
        relationship: supports
        rationale: "Assess guardrails by the features actually implemented: instruction-attack screening,
          content policy, sensitive-data blocking/transformation, grounding, retrieval checks and
          action checks. Verify each input, context, output and tool boundary. One feature
          establishes only partial coverage of this broad mitigation; grounding does not establish
          source trust."
      - control: controlOutputValidationAndSanitization
        relationship: supports
        rationale: "Assess guardrails by the features actually implemented: instruction-attack screening,
          content policy, sensitive-data blocking/transformation, grounding, retrieval checks and
          action checks. Verify each input, context, output and tool boundary. One feature
          establishes only partial coverage of this broad mitigation; grounding does not establish
          source trust."
      - control: controlRuntimePrivacyEnhancingTechnologies
        relationship: supports
        rationale: "Assess guardrails by the features actually implemented: instruction-attack screening,
          content policy, sensitive-data blocking/transformation, grounding, retrieval checks and
          action checks. Verify each input, context, output and tool boundary. One feature
          establishes only partial coverage of this broad mitigation; grounding does not establish
          source trust."
      - control: controlRetrievalAndVectorSystemIntegrity
        relationship: supports
        rationale: "Assess guardrails by the features actually implemented: instruction-attack screening,
          content policy, sensitive-data blocking/transformation, grounding, retrieval checks and
          action checks. Verify each input, context, output and tool boundary. One feature
          establishes only partial coverage of this broad mitigation; grounding does not establish
          source trust."
      - control: controlUserDataManagement
        relationship: supports
        rationale: "Assess guardrails by the features actually implemented: instruction-attack screening,
          content policy, sensitive-data blocking/transformation, grounding, retrieval checks and
          action checks. Verify each input, context, output and tool boundary. One feature
          establishes only partial coverage of this broad mitigation; grounding does not establish
          source trust."
    risks:
      - riskSensitiveDataDisclosure
      - riskExcessiveDataHandlingDuringInference
      - riskInferredSensitiveData
      - riskRetrievalVectorStorePoisoning
      - riskPromptInjection
      - riskModelEvasion
      - riskRogueActions
      - riskInsecureModelOutput
    components:
      - componentApplicationInputHandling
      - componentApplicationOutputHandling
      - componentAgentUserQuery
      - componentMemory
      - componentRAGContent
      - componentDataStorage
      - componentAgentInputHandling
      - componentAgentOutputHandling
    surfaces:
      surfaceEndpoint:
        applies: true
        responsibility: customer-operated
        note: Deploy on customer-controlled assets and verify the actual protected boundary.
      surfaceCloud:
        applies: true
        responsibility: customer-operated
        note: Deploy on customer-controlled assets and verify the actual protected boundary.
      surfaceSaas:
        applies: true
        responsibility: customer-configurable
        note: Only tenant-exposed settings and customer-controlled integration paths are in scope. Verify
          provider support; provider internals require supplier evidence.
    sources:
      - title: Gartner, Market Guide for AI Trust, Risk and Security Management (DLP named in the
          information-governance layer)
        url: https://www.gartner.com/doc/reprints?id=1-2KEGIG1M&ct=250228&st=sb
      - title: Five Eyes joint guidance, Careful adoption of agentic AI services (2026) — DLP tuned to agent
          behaviours
        url: https://www.ncsc.govt.nz/assets/guidance/Documents/Careful-adoption-of-agentic-AI-services_FINAL.pdf
    features:
      - Instruction-attack screening (direct and indirect injection, jailbreaks)
      - Content-policy screening
      - Sensitive-data detection, blocking and transformation
      - Grounding checks against qualified source material
      - Retrieval-context screening
      - Tool/action and structured-output checks (also see Input and Output Validation for AI Agent Components and Human In-the-Loop for AI Agent Actions)
