  # >>> software factory mapping (checked against the vendor's pages by two people)
  - architecture: archSoftwareFactory
    asOf: "2026-11"
    verified: "2026-11-21"
    reference:
      - title: "Set up IDP Reference Implementation on Local Machine | CNOE"
        url: https://cnoe.io/docs/reference-implementation/local
      - title: "Sandbox controller, for example agent-sandbox: Coding Agents"
        url: https://agent-sandbox.sigs.k8s.io/docs/use-cases/coding-agents/
      - title: "Sandbox controller, for example agent-sandbox: Claude Code in Agent Sandbox"
        url: https://agent-sandbox.sigs.k8s.io/docs/use-cases/examples/claude-code-sandbox/
      - title: "CNCF Platforms White Paper | CNCF TAG App Delivery"
        url: https://tag-app-delivery.cncf.io/whitepapers/platforms/
    summary:
      - "The factory runs on infrastructure you operate. A coding agent CLI (for example Claude Code or OpenCode) works in a fresh sandbox per build, calls models through your AI gateway and installs from your package mirror. Source control holds one repository per app, and the CI system builds and scans on pipeline definitions the platform team owns. A deploy gate releases only when the app's owner approves, in stages with a one-step rollback. Each app gets its own isolated tenancy behind your sign-in, secrets from your vault, its own database and an entry in your app register; each box lists example products."
    bindings:
      - { block: intake, service: "Intake chat with guardrails", build: true, url: "https://docs.litellm.ai/docs/apply_guardrail", note: "Signs the requester in at your identity provider (approved groups only), screens the request and each upload through the gateway's guardrails (with LiteLLM, /guardrails/apply_guardrail), writes the spec and starts the app template in your developer portal." }
      - block: previews
        service: "Preview environment per merge request"
        note: "The build still reaches its preview; how it is carried is a choice: the pipeline deploys with a credential scoped to preview namespaces, or a GitOps controller creates one preview per open merge request from the published image (for example an Argo CD ApplicationSet with the Pull Request generator), which keeps cluster credentials out of branch pipelines that run generated code. Previews sit behind the front door's sign-in like apps."
        options:
          - { name: "Argo CD ApplicationSet Pull Request generator", kind: open, url: "https://argo-cd.readthedocs.io/en/stable/operator-manual/applicationset/Generators-Pull-Request/", note: "One Application per open merge request, removed when it closes.", packs: [upstreamOpenSource], watch: [{ text: "One preview Application and namespace per open merge request, from the image built for head_sha; test data, default-deny egress. Only admins may create ApplicationSets.", url: "https://argo-cd.readthedocs.io/en/stable/operator-manual/applicationset/Generators-Pull-Request/" }] }
          - { name: "GitLab review apps", kind: commercial, url: "https://docs.gitlab.com/ci/review_apps/", note: "Per-branch or per-merge-request environments, stopped on merge or after auto_stop_in; all tiers.", packs: [gitlabUltimate], watch: [{ text: "Per-merge-request environments, stopped on merge or after auto_stop_in.", url: "https://docs.gitlab.com/ci/review_apps/" }] }
          - { name: "OpenShift GitOps ApplicationSets", kind: commercial, url: "https://www.redhat.com/en/technologies/cloud-computing/openshift/gitops", note: "Red Hat's supported Argo CD, included with OpenShift Container Platform.", packs: [redHatOpenShiftAi] }
      - block: deployGate
        service: "Owner-approved deploy with staged rollout"
        options:
          - { name: "Argo CD manual sync with Argo Rollouts", kind: open, url: "https://argo-cd.readthedocs.io/en/stable/user-guide/auto_sync/", note: "Manual sync leaves each deploy to someone with sync rights; Rollouts adds canary steps and abort to stable.", packs: [upstreamOpenSource], watch: [{ text: "Syncs the release the pipeline committed to the app's environment repository only when the owner's group syncs it; Rollouts sends it to a few users first and abort returns to stable.", url: "https://argo-cd.readthedocs.io/en/stable/user-guide/auto_sync/" }] }
          - { name: "GitLab protected environments with deployment approvals", kind: commercial, url: "https://docs.gitlab.com/ci/environments/deployment_approvals/", note: "Premium or Ultimate; deploy jobs wait for named approvers, and self-approval is off by default.", packs: [gitlabUltimate], watch: [{ text: "Premium or Ultimate; approval does not start the job, and self-approval is off by default.", url: "https://docs.gitlab.com/ci/environments/deployment_approvals/" }] }
          - { name: "GitHub Enterprise Server environments", kind: commercial, url: "https://docs.github.com/en/enterprise-server@3.22/actions/how-tos/deploy/configure-and-manage-deployments/manage-environments", note: "Required reviewers (up to six), prevent self-review, wait timers and custom protection rules." }
          - { name: "OpenShift GitOps with Argo Rollouts", kind: commercial, url: "https://www.redhat.com/en/technologies/cloud-computing/openshift/gitops", note: "Built on Argo CD and integrates Argo Rollouts, with automatic tests deciding promotion or rollback.", packs: [redHatOpenShiftAi], watch: [{ text: "OpenShift GitOps integrates Argo Rollouts; the support level could not be opened here, so confirm it.", url: "https://www.redhat.com/en/technologies/cloud-computing/openshift/gitops" }] }
          - { name: "Flux with Flagger", kind: open, url: "https://docs.flagger.app/", note: "GitOps delivery with automated canary analysis and promotion." }
      - block: harness
        service: "Coding agent harness"
        build: true
        note: "A coding agent CLI can run inside the build sandbox pod (agent-sandbox's examples do), where its gateway key and repository token sit beside the code it runs, or outside, driving the sandbox through its client (as the Knative option does), which keeps those credentials out of the pod. Either way, issue both per build and short-lived; your orchestrator claims one sandbox per build and adds the templates and skills."
        options:
          - { name: "An agent CLI in agent-sandbox", kind: open, url: "https://agent-sandbox.sigs.k8s.io/docs/use-cases/examples/claude-code-sandbox/", note: "agent-sandbox's examples run Claude Code, OpenCode, Aider or a LangGraph coding agent in the sandbox pod.", packs: [upstreamOpenSource] }
          - { name: "GitLab Duo Agent Platform (Self-Hosted)", kind: commercial, url: "https://docs.gitlab.com/administration/gitlab_duo_self_hosted/", note: "GA on Self-Managed from 18.8; flows run as CI jobs on your runners; offline licences need an add-on.", packs: [gitlabUltimate], watch: [{ text: "Flows run as CI jobs pulling the Flows executor image from your registry; GA Self-Hosted from 18.8.", url: "https://docs.gitlab.com/administration/gitlab_duo_self_hosted/offline_deployment/" }] }
          - { name: "Your CLI on Red Hat build of Agent Sandbox", kind: commercial, url: "https://developers.redhat.com/articles/2026/07/15/red-hat-build-agent-sandbox-isolated-workload-management-kubernetes", note: "Same Sandbox, SandboxTemplate, SandboxWarmPool and SandboxClaim API as upstream; Technology Preview.", packs: [redHatOpenShiftAi], watch: [{ text: "Downstream of kubernetes-sigs agent-sandbox, same Sandbox and SandboxClaim API; Technology Preview.", url: "https://developers.redhat.com/articles/2026/07/15/red-hat-build-agent-sandbox-isolated-workload-management-kubernetes" }] }
          - { name: "GitHub Copilot CLI on Enterprise Server", kind: commercial, url: "https://docs.github.com/en/enterprise-server@3.22/copilot/copilot-on-ghes/about-copilot-on-ghes", note: "Air-gapped CLI GA from GHES 3.22.3 against an instance-configured model provider; no Copilot licence needed there." }
      - block: nativeTools
        service: "Per-build code sandbox"
        options:
          - { name: "agent-sandbox with gVisor", kind: open, url: "https://agent-sandbox.sigs.k8s.io/", note: "Kubernetes SIG Apps controller (v1beta1 API) for per-task sandboxes and warm pools; gVisor intercepts system calls in user space." }
          - { name: "Kata Containers", kind: open, url: "https://katacontainers.io/", note: "RuntimeClass giving each sandbox pod its own lightweight VM and kernel; works under agent-sandbox or plain pods." }
          - { name: "Red Hat build of Agent Sandbox with OpenShift sandboxed containers", kind: commercial, url: "https://www.redhat.com/en/blog/whats-new-red-hat-openshift-confidential-computing-and-sandboxing", note: "Downstream agent-sandbox, Technology Preview (Aug 2026), with Kata VMs from sandboxed containers 1.13.", packs: [redHatOpenShiftAi], watch: [{ text: "VM isolation needs the kata or kata-remote RuntimeClass from sandboxed containers; without it pods share the node kernel.", url: "https://developers.redhat.com/articles/2026/07/15/red-hat-build-agent-sandbox-isolated-workload-management-kubernetes" }] }
          - { name: "NVIDIA OpenShell", kind: open, url: "https://docs.nvidia.com/openshell/about/overview", note: "Open-source agent runtime that wraps the sandbox in a declarative YAML policy; early 0.1.x releases." }
          - { name: "SandboxClaim on gVisor or Kata", kind: open, url: "https://agent-sandbox.sigs.k8s.io/docs/api/", packs: [upstreamOpenSource], watch: [{ text: "One SandboxClaim per build via warmPoolRef to a SandboxWarmPool built from a reviewed SandboxTemplate, deleted when the build ends; an explicit egress list admits only LiteLLM, Nexus and GitLab.", url: "https://agent-sandbox.sigs.k8s.io/docs/api/" }] }
      - block: gateway
        service: "AI gateway for models, MCP and skills"
        options:
          - { name: "LiteLLM Proxy", kind: open, url: "https://docs.litellm.ai/docs/simple_proxy", note: "Models, MCP servers and A2A agents behind one proxy with per-key and per-team grants; some features need its Enterprise licence.", packs: [upstreamOpenSource], watch: [{ text: "Holds the provider key, gives each build a scoped, expiring virtual key, meters spend and serves the platform's skills from its Skills Hub, where admins review and publish them.", url: "https://docs.litellm.ai/docs/skills_gateway" }] }
          - { name: "Kong Gateway Enterprise with AI Gateway", kind: commercial, url: "https://developer.konghq.com/plugins/ai-mcp-proxy/", note: "Plugins on Services and Routes: AI Proxy Advanced (lists vLLM), AI MCP Proxy with per-tool ACLs, AI A2A Proxy from 3.14.", packs: [kongAiGateway], watch: [{ text: "Holds provider keys and meters use; no skills hub.", url: "https://developer.konghq.com/plugins/ai-proxy-advanced/" }] }
          - { name: "Gravitee API Management (Agent Management)", kind: commercial, url: "https://documentation.gravitee.io/apim/4.10/agent-mesh", note: "LLM, MCP and A2A proxy API types on one gateway, fully self-hostable; Enterprise licence for the AI features.", packs: [graviteeAgentMesh], watch: [{ text: "Enterprise licence; routes to OpenAI, Gemini, Bedrock or any OpenAI-compatible endpoint you host.", url: "https://documentation.gravitee.io/apim/ai-agent-management/llm-proxy/proxy-your-llms" }] }
          - { name: "agentgateway", kind: open, url: "https://agentgateway.dev/", note: "Linux Foundation project donated by Solo.io: one data plane for LLM, MCP and A2A traffic with JWT, OIDC, ext_authz and tool scoping." }
          - { name: "OpenShift AI Models-as-a-Service with the Connectivity Link MCP gateway", kind: commercial, url: "https://www.redhat.com/en/blog/model-context-protocol-gateway-red-hat-openshift-now-generally-available", note: "Kuadrant-based; MCP gateway GA in Connectivity Link 1.5 (Oct 2026), MaaS GA since OpenShift AI 3.4; MCP workflows in OpenShift AI 3.5 are TP; no A2A gateway.", packs: [redHatOpenShiftAi], watch: [{ text: "No skills hub; serve skills another way.", url: "https://www.redhat.com/en/blog/model-context-protocol-gateway-red-hat-openshift-now-generally-available" }] }
          - { name: "Agent Router (formerly Envoy AI Gateway)", kind: open, url: "https://theagentrouter.ai/", note: "Envoy-based, now an Agentic AI Foundation project: LLM routing and one MCP tool catalogue; A2A is not listed." }
          - { name: "GitLab self-hosted AI gateway", kind: commercial, url: "https://docs.gitlab.com/administration/gitlab_duo_self_hosted/", note: "Serves GitLab Duo features and the Agent Platform service; not documented as a gateway for other agents.", packs: [gitlabUltimate] }
      - block: registry
        service: "Package mirror and image registry"
        options:
          - { name: "Sonatype Nexus Repository", kind: commercial, url: "https://help.sonatype.com/en/ce-onboarding.html", note: "PyPI and npm proxies with routing rules; Community Edition is free but stops adding components past 40,000 or 100,000 requests a day.", watch: [{ text: "Community Edition does not scan for malware or hold back new releases: routing rules match request paths only, and quarantine of malicious components is Sonatype Repository Firewall, a paid product.", url: "https://help.sonatype.com/en/repository-firewall-best-practices.html" }] }
          - { name: "Harbor", kind: open, url: "https://goharbor.io/docs/2.16.0/administration/configure-proxy-cache/", note: "Image registry with a proxy cache and Trivy scanning; images, not PyPI or npm." }
          - { name: "JFrog Artifactory", kind: commercial, url: "https://docs.jfrog.com/artifactory/docs/remote-repositories", note: "Remote repositories cache npm, PyPI and others on demand; self-managed or SaaS; Curation can block risky packages." }
          - { name: "Red Hat Quay", kind: commercial, url: "https://www.redhat.com/en/technologies/cloud-computing/openshift/platform-plus", note: "Image registry included with OpenShift Platform Plus; images, not PyPI or npm.", packs: [redHatOpenShiftAi], watch: [{ text: "Quay comes with Platform Plus; a PyPI and npm mirror is not in the pack.", url: "https://www.redhat.com/en/technologies/cloud-computing/openshift/platform-plus" }] }
          - { name: "GitLab package registry", kind: commercial, url: "https://docs.gitlab.com/user/packages/pypi_repository/", note: "Hosts your own packages; PyPI requests it lacks go to pypi.org by default; no npm or PyPI caching proxy.", packs: [gitlabUltimate], watch: [{ text: "Turn off PyPI forwarding to pypi.org (on by default); no npm or PyPI caching proxy, so keep a mirror.", url: "https://docs.gitlab.com/user/packages/pypi_repository/" }] }
          - { name: "Pulp", kind: open, url: "https://pulpproject.org/", note: "Open-source content manager: npm pull-through cache, PyPI by syncing from a remote, containers and RPMs." }
          - { name: "Nexus Repository for packages, Harbor for images", kind: open, url: "https://help.sonatype.com/en/routing-rules.html", packs: [upstreamOpenSource], watch: [{ text: "Nexus proxies npm and PyPI behind routing rules; Harbor holds images. Community Edition pauses new components beyond 40,000 components or 100,000 requests a day.", url: "https://help.sonatype.com/en/routing-rules.html" }] }
      - block: sourceControl
        service: "Source control, one repository per app"
        options:
          - { name: "GitLab Self-Managed (Free)", kind: open, url: "https://docs.gitlab.com/user/project/repository/branches/protected/", note: "MIT-licensed core: protected branches and pipelines; code owner approval needs Premium.", packs: [upstreamOpenSource], watch: [{ text: "Created from the template by Backstage's publish:gitlab action; the default branch is protected and merges need a passing pipeline. Code owner approval needs Premium.", url: "https://docs.gitlab.com/user/project/repository/branches/protected/" }, { text: "Code owner approval needs Premium or Ultimate.", url: "https://docs.gitlab.com/user/project/codeowners/" }, { text: "Secret push protection needs Ultimate.", url: "https://docs.gitlab.com/user/application_security/secret_detection/secret_push_protection/" }] }
          - { name: "GitLab Ultimate Self-Managed", kind: commercial, url: "https://docs.gitlab.com/user/application_security/policies/merge_request_approval_policies/", note: "Adds merge request approval policies, dependency scanning and security dashboards to the same instance.", packs: [gitlabUltimate], watch: [{ text: "Protected branches, code owners (Premium) and merge request approval policies (Ultimate).", url: "https://docs.gitlab.com/user/application_security/policies/merge_request_approval_policies/" }] }
          - { name: "GitHub Enterprise Server", kind: commercial, url: "https://docs.github.com/en/enterprise-server@3.22/admin/all-releases", note: "Self-hosted GitHub; 3.22 is the current release (3.23 release candidate from 19 Nov 2026); scanning sold as Secret Protection and Code Security." }
          - { name: "Forgejo", kind: open, url: "https://forgejo.org/docs/latest/user/actions/overview/", note: "Self-hosted forge with built-in Forgejo Actions CI and its own runner." }
          - { name: "Gitea", kind: open, url: "https://about.gitea.com/", note: "Self-hosted Git platform with Gitea Actions; Gitea Enterprise adds SSO, audit logs and support." }
      - block: pipeline
        service: "CI pipeline on isolated runners"
        options:
          - { name: "GitLab CI with Kubernetes executor runners", kind: open, url: "https://docs.gitlab.com/runner/executors/kubernetes/", note: "A pod per job; runtime_class_name can place jobs that run generated code on gVisor or Kata.", packs: [upstreamOpenSource, gitlabUltimate], watch: [{ text: "Dependency scanning is Ultimate; the Kubernetes executor can give jobs a RuntimeClass such as gVisor or Kata.", url: "https://docs.gitlab.com/user/application_security/dependency_scanning/" }, { text: "Runs from a CI file in the platform's own project, a pod per job with runtime_class_name set, since tests run generated code. Trivy, Semgrep and gitleaks scan; Syft writes the SBOM.", url: "https://docs.gitlab.com/runner/executors/kubernetes/" }] }
          - { name: "GitHub Actions on Enterprise Server with ARC", kind: commercial, url: "https://docs.github.com/en/enterprise-server@3.22/actions/concepts/runners/actions-runner-controller", note: "Actions Runner Controller scales self-hosted runners on Kubernetes." }
          - { name: "Tekton", kind: open, url: "https://tekton.dev/docs/", note: "Kubernetes-native pipeline resources; OpenShift Pipelines is built on it." }
          - { name: "OpenShift Pipelines", kind: commercial, url: "https://www.redhat.com/en/technologies/cloud-computing/openshift/pipelines", note: "Red Hat's supported Tekton, included with OpenShift Container Platform.", packs: [redHatOpenShiftAi], watch: [{ text: "Included with OpenShift Container Platform; the suite adds a trusted software factory reference with SLSA attestations.", url: "https://www.redhat.com/en/technologies/cloud-computing/openshift/pipelines" }] }
          - { name: "Jenkins", kind: open, url: "https://www.jenkins.io/doc/", note: "Self-hosted, plugin-based CI server." }
          - { name: "Forgejo Actions", kind: open, url: "https://forgejo.org/docs/latest/user/actions/overview/", note: "CI built into Forgejo with self-hosted runners." }
      - block: appTenant
        service: "Isolated tenant per app"
        note: "What separates one generated app from another is a choice: a namespace per app on a shared cluster (shared control plane, nodes and kernel), a virtual cluster per app, a dedicated cluster or node pool per app or trust tier, or separate virtual machines and network segments. Each gets deny-by-default network rules, a quota, and its own workload identity and identity-provider client; a namespace alone is not a separate account."
        options:
          - { name: "Namespace per app", kind: open, url: "https://kubernetes.io/docs/concepts/security/multi-tenancy/", note: "Network policy, quota and its own identity per namespace; shares the control plane and nodes.", packs: [upstreamOpenSource, gitlabUltimate] }
          - { name: "Capsule", kind: open, url: "https://projectcapsule.dev/", note: "CNCF Sandbox project grouping a team's namespaces into a tenant whose rules every namespace inherits." }
          - { name: "vCluster", kind: open, url: "https://www.vcluster.com/docs/vcluster/deploy/worker-nodes/", note: "A virtual cluster per app with its own control plane; tenants share nodes by default, and private nodes need the free tier or higher." }
          - { name: "OpenShift projects with Advanced Cluster Security", kind: commercial, url: "https://www.redhat.com/en/technologies/cloud-computing/openshift/advanced-cluster-security-kubernetes", note: "Namespaces with Red Hat's policy and runtime security, included in Platform Plus.", packs: [redHatOpenShiftAi], watch: [{ text: "ACS comes with Platform Plus.", url: "https://www.redhat.com/en/technologies/cloud-computing/openshift/advanced-cluster-security-kubernetes" }] }
      - block: appHosting
        service: "App hosting behind single sign-on"
        options:
          - { name: "Argo Rollouts behind Envoy Gateway", kind: open, url: "https://argoproj.github.io/argo-rollouts/", note: "Progressive delivery; a Gateway-level OIDC policy covers every app route.", packs: [upstreamOpenSource], watch: [{ text: "A Gateway-level OIDC SecurityPolicy covers every route, and a platform-owned route policy uses the app's own Keycloak client; secrets arrive through the Vault Secrets Operator.", url: "https://gateway.envoyproxy.io/docs/tasks/security/oidc/" }] }
          - { name: "Knative Serving", kind: open, url: "https://knative.dev/docs/serving/", note: "Request-driven app hosting with revisions and scale to zero." }
          - { name: "OpenShift Serverless behind Connectivity Link", kind: commercial, url: "https://www.redhat.com/en/technologies/cloud-computing/openshift/serverless", note: "Red Hat's Knative-based serverless hosting, with OIDC on routes from Connectivity Link.", packs: [redHatOpenShiftAi] }
          - { name: "Deployments via the GitLab agent for Kubernetes", kind: commercial, url: "https://docs.gitlab.com/user/clusters/agent/", note: "GitLab connects to the cluster to deploy; hosting and ingress remain your cluster's.", packs: [gitlabUltimate], watch: [{ text: "Deploys into your cluster; ingress, sign-in and runtime there are yours.", url: "https://docs.gitlab.com/user/clusters/agent/" }] }
      - block: appData
        service: "Database per app, encrypted at rest"
        options:
          - { name: "CloudNativePG on Ceph", kind: open, url: "https://cloudnative-pg.io/docs/1.30/security/", note: "PostgreSQL per app; encryption at rest is left to the storage class (ceph-csi with a KMS).", packs: [upstreamOpenSource], watch: [{ text: "CloudNativePG leaves encryption at rest to the storage class, so the class sets ceph-csi encryption with Vault as the KMS; only the app's namespace may connect.", url: "https://cloudnative-pg.io/docs/1.30/security" }] }
          - { name: "EDB Postgres AI for CloudNativePG", kind: commercial, url: "https://www.enterprisedb.com/docs/postgres_for_kubernetes/latest/", note: "EDB's supported build of the same operator." }
          - { name: "Crunchy Postgres for Kubernetes", kind: commercial, url: "https://access.crunchydata.com/documentation/postgres-operator/latest", note: "Crunchy Data's PostgreSQL operator with commercial support." }
          - { name: "Rook", kind: open, url: "https://rook.io/docs/rook/latest-release/Getting-Started/intro/", note: "Operator that runs Ceph storage inside the cluster." }
          - { name: "OpenShift Data Foundation", kind: commercial, url: "https://www.redhat.com/en/technologies/cloud-computing/openshift-data-foundation", note: "Red Hat's software-defined storage for OpenShift; the Essentials tier comes with Platform Plus.", packs: [redHatOpenShiftAi], watch: [{ text: "ODF Essentials comes with Platform Plus; the PostgreSQL operator (CloudNativePG, EDB or another) is yours.", url: "https://www.redhat.com/en/technologies/cloud-computing/openshift-data-foundation" }] }
      - { block: orgData, service: "Systems of record, via token exchange", build: true, url: "https://www.keycloak.org/securing-apps/token-exchange", note: "Each approved connector is its own client at your identity provider; the app exchanges the user's token for one with that audience alone, so the connector applies the user's entitlements." }
      - block: provider
        service: "Approved model, reached only via the gateway"
        note: "Reached only from the gateway, which holds the key; neither the sandbox nor any generated app has a route to it."
        options:
          - { name: "vLLM", kind: open, url: "https://docs.vllm.ai/en/latest/", note: "Open-source inference server with an OpenAI-compatible API." }
          - { name: "Red Hat AI Inference (vLLM)", kind: commercial, url: "https://www.redhat.com/en/products/ai/inference", note: "Red Hat's supported vLLM build, GA in OpenShift AI 3.5.", packs: [redHatOpenShiftAi], watch: [{ text: "All three GA in OpenShift AI 3.5 per Red Hat's supported-configurations list.", url: "https://access.redhat.com/articles/rhoai-supported-configs" }] }
          - { name: "NVIDIA NIM", kind: commercial, url: "https://docs.nvidia.com/nim/large-language-models/about-nim-llm/overview", note: "NVIDIA's prebuilt, optimised inference containers for LLMs on NVIDIA GPUs." }
          - { name: "An approved hosted model API, via the gateway", kind: commercial, url: "https://docs.litellm.ai/docs/providers", note: "A provider's API reached only from the gateway, which holds the key; no sandbox or app has a route to it." }
          - { name: "Your models via GitLab's self-hosted AI gateway", kind: commercial, url: "https://docs.gitlab.com/administration/gitlab_duo_self_hosted/", note: "For Duo Agent Platform flows: vLLM, Bedrock or Azure OpenAI behind GitLab's self-hosted AI gateway.", packs: [gitlabUltimate] }
          - { name: "vLLM or an approved model API, via LiteLLM", kind: open, url: "https://docs.litellm.ai/docs/providers", packs: [upstreamOpenSource] }
      - { block: sources, service: "Public npm and PyPI, via the mirror only", url: "https://help.sonatype.com/en/routing-rules.html", note: "Through your egress control; nothing inside the data centre installs from them directly." }
      - block: govIdentity
        service: "Identity provider and workload identity"
        options:
          - { name: "Keycloak", kind: open, url: "https://www.keycloak.org/securing-apps/token-exchange", note: "People and service clients in one realm, with token exchange for hand-offs.", packs: [upstreamOpenSource] }
          - { name: "Red Hat build of Keycloak", kind: commercial, url: "https://access.redhat.com/products/red-hat-build-keycloak/", note: "Supported Keycloak build from Red Hat.", packs: [redHatOpenShiftAi], watch: [{ text: "ZTWIM 1.1 GA July 2026; SPIRE in OpenShift Service Mesh 3.5 is GA in sidecar mode, not yet in ambient mode.", url: "https://www.redhat.com/en/blog/zero-trust-workload-identity-manager-11-generally-available-red-hat-openshift" }] }
          - { name: "Kubernetes ServiceAccount tokens", kind: open, url: "https://kubernetes.io/docs/concepts/security/service-accounts/", note: "Short-lived projected tokens give each workload an identity the IdP and vault can verify.", packs: [upstreamOpenSource] }
          - { name: "SPIFFE and SPIRE", kind: open, url: "https://spiffe.io/docs/latest/spire-about/", note: "Attested workload identities and trust-domain federation, an alternative to keys per client." }
          - { name: "Red Hat zero trust workload identity manager", kind: commercial, url: "https://www.redhat.com/en/blog/zero-trust-workload-identity-manager-11-generally-available-red-hat-openshift", note: "Red Hat's SPIRE operator, GA 1.1 (July 2026), with Vault and cert-manager as upstream authorities.", packs: [redHatOpenShiftAi] }
          - { name: "Gravitee Access Management", kind: commercial, url: "https://documentation.gravitee.io/am/4.11/guides/developer-contributions/using-oauth-2.0-token-exchange", note: "Gravitee's IdP and authorisation server, with delegated token exchange.", packs: [graviteeAgentMesh] }
      - block: govSecrets
        service: "Secrets manager with a hardware root"
        options:
          - { name: "HashiCorp Vault", kind: commercial, url: "https://developer.hashicorp.com/vault/docs/deploy/kubernetes/vso", note: "Dynamic credentials, transit keys and the Vault Secrets Operator; HSM auto-unseal needs Vault Enterprise.", packs: [upstreamOpenSource] }
          - { name: "OpenBao", kind: open, url: "https://openbao.org/docs/configuration/seal/pkcs11/", note: "Open-source fork of Vault under the Linux Foundation's OpenSSF; documents a PKCS#11 HSM seal.", packs: [upstreamOpenSource] }
          - { name: "External Secrets Operator", kind: open, url: "https://external-secrets.io/latest/", note: "Syncs secrets from an external store into Kubernetes Secrets; pairs with any vault here." }
          - { name: "External Secrets Operator for Red Hat OpenShift", kind: commercial, url: "https://developers.redhat.com/articles/2025/11/11/introducing-external-secrets-operator-openshift", note: "Red Hat-supported ESO, GA for OpenShift 4.20+, syncing from Vault or CyberArk Conjur.", packs: [redHatOpenShiftAi], watch: [{ text: "GA for OpenShift 4.20+; it syncs from a vault you run, such as HashiCorp Vault or CyberArk Conjur.", url: "https://developers.redhat.com/articles/2025/11/11/introducing-external-secrets-operator-openshift" }] }
          - { name: "Idira Secrets Manager, self-hosted (Palo Alto Networks)", kind: commercial, url: "https://www.paloaltonetworks.com/idira/machine/secrets-management", note: "The former CyberArk line now under Palo Alto's Idira brand; SaaS or self-hosted for air-gapped sites." }
          - { name: "Vault Secrets Operator", kind: open, url: "https://developer.hashicorp.com/vault/docs/deploy/kubernetes/vso/sources/vault", packs: [upstreamOpenSource] }
      - block: govPolicy
        service: "Network, admission and guardrail policy"
        options:
          - { name: "Kubernetes", kind: open, url: "https://kubernetes.io/docs/concepts/overview/", note: "The container platform each platform pack here runs on, upstream or as a distribution (OpenShift, VKS, Canonical Kubernetes).", packs: [upstreamOpenSource, redHatOpenShiftAi] }
          - { name: "Kyverno", kind: open, url: "https://kyverno.io/docs/policy-types/validating-policy/", packs: [upstreamOpenSource] }
          - { name: "Cilium", kind: open, url: "https://docs.cilium.io/en/stable/security/policy/", packs: [upstreamOpenSource] }
          - { name: "Backstage", kind: open, url: "https://backstage.io/docs/features/software-catalog/descriptor-format", packs: [upstreamOpenSource] }
          - { name: "Squid outbound proxy", kind: open, url: "https://www.squid-cache.org/Doc/config/access_log/", note: "The single exit for search and page fetches, with an access log for review.", packs: [upstreamOpenSource] }
      - block: govSupplyChain
        service: "Mirrors, scanners and signing in the pipeline"
        options:
          - { name: "Trivy", kind: open, url: "https://trivy.dev/docs/latest/guide/scanner/vulnerability/", packs: [upstreamOpenSource] }
          - { name: "Semgrep Community Edition", kind: open, url: "https://docs.semgrep.dev/cli-reference", packs: [upstreamOpenSource] }
          - { name: "gitleaks", kind: open, url: "https://github.com/gitleaks/gitleaks", packs: [upstreamOpenSource] }
          - { name: "Syft", kind: open, url: "https://github.com/anchore/syft", packs: [upstreamOpenSource] }
      - block: govObservability
        service: "Logs, traces and SIEM for builds and apps"
        options:
          - { name: "OpenTelemetry Collector", kind: open, url: "https://opentelemetry.io/docs/collector/", note: "Vendor-neutral pipeline that receives gateway logs and traces and forwards them to stores the agent cannot write.", packs: [upstreamOpenSource] }
          - { name: "Grafana Loki", kind: open, url: "https://grafana.com/docs/loki/latest/", note: "Log store; turn retention on, or logs are kept for ever.", packs: [upstreamOpenSource] }
          - { name: "Langfuse (self-hosted)", kind: open, url: "https://langfuse.com/self-hosting", note: "Self-hosted LLM tracing and evaluation, with a documented LiteLLM integration.", packs: [upstreamOpenSource] }
          - { name: "MLflow Tracing", kind: open, url: "https://mlflow.org/docs/latest/genai/tracing/", note: "Agent and LLM tracing; GA in OpenShift AI 3.5, where the visual agent-trace view is Technology Preview.", packs: [redHatOpenShiftAi], watch: [{ text: "MLflow is GA in OpenShift AI 3.5; the visual agent-trace view is Technology Preview. The SIEM is yours.", url: "https://www.redhat.com/en/blog/red-hat-ai-35-scaling-and-governing-ai-agents-production" }] }
          - { name: "Elastic Security", kind: commercial, url: "https://www.elastic.co/docs/solutions/security", note: "SIEM and detection engine; one example of where detections on gateway, egress and audit logs run." }
    sources:
      intake: https://docs.litellm.ai/docs/apply_guardrail
      orgData: https://www.keycloak.org/securing-apps/token-exchange
      sources: https://help.sonatype.com/en/routing-rules.html
    alsoNeeded:
      - service: "Identity provider with group access, a second factor and token exchange"
        role: identity
        why: "One realm or directory for the intake, source control, the deploy gate and each app's own client, with group-based access, the second-factor flow and token exchange for connectors (for example Keycloak)."
        url: https://www.keycloak.org/guides
      - service: "A shared front door for previews and apps"
        role: ingress
        why: "Where the sign-in policies sit and canary weights are applied (for example Envoy Gateway with OIDC SecurityPolicies)."
        url: https://gateway.envoyproxy.io/docs/
      - service: "Secrets manager and delivery to apps"
        role: secrets
        why: "Each app receives its secrets at run time under its own identity, and the agent and pipeline hold no access to app paths (for example HashiCorp Vault or OpenBao, delivered by the Vault Secrets Operator or External Secrets Operator)."
        url: https://developer.hashicorp.com/vault/docs/deploy/kubernetes/vso
      - service: "Certificate issuance from an internal authority"
        role: keys
        why: "Every service in the factory and every app hostname needs a certificate from an authority you run (for example cert-manager with your internal CA)."
        url: https://cert-manager.io/docs/
      - service: "Private container registry with a proxy cache"
        role: registry
        why: "Stores the sandbox, runner and app images inside the data centre; public images enter only through its proxy cache (for example Harbor)."
        url: https://goharbor.io/docs/2.16.0/administration/configure-proxy-cache/
      - service: "Egress control with an access log"
        role: network
        why: "The controlled route out for the package mirror, the gateway and the scanner data mirrors, and the log the shadow-AI review reads (for example a Squid forward proxy)."
        url: https://www.squid-cache.org/Doc/config/access_log/
      - service: "An app register and templates"
        role: other
        why: "Templates create each app's repository, token and register entry, and the register records owner, data, connectors and end date (for example Backstage with its GitLab scaffolder module, Red Hat Developer Hub, or a CMDB)."
        url: https://backstage.io/docs/features/software-catalog/descriptor-format
      - service: "Admission policy for app and preview namespaces"
        role: other
        why: "Manifests are held to the baseline at the cluster, and the same rules are checked in the pipeline (for example Kyverno, OPA Gatekeeper or Kubernetes ValidatingAdmissionPolicy)."
        url: https://kyverno.io/docs/policy-types/validating-policy/
      - service: "Encrypted block storage for app databases"
        role: other
        why: "Every app database sits on volumes encrypted per volume, with keys in your secrets manager (for example Ceph with ceph-csi and LUKS encryption)."
        url: https://raw.githubusercontent.com/ceph/ceph-csi/devel/docs/rbd/deploy.md
      - service: "Mirrored scanner databases and rules"
        role: other
        why: "Scanning inside a closed network needs the scanners' databases mirrored to your registry and their rules copied in, both refreshed by you (for example Trivy's databases and Semgrep's rules)."
        url: https://trivy.dev/docs/latest/guide/advanced/self-hosting/
      - service: "A log store with retention you set, and the SIEM"
        role: logging
        why: "Source control, deploy gate, platform audit and proxy logs kept with retention you set, beside the agent traces (for example Grafana Loki with Langfuse)."
        url: https://grafana.com/docs/loki/latest/operations/storage/retention/
    quickstart:
      - title: "Sandbox controller, for example agent-sandbox: Overview"
        url: https://agent-sandbox.sigs.k8s.io/docs/getting_started/overview/
      - title: "Sandbox controller, for example agent-sandbox: Claude Code in Agent Sandbox"
        url: https://agent-sandbox.sigs.k8s.io/docs/use-cases/examples/claude-code-sandbox/
      - title: "Deploy gate, for example Argo CD: Getting Started"
        url: https://argo-cd.readthedocs.io/en/stable/getting_started/
    hosting:
      - id: kubernetes
        kind: cluster
        name: "Kubernetes (agent-sandbox on gVisor or Kata)"
        url: https://agent-sandbox.sigs.k8s.io/docs/getting_started/overview/
        asOf: "2026-11"
        mapped: true
        compare:
          runs: "Your orchestrator creates one SandboxClaim per build from a SandboxWarmPool of a reviewed template; gVisor or Kata Containers, set by RuntimeClass, separates each pod."
          patching: "Your organisation patches the nodes, Kubernetes, the agent-sandbox controller and router, gVisor or Kata, the agent CLI and its images."
          data: "Specs, code and build output sit in the sandbox pod on your nodes, then in GitLab and Harbor; prompts and code leave only through LiteLLM to the provider."
          network: "Without an explicit policy a SandboxTemplate allows the public internet and blocks private ranges; your policy narrows it to LiteLLM, Nexus and GitLab."
          identity: "Template-made sandbox pods get no ServiceAccount token by default; a claim can pass only plain spec.env values, if the template's envVarsInjectionPolicy allows it."
          accepts: "Any OCI image, so any agent CLI, language or toolchain; agent-sandbox has examples for Claude Code, OpenCode, Aider and a LangGraph coding agent."
          workload: "A build runs until its claim's shutdownTime or ttlSecondsAfterFinished; warm pools keep sandboxes pre-started; parallel builds are bounded by nodes and quotas."
          portability: "Sandbox objects and images move to any Kubernetes cluster with agent-sandbox installed; the RuntimeClass name is the runtime-specific part."
          effort: "Your team operates the cluster, agent-sandbox, the sandbox runtime on its nodes, warm pools, and the LiteLLM, GitLab and Argo CD around them."
          fits: "agent-sandbox lists coding agents among its use cases, isolating generated code that may fail, loop or behave unexpectedly from your infrastructure."
        sources:
          - https://agent-sandbox.sigs.k8s.io/docs/
          - https://agent-sandbox.sigs.k8s.io/docs/api/
          - https://agent-sandbox.sigs.k8s.io/docs/use-cases/coding-agents/
          - https://agent-sandbox.sigs.k8s.io/docs/use-cases/examples/claude-code-sandbox/
          - https://agent-sandbox.sigs.k8s.io/docs/use-cases/examples/opencode-sandbox/
          - https://agent-sandbox.sigs.k8s.io/docs/use-cases/ci-cd/
          - https://agent-sandbox.sigs.k8s.io/docs/use-cases/gvisor-isolation/
          - https://raw.githubusercontent.com/kubernetes-sigs/agent-sandbox/main/README.md
          - https://kubernetes.io/docs/concepts/security/multi-tenancy/
          - https://docs.gitlab.com/runner/executors/kubernetes/
      - id: knative
        kind: runtime
        name: "Knative Serving"
        url: https://knative.dev/docs/serving/
        asOf: "2026-11"
        compare:
          runs: "Knative Serving starts the agent's pods on requests; with containerConcurrency 1 a pod runs one build at a time, and each build's commands run in their own sandbox."
          patching: "You do: the cluster and nodes, Knative Serving and its networking layer, upgraded one minor version at a time, agent-sandbox, and the agent image."
          data: "Specs and code are processed in the agent's pods on your servers; an idle instance may be killed, so state lives in GitLab, the sandbox or a store you run."
          network: "Services are private on the cluster domain until a domain name is configured; the activator and queue-proxy join the path; egress stays your NetworkPolicy."
          identity: "Revision pods run as the namespace's default ServiceAccount unless serviceAccountName is set; tokens and RBAC are those of Kubernetes."
          accepts: "Any container that serves HTTP; runtimeClassName, persistent volume claims and init containers are extensions behind flags that are off by default."
          workload: "Each build request ends at timeoutSeconds (default 300, at most 600 unless raised); idle Revisions scale to zero, and the first build after idle waits for a pod."
          portability: "The agent stays an HTTP container; moving off means replacing the Knative Service, its routing and autoscaling with Kubernetes objects."
          effort: "You still operate everything: the cluster, Knative's activator and autoscaler, a networking layer, agent-sandbox for the builds, and every upgrade."
          fits: "Knative's runtime contract describes stateless computation at request or event scale, with little or no long-term runtime state in the container."
        sources:
          - https://knative.dev/docs/serving/
          - https://knative.dev/docs/serving/request-flow/
          - https://knative.dev/docs/serving/configuration/config-defaults/
          - https://knative.dev/docs/serving/configuration/feature-flags/
          - https://knative.dev/docs/serving/autoscaling/concurrency/
          - https://knative.dev/docs/serving/autoscaling/scale-to-zero/
          - https://knative.dev/docs/serving/services/private-services/
          - https://knative.dev/docs/install/yaml-install/serving/install-serving-with-yaml/
          - https://knative.dev/docs/install/upgrade/upgrade-installation/
          - https://raw.githubusercontent.com/knative/specs/main/specs/serving/runtime-contract.md
          - https://agent-sandbox.sigs.k8s.io/docs/use-cases/examples/claude-code-sandbox/
        summary: "The factory's agent loop runs as a Knative Service on your cluster, started by the intake's request and scaled to zero between builds, while each build's commands still run in their own agent-sandbox claim, driven through the sandbox router. Knative adds its activator and queue-proxy to the path and ends every request at its timeout, so a build must finish within it or be split into steps. You install and upgrade Knative, and you still operate everything."
        bindings:
          - { block: harness, service: "Your agent loop as a Knative Service (Knative Serving)", build: true, note: "Calls the gateway and drives each build's sandbox claim through the sandbox client; containerConcurrency 1, cluster-local, its own serviceAccountName.", url: https://knative.dev/docs/serving/, watch: [{ text: "A build is one request and ends at timeoutSeconds (default 300, at most 600 unless max-revision-timeout-seconds is raised together with the activator's terminationGracePeriodSeconds); a longer build is split into steps the intake drives, or uses the Kubernetes option.", url: "https://knative.dev/docs/serving/configuration/config-defaults/" }, { text: "Pods scale with traffic, not per build: with containerConcurrency 1 a pod takes one request at a time and then the next, and an idle container may be killed or have its CPU withheld, so nothing may live only in the pod between builds.", url: "https://raw.githubusercontent.com/knative/specs/main/specs/serving/runtime-contract.md" }] }
        addSettings: [knativeRequestLimits, knativeScaleBounds, knativeClusterLocalVisibility, knativeActivatorIngress]
        differences:
          - at: intake->harness
            text: "On Knative Serving, a build request reaches the agent through the queue-proxy sidecar and, at low or zero traffic, the activator, a component shared by every Knative Service in the knative-serving namespace. Network rules must admit that hop, and the first request after idle waits for a pod to start."
            url: https://knative.dev/docs/serving/request-flow/
            change: "Knative option only: insert a 'Knative activator (shared) and queue-proxy' hop on intake->harness, drawn inside the cluster."
        alsoNeeded:
          - service: "Knative Serving (controller, autoscaler, activator)"
            role: other
            why: "Runs and scales the agent's Service; you install it and upgrade it one minor version at a time, and its activator is shared by every Service."
            url: https://knative.dev/docs/install/upgrade/upgrade-installation/
          - service: "A Knative networking layer"
            role: ingress
            why: "Kourier, Contour, Istio or the Gateway API plugin, which is beta; the agent stays cluster-local and is reached only by the intake."
            url: https://knative.dev/docs/install/yaml-install/serving/install-serving-with-yaml/
        quickstart:
          - title: "Overview - Knative"
            url: https://knative.dev/docs/serving/
          - title: "Configure the Defaults ConfigMap - Knative"
            url: https://knative.dev/docs/serving/configuration/config-defaults/
          - title: "Sandbox controller, for example agent-sandbox: Claude Code in Agent Sandbox"
            url: https://agent-sandbox.sigs.k8s.io/docs/use-cases/examples/claude-code-sandbox/
