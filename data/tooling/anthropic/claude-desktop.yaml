# Claude Desktop — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
vendor: anthropic
family: Claude Desktop
tools:
  - id: toolClaudeDesktop
    name: Claude Desktop
    surfaceClasses:
      - desktopApp
      - saasChat
    variants:
      - name: Claude Desktop
        class: desktopApp
      - name: claude.ai web
        class: saasChat
    architecture: archEnterpriseAiChat
    status: ga
    asOf: 2026-08
    summary:
      - Enterprise installers (macOS PKG, Windows per-user MSIX) deploy via Jamf, Kandji, Intune,
        SCCM or GPO, with device-level policies covering extensions, local MCP, auto-updates and
        forced org login, plus an in-console desktop-extension allowlist and org-wide managed
        connector authorization for Team and Enterprise plans.
    items:
      - title: Managed deployment and device policies
        body:
          - "Device policies live in the macOS configuration-profile domain
            com.anthropic.claudefordesktop and the Windows HKLM policy registry. The keys that
            matter for control: isDesktopExtensionEnabled and isDesktopExtensionDirectoryEnabled
            (kill switches for extensions and the directory), isLocalDevMcpEnabled (local MCP server
            connections), isClaudeCodeForDesktopEnabled, forceLoginOrgUUID, allowedWorkspaceFolders
            and auto-update enforcement. Device-level policy overrides the in-app allowlist."
        links:
          - title: Enterprise configuration for Claude Desktop
            url: https://support.claude.com/en/articles/12622667-enterprise-configuration-for-claude-desktop
      - title: Extension allowlist and managed connector authorization
        body:
          - Team and Enterprise Owners can turn on the desktop extension allowlist (Organization
            settings → Connectors → Desktop). It ships disabled — every extension is available until
            it is enabled — and enabling it force-deletes existing non-allowlisted installs; custom
            org-scoped extensions upload in .mcpb format. Managed authorization (beta) lets admins
            authorize MCP connectors org-wide through the IdP, assign them by role and scope their
            permissions.
        links:
          - title: Desktop extension allowlist
            url: https://support.claude.com/en/articles/12592343-enabling-and-using-the-desktop-extension-allowlist
          - title: Org-wide MCP connector authorization
            url: https://support.claude.com/en/articles/15537633-authorize-mcp-connectors-for-your-entire-organization
    controls: []
    sources:
