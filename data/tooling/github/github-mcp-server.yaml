      - title: >-
          CVE-2026-48529 — self-hosted HTTP mode with lockdown on ran every user's repository-access checks on the
          first user's GraphQL client (GitHub-assigned; fixed 1.1.2)
        url: https://github.com/advisories/GHSA-pjp5-fpmr-3349
        date: "2026-06"
      - title: >-
          CVE-2026-47427 — nil pointer dereference in the completion/complete handler lets an unauthenticated request
          crash the server (GitHub-assigned; fixed 1.1.0)
        url: https://github.com/advisories/GHSA-w4q6-qw23-4rg7
        date: "2026-07"
      - title: >-
          Invariant Labs research (no CVE) — a public-repository issue steers an agent using the GitHub MCP server to
          leak private-repository data into a public pull request
        url: https://invariantlabs.ai/blog/mcp-github-vulnerability
        date: "2025-05"
