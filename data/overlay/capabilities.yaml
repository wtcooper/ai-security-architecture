# Authored catalogue of security capabilities: durable operational outcomes, technology-agnostic.
attribution: Authored in this repository for the capability layer; cap-* identifiers, titles, descriptions,
  surface notes and process items are repository keys and prose, not a published standard. The controls
  delivered are CoSAI controls, the technology categories are the OWASP, ENISA and ECSO categories in
  technology-categories.yaml, and the people are CoSAI personas; a mapping records that a capability
  delivers a control, not that the control is fulfilled.
capabilities:
  - id: cap-training-data-governance
    title: Training Data Governance
    description: The organisation knows where every training and evaluation dataset came from, that its use
      is authorised for the intended purpose, and that poisoned or sensitive records are found and removed
      before a model learns from them. It is largely a provenance and approval discipline; scanning tools
      assist, but the authorisation decision is human.
    controls: [controlTrainingDataManagement, controlTrainingDataSanitization]
    surfaces:
      surfaceEndpoint:
        applies: false
        note: Managed devices consume models rather than train them, and a developer fine-tuning on a laptop
          is an unsanctioned path that policy, not device tooling, has to close.
      surfaceCloud:
        applies: true
        note: The primary surface; dataset provenance, use approvals and poisoning screens sit in the
          pipelines and data stores the organisation operates.
      surfaceSaas:
        applies: true
        note: Reduces to the tenant settings and contract terms that decide whether the vendor may train on
          your prompts and files, and to checking the vendor's own data-sourcing attestations.
    realization:
      technology: [tech-ai-spm, tech-dlp]
      process:
        - title: Data-use authorisation review
          note: Every dataset is approved for a named purpose with its licence, consent basis and owner
            recorded before training or evaluation begins.
        - title: Pre-training poisoning and sensitivity screen
          note: Datasets are scanned for injected, anomalous and sensitive records at ingestion and again
            before each training run.
        - title: Vendor training opt-out review
          note: Tenant data-training settings and contract clauses for each vendor AI service are checked at
            onboarding and on every contract renewal.
      people: [personaDataProvider, personaModelProvider, personaGovernance]

  - id: cap-privacy-preserving-ai
    title: Privacy-Preserving AI
    description: Personal data is minimised, de-identified or kept out of reach across the whole AI lifecycle,
      from the records a model is trained on to the prompts and logs an application retains, and everything
      kept is handled within the consent under which it was collected. Differential privacy, federated
      training and encrypted inference are the advanced end; redaction, tokenisation and retention limits
      are the everyday one.
    controls: [controlModelPrivacyEnhancingTechnologies, controlRuntimePrivacyEnhancingTechnologies,
      controlUserDataManagement]
    surfaces:
      surfaceEndpoint:
        applies: true
        note: Device-side redaction strips personal data from prompts, pastes and uploads before they leave
          the machine, and on-device processing keeps some inference local altogether.
      surfaceCloud:
        applies: true
        note: The organisation chooses the privacy techniques applied in its own training and inference
          paths and owns retention, de-identification and deletion of the prompts and logs it stores.
      surfaceSaas:
        applies: true
        note: Limited to tokenising or redacting through a proxy before the request reaches the vendor, and
          to the retention, training-use and deletion settings the vendor tenant exposes.
    realization:
      technology: [tech-tokenisation, tech-dlp, tech-llm-guardrails]
      process:
        - title: Personal-data flow assessment
          note: Each AI use case is assessed for what personal data enters prompts, context, training sets
            and logs, and the minimisation technique chosen for each flow is recorded.
        - title: Prompt and log retention schedule
          note: Retention periods, de-identification steps and deletion paths for user prompts, transcripts
            and inference logs are defined and reviewed annually.
      people: [personaModelProvider, personaApplicationDeveloper, personaGovernance]

  - id: cap-ai-data-protection
    title: AI Data Protection
    description: Models, weights, datasets, retrieval indexes and agent state are protected where they rest
      and where they are served, so exposure is limited to what the serving path needs and a poisoned or
      tampered index is noticed. Encryption and key custody cover storage; provenance, deduplication and
      anomaly checks cover what retrieval feeds the model.
    controls: [controlRetrievalAndVectorSystemIntegrity, controlModelAndDataAccessControls]
    surfaces:
      surfaceEndpoint:
        applies: true
        note: Disk encryption and the OS key store protect local model caches, agent memory files and any
          local vector index, and device policy decides which repositories a local agent may index.
      surfaceCloud:
        applies: true
        note: Customer-managed keys over stores, logs and artifacts, plus provenance, signing and anomaly
          checks on the retrieval indexes the organisation builds and serves.
      surfaceSaas:
        applies: true
        note: Reduces to the customer-managed-key option a vendor offers and to governing which of your
          document sources the vendor's connectors are allowed to index.
    realization:
      technology: [tech-dlp, tech-encryption, tech-llm-guardrails]
      process:
        - title: Retrieval source admission
          note: Every source feeding a retrieval index is approved, attributed and periodically re-checked
            for tampering or unexpected content.
        - title: Key custody review
          note: Ownership, rotation and access to the keys protecting model artifacts, datasets and logs are
            reviewed on a fixed cadence.
      people: [personaApplicationDeveloper, personaPlatformProvider, personaDataProvider]

  - id: cap-ai-asset-inventory
    title: AI Asset Inventory
    description: The organisation can list every model, dataset, agent, tool server and AI application in
      use, who owns it, what state it is in and whether it was authorised to exist. Static artifacts are
      tracked through build and deployment; agents are tracked as live entities with lifecycle states so an
      unregistered one can be detected and blocked.
    controls: [controlModelAndDataInventoryManagement, controlAgentInventoryManagement]
    surfaces:
      surfaceEndpoint:
        applies: true
        note: Device management and endpoint tooling enumerate the agents, extensions, local models and tool
          servers installed on managed devices.
      surfaceCloud:
        applies: true
        note: Posture tooling discovers models, datasets, agents and their configuration directly in the
          accounts the organisation operates, and the registry gates credential issuance.
      surfaceSaas:
        applies: true
        note: Sanctioned-app discovery and the vendor's admin APIs reveal which vendor AI applications,
          custom agents and connectors your tenant runs; the vendor's own stack is not inventoried.
    realization:
      technology: [tech-ai-spm, tech-iga, tech-endpoint, tech-casb]
      process:
        - title: Agent registration before credentials
          note: No agent or tool server receives credentials until it has an inventory entry with an owner
            and a lifecycle state.
        - title: Quarterly inventory reconciliation
          note: Discovered assets are reconciled against the registry, and unregistered or decommissioned
            entries are investigated.
      people: [personaGovernance, personaPlatformProvider, personaAgenticProvider]

  - id: cap-ai-access-management
    title: AI Access Management
    description: Humans, services and agents reach only the models, data, applications and tools they are
      authorised for, credentials are scoped to a tenant and a task, and a component can verify at
      invocation time that the thing it is calling is the registered principal it claims to be. It spans
      identity federation, resource-level authorisation, quotas and short-lived credential brokering.
    controls: [controlModelAndDataAccessControls, controlApplicationAccessManagement,
      controlAgentCredentialIsolation, controlComponentIdentityProvenance]
    surfaces:
      surfaceEndpoint:
        applies: true
        note: MFA and device posture gate the user session a local agent inherits, and brokered short-lived
          credentials replace the long-lived tokens that otherwise live in agent configuration files.
      surfaceCloud:
        applies: true
        note: Fully the organisation's to design across models, datasets, agents and configuration stores,
          including per-tenant credential issuance and registry-backed component identity.
      surfaceSaas:
        applies: true
        note: Enforced at federation; conditional access and tenant roles govern entry and connector
          scopes, while the vendor's internal credentials stay its own.
    realization:
      technology: [tech-access, tech-authentication, tech-pam, tech-iga, tech-casb]
      process:
        - title: Entitlement review for AI resources
          note: Access to models, datasets, agents and their tools is reviewed on the same cadence as other
            privileged access, with agent identities included.
        - title: Credential scope standard
          note: Agent and service credentials are issued per tenant, bounded to a session or task, and
            revoked on lifecycle change.
      people: [personaPlatformProvider, personaApplicationDeveloper, personaAgenticProvider]

  - id: cap-ai-supply-chain-integrity
    title: AI Supply Chain Integrity
    description: Every model, dataset, library, agent configuration and route definition the organisation
      runs is of known provenance, signed, verified before use and unchanged from its approved state, and
      the frameworks and tooling it is built on are secure by default. Drift between a running agent and
      its registered baseline is treated as an integrity failure.
    controls: [controlModelAndDataIntegrityManagement, controlModelAndDataExecutionIntegrity,
      controlSecureByDefaultMLTooling, controlAgentIntegrityManagement, controlOrchestratorAndRouteIntegrity]
    surfaces:
      surfaceEndpoint:
        applies: true
        note: Agent binaries, extensions and locally cached models are installed only from allow-listed,
          signed sources and their hashes are verified by device management.
      surfaceCloud:
        applies: true
        note: Signing, attestation and integrity monitoring run across the pipelines, registries and serving
          hosts the organisation operates, with route and configuration changes recorded.
      surfaceSaas:
        applies: false
        note: The vendor builds, signs and routes its own models and agents; what the organisation can hold
          is the vendor's attestation, which is a governance review matter.
    realization:
      technology: [tech-cwpp, tech-cspm, tech-ast, tech-ai-spm]
      process:
        - title: Artifact signing and verification policy
          note: Models, datasets and agent configurations are signed at build and verified at load, and
            unsigned artifacts are refused.
        - title: Change control for runtime AI components
          note: Modifications to serving code, routes and agent baselines go through recorded, approved
            change with a rollback path.
        - title: Secure-by-default tooling baseline
          note: Approved frameworks, libraries and hardware configurations are maintained, and deviations
            require a recorded exception.
      people: [personaModelProvider, personaPlatformProvider, personaAgenticProvider,
        personaApplicationDeveloper]

  - id: cap-workload-isolation
    title: AI Workload Isolation
    description: Inference, training and agent execution run inside boundaries that third parties and
      neighbouring tenants cannot cross, components talk to each other only over authenticated encrypted
      channels, and an agent cannot run away with unbounded tool calls, tokens or time. Hardware enclaves
      are the strongest form; sandboxes, segmentation and orchestration limits are the common one.
    controls: [controlIsolatedConfidentialComputing, controlInterComponentTransportSecurity,
      controlAgentExecutionBounds]
    surfaces:
      surfaceEndpoint:
        applies: true
        note: Sandboxing and the host firewall confine what a CLI or desktop agent can touch and reach, and
          per-session limits in the agent harness bound its execution.
      surfaceCloud:
        applies: true
        note: Confidential compute families, per-session isolated runtimes, segmented networks, mTLS between
          components and orchestration-layer budgets are all selectable in the platforms the organisation
          operates.
      surfaceSaas:
        applies: false
        note: The vendor decides how its workloads are isolated and how its components communicate; a
          session sandbox or turn limit a managed runtime exposes is vendor configuration, not isolation the
          organisation provides.
    realization:
      technology: [tech-enclaves, tech-sandbox, tech-firewalls, tech-swg, tech-encryption]
      process:
        - title: Isolation tier per workload
          note: Each AI workload is assigned an isolation tier, from sandbox to confidential compute,
            according to the data and actions it handles.
        - title: Execution limit defaults
          note: Maximum turns, tool-call budgets and wall-clock limits are set as defaults in every agent
            framework, and exceptions are recorded.
      people: [personaPlatformProvider, personaAgenticProvider, personaModelServing]

  - id: cap-runtime-guardrails
    title: AI Runtime Guardrails
    description: Every prompt, retrieved context and model output passes a policy check before it reaches
      the model, an application, a tool or a user, so injection attempts are blocked and unsafe or sensitive
      outputs are sanitised. The policies are the organisation's own and are versioned, tested and tuned
      like any other detection content.
    controls: [controlInputValidationAndSanitization, controlOutputValidationAndSanitization]
    surfaces:
      surfaceEndpoint:
        applies: true
        note: Client-side hooks at the pre-tool-call boundary of local coding agents and device-resident
          data inspection see prompts and outputs on the machine, though the same process can sometimes
          bypass them.
      surfaceCloud:
        applies: true
        note: Native, policy-configurable and enforced server-side on the inference path the organisation
          operates, covering prompt, response and tool channels.
      surfaceSaas:
        applies: true
        note: The vendor's filters are fixed from the organisation's side; its own guardrails apply only to
          traffic it proxies, and the loop inside a fused chat product admits no check of its own.
    realization:
      technology: [tech-llm-guardrails, tech-dlp]
      process:
        - title: Guardrail policy lifecycle
          note: Input and output policies are owned, versioned, tested against a regression corpus and
            reviewed after every incident or model change.
      people: [personaApplicationDeveloper, personaModelServing, personaAgenticProvider]

  - id: cap-model-robustness
    title: Model Robustness Assurance
    description: Models, and the applications wrapped around them, are demonstrably resilient to adversarial
      prompts and inputs before release and remain so after every change. Adversarial training hardens the
      model; automated adversarial evaluation proves the deployed system holds up in the context it is used.
    controls: [controlAdversarialTrainingAndTesting]
    surfaces:
      surfaceEndpoint:
        applies: true
        note: The agent configuration, system prompt and tool set rolled out to devices are evaluated as a
          harness before release; the underlying model is usually remote.
      surfaceCloud:
        applies: true
        note: Training-time hardening and a full-depth evaluation gate on the systems the organisation
          builds and serves.
      surfaceSaas:
        applies: true
        note: Own evaluation suites can be run against vendor outputs and API tenancy within the vendor's
          acceptable-use terms, but hardening the model itself is the vendor's work.
    realization:
      technology: [tech-llm-benchmarking]
      process:
        - title: Pre-release adversarial evaluation gate
          note: No model or agent configuration ships without passing the adversarial test suite at an
            agreed threshold.
        - title: Regression on model change
          note: The suite is re-run whenever the underlying model, system prompt or tool set changes,
            including vendor-side model swaps.
      people: [personaModelProvider, personaApplicationDeveloper]

  - id: cap-agent-governance
    title: Agent Permissions and Oversight
    description: Agents act with the least privilege the current task needs, a person approves actions that
      change data or act on their behalf, and everything an agent does, calls and reasons about is logged
      so it can be audited and debugged. Delegation narrows authority at every hop rather than widening it.
    controls: [controlAgentPluginPermissions, controlAgentPluginUserControl, controlAgentObservability]
    surfaces:
      surfaceEndpoint:
        applies: true
        note: Permission modes, tool allow-lists and the interactive approval prompt in a local agent are
          this capability in its simplest form, provided traces are shipped off the device.
      surfaceCloud:
        applies: true
        note: Action policy expressed as code in the agent framework and gateway, approval as workflow
          checkpoints, and telemetry flowing straight into central logging.
      surfaceSaas:
        applies: true
        note: Limited to the connector scopes, confirmation steps and audit events a vendor exposes; managed
          runtimes evaluate a permission policy the organisation authors, fused chat products do not.
    realization:
      technology: [tech-agentic-security, tech-siem, tech-access]
      process:
        - title: Tool permission baseline per agent
          note: Each agent's permitted tools and the actions requiring human approval are defined, reviewed
            and re-approved when its scope changes.
        - title: Agent trace review
          note: Agent action logs are retained immutably and sampled for scope drift and unapproved actions
            on a fixed cadence.
      people: [personaAgenticProvider, personaApplicationDeveloper, personaEndUser]

  - id: cap-user-transparency
    title: User Transparency and Control
    description: People using an AI application are told, in plain terms, that they are dealing with AI,
      what its risks are and how their data will be used, and are given real choices over that use. It is
      delivered mainly through product design, notice writing and consent handling rather than security
      tooling.
    controls: [controlUserTransparencyAndControls]
    surfaces:
      surfaceEndpoint:
        applies: true
        note: The agent rollout on managed devices includes a visible notice of what the agent can read and
          send and a setting the user can turn off, enforced through the configuration the organisation
          deploys.
      surfaceCloud:
        applies: true
        note: Disclosures, consent prompts and data-use controls are built into the applications the
          organisation designs and can be verified in the product.
      surfaceSaas:
        applies: true
        note: The vendor's own notices are supplemented by the organisation's guidance to staff and by the
          tenant data-use settings it chooses to expose to them.
    realization:
      technology: []
      process:
        - title: AI disclosure standard
          note: Every AI-powered product or feature carries a reviewed disclosure of its AI nature,
            limitations and data use before launch.
        - title: Consent and control review
          note: Data-use choices offered to users are reviewed against the actual data flows whenever a
            feature or vendor changes.
        - title: Notice currency check
          note: Published AI notices and the vendor terms surfaced to users are re-read and updated at least
            annually.
      people: [personaApplicationDeveloper, personaGovernance, personaEndUser]

  - id: cap-ai-red-teaming
    title: AI Red Teaming
    description: The organisation attacks its own AI products and infrastructure on purpose, with people and
      tooling that think like adversaries, and turns what they find into fixes and better detections.
      Automated benchmarking feeds it but does not replace an independent exercise with defined scope and
      rules of engagement.
    controls: [controlRedTeaming]
    surfaces:
      surfaceEndpoint:
        applies: true
        note: Exercises target local agents on managed devices, including injection through repository
          files, extensions and tool servers the agent trusts.
      surfaceCloud:
        applies: true
        note: Full-depth engagements against the systems the organisation builds, from training pipelines
          to serving endpoints and agent orchestration.
      surfaceSaas:
        applies: true
        note: Engagements cover the organisation's integration, tenant configuration and connectors within
          the vendor's acceptable-use terms; the vendor's internals are its own red team's job.
    realization:
      technology: [tech-llm-benchmarking]
      process:
        - title: Annual AI red-team programme
          note: Scoped engagements against prioritised AI products and agents are planned, resourced and
            reported to governance each year.
        - title: Rules of engagement
          note: Scope, safety limits, vendor terms and data handling for each exercise are agreed in writing
            before it starts.
        - title: Findings to remediation
          note: Every finding is logged into vulnerability management with an owner and is retested after
            the fix.
      people: [personaGovernance, personaModelProvider, personaApplicationDeveloper]

  - id: cap-ai-vulnerability-management
    title: AI Vulnerability Management
    description: Weaknesses in AI infrastructure, applications, models and agent tooling are continually
      found, prioritised and fixed, and regressions are caught before they reach production. It extends
      ordinary vulnerability and posture management to model-serving dependencies, agent runtimes, tool
      servers and AI-specific configuration.
    controls: [controlVulnerabilityManagement]
    surfaces:
      surfaceEndpoint:
        applies: true
        note: Agent runtimes, extensions and locally installed tool servers on devices are scanned and
          patched like any other endpoint software.
      surfaceCloud:
        applies: true
        note: The whole stack is the organisation's to scan and test, from hosts and containers to
          model-serving dependencies and the AI application's own code.
      surfaceSaas:
        applies: true
        note: Reduces to reviewing the tenant configuration the vendor exposes and tracking the vendor's
          disclosed advisories; the vendor's stack is neither scannable nor the organisation's to patch.
    realization:
      technology: [tech-vulnerability, tech-ast, tech-cspm, tech-ai-spm]
      process:
        - title: AI asset scan coverage
          note: The inventory of models, agents, tool servers and AI applications is reconciled against
            scanning coverage so nothing runs unscanned.
        - title: Remediation targets by severity
          note: Fix timelines for AI findings match the organisation's existing severity standard and are
            reported against.
      people: [personaPlatformProvider, personaApplicationDeveloper, personaAgenticProvider]

  - id: cap-ai-threat-detection-response
    title: AI Threat Detection and Response
    description: Attacks on AI assets, infrastructure and products are detected from the telemetry of
      agents, gateways, hosts and vendor audit feeds, and the organisation can contain them by stopping a
      workload, revoking an identity or isolating a device, then recover and learn. AI events reach the
      security operation only when applications are instrumented to send them.
    controls: [controlThreatDetection, controlIncidentResponseManagement]
    surfaces:
      surfaceEndpoint:
        applies: true
        note: Endpoint detection has kernel-level sight of what a local agent did, and response can isolate
          the device, kill the agent process and revoke the credentials it held.
      surfaceCloud:
        applies: true
        note: The deepest signal set, straight from the organisation's own inference and agent planes, with
          automated response through platform integrations.
      surfaceSaas:
        applies: true
        note: Only as good as the vendor's exported audit events, usually coarse and delayed; response
          reduces to disabling the application and revoking sessions and connector grants.
    realization:
      technology: [tech-siem, tech-soar, tech-endpoint, tech-cwpp, tech-swg, tech-casb]
      process:
        - title: AI incident playbooks
          note: Playbooks for prompt injection, agent misuse, model theft and data exfiltration through AI
            channels are written, exercised and kept current.
        - title: AI detection content
          note: Detections for AI-specific attack patterns are authored, tuned and mapped to the telemetry
            each surface actually provides.
      people: [personaPlatformProvider, personaModelServing, personaGovernance]

  - id: cap-ai-governance-review
    title: AI Governance Review
    description: Every AI model, product and vendor service is validated against the organisation's security
      and privacy requirements before it is released or adopted, and the residual risk it carries is
      inventoried, measured and monitored by accountable owners. Evidence and risk tooling organise the
      work; the decisions are human.
    controls: [controlProductGovernance, controlRiskGovernance]
    surfaces:
      surfaceEndpoint:
        applies: true
        note: Agent and extension rollouts to managed devices pass a security review, and the residual risk
          of local agent access is recorded and owned.
      surfaceCloud:
        applies: true
        note: Release authorisation for the systems the organisation builds rests on evidence collected
          from its own platforms and pipelines.
      surfaceSaas:
        applies: true
        note: The dominant capability for vendor AI; supplier assessment, contract terms and attestations
          are the evidence, and adoption is a governed decision.
    realization:
      technology: [tech-audit, tech-vendor-risk]
      process:
        - title: AI product security review
          note: Each model, product or significant change is reviewed against the control requirements and
            formally authorised for release.
        - title: AI risk register
          note: Residual AI risks are recorded with an owner, measured on a cadence and reported to the
            governance board.
        - title: Vendor AI assessment
          note: Every vendor AI service is assessed at onboarding and reassessed on contract renewal or
            material change.
      people: [personaGovernance, personaApplicationDeveloper, personaModelProvider]

  - id: cap-ai-policy-education
    title: AI Policy and Education
    description: The organisation has published, understandable AI security and privacy policies for its
      employees and for the users of its products, and people have been taught what they mean in practice.
      It is the capability with the least technology and the widest reach; nothing else in the catalogue
      works if people do not know the rules.
    controls: [controlUserPoliciesAndEducation, controlInternalPoliciesAndEducation]
    surfaces:
      surfaceEndpoint:
        applies: true
        note: Acceptable-use rules for local agents say what they may read, send and execute on a managed
          device, and developers are trained on them before the agent is enabled.
      surfaceCloud:
        applies: true
        note: Secure AI development policy and training reach the teams building and operating the
          organisation's own AI systems.
      surfaceSaas:
        applies: true
        note: Staff policy and education for vendor AI tools cover what data may be entered and which
          connectors may be authorised, and user-facing policy explains the organisation's use of vendor AI.
    realization:
      technology: []
      process:
        - title: Policy authoring and publication
          note: Internal and user-facing AI security and privacy policies are owned, approved and published
            in plain language.
        - title: Role-based AI training
          note: Employees receive AI security training matched to their role, with developers and agent
            operators covered in depth, and completion is tracked.
        - title: Annual policy refresh
          note: Policies and training content are reviewed yearly and after any material change in AI use
            or regulation.
      people: [personaGovernance, personaEndUser, personaApplicationDeveloper]
