id: aiMadeExposure            # the key feed items and deep dives carry in `category`
slug: ai-made-exposure         # its address: /incidents/ai-made-exposure/
order: 6
name: "AI-made exposure"
short: "The AI's own output creates the opening: a generated app with no access rules, a committed key, a saved secret, a published page."
since: 2026-11-25
overview: >-
  AI tools now write and ship things for people: apps, commits, settings files, public pages. When
  nobody reads what they produce, the opening is in the output, and an attacker only has to find
  it. In November 2026 researchers found 24,664 Lovable-built sites handing out Supabase records
  on page load and 35,578 of 37,571 Grok Build apps open without sign-in. A coding agent committed
  a Together AI credential to a public repository, and an outsider used it to download customers'
  prompts. Claude Code's "don't ask again" saved keys into a settings file that GitGuardian found,
  with secrets, in 23,276 repositories. The check belongs where the output leaves: before the
  push, before publishing.
howItWorks:
  - "A person asks an AI tool to build, change or publish something, and does not read every file it writes."
  - "The output carries the opening: an app with no sign-in or no row-level policy, a key in a commit, a secret in a settings file, a page made public."
  - "It goes out under the tool's defaults: hosted publicly, pushed to a public repository, or committed with the rest of the project."
  - "Someone finds it, by listing a builder's apps or scanning public commits, and reads the data or uses the key before the owner notices."
signs:
  - "A secret scanner firing on a commit an agent made, or on an agent's own settings file in a repository."
  - "A generated app that sends records on page load to a visitor who has not signed in."
  - "Apps and pages published from an AI builder that nobody in security has a list of."
stops:
  - control: cap-sensitive-data-redaction
    how: "Secret detection runs on what the agent commits and pushes, before the push; at Together AI the scan found the key once it was already public."
  - control: cap-agent-action-policy-enforcement
    how: "A push to a public repository is something the agent proposes and a person confirms, set in managed settings no developer can loosen."
  - control: D3-CH
    how: "Scoped, short-lived or keyless credentials leave a committed or saved key little to open and little time to open it: Together AI's first fix."
  - control: D3-APA
    how: "A generated app answers no request until a signed-in user is bound to it, and its data store applies per-user rules whatever code the tool wrote."
  - control: D3-SYSVA
    how: "Test a generated app as an internet-facing application before it goes public: load it signed out and look at what the page is sent."
risks: [riskInsecureModelOutput, riskSensitiveDataDisclosure]
owasp: [LLM02:2026, LLM10:2026, ASI03]
atlas: [AML.T0095.000, AML.T0055, AML.T0049]
notSameAs:
  - pattern: exposed
    why: "A service or store people deployed open is exposed by default; here the open app, file or commit was the AI tool's own output."
  - pattern: identity
    why: "Once a leaked key is spent, the spending looks like stolen credentials; the item is filed here when the AI's own output leaked the key."
  - pattern: promptInjection
    why: "An agent that publishes data because content it read told it to is prompt injection; here nobody steered it."
