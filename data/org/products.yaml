# The products your organisation uses: tools, clouds and data centres, which of their settings
# you have switched on, and what you run in place of the reference. Shown on each pattern: a
# product's pill on Enable is coloured by its status, and each row of its settings by the
# setting's. Anything not listed reads "Not enabled".
#
# Key each entry by a tool id (data/tooling/, e.g. toolClaudeCode) or a platform id (data/clouds/:
# cloudAws, cloudAzure, cloudGcp, cloudOnPrem); key each setting by the id on its row.
#
#   status      enabled | testing | notEnabled
#   note        optional, shown on hover
#   settings    setting id -> { status, value, note, link }
#                 value  what you actually set, if it differs from the recommendation
#                 link   your own module, policy-as-code or runbook that applies it (https)
#   components  platforms only: what you run for a component in place of the reference service.
#               Key by the component's id as the pattern file names it (gateway, harness, memory ...)
#               to apply on every pattern that has it, or by "<pattern id>/<component id>" for one
#               pattern. The drawing then shows your choice in that box, marked as yours, and How it
#               works lists it beside the reference.
#                 uses   what you run there, at most 60 characters (it is printed inside the box)
#                 link   your module, golden path or runbook for it (https)
#                 note   optional
#   hosting     platforms only: which ways of hosting you have approved, keyed by the hosting
#               option's id as the platform's file names it (containerApps, aks,
#               foundryAgentService). The option is then marked in the "Choose how you'll build
#               it" step, which turns the general comparison into your organisation's answer.
#                 status enabled (approved) | testing (being trialled) | notEnabled (not approved)
#                 note   optional, shown on hover
#
# Example:
#
# products:
#   toolClaudeCode:
#     status: enabled
#     settings:
#       requireSso: { status: enabled }
#       sandboxEnabled: { status: testing, note: Pilot group only }
#   cloudAws:
#     status: enabled
#     components:
#       gateway: { uses: Kong AI Gateway (platform team), link: "https://git.example.com/platform/ai-gateway" }
#       archChatAgent/memory: { uses: Aurora PostgreSQL with pgvector, note: Approved store for chat history }
#     settings:
#       gatewayInboundJwt: { status: enabled, link: "https://git.example.com/platform/terraform-agent-gateway" }
#   cloudAzure:
#     status: enabled
#     hosting:
#       containerApps: { status: enabled }
#       aks: { status: testing, note: Platform team pilot }
products: {}
