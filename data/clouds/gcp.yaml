    # >>> hosting options (compared against the vendor's pages; one is the mapping itself)
    hosting:
      - id: cloudRun
        kind: runtime
        name: "Cloud Run"
        url: https://docs.cloud.google.com/run/docs/overview/what-is-cloud-run
        asOf: "2026-11"
        mapped: true
        compare:
          runs: "Your code runs the loop in your own container; Cloud Run starts, scales and stops the container instances."
          patching: "Google manages the infrastructure and sandbox; you rebuild your image, unless a service uses a Google buildpacks base image with automatic updates."
          data: "Instances are stateless and run in the region you choose in your project; prompts and state persist only in the stores you connect, such as Firestore."
          network: "Direct VPC egress can route all outbound traffic into your VPC for firewall rules, NAT or a proxy; by default it leaves for the internet from a shared address pool."
          identity: "A service account attached to each service or job, user-managed recommended over the Compute Engine default; Agent Identity is in Preview."
          accepts: "Any language and any agent framework that builds into a container image; Google's page names ADK, Dify, LangGraph and n8n as examples."
          workload: "Service requests end at 5 minutes by default and 60 at most; jobs run tasks for up to 7 days, worker pools pull from queues, and Pub/Sub or schedules trigger services."
          portability: "The agent is a container image, which Google says runs anywhere a container can run; the Cloud Run configuration around it is rewritten for the new host."
          effort: "Your container image, the service's configuration and the data stores it uses; there is no cluster or server infrastructure for you to manage."
          fits: "Google's guidance: when you require container deployment and portability with a balance of flexibility and control, running agents like any other service."
        sources:
          - https://docs.cloud.google.com/run/docs/overview/what-is-cloud-run
          - https://docs.cloud.google.com/run/docs/ai-agents
          - https://docs.cloud.google.com/run/docs/securing/security
          - https://docs.cloud.google.com/run/docs/securing/service-identity
          - https://docs.cloud.google.com/run/docs/ai/agent-platform-features
          - https://docs.cloud.google.com/run/docs/configuring/vpc-direct-vpc
          - https://docs.cloud.google.com/run/docs/configuring/request-timeout
          - https://docs.cloud.google.com/run/docs/configuring/task-timeout
          - https://docs.cloud.google.com/run/docs/configuring/services/automatic-base-image-updates
          - https://docs.cloud.google.com/run/docs/container-contract
          - https://docs.cloud.google.com/run/docs/authenticating/overview
          - https://docs.cloud.google.com/architecture/choose-agentic-ai-architecture-components
      - id: gke
        kind: cluster
        name: "Google Kubernetes Engine (GKE)"
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/kubernetes-engine-overview
        asOf: "2026-11"
        compare:
          runs: "Your code runs the loop in Pods you deploy; GKE schedules those Pods onto the nodes of your cluster."
          patching: "Google patches the control plane and the node OS through auto-upgrades; you keep Standard node pools enrolled, upgrade by hand when delayed, and rebuild your images."
          data: "Prompts and tool results are processed in Pods on nodes in your project and VPC; Pods are ephemeral, so state is kept in the stores or volumes you attach."
          network: "Pods run in your VPC; private nodes, network policies, FQDN network policies and firewall rules limit traffic, but by default Pods talk freely and nodes get external IPs."
          identity: "A Kubernetes ServiceAccount granted IAM roles through Workload Identity Federation for GKE, always on in Autopilot; Agent Identity for GKE is in Preview."
          accepts: "Any language and any framework packaged as a container; ADK documents a GKE deployment and an adk deploy gke command for Python agents."
          workload: "Deployments keep Pods running, CronJobs create Jobs on a schedule, and Pods can pull from Pub/Sub; node auto-upgrades and scale-down can evict running Pods."
          portability: "The agent is a container image plus Kubernetes manifests on a managed implementation of open source Kubernetes; GKE-specific resources and IAM bindings are redone."
          effort: "The cluster's node pools, networking, scaling policies, upgrades and access control, plus your workloads; in Autopilot mode Google manages the nodes."
          fits: "Google's guidance: when you require full control of the infrastructure, your platform team runs Kubernetes, or you already run applications on GKE."
        sources:
          - https://docs.cloud.google.com/kubernetes-engine/docs/concepts/kubernetes-engine-overview
          - https://docs.cloud.google.com/kubernetes-engine/docs/concepts/shared-responsibility
          - https://docs.cloud.google.com/kubernetes-engine/docs/concepts/autopilot-overview
          - https://docs.cloud.google.com/kubernetes-engine/docs/concepts/workload-identity
          - https://docs.cloud.google.com/kubernetes-engine/docs/how-to/workload-identity
          - https://docs.cloud.google.com/kubernetes-engine/docs/how-to/protecting-cluster-metadata
          - https://docs.cloud.google.com/kubernetes-engine/security/about-agent-identity
          - https://docs.cloud.google.com/kubernetes-engine/docs/how-to/network-policy
          - https://docs.cloud.google.com/kubernetes-engine/docs/how-to/fqdn-network-policies
          - https://docs.cloud.google.com/kubernetes-engine/docs/how-to/hardening-your-cluster
          - https://docs.cloud.google.com/kubernetes-engine/docs/concepts/network-isolation
          - https://docs.cloud.google.com/kubernetes-engine/docs/how-to/latest/network-isolation
          - https://docs.cloud.google.com/kubernetes-engine/docs/how-to/cronjobs
          - https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/autoscaling-metrics
          - https://docs.cloud.google.com/kubernetes-engine/docs/concepts/machine-learning/agent-workloads
          - https://adk.dev/deploy/gke/
          - https://adk.dev/deploy/
          - https://docs.cloud.google.com/architecture/choose-agentic-ai-architecture-components
          - https://docs.cloud.google.com/pubsub/docs/subscriber
          - https://docs.cloud.google.com/pubsub/docs/access-control
          - https://docs.cloud.google.com/scheduler/docs/overview
          - https://docs.cloud.google.com/secure-web-proxy/docs/quickstart
          - https://docs.cloud.google.com/secure-web-proxy/docs/policies-and-rules-overview
          - https://docs.cloud.google.com/secure-web-proxy/docs/deploy-swp-as-agent-gateway
          - https://docs.cloud.google.com/kubernetes-engine/docs/how-to/ambient-egress-swp
          - https://docs.cloud.google.com/deploy/docs/deployment-strategies/canary
          - https://docs.cloud.google.com/deploy/docs/deployment-strategies/canary/gke/service-networking
          - https://docs.cloud.google.com/deploy/docs/deployment-strategies/canary/gke/gateway-api
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sandbox/code-execution-overview
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/gateways/agent-gateway-overview
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/gateways/gke-overview
          - https://docs.cloud.google.com/secret-manager/docs/secret-manager-managed-csi-component
        summary: "The agent runs as a Deployment in a GKE cluster you operate and pulls its triggers from Pub/Sub instead of receiving pushes; Apigee, the tool servers, the stores and Code Execution stay where they are. You now carry what Cloud Run did for you: the Pod's identity and the node's credentials, private nodes and network policy, the outbound proxy route, canary rollouts through Cloud Deploy, and cluster and node upgrades."
        bindings:
          - { block: planner, service: "Your agent in a Deployment on GKE", builtWith: "Agent Development Kit (ADK)", note: "A Deployment and ClusterIP Service in its own namespace, on its own Kubernetes ServiceAccount, from your manifests; adk deploy gke (Python only) uses the default ones.", url: https://adk.dev/deploy/gke/ }
          - { block: events, service: "Pub/Sub pull subscription and Cloud Scheduler", note: "Push needs an HTTPS endpoint on the public web, so a subscriber beside the agent pulls. Cloud Scheduler publishes to the topic, and the operator's approval returns the same way.", url: https://docs.cloud.google.com/pubsub/docs/subscriber }
        dropSettings: [pubsubPushAuth, cloudRunServiceIdentity, cloudRunTrafficSplit, swpEgress]
        addSettings: [workloadIdentityGke, gkeNetworkPolicy, fqdnNetworkPolicy, pubsubPullAccess, gkeNodeServiceAccount, gkeSwpExplicitProxy, cloudDeployCanaryGke]
        differences:
          - at: events->planner
            text: "Pub/Sub can push only to an HTTPS endpoint on the public web, so on a private cluster the agent pulls instead. No signed delivery names the caller: whoever holds Pub/Sub Publisher on the topic can start a run, so the topic's IAM policy is now the gate, and you build the subscriber that hands each message to the agent."
            url: https://docs.cloud.google.com/pubsub/docs/subscriber
          - at: planner
            text: "Nothing limits a Pod's outbound traffic until you configure it: by default every Pod can talk to every other Pod, GKE nodes have external IP addresses, and no network policy applies. The egress allowlist holds only with private nodes, network policy enforcement and the proxy route all in place."
            url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/hardening-your-cluster
          - at: planner->gateway
            text: "The agent's identity is its Kubernetes ServiceAccount only where Workload Identity Federation for GKE is on for the cluster and node pool (always on in Autopilot). Without it the node service account's credentials are exposed to workloads. adk deploy gke uses the default ServiceAccount in the default namespace, so give the agent its own."
            url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/workload-identity
          - at: localTools
            text: "Generated code still goes to Agent Platform Code Execution, outside the cluster, by choice: Google says the calling agent can run anywhere. Google's GKE guidance isolates untrusted code with GKE Sandbox instead, so running it in a Pod beside the agent needs a gVisor or microVM runtime (Agent Sandbox on GKE) and its own network policy."
            url: https://docs.cloud.google.com/architecture/choose-agentic-ai-architecture-components
          - at: gateway
            text: "Agent Gateway reaches GKE as a Preview you run yourself: a GKE Gateway for inbound traffic and Secure Web Proxy for outbound, on GKE 1.37.2 or later from the Rapid channel, in europe-west1 and us-central1 only. Apigee remains the gateway in this mapping."
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/gateways/gke-overview
        alsoNeeded:
          - service: "Workload Identity Federation for GKE"
            role: identity
            why: "Gives the agent's Pod its own Google identity; Cloud Run attached a service account to the service for you."
            url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/workload-identity
          - service: "Private nodes, with Cloud NAT or Secure Web Proxy"
            role: network
            why: "Nodes without external addresses reach the internet only through NAT or a proxy that you add to the VPC."
            url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/network-isolation
          - service: "Cloud Deploy"
            role: other
            why: "Runs the canary phases that Cloud Run revisions and traffic splitting provided."
            url: https://docs.cloud.google.com/deploy/docs/deployment-strategies/canary
          - service: "Node pool service account that can pull from Artifact Registry"
            role: registry
            why: "GKE pulls the agent's image with the node pool's service account, even with Workload Identity Federation on."
            url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/workload-identity
          - service: "Kubernetes RBAC with Google Groups"
            role: identity
            why: "Who may change the agent's Deployment or read its Secrets is now decided in the cluster as well as in IAM."
            url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/hardening-your-cluster
          - service: "Cloud Logging and Cloud Monitoring on the cluster"
            role: logging
            why: "Google asks you to keep both enabled on the cluster; Cloud Run ingests container logs without setup."
            url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/shared-responsibility
        quickstart:
          - title: "Deploy to Google Kubernetes Engine (GKE), Agent Development Kit"
            url: https://adk.dev/deploy/gke/
          - title: "Authenticate to Google Cloud APIs from GKE workloads"
            url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/workload-identity
          - title: "Best practices for hardening your cluster's security"
            url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/hardening-your-cluster
      - id: agentRuntime
        kind: managed
        name: "Agent Runtime on Gemini Enterprise Agent Platform"
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/runtime
        asOf: "2026-11"
        pattern: archCloudManagedAgent
        tool: toolVertexAgentEngine
        compare:
          runs: "Your agent code runs the loop inside a runtime Google manages; you hand over a framework agent, source files or a container, and Google deploys and scales it."
          patching: "Google manages the runtime's underlying infrastructure; you keep the agent's pinned packages, or the container image you supply, up to date."
          data: "The agent runs in a Google-owned tenant project in the region you pick; sessions and memories sit in Agent Platform Sessions and Memory Bank, with CMEK available."
          network: "A Google-managed network with no access to your VPC; a Private Service Connect interface reaches your VPC, and VPC Service Controls blocks public internet access."
          identity: "The AI Platform Reasoning Engine Service Agent by default, a custom service account, or an Agent Identity tied to the instance, which one page labels preview."
          accepts: "ADK in Python or Go with full integration; SDK templates for LangChain, LangGraph, AG2 and LlamaIndex; or any language in a container that meets the runtime contract."
          workload: "A streamed query lasts 15 minutes at most; long-running query jobs run asynchronously for up to seven days; idle instances can scale down after 15 minutes."
          portability: "ADK agents also deploy to Cloud Run or GKE; the runtime contract endpoints and the ReasoningEngine query API that callers use belong to Agent Runtime."
          effort: "Your agent code, its deployment settings and its IAM grants; Google runs the infrastructure and scaling and supplies integrated logging, monitoring and tracing."
