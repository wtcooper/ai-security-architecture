                      Studio ADMX policy disables Copilot outright.
                  url: https://code.visualstudio.com/docs/enterprise/policies
              note: >-
                Enterprise policy applies at the next request to GitHub, so an agent loop stops at its next
                model call; managed settings on the device refresh within about an hour or on restart. A
                command the agent has already started in the terminal runs to completion.
              verified: 2026-09-10
      - mitigation: D3-PA
        coverage: external
