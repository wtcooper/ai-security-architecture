# Controls guidance for the UI/low-code managed agent runtime archetype. Audience: admins,
# architects and security teams. This is a use pattern: the platform is the vendor's, so the
# controls are tenant policy, publication and population management, plus the boundary we run
# where an agent reaches our own systems.
# The build's derivation check fails this document if its cited capabilities stop being pinned.
archetype: archLowCodeAgentBuilder
mode: use
status: draft
attribution: >-
  Authored in this repository. Pattern-level by design; incidents are cited, vendors are not
  named in the items.

overview:
  - >-
    The unit of risk in this archetype is the population, not the agent: hundreds of
    near-identical agents, each simple, each holding connector grants, many authored by
    people who have left. There is no code review between an afternoon's work and something
    that acts on production data unless the platform's gates are turned on — and several of
    the platform defaults (sharing scope, agent-to-agent discovery, soft-enabled policy) are
    set for adoption, not governance.
  - >-
    The decisive technical question when evaluating or configuring any platform in this
    class: does a published agent execute on its author's credentials or its invoker's?
    Author-credential execution turns publishing into a privilege grant — a user who could
    not read a table reads it through an agent someone else built — and no amount of
    population management compensates for getting this one wrong.

items:
  - title: Build the inventory first; everything else depends on it
    mitigations: [cap-agent-tool-registry, cap-agent-tracing, cap-agent-kill-switch]
    body:
      - >-
        Every agent, its author, its connector set, its audience, its sharing mode and its
        last use — the platforms now report this, and the vendors sell fleet-level control
        planes over it. Pair the inventory with run history per agent and per consumer: it is
        the basis for retiring what nobody uses, investigating what someone did, and noticing
        the agents shared to "anyone with the link" on the vendor's own domain, where
        exposure research keeps finding them by the thousands.

  - title: Decide who may build, and demand invoker-credential execution
    mitigations: [ D3-APA, D3-AA ]
    body:
      - >-
        Restricting who may build is the bluntest and often most effective population
        control — on several platforms, creating an agent by default needs no more than
        ordinary user rights. Require per-invoker authorisation so the organisation's existing
        access model survives publication; where a connection runs on stored credentials
        whoever invokes the agent, the tools behind it must check the invoker themselves. Use
        the platforms' per-agent identities: an agent that signs in as its own directory
        principal can be verified and refused by conditional access one agent at a time, and
        the same principal is the handle for transferring ownership when authors leave.

  - title: Author connector policy centrally, and gate publication
    mitigations: [AML.M0028, cap-staged-rollout-gate]
    body:
      - >-
        Blocking a connector pairing scales where reviewing agents does not: a source of
        confidential data plus a path that sends mail is the pairing worth banning outright.
        Check the enforcement default on whatever platform is in use — some enforce centrally
        out of the box, others ship policy soft-enabled where makers never feel it. Where the
        platform offers environments and deployment pipelines with an approver, route
        consequential agents through them so review stands between an author and an audience;
        they are the nearest available thing to code review, and they are optional.

  - title: Treat grounding sources as instruction channels
    mitigations: [cap-input-guardrails, cap-data-access-governance]
    body:
      - >-
        A shared agent's knowledge source is frequently a folder anyone can write to — an
        instruction channel wearing a grounding label, where one planted document steers the
        agent for every user. Restrict attachable locations to ones with governed write
        access, govern by classification what connectors may reach at all, and know what
        sensitive data sits inside connector reach before hundreds of agents find it. Where
        the platform does not inspect knowledge a maker uploads — the mainstream ones do not —
        approve what may be uploaded before an agent is published. Screen grounding that returns through your own gateway;
        the platform's own injection screening is supplier assurance. Check whether
        agent-to-agent discovery is on and decide deliberately whether it should be: one
        steered agent recruiting a teammate's stronger connectors is the documented
        second-order path.

  - title: Publish in stages, and watch the population for drift
    mitigations: [cap-staged-rollout-gate, cap-agent-tracing]
    body:
      - >-
        Publication is delivery: versioned agents, a limited audience before the whole team
        where the platform offers one, and re-activating the previous version as the rollback;
        unpublish alone only stops the agent. Over a population of hundreds, drift is the
        signal worth automating — export each run's tool, connector and retrieval steps, and
        the agent whose connector mix or run pattern moved from its baseline is the one to
        quarantine before an incident names it. Test what can be tested: vendor internals are
        opaque, but a published agent, its policies and its connector boundaries are all
        black-box testable, and should be.

  - title: Own the tunnel host like the crossing it is
    mitigations: [ D3-CH ]
    body:
      - >-
        Point the platform's tunnel at your AI gateway, never straight at a data source, so
        every call into your systems meets the same scoping and record. The relay caches
        connection credentials on a host somebody must patch: rotate those secrets on a
        schedule, revoke them without redeploying the host, monitor its health, and
        decommission it deliberately when the last connection moves off it.

  - title: Run it as a programme, and assure what you cannot test
    mitigations: [cap-ai-vendor-assessment]
    body:
      - >-
        Maker governance is ongoing: environments and licensing, lifecycle and ownership
        transfer, retirement as somebody's actual job — the population grows by default and
        shrinks only on purpose. The platform's internal execution, isolation and model
        safeguards are assured the way any critical vendor control is assured, not tested;
        the settings it exposes and the boundaries a published agent touches can be probed
        directly. Revisit when the vendor ships the features that change the answer.

sources:
