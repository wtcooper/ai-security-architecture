          residency only); audit log action:copilot and actor:Copilot for control-plane and cloud-agent events
        steps:
          - title: Pin the OpenTelemetry export in managed settings
            body:
              - >-
                Set telemetry.enabled, telemetry.endpoint, telemetry.protocol, telemetry.headers,
                telemetry.captureContent and telemetry.lockCaptureContent; each maps to a chat.agentHost.otel.*
                setting and CopilotOtel* policy.
            url: https://code.visualstudio.com/docs/enterprise/ai-settings
          - title: Stream Copilot API usage records
            body:
              - >-
                Enterprise > AI Controls: set "Copilot Usage Records Streaming" to Enabled everywhere and configure
                an audit-log stream destination (public preview; Enterprise Managed Users and data-residency
                enterprises).
            url: >-
              https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/streaming-the-audit-log-for-your-enterprise
          - title: Stream the audit log
            body:
              - >-
                Search action:copilot for licence and policy changes and actor:Copilot for agent activity; stream to
                a SIEM for retention beyond 180 days.
            url: >-
              https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-enterprise/review-audit-logs
        note: >-
          Partial by the rule applied to every vendor: the per-session OTel export is admin-settable but the user
          can still steer it in the Copilot Chat extension, where "OTel environment variables can still override
          managed values"; managed telemetry.headers are not delivered to the agent host process, so an
          authenticated collector misses Agent Host telemetry in this release; tool calls appear as execute_tool
          spans (arguments only with content capture), but permission decisions are not a documented event.
          Usage-records streaming is server-side and user-proof but covers Copilot API traffic only (not local
          BYOK), without session correlation or redaction control, and only for EMU and data-residency
          enterprises. The audit log "does not include client session data". JetBrains honours managed telemetry;
          Visual Studio, Xcode and Eclipse document none. Capture is not tamper resistance.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAuditLogging
          reviewRequired: false
          original:
            - capability: capabilityAuditLogging
              coverage: partial
              mechanism: >-
                Enterprise/organisation audit log (action:copilot, 180 days, streamable) for policy and
                licensing events; CopilotOtel* / telemetry.* managed OpenTelemetry export for session content
              note: >-
                The audit log "does not capture client session data, such as the prompts a user sends";
                session-level evidence exists only if the enterprise runs an OTLP collector and pins the
                export in managed settings.
