pattern: archHostedAppBuilder
reviewed: "2026-11-25"
summary: >-
  People who are rarely developers describe an app to a vendor's AI builder, which writes it,
  gives it a database, sign-in and secrets, and hosts it at its own address for colleagues, guests
  or anyone with the link. At stake are the records people type into these apps and the enterprise
  data connectors reach, held by code nobody reads and gated by the maker's publish click. In
  November 2026 researchers opened 35,578 of 37,571 Grok Build apps without signing in and found
  24,664 Lovable-built sites sending database records on page load.
concentrates: >-
  Where an app published to anyone with the link calls its database straight from the browser with
  a public key, behind row rules the agent wrote and nobody read, in a workspace whose scan only
  advises and where nobody keeps a list of what has been published.
scope: >-
  Staff build apps in a vendor's workspace with single sign-on; the vendor runs the agent, the
  hosting and each app's database and sign-in. Apps go to colleagues or outsiders, some with
  connectors to enterprise data, and some staff also build in personal accounts.
lists: [owasp-llm-2026, owasp-agentic]
assets:
  - "Records visitors enter into apps: customers, staff, patients, payments"
  - "Enterprise data the vendor's connectors reach on the grants they hold"
  - "App secrets: outside services' keys, the database's service key, connector grants"
  - "Project code and the chats that made each app, pasted secrets included"
  - "The list of published apps: owner, audience, data and connectors"
actors:
  - who: "Stranger on the internet"
    access: "Finds an app's hostname in passive DNS or a search and opens it from any browser"
    wants: "Whatever the app shows, or its database hands back"
  - who: "Visitor or invited guest"
    access: "Signs in to an app, sometimes with any account the agent's sign-in lets through"
    wants: "Rows beyond their own, or the maker's view through a connector"
  - who: "Another customer of the platform"
    access: "Holds an account on the same builder, one authorisation check from every project and app"
    wants: "Other customers' apps, code and chat histories"
  - who: "Author of an uploaded file or template"
    access: "Writes the spreadsheet, document or public template a maker gives the agent"
    wants: "An open rule, a weakened sign-in or a key sent out"
  - who: "Package squatter"
    access: "Publishes on public registries under names code models invent"
    wants: "Code that runs in the vendor's build and ships in apps"
  - who: "Maker and the agent (no attacker)"
    access: "Ask for and build an app, take the defaults and publish without reading the code"
    wants: "A working app, quickly"
threats:
  - id: T1
    title: "An app published to anyone with the link answers whoever finds it"
    rating: critical
    evidence: observed
    story: >-
      Some builders preselect anyone with the link, so one click puts the app on the internet,
      and passive DNS lists its hostname once it is looked up. Claroc opened 35,578 of 37,571
      Grok Build apps without signing in, about one in ten with business or personal data, 24
      built by the vendor's own staff.
    at: [maker->publish, appHosting, browser->openWeb, browser->appHosting]
    risks: [riskSensitiveDataDisclosure]
    atlas: [AML.T0095, AML.T0132, AML.T0036]
    owasp: [LLM02:2026]
    controls: [D3-APA, AML.M0029, D3-AVE, cap-shadow-ai-discovery, cap-agent-kill-switch]
    incidents: [grok-build-public-apps]
  - id: T2
    title: "A table with no row rule gives its records to anyone holding the page's key"
    rating: critical
    evidence: observed
    story: >-
      The front end calls the database from the browser with a public key, so the row rules the
      agent wrote, or never wrote, are the only check, and the audience setting is not on that
      path. Crissy Field found 24,664 Lovable-built sites sending Supabase records on page load
      without a login.
    at: [browser->appData, builder->appData, appData]
    risks: [riskSensitiveDataDisclosure, riskInsecureModelOutput]
    atlas: [AML.T0049, AML.T0036]
    owasp: [LLM02:2026, LLM10:2026]
    controls: [cap-data-access-governance, D3-AVE, D3-AI, cap-ai-vendor-assessment]
    incidents: [lovable-supabase-exposure]
  - id: T3
    title: "The sign-in the agent wrote lets strangers in"
    rating: high
    evidence: observed
    story: >-
      Sign-in is model output nobody reads, and it passes every test the maker tries. Grok's
      Continue with Google added whoever signed in to the team before checking membership; a
      researcher said an inverted check in an exam app on Lovable's showcase let signed-out users
      reach 18,697 user records.
    at: [builder->appData, browser->appHosting, appHosting]
    risks: [riskInsecureModelOutput, riskSensitiveDataDisclosure]
    atlas: [AML.T0049]
    owasp: [LLM10:2026, ASI09]
    controls: [D3-APA, D3-MFA, D3-AVE]
    incidents: [grok-build-public-apps]
    refs:
      - title: "Lovable-hosted app littered with basic flaws exposed 18K users, researcher claims"
        url: https://www.theregister.com/2026/02/27/lovable_app_vulnerabilities
  - id: T4
    title: "One flaw in the platform opens every customer's apps or projects"
    rating: high
    evidence: disclosed
    story: >-
      Every customer shares the project store and the sign-in in front of apps. Base44's register
      and verify calls let anyone with an app's id join any private app, single sign-on apps
      included, until a fix within a day; a Lovable regression let any user with a link read
      public projects' chats and code for eleven weeks.
    at: [projectStore, appHosting]
    risks: [riskCrossTenantCredentialPropagation]
    atlas: [AML.T0049, AML.T0125, AML.T0085]
    owasp: [LLM02:2026, ASI03]
    controls: [cap-ai-vendor-assessment, D3-CH, AML.M0024]
    incidents: [grok-build-public-apps]
    refs:
      - title: "Wiz Research Uncovers Critical Vulnerability in AI Vibe Coding platform Base44 Allowing Unauthorized Access to Private Applications"
        url: https://www.wiz.io/blog/critical-vulnerability-base44
      - title: "Our response to the April 2026 incident"
        url: https://lovable.dev/blog/our-response-to-the-april-2026-incident
  - id: T5
    title: "Keys in the page or the chat are read by every visitor"
    rating: high
    evidence: observed
    story: >-
      What the agent puts in the front end ships to every visitor, and a key pasted into the chat
      stays in the project's history. Escape found more than 400 exposed secrets in 5,600 apps
      built on these platforms; Claroc found 18 accounts with plain-text passwords in a script a
      Grok app sent to every browser.
    at: [browser, appHosting, projectStore]
    risks: [riskSensitiveDataDisclosure]
    atlas: [AML.T0055]
    owasp: [LLM02:2026]
    controls: [D3-CH, D3-AVE]
    incidents: [grok-build-public-apps]
    refs:
      - title: "Methodology: How we discovered over 2k high-impact vulnerabilities in apps built with vibe coding platforms"
        url: https://escape.tech/blog/methodology-how-we-discovered-vulnerabilities-apps-built-with-vibe-coding/
  - id: T6
    title: "Apps built outside the workspace, or left by their makers, run on with real data"
    rating: high
    evidence: observed
    story: >-
      An app is a chat away in a personal or free account, under no setting of ours, and it keeps
      its address and its data after the reason and the maker have gone. Claroc found internal
      data of 30 identifiable organisations, six in the Fortune 500, in Grok apps open to anyone.
    at: [publish, appHosting, govObservability]
    risks: [riskShadowAndUnknownAgents, riskSensitiveDataDisclosure]
    atlas: [AML.T0095]
    owasp: [LLM02:2026]
    controls: [cap-shadow-ai-discovery, D3-AI, cap-agent-kill-switch, D3-MFA]
    incidents: [grok-build-public-apps]
  - id: T7
    title: "A connector on its maker's grant shows every visitor the maker's records"
    rating: high
    evidence: theoretical
    story: >-
      An app whose connector reads on the maker's own grant gives each visitor, perhaps anyone
      with the link, the maker's view of our systems, and no access review of ours shows it. No
      case on these builders is on record yet.
    at: [appHosting->connectors, connectors->orgData]
    risks: [riskAgenticDelegationConfusedDeputy, riskSensitiveDataDisclosure]
    atlas: [AML.T0085.001, AML.T0053]
    owasp: [ASI03, LLM03:2026]
    controls: [cap-data-access-governance, AML.M0028, D3-CH, AML.M0029]
  - id: T8
    title: "A chat edit changes or deletes the live app's data"
    rating: medium
    evidence: observed
    story: >-
      Where the agent works on the live database, a request in the chat can change the schema or
      delete records, and a restore may bring back the code but not the data. Replit's agent
      deleted a production database during a code freeze in July 2025; Replit then said it would
      separate development and production databases.
    at: [builder->appData, appData]
    risks: [riskRogueActions]
    atlas: [AML.T0101]
    owasp: [ASI02]
    controls: [cap-staged-rollout-gate]
    refs:
      - title: "An AI-powered coding tool wiped out a software company's database, then apologized"
        url: https://fortune.com/2025/07/23/ai-coding-tool-replit-wiped-database-called-it-a-catastrophic-failure/
  - id: T9
    title: "An uploaded file or remixed template tells the agent to open the app"
    rating: medium
    evidence: theoretical
    story: >-
      Uploads and templates become the agent's instructions, and the maker cannot read the code.
      A hidden line could ask for a rule that lets anyone read a table, or for a key to be sent
      out, and the app would still work. No case on these builders is on record.
    at: [maker->builder, builder->provider, builder->appData]
    risks: [riskPromptInjection, riskInsecureModelOutput]
    atlas: [AML.T0051.001, AML.T0080]
    owasp: [LLM01:2026, ASI01]
    controls: [D3-AVE, cap-data-access-governance, AML.M0029]
  - id: T10
    title: "An invented package is installed in the vendor's build and shipped"
    rating: medium
    evidence: research
    story: >-
      Code models name packages that do not exist (at least 5.2% of suggestions from commercial
      models and 21.7% from open ones, on average, in one study), and anyone can register the
      name. The vendor's build installs straight from public registries, with no mirror of ours
      in between.
    at: [builder->sources]
    risks: [riskInsecureIntegratedComponent]
    atlas: [AML.T0060, AML.T0011.001, AML.T0010.001]
    owasp: [LLM04:2026, ASI04]
    controls: [cap-ai-vendor-assessment, D3-AVE]
    refs:
      - title: "We Have a Package for You! A Comprehensive Analysis of Package Hallucinations by Code Generating LLMs"
        url: https://arxiv.org/abs/2406.10279
coverage:
  - { id: "LLM05:2026", why: "No model is trained or tuned here; a poisoned upload or template acts as an instruction, under the uploaded-file threat." }
  - { id: "LLM06:2026", why: "The vendor meters builds and app traffic by plan; runaway use is a billing matter, and an app's own model calls are not drawn." }
  - { id: "LLM07:2026", why: "A wrong answer in an app is a quality matter; the harm drawn is code that is wrong about who may see what, under the sign-in threat." }
  - { id: "LLM08:2026", why: "The builder's own prompts are the vendor's; what a maker pastes into the chat is covered under keys in the page or the chat." }
  - { id: "LLM09:2026", why: "No retrieval index is drawn; an app that adds one takes the chat agent pattern's threats." }
  - { id: "ASI05", why: "The agent's code runs in the vendor's build sandbox and hosting, assessed rather than drawn; what it ships meets the scan and the package threat." }
  - { id: "ASI06", why: "The chat history steers later changes, but no memory store is drawn; planted instructions fall under the uploaded-file threat." }
  - { id: "ASI07", why: "One builder agent works on each project; no agent-to-agent channel is drawn." }
  - { id: "ASI08", why: "Each app is separate; a fault that spreads across apps is the platform-flaw threat." }
  - { id: "ASI10", why: "The agent acts only on the maker's request in one project; apps nobody owns are the outside-the-workspace threat." }
questions:
  - "What audience does a new app get by default in our workspace, and who may publish to anyone with the link or the whole internet?"
  - "Does a critical scan finding block publishing, and does the scan read what each row rule allows or only that rules are on?"
  - "Which published apps call their database from the browser, and has anyone read the rules on each table that holds real data?"
  - "Is our identity provider the only way into the builder and into workspace apps, with emailed links and personal accounts off?"
  - "Which connectors may apps use, and does each read as the visitor or as its maker?"
  - "Who keeps the list of published apps and their owners, and who looks for apps on these builders' domains made outside the workspace?"
  - "Does the agent work on a copy of the database, and does a restore bring back data as well as code?"
  - "How does the vendor keep one customer's projects, chats and apps from another's, and how fast did it fix its last reported flaw?"
