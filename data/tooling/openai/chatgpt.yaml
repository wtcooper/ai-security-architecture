            body:
              - >-
                In Admin > Plugins select Disable on each affected app; turning an app off triggers revocation of
                its stored tokens.
            url: https://help.openai.com/en/articles/11509118-admin-controls-security-and-compliance-for-plugins-and-apps
          - title: Stop agents and scheduled tasks
            body:
              - >-
                Call Unpublish Workspace Agent or Delete Workspace Agent and Delete User Automation on the Admin
                API, or use the agent area of the admin console.
            url: https://chatgpt.com/public/admin/api-reference
          - title: Revoke automation credentials
            body:
              - >-
                Revoke tokens at chatgpt.com/admin/access-tokens and disable service accounts, which revokes all of
                their tokens.
            url: https://learn.chatgpt.com/docs/enterprise/service-accounts
        note: >-
          Partial by the rule applied to every vendor: the admin can switch the agent surfaces off org-wide,
          revoke connector grants in bulk by disabling apps, unpublish or delete agents and delete scheduled
          tasks; turning off Allow local computer access is documented to interrupt currently running turns, but
          no page says a Work Cloud task, agent run or deep research already in progress stops. Documented
          timings are custom-role changes in about five minutes, IdP sync every 30 to 40 minutes (it cannot be
          forced), IP allowlist 5 to 15 minutes, and a Work network change after the current command finishes;
          the delay for stopping running work is not documented. Removing local Codex permission suspends tokens
          without revoking them, and per-user grant revocation is the user's action. Measure the stop before
          relying on it.
        verified: "2026-10-30"
        migration:
          from:
            - capabilityKillSwitch
          reviewRequired: false
          original:
            - capability: capabilityKillSwitch
              coverage: native
              mechanism: Role Off for Work Local / Work Cloud / plugins, token revocation, service-account disable
              steps:
                - title: Turn surfaces off by role
                  body:
                    - Work Cloud and Work Local are distinct toggles in Permissions & roles; plugins can be made unavailable in
                      Admin > Plugins.
                  url: https://learn.chatgpt.com/docs/enterprise/chatgpt-work-cloud-security
                - title: Revoke credentials
                  body:
                    - Owners and admins revoke any token; disabling a service account revokes all of its tokens.
                  url: https://learn.chatgpt.com/docs/enterprise/service-accounts
              note: >-
                Role and token changes apply at the next request; an in-flight request completes. The docs
                state no propagation delay, so measure it before relying on it.
              verified: 2026-09-10
    # The security-relevant settings, each with the baseline value (data/tooling/BASELINE.md).
    # Workspace permissions live in Admin Console (admin.openai.com) › Permissions, where role grants add up (On in
    # any assigned role grants); plugins in Admin Console › Plugins. The desktop app's local runtime (Agent security
    # desktop requirements, requirements.toml and MDM keys) is toolChatgptDesktop's settings table; the two local-access
    # switches appear on both records. Verified 2026-10-30 at learn.chatgpt.com/docs.
    settings:
      - id: sso
        name: SSO
        where: Global Admin Console (admin.openai.com) › SSO and related identity settings, after domain verification
        setVia: [adminConsole, identityProvider]
        area: identity
        recommended: Required for every verified domain, with MFA enforced on the ChatGPT app in your IdP
        why: ChatGPT has no workspace-wide MFA switch, so the IdP's sign-in policy is the only place staff MFA is enforced.
        mitigations: [D3-APA]
        url: https://learn.chatgpt.com/docs/enterprise/work-admin-faq
        verified: "2026-10-30"
      - id: directorySync
        name: Enable Directory Sync
        where: Workspace settings › Identity & access › Enable Directory Sync (Use SCIM only for this workspace, or the tenant-level connection)
        setVia: [adminConsole, identityProvider]
        area: identity
        default: Manual invitations
        recommended: "On, with membership and groups driven by the IdP groups that grant ChatGPT"
        why: Removing someone in the IdP removes their workspace membership, so a leaver's access ends with their account rather than with a ticket.
        mitigations: [D3-APA, cap-agent-kill-switch]
        requires: Enterprise, Edu or Healthcare
        url: https://learn.chatgpt.com/docs/enterprise/user-lifecycle
        verified: "2026-10-30"
      - id: automaticAccountCreation
        name: Automatic Account Creation
        where: Workspace administration (eligible email domains)
        setVia: [adminConsole]
        area: identity
        recommended: "Off where SCIM is on"
        why: Accounts it creates may sit outside SCIM, so removing someone from the IdP group can leave their workspace access in place.
        mitigations: [D3-APA]
        url: https://learn.chatgpt.com/docs/enterprise/user-lifecycle
        verified: "2026-10-30"
      - id: verifiedDomainRestrictions
        name: Verified-domain restrictions (domain claiming)
        where: Requested from your OpenAI account team for each corporate domain; verifying a domain alone does not activate it
        setVia: [adminConsole]
        area: identity
        default: Not active
        recommended: Active for every corporate email domain
        why: Staff cannot connect corporate SharePoint, Gmail or Slack accounts to a personal or other unapproved ChatGPT workspace.
        mitigations: [cap-shadow-ai-discovery, cap-data-access-governance]
        requires: Enterprise
        url: https://learn.chatgpt.com/docs/enterprise/apps-and-connectors
        verified: "2026-10-30"
      - id: workCloud
        name: Work Cloud
        where: Admin Console › Permissions › Workspace default and custom roles › Work Cloud
        setVia: [adminConsole, identityProvider]
        area: tools
        default: On for the default role on eligible Enterprise and Edu workspaces
        recommended: Off in the workspace default; On through a custom role for the groups being rolled out
        why: Hosted multi-step tasks act through connected apps; grants add up across roles, so a deliberate group is the only reliable scope.
        mitigations: [D3-APA, cap-agent-kill-switch]
        requires: Enterprise or Edu
        url: https://learn.chatgpt.com/docs/enterprise/chatgpt-work-cloud-security
        verified: "2026-10-30"
      - id: workLocal
        name: Use Work locally (or Allow members to use Codex and Work Locally)
        where: Admin Console › Permissions › Work Local (or the combined Codex and Work Local section)
        setVia: [adminConsole, identityProvider]
        area: tools
        recommended: Off in the workspace default; On only through a custom role for groups whose devices carry the toolChatgptDesktop baseline
        why: Keeps the desktop app's local Work out of the web rollout; with Work Cloud on and Work Local off, Work stays in OpenAI's cloud without cross-device sync.
        mitigations: [D3-APA]
        url: https://learn.chatgpt.com/docs/enterprise/chatgpt-work-cloud-security
        verified: "2026-10-30"
      - id: workLocalComputerAccess
        name: Allow local computer access
        where: Admin Console › Permissions › Work Cloud › Allow local computer access
        setVia: [adminConsole]
        area: tools
        default: "Off"
        recommended: "Off until the Agent security Global baseline is reviewed; then On for Work Local groups only"
        why: Cloud-orchestrated tasks reach the connected computer's files and tools; turning it off interrupts running turns, so it doubles as a stop.
        mitigations: [D3-APA, AML.M0028, cap-agent-kill-switch]
        url: https://learn.chatgpt.com/docs/enterprise/cloud-local-access
        verified: "2026-10-30"
      - id: cloudBrowser
        name: Use a browser
        where: Admin Console › Permissions › Workspace default › Workspace capabilities › Let agents use cloud computers (labelled Cloud browser use on some pages); shared with dots and team automations
        setVia: [adminConsole]
        area: network
        recommended: "On"
        why: Hosted browsing is much of Work's value and runs in a separate session without the user's sign-ins; regulated teams turn it off by role or use a Lockdown Mode role.
        mitigations: []
        url: https://learn.chatgpt.com/docs/enterprise/chatgpt-work-cloud-security
        verified: "2026-10-30"
      - id: cloudNetworkAccess
        name: Allow network access
        where: Admin Console › Permissions › Workspace default › Workspace capabilities › Let agents use cloud computers (labelled Cloud network access on some pages)
        setVia: [adminConsole]
        area: network
        recommended: "Off — cloud code and shell reach only the managed destination allowlist"
        why: Code a task writes cannot send data to arbitrary hosts from OpenAI's infrastructure; the browser, web search and apps are separate paths.
        mitigations: [D3-OTF]
        url: https://learn.chatgpt.com/docs/enterprise/chatgpt-work-cloud-security
        verified: "2026-10-30"
      - id: usePasswordManager
        name: Use password manager
        where: Admin Console › Permissions › Workspace default › Workspace capabilities › Use password manager
        setVia: [adminConsole]
        area: identity
        recommended: "Off"
        why: Keeps the password manager out of the in-app and cloud browsers an agent drives; members sign in through the secure hosted sign-in flow instead.
        mitigations: [D3-CH]
        url: https://learn.chatgpt.com/docs/enterprise/chatgpt-work-cloud-security
        verified: "2026-10-30"
      - id: usePlugins
        name: Use plugins
        where: Admin Console › Permissions & roles › (role) › Use plugins (Allow members to use plugins)
        setVia: [adminConsole, identityProvider]
        area: tools
        recommended: On for the roles that need the approved plugins
        why: The general plugin permission is the first gate before any app's data or actions reach a member.
        mitigations: [D3-APA, AML.M0028]
        url: https://learn.chatgpt.com/docs/enterprise/apps-and-connectors
        verified: "2026-10-30"
      - id: customMcpPlugins
        name: Upload plugins with custom MCP servers / Create plugins with MCPs
        where: Admin Console › Permissions & roles › (role)
        setVia: [adminConsole]
        area: tools
        recommended: Off except for a named group of reviewed plugin builders
        why: A custom MCP server is outside OpenAI's trust boundary and feeds unscreened content to the model; only vetted builders can add one.
        mitigations: [AML.M0028, cap-agent-tool-registry, cap-input-guardrails]
        url: https://learn.chatgpt.com/docs/enterprise/apps-and-connectors
        verified: "2026-10-30"
      - id: publishPlugins
        name: Publish plugins to workspace
        where: Admin Console › Permissions & roles › (role)
        setVia: [adminConsole]
        area: sharing
        recommended: The plugin maintainers only
        why: Only plugins someone has reviewed and owns reach the workspace directory.
        mitigations: [cap-agent-tool-registry]
        url: https://learn.chatgpt.com/docs/enterprise/apps-and-connectors
        verified: "2026-10-30"
      - id: pluginInstallation
        name: Installation settings (Available for installation, Installed for workspace, Customize by role, Disable)
        where: Admin Console › Plugins › (plugin) or bulk Edit
        setVia: [adminConsole]
        area: tools
        default: New Enterprise and Edu workspaces start with a vendor-selected set of apps enabled
        recommended: Disable for every plugin not approved; Available for installation or Customize by role for approved ones
        why: The catalogue stays an allowlist; a role-level Off does not remove access another role grants, so review every role.
        mitigations: [AML.M0028, cap-agent-tool-registry, cap-agent-kill-switch]
        url: https://learn.chatgpt.com/docs/enterprise/apps-and-connectors
        verified: "2026-10-30"
      - id: appAccess
        name: App access
        where: Admin Console › Plugins › (app) › App access
        setVia: [adminConsole]
        area: tools
        recommended: The groups whose work needs the app
        why: Installing a plugin grants no app; each app reaches only the people chosen here, then the connected account's permissions.
        mitigations: [D3-APA, AML.M0028, cap-data-access-governance]
        url: https://learn.chatgpt.com/docs/enterprise/apps-and-connectors
        verified: "2026-10-30"
      - id: appActions
        name: Tools (or Actions)
        where: Admin Console › Plugins › (app) › Tools — Read actions, Write actions, or individual actions
        setVia: [adminConsole]
        area: tools
        recommended: Read actions only, with individual write actions added where a workflow needs them
        why: A summarising workflow cannot create, share or delete records in the connected system.
        mitigations: [AML.M0028]
        url: https://learn.chatgpt.com/docs/enterprise/apps-and-connectors
        verified: "2026-10-30"
      - id: newActions
        name: New tools (or New actions)
        where: Admin Console › Plugins › (app) › New tools
        setVia: [adminConsole]
        area: tools
        default: New read actions enabled automatically when Read actions is selected
        recommended: Disable new actions
        why: An action the developer adds later waits for an admin to review it instead of appearing for every member.
        mitigations: [AML.M0028, cap-agent-tool-registry]
        url: https://learn.chatgpt.com/docs/enterprise/apps-and-connectors
        verified: "2026-10-30"
      - id: appPermissions
        name: Permissions (Always ask, Any changes, Important actions, Never ask)
        where: Admin Console › Plugins › (app) › Permissions
        setVia: [adminConsole]
        area: tools
        recommended: Any changes
        why: Reads proceed and every write needs the member's confirmation; regulated teams choose Always ask.
        mitigations: [AML.M0029]
        url: https://learn.chatgpt.com/docs/enterprise/chatgpt-work-cloud-security
        verified: "2026-10-30"
      - id: safetySecurityControls
        name: Safety & Security Controls
        where: Admin Console › Plugins › (app, e.g. SharePoint) › Safety & Security Controls
        setVia: [adminConsole]
        area: data
        default: No content restriction beyond the source system's permissions
        recommended: On for SharePoint — approved site collections only, and your most sensitive non-encrypting labels excluded
        why: Content a member could open in the source still stays out of ChatGPT when it is in a restricted site or carries an excluded label.
        mitigations: [cap-data-access-governance, cap-sensitive-data-redaction]
        url: https://learn.chatgpt.com/docs/enterprise/apps-and-connectors
        verified: "2026-10-30"
      - id: manageDomains
        name: Manage Domains (domain restriction)
        where: Workspace App Settings › (app) dropdown › Manage Domains
        setVia: [adminConsole]
        area: tools
        recommended: Your corporate domains, set when the app is enabled
        why: Supported apps (Microsoft 365, Google Workspace, GitHub, Slack) link and call only organisation-approved identities and domains.
        mitigations: [AML.M0028, cap-data-access-governance]
        requires: Enterprise or Edu
        url: https://cdn.openai.com/business-guides-and-resources/app-security-whitepaper.pdf
        verified: "2026-10-30"
      - id: adminManagedSync
        name: Admin-managed Sync
        where: The app's Admin-managed Sync setup › scope of synced sites, folders or shared drives
        setVia: [adminConsole]
        area: data
        default: "Off"
        recommended: Off until the source's oversharing is reviewed; then only the sites, folders or shared drives the workspace needs
        why: An index replicates source permissions as they are, so overshared content becomes answerable to everyone it is shared with.
        mitigations: [D3-DI, cap-data-access-governance]
        url: https://cdn.openai.com/business-guides-and-resources/app-security-whitepaper.pdf
        verified: "2026-10-30"
      - id: workspaceConnections
        name: Workspace connections
        where: Admin Console › Workspace connections › + (app), then grant access to users, teams or service accounts
        setVia: [adminConsole]
        area: data
        recommended: A dedicated company account with only the resources the team task needs, granted to named teams
        why: A shared connection acts with its own account's permissions, which can exceed the requesting member's.
        mitigations: [cap-data-access-governance, D3-APA]
        url: https://learn.chatgpt.com/docs/enterprise/shared-connections
        verified: "2026-10-30"
      - id: gptActionDomains
        name: Domains (GPT actions)
        where: Workspace GPT settings › Domains
        setVia: [adminConsole]
        area: network
        recommended: Only the approved API domains your GPTs call; none if no GPT uses custom actions
        why: With no domains allowed, custom GPT actions cannot execute, so a GPT cannot post data to an arbitrary API.
        mitigations: [AML.M0028]
        url: https://learn.chatgpt.com/docs/enterprise/gpts-and-sharing
        verified: "2026-10-30"
      - id: lockdownMode
        name: Lockdown Mode
        where: Admin Console › Permissions › Lockdown Mode roles, where available
        setVia: [adminConsole]
        area: network
        recommended: A Lockdown Mode role for the groups handling the most sensitive client matters, not the whole workspace
        why: Cuts the outbound paths injected content could use to exfiltrate data and applies even when an ordinary role grants access; it screens nothing.
        mitigations: [cap-input-guardrails]
        url: https://learn.chatgpt.com/docs/enterprise/apps-and-connectors
        verified: "2026-10-30"
      - id: accessTokenExpirationLimit
        name: Access token expiration limit
        where: Workspace settings › Permissions & roles › Access tokens (or the Codex and Work Local section)
        setVia: [adminConsole]
        area: identity
        recommended: 90 days
        why: Codex and Workspace Agents tokens a member creates stop working within a bounded window; existing tokens keep theirs.
        mitigations: [D3-CH]
        requires: Business or Enterprise
        url: https://learn.chatgpt.com/docs/enterprise/access-tokens
        verified: "2026-10-30"
      - id: complianceLogsAdminKey
        name: Admin keys (Compliance Logs Platform)
        where: Admin Console › (workspace) › Credentials › Admin keys, read by the download_compliance_files script or the Admin API
        setVia: [adminConsole, apiCli]
        area: audit
        default: No key; records kept 30 days at source
        recommended: One key for the SIEM collector with Conversation messages and the audit, auth and app log categories, pulled continuously
        why: Prompts, responses and app calls reach your SIEM before the 30-day source window lapses; there is no backfill.
        mitigations: [cap-agent-tracing, D3-CH]
        requires: Enterprise or Edu
        url: https://learn.chatgpt.com/docs/enterprise/dots-admin-guide
        verified: "2026-10-30"
