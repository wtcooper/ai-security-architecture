          - { name: "Graders on Amazon SageMaker AI endpoints", kind: commercial, url: "https://docs.aws.amazon.com/sagemaker/latest/dg/realtime-endpoints.html", note: "Graders and reward models served apart from the sandbox; today's mapping.", packs: [awsNative] }
