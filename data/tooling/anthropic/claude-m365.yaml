          The add-in asks the user to confirm an operation it judges risky before it runs, and Outlook drafts
          and invites land unsent (no Mail.Send scope); OpenTelemetry records each tool call's
          tool.accept_decision (manual, auto_accept standing approval, deferred); connector Tool permissions
          (Always allow / Needs approval / Blocked) are set org-wide on claude.ai; no add-in setting forces
          per-action approval
        steps:
          - title: Set connector write tools to Needs approval
            body:
              - >-
                As an Owner, open each connector's Tool permissions under Customize > Connectors and set
                write/delete tools to Needs approval or Blocked; the restriction applies org-wide and users
                can't override it.
            url: https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities
          - title: Audit how each action was approved
            body:
              - >-
                Configure the custom collector and alert on agent.tool_execution spans with tool.read_write
                write and tool.accept_decision auto_accept.
            url: https://claude.com/docs/office-agents/opentelemetry
          - title: Keep sending with the user
            body:
              - >-
                Rely on the Outlook add-in's scope set (Mail.ReadWrite, Calendars.Read, User.Read,
                offline_access, no Mail.Send): every draft and invite lands unsent for the user to send.
            url: https://claude.com/docs/office-agents/outlook
        note: >-
          Partial by the rule: a present human confirms, but the administrator cannot require it and users can
          hold a standing approval (auto_accept). The add-in decides which operations count as risky; Word's
          tracked-changes mode is one the user enters, not a policy; Outlook's move and flag operations run
          through Graph under Mail.ReadWrite and whether they prompt is not documented. Connector Tool
          permissions are documented for claude.ai connectors; the add-in pages say connectors are enabled in
          Claude settings but do not state that Needs approval is enforced in the add-ins. On third-party
          platforms connectors are "coming soon" and admin-attached mcp_servers carry no approval setting.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityHitlControls
          reviewRequired: false
          original:
            - capability: capabilityHitlControls
              coverage: partial
              mechanism: >-
                Word edits land as tracked changes and comments for review; Outlook drafts are left unsent; no
                admin-configurable approval gates
              steps:
                - title: Keep humans on the output
                  body:
                    - Rely on tracked changes in Word and draft-only mail in Outlook; there is no org-level
                      approval setting for add-in actions.
                  url: https://claude.com/docs/office-agents/overview
              verified: 2026-09-10
      - mitigation: D3-AA
        coverage: partial
        mechanism: >-
          Microsoft Graph access runs on one tenant-wide admin-consented delegated grant to the Claude for
          Office enterprise app (or your own app), listed and revocable at Entra ID > Enterprise apps > All
          applications > Claude for Office > Permissions, with per-user tokens issued by Entra through nested
          app authentication; MCP connector authorisations are per user and per device, held in the add-in's
          browser storage, with no admin listing or revoke
        steps:
          - title: Review and revoke the Graph grant
            body:
              - >-
                In Entra ID > Enterprise apps > All applications open Claude for Office
                (c2995f31-11e7-4882-b7a7-ef9def0a0266), review Permissions > Admin consent, and revoke there or
                with Remove-MgOauth2PermissionGrant.
            url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/manage-application-permissions
          - title: Issue connector credentials from your own endpoint
            body:
              - >-
                In custom-manifest deployments provision connectors per user with mcp_servers from a bootstrap
                endpoint, so the credential is one your endpoint issues and expires rather than a user's OAuth
                grant on the device.
            url: https://claude.com/docs/office-agents/third-party-platforms
        note: >-
          Partial by the rule: the Graph grant is inventoried and revocable in Entra and new tokens stop when
          the Entra account is disabled, but it is one grant for every user, and a revoke stops new token
          issuance only — access tokens already cached in each user's MSAL store run to their expiry. Connector
          grants are the gap: the add-in keeps connector client registrations (claude-mcp-gateways, scoped to
          the connector's address rather than the user, so shared by anyone on the same OS account) and their
          tokens in local storage on each device; nothing in the claude.ai console or the Compliance API lists
          them, only the user (or the connector's own IdP) can revoke them, no expiry is documented, and
          removing a Claude seat leaves them on disk.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityNhiManagement
          reviewRequired: false
          original:
            - capability: capabilityNhiManagement
              coverage: none
              note: >-
                The add-in runs entirely as the signed-in user; there is no workload or agent identity to
                govern.
              evidence:
                - title: Vendor docs index, reviewed; no setting for this control (2026-09-10)
                  url: https://claude.com/docs/office-agents/overview
              verified: 2026-09-10
      - mitigation: D3-DI
        coverage: external
        mechanism: >-
          No inventory or classification in the product: the add-in keeps no index and reaches the open file,
          the user's own mailbox and calendar through Graph (Outlook) and user-connected connectors;
          OpenTelemetry document.url per turn and Compliance API transcripts record which documents were sent,
          and the data-storage page maps the device-side stores
        evidence:
          - title: Data storage and retention (device stores and what each holds)
            url: https://claude.com/docs/office-agents/data-storage
          - title: Configure a custom OpenTelemetry collector (document.url on agent.query spans)
            url: https://claude.com/docs/office-agents/opentelemetry
          - title: Microsoft Purview for Anthropic Claude (Enterprise) — DSPM and data classification supported
            url: https://learn.microsoft.com/en-us/purview/ai-claude-enterprise
          - title: Set up a connector to manage Anthropic Claude data (imported data types)
            url: https://learn.microsoft.com/en-us/purview/manage-anthropic-data
        note: >-
          External: inventory and oversharing discovery of the SharePoint, OneDrive and Exchange content the
          add-in can reach belong to the DSPM / data-classification product (Microsoft Purview DSPM, for
          example); the add-in reaches whatever the user opens or their delegated Graph scope allows. It
          contributes a use record, not an inventory: document.url on every agent.query span, and file contents
          in Compliance API transcripts (Enterprise). Purview's Anthropic Claude connector (preview) imports the
          activity feed and chat conversations through the Compliance API; session transcripts, where add-in
          activity sits, are not among its listed data types. The device-side stores (claude-chat-history
          holds attached file contents) are an endpoint data store for the organisation's own inventory; the
          30-day backend deletion and the 50-conversation cap are retention, not inventory.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityDspm
          reviewRequired: false
          original:
            - capability: capabilityDspm
              coverage: partial
              mechanism: >-
                Backend deletion within 30 days; local store bounded to 50 conversations per user/org/app;
                users can delete all history; export scripts before reimaging; no admin retention setting
              steps:
                - title: Manage the device-side store
                  body:
                    - Use the claude-for-msft-365-install plugin export scripts before rebuilds and treat
                      exports as secrets (they contain credentials); control lifetime through profile cleanup
                      rather than an add-in setting.
                  url: https://claude.com/docs/office-agents/data-storage
              note: >-
                Lifecycle only: nothing here discovers or classifies sensitive content in the local store;
                that is the endpoint DLP or DSPM product's job.
              verified: 2026-09-10
      - mitigation: D3-CH
        coverage: partial
        mechanism: >-
          Graph and cloud-provider tokens are obtained and used on the device and never reach Anthropic or the
          model; Claude sign-in, connector and gateway credentials sit unencrypted in the webview's
          localStorage; keyless options (gateway_auth_source=entra, Bedrock via Entra-to-STS, keyless Foundry)
          and a bootstrap_url that re-issues the gateway token about five minutes before its declared expiry
          let the administrator bound credential lifetime; no tunnel
        steps:
          - title: Replace static keys with Entra-issued tokens
            body:
              - >-
                Set entra_sso=1, graph_client_id, entra_scope and gateway_auth_source=entra so the add-in sends
                each user's short-lived Entra access token to your gateway or Foundry resource and ignores any
                gateway_token or azure_api_key.
            url: https://claude.com/docs/office-agents/third-party-platforms
          - title: Issue gateway tokens from a bootstrap endpoint
            body:
              - >-
                Serve the gateway token from bootstrap_url with an expiry; the add-in calls the endpoint again
                about five minutes before expiry and once on a 401, so tokens rotate without users signing out.
            url: https://claude.com/docs/office-agents/third-party-platforms
          - title: Keep secrets out of the manifest query string
            body:
              - >-
                Put gateway_token, azure_api_key, google_client_secret, otlp_headers, inference_headers and
                mcp_servers after # in the manifest URL; the add-in ignores them in the query string from
                October 19, 2026.
            url: https://claude.com/docs/office-agents/third-party-platforms
        note: >-
          Partial by the rule: the administrator can bound lifetime and rotation for the gateway credential
          (Entra or bootstrap), but the Claude-account access and refresh tokens and MCP connector tokens are
          held unencrypted in the add-in's localStorage — the OS account is the only boundary — with no admin
          lifetime or rotation setting, and a static gateway token or API key is a shared secret on every
          device, held until changed and copied into data exports. Custody is otherwise sound where documented:
          the Graph token stays in the MSAL cache and goes only to graph.microsoft.com, and the redirect
          through pivot.claude.ai carries only a code or a consent outcome. Anthropic offers no tunnel for the
          add-ins; admin-attached mcp_servers are called directly from the user's browser.
        verified: "2026-09-25"
        migration:
          from:
            - capabilitySecretsManagement
          reviewRequired: false
          original:
            - capability: capabilitySecretsManagement
              coverage: partial
              mechanism: >-
                Cloud-provider sign-ins use short-lived tokens renewed on device; a centrally issued gateway
                token or API key is a shared secret on every device
              steps:
                - title: Prefer per-user sign-in over a shared key
                  body:
                    - Use Entra ID / cloud-provider sign-in in third-party mode instead of distributing a
                      gateway API key in the manifest.
                  url: https://claude.com/docs/office-agents/data-storage
              note: >-
                Cloud sign-ins are short-lived; a centrally issued gateway token or API key is a long-lived
                shared secret on every device, readable from the add-in's local storage by anyone with the
                user's OS session.
              verified: 2026-09-10
      - mitigation: AML.M0028
        coverage: partial
        mechanism: >-
          Organization settings > Connectors enablement and per-tool Always allow / Needs approval / Blocked
          on claude.ai (enforcement in the add-ins not stated); Organization settings > Office agents "Let
          Claude work across apps" plus the per-device "Let Claude work across files"; disabled_features
          (web_search, file.upload, skills.authoring) and admin-provisioned mcp_servers in custom-manifest
          deployments; a fixed Graph scope set for Outlook
        steps:
          - title: Enable only vetted connectors
            body:
              - >-
                An Owner adds connectors at Organization settings > Connectors and sets each connector's Tool
                permissions; the add-ins offer only connectors enabled in Claude settings.
            url: https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities
          - title: Turn cross-app mode off where it is not needed
            body:
              - >-
                At Organization settings > Office agents turn off Let Claude work across apps; the per-device
                Let Claude work across files setting is off by default on Team and Enterprise.
            url: https://claude.com/docs/office-agents/work-across-apps
          - title: Remove tools in custom-manifest deployments
            body:
              - >-
                Set disabled_features (or access_policies deny statements) for web_search, file.upload and
                skills.authoring, and give each user only the in-network servers listed in mcp_servers.
            url: https://claude.com/docs/office-agents/third-party-platforms
        note: >-
          Partial by the rule: connector-level admission and feature switches exist, but no per-tool or
          read/write scoping per group is documented for the add-ins. Tool permissions are documented for
          claude.ai connectors, and Enterprise custom roles gate connectors per tool, yet neither page names
          the Office add-ins. The built-in Office tools (cell and document writes, execute_office_js) have no
          admin scoping, and Outlook's Graph scope is a fixed delegated set (Mail.ReadWrite, Calendars.Read,
          User.Read, offline_access), all-or-nothing at consent. disabled_features applies per user through
          Entra extension attributes or a bootstrap endpoint; access_policies only through the manifest or
          bootstrap.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityToolPermissionScoping
          reviewRequired: false
          original:
            - capability: capabilityToolPermissionScoping
              coverage: partial
              mechanism: >-
                "Let Claude work across apps" org toggle at Organization settings > Office agents (no
                published default); a separate per-add-in, per-device "Let Claude work across files" setting
