  - architecture: archAgentWorkflow
    asOf: "2026-10"
    # >>> checked against the vendor's documentation
    verified: "2026-11-18"
    sources:
      events: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-what-is.html
      harness: https://docs.aws.amazon.com/lambda/latest/dg/durable-functions.html
      orchestration: https://docs.aws.amazon.com/lambda/latest/dg/durable-basic-concepts.html
      subagents: https://strandsagents.com/latest/documentation/docs/user-guide/concepts/multi-agent/agents-as-tools/
      localTools: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/code-interpreter-tool.html
      state: https://docs.aws.amazon.com/lambda/latest/dg/durable-configuration.html
      gateway: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway.html
      provider: https://docs.aws.amazon.com/bedrock/latest/userguide/what-is-bedrock.html
      internalTools: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-supported-targets.html
      openWeb: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-integrations.html
      registry: https://docs.aws.amazon.com/codeartifact/latest/ug/welcome.html
    differences:
      - at: events->harness
        text: "A durable function started by an SQS event source mapping must finish within the function's maximum timeout (30 minutes, or 90 on Lambda Managed Instances), so a run that waits days for approval is started through a small ordinary Lambda function between the queue and the workflow, which invokes it asynchronously. EventBridge rules already invoke asynchronously."
        url: https://docs.aws.amazon.com/lambda/latest/dg/durable-invoking-esm.html
      - at: operator->events
        text: "Approvals do not come back through EventBridge or SQS: the approval service calls Lambda's SendDurableExecutionCallbackSuccess API directly with the callback ID, so the operator's answer reaches the workflow itself, and who holds that IAM permission is what restricts approval."
        url: https://docs.aws.amazon.com/lambda/latest/dg/durable-security.html
    alsoNeeded:
      - service: "Amazon Cognito"
        role: identity
        why: "Issues the per-agent machine tokens that the gateway's JWT authorizer validates."
        url: https://docs.aws.amazon.com/cognito/latest/developerguide/what-is-amazon-cognito.html
      - service: "AgentCore Identity"
        role: identity
        why: "Workload identity for each agent and credential providers for outbound tokens."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/identity.html
      - service: "Intermediary AWS Lambda function"
        role: other
        why: "Needed between SQS and the durable function for any run longer than 15 minutes."
        url: https://docs.aws.amazon.com/lambda/latest/dg/durable-invoking-esm.html
      - service: "Operator notification and approval service (for example Amazon SNS plus your own app)"
        role: other
        why: "Something must notify the operator and send the callback; AWS's example leaves it to you."
        url: https://docs.aws.amazon.com/lambda/latest/dg/durable-examples.html
      - service: "Amazon SQS dead-letter queue"
        role: other
        why: "Durable functions support dead-letter queues, not Lambda destinations, for failed invocations."
        url: https://docs.aws.amazon.com/lambda/latest/dg/durable-invoking.html
      - service: "Amazon VPC with NAT gateway and AWS Network Firewall"
        role: network
        why: "Lambda in private subnets needs a NAT route; the firewall filters what leaves."
        url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-vpc.html
      - service: "AWS KMS"
        role: keys
        why: "Customer managed key for durable execution data, plus gateway, memory and token vault."
        url: https://docs.aws.amazon.com/lambda/latest/dg/durable-encryption.html
      - service: "AWS Secrets Manager"
        role: secrets
        why: "AgentCore Identity credential providers keep OAuth client secrets and API keys there."
        url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html
      - service: "Amazon ECR"
        role: registry
        why: "Holds the function's container image if Strands and its dependencies ship as an image."
        url: https://docs.aws.amazon.com/lambda/latest/dg/images-create.html
      - service: "AWS WAF on the gateway"
        role: ingress
        why: "Only if the gateway endpoint is reachable from outside; one web ACL per gateway."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-waf.html
      - service: "Amazon CloudWatch and AWS CloudTrail"
        role: logging
        why: "Transaction Search must be switched on once; data events are off by default."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/observability-configure.html
    quickstart:
      - title: "Creating Lambda durable functions"
        url: https://docs.aws.amazon.com/lambda/latest/dg/durable-getting-started.html
      - title: "Examples and use cases"
        url: https://docs.aws.amazon.com/lambda/latest/dg/durable-examples.html
      - title: "Get started with AgentCore Gateway"
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-quick-start.html
    # <<< checked
    reference:
      - title: Workflow orchestration agents (AWS Prescriptive Guidance)
        url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-patterns/workflow-orchestration-agents.html
      - title: Multi-agent collaboration (AWS Prescriptive Guidance)
        url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-patterns/multi-agent-collaboration.html
      - title: Lambda durable functions
        url: https://docs.aws.amazon.com/lambda/latest/dg/durable-functions.html
    summary:
      - >-
        A supervisor agent and its specialists, in any framework, in one Lambda durable function,
        started by EventBridge and SQS, checkpointing every step and suspending on callbacks for days
        when a step needs an operator. Every model and tool call leaves through AgentCore Gateway on a
        token minted for the calling agent, and Policy in AgentCore decides each one. The durable engine
        is a choice: Lambda durable functions keep the graph in one process, as drawn here; AWS's
        prescriptive guidance composes the same pattern from Step Functions with Lambda or AgentCore
        Runtime tasks; a workflow engine such as Temporal on ECS or EKS also serves.
    bindings:
      - { block: events, service: Amazon EventBridge and Amazon SQS }
      - { block: harness, service: Your agents on Lambda durable functions, note: "Your agent graph, in any framework (for example Strands Agents, AWS's SDK), inside one durable execution. AgentCore Runtime suits shorter runs; AgentCore harness is the managed alternative.", watch: [{ text: "Lambda code and its packages are fixed in the deployment package (a .zip archive or a container image) when the function is deployed, so they are installed from your registry at build, not at run time.", url: "https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-package.html" }] }
      - block: orchestration
        service: "Your supervisor agent, with durable steps"
        options:
          - { name: "Your supervisor agent, with durable steps", kind: commercial, url: "https://docs.aws.amazon.com/lambda/latest/dg/durable-basic-concepts.html", packs: [awsNative] }
          - { name: "AWS Lambda durable functions", kind: commercial, url: "https://docs.aws.amazon.com/lambda/latest/dg/durable-functions.html", note: "Checkpoint and replay in one function, runs of up to a year, waits that cost no compute; today's mapping." }
          - { name: "AWS Step Functions Standard workflows", kind: commercial, url: "https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-patterns/workflow-orchestration-agents.html", note: "AWS's prescriptive guidance composes workflow agents from Step Functions or EventBridge; the EKS hosting uses it." }
          - { name: "Temporal Cloud over AWS PrivateLink", kind: commercial, url: "https://docs.temporal.io/cloud/connectivity/aws-connectivity", note: "Managed Temporal reached privately from your VPC; your workers run the steps." }
          - { name: "Temporal, self-hosted", kind: open, url: "https://docs.temporal.io/self-hosted-guide", note: "The open-source Temporal Service, run yourself." }
      - { block: subagents, service: Your specialist agents, builtWith: Strands Agents }
      - block: localTools
        service: "AgentCore Code Interpreter"
        options:
          - { name: "AgentCore Code Interpreter", kind: commercial, url: "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/code-interpreter-tool.html", note: "Managed sandbox with pre-built runtimes for several languages, isolated inside AgentCore; today's mapping.", packs: [awsNative] }
          - { name: "AWS Lambda MicroVMs", kind: commercial, url: "https://docs.aws.amazon.com/lambda/latest/dg/lambda-microvms-guide.html", note: "Firecracker microVMs restored from a snapshot of your image, with VM-level isolation and controlled ingress and egress." }
