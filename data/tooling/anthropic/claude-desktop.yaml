# Claude (claude.ai) and Claude Desktop — one entity per product × reference architecture. Facts are
# dated (asOf) and cite the vendor's own documentation; re-verify before enforcing.
# Schema: data/tooling/README.md.
# 2026-10-30 split: the SaaS architectures represent browser interfaces only, so the record that covered
# claude.ai, the mobile apps and Claude Desktop became two entities. toolClaudeWeb (archEnterpriseAiChat) is
# the web product; the desktop and mobile apps show the same synced chats and appear on it only as that.
# toolClaudeDesktop (archCodingAgentThirdParty) keeps the id and is the desktop app's own local reach: local
# MCP servers, desktop extensions, device policy, auto-update, what other surfaces reach through the app, and
# Claude Desktop on 3P (a deployment mode with local history, recorded as its variant, not an entity). The
# Code tab is a variant of toolClaudeCode and the Cowork tab is toolClaudeCowork; neither is repeated here.
# 2026-09-25: re-verified the combined record against the MITRE capability rules; every cited support.claude.com,
# claude.com and platform.claude.com page answered 200 with no redirect (platform and claude.com docs read as
# .md); trust.anthropic.com renders client-side and was read in a browser; nvd.nist.gov answers 403 to curl
# without a browser user agent and lands on the lower-case CVE path.
# 2026-10-30 fetch log: every support.claude.com, claude.com/docs (.md) and code.claude.com (.md) page cited
# below answered 200 with no redirect; nvd.nist.gov still answers 403 to curl and was not re-read (the
# advisory moved unchanged); trust.anthropic.com was not re-read (client-rendered).
vendor: anthropic
family: Claude
tools:
  - id: toolClaudeWeb
    name: Claude (claude.ai)
    surfaceClasses:
      - saasChat
    variants:
      - name: claude.ai in the browser
        class: saasChat
        url: https://support.claude.com/en/articles/9797531-what-is-the-enterprise-plan
      - name: The same synced chats in Claude Desktop and the iOS / Android apps
        class: saasChat
        url: https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities
        note: >-
          Standard Claude Desktop loads the claude.ai web application and stores conversations on Anthropic's
          backend, and connectors added on the web or desktop follow the account to the mobile apps, so as a
          chat client each app is this product. What the desktop app runs or reaches on the device is
          toolClaudeDesktop.
    architecture: archEnterpriseAiChat
    status: ga
    asOf: "2026-10"
    summary:
      - >-
        Anthropic's chat product, claude.ai in the browser. Chat runs on the Anthropic API under the user's
        organisation login; connectors (MCP) reach Google Drive, Microsoft 365, GitHub, Slack and custom
        remote servers through mcp-proxy.anthropic.com. Prompts, uploads and connector results go to
        Anthropic; Team and Enterprise data is not used for training and follows the organisation's retention
        setting (indefinite by default until a custom period is set). Claude Desktop and the mobile apps show
        the same synced chats; the desktop app's local reach (local MCP servers, desktop extensions, device
        policy) is the endpoint record toolClaudeDesktop.
      - >-
        Team and Enterprise administration is in the claude.ai console: SSO (SAML/OIDC via WorkOS) with domain
        verification and "Require SSO for Claude", JIT or SCIM provisioning with group-to-role mapping, custom
        roles and groups gating Claude Code, Cowork, Chrome, connectors, Claude Tag and models, connector
        enablement and per-tool read/write restrictions, enterprise-managed connector authorisation through
        the IdP, audit logs (180-day export) and the Compliance API (Activity Feed, chats, files, projects,
        session transcripts, effective settings), custom retention, spend limits, IP allowlisting, CMEK and
        US-only inference.
    facts:
      - label: Plans
        value: >-
          Free, Pro, Max (consumer terms); Team (SSO, server-managed settings, analytics); Enterprise (SCIM,
          custom roles, Compliance API, audit logs, custom retention, CMEK, IP allowlisting, ZDR for Claude
          Code, HIPAA-ready option, US-only inference).
        url: https://support.claude.com/en/articles/9797531-what-is-the-enterprise-plan
      - label: Inference & routing
        value: >-
          Anthropic API, with conversations stored on Anthropic's backend for the web, desktop and mobile apps
          alike. Claude Desktop on 3P, which routes to a cloud provider and keeps history on the device, is a
          variant of toolClaudeDesktop.
        url: https://claude.com/docs/third-party/claude-desktop/overview
      - label: Data leaving the device
        value: >-
          Prompts, attachments, artifact content and connector retrievals to Anthropic; remote connectors are
          reached from Anthropic's cloud, not from the device; the tenant-restrictions header (web, desktop,
          API-key and OAuth access) and the IP allowlist are the network-side gates.
        url: >-
          https://support.claude.com/en/articles/13198485-enforce-network-level-access-control-with-tenant-restrictions
      - label: Retention & training
        value: >-
          Commercial plans: no training; chat and project retention indefinite by default, configurable from
          30 days at Organization settings > Data and privacy; audit logs 180 days; Compliance API
          local/remote session transcripts 6 years or the custom period.
        url: >-
          https://support.claude.com/en/articles/10440198-configure-custom-data-retention-controls-for-enterprise-plans
      - label: Docs index
        value: >-
          support.claude.com Team and Enterprise plans collection plus platform.claude.com manage-claude
          (Compliance API, inference hooks)
        url: https://support.claude.com/en/articles/9797531-what-is-the-enterprise-plan
    items:
      - title: Managed connector authorization
        body:
          - Enterprise-managed connector authorization (GA) lets admins provision MCP connectors org-wide
            through the IdP (Okta today), assign them by role and scope the permissions Claude may request;
            Owners can also restrict each connector's tools to read-only and block verified-domain services from
            connecting to outside accounts. Connector permissions govern the connectors added under
            Organization settings > Connectors, not servers a member runs locally in Claude Desktop (the desktop
            extension allowlist and device policy for those are on toolClaudeDesktop).
        links:
          - title: Org-wide MCP connector authorization
            url: >-
              https://support.claude.com/en/articles/15537633-authorize-mcp-connectors-for-your-entire-organization
          - title: Use connectors (admin controls)
            url: >-
              https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities
          - title: Manage custom roles on Enterprise plans (where connector permissions apply)
            url: https://support.claude.com/en/articles/13930452-manage-custom-roles-on-enterprise-plans
      - title: Identity, audit and compliance for the organisation
        body:
          - SSO via WorkOS (Okta, Entra ID, Google, OneLogin, JumpCloud, Duo SAML) with "Require SSO for
            Claude", JIT or SCIM provisioning with group-to-role mapping and automatic removal; Enterprise
            custom roles and groups; IP allowlisting (CIDR ranges enabled by Anthropic support); tenant
            restrictions via the proxy-injected anthropic-allowed-org-ids header.
          - Audit logs (Enterprise, 180 days, emailed download link) from Organization settings > Data and
            privacy; the Compliance API for the Activity Feed, chats, files, projects, directory, effective
            settings and Cowork / Claude Code / M365 session transcripts; custom data retention from 30 days;
            Inference hooks for inline allow/deny of every governed prompt across claude.ai, Cowork, Claude
            Code, Claude for Microsoft 365, Claude Tag and Claude in Chrome.
        links:
          - title: Set up single sign-on
            url: https://support.claude.com/en/articles/13132885-set-up-single-sign-on-sso
          - title: Set up JIT or SCIM provisioning
            url: https://support.claude.com/en/articles/13133195-set-up-jit-or-scim-provisioning
          - title: Compliance API
            url: https://platform.claude.com/docs/en/manage-claude/compliance-api
    riskNotes:
      - risk: riskExcessiveDataHandlingDuringInference
        note: >-
          Chat and project retention is indefinite until an Owner sets a period; uploads, connector results
          and artifacts persist with the chat. Custom retention and the Compliance API delete endpoints are
          the levers.
      - risk: riskAgenticDelegationConfusedDeputy
        note: >-
          Connectors act with the user's granted scopes; org-wide tool restrictions (read vs write) and
          managed authorisation scoping keep Claude from sending mail or writing tickets when only reading is
          intended.
      - risk: riskShadowAndUnknownAgents
        note: >-
          Personal accounts on the corporate network are blocked only by tenant restrictions or IP
          allowlisting; domain capture and SSO enforcement pull verified-domain users into the organisation.
    controls:
      - mitigation: D3-APA
        coverage: native
        mechanism: >-
          Enterprise custom roles and groups (Organization settings > Roles, Groups) grant capabilities, each
          connector and connector tool (Always allow / Needs approval / Blocked) and admin permissions, with
          "View effective role"; target-tenant consent for the connector apps is documented: Microsoft Entra
          admin consent for the two Microsoft 365 connector apps (client IDs 08ad6f98-a4f8-4635-bb8d-f1a3044760f0
          and 07c030f6-5743-41b7-ba00-0a6e85f37c17) and Google Workspace API controls trust for Claude
        steps:
          - title: Authorise features and connectors by role
            body:
              - >-
                At Organization settings > Roles create custom roles, choose their groups, toggle capabilities
                and set each connector or tool on the Connectors tab; check a member with View effective role.
            url: >-
              https://support.claude.com/en/articles/13930458-set-up-role-based-permissions-on-enterprise-plans
          - title: Decide in Microsoft Entra whether the connector may be granted
            body:
              - >-
                A Global Administrator grants admin consent through the adminconsent URLs for both client IDs,
                requires assignment on the M365 MCP Server for Claude and M365 MCP Client for Claude enterprise
                apps, and revokes Graph permissions the organisation does not want.
            url: https://support.claude.com/en/articles/12542951-set-up-the-microsoft-365-connector
          - title: Decide in Google Workspace
            body:
              - >-
                In admin.google.com under Security > Access and data control > API controls > Manage
                third-party app access, set Claude to Trusted, or leave it blocked.
            url: https://support.claude.com/en/articles/10166901-use-google-workspace-connectors
          - title: Pull personal accounts on your domain into the tenant (Enterprise)
            body:
              - >-
                With Restrict organization creation, SSO enforcement and JIT or SCIM in place, turn on Migrate
                accounts using your domain under Organization settings > Organization and access > Security.
            url: https://support.claude.com/en/articles/14625619-claim-and-migrate-accounts-on-your-domain
        note: >-
          Native on Enterprise by the rule: the console administers role and group authorisation over
          connectors, tools and features, enforced on Anthropic's servers and failing toward deny, and the
          vendor documents the target-tenant consent path with the app IDs. Team plans have organisation-wide
          connector and tool policy only, which is partial. Connector permissions apply only to members on the
          Custom role (User, Admin and Owner see every organisation connector under the organisation-wide
          policy), grants are additive across roles, and role changes take up to 15 minutes. The consent itself
          is the target tenant's control, not Anthropic's. Domain capture (Enterprise) keeps employees in the
          corporate tenant; Team plans can verify a domain but not claim existing accounts. Pinning the desktop
          app's sign-in to the organisation (forceLoginOrgUUID) is device policy, recorded on toolClaudeDesktop.
        verified: "2026-10-30"
        migration:
          from:
            - capabilityIga
            - capabilityDataAccessGovernance
          reviewRequired: false
          original:
            - capability: capabilityIga
              coverage: native
              mechanism: >-
                SSO (SAML/OIDC) with Require SSO for Claude, domain verification and capture, JIT or SCIM
                provisioning with group-to-role mapping, custom roles and groups (Enterprise)
              steps:
                - title: Enforce SSO
                  body:
                    - Verify domains at claude.ai/admin-settings/organization, configure the IdP through
                      WorkOS, then toggle "Require SSO for Claude" in Authentication settings.
                  url: https://support.claude.com/en/articles/13132885-set-up-single-sign-on-sso
                - title: Provision and deprovision from the directory
                  body:
                    - Enable SCIM with group-to-role mapping (Enterprise / Console); users removed from all
                      mapped groups are removed at the next sync.
                  url: https://support.claude.com/en/articles/13133195-set-up-jit-or-scim-provisioning
                - title: Gate features by role
                  body:
                    - Create custom roles and groups at Organization settings > Roles and Groups to gate
                      Claude Code, Cowork, Chrome, connectors, Claude Tag, models and admin scopes.
                  url: >-
                    https://support.claude.com/en/articles/13930458-set-up-role-based-permissions-on-enterprise-plans
              verified: 2026-09-10
            - capability: capabilityDataAccessGovernance
              coverage: partial
              mechanism: >-
                Connectors retrieve as the authenticated user (OAuth) or as the scoped managed authorisation;
                verified-domain restriction stops org services connecting to outside accounts
              steps:
                - title: Keep retrieval per user
                  body:
                    - Prefer user OAuth or role-scoped managed authorisation over shared service accounts and
                      turn on the verified-domain connector restriction on Enterprise.
                  url: >-
                    https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities
              note: >-
                Delegated when the connector runs as the user (the source system enforces the user's
                permissions, oversharing included); service-owned when enterprise-managed authorisation is
                used, in which case the managed scope, not the user's entitlements, bounds retrieval for
                everyone.
              verified: 2026-09-10
      - mitigation: D3-OTF
        coverage: partial
        mechanism: >-
          anthropic-allowed-org-ids tenant-restriction header (Enterprise and Console) injected by the
          organisation's TLS-inspecting proxy and enforced by Anthropic for claude.ai web, desktop, API-key and
          OAuth traffic; IP allowlisting (Enterprise, CIDR ranges enabled by Anthropic support); the code
          execution sandbox's own egress set at Organization settings > Capabilities
        steps:
          - title: Block other tenants at the proxy
            body:
              - >-
                Inject anthropic-allowed-org-ids with your organisation UUIDs (numbered continuation headers,
                up to 500 UUIDs) for claude.ai, api.anthropic.com, claude.com and anthropic.com, overwriting the
                header on every request.
            url: https://support.claude.com/en/articles/13198485-enforce-network-level-access-control-with-tenant-restrictions
          - title: Restrict where your tenant can be used from (Enterprise)
            body:
              - >-
                Send Anthropic support your office and VPN CIDR ranges; every authenticated request from
                another address is then denied.
            url: https://support.claude.com/en/articles/13200993-restrict-access-to-claude-with-ip-allowlisting
          - title: Set the sandbox's own egress
            body:
              - >-
                At Organization settings > Capabilities under Code execution and file creation, leave Allow
                network egress off or limit it to package managers and named domains.
            url: https://support.claude.com/en/articles/12111783-create-and-edit-files-with-claude
        note: >-
          Partial on the D3-OTF rule: Anthropic honours a documented tenant-restriction header that the
          organisation's SSE injects (TLS inspection required; other organisations get a 403
          tenant_restriction_violation), so personal and foreign tenants are blocked on managed networks. A
          customer proxy does not control the vendor's own egress: remote connectors reach MCP servers from
          Anthropic's cloud, web search runs on Anthropic's servers, and the code execution sandbox is governed
          only by the Capabilities network setting (off for new Enterprise organisations, package managers only
          on Team; connector traffic stays possible whatever it says). Off-network and unmanaged devices bypass
          the header; IP allowlisting gates only the organisation's own tenant. Local MCP servers and desktop
          extensions in Claude Desktop use the device's network; that local reach is toolClaudeDesktop.
        verified: "2026-10-30"
        migration:
          from:
            - capabilitySse
            - capabilityEgressControl
          reviewRequired: false
          original:
            - capability: capabilitySse
              coverage: partial
              mechanism: >-
                IP allowlisting (Enterprise, CIDR ranges enabled by Anthropic support) and tenant restrictions
                (anthropic-allowed-org-ids header injected by a TLS-inspecting proxy)
              steps:
                - title: Restrict where Claude can be used from
                  body:
                    - Compile CIDR ranges and have Anthropic enable IP allowlisting; every authenticated request outside the
                      ranges is denied (Anthropic-hosted cloud sessions then need an exemption).
                  url: >-
                    https://support.claude.com/en/articles/13200993-restrict-access-to-claude-with-ip-allowlisting
                - title: Block other tenants at the proxy
                  body:
                    - Inject anthropic-allowed-org-ids with your org UUIDs for claude.ai, api.anthropic.com, claude.com and
                      anthropic.com (up to 500 UUIDs across numbered headers).
                  url: >-
                    https://support.claude.com/en/articles/13198485-enforce-network-level-access-control-with-tenant-restrictions
              note: >-
                IP allowlisting is enforced by Anthropic; the tenant-restriction header is enforced by a
                TLS-inspecting proxy the organisation operates. Neither is an SSE service: inline inspection
                of prompts and uploads is the customer's SSE, and its completeness depends on which paths it
                sees.
              verified: 2026-09-10
            - capability: capabilityEgressControl
              coverage: partial
              mechanism: Documented host allowlist for Claude Desktop and claude.ai; egressProxyUrl / PAC keys on 3P;
                connector traffic through mcp-proxy.anthropic.com; custom connectors reachable only via
                allowlisted Anthropic IPs
              steps:
                - title: Allowlist the documented hosts
                  body:
                    - Permit anthropic.com, claude.ai, claude.com, platform.claude.com, downloads.claude.ai,
                      *.claudeusercontent.com and *.claudemcpcontent.com (plus optional CDN hosts for
                      artifacts) and route through egressProxyUrl on managed devices.
                  url: https://code.claude.com/docs/en/desktop
              note: The product documents its destinations and offers proxy keys; it enforces no destination policy of its
                own. Connector traffic egresses from Anthropic's MCP proxy, outside the organisation's
                network.
              verified: 2026-09-10
      - mitigation: cap-sensitive-data-redaction
        coverage: partial
        mechanism: >-
          Inference hooks (Enterprise) hold every governed claude.ai request on web, desktop and mobile,
          with its tool calls, tool results and extracted attachment text, for an allow or deny verdict from
          the organisation's DLP or AI security server; the Compliance API supports detection after the fact
        steps:
          - title: Put your DLP inline (Enterprise)
            body:
              - >-
                At Organization settings > Data and privacy > Inference hooks turn on Allow for your
                organization, register the endpoint and signing secret, set Failure handling to Block the
                request, Requests inspected to 100 and turn on Enforce verdicts.
            url: https://platform.claude.com/docs/en/manage-claude/inference-hooks-configuration
          - title: Scan stored content after the fact
            body:
              - >-
                Give your DLP or DSPM product a Compliance Access Key with read:compliance_user_data to page
                through /v1/compliance/apps/chats, messages and files, and delete:compliance_user_data only on a
                separate key.
            url: https://platform.claude.com/docs/en/manage-claude/compliance-content-data
        note: >-
          Partial by the rule: an inline hook that hands prompts to the organisation's DLP with a block verdict
          is an attach point, and Claude classifies nothing itself. The hook allows or denies only (no masking or
          redaction), never receives image bytes (a screenshot of a document is not inspected), has no
          response-side event yet, skips voice mode, members of excluded custom roles and requests outside the
          rollout percentage, and falls back to the failure-handling choice when the server errs or the circuit
          breaker trips. A blocked message stays in the conversation. It is not available on Bedrock or Google
          Cloud, nor on Team plans. Blocking connector write tools and custom retention are minimisation and
          lifecycle, not detection; Compliance API scanning finds content after it reached Anthropic.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAiDlp
            - capabilityBrowserDetectionResponse
          reviewRequired: false
          original:
            - capability: capabilityAiDlp
              coverage: partial
              mechanism: >-
