# The enterprise landscape: the MITRE parent capabilities placed onto the security domains an
# enterprise security organisation already runs, so leadership can read coverage and gaps at the
# enterprise level before opening any one reference architecture. Specialisations follow their
# parent and are never placed here.
#
# A placement is one string per view: "group" or "group/lane". The build requires every MITRE
# parent to be placed exactly once in every view.
attribution: The framing is borrowed, not invented — CISA's Zero Trust Maturity Model pillars and
  cross-cutting capabilities. Placing each MITRE capability onto it is this repository's authored
  judgement, one primary home per capability; it does not claim CISA would place it the same way.
views:
  - id: domains
    title: Security domains
    short: Domains
    kind: groups
    basis: CISA Zero Trust Maturity Model v2.0 — five pillars, three cross-cutting capabilities
    url: https://www.cisa.gov/zero-trust-maturity-model
    description: >-
      The enterprise view your security organisation already runs: pillars are the estates
      teams own, and the bars beneath them cut across every pillar. Read a column to see how much
      of AI security lands on one team; read a bar to see what has to be organisation-wide.
    groups:
      - id: identity
        title: Identity & access
        role: pillar
        blurb: Human, workload and agent identities, their credentials, and authorization at every boundary
      - id: devices
        title: Devices & endpoints
        role: pillar
        blurb: The managed device an agent runs on — isolation, process behaviour, browser sessions
      - id: networks
        title: Networks
        role: pillar
        blurb: Segmentation, egress control and message security between components
      - id: workloads
        title: Applications & workloads
        role: pillar
        blurb: The AI application, its models, its agents and their supply chain
        lanes:
          - id: models
            title: Models & supply chain
          - id: apps
            title: Applications & agents
          - id: testing
            title: Development & testing
      - id: data
        title: Data
        role: pillar
        blurb: Training, retrieval and state data — inventory, provenance, encryption, recovery
      - id: visibility
        title: Visibility & analytics
        role: crosscutting
        blurb: Telemetry, inventories and detection analytics that span every pillar
      - id: automation
        title: Automation & orchestration
        role: crosscutting
        blurb: Response and recovery actions — revoke, terminate, restore
      - id: governance
        title: Governance
        role: crosscutting
        blurb: Risk assessment and assurance programmes over the whole estate
