  # >>> software factory mapping (checked against the vendor's pages by two people)
  - architecture: archSoftwareFactory
    asOf: "2026-11"
    verified: "2026-11-21"
    reference:
      - title: "It's safe to close your laptop now: Hosting coding agents on Amazon Bedrock AgentCore (AWS Machine Learning Blog)"
        url: https://aws.amazon.com/blogs/machine-learning/its-safe-to-close-your-laptop-now-hosting-coding-agents-on-amazon-bedrock-agentcore/
      - title: "Extend Claude Code to remote sessions on Amazon Bedrock AgentCore with security controls (AWS Machine Learning Blog)"
        url: https://aws.amazon.com/blogs/machine-learning/extend-claude-code-to-remote-sessions-on-amazon-bedrock-agentcore-with-security-controls/
      - title: "Deployment Pipeline Reference Architecture (DPRA) for AWS workloads"
        url: https://aws-samples.github.io/aws-deployment-pipeline-reference-architecture/
      - title: "Organizing Your AWS Environment Using Multiple Accounts (AWS whitepaper)"
        url: https://docs.aws.amazon.com/whitepapers/latest/organizing-your-aws-environment/organizing-your-aws-environment.html
    summary:
      - >-
        Each build runs your coding agent (Claude Code on the Claude Agent SDK, or another CLI agent) in
        its own Amazon Bedrock AgentCore Runtime session in VPC mode, calling models through AgentCore
        Gateway, installing from AWS CodeArtifact and pushing a branch to the app's repository (GitHub
        here; GitLab, Bitbucket or CodeCommit also serve). A platform-owned CodePipeline with CodeBuild
        and Amazon Inspector builds, scans and deploys previews; the app owner approves in CodePipeline;
        an ECS canary deploy releases to one Control Tower account per app, behind an ALB that signs
        users in.
    bindings:
      - { block: intake, service: "Intake app on CloudFront and Lambda", build: true, note: "Screens the request and uploads with Bedrock Guardrails before writing the spec to DynamoDB; the same shape AWS uses to queue tasks for its remote coding agent sample.", url: https://aws.amazon.com/blogs/machine-learning/extend-claude-code-to-remote-sessions-on-amazon-bedrock-agentcore-with-security-controls/ }
      - block: harness
        service: "Agent on AgentCore Runtime"
        builtWith: "Claude Agent SDK (Claude Code)"
        note: "One runtime per app repository and one session per build, as in AWS's sample. Codex, Kiro CLI or OpenCode package the same way as a container image."
        url: https://aws.amazon.com/blogs/machine-learning/extend-claude-code-to-remote-sessions-on-amazon-bedrock-agentcore-with-security-controls/
        options:
          - { name: "Agent on AgentCore Runtime", kind: commercial, url: "https://aws.amazon.com/blogs/machine-learning/extend-claude-code-to-remote-sessions-on-amazon-bedrock-agentcore-with-security-controls/", packs: [awsNative] }
          - { name: "GitLab Duo Agent Platform", kind: commercial, url: "https://docs.gitlab.com/user/duo_agent_platform/", note: "Chosen with the coding agent, not here; GA on Self-Managed with self-hosted models from 18.8.", packs: [gitlabOnAws] }
      - { block: nativeTools, service: "AgentCore Runtime session microVM", note: "Shell, files and tests run in the session's own microVM; your dispatcher can run deterministic steps with InvokeAgentRuntimeCommand. Tools must be in the image.", url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-execute-command.html }
      - block: gateway
        service: "Amazon Bedrock AgentCore Gateway"
        note: "Inference connector targets hold the model credential; MCP targets serve the platform's tools. AWS's post mounts shared skills from S3 Files instead."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-inference-connector.html
        options:
          - { name: "Amazon Bedrock AgentCore Gateway", kind: commercial, url: "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-inference-connector.html", note: "bedrock-runtime, bedrock-mantle, openai and anthropic connectors hold the model credential; today's mapping.", packs: [awsNative] }
          - { name: "LiteLLM Proxy on Amazon ECS or EKS", kind: open, url: "https://docs.aws.amazon.com/solutions/multi-provider-generative-ai-gateway-on-aws/", note: "AWS's Multi-Provider Generative AI Gateway guidance: OpenAI-compatible proxy, virtual keys in RDS, Bedrock and external providers.", packs: [awsEksOpenSource] }
          - { name: "Kong AI Gateway", kind: commercial, url: "https://developer.konghq.com/ai-gateway/ai-providers/bedrock/", note: "AI Gateway Enterprise: Bedrock provider, AI MCP Proxy with tool ACLs, Bedrock Guardrails applied at the gateway.", packs: [kongAiGateway] }
          - { name: "agentgateway", kind: open, url: "https://agentgateway.dev/", note: "Open-source data plane for service, LLM, MCP and agent-to-agent traffic in one gateway." }
      - block: provider
        service: "Amazon Bedrock (Claude models)"
        note: "Whichever Bedrock models the organisation approves for coding, for example Anthropic Claude, Amazon Nova or OpenAI's open-weight models; the gateway's connectors also reach the Anthropic and OpenAI APIs with a vaulted key."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-inference-connector.html
        options:
          - { name: "Amazon Bedrock (Claude models)", kind: commercial, url: "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-inference-connector.html", packs: [awsNative] }
          - { name: "Amazon Bedrock models through GitLab Duo Self-Hosted", kind: commercial, url: "https://docs.gitlab.com/administration/gitlab_duo_self_hosted/supported_models_and_hardware_requirements/", packs: [gitlabOnAws] }
      - block: registry
        service: "AWS CodeArtifact repositories"
        note: "The sandbox reads a repository with no external connection; an admission pipeline copies versions in after age and Inspector checks."
        url: https://docs.aws.amazon.com/codeartifact/latest/ug/package-version-age-gating.html
        options:
          - { name: "AWS CodeArtifact repositories", kind: commercial, url: "https://docs.aws.amazon.com/codeartifact/latest/ug/welcome.html", note: "Managed repositories with external connections to public registries such as npmjs or Maven Central; today's mapping.", packs: [awsNative] }
          - { name: "JFrog Artifactory", kind: commercial, url: "https://docs.jfrog.com/artifactory/docs/hugging-face-repositories", note: "Remote repositories cache packages, and Hugging Face models and datasets too." }
          - { name: "Sonatype Nexus Repository", kind: commercial, url: "https://help.sonatype.com/en/hugging-face-repositories.html", note: "Proxy repositories for package formats, Hugging Face among them." }
          - { name: "GitLab package and container registry", kind: commercial, url: "https://docs.gitlab.com/user/packages/package_registry/", note: "Per-project registries; the virtual registry that proxies upstreams is beta. AI on EKS's Agents environment uses GitLab's.", packs: [gitlabOnAws, awsEksOpenSource], watch: [{ text: "The virtual registry that proxies upstream registries is beta.", url: "https://docs.gitlab.com/user/packages/package_registry/" }] }
      - { block: sources, service: "Public registries (npm, PyPI, Maven)", url: https://docs.aws.amazon.com/codeartifact/latest/ug/external-connection.html }
      - block: sourceControl
        service: "GitHub, one repository per app"
        note: "Wired to CodePipeline through AWS CodeConnections, which also connects GitLab and Bitbucket; AWS CodeCommit is AWS's own. Prefer GitHub or GitLab where Inspector Code Security must scan the repositories: it connects to those, not to CodeCommit."
        url: https://docs.aws.amazon.com/inspector/latest/user/code-security-assessments-connect-github.html
        options:
          - { name: "GitHub, one repository per app", kind: commercial, url: "https://docs.aws.amazon.com/dtconsole/latest/userguide/supported-versions-connections.html", note: "Today's mapping; CodeConnections supports GitHub, GitHub Enterprise Cloud and GitHub Enterprise Server.", packs: [awsNative] }
          - { name: "GitLab (GitLab.com, Self-Managed or Dedicated)", kind: commercial, url: "https://docs.aws.amazon.com/inspector/latest/user/code-security-assessments.html", note: "Inspector Code Security scans it, self-managed instances in private networks through CodeConnections included.", packs: [gitlabOnAws, awsEksOpenSource] }
          - { name: "Bitbucket", kind: commercial, url: "https://docs.aws.amazon.com/dtconsole/latest/userguide/supported-versions-connections.html", note: "Supported by AWS CodeConnections." }
          - { name: "Azure DevOps", kind: commercial, url: "https://docs.aws.amazon.com/dtconsole/latest/userguide/supported-versions-connections.html", note: "Supported by AWS CodeConnections." }
          - { name: "AWS CodeCommit", kind: commercial, url: "https://docs.aws.amazon.com/codecommit/latest/userguide/welcome.html", note: "AWS-hosted private Git repositories.", watch: [{ text: "Its interface VPC endpoint takes a policy naming the principals, actions and repositories allowed, so pushes can be limited at the network.", url: "https://docs.aws.amazon.com/codecommit/latest/userguide/codecommit-and-interface-VPC.html" }] }
      - block: pipeline
        service: "AWS CodePipeline (V2) with AWS CodeBuild"
        note: "One platform-owned pipeline per app in the tooling account, started on push and pull request; buildspec held in the project; InspectorScan action; deploys the preview."
        url: https://docs.aws.amazon.com/codepipeline/latest/userguide/pipelines-filter.html
        options:
          - { name: "AWS CodePipeline (V2) with AWS CodeBuild", kind: commercial, url: "https://docs.aws.amazon.com/codepipeline/latest/userguide/approvals.html", note: "A platform-owned pipeline per app with manual approval actions; today's mapping.", packs: [awsNative] }
          - { name: "GitHub Actions with OIDC to IAM roles", kind: commercial, url: "https://docs.github.com/en/actions/how-tos/secure-your-work/security-harden-deployments/oidc-in-aws", note: "configure-aws-credentials assumes a role trusted on the token's sub claim; jobs can run on CodeBuild-hosted runners." }
          - { name: "GitLab CI/CD with OIDC to IAM roles", kind: commercial, url: "https://docs.gitlab.com/ci/cloud_services/aws/", note: "GitLab registered as an IAM OIDC provider; jobs assume a role with no stored keys.", packs: [gitlabOnAws, awsEksOpenSource] }
          - { name: "Argo CD for GitOps deployment", kind: open, url: "https://awslabs.github.io/ai-on-eks/docs/infra/agents/agents-on-eks", note: "Deploys from Git to EKS; AI on EKS's Agents on EKS environment pairs it with GitLab CI." }
      - block: previews
        service: "ECS on Fargate, per-app preview account"
        note: "Behind an ALB authenticate-cognito rule whose user pool federates only to an Identity Center app assigned to the requester and owner; test data, no connector network."
        url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/listener-authenticate-users.html
        options:
          - { name: "ECS on Fargate, per-app preview account", kind: commercial, url: "https://docs.aws.amazon.com/AmazonECS/latest/developerguide/deployment-type-ecs.html", note: "Today's mapping, behind an ALB sign-in rule.", packs: [awsNative] }
          - { name: "ECS Express Mode services", kind: commercial, url: "https://docs.aws.amazon.com/AmazonECS/latest/developerguide/express-service-overview.html", note: "ECS services that share Application Load Balancers across services with the same networking configuration.", watch: [{ text: "Given no subnets, it uses the default VPC's public subnets, an internet-facing load balancer and public task IPs, with no sign-in in front.", url: "https://docs.aws.amazon.com/AmazonECS/latest/developerguide/express-service-work.html" }] }
          - { name: "AWS Amplify Hosting web previews for pull requests", kind: commercial, url: "https://docs.aws.amazon.com/amplify/latest/userguide/pr-previews.html", note: "A preview URL per pull request for web front ends.", watch: [{ text: "Each pull request gets its own preview URL; branch password protection is the built-in way to restrict who opens it.", url: "https://docs.aws.amazon.com/amplify/latest/userguide/pr-previews.html" }] }
          - { name: "GitLab review apps", kind: commercial, url: "https://docs.gitlab.com/ci/review_apps/", note: "A temporary environment per merge request from the GitLab pipeline.", packs: [gitlabOnAws] }
      - block: deployGate
        service: "CodePipeline approval and ECS canary"
        note: "The owner approves one execution; a CloudFormation deploy action then updates the app's stack in its account, and ECS shifts traffic by the service's canary settings."
        url: https://docs.aws.amazon.com/codepipeline/latest/userguide/approvals.html
        options:
          - { name: "CodePipeline approval and ECS canary", kind: commercial, url: "https://docs.aws.amazon.com/AmazonECS/latest/developerguide/canary-deployment.html", note: "The owner approves one execution; ECS shifts traffic by its canary settings; today's mapping.", packs: [awsNative] }
          - { name: "GitHub environments with required reviewers", kind: commercial, url: "https://docs.github.com/en/actions/how-tos/deploy/configure-and-manage-deployments/manage-environments", note: "A deployment job waits until one of up to six named people or teams approves." }
          - { name: "GitLab deployment approvals", kind: commercial, url: "https://docs.gitlab.com/ci/environments/deployment_approvals/", note: "Protected environments that need approval before deploy; Premium or Ultimate.", packs: [gitlabOnAws] }
          - { name: "Argo Rollouts on EKS", kind: open, url: "https://argoproj.github.io/argo-rollouts/", note: "Kubernetes canary and blue-green controller for apps hosted on EKS." }
      - block: appTenant
        service: "One AWS account per app"
        note: "An Account Factory Customization blueprint creates the VPC, cluster, user pool, keys and deploy role in a Generated apps OU. AWS's multi-account guidance treats the account as the isolation boundary; a shared account per environment with per-app VPCs, roles and keys is the lighter way."
        url: https://docs.aws.amazon.com/controltower/latest/userguide/af-customization-page.html
        options:
          - { name: "One AWS account per app", kind: commercial, url: "https://docs.aws.amazon.com/controltower/latest/userguide/af-customization-page.html", note: "A blueprint builds each account from CloudFormation or Terraform; today's mapping.", packs: [awsNative] }
          - { name: "One account per app with Account Factory for Terraform", kind: commercial, url: "https://docs.aws.amazon.com/controltower/latest/userguide/aft-overview.html", note: "The same boundary, vended from a Terraform pipeline." }
          - { name: "Shared account per environment, per-app VPCs, roles and KMS keys", kind: commercial, url: "https://docs.aws.amazon.com/whitepapers/latest/organizing-your-aws-environment/organizing-your-aws-environment.html", note: "A lighter boundary inside one account; AWS's multi-account guidance treats the account as the identity boundary." }
      - block: appHosting
        service: "ECS on Fargate, ALB with sign-in"
        note: "A standard ECS service, not Express Mode, so the blueprint owns the listener rules. App Runner is closed to new customers."
        url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/express-service-work.html
        options:
          - { name: "ECS on Fargate, ALB with sign-in", kind: commercial, url: "https://docs.aws.amazon.com/AmazonECS/latest/developerguide/deployment-type-ecs.html", note: "Today's mapping; a standard service, so the blueprint owns the listener rules.", packs: [awsNative] }
          - { name: "ECS Express Mode", kind: commercial, url: "https://docs.aws.amazon.com/AmazonECS/latest/developerguide/express-service-overview.html", note: "Application Load Balancers shared across Express Mode services.", watch: [{ text: "Its load balancer has no sign-in, and up to 25 Express Mode services in one VPC share an Application Load Balancer.", url: "https://docs.aws.amazon.com/AmazonECS/latest/developerguide/express-service-work.html" }] }
          - { name: "AWS Lambda", kind: commercial, url: "https://docs.aws.amazon.com/lambda/latest/dg/welcome.html", note: "For apps that fit request-driven functions." }
          - { name: "Amazon EKS", kind: commercial, url: "https://docs.aws.amazon.com/eks/latest/userguide/what-is-eks.html", note: "Where generated apps land on a Kubernetes platform the organisation already runs.", packs: [awsEksOpenSource] }
      - { block: appData, service: "DynamoDB, Aurora or S3, per app", note: "Encrypted with the app's own KMS key and reachable only through the app's VPC endpoints.", url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/example-bucket-policies-vpc-endpoint.html }
      - { block: orgData, service: "Systems of record via VPC Lattice", build: true, note: "Each connector is a VPC Lattice service shared to the app accounts approved for it.", url: https://docs.aws.amazon.com/vpc-lattice/latest/ug/auth-policies.html }
