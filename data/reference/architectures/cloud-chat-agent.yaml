id: archChatAgent
surface: surfaceCloud
rank: 3
title: Chat agent with tools
abbrev: Chat agent

summary:
  - >
    A hosted conversational agent where a human is in the loop for every turn: chat is the core
    input, tools execute mid-conversation on the user's behalf, and consequential actions are
    proposed in the thread before they run. The human-present counterpart of the single agent
    workflow, and the shape most domain copilots take.

description:
  - >
    The defining property is that consequential actions must be proposed and approved in the
    thread before they execute. That is a target-state requirement, not a fact about
    tool-calling chat: real loops run many read-only tools mid-turn before anything renders,
    so the control set splits actions into two classes — automatic read-only tools, and
    mutating actions that wait for the human. In-thread approval is the primary gate for the
    second class, where the single agent workflow, acting with nobody present, has to lean on
    compensating transactions instead. The gate is only as good as the proposal text: an
    approval rendered as "OK to proceed?" approves nothing in particular.
  - >
    Authority is on-behalf-of. The tools act as the conversing user, on a grant scoped to the
    session, not as a workload identity with standing powers — the reachable set is what this
    user may touch, decided per call. Sessions end and the grant ends with them; an agent tier
    that accumulates authority across conversations has quietly become the single agent workflow
    without its controls.
  - >
    The conversation itself is the persistence surface. Context accumulates across turns —
    retrievals, tool results, uploaded files — and everything in it stands beside the system
    instruction on the next model call. One poisoned tool result steers every later action in
    the session, which is why memory is scoped to the conversation and why returned content is
    classified on the way back in.
  - >
    Every network model and tool call leaves through the AI gateway on brokered credentials,
    the same crossing every agent architecture in this catalogue draws — the in-process tool
    set is the drawn exception. The chat surface changes who is watching, not how the calls
    leave.

distinguishedBy:
  - >
    Against the durable multi-agent workflow: the horizon is one conversation, not a days-long
    process. No supervisor, no journal, no replay — the thread is the state, and the human in
    it is the gate that durability machinery replaces there.
  - >
    Against the single agent workflow: the same loop with the human kept in the turns.
    In-thread approval replaces the compensating transaction as the primary control; remove the
    human from the turns and you are in that architecture, and should be reading its page.
  - >
    Against the enterprise AI chat with connectors: the same conversational surface, bought
    rather than built. There the vendor operates the loop and the controls are tenant
    configuration and assurance; here the whole workload is ours, which is what makes every
    pin on this page enforceable.

exemplars:
  - name: Intercom Fin
    note: >
      A customer-facing support copilot resolving requests in the thread — lookups, drafts and
      executed remedies with the consequential steps confirmed in conversation.
    url: https://www.intercom.com/fin
    asOf: "2026-09"
  - name: Decagon
    note: >
      Enterprise support agents over ticketing and account systems, acting on systems of
      record with human confirmation woven into the thread.
    url: https://decagon.ai
    asOf: "2026-09"
  - name: Vercel AI SDK chatbot
    note: >
      The chat-framework starter shape — a hosted loop, a tool list and a streaming chat front
      end. Structurally this architecture from the first commit, whatever it grows into.
    url: https://ai-sdk.dev
    asOf: "2026-09"

zones:
  - id: zoneUser
    owner: user
    note: The person in the conversation — present for every turn, and the approval gate for the actions that matter.
  - id: zoneCloud
    owner: cloud
    note: >
      Everything we operate: the chat surface that establishes identity, the loop, its state,
      the crossing every call leaves through, and our own tool servers and systems of record.
      The whole workload is ours, which is what distinguishes this from the endpoint agents.
  - id: zoneExternal
    owner: external
    note: >
      Outside the company: the model provider, third-party tool servers and peer agents, and
      the services an approved action lands on.
  - id: zoneGovernance
    owner: governance
    note: >
      Drawn across every band because it governs every band. The in-thread approval is a
      control the user operates; this band is the set the operator does.

blocks:
  - id: user
    kind: actor
    title: End user
    icon: person
    zone: zoneUser
    col: 0
    row: 1
    note: >
      Present for every turn, and the approval gate for the actions that matter. Also the
      author of untrusted input — the conversation is model input written by the party the
      actions will benefit.

  - id: events
    kind: service
    title: Triggers & schedules
    cosaiComponent: componentAgentUserQuery
    zone: zoneCloud
    col: 2
    row: 0
    note: >
      Chat agents run unattended too now — scheduled digests, triggered follow-ups, jobs a
      conversation set up and walked away from. Drawn because it quietly removes the control
      this whole architecture leans on: a run nobody started has no human in the thread to
      approve it, which makes it the single-agent workflow wearing a chat interface.
    items:
      - id: schedules
        label: Schedules & events
        icon: clock
        note: A timer or trigger the conversation configured, firing with the thread closed.

  - id: entry
    kind: service
    title: Application front end
    zone: zoneCloud
    col: 1
    row: 1
    cosaiComponent: componentApplication
    note: >
      The chat surface and its session machinery. The identity established here is the
      authority every tool call downstream acts on.
    items:
      - id: api
        label: App & API endpoint
        icon: globe
        note: The published chat surface — web, app or embedded widget.
      - id: authn
        label: Identity binding
        icon: shield
        note: Who is conversing, bound to the session before the loop runs — the identity the tools act as.
      - id: uploads
        label: File upload
        icon: doc
        note: >
          Documents dropped into the thread — content authored anywhere, entering the same
          context window as the user's words.

  - id: localTools
    kind: service
    title: Native tools
    cosaiComponent: componentTools
    zone: zoneCloud
    parent: agent
    col: 0
    row: 1
    note: >
      The tools compiled into the application itself, nested because the loop calling them is
      not a hop: decorated functions running in the loop's own process, under its identity,
      with its egress and its secrets, and the sandbox the loop's generated code runs in. This
      is the default way a tool gets attached, and the reason it is drawn: the in-process tool
      set is invisible to any gateway. What these tools reach is drawn — memory and retrieval
      through their handlers, and the package mirror through the sandbox's package manager.
    items:
      - id: inProcess
        label: Tool handlers
        icon: code
        note: >
          Functions in the application, holding whatever the application holds — including the
          outbound calls it makes itself, with no broker in front, and the retrieval and state
          reads the loop treats as context.
      - id: sandboxedTools
        label: Sandboxed tools
        icon: shield
        note: >
          Code execution in an isolated runtime inside the harness's own tool surface — the
          loop writes code, only the sandbox runs it, and what it installs comes from the
          mirror and nowhere else. Bash is where the package manager lives.

  - id: agent
    kind: service
    title: Agent harness
    zone: zoneCloud
    col: 2
    row: 1
    cosaiComponent: componentReasoningCore
    note: >
      Plans within a turn, proposes actions in the thread, and carries the conversation's
      accumulated context into every model call. Runs under its own workload identity but acts
      on the user's grant.
    items:
      - id: loop
        label: Agent loop
        icon: agent
        note: Reads the turn and the history, calls the model, proposes the next reply or action.
      - id: context
        label: Context assembly
        icon: doc
        note: >
          Merges the turn, the conversation memory and the tool results into one prompt.
          Everything merged stands beside the system instruction.

      - id: mcpClient
        label: MCP client
        icon: plug
        note: >
          The harness's own MCP client — the party that connects out, through the gateway's
          MCP brokerage, to remote servers.
  - id: memory
    kind: service
    title: Memory & state
    zone: zoneCloud
    col: 2
    row: 2
    cosaiComponent: componentDataStorage
    note: >
      The conversation's accumulated context and the retrieval index behind it. Scoped to the
      session and the user — cross-conversation memory would let one user's text steer
      another's actions.
    items:
      - id: conversation
        label: Conversation state
        icon: folder
        cosaiComponent: componentMemory
        note: Every turn, retrieval and tool result so far — read back on each call as context.
      - id: index
        label: Vector index
        icon: search
        cosaiComponent: componentRAGContent
        note: Grounding content retrieved into the thread, with the permissions of the asking user.

  - id: gateway
    kind: service
    title: AI gateway
    zone: zoneCloud
    col: 3
    row: 2
    note: >
      The one crossing every network-brokered model and tool call leaves through — the
      in-process tool set is the drawn exception. The agent tier holds no standing
      credentials; the gateway brokers them per call, meters spend and writes the audit trail
      as a tap on the crossing. Its items are the traffic classes it brokers — the checks it
      runs are the numbered pins on this block and its edges, and the call-outs beneath.
    pack: aiGatewayTraffic

  - id: provider
    kind: provider
    title: Model provider
    zone: zoneExternal
    col: 4
    row: 1
    cosaiComponent: componentModelServing
    note: The published inference interface. What runs behind it is the provider's and is not drawn.
    items:
      - id: inference
        label: Inference API
        icon: model
        note: Returns the reply and the proposed tool calls — content the thread renders and the human reads.

  - id: internalTools
    kind: service
    title: Tool services
    zone: zoneCloud
    col: 3
    row: 3
    cosaiComponent: componentTools
    pack: toolServicesRemote
    note: >
      Our own tool servers and service APIs — the same component as the external surface, at a
      different band. Every call carries the conversing user's grant rather than the service's
      own authority, which is what makes the identity established at the front end load-bearing
      all the way down here.

  - id: orgData
    kind: external
    title: Enterprise data
    zone: zoneCloud
    col: 3
    row: 4
    cosaiComponent: componentDataSources
    note: >
      The systems of record a conversation actually changes, and the grounding content it reads
      back. Reached through our own tool surface rather than straight from the gateway, so the
      scoping and the record happen somewhere.
    items:
      - id: records
        label: Org data
        icon: db
        note: The systems of record the approved actions land on.
      - id: fileStorage
        label: File storage
        icon: folder
        note: Documents retrieved into the thread as grounding — written by many hands, read back as context.

  - id: extTools
    kind: service
    title: Tool services
    zone: zoneExternal
    col: 4
    row: 3
    cosaiComponent: componentTools
    pack: toolServicesRemote
    items:
      - id: peers
        label: A2A peer agents
        icon: agent
        note: Cross-org delegation over the A2A protocol. A peer's output enters the thread as input.
    note: >
      Third-party servers, connectors and peer agents, out where nobody we contracted with
      operates them. Admitted by assessment at the crossing, or refused there.

  - id: downstream
    kind: external
    title: Downstream services
    cosaiComponent: componentDataSources
    zone: zoneExternal
    col: 4
    row: 4
    pack: downstreamPublic
    note: >
      What the external tool surface reaches — where an approved action becomes a real one
      outside the company, and where the content that returns was authored by somebody else.

  - id: sources
    kind: external
    title: Public package sources
    zone: zoneExternal
    col: 4
    row: 0
    note: >
      Where the mirror gets what it serves: the public package registries and the skill and
      extension hubs it proxies and admits from. Nothing here is ours, which is why admission
      happens at the mirror and not at the tool that asked.
    items:
      - id: registries
        label: Package registries
        icon: db
        note: PyPI, npm and their kind — mirrored, never reached by a tool directly in the target state.
      - id: hubs
        label: Skill & extension hubs
        icon: gear
        note: Community catalogues of skills, extensions and images, admitted through the same door.

  - id: govIdentity
    kind: governance
    title: Identity services
    icon: person
    zone: zoneGovernance
    col: 0
    row: 5
    capabilities: [capabilityIga, capabilityNhiManagement]
    note: >
      The user's identity and the agent's workload identity, issued and kept distinct. In this
      archetype the two are deliberately not the same thing: the loop runs as itself and acts
      on the user's grant.

  - id: govSecrets
    kind: governance
    title: Secrets & key management
    icon: key
    zone: zoneGovernance
    col: 1
    row: 5
    capabilities: [capabilitySecretsManagement, capabilityCredentialIsolation]
    note: Short-lived, user-scoped credentials minted per call, so the agent tier holds no standing keys.

  - id: govPolicy
    kind: governance
    title: Policy & authorization
    icon: scale
    zone: zoneGovernance
    col: 2
    row: 5
    capabilities: [capabilityToolPermissionScoping, capabilityEgressControl, capabilityRateLimiting, capabilityHitlControls]
    note: >
      What the conversation may reach and what it may spend, decided outside the loop that
      would otherwise be arguing for itself.

  - id: govSupplyChain
    kind: governance
    title: Supply-chain assurance
    icon: db
    zone: zoneGovernance
    col: 4
    row: 5
    capabilities: [capabilityAgentRegistry, capabilityModelEvals, capabilityMcpToolSecurity, capabilityAiBom]
    note: >
      Which tools may be offered to a conversation at all — admission, not discovery — and the
      behavioural checks in front of every model, prompt or tool change.

  - id: govObservability
    kind: governance
    title: Observability & response
    icon: eye
    zone: zoneGovernance
    col: 5
    row: 5
    capabilities: [capabilityAuditLogging, capabilityKillSwitch]
    note: >
      Append-only and off the agent's write path, because the thread is not the audit trail —
      plus the stop that ends the sessions and revokes the identity without a deploy.

  - id: registry
    kind: external
    title: Private pkg registry
    cosaiComponent: componentDataSources
    zone: zoneCloud
    col: 3
    row: 0
    note: >
      The organisation's package registry: public packages mirrored and admitted, and the
      organisation's own builds published by its CI pipelines. It serves whatever the sandbox
      installs — a dependency the agent's generated code needs, a tool package a step pulls
      in — pinned by digest. Pulling and publishing are separate grants: agents pull, build
      pipelines publish, and the registry's own proxying of upstream sources is bounded to
      what admission allows.
    items:
      - id: hub
        label: Approved packages
        icon: db

edges:
  - from: user
    to: entry
    path: primary
    bidir: true
    label: conversation
    note: >
      Turn in, reply back — and the in-thread approval prompt when an action is consequential.
      Read-only tools run mid-turn without ceremony; mutating actions wait for the human.
  - from: events
    to: agent
    route: vh
    path: primary
    label: scheduled run
    note: >
      The same loop, with nobody reading the reply. Every control on this page that assumes an
      in-thread approval is absent on this path.
  - from: entry
    to: agent
    label: turn / reply & proposal
    path: primary
    bidir: true
    note: >
      The turn arrives with the user's identity attached; the reply and any action proposal
      return on the same path.
  - from: localTools
    to: memory
    label: read & write / context
    path: primary
    bidir: true
    note: >
      The conversation so far reads back as context on every call through the state and
      retrieval handlers, and each turn's results are written forward by them — the persistence
      that lets one turn's injection reach the next.
  - from: agent
    to: gateway
    path: primary
    bidir: true
    label: inference, MCP & skills
    note: >
      Every network call out of the loop crosses here on a brokered credential scoped to the
      conversing user. The agent holds no standing keys of its own.
  - from: localTools
    to: registry
    path: primary
    bidir: true
    label: pinned installs
    note: >
      What the harness's sandbox installs — a package manager running as a shell command —
      is pulled straight from the mirror, pinned by digest, never from a public registry. The
      gateway is the other doorway into the harness, for inference, MCP, skills and APIs; it
      is not on this path.
  - from: gateway
    to: provider
    label: inference / completion
    route: vh
    path: external
    bidir: true
    note: >
      Inference on the brokered credential. The completion proposes the reply and the tool
      calls — content the human will read, and unauthenticated input all the same.
  - from: gateway
    to: internalTools
    path: primary
    bidir: true
    label: internal tool calls
    note: >
      Approved actions leave with the user's narrowed grant; tool results return into the
      thread as context.
  - from: internalTools
    to: orgData
    path: primary
    bidir: true
    label: scoped reads & writes
    note: >
      Where an approved action becomes a real one on a system of record — and where the
      grounding content a later turn will treat as instruction is read from.
  - from: gateway
    to: extTools
    path: external
    bidir: true
    label: brokered external calls
    note: >
      Third-party servers and peer agents, reached only through the crossing that admitted
      them. A peer's output enters the thread as input.
  - from: extTools
    to: downstream
    label: action / returned content
    path: external
    bidir: true
    note: >
      Actions land on real systems outside the company; whatever comes back — records, pages,
      API responses — is untrusted content entering the conversation.

  - from: sources
    to: registry
    path: external
    label: mirrored & admitted
    note: >
      The mirror's own supply chain: public packages proxied in, scanned, pinned and admitted
      before anything inside can pull them. Build pipelines publish the organisation's own
      artifacts beside them.
pins:
  risks:
    - risk: riskPromptInjection
      at: user->entry
      note: >
        The conversation is model input authored by the party the actions benefit, and it
        reaches the same context window as the system instruction — and uploaded documents,
        authored by anyone, arrive on the same edge.
    - risk: riskPromptInjection
      at: gateway->extTools
      note: >
        Records, pages and API responses return into the thread — content somebody else
        authored, standing beside the user's words on the next call.
    - risk: riskPromptInjection
      at: memory
      note: >
        Conversation memory carries a poisoned turn forward: one bad retrieval steers every
        later action in the session — memory poisoning by its OWASP name, pinned as prompt
        injection per the recorded deviation.
    - risk: riskRetrievalVectorStorePoisoning
      at: memory
      note: >
        The vector index grounds the thread; content planted in the indexed sources returns
        as trusted context with the asking user's permissions.
    - risk: riskInsecureModelOutput
      at: gateway->provider
      note: The completion proposes the tool calls, and it is unauthenticated content.
    - risk: riskRogueActions
      at: internalTools->orgData
      note: >
        An action the human approved without reading is not an overseen action. Approval
        fatigue is this architecture's version of no gate at all.
    - risk: riskRogueActions
      at: events->agent
      note: >
        A scheduled run is a consequential action with the approval gate structurally absent —
        the control this whole page leans on does not exist on this path.
    - risk: riskRunawayAgentToolLoops
      at: agent
      note: >
        An agentic turn runs many tool calls before anything renders, and the scheduled path
        runs with nobody watching — rate limits at the entry never see a mid-turn loop.
    - risk: riskToolRegistryTampering
      at: gateway->internalTools
      note: The admission list is the tool supply chain; whoever writes it programs the agent.
    - risk: riskPromptInjection
      at: internalTools->orgData
      note: >
        Grounding content read back from records and files was written by many hands — the
        scenario beside this drawing walks exactly this path.
    - risk: riskInsecureIntegratedComponent
      at: localTools
      note: >
        Handlers compiled into the loop's process hold whatever the process holds and cross no
        chokepoint — a vulnerable or malicious in-process tool is invisible to every drawn
        control.
    - risk: riskAgenticDelegationConfusedDeputy
      at: agent
      note: >
        The agent acts for the user with the service's reach. Keeping every tool call on the
        user's grant, not the workload's, is what closes the gap.
    - risk: riskSensitiveDataDisclosure
      at: localTools->memory
      note: >
        The session accumulates everything retrieved on earlier turns; a late question can
        surface records the current topic never needed.
    - risk: riskEconomicDenialOfWallet
      at: entry
      note: Per-token inference behind a public chat surface makes unbounded conversation a spend problem.

    - risk: riskToolSourceProvenance
      at: registry
      note: >
        What the sandbox installs is code the agent chose, on a name it read in a task or a tool
        result; the mirror decides which build answers to that name, and whoever can write to
        the mirror programs every sandbox that pulls from it.
  capabilities:
    - capability: capabilityAgentRegistry
      at: govSupplyChain
      note: >
        Tools exist in a conversation only because the registry admitted them — admission, not
        discovery. Admission is a change-time decision made here; the gateway enforces the
        resulting list per call.
    - capability: capabilityModelEvals
      at: govSupplyChain
      note: >
        Behavioural checks in front of every model, prompt or tool change, because the thing
        being changed is what decides the next action the human is asked to approve.
    - capability: capabilityHitlControls
      at: user->entry
      note: >
        In-thread approval before consequential actions, with the proposal specific enough to
        be worth reading — the architecture's primary control.
    - capability: capabilityIga
      at: user->entry
      note: A delegated grant scoped to the session and the user, not a standing power the service holds.
    - capability: capabilityToolPermissionScoping
      at: gateway->internalTools
      note: Every tool call bounded by what the conversing user may touch, decided per call.
    - capability: capabilityNhiManagement
      at: agent
      note: A distinct workload identity for the agent tier, kept separate from the user grants it carries.
    - capability: capabilitySecretsManagement
      at: agent->gateway
      note: Brokered, per-call, user-scoped credentials; the loop holds no standing keys.
    - capability: capabilityMemoryProtection
      at: memory
      note: Conversation-scoped memory with hard boundaries — no cross-session reads, ever.
    - capability: capabilityDataAccessGovernance
      at: internalTools->orgData
      note: >
        Retrieval scoped to the user's own grant, not the service's reach — what a read may
        return is decided at the store, per session.
    - capability: capabilityRagSecurity
      at: memory
      note: >
        Grounding retrieved with the asking user's permissions, not the service's — otherwise
        the index becomes a way to read what the conversation's owner cannot.
    - capability: capabilityPromptInjectionDefense
      at: gateway->extTools
      note: >
        Returned external content is classified at the crossing before it re-enters the thread
        as context.
    - capability: capabilityPromptInjectionDefense
      at: gateway
      note: >
        The user's turns, uploaded documents and returned record content are classified on the
        crossing before the model reads them — classification here, permission containment at
        the tool scoping pin.
    - capability: capabilityGroundednessChecking
      at: entry->user
      note: >
        The reply drives a human approval, so its claims are checked against the sources it
        cites — distinct from authorization: this verifies what the human is told, not what
        the agent may do.
    - capability: capabilityOutputEncoding
      at: entry->user
      note: >
        The thread renders model output — sanitise markup and links before display, because a
        rendered image URL can carry the conversation to an attacker without a single click.
    - capability: capabilityAiDlp
      at: localTools->memory
      note: Redaction on what a session may accumulate, because the thread outlives the turn that needed it.
    - capability: capabilityRateLimiting
      at: entry
      note: Session and per-user ceilings at the edge, before token spend and action volume are committed.
    - capability: capabilityAuditLogging
      at: govObservability
      note: Every proposal, approval and action recorded off the agent's write path — the thread is not the audit trail.
    - capability: capabilityKillSwitch
      at: govObservability
      note: A stop that ends live sessions and revokes the agent's identity without a deploy.

    - capability: capabilityAgentRuntimeEnforcement
      at: gateway->internalTools
      note: >
        Mutating actions are refused unless the call carries an approval bound to this action,
        its arguments and this session; read-only actions pass on the user's grant. This is the
        decision the in-thread approval exists to feed.
    - capability: capabilityRateLimiting
      at: gateway
      note: >
        Per-turn tool-call and token ceilings on the crossing — the brake a mid-turn loop
        actually meets, which the session ceiling at the entry never sees.
    - capability: capabilityCredentialIsolation
      at: gateway->internalTools
      note: >
        User grant, agent workload identity and session scope intersect on every call; the
        gateway exchanges the user's token for a narrowed one and never forwards it.
    - capability: capabilityMcpToolSecurity
      at: govSupplyChain
      note: >
        Admission is change-time; the rug-pull is a tool whose definition changes after
        admission. Content-hash pinning of admitted tool descriptions is what catches it.
    - capability: capabilityAiBom
      at: registry
      note: >
        Digest and signature verification at admission to the mirror, and an inventory of which
        packages a sandbox may pull — the registered embodiment of artifact scanning.
    - capability: capabilityDataAccessGovernance
      at: registry
      note: >
        Who may publish and who may pull, as separate grants: build pipelines publish admitted
        artifacts, agents pull pinned ones, and the registry's proxying of upstream sources is
        bounded to admitted origins so it is not an unintended route to the internet.
    - capability: capabilityEgressControl
      at: localTools
      note: >
        The sandbox's network policy: the only routes out are the AI gateway and the package
        mirror. Shell commands, fetches and anything else a tool emits are bounded here — not at
        the gateway, which brokers model, MCP and API calls and sees nothing else.
    - capability: capabilityToolPermissionScoping
      at: gateway->extTools
      note: >
        The gateway's own allowlist: which external MCP servers, APIs and peer agents are
        registered, and which tools each key may call on them. Configuration of a broker, not a
        network control.
    - capability: capabilityModelScanning
      at: sources->registry
      note: >
        Admission scanning at the mirror: digest and signature verification, malware and
        typosquat checks on everything proxied in from a public source, before anything inside can
        pull it. The registered embodiment of artifact scanning, on the one edge where it applies.

walkthrough:
  title: A turn that ends in an action
  moves: >-
    A question, a reply, and the approved action the conversation decided on.
  steps:
    - follow: user->entry
      label: consequential request
      note: The user asks for something consequential, in their own words.
    - follow: entry->agent
      label: turn with identity
      note: The turn enters the loop with the user's identity attached.
    - follow: localTools->memory
      label: conversation state read
      note: The conversation so far is requested.
    - follow: memory->localTools
      label: context loads
      note: And loads as context.
    - follow: agent->gateway
      label: context, user-scoped
      note: The context leaves the loop on a brokered, user-scoped credential.
    - follow: gateway->provider
      label: inference
      note: The model proposes a reply and a tool call.
    - follow: provider->gateway
      label: reply & tool proposal
      note: The completion comes back across the crossing.
    - follow: gateway->agent
      label: pending proposal
      note: And into the loop — unauthenticated content, now a pending proposal.
    - follow: agent->entry
      label: proposal to render
      note: The proposal travels to the surface to be rendered, nothing yet executed.
    - follow: entry->user
      label: proposal in thread
      note: >
        It renders in the thread — specific enough to be worth reading: the action, the
        target, the amount, the expiry.
    - follow: user->entry
      label: approval (bound)
      note: >
        The user approves. The approval is bound to that exact action and its arguments — an
        "OK" with nothing attached approves nothing in particular.
    - follow: entry->agent
      label: confirmation validated
      note: The confirmation is validated against the pending proposal before anything executes.
    - follow: agent->gateway
      label: approved action
      note: Only now does the approved action leave the loop.
    - follow: gateway->internalTools
      label: user's narrowed grant
      note: It crosses with the user's narrowed grant, not the service's.
    - follow: internalTools->orgData
      label: action on record
      note: The action lands on the system of record, attributable to the session that approved it.
    - follow: orgData->internalTools
      label: record confirmed
      note: The record confirms the change.
    - follow: internalTools->gateway
      label: result
      note: The result crosses back through the same door.
    - follow: gateway->agent
      label: outcome
      note: The outcome lands in the loop.
    - follow: agent->entry
      label: reply to render
      note: And heads for the surface.
    - follow: entry->user
      label: rendered, attributable
      note: It renders in the thread, attributable to the approval that allowed it.

scenarios:
  - title: A tool result steers the next turn
    steps:
      - follow: agent->gateway
        label: routine lookup
        note: A routine lookup runs mid-conversation.
      - follow: gateway->internalTools
        label: admitted on user's grant
        note: Admitted against the catalogue on the user's grant.
      - follow: internalTools->orgData
        label: fetch record
        note: The fetch reaches a record somebody else authored.
      - follow: orgData->internalTools
        label: embedded instruction
        note: An embedded instruction returns with the content.
      - follow: internalTools->gateway
        label: poisoned tool result
        note: The poisoned content crosses back through the gateway like any tool result.
      - follow: gateway->agent
        label: re-enters as context
        note: And re-enters the loop as context.
      - follow: localTools->memory
        label: persists to state
        note: It persists into conversation state like any other result.
      - follow: memory->localTools
        label: read back each turn
        note: Every later turn this session reads it back.
      - follow: agent->gateway
        label: carried in next call
        note: And carries it out with the next call.
      - follow: gateway->provider
        label: inference beside instruction
        note: The model reads it beside the system instruction — the approval gate is now the control.
  - title: A scheduled run fires with the thread closed
    steps:
      - follow: events->agent
        label: scheduled job wakes
        note: >
          The job a conversation configured wakes with nobody reading the reply — the approval
          gate this whole page leans on is structurally absent.
      - follow: agent->gateway
        label: unattended context
        note: The run crosses on the same brokered credential an attended turn would.
      - follow: gateway->provider
        label: inference, unread
        note: The model proposes actions no one will read before they run.
      - follow: provider->gateway
        label: proposal, unread
        note: The proposal comes back with nobody reading it.
      - follow: gateway->internalTools
        label: bounded by catalogue
        note: What executes is bounded by the catalogue and the scoped grant alone.
      - follow: internalTools->orgData
        label: unattended write
        note: >
          The write lands unattended. The single agent workflow's controls — catalogue,
          threshold, compensating transaction — are what must hold here, and its page is the
          one to read.
  - title: The session outlives the topic
    steps:
      - follow: user->entry
        label: late question
        note: An innocuous late question, many turns into the conversation.
      - follow: entry->agent
        label: turn enters
        note: It enters the loop like any other turn.
      - follow: localTools->memory
        label: thread requested
        note: Context assembly asks for the thread.
      - follow: memory->localTools
        label: everything retrieved
        note: Everything earlier turns retrieved comes back with it.
      - follow: agent->gateway
        label: records travel along
        note: Records the current question never needed travel with it.
      - follow: gateway->provider
        label: inference over all of it
        note: The model reads all of it.
      - follow: provider->gateway
        label: reply
        note: The reply can draw on any of it.
      - follow: gateway->agent
        label: into the loop
        note: Back into the loop.
      - follow: agent->entry
        label: toward surface
        note: And toward the surface.
      - follow: entry->user
        label: reply may surface any of it
        note: The reply can surface any of it — session-scoped memory and DLP on accumulation are what bound the answer.

  - title: An approved action lands outside the company
    steps:
      - follow: agent->gateway
        label: approved external action
        note: An approved action targets a third-party service or a peer agent nobody we contracted with operates.
      - follow: gateway->extTools
        label: brokered grant, allowlist
        note: It leaves on a grant brokered rather than held by the agent, against the egress allowlist.
      - follow: extTools->downstream
        label: effect lands
        note: And the effect lands.
      - follow: downstream->extTools
        label: somebody else's content
        note: What returns was authored by somebody else.
      - follow: extTools->gateway
        label: classified at crossing
        note: It is classified at the crossing before it re-enters the thread —
      - follow: gateway->agent
        label: re-enters thread
        note: which is how one poisoned result would otherwise steer every later turn in the session.

  - title: A dependency arrives with the task
    steps:
      - follow: localTools->registry
        label: package install (pinned)
        note: >
          A sandboxed step needs a package its generated code imports; the package manager
          runs as a shell command inside the harness's own tool surface and pulls from the
          mirror — the one destination the sandbox's network policy allows.
      - follow: registry->localTools
        label: admitted build
        note: >
          The admitted build comes back, pinned by digest — the hop a poisoned package actually
          arrives on, which is why admission and pinning are the controls that live here.

deviations:
  - subject: The gateway's Skills catalogue item has no drawn supply path
    reason: >
      The aiGatewayTraffic pack is byte-identical across the catalogue, and this drawing keeps
      it whole because the tier brokers skills traffic in deployments that use skills. The
      supply chain behind the item — a private package registry and its signing pipeline — is
      deliberately outside this runtime drawing's scope; the endpoint personal agent draws the
      pull path.
  - subject: Memory poisoning is pinned as prompt injection
    reason: >
      OWASP's agentic taxonomy names memory poisoning as a distinct threat; CoSAI's risk set
      has no equivalent, so the conversation-state risk is pinned as prompt injection — the
      nearest true statement, recorded rather than papered over, matching the multi-agent
      sibling.
  - subject: The application front end absorbs the service edge
    reason: >
      Rate limiting and abuse controls for the public chat surface are drawn as the chip on
      the entry block rather than a separate Service edge — the front end absorbs the duty in
      this simple deployment shape, and a high-traffic deployment fronting the same surface
      with a dedicated edge tier should read the remote MCP server's drawing for that block.

