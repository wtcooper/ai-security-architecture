id: mckinsey-lilli
title: "McKinsey's Lilli: an autonomous agent finds open endpoints and writable system prompts"
subtitle: >
  A red-team startup's autonomous agent found 22 unauthenticated API endpoints on McKinsey's
  internal AI platform, turned one into a SQL injection, and reached the database that held the
  chat history and all 95 system prompts, in about two hours.
date: 2026-03
dateRange: Late February – 9 March 2026
category: exposed
perspective: target
# Lilli is McKinsey's own platform, built and run by the firm: the chat agent you build, where
# the front end, the store behind it and the system prompts are all the operator's. Not the
# enterprise AI chat drawing, which is a product an organisation buys from a vendor.
archetype: archChatAgent
caveat: >
  The access figures are CodeWall's own; McKinsey's forensic review found no evidence that client
  data was accessed.
breaks:
  - control: D3-APA
    how: "No endpoint of the front end answers until a signed-in user is bound to the request: 22 did, and their documentation was public."
  - control: AML.M0031
    how: "Conversation state kept apart per user and session, so one query cannot reach 46.5 million messages."
  - control: cap-sensitive-data-redaction
    how: "Chat history kept in plaintext is the prize; redact or minimise it before it is stored."
  - control: cap-staged-rollout-gate
    how: "System prompts are instructions changed through a tested release, not rows any API call can rewrite."
summary:
  - >
    Lilli is McKinsey's internal generative AI platform, used by about 72% of its staff and
    handling more than 500,000 prompts a month. CodeWall's security agent chose it as a target
    itself, citing McKinsey's public responsible-disclosure policy, and went in with no
    credentials and no human in the loop.
  - >
    The flaws were not AI flaws. Public API documentation listed 22 endpoints that asked for no
    authentication; one wrote user search queries and concatenated JSON keys into SQL. The AI
    part is what sat behind them: CodeWall claims 46.5 million plaintext chat messages, 728,000
    files, 57,000 accounts, and write access to the 95 system prompts that shape every answer
    Lilli gives.
  - >
    CodeWall disclosed on 1 March; McKinsey closed the endpoints, took the development
    environment offline and pulled the public documentation by 2 March. Its forensic review
    found no evidence that client data was accessed by CodeWall or anyone else, and an analyst
    called the chain "plausible" but the claimed impact "not fully evidenced".
risks:
  - riskInsecureIntegratedComponent
  - riskSensitiveDataDisclosure
  - riskInsecureModelOutput
steps:
  - n: 1
    title: The agent picks its own target
    phase: introduced
    narrative: >
      CodeWall's agent suggested McKinsey, citing its public responsible-disclosure policy and
      recent updates to Lilli. It had no credentials and no insider knowledge; CodeWall calls the
      run "fully autonomous from researching the target, analysing, attacking, and reporting".
    path: [user]
    sources:
      - title: "AI vs AI: Agent hacked McKinsey's chatbot and gained full read-write access in just two hours"
        url: https://www.theregister.com/2026/03/09/mckinsey_ai_chatbot_hacked
        publisher: The Register
        date: 2026-03-09
  - n: 2
    title: Twenty-two endpoints that never asked who was calling
    phase: exposed
    narrative: >
      Publicly exposed API documentation listed more than 200 endpoints. Twenty-two of them
      required no authentication at all, and the agent could call them straight from the
      internet.
    path: [user->entry, entry]
    risks:
      - riskInsecureIntegratedComponent
    sources:
      - title: "Autonomous agent hacked McKinsey's AI in 2 hours"
        url: https://www.govinfosecurity.com/autonomous-agent-hacked-mckinseys-ai-in-2-hours-a-31007
        publisher: GovInfoSecurity
        date: 2026-03-13
  - n: 3
    title: JSON keys concatenated into SQL
    phase: exposed
    narrative: >
      One open endpoint wrote user search queries. Its JSON keys were concatenated into SQL and
      reflected verbatim in database error messages, which, as the agent iterated, began
      returning live production data. CodeWall says it had full read and write access within two
      hours: 46.5 million chat messages in plaintext, 728,000 files and 57,000 accounts.
    path: [user->entry, entry, memory]
    risks:
      - riskInsecureIntegratedComponent
      - riskSensitiveDataDisclosure
    sources:
      - title: "AI vs AI: Agent hacked McKinsey's chatbot and gained full read-write access in just two hours"
        url: https://www.theregister.com/2026/03/09/mckinsey_ai_chatbot_hacked
        publisher: The Register
        date: 2026-03-09
  - n: 4
    title: The system prompts were in the same database
    phase: exposed
    narrative: >
      Lilli's 95 system prompts lived alongside the data, and all were writable. An attacker
      could have rewritten the answers, guardrails and cited sources that tens of thousands of
      consultants rely on: "no code change, just a single UPDATE statement wrapped in a single
      HTTP call".
    path: [memory, memory->localTools, agent->entry, entry->user]
    risks:
      - riskInsecureModelOutput
    sources:
      - title: "AI vs AI: Agent hacked McKinsey's chatbot and gained full read-write access in just two hours"
        url: https://www.theregister.com/2026/03/09/mckinsey_ai_chatbot_hacked
        publisher: The Register
        date: 2026-03-09
  - n: 5
    title: Where this chain breaks
    phase: mitigated
    narrative: >
      Every endpoint of the front end binds a signed-in user before it answers, and its
      documentation is not published to the internet. Keep each user's conversations apart in
      the store, and do not keep the history in plaintext. The system prompts are instructions
      that change behaviour for every user: keep them out of the application database, and
      change them only through a tested release.
    path: [user->entry, entry, memory, localTools->memory, govIdentity, govSupplyChain]
    sources:
      - title: "Autonomous agent hacked McKinsey's AI in 2 hours"
        url: https://www.govinfosecurity.com/autonomous-agent-hacked-mckinseys-ai-in-2-hours-a-31007
        publisher: GovInfoSecurity
        date: 2026-03-13
alsoSeen:
  - title: "Meta's AI support tool hands 20,225 Instagram accounts to the wrong people"
    date: June 2026
    note: >
      Another assistant a company built and ran itself, failing an ordinary check rather than
      being tricked: Meta's AI-powered High Touch Support tool sent password-reset links to email
      addresses that did not belong to the account, and attackers took over accounts without
      two-factor authentication. Meta disabled the tool and invalidated the links.
    sources:
      - title: "Meta Says 20,000 Instagram Accounts Hacked via AI Tool Abuse"
        url: https://www.securityweek.com/meta-says-20000-instagram-accounts-hacked-via-ai-tool-abuse/
        publisher: SecurityWeek
        date: 2026-06-08
      - title: "Meta AI support data breach affects 20,000 Instagram accounts"
        url: https://www.bleepingcomputer.com/news/security/meta-ai-support-data-breach-affects-20-000-instagram-accounts/
        publisher: BleepingComputer
        date: 2026-06-08
  - title: "Unauthenticated Chroma vector databases ransomed, with notes planted for RAG to retrieve"
    date: October 2026
    note: >
      The store behind a self-built assistant, open to anyone again: across six Chroma databases
      left without authentication, documents were encrypted, collections emptied and 20
      identical ransom notes written into a `production_rag_data` collection so that retrieval
      would show them to users. It rests on one researcher's report, UpGuard's, which names no
      victims and allows that the JADEPUFFER branding may be a copycat's.
    sources:
      - title: "Poisoned Vector: JADEPUFFER and Using Unauthenticated Chroma Databases for Retrieval Extortion"
        url: https://www.upguard.com/breaches/poisoned-vector-jadepuffer-using-unauthenticated-chroma-databases-for-retrieval-extortion
        publisher: UpGuard
        date: 2026-10-13
