      - { block: entry, service: App Service behind Application Gateway with WAF }
      - { block: authServer, service: Microsoft Entra ID (agent and app registrations), note: "Mints our agent's tokens for peers and validates peers' tokens for our agent; the partner peer runs its own." }
      - { block: harness, service: Your agent on Azure Container Apps, builtWith: Microsoft Agent Framework, note: "A2A client and server through Agent Framework's A2A hosting; Foundry Agent Service is the managed alternative." }
      - { block: localTools, service: Your function tools in the agent, builtWith: Microsoft Agent Framework }
      - { block: memory, service: "Azure Cosmos DB and Foundry IQ (formerly Azure AI Search)", note: "Microsoft's documentation now calls Azure AI Search Foundry IQ; its role here is unchanged." }
      - { block: gateway, service: Azure API Management (A2A agent APIs) }
      - { block: internalTools, service: "Your MCP servers and APIs, exposed through API Management", build: true }
      - { block: orgData, service: Your systems of record, build: true }
      - { block: peerVendor, service: Vendor platform A2A agent, note: "Under agreement, federated to our Entra tenant as an enterprise application." }
      - { block: provider, service: Azure OpenAI in Foundry Models }
