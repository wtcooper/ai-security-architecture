        steps:
          - title: Keep the idle timeout short
            body:
              - >-
                Set session_configuration.idle_timeout_seconds no higher than the work needs (120 to 14,400
                seconds); compute is released when it elapses.
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/manage-hosted-sessions
          - title: Set a budget that blocks
            body:
              - >-
                Under Manage > Cost > Cost Control create a cost control with a Tokens or Spending budget, a budget
                per Agent or per Session, a Send alert threshold at 80% and Block usage at 100%.
            url: https://learn.microsoft.com/en-us/azure/foundry/how-to/create-cost-controls
          - title: Know the service limits
            body:
              - >-
                Plan against the fixed limits (128 tools per agent, 100,000 messages per thread) and the concurrent
                hosted-session quota; rate limiting for model calls is set on the model deployment.
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/limits-quotas-regions
        note: >-
          Partial on the resource-consumption rule: what is generally available bounds idle compute, sandbox size,
          concurrent sessions and model request rate (as on toolVertexAgentEngine). The only documented per-response
          ceilings are the caller-supplied max_tool_calls and max_output_tokens request parameters (not allowed
          on Copilot harness agents); no agent-level or tenant-level turn, iteration or wall-clock ceiling is
          documented. A per-agent and per-session budget that blocks does
          exist, which is the test toolClaudeManagedAgents passes, but cost controls are preview: the running total
          is not reconciled with the bill, the request that crosses the threshold still completes, changes take up
          to 15 minutes, blocking refuses new requests with 429 and does not stop one in flight, and the
          deployment filter lists only GPT model deployments. Token limits by Azure API Management apply only to
          model traffic routed through it and are no longer edited in Foundry.
        verified: "2026-11-18"
      # >>> cloud controls (added when the service moved to the hosted pattern)
      - mitigation: D3-AA
        coverage: partial
        mechanism: "Agent Service creates a Microsoft Entra agent identity and blueprint for every new agent, with no secret and no permissions, and tool connections can authenticate as it. The standard-setup stores and any connection set to project managed identity still use one identity that all agents in the project share."
        steps:
          - title: "Authenticate tool connections as the agent"
            body:
              - "Create each MCP or A2A connection with agent identity authentication and the audience of your gateway or API."
              - "Do not use project managed identity for a tool unless every agent in the project should have the same access."
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/mcp-authentication
          - title: "Grant roles to the agent identity only"
            body:
              - "Use the agent identity's object ID as the assignee, at resource or resource group scope."
              - "Role assignments do not transfer when a legacy agent is migrated to its own identity."
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/agent-identity
          - title: "Separate projects where state must be separate"
            body:
              - "All agents in a project share file storage, conversation storage and search indexes, reached as the project's managed identity."
              - "Use one project, or one Foundry resource, per trust group."
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/environment-setup
          - title: "Govern the identities in Microsoft Entra"
            body:
              - "Target agent identities or blueprints with Conditional Access and review agent sign-in logs."
              - "These features need Microsoft Agent 365 licences."
            url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/agent-id
        verified: "2026-11-18"
      - mitigation: D3-NI
        coverage: native
        mechanism: "Public network access set to Disabled with a private endpoint on the Foundry resource closes the inbound side; network injection into a subnet delegated to Microsoft.App/environments, or a managed virtual network, confines the outbound side. Both are set per Foundry resource, and injection only at creation."
        steps:
          - title: "Close the endpoint"
            body:
              - "On the Network tab select Disabled for public access and add a private endpoint to the account sub-resource."
              - "Link the three privatelink DNS zones to the virtual network."
            url: https://learn.microsoft.com/en-us/azure/foundry/how-to/configure-private-link
          - title: "Inject agent traffic into your subnet at creation"
            body:
              - "Select a dedicated subnet delegated to Microsoft.App/environments, /27 or larger, in the same region as the Foundry resource."
              - "It cannot be added, resized or changed afterwards."
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/virtual-networks
          - title: "Check each tool's path"
            body:
              - "MCP, OpenAPI, A2A and Azure Functions tools go through your subnet; Foundry IQ and file search use private endpoints."
              - "Web search, Bing and SharePoint grounding use public endpoints, and memory stores have no virtual network support."
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/toolbox-network-isolation
        verified: "2026-11-18"
      - mitigation: AML.M0012
        coverage: partial
        mechanism: "Customer-managed keys from Key Vault or Managed HSM on the Foundry resource cover state it stores itself. Prompt agent conversations, files and vectors are covered only in standard setup, with your key set separately on Azure Cosmos DB, Storage and Foundry IQ (Azure AI Search). A hosted agent's session volume is not covered."
        steps:
          - title: "Choose standard setup before the project exists"
            body:
              - "Name your Cosmos DB, Storage and Foundry IQ (Azure AI Search) resources in the capability settings."
              - "The settings cannot be updated on an existing project; changing stores means recreating it."
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/standard-agent-setup
          - title: "Set your key on the Foundry resource and on each store"
            body:
              - "Enable Customer-Managed Keys under Encryption on the Foundry resource, then configure the key on each store with that service's own procedure."
              - "Each connected resource follows its own key lifecycle."
            url: https://learn.microsoft.com/en-us/azure/foundry/concepts/encryption-keys-portal
          - title: "Record what the key does not cover"
            body:
              - "A hosted agent's $HOME volume is on platform storage, kept for 30 days and not encrypted with your key."
              - "Runtime compute, caches and temporary files are protected by Microsoft's platform encryption only."
            url: https://learn.microsoft.com/en-us/azure/foundry/concepts/customer-managed-keys
        verified: "2026-11-18"
      - mitigation: cap-data-access-governance
        coverage: partial
        mechanism: "With on-behalf-of-user access Agent Service passes the signed-in user's token to Foundry IQ in x-ms-query-source-authorization, so the knowledge base applies source permissions, and user delegation does the same for supported MCP servers. File search vector stores are shared across the project. Conversations get no per-user check unless a hosted agent call carries the end user's identity."
        steps:
          - title: "Carry the user to the agent"
            body:
              - "Call the agent with the end user's Microsoft Entra context; a call on the application's identity alone looks like one caller to the service."
              - "Agent identity acting on behalf of the user is preview."
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/user-delegation
          - title: "Ground on Foundry IQ where entitlements differ"
            body:
              - "Include permission metadata fields in the index so results are filtered by the user's identity at query time."
              - "Remote SharePoint knowledge sources apply SharePoint permissions directly."
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/foundry-iq-connect
          - title: "Enforce conversation ownership in your application"
            body:
              - "Agent Service does not enforce per-user authorisation on conversations."
              - "Check that the signed-in user owns the conversation ID before forwarding a request."
            url: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/baseline-microsoft-foundry-chat
        verified: "2026-11-18"
      - mitigation: D3-ACH
        coverage: native
        mechanism: "Microsoft ships built-in Azure Policy definitions with a Deny effect for the Foundry resource (network access, key access, customer-managed keys), for model deployments (approved models, eligibility) and, in preview, for agent tools. No built-in was found that requires your own stores or network injection."
        steps:
          - title: "Assign the resource baseline with Deny"
            body:
              - "Assign the Azure AI Services definitions for restricted network access, disabled key access and customer-managed keys, plus Allowed locations."
              - "Assign above the subscription so a project team cannot remove them."
            url: https://learn.microsoft.com/en-us/azure/governance/policy/samples/built-in-policies
          - title: "Limit models"
            body:
              - "Assign Foundry model deployments should only use approved models and the eligibility definition with effect Deny."
              - "Both are evaluated at deployment time."
            url: https://learn.microsoft.com/en-us/azure/foundry/how-to/model-deployment-policy
          - title: "Limit tools (preview)"
            body:
              - "Assign the approved-tools and denied-tools definitions for agents and toolboxes."
              - "They are version 1.0.0-preview; test in Audit before Deny."
            url: https://learn.microsoft.com/en-us/azure/governance/policy/samples/built-in-policies
        verified: "2026-11-18"
      # <<< cloud controls
    # The security-relevant settings, each with the baseline value (data/tooling/BASELINE.md).
    # Rows are fields of the agent, toolbox, project or Foundry resource set over the Foundry data-plane or Azure
    # Resource Manager APIs (apiCli), Foundry portal pages (adminConsole), Azure RBAC role assignments and Azure
    # Policy assignments (cloudPolicy), Microsoft Entra or Agent 365 actions (identityProvider) and the deployer's own
    # code. Verified 2026-11-18.
    settings:
      - id: endpointAuthorizationScheme
        name: Agent endpoint authorization schemes (AzureRbac, AgentBlueprint, BotServiceRbac, BotServiceTenant, BotService)
        where: Agent › agent_endpoint › authorization_schemes via PATCH /agents/{name} (REST API or Python SDK); not configurable in the Foundry portal. The Teams and Microsoft 365 publish flow sets the Bot Service scheme from the chosen publishing scope.
        setVia: [apiCli]
        area: identity
        default: AzureRbac
        recommended: AzureRbac for direct callers and BotServiceRbac for Teams and Microsoft 365; the legacy BotService scheme never
        value: "AzureRbac or BotServiceRbac, never BotService"
        why: Every caller is authorised by an Azure role on the agent, and a Teams user cannot reach it through a scheme that applies no user authorization rule.
        mitigations: [D3-APA]
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/configure-agent
        verified: "2026-11-18"
      - id: agentConsumerRole
        name: Foundry Agent Consumer
        where: "Azure CLI: az role assignment create --role eed3b665-ab3a-47b6-8f48-c9382fb1dad6 --scope .../accounts/<account>/projects/<project>/agents/<agent> (agent or project scope). The Azure portal's Access control (IAM) supports this role only at the Foundry account scope."
        setVia: [cloudPolicy, apiCli]
        area: identity
        recommended: Assigned at the individual agent's scope to the groups and service principals that call it; Foundry User kept for builders
        value: "Assigned per agent to its callers"
        why: A caller can invoke one agent without being able to create, change or call every other agent in the project.
        mitigations: [D3-APA]
        url: https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry
        verified: "2026-11-18"
      - id: agentWriteRoles
        name: Foundry User / Foundry Project Manager / Foundry Owner (agents/write)
        where: Azure portal › Foundry project › Access control (IAM)
        setVia: [cloudPolicy]
        area: identity
        recommended: Held by named builders in development projects and by the delivery pipeline's identity in production projects
        value: "Named builders and the pipeline identity"
        why: Only a reviewed pipeline can create or change an agent definition in production, and Foundry User's cross-user session access stays with a named few.
        mitigations: [cap-agent-tool-registry, D3-APA]
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/hosted-agent-permissions
        verified: "2026-11-18"
      - id: disableLocalAuth
        name: disableLocalAuth
        where: Foundry resource (Microsoft.CognitiveServices/accounts) › properties.disableLocalAuth (Bicep, ARM or Set-AzCognitiveServicesAccount)
        setVia: [apiCli, cloudPolicy]
        area: identity
        default: Key-based authentication available
        recommended: "true, with the built-in policy that requires key access to be disabled assigned to the subscription"
        value: "true"
        why: A static key that grants full access to the resource without role restrictions or per-user traceability cannot be used; agent endpoints already refuse keys.
        mitigations: [D3-CH]
        url: https://learn.microsoft.com/en-us/azure/ai-services/disable-local-auth
        verified: "2026-11-18"
      - id: isolationKeySource
        name: isolation_key_source.kind
        where: Agent endpoint › authorization scheme › isolation_key_source (Entra or Header)
        setVia: [apiCli]
        area: identity
        default: Entra
        recommended: Entra; Header only for a trusted middle tier that authenticates its own users
        value: "Entra; Header only for a trusted middle tier"
        why: Sessions, conversations and stored data are partitioned by the caller's own token, not by a value the caller chooses.
        mitigations: [D3-EI, D3-APA]
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/configure-agent-endpoint-authorization
        verified: "2026-11-18"
      - id: userIdentityImpersonation
        name: Microsoft.CognitiveServices/accounts/AIServices/agents/endpoints/UserIdentityImpersonation/action
        where: Azure RBAC › custom role assigned on the agent to the middle tier's identity
        setVia: [cloudPolicy]
        area: identity
        default: In no built-in role
        recommended: Granted only to the one service identity that fronts users; never to people or to the agent itself
        value: "Only the identity that fronts users"
        why: Only the trusted front end can name an end user in x-ms-user-identity, so a caller cannot open another user's sessions by sending their identifier.
        mitigations: [D3-APA]
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/isolate-sessions-per-user
        verified: "2026-11-18"
      - id: connectionAuthTypeAgentIdentity
        name: Microsoft Entra - agent identity (connection authType AgenticIdentityToken; azd ai connection create --auth-type agentic-identity)
        where: Project connection › authentication type, with the downstream audience
        setVia: [adminConsole, apiCli]
        area: identity
        recommended: Used for every Entra-protected tool that is not user-specific, in place of a stored key or the project managed identity
        value: "For every non-user-specific Entra tool"
        why: The tool call carries the one agent's own short-lived token, so there is no shared secret to leak and access can be scoped and audited per agent.
        mitigations: [D3-CH, D3-CTS]
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/mcp-authentication#use-agent-identity-authentication
        verified: "2026-11-18"
      - id: connectionAuthTypeUserDelegation
        name: OAuth identity passthrough / Microsoft Entra client user delegation (connection authType OAuth2, UserEntraToken or AgentOnBehalfOfUser; azd --auth-type oauth2, user-entra-token)
        where: Project connection › authentication type
        setVia: [adminConsole, apiCli]
        area: identity
        recommended: Used for every tool that returns user-specific data (mail, files, records)
        value: "For every tool with user-specific data"
        why: The downstream service sees the signed-in user and applies their permissions, so the agent cannot return one user's data to another.
        mitigations: [D3-CTS]
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/tool-authentication
        verified: "2026-11-18"
      - id: keyVaultConnection
        name: Azure Key Vault connection
        where: Foundry resource › connection of category AzureKeyVault (created before any other connection)
        setVia: [apiCli]
        area: identity
        default: Connection secrets in a Microsoft-managed Key Vault outside your subscription
        recommended: The firm's own Key Vault, with access to it and to project connections limited to a named few
        value: "The firm's own Key Vault"
        why: Stored API keys and OAuth client secrets sit in a vault the firm controls, logs and can cut off.
        mitigations: [D3-CH]
        url: https://learn.microsoft.com/en-us/azure/foundry/how-to/set-up-key-vault-connection
        verified: "2026-11-18"
      - id: mcpAllowedTools
        name: allowed_tools
        where: Agent definition or toolbox version › MCP tool › allowed_tools
        setVia: [adminConsole, apiCli]
        area: tools
        default: All tools the server exposes (an empty list also allows all)
        recommended: A nonempty list of the named tools the agent needs, reviewed when the server changes
        value: "Only the named tools the agent needs"
        why: A server that adds or renames a tool does not hand the agent a new capability until someone lists it.
        mitigations: [AML.M0028]
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/model-context-protocol
        verified: "2026-11-18"
      - id: mcpRequireApproval
        name: require_approval
        where: 'Agent definition › MCP tool › require_approval ("always", "never", {"never":[tool names]} or {"always":[tool names]})'
        setVia: [apiCli]
        area: tools
        default: always
        recommended: "always for tools that write data or change resources; never for read-only tools"
        value: "always for writes; never for read-only"
        why: A prompt agent returns an mcp_approval_request and the tool runs only after an approval response naming that request.
        mitigations: [AML.M0029]
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/model-context-protocol
        verified: "2026-11-18"
      - id: toolboxRequireApproval
        name: require_approval (toolbox tool)
        where: Toolbox version › tool › require_approval, returned to clients in _meta.tool_configuration
        setVia: [apiCli, code]
        area: tools
        recommended: "always on consequential tools, and only where the hosted agent's runtime pauses, collects the decision and resumes that exact call"
        value: "always on consequential tools"
        why: The toolbox endpoint does not block tools/call, so the setting stops nothing unless the agent's own runtime enforces it.
        mitigations: [AML.M0029]
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/use-toolbox-hosted-agent
        verified: "2026-11-18"
      - id: projectToolControls
        name: toolControls (defaultAction, allowedTools)
        where: Foundry project (Azure Resource Manager) › properties.toolControls
        setVia: [apiCli]
        area: tools
        default: Absent, so runtime tool use is not restricted
        recommended: defaultAction Deny, with allowedTools naming each approved tool type and each MCP serverUrl or connectorId
        value: "defaultAction Deny, approved tools listed"
        why: A tool or MCP server nobody approved is refused at run time in that project, whatever an agent definition or a per-request call asks for.
        mitigations: [AML.M0028, cap-agent-action-policy-enforcement]
        requires: Preview (api-version 2026-09-15-preview)
        url: https://learn.microsoft.com/en-us/azure/foundry/control-plane/govern-tools
        verified: "2026-11-18"
      - id: approvedToolsPolicy
        name: "[Preview]: Microsoft Foundry agents and toolboxes should only use approved tools"
        where: Azure Policy › Definitions › assign at the Foundry account scope (approvedToolTypes, approvedMcpEndpoints, approvedMcpConnectors)
        setVia: [cloudPolicy]
        area: tools
        default: Not assigned; the definition's effect defaults to Audit
        recommended: Deny after an Audit period, with MCP servers approved by endpoint or connector and the broad mcp type left out
        value: "Deny, after an Audit period"
        why: A builder cannot save a prompt agent or toolbox that uses an unapproved tool or MCP server.
        mitigations: [AML.M0028, cap-agent-action-policy-enforcement, cap-agent-tool-registry]
        requires: Preview; does not evaluate Copilot harness prompt agents or hosted-agent code
        url: https://learn.microsoft.com/en-us/azure/foundry/control-plane/govern-tools
        verified: "2026-11-18"
      - id: deniedAgentKindsPolicy
        name: "[Preview]: Microsoft Foundry agents should not use denied agent kinds"
        where: Azure Policy › Definitions › assign at subscription, resource group or Foundry account scope (deniedAgentKinds)
        setVia: [cloudPolicy]
        area: tools
        default: Not assigned; effect Audit and an empty deniedAgentKinds list
        recommended: Deny, listing the agent kinds the firm has not approved for that scope
        why: A project cannot gain an agent of a kind (for example hosted, which runs arbitrary code) that the firm has no review process for.
        mitigations: [cap-agent-tool-registry]
        requires: Preview; Canada Central, Spain Central and Korea Central
        url: https://learn.microsoft.com/en-us/azure/foundry/how-to/agent-deployment-policy
        verified: "2026-11-18"
      - id: allowedContainerImagesPolicy
        name: "[Preview]: Microsoft Foundry hosted agents should only use allowed container images"
        where: Azure Policy › Definitions › assign at subscription, resource group or Foundry account scope (allowedContainerImages)
        setVia: [cloudPolicy]
        area: tools
        default: Not assigned; effect Audit and an empty allowedContainerImages list
        recommended: Deny, with the firm's registry image references or patterns
        why: A hosted agent can run only an image from the registry the firm's pipeline builds and scans.
        mitigations: [cap-agent-tool-registry]
        requires: Preview; Canada Central, Spain Central and Korea Central
        url: https://learn.microsoft.com/en-us/azure/foundry/how-to/agent-deployment-policy
        verified: "2026-11-18"
      - id: harnessTools
        name: Harness tools (microsoft_copilot_toolset_preview)
        where: Prompt agent › Tools › Harness tools (File system read, File system write, Shell, Web, Subagents)
        setVia: [adminConsole, apiCli]
        area: tools
        default: All five enabled
        recommended: defaultConfig enabled false, enabling only the capabilities the task needs; Shell off unless required
        value: "Only needed capabilities; Shell off"
        why: A prompt injection cannot reach a shell or write files in an agent that was only meant to read and answer.
        mitigations: [AML.M0028]
        requires: Microsoft Copilot harness (preview)
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/use-tools-skills-copilot-harness
        verified: "2026-11-18"
      - id: toolboxDefaultVersion
        name: default_version (toolbox)
        where: Toolbox › Promote a version to default (SDK, REST, or azd ai toolbox publish)
        setVia: [apiCli]
        area: tools
        default: The first version becomes the default; later versions are not promoted automatically
        recommended: Promoted only after the new version is tested on its version-specific endpoint and reviewed
        value: "Promoted only after testing and review"
        why: Agents on the consumer endpoint keep the reviewed tool set until someone deliberately moves the pointer, and moving it back is the rollback.
        mitigations: [cap-staged-rollout-gate, AML.M0028]
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/toolbox
        verified: "2026-11-18"
      - id: versionSelector
        name: version_selector (Always use latest / pinned to a specific version)
        where: Agent › Publish dropdown › version selector, or PATCH agent_endpoint.version_selector.version_selection_rules
        setVia: [adminConsole, apiCli]
        area: tools
        default: Always use latest
        recommended: Pinned to a specific tested version (one FixedRatio rule at 100%) for every production agent
        value: "Pinned to a tested version"
        why: Saving a new version does not change what users and Teams channels are served until someone moves the pin.
        mitigations: [cap-staged-rollout-gate]
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/configure-agent#select-the-active-agent-version
        verified: "2026-11-18"
      - id: agentGuardrail
        name: Guardrail assignment (controls for User input attacks and Indirect attack)
        where: Foundry portal › Build › Guardrails › Create Guardrail › Add controls › Add agents
        setVia: [adminConsole, apiCli]
        area: tools
        default: The agent inherits its model deployment's guardrail (Microsoft.DefaultV2 screens user prompts for jailbreaks)
        recommended: A custom guardrail with User input attacks at user input and Indirect attack at tool response, both Annotate and block
        value: "Custom guardrail, Annotate and block"
        why: Injected instructions in a prompt or in what a supported tool returns are blocked before the agent acts on them.
        mitigations: [cap-input-guardrails]
        requires: Agent guardrails (preview); tool response and tool call points only for tools that support moderation
        url: https://learn.microsoft.com/en-us/azure/foundry/guardrails/how-to-create-guardrails
        verified: "2026-11-18"
      - id: hostedAgentRaiConfig
        name: rai_config.rai_policy_name
        where: Hosted agent version definition › rai_config (policies list in azure.yaml), plus invocations_moderation for the Invocations protocol
        setVia: [apiCli]
        area: tools
        default: Omitted, so no content safety guardrail at the hosted agent boundary
        recommended: The full ARM resource ID of the firm's guardrail on every hosted agent, confirmed by a blocked test prompt
        value: "The firm's guardrail on every hosted agent"
        why: A hosted agent is screened at its own boundary, and a wrong policy ID, which deploys as active with no filtering, is caught before release.
        mitigations: [cap-input-guardrails]
        requires: Agent guardrails (preview)
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/add-hosted-agent-guardrails
        verified: "2026-11-18"
      - id: toolboxGuardrail
        name: policies.rai_config.rai_policy_name (toolbox version)
        where: Toolbox version › policies › rai_config
        setVia: [apiCli]
        area: tools
        default: None
        recommended: The firm's guardrail policy on every shared toolbox
        why: Tool inputs and outputs are filtered at the toolbox for every agent that uses it, independently of each agent's own guardrail.
        mitigations: [cap-input-guardrails]
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/toolbox#configure-guardrails
        verified: "2026-11-18"
      - id: sessionIdleTimeout
        name: session_configuration.idle_timeout_seconds
        where: Hosted agent version › session_configuration (sessionConfiguration.idleTimeoutSeconds in azure.yaml)
        setVia: [apiCli]
        area: tools
        default: "900"
        recommended: "900"
        why: A session's sandbox, and whatever it holds in memory, is released fifteen minutes after its last request instead of living for up to four hours.
        mitigations: [AML.M0036, D3-EI]
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/manage-hosted-sessions
        verified: "2026-11-18"
      - id: pythonNoUserSite
        name: PYTHONNOUSERSITE
        where: Hosted agent version › environment_variables (env in azure.yaml)
        setVia: [apiCli]
        area: tools
        recommended: "1"
        why: A file uploaded into the session's $HOME cannot become a Python package the agent imports on its next start.
        mitigations: [D3-EI]
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/configure-hosted-agent-env-variables
        verified: "2026-11-18"
      - id: costControl
        name: Cost control (Send alert / Block usage)
        where: Foundry portal › Manage › Cost › Cost Control › Create (or the project's Monitor › Cost Control)
        setVia: [adminConsole, apiCli]
        area: tools
        default: None
        recommended: A Tokens or Spending budget per Agent, per Session for hosted agents, with Send alert at 80% and Block usage at 100%
        value: "Alert at 80%, block at 100%"
        why: A looping or hijacked agent is refused further requests once it reaches its own budget instead of drawing on the whole project.
        mitigations: [AML.M0036]
        requires: Preview
        url: https://learn.microsoft.com/en-us/azure/foundry/how-to/create-cost-controls
        verified: "2026-11-18"
      - id: egressPolicy
        name: Network egress controls (egressPolicy mode, defaultAction, rules)
        where: Foundry portal › Build › Guardrails › Create › Network › Egress rules; attached to the hosted agent version as its RAI policy
        setVia: [adminConsole, apiCli]
        area: network
        default: No egress policy
        recommended: Enforce with default action Deny and Allow rules for the hosts the agent needs, after a period in Audit
        value: "Enforce, default Deny"
        why: Code in the hosted agent's sandbox can reach only the hosts the firm allows, enforced by a proxy outside the sandbox that denies when it cannot evaluate.
        mitigations: [cap-agent-egress-control]
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/add-hosted-agent-guardrails#network-egress-controls
        verified: "2026-11-18"
      - id: egressPolicyFloor
        name: Microsoft Foundry hosted agents should enforce resolved RAI egress restrictions
        where: Azure Policy › Cognitive Services category › assign with the three RAI-policy egress definitions (permittedDestinations, deniedDestinations, effect)
        setVia: [cloudPolicy]
        area: network
        default: Not assigned; effect Audit
        recommended: Deny, with permittedDestinations set to the firm's approved hosts
        why: A builder cannot create a hosted agent version without a compliant egress policy; it does not stop sessions already running.
        mitigations: [cap-agent-egress-control]
        requires: Preview; Canada Central, Spain Central and Korea Central
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/govern-hosted-agent-egress-azure-policy
        verified: "2026-11-18"
      - id: harnessEgressPolicy
        name: Network egress controls (Copilot harness prompt agent)
        where: Foundry portal › Build › Guardrails › Create › Network; assigned to the harness prompt agent (policies in azure.yaml)
        setVia: [adminConsole, apiCli]
        area: network
        default: No egress policy
        recommended: Enforce with default action Deny, tested from a new conversation
        why: Shell commands and the harness Web tool reach only allowed hosts; a running environment does not reload changed rules.
        mitigations: [cap-agent-egress-control]
        requires: Microsoft Copilot harness (preview)
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/use-tools-skills-copilot-harness#control-network-egress
        verified: "2026-11-18"
      - id: agentVirtualNetwork
        name: Bring-your-own virtual network / managed virtual network
        where: Foundry resource deployment › networking (subnet delegated to Microsoft.App/environments, or a Microsoft-managed virtual network)
        setVia: [apiCli]
        area: network
        default: Public egress
        recommended: A bring-your-own virtual network behind the firm's firewall for projects that hold client data
        value: "Your own virtual network behind the firewall"
        why: Agent and tool traffic to the firm's data and to private MCP servers stays on the private network and passes the firm's own firewall.
        mitigations: [cap-agent-egress-control]
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/virtual-networks
        verified: "2026-11-18"
      - id: publicNetworkAccess
        name: Public network access
        where: Azure portal › Foundry resource › Networking › public access (Disabled, or Selected networks)
        setVia: [adminConsole, apiCli]
        area: network
        default: Reachable from the public internet
        recommended: Disabled, with a private endpoint in the firm's virtual network
        why: Only callers on the firm's network can present a token to the project and its agent endpoints.
        mitigations: [D3-NI]
        url: https://learn.microsoft.com/en-us/azure/foundry/how-to/configure-private-link
        verified: "2026-11-18"
      - id: memoryScope
        name: scope (memory search tool)
        where: Prompt agent › memory search tool › scope
        setVia: [apiCli]
        area: data
        recommended: "{{$userId}}"
        why: Each end user's memories are kept and recalled in their own partition, resolved from their Entra identity.
        mitigations: [AML.M0031]
        requires: Memory (preview)
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/memory-usage#understand-scope
        verified: "2026-11-18"
      - id: memoryDefaultTtl
        name: default_ttl_seconds
        where: Memory store › options, at store creation
        setVia: [apiCli]
        area: data
        recommended: "2592000 (30 days)"
        why: What the agent learned about a person, or was tricked into remembering, expires instead of steering every later conversation; 0 means no expiration.
        mitigations: [AML.M0031]
        requires: Memory (preview)
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/memory-usage#create-a-memory-store
        verified: "2026-11-18"
      - id: standardAgentSetup
        name: Standard agent setup (bring your own Azure Storage, Azure Cosmos DB and Foundry IQ)
        where: Foundry account and project › capability settings (properties set at deployment, for example with Bicep; formerly capability hosts, whose article is retained for reference) and connections
        setVia: [apiCli]
        area: data
        default: Basic setup (Microsoft-managed, logically separated storage)
        recommended: Standard setup for projects that hold client-confidential conversations and files
        value: "Standard setup for client-confidential projects"
        why: Conversation history, files and vector stores sit in the firm's own resources, where its retention, network rules and keys apply.
        mitigations: [AML.M0031, cap-data-access-governance]
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/standard-agent-setup
        verified: "2026-11-18"
      - id: customerManagedKeys
        name: Customer-managed keys
        where: The standard-setup Azure Cosmos DB, Storage and Foundry IQ resources, and the Foundry resource › Encryption
        setVia: [adminConsole, apiCli]
        area: data
        default: Microsoft-managed keys
        recommended: Microsoft-managed keys; customer-managed keys on the standard-setup resources where a client contract asks for key custody
        value: "Microsoft-managed; customer keys if required"
        why: Key custody is available where it is owed, knowing a hosted session's $HOME, basic setup and routines are never covered.
        mitigations: [AML.M0012]
        url: https://learn.microsoft.com/en-us/azure/foundry/concepts/customer-managed-keys
        verified: "2026-11-18"
      - id: traceContentProtection
        name: AppGenAIContent table protection level (Protected)
        where: Log Analytics table's protection level, plus Privileged Monitoring Data Reader on the linked Application Insights resource. Since 2026-09-30 content routes only to AppGenAIContent by default, unless optOutProtectGenAISensitiveData is registered.
        setVia: [adminConsole, apiCli]
        area: data
        default: Prompt and tool content readable with Log Analytics Reader
        recommended: The table Protected, Privileged Monitoring Data Reader granted to a named few, and optOutProtectGenAISensitiveData not registered
        value: "Protected, readable by a named few"
        why: Prompts, responses and tool arguments in traces are not readable by everyone who can see telemetry.
        mitigations: [cap-agent-tracing]
        url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/traces-sensitive-content
        verified: "2026-11-18"
      - id: applicationInsightsTracing
        name: Application Insights connection (tracing)
        where: Foundry project › Build › Agents › Traces › Connect, or Manage › Project details › Connected resources
        setVia: [adminConsole, apiCli]
        area: audit
        default: "Off"
        recommended: On for every project that runs agents, with the Log Analytics workspace exported to the SIEM
        value: "On, exported to the SIEM"
        why: Every model call, tool call and egress decision is recorded in the firm's own workspace; nothing is captured for runs before it is connected.
        mitigations: [cap-agent-tracing]
        url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/trace-agent-setup
        verified: "2026-11-18"
      - id: classicAgentsTag
        name: MS-AOAI-Feature-Assistants
        where: Foundry or Azure OpenAI account › resource tag
        setVia: [apiCli]
        area: audit
        recommended: Disabled
        why: Nobody can create classic agents or assistants, which the Fleet inventory does not list and which have no per-agent identity.
        mitigations: [cap-agent-tool-registry]
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/disable-classic-agents
        verified: "2026-11-18"
      - id: agentDisable
        name: Disable an agent (:disable)
        where: Foundry portal › agent › Details › Status › Edit, or POST /agents/{name}:disable
        setVia: [adminConsole, apiCli]
        area: audit
        recommended: The SOC playbook's step for taking an agent out of service, rehearsed and reversible with :enable
        value: "A rehearsed SOC playbook step"
        why: The agent's endpoint rejects every new request while its definition and versions are kept for investigation.
        mitigations: [cap-agent-kill-switch]
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/manage-hosted-agent
        verified: "2026-11-18"
      - id: sessionStop
        name: Stop a session (:stop)
        where: POST /agents/{name}/endpoint/sessions/{session-id}:stop, or azd ai agent sessions stop
        setVia: [apiCli]
        area: audit
        recommended: The SOC playbook's first step for a hosted agent, run by an identity with Foundry User on the project
        value: "The SOC playbook's first step"
        why: The session's running container is terminated, which ends work in flight instead of only refusing new requests.
        mitigations: [cap-agent-kill-switch]
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/manage-hosted-sessions
        verified: "2026-11-18"
      - id: entraAgentBlock
        name: Block (Agent 365) / Disable in this tenant (Microsoft Entra)
        where: Microsoft 365 admin center (Agent 365) or Microsoft Entra admin center › the agent identity or blueprint
        setVia: [identityProvider]
        area: audit
        recommended: Available to the SOC through an AI Administrator role, with agents created before 2026-10-23 listed for Foundry-side disable instead
        value: "Available to the SOC via AI Administrator"
        why: A tenant administrator can stop an agent without Azure access to its project; it takes up to 10 minutes and older agents ignore it.
        mitigations: [cap-agent-kill-switch]
        url: https://learn.microsoft.com/en-us/azure/foundry/control-plane/govern-agent-infrastructure-entra-admin
        verified: "2026-11-18"
      # >>> cloud settings (the service's own settings for the cloud controls)
      - id: agentIdentityPerAgent
        name: "Agent identity and agent identity blueprint (Microsoft Entra Agent ID, one per agent)"
        where: "Created by Agent Service with each agent; listed in the Microsoft Entra admin center agent inventory. Roles are assigned to the agent identity's object ID at each downstream resource."
        setVia: [identityProvider, apiCli]
        area: identity
        default: "Created for every new agent; legacy agents share a project identity"
        requires: "Conditional Access and ID Protection for agents need Microsoft Agent 365 licences"
        recommended: "Set tool connections to agent identity authentication, and grant each agent identity only the roles it needs at resource or resource group scope. Migrate legacy agents that still use the shared project identity."
        value: "Agent identity auth, least-privilege roles"
        why: "A new agent identity starts with no permissions, so access is whatever you grant. Per-agent identities let you scope, audit and disable one agent without touching the others."
        mitigations: [D3-AA]
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/agent-identity
        verified: "2026-11-18"
      - id: foundryPrivateEndpoint
        name: "Private endpoint on the Foundry resource (target sub-resource: account)"
        where: "Azure portal › Foundry resource › Resource Management › Networking › Private endpoint connections › + Private endpoint; or the Network tab at creation, with public access Disabled"
        setVia: [adminConsole, apiCli]
        area: network
        default: "No private endpoint; endpoint reachable from the internet"
        requires: "Private DNS zones privatelink.cognitiveservices.azure.com, privatelink.openai.azure.com and privatelink.services.ai.azure.com"
        recommended: "Create the private endpoint in the same region and subscription as your virtual network and disable public access. Add the trusted-services exception only if a named Azure service needs it."
        value: "Private endpoint, public access disabled"
        why: "The endpoint is public by default, so a stolen token works from anywhere. One private endpoint serves every project in the resource, so separate network exposure needs a separate Foundry resource."
        mitigations: [D3-NI]
        url: https://learn.microsoft.com/en-us/azure/foundry/how-to/configure-private-link
        verified: "2026-11-18"
      - id: foundryIqSourceAuthorization
        name: "Foundry IQ source authorization (x-ms-query-source-authorization)"
        where: "Foundry IQ knowledge base tool on the agent; Agent Service sets the header with the signed-in user's token when the request carries that user's Microsoft Entra context"
        setVia: [code, identityProvider]
        area: data
        requires: "Permission metadata in the index; some query-time enforcement features are preview"
        recommended: "Call the agent with the end user's Entra context, not the application identity alone, and index permission metadata with permissionFilterOption enabled. Do not use file search for content that only some users may see."
        value: "The end user's Entra context"
        why: "The index then returns only what the signed-in user may read. File search vector stores are shared by every agent in the project, and conversations carry no per-user check."
        mitigations: [cap-data-access-governance]
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/user-delegation
        verified: "2026-11-18"
      - id: approvedModelsPolicy
        name: "Foundry model deployments should only use approved models"
        where: "Azure Policy › Definitions › built-in (Cognitive Services) › assign with effect Deny (allowedPublishers, allowedAssetIds)"
        setVia: [cloudPolicy]
        area: tools
        default: "Not assigned"
        recommended: "Assign with effect Deny and list approved models by full asset ID. End an ID with a slash, or include the version, because each ID is matched as a prefix and would otherwise admit later models with a longer name."
        value: "Deny, approved models by full asset ID"
        why: "An agent can only name a model that is deployed in its Foundry resource. Denying unapproved deployments is how model choice is limited when inference never passes your gateway."
        mitigations: [D3-ACH]
        url: https://learn.microsoft.com/en-us/azure/foundry/how-to/model-deployment-policy
        verified: "2026-11-18"
      - id: modelEligibilityPolicy
        name: "Foundry model deployments should meet eligibility requirements"
        where: "Azure Policy › Definitions › built-in (Cognitive Services) › assign with effect Deny (model source and lifecycle status)"
        setVia: [cloudPolicy]
        area: tools
        default: "Not assigned"
        recommended: "Assign with effect Deny so that preview models, and models not sold directly by Azure, cannot be deployed in production subscriptions."
        value: "Assigned with effect Deny"
        why: "Preview models and models from other publishers come under different terms from the ones you reviewed. This refuses them at deployment time."
        mitigations: [D3-ACH, cap-ai-vendor-assessment]
        url: https://learn.microsoft.com/en-us/azure/foundry/how-to/model-deployment-policy
        verified: "2026-11-18"
      - id: deniedToolsPolicy
        name: "[Preview]: Microsoft Foundry agents and toolboxes should not use denied tools"
        where: "Azure Policy › Definitions › built-in (Cognitive Services) › assign with effect Deny (denied tool types, MCP endpoints and MCP connectors)"
        setVia: [cloudPolicy]
        area: tools
        default: "Not assigned"
        recommended: "Assign with effect Deny and list the tool types that use public endpoints, such as web search, Bing grounding and SharePoint grounding, wherever all traffic must stay on your network."
        value: "Deny, listing public-endpoint tools"
        why: "Microsoft's network guidance says to block the public-endpoint tools with Azure Policy if they do not meet your requirements. This is the definition that refuses them by type."
        mitigations: [D3-ACH, cap-agent-egress-control]
        url: https://learn.microsoft.com/en-us/azure/governance/policy/samples/built-in-policies
        verified: "2026-11-18"
      - id: modelDeploymentType
        name: "Deployment type (Standard, Data Zone Standard, Global Standard and the provisioned equivalents)"
        where: "Foundry resource › model deployment › deployment type (the deployment's SKU name)"
        setVia: [adminConsole, apiCli]
        area: data
        default: "GlobalStandard in the quickstart templates; Microsoft suggests starting with Global Standard"
        recommended: "Use Standard or Regional Provisioned where prompts must be processed in one Azure geography, or a Data Zone type for the US, EU or Asia Pacific zone. Treat Global Standard, the suggested starting point, as processing in any Azure region."
        value: "Standard, Regional Provisioned or Data Zone"
        why: "Data at rest stays in the resource's geography for every type, but a Global type may process prompts in any region. This is the setting that decides where inference happens."
        mitigations: [cap-ai-vendor-assessment]
        url: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/deployment-types
        verified: "2026-11-18"
      - id: a365LoggingEnabled
        name: "a365LoggingEnabled"
        where: "Foundry resource (Microsoft.CognitiveServices/accounts) › properties.a365LoggingEnabled; applies to every project and agent in the resource"
        setVia: [apiCli, cloudPolicy]
        area: audit
        default: "true when Agent 365 is enabled for the tenant"
        recommended: "Decide per Foundry resource. Set it to false where agent activity data must stay in your own workspace, and enforce the choice with Azure Policy across the subscription."
        value: "Per resource; false to keep data in your workspace"
        why: "Once Agent 365 is enabled for the tenant, Foundry resources send agent activity data to the Agent 365 control plane by default. That flow leaves your account without anyone choosing it."
        mitigations: [cap-ai-vendor-assessment]
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/configure-agent-365-data-collection
        verified: "2026-11-18"
      # <<< cloud settings
