  - architecture: archAgentFederation
    asOf: "2026-10"
    # >>> checked against the vendor's documentation
    verified: "2026-11-18"
    sources:
      idp: https://docs.aws.amazon.com/singlesignon/latest/userguide/what-is.html
      entry: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html
      authServer: https://docs.aws.amazon.com/cognito/latest/developerguide/what-is-amazon-cognito.html
      harness: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-a2a.html
      localTools: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agents-tools-runtime.html
      memory: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/memory.html
      gateway: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-http-passthrough.html
      internalTools: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-supported-targets.html
      provider: https://docs.aws.amazon.com/bedrock/latest/userguide/what-is-bedrock.html
    differences:
      - at: harness->gateway
        text: "AWS's documented runtime role lets the agent call Bedrock models directly, and AWS samples do so. Model calls cross the gateway only if you add inference targets, point the model client at the gateway, and remove bedrock:InvokeModel from the agent's role."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-permissions.html
      - at: entry->harness
        text: "A load balancer cannot forward to AgentCore Runtime. You need front-end code (Lambda or containers) behind it that calls the runtime with the user's token. AWS's cited reference solution uses CloudFront, API Gateway and Lambda instead."
        url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-target-groups.html
      - at: gateway->authServer
        text: "AgentCore Identity only brokers the user-token exchange; the exchange itself is done by an authorization server that supports token-exchange or JWT-bearer grants. Cognito's token endpoint offers neither, so it must run against your corporate IdP or the vendor's."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/on-behalf-of-token-exchange.html
      - at: authServer
        text: "Cognito cannot bind a machine (client-credentials) token to one resource; resource binding works only for user sign-ins. A peer's token is limited only by its client ID and custom scopes, so define a scope per skill."
        url: https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pools-define-resource-servers.html
      - at: gateway
        text: "A gateway has one inbound authorizer with one token issuer. Users' tokens and peer agents' tokens must come from the same Cognito user pool, told apart by client ID and scopes, or you run a separate gateway for peers."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-inbound-auth.html
      - at: gateway->peerVendor
        text: "Inbound peer tasks cross the gateway only if you lock the runtime to it. Otherwise a caller with a valid token can invoke the runtime's own endpoint and skip policy. Set allowedWorkloadConfiguration so only the gateway is accepted."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-security-best-practices.html
      - at: gateway->partner
        text: "Calls to peers leave from the AWS-managed gateway, not your VPC, so a VPC firewall never sees them. The list of reachable peers is the gateway's passthrough targets; restrict who may create or change targets."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-vpc-egress.html
      - at: gateway
        text: "AWS Agent Registry is a searchable catalogue only. Approving or deprecating a record neither adds nor removes a gateway target, and nothing checks card signatures; your own pipeline and interceptor must link the registry to the gateway."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/registry.html
    alsoNeeded:
      - service: "Front-end compute (AWS Lambda or Amazon ECS)"
        role: other
        why: "Runs the chat application behind the load balancer and calls InvokeAgentRuntime with the user's token."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-invoke-agent.html
      - service: "Amazon VPC with NAT gateway and AWS Network Firewall"
        role: network
        why: "VPC-mode runtime needs private subnets and NAT; no VPC or firewall setting is listed here."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-vpc.html
      - service: "AWS KMS"
        role: keys
        why: "Customer managed keys for gateway, memory and token vault; defaults are AWS-owned keys."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-encryption.html
      - service: "AWS Secrets Manager"
        role: secrets
        why: "AgentCore Identity credential providers keep OAuth client secrets and API keys there."
        url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html
      - service: "Amazon ECR"
        role: registry
        why: "Holds the agent's container image; the documented runtime role pulls from it."
        url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/what-is-ecr.html
      - service: "AWS WAF"
        role: ingress
        why: "Named in the front-end row but no setting configures it; the gateway peers call takes one web ACL."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-waf.html
      - service: "Gateway custom domain (Amazon CloudFront, AWS Certificate Manager, Amazon Route 53)"
        role: ingress
        why: "Gives peers a stable public hostname for the gateway endpoint the agent card advertises."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-custom-domains.html
      - service: "AWS Lambda interceptor on the gateway"
        role: other
        why: "The card-signature and hash check is code you write and attach to the gateway."
