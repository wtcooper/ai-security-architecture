# Claude Managed Agents — one entity per product × reference architecture. Facts are dated (asOf)
# and cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# 2026-09-15: added sandboxing, egress, runtime enforcement, credential isolation and MCP rows after the managed-runtime drawing pinned them; fetched environments, cloud-sandboxes-reference, self-hosted-sandboxes-security, permission-policies, mcp-connector, vaults, tools (all 200).
vendor: anthropic
family: Claude Managed Agents
tools:
  - id: toolClaudeManagedAgents
    name: Claude Managed Agents
    surfaceClasses:
      - managedRuntime
    variants:
      - name: Managed Agents API (agents, environments, sessions, vaults) on api.anthropic.com
        class: managedRuntime
        url: https://platform.claude.com/docs/en/managed-agents/overview
      - name: Self-hosted sandboxes (your worker polls the environment work queue)
        class: managedRuntime
        url: https://platform.claude.com/docs/en/managed-agents/self-hosted-sandboxes-security
        note: >-
          Control plane stays with Anthropic; sandbox image, egress, service-key custody and
          session-content retention are yours. Environment-variable vault credentials are not yet
          supported here.
    architecture: archManagedAgentRuntime
    status: beta
    asOf: "2026-09"
    summary:
      - >-
        Anthropic's hosted agent harness (beta; every request carries the managed-agents-2026-04-01
        beta header, enabled by default for API accounts): you define an agent (model, system
        prompt, toolset, MCP servers, skills), an environment (Anthropic cloud sandbox — an
        isolated Ubuntu container, up to 8 GB / 10 GB — or a self-hosted sandbox), then run
        sessions that stream events over SSE. The sandbox runs bash, file tools and code;
        web_search and web_fetch run on Anthropic's servers. Sessions are stateful: event history
        persists until you delete the session and sandbox state is checkpointed for 30 days, so
        Managed Agents is not ZDR- or HIPAA-BAA-eligible.
      - >-
        Governance is API-native and workspace-scoped: permission_policy always_allow /
        always_ask per toolset or per tool (MCP toolsets default to always_ask), tool enable
        flags, per-tool allowed_domains / blocked_domains, environment networking unrestricted /
        limited with allowed_hosts, vault credentials injected at egress so the agent never sees
        the secret, hard dollar session budgets, versioned agent definitions, memory stores with
        immutable version history and redaction, signed webhooks and a persisted event stream.
        Also available on Claude Platform on AWS with differences.
    facts:
      - label: Plans
        value: >-
          Any Claude API organisation (beta, on by default); MCP tunnels and dreaming are a
          limited research preview. Billed per model token, $10 per 1,000 web searches and $0.08
          per session hour at list rates.
        url: https://platform.claude.com/docs/en/managed-agents/budgets
      - label: Inference & routing
        value: >-
          Anthropic API only (plus Claude Platform on AWS); model pinned per agent with optional
          inference_geo "us" validated against the workspace's allowed_inference_geos.
        url: https://platform.claude.com/docs/en/managed-agents/agent-setup
      - label: Data leaving the device
        value: >-
          Everything runs on Anthropic infrastructure: conversation, tool inputs/outputs, files
          and sandbox state; self-hosted sandboxes keep tool execution and files on your side while
          the transcript still passes through Anthropic.
        url: https://platform.claude.com/docs/en/managed-agents/self-hosted-sandboxes-security
      - label: Retention & training
        value: >-
          Commercial terms (no training). Session transcripts persist until you delete the
          session; sandbox checkpoints 30 days; memory versions retained 30 days (recent versions
          longer); not eligible for ZDR or HIPAA BAA.
        url: https://platform.claude.com/docs/en/manage-claude/api-and-data-retention
      - label: Docs index
        value: platform.claude.com/docs/en/managed-agents (overview through reference)
        url: https://platform.claude.com/docs/en/managed-agents/overview
    riskNotes:
      - risk: riskCrossTenantCredentialPropagation
        note: >-
          Vaults and credentials are workspace-scoped: any API key with workspace access can
          reference them at session creation, and the docs recommend separate workspaces and
          environments per trust boundary for self-hosted sandboxes.
      - risk: riskPromptInjection
        note: >-
          Memory stores attach read_write by default and the docs warn a successful injection
          can write content later sessions read as trusted; use read_only for reference stores
          and limited networking with allowed_hosts for production.
      - risk: riskRogueActions
        note: >-
          The built-in agent toolset defaults to always_allow, including bash with unrestricted
          egress on API-created environments; production guidance is limited networking and
          always_ask on bash or MCP tools that write.
      - risk: riskToolSourceProvenance
        note: >-
          MCP servers are declared by URL with no allowlist beyond the agent definition; MCP
          toolsets default to always_ask so newly added server tools do not run unapproved, and
          per-tool enabled flags can pin the set.
      - risk: riskSensitiveDataDisclosure
        note: >-
          Custom tool results, uploaded files and outputs are stored server-side until deleted;
          OAuth exchanges performed inside the sandbox return tokens unredacted, so perform
          exchanges outside and store the result in the vault.
