  - architecture: archTrainingPipeline
    asOf: "2026-11"
    verified: "2026-11-18"
    reference:
      - title: "Kubeflow Trainer"
        url: https://trainer.kubeflow.org/en/latest/
      - title: "MLflow Model Registry"
        url: https://mlflow.org/docs/latest/ml/model-registry/
      - title: "Production environment"
        url: https://kubernetes.io/docs/setup/production-environment/
    summary:
      - "Kubeflow Pipelines curates data with Presidio into a versioned Ceph bucket. A Kubeflow Trainer TrainJob runs on GPU nodes under its own service account, with default-deny networking and only the Nexus and Harbor mirrors for dependencies. Candidates land in a separate bucket, are tested with garak behind a pipeline gate, approved in MLflow, and signed by a release job whose key the training job never holds. Data, prompts and weights stay in the organisation's own data centre, and the organisation carries what a cloud provider would otherwise run."
    bindings:
      - { block: upstreamArtifacts, service: "Hugging Face Hub, PyPI and public image registries", note: "Stay outside. Reached only by intake jobs through the outbound proxy; training nodes have no route to them." }
      - { block: dataOrigins, service: "Your datasets and labelling tools", build: true, note: "Each source is logged with its origin and digest when it is brought in, so later versions trace back to it." }
      - { block: pkgRegistry, service: "Nexus Repository CE, Harbor and a Ceph weights mirror", note: "Nexus proxies PyPI and Hugging Face, Harbor proxies images, and scanned base weights sit in a mirror bucket." }
      - { block: curation, service: "Kubeflow Pipelines components with Presidio", note: "Filtering and redaction run as pipeline steps and write a new dataset version; the run is recorded in MLflow." }
      - { block: corpus, service: "Ceph Object Gateway dataset bucket (versioned)", note: "Written only by the curation identity; each training run may read only the version it was approved for." }
      - { block: trainJob, service: "Kubeflow Trainer TrainJob on GPU nodes", note: "Runs from a ClusterTrainingRuntime the platform team owns, with a service account per run and no route out of the cluster." }
      - { block: storage, service: "Ceph Object Gateway candidate bucket", note: "Unsigned candidates only. The serving identity has no read access here; releases are copied to a separate bucket." }
      - { block: evaluation, service: "Kubeflow Pipelines evaluation step with garak", note: "Serves the candidate on a short-lived vLLM, runs garak and the organisation's own tests, and feeds the gate." }
      - { block: registry, service: "MLflow Model Registry", note: "Run with authentication on and default_permission = NO_PERMISSIONS, so only approvers can change a model's status." }
    sources:
      upstreamArtifacts: https://huggingface.co/docs/hub/index
      dataOrigins: https://mlflow.org/docs/latest/ml/dataset/
      pkgRegistry: https://help.sonatype.com/en/nexus-repository-tiers-and-feature-availability.html
      curation: https://www.kubeflow.org/docs/components/pipelines/overview/
      corpus: https://docs.ceph.com/en/latest/radosgw/
      trainJob: https://trainer.kubeflow.org/en/latest/
      storage: https://docs.ceph.com/en/latest/radosgw/bucketpolicy/
      evaluation: https://docs.garak.ai/garak
      registry: https://mlflow.org/docs/latest/ml/model-registry/
    differences:
      - at: trainJob
        text: "There is no single switch like a managed training service's network isolation. Kubernetes pods are non-isolated by default, so a TrainJob can reach the internet and every other namespace until a default-deny NetworkPolicy and Cilium rules limit it to the mirrors, the dataset bucket and the candidate bucket."
        url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
      - at: pkgRegistry
        text: "Nexus Repository Community Edition is capped at 40,000 components and 100,000 requests per day, and automated malware quarantine and policy gates are Pro+ or Enterprise only. The mirror therefore admits by routing rule and by your own scans (Trivy, ModelScan), not by a built-in firewall. Hugging Face proxy repositories are available in Community Edition."
        url: https://help.sonatype.com/en/nexus-repository-tiers-and-feature-availability.html
      - at: storage
        text: "Kubeflow Pipelines brings its own object store, SeaweedFS by default since KFP 2.15 (it replaced MinIO, whose community repository was archived in April 2026). Candidates and artefacts reach the Ceph bucket only if the kfp-launcher ConfigMap points defaultPipelineRoot and the s3 provider at the Ceph Object Gateway."
        url: https://www.kubeflow.org/docs/components/pipelines/operator-guides/configure-object-store/
      - at: trainJob->storage
        text: "A Kubernetes service account is not an S3 identity. Ceph gives a run its own scoped access only through STS AssumeRoleWithWebIdentity and a role per run. The simple path, and the one Kubeflow Pipelines documents, is a static access key in a Kubernetes Secret, which is neither per run nor short-lived."
        url: https://docs.ceph.com/en/latest/radosgw/STS/
      - at: evaluation->registry
        text: "No managed signing service exists: the organisation holds the release key. Keep it in Vault's transit engine or on a hardware security module, usable only by the release job's role. Keys held in an HSM and PKCS11 auto-unseal need Vault Enterprise; OpenBao provides a pkcs11 seal through its KMS plugin."
        url: https://developer.hashicorp.com/vault/docs/configuration/seal/pkcs11
      - at: registry
        text: "MLflow does not enforce approval by itself. Authentication applies only when the server runs with --app-name basic-auth, and then every user gets READ on everything by default. A separate approver exists only if default_permission is NO_PERMISSIONS and MANAGE on registered models is held by approvers alone."
        url: https://mlflow.org/docs/latest/self-hosting/security/basic-http-auth/
    alsoNeeded:
      - service: "Kubernetes control plane you operate"
        role: other
        why: "A cloud runs the API servers and etcd for you. Here you run at least three control plane machines, a load balancer in front of the API server, regular etcd backups and every upgrade."
        url: https://kubernetes.io/docs/setup/production-environment/
      - service: "GPU servers with the NVIDIA GPU Operator"
        role: other
        why: "Drivers, container toolkit and device plugin are yours to install and patch. With no route out, the operator's images and the driver packages come from your own registry and package mirror."
        url: https://docs.nvidia.com/datacenter/cloud-native/gpu-operator/latest/install-gpu-operator-air-gapped.html
      - service: "Harbor registry with Trivy"
        role: registry
        why: "The only image source training nodes can reach. Framework and pipeline images arrive through proxy cache projects, are scanned there and are pulled by digest."
        url: https://goharbor.io/docs/latest/administration/configure-proxy-cache/
      - service: "Keycloak"
        role: identity
        why: "Sign-in for the people who administer the gateway, registry and cluster, and the OpenID Connect provider the object gateway trusts when it issues temporary credentials."
        url: https://www.keycloak.org/docs/latest/server_admin/
      - service: "HashiCorp Vault (or OpenBao) with a hardware security module"
        role: secrets
        why: "Holds every secret and key the platform needs and must itself be unsealed, backed up and audited. PKCS11 auto-unseal needs Vault Enterprise; OpenBao offers a pkcs11 seal through its KMS plugin."
        url: https://developer.hashicorp.com/vault/docs/configuration/seal/pkcs11
      - service: "cert-manager with an internal certificate authority"
        role: keys
        why: "Issues and renews the TLS certificates for every service inside the boundary; there is no public certificate service to lean on."
        url: https://cert-manager.io/docs/
      - service: "Cilium and a Squid outbound proxy"
        role: network
        why: "Cilium enforces the network policies; Squid is the one exit, used only by intake jobs. Firewalls, routing and internal DNS around them are also yours."
        url: https://docs.cilium.io/en/stable/security/policy/index.html
      - service: "Databases behind MLflow and Kubeflow Pipelines"
        role: other
        why: "Run records, lineage and approvals live in databases you operate. They are the decision record, so they need patching, access control and tested backups."
        url: https://www.kubeflow.org/docs/components/pipelines/overview/
      - service: "OpenTelemetry Collector, Loki and the SIEM"
        role: logging
        why: "Nothing collects logs unless you run it: the collector gathers gateway, cluster audit and workload records, Loki keeps them, and the SIEM holds the detections."
        url: https://opentelemetry.io/docs/collector/
      - service: "Velero and off-site backup"
        role: other
        why: "Backs up cluster resources and persistent volumes; the buckets, databases and the vault need their own backup and restore tests."
        url: https://velero.io/docs/main/
      - service: "Time sync, power, cooling and physical security"
        role: other
        why: "Token expiry, certificates and log order depend on synchronised clocks (chrony). Access to the halls, hardware disposal and spare capacity are now part of protecting the model."
        url: https://chrony-project.org/
    quickstart:
      - title: "Runtime Guide"
        url: https://trainer.kubeflow.org/en/latest/operator-guides/runtime.html
      - title: "Object Store Configuration"
        url: https://www.kubeflow.org/docs/components/pipelines/operator-guides/configure-object-store/
      - title: "Authentication with Username and Password"
        url: https://mlflow.org/docs/latest/self-hosting/security/basic-http-auth/
    settings:
      - presidioDatasetRedaction
      - mlflowDatasetTracking
      - objectStoreBucketPolicy
      - objectStoreVersioningLock
      - cephRgwStsWebIdentity
      - cephRgwSseKms
      - nexusProxyAllowlist
      - harborProxyCache
      - trivyScanPipeline
      - modelScanFiles
      - kfpConditionGate
      - garakScan
      - modelSigningSign
      - vaultTransitKeys
      - vaultKubernetesAuth
      - mlflowModelRegistryStages
      - mlflowAuthPermissions
      - k8sNetworkPolicyDefaultDeny
      - ciliumFqdnEgress
      - egressProxyAllowlist
      - k8sServiceAccountTokens
      - kubeflowTrainJobServiceAccount
      - k8sRbacLeastPrivilege
      - k8sRuntimeClassSandbox
      - k8sAuditLogging
      - lokiRetentionImmutability

  - architecture: archAgentSandbox
    asOf: "2026-11"
    verified: "2026-11-18"
    reference:
      - title: "Documentation | Agent Sandbox"
        url: https://agent-sandbox.sigs.k8s.io/docs/
      - title: "Security Model - gVisor"
        url: https://gvisor.dev/docs/architecture_guide/security/
      - title: "Security - vLLM"
        url: https://docs.vllm.ai/en/latest/usage/security/
    summary:
      - "Each rollout is a fresh agent-sandbox pod on Kata Containers, created and deleted by your orchestrator on dedicated, tainted nodes of your own Kubernetes cluster. Cilium lets a rollout reach only the offline web, the package mirror and the platform services it needs; the model under test is served by vLLM on separate GPU nodes, and checkpoints and graders sit where no rollout identity can read them. Weights, trajectories and prompts stay in the organisation's own data centre, and the organisation carries what a cloud provider would run: hardware, virtualisation, registries, logs and patching."
    bindings:
      - { block: graders, service: "Grader models on vLLM in a separate namespace", note: "The orchestrator hands each grader the episode; graders read the end state through it and no sandbox has a route or a credential to them." }
      - { block: platform, service: "OpenTelemetry Collector, Vault and Ceph Object Gateway", note: "The only services a sandbox node may reach; each one checks the task's short-lived token." }
      - { block: orchestrator, service: "Your RL orchestrator on Kubernetes (Kubeflow Trainer)", build: true, note: "Creates one SandboxClaim per rollout, collects trajectories and holds the stop: it suspends the TrainJob and deletes the Sandboxes." }
      - { block: sandbox, service: "agent-sandbox Sandbox on Kata Containers (RuntimeClass)", note: "Kata needs worker nodes with hardware virtualisation; gVisor is the fallback where that is not available." }
      - { block: harness, service: "Your episode loop in the sandbox pod", build: true, note: "Holds a per-run gateway key and no weights; it samples actions over the API only." }
      - { block: localTools, service: "Shell, files and browser inside the sandbox pod", build: true, note: "Real tools in the task image; their network is the template's short egress list and nothing else." }
      - { block: storage, service: "Ceph Object Gateway checkpoint bucket", note: "Written by the trainer and read by the inference service; never mounted into, or reachable from, a sandbox." }
      - { block: inference, service: "vLLM on GPU nodes (NVIDIA GPU Operator)", note: "Reached through LiteLLM with a per-run key; only the /v1 paths are exposed to rollouts. KServe is the alternative." }
      - { block: offlineWeb, service: "Your offline web: cached pages and SearXNG", build: true, note: "Search answers come only from your own index of the cached pages; the crawler that fills the cache runs outside the sandbox network." }
      - { block: registry, service: "Pulp or Nexus Repository (PyPI and npm mirror)", note: "Nexus Community Edition is capped at 40,000 components and 100,000 requests a day, which a large rollout fleet exceeds." }
      - { block: openWeb, service: "The public internet (crawl source only)", note: "Reached only by the crawler, through the outbound proxy's allowlist." }
      - { block: sources, service: "Public registries (PyPI, npm)", note: "Reached only by the mirror's admission pipeline, through the outbound proxy." }
    sources:
      graders: https://docs.vllm.ai/en/latest/
      platform: https://opentelemetry.io/docs/collector/
      orchestrator: https://www.kubeflow.org/docs/components/trainer/overview/
      sandbox: https://agent-sandbox.sigs.k8s.io/docs/getting_started/overview/
      harness: https://agent-sandbox.sigs.k8s.io/docs/getting_started/overview/
      localTools: https://agent-sandbox.sigs.k8s.io/docs/use-cases/examples/network-policies/
      storage: https://docs.ceph.com/en/latest/radosgw/
      inference: https://docs.vllm.ai/en/latest/deployment/k8s/
      offlineWeb: https://docs.searxng.org/
      registry: https://pulpproject.org/
      openWeb: https://www.squid-cache.org/Doc/config/acl/
      sources: https://pulpproject.org/pulp_python/docs/user/guides/sync/
    differences:
      - at: sandbox
        text: "There is no managed microVM service: isolation is a RuntimeClass you install and patch, and Kata Containers needs worker nodes with hardware virtualisation. A Sandbox with no shutdownTime never expires, so fresh per task and destroyed afterwards hold only if the orchestrator sets the deadline and deletes each claim."
        url: https://agent-sandbox.sigs.k8s.io/docs/api/
      - at: sandbox
        text: "Cilium allows all traffic to and from a pod until a policy selects it, and agent-sandbox by default manages a shared NetworkPolicy per template. Decide which of the two owns the sandbox rules (set networkPolicyManagement to Unmanaged if Cilium does) and apply default deny before the first rollout."
        url: https://docs.cilium.io/en/stable/security/policy/intro/
      - at: harness->inference
        text: "vLLM's --api-key is one static key and covers only the /v1, /v2, /inference and /cohere paths; pooling, scoring and the pause and resume controls stay open. Put LiteLLM in front with a key per run, and let sandbox pods reach only the gateway."
        url: https://docs.vllm.ai/en/latest/usage/security/
      - at: storage->inference
        text: "vLLM loads its cache directories without integrity checks, including formats that can run code. The policy reload must read checkpoints from a bucket only the trainer writes, mounted read-only, and never from storage a rollout or a shared user can write."
        url: https://docs.vllm.ai/en/latest/usage/security/
      - at: localTools->registry
        text: "A proxying mirror fetches from outside when a rollout asks for something new: a Nexus proxy repository does so unless its remote is Blocked, and Pulp's Python remotes default to on_demand. Rollouts must read a mirror that is filled only by scheduled, immediate syncs."
        url: https://pulpproject.org/pulpcore/docs/user/learn/on-demand-downloading/
      - at: registry
        text: "Nexus Repository Community Edition supports up to 40,000 components and 100,000 requests a day and pauses new components beyond that. Thousands of rollouts installing packages pass the request limit, so use Pulp or the paid edition for the mirror the rollouts read."
        url: https://help.sonatype.com/en/ce-onboarding.html
      - at: localTools->platform
        text: "There is no cloud token service. A task's short-lived credential is a projected service account token exchanged at Vault, or at Ceph's STS (AssumeRoleWithWebIdentity) for storage. Pods made from a SandboxTemplate get no token by default, so a task that needs one must be given it explicitly."
        url: https://docs.ceph.com/en/latest/radosgw/STS/
    alsoNeeded:
      - service: "Bare-metal worker nodes with hardware virtualisation"
        role: other
        why: "Kata Containers runs each pod in a lightweight virtual machine, which needs virtualisation extensions on the hosts or nested virtualisation you operate."
        url: https://katacontainers.io/
      - service: "GPU servers with the NVIDIA GPU Operator"
        role: other
        why: "Drivers, the container toolkit and device plugins for the inference and grader nodes are yours to install and upgrade."
        url: https://docs.nvidia.com/datacenter/cloud-native/gpu-operator/latest/index.html
      - service: "Kubernetes control plane and etcd, highly available"
        role: other
        why: "Thousands of short-lived pods load the API server and etcd; sizing, backup and upgrades are your own work."
        url: https://kubernetes.io/docs/tasks/administer-cluster/configure-upgrade-etcd/
      - service: "Keycloak for researchers' sign-in"
        role: identity
        why: "Researchers reach the orchestrator through single sign-on with group-based access, which no provider console supplies."
        url: https://www.keycloak.org/guides
      - service: "Squid outbound proxy for the crawler and the mirror"
        role: network
        why: "The only route to the open web and the public registries, used by the two pipelines that fill the offline web and the mirror, never by a rollout."
        url: https://www.squid-cache.org/
      - service: "Harbor registry with Trivy scanning and a proxy cache"
        role: registry
        why: "Task images, the runtime and the platform images are stored and scanned inside the data centre; public images enter only through it."
        url: https://goharbor.io/docs/2.16.0/administration/configure-proxy-cache/
      - service: "OpenBao or Vault for task and service credentials"
        role: secrets
        why: "Issues the short-lived credentials that stand in for a cloud token service. Sealing Vault with a hardware security module needs Vault Enterprise; OpenBao offers a pkcs11 seal plugin."
        url: https://openbao.org/docs/configuration/seal/pkcs11/
      - service: "cert-manager with an internal certificate authority"
        role: keys
        why: "Every hop between the sandbox nodes and the platform services needs a certificate from an authority you run."
        url: https://cert-manager.io/docs/
      - service: "Prometheus, Loki, Tetragon and the SIEM"
        role: logging
        why: "Host and run records must land in a store outside the sandbox nodes, with alert rules that drive the automatic stop."
        url: https://tetragon.io/docs/overview/
      - service: "Self-hosted Trivy vulnerability databases"
        role: other
        why: "Scanning inside a closed network needs the vulnerability databases mirrored and refreshed by you."
        url: https://trivy.dev/docs/latest/guide/advanced/self-hosting/
      - service: "Kernel, runtime and cluster patching"
        role: other
        why: "A sandbox escape is closed by a kernel, Kata, gVisor or kubelet patch that nobody else will apply for you."
        url: https://kubernetes.io/docs/tasks/administer-cluster/cluster-upgrade/
    quickstart:
      - title: "Overview | Agent Sandbox"
        url: https://agent-sandbox.sigs.k8s.io/docs/getting_started/overview/
      - title: "Kata Containers | Agent Sandbox"
        url: https://agent-sandbox.sigs.k8s.io/docs/use-cases/examples/kata-containers/
      - title: "Using Kubernetes - vLLM"
        url: https://docs.vllm.ai/en/latest/deployment/k8s/
    settings:
      - k8sRuntimeClassSandbox
      - agentSandboxTemplate
      - agentSandboxShutdown
      - k8sPodSecurityRestricted
      - k8sDedicatedNodeTaints
      - k8sCpuManagerStatic
      - k8sNetworkPolicyDefaultDeny
      - ciliumHostFirewall
      - ciliumFqdnEgress
      - egressProxyAllowlist
      - pulpSyncAllowlist
      - nexusProxyAllowlist
      - pipRequireHashes
      - trivyScanPipeline
      - harborVulnerabilityGate
      - k8sServiceAccountTokens
      - vaultKubernetesAuth
      - cephRgwStsWebIdentity
      - litellmVirtualKeys
      - vllmApiKey
      - objectStoreBucketPolicy
      - k8sRbacLeastPrivilege
      - tetragonTracingPolicy
      - otelCollectorPipeline
      - lokiRetentionImmutability
      - k8sAuditLogging
      - kubeflowTrainJobSuspend
