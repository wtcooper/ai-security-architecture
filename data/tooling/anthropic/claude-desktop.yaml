# Claude Desktop and claude.ai — one entity per product × reference architecture. Facts are dated
# (asOf) and cite the vendor's own documentation; re-verify before enforcing.
# Schema: data/tooling/README.md. Claude Desktop on 3P (Bedrock / Vertex / Foundry / gateway
# inference with local conversation storage) is recorded as a variant, not an entity.
vendor: anthropic
family: Claude Desktop
tools:
  - id: toolClaudeDesktop
    name: Claude (claude.ai web, mobile and Claude Desktop)
    surfaceClasses:
      - desktopApp
      - saasChat
    variants:
      - name: Claude Desktop (macOS PKG/DMG, Windows MSIX, Linux beta)
        class: desktopApp
        url: https://support.claude.com/en/articles/12611117-deploy-claude-desktop-for-macos
      - name: claude.ai web and the iOS / Android apps
        class: saasChat
        url: https://support.claude.com/en/articles/9797531-what-is-the-enterprise-plan
      - name: Claude Desktop on 3P (inference via Bedrock, Vertex, Foundry or a gateway; local history)
        class: desktopApp
        url: https://claude.com/docs/third-party/claude-desktop/overview
        note: >-
          Configured only through MDM or a bootstrap server (or the claude.ai admin console in beta);
          conversation content goes only to your endpoint; no Anthropic account identity.
    architecture: archEnterpriseAiChat
    status: ga
    asOf: "2026-09"
    summary:
      - >-
        Anthropic's chat surfaces: claude.ai in the browser, the mobile apps, and Claude Desktop with its
        Chat, Cowork and Code tabs. Chat runs on the Anthropic API under the user's organisation login;
        connectors (MCP) reach Google Drive, Microsoft 365, GitHub, Slack and custom remote servers through
        mcp-proxy.anthropic.com; desktop extensions (.mcpb) and local MCP servers add device-side tools.
        Prompts, uploads and connector results go to Anthropic; Team and Enterprise data is not used for
        training and follows the organisation's retention setting (indefinite by default until a custom period
        is set).
      - >-
        Team and Enterprise administration is in the claude.ai console: SSO (SAML/OIDC via WorkOS) with domain
        verification and "Require SSO for Claude", JIT or SCIM provisioning with group-to-role mapping, custom
        roles and groups gating Claude Code, Cowork, Chrome, connectors, Claude Tag and models, connector
        enablement and per-tool read/write restrictions, enterprise-managed connector authorisation through
        the IdP, the desktop extension allowlist, audit logs (180-day export) and the Compliance API (Activity
        Feed, chats, files, projects, session transcripts, effective settings), custom retention, spend
        limits, IP allowlisting, CMEK and US-only inference. Enterprise installers deploy via Jamf, Kandji,
        Intune, SCCM or GPO with device policies in com.anthropic.claudefordesktop or
        HKLM\SOFTWARE\Policies\Claude covering extensions, local MCP, Claude Code and Cowork tabs,
        auto-updates and forced org login; device policy overrides the in-console allowlist.
    facts:
      - label: Plans
        value: >-
          Free, Pro, Max (consumer terms); Team (SSO, server-managed settings, analytics); Enterprise (SCIM,
          custom roles, Compliance API, audit logs, custom retention, CMEK, IP allowlisting, ZDR for Claude
          Code, HIPAA-ready option, US-only inference).
        url: https://support.claude.com/en/articles/9797531-what-is-the-enterprise-plan
      - label: Inference & routing
        value: >-
          Anthropic API; Claude Desktop on 3P routes Chat, Cowork and Code to Bedrock, Vertex, Foundry, the
          Anthropic API or an LLM / Claude apps gateway with local conversation storage.
        url: https://claude.com/docs/third-party/claude-desktop/overview
      - label: Data leaving the device
        value: >-
          Prompts, attachments, artifact content and connector retrievals to Anthropic; the desktop app also
          loads application code from claude.ai and *.claudeusercontent.com CDN hosts; the tenant-restrictions
          header and IP allowlist are the network-side gates.
        url: https://code.claude.com/docs/en/desktop
      - label: Retention & training
        value: >-
          Commercial plans: no training; chat and project retention indefinite by default, configurable from
          30 days at Organization settings > Data and privacy; audit logs 180 days; Compliance API
          local/remote session transcripts 6 years or the custom period.
        url: >-
          https://support.claude.com/en/articles/10440198-configure-custom-data-retention-controls-for-enterprise-plans
      - label: Docs index
        value: >-
          support.claude.com Team and Enterprise plans collection plus platform.claude.com manage-claude
          (Compliance API, inference hooks)
        url: https://support.claude.com/en/articles/9797531-what-is-the-enterprise-plan
    items:
      - title: Managed deployment and device policies
        body:
          - "Device policies live in the macOS configuration-profile domain com.anthropic.claudefordesktop and
            the Windows HKLM\\SOFTWARE\\Policies\\Claude registry key (HKCU is ignored when HKLM exists). The
            keys that matter for control: isDesktopExtensionEnabled and isDesktopExtensionDirectoryEnabled
            (kill switches for extensions and the directory), isLocalDevMcpEnabled (local MCP server
            connections), isClaudeCodeForDesktopEnabled, secureVmFeaturesEnabled (Cowork access),
            forceLoginOrgUUID, allowedWorkspaceFolders, effortLevel, disableAutoUpdates and
            autoUpdaterEnforcementHours. Device-level policy overrides the in-app allowlist."
          - "Claude Desktop on 3P extends the same stores with inferenceProvider and credential keys,
            disabledBuiltinTools, builtinToolPolicy, disableBypassPermissionsMode, coworkEgressAllowedHosts,
            managedMcpServers, allowedPluginMarketplaces, userPluginMarketplacesEnabled /
            userPluginUploadsEnabled, sshHostAllowlist, egressProxyUrl and OTLP telemetry keys; a Linux
            /etc/claude-desktop/managed-settings.json uses native JSON."
        links:
          - title: Enterprise configuration for Claude Desktop
            url: >-
              https://support.claude.com/en/articles/12622667-enterprise-configuration-for-claude-desktop
          - title: Claude Desktop configuration reference (3P managed keys)
            url: https://claude.com/docs/third-party/claude-desktop/configuration
      - title: Extension allowlist and managed connector authorization
        body:
          - Team and Enterprise Owners can turn on the desktop extension allowlist (Organization settings >
            Connectors > Desktop). It ships disabled — every extension is available until it is enabled — and
            enabling it force-deletes existing non-allowlisted installs; custom org-scoped extensions upload
            in .mcpb format. Enterprise-managed connector authorization (GA) lets admins provision MCP
            connectors org-wide through the IdP (Okta today), assign them by role and scope the permissions
            Claude may request; Owners can also restrict each connector's tools to read-only and block
            verified-domain services from connecting to outside accounts.
        links:
          - title: Desktop extension allowlist
            url: >-
              https://support.claude.com/en/articles/12592343-enabling-and-using-the-desktop-extension-allowlist
          - title: Org-wide MCP connector authorization
            url: >-
              https://support.claude.com/en/articles/15537633-authorize-mcp-connectors-for-your-entire-organization
          - title: Use connectors (admin controls)
            url: >-
              https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities
      - title: Identity, audit and compliance for the organisation
        body:
          - SSO via WorkOS (Okta, Entra ID, Google, OneLogin, JumpCloud, Duo SAML) with "Require SSO for
            Claude", JIT or SCIM provisioning with group-to-role mapping and automatic removal; Enterprise
            custom roles and groups; IP allowlisting (CIDR ranges enabled by Anthropic support); tenant
            restrictions via the proxy-injected anthropic-allowed-org-ids header.
          - Audit logs (Enterprise, 180 days, emailed download link) from Organization settings > Data and
            privacy; the Compliance API for the Activity Feed, chats, files, projects, directory, effective
            settings and Cowork / Claude Code / M365 session transcripts; custom data retention from 30 days;
            Inference hooks (beta) for inline allow/deny of every governed prompt across claude.ai, Cowork and
            Claude Code.
        links:
          - title: Set up single sign-on
            url: https://support.claude.com/en/articles/13132885-set-up-single-sign-on-sso
          - title: Set up JIT or SCIM provisioning
            url: https://support.claude.com/en/articles/13133195-set-up-jit-or-scim-provisioning
          - title: Compliance API
            url: https://platform.claude.com/docs/en/manage-claude/compliance-api
    riskNotes:
      - risk: riskSensitiveDataDisclosure
        note: >-
          Chat and project retention is indefinite until an Owner sets a period; uploads, connector results
          and artifacts persist with the chat. Custom retention and the Compliance API delete endpoints are
          the levers.
      - risk: riskToolSourceProvenance
        note: >-
          Custom remote MCP connectors and desktop extensions are user-addable by default; the extension
          allowlist ships disabled and Anthropic reviews Directory connectors against listing criteria without
          auditing them.
      - risk: riskAgenticDelegationConfusedDeputy
        note: >-
          Connectors act with the user's granted scopes; org-wide tool restrictions (read vs write) and
          managed authorisation scoping keep Claude from sending mail or writing tickets when only reading is
          intended.
      - risk: riskShadowAndUnknownAgents
        note: >-
          Personal accounts on the corporate network are blocked only by tenant restrictions or IP
          allowlisting; domain capture and SSO enforcement pull verified-domain users into the organisation.
