    title: 'AWS: two patterns to expose AgentCore Runtime with per-hop, user-scoped tokens'
    summary: 'AWS shows two ways to put an access layer in front of AgentCore Runtime: API Gateway with
      a VPC endpoint, or AgentCore Gateway in front. Both authenticate each request against the identity
      provider, authorise every hop, and propagate the user''s identity through token exchange into the
      microVM and down to tool calls, so each step holds only a short-lived credential for the next.

      '
    why: >-
      Addresses long-running agents outliving the user's session without a standing user-scoped credential.
    vendor: AWS
    products: [toolBedrockAgentcore]
    controls: [D3-CTS, D3-AMED, D3-AA]
    patterns: [archCloudManagedAgent]
    sources:
