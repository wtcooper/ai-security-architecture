id: archEnterpriseAiChat
surface: surfaceSaas
rank: 1
title: Enterprise AI chat with connectors
abbrev: Enterprise chat

summary:
  - >
    A general-purpose assistant subscription for the workforce, where each user connects their own
    data sources and uploads their own files. The grant model is per user and per connector, which
    makes the organisation's total exposure a sum nobody computes.

description:
  - >
    The contrast with a tenant-wide assistant is entirely in who consents. There, an administrator
    grants the vendor the corpus once. Here, each user authorises their own connectors — a
    repository, a drive, a ticket system — and the organisation's data path to the vendor is the
    union of thousands of individual decisions, each made in a modal dialog. Any single grant is
    usually appropriate; what nobody has is the aggregate, which makes the archetype's core
    problem visibility rather than permission.
  - >
    File upload is the parallel path and often the larger one. A user pasting a document into a
    chat window has moved data across the boundary with no connector, no grant and no record
    beyond what inspection catches. Every control that watches connectors misses this entirely,
    which is why in-browser and network inspection carry more weight here than the vendor's own
    administrative surface does.
  - >
    The remaining structural question is the boundary between the enterprise tenant and the
    consumer product. The same vendor typically offers both, the consumer one has different
    retention and training terms, and the difference between being in your tenant and being
    signed into a personal account is a session cookie. Tenant restriction enforced at the edge is
    what makes the enterprise agreement — retention limits, training opt-out, audit export —
    apply to the traffic at all.

distinguishedBy:
  - >
    Against the tenant-wide assistant: administrator-granted and corpus-wide there, user-granted
    and connector-by-connector here. That single difference relocates the control set from
    permissions governance to discovery and aggregate visibility.
  - >
    Against shadow AI: this is the sanctioned version of the same traffic. The sanctioned tenant
    is where you want the traffic to go, and most of the work in this archetype is making sure it
    does.

exemplars:
  - name: Enterprise assistant subscriptions
    note: >
      Workforce-wide licences for a general assistant, with administrative controls over
      retention, training and which connectors may be enabled.
    asOf: "2026-08"
  - name: Per-user connector catalogues
    note: >
      Marketplaces of source connectors each user authorises for themselves, typically over OAuth,
      with the vendor holding the resulting grant.
    asOf: "2026-08"

zones:
  - id: zoneUser
    owner: user
    note: The employee, and the prompt and attachment they are about to send somewhere else.
  - id: zoneEndpoint
    owner: endpoint
    note: >
      The vendor's chat client on a device we manage. Ours to manage, theirs to build — and
      the last point at which what is being sent is still visible to something we run.
  - id: zoneCloud
    owner: cloud
    note: >
      The identity and inspection tier every session crosses. On this archetype it is almost
      the whole of our technical control, because everything past it is somebody else's.
  - id: zoneVendor
    owner: vendor
    note: >
      The vendor's assistant backend under an enterprise agreement, and the published surfaces
      of its control plane. Its internals are assured, not drawn.
  - id: zoneExternal
    owner: external
    note: >
      The same vendor's unmanaged offering, one login away and carrying none of the enterprise
      terms — and the systems individual users connect on their own authority.
  - id: zoneGovernance
    owner: governance
    note: >
      Drawn across every band because it governs every band. On a bought product this band and
      the crossing are the entire control set; everything else is assurance.

blocks:
  - id: employee
    kind: actor
    title: Employee
    icon: person
    zone: zoneUser
    col: 0
    row: 1
    note: >
      Authorises their own connectors and uploads their own files. Every grant reasonable, the
      aggregate visible to nobody.

  - id: chatSurface
    kind: service
    title: Chat surface & uploads
    zone: zoneEndpoint
    col: 1
    row: 1
    cosaiComponent: componentAgentUserQuery
    note: >
      The browser tab or desktop client — the last point where the prompt, the attachment and the
      tenant it is going to are all visible to something the organisation operates.
    items:
      - id: client
        label: Browser / client
        icon: chat
        note: The vendor's interface on your device. Which tenant a session lands in is decided by a cookie, and visible here.
      - id: upload
        label: File upload
        icon: doc
        note: The path no connector governance sees. A pasted document crosses with no grant, no scope and no record other than what inspection catches.

  - id: edge
    kind: service
    title: Identity & secure edge
    zone: zoneCloud
    col: 2
    row: 1
    note: >
      Tenant assertion and inline inspection — the block doing most of the real work in this
      archetype, because the vendor's admin console cannot see traffic that never reached the
      managed tenant.
    items:
      - id: idp
        label: Identity binding
        icon: person
        note: Establishes the user and, critically, which tenant they are in. Tenant restriction here is what stops the consumer product being an alternative.
      - id: sse
        label: App & API endpoint
        icon: shield
        note: Inline inspection of prompts and uploads, and the enforcement point for which tenants and services are reachable.

  - id: consumerTenant
    kind: external
    title: Consumer product
    cosaiComponent: componentApplication
    zone: zoneExternal
    col: 4
    row: 0
    note: >
      The same vendor's unmanaged offering, reachable from the same browser with a personal
      login. Different retention terms, no administrative visibility, one cookie away.
    items:
      - id: personalAccount
        label: Personal accounts
        icon: person
        note: Authenticated to the provider and anonymous to the organisation. None of the enterprise terms apply to anything sent here.

  - id: vendor
    kind: provider
    title: Vendor chat service
    cosaiComponent: componentApplication
    zone: zoneVendor
    col: 3
    row: 1
    note: >
      Inference, conversation storage and the connector broker are all behind the published
      surfaces — only the interfaces you integrate with are drawn.
    items:
      - id: tenantApi
        label: Managed tenant API
        icon: globe
        note: Where enterprise terms apply — retention, training opt-out, audit export. Everything the agreement promises depends on traffic arriving here.
      - id: connectorBroker
        label: Connector broker
        icon: plug
        note: >
          Holds the OAuth grants users issued and calls their systems on their behalf — now
          including custom remote MCP servers where an owner admits them. The grants persist
          after the conversation, the project and the employee.
      - id: agentModes
        label: Agent modes
        icon: agent
        note: >
          The assistants are agents now: multi-step work across connectors, scheduled tasks,
          code execution and computer use, running on the vendor's infrastructure. Write
          actions are admin-gated per app and per action — where an administrator gated them.
      - id: adminConsole
        label: Tenant configuration
        icon: gear
        note: Retention, training opt-out, connector allowlist, history export. Set once and rarely revisited against a product that ships new connectors.

  - id: connectedSystems
    kind: service
    title: User-connected systems
    zone: zoneExternal
    col: 4
    row: 2
    cosaiComponent: componentDataSources
    note: >
      Repositories, drives and trackers, each authorised by an individual. Their union is the
      organisation's actual data path to the vendor — and retrieval is only as safe as the
      source permissions, because an assistant makes pre-existing oversharing instantly
      discoverable.
    items:
      - id: sources
        label: Org data
        icon: db
        note: Reached as the user who consented — correct as access control, invisible to anyone trying to see the total.
      - id: externalContent
        label: Content authored elsewhere
        icon: mail
        note: Tickets and documents written by people outside the conversation, entering it as context through a grant one employee made.

  - id: govIdentity
    kind: governance
    title: Identity services
    icon: person
    zone: zoneGovernance
    col: 1
    row: 5
    capabilities: [capabilityIga]
    note: >
      Which tenant an employee lands in. The single most consequential control here, because
      the same client with a different login is the consumer product and none of the
      enterprise terms apply.

  - id: govPolicy
    kind: governance
    title: Policy & authorization
    icon: scale
    zone: zoneGovernance
    col: 2
    row: 5
    capabilities: [capabilitySse, capabilityAiDlp]
    note: >
      What may leave, inspected at the one tier we operate — and the tenant policy on the
      vendor side that decides retention and training use.

  - id: govSupplyChain
    kind: governance
    title: Supply-chain assurance
    icon: db
    zone: zoneGovernance
    col: 3
    row: 5
    capabilities: [capabilityAiTprm, capabilityAgentRegistry]
    note: >
      The vendor assessment, and the connector inventory. Their internals are assured here
      rather than drawn anywhere — which is the whole of what a bought product allows.

  - id: govObservability
    kind: governance
    title: Observability & response
    icon: eye
    zone: zoneGovernance
    col: 4
    row: 5
    capabilities: [capabilityAuditLogging, capabilityShadowAiDiscovery]
    note: >
      Their export fused with our edge's record, and the discovery of the personal accounts
      nobody enrolled. The second is usually the larger number.

edges:
  - from: employee
    to: chatSurface
    path: primary
    bidir: true
    label: prompt & attachment
    note: >
      The prompt, the pasted excerpt and the uploaded file. Whatever policy exists, this is
      the moment the material leaves the person's hands.
  - from: chatSurface
    to: edge
    path: primary
    bidir: true
    note: >
      Out through the one tier we operate, where the session is bound to an identity and what
      is leaving can still be inspected.
  - from: edge
    to: vendor
    path: external
    bidir: true
    label: to the corporate tenant
    note: >
      The sanctioned destination: allowlisted because an assessment cleared it, governed by
      the agreement once it arrives rather than inspected on the way.
  - from: edge
    to: consumerTenant
    path: external
    route: vh
    label: blocked or logged
    note: >
      The same client, a personal login, and none of the enterprise terms — retention,
      training use and tenancy all different. Distinguishing the two at this tier is the
      control the archetype turns on.
  - from: vendor
    to: connectedSystems
    path: external
    bidir: true
    label: connector retrieval / actions
    note: >
      The vendor's backend reaching systems each user authorised individually. This path never
      touches our network, which is why no component of ours can sit on it — the control is
      the connector policy in their tenant configuration, and that limitation is recorded.

pins:
  risks:
    - risk: riskSensitiveDataDisclosure
      at: chatSurface->edge
      note: >
        A pasted document crosses the boundary with no connector, no grant and no record. Every
        control that watches connectors misses this path entirely.
    - risk: riskShadowAndUnknownAgents
      at: edge->consumerTenant
      note: The consumer version of the same product is one login away and carries none of the enterprise terms.
    - risk: riskSensitiveDataDisclosure
      at: consumerTenant
      note: Consumer retention and training terms apply to whatever lands here, with no administrative visibility of the account even existing.
    - risk: riskExcessiveDataHandling
      at: vendor->connectedSystems
      note: >
        Thousands of individually appropriate consents whose union nobody computed — the
        organisation's data path assembled one modal dialog at a time.
    - risk: riskPromptInjection
      at: vendor->connectedSystems
      note: >
        Content authored elsewhere arrives through connectors as conversation context — and the
        documented incident class is zero-click: a crafted mail or document steers the
        assistant into exfiltrating over rendered links, images, or the vendor's own
        service-side fetches, with the user never clicking anything.
    - risk: riskRogueActions
      at: vendor->connectedSystems
      note: >
        The agent modes act through the same standing grants retrieval uses. A steered
        assistant with a write-capable connector is an actor, not a search box — and the
        approval semantics live in the vendor's UI, not yours.
    - risk: riskStaleAgentIdentityBinding
      at: vendor
      note: The broker's OAuth grants outlive the conversation, the project and the employee who issued them.
    - risk: riskExcessiveDataHandlingDuringInference
      at: vendor
      note: What the vendor retains, retrieves and trains on per conversation is governed by configuration and contract, not by anything observable.
    - risk: riskInsecureModelOutput
      at: chatSurface
      note: Responses are unauthenticated content rendered into a browser.

  capabilities:
    - capability: capabilityAiTprm
      at: vendor
      note: >
        The whole of what a bought product allows: their controls, retention terms and tenancy
        are assured through assessment rather than drawn, because none of them are ours to
        operate or to verify from the outside.
    - capability: capabilityAgentRegistry
      at: vendor->connectedSystems
      note: >
        The connector inventory — which sources users have attached on their own authority.
        The union of those individual decisions is the organisation's real data path, and
        nobody chose it deliberately.
    - capability: capabilitySse
      at: edge
      note: >
        Inline inspection plus tenant restriction — the control doing most of the real work,
        because it covers both connectors' blind spots: uploads and the consumer product.
    - capability: capabilityIga
      at: edge
      note: Assert which tenant each user may reach and who is licensed; tenant restriction here is what makes the enterprise terms apply.
    - capability: capabilityAiDlp
      at: chatSurface->edge
      note: Inspect prompts and uploads in flight — the only record the upload path will ever produce.
    - capability: capabilityBrowserDetectionResponse
      at: chatSurface
      note: In-browser visibility of which tenant a session is in and what is being pasted — the vantage the vendor cannot offer.
    - capability: capabilityEgressControl
      at: edge->consumerTenant
      note: Block or log the consumer tenant at the edge; without enforcement the crossing simply succeeds.
    - capability: capabilityShadowAiDiscovery
      at: edge->consumerTenant
      note: Find the personal-account and competitor traffic that never touches the managed tenant — it is usually the larger flow.
    - capability: capabilityAiGovernancePlatform
      at: edge->vendor
      note: Own tenant configuration as living policy — retention, training opt-out, connector allowlist — re-reviewed every time the vendor ships a connector.
    - capability: capabilityNhiManagement
      at: vendor->connectedSystems
      note: Treat standing OAuth grants as non-human identities — inventoried, expiring, and revoked when the employee or project goes.
    - capability: capabilityHitlControls
      at: vendor->connectedSystems
      note: >
        Admin-gate the write-capable connectors and agent modes, and require per-action
        confirmation on writes — the vendor ships the toggles; leaving them at default is the
        decision not to use them.
    - capability: capabilityDataAccessGovernance
      at: connectedSystems
      note: Govern by classification which systems may be connected at all, so individual consent cannot outrun policy.
    - capability: capabilityAuditLogging
      at: govObservability
      note: Fuse the vendor's export with first-party edge and browser telemetry — only the combination covers uploads and the consumer tenant.
    - capability: capabilityPromptInjectionDefense
      at: vendor->connectedSystems
      note: Treat connector-retrieved content as untrusted input in policy and user guidance — the vendor's guardrails are the only inline control.
    - capability: capabilityDspm
      at: connectedSystems
      note: Know what sensitive data sits in the systems users are connecting, before the grants aggregate it.
    - capability: capabilityEncryptionKeyManagement
      at: edge->vendor
      note: >
        BYOK/CMEK wherever the vendor supports it — conversation stores and connector caches
        on keys the organisation can revoke, which turns contract language into a control.

flows:
  - id: F1
    title: A prompt leaves the company
    moves: The question, the pasted excerpt and the uploaded file.
    path: [employee->chatSurface, chatSurface->edge, edge->vendor]
    threats: [More context attached than the task needed, Material leaving under terms nobody read, Inspection impossible once the session is pinned TLS]
    controls: [capabilitySse, capabilityAiDlp, capabilityAiTprm]
    note: >
      The archetype in one line. Our tier is the last point at which what is leaving is still
      visible to something we run; past it, the agreement is the control.
  - id: F2
    title: The same client, the wrong tenant
    moves: The identical prompt, to a personal account carrying none of the enterprise terms.
    path: [edge->consumerTenant]
    threats: [Retention and training use that differ from the contract, A tenant nobody can enumerate or export, Shadow use that looks exactly like sanctioned use]
    controls: [capabilityIga, capabilityShadowAiDiscovery]
    note: >
      The control the archetype turns on. Same software, same interface, different login — and
      distinguishing the two at our tier is most of what governing a bought product means.
  - id: F3
    title: Connectors reach on the user's authority
    moves: Retrieval and actions against systems each employee authorised individually.
    path: [vendor->connectedSystems]
    threats: [A data path assembled from individual consents nobody reviewed, Vendor infrastructure exercising a user's access, No component of ours anywhere on the path]
    controls: [capabilityAgentRegistry, capabilityAuditLogging]
    note: >
      This path never touches our network, so no control we operate can sit on it. That is
      recorded as a deviation rather than papered over: the only levers are the connector
      policy in their tenant configuration and the inventory we keep ourselves.

scenarios:
  - title: A prompt with an attachment
    steps:
      - follow: employee->chatSurface
        note: A document is pasted into the chat — no connector, no grant, no record yet.
      - follow: chatSurface->edge
        note: Inspection happens here or nowhere.
      - follow: edge->vendor
        note: The traffic lands in the managed tenant, where retention and training terms actually apply.
      - follow: vendor->edge
        note: The response returns and is rendered as unauthenticated content.
  - title: One cookie away
    steps:
      - follow: employee->chatSurface
        note: The same browser, but a personal login to the same vendor's consumer product.
      - follow: chatSurface->edge
        note: The session looks almost identical; only tenant-aware inspection can tell the difference.
      - follow: edge->consumerTenant
        note: With tenant restriction, this is blocked or logged. Without it, corporate data leaves under consumer retention and training terms, invisibly.
  - title: A connector grant outlives its project
    steps:
      - follow: vendor->connectedSystems
        note: The broker keeps retrieving on a standing OAuth grant issued for a project that ended a year ago.
      - follow: edge->vendor
        note: Grant enumeration surfaces the aggregate — which systems, how many people, what classification — and stale grants are revoked.

deviations:
  - subject: No customer MCP gateway is drawn on the connector path
    reason: >
      The dominant connector class is user-authorised SaaS-to-SaaS — the vendor's broker
      calling another vendor's API on a grant the user issued — and no customer component can
      sit on that path. The organisation's MCP gateway governs the other class, custom
      connectors into org systems: that admission is carried here by the tenant connector
      allowlist and the grant pins rather than a block. Where custom connectors into org
      systems dominate a deployment, read the API/SDK managed runtime's drawing, which draws
      the gateway explicitly.

