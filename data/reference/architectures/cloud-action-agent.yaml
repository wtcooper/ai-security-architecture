  - title: "OWASP Agentic AI — threats and mitigations v1.1"
    url: https://genai.owasp.org/resource/agentic-ai-threats-and-mitigations/
  - title: "AWS Well-Architected Agentic AI Lens — bounded autonomy, human oversight, reliability"
    url: https://docs.aws.amazon.com/wellarchitected/latest/agentic-ai-lens/agentic-ai-lens.html
  - title: "CoSAI Shared Responsibility Framework V1.0 — autonomy levels L0-L5 and intervention tiers"
    url: https://www.coalitionforsecureai.org/wp-content/uploads/2026/05/CoSAI-Shared-Responsibility-Framework.pdf
  - title: "Microsoft Azure Architecture Center — AI agent orchestration patterns"
    url: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/guide/ai-agent-design-patterns
