            body:
              - In the system settings.json set security.auth.enforcedType (the enterprise page's example is
                "oauth-personal") so a mismatched cached credential triggers re-authentication rather than
                silently using an API key.
            url: https://geminicli.com/docs/cli/enterprise/
          - title: Licence and project
            body:
              - Company, school and Workspace accounts need a Gemini Code Assist licence, GOOGLE_CLOUD_PROJECT
                set, the Gemini for Cloud API enabled and IAM access on that project; without them Sign in
                with Google does not serve the CLI.
            url: https://geminicli.com/docs/get-started/authentication/
        evidence: []
        note: >-
          Capability scope changed: reassess this function. Retained configuration and evidence describe the
          former capability, not verified coverage of every replacement.


