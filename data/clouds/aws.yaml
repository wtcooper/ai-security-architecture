    why: "Anyone holding the create actions can otherwise stand up an agent nobody reviewed. A harness also needs CreateAgentRuntime and CreateMemory, so denying those closes the same door. Per-call overrides on InvokeHarness are a separate path, closed in the application that builds each request."
    mitigations: [cap-agent-tool-registry, D3-ACH]
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-security.html
    verified: "2026-11-24"
  - id: harnessGatewayToolsOnly
    name: Harness tools (agentcore_gateway) and per-invocation overrides
    where: AgentCore harness › tools on CreateHarness or UpdateHarness; your application, which builds each InvokeHarness request; the harness security group
    setVia: [apiCli, code]
    area: tools
