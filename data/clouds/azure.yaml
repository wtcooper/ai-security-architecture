        url: https://learn.microsoft.com/en-us/azure/api-management/genai-gateway-capabilities
    summary:
      - >-
        A Microsoft Agent Framework workflow — a supervisor and its specialists in one process on
        Azure Container Apps — made durable by the Durable Task extension, with Durable Task
        Scheduler journalling each step so a run survives crashes and waits days for an approval.
        Each agent has its own Entra agent identity, and every model and tool call crosses API
        Management. Foundry Agent Service's connected agents are the managed alternative Azure's
        guide names for simpler, nondeterministic chains.
    bindings:
      - { block: events, service: Azure Service Bus queues and Event Grid, note: "Starts runs, and carries the operator's response that resumes a suspended step." }
      - { block: harness, service: Your workflow on Azure Container Apps, builtWith: Microsoft Agent Framework, note: "Self-hosted Durable Extension; Azure Functions (Flex Consumption) is the serverless host for the same code." }
      - { block: localTools, service: Container Apps dynamic sessions (code interpreter) }
