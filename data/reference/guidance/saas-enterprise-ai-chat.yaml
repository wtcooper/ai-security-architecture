# Controls guidance for the enterprise AI chat archetype. Audience: admins, architects and
# security teams. This is a use pattern: the product is the vendor's, so the controls are the
# tenant configuration you author plus the inspection you run independently of the vendor.
# The build's derivation check fails this document if its cited capabilities stop being pinned.
archetype: archEnterpriseAiChat
mode: use
status: draft
attribution: >-
  Authored in this repository. Pattern-level by design; incidents are cited, vendors are not
  named in the items.

overview:
  - >-
    The organisation's exposure here is a sum nobody computes by default: thousands of
    individually reasonable connector grants, a file-upload path no connector governance
    sees, and a consumer version of the same product one session cookie away. The controls
    split cleanly into two halves — the vendor tenant you configure, and the edge and browser
    telemetry you own — and the second half matters more, because it covers the two paths the
    vendor's console cannot see.
  - >-
    One material change to re-review against: these products are agents now. The same
    standing grants that powered retrieval also carry write actions — mail sent, files
    changed, tickets moved — through vendor-side agent modes, scheduled tasks and code
    execution. The documented incident class is zero-click: content in a connected mailbox or
    drive steers the assistant into exfiltrating without the user clicking anything.

items:
  - title: Restrict the tenant at the edge, or the enterprise terms are optional
    capabilities: [capabilitySse, capabilityIga, capabilityEgressControl]
    body:
      - >-
        Everything the enterprise agreement promises — retention, training opt-out, audit
        export — applies only to traffic that reaches the managed tenant. Tenant restriction
        enforced at the secure edge is what stops the consumer product being an alternative;
        without it, the crossing simply succeeds and corporate data leaves under consumer
        terms, invisibly. Identity establishes who is licensed and which tenant they may
        reach; the edge blocks or logs everything else.

  - title: Inspect the upload path, because nothing else can
    capabilities: [capabilityAiDlp, capabilityBrowserDetectionResponse]
    body:
      - >-
        A pasted document crosses the boundary with no connector, no grant and no record —
        every control that watches connectors misses it entirely. Inline inspection of
        prompts and uploads at the edge, plus in-browser visibility of which tenant a session
        is in and what is being pasted, are the only records this path will ever produce.
        Weight them accordingly: they carry more of the archetype's real control than the
        vendor's admin surface does.

  - title: Gate the agent modes and write-capable connectors deliberately
    capabilities: [capabilityAiGovernancePlatform, capabilityHitlControls, capabilityPromptInjectionDefense]
    body:
      - >-
        Own tenant configuration as living policy, re-reviewed every time the vendor ships a
        connector or an agent capability — the default for new ones is rarely off. Write
        actions get the strictest treatment the vendor offers: admin-gated per app and per
        action, with confirmation required on writes; the vendor ships the toggles, and
        leaving them at default is the decision not to use them. Treat connector-retrieved
        content as untrusted in policy and user guidance — the vendor's guardrails are the
        only inline control, and the zero-click incident record says they are not sufficient
        alone.

  - title: Treat grants as identities, and classify before connecting
    capabilities: [capabilityNhiManagement, capabilityDataAccessGovernance, capabilityDspm]
    body:
      - >-
        Standing OAuth grants are non-human identities: inventoried, expiring, revoked when
        the employee or project goes — the broker keeps calling on grants issued for projects
        that ended. Govern by classification which systems may be connected at all, so
        individual consent cannot outrun policy, and know what sensitive data sits inside
        connector reach before the grants aggregate it — an assistant makes pre-existing
        oversharing instantly discoverable.

  - title: Fuse the vendor's audit with your own, and hunt the shadow traffic
    capabilities: [capabilityAuditLogging, capabilityShadowAiDiscovery]
    body:
      - >-
        The vendor's export covers the managed tenant; your edge and browser telemetry cover
        the uploads and the consumer product it will never see — only the fused record
        answers what actually left. Run discovery for personal-account and competitor traffic
        independently of the vendor: it is usually the larger flow, and it is the population
        the sanctioned tenant exists to absorb.

sources:
  - title: "EchoLeak (CVE-2025-32711) — zero-click prompt-injection exfiltration through an enterprise copilot"
    url: https://thehackernews.com/2025/06/zero-click-ai-vulnerability-exposes.html
  - title: "ShadowLeak — service-side zero-click exfiltration via a chat agent's connectors"
    url: https://thehackernews.com/2025/09/shadowleak-zero-click-flaw-leaks-gmail.html
  - title: "CoSAI Shared Responsibility Framework V1.0 — AI-enabled SaaS operating model"
    url: https://www.coalitionforsecureai.org/wp-content/uploads/2026/05/CoSAI-Shared-Responsibility-Framework.pdf
