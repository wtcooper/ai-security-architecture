    recommended: "ENROLLED_SECOND_FACTORS or SECURE_KEY, a maxAge such as 3600s, and MINIMUM so no app can weaken it. It works in browsers only and not for Workforce Identity Federation or external identities; require MFA in your identity provider for those."
