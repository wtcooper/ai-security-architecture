    verified: "2026-11-21"
  - id: githubAgentAppToken
    name: "Repository permissions and installation access token (repositories, permissions)"
    product: "GitHub"
    where: "GitHub › Organization settings › Developer settings › GitHub Apps › (app) › Edit › Permissions & events; repository access under Third-party Access › GitHub Apps › Configure; token minted per build"
    setVia: [adminConsole, apiCli]
    area: identity
    default: "A token gets every repository and permission of the installation"
    recommended: "Grant Contents and Pull requests read and write and Metadata read; never Workflows, Administration or Actions. Mint each build's token for its one repository; tokens expire after one hour."
    value: "One repository; Contents and PRs; no Workflows"
    why: "The agent can push a branch and open a pull request and nothing more: it cannot edit workflow files, change settings or reach another app's repository. A firewall rule that admits github.com admits every repository on it, so this token, not the network, limits where a push goes."
    mitigations: [AML.M0028]
    url: https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/generating-an-installation-access-token-for-a-github-app
    verified: "2026-11-24"
  - id: githubDefaultBranchRuleset
    name: "Rulesets: Require a pull request before merging, Require status checks to pass, Restrict updates"
    product: "GitHub"
    where: "GitHub › Organization › Settings › Rulesets › branch ruleset on the default branch of every app repository; bypass list"
    setVia: [adminConsole]
    area: tools
    default: "No ruleset; anyone with write access can push to the default branch"
    recommended: "Require a pull request and the pipeline's status checks, block force pushes and restrict deletions on the default branch; the bypass list holds only the platform's merge identity, never the agent's app."
    value: "PR and checks required; agent not on bypass list"
    why: "Whatever the agent is talked into stays on a branch; only the platform's own identity, after the checks, can change what the app is built from."
    mitigations: [AML.M0028]
    url: https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/available-rules-for-rulesets
    verified: "2026-11-21"
  - id: githubPushProtection
    name: "Push protection (GitHub Secret Protection) with delegated bypass"
    product: "GitHub"
    where: "GitHub › Organization › Settings › Advanced Security › security configuration › Secret Protection › Push protection; delegated bypass reviewers"
    setVia: [adminConsole]
    area: data
    default: "Off; once on, anyone with write access can bypass by giving a reason"
    recommended: "Apply a security configuration to every app repository with Secret Protection and push protection on, and turn on delegated bypass so only the platform security team can approve a push that carries a secret."
    value: "On, bypass by security team only"
    why: "Agents paste keys into code. A push that carries one is refused before it reaches the repository, and the agent cannot wave it through."
    mitigations: [D3-CH]
    url: https://docs.github.com/en/code-security/secret-scanning/introduction/about-push-protection
    verified: "2026-11-21"
  - id: codeArtifactAdmission
    name: "External connection on an admission repository only, with version age gating"
    product: "CodeArtifact"
    where: "AWS CodeArtifact › domain › sandbox repository (no external connection); admission repository with the external connection; CopyPackageVersions by the admission pipeline's role"
    setVia: [apiCli, code]
    area: tools
    default: "A repository with an external connection fetches any public package on first request"
    recommended: "Give the repository that builds, jobs and rollouts read no external connection. An admission job reads the upstream publish time CodeArtifact keeps, rejects versions newer than 7 days, scans with Inspector and only then copies the version across."
    value: "No external connection; 7-day quarantine"
    why: "A repository with an external connection fetches any public package the moment a client asks, and CodeArtifact scans nothing. Agents invent package names that attackers then register, so a version becomes installable only after it has aged and been checked."
    mitigations: [D3-FA]
    url: https://docs.aws.amazon.com/codeartifact/latest/ug/package-version-age-gating.html
    verified: "2026-11-24"
  - id: codeBuildProjectBuildspec
