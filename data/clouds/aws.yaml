    # >>> hosting options (compared against the vendor's pages; one is the mapping itself)
    hosting:
      - id: lambdaDurable
        kind: runtime
        name: "AWS Lambda durable functions"
        url: https://docs.aws.amazon.com/lambda/latest/dg/durable-functions.html
        asOf: "2026-11"
        mapped: true
        compare:
          runs: "Your code runs the loop in a Lambda function wrapped by the durable execution SDK, which checkpoints each step and replays the handler after an interruption."
          patching: "Lambda patches the OS and managed runtimes automatically; for functions deployed as container images you rebuild from the latest base image and redeploy."
          data: "Processed in Lambda execution environments; Lambda stores step results as checkpoints, encrypted at rest (your KMS key if set) and kept up to 90 days after the run."
          network: "A function outside a VPC has internet access; a VPC configuration attaches it to your subnets and security groups, with internet only through a NAT gateway."
          identity: "The function's IAM execution role, which Lambda assumes; it must also allow lambda:CheckpointDurableExecution and lambda:GetDurableExecutionState."
          accepts: "Code on a managed or custom Lambda runtime or OCI image, using an AWS durable SDK (Node.js, Python, Java, .NET, Go) or your own, deterministic on replay."
          workload: "Async executions run up to one year and suspend without charge on waits and callbacks; synchronous and event source mapping runs end at 15 minutes by default."
          portability: "Steps, waits and callbacks are written against the AWS durable execution SDK and Lambda's checkpoint API, so moving off means rewriting the orchestration."
          effort: "You own function code, versions and aliases, replay-safe changes, dead-letter queues and alarms; Lambda runs scaling, checkpoint storage and recovery."
          fits: "AWS guidance: use it for code-first workflows centred on Lambda, including AI workflows that chain model calls and wait for human review."
        sources:
          - https://docs.aws.amazon.com/lambda/latest/dg/durable-functions.html
          - https://docs.aws.amazon.com/lambda/latest/dg/durable-step-functions.html
          - https://docs.aws.amazon.com/lambda/latest/dg/durable-security.html
          - https://docs.aws.amazon.com/lambda/latest/dg/durable-encryption.html
          - https://docs.aws.amazon.com/lambda/latest/dg/durable-configuration.html
          - https://docs.aws.amazon.com/lambda/latest/dg/durable-invoking.html
          - https://docs.aws.amazon.com/lambda/latest/dg/durable-invoking-esm.html
          - https://docs.aws.amazon.com/lambda/latest/dg/durable-supported-runtimes.html
          - https://docs.aws.amazon.com/lambda/latest/dg/durable-best-practices.html
          - https://docs.aws.amazon.com/lambda/latest/dg/durable-examples.html
          - https://docs.aws.amazon.com/lambda/latest/dg/lambda-runtimes.html
          - https://docs.aws.amazon.com/lambda/latest/dg/configuration-vpc.html
          - https://docs.aws.amazon.com/lambda/latest/dg/configuration-vpc-internet.html
          - https://docs.aws.amazon.com/durable-execution/sdk-reference/languages/go/
      - id: agentCoreRuntime
        kind: runtime
        name: "Amazon Bedrock AgentCore Runtime"
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agents-tools-runtime.html
        asOf: "2026-11"
        compare:
          runs: "Your code runs the loop, in any framework or none, packaged as a container image or code zip that AWS hosts with one microVM per session."
          patching: "AWS patches the host, the OS kernel and, for direct code deployments, the language runtime; you rebuild container images from patched base images."
          data: "Prompts and tool results are processed in a per-session microVM that AWS runs and ends with the session; lasting state goes to AgentCore Memory or mounted storage."
          network: "Network mode is PUBLIC or VPC; VPC mode puts network interfaces in your subnets under your security groups, with no internet route unless you add a NAT gateway."
          identity: "An IAM execution role that AgentCore Runtime assumes, plus a workload identity in AgentCore Identity; callers are checked by IAM SigV4 or an OAuth JWT authoriser."
          accepts: "Any framework or custom code, such as Strands Agents, LangGraph, CrewAI, Google ADK or OpenAI Agents SDK, serving HTTP, MCP, A2A or AG-UI from ARM64 containers."
          workload: "Sessions run up to 8 hours on microVMs or 14 days on Instances and end after 15 idle minutes by default; schedules and events arrive through a caller that invokes it."
          portability: "The agent is a container serving /invocations and /ping, so it can run elsewhere; sessions and inbound auth need replacing, and AgentCore services stay callable."
          effort: "You own agent code, image rebuilds, IAM and resource policies, session-to-user mapping, input validation and VPC settings; AWS runs scaling, isolation and patching."
          fits: "AWS guidance: the code-defined path when you need custom orchestration or multi-agent patterns in any framework; microVMs are called the best starting point."
        sources:
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agents-tools-runtime.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-how-it-works.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-instances-how-it-works.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-security-best-practices.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-vpc.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-permissions.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-long-run.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-lifecycle-settings.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-http-protocol-contract.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/using-any-agent-framework.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-vs-runtime.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-filesystem-configurations.html
          - https://docs.aws.amazon.com/bedrock/latest/userguide/agents-classic-maintenance-mode.html
          - https://docs.aws.amazon.com/decision-guides/latest/decision-guides/genai-guide.html
          - https://aws.amazon.com/bedrock/agentcore/faqs/
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/bedrock-agentcore-limits.html
          - https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-custom-bus-universal-targets.html
          - https://docs.aws.amazon.com/lambda/latest/dg/durable-invoking-esm.html
        summary: "The supervisor and its specialists run as one process, in any framework, in an AgentCore Runtime session, started by a Lambda function that EventBridge and SQS invoke. Runtime adds a microVM per run and async jobs past a 15-minute request, but no checkpoint log or replay: a session's compute ends at 8 hours on microVMs (14 days on Instances), so your code saves step state to AgentCore Memory or session storage and resumes the run when the approval event arrives."
        bindings:
          - { block: events, service: "Amazon EventBridge, SQS and AWS Lambda", note: "An ingress function validates the event and calls InvokeAgentRuntime with the run's session ID; rule targets list no AgentCore Runtime target.", url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-invoke-agent.html }
          - { block: harness, service: "Your agents on AgentCore Runtime", note: "One runtime session per run, in its own microVM; idle timeout 15 minutes and maximum lifetime 8 hours by default.", url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agents-tools-runtime.html }
          - { block: orchestration, service: "Your supervisor agent, checkpointing in your code", note: "No durable steps: the supervisor writes each step's result to memory or session storage and reloads it when the run is invoked again.", url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-how-it-works.html, watch: [{ text: "Runtime session state is ephemeral and there is no step journal: if the microVM ends mid-run, only what your code already wrote to AgentCore Memory or session storage survives, and a step that had started can run twice unless it is idempotent.", url: "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-how-it-works.html" }] }
          - { block: state, service: "AgentCore Memory and session storage", note: "Session storage (preview) keeps a session's files across stop and resume; AgentCore Memory holds events. Neither journals or replays steps.", url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-filesystem-configurations.html }
        dropSettings: [lambdaInvokePolicy, durableConfig, durableCallbackApproval, lambdaVpcConfig, durableStopExecution]
        addSettings: [runtimeResourcePolicy, runtimeExecutionRole, runtimeVpcMode, runtimeStopSession, strandsInterrupts, runtimeLifecycleConfig]
        dropDifferences: [events->harness, operator->events]
        alsoNeeded:
          - service: "AWS Lambda ingress function"
            role: ingress
            why: "EventBridge started the durable function directly, SQS for 15 minutes at most; a runtime needs InvokeAgentRuntime."
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-invoke-agent.html
          - service: "AgentCore Memory with the Strands Agents SDK integration"
            role: other
            why: "Holds the conversation and step state that Lambda's checkpoint log held."
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/strands-sdk-memory.html
          - service: "Amazon ECR repository (container deployments)"
            role: registry
            why: "A runtime deployed as a container pulls an ARM64 image from Amazon ECR; direct code deployment avoids it."
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-how-it-works.html
        quickstart:
          - title: "Get started with AgentCore Runtime using the AgentCore CLI"
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-get-started-cli.html
          - title: "Handle asynchronous and long running agents with AgentCore Runtime"
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-long-run.html
          - title: "Configure AgentCore lifecycle settings"
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-lifecycle-settings.html
      - id: eks
        kind: cluster
        name: "Amazon Elastic Kubernetes Service (Amazon EKS)"
        url: https://docs.aws.amazon.com/eks/latest/userguide/what-is-eks.html
        asOf: "2026-11"
        compare:
          runs: "Your code runs the loop in containers you build and deploy as Kubernetes workloads; EKS runs the control plane and schedules the pods."
          patching: "AWS patches the control plane; you patch node operating systems and images, unless EKS Auto Mode is on, where AWS patches nodes and replaces them within 21 days."
          data: "Prompts, tool results and state are processed in pods on EC2 nodes in your account and VPC; lasting state sits in whichever stores you attach."
          network: "Pods get VPC addresses with no traffic restriction by default; Kubernetes network policies, security groups for Pods and your VPC routing control outbound traffic."
          identity: "An IAM role bound to the pod's Kubernetes service account by an EKS Pod Identity association, with credentials served by the Pod Identity Agent on the node."
          accepts: "Any framework or language that runs in a container; an AWS example of agents on EKS Auto Mode uses the Strands Agents SDK."
          workload: "Pods run as Deployments or Jobs with no session limit, though Auto Mode replaces nodes within 21 days; HPA or KEDA scale them, and durable waits need an engine you add."
          portability: "The agent ships as containers on the Kubernetes API, which AWS notes eases moves across clouds and on premises; IAM, load balancer and add-on bindings change."
          effort: "You operate cluster version upgrades, add-ons, node capacity, ingress, network policy, autoscaling and telemetry; EKS Auto Mode takes over nodes and core add-ons."
          fits: "AWS guidance: choose EKS for the Kubernetes API and ecosystem, portability across clouds and on premises, or existing Kubernetes skills and tooling."
        sources:
          - https://docs.aws.amazon.com/eks/latest/userguide/what-is-eks.html
          - https://docs.aws.amazon.com/eks/latest/userguide/security.html
          - https://docs.aws.amazon.com/eks/latest/userguide/automode.html
