        kind: cluster
        name: "Azure Kubernetes Service (AKS)"
        url: https://learn.microsoft.com/en-us/azure/aks/what-is-aks
        asOf: "2026-11"
        compare:
          agentLoop: "Your code runs the loop in pods that you deploy; AKS runs the Kubernetes control plane and takes no part in the loop."
          patching: "Microsoft publishes node images and Kubernetes versions, which you apply or schedule on AKS Standard and Azure applies on AKS Automatic; you rebuild your own image."
          data: "Prompts, tool results and state stay in your pods and the stores you choose; nodes, disks and logs sit in your subscription, and Microsoft Support has limited access."
          network: "Nodes sit in your virtual network; outbound type, Azure Firewall routes, network policies and FQDN filtering are yours to configure, and outbound is open by default."
          identity: "Microsoft Entra Workload ID: a Kubernetes service account federated to a managed identity through the cluster's OIDC issuer, which you enable on AKS Standard."
          framework: "Any Kubernetes workload: any language or framework in a container image, on Linux or Windows node pools, with direct access to the Kubernetes API."
          longRunning: "Deployments run continuously, Kubernetes Jobs and CronJobs cover run-to-completion and scheduled work, and the KEDA add-on starts work from events such as queue messages."
          portability: "The agent is a container image deployed through the Kubernetes API of a CNCF-certified service; workload identity, AKS add-ons and Azure networking are Azure-specific."
          effort: "Your team operates cluster configuration, node pools, upgrades, network policy, add-ons and the workloads; AKS Automatic moves node management and upgrades to Azure."
          fits: "Microsoft's guidance: when you need the Kubernetes API, network policy between colocated workloads or several workloads on one host, and have the skills to run a cluster."
        sources:
          - https://learn.microsoft.com/en-us/azure/aks/what-is-aks
          - https://learn.microsoft.com/en-us/azure/aks/intro-aks-automatic
          - https://learn.microsoft.com/en-us/azure/aks/support-policies
          - https://learn.microsoft.com/en-us/azure/aks/workload-identity-overview
          - https://learn.microsoft.com/en-us/azure/aks/egress-outboundtype
          - https://learn.microsoft.com/en-us/azure/aks/outbound-rules-control-egress
          - https://learn.microsoft.com/en-us/azure/aks/use-network-policies
          - https://learn.microsoft.com/en-us/azure/aks/container-network-security-fqdn-filtering-concepts
          - https://learn.microsoft.com/en-us/azure/aks/keda-about
          - https://learn.microsoft.com/en-us/azure/aks/auto-upgrade-node-os-image
          - https://learn.microsoft.com/en-us/azure/aks/keda-workload-identity
          - https://learn.microsoft.com/en-us/azure/service-bus-messaging/authenticate-application
          - https://learn.microsoft.com/en-us/azure/container-apps/compare-options
          - https://learn.microsoft.com/en-us/azure/architecture/guide/choose-azure-container-service
          - https://learn.microsoft.com/en-us/azure/architecture/guide/container-service-general-considerations
          - https://learn.microsoft.com/en-us/azure/architecture/best-practices/background-jobs
          - https://learn.microsoft.com/en-us/azure/aks/agent-sandbox-cluster-extension
          - https://learn.microsoft.com/en-us/agent-framework/hosting/durable-extension
        summary: "The Agent Framework workflow runs as a self-hosted Durable Task worker in pods on AKS, the host Microsoft's Durable Task guide assigns to the standalone Durable Task SDKs. Durable Task Scheduler stays the managed journal outside the cluster, reached with workload identity; model-written code runs in Kata-isolated sandbox pods. On AKS Standard the builder carries node and Kubernetes upgrades, identity federation, worker scaling, network policy, outbound routing, logging and rollouts."
        bindings:
          - { block: harness, service: "Your workflow in pods on Azure Kubernetes Service", builtWith: "Microsoft Agent Framework", note: "Self-hosted Durable Extension (preview): a Durable Task worker in your pods connects to Durable Task Scheduler. Microsoft's hosting table puts AKS on the standalone Durable Task SDKs.", url: https://learn.microsoft.com/en-us/azure/durable-task/common/choose-orchestration-framework }
          - { block: localTools, service: "AKS Pod Sandboxing (Kata Containers)", note: "Each sandbox pod runs in its own Kata pod VM on an Azure Linux node pool. The Agent Sandbox extension (preview) adds a Sandbox resource per session but needs the preview v2 runtime and AKS Standard.", url: https://learn.microsoft.com/en-us/azure/aks/agent-sandbox-cluster-extension }
        dropSettings: [agentManagedIdentity, sessionPoolEgress, containerAppsTrafficSplit]
        addSettings: [aksWorkloadIdentity, aksPodSandboxing, aksNetworkPolicy, aksFqdnFiltering, aksContainerLogs, aksCanaryRollout, aksImdsRestriction, aksNodeOsUpgradeChannel, aksKedaTriggerAuth, aksDisableLocalAccounts, entraSidecarWorkloadIdentity]
        differences:
          - at: harness->gateway
            text: "By default an AKS cluster has unrestricted outbound internet access, so the workflow's pods can reach hosts other than the gateway. The drawing holds only once the outbound type is userDefinedRouting through Azure Firewall, and the firewall must then also allow the outbound network rules and FQDNs that the cluster itself requires."
            url: https://learn.microsoft.com/en-us/azure/aks/outbound-rules-control-egress
          - at: harness
            text: "By default every pod can reach the node's metadata service at 169.254.169.254, which Microsoft says can be exploited to obtain tokens, so the workflow is not limited to its own workload identity. IMDS restriction is in preview and excludes add-ons such as Container Insights, Azure Policy and application routing; the alternative is a network policy in each namespace."
            url: https://learn.microsoft.com/en-us/azure/aks/imds-restriction
          - at: orchestration->state
            text: "Durable Task Scheduler still journals every step, and Microsoft's hosting guide puts AKS on the standalone Durable Task SDKs. The scheduler's autoscaler is documented for Container Apps only: on AKS you manage worker scaling yourself or with KEDA, and the workers reach the scheduler through a workload identity that you federate and grant a Durable Task role."
            url: https://learn.microsoft.com/en-us/azure/durable-task/common/choose-orchestration-framework
          - at: localTools
            text: "Pod Sandboxing gives each sandbox pod its own VM and guest kernel, but Microsoft states that this boundary is compute isolation only. A Container Apps session blocks outbound requests by default; a pod on AKS can send and receive traffic without limitation until a network policy engine and a default-deny policy for the sandbox namespace are in place."
            url: https://learn.microsoft.com/en-us/azure/aks/concepts-pod-sandboxing
          - at: events
            text: "The Kubernetes API is a second way to start, change or stop a run: anyone who can edit workloads in the namespace bypasses the queue. Local accounts are enabled by default and Microsoft describes their admin access as a non-auditable backdoor, so the single entry point holds only with local accounts disabled and Microsoft Entra ID authorisation on the cluster."
            url: https://learn.microsoft.com/en-us/azure/aks/local-accounts
        alsoNeeded:
          - service: "Microsoft Entra Workload ID and the cluster OIDC issuer"
            role: identity
            why: "Container Apps attaches a managed identity to the app. On AKS Standard you enable the OIDC issuer and workload identity, then federate a Kubernetes service account to a user-assigned identity; AKS Automatic preconfigures the cluster side."
            url: https://learn.microsoft.com/en-us/azure/aks/workload-identity-overview
          - service: "Microsoft Entra ID access to the Kubernetes API"
            role: identity
            why: "Container Apps is managed only through Azure Resource Manager. AKS adds a Kubernetes API server whose local accounts are enabled by default, so you disable them and control access with Microsoft Entra ID."
            url: https://learn.microsoft.com/en-us/azure/aks/local-accounts
          - service: "KEDA add-on"
            role: other
            why: "Container Apps has KEDA scale rules built in, including one for Durable Task Scheduler. On AKS you manage worker scaling yourself or enable the managed KEDA add-on and write its scaling objects; AKS Automatic preconfigures the add-on."
            url: https://learn.microsoft.com/en-us/azure/aks/keda-about
          - service: "Network policy engine (Azure CNI Powered by Cilium)"
            role: network
            why: "A Container Apps environment is the network boundary and exposes no Kubernetes API. On AKS all pods can send and receive traffic without limitation until you have a policy engine and write default-deny policies per namespace."
            url: https://learn.microsoft.com/en-us/azure/aks/use-network-policies
          - service: "Outbound type and route table for the node subnet"
            role: network
            why: "AKS Standard uses a Standard Load Balancer for egress by default, AKS Automatic a managed NAT gateway. Azure Firewall egress means outbound type userDefinedRouting, a route table and the cluster's required FQDN rules."
            url: https://learn.microsoft.com/en-us/azure/aks/egress-outboundtype
          - service: "Azure Monitor container logging and managed Prometheus"
            role: logging
            why: "Container Apps stores console and system logs in Log Analytics by default. On AKS Standard, Container insights and managed Prometheus are optional features you enable for the cluster; AKS Automatic turns them on by default."
            url: https://learn.microsoft.com/en-us/azure/azure-monitor/containers/kubernetes-monitoring-enable
          - service: "Azure Key Vault provider for Secrets Store CSI Driver"
            role: secrets
            why: "Container Apps has a built-in secret store that can reference Key Vault. On AKS the CSI driver add-on mounts Key Vault secrets, keys and certificates into pods."
            url: https://learn.microsoft.com/en-us/azure/aks/csi-secrets-store-driver
          - service: "Azure Container Registry attached to the cluster"
            role: registry
            why: "Container Apps pulls images with a managed identity set on the app. On AKS the kubelet's managed identity needs the AcrPull role on the registry, which az aks --attach-acr assigns."
            url: https://learn.microsoft.com/en-us/azure/aks/cluster-container-registry-integration
          - service: "Node pools with cluster and node OS auto-upgrade"
            role: other
            why: "Container Apps patches its hosts and control plane. On AKS Standard you size the node pools and apply or schedule Kubernetes version and node image upgrades; AKS Automatic manages nodes and upgrades for you."
            url: https://learn.microsoft.com/en-us/azure/aks/auto-upgrade-node-os-image
        quickstart:
          - title: "Quickstart: Host a .NET Durable Task SDK App on AKS"
            url: https://learn.microsoft.com/en-us/azure/durable-task/sdks/quickstart-aks-durable-task-scheduler
          - title: "Durable Extension (Microsoft Agent Framework)"
            url: https://learn.microsoft.com/en-us/agent-framework/hosting/durable-extension
          - title: "Limit network traffic with Azure Firewall in Azure Kubernetes Service (AKS)"
            url: https://learn.microsoft.com/en-us/azure/aks/limit-egress-traffic
      - id: foundryAgentService
        kind: managed
        name: "Microsoft Foundry Agent Service"
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
        asOf: "2026-11"
        pattern: archManagedAgentRuntime
        tool: toolFoundryAgentService
        compare:
          agentLoop: "Microsoft runs the loop for prompt agents; for hosted agents your code runs the loop in a container on Foundry-managed compute, one VM-isolated sandbox per session."
          patching: "Microsoft operates the runtime and its compute; a prompt agent has no code or container to maintain, while a hosted agent's code and container image remain yours."
          data: "Conversations, agent definitions and files sit in Microsoft storage or your own Cosmos DB, Storage and AI Search; hosted session files stay Microsoft-managed."
          network: "Public by default; add a private endpoint inbound any time; set your own or a managed virtual network outbound at account creation only; hosted agents add egress rules."
          identity: "A Microsoft Entra agent identity that Foundry creates and manages for each agent, with no secret for you to hold; it has no resource permissions until you assign roles."
          framework: "Prompt agents are configuration only; hosted agents take Python or C# code built with Agent Framework, LangGraph, OpenAI Agents SDK, Anthropic Agent SDK or your own code."
          longRunning: "Routines start an agent on a timer, a schedule or a GitHub or Teams event; hosted agents add background mode, crash recovery and session state kept through idle periods."
          portability: "A prompt agent is a definition held in Foundry; a hosted agent is your own container, but its endpoint, identity, conversations and Toolbox tools are Foundry services."
          effort: "Your team operates agent definitions or agent code and the Foundry configuration; Microsoft runs the container, scaling, session lifecycle and platform integration."
          fits: "Microsoft's guidance: when you want Microsoft-managed agent hosting; prompt agents without custom orchestration, hosted agents when the agent calls into your own code."
        sources:
          - https://learn.microsoft.com/en-us/azure/foundry/agents/overview
          - https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/prompt-agents
          - https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/hosted-agents
          - https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/routines
          - https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/long-running-agent-resilience
          - https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/networking-options
          - https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/virtual-networks
          - https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/add-hosted-agent-guardrails
          - https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/agent-identity
          - https://learn.microsoft.com/en-us/azure/foundry/agents/environment-setup
          - https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/standard-agent-setup
          - https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/agents/data-privacy-security
          - https://learn.microsoft.com/en-us/agent-framework/hosting/
          - https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/baseline-microsoft-foundry-chat
          - https://learn.microsoft.com/en-us/azure/foundry/concepts/customer-managed-keys
          - https://learn.microsoft.com/en-us/azure/foundry/how-to/configure-private-link
        offers:
          - name: "Prompt agents"
            what: "Agents defined entirely by configuration (model, instructions, tools) in the Foundry portal, SDK, REST API or Azure Developer CLI, which Foundry runs with no code or compute for you to manage."
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/prompt-agents
          - name: "Prompt agents with the Microsoft Copilot harness (preview)"
            what: "An optional Foundry-operated harness, chosen when the prompt agent is created, that adds built-in file-system, shell, web-fetch and subagent tools for multi-step work; in public preview."
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/use-tools-skills-copilot-harness
          - name: "Voice-based prompt agents"
            what: "Real-time spoken agents defined by configuration, with Foundry managing the voice orchestration through Voice Live over a WebSocket; generally available, with GPT-Live, SIP, campaigns and some other features in preview."
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/quickstarts/prompt-voice-agent
          - name: "Hosted agents"
            what: "Your own Python or C# agent code, in any framework, shipped as a container image or a .zip of source that Foundry builds, and run by Foundry in a per-session VM-isolated sandbox with a managed endpoint and a dedicated Entra agent identity; generally available."
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/hosted-agents
          - name: "Responses API (ephemeral agents)"
            what: "Agent code you run elsewhere calls the Responses API on the Foundry project endpoint for models and tools, with the agent definition kept in your application and no agent resource saved in Foundry."
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/quickstarts/responses-api
          - name: "Routines"
            what: "A project-level trigger with one action: a one-time timer, a recurring schedule, or a GitHub issue or Teams message event invokes one prompt agent or hosted agent; customer-managed keys are not supported and the C# SDK support is in beta packages."
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/routines
          - name: "Workflows (preview, retiring 1 December 2026)"
            what: "A visual, declarative builder in the portal that sequences several agents with branching and human-in-the-loop steps; it is in preview and Microsoft retires it on 1 December 2026, pointing new work to Microsoft Agent Framework workflows deployed as hosted agents or to Azure Logic Apps."
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/workflow
          - name: "Agent-to-agent (A2A) endpoints"
            what: "A Foundry agent can be exposed as an A2A endpoint that other agents discover and call, and can call remote A2A agents as a tool; A2A protocol version 1.0 is generally available and version 0.3 is in preview."
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/enable-agent-to-agent-endpoint
          - name: "Multi-agent orchestration in the Responses API (preview)"
            what: "A model creates and coordinates subagents in parallel within one response and combines their work; documented under Azure OpenAI in Foundry, in preview and limited to GPT-5.6 models."
            url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/responses-multi-agent
          - name: "Autopilots"
            what: "Agents with their own Entra agent user account (mailbox, Teams presence, manager) that act as themselves in Microsoft 365, created as instances of a blueprint published from a hosted agent; the quickstart requires enrolment in the Microsoft Agent 365 Frontier preview programme."
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/autopilot-overview
          - name: "Microsoft Foundry Canvas (preview)"
            what: "A GitHub Copilot app extension that opens a side panel for creating, configuring, testing and deploying hosted agents and harness-based prompt agents from a prompt gallery; in preview."
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/foundry-canvas
