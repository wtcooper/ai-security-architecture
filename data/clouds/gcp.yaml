  - architecture: archAgentSandbox
    asOf: "2026-10"
    # >>> checked against the vendor's documentation
    verified: "2026-11-18"
    sources:
      graders: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/workload-separation
      platform: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/workload-identity
      orchestrator: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/agent-sandbox
      sandbox: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/machine-learning/agent-sandbox
      storage: https://docs.cloud.google.com/storage/docs/uniform-bucket-level-access
      inference: https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/serve-gemma-gpu-vllm
      registry: https://docs.cloud.google.com/artifact-registry/docs/repositories/virtual-overview
      sources: https://docs.cloud.google.com/artifact-registry/docs/repositories/remote-overview
    differences:
      - at: localTools->offlineWeb
        text: "Agent Sandbox's default network policy lets a sandbox reach the public internet; it blocks only private ranges, cluster DNS and the metadata server. To keep rollouts off the live web, define your own policy in the SandboxTemplate that denies everything except named peers."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/agent-sandbox
      - at: harness->inference
        text: "FQDN network policies cannot allow traffic to in-cluster Services. The vLLM API and the offline web are in the cluster, so allow them with label-based NetworkPolicy; FQDN policies help only for names outside the cluster, such as Artifact Registry."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/fqdn-network-policies
      - at: localTools->registry
        text: "Artifact Registry is a Google API outside the cluster. Allowing its name also allows every other service on the same shared Google addresses, and DNS lookups are never blocked. Add VPC Service Controls so that route cannot carry data elsewhere."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/fqdn-network-policies
      - at: localTools->platform
        text: "Logs need no network path from the sandbox: an agent on each node reads container output and writes it with the node's service account. The metadata server is blocked by Agent Sandbox's default policy and must be allowed before Workload Identity works."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-logs
      - at: sandbox
        text: "gVisor sandboxes cannot read node metadata, but microVM sandboxes can unless you add a network policy blocking it. The recommended admission policy also demands gVisor, so it rejects microVM sandboxes until you edit it."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/sandbox-pods
      - at: sandbox
        text: "Google's generally available RL set-up for Agent Sandbox reuses warm Pods between episodes with an in-pod reset to save start-up time. The pattern wants a fresh sandbox per task, so do not use the recycle strategy across tasks that must stay separate."
        url: https://cloud.google.com/blog/products/containers-kubernetes/accelerate-agentic-rl-with-gke-agent-sandbox
      - at: sandbox
        text: "Google now recommends Agent Substrate on GKE for most agent workloads, with outbound traffic blocked by default. Agent Sandbox is advised when each agent needs its own Pod, GPUs or Autopilot, and you install and upgrade its controller yourself."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/machine-learning/agent-workloads
      - at: graders->harness
        text: "By default only the Sandbox Router may open connections into a sandbox. Graders cannot check a rollout's end state directly; send the checks through the orchestrator and router, or add an ingress rule for the grader namespace."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/how-install-agent-sandbox
      - at: storage->inference
        text: "In Google's RL-on-GKE tutorial the sampler (vLLM) runs inside the training workers, and one bucket holding weights, data and checkpoints is mounted on every node with Cloud Storage FUSE. Keep vLLM as a separate service and mount the bucket only on its nodes."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/scaling-rl-verl-gke
    alsoNeeded:
      - service: "VPC Service Controls"
        role: network
        why: "Stops allowed Google API routes (Artifact Registry, Cloud Storage) carrying data to other projects."
        url: https://docs.cloud.google.com/artifact-registry/docs/securing-with-vpc-sc
      - service: "Private GKE nodes"
        role: network
        why: "Nodes without external addresses, so a sandbox host has no direct internet route."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/hardening-your-cluster
      - service: "Cloud Storage FUSE CSI driver"
        role: other
        why: "Mounts the checkpoint bucket into the vLLM Pods, authenticated by Workload Identity."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/cloud-storage-fuse-csi-driver
      - service: "Artifact Registry Docker repository (with GKE Image Streaming)"
        role: registry
        why: "Holds task, harness and vLLM container images; the component row covers language packages only."
        url: https://docs.cloud.google.com/artifact-registry/docs/repositories/virtual-overview
      - service: "GKE Gateway API"
        role: ingress
        why: "Reaches the Sandbox Router and orchestrator from outside the cluster; port-forwarding is for development only."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/agent-sandbox
      - service: "Cloud KMS"
        role: keys
        why: "Customer-managed keys for the checkpoint bucket."
        url: https://docs.cloud.google.com/storage/docs/encryption/customer-managed-keys
      - service: "Secret Manager"
        role: secrets
        why: "Google's hardening guide says to keep secrets there, not in Kubernetes Secrets."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/hardening-your-cluster
      - service: "Managed OpenTelemetry for GKE"
        role: logging
        why: "Google's documented way to collect RL metrics and traces into Cloud Monitoring and Cloud Trace."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/monitor-reinforcement-learning-workloads
      - service: "Workload Identity Federation for GKE (IAM)"
        role: identity
        why: "Gives each run's Pods their own Google Cloud identity without keys."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/workload-identity
      - service: "Cloud Logging log bucket"
        role: logging
        why: "Locked store for trajectory and host logs."
        url: https://docs.cloud.google.com/logging/docs/buckets
    quickstart:
      - title: "Install Agent Sandbox on GKE"
        url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/how-install-agent-sandbox
      - title: "Isolating AI code execution with Agent Sandbox on GKE"
        url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/agent-sandbox
      - title: "Accelerating agentic RL and evaluation research velocity with 45x faster GKE Agent Sandbox"
        url: https://cloud.google.com/blog/products/containers-kubernetes/accelerate-agentic-rl-with-gke-agent-sandbox
    # <<< checked
    reference:
      - title: About Agent Sandbox on GKE
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/machine-learning/agent-sandbox
      - title: GKE Sandbox
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/sandbox-pods
    summary:
      - >-
        Rollouts as Agent Sandbox on GKE sandboxes — each a Pod in GKE Sandbox, gVisor by default
        or a microVM with its own kernel — on node pools separated by trust group, with FQDN
        network policies limiting every rollout to the offline web, the read-only package mirror
        and the platform services it needs. The policy model is served by vLLM on GPU node pools
        the sandboxes reach only through its API; trajectories land in a locked log bucket. Google
        publishes no Architecture Center design for RL environments; its Agent Sandbox and GKE
        Sandbox guides are the reference.
    bindings:
      - { block: graders, service: Your graders on a separate node pool, build: true, note: "Programmatic checks and reward models; read a rollout's end state through the orchestrator, never from inside a sandbox." }
      - { block: platform, service: "GKE metadata server, Cloud Logging and Monitoring", note: "Every one reachable from a sandbox host is a route out, so each is named on the egress list or blocked." }
      - { block: orchestrator, service: Your run orchestrator on GKE, build: true, note: "Drives the Agent Sandbox controller's SandboxClaims and holds the automatic stop." }
      - { block: sandbox, service: Agent Sandbox on GKE (GKE Sandbox), note: "gVisor under the recommended security policy; microVMs (Kata Containers) where a task needs a full kernel." }
      - { block: harness, service: Your episode loop in the sandbox, build: true }
      - { block: localTools, service: "Shell, files and browser in the sandbox", build: true }
      - { block: storage, service: Cloud Storage (checkpoint bucket) }
      - { block: inference, service: vLLM on GKE GPU node pools, builtWith: vLLM}
      - { block: offlineWeb, service: Your offline web snapshot, build: true, note: "A cached crawl and simulated applications served inside the cluster." }
      - { block: registry, service: Artifact Registry remote and virtual repos }
      - { block: openWeb, service: The live web (crawled offline only) }
      - { block: sources, service: "Public registries (PyPI, npm)" }
    settings:
      - gkeSandbox
      - agentSandboxPolicy
      - gkeNetworkPolicy
      - workloadSeparation
      - fqdnNetworkPolicy
      - arReaderOnly
      - arVirtualRepoPriority
      - arPackageScanning
      - workloadIdentityGke
      - gcsUniformAccess
      - lockedLogBucket
      - runAutoStop
      - disableServiceAccount
      - containmentRedTeam

  - architecture: archAgentFederation
    asOf: "2026-10"
    # >>> checked against the vendor's documentation
    verified: "2026-11-18"
    sources:
      idp: https://docs.cloud.google.com/identity/docs/overview
      entry: https://docs.cloud.google.com/run/docs/securing/identity-aware-proxy-cloud-run
      authServer: https://docs.cloud.google.com/apigee/docs/api-platform/security/oauth/access-tokens
      harness: https://docs.cloud.google.com/run/docs/ai/a2a-agents
      localTools: https://adk.dev/tools-custom/function-tools/
      memory: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sessions
      gateway: https://docs.cloud.google.com/gemini/enterprise/docs/register-and-manage-an-a2a-agent
      internalTools: https://docs.cloud.google.com/apigee/docs/api-platform/apigee-mcp/manage-mcp-tool-access
      provider: https://docs.cloud.google.com/gemini-enterprise-agent-platform/overview
    differences:
      - at: harness->gateway
        text: "ADK sends model calls straight to Gemini with the agent's own service account unless you wrap the model in ApigeeLlm. To force the gateway, point model and MCP addresses at Apigee and remove direct model permission from the agent's account."
        url: https://adk.dev/agents/models/apigee/
      - at: gateway->provider
        text: "Google's reference sends the model call from the agent through Model Armor to Gemini, with no Apigee. Here Apigee calls the model with its own service account, so also turn on Model Armor floor settings to catch calls that bypass Apigee."
        url: https://docs.cloud.google.com/architecture/single-agent-ai-system-adk-cloud-run
      - at: gateway->internalTools
        text: "Google's reference has the agent call MCP servers on Cloud Run directly, protected by IAP and IAM, or through Agent Gateway. To make Apigee the only door, allow only Apigee's service account to invoke the tool services."
        url: https://docs.cloud.google.com/architecture/single-agent-ai-system-adk-cloud-run
      - at: gateway->authServer
        text: "There is no separate authorization server: the token endpoints are proxies inside the same Apigee. Its OAuth policy supports client credentials, authorization code, password and implicit grants only, so exchanging a peer's token for an internal one must be hand-built."
        url: https://docs.cloud.google.com/apigee/docs/api-platform/reference/policies/oauthv2-policy
      - at: idp->authServer
        text: "Apigee does not federate with Cloud Identity on its own. Google's guide for an A2A agent behind Apigee has the proxy check each user token itself: verify signed tokens against the issuer's keys, or call Google's tokeninfo endpoint for Google tokens."
        url: https://docs.cloud.google.com/gemini/enterprise/docs/register-and-manage-an-a2a-agent
      - at: gateway->peerVendor
        text: "Google's references send outbound A2A through Agent Gateway and admit peers through Agent Registry; Apigee is not mentioned. Agent Gateway for Cloud Run is Limited Preview, so with Apigee the card, skill and artifact checks are policies you write yourself."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/gateways/agent-gateway-overview
      - at: peerVendor
        text: "Google's custom SAML app is a browser sign-on: the user's browser carries the assertion to the vendor. No Google page opened shows a gateway attaching a user's SAML assertion to an agent call, so confirm how the user's identity reaches the vendor peer."
        url: https://knowledge.workspace.google.com/admin/apps/set-up-your-own-custom-saml-app
      - at: gateway->partner
        text: "Inbound peers reach Apigee only if you arrange it: Google says to set the Agent Card address to the Apigee proxy, require OAuth there, and keep the Cloud Run agent private so only Apigee's service account can invoke it."
        url: https://docs.cloud.google.com/gemini/enterprise/docs/register-and-manage-an-a2a-agent
      - at: memory
        text: "Cloud Run's A2A guide keeps task state in an A2A task store: in memory by default, lost on restart, or AlloyDB for production. Sessions holds conversation events, so multi-day tasks also need a persistent task store that you secure."
        url: https://docs.cloud.google.com/run/docs/deploy-a2a-agents
      - at: harness
        text: "This pattern's settings list has no network exit control. Unless Cloud Run sends all outbound traffic into the VPC and through Secure Web Proxy, the agent can call a peer directly and skip Apigee's checks."
        url: https://docs.cloud.google.com/secure-web-proxy/docs/overview
    alsoNeeded:
      - service: "IAM service accounts"
        role: identity
        why: "Each Cloud Run service, and Apigee's proxies, run as a service account you create and scope."
        url: https://docs.cloud.google.com/apigee/docs/api-platform/security/google-auth/overview
      - service: "VPC network with Direct VPC egress and Secure Web Proxy"
        role: network
        why: "Stops the agent calling peers or the internet directly, around Apigee."
        url: https://docs.cloud.google.com/secure-web-proxy/docs/overview
      - service: "Apigee networking and external load balancer"
        role: ingress
        why: "Peers reach Apigee through a load balancer; Apigee reaches the private agent through Private Service Connect."
        url: https://docs.cloud.google.com/apigee/docs/api-platform/get-started/networking-options
      - service: "Agent Runtime instance"
        role: other
        why: "Agent Platform Sessions can only be created under one, even with no agent deployed to it."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sessions/manage-with-api
      - service: "AlloyDB for PostgreSQL"
        role: other
        why: "Google's Cloud Run guide uses it as the persistent A2A task store; the default store is in memory."
        url: https://docs.cloud.google.com/run/docs/deploy-a2a-agents
      - service: "Secret Manager"
        role: secrets
        why: "Holds database passwords and any peer client secrets; the Cloud Run A2A guide uses it."
        url: https://docs.cloud.google.com/run/docs/deploy-a2a-agents
      - service: "Cloud KMS"
        role: keys
        why: "Customer-managed encryption keys for stored task data and sessions, where policy requires them."
        url: https://docs.cloud.google.com/kms/docs/cmek
      - service: "Artifact Registry and Binary Authorization"
        role: registry
        why: "Stores the agent's container image and allows only approved images to deploy."
        url: https://docs.cloud.google.com/binary-authorization/docs/overview
      - service: "Model Armor templates"
        role: other
        why: "The sanitize calls need a template, plus Sensitive Data Protection templates for de-identification."
        url: https://docs.cloud.google.com/model-armor/sanitize-prompts-responses
      - service: "Cloud Logging and Data Access audit logs"
        role: logging
        why: "Only tracing is in the settings; peer calls through Apigee and the platform also need audit logs."
        url: https://docs.cloud.google.com/logging/docs/overview
    quickstart:
      - title: "Deploy A2A agents to Cloud Run"
        url: https://docs.cloud.google.com/run/docs/deploy-a2a-agents
      - title: "Register and manage A2A agents"
        url: https://docs.cloud.google.com/gemini/enterprise/docs/register-and-manage-an-a2a-agent
    # <<< checked
    reference:
      - title: Single-agent AI system using ADK and Cloud Run — A2A security considerations
        url: https://docs.cloud.google.com/architecture/single-agent-ai-system-adk-cloud-run
      - title: Multi-tenant agentic AI system
        url: https://docs.cloud.google.com/architecture/multi-tenant-agentic-ai-system
      - title: ADK with Agent2Agent (A2A) Protocol
        url: https://adk.dev/a2a/
    summary:
      - >-
        Your ADK agent on Cloud Run speaking A2A both ways through Apigee: outbound it presents a
        Google-signed ID token to each peer platform and, where a vendor federates with Google,
        a SAML assertion for the user; inbound, peers are registered Apigee apps whose tokens,
        skills and quotas the gateway checks, with Model Armor screening every artifact in and
        de-identifying every payload out. Google's references name Agent Registry for admitted
        A2A agents and Agent Gateway for the crossing; Agent Gateway is Google-managed only for
        agents on Agent Runtime.
    bindings:
      - { block: idp, service: Cloud Identity (Google as IdP), note: "Custom SAML apps decide which groups' identity may travel to which vendor platform." }
      - { block: entry, service: Cloud Run front end with IAP }
      - { block: authServer, service: Apigee OAuth 2.0 token endpoints, note: "Issues our agent's tokens to registered peer apps; outbound, our agent's identity is a Google-signed ID token rather than a secret." }
      - { block: harness, service: Your A2A agent on Cloud Run, builtWith: Agent Development Kit (ADK), note: "ADK publishes the Agent Card and calls peers over A2A; Agent Runtime is the managed alternative." }
      - { block: localTools, service: Your function tools in the agent, builtWith: Agent Development Kit (ADK) }
      - { block: memory, service: Agent Platform Sessions }
      - { block: gateway, service: Apigee (A2A and model proxies), note: "Agent Gateway governs A2A natively for agents on Agent Runtime; early preview for Cloud Run." }
      - { block: internalTools, service: "Your MCP servers on Cloud Run, via Apigee" }
      - { block: orgData, service: Your systems of record, build: true }
      - { block: peerVendor, service: A vendor platform's agent, note: "Under an agreement and a SAML or OIDC federation with Cloud Identity." }
      - { block: provider, service: Gemini on Agent Platform }
      - { block: partner, service: A partner's A2A agent, note: "Agent identity only; no user federation." }
    settings:
      - serviceAccountIdTokens
      - workspaceSamlAppAccess
      - noTokenPassthrough
      - agentRegistry
      - modelArmorSanitizeApi
      - a2aSkillAuthorization
      - apigeeQuota
      - peerVendorAssessment
      - agentCardSignatures
      - sessionsTtl
      - adkCloudTrace
      - apigeeRevokeApp
