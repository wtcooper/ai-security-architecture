id: archCloudManagedAgent
surface: surfaceCloud
rank: 9
title: Managed agent service in your cloud
abbrev: Cloud agent service

summary:
  - >
    An agent service that your cloud provider runs as a resource in your own cloud account.
    You declare the agent (a model, instructions and tools) and the provider runs the loop.
    Your application signs in to it with a cloud identity over a private network path, and
    the service reaches your tools, data and stores inside your own network. The provider
    still operates the loop, so part of its behaviour is assured by the provider and not
    inspected by you.

overview: >-
  The provider runs the loop and calls the model on machines you do not manage; the agent reaches
  your tools through your gateway and your stores directly, over your own network on its own cloud
  identity. Unlike an agent API in the vendor's own cloud, your identity, network, keys, policy and
  audit log apply, but your gateway sees only tool traffic, so model controls must be set on the
  service.

description:
  - >
    The service is a resource in your own cloud account. It sits under your subscription or
    project, your identity service decides who may call it and who may change it, your network
    decides how it is reached, your keys encrypt what it stores, your cloud policy limits how
    it may be configured, and its management actions land in your cloud audit log. That is
    what places it with the AI you host yourself: the platform team wraps it in the cloud
    controls it already holds for every other workload.
  - >
    What does not change is who runs the agent. The provider operates the loop, calls the
    model and runs the built-in tools on machines you do not manage, and you cannot inspect
    all of it. So the drawing keeps the service in a provider boundary and does not draw it as
    your own code. Inference stays inside that boundary: your AI gateway carries tool traffic
    only, and the model controls you would enforce at a gateway have to be obtained as
    settings of the service.
  - >
    The call in crosses on your cloud identity and a private network path. Your application
    signs in to the agent's endpoint as its own workload identity, through a private endpoint,
    with no vendor API key and no route over the internet. On most platforms this is the
    target state and not the default: the endpoint is public and key access is possible until
    you change both, which is why cloud policy that refuses the open configuration is pinned
    on the deploy flow.
  - >
    The way back in runs over your own network. The service reaches your tools through private
    endpoints, or through a subnet you delegate to it, and arrives at your AI gateway on the
    agent's own cloud identity. There is no tunnel connector to run. Two paths do not pass the
    gateway and are drawn for that reason: the connectors the provider hosts for services you
    approved, and the built-in web tools. The definition and the service's network rules are
    the only limits on those.
  - >
    State and knowledge can live in your own account. Conversations, long-term memory, uploaded
    files and the search index built from them can be kept in stores you own, encrypted with
    keys you manage. The service reads and writes those stores directly, on the agent's
    identity; no gateway sits on that path, so the access roles on the stores, their private
    endpoints and your keys are what apply. Left at the default, most services keep this state
    in storage the provider manages.

distinguishedBy:
  - >
    Against the API/SDK managed agent runtime: the same provider-run loop in a different
    tenancy. There the service sits in another company's tenancy and is reached over the
    internet with that vendor's console, keys and contract. Here it is a resource in your own
    cloud account, so your identity service, private network, encryption keys, cloud policy
    and audit log apply to it, your stores can hold its state, and it reaches your systems
    over your network with no tunnel connector.
  - >
    Against the chat agent with tools (building the agent yourself): there the loop is your
    code on compute you run, the model call leaves through your AI gateway, and every control
    on the drawing is yours to enforce. Here the cloud provider runs the loop and calls the
    model inside its own boundary, so your gateway sees tool traffic only and part of the
    behaviour is assured by the provider and not inspected by you. Running your own agent code
    on the platform's runtime is still that pattern, hosted another way.
  - >
    Against the single agent workflow and the multi-agent workflow: the same difference. Those
    are loops you write and operate; this is a loop you configure and call.

exemplars:
  - name: Microsoft Foundry Agent Service
    fills: managedRuntime
    note: >
      Prompt agents: you set instructions, a model and tools, and Microsoft runs the agent in
      your Foundry resource. Each agent gets its own Microsoft Entra agent identity, a private
      endpoint and a virtual network keep traffic off the internet, and standard setup keeps
      conversations, files and search indexes in your own Azure resources. Public by default.
      Hosted agents run your own code and are the recorded variant; several governance
      features are in preview.
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    asOf: "2026-11"
  - name: Amazon Bedrock AgentCore harness
    fills: managedRuntime
    note: >
      The harness is the mode where AWS runs the loop: you declare the model, tools, skills
      and instructions, and each session runs in its own microVM. It assumes an IAM role you
      own, can be placed in your VPC, and is called with IAM-signed requests or a token from
      your identity provider. Sessions run on the public network by default. AgentCore
      Runtime, where you bring the agent code, is the recorded variant.
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness.html
    asOf: "2026-11"
  - name: Agent Runtime on Gemini Enterprise Agent Platform
    fills: managedRuntime
    note: >
      Formerly Vertex AI Agent Engine. Google runs the runtime, scaling, sessions, memory and
      sandboxes under your project's controls: IAM, VPC Service Controls, a Private Service
      Connect interface into your network and your own encryption keys. The agent loop is code
      you deploy, so it sits at the recorded-variant end of this pattern; the
      configuration-only Managed Agents API is Pre-GA and not for production data.
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/runtime
    asOf: "2026-11"

zones:
  - id: zoneUser
    owner: user
    note: The people the published agent serves, and the team that defined it.
  - id: zoneCloud
    owner: cloud
    gloss: "our account: front end, gateway, data"
    note: >
      What we run and hold in our own cloud account: the definition that decides what the
      agent may do, the front end our users call, the gateway that admits the agent's tool
      calls, our tool servers and systems of record, and the stores that hold the agent's
      conversations, memory and files under our keys.
  - id: zoneVendor
    owner: vendor
    gloss: "provider runs it in our account"
    note: >
      The managed agent service. It is a resource in our account, so our identity, network,
      keys, policy and audit log apply to it, but the cloud provider runs it: the loop, the
      model call, the built-in tools and the hosted connectors execute on machines the
      provider operates. What happens inside is assured by the provider, not drawn.
  - id: zoneExternal
    owner: external
    note: >
      The open web the built-in tools search and fetch, where the definition allows it. The
      call is opened from the provider's side; nothing in this band connects back in.
  - id: zoneGovernance
    owner: governance
    note: >
      Mostly cloud controls the platform team already holds for other workloads: identity,
      private networking, keys, policy and the audit log, applied here to an agent.

blocks:
  - id: engineer
    kind: actor
    title: Developer
    summary: "writes and reviews the definition"
    icon: person
    zone: zoneUser
    col: 0
    row: 0
    note: >
      The engineer who writes the agent's definition and the code around it. The definition
      reaches the service through the delivery pipeline, not through a console.

  - id: endUser
    kind: actor
    title: End user
    summary: "the person a session runs for"
    icon: person
    zone: zoneUser
    col: 0
    row: 1
    note: The person a session runs for, and whose access it acts on if we set it up that way.

  - id: agentDef
    kind: service
    title: Agent definition & code
    summary: "what the agent may do, deployed by our pipeline"
    cosaiComponent: componentAgentSystemInstruction
    zone: zoneCloud
    col: 1
    row: 0
    note: >
      The model, instructions, tools, connectors and skills the agent is allowed, and the
      settings of the service it runs on: network, identity, keys and limits. Kept in source
      control and deployed by our pipeline on the pipeline's own cloud identity. On a service
      we do not operate, this is very nearly all we decide about the agent itself, which makes
      its review a release gate.
    items:
      - id: declarative
        label: Declarative definition
        icon: doc
        note: >
          Model, instructions, tool and connector enablement and approval rules, as a versioned
          resource, so a rollback is a change of pointer.
      - id: environment
        label: Environment definition
        icon: gear
        note: >
          The service's own settings as code: private endpoint, network path into our network,
          the agent's identity and roles, keys, stores, limits and the network rules for the
          built-in tools. These are the settings cloud policy checks at deploy.

  - id: memory
    kind: service
    title: Memory & state
    summary: "conversations, memory and files in our stores, under our keys"
    cosaiComponent: componentDataStorage
    zone: zoneCloud
    col: 2
    row: 0
    note: >
      The agent's state, kept in our account: conversations, long-term memory, uploaded files
      and the search index built from them. Either stores we bring (a document database, a
      file store, a search service) or the service's own memory resource created in our
      account and encrypted with our key; the platform decides which is offered. The service
      reads and writes it directly on the agent's identity. Left at the default, most services
      keep this state in storage the provider manages, which is the common install falling
      short of this drawing.
    items:
      - id: conversation
        label: Conversation state
        icon: folder
        cosaiComponent: componentMemory
        note: Every turn and tool result of a session, read back on each call as context.
      - id: memoryRecords
        label: Memory files
        icon: folder
        cosaiComponent: componentMemory
        note: >
          Long-term memory the service extracts and keeps across sessions. What it may keep,
          for whom and for how long is a decision, not a default.
      - id: index
        label: Vector index
        icon: search
        cosaiComponent: componentRAGContent
        note: Uploaded files and knowledge sources, indexed for the agent's file search tool.

  - id: entry
    kind: service
    title: Application front end
    summary: "our code: binds the user, holds the session, runs custom tools"
    cosaiComponent: componentApplication
    zone: zoneCloud
    col: 1
    row: 1
    note: >
      Our own application, the surface our users touch. It signs the user in, binds the
      session to that person and calls the agent's endpoint as its own workload identity
      through a private endpoint. It also holds the session: it reads the stream of events,
      answers approval requests for tools set to ask, and runs custom tools through our
      gateway. Schedules and incoming events that start a session with nobody present live
      here too, and so does the decision about whose access such a session carries.
    items:
      - id: api
        label: App & API endpoint
        icon: globe
        note: The published surface our users actually touch.
      - id: authn
        label: Identity binding
        icon: shield
        note: Which of our people a session runs for, established before it starts.
      - id: schedules
        label: Schedules & events
        icon: clock
        note: >
          Timers, webhooks and queued messages that start a session with nobody present. Each
          is bound to the person it belongs to and to access stored when they set it up,
          narrower than their own and with an expiry.
      - id: handlers
        label: Tool handlers
        icon: code
        note: >
          Custom tools handled in our code. The agent asks for the call and the session waits;
          our handler checks the tool name, arguments and call id, sends it through our
          gateway on the session's bound user, and posts the result back.

  - id: aiGateway
    kind: service
    title: AI gateway
    summary: "admits the agent's tool calls on our private network; no inference"
    zone: zoneCloud
    col: 1
    row: 2
    note: >
      The control point we run where the provider-run agent is admitted into our systems. It
      listens on a private address only, checks the agent's own cloud identity, and scopes,
      screens and records every tool call, from the service and from our own custom-tool
      handlers. It carries tool traffic only: the service calls its model inside the
      provider's boundary.
    items:
      - id: gwTools
        label: MCP & API gateway
        icon: plug
        note: Which of our tool servers and APIs an agent may reach, and on whose access.

  - id: internalTools
    kind: service
    title: Tool services
    summary: "our tool servers and APIs, reached only through the gateway"
    cosaiComponent: componentTools
    zone: zoneCloud
    col: 1
    row: 3
    pack: toolServicesRemote
    note: >
      Our own tool servers and connectors: ticketing, internal services and the systems of
      record the agent was adopted to work on. They accept calls from the gateway and from
      nowhere else, so the service cannot reach them directly even though it is on our network.

  - id: orgData
    kind: external
    title: Enterprise data
    summary: "systems of record, on access we scope per session"
    cosaiComponent: componentDataSources
    zone: zoneCloud
    col: 2
    row: 3
    pack: enterpriseData
    note: The systems of record behind those servers, reached on access we scope per session.

  - id: managedRuntime
    kind: provider
    title: Managed runtime
    summary: "provider-run loop and model, on the agent's own cloud identity"
    cosaiComponent: componentReasoningCore
    zone: zoneVendor
    col: 3
    row: 0
    rowSpan: 3
    note: >
      The cloud provider's agent service, running our definition. The provider hosts the loop
      (tool-call decisions, retries, context handling), calls the model and keeps each session
      apart. It acts under a cloud identity of its own, which is what our gateway, stores and
      policies see. It is a resource in our account, but we do not operate it and cannot
      inspect all of it: how sessions are isolated, what a preview feature does and where a
      request is processed are things we assure by review. Service-specific limits (which
      features are in preview, what a customer-managed key covers, which tools work on a
      private network) change by quarter and belong in the product's own record.
    items:
      - id: agentLoop
        label: Agent harness
        icon: agent
        note: >
          The provider's loop running our definition: planning, tool selection, context and
          retries. Theirs to operate and to patch.
      - id: inference
        label: Model inference
        icon: model
        note: >
          The model, called inside the provider's boundary from a deployment in our account.
          It never crosses our AI gateway, so approved models, regions and content screening
          are settings of the service and rules in cloud policy.
      - id: vault
        label: Credential vault
        icon: key
        note: >
          The service's connection store: credentials for hosted connectors and third-party
          tool servers, held by the service and attached to a named tool at call time. Our own
          systems need none: the agent reaches them on its cloud identity.
      - id: mcpClient
        label: MCP client
        icon: plug
        note: >
          The party that connects out. Two directions: into our network to our gateway, and
          to the provider's hosted connectors. Any connector can instead be registered at our
          gateway, where it is scoped and recorded on our side.

  - id: nativeTools
    kind: provider
    title: Native tools
    summary: "built-in tools in a session sandbox, on network rules we set"
    cosaiComponent: componentTools
    zone: zoneVendor
    parent: managedRuntime
    col: 0
    row: 0
    note: >
      The service's built-in tools, nested because the loop calling them is not a hop: file
      search over our stores, a code sandbox, shell and file tools where the service has them,
      installed skills, web search and fetch, and (off in this reference) a hosted browser or
      computer use. They execute in the provider's sandbox for the session. They are drawn
      because we configure them: the definition lists which are on, and the service's network
      rules decide what they may reach. The state and file tools are how the loop reads and
      writes Memory & state.
    items:
      - id: editTools
        label: File & edit tools
        icon: folder
        note: File search and file handling over the session's files and our indexed stores.
      - id: shell
        label: Shell commands
        icon: code
        note: >
          A shell in the session sandbox, on the services that offer one. On by default on some;
          an agent that does not need it should not have it.
      - id: sandboxedTools
        label: Sandboxed tools
        icon: shield
        note: The code interpreter, running model-written code in an isolated container or microVM.
      - id: skills
        label: Installed skills
        icon: gear
        note: >
          Packaged instructions and scripts the definition names, loaded at session start.
          Content that runs as instruction, reviewed like code.
      - id: computerUse
        label: Computer use
        icon: eye
        note: >
          Off in this reference. Hosted browser and desktop tools, where the service offers
          them, widen the reach to any page and need their own review.

  - id: vendorTools
    kind: service
    title: Tool services
    summary: "the provider's hosted connectors to services we approved"
    cosaiComponent: componentTools
    zone: zoneVendor
    col: 4
    row: 0
    pack: toolServicesRemote
    note: >
      Connectors and tool servers the provider hosts or calls for us: its own catalogue of
      connectors to business services, and remote tool servers named in the definition. The
      service calls them from its side with a credential from its connection store. Nothing we
      run is on this path, and a service outside any agreement is not connected.

  - id: openWeb
    kind: external
    title: Open web
    summary: "pages the built-in web tools search and fetch"
    cosaiComponent: componentDataSources
    zone: zoneExternal
    col: 5
    row: 0
    note: >
      What the built-in web search and fetch tools read, where the definition switches them on.
      Every page is someone else's text, and it enters a loop nobody is watching as instruction.
    items:
      - id: webSearch
        label: Web search
        icon: search
        note: Results ranked by someone else, read as context.
      - id: pages
        label: Arbitrary pages
        icon: globe
        note: Visible and hidden text alike, served by whoever owns the page.

  - id: govIdentity
    kind: governance
    title: Identity services
    summary: "the user's, the application's and each agent's own identity"
    icon: person
    zone: zoneGovernance
    col: 0
    row: 5
    mitigations: [ D3-APA, D3-AA ]
    note: >
      Three identities to govern, all in our own cloud identity service: the user signed in at
      the front end, the application's workload identity that may invoke the agent, and each
      agent's own identity with the roles we grant it. All three are short-lived tokens, not
      keys, and all three can be switched off in one place.

  - id: govSecrets
    kind: governance
    title: Secrets & key management
    summary: "our keys for the agent's state; no stored keys on our paths"
    icon: key
    zone: zoneGovernance
    col: 1
    row: 5
    mitigations: [ D3-CTS, D3-CH, AML.M0012 ]
    note: >
      Our key service holds the keys that encrypt the agent's conversations, memory and files.
      The paths into our systems use the agent's managed identity, so there is no stored key
      to rotate there; what remains are the connector credentials in the service's connection
      store, scoped per tool.

  - id: govPolicy
    kind: governance
    title: Policy & authorization
    summary: "reach decided at our gateway; rules and limits set on the service"
    icon: scale
    zone: zoneGovernance
    col: 2
    row: 5
    mitigations: [ AML.M0028, AML.M0029, AML.M0036, cap-agent-action-policy-enforcement, AML.M0031, cap-agent-egress-control, cap-input-guardrails, cap-data-access-governance ]
    note: >
      What the agent may reach in our systems, decided at our gateway and at our stores, plus
      the rules we set on the service itself: per-tool rules, network rules for the built-in
      tools, session limits and memory scope. Cloud policy holds the floor a builder cannot
      lower.

  - id: govSupplyChain
    kind: governance
    title: Supply-chain assurance
    summary: "definition review, staged rollout, provider assessment"
    icon: db
    zone: zoneGovernance
    col: 3
    row: 5
    mitigations: [ cap-agent-tool-registry, cap-staged-rollout-gate, cap-ai-vendor-assessment ]
    note: >
      The register of agents, the tests in front of every change, staged rollout of
      definitions, and the review of the provider's service behind adopting it at all.

  - id: govObservability
    kind: governance
    title: Observability & response
    summary: "cloud audit log and agent traces, kept in our account"
    icon: eye
    zone: zoneGovernance
    col: 4
    row: 5
    mitigations: [ cap-agent-tracing, cap-agent-kill-switch ]
    note: >
      The cloud audit log records who created, changed or invoked the service. The agent's
      traces record what it did. Both land in our account, where we set retention and access,
      and both are joined with our gateway's record.

edges:
  - from: engineer
    to: agentDef
    crossing:
      kind: person
      via: "The engineer in person: the definition is written, reviewed and versioned in our delivery pipeline"
    path: primary
    label: authored & reviewed
    note: >
      The definition arrives through the ordinary delivery pipeline: written, reviewed and
      versioned like any other change.
  - from: agentDef
    to: managedRuntime
    crossing:
      kind: brokered
      via: "Our release gate and cloud policy: registered, tested and staged; a configuration outside our baseline is refused"
    path: external
    label: deploy
    note: >
      One direction: our pipeline creates or updates the agent in our account, on the
      pipeline's own cloud identity. Cloud policy is checked on this call, so an agent with a
      public endpoint, key access, an unapproved model or a region we do not use is refused
      before it exists. What the definition declares is the last decision we make about the
      agent itself.
  - from: endUser
    to: entry
    crossing:
      kind: person
      via: "The end user, signed in at our identity provider; the front end binds the session to them"
    path: primary
    bidir: true
    label: request / response
    note: >
      Our users touch our surface. The front end binds who a session runs for before anything
      reaches the service, and the response returns the same way.
  - from: entry
    to: managedRuntime
    crossing:
      kind: brokered
      via: "Our cloud identity on a private path: only the application's workload identity may invoke the agent, with no API key and no access from the internet"
    path: external
    bidir: true
    label: session invoke
    note: >
      Our application calls the agent's endpoint on a private path (a private endpoint on our network, or inside a service perimeter where the service has none),
      signed in as its own workload identity and carrying the user the front end bound. The
      session stream carries everything after: events out, approvals and custom tool results
      back. The cloud's access policy decides who may invoke, and the audit log records that
      they did.
  - from: entry
    to: aiGateway
    path: primary
    bidir: true
    label: custom tool calls
    note: >
      Our handlers send the custom tools the agent asks for through our gateway, on the
      session's bound user, so the same access, approvals and record apply as on the service's
      own path. A request that arrives on an authenticated session is still an untrusted
      proposed action.
  - from: managedRuntime
    to: aiGateway
    crossing:
      kind: brokered
      via: "AI gateway on our private network: checks the agent's own cloud identity, then scopes, screens and records each call"
    path: external
    bidir: true
    label: tool calls, private network
    note: >
      The service reaching our tools over our own network: through private endpoints, or from
      a subnet we delegate to it. It signs in to the gateway with a short-lived token for the
      agent's own identity, so nothing is exposed to the internet and no key is stored. The
      network path only gets the call to the gateway; the gateway decides whether it goes
      further.
  - from: aiGateway
    to: internalTools
    path: primary
    bidir: true
    label: brokered tool calls
    note: Which of our tool servers an agent may call, on short-lived access we issue per call.
  - from: internalTools
    to: orgData
    path: primary
    bidir: true
    label: scoped reads & writes
    note: The records the agent was adopted to work on, read and written on our side.
  - from: nativeTools
    to: memory
    crossing:
      kind: direct
      via: "Nothing between: no gateway on this path; the agent's identity, the stores' private endpoints and our keys apply at the stores"
    path: primary
    bidir: true
    label: read & write / context
    note: >
      The service reading and writing the agent's state in our account: the conversation so
      far, long-term memory, files and the search index. It goes straight to the stores on the
      agent's identity. No gateway screens what is written or read back, so the roles on the
      stores, their private endpoints, our keys and the memory scope are the controls here.
  - from: managedRuntime
    to: vendorTools
    path: external
    bidir: true
    label: hosted MCP & connectors
    note: >
      The service calling the provider's hosted connectors and the remote tool servers the
      definition names, from the provider's side, and the content those tools return entering
      the loop. Nothing we run is on this path. The limit is per-tool enablement in the
      definition, and the alternative for any connector is to register it at our gateway.
  - from: nativeTools
    to: openWeb
    crossing:
      kind: vendor
      via: "The provider's built-in web tools, on the network rules we set: assured, not inspected"
    path: external
    outbound: true
    label: web search & fetch
    note: >
      The built-in web tools reaching public pages, where the definition allows it, and the
      content that comes back as instruction. The call leaves from the provider's side and
      does not pass our gateway.

pins:
  risks:
    - risk: riskPromptInjection
      at: managedRuntime->vendorTools
      note: >
        Content a hosted connector returns enters the loop on the provider's side, where
        nothing of ours screens it. The definition bounds which connectors are called; it does
        not judge what comes back.
    - risk: riskPromptInjection
      at: internalTools->orgData
      note: >
        A record somebody else wrote comes back as a tool result and is read as instruction.
        It is screened at our gateway on the way, which is the only reason it can be.
    - risk: riskPromptInjection
      at: nativeTools->openWeb
      note: >
        A fetched page enters a loop nobody is watching. The network rules bound which pages
        are reached; nothing of ours reads what they say.
    - risk: riskPromptInjection
      at: memory
      note: >
        A planted instruction written into conversation state or long-term memory is read back
        on every later call, and in every later session if memory is shared. Nothing screens
        this path.
    - risk: riskRogueActions
      at: internalTools->orgData
      note: Writes into systems of record from a loop the provider runs and we cannot watch.
    - risk: riskAgenticDelegationConfusedDeputy
      at: entry->managedRuntime
      note: >
        The delegation point. If the application's own identity stands in for the user here,
        every later call carries the application's access and not the person's.
    - risk: riskAgenticDelegationConfusedDeputy
      at: managedRuntime->aiGateway
      note: >
        The provider's service using our authority. The agent's identity proves which agent is
        calling, not that the call is what the user wanted; the access our gateway issues is
        what bounds it.
    - risk: riskSensitiveDataDisclosure
      at: managedRuntime
      note: >
        Prompts, context and tool results are processed on the provider's side. A global or
        multi-region model deployment may process them outside our region, a preview feature
        may sit outside the terms we rely on, and traces copy all of it into logs that many
        people can read.
    - risk: riskSensitiveDataDisclosure
      at: memory
      note: >
        The stores hold every conversation and every uploaded file. Anyone with a role on the
        store reads them without going near the agent, and memory shared across users lets one
        person's content surface in another's session.
    - risk: riskShadowAndUnknownAgents
      at: agentDef->managedRuntime
      note: >
        In a cloud account an agent is one API call or one console click away, for anyone with
        the role. Agents defined per request leave no resource to list. Without a register and
        a policy that limits who may create them, the population is unknown.
    - risk: riskToolSourceProvenance
      at: managedRuntime->vendorTools
      note: >
        Tool descriptions fetched from a remote server enter the loop as instruction. The
        server is named in the definition and checked by nobody on the path, and it can change
        what it serves after review.
    - risk: riskInsecureIntegratedComponent
      at: nativeTools
      note: >
        Skills, packages and any container image the definition brings run in the session
        sandbox as code. A reviewed version is not a safe one for ever, and on some services
        the built-in shell runs beside the process that holds the agent's credentials.
  mitigations:
    - mitigation: D3-APA
      at: endUser->entry
      do: "Sign every user in through your identity provider at your own front end, and bind each session to that person before it reaches the agent service."
      why: "A shared service account would make every action look like it came from nobody in particular."
      note: >-
        Our identity provider admits the end user to our front end, and the identity binding decides who
        the session runs for. The user is carried to the service as a delegated identity where the
        service supports it; a header the service does not validate is not delegation.
    - mitigation: AML.M0028
      at: aiGateway->internalTools
      do: "Decide at your own gateway which tool servers and tools each agent may reach, and on whose access."
      why: "The agent's definition says what it wants to use. Your gateway is where you decide what it may."
      note: >-
        Which servers, which tools and whose access, decided per agent identity at our gateway. The
        service's own tool settings are a second layer that the next definition can change.
    - mitigation: AML.M0029
      at: aiGateway->internalTools
      do: "Have your gateway refuse any write that matters unless it carries a person's approval for that exact action, shown to them in your own application."
      why: "The service's own approval prompts are a useful second layer, but your gateway is the one place you control."
      note: >-
        Our gateway owns the gate: a consequential write is refused unless it carries an approval bound
        to the exact action and arguments, shown to the approver through our front end. The service's
        per-tool approval setting is the second layer, and on some services it is honoured only by
        runtimes that choose to.
    - mitigation: cap-agent-tool-registry
      at: agentDef->managedRuntime
      do: "Register and review every agent definition before your pipeline deploys it, and let nobody create agents in the account by hand."
      why: "Anyone with the right role can otherwise create an agent that nobody knows about."
      note: >-
        Every definition registered and reviewed before deploy, with create and update rights on agent
        resources held by the pipeline's identity alone. The cloud's own agent inventory is the
        cross-check, and it does not list agents defined per request.
    - mitigation: cap-staged-rollout-gate
      at: agentDef->managedRuntime
      do: "Release definitions as fixed versions: test each one against attacks, send a small share of traffic first where the service allows it, and keep rollback to one switch."
      why: "A change to the definition changes what the agent does for everyone at once."
      note: >-
        Immutable versions, adversarial evaluation before the serving pointer moves, a canary where the
        service splits traffic, and rollback as a pointer change. Check per service whether the endpoint
        follows the latest version by default.
    - mitigation: D3-CTS
      at: managedRuntime
      do: "Keep each connector's credential in a managed store, tied to one named tool or server, and pass the signed-in user's access through wherever the tool supports it."
      why: "A credential that every agent and every user shares gives each of them the same reach."
      note: >-
        Connector credentials are held in a managed store (the service's own connection or
        credential store, or the cloud's secrets manager referenced by the service) and attached at
        call time only toward the named target, so the model never sees a value. Per-user delegation is our arrangement, not the default:
        a connection on a shared identity or a stored key gives every caller the same downstream access.
    - mitigation: cap-agent-action-policy-enforcement
      at: managedRuntime
      do: "Write rules for each tool in the definition: refuse by default, always ask on tools that matter, and lock any minimum settings the platform lets an administrator fix."
      why: "Rules the service checks before a tool runs are the only ones that also cover its built-in tools and hosted connectors."
      note: >-
        Per-tool rules evaluated by the service before a built-in or connector call executes, with
        administrator floors a builder cannot lower where the platform has them. On some services the
        rules apply only to calls routed through the provider's tool gateway; custom tools are sent by
        our application through our own gateway.
    - mitigation: AML.M0031
      at: memory
      do: "Keep each user's and each session's memory apart in your stores, and decide on purpose what the agent may remember and for how long."
      why: "Shared memory lets one person's content shape another person's answers, and a planted instruction returns in every later session."
      note: >-
        Memory scope by user and session, set on the store or the service's memory resource in our
        account, with retention and deletion decided separately from the life of a session. What the
        service extracts into long-term memory and how it can be corrected is assured by review.
    - mitigation: AML.M0036
      at: managedRuntime
      do: "Set limits on each session's length, steps and cost in the service, and keep running totals in your own application."
      why: "A new session resets a limit set per session, so it is not a ceiling for the whole organisation."
      note: >-
        Run limits the service enforces on each session (duration, iterations, tokens or cost where it
        has them) plus cumulative limits in our application and cloud budgets on the account, because a
        fresh session resets a per-session cap.
    - mitigation: cap-ai-vendor-assessment
      at: managedRuntime
      do: "Review what the provider runs that you cannot inspect before rollout: how sessions are kept apart, which features are still in preview and where prompts and data are processed. Check again on a schedule."
      why: "Being in your account does not make the service yours to inspect. Preview features and global processing can sit outside the terms you rely on."
      note: >-
        The provider's loop, isolation and data handling are assured by assessment, not drawn. For a
        cloud service the questions are specific: the shared responsibility statement for the service,
        which features are preview and so outside the service terms, which model deployments process
        outside the region, and what a customer-managed key does not cover. Re-assessed on a clock,
        because defaults move as the service ships.
    - mitigation: D3-EI
      at: nativeTools
      do: "Confirm that each session's built-in tools run in their own sandbox, and switch off the shell, code and computer-use tools an agent does not need."
      why: "Code that runs beside the agent can read what the agent holds, including its credentials."
      note: >-
        One sandbox per session around the built-in tools is the provider's to supply and ours to
        confirm, per tool: a code interpreter shared across a project, or a shell that runs as the same
        user as the loop, is not isolation. The tool list in the definition is the part we enforce.
    - mitigation: cap-agent-egress-control
      at: nativeTools
      do: "Set the network rules for the built-in tools: no public internet by default, and a short list of sites where web search or fetch is needed."
      why: "Built-in tools and hosted connectors do not pass your gateway, so these rules are the only limit on where they send data."
      note: >-
        Network rules on the service, authored by us and enforced by the provider: the private network
        mode, security groups or firewall rules on the delegated subnet, and the service's own outbound
        rules. Check per service which traffic they do not cover, such as model calls and web tools the
        provider runs on its own network.
    - mitigation: AML.M0028
      at: managedRuntime->vendorTools
      do: "Switch on only the tools and connectors each agent needs in its definition, name the tool servers it may use, and review the definition like code."
      why: "Connectors the provider hosts never pass your gateway, so the definition is the only limit on them."
      note: >-
        Per-tool enablement and an explicit list of allowed tools for each remote server. An empty list
        admits whatever the server exposes, now and later. Cloud policy can restrict tool types and
        endpoints for the whole account where the platform offers it.
    - mitigation: D3-CH
      at: managedRuntime->aiGateway
      do: "Have the service sign in to your gateway and stores with its managed cloud identity, using short-lived tokens, and store no key or password for those paths."
      why: "A stored key can be copied and used for as long as it lives. A short-lived token expires quickly and its identity can be switched off."
      note: >-
        The credential on the path into our systems is a token the cloud issues to the agent's managed
        identity, with our gateway as its audience. No secret is created, stored or rotated by us. The
        token is still a bearer credential while it lives, which is why the sandbox pin matters.
    - mitigation: cap-input-guardrails
      at: aiGateway
      do: "Screen tool results at your gateway before they go back to the agent, including records from your own systems, and switch on the service's own screening for what your gateway never sees."
      why: "Many people wrote those records, and content from hosted connectors and web tools never passes your gateway."
      note: >-
        Tool content returned through our gateway is classified there before it goes back to a loop we
        cannot see. Content from hosted connectors, web tools and our own stores does not cross it; the
        service's guardrail settings are the only screen there, and their coverage of tool results
        varies by service and is often preview.
    - mitigation: cap-agent-tracing
      at: govObservability
      do: "Send the agent's traces and the cloud audit log to stores in your own account, join them with your gateway's record, and limit who may read them."
      why: "Tracing is often off until you switch it on, and traces hold prompts and tool results that need the same care as the data itself."
      note: >-
        Two records, both in our account: the cloud audit log for who created, changed or invoked the
        service, and the agent's traces for what it did. Joined with the gateway's record and kept under
        our retention. Trace content is sensitive data in a log store.
    - mitigation: cap-agent-kill-switch
      at: govObservability
      do: "Make sure you can stop an agent in minutes: disable its cloud identity, stop its running sessions, take its version out of service and stop your own code handling its requests."
      why: "Rolling back to an older version only affects new sessions."
      note: >-
        The stop for a cloud service is mostly identity: disable or remove the agent's identity and its
        role assignments, then stop sessions and remove the version. Rehearse it, because on some
        services a running session keeps its token until it expires.
    - mitigation: D3-APA
      at: entry->managedRuntime
      do: "Allow only your application's own cloud identity to call the agent, through the cloud's access policy, and switch off key access on the service."
      why: "An access key can be copied and used from anywhere. A cloud identity can be limited, logged and switched off."
      note: >-
        The cloud's access policy on the agent resource names who may invoke it: the application's
        workload identity, at the scope of one agent where the platform allows. Key-based access is
        disabled. Where callers can override the model, tools or skills per request, the application
        strips those fields.
    - mitigation: D3-AA
      at: managedRuntime
      do: "Give each agent its own cloud identity with only the roles it needs, and do not let agents share one project or service identity."
      why: "With one shared identity you cannot tell agents apart in the logs or switch one off without stopping them all."
      note: >-
        A distinct cloud identity per agent, issued and held by the cloud's identity service with no
        secret for us to keep. It starts with no access; every role is one we assign. Our gateway and
        stores verify it on each call. Where the service falls back to a shared project identity or a
        default service account, that is the finding.
    - mitigation: D3-NI
      at: entry->managedRuntime
      do: "Make sure the service cannot be called from outside your network with a stolen credential: close its public access and reach it privately, or put it inside a service perimeter where it has no private endpoint."
      why: "Most of these services are open to the internet until you change it, so a stolen credential works from anywhere."
      note: >-
        No way in from the internet: public network access disabled on the service and a private
        endpoint in our network as the only way in (a private endpoint or interface endpoint, where
        the cloud offers one), with the endpoint's own policy limiting which identities may use it;
        or, where the service has no private endpoint, a service perimeter around the cloud's AI
        APIs; or, at the least, identity-only access with source-network or conditional-access
        conditions on the caller. Use a private endpoint where the service offers one: Microsoft's
        Foundry networking page says a Foundry resource created without networking configuration is
        reachable over the public internet by any caller with a valid credential.
    - mitigation: D3-NI
      at: managedRuntime->aiGateway
      do: "Connect the service to your network through private endpoints or a subnet you delegate to it, and let it reach your gateway and stores only."
      why: "Without a private path the service reaches only what is open to the internet, which pushes teams to expose internal tools."
      note: >-
        The service's outbound side placed on our network (network injection into a delegated subnet, or
        a private interface the provider attaches), with network rules that allow the gateway and the
        stores and nothing else. On some services this is set when the resource is created and cannot
        be added later.
    - mitigation: AML.M0012
      at: memory
      do: "Encrypt the agent's conversations, memory, files and search index with keys you manage in your own key service."
      why: "You can then withdraw the key to cut off access. Check for each service what your key does not cover."
      note: >-
        Customer-managed keys on the stores or on the service's memory resource. Coverage has gaps that
        differ by service: session working files, metadata and environment values are commonly outside
        the key, and some services cannot change the key after creation.
    - mitigation: cap-data-access-governance
      at: internalTools->orgData
      do: "Limit what a lookup can return to what the signed-in user is entitled to see, enforced where the data is stored."
      why: "Otherwise the agent can reveal anything its own identity can reach."
      note: >-
        Reads scoped to the user's own entitlements at the store, not to the agent's identity. The
        agent's identity bounds which stores it can reach at all; the user's access bounds what a query
        returns.
    - mitigation: cap-data-access-governance
      at: memory
      do: "Give the agent's identity access to its own stores and no others, and filter knowledge searches by what the asking user may see."
      why: "An index built from many people's files will otherwise answer anyone who asks."
      note: >-
        Role assignments on the stores name the agent's identity and the few people who operate them.
        The search index carries each document's access list, and retrieval filters on the asking user.
    - mitigation: D3-ACH
      at: agentDef->managedRuntime
      do: "Use cloud policy to refuse agent resources that break your baseline: no public endpoint, no key access, approved models and regions only, your own keys and stores."
      why: "A setting chosen once in a console is undone by the next deployment. Policy refuses it every time."
      note: >-
        Organisation-level cloud policy (policy definitions, service control policies, organisation
        policy constraints) evaluated when an agent resource is created or changed: deny, not audit,
        for public network access, key access, unapproved models, regions and tool types, and missing
        customer-managed keys. Several agent-specific policies are preview; test that each one refuses.

walkthrough:
  title: A user's request becomes a tool call on our systems
  moves: >-
    A request through our front end to an agent the cloud provider runs in our account, a tool
    call back into our systems over our own network, and the answer coming home.
  steps:
    - follow: endUser->entry
      label: request, session bound
      note: The request arrives at our surface, and the session is bound to one of our people.
    - follow: entry->managedRuntime
      label: invoke on our cloud identity
      note: >
        Our application calls the agent through a private endpoint, signed in as its own
        workload identity and carrying the user.
    - follow: nativeTools->memory
      label: conversation read
      note: The service asks our stores for the conversation so far, on the agent's identity.
    - follow: memory->nativeTools
      label: context loads
      note: It loads as context, decrypted with our key.
    - follow: managedRuntime->aiGateway
      label: tool call, private path
      note: >
        The loop decides it needs one of our tools. The call crosses our private network to
        the gateway, signed with a short-lived token for the agent's identity.
    - follow: aiGateway->internalTools
      label: per-user access
      note: Admitted to a named server on short-lived access for this user and this agent.
    - follow: internalTools->orgData
      label: read/write on our side
      note: The read or write happens on our side, limited to what the user may see.
    - follow: orgData->internalTools
      label: record
      note: The record comes back.
    - follow: internalTools->aiGateway
      label: screened & recorded
      note: Through the gateway, where the result is screened and the call is recorded.
    - follow: aiGateway->managedRuntime
      label: tool result
      note: The tool result lands in the service, which finishes the turn.
    - follow: nativeTools->memory
      label: turn written to our stores
      note: The turn and its result are written to our stores, under our keys.
    - follow: managedRuntime->entry
      label: completion
      note: The completion returns to our front end.
    - follow: entry->endUser
      label: attributable reply
      note: And to the person the session ran for, attributable end to end in our own logs.

scenarios:
  - title: A hosted connector's content steers a call into our systems
    steps:
      - follow: managedRuntime->vendorTools
        label: connector call, provider side
        note: >
          The service calls an approved connector from the provider's side. Nothing of ours is
          on the path.
      - follow: vendorTools->managedRuntime
        label: untrusted content
        note: >
          What the connected service returns, a record someone else wrote, enters the loop as
          instruction. Only the service's own screening could catch it here.
      - follow: managedRuntime->aiGateway
        label: steered tool request
        note: >
          The steered loop now asks for one of our tools. The private network carries the
          request without judging it, and the agent's identity is perfectly valid.
      - follow: aiGateway->internalTools
        label: scope, approval, record
        note: >
          The first point we control. The call is checked against what this agent and this
          user may reach, and a write that matters is refused without an approval for that
          exact action.
      - follow: aiGateway->managedRuntime
        label: refused, recorded
        note: The refusal goes back to the loop, and the attempt is in our record.
  - title: A developer deploys an agent with a public endpoint
    steps:
      - follow: engineer->agentDef
        label: definition with public access
        note: >
          A developer in a hurry leaves the service's network setting at its default, which is
          public.
      - follow: agentDef->managedRuntime
        label: deploy refused by cloud policy
        note: >
          The pipeline's create call is evaluated against cloud policy and denied: public
          network access is not allowed for agent resources in this account. Nothing was
          created, and the denial is in the audit log.
      - follow: engineer->agentDef
        label: private path declared
        note: The definition is corrected to use the private path (here a private endpoint) and the delegated subnet.
      - follow: agentDef->managedRuntime
        label: deploy accepted, registered
        note: The same call now passes policy, and the new version is registered.
      - follow: entry->managedRuntime
        label: reachable from our network only
        note: >
          The agent answers our application through the private endpoint. From the internet
          there is nothing to call.
  - title: A custom tool runs in our own code
    steps:
      - follow: endUser->entry
        label: request
        note: A request that will need something only our application can do.
      - follow: entry->managedRuntime
        label: session invoke
        note: Our code starts the session; the loop decides it needs the custom tool.
      - follow: managedRuntime->entry
        label: custom tool call
        note: >
          The agent asks for the call and the session waits. The request arrives on the stream
          our application already holds, which authenticates the session, not the call.
      - follow: entry->aiGateway
        label: sent through our gateway
        note: >
          Our handler checks the tool name, arguments and call id, and sends the call through
          our gateway on the session's bound user.
      - follow: aiGateway->internalTools
        label: scoped, approved, recorded
        note: The user's access, any approval for the exact action, and the record all apply.
      - follow: internalTools->orgData
        label: read/write on our side
        note: The tool runs against our systems.
      - follow: internalTools->aiGateway
        label: result
        note: The result comes back through the gateway, screened on the way.
      - follow: aiGateway->entry
        label: result to the handler
        note: Back to our handler.
      - follow: entry->managedRuntime
        label: tool result
        note: The handler posts the result back, and the service continues the turn.
  - title: A fetched page is remembered
    steps:
      - follow: nativeTools->openWeb
        label: web search & fetch
        note: The agent searches the web with a built-in tool the definition switched on.
      - follow: openWeb->nativeTools
        label: page text enters as instruction
        note: The page's visible and hidden text reaches the loop. It never passed our gateway.
      - follow: nativeTools->memory
        label: written into memory
        note: >
          The service writes the turn to conversation state, and its memory feature keeps the
          planted line as something worth remembering.
      - follow: memory->nativeTools
        label: read back next session
        note: >
          A later session, perhaps another user's if memory is shared, reads it back as
          context.
      - follow: managedRuntime->aiGateway
        label: steered call arrives
        note: The steered loop asks for one of our tools.
      - follow: aiGateway->internalTools
        label: scope & approval hold
        note: >
          The gateway's per-user access and the approval on writes are what stand between the
          remembered instruction and our data. Memory kept apart per user would have stopped
          it one step earlier.
  - title: "Variant: the definition moves to custom code"
    steps:
      - follow: agentDef->managedRuntime
        label: own loop code deployed
        note: >
          The team needs logic the configuration cannot express and ships its own agent code
          to the same service: the provider's sandbox, identity and endpoint, but the loop is
          now ours. The service's automatic rules apply only where that code calls them.
      - follow: managedRuntime->aiGateway
        label: same path in
        note: Calls still arrive the same way, over the private network on the agent's identity.
      - follow: aiGateway->internalTools
        label: our gateway's rules still hold
        note: >
          Our gateway's checks do not depend on who wrote the loop, which is why they are the
          floor that survives the move.

deviations:
  - subject: The cloud provider is drawn in the Vendor platform boundary, inside our account
    reason: >
      A boundary says who operates what is inside it. The managed service is a resource in our
      cloud account and our account's controls apply to it, but the provider operates it, so
      it sits in the provider's boundary and not in ours. The boundary's subtitle says both
      things. Drawing it as our own code would claim an inspection we do not have.
  - subject: Not yet mapped onto each cloud platform
    reason: >
      The mapping of this pattern onto AWS, Azure, Google Cloud and an on-premises data centre
      Replace the whole deviation with: subject "Not offered on premises"; reason "Mapped onto AWS, Azure and Google Cloud. In your own data centre nobody runs the loop for you, so the on-premises option is to build the agent yourself as the chat agent with tools."
      lists no platform settings. The three catalogued products carry their own settings. A
      managed agent service is a cloud provider's product, so whether an on-premises mapping
      applies at all is part of that work.
  - subject: Services that host your own agent code are a recorded variant, not a second drawing
    reason: >
      Each of the three clouds also offers a mode where the provider supplies the sandbox,
      identity, endpoint and scaling but the loop is code you write. The boxes and flows are
      the same, so it is not drawn twice. What changes is ownership: the loop and its rules are
      then yours to test, and the service's automatic rules apply only where your code calls
      them. One of the three examples offers only this mode for production today. The last
      scenario walks it.
  - subject: The AI gateway carries tool traffic only
    reason: >
      The service calls its model inside the provider's boundary, drawn as the Model inference
      item on the Managed runtime, with no Model provider box on this drawing. The gateway
      lists its one real traffic class and not the registered pack of three, the same honest
      signal the API/SDK managed agent runtime gives.
  - subject: Memory & state is reached from Native tools, with no gateway on the path
    reason: >
      The registered shape for memory is a flow from Native tools, because the state and file
      tools are how a loop reads and writes it. Here that flow leaves the provider's boundary
      for stores in our account, and nothing we run sits between: it is marked as a direct
      crossing so the finding is visible. On a platform where memory is the service's own
      resource in our account and not a store we bring, the box is that resource.
  - subject: Native tools nest inside the Managed runtime
    reason: >
      The catalogue keeps provider-run runtimes as one flat box because we cannot see inside.
      The exception recorded for the API/SDK managed agent runtime applies here for the same
      reason: the built-in tools are listed in the definition and bounded by network rules we
      set. What we configure, we draw.
  - subject: Package sources, source control and a tunnel connector are not drawn
    reason: >
      The service is called by an application and is not a coding agent, so the repository
      host and public package sources of the sibling are left out; where a definition installs
      packages or skills, the risk is pinned on Native tools. No tunnel connector exists on
      this pattern: the service is on our network.

