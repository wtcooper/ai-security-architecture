    # <<< checked
    reference:
      - title: "Building serverless architectures for agentic AI on AWS — Pattern 2: Agentic AI orchestration with Amazon Bedrock"
        url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-serverless/pattern-agentic-ai-orchestration.html
      - title: Tool-based agents for calling functions (AWS Prescriptive Guidance)
        url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-patterns/tool-based-agents-for-calling-functions.html
      - title: Security for agentic AI on AWS (AWS Prescriptive Guidance)
        url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-security/introduction.html
    summary:
      - >-
        Your own agent on AgentCore Runtime, started only by EventBridge rules, SQS queues and
        schedules, here through a Lambda function whose role carries the run's authority (AWS's security
        best practices advise AgentCore Gateway in front of the runtime instead), choosing actions from
        a catalogue of Lambda and API targets on AgentCore Gateway that Policy in AgentCore decides call
        by call. AWS's serverless pattern puts Amazon Bedrock Agents in the loop's place; that managed
        agent is the API/SDK managed agent runtime drawing, so this one keeps the loop in your code.
        Approvals above the threshold go to an operator queue and resume the run as an event.
    bindings:
      - block: events
        service: "Amazon EventBridge, SQS and Lambda"
        note: "The ingress function validates the message and invokes the runtime under the run's grant: its own role, or an on-behalf-of token carried on the message. AWS's security best practices advise AgentCore Gateway in front of the runtime as its single, governed entry point."
        options:
          - { name: "Amazon EventBridge, SQS and Lambda", kind: commercial, url: "https://docs.aws.amazon.com/scheduler/latest/UserGuide/what-is-scheduler.html", note: "Today's mapping: the function validates each message and invokes the runtime under the run's grant.", packs: [awsNative] }
          - { name: "AgentCore Gateway in front of the runtime", kind: commercial, url: "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-security-best-practices.html", note: "AWS's runtime security guidance describes the gateway as the single governed entry point to the runtime." }
          - { name: "Amazon EventBridge Pipes", kind: commercial, url: "https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-pipes.html", note: "Point-to-point from a source to a target with filtering and optional enrichment." }
          - { name: "Amazon MSK with a Lambda event source mapping", kind: commercial, url: "https://docs.aws.amazon.com/lambda/latest/dg/with-msk.html", note: "Where the business events already flow through Kafka." }
      - { block: planner, service: Your agent on AgentCore Runtime, note: "AgentCore harness is the managed alternative. Amazon Bedrock Agents is now Agents Classic, in maintenance mode and closed to new sign-ups." }
      - block: localTools
        service: "AgentCore Code Interpreter"
        options:
