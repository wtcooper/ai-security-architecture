    summary:
      - >-
        Your own agent on Amazon Bedrock AgentCore Runtime behind a front door that signs users in
        through Amazon Cognito (an Application Load Balancer here; API Gateway or CloudFront also
        serve), reaching Bedrock models and your tools through AgentCore Gateway with Policy in
        AgentCore, inside a VPC whose outbound traffic leaves through AWS Network Firewall. AgentCore
        harness can run the loop for you; that managed harness is the API/SDK managed agent runtime
        drawing, so this one keeps the loop in your code.
    bindings:
