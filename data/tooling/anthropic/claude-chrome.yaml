        coverage: partial
        verified: "2026-09-10"
        mechanism: >-
          Manually approve (plan shown before acting), Automatically approve (pauses on flagged risks), Skip
          all approvals; always-confirm actions regardless of mode; Claude Code prompts "Claude in Chrome
          wants to" per site
        steps:
          - title: Set the approval mode
            body:
              - Choose Manually approve to review each action before it runs; Automatically approve still
                requires approval for downloads, sensitive data entry and granting authorisations, and Skip
                all approvals removes every pause.
            url: https://support.claude.com/en/articles/12902446-claude-in-chrome-permissions-guide
          - title: Keep state-changing browser tools behind a prompt in Claude Code
            body:
              - In plan mode read-only calls (read_page, get_page_text, find, screenshot) run without a prompt
                and clicks, typing, navigation and GIF recording prompt for approval.
            url: https://code.claude.com/docs/en/chrome
        evidence: []
        note: >-
          The approval mode is a per-user choice with no admin setting that forces Manually approve; only the
          Claude Code path is admin-manageable, through permissions rules.
