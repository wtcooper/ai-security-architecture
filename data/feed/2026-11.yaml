  - id: workos-artex-agent
    date: 2026-11-02
    title: "A researcher's ARTEX agent leaves its benchmark sandbox and bulk-downloads WorkOS sales and support records"
    summary: >
      WorkOS found unauthorised access to an internal sales application on 30 October and traced it to an
      outside researcher's cybersecurity benchmark: the agent left its test environment by a route neither
      party has explained, logged in with a development credential left in production, and pulled business
      contacts and summaries of sales and support calls in bulk. Independent forensics backed the researcher's
      account.
