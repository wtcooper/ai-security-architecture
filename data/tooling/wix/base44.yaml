# Base44: one entity per product × reference architecture. Facts are dated (asOf) and cite the vendor's own
# documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# Scope: the Base44 app editor and its AI chat, the built-in database (data tables with permission rules), login,
# backend functions, connectors and secrets, publishing at base44.app or a custom domain, and the workspace
# settings of the Business and Enterprise plans (Base44's two "Enterprise plans": Authentication, Governance,
# Security Center, Manage connectors, Secrets).
# Exclusions: Superagents (persistent personal agents reached over chat channels, another pattern; only the
# workspace's channel policy is noted); Base Code (apps edited from an existing repository); in-app agents built
# into an app; the Base44 app for iPhone and Android (a shell over the same workspace); the white-label editor;
# the developer backend platform (beta) used without the editor.
# 2026-11-25: onboarded on archHostedAppBuilder. Every docs.base44.com page was read as Markdown (<path>.md, from
# docs.base44.com/llms.txt), all 200; the URLs below are the same pages without .md. The App Management (Unpublish
# app) and Compliance API reference pages are marked beta; the Audit Logs API overview and List audit logs pages
# no longer carry a beta notice (re-checked 2026-11-25). Plan names: Free, Starter, Builder, Pro, Elite, Business
# and Enterprise; "Enterprise plan" in Base44's own pages means Business or Enterprise, and
# several features say "Enterprise plan only, not included in Business". The default role and visibility rows
# behind Reset to defaults in publishing permissions are not stated. Not read: trust.base44.com (200, renders
# client-side); www.wix.com answered 403 to automated fetch. The subprocessor list is from base44.com/resources
# /security (base44.com/security redirects there).
vendor: wix
family: Base44
tools:
  - id: toolBase44
    name: Base44 (builder agent, built-in database and app hosting)
    surfaceClasses:
      - saasAgentPlatform
    variants:
      - name: Base44 app editor and AI chat (web)
        class: saasAgentPlatform
        url: https://docs.base44.com/Getting-Started/app-editor-overview
    architecture: archHostedAppBuilder
    status: ga
    asOf: "2026-11"
    summary:
      - >-
        Wix's app builder: the AI chat builds an app with data tables, login, backend functions, connectors and
        secrets, sets permission rules on each table as it creates it, and publishes the app at a base44.app
        address or a custom domain. Visibility is Public (no login or login required), Private (invited people)
        or Workspace; apps that act like public sites are set to Public without login automatically. The app's
        pages read data through Base44's API, where the table's permission rules decide what each person sees.
      - >-
        Administration is the workspace's, on the Business and Enterprise plans: Authentication (verified domains,
        workspace SSO, required SSO and 2FA, restricted workspace creation), Governance (SSO for every app,
        publishing permissions by role and group, MCP access, collaboration, app transfers, channel policy, AI
        models), Manage connectors, Secrets (workspace API keys), the Security Center (inventory, scheduled scans,
        unpublish) and the Audit Logs and Compliance APIs (Enterprise). The scan warns at publish and blocks nothing.
    facts:
      - label: Plans
        value: >-
          Free, Starter, Builder, Pro, Elite, Business and Enterprise. Business (self-serve) adds SSO, IP
          allowlisting, publishing controls, connector governance and the Security Center; Enterprise adds SCIM,
          audit logs, training exclusion, scheduled scans, the Compliance API, restricted workspace creation and AI
          model controls.
        url: https://docs.base44.com/Enterprise/Base44-for-enterprises
      - label: Inference & routing
        value: >-
          The AI chat uses models from Anthropic, OpenAI, Google and Base44; on Enterprise an admin can turn
          providers, open-weight and high-credit models off (at least two providers stay on). The subprocessor list
          names OpenAI and Anthropic for LLM API calls and Langfuse for LLM logging.
        url: https://docs.base44.com/Enterprise/Enterprise-SSO-and-app-visibility#controlling-ai-models
      - label: Data leaving the device
        value: >-
          Apps, chats and app data are processed and stored by Base44 (subprocessors include Mongo, Render and Google
          Cloud). App data is stored in the US unless a Business or Enterprise workspace chooses the EU, UK or
          Australia for new apps; public files and account details stay in the US, and processing can happen
          elsewhere.
        url: https://docs.base44.com/Community-and-support/Privacy-and-security#data-storage-locations-and-compliance
      - label: Retention & training
        value: >-
          Enterprise workspace data, including what app users submit, is not used to train AI models; on every
          other plan, Business included, it can be, and there is no opt-out setting. Deleted apps are kept 30 days;
          data backups 7 days on Elite and 28 days on Business and Enterprise.
        url: https://docs.base44.com/Community-and-support/Privacy-and-security#ai-model-training
      - label: Docs index
        value: docs.base44.com (index at docs.base44.com/llms.txt); admin pages under Enterprise.
        url: https://docs.base44.com/Enterprise/getting-started-admin
      - label: Compliance scope
        value: >-
          SOC 2 Type II (report under NDA through trust.base44.com) and ISO 27001; a bug bounty programme and
          third-party penetration testing are described on the security page.
        url: https://base44.com/resources/security
      - label: Vendor ownership
        value: >-
          Wix.com Ltd. (Israel) appears in Base44's subprocessor directory for "providing and improving the
          services"; Wiz's 2025 disclosure went to Base44 and Wix.
        url: https://base44.com/resources/security
    items:
      - title: Where each control lives
        body:
          - >-
            Workspace › Settings › Authentication (Verified Domains, Restrict workspace creation, SSO, Default role
            for SSO auto-provisioned users, Require SSO for all workspace members, Require two-factor
            authentication); Governance under Security & Control (Apps SSO, publishing permissions, MCP access,
            Collaboration, App transfers, Data in & out, embedding, AI model access, IP allowlist); Security Center;
            Secrets; Manage connectors under Build tools. Per app: Dashboard › Overview (App Visibility), Data ›
            Permissions, Security, Secrets and Settings.
        links:
          - title: Managing apps and Superagents in your enterprise workspace
            url: https://docs.base44.com/Enterprise/Enterprise-SSO-and-app-visibility
          - title: Getting started as an enterprise admin
            url: https://docs.base44.com/Enterprise/getting-started-admin
      - title: SSO for apps reaches public apps too
        body:
          - >-
            With Require workspace SSO on, every app in the workspace signs people in through the workspace's
            identity provider, Public (no login) apps included, and builders cannot change sign-in methods; apps for
            customers or contractors are excluded one by one, and their builders then set up other sign-in methods.
        links:
          - title: Enforcing SSO for apps
            url: https://docs.base44.com/Enterprise/Enterprise-SSO-and-app-visibility#enforcing-sso-for-apps
    riskNotes:
      - risk: riskSensitiveDataDisclosure
        note: >-
          Smart app visibility sets apps that look like public sites to Public without login, and a table with All
          Users rules on a public app is readable by anyone; the security scan flags private fields on publicly
          readable tables.
      - risk: riskCrossTenantCredentialPropagation
        note: >-
          In July 2025 Wiz found Base44's register and verify endpoints accepted any app's id, letting anyone join
          private apps, SSO-only apps included; Base44 fixed it platform-wide in under 24 hours.
      - risk: riskShadowAndUnknownAgents
        note: >-
          Without Restrict workspace creation (Enterprise), anyone on the domain creates a personal workspace, and
          accounts that existed before it keep theirs.
      - risk: riskAgenticDelegationConfusedDeputy
        note: >-
          A Shared Credential connector acts as one account for everyone using the app; only App User Credential
          connectors act as each person.
      - risk: riskRogueActions
        note: >-
          Branches use the app's live data, and test data is a separate database the maker must turn on (Builder plan
          and up); the published app always uses production data.
      - risk: riskInsecureModelOutput
        note: >-
          The AI chat writes the permission rules on every table it creates; the scan checks for missing rules,
          over-broad access and user-editable fields that rules rely on, and warns rather than blocks.
    settings:
      - id: publishingVisibility
        name: Role based publishing permissions (Allowed visibility, Default visibility)
        where: Workspace › Settings › Governance › Role based publishing permissions
        setVia: [adminConsole]
        area: sharing
        default: Not stated (Reset to defaults restores them); Owners can always use any visibility
        recommended: Editor and Guest rows allowed Private and Workspace, Default visibility Workspace; Public only through a group rule or a publish request
        value: "Editors: Private and Workspace"
        why: A new app opens to the workspace by default, and a builder who wants a public app has to ask an admin.
        mitigations: [D3-APA, AML.M0029]
        requires: Business or Enterprise
        url: https://docs.base44.com/Enterprise/Enterprise-SSO-and-app-visibility#setting-permissions-by-role
        verified: "2026-11-25"
      - id: restrictExternalCollaborators
        name: Restrict external collaborators
        where: Workspace › Settings › Governance › Collaboration
        setVia: [adminConsole]
        area: identity
        default: "Off (any member can invite outside collaborators)"
        recommended: "On"
        why: Only owners and admins can bring someone from outside the workspace into an app's editor.
        mitigations: [D3-APA]
        requires: Business or Enterprise
        url: https://docs.base44.com/Enterprise/Enterprise-SSO-and-app-visibility#controlling-collaboration
        verified: "2026-11-25"
      - id: ssoDefaultRole
        name: Default role for SSO auto-provisioned users
        where: Workspace › Settings › Authentication
        setVia: [adminConsole, identityProvider]
        area: identity
        default: Not stated (options No access, Viewer, Editor)
        recommended: Viewer, with builders made Editor through IdP groups and SCIM
        value: "Viewer"
        why: Signing in through SSO lets a colleague use workspace apps but not build or publish until a group grants Editor.
        mitigations: [D3-APA]
        requires: Business or Enterprise (or Elite for workspaces created before October 2026), with workspace SSO set up
        url: https://docs.base44.com/Enterprise/SSO-for-enterprise-workspace#setting-a-default-role
        verified: "2026-11-25"
      - id: scimProvisioning
        name: SCIM provisioning
        where: Workspace › Settings › Authentication (SCIM base URL) and Settings › Secrets (workspace API key)
        setVia: [identityProvider, adminConsole]
        area: identity
        default: "Off"
        recommended: "On"
        why: Membership and roles follow your directory, and people who leave lose access without manual removal.
        mitigations: [D3-APA]
        requires: Enterprise
        url: https://docs.base44.com/Enterprise/SCIM-provisioning
        verified: "2026-11-25"
      - id: mcpAccessPolicy
        name: MCP access for AI assistants
        where: Workspace › Settings › Governance › MCP access for AI assistants
        setVia: [adminConsole]
        area: tools
        default: Not stated
        recommended: Sign-in required
        why: An app can offer its MCP connection only to AI assistants that sign in, not to anyone who finds the endpoint.
        mitigations: [D3-APA]
        requires: Business or Enterprise
        url: https://docs.base44.com/Enterprise/Enterprise-SSO-and-app-visibility#managing-mcp-access
        verified: "2026-11-25"
      - id: scheduledScans
        name: Scheduled scans (Weekly scan, Monthly scan)
        where: Workspace › Settings › Security Center › Set up scheduled scan
        setVia: [adminConsole]
        area: tools
        default: Both off
        recommended: Weekly scan on, all published apps
        value: "Weekly, published apps"
        why: Every changed app is rescanned each week, so data permission, secret and dependency risks are found without the maker running a scan.
        mitigations: [D3-AVE]
        requires: Enterprise
        url: https://docs.base44.com/Enterprise/security-center#scheduling-scans
        verified: "2026-11-25"
      - id: tablePermissions
        name: Permissions (data table rules)
        where: App › Dashboard › Data › (table) › Permissions › Edit
        setVia: [adminConsole]
        area: data
        default: Set by the AI chat when it creates the table
        recommended: Creator Only or Entity-User Field Comparison on every table with personal or client data; All Users only on tables public by design
        value: "No All Users on private tables"
        why: The rules alone decide who reads and changes each record, and on a public app All Users means anyone on the internet.
        mitigations: [cap-data-access-governance]
        url: https://docs.base44.com/Setting-up-your-app/Managing-security-settings
        verified: "2026-11-25"
      - id: sharedCredentialConnectors
        name: Shared Credential (per connector)
        where: Workspace › Settings › Build tools › Manage connectors
        setVia: [adminConsole]
        area: tools
        default: On (connectors Base44 releases later start on unless New connectors is Keep it off)
        recommended: Off for connectors to your systems of record (CRM, files, mail, warehouse)
        value: "Off for systems of record"
        why: No app can serve every visitor from one connected account's access to your records.
        mitigations: [cap-data-access-governance, AML.M0028]
        requires: Business or Enterprise
        url: https://docs.base44.com/Enterprise/workspace-connectors#managing-workspace-connectors
        verified: "2026-11-25"
      - id: appUserCredentialConnectors
        name: App User Credential (per connector, with your own OAuth client)
        where: Workspace › Settings › Build tools › Manage connectors › App User Credential › Set up
        setVia: [adminConsole]
        area: tools
        default: Not set up
        recommended: Set up for each approved system of record with Use your own OAuth client and only the scopes the app needs
        value: "Own OAuth client, minimum scopes"
        why: Each person connects their own account, so the service decides what they see, and the grant is issued to a client you can revoke.
        mitigations: [cap-data-access-governance, D3-CH]
        requires: Business or Enterprise; Managed OAuth by Base44 needs Pro or higher
        url: https://docs.base44.com/Enterprise/workspace-connectors#setting-up-app-user-connectors
        verified: "2026-11-25"
      - id: appSecrets
        name: Secrets (app dashboard)
        where: App › Dashboard › Secrets
        setVia: [adminConsole]
        area: data
        default: Keys pasted in the chat from known providers are saved here automatically
        recommended: Every third-party key held here and used only from backend functions
        value: "All keys here, backend only"
        why: Secret values stay on the server and never reach the page; keys from unrecognised services pasted in chat stay in the message.
        mitigations: [D3-CH]
        url: https://docs.base44.com/Integrations/managing-app-secrets
        verified: "2026-11-25"
      - id: workspaceApiKeys
        name: Workspace secrets (workspace API keys)
        where: Workspace › Settings › Secrets
        setVia: [adminConsole]
        area: identity
        default: None
        recommended: One key per integration with only the permissions it needs, disabled when unused
        value: "One key per integration, least permission"
        why: A key acts as the workspace owner for deploy and admin calls, so each is scoped and can be disabled at once.
        mitigations: [D3-CH]
        requires: Business or Enterprise; audit-log, monitoring and SCIM keys need Enterprise
        url: https://docs.base44.com/Enterprise/workspace-secrets
        verified: "2026-11-25"
      - id: githubSync
        name: Base44 Builder GitHub app (repository access)
        where: App › Dashboard › GitHub icon › Connect to GitHub › Authorize Base44 Builder › Install
        setVia: [adminConsole]
        area: tools
        default: Chosen at install
        recommended: Only the app's own repository, in an organization whose branch protection you set
        value: "Selected repositories only"
        why: Sync runs on an app installation limited to named repositories, not on a person's token.
        mitigations: [D3-CH]
        requires: Builder plan or higher; only the app owner connects it
        url: https://docs.base44.com/developers/app-code/local-development/github
        verified: "2026-11-25"
      - id: testData
        name: Test Data
        where: App › Dashboard › Settings › Advanced Capabilities
        setVia: [adminConsole]
        area: data
        default: "Off"
        recommended: On for every app that holds real data
        value: "On"
        why: The maker and the AI try changes on a separate test database in preview, while the published app keeps production data.
        mitigations: [cap-staged-rollout-gate]
        requires: Builder plan or higher
        url: https://docs.base44.com/documentation/managing-app-data/testing-your-data
        verified: "2026-11-25"
      - id: requireSsoMembers
        name: Require SSO for all workspace members
        where: Workspace › Settings › Authentication
        setVia: [adminConsole, identityProvider]
        area: identity
        default: "Off (members can sign in with their own login method)"
        recommended: On, with Exempt guests from SSO cleared and MFA at the identity provider
        value: "On, guests not exempt"
        why: Makers reach the workspace only through your identity provider, its MFA and its leaver process.
        mitigations: [D3-MFA]
        requires: >-
          Business or Enterprise (or Elite for workspaces created before October 2026), with workspace SSO set up;
          it takes effect only after a workspace admin completes a successful SSO sign-in (until then it shows Not
          active yet)
        url: https://docs.base44.com/Enterprise/SSO-for-enterprise-workspace#requiring-sso
        verified: "2026-11-25"
      - id: requireWorkspaceSsoApps
        name: Require workspace SSO (Apps SSO)
        where: Workspace › Settings › Governance › Apps SSO
        setVia: [adminConsole]
        area: identity
        default: "Off"
        recommended: On, excluding only apps built for customers or contractors outside your identity provider
        value: "On, customer apps excluded"
        why: Every app's visitors sign in through your identity provider, and builders cannot add other sign-in methods.
        mitigations: [D3-MFA]
        requires: Business or Enterprise, with workspace SSO set up
        url: https://docs.base44.com/Enterprise/Enterprise-SSO-and-app-visibility#requiring-workspace-sso
        verified: "2026-11-25"
      - id: requireTwoFactor
        name: Require two-factor authentication
        where: Workspace › Settings › Authentication
        setVia: [adminConsole]
        area: identity
        default: "Off"
        recommended: "On"
        why: Members and guests who do not sign in with SSO need 2FA on their Base44 account to open the workspace.
        mitigations: [D3-MFA]
        requires: Business or Enterprise
        url: https://docs.base44.com/Enterprise/SSO-for-enterprise-workspace#requiring-two-factor-authentication
        verified: "2026-11-25"
      - id: guestsCanPublish
        name: Can publish (Guest role)
        where: Workspace › Settings › Governance › Role based publishing permissions
        setVia: [adminConsole]
        area: sharing
        default: Not stated
        recommended: "Off"
        why: A guest such as a contractor builds the app, and a workspace owner or admin reviews and publishes it from the publish request.
        mitigations: [AML.M0029]
        requires: Business or Enterprise
        url: https://docs.base44.com/Enterprise/Enterprise-SSO-and-app-visibility#handling-publish-requests
        verified: "2026-11-25"
      - id: newConnectors
        name: New connectors
        where: Workspace › Settings › Build tools › Manage connectors
        setVia: [adminConsole]
        area: tools
        default: Turn it on
        recommended: Keep it off
        why: A connector Base44 releases stays blocked for both credential types until an admin allows it.
        mitigations: [AML.M0028]
        requires: Business or Enterprise
        url: https://docs.base44.com/Enterprise/workspace-connectors#handling-new-connectors
        verified: "2026-11-25"
      - id: dataInOutPolicy
        name: Workspace policy (Data in & out, Communication channels)
        where: Workspace › Settings › Governance › Data in & out
        setVia: [adminConsole]
        area: tools
        default: "Off; every channel allowed when first turned on"
        recommended: On, with only the channels your firm uses allowed
        value: "On, approved channels only"
        why: Apps' agents can message and be messaged only on channels you allow, and builders cannot override it.
        mitigations: [AML.M0028]
        requires: Enterprise
        url: https://docs.base44.com/Enterprise/Enterprise-SSO-and-app-visibility#controlling-app-channels
        verified: "2026-11-25"
      - id: securityCenterInventory
        name: Security Center app inventory (export)
        where: Workspace › Settings › Security Center › export
        setVia: [adminConsole]
        area: audit
        default: Available to owners and admins
        recommended: Exported monthly to your app inventory, with public apps and apps without SSO reviewed first
        value: "Export monthly to your inventory"
        why: Each app's owner, collaborators, visibility, publish status, connectors, secrets and risks is listed in one export.
        mitigations: [D3-AI]
        requires: Business or Enterprise
        url: https://docs.base44.com/Enterprise/security-center#exporting-app-inventory
        verified: "2026-11-25"
      - id: outgoingWebhooks
        name: Outgoing webhooks (App published, App taken offline)
        where: Workspace › Settings › Webhooks › Outgoing › Create webhook
        setVia: [adminConsole]
        area: audit
        default: None
        recommended: A webhook to your inventory or SIEM for App published and App taken offline
        value: "Publish events to your inventory"
        why: Your inventory learns of each publish and takedown as it happens, from a signed request.
        mitigations: [D3-AI, AML.M0024]
        requires: Business or Enterprise
        url: https://docs.base44.com/Enterprise/workspace-webhooks
        verified: "2026-11-25"
      - id: restrictWorkspaceCreation
        name: Restrict workspace creation
        where: Workspace › Settings › Authentication › Verified Domains
        setVia: [adminConsole]
        area: identity
        default: "Off"
        recommended: "On"
        why: New accounts on your domain join your workspace through SSO, SCIM or invitation instead of opening a personal workspace you cannot see.
        mitigations: [cap-shadow-ai-discovery]
        requires: Enterprise, with a verified domain
        url: https://docs.base44.com/Enterprise/restrict-workspace-creation
        verified: "2026-11-25"
      - id: appTransfers
        name: App transfers
        where: Workspace › Settings › Governance › App transfers
        setVia: [adminConsole]
        area: sharing
        default: Workspace admins and owners
        recommended: Workspace owners only
        why: An app and its data leave the governed workspace only by an owner's decision.
        mitigations: [cap-shadow-ai-discovery]
        requires: Business or Enterprise
        url: https://docs.base44.com/Enterprise/Enterprise-SSO-and-app-visibility#controlling-app-transfers
        verified: "2026-11-25"
      - id: securityCenterUnpublish
        name: Unpublish (Security Center, More actions)
        where: Workspace › Settings › Security Center › app row › More actions › Unpublish
        setVia: [adminConsole, apiCli]
        area: sharing
        recommended: Workspace owners and admins take a leaking app offline here, then turn off its Shared Credential connectors
        value: "Admins unpublish, then cut connectors"
        why: The published app is taken offline immediately and visitors get an offline notice; data, settings and domains stay.
        mitigations: [cap-agent-kill-switch]
        requires: Business or Enterprise; the Unpublish app API is beta
        url: https://docs.base44.com/Enterprise/security-center#taking-action-on-apps
        verified: "2026-11-25"
      - id: auditLogsApi
        name: Audit Logs API (audit_logs:read)
        where: Workspace › Settings › Secrets › Create API Key › Read audit logs
        setVia: [apiCli]
        area: audit
        default: No key
        recommended: One key polled by your SIEM for app, connector, governance and SSO events
        value: "Polled by your SIEM"
        why: Publishes, unpublishes, publish requests, governance rule changes and connector access changes reach your own store.
        mitigations: [AML.M0024]
        requires: Enterprise
        url: https://docs.base44.com/developers/references/audit-logs-api/get-started/overview
        verified: "2026-11-25"
      - id: complianceApiInventory
        name: Compliance API (Read compliance inventory, member directory, security findings)
        where: Workspace › Settings › Secrets › Create API Key › Workspace permissions
        setVia: [apiCli]
        area: audit
        default: No key
        recommended: One read-only key for your posture-management partner, if you use one
        value: "One key for your posture tool"
        why: Your security tool reads the workspace's apps, settings, members and findings alongside your other SaaS.
        mitigations: [D3-AI]
        requires: Enterprise
        url: https://docs.base44.com/Enterprise/compliance-api
        verified: "2026-11-25"
      - id: dataResidency
        name: Data residency
        where: Workspace › Settings › Overview › Data hosting
        setVia: [adminConsole]
        area: data
        default: United States
        recommended: Your approved region
        why: New apps store their data and users in the region your contracts allow; public files and account details stay in the US.
        mitigations: []
        requires: Business or Enterprise
        url: https://docs.base44.com/Community-and-support/Privacy-and-security#changing-your-workspace-data-residency
        verified: "2026-11-25"
      - id: aiModelAccess
        name: AI model access (Model providers, Open-weight models)
        where: Workspace › Settings › Governance › AI model access
        setVia: [adminConsole]
        area: data
        default: All providers on
        recommended: Only the providers your firm has approved
        why: App building, agents and automations use only models whose terms you have accepted.
        mitigations: []
        requires: Enterprise
        url: https://docs.base44.com/Enterprise/Enterprise-SSO-and-app-visibility#controlling-ai-models
        verified: "2026-11-25"
      - id: appEmbedding
        name: App embedded in iframe
        where: Workspace › Settings › Governance › App embedded in iframe
        setVia: [adminConsole]
        area: network
        default: Anyone
        recommended: Only these sites, listing your own domains
        value: "Only these sites"
        why: No other website can frame your apps to overlay or harvest what visitors enter.
        mitigations: []
        requires: Business or Enterprise
        url: https://docs.base44.com/Enterprise/Enterprise-SSO-and-app-visibility#controlling-app-embedding
        verified: "2026-11-25"
    controls:
      - mitigation: D3-APA
        coverage: native
        mechanism: >-
          Role and group based publishing permissions (Can publish, Allowed visibility, Default visibility),
          Restrict external collaborators, the SSO default role, SCIM and the MCP access policy, enforced by Base44
          when anyone publishes
        steps:
          - title: Keep builders to private and workspace apps
            body:
              - >-
                In Governance › Role based publishing permissions allow Editor and Guest only Private and Workspace,
                with Default visibility Workspace.
            url: https://docs.base44.com/Enterprise/Enterprise-SSO-and-app-visibility#setting-permissions-by-role
          - title: Keep outsiders out of the editor
            body:
              - Turn on Restrict external collaborators in Governance › Collaboration.
            url: https://docs.base44.com/Enterprise/Enterprise-SSO-and-app-visibility#controlling-collaboration
          - title: Grant building through groups
            body:
              - Set Default role for SSO auto-provisioned users to Viewer and grant Editor through SCIM-synced groups.
            url: https://docs.base44.com/Enterprise/SSO-for-enterprise-workspace#setting-a-default-role
        note: >-
          Native on the rule applied to the three builders onboarded on 2026-11-25: an admin sets the default
          audience of new apps and stops non-admins publishing beyond the workspace, and the platform enforces both
          at publish. Boundaries: Business or Enterprise; Owners can always publish anything; a member in several
          groups gets the most permissive rule; Public (login required) admits any Base44 account; the pages do not
          say how smart app visibility, which sets public-looking apps to Public without login, interacts with a
          role's allowed visibility.
        verified: "2026-11-25"
      - mitigation: D3-AVE
        coverage: partial
        mechanism: >-
          The security scan (data permissions, user field access, private fields, exposed secrets, backend
          functions, credit protection, dependencies, static analysis on Builder and up), its status shown in the
          publish panel, and Security Center bulk and scheduled scans
        steps:
          - title: Scan every published app weekly
            body:
              - In Security Center › Set up scheduled scan turn on Weekly scan for published apps.
            url: https://docs.base44.com/Enterprise/security-center#scheduling-scans
          - title: Scan before publishing
            body:
              - >-
                Run the scan from the app's Dashboard › Security before each publish and fix or acknowledge every
                finding.
            url: https://docs.base44.com/Setting-up-your-app/running-a-security-scan
          - title: Chase owners of risky apps
            body:
              - Use Notify owner in the Security Center for apps with open critical or high risks.
            url: https://docs.base44.com/Enterprise/security-center#notifying-app-owners
        note: >-
          Partial on the rule applied to every builder on this drawing: native would need a block on scan findings
          that only someone other than the maker can clear. Base44's publish panel shows the scan status and "warns
          you, but it doesn't stop you from publishing", no setting makes it blocking, and the maker can acknowledge
          a finding so it does not reappear. Scheduled scans need Enterprise and skip Superagents and Base Code apps.
        verified: "2026-11-25"
      - mitigation: cap-data-access-governance
        coverage: partial
        mechanism: >-
          Per-table permission rules (All Users, Creator Only, Entity-User Field Comparison, User Property Check),
          field-level rules, the scan's permission, user-field and private-field checks, and per-connector Shared
          Credential and App User Credential switches for the workspace
        steps:
          - title: Read each table's rules
            body:
              - >-
                Open Dashboard › Data › (table) › Permissions on apps with real data and replace All Users with
                Creator Only or a field comparison where records are private.
            url: https://docs.base44.com/Setting-up-your-app/Managing-security-settings
          - title: Make connectors act as the visitor
            body:
              - >-
                In Manage connectors turn Shared Credential off for systems of record and set up App User Credential
                with your own OAuth client.
            url: https://docs.base44.com/Enterprise/workspace-connectors#managing-workspace-connectors
        note: >-
          Partial on the rule for this drawing: native would need the platform to refuse publishing while a table
          lacks a rule limiting rows to the visitor, and connectors that can only read as the visitor. The admin can
          force connectors to act as each person, but table rules are set per app by the AI chat and the maker, the
          scan that checks them warns and does not block, and backend functions that bypass data rules are listed
          for review rather than prevented.
        verified: "2026-11-25"
      - mitigation: D3-CH
        coverage: partial
        mechanism: >-
          App secrets (server-side, masked; keys from known providers pasted into chat are moved into secrets
          before the AI reads them), the scan's exposed-secret and credit-protection checks, App User Credential
          connectors on your own OAuth client, workspace API keys and the GitHub app on selected repositories
        steps:
          - title: Keep keys in the secret store
            body:
              - >-
                Store third-party keys under Dashboard › Secrets and call the services from backend functions only.
            url: https://docs.base44.com/Integrations/managing-app-secrets
          - title: Issue grants to your own OAuth client
            body:
              - Set up App User Credential connectors with Use your own OAuth client and the minimum scopes.
            url: https://docs.base44.com/Enterprise/workspace-connectors#setting-up-app-user-connectors
          - title: Scope workspace API keys
            body:
              - Create one workspace API key per integration with only its permissions, and disable unused keys.
            url: https://docs.base44.com/Enterprise/workspace-secrets
        note: >-
          Partial on the rule for this drawing: the platform keeps outside keys in a server-side store and the scan
          flags keys visitors could reach, but no admin setting refuses a publish while the front end holds a key,
          and each Shared Credential connector's token sits in Base44's store. Chat redaction covers OpenAI,
          Anthropic, Stripe, AWS, GitHub, Google and Slack keys, Telegram and Discord bot tokens and JWTs; other keys
          stay in the message.
        verified: "2026-11-25"
      - mitigation: cap-staged-rollout-gate
        coverage: partial
        mechanism: >-
          Test Data (a separate test database used in preview, Builder plan and up), branches with their own code,
          chat and preview, preview links that follow app visibility once published, Version History for code and
          Backup & Restore for data (Elite 7 days, Business and Enterprise 28 days)
        steps:
          - title: Turn on test data
            body:
              - Turn on Test Data under Dashboard › Settings › Advanced Capabilities for every app with real data.
            url: https://docs.base44.com/documentation/managing-app-data/testing-your-data
          - title: Know how to restore data
            body:
              - Restore a table or every table from Dashboard › Data › Backup & Restore.
            url: https://docs.base44.com/Enterprise/backup-and-restore
        note: >-
          Partial on the rule for this drawing: native where the agent cannot change the live app's data and live
          data can be restored apart from code. In Base44 the AI chat on main works with production records unless
          the maker switches preview to test data, branches use the live data, and test data is off until turned on
          per app; data restore is separate from Version History, which is good, and needs Elite or higher.
        verified: "2026-11-25"
      - mitigation: D3-MFA
        coverage: native
        mechanism: >-
          Require SSO for all workspace members, Require workspace SSO for every app (builders cannot change sign-in
          methods), Require two-factor authentication for members not on SSO, and per-app Require MFA for app users
        steps:
          - title: Require SSO for makers
            body:
              - >-
                In Authentication turn on Require SSO for all workspace members with Exempt guests from SSO cleared,
                then sign in once through SSO as a workspace admin: until then the setting shows Not active yet.
            url: https://docs.base44.com/Enterprise/SSO-for-enterprise-workspace#requiring-sso
          - title: Require SSO for every app
            body:
              - >-
                In Governance › Apps SSO turn on Require workspace SSO and exclude only apps for people outside your
                identity provider.
            url: https://docs.base44.com/Enterprise/Enterprise-SSO-and-app-visibility#requiring-workspace-sso
          - title: Require 2FA for the rest
            body:
              - Turn on Require two-factor authentication in Authentication.
            url: https://docs.base44.com/Enterprise/SSO-for-enterprise-workspace#requiring-two-factor-authentication
        note: >-
          Native on this drawing's rule: the admin can make the identity provider the only sign-in for makers and for
          visitors of workspace apps, the second factor being the identity provider's as the pin states, and Base44
          also enforces 2FA for members who do not sign in with SSO. Boundaries: Business or Enterprise (workspace SSO
          also on Elite for workspaces created before October 2026); Require SSO applies only once an admin has
          signed in through SSO; excluded apps keep SSO until their builders change it, then offer other methods;
          bringing an app back to SSO leaves existing sessions until they end.
        verified: "2026-11-25"
      - mitigation: AML.M0029
        coverage: native
        mechanism: >-
          Publishing permissions by role and group (Can publish, Allowed visibility): a member whose rule does not
          allow a publish sends a publish request, and a workspace owner or admin reviews the app and publishes it on
          their behalf
        steps:
          - title: Send public publishing through requests
            body:
              - >-
                Leave Public out of the Editor and Guest rows' Allowed visibility, and turn Can publish off for
                Guest.
            url: https://docs.base44.com/Enterprise/Enterprise-SSO-and-app-visibility#setting-permissions-by-role
          - title: Review the request in the app
            body:
              - >-
                Open the request from the notification, check the app's visibility, data permissions and connectors
                in the editor, and publish it if it passes.
            url: https://docs.base44.com/Enterprise/Enterprise-SSO-and-app-visibility#handling-publish-requests
        note: >-
          Native on the rule for this drawing: each publish beyond what the member's rule allows needs an owner or
          admin, who publishes it, so the maker cannot approve their own. Boundaries: the trigger is visibility, not
          connectors, so an app with connectors published to the workspace goes live without review; the request
          carries the visibility and a message, and the reviewer opens the app to see the rest.
        verified: "2026-11-25"
      - mitigation: AML.M0028
        coverage: native
        mechanism: >-
          Manage connectors (Business and Enterprise): per-connector Shared Credential and App User Credential
          switches, bulk updates, New connectors kept off until reviewed, and the Data in & out channel policy
          (Enterprise); disabling blocks the connector in apps, Superagents and in-app agents
        steps:
          - title: Block unreviewed connectors
            body:
              - >-
                In Manage connectors set New connectors to Keep it off and switch off both credential types for every
                connector you have not approved.
            url: https://docs.base44.com/Enterprise/workspace-connectors#handling-new-connectors
          - title: Limit apps' channels
            body:
              - Turn on the Data in & out workspace policy and allow only the channels you use.
            url: https://docs.base44.com/Enterprise/Enterprise-SSO-and-app-visibility#controlling-app-channels
        note: >-
          Native on the rule for this drawing: an admin allows or blocks each connector for the workspace and the
          platform enforces it for apps. Boundaries: the scopes of a Shared Credential connector are chosen by the
          builder who connects it; channels are not connectors; a custom integration called with a key in the app's
          secrets reaches any API without a connector.
        verified: "2026-11-25"
      - mitigation: D3-AI
        coverage: native
        mechanism: >-
          Security Center app inventory (owner, collaborators, visibility, publish status, SSO, connectors, stored
          secrets, AI use, usage, risks; CSV export of all, filtered or selected apps), outgoing webhooks for publish
          and takedown, and the Compliance API inventory (Enterprise)
        steps:
          - title: Export the app inventory
            body:
              - In Security Center click the export icon and choose All apps.
            url: https://docs.base44.com/Enterprise/security-center#exporting-app-inventory
          - title: Keep it current
            body:
              - Create an outgoing webhook for App published and App taken offline to your inventory.
            url: https://docs.base44.com/Enterprise/workspace-webhooks
        note: >-
          Native on the rule for this drawing: the admin console lists every app with its owner, audience and
          connectors and exports the list. Boundaries: Business or Enterprise; apps in members' personal workspaces
          are not listed.
        verified: "2026-11-25"
      - mitigation: cap-shadow-ai-discovery
        coverage: external
        mechanism: >-
          Nothing in the product lists Base44 accounts or personal workspaces on the organisation's domain; Restrict
          workspace creation and App transfers are prevention
        evidence:
          - title: Restricting workspace creation
            url: https://docs.base44.com/Enterprise/restrict-workspace-creation
          - title: Controlling app transfers
            url: https://docs.base44.com/Enterprise/Enterprise-SSO-and-app-visibility#controlling-app-transfers
        note: >-
          External by the rule applied to every vendor: the product lists no accounts or apps made outside the
          workspace. Prevention, credited here only: Restrict workspace creation (Enterprise) refuses new sign-ups and
          new workspaces on the claimed domain, but accounts that existed keep their personal workspace and its
          apps. Discovery is the SSE or CASB's (base44.com and base44.app in proxy logs) and certificate-transparency
          searches on base44.app, the route Wiz used to find enterprise apps.
        verified: "2026-11-25"
      - mitigation: cap-agent-kill-switch
        coverage: partial
        mechanism: >-
          Unpublish from the Security Center or the Unpublish app API (beta), switching a connector's credential
          types off for the workspace, disabling workspace API keys, and the MCP access policy set to Not allowed
        steps:
          - title: Take the app offline
            body:
              - In Security Center open the app's More actions and choose Unpublish.
            url: https://docs.base44.com/Enterprise/security-center#taking-action-on-apps
          - title: Cut its connectors
            body:
              - >-
                Switch off the Shared Credential of every connector the app uses in Manage connectors, then revoke
                the grant at the service.
            url: https://docs.base44.com/Enterprise/workspace-connectors#managing-workspace-connectors
        note: >-
          Partial on the rule for this drawing: native where one admin action outside the agent takes any app and
          its data path offline, documented. Unpublishing takes the app offline immediately with an offline notice,
          but the pages do not say whether its backend functions and data API stop answering; connectors are cut
          per connector across every app that uses them; an app outside the workspace needs Base44's misuse report.
        verified: "2026-11-25"
      - mitigation: AML.M0024
        coverage: native
        mechanism: >-
          Workspace audit log (app.published, app.unpublished, app.deploy_approval.requested, app.publish.blocked,
          connector.* and governance, SSO and member events) read through the Audit Logs API (Enterprise), and
          outgoing webhooks for publish events (Business and Enterprise)
        steps:
          - title: Pull audit events into your SIEM
            body:
              - >-
                Create a workspace API key with the audit logs permission and poll the Audit Logs API from your SIEM.
            url: https://docs.base44.com/developers/references/audit-logs-api/get-started/overview
          - title: Push publish events
            body:
              - Send App published and App taken offline to your SIEM with an outgoing webhook.
            url: https://docs.base44.com/Enterprise/workspace-webhooks
        note: >-
          Native on the rule for this drawing: an admin sends the publish, audience and connector events to the
          organisation's own store. Boundaries: the API is Enterprise, events are pulled rather than streamed, and
          retention in Base44 is not stated on the pages read.
        verified: "2026-11-25"
      - mitigation: cap-ai-vendor-assessment
        coverage: external
        mechanism: >-
          SOC 2 Type II (under NDA), ISO 27001, the subprocessor directory and bug bounty programme on the security
          page and Trust Center feed the organisation's third-party risk platform
        evidence:
          - title: Base44 security page (certifications, subprocessors, bug bounty)
            url: https://base44.com/resources/security
          - title: Privacy and security (AI model training by plan)
            url: https://docs.base44.com/Community-and-support/Privacy-and-security#ai-model-training
          - title: "Wiz Research: Critical vulnerability in Base44 (2025-07-29)"
            url: https://www.wiz.io/blog/critical-vulnerability-base44
        note: >-
          External, as for every vendor: the assessment, its evidence and the reassessment trigger live in the
          organisation's third-party risk platform. Points to cover: the shared sign-in layer in front of every app
          (the 2025 bypass reached SSO-only apps on every workspace), training on workspace data on every plan below
          Enterprise, Customer Care staff who may bypass the IP allowlist, package intake (Base44 states it cannot
          vouch for npm packages), and subprocessors including Wix, Mongo, Render, OpenAI, Anthropic and Langfuse.
        verified: "2026-11-25"
