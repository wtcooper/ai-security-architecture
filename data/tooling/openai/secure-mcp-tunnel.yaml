            url: https://trust.openai.com/
          - title: tunnel-client README — Validate a downloaded release
            url: https://github.com/openai/tunnel-client
          - title: tunnel-client releases (v0.0.15, 2026-09-25)
            url: https://github.com/openai/tunnel-client/releases
