  - id: toolClaudeCodeWeb
    name: Claude Code on the web (cloud sessions)
    surfaceClasses:
      - cloudAgent
    variants:
      - name: claude.ai/code and the Claude mobile app
        class: cloudAgent
        url: https://code.claude.com/docs/en/claude-code-on-the-web
      - name: claude --cloud from the CLI and cloud sessions from Claude Desktop
        class: cloudAgent
        url: https://code.claude.com/docs/en/desktop
      - name: Routines (scheduled cloud sessions), Code Review and Ultrareview
        class: cloudAgent
        url: https://code.claude.com/docs/en/routines
        note: Features of the same cloud runtime; Code Review is Team/Enterprise only.
      - name: Self-hosted environments (runners on your infrastructure, public beta)
        class: cloudAgent
        url: https://code.claude.com/docs/en/self-hosted-environments
        note: >-
          Execution moves to your network; orchestration, queueing, the transcript and inference stay with
          Anthropic. Not routable through Bedrock/Vertex/Foundry or an LLM gateway.
    architecture: archHostedAgentSessions
    status: preview
    asOf: "2026-09"
    summary:
      - >-
        Claude Code sessions that run on Anthropic-managed VMs (Pro, Max, Team, and Enterprise premium / Chat +
        Claude Code seats) rather than on the developer's machine. The VM clones the GitHub repository, works on
        a branch, and can open pull requests; a GitHub proxy carries git traffic on a scoped credential so the
        user's GitHub token never enters the sandbox, and MCP connector traffic goes through Anthropic's
        servers. Sessions
        persist after the browser closes, can be driven from the mobile app, Slack (Claude Tag) or the CLI,
        and are reclaimed after inactivity. Organisations that need execution on their own network run
        self-hosted environments; inference still goes to api.anthropic.com with a session-scoped OAuth token.
      - >-
        Admin control is server-side only: device managed-settings files and MDM policies do not reach cloud
        sessions, so policy comes from server-managed settings (claude.ai Admin Settings > Claude Code >
        Managed settings), organisation-shared cloud environments (network access level, environment
        variables, setup script) and the Claude Code admin toggles (Code in the web, allow_remote_sessions,
        Quick web setup, Remote Control, Routines). Prompts, code and outputs follow the account's retention
        policy; ZDR organisations cannot use cloud sessions at all, and the Compliance API does not return
        Claude Code web transcripts.
    facts:
      - label: Plans
        value: >-
          Pro, Max and Team; Enterprise with premium or Chat + Claude Code seats (Routines and Code Review are
          research previews; self-hosted environments are a public beta). Not
          available through Console API keys, Bedrock, Vertex, Foundry or ZDR organisations. Repositories must
          be on GitHub (GHES supported on Team/Enterprise); non-GitHub repos can be sent as a bundle but
          cannot push back.
        url: https://code.claude.com/docs/en/claude-code-on-the-web
      - label: Inference & routing
        value: >-
          Anthropic API from Anthropic-managed infrastructure (so organisation IP allowlists block it unless
          Anthropic-hosted services are exempted); self-hosted environments call the API from your network
          with a session-scoped OAuth token and cannot route through a cloud provider or gateway.
        url: https://code.claude.com/docs/en/self-hosted-environments
      - label: Data leaving the device
        value: >-
          The repository is cloned into an isolated VM; all outbound traffic passes a security proxy for audit
          logging; GitHub credentials stay outside the sandbox; with network access "No access" the VM can
          still reach the Anthropic API, which the docs note may allow data to exit.
        url: https://code.claude.com/docs/en/security
      - label: Retention & training
        value: >-
          Same commercial policy as local Claude Code (no training on Team/Enterprise/API, 30-day retention);
          session event data is deleted when a user deletes the session; ZDR organisations have cloud sessions
          disabled at the backend.
        url: https://code.claude.com/docs/en/data-usage
      - label: Docs index
        value: >-
          code.claude.com/docs (Claude Code on the web, Cloud environments, Self-hosted environments)
        url: https://code.claude.com/docs/en/claude_code_docs_map.md
    riskNotes:
      - risk: riskSensitiveDataDisclosure
        note: >-
          Through the Claude GitHub App a cloud session reaches public repositories and private ones the App is
          installed on; through /web-setup (Quick web setup) it reaches every repository the member's gh token
          can; restrict at GitHub. Shared environments'
          variables are readable by every member's sessions, so secrets must not go there (API credentials
          that stay outside the sandbox exist only on Pro/Max today).
      - risk: riskRogueActions
        note: >-
          Auto-fix replies to PR comments and pushes fixes under the user's GitHub account and can trigger
          comment-driven automation such as Atlantis; git push is restricted to the working branch.
      - risk: riskPromptInjection
        note: >-
          Sessions started from Slack read the whole thread as context; the earlier Claude Code in Slack docs
          warn Claude may follow directions from other messages. Network egress in Anthropic-hosted
          environments defaults to Trusted (package registries and GitHub), which bounds exfiltration.
      - risk: riskShadowAndUnknownAgents
        note: >-
          Any member with a seat can start cloud sessions once "Code in the web" is on; Routines run
          unattended on a schedule. Admin toggles and organisation-default environments are the inventory
          levers.
    controls:
      - mitigation: D3-APA
        coverage: partial
        mechanism: >-
          Owner toggles at claude.ai/admin-settings/claude-code (the allow_remote_sessions policy, Quick web
          setup, Remote Control, Routines), Allow self-hosted environments on the Cloud environments page, the
          GitHub connector at Admin settings > Connectors, and the Claude Code capability in Enterprise custom
          roles; who or what may trigger a session is not an admin policy
        steps:
          - title: Decide whether cloud sessions exist
            body:
              - >-
                An Owner turns cloud sessions on or off for the organisation with the allow_remote_sessions
                policy at claude.ai/admin-settings/claude-code, and leaves Quick web setup off so members
                can't hand a personal gh token to cloud sessions with /web-setup.
            url: https://code.claude.com/docs/en/claude-code-on-the-web
          - title: Grant Claude Code by role
            body:
              - >-
                On Enterprise, set members to the Custom role and grant the Claude Code capability only to the
                groups that should run it, under Organization settings > Roles.
            url: https://support.claude.com/en/articles/13930452-manage-custom-roles-on-enterprise-plans
          - title: Keep unattended runs owned
            body:
              - >-
                Turn the Routines toggle off at claude.ai/admin-settings/claude-code unless someone owns
                scheduled, API and GitHub-triggered runs; turning it off stops existing routines and blocks
                new ones.
            url: https://code.claude.com/docs/en/routines
          - title: Keep self-hosted execution off until owned
            body:
              - >-
                Leave Allow self-hosted environments off on the Cloud environments admin page until a team
                owns the runners.
            url: https://code.claude.com/docs/en/self-hosted-environments
        note: >-
          Partial on the rule: enablement is organisation-wide (the custom-role capability covers all of
          Claude Code, not cloud sessions specifically, and Team plans have no per-group control), and trigger
          policy is not an admin setting: a routine's GitHub trigger fires on pull-request and release events
          in any repository where the Claude GitHub App is installed, narrowed only by filters its owner sets
          (such as Author); auto-fix acts on any reviewer comment or CI failure on a watched PR; an API
          trigger admits whoever holds the routine's token. The widening switches are admin-controlled and off
          by default on Team and Enterprise: Quick web setup, Remote Control, self-hosted environments and the
          GitHub connector itself.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityIga
          reviewRequired: false
          original:
            - capability: capabilityIga
              coverage: native
              mechanism: >-
                claude.ai organisation login with SSO/SCIM; per-role Claude Code capability on Enterprise;
                Owner-only admin toggles at claude.ai/admin-settings/claude-code
              steps:
                - title: Gate cloud sessions by seat and role
                  body:
                    - Assign Claude Code seats and, on Enterprise, grant the Claude Code capability to custom
                      roles under Organization settings > Roles; sessions always use the subscription login
                      (API keys cannot start them).
                  url: >-
                    https://support.claude.com/en/articles/13930458-set-up-role-based-permissions-on-enterprise-plans
                - title: Decide whether the web surface exists
                  body:
                    - Owners turn "Code in the web", the allow_remote_sessions policy, Remote Control and
                      Quick web setup on or off at claude.ai/admin-settings/claude-code.
                  url: https://code.claude.com/docs/en/desktop
              verified: 2026-09-10
      - mitigation: D3-AA
        coverage: partial
        mechanism: >-
          Anthropic-hosted sessions act as the creator's claude.ai account and GitHub grant (the Claude GitHub
          App authorisation or a /web-setup gh token the GitHub proxy holds), attributed by Claude-Session
          trailers and labelled replies; self-hosted sessions carry a signed per-session JWT
          (CLAUDE_CODE_SESSION_ACCESS_TOKEN) with an RFC 8693 act chain; routine API triggers use per-routine
          bearer tokens
        steps:
          - title: Verify session identity in self-hosted environments
            body:
              - >-
                Have internal services verify CLAUDE_CODE_SESSION_ACCESS_TOKEN against the published JWKS,
                check aud against your ccpool_ environment ID, and key on act.sub and ccr:session_id.
            url: https://code.claude.com/docs/en/self-hosted-environments-identity
          - title: Revoke a member's GitHub grant
            body:
              - >-
                Disconnect GitHub at claude.ai/customize/connectors, and revoke the token on GitHub, to stop
                cloud sessions acting through that member's GitHub identity.
            url: https://code.claude.com/docs/en/web-quickstart
          - title: Rotate routine trigger tokens
            body:
              - >-
                Use Regenerate or Revoke in a routine's API trigger modal; each token can fire only that
                routine.
            url: https://code.claude.com/docs/en/routines
        note: >-
          Partial by the rule: sessions run on the user's own identity and GitHub grant with attribution only
          — commits and PR bodies carry the session URL, review replies are labelled as Claude Code, and
          routine actions appear as the routine's owner. Revocation is the user's GitHub disconnect or the
          seat, not a separate agent identity an admin inventories; the organisation's service identity exists
          only for Claude Tag channel sessions (toolClaudeTag). The self-hosted session JWT lasts four hours
          by default, eight at most, and can't be revoked early: Anthropic publishes no revocation feed.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityNhiManagement
          reviewRequired: false
          original:
            - capability: capabilityNhiManagement
              coverage: partial
              mechanism: >-
                Sessions run under the user's account with proxy-issued scoped git credentials; self-hosted
                runners register with an environment key and receive runner tokens; Claude Tag channel
                sessions run under an agent identity
              steps:
                - title: Treat the environment key as a workload credential
                  body:
                    - The environment secret shown once at creation authenticates every runner; store it in a
                      secrets manager and rotate it from the Cloud environments admin page.
                  url: https://code.claude.com/docs/en/self-hosted-environments
              note: >-
                Anthropic-hosted sessions have no distinct agent identity: GitHub actions appear as the user
                (or the Claude GitHub App). Session identity can be verified by your own services in
                self-hosted environments.
              verified: 2026-09-10
      - mitigation: cap-agent-tool-registry
        coverage: partial
        mechanism: >-
          Owner-managed organisation-shared and self-hosted environments on the Cloud environments admin page;
          routines kept per user at claude.ai/code/routines; Compliance API Activity Feed events for cloud
          sessions, session shares and managed-settings changes; the Routines toggle as the only enforcement
        steps:
          - title: Centralise environments
            body:
              - >-
                Create organisation-shared environments on the Cloud environments admin page and set the
                organisation default at claude.ai/admin-settings/claude-code, so sessions run in an
                Owner-managed list.
            url: https://code.claude.com/docs/en/cloud-environments
          - title: Reconcile sessions from the Activity Feed
            body:
              - >-
                Query the Compliance API Activity Feed for ccr_session_created, session_share_created and
                claude_code_managed_settings activities to see who runs cloud sessions and what changed.
            url: https://platform.claude.com/docs/en/api/compliance/activities/list
        note: >-
          Partial: environments have an Owner and a list, but routines belong to individual accounts and
          aren't shared (no admin listing is documented), members' personal environments are approved by no
          one, and nothing denies an unregistered routine or environment short of the organisation-wide
          Routines and cloud-session switches. Sessions and GitHub App installations have no owner or approval
          record beyond who created them.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAgentRegistry
          reviewRequired: false
          original:
            - capability: capabilityAgentRegistry
              coverage: partial
              mechanism: >-
                Session list at claude.ai/code with Team visibility on Team/Enterprise; organisation-shared
                and self-hosted environments managed by Owners on the Cloud environments admin page; Routines
                listed per user
              steps:
                - title: Centralise environments
                  body:
                    - Owners create organisation-shared environments and set the organisation default on the Cloud environments
                      page; Admins cannot open it. Members' own environments are personal to their account.
                  url: https://code.claude.com/docs/en/cloud-environments
              note: >-
                There is no approval workflow or owner record for sessions or routines beyond the user who
                created them.
              verified: 2026-09-10
      - mitigation: AML.M0028
        coverage: partial
        mechanism: >-
          Server-managed permissions.deny / ask / allow with allowManagedPermissionRulesOnly and
          disableAutoMode (Bypass isn't offered in cloud sessions); allowedMcpServers / deniedMcpServers and
          connector tool controls filter delivered connectors; the GitHub proxy limits push to the session
          branch and API calls to attached repositories; network access is set per environment
        steps:
          - title: Deliver the permission policy from the console
            body:
              - >-
                Under Admin Settings > Claude Code > Managed settings, deliver permissions.deny rules,
                disableBypassPermissionsMode and allowManagedPermissionRulesOnly true; device MDM files don't
                reach Anthropic-hosted sessions.
            url: https://code.claude.com/docs/en/server-managed-settings
          - title: Remove Auto from the mode picker
            body:
              - >-
                Set permissions.disableAutoMode "disable" in server-managed settings; cloud sessions then
                offer only Accept edits and Plan.
            url: https://code.claude.com/docs/en/permission-modes
          - title: Filter the connectors a session receives
            body:
              - >-
                Deliver allowedMcpServers and deniedMcpServers through server-managed settings (the session's
                proxy rewrites connector URLs, so match accordingly) and set unneeded connector tools to
                blocked.
            url: https://code.claude.com/docs/en/mcp
          - title: Standardise the environment
            body:
              - >-
                Give sessions an Owner-managed shared environment with Custom network access and make it the
                organisation default.
            url: https://code.claude.com/docs/en/cloud-environments
        note: >-
          Partial: tool rules are admin-locked (Bypass isn't offered, Auto is removable), but the rest of the
          locked environment isn't: members can create personal environments with Full network access and pick
          them, and the docs say there is no organisation-level allowlist admins can push. The GitHub proxy
          restricts push to the session's branch and API calls to attached repositories, but nothing documents
          that the session's GitHub grant can't merge, approve or mark a PR ready; with Quick web setup on,
          /web-setup reaches every repository a member's gh token can; routines run with no permission-mode
          picker; a single-repository session loads the repository's hooks and .mcp.json servers without
          asking unless managed settings say otherwise.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityToolPermissionScoping
            - capabilityAgentRuntimeEnforcement
            - capabilityMcpToolSecurity
          reviewRequired: false
          original:
            - capability: capabilityToolPermissionScoping
              coverage: native
              mechanism: >-
                Server-managed settings (permissions.allow/ask/deny, allowManagedPermissionRulesOnly,
                disableAutoMode) apply to cloud sessions; permission mode is chosen per session from the web
                UI; connectors filtered by allowedMcpServers / deniedMcpServers
              steps:
                - title: Deliver the same permission policy as the desktop fleet
                  body:
                    - Configure permissions.deny, disableBypassPermissionsMode and
                      allowManagedPermissionRulesOnly under Admin Settings > Claude Code > Managed settings;
                      endpoint-managed files do not reach Anthropic-hosted sessions.
                  url: https://code.claude.com/docs/en/server-managed-settings
                - title: Filter connectors in cloud sessions
                  body:
                    - Connectors are passed to the cloud VM and filtered by the organisation's
                      allowedMcpServers / deniedMcpServers patterns; disableSideloadFlags drops servers the
                      server delivered through --mcp-config.
                  url: https://code.claude.com/docs/en/managed-mcp
              note: >-
                Server-managed deny hides, allow pre-approves, specifiers limit arguments; the per-session
                mode picker can still choose Auto unless disableAutoMode is set. Connector tools follow the
                org's ask/blocked settings.
              verified: 2026-09-10
            - capability: capabilityAgentRuntimeEnforcement
              coverage: native
              mechanism: Server-managed settings permissions.deny / ask and allowManagedPermissionRulesOnly apply to cloud
                sessions; command hooks committed in the repository run inside the VM
              steps:
                - title: Deliver deny rules through server-managed settings
                  body:
                    - Configure permissions.deny and allowManagedPermissionRulesOnly under Admin settings >
                      Claude Code; deny rules run before every permission mode in the session, and
                      endpoint-managed files never reach Anthropic-hosted sessions.
                  url: https://code.claude.com/docs/en/server-managed-settings
              note: Deny rules are deterministic and organisation-owned. Hooks are repository code, writable by anyone with
                push access, so they are not enterprise policy. Connector tools follow the organisation's ask
                or blocked settings; a connector's own actions are outside the rules.
              verified: 2026-09-15
            - capability: capabilityMcpToolSecurity
              coverage: native
              mechanism: Organisation allowedMcpServers / deniedMcpServers patterns filter the connectors passed to the
                cloud VM; disableSideloadFlags; organisation connector ask / blocked settings
              steps:
                - title: Filter connectors organisation-wide
                  body:
                    - Deliver allowedMcpServers and deniedMcpServers through server-managed settings so only
                      matching connectors reach cloud sessions; disableSideloadFlags drops servers a session
                      tried to add itself.
                  url: https://code.claude.com/docs/en/managed-mcp
              note: "Rated native on the same rule as Claude Code: admission by identity, organisation-wide. Admission is
                not integrity — nothing pins the tool descriptions a connector returns or detects a changed
                implementation. Connector traffic runs through Anthropic's servers and never passes the
                environment's network policy."
              verified: 2026-09-15
      - mitigation: AML.M0029
        coverage: partial
        mechanism: >-
          Server-managed permissions.ask rules and connector tools set to ask stop an interactive cloud
          session for the user's approval; for everything else the gate is the draft branch or pull request a
          person reviews
        steps:
          - title: Force prompts on named actions
            body:
              - >-
                Add permissions.ask rules such as Bash(git push *) in server-managed settings; an ask rule
                prompts even in Auto, and the prompt appears in claude.ai or the mobile app.
            url: https://code.claude.com/docs/en/permission-modes
          - title: Keep auto-fix off where comments deploy
            body:
              - >-
                Leave the per-PR Auto-fix toggle off on repositories where an issue_comment can run Atlantis,
                Terraform Cloud or privileged Actions; auto-fix pushes and replies under the user's GitHub
                account.
            url: https://code.claude.com/docs/en/claude-code-on-the-web
        note: >-
          Partial by the rule: a merge gate approves the output, not the actions. Cloud sessions pre-approve
          file edits in every mode and Accept edits pushes the branch without stopping; ask rules and
          connector ask settings do make a person approve named actions in interactive sessions, but routines
          and GitHub-triggered runs have no permission-mode picker and run without stopping for approval, so
          no one is present. The auto-mode classifier and Code Review are not human approval; the reviewer's
          merge on GitHub comes after the actions ran.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityHitlControls
          reviewRequired: false
          original:
            - capability: capabilityHitlControls
              coverage: native
              mechanism: >-
                Per-session permission mode picker (Accept edits, Plan, Auto; Bypass unavailable in cloud
                sessions), permissions.ask rules from server-managed settings, MCP connector tool approvals
                that pause the session
              steps:
                - title: Force prompts on named actions
                  body:
                    - Add permissions.ask rules such as Bash(git push *) in server-managed settings; the
                      session waits for the user (and expires if it waits too long) rather than
                      auto-approving.
                  url: https://code.claude.com/docs/en/auto-mode-config
                - title: Review before merge
                  body:
                    - Sessions produce a diff and a PR rather than merging; auto-fix acts only on PRs where
                      the toggle is on, and the docs recommend disabling it where a PR comment can deploy
                      infrastructure. The PR gates the output, not actions taken during the session — use
                      permissions.ask for those.
                  url: https://code.claude.com/docs/en/claude-code-on-the-web
              verified: 2026-09-10
      - mitigation: AML.M0036
        coverage: native
        mechanism: >-
          Organisation, group, per-user and pooled monthly spend limits under Organization settings > Usage
          (Enterprise); a monthly spend limit on usage credits (Team and seat-based Enterprise); vendor-fixed
          seat limits, routine daily run caps and GitHub-trigger hourly caps
        steps:
          - title: Set group, user and organisation spend limits
            body:
              - >-
                Under Organization settings > Usage > Spend limits, set group limits (By group/tier), per-user
                limits and, if needed, a pooled monthly budget; members stop at whichever limit runs out
                first.
            url: https://support.claude.com/en/articles/14782391-claude-enterprise-consumption-guide
          - title: Cap usage credits on seat-based plans
            body:
              - >-
                On Team and seat-based Enterprise, set the monthly spend limit on usage credits under
                Organization settings > Usage, or leave credits off so members stop at the seat's included
                usage.
            url: https://support.claude.com/en/articles/12005970-manage-usage-credits-for-team-and-seat-based-enterprise-plans
        note: >-
          Native on the rule: admin-set spend limits stop usage when exhausted — the consumption guide says
          members at their limit are blocked mid-task and usage can go slightly over before it pauses — and
          routine runs past the limit are rejected without usage credits. Not admin-settable: session
          duration, concurrency, fan-out or a per-session budget; the routine daily run cap, per-routine
          GitHub event caps and the VM ceilings (about 4 vCPUs, 16 GB RAM, 30 GB disk) are vendor-fixed, and
          Team seats carry fixed included usage. Cloud sessions share the account's rate limits with all other
          Claude usage.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityRateLimiting
          reviewRequired: false
          original:
            - capability: capabilityRateLimiting
              coverage: partial
              mechanism: >-
                Cloud sessions share the account's rate limits; organisation and per-user spend limits in the
                admin console; no per-session budget or time cap
              steps:
                - title: Set organisation, group and user spend limits
                  body:
                    - Configure limits under Organization settings > Usage (org default, by group, per user);
                      Claude Code, Cowork and chat draw from the same consumption pool.
                  url: https://support.claude.com/en/articles/14782391-claude-enterprise-consumption-guide
              note: >-
                Sessions stop only when the account's limits are exhausted; there is no turn or wall-clock cap
                for a cloud session. Sub-limits present: account rate limits and organisation or per-user
                spend limits (hard at the account). Absent: turn, wall-clock and per-session spend caps.
              verified: 2026-09-10
      - mitigation: cap-input-guardrails
        coverage: partial
        mechanism: >-
          Enterprise Inference hooks send each governed request's transcript, tool results included, to the
          organisation's AI security server before inference; server-managed PostToolUse hooks run in cloud
          sessions and can replace a tool's output; built-in safeguards are not configurable
        steps:
          - title: Deny poisoned requests before inference
            body:
              - >-
                Allow Inference hooks for the organisation; they govern Claude Code sessions on the web, so
                your AI security server can deny a request carrying injected issue text, file content or tool
                output.
            url: https://platform.claude.com/docs/en/manage-claude/inference-hooks
          - title: Replace suspect tool output
            body:
              - >-
                Deliver a PostToolUse hook through server-managed settings that classifies WebFetch, Bash and
                MCP results and returns updatedToolOutput with a quarantine notice.
            url: https://code.claude.com/docs/en/hooks
        note: >-
          Partial by the rule: both are attach points for the organisation's own classifier. Nothing in the
          product classifies issue text, review comments, repository files or fetched pages for injection, and
          no hidden-character or HTML-comment filtering is documented; the auto-mode classifier judges
          actions, not inputs; the Trusted network level is containment. CODEOWNERS on .claude/, CLAUDE.md and
          the environment's setup script is the process control.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityPromptInjectionDefense
          reviewRequired: false
          original:
            - capability: capabilityPromptInjectionDefense
              coverage: partial
              mechanism: >-
                Same built-in safeguards as local Claude Code plus the auto-mode classifier and a
                default-limited network egress; Enterprise Inference hooks apply to Claude Code sessions
              steps:
                - title: Keep egress at Trusted or Custom
                  body:
                    - Set the environment's network access level to Trusted (default) or a Custom allowlist so an injected
                      instruction cannot reach arbitrary hosts.
                  url: https://code.claude.com/docs/en/cloud-environments
                - title: Add inline prompt inspection (Enterprise, beta)
                  body:
                    - Configure Inference hooks so every governed Claude Code prompt is sent to your AI security server for an
                      allow/deny verdict before inference.
                  url: https://platform.claude.com/docs/en/manage-claude/inference-hooks
              note: >-
                The built-in safeguards detect a subset of injected commands and web content; the egress limit
                and auto-mode classifier contain the rest. Nothing detects injection in repository files or
                MCP results as such.
              verified: 2026-09-10
      - mitigation: D3-CTS
        coverage: partial
        mechanism: >-
          GitHub proxy (a scoped credential in the VM swapped for the user's token; push to the session
          branch; API calls to attached repositories; a pinned GraphQL set); API credentials attached per host
          by the agent proxy (Pro and Max only); every other secret an environment variable the session can
          read
        steps:
          - title: Let the GitHub proxy hold the repository credential
            body:
              - >-
                Leave GH_TOKEN and GITHUB_TOKEN unset so both read proxy-injected and the proxy substitutes
                the real credential outside the VM; a token you set is an ordinary variable everyone using the
