      - mitigation: AML.M0031
        coverage: native
        verified: "2026-09-10"
        mechanism: >-
          memory.write_approval and skills.write_approval gate agent writes, memory entries are
          injection-scanned and size-capped, and each profile has its own memories, sessions, skills and .env;
          hermes journey edits entries
        steps:
          - title: Require approval for memory writes
            body:
              - "Set memory.write_approval: true in ~/.hermes/config.yaml so every save to MEMORY.md or
                USER.md — including the unprompted background review — is staged for your approval;
                memory_char_limit and user_char_limit keep the stores bounded."
            url: https://hermes-agent.nousresearch.com/docs/user-guide/features/memory
          - title: Gate the agent's self-written skills the same way
            body:
              - "Set skills.write_approval: true so create, edit, patch and write_file operations on skills
                need approval, since skills are the other persistent store the agent feeds back into its own
                prompt."
            url: >-
              https://hermes-agent.nousresearch.com/docs/user-guide/features/skills#gating-agent-skill-writes-skillswrite_approval
          - title: Give every agent its own profile
            body:
              - Run hermes profile create <name> for each purpose; a profile is a separate Hermes home with
                its own config.yaml, .env, SOUL.md, memories, sessions, skills, cron jobs and state database,
                so one agent's memory never reaches another.
            url: https://hermes-agent.nousresearch.com/docs/user-guide/profiles
          - title: Review and edit what the agent remembered
            body:
              - Use hermes journey list and hermes journey edit to inspect and correct USER.md and MEMORY.md
                entries; the system prompt takes a frozen snapshot at session start, so a fix lands on the
                next session.
            url: https://hermes-agent.nousresearch.com/docs/user-guide/which-file-does-what
        evidence: []
        note: >-
          Write approval and injection scanning are genuine integrity gates; what can still write is an
          approved agent turn and the user's own edits. Recovery is the checkpoint store, not a versioned
          memory; per-profile isolation is the tenant boundary.
