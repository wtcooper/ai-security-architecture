# OpenClaw — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
vendor: openclaw
family: OpenClaw
tools:
  - id: toolOpenclaw
    name: OpenClaw
    surfaceClasses:
      - endpointCli
    architecture: archPersonalAgent
    status: ga
    asOf: "2026-09"
    summary:
      - "A self-hosted personal agent whose gateway is the control plane — channels, tool policy and
        auth under an explicit single-trusted-operator model. Official hardening is real and
        specific: loopback-plus-token gateway auth, DM pairing, high-risk tools disabled or
        sandboxed, and a container sandbox whose defaults are no network, a read-only root and all
        capabilities dropped. Sandboxing itself is off by default (agents.defaults.sandbox); latest
        release 2026.9.3 (2026-09-08)."
    items:
      - title: Gateway lockdown and the version floor
        body:
          - "gateway.bind defaults to loopback (container images default to an exposed bind); the
            network-exposure page says plainly never to expose it unauthenticated on 0.0.0.0, and
            gateway.auth.mode token is the recommended mode. DM hardening is dmPolicy pairing
            (codes expire after one hour for unknown senders), allowFrom contact allowlists and
            requireMention in groups; `openclaw security audit` checks a deployment and
            `--fix` applies safe fixes (open group policies to allowlist, file permissions).
            Enforce a version floor of 2026.1.29: earlier Control UI builds auto-connected to an
            attacker-supplied gatewayUrl and sent the operator token (CVE-2026-25253, CVSS 8.8),
            and internet scans found thousands of exposed instances."
        links:
          - title: OpenClaw gateway security model
            url: https://docs.openclaw.ai/gateway/security
          - title: OpenClaw network exposure
            url: https://docs.openclaw.ai/gateway/security/network-exposure
          - title: OpenClaw access control and allowlists
            url: https://docs.openclaw.ai/gateway/security/access-control
          - title: OpenClaw security CLI (audit, --fix)
            url: https://docs.openclaw.ai/cli/security
          - title: NVD — CVE-2026-25253
            url: https://nvd.nist.gov/vuln/detail/CVE-2026-25253
      - title: Sandbox defaults and proxy-injected credentials
        body:
          - With the Docker sandbox backend enabled, tool execution runs in a container whose
            defaults are network none, readOnlyRoot true, capDrop ALL, an init process and
            no-new-privileges, with the workspace mounted read-only at /agent (workspaceAccess ro)
            or read-write by policy; per-agent sandbox and tool-policy overrides layer on top, and
            the docs warn never to mount the host Docker socket into a sandbox container. Docker's
            own Sandboxes product wraps the same agent with a configurable egress proxy that
            denies arbitrary hosts and injects provider API keys at the proxy, so the agent
            process never holds them.
        links:
          - title: OpenClaw sandboxing
            url: https://docs.openclaw.ai/gateway/sandboxing
          - title: OpenClaw Docker backend defaults
            url: https://docs.openclaw.ai/gateway/sandboxing/docker-backend
          - title: "Docker: Run OpenClaw securely in Docker Sandboxes"
            url: https://www.docker.com/blog/run-openclaw-securely-in-docker-sandboxes/
    controls: []
    sources:
