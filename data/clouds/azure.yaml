        text: "In Microsoft's baseline, tool traffic leaves through the agent's subnet and Azure Firewall, not through API Management. Putting your tool servers behind API Management is this mapping's choice."
        url: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/baseline-microsoft-foundry-chat
      - at: gateway->openWeb
        text: "Grounding with Bing Search is a tool of the model platform. Its traffic uses public outbound access and passes through neither API Management nor Azure Firewall, so neither can filter or log it."
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/bing-tools
      - at: localTools->registry
        text: "With outbound access disabled, as recommended, the code sandbox has no network, so it cannot install packages. This flow applies only to building the agent's own image."
        url: https://learn.microsoft.com/en-us/azure/container-apps/session-pool
      - at: localTools
        text: "The code sandbox is a Container Apps dynamic sessions pool: a separate service the agent calls over the network, not something inside the agent's own process."
        url: https://learn.microsoft.com/en-us/azure/container-apps/session-pool
      - at: gateway
        text: "Microsoft now describes a separate AI Gateway product, in preview in two regions, as its main path. The gateway features of API Management used here remain available and supported."
        url: https://learn.microsoft.com/en-us/azure/ai-gateway/compare-api-management-service
      - at: planner
        text: "Microsoft documents hosting Agent Framework agents on Foundry hosted agents or Azure Functions. Running one on Container Apps is this mapping's choice."
