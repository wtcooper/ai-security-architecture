      licence: "Commercial, pay per use on the AWS bill."
      support: "AWS Support plans; services are documented by AWS without a preview notice on the pages opened."
      covers: "Every role on every AWS mapping as drawn, with GitHub, which is not an AWS service, as source control; your own code is yours."
      bringYourOwn: "Agent code and framework, your corporate IdP, source control, search API keys for third-party search, model servers for open weights."
      integration: "AgentCore services share IAM, CloudTrail and VPC endpoints; Gateway takes Cognito or any OIDC IdP inbound; Knowledge Bases plug into several vector stores."
      effort: "Low to medium: no servers for the agent services, but many accounts, roles, endpoints and policies to configure."
