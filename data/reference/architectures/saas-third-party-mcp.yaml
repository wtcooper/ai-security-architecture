id: archThirdPartyMcp
surface: surfaceSaas
title: Third-party MCP server you consume
abbrev: Third-party MCP

summary:
  - >
    A vendor-operated tool server your agents call over the network. You authorise it once, scope
    it as far as the vendor's OAuth scopes allow, and thereafter it both acts on your systems and
    writes into your agents' context — because tool names, descriptions and results are all
    vendor-controlled text your model treats as instruction.

description:
  - >
    This is a supply-chain relationship with a property ordinary vendor integrations do not have:
    the vendor supplies text that your model treats as instruction. Tool names, descriptions and
    results all enter the context window. A hostile or merely careless server needs no
    vulnerability to influence your agent — describing itself persuasively is sufficient, and
    descriptions are re-read on each connection rather than fixed at approval time.
  - >
    What you can verify is narrow and worth stating precisely. You can verify who the server is,
    at connection time, through OAuth. You can constrain what it may reach, to the granularity of
    the scopes the vendor chose to publish. You can see what left, if agent egress routes through
    something that inspects. You cannot verify the server's internal tool catalogue, you cannot
    put a policy decision point inside its execution, and you cannot test it the way you would
    test your own code. Those are properties of the boundary, not gaps in your programme — which
    is why the tool broker on your side is the only insertion point drawn.
  - >
    Enterprise-managed authorisation is the single highest-value change available here. Moving
    admission to the identity provider — rather than each server's own consent screen — means a
    security team decides which servers the organisation may connect to, and revocation is one
    place rather than many. Accumulation is the quiet risk it addresses: servers are connected
    for one project, keep their grants, and outlive the reason.

distinguishedBy:
  - >
    Against a remote MCP server you publish: there you are the resource server and the security
    work is building the tenancy model and scopes properly. Here you are the client, the scopes
    are someone else's design, and the work is admission and observation. Almost no capability
    transfers.
  - >
    Against the local tool plane: that one is child processes with your privileges and nothing to
    authenticate to. This one has a real authorisation boundary, a revocable grant and an audit
    trail — a much better position that comes with the loss of any ability to inspect the code.

exemplars:
  - name: Vendor-published MCP servers
    note: >
      Major SaaS providers publishing remote tool servers for their own products, so agents can
      read and write records without a bespoke integration. The mainstream case.
    asOf: "2026-08"
  - name: Aggregator and gateway MCP services
    note: >
      Third parties fronting many downstream tools behind one server. One grant, many reachable
      systems, and the scope you approved is not the scope that ultimately gets used.
    asOf: "2026-08"
  - name: Enterprise-managed connection
    note: >
      Admission moved to the identity provider so a security team, rather than each individual
      user's consent click, decides which servers may be reached.
    asOf: "2026-08"

blocks:
  - id: operator
    kind: actor
    title: Agent user
    icon: person
    col: 0
    row: 1
    note: >
      Whoever the consuming agent works for. Their systems are what the vendor's tool results
      ultimately steer.

  - id: agent
    kind: service
    title: Consuming agent
    col: 1
    row: 1
    cosaiComponent: componentReasoningCore
    note: >
      The client side of the relationship — a workstation agent or a hosted one, it makes no
      difference to this boundary. Its authority over your systems is what the vendor's text
      steers.
    items:
      - id: loop
        label: Agent loop
        icon: agent
        note: Reads tool descriptions and results back as context, indistinguishable from instruction.

  - id: broker
    kind: service
    title: Tool broker
    col: 2
    row: 1
    note: >
      The only insertion point this relationship offers. Here a description can be pinned, a
      result can be size- and shape-checked, a write can wait for approval, and a call can be
      denied or logged.
    items:
      - id: connections
        label: Connection manager
        icon: plug
        note: Which servers this agent may reach, checked against the admitted list at connect time.
      - id: pinning
        label: Description pinning
        icon: doc
        note: Descriptions are re-read on every connection; pinning is what notices when the catalogue you approved is not the catalogue that runs.
      - id: approvals
        label: Approval gate
        icon: scale
        note: Reserved for the calls that write — reads are too frequent for a human to remain a real check.
      - id: callLog
        label: Call log
        icon: eye
        note: Which tool, which agent, what arguments — captured here at your fidelity, because the provider's view belongs to the provider.

  - id: egress
    kind: service
    title: Egress inspection
    col: 3
    row: 1
    note: >
      What is going to this vendor and how much of it. On this surface, network position
      substitutes for the application logging the provider does not expose.
    items:
      - id: sse
        label: Secure service edge
        icon: shield
        note: Allowlists which tool vendors are reachable at all, and sees the volume the approval gate never will.
      - id: dlp
        label: Content inspection
        icon: eye
        note: The last look at arguments and payloads before they cross to the vendor.

  - id: vendorMcp
    kind: provider
    title: Vendor MCP server
    col: 4
    row: 1
    cosaiComponent: componentTools
    note: >
      An OAuth resource server whose tool catalogue, execution and downstream reach are not
      observable — only the published interface is drawn.
    items:
      - id: oauth
        label: OAuth authorisation
        icon: key
        note: The strongest authentication in this catalogue — a named client, an explicit scope, a grant revocable in one place. It says nothing about the honesty of the catalogue.
      - id: toolInterface
        label: Tool interface
        icon: plug
        note: Tools, descriptions and results. All of it vendor-controlled text that will enter your agents' context as instruction.

  - id: upstreamContent
    kind: external
    title: Content from elsewhere
    cosaiComponent: componentDataSources
    col: 4
    row: 0
    note: >
      Records, documents and messages the server reads from systems outside this architecture,
      passed back as tool results. The vendor need not be hostile — it need only relay content
      from a system that is.

  - id: otherTenants
    kind: actor
    title: Other tenants
    icon: people
    col: 4
    row: 2
    note: >
      Everyone else on the same multi-tenant server. Their isolation from your grant and your
      data is the provider's claim, and one of the few things assurance can usefully ask about.

  - id: governance
    kind: governance
    title: Consumption governance
    col: 5
    row: 0
    rowSpan: 3
    note: >
      Admission, inventory and assurance — the whole of what the consuming side actually controls
      in this relationship.
    items:
      - id: idpAdmission
        label: IdP-managed admission
        icon: key
        note: Enterprise-managed authorisation moves the connect decision from each user's consent screen to a security team's allowlist — the highest-value change available.
      - id: inventory
        label: Connection inventory
        icon: search
        note: Which servers are connected, by whom, at what scope, when last used. Grants outlive their projects, and this is the only thing that notices.
      - id: assurance
        label: Vendor assurance
        icon: scale
        note: Tenant isolation, retention, subprocessors, what happens to the data sent. The questions inspection cannot answer have to be answered by contract.
      - id: audit
        label: Call audit
        icon: eye
        note: The broker's call log, kept append-only and off the agent's write path.

edges:
  - from: operator
    to: agent
    path: primary
    bidir: true
    label: task / result
    note: The task goes in and the outcome comes back — shaped in part by text a vendor wrote.
  - from: agent
    to: broker
    path: primary
    bidir: true
    label: tool call / result
    note: >
      Every call to the vendor's tools passes through the broker, and every description and
      result passes back through it into context — the one place both directions are yours to
      check.
  - from: broker
    to: egress
    path: primary
    bidir: true
    note: >
      Approved and read calls leave with the runtime's identity attached, so the egress path can
      tell agent traffic from everything else leaving the network.
  - from: egress
    to: vendorMcp
    path: primary
    bidir: true
    label: OAuth-scoped invocation
    note: >
      A named client with an explicit scope invokes the server; descriptions and results return.
      The return path is the risk — re-read on every connection, entering context as instruction.
  - from: upstreamContent
    to: vendorMcp
    path: external
    label: records from elsewhere
    note: >
      Content the vendor reads from third parties reaches your agent through a connection
      authorised for something else — not observable from your side.
  - from: otherTenants
    to: vendorMcp
    path: external
    label: shared infrastructure
    note: Tenant isolation is asserted, not verifiable — the specific claim third-party assurance exists to interrogate.
  - from: governance
    to: vendorMcp
    path: governance
    label: admission & assurance
    note: >
      The server is reachable only because the admitted list says so, and trusted only as far as
      the contract behind it — both decisions made on your side of the boundary.

pins:
  risks:
    - risk: riskToolSourceProvenance
      at: vendorMcp
      note: >
        You can verify who the server is and never what its tools do. That asymmetry is the
        defining property of the archetype, and no control on your side closes it.
    - risk: riskInsecureIntegratedComponent
      at: vendorMcp
      note: The catalogue, execution and downstream reach are all an untestable dependency you connected to production agents.
    - risk: riskPromptInjection
      at: vendorMcp->egress
      note: >
        Descriptions and results are vendor-controlled text entering the context window as
        instruction — the injection arrives through a connection you deliberately made.
    - risk: riskExcessiveDataHandling
      at: egress->vendorMcp
      note: The scope was approved once; the breadth actually exercised across every later call is visible only at egress.
    - risk: riskMCPTransportHijacking
      at: egress->vendorMcp
      note: The session between your broker and the vendor's endpoint is the trust anchor for every tool result that follows.
    - risk: riskRogueActions
      at: agent
      note: The agent's authority over your systems is what a persuasive tool description steers.
    - risk: riskShadowAndUnknownAgents
      at: broker
      note: Individually consented connections accumulate outside any list unless connect-time checks force them through one.
    - risk: riskSensitiveDataDisclosure
      at: egress
      note: Arguments and payloads flow to the vendor on every call; what happens to them afterwards is contract, not observation.
    - risk: riskZombieShadowMCPServers
      at: governance
      note: Grants outlive their projects and people. Each connection was reasonable; the standing set nobody reviews is not.
    - risk: riskCrossTenantCredentialPropagation
      at: otherTenants->vendorMcp
      note: Your grant and your data sit on infrastructure shared with every other tenant, isolated only as well as the provider claims.

  capabilities:
    - capability: capabilityAgentRegistry
      at: governance
      note: >
        Keep the connection inventory — every server, owner, scope and last use — and check it at
        connect time so a grant not in the registry is not a grant.
    - capability: capabilityIga
      at: governance
      note: Move admission to the identity provider — enterprise-managed authorisation puts a security team, not a consent click, in charge of which servers exist.
    - capability: capabilityToolPermissionScoping
      at: broker
      note: Request the narrowest scopes the vendor publishes and expose only the tools each agent needs — deny by default at the broker.
    - capability: capabilityHitlControls
      at: broker
      note: Gate the calls that write behind human approval, and only those — reads are too frequent for approval to stay real.
    - capability: capabilityPromptInjectionDefense
      at: vendorMcp->egress
      note: Classify descriptions and results before they enter context; pin descriptions so a changed catalogue is a detected event, not a silent one.
    - capability: capabilityEgressControl
      at: egress
      note: Allowlist which tool vendors agent traffic may reach — the enforcement the admitted list needs to be real.
    - capability: capabilityAiDlp
      at: egress
      note: Inspect what leaves in arguments and payloads — the substitute for application logging the provider does not offer.
    - capability: capabilityNhiManagement
      at: egress->vendorMcp
      note: Treat each OAuth grant as a managed non-human identity — owned, scoped, expiring, revoked in one place.
    - capability: capabilityAuditLogging
      at: agent->broker
      note: Log every call at the broker — tool, agent, arguments — at your fidelity, not the fidelity the provider chose.
    - capability: capabilityRateLimiting
      at: broker->egress
      note: Bound call volume and spend per server, outside the loop that generates the calls.
    - capability: capabilityAiTprm
      at: governance->vendorMcp
      note: Assess tenant isolation, retention and subprocessors before admission — the questions no inspection can answer.
    - capability: capabilityVendorAssurance
      at: governance->vendorMcp
      note: Contractual commitments are the only control on the vendor's side of this boundary — name them as one and keep them current.

scenarios:
  - title: A tool call round trip
    steps:
      - follow: agent->broker
        note: The agent requests a tool the broker actually exposes to it — scope was decided before the loop ran.
      - follow: broker->egress
        note: A write waits for approval; a read goes straight through with the runtime's identity attached.
      - follow: egress->vendorMcp
        note: The call crosses on a named, scoped, revocable OAuth grant.
      - follow: vendorMcp->egress
        note: The result returns — vendor-controlled text on its way into context.
      - follow: broker->agent
        note: The broker size- and shape-checks the result before the loop reads it as instruction.
  - title: The catalogue changes after approval
    steps:
      - follow: egress->vendorMcp
        note: A routine reconnection — descriptions are re-read every time, not fixed at approval.
      - follow: vendorMcp->egress
        note: A tool description has changed since review. Nothing on the vendor's side announces it.
      - follow: broker->agent
        note: Description pinning at the broker turns the silent change into a blocked connection and an alert.
  - title: A grant outlives its project
    steps:
      - follow: egress->vendorMcp
        note: A server connected for last year's project still holds a valid grant and still supplies context to agents.
      - follow: governance->vendorMcp
        note: The inventory flags the unused connection; revocation happens once, at the identity provider — the payoff of enterprise-managed admission.

