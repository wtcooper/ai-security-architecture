      - mitigation: AML.M0028
        coverage: native
        verified: "2026-09-10"
        mechanism: >-
          allowedTools / disallowedTools, permissionMode (default, dontAsk, acceptEdits, plan, auto,
          bypassPermissions), mcp__server__tool allow patterns, skills option, per-subagent permissionMode
        steps:
          - title: Fix an explicit tool surface
            body:
              - Pair allowedTools with permissionMode "dontAsk" so listed tools run and everything else is
                denied; note allowedTools does not constrain bypassPermissions.
            url: https://code.claude.com/docs/en/agent-sdk/permissions
          - title: Allow MCP tools narrowly
            body:
              - Use mcp__<server>__<tool> or mcp__<server>__* entries rather than a broad permission mode;
                acceptEdits never auto-approves MCP tools.
            url: https://code.claude.com/docs/en/agent-sdk/mcp
        evidence: []
