id: exposed            # the key feed items and deep dives carry in `category`
slug: exposed-by-default         # its address: /incidents/exposed-by-default/
order: 4
name: "Exposed by default"
short: "AI services, agents and data stores left reachable by anyone, because nothing in their default setup asks who is calling."
since: 2026-11-25
overview: >-
  Many model runtimes, vector stores and agent gateways ship with no sign-in, or trust whatever
  seems to come from localhost, assuming something will sit in front of them. Often nothing does,
  and nothing has to be exploited: the service answers whoever reaches its port. On 10 November
  2026 Rapid7 found 7,675 Ollama servers answering, more than half carrying models someone else
  had put there; OpenClaw agents were counted in the tens of thousands, and six open Chroma stores
  held ransom notes planted for RAG to retrieve. At stake are the models, conversations, documents
  and compute behind the port. The fix is old: authentication in front, a known listening
  interface, an inventory of what runs.
howItWorks:
  - "Someone runs an AI service where the internet can reach it: a model runtime, a vector store, an agent gateway or an assistant's API."
  - "Its default asks no one who is calling: no sign-in, a key that is optional, or trust in anything that appears to come from loopback."
  - "Scanners find it on its well-known port, or from public API documentation."
  - "Strangers use it as it is: list, pull and copy models, read chats and collections, plant content, burn compute or drive the agent."
signs:
  - "A model runtime, vector store or agent gateway answering on a public address without asking for a key."
  - "Models, collections or notes nobody on the team put there: marker models, premium-named aliases, ransom notes."
  - "AI hosts on address ranges or cloud accounts that no inventory lists."
stops:
  - control: D3-AA
    how: "An authenticating proxy in front of runtimes with no sign-in of their own; every list, pull and copy on the exposed Ollama servers was anonymous."
  - control: D3-APA
    how: "No endpoint answers until a signed-in user is bound to the request; McKinsey's Lilli had 22 that did not ask, documented in public."
  - control: D3-MAN
    how: "A token on the agent gateway's control port: loopback is a network position, not authentication, and the user's own browser can reach it."
  - control: D3-PA
    how: "Record which interface each serving process listens on; a runtime bound to every interface is the one strangers find."
  - control: cap-shadow-ai-discovery
    how: "Scan your own public ranges and every cloud account, including those paid on personal cards, for runtimes nobody registered."
risks: [riskInsecureIntegratedComponent, riskSensitiveDataDisclosure, riskShadowAndUnknownAgents, riskModelDeploymentTampering, riskRetrievalVectorStorePoisoning]
owasp: [LLM02:2026, ASI03, MCP07:2025]
atlas: [AML.T0006.002, AML.T0132, AML.T0040, AML.T0085.000]
notSameAs:
  - pattern: exploitedSoftware
    why: "If getting in took a flaw, such as a path traversal, a forged loopback header or an RCE, it is exploited software; here the service simply answered."
  - pattern: aiMadeExposure
    why: "An app or page an AI tool built and published open is AI-made exposure; this incident pattern is for services and stores people deployed."
