            url: https://learn.microsoft.com/en-us/azure/foundry/concepts/deployments-overview
          - name: "Deployment types and data processing location"
            what: "Global, Data Zone and regional deployment types set where prompts and responses are processed; data at rest remains in the designated Azure geography."
            url: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/deployment-types
          - name: "Managed compute"
            what: "Models from the Hugging Face collection run on dedicated A100, H100, H200 or MI300X accelerators that Microsoft sizes and operates, billed hourly per accelerator, with Global or Data Zone scope and no built-in content filtering."
            url: https://learn.microsoft.com/en-us/azure/foundry/concepts/managed-compute-overview
          - name: "Deployment templates and Microsoft-managed runtimes"
            what: "Each managed compute model has versioned templates that fix the runtime (for example vLLM, SGLang, TensorRT-LLM, NVIDIA NIM or llama.cpp), accelerator count and context length; Microsoft builds, scans, signs and patches the runtime images."
            url: https://learn.microsoft.com/en-us/azure/foundry/concepts/managed-compute-overview
          - name: "Curated Hugging Face collection"
            what: "Catalogue models are screened for licence and for code that would run at load time, limited to SafeTensors weights, and pre-staged in Microsoft-managed storage and registry."
            url: https://learn.microsoft.com/en-us/azure/foundry/concepts/managed-compute-overview
          - name: "Unified endpoint and authentication"
            what: "All deployment types share one Foundry endpoint, reached with Microsoft Entra ID or a key; managed compute answers at /managed-deployments/<name>/ and, for compatible runtimes, at /openai/v1/."
            url: https://learn.microsoft.com/en-us/azure/foundry/concepts/managed-compute-overview
          - name: "Content filtering on serverless deployments"
            what: "Serverless API deployments include built-in, configurable Azure AI Content Safety filters; managed compute deployments do not, and Microsoft says to call the Content Safety APIs from your application."
            url: https://learn.microsoft.com/en-us/azure/foundry/concepts/deployments-overview
          - name: "Adapter deployments on managed compute (preview)"
            what: "A LoRA adapter produced by fine-tuning in Foundry can be served on a compatible managed compute deployment under its own deployment name, sharing the base model's capacity; importing your own adapters is not yet possible."
            url: https://learn.microsoft.com/en-us/azure/foundry/concepts/adapter-deployment-overview
          - name: "Instant access to models (preview)"
            what: "Supported models can be called by name with no deployment, in a project in West US 3 during the preview."
            url: https://learn.microsoft.com/en-us/azure/foundry/concepts/instant-models
          - name: "Fireworks on Foundry, including custom model import"
            what: "A Microsoft service that serves open models, and your own weights matching a supported base model, on Fireworks AI's inference engine and GPUs; Microsoft states customer data leaves Microsoft facilities, with Fireworks as its subprocessor."
            url: https://learn.microsoft.com/en-us/azure/foundry/how-to/fireworks/import-custom-models
          - name: "Private networking"
            what: "Inbound access to the Foundry resource is governed by its public network access flag and private endpoints."
            url: https://learn.microsoft.com/en-us/azure/foundry/how-to/configure-private-link
