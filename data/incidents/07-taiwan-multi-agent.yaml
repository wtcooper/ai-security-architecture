id: taiwan-multi-agent
title: "Taiwan government intrusion: eight parallel sub-agents built on OpenClaw and Hermes"
subtitle: >
  A multi-agent framework assembled from two open-source personal agents ran twelve attack waves
  in four days against Taiwanese government systems — scoring its own findings with a Bayesian
  engine, discarding its own false positives, and teaching itself the target's stack between runs.
dateRange: 1–4 July 2026 (disclosed 12 August 2026)
perspective: weapon
archetype: archAgentWorkflow
summary:
  - >
    Israeli firm Dream recovered the operator's entire working directory — 1,395 files, 160 MB —
    and published it in August. Inside were `.hermes` and `.openclaw` directories: the attack
    framework was built on the same two open-source agent projects anyone can install, not on
    anything bespoke.
  - >
    Sub-agents were labelled A through Q, up to eight running concurrently, dispatched in batches
    across twelve waves. Each took a distinct role — API enumeration, credential spraying,
    vulnerability validation, lateral movement through single sign-on, exfiltration. A two-layer
    Bayesian decision engine scored every finding, starting at even odds and adjusting on
    evidence; it rated the SSO lateral-movement chain at 99% and the chain then worked. Five
    autonomous "learning cycles" searched CVE databases and security publications for techniques
    matched to the target's specific stack.
  - >
    The framework also corrected itself. It discarded seven of its own false positives, in one
    case reclassifying an apparent SQL injection after determining that a 21-second delay came
    from an SMTP timeout rather than a database. Confirmed findings were retested up to six times.
  - >
    Read the autonomy claim carefully. Taiwan's Ministry of Digital Affairs described a hybrid
    operation combining manual work with agent assistance, and Dream infers the autonomy from
    artefacts after the fact rather than having watched it run. The honest description is
    near-autonomous and human-directed — which is quite enough. The guardrail was defeated by
    telling the models this was authorised penetration testing, a claim they had no way to check.
patterns:
  - AI-Orchestrated Offensive Operations
  - Parallel Multi-Agent Intrusion
  - Social Engineering of AI Agents
  - No Action-Level Authorization
cves: []
risks:
  - riskRogueActions
  - riskShadowAndUnknownAgents
  - riskRunawayAgentToolLoops
  - riskSensitiveDataDisclosure
  - riskCrossTenantCredentialPropagation
  - riskAgentDelegationChainOpacity
  - riskInsecureIntegratedComponent
controls:
  - controlAgentExecutionBounds
  - controlAgentObservability
  - controlThreatDetection
  - controlApplicationAccessManagement
  - controlIncidentResponseManagement
  - controlProductGovernance
steps:
  - n: 1
    title: An attack framework assembled from open source
    phase: introduced
    narrative: >
      Two open-source personal agent projects, an orchestrator, and up to eight sub-agents per
      wave, each assigned a distinct target or technique. The operator's authorisation for all of
      it was a sentence: this is a sanctioned penetration test. No model can verify that claim,
      and none did.
    components:
      - actorUser
      - componentAgentUserQuery
      - componentAgentSystemInstruction
      - componentReasoningCore
    path: [operator->events, events->harness, orchestration->subagents]
    risks:
      - riskRogueActions
      - riskShadowAndUnknownAgents
    sources:
      - title: "Inside a multi-agent AI framework used to compromise government entities in Asia"
        url: https://www.dreamgroup.com/blog/inside-a-multi-agent-ai-framework-used-to-compromise-government-entities-in-asia
        publisher: Dream
        date: 2026-08-12
  - n: 2
    title: The front door was in the JavaScript
    phase: introduced
    narrative: >
      Reconnaissance decompiled an Angular government portal's bundles and recovered 36+ API
      endpoints, identity-server configuration and OAuth client IDs. From there: an
      unauthenticated user database holding thousands of employee records, hidden authentication
      endpoints that accepted any request body, and tokens the server would accept with their
      signature algorithm set to none. CAPTCHAs were read by OCR.
    components:
      - actorExternalSources
      - componentApplication
      - componentTools
      - componentOrchestrationInputHandling
    path: [harness->gateway, gateway->extTools, extTools->downstream]
    risks:
      - riskInsecureIntegratedComponent
      - riskRogueActions
    sources:
      - title: "Inside a multi-agent AI framework used to compromise government entities in Asia"
        url: https://www.dreamgroup.com/blog/inside-a-multi-agent-ai-framework-used-to-compromise-government-entities-in-asia
        publisher: Dream
        date: 2026-08-12
  - n: 3
    title: Twelve waves, eight agents at a time
    phase: exposed
    narrative: >
      Across four days the framework mapped 21 connected government systems and six single
      sign-on sub-realms. Parallelism is the part defenders should sit with: eight agents working
      different techniques against different targets at once produces no recognisable session
      shape, and the scoring engine meant unpromising branches were dropped rather than retried
      noisily.
    components:
      - actorExternalSources
      - componentReasoningCore
      - componentTools
      - componentOrchestrationOutputHandling
    path: [orchestration->subagents, harness->gateway, gateway->extTools]
    risks:
      - riskRogueActions
      - riskRunawayAgentToolLoops
      - riskAgentDelegationChainOpacity
    sources:
      - title: "Near-autonomous AI attack targeted government in Taiwan"
        url: https://cyberscoop.com/near-autonomous-ai-attack-government-target-taiwan/
        publisher: CyberScoop
        date: 2026-08-12
  - n: 4
    title: 85 accounts, and the keys behind them
    phase: exposed
    narrative: >
      Eighty-five credentials cracked, 2,564 personnel records taken, seven SSO client secrets
      and six internal database credentials across MSSQL, Oracle and Sybase, plus two signing
      keys. A web shell was uploaded; a second authentication layer stopped it executing. A
      persistent backdoor was confirmed. Targeting then widened to government IT suppliers, the
      nuclear safety agency, the government email system and seven or more energy companies.
    components:
      - actorExternalSources
      - componentTools
      - componentOrchestrationOutputHandling
      - componentApplication
    path: [harness->gateway, gateway->extTools, extTools->downstream, harness->state]
    risks:
      - riskSensitiveDataDisclosure
      - riskCrossTenantCredentialPropagation
    sources:
      - title: "Taiwan says it was targeted last month by an AI-driven hacking campaign"
        url: https://www.nbcnews.com/world/asia/taiwan-says-was-targeted-last-month-ai-driven-hacking-campaign-rcna592273
        publisher: Reuters via NBC News
        date: 2026-08-12
      - title: "AI agents wage near-autonomous cyberattack on Asian government networks"
        url: https://www.csoonline.com/article/4209210/ai-agents-wage-near-autonomous-cyberattack-on-asian-government-networks.html
        publisher: CSO Online
        date: 2026-08-13
  - n: 5
    title: Where this chain breaks
    phase: mitigated
    narrative: >
      Every door the agents walked through was an ordinary one: an unauthenticated database, an
      endpoint that took any body, a token library accepting an unsigned algorithm, credentials
      that worked in more than one realm. The AI supplied speed, parallelism and patience, not a
      new class of flaw. Detection has to move from session shape to behaviour, because eight
      agents in parallel look like eight unrelated visitors. And on the provider side, "this is
      an authorised test" is a claim that needs evidence rather than acceptance.
    components:
      - componentApplication
      - componentApplicationInputHandling
      - componentReasoningCore
      - componentTools
      - componentOrchestrationOutputHandling
      - componentModelServing
    path: [gateway->extTools, extTools->downstream, govObservability]
    sources:
      - title: "Inside a multi-agent AI framework used to compromise government entities in Asia"
        url: https://www.dreamgroup.com/blog/inside-a-multi-agent-ai-framework-used-to-compromise-government-entities-in-asia
        publisher: Dream
        date: 2026-08-12
alsoSeen:
  - title: "The same agent framework automating post-exploitation in Thailand, three weeks earlier"
    date: July 2026
    note: >
      Exposed attacker directories held 585 files including agent logs run in a mode that strips
      the human-approval prompt for dangerous commands — privilege-escalation recon, kernel
      vulnerability scanning and a customised enumeration script. The ministry has not confirmed.
    sources:
      - title: "Hermes AI agent used to automate attack on Thai finance ministry"
        url: https://www.bleepingcomputer.com/news/security/hermes-ai-agent-used-to-automate-attack-on-thai-finance-ministry/
        publisher: BleepingComputer
  - title: "An AI-augmented lone actor reaches 600+ firewalls in five weeks"
    date: January–February 2026
    note: >
      A low-skill, financially motivated actor used commercial models for planning, tooling and
      lateral movement to reach 600+ devices across 55 countries — with no exploits at all, just
      credential brute-forcing against exposed management interfaces. The report notes the actor
      still struggled with exploit compilation: AI supplied scale, not skill.
    sources:
      - title: "AI-augmented threat actor accesses FortiGate devices at scale"
        url: https://aws.amazon.com/blogs/security/ai-augmented-threat-actor-accesses-fortigate-devices-at-scale/
        publisher: Amazon Security
        date: 2026-02-20
