                      feature; an explicit Off in any role blocks access.
                  url: https://learn.chatgpt.com/docs/enterprise/roles-and-workspace-permissions
                - title: Bound token lifetime
                  body:
                    - Owners set "Access token expiration limit" in Permissions & roles.
                  url: https://learn.chatgpt.com/docs/enterprise/access-tokens
