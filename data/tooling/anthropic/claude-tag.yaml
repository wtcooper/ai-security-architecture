              verified: 2026-09-10
            - capability: capabilityVendorAssurance
              coverage: external
              mechanism: Admin console readback (Access bundles, scopes, Access summary), audit log entries for
                channel-manager and deletion actions via the Compliance API Activity Feed
              steps:
                - title: Evidence the configuration
                  body:
                    - Export the channel Access summary and bundle listings, and read channel-manager
                      credential changes and scope removals from the organisation audit log through the
                      Compliance API.
                  url: https://claude.com/docs/claude-tag/admins/restrict-access
              note: Console readback and audit entries are the inputs an SSPM product consumes; nothing in the product
