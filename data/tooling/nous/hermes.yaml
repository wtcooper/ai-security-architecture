      - mitigation: D3-EI
        coverage: native
        verified: "2026-09-10"
        mechanism: >-
          terminal.backend docker / ssh / singularity / modal / daytona / vercel_sandbox in config.yaml;
          Docker containers run --cap-drop ALL, no-new-privileges, pids-limit 256 and size-limited tmpfs with
          optional --network=none and ephemeral workspaces
        steps:
          - title: Move command execution into a container
            body:
              - "Set terminal.backend: docker with docker_forward_env: [] in ~/.hermes/config.yaml; every
                container is started with all capabilities dropped (DAC_OVERRIDE, CHOWN and FOWNER added
                back), no-new-privileges, a 256-process limit and nosuid tmpfs mounts."
            url: https://hermes-agent.nousresearch.com/docs/user-guide/security
          - title: Bound and discard the sandbox
            body:
              - "Set terminal.container_cpu, container_memory and container_disk, and container_persistent:
                false to keep the workspace on tmpfs so it is lost on cleanup instead of persisting under
                ~/.hermes/sandboxes/docker/."
            url: https://hermes-agent.nousresearch.com/docs/user-guide/security
          - title: Air-gap the sandbox when the task allows
            body:
              - "Set terminal.docker_network: false (env TERMINAL_DOCKER_NETWORK) to run the execution
                container with --network=none; an existing networked container is replaced by a fresh
                air-gapped one."
            url: https://hermes-agent.nousresearch.com/docs/user-guide/configuration
          - title: Or keep execution off the host entirely
            body:
              - "Set terminal.backend: ssh and put TERMINAL_SSH_HOST, TERMINAL_SSH_USER and TERMINAL_SSH_KEY
                in ~/.hermes/.env so commands run on a separate machine while the messaging connections stay
                on the gateway host."
            url: https://hermes-agent.nousresearch.com/docs/user-guide/security#network-isolation
        evidence: []
        note: >-
          The default backend is local with no isolation, and dangerous-command checks are skipped inside
          container backends because the container is treated as the boundary.
