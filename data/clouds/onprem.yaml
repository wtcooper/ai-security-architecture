  - architecture: archRemoteMcpServer
    asOf: "2026-11"
    verified: "2026-11-18"
    reference:
      - title: "Authorisation server, for example Keycloak: Integrating with Model Context Protocol (MCP)"
        url: https://www.keycloak.org/securing-apps/mcp-authz-server
      - title: "MCP gateway, for example LiteLLM Proxy: MCP Deployment Guide"
        url: https://docs.litellm.ai/docs/mcp_deployment
      - title: "MCP gateway, for example LiteLLM Proxy: Production Best Practices"
        url: https://docs.litellm.ai/docs/proxy/prod
    summary:
      - "Your MCP server runs as a stateless service on infrastructure you operate, behind an edge proxy and an MCP-aware gateway. Your identity provider signs people in and your authorisation server issues short-lived tokens that name this server as their audience; the gateway shows each caller only its own tools and serves reviewed tool definitions; your secrets manager issues a separate short-lived credential for each system of record. You run what a cloud provider would otherwise supply: the platform, ingress, certificates, keys, logging and patching; each box lists example products."
    bindings:
      - block: idp
        service: "Identity provider federated to your directory"
        options:
          - { name: "Keycloak", kind: open, url: "https://www.keycloak.org/securing-apps/token-exchange", note: "Open-source IdP and authorisation server: standard token exchange within a realm, client scopes and audience mappers; you run it HA.", packs: [upstreamOpenSource], watch: [{ text: "Callers from another organisation sign in at their own identity provider; your Keycloak accepts its assertion through the JWT Authorization Grant.", url: "https://www.keycloak.org/guides" }, { text: "The identity assertion grant (ID-JAG) is experimental: Keycloak can receive such a grant but not yet issue one, and warns against production use. For a policy-checked grant between two domains today, use standard token exchange in the caller's realm and the JWT Authorization Grant in yours.", url: "https://www.keycloak.org/securing-apps/identity-assertion-jwt-authorization-grant" }] }
          - { name: "Red Hat build of Keycloak", kind: commercial, url: "https://access.redhat.com/products/red-hat-build-keycloak/", note: "Red Hat-supported Keycloak (26.6 is the latest version listed); the IdP in Red Hat's Connectivity Link guides.", packs: [redHatOpenShiftAi], watch: [{ text: "Red Hat's supported Keycloak; 26.6 is the latest version listed.", url: "https://access.redhat.com/products/red-hat-build-keycloak/" }] }
          - { name: "Gravitee Access Management", kind: commercial, url: "https://documentation.gravitee.io/am/4.11/guides/developer-contributions/using-oauth-2.0-token-exchange", note: "Token exchange with delegation (act claim) in AM 4.11; MCP Server resources with per-tool scopes are in preview.", packs: [graviteeAgentMesh], watch: [{ text: "Token exchange with delegation (act claim) in AM 4.11; federates to your directory.", url: "https://documentation.gravitee.io/am/4.11/guides/developer-contributions/using-oauth-2.0-token-exchange" }] }
          - { name: "PingFederate", kind: commercial, url: "https://docs.pingidentity.com/pingfederate/13.1/introduction_to_pingfederate/pf_token_exchange_grant.html", note: "Self-managed commercial server; RFC 8693 token exchange through processor policies, with an ID-JAG token type in 13.1." }
          - { name: "ZITADEL", kind: open, url: "https://zitadel.com/docs/guides/integrate/token-exchange", note: "Open-source, self-hostable IdP with RFC 8693 token exchange for impersonation and delegation." }
      - block: gateway
        service: "MCP gateway at the published edge"
        options:
          - { name: "Envoy Gateway in front of LiteLLM", kind: open, url: "https://gateway.envoyproxy.io/docs/tasks/security/jwt-authentication/", note: "Envoy Gateway checks issuer, audience and rate limits at the edge; LiteLLM applies per-tool rules behind it.", packs: [upstreamOpenSource], watch: [{ text: "Envoy Gateway ends TLS, checks the token's issuer and audience and applies rate limits; LiteLLM applies the per-tool rules.", url: "https://docs.litellm.ai/docs/mcp" }, { text: "LiteLLM authenticating callers' JWTs itself needs an Enterprise licence. In the open-source build a caller presents a virtual key (x-litellm-api-key) beside its identity-provider token (Authorization), so the token's issuer and audience are checked at the edge proxy and again in the MCP server.", url: "https://docs.litellm.ai/docs/proxy/token_auth" }] }
          - { name: "Red Hat Connectivity Link MCP gateway", kind: commercial, url: "https://www.redhat.com/en/blog/model-context-protocol-gateway-red-hat-openshift-now-generally-available", note: "GA in 1.5 (Oct 2026): filters tools, prompts and resources by a JWT claim and audits tools/call; console plug-in is Developer Preview.", packs: [redHatOpenShiftAi], watch: [{ text: "Filters tools, prompts and resources by a JWT claim and audits each tools/call; the console plug-in is Developer Preview.", url: "https://www.redhat.com/en/blog/model-context-protocol-gateway-red-hat-openshift-now-generally-available" }] }
          - { name: "Kong AI MCP Proxy with AI MCP OAuth2", kind: commercial, url: "https://developer.konghq.com/plugins/ai-mcp-oauth2/", note: "Kong acts as the MCP resource server (introspection or JWKS); the OAuth2 plugin is Tech Preview; token exchange from 3.14.", packs: [kongAiGateway], watch: [{ text: "Kong as the MCP resource server (introspection, or JWKS from 3.14) with token exchange from 3.14; Tech Preview.", url: "https://developer.konghq.com/plugins/ai-mcp-oauth2/" }] }
          - { name: "Gravitee MCP proxy with Access Management", kind: commercial, url: "https://www.gravitee.io/blog/gravitee-4-10-one-control-point-to-secure-govern-ai-agents-mcp-and-llms", note: "MCP proxy API type (4.10) reads MCP payloads per tool; token issue and validation delegated to Gravitee AM.", packs: [graviteeAgentMesh], watch: [{ text: "MCP proxy API type (4.10) inspects which tools and prompts are called; fine-grained authorisation per tool.", url: "https://www.gravitee.io/blog/gravitee-4-10-one-control-point-to-secure-govern-ai-agents-mcp-and-llms" }] }
          - { name: "Kuadrant MCP Gateway (upstream)", kind: open, url: "https://github.com/Kuadrant/mcp-gateway", note: "Apache-2.0, Envoy-based aggregator with OAuth protected-resource metadata and Keycloak-backed tool ACLs; upstream of Red Hat's." }
          - { name: "agentgateway", kind: open, url: "https://agentgateway.dev/", note: "Linux Foundation project donated by Solo.io: one data plane for LLM, MCP and A2A traffic with JWT, OIDC, ext_authz and tool scoping." }
      - block: authServer
        service: "OAuth authorization server for the MCP server"
        options:
          - { name: "Keycloak", kind: open, url: "https://www.keycloak.org/securing-apps/token-exchange", note: "Open-source IdP and authorisation server: standard token exchange within a realm, client scopes and audience mappers; you run it HA.", packs: [upstreamOpenSource], watch: [{ text: "Audience mappers bind tokens to the server; resource indicators are an experimental Keycloak feature.", url: "https://www.keycloak.org/docs/latest/server_admin/index.html#audience-support" }, { text: "Audience binding uses an Audience mapper; resource indicators and client ID metadata documents are experimental features.", url: "https://www.keycloak.org/securing-apps/mcp-authz-server" }, { text: "Supports the 2025-03-26 MCP authorization profile as shipped; later profiles are experimental. Resource indicators (RFC 8707) and client ID metadata documents are switched on with --features, so bind the audience with an Audience mapper on a client scope until you accept those features.", url: "https://www.keycloak.org/securing-apps/mcp-authz-server" }] }
          - { name: "Red Hat build of Keycloak", kind: commercial, url: "https://access.redhat.com/products/red-hat-build-keycloak/", note: "Red Hat-supported Keycloak (26.6 is the latest version listed); the IdP in Red Hat's Connectivity Link guides.", packs: [redHatOpenShiftAi], watch: [{ text: "Red Hat's supported Keycloak; 26.6 is the latest version listed.", url: "https://access.redhat.com/products/red-hat-build-keycloak/" }] }
          - { name: "Gravitee Access Management", kind: commercial, url: "https://documentation.gravitee.io/am/4.11/guides/developer-contributions/using-oauth-2.0-token-exchange", note: "Token exchange with delegation (act claim) in AM 4.11; MCP Server resources with per-tool scopes are in preview.", packs: [graviteeAgentMesh], watch: [{ text: "Each tool carries its own OAuth scopes; preview in the AM docs (4.13), announced with 4.10.", url: "https://documentation.gravitee.io/am/guides/mcp-servers" }] }
          - { name: "PingFederate", kind: commercial, url: "https://docs.pingidentity.com/pingfederate/13.1/introduction_to_pingfederate/pf_token_exchange_grant.html", note: "Self-managed commercial server; RFC 8693 token exchange through processor policies, with an ID-JAG token type in 13.1." }
          - { name: "ZITADEL", kind: open, url: "https://zitadel.com/docs/guides/integrate/token-exchange", note: "Open-source, self-hostable IdP with RFC 8693 token exchange for impersonation and delegation." }
      - { block: service, service: "Your MCP server", build: true, note: "Must check issuer, audience, expiry and scope on every call itself; the gateway in front does not replace that." }
      - { block: toolDefs, service: "Versioned, signed tool definitions", build: true, note: "Released as a signed bundle (for example signed with Cosign) and baked into the service image; the fingerprint recorded at review travels with the release." }
      - { block: orgData, service: "Your systems of record", build: true, note: "Reached with per-system credentials from your secrets manager; tenant separation is enforced in the handlers and again by row security." }
      - block: govIdentity
        service: "Workload identity for the server and gateway"
        options:
          - { name: "Keycloak", kind: open, url: "https://www.keycloak.org/securing-apps/token-exchange", note: "People and service clients in one realm, with token exchange for hand-offs.", packs: [upstreamOpenSource] }
          - { name: "Red Hat build of Keycloak", kind: commercial, url: "https://access.redhat.com/products/red-hat-build-keycloak/", note: "Supported Keycloak build from Red Hat.", packs: [redHatOpenShiftAi], watch: [{ text: "ZTWIM 1.1 GA July 2026; SPIRE in OpenShift Service Mesh 3.5 is GA in sidecar mode, not yet in ambient mode.", url: "https://www.redhat.com/en/blog/zero-trust-workload-identity-manager-11-generally-available-red-hat-openshift" }] }
          - { name: "Kubernetes ServiceAccount tokens", kind: open, url: "https://kubernetes.io/docs/concepts/security/service-accounts/", note: "Short-lived projected tokens give each workload an identity the IdP and vault can verify.", packs: [upstreamOpenSource] }
          - { name: "SPIFFE and SPIRE", kind: open, url: "https://spiffe.io/docs/latest/spire-about/", note: "Attested workload identities and trust-domain federation, an alternative to keys per client." }
          - { name: "Red Hat zero trust workload identity manager", kind: commercial, url: "https://www.redhat.com/en/blog/zero-trust-workload-identity-manager-11-generally-available-red-hat-openshift", note: "Red Hat's SPIRE operator, GA 1.1 (July 2026), with Vault and cert-manager as upstream authorities.", packs: [redHatOpenShiftAi] }
          - { name: "Gravitee Access Management", kind: commercial, url: "https://documentation.gravitee.io/am/4.11/guides/developer-contributions/using-oauth-2.0-token-exchange", note: "Gravitee's IdP and authorisation server, with delegated token exchange.", packs: [graviteeAgentMesh] }
      - block: govSecrets
        service: "Secrets manager with a hardware root"
        options:
          - { name: "HashiCorp Vault", kind: commercial, url: "https://developer.hashicorp.com/vault/docs/deploy/kubernetes/vso", note: "Dynamic credentials, transit keys and the Vault Secrets Operator; HSM auto-unseal needs Vault Enterprise.", packs: [upstreamOpenSource] }
          - { name: "OpenBao", kind: open, url: "https://openbao.org/docs/configuration/seal/pkcs11/", note: "Open-source fork of Vault under the Linux Foundation's OpenSSF; documents a PKCS#11 HSM seal.", packs: [upstreamOpenSource] }
          - { name: "External Secrets Operator", kind: open, url: "https://external-secrets.io/latest/", note: "Syncs secrets from an external store into Kubernetes Secrets; pairs with any vault here." }
          - { name: "External Secrets Operator for Red Hat OpenShift", kind: commercial, url: "https://developers.redhat.com/articles/2025/11/11/introducing-external-secrets-operator-openshift", note: "Red Hat-supported ESO, GA for OpenShift 4.20+, syncing from Vault or CyberArk Conjur.", packs: [redHatOpenShiftAi], watch: [{ text: "GA for OpenShift 4.20+; it syncs from a vault you run, such as HashiCorp Vault or CyberArk Conjur.", url: "https://developers.redhat.com/articles/2025/11/11/introducing-external-secrets-operator-openshift" }] }
          - { name: "Idira Secrets Manager, self-hosted (Palo Alto Networks)", kind: commercial, url: "https://www.paloaltonetworks.com/idira/machine/secrets-management", note: "The former CyberArk line now under Palo Alto's Idira brand; SaaS or self-hosted for air-gapped sites." }
      - block: govPolicy
        service: "Network, admission and guardrail policy"
        options:
          - { name: "Kubernetes", kind: open, url: "https://kubernetes.io/docs/concepts/overview/", note: "The container platform each platform pack here runs on, upstream or as a distribution (OpenShift, VKS, Canonical Kubernetes).", packs: [upstreamOpenSource, redHatOpenShiftAi] }
          - { name: "Cilium", kind: open, url: "https://docs.cilium.io/en/stable/security/policy/", packs: [upstreamOpenSource] }
          - { name: "Squid outbound proxy", kind: open, url: "https://www.squid-cache.org/Doc/config/access_log/", note: "The single exit for search and page fetches, with an access log for review.", packs: [upstreamOpenSource] }
          - { name: "Kyverno", kind: open, url: "https://kyverno.io/docs/policy-types/image-validating-policy/", packs: [upstreamOpenSource] }
          - { name: "PostgreSQL with pgvector", kind: open, url: "https://github.com/pgvector/pgvector", note: "Rows and vectors in one database, so PostgreSQL row security also applies to vector queries.", packs: [upstreamOpenSource] }
      - block: govSupplyChain
        service: "Mirrors, scanners and signing in the pipeline"
        options:
          - { name: "Trivy", kind: open, url: "https://trivy.dev/docs/latest/guide/scanner/vulnerability/", packs: [upstreamOpenSource] }
          - { name: "Harbor", kind: open, url: "https://goharbor.io/docs/2.16.0/administration/configure-proxy-cache/", note: "Image registry with a proxy cache and Trivy scanning; images, not PyPI or npm.", packs: [upstreamOpenSource] }
          - { name: "promptfoo", kind: open, url: "https://www.promptfoo.dev/docs/intro/", note: "Open-source CLI and library for LLM evaluation and red teaming; agreed to be acquired by OpenAI (March 2026) and says it stays open source", packs: [upstreamOpenSource] }
      - block: govObservability
        service: "Tool-call records, logs and SIEM"
        options:
          - { name: "OpenTelemetry Collector", kind: open, url: "https://opentelemetry.io/docs/collector/", note: "Vendor-neutral pipeline that receives gateway logs and traces and forwards them to stores the agent cannot write.", packs: [upstreamOpenSource] }
          - { name: "Grafana Loki", kind: open, url: "https://grafana.com/docs/loki/latest/", note: "Log store; turn retention on, or logs are kept for ever.", packs: [upstreamOpenSource] }
          - { name: "Langfuse (self-hosted)", kind: open, url: "https://langfuse.com/self-hosting", note: "Self-hosted LLM tracing and evaluation, with a documented LiteLLM integration.", packs: [upstreamOpenSource] }
          - { name: "MLflow Tracing", kind: open, url: "https://mlflow.org/docs/latest/genai/tracing/", note: "Agent and LLM tracing; GA in OpenShift AI 3.5, where the visual agent-trace view is Technology Preview.", packs: [redHatOpenShiftAi], watch: [{ text: "MLflow is GA in OpenShift AI 3.5; the visual agent-trace view is Technology Preview. The SIEM is yours.", url: "https://www.redhat.com/en/blog/red-hat-ai-35-scaling-and-governing-ai-agents-production" }] }
          - { name: "Elastic Security", kind: commercial, url: "https://www.elastic.co/docs/solutions/security", note: "SIEM and detection engine; one example of where detections on gateway, egress and audit logs run." }
    sources:
      service: https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization
      toolDefs: https://docs.sigstore.dev/cosign/signing/signing_with_blobs/
      orgData: https://www.postgresql.org/docs/current/ddl-rowsecurity.html
    alsoNeeded:
      - service: "The container platform's control plane, highly available"
        role: other
        why: "No provider runs the platform for you: on Kubernetes, three control-plane nodes, etcd backups and version upgrades are your own work."
        url: https://kubernetes.io/docs/setup/production-environment/
      - service: "Public DNS, an edge load balancer and DDoS protection"
        role: ingress
        why: "A published server needs a public name and address in front of the edge proxy, and volumetric attacks must be absorbed before they reach the data centre."
        url: https://gateway.envoyproxy.io/docs/
      - service: "Certificate issuance from public and internal authorities"
        role: keys
        why: "The published endpoint needs a publicly trusted certificate and every internal hop needs one from your own authority, both renewed automatically (for example cert-manager with public and internal issuers)."
        url: https://cert-manager.io/docs/
      - service: "Secrets manager with a protected root key"
        role: secrets
        why: "Holds upstream credentials, the gateway's root keys and signing keys (for example OpenBao or HashiCorp Vault), with its root key protected so that no one person or file unseals it: Vault's PKCS#11 seal needs Vault Enterprise; OpenBao offers a pkcs11 seal as a plugin."
        url: https://openbao.org/docs/configuration/seal/pkcs11/
      - service: "Authorisation server in a highly available deployment"
        role: identity
        why: "Every call depends on token issue and exchange, so the authorization server (for example Keycloak) needs the same availability as the service it protects."
        url: https://www.keycloak.org/high-availability/introduction
      - service: "Replicated databases for the gateway and the identity provider"
        role: other
        why: "Gateway credentials, MCP permissions, pinned tool lists and the identity provider's realm data live in databases you must run, replicate and restore (for example PostgreSQL)."
        url: https://docs.litellm.ai/docs/proxy/prod
      - service: "A shared store for rate-limit counters"
        role: other
        why: "The edge proxy's global rate limit and the gateway's limits across several replicas keep their counters in a shared store (for example a Redis-compatible store such as Valkey)."
        url: https://gateway.envoyproxy.io/docs/tasks/traffic/global-rate-limit/
      - service: "Private container registry with scanning"
        role: registry
        why: "The signed service and gateway images are stored, scanned and served from a registry inside the data centre (for example Harbor with Trivy)."
        url: https://goharbor.io/docs/2.16.0/
      - service: "Log and metric stores and the SIEM"
        role: logging
        why: "Tool-call records, gateway logs and identity-provider events need a searchable store and detections that you operate (for example the OpenTelemetry Collector, Loki and Prometheus)."
        url: https://opentelemetry.io/docs/collector/
      - service: "Cluster and volume backup with tested restores"
        role: other
        why: "Cluster objects and volumes are not backed up unless you do it, and a restore has to be rehearsed (for example with Velero)."
        url: https://velero.io/docs/v1.19/
      - service: "Time synchronisation on every node"
        role: other
        why: "Five-minute tokens and signed assertions fail or outlive their lifetime when clocks drift (for example chrony)."
        url: https://chrony-project.org/documentation.html
    quickstart:
      - title: "MCP gateway, for example LiteLLM Proxy: Deploy with Helm"
        url: https://docs.litellm.ai/docs/proxy/deploy/helm
      - title: "MCP gateway, for example LiteLLM Proxy: MCP Overview"
        url: https://docs.litellm.ai/docs/mcp
      - title: "Authorisation server, for example Keycloak: Keycloak Operator Installation"
        url: https://www.keycloak.org/operator/installation
    # >>> hosting options (compared against the vendor's pages; one is the mapping itself)
    hosting:
      - id: kubernetes
        kind: cluster
        name: "Kubernetes"
        url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
        asOf: "2026-11"
        mapped: true
        compare:
          runs: "Your MCP server process runs in the pods of a Deployment on a cluster that your organisation installs and operates."
          patching: "Your organisation patches the node operating systems, Kubernetes, the container runtime, the base image and the server's dependencies."
          data: "Requests and tool results are processed in your pods and stay in your data centre; any logs or stores that keep them are ones you run."
          network: "Pods accept and send all traffic by default; NetworkPolicy, enforced by a network plugin such as Cilium, limits inbound and outbound connections."
          identity: "Each pod runs as a Kubernetes ServiceAccount and receives a short-lived, rotating projected token that other services can verify."
          accepts: "Any container image; Streamable HTTP is served as a plain HTTP service written with any MCP SDK, such as TypeScript, Python, Go, C#, Rust or Java."
          workload: "A fixed or autoscaled number of replicas runs all the time; how long a stream or a tool call may last is set by your gateway and your server."
          portability: "The image and manifests are standard Kubernetes objects that run on any conformant cluster; nothing in them is tied to a vendor."
          effort: "Your team operates the cluster, ingress, certificates, scaling, upgrades and logging, and is on call for the server and the nodes."
          fits: "Kubernetes documents a Deployment as the way to run an application workload that usually does not maintain state."
        sources:
          - https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
          - https://kubernetes.io/docs/concepts/services-networking/network-policies/
          - https://kubernetes.io/docs/concepts/security/service-accounts/
          - https://kubernetes.io/docs/concepts/workloads/autoscaling/horizontal-pod-autoscale/
          - https://modelcontextprotocol.io/specification/2026-07-28/basic/transports/streamable-http.md
          - https://modelcontextprotocol.io/docs/sdk
      - id: knative
        kind: runtime
        name: "Knative Serving"
        url: https://knative.dev/docs/serving/
        asOf: "2026-11"
        compare:
          runs: "Knative Serving, installed on the cluster by your platform team, creates and scales the pods of your server from a Knative Service you declare."
          patching: "Your organisation patches the nodes, Kubernetes, Knative Serving, its networking layer and your image; Knative adds a queue-proxy sidecar to each pod."
          data: "Requests and tool results pass through Knative's ingress, activator and queue-proxy on the way to your pods, all inside your own cluster."
          network: "Services stay on the cluster-local domain until a domain is configured, and a label keeps one off the external gateway; outbound limits remain NetworkPolicy."
          identity: "Pods run as the Kubernetes ServiceAccount named in the Service's revision template and receive the same projected tokens as any other pod."
          accepts: "Any container that serves HTTP on one port; Knative lists HTTP, HTTP/2, gRPC and WebSocket, so a Streamable HTTP server from any MCP SDK fits."
          workload: "Scales on concurrency or request rate, to zero by default; each request is limited by timeoutSeconds, 300 seconds by default and 600 at most unless raised."
          portability: "The container is unchanged; leaving Knative means rewriting the Knative Service as a Deployment, a Service and an autoscaler."
          effort: "Your team operates the cluster and also Knative Serving, its activator, autoscaler and networking layer, and tunes cold starts and timeouts."
          fits: "Knative presents Serving for serverless workloads: request-driven HTTP services with revisions, traffic splitting and autoscaling down to zero."
        sources:
          - https://knative.dev/docs/serving/
          - https://knative.dev/docs/install/
          - https://knative.dev/docs/serving/autoscaling/scale-to-zero/
          - https://knative.dev/docs/serving/autoscaling/scale-bounds/
          - https://knative.dev/docs/serving/configuration/config-defaults/
          - https://knative.dev/docs/serving/services/private-services/
          - https://knative.dev/docs/serving/request-flow/
          - https://knative.dev/docs/serving/autoscaling/autoscaler-types/
          - https://knative.dev/docs/serving/reference/serving-api/
          - https://knative.dev/docs/serving/tag-resolution/
          - https://knative.dev/docs/serving/configuration/deployment/
          - https://knative.dev/blog/articles/Knative-Serving-WebSockets/
          - https://raw.githubusercontent.com/knative-extensions/net-gateway-api/main/README.md
          - https://knative.dev/docs/serving/encryption/encryption-overview/
          - https://kubernetes.io/docs/concepts/services-networking/network-policies/
          - https://modelcontextprotocol.io/specification/2026-07-28/basic/transports/streamable-http.md
          - https://knative.dev/docs/install/operator/knative-with-operators/
        summary: "Your MCP server image is deployed as a Knative Service instead of a Deployment. Knative creates a Revision for each change, resolves the image tag to a digest, adds a queue-proxy sidecar and scales pods on request load, to zero by default. Calls from the gateway now pass through Knative's networking layer and, at low traffic, its activator. You gain autoscaling and revisions; you also operate Knative Serving and its networking layer, and must set scale bounds and timeouts to suit streams."
        bindings:
          - { block: service, service: "Your MCP server as a Knative Service", build: true, note: "One Revision per release. Set min-scale to 1 or more if cold starts matter. The server must still check issuer, audience, expiry and scope on every call itself.", url: https://knative.dev/docs/serving/, watch: [{ text: "Scales a Service to zero by default (enable-scale-to-zero is true and min-scale 0 with the default autoscaler), so the first call after an idle period waits for a pod; a published server that must answer at once sets autoscaling.knative.dev/min-scale to 1 or more.", url: "https://knative.dev/docs/serving/autoscaling/scale-to-zero/" }, { text: "Every request ends at timeoutSeconds (default 300, at most max-revision-timeout-seconds, 600 by default). In MCP revision 2026-07-28 a long tool call and a subscriptions/listen stream are each one HTTP request, so they end at that limit unless the platform team raises it together with the activator's termination grace period.", url: "https://knative.dev/docs/serving/configuration/config-defaults/" }] }
        addSettings: [knativeScaleBounds, knativeRequestLimits, knativeGatewayApiIngress, knativeTrafficSplit, knativeClusterLocalVisibility, knativeTagDigestResolution, knativeActivatorIngress]
        differences:
          - at: gateway->service
            text: "On Knative Serving, calls from the gateway enter Knative's networking layer and, at low or zero traffic, the shared activator, which holds them until a pod is ready. A rule that admits only the gateway's pods to the service must also admit those hops, and the service can in addition accept only gateway-signed requests."
            url: https://knative.dev/docs/serving/request-flow/
            change: "Knative option only: insert a 'Knative ingress and activator' hop on gateway->service."
        alsoNeeded:
          - service: "Knative Serving (controller, autoscaler, activator, webhook)"
            role: other
            why: "Installed and upgraded by your platform team from YAML or with the Knative Operator; the install needs cluster-admin rights."
            url: https://knative.dev/docs/install/
          - service: "A Knative networking layer (Kourier, or the Gateway API layer on Envoy Gateway)"
            role: ingress
            why: "Knative routes every request through one networking layer. Kourier is the suggested choice if you have none (the Operator defaults to Istio); the Gateway API layer is beta and names Envoy Gateway among its tested implementations."
            url: https://knative.dev/docs/install/
          - service: "cert-manager"
            role: keys
            why: "Needed only if you encrypt the hop inside the cluster: Knative relies on cert-manager for cluster-local domain TLS, a feature it marks experimental."
            url: https://knative.dev/docs/serving/encryption/encryption-overview/
        quickstart:
          - title: "Installing Knative"
            url: https://knative.dev/docs/install/
          - title: "Configuring private Services"
            url: https://knative.dev/docs/serving/services/private-services/
          - title: "Configuring scale bounds"
            url: https://knative.dev/docs/serving/autoscaling/scale-bounds/
