      - mitigation: cap-agent-egress-control
        coverage: native
        mechanism: >-
          Managed sandbox.userPolicy.network.allowedHosts / blockedHosts (enforced by a built-in local proxy on
          every platform), allowOutbound and allowLocalNetwork; Domain() deny / ask / allow permissions;
          documented Copilot service-domain allowlist
        steps:
          - title: Enforce a host allowlist in the managed sandbox
            body:
              - >-
                With sandbox.enabled, failIfUnavailable and allowBypass=false set, list
                sandbox.userPolicy.network.allowedHosts (a non-empty list blocks everything else) and blockedHosts
                (always wins), or set allowOutbound=false and allowLocalNetwork=false.
            url: >-
              https://docs.github.com/en/copilot/reference/enterprise-administrators/enterprise-managed-settings
          - title: Deny domains in managed permissions
            body:
              - >-
                Add Domain(...) selectors under permissions.deny (and ask for the rest); host matching is
                case-insensitive and *.example.com covers subdomains.
            url: >-
              https://docs.github.com/en/copilot/reference/enterprise-administrators/enterprise-managed-settings
          - title: Allowlist the service domains at the perimeter
            body:
              - >-
                Permit *.githubcopilot.com with the plan-specific subdomain, github.com/login and the
                copilot_internal endpoints; pull the current set from gh api meta.
            url: https://docs.github.com/en/copilot/reference/copilot-allowlist-reference
        note: >-
          Native by the rule applied to every vendor: the managed sandbox enforces a host allowlist on agent-run
          commands and local MCP/LSP servers through a local proxy "strictly on every platform", web_fetch is
          checked against the same network policy, and a managed value is a floor the user cannot relax.
          Bypasses: remote MCP servers and the CLI's own Copilot API traffic leave from the unsandboxed CLI
          process, detached commands cannot be sandboxed, and on Linux local-network access cannot be controlled
          separately for spawned processes. The upstream proxy setting is cooperative on macOS and absent on
          Windows — routing, not a boundary. Public preview.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityEgressControl
          reviewRequired: false
          original:
            - capability: capabilityEgressControl
              coverage: native
              mechanism: >-
                Domain() deny / ask / allow managed permissions; sandbox.userPolicy.network.allowOutbound /
                allowLocalNetwork and HTTP proxy; documented service-domain allowlist
              steps:
                - title: Deny domains in managed permissions
                  body:
                    - Add Domain(...) selectors under permissions.deny (and ask for the rest); matching is host-based,
                      case-insensitive, with *.example.com covering subdomains.
                  url: >-
                    https://docs.github.com/en/copilot/reference/enterprise-administrators/enterprise-managed-settings
                - title: Cut sandboxed network access
                  body:
                    - Set sandbox.userPolicy.network.allowOutbound=false and allowLocalNetwork=false, or route through the
                      sandbox HTTP proxy.
                  url: >-
                    https://docs.github.com/en/copilot/how-tos/cloud-and-local-sandboxes/configuring-local-sandbox-settings
                - title: Allowlist the service domains at the perimeter
                  body:
                    - Permit *.githubcopilot.com with the plan-specific subdomain, the github.com login and api.github.com
                      copilot_internal endpoints, and the Azure speech domains only if voice is used.
                  url: https://docs.github.com/en/copilot/reference/copilot-allowlist-reference
              note: >-
                Domain() permissions bound the CLI's own fetch and tool calls and the sandbox network policy
                bounds commands; remote MCP servers make their own connections outside both. A proxy setting
                is routing until direct egress is blocked at the host.
              verified: 2026-09-10
