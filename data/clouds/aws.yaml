    setVia: [adminConsole, cloudPolicy]
    area: audit
    default: "Off until the standard or control is enabled"
    recommended: "Enable in every account that may hold agents: runtime not in PUBLIC network mode, gateway authoriser present, Memory and Gateway under a customer managed key, custom Browser and Code Interpreter in VPC mode, browser recording on."
