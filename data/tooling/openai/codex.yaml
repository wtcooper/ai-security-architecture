# Codex — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
#
# Verified 2026-09-10 against learn.chatgpt.com/docs (developers.openai.com/codex/* now redirects
# there) and the GitHub advisory database. help.openai.com returns 403 to automated fetch, so
# the Help Center links kept in the migrated items: blocks are unverified today.
# Excluded: OpenAI Managed Agents — DevDay is 2026-09-29 and nothing has shipped; Agent Builder —
# scheduled shutdown 2026-11-30 (developers.openai.com/api/docs/guides/agent-builder); ChatGPT
# Workspace Agents — no official page resolved today (openai.com 403, learn.chatgpt.com 404), only
# a "Workspace Agents" access-token scope confirms it exists, so no control row could be verified.
vendor: openai
family: Codex
tools:
  - id: toolCodex
    name: Codex
    surfaceClasses:
      - endpointCli
      - ideExtension
      - desktopApp
      - ciIntegration
    variants:
      - name: Codex CLI
        class: endpointCli
        url: https://learn.chatgpt.com/docs/quickstart
      - name: Codex IDE extension (openai.chatgpt)
        class: ideExtension
        url: https://learn.chatgpt.com/docs/ide
      - name: Codex app (ChatGPT desktop, macOS / Windows / Linux)
        class: desktopApp
        url: https://learn.chatgpt.com/docs/use-chatgpt
      - name: Codex Remote (phone controls the local app)
        class: desktopApp
        url: https://learn.chatgpt.com/docs/remote
      - name: Codex GitHub Action (openai/codex-action)
        class: ciIntegration
        url: https://learn.chatgpt.com/docs/github-action
      - name: Codex Security (AppSec plugin and CLI)
        class: endpointCli
        url: https://learn.chatgpt.com/docs/security
    architecture: archCodingAgentThirdParty
    status: ga
    asOf: "2026-09"
    summary:
      - "One agent across the CLI, the IDE extension and the ChatGPT desktop app, configured through
        TOML with a documented precedence chain and a genuine enterprise enforcement layer: an
        admin-authored requirements.toml that constrains approval policies, sandbox profiles,
        network, MCP servers and feature flags, and that users cannot override."
      - >-
        Inference runs at OpenAI; the local runtime executes commands inside an OS sandbox
        (Seatbelt on macOS, bubblewrap plus seccomp on Linux, a native Windows sandbox) and sends
        prompts, file excerpts, command output and — when browser or computer use is on —
        screenshots and page content to OpenAI services. Work Local is explicit that "local
        execution does not mean offline or device-only model inference". Telemetry is opt-in.
      - >-
        Policy arrives by four channels with a fixed precedence (macOS MDM com.openai.codex,
        the cloud-managed requirements bundle assigned at chatgpt.com, /etc/codex/requirements.toml
        or %ProgramData%\OpenAI\Codex\requirements.toml, then managed_config.toml defaults). A
        cloud bundle that cannot be fetched and has no cache stops the client rather than
        starting unmanaged. Codex Remote, the GitHub Action and Codex Security are shells of
        the same runtime; Codex cloud and the SDK are separate entities below.
    facts:
      - label: Plans
        value: >-
          Codex is in Free, Go, Plus, Pro, Business, Enterprise and Edu; API-key sign-in pays
          per token and loses cloud features (GitHub reviews, Slack). Business, Enterprise and
          Edu add admin controls, Compliance API audit and spend limits.
        url: https://learn.chatgpt.com/docs/pricing
      - label: Inference & routing
        value: >-
          Model calls go to OpenAI; chatgpt_base_url and model_providers.<id>.base_url can
          redirect to a proxy, and "Codex respects workspace residency settings when you sign
          in with ChatGPT".
        url: https://learn.chatgpt.com/docs/config-file/config-advanced
      - label: Data leaving the device
        value: >-
          Prompts, relevant file excerpts, screenshots, browser content and tool results may be
          sent to OpenAI to complete a task; not every local file operation, screenshot or
          browser action appears in the Compliance API.
        url: https://learn.chatgpt.com/docs/enterprise/chatgpt-work-local-security
      - label: Docs index
        value: learn.chatgpt.com/docs (Codex, configuration, enterprise, security sections)
        url: https://learn.chatgpt.com/docs
      - label: Data retention / training
        value: >-
          Workspace audit records are retained up to 30 days for the Compliance API; the BAA does
          not cover Codex cloud. API-key usage falls under the API data policy (no training by
          default, 30-day abuse-monitoring logs, ZDR by approval).
        url: https://learn.chatgpt.com/docs/hipaa-configuration
    items:
      - title: Admin-enforced requirements.toml
        body:
          - Requirements arrive by system file (/etc/codex/requirements.toml on Unix,
            %ProgramData%\OpenAI\Codex\requirements.toml on Windows), as a cloud-managed policy
            bundle assigned from chatgpt.com and delivered at sign-in, or via macOS MDM under
            com.openai.codex (base64-encoded TOML; the highest-precedence channel). If the cloud
            policy fetch fails with no valid cache, the client refuses to start unmanaged rather
            than failing open.
          - 'Enforceable keys cover the surfaces that matter: allowed_approval_policies and
            allowed_permission_profiles with default_permissions (e.g. pin ":workspace" and allow
            only read-only and workspace profiles), filesystem deny_read patterns for secrets paths,
            prefix command rules, managed hooks with allow_managed_hooks_only, experimental network
            domain allow/deny lists, and feature pins that disable computer use and browser surfaces
            org-wide.'
        links:
          - title: Codex managed configuration
            url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
          - title: Codex admin setup and rollout
            url: https://learn.chatgpt.com/docs/enterprise/admin-setup
      - title: Sandbox, approvals and network posture
        body:
          - Sandboxing is OS-enforced (Seatbelt on macOS, bwrap plus seccomp on Linux, a native
            Windows sandbox) with permission profiles from read-only through workspace-write to an
            explicit danger-full-access escape hatch. The agent runs with network access off by
            default; enabling it can route through a domain-filtering proxy, and .git, .codex and
            .agents stay read-only inside writable roots. Codex cloud blocks internet access during
            the agent phase by default, with per-environment allowlists and method restrictions.
        links:
          - title: Codex approvals and security
            url: https://learn.chatgpt.com/docs/agent-approvals-security
          - title: Codex cloud internet access
            url: https://learn.chatgpt.com/docs/cloud/internet-access
      - title: Workspace gating and compliance export
        body:
          - Workspace admins gate Codex Local (desktop app, CLI and IDE extension together) and
            Codex cloud separately, assign access by role with SCIM-synced groups, and set starting
            model defaults — enforced requirements still win. Codex usage, including the local
            clients, exports through the Compliance API and the immutable Compliance Logs Platform
            alongside workspace audit and authentication logs.
        links:
          - title: Using Codex with your ChatGPT plan
            url: https://help.openai.com/en/articles/11369540-using-codex-with-your-chatgpt-plan
          - title: Compliance API
            url: https://learn.chatgpt.com/docs/enterprise/compliance-api
    riskNotes:
      - risk: riskPromptInjection
        note: >-
          The vendor's own guidance says prompt injection can make the agent fetch and follow
          untrusted instructions when network access or web search is on; the 2026 web.run
          research chained exactly that into out-of-sandbox execution on Windows.
      - risk: riskRogueActions
        note: >-
          --dangerously-bypass-approvals-and-sandbox (--yolo) removes both boundaries; the
          admin answer is allowed_approval_policies and allowed_sandbox_modes in requirements.toml,
          which users cannot loosen.
      - risk: riskToolSourceProvenance
        note: >-
          Plugins bundle MCP servers, skills and hooks from Git marketplaces; without
          marketplaces.restrict_to_allowed_sources and an [mcp_servers] identity allowlist any
          developer can add a tool source.
      - risk: riskInsecureIntegratedComponent
        note: >-
          Three 2026 sandbox findings (git show allowlist, Docker socket, ProgramData config
          trust) were escapes through components the sandbox trusted, not model failures.
      - risk: riskSensitiveDataDisclosure
        note: >-
          File excerpts, screenshots and browser content leave the device on every task; deny_read
          globs and shell_environment_policy are the only in-product data minimisation.
    controls:
      - capability: capabilityIga
        coverage: native
        mechanism: >-
          requirements.toml forced_login_method / forced_chatgpt_workspace_id (config) and
          allowed_login_methods / allowed_chatgpt_workspaces (managed), plus workspace roles and
          SCIM groups
        steps:
          - title: Pin the sign-in method and workspace
            body:
              - Set forced_login_method = "chatgpt" and forced_chatgpt_workspace_id = "<uuid>" so
                the client cannot run on a personal account or an API key.
            url: https://learn.chatgpt.com/docs/auth
          - title: Enforce it from the managed bundle
            body:
              - In requirements.toml use allowed_login_methods = ["chatgpt"] and
                allowed_chatgpt_workspaces as the UUID allowlist; deliver by MDM, cloud policy or
                the system path.
            url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
          - title: Gate Codex Local by role
            body:
              - In Workspace settings > Permissions & roles, set the Codex Local / Work Local
                permission per role; an explicit Off in any role denies even when another grants.
            url: https://learn.chatgpt.com/docs/enterprise/roles-and-workspace-permissions
        verified: "2026-09-10"
      - capability: capabilityAgentRuntimeEnforcement
        coverage: native
        mechanism: requirements.toml [rules] (forbidden / prompt) and managed [hooks] with allow_managed_hooks_only
        steps:
          - title: Write managed command rules
            body:
              - Add [rules] entries in requirements.toml with decision "forbidden" or "prompt" for
                command prefixes; users cannot weaken them.
            url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
          - title: Add a PreToolUse or PermissionRequest hook
            body:
              - A managed hook returning permissionDecision "deny" (or exit code 2) blocks the
                call; set allow_managed_hooks_only = true so user, project and plugin hooks are
                ignored.
            url: https://learn.chatgpt.com/docs/hooks
        verified: "2026-09-10"
      - capability: capabilityAiTprm
        coverage: external
        mechanism: Vendor evidence from trust.openai.com consumed by the organisation's TPRM platform
        note: >-
          OpenAI publishes SOC 2 Type 2 (scope includes API Platform, ChatGPT Enterprise, Edu and
          Team), ISO 27001/27017/27018/27701/42001, pen-test reports and the subprocessor list on
          the trust portal; Codex is not named separately, so the assessment inherits the ChatGPT
          Enterprise scope.
        steps:
          - title: Pull vendor evidence
            body:
              - Request the SOC 2 report, pen-test summary and subprocessor list from the trust
                portal and load them into the TPRM record.
            url: https://trust.openai.com/
        verified: "2026-09-10"
      - capability: capabilityAiDlp
        coverage: partial
        mechanism: permissions.filesystem.deny_read globs and shell_environment_policy in requirements.toml
        note: >-
          These stop the agent reading named paths and environment variables; nothing in the
          product inspects prompt or upload content. Endpoint DLP is external.
        steps:
          - title: Deny reads of secret paths
            body:
              - Set [permissions.filesystem] deny_read globs (SSH keys, cloud credentials, .env);
                full-access profiles are rejected while deny-read rules exist.
            url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
          - title: Strip secrets from the shell environment
            body:
              - Set shell_environment_policy.inherit = "core" and exclude patterns so tokens in the
                developer's environment never reach subprocesses.
            url: https://learn.chatgpt.com/docs/config-file/config-reference
        verified: "2026-09-10"
      - capability: capabilityToolPermissionScoping
        coverage: native
        mechanism: >-
          allowed_permission_profiles, default_permissions, allowed_sandbox_modes, [mcp_servers]
          enabled_tools / disabled_tools and [features] pins in requirements.toml
        steps:
          - title: Fix the permission profile set
            body:
              - Set allowed_permission_profiles (the complete allowlist; omitted profiles are
                denied) and default_permissions = ":workspace"; add allowed_sandbox_modes.
            url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
          - title: Scope MCP tools per server
            body:
              - In each [mcp_servers.<name>] set enabled_tools or disabled_tools and a
                default_tools_approval_mode.
            url: https://learn.chatgpt.com/docs/extend/mcp
          - title: Pin high-agency features off
            body:
              - Set [features] computer_use = false, browser_use = false and
                browser_use_full_cdp_access = false where the fleet does not need them.
            url: https://learn.chatgpt.com/docs/browser
        verified: "2026-09-10"
      - capability: capabilityAgentSandboxing
        coverage: native
        mechanism: OS sandbox (Seatbelt / bubblewrap+seccomp / Windows sandbox) selected by sandbox_mode and pinned by allowed_sandbox_modes
        note: >-
          Three 2026 escapes (git show allowlist, Docker socket, ProgramData config trust) sit in
          advisories; the Docker-socket one is by design unless a socket is explicitly allowed.
        steps:
          - title: Understand the boundary
            body:
              - workspace-write keeps writes inside the workspace and network off; .git, .agents and
                .codex under writable roots stay read-only.
            url: https://learn.chatgpt.com/docs/sandboxing
          - title: Remove the escape hatch
            body:
              - Pin allowed_sandbox_modes to ["read-only", "workspace-write"] so
                danger-full-access and --yolo are unavailable.
            url: https://learn.chatgpt.com/docs/agent-approvals-security
        verified: "2026-09-10"
      - capability: capabilityCredentialIsolation
        coverage: partial
        mechanism: cli_auth_credentials_store, scoped access tokens and service accounts
        note: >-
          Locally the agent acts as the signed-in developer with that developer's file and git
          rights; there is no on-behalf-of exchange. Automation can run as a service account so
          runs attribute to a non-human identity.
        steps:
          - title: Keep credentials out of auth.json
            body:
              - Set cli_auth_credentials_store = "keyring" (or "ephemeral" for CI) in
                requirements.toml.
            url: https://learn.chatgpt.com/docs/auth
          - title: Run automation as a service account
            body:
              - Create a service account, assign it plugins and a role, and issue CODEX_ACCESS_TOKEN
                from its Access tokens section (CLI 0.142.0+).
            url: https://learn.chatgpt.com/docs/enterprise/service-accounts
        verified: "2026-09-10"
      - capability: capabilityMemoryProtection
        coverage: partial
        mechanism: history.persistence and the Computer History role permission
        note: >-
          Codex keeps session transcripts under CODEX_HOME and, on the desktop app, a searchable
          Computer History; there is no admin validation or quarantine of that store.
        steps:
          - title: Disable local transcript persistence
            body:
              - Set [history] persistence = "none" (and max_bytes) in the managed config.
            url: https://learn.chatgpt.com/docs/config-file/config-advanced
          - title: Gate Computer History by role
            body:
              - Workspace settings > Permissions & roles carries the Computer History permission.
            url: https://learn.chatgpt.com/docs/enterprise/roles-and-workspace-permissions
        verified: "2026-09-10"
      - capability: capabilityPromptInjectionDefense
        coverage: partial
        mechanism: Guardian automatic review (allowed_approvals_reviewers, guardian_policy_config) and the browser sign-in review model
        note: >-
          The vendor ships a reviewing model for out-of-sandbox requests and for browser sign-in
          pages, and warns that refusal is probabilistic; no admin-tunable classifier on inputs.
        steps:
          - title: Decide whether automatic review may replace the human
            body:
              - allowed_approvals_reviewers controls whether ["auto_review"] is permitted;
                guardian_policy_config overrides the review policy text.
            url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
          - title: Keep web access off where it is not needed
            body:
              - Network access defaults off in workspace-write; the docs say prompt injection can
                make the agent fetch and follow untrusted instructions once it is on.
            url: https://learn.chatgpt.com/docs/agent-approvals-security
        verified: "2026-09-10"
      - capability: capabilitySecretsManagement
        coverage: partial
        mechanism: OS keyring credential store, workspace access-token expiration limit, workload identity federation
        steps:
          - title: Cap token lifetime
            body:
              - Owners set "Access token expiration limit" in Permissions & roles; tokens are
                created at chatgpt.com/admin/access-tokens with a required expiry.
            url: https://learn.chatgpt.com/docs/enterprise/access-tokens
          - title: Replace stored tokens with federation
            body:
              - Exchange an OIDC or SPIFFE token via OPENAI_FEDERATION_RULE_ID /
                OPENAI_IDENTITY_TOKEN_FILE; the resulting token never lasts longer than one hour.
            url: https://learn.chatgpt.com/docs/enterprise/workload-identity
        verified: "2026-09-10"
      - capability: capabilityMcpToolSecurity
        coverage: native
        mechanism: requirements.toml [mcp_servers] identity allowlist and [marketplaces] restrict_to_allowed_sources
        steps:
          - title: Allowlist MCP servers by identity
            body:
              - A server is enabled only when both its name and identity match an approved
                [mcp_servers] entry; an empty table disables all MCP servers.
            url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
          - title: Restrict plugin sources
            body:
              - Set [marketplaces] with restrict_to_allowed_sources = true and pin
                features.plugins; unmatched marketplace operations are rejected.
            url: https://learn.chatgpt.com/docs/plugins
        verified: "2026-09-10"
      - capability: capabilityHitlControls
        coverage: native
        mechanism: allowed_approval_policies in requirements.toml and the permission modes
        steps:
          - title: Require approval outside the sandbox
            body:
              - Set allowed_approval_policies = ["on-request"] (or add "untrusted"); "never" is
                then unavailable.
            url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
          - title: Keep Full access out of the mode picker
            body:
              - Ask for approval, Approve for me (auto-review) and Full access are the user modes;
                admins decide which profiles the workspace allows.
            url: https://learn.chatgpt.com/docs/permission-modes
        verified: "2026-09-10"
      - capability: capabilityAgentRegistry
        coverage: partial
        mechanism: Admin > Plugins marketplace import and the [mcp_servers] approved identities
        note: >-
          Approved plugins and MCP servers are recorded centrally; nothing inventories the local
          agents or MCP servers a developer runs outside that list.
        steps:
          - title: Manage the plugin catalogue
            body:
              - Admin > Plugins imports a GitHub marketplace, syncs daily and sets Available or
                Installed per role.
            url: https://learn.chatgpt.com/docs/enterprise/plugin-management
        verified: "2026-09-10"
      - capability: capabilityAuditLogging
        coverage: partial
        mechanism: "[otel] OTLP export from the client and the workspace Compliance API"
        note: >-
          The Compliance API keeps records 30 days; Work Local warns that not every local file
          operation, screenshot or browser action appears there. OTel is opt-in per client.
        steps:
          - title: Export client events
            body:
              - Set [otel] exporter = "otlp-http" or "otlp-grpc" with your endpoint;
                log_user_prompt defaults to false (redacted).
            url: https://learn.chatgpt.com/docs/config-file/config-advanced
          - title: Pull workspace records
            body:
              - Use the Compliance API with COMPLIANCE_API_KEY; the Admin API reference is the
                source of truth for event coverage and retention.
            url: https://learn.chatgpt.com/docs/enterprise/compliance-api
        verified: "2026-09-10"
      - capability: capabilityShadowAiDiscovery
        coverage: external
        mechanism: None in product; forced workspace login turns personal-account use into a detectable violation
        note: >-
          Discover unmanaged installs (npm @openai/codex, the openai.chatgpt extension, the MSIX)
          with EDR or software inventory; allowed_chatgpt_workspaces then blocks personal accounts.
        verified: "2026-09-10"
      - capability: capabilityKillSwitch
        coverage: native
        mechanism: Role permission off, token revocation, service-account disable, federation rule disable
        steps:
          - title: Turn the surface off
            body:
              - Set "Allow members to use Codex locally" (or the combined Codex and Work Locally
                toggle) to Off for the affected roles.
            url: https://learn.chatgpt.com/docs/enterprise/admin-setup
          - title: Revoke automation credentials
            body:
              - Owners and admins revoke any workspace access token; disabling a service account
                revokes all of its tokens.
            url: https://learn.chatgpt.com/docs/enterprise/access-tokens
        verified: "2026-09-10"
      - capability: capabilityEdr
        coverage: external
        mechanism: EDR rules around the runtime; no vendor hook for endpoint security products
        note: >-
          Watch for batch or executable files created in project roots (web.run node.bat chain),
          Docker-socket use from the agent, and non-admin writes under
          %ProgramData%\OpenAI\Codex; pre-create and ACL that directory (CVE-2026-35603).
        verified: "2026-09-10"
      - capability: capabilitySystemPromptManagement
        coverage: partial
        mechanism: AGENTS.md hierarchy with project_doc_max_bytes and project trust
        note: >-
          Instructions load from ~/.codex/AGENTS.md then repo-root-to-cwd AGENTS.md files; project
          config loads only for trusted projects. There is no admin-owned instruction file.
        steps:
          - title: Own the instruction files
            body:
              - Keep AGENTS.md under code review; AGENTS.override.md wins at each level and
                project_doc_max_bytes (32 KiB default) truncates the merged set.
            url: https://learn.chatgpt.com/docs/agent-configuration/agents-md
        verified: "2026-09-10"
      - capability: capabilityAiBom
        coverage: none
        mechanism: Not offered
        note: >-
          No signed manifest of runtime, plugins or MCP servers; the closest is codex-version
          pinning in the GitHub Action and marketplace sync from a Git source.
        verified: "2026-09-10"
      - capability: capabilityEgressControl
        coverage: partial
        mechanism: "[experimental_network] managed_allowed_domains_only and sandbox_workspace_write.network_access"
        note: >-
          Domain rules apply to command proxying inside the sandbox, not to browser tools, web
          search or MCP servers; those need a network-layer control.
        steps:
          - title: Allowlist domains for sandboxed commands
            body:
              - In requirements.toml set [experimental_network] allowed and denied domains with
                managed_allowed_domains_only = true.
            url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
          - title: Keep network off by default
            body:
              - sandbox_workspace_write.network_access = false is the default; features.network_proxy
                adds allow/deny domain maps when it is on.
            url: https://learn.chatgpt.com/docs/config-file/config-reference
        verified: "2026-09-10"
      - capability: capabilityModelScanning
        coverage: none
        mechanism: Not applicable
        note: >-
          No model artifacts are loaded locally; model_provider can point at a local server
          (ollama, lmstudio), which brings the organisation's own scanning obligation.
        verified: "2026-09-10"
    advisories:
      - title: "CVE-2025-59532 (GHSA-w5fx-fh39-j5rw): sandbox bypass via model-supplied cwd, Codex CLI 0.2.0–0.38.0, fixed 0.39.0"
        url: https://github.com/advisories/GHSA-w5fx-fh39-j5rw
        date: "2025-09"
      - title: "GitPwned: git show --output on the safe-command allowlist writes .git/config for RCE; fixed v0.95.0 (2026-02-04), disclosed 2026-07-20"
        url: https://www.pillar.security/blog/gitpwned-allowlist-to-rce
        date: "2026-07"
      - title: "Codex CLI v0.95.0 release: hardened Git command safety so write-capable invocations no longer bypass approval"
        url: https://github.com/openai/codex/releases/tag/rust-v0.95.0
        date: "2026-02"
      - title: "Docker-socket sandbox escape (Codex, Cursor, Gemini CLI); OpenAI rated informational — sockets denied unless explicitly allowed"
        url: https://www.pillar.security/blog/one-docker-socket-to-rule-them-all-escaping-codex-cursor-and-gemini-clis-sandboxes
        date: "2026-07"
      - title: "web.run prompt injection to out-of-sandbox RCE on Windows via node.bat search-order hijack (Cymulate); closed Not Reproducible, unpatched at publication"
        url: https://cymulate.com/blog/codex-cli-rce-prompt-injection-mitigations/
        date: "2026-05"
      - title: "Windows named-pipe ACL allowed cross-user prompt injection and credential theft; fixed 2026-04-24"
        url: https://cymulate.com/blog/openai-codex-cli-named-pipe-vulnerability/
        date: "2026-07"
      - title: "CVE-2026-35603: writable ProgramData config trust (Claude Code, Codex, Cursor, Gemini CLI); OpenAI had no committed fix at publication"
        url: https://cymulate.com/blog/cve-2026-35603-ai-coding-tools-privilege-escalation/
        date: "2026-08"
