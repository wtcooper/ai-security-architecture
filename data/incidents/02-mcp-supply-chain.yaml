id: mcp-supply-chain
title: "MCP supply chain: malicious tool servers, SDK flaws, and a backdoored AI gateway"
subtitle: >
  Two years of Model Context Protocol (MCP) failures — a single malicious MCP server taking over
  its client, an architectural flaw in every official MCP SDK, and a backdoored release of an
  enterprise AI gateway. The tool layer agents depend on is the layer attackers own.
dateRange: July 2025 – April 2026
perspective: target
archetype: archCodingAgentThirdParty
summary:
  - >
    Agents reach their tools over the Model Context Protocol (MCP), picking servers from
    registries and manifests they did not write and cannot verify. That trust is the
    vulnerability, and it has failed in every direction: the MCP transport, the server, the
    config, and the SDK itself.
  - >
    The pattern repeats with different names on it. `mcp-remote` passed a hostile server's
    response into the shell (CVE-2025-6514, 437,000+ downloads). Cursor's MCPoison swapped the
    payload in after the config was approved (CVE-2025-54136). Flowise executed arbitrary
    JavaScript from an unauthenticated request (CVE-2025-59528, CVSS 10.0) and Azure's MCP
    Server shipped with no authentication at all. `postmark-mcp` spent 15 releases building
    trust before it started BCC'ing every email to its author.
  - >
    Then in April 2026 the flaw moved down a layer, into the official Python, TypeScript, Java
    and Rust SDKs — roughly 150 million downloads and up to 200,000 vulnerable instances from
    one architectural mistake. By then ~40 CVEs had been filed against MCP servers, clients
    and infrastructure.
  - >
    And a month earlier it had moved sideways, into the gateway. Attackers reached the
    publishing token for LiteLLM — the proxy a great many organisations route their model
    traffic through — and shipped two backdoored releases. The AI plumbing is now a
    CISA-catalogued, actively exploited attack surface in its own right.
patterns:
  - Tool Poisoning
  - Rug Pull
  - Overprivileged Integration
  - Unsandboxed Code Execution
  - Supply Chain Credential Cascade
cves:
  - CVE-2025-6514
  - CVE-2025-54136
  - CVE-2025-59528
  - CVE-2026-32211
  - CVE-2026-33634
risks:
  - riskMCPTransportHijacking
  - riskZombieShadowMCPServers
  - riskToolRegistryTampering
  - riskToolSourceProvenance
  - riskShadowAndUnknownAgents
  - riskOrchestratorRouteHijacking
  - riskInsecureIntegratedComponent
  - riskCrossTenantCredentialPropagation
controls:
  - controlComponentIdentityProvenance
  - controlInterComponentTransportSecurity
  - controlAgentInventoryManagement
  - controlOrchestratorAndRouteIntegrity
  - controlAgentPluginPermissions
  - controlAgentCredentialIsolation
  - controlVulnerabilityManagement
steps:
  - n: 1
    title: An untrusted server answers the handshake
    phase: introduced
    narrative: >
      mcp-remote passed a malicious server's `authorization_endpoint` straight into the
      system shell — remote code execution on the developer's own machine, from simply
      connecting. CVSS 9.6, across 437,000+ downloads.
    components:
      - actorExternalSources
      - componentTools
      - componentOrchestrationInputHandling
    path: [toolPlane->aiGateway, aiGateway->extTools]
    risks:
      - riskMCPTransportHijacking
      - riskToolSourceProvenance
    cves:
      - CVE-2025-6514
    sources:
      - title: "CVE-2025-6514: RCE in mcp-remote when connecting to untrusted MCP servers"
        url: https://authzed.com/blog/timeline-mcp-breaches
        publisher: AuthZed
        date: 2025-07-09
  - n: 2
    title: Approved once, swapped afterwards
    phase: introduced
    narrative: >
      Cursor "MCPoison" applied the rug-pull pattern to config: commit a benign MCP config,
      get it approved once, then swap in the payload. Approval was never re-checked.
      Patched in Cursor 1.3.
    components:
      - componentTools
      - componentAgentSystemInstruction
    path: [toolPlane->memory, toolPlane]
    risks:
      - riskToolRegistryTampering
    cves:
      - CVE-2025-54136
    sources:
      - title: "MCPoison: persistent RCE via trusted-but-swapped MCP config"
        url: https://authzed.com/blog/timeline-mcp-breaches
        publisher: Check Point / AuthZed timeline
        date: 2025-08-05
  - n: 3
    title: Servers shipped with the door open
    phase: exposed
    narrative: >
      Flowise's CustomMCP node executed arbitrary JavaScript from an unauthenticated request
      (CVSS 10.0). Azure's MCP Server shipped with no authentication at all (CVSS 9.1). By
      April 2026, ~40 CVEs had been filed against MCP servers, clients and infrastructure.
    components:
      - actorExternalSources
      - componentTools
      - componentOrchestrationInputHandling
    path: [aiGateway->extTools, aiGateway->hostedTools]
    risks:
      - riskZombieShadowMCPServers
      - riskShadowAndUnknownAgents
    cves:
      - CVE-2025-59528
      - CVE-2026-32211
    sources:
      - title: "FlowiseAI Flowise RCE via CustomMCP node (CVE-2025-59528)"
        url: https://www.sonicwall.com/blog/flowiseai-custom-mcp-node-remote-code-execution-
        publisher: SonicWall
        date: 2025-09-24
      - title: "MCP security supply chain crisis, April 2026"
        url: https://cyberstrategyinstitute.com/mcp-security-supply-chain-crisis/
        publisher: Cyber Strategy Institute
        date: 2026-04-30
  - n: 4
    title: The flaw moves into the SDKs
    phase: exposed
    narrative: >
      An architectural STDIO flaw in the official Python, TypeScript, Java and Rust SDKs put
      every downstream implementation at risk of remote code execution — roughly 150 million
      downloads, 7,000 publicly reachable servers, up to 200,000 vulnerable instances.
    components:
      - actorExternalSources
      - componentTools
      - componentOrchestrationInputHandling
      - componentOrchestrationOutputHandling
    path: [toolPlane, hostedTools, extTools]
    risks:
      - riskMCPTransportHijacking
      - riskOrchestratorRouteHijacking
    sources:
      - title: "Anthropic MCP design vulnerability enables RCE, threatening AI supply chain"
        url: https://thehackernews.com/2026/04/anthropic-mcp-design-vulnerability.html
        publisher: The Hacker News
        date: 2026-04-16
      - title: "MCP security crisis: systemic design flaws in AI agent infrastructure"
        url: https://labs.cloudsecurityalliance.org/research/csa-research-note-mcp-security-crisis-20260504-csa-styled/
        publisher: Cloud Security Alliance
        date: 2026-05-04
  - n: 5
    title: The gateway itself ships backdoored
    phase: exposed
    narrative: >
      March 2026: attackers compromised a widely used scanner, harvested the LiteLLM project's
      publishing token from its build pipeline, and released two backdoored versions of the
      gateway that routes model traffic for a great many organisations. They were live for about
      forty minutes on a package downloaded millions of times a day, and CISA catalogued the flaw
      as actively exploited two days later. The clever part was the delivery: the wheel included
      a `.pth` file, which Python executes at interpreter start-up — so the payload ran on any
      Python process on the host, whether or not anything ever imported the gateway. It harvested
      cloud, SSH, Kubernetes and CI credentials, and the fallout reached named companies and a
      European Commission cloud account.
    components:
      - actorExternalSources
      - componentApplication
      - componentModelFrameworksAndCode
      - componentModelServing
      - componentOrchestrationOutputHandling
    path: [harness->aiGateway, aiGateway]
    risks:
      - riskInsecureIntegratedComponent
      - riskToolSourceProvenance
      - riskCrossTenantCredentialPropagation
    cves:
      - CVE-2026-33634
    sources:
      - title: "LiteLLM compromised: the TeamPCP PyPI supply chain campaign"
        url: https://securitylabs.datadoghq.com/articles/litellm-compromised-pypi-teampcp-supply-chain-campaign/
        publisher: Datadog Security Labs
        date: 2026-03-24
      - title: "CISA adds one known exploited vulnerability to catalog"
        url: https://www.cisa.gov/news-events/alerts/2026/03/26/cisa-adds-one-known-exploited-vulnerability-catalog
        publisher: CISA
        date: 2026-03-26
  - n: 6
    title: Where this chain breaks
    phase: mitigated
    narrative: >
      Signed tool manifests with verified publisher identity stop steps 1 and 2. Mutual TLS
      and origin validation close the transport. A central agent and server inventory,
      with liveness attestation, means a decommissioned or unknown endpoint stops being
      callable rather than lingering in a registry. And the gateway is infrastructure: pin its
      versions, verify what you install, and give its publishing credentials the same protection
      as a production signing key.
    components:
      - componentTools
      - componentAgentSystemInstruction
      - componentOrchestrationInputHandling
      - componentOrchestrationOutputHandling
    path: [toolPlane->aiGateway, aiGateway->extTools, aiGateway->hostedTools, govSupplyChain]
    sources:
      - title: "Securing MCP: a defense-first architecture guide"
        url: https://christian-schneider.net/blog/securing-mcp-defense-first-architecture/
        publisher: Christian Schneider
alsoSeen:
  - title: postmark-mcp npm backdoor
    date: September 2025
    note: >
      A near-perfect replica of the official Postmark MCP server built trust across 15
      releases, then began BCC'ing every outgoing email to the attacker.
    sources:
      - title: "A timeline of Model Context Protocol security breaches"
        url: https://authzed.com/blog/timeline-mcp-breaches
        publisher: AuthZed
  - title: "The agent-framework layer becomes a KEV-grade attack surface"
    date: March–April 2026
    note: >
      Langflow's CVE-2026-33017 (CVSS 9.3, unsandboxed flow execution from a single request) was
      added to CISA's Known Exploited Vulnerabilities catalogue on 25 March; automated scanning
      began about 20 hours after the advisory, with attackers reconstructing the exploit from the
      advisory text alone. Flowise's CVE-2025-59528, above, moved to actively exploited on 7 April.
    sources:
      - title: "CISA: new Langflow flaw actively exploited to hijack AI workflows"
        url: https://www.bleepingcomputer.com/news/security/cisa-new-langflow-flaw-actively-exploited-to-hijack-ai-workflows/
        publisher: BleepingComputer
        date: 2026-03-26
