# EXAMPLE tool status. `available` says whether people may install and use the product at all —
# either the organisation provides it or it blocks it, so it is a boolean, not a status. How well
# an available product is locked down is what `controls` says: per capability in the tool's
# reference control set (its architecture's pins), enabled | inProgress | gap. A tool not listed
# here is not available and renders greyed out when "Show status" is on; a capability with no key
# under an available tool reads as a gap. (This file is the shipped example; replace it in
# data/org/local/.)
tools:
  - tool: toolClaudeCode
    available: true
    note: Approved for engineering on managed laptops; managed settings pushed by MDM.
    controls:
      capabilityToolPermissionScoping: { status: enabled, note: permissions.deny and allowManagedPermissionRulesOnly in managed-settings.json, evidence: CHG-1042 }
      capabilityMcpToolSecurity: { status: enabled, note: allowedMcpServers allowlist, managed-mcp.json }
      capabilityEgressControl: { status: inProgress, note: Gateway enforced for inference; sandbox network policy not yet rolled out }
      capabilityAgentSandboxing: { status: gap, note: sandbox.enabled pending bubblewrap packaging }
      capabilityAuditLogging: { status: inProgress, note: OTel export to the SIEM from a pilot group }
      capabilityCredentialIsolation: { status: enabled, note: forceLoginOrgUUID; API keys blocked }
      capabilityIga: { status: enabled, note: SSO enforced through the claude.ai organisation }
      capabilityHitlControls: { status: enabled, note: disableBypassPermissionsMode set }
  - tool: toolCursor
    available: true
    note: Pilot with one team; Privacy Mode enforced, MCP allowlist under evaluation.
    controls:
      capabilityToolPermissionScoping: { status: inProgress }
      capabilityAgentSandboxing: { status: gap }
      capabilityIga: { status: enabled, note: SSO through the team dashboard }
  - tool: toolClaudeManagedAgents
    available: true
    note: Design partner programme; vault scoping under review.
    controls:
      capabilityIga: { status: enabled }
      capabilitySecretsManagement: { status: inProgress }
  - tool: toolClaudeDesktop
    available: true
    note: Enterprise plan; connector directory restricted to approved connectors.
    controls:
      capabilityIga: { status: enabled }
      capabilityAuditLogging: { status: enabled, note: Audit log export to the SIEM }
      capabilityAiDlp: { status: inProgress, note: Endpoint DLP covers the desktop app; SaaS-side inspection pending }
