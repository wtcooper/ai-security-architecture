          proxy and DLP controls to the device and workflow.
        verified: "2026-10-30"
      - mitigation: AML.M0028
        coverage: native
        mechanism: >-
          Agent security Desktop feature availability (In-app browser, Browser use, External browser use, Computer
          use: Force off; Full CDP access: Block user opt-in), Site rules, App rules, [mcp_servers] identity
          allowlist, features.apps / features.plugins and filesystem deny_read in requirements.toml
        steps:
