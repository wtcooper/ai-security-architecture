          policy, Repository access, Allow automations, partner-agent and agent-app policies) prevent new
          sessions; their effect on a session already running is not documented — delay not documented. Every
          session ends within the 59-minute hard limit. Revocation of the session's git token is not documented,
          and pushed commits stay on the branch.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityKillSwitch
          reviewRequired: false
          original:
            - capability: capabilityKillSwitch
              coverage: native
              mechanism: >-
                Enterprise policy Disabled, repository opt-out, Stop session, firewall on, separate third-party
                and agent-app policies
              steps:
                - title: Stop a running session
                  body:
                    - Click Stop session in the session log viewer to end the Actions run; pushed commits are preserved.
                  url: >-
                    https://docs.github.com/en/copilot/how-tos/copilot-on-github/use-copilot-agents/manage-and-track-agents
                - title: Disable every agent policy, not just one
                  body:
                    - Set Copilot Cloud Agent to Disabled, and separately disable Third-party agents and Agent apps under AI
                      controls > Agents — disabling the cloud agent does not disable the others.
                  url: >-
                    https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-enterprise/manage-agents/enable-copilot-cloud-agent
              verified: 2026-09-10
      - mitigation: D3-EI
        coverage: native
        mechanism: >-
          One ephemeral GitHub Actions environment per session, destroyed when the session ends; a fresh virtual
          machine per session on GitHub-hosted runners; organisation Runner type with "Allow repositories to
          customize the runner type" off pins that for every repository; 59-minute hard limit
        steps:
          - title: Pin the runner at organisation level
            body:
              - >-
                Organization Settings > Copilot > Cloud agent > Runner type: Standard GitHub runner, then turn
                off Allow repositories to customize the runner type so copilot-setup-steps.yml cannot move
                sessions elsewhere.
            url: >-
              https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-organization/configure-runner-for-coding-agent
          - title: Keep sessions on fresh machines
            body:
              - >-
                GitHub recommends GitHub-hosted runners so each session runs on a fresh virtual machine; if you
                must use self-hosted runners, use ephemeral single-use ones — their isolation is then yours.
            url: https://docs.github.com/en/copilot/tutorials/cloud-agent/build-guardrails
          - title: Know what runs inside the sandbox
            body:
              - >-
                Hooks run in the ephemeral, non-interactive Linux sandbox the cloud agent provisions for each
                job, with a constrained network, and anything they write is discarded when the job ends.
            url: https://docs.github.com/en/copilot/reference/hooks-reference
        note: >-
          Native on the hosted D3-EI rule, re-verified: GitHub documents an ephemeral environment per session,
          destroyed when the session ends, with each session on a fresh virtual machine on GitHub-hosted
          runners, and an organisation owner can lock the runner type. Inside the boundary: setup steps, the
          agent's commands, hooks and local MCP server processes. Outside: the model, GitHub's services and
          remote MCP servers. The guarantee does not hold on self-hosted runners (GitHub recommends ephemeral
          single-use runners; reuse is possible) and GitHub's single-CPU hosted runners are containers on a
          shared VM. What crosses sessions: pushed commits, the session log, Copilot Memory and any custom image
          version saved with the setup job's snapshot key.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAgentSandboxing
          reviewRequired: false
          original:
            - capability: capabilityAgentSandboxing
              coverage: native
              mechanism: >-
                Ephemeral development environment per job powered by GitHub Actions — a non-interactive Linux
                sandbox with a constrained network, destroyed when the job ends; 59-minute hard limit;
                optionally on the organisation's own runners
              steps:
                - title: Keep the agent on the ephemeral Actions environment
                  body:
                    - Each task runs in its own ephemeral environment on GitHub Actions and ends within 59
                      minutes, a limit that cannot be extended; if you route it to self-hosted runners
                      (configure-runners), the isolation of that runner is yours.
                  url: https://docs.github.com/en/copilot/concepts/agents/cloud-agent/about-cloud-agent
                - title: Know what runs inside the sandbox
                  body:
                    - Setup steps, the agent's commands, hooks and MCP server processes all run inside the
                      job's sandbox; the firewall applies to the agent's Bash processes but not to MCP server
                      processes.
                  url: https://docs.github.com/en/copilot/reference/hooks-reference
              note: >-
                Inside the boundary: commands, setup steps, hooks and MCP servers. Outside: the model and
                GitHub's own services, reached through the agent's app identity. The boundary is a job, not a
                session: nothing persists after it ends except what was pushed.
              verified: 2026-09-15
      - mitigation: cap-agent-egress-control
        coverage: partial
        mechanism: >-
          Agent firewall under Copilot > Internet access: organisation "Enable firewall" and "Recommended
          allowlist" (Enabled, Disabled or Let repositories decide), "Allow repository custom rules" and an
          organisation custom allowlist repositories cannot delete; domain and URL rules; blocked requests
          reported in the pull request; enforced only on processes the agent starts through its Bash tool
        steps:
          - title: Lock the firewall at organisation level
            body:
              - >-
                Organization Settings > Copilot > Internet access, Copilot cloud agent section: set Enable
                firewall to Enabled (the default is Let repositories decide) so repositories cannot turn it off.
            url: >-
              https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-the-firewall
          - title: Own the allowlist
            body:
              - >-
                Set Allow repository custom rules to Disabled, maintain the Organization custom allowlist
                (domains or URL prefixes), and set Recommended allowlist deliberately — it admits public
                package and container registries.
            url: >-
              https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-the-firewall
        note: >-
          Partial on the hosted egress rule even though the organisation can now author and lock the list. It is
          enforced on processes the agent starts through its Bash tool, not around the sandbox: MCP server
          processes and copilot-setup-steps are outside it (there is no separate setup-phase policy — setup is
          unfirewalled), GitHub states sophisticated attacks may bypass it, and it operates only inside GitHub's
          Actions appliance — it must be disabled on self-hosted runners and is not compatible with Windows.
          GitHub's own hosts and the Copilot API are always allowed. On self-hosted or Azure-private-network
          runners the organisation's network controls are the egress control.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityEgressControl
          reviewRequired: false
          original:
            - capability: capabilityEgressControl
              coverage: partial
              mechanism: >-
                Firewall on by default with the recommended allowlist (OS packages, container and language
                registries, certificate authorities, Playwright hosts); custom allowlist per repository;
                organisation Settings > Copilot > Internet access can enforce or delegate
              steps:
                - title: Enforce the firewall at organisation level
                  body:
                    - Under Settings > Copilot > Internet access keep the firewall enabled and enforce it for every repository,
                      adding only the hosts your builds need; disabling it lets Copilot connect to any host.
                  url: >-
                    https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-the-firewall
              note: >-
                Rated partial on the egress rule: the firewall applies only to processes the agent starts
                through its Bash tool, not to MCP server processes — including the Playwright MCP server
                enabled by default — and the vendor states that sophisticated attacks may bypass it. Bound MCP
                servers through their configuration and tools arrays, and treat the firewall as blast-radius
                reduction.
              verified: 2026-09-15
      - mitigation: D3-CTS
        coverage: partial
        mechanism: >-
          No git proxy: GITHUB_COPILOT_GIT_TOKEN and GITHUB_COPILOT_API_TOKEN are set in the sandbox, the
          repository credential limited to the working repository and one branch; Agents secrets and variables
          reach setup steps and the agent's commands as environment variables, COPILOT_MCP_* values only MCP
          servers; secret values masked in session logs; Actions, Codespaces and Dependabot secrets never passed
        steps:
          - title: Scope Agents secrets to the repositories that need them
            body:
              - >-
                Organization Settings > Secrets and variables > Agents > New organization secret, Repository
                access: Selected repositories; repository-level secrets live under the repository's Secrets and
                variables > Agents.
            url: >-
              https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/configure-secrets-and-variables
          - title: Keep MCP credentials MCP-only
            body:
              - >-
                Prefix values meant for MCP servers COPILOT_MCP_ so only the MCP configuration receives them;
                every other Agents secret is an environment variable the agent's commands can read.
            url: >-
              https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/configure-secrets-and-variables
          - title: Keep everything else out of the Agents type
            body:
              - >-
                Store tokens the agent must not reach as Actions, Codespaces or Dependabot secrets, which it
                never receives; setup steps get the workflow GITHUB_TOKEN with only the permissions the file
                declares.
            url: https://docs.github.com/en/copilot/tutorials/cloud-agent/build-guardrails
          - title: Leave the GitHub MCP server on its repository-scoped token
            body:
              - >-
                Set COPILOT_MCP_GITHUB_PERSONAL_ACCESS_TOKEN only when needed, and then as a fine-grained,
                read-only token limited to specific repositories.
            url: https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/configure-mcp-servers
        note: >-
          Rated partial on the hosted D3-CTS rule. GitHub does not proxy the repository credential: the hooks
          reference lists GITHUB_COPILOT_GIT_TOKEN and GITHUB_COPILOT_API_TOKEN among the sandbox's environment
          variables, so both sit inside the boundary where any command can read them. What bounds them is scope
          — the working repository, one branch, no merge, and GitHub states the agent cannot run git push
          itself — and their lifetime is not documented. Agents secrets are not removed after setup: setup
          steps and every command the agent runs receive them, so the model sees any value a command prints;
          masking applies to session logs, not the model's context. Only COPILOT_MCP_* values are confined to
          MCP servers. The strong part is exclusion: no Actions, Codespaces or Dependabot secret reaches the
          agent. Agentic Workflows (a variant) shows the proxy pattern: the engine key stays in the AWF API
          proxy sidecar and the agent sees a dummy key.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityCredentialIsolation
            - capabilitySecretsManagement
          reviewRequired: false
          original:
            - capability: capabilityCredentialIsolation
              coverage: partial
              mechanism: >-
                Agents secrets and variables (repository or organisation) exposed as environment variables to
                setup steps and the agent's commands; COPILOT_MCP_ prefix limits a value to MCP servers; no
                access to Actions, Codespaces or Dependabot secrets; pushes go through the agent's own push
                path, not git commands
              steps:
                - title: Scope secrets to MCP servers with the prefix
                  body:
                    - Store values MCP servers need under COPILOT_MCP_* so they reach only those servers;
                      everything else under Agents secrets is an environment variable every command can read.
                  url: >-
                    https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/configure-secrets-and-variables
                - title: Keep the agent's own reach narrow
                  body:
                    - The agent cannot run git push itself and can only perform simple push operations;
                      rulesets keep the requester from approving its PR.
                  url: https://docs.github.com/en/copilot/concepts/agents/cloud-agent/risks-and-mitigations
              note: >-
                Rated partial because Agents secrets sit inside the execution boundary: any command in the job
                can read them and print them to the model. The isolation that exists is scope — no other
                secret types, MCP-only values, and an app identity rather than a person's token. No on-behalf-of
                exchange: actions carry the agent's app identity with the requesting human as co-author.
              verified: 2026-09-15
            - capability: capabilitySecretsManagement
              coverage: native
              mechanism: Agents-type secrets and variables (repository / organisation Settings > Secrets and variables >
                Agents); COPILOT_MCP_* prefix scopes values to MCP servers; no access to Actions, Codespaces
                or Dependabot secrets
              steps:
                - title: Use the Agents secret type only
                  body:
                    - Add secrets under Settings > Secrets and variables > Agents; prefix MCP credentials
                      COPILOT_MCP_ so they are only available to MCP server configuration and never exported
                      as general environment variables.
                  url: https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/configure-secrets-and-variables
                - title: Keep engine credentials out of Agentic Workflow agents
                  body:
                    - In Agentic Workflows the real engine key stays in the AWF API proxy sidecar; the agent
                      container sees only a dummy key — configure ANTHROPIC_API_KEY / OPENAI_API_KEY /
                      GEMINI_API_KEY as repository secrets, not in the workflow body.
                  url: https://github.github.com/gh-aw/reference/engines/
              note: Agents secrets are readable by the setup steps and MCP servers they are scoped to (COPILOT_MCP_*), and
                by commands the agent runs in the session; the model sees a value if a command prints it. They
                are stored secrets, not ephemeral issuance.
              verified: 2026-09-10
      - mitigation: D3-CH
        coverage: partial
        mechanism: >-
          Agents secrets and variables encrypted (LibSodium; list and get return metadata, never the value) and
          scoped by organisation owners to selected repositories; git and Copilot API tokens set by GitHub in
          each job's sandbox (lifetime undocumented); OIDC federation available in copilot-setup-steps; no
          vendor tunnel — private reach is self-hosted or Azure-private-network runners
        steps:
          - title: Keep session secrets in the Agents store, scoped
            body:
              - >-
                Organization Settings > Secrets and variables > Agents > New organization secret with Repository
                access set to Selected repositories; repository administrators add repository-level Agents
                secrets.
            url: >-
              https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/configure-secrets-and-variables
          - title: Rotate through the API
            body:
              - >-
                PUT /orgs/{org}/agents/secrets/{secret_name} with a value encrypted to the key from GET
                /orgs/{org}/agents/secrets/public-key; list and get endpoints never reveal the encrypted value.
            url: https://docs.github.com/en/rest/agents/secrets
          - title: Prefer federated credentials in setup steps
            body:
              - >-
                Grant id-token: write on the copilot-setup-steps job and sign in with OIDC (GitHub's Azure
                DevOps example uses azure/login) instead of storing a long-lived cloud key as an Agents secret.
            url: https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/configure-mcp-servers
        note: >-
          Rated partial on the hosted D3-CH rule. The store is sound — Agents secrets are encrypted, never
          returned by the API and scoped per repository — but inside the session they are plain environment
          variables readable by every command and so by the model (masking covers session logs only), and GitHub
          documents no expiry or rotation for them; rotation is the organisation's job. The session's own
          GITHUB_COPILOT_GIT_TOKEN and GITHUB_COPILOT_API_TOKEN are GitHub-issued, but their lifetime is not
          documented. Tunnel: GitHub offers no tunnel or connector for this product; reach into private networks
          is through self-hosted runners or larger runners with Azure private networking, so there is no tunnel
          token to harden, and credentials for internal MCP servers are Agents secrets (COPILOT_MCP_*). A token
          obtained by OIDC in setup steps is short-lived but also lands in the sandbox.
        verified: "2026-09-25"
