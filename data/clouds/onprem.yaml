      - trivyK8sCompliance
      - sandboxContainmentRedTeam

  - architecture: archAgentFederation
    asOf: "2026-11"
    verified: "2026-11-18"
    reference:
      - title: "Agent2Agent (A2A) Protocol Specification"
        url: https://a2a-protocol.org/latest/specification/
      - title: "Server Administration Guide"
        url: https://www.keycloak.org/docs/latest/server_admin/index.html
      - title: "Production Best Practices"
        url: https://docs.litellm.ai/docs/proxy/prod
    summary:
      - "Your A2A agent runs on Kubernetes in your own data centre. Keycloak signs users in and is the authorisation server: one client and key per agent per partnership, and a fresh, narrower token at every hand-off. LiteLLM Proxy is the agent gateway: it holds the reviewed record of each peer agent, decides which key may call which agent, screens and logs messages, and fronts your own vLLM models. Only the outbound proxy can reach a peer. Data, prompts and weights stay in the data centre unless a task sends them to a peer, and the organisation carries what a cloud provider would otherwise run."
    bindings:
      - { block: idp, service: "Keycloak (your users' realm)", note: "Where people sign in and where the groups approved for each partnership are kept. Federates your directory if you have one." }
      - { block: entry, service: "Envoy Gateway with OIDC sign-in", note: "A SecurityPolicy with oidc against Keycloak binds who is asking before a turn reaches the agent." }
      - { block: authServer, service: "Keycloak (clients per agent and per peer)", note: "Same product as the identity provider. One client per agent per partnership, Signed JWT keys, standard token exchange." }
      - { block: harness, service: "Your A2A agent on Kubernetes", build: true, note: "A2A client and server. It calls peers only through LiteLLM /a2a/{agent_id} and verifies each Agent Card itself." }
      - { block: localTools, service: "Your tool handlers in the agent", build: true, note: "Run in the agent process and are unseen by the gateway, so they call /guardrails/apply_guardrail before storing a peer's artefact." }
      - { block: memory, service: "PostgreSQL with pgvector; Valkey for task state", note: "Artefacts are stored against the task that received them, under row security." }
      - { block: gateway, service: "LiteLLM Proxy (Agent Gateway) on Kubernetes", note: "LiteLLM documents an A2A agent gateway, so it is bound for the A2A path as well as for models and MCP. It does not verify card signatures." }
      - { block: internalTools, service: "Your MCP servers on Kubernetes", build: true, note: "Called by LiteLLM with a token exchanged at Keycloak for that server's audience, never the peer's token." }
      - { block: orgData, service: "Your systems of record", build: true, note: "Reached only by tool services, inside the exchanged token's scope." }
      - { block: peerVendor, service: "Vendor platform agent (A2A)", note: "Stays outside. Registered on LiteLLM; reached through the outbound proxy; trusts your Keycloak for the users you approved." }
      - { block: provider, service: "vLLM on GPU nodes (NVIDIA GPU Operator)", note: "Your own open-weights models in the same data centre, called by LiteLLM as hosted_vllm/. KServe is the alternative." }
      - { block: partner, service: "Partner organisation's agent (A2A)", note: "Stays outside. No user federation: your agent presents its own client identity and scopes only." }
    sources:
      idp: https://www.keycloak.org/
      entry: https://gateway.envoyproxy.io/docs/tasks/security/oidc/
      authServer: https://www.keycloak.org/securing-apps/token-exchange
      harness: https://a2a-protocol.org/latest/specification/
      localTools: https://docs.litellm.ai/docs/apply_guardrail
      memory: https://github.com/pgvector/pgvector
      gateway: https://docs.litellm.ai/docs/a2a
      internalTools: https://docs.litellm.ai/docs/mcp
      orgData: https://developer.hashicorp.com/vault/docs/secrets/databases
      peerVendor: https://a2a-protocol.org/latest/specification/
      provider: https://docs.vllm.ai/en/latest/
      partner: https://a2a-protocol.org/latest/specification/
    differences:
      - at: gateway->provider
        text: "The model provider is inside. LiteLLM routes to your own vLLM servers (hosted_vllm/ with an api_base in the same data centre), so the model call never leaves. What does leave is whatever your agent puts in a task for a peer, which is why redaction sits on the A2A path."
        url: https://docs.litellm.ai/docs/providers/vllm
      - at: gateway->peerVendor
        text: "LiteLLM's Agent Gateway proxies A2A but lists the Agent Card signatures field as unsupported, so it does not verify AgentCardSignature. It stores a curated card and shows a diff on re-sync. Signature and hash checks on every task are code you write in the agent."
        url: https://docs.litellm.ai/docs/a2a_agent_card
      - at: gateway->partner
        text: "Only message/send and message/stream pass through LiteLLM's A2A client (logging, guardrails, spend). Other methods, such as fetching a task, are forwarded straight to the peer's URL, so artefacts retrieved that way are not screened at the gateway. Screen them in the agent before they reach memory."
        url: https://docs.litellm.ai/docs/a2a
      - at: gateway->authServer
        text: "Keycloak's standard token exchange covers tokens of your own realm. A peer's token is not exchanged directly: cross-organisation trust runs through identity brokering or the JWT Authorization Grant, and delegation is a preview feature. LiteLLM validating Keycloak tokens itself needs an Enterprise licence."
        url: https://www.keycloak.org/securing-apps/token-exchange
      - at: gateway
        text: "Agent access in LiteLLM is open until a list is set, and if the permission lookup fails because its database is unreachable, A2A returns unrestricted access. Set general_settings.agent_access_default_deny, list agents on every key and team, and run the gateway's database highly available."
        url: https://docs.litellm.ai/docs/proxy/security_owasp_llm_top10
      - at: idp->authServer
        text: "Identity provider and authorisation server are one product here: Keycloak, as one realm or two. The federation the drawing shows between them becomes realm configuration, so who approves a partnership and who issues its client is a split of administrator roles you must set up."
        url: https://www.keycloak.org/docs/latest/server_admin/index.html
      - at: partner
        text: "LiteLLM's agent kill switch only calls a webhook on an agent runtime you control; the agent stays registered and enabled. Cutting off a partner is therefore several steps: delete its agent record, block its key, disable its Keycloak client and send CancelTask for open tasks."
        url: https://docs.litellm.ai/docs/a2a_kill_switch
    alsoNeeded:
      - service: "Kubernetes control plane and etcd, on your own servers"
        role: other
        why: "No provider runs the cluster: highly available control plane nodes, etcd backups, upgrades and node patching are yours."
        url: https://kubernetes.io/docs/setup/production-environment/
      - service: "GPU servers with the NVIDIA GPU Operator"
        role: other
        why: "Drivers, the container toolkit and the device plugin on every GPU node that serves your agent's models."
        url: https://docs.nvidia.com/datacenter/cloud-native/gpu-operator/latest/index.html
      - service: "HashiCorp Vault (or OpenBao)"
        role: secrets
        why: "Issues and rotates each agent's signing key per partnership and holds the LiteLLM master and salt keys. LiteLLM's own Vault integration is Enterprise only, so sync with the Vault Secrets Operator."
        url: https://developer.hashicorp.com/vault/docs/deploy/kubernetes/vso
      - service: "Hardware security module for the vault seal"
        role: keys
        why: "Keys that identify your organisation to partners deserve a hardware root. OpenBao documents a PKCS#11 seal for an HSM."
        url: https://openbao.org/docs/configuration/seal/pkcs11/
      - service: "cert-manager, and a public certificate for the A2A endpoint"
        role: keys
        why: "Peers verify your agent's TLS certificate against authorities they trust, so the published endpoint needs a public or mutually agreed authority; inside, an internal one."
        url: https://cert-manager.io/docs/
      - service: "Public DNS and an internet-facing address for your agent"
        role: ingress
        why: "Peers call in over the internet: a published name, an edge firewall and denial-of-service protection in front of Envoy Gateway are yours to provide."
        url: https://gateway.envoyproxy.io/docs/
      - service: "Cilium and a Squid outbound proxy"
        role: network
        why: "Default-deny policy inside the cluster and one exit that only opens for each approved peer's host."
        url: https://docs.cilium.io/en/stable/security/dns/
      - service: "SPIFFE and SPIRE, where a peer accepts workload identities"
        role: identity
        why: "An alternative to keys per partnership: federated trust domains exchange bundles so each side can verify the other's workloads. Keycloak's SPIFFE identity provider is a preview feature."
        url: https://spiffe.io/docs/latest/architecture/federation/readme/
      - service: "PostgreSQL operations (CloudNativePG) and Velero backups"
        role: other
        why: "Keycloak, LiteLLM and task memory live in PostgreSQL. LiteLLM falls back to unrestricted agent access if its database is unreachable, so availability here is a security property."
        url: https://cloudnative-pg.io/
      - service: "OpenTelemetry Collector, Loki and your SIEM"
        role: logging
        why: "Collects gateway, Keycloak, proxy and Kubernetes audit logs and forwards them to the SIEM, where task records are matched with what the partner exports."
        url: https://opentelemetry.io/docs/collector/configuration/
      - service: "Time synchronisation (chrony) on every node"
        role: other
        why: "Signed client assertions are valid for seconds and both organisations' task records are matched by time."
        url: https://chrony-project.org/documentation.html
