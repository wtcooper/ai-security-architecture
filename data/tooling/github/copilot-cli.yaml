# GitHub Copilot CLI — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# Excluded: the retired `gh copilot` extension (2025-10-25); Copilot in Windows Terminal is a
# variant because it is governed by the Copilot CLI policy.
# 2026-09-25: re-verified toolCopilotCli against the MITRE capability rules; redirects:
# concepts/agents/copilot-cli/chronicle -> concepts/security-governance-and-network-settings/session-data,
# concepts/about-cloud-and-local-sandboxes -> concepts/security-governance-and-network-settings/
# about-cloud-and-local-sandboxes; copilot.github.trust.page renders client-side (read in a browser).
vendor: github
family: GitHub Copilot CLI
tools:
  - id: toolCopilotCli
    name: GitHub Copilot CLI
    surfaceClasses:
      - endpointCli
      - desktopApp
    variants:
      - name: Copilot CLI (GA 2026-02-25)
        class: endpointCli
        url: https://github.blog/changelog/2026-02-25-github-copilot-cli-is-now-generally-available/
      - name: >-
          GitHub Copilot app (desktop, GA 2026-06-17; same managed-settings plane, own policy since 2026-07-27)
        class: desktopApp
        url: https://docs.github.com/en/copilot/concepts/agents/github-copilot-app
      - name: Copilot in Windows Terminal (Canary; governed by the Copilot CLI policy)
        class: endpointCli
        url: https://docs.github.com/en/copilot/how-tos/chat-with-copilot/chat-in-windows-terminal
    architecture: archCodingAgentThirdParty
    status: ga
    asOf: "2026-09"
    summary:
      - "Copilot CLI is the terminal-native coding agent (plan mode, autopilot, built-in Explore / Task / Code
        Review / Plan agents, /fleet parallel sessions, hooks, plugins, MCP) and the runtime behind the GitHub
        Copilot desktop app, the SDK and JetBrains agent mode. It runs on the developer's machine with the
        developer's GitHub identity; inference goes to the Copilot API by plan, or straight to a provider
        under local BYOK."
      - "Prompts, file contents and tool output leave the device for the Copilot API; session data (prompts,
        responses, tools, files changed) is written to ~/.copilot/session-state and synced to the user's GitHub
        account only where the \"Store local sessions in the Cloud\" policy is at least \"View from cloud\"
        (unconfigured keeps it local for Business and Enterprise seats). Remote steering exposes
        the session to github.com and GitHub Mobile. Nothing reaches the organisation's audit log except
        policy changes."
      - "The admin plane is managed-settings.json: server-managed from the .github-private repository
        (copilot/managed-settings.json, with team overrides), MDM (HKLM\\SOFTWARE\\Policies\\GitHubCopilot,
        com.github.copilot) or a root-owned file. It carries deny / ask / allow permissions with Shell, Read,
        Edit and Domain selectors (GA 2026-09-09), disableBypassPermissionsMode, allowedMcpServers /
        deniedMcpServers, plugin marketplaces, the MXC local sandbox policy, OpenTelemetry export and
        remote-control mode."
    facts:
      - label: Plans
        value: >-
          All Copilot plans; Business and Enterprise gate it with the Copilot CLI policy (Enterprise > AI
          controls > Copilot > Configure features & clients > Clients), and the desktop app with its own
          GitHub Copilot app policy.
        url: >-
          https://docs.github.com/en/copilot/how-tos/copilot-cli/administer-copilot-cli-for-your-enterprise
      - label: Inference & routing
        value: >-
          Copilot API per plan; enterprise-enabled models only; local BYOK (OpenAI, Azure, Anthropic, Ollama)
          bypasses GitHub; enterprise BYOK models are served by the Copilot API.
        url: https://docs.github.com/en/copilot/concepts/models/bring-your-own-key
      - label: Data leaving the device
        value: >-
          Prompts and tool output to the Copilot API; session data synced to the GitHub account only where
          the "Store local sessions in the Cloud" policy allows it and remoteExport is not false; OTLP
          telemetry only where the enterprise configures it; remote-steering traffic to github.com.
        url: >-
          https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/session-data
      - label: Data retention / training
        value: >-
          Business and Enterprise prompts are not used for training; model providers run under ZDR except
          Claude Fable 5 / 5.1 (retain by default, exemption available through end-2026).
        url: https://docs.github.com/en/copilot/reference/ai-models/model-hosting
      - label: Sandboxes
        value: >-
          Local sandbox uses Microsoft eXecution Container (MXC: Seatbelt on macOS 15+, bubblewrap on Linux,
          BaseContainer on Windows 11); cloud sandbox runs on Azure Container Apps Sandboxes behind the Cloud
          sandbox access policy (off by default). Both public preview.
        url: >-
          https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/about-cloud-and-local-sandboxes
      - label: Docs index
        value: >-
          Copilot CLI how-tos (install, authenticate, allowing tools, hooks, MCP, plugins, administer for your
          enterprise).
        url: https://docs.github.com/en/copilot/how-tos/copilot-cli
    items:
      - title: Managed settings — delivery and precedence
        body:
          - "Server-managed: an organisation in the enterprise hosts .github-private with
            copilot/managed-settings.json (legacy .github/copilot/settings.json still read);
            copilot/team-mappings.json and copilot/teams/*.json let named teams relax keys the enterprise
            marks { \"overridable\": ... }. Clients refresh within about an hour, or on restart. MDM and
            local-file delivery exist for machines that must not depend on the server channel; the CLI falls
            back to its cached copy when a fetch fails."
          - "Keys the CLI honours: permissions.deny / ask / allow, permissions.disableBypassPermissionsMode,
            model, enabledPlugins / extraKnownMarketplaces / strictKnownMarketplaces, allowedMcpServers /
            deniedMcpServers, telemetry.*, remoteControl and sandbox.* — sandbox applies to the CLI and the app
            (not VS Code), the app ignores telemetry, the cloud agent honours only model and plugin keys."
        links:
          - title: Configuring enterprise-managed settings
            url: >-
              https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-enterprise/use-managed-settings/get-started
          - title: Enterprise managed settings reference
            url: >-
              https://docs.github.com/en/copilot/reference/enterprise-administrators/enterprise-managed-settings
      - title: Permission model and its escape hatches
        body:
          - "Read-only operations run without asking; edits, destructive shell commands and URL fetches
            prompt. Per-repo approvals persist in ~/.copilot/permissions-config.json and allowed URLs in
            ~/.copilot/settings.json. --allow-all / --yolo, /allow-all, --allow-all-tools and autopilot remove
            the prompts; deny rules still win. The managed file removes these options with
            disableBypassPermissionsMode and pins its own deny / ask / allow."
          - "Policy hooks — root-owned, machine-wide, immune to disableAllHooks — run preToolUse (fail-closed
            on error, fail-open on timeout) and permissionRequest with a permissionDecision of allow, deny or
            ask; HTTP hooks for those events must be https."
        links:
          - title: Allowing and denying tool use
            url: https://docs.github.com/en/copilot/how-tos/copilot-cli/use-copilot-cli/allowing-tools
          - title: Hooks reference
            url: https://docs.github.com/en/copilot/reference/hooks-reference
      - title: Local sandbox policy
        body:
          - "Deny-by-default filesystem: read/write, read-only and denied paths, with automatic grants for the
            working directory, PATH toolchains and package caches that managed settings can switch off
            (addCurrentWorkingDirectory, allowDevToolAccess). Network allowOutbound / allowLocalNetwork and an
            HTTP proxy; auth.git / auth.gh credential injection (formerly gitAuth / ghAuth) and macOS
            keychainAccess are separate switches.
            Managed values combine in the most restrictive direction; built-in file tools are software-checked
            only and remote MCP servers are outside the policy."
        links:
          - title: Understanding filesystem policies for local sandboxing
            url: >-
              https://docs.github.com/en/copilot/concepts/agents/copilot-cli/understanding-local-sandboxing
          - title: Configuring local sandbox settings
            url: >-
              https://docs.github.com/en/copilot/how-tos/cloud-and-local-sandboxes/configuring-local-sandbox-settings
    riskNotes:
      - risk: riskRogueActions
        note: >-
          Autopilot and --yolo exist by design; CVE-2026-29783 showed the read-only classifier itself could be
          tricked by bash parameter expansion. disableBypassPermissionsMode plus a managed sandbox is the only
          configuration where a bad tool call is contained rather than merely prompted.
      - risk: riskPromptInjection
        note: >-
          Repository files, MCP responses and hook output all feed the agent; the vendor's fix for
          CVE-2026-29783 added parse-time blocking and prompt hardening but no classifier. Domain() deny rules
          and sandbox allowOutbound=false bound the exfiltration path.
      - risk: riskSensitiveDataDisclosure
        note: >-
          Session transcripts sync to github.com wherever the policy allows it and remote steering publishes
          them to the agents list; OTLP captureContent can also carry prompts. Decide the "Store local sessions
          in the Cloud" policy and lockCaptureContent explicitly.
      - risk: riskToolSourceProvenance
        note: >-
          Plugins and MCP servers install by name from marketplaces and npx commands; only
          strictKnownMarketplaces and the managed allowlist (URL and stdio command match) bound the sources —
          the registry restriction is name-only and bypassable.
    controls:
      - mitigation: D3-MFA
        coverage: native
        mechanism: >-
          GitHub's own second-factor requirement (Enterprise > Settings > Authentication security > "Require
          two-factor authentication for the enterprise and all of its organizations", optionally "Only allow
          secure two-factor methods") plus the device-delivered managed key forceLoginOrgs, which pins the CLI
          to the organization's accounts and refuses personal accounts and BYOK/API-key sign-in
        steps:
          - title: Require two-factor authentication for every organization
            body:
              - >-
                Enterprise > Settings > Authentication security: select "Require two-factor authentication for
                the enterprise and all of its organizations" and "Only allow secure two-factor methods"; members
                without 2FA cannot reach organization resources until they enable it. Not available to
                Enterprise Managed Users, whose second factor is the IdP's.
            url: >-
              https://docs.github.com/en/enterprise-cloud@latest/admin/enforcing-policies/enforcing-policies-for-your-enterprise/enforcing-policies-for-security-settings-in-your-enterprise
          - title: Pin the CLI to your organizations
            body:
              - >-
                Deliver forceLoginOrgs (an array of organization logins) through MDM (com.github.copilot plist,
                HKLM\SOFTWARE\Policies\GitHubCopilot) or a root-owned managed-settings.json: Copilot then runs only
                for an account in a listed organization, refuses personal accounts, other enterprises and
                BYOK/API-key authentication, and fails closed if the policy cannot be read.
            url: >-
              https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-config-dir-reference
          - title: Bound the tokens that skip the second factor
            body:
              - >-
                Enterprise > Policies > Personal access tokens: set "Set maximum lifetimes for personal access
                tokens", require approval of fine-grained tokens and restrict classic tokens.
            url: >-
              https://docs.github.com/en/enterprise-cloud@latest/admin/enforcing-policies/enforcing-policies-for-your-enterprise/enforcing-policies-for-personal-access-tokens-in-your-enterprise
        note: >-
          Native by the rule applied to every vendor: GitHub's identity layer requires a second factor for every
          organization member and forceLoginOrgs pins the client to the organization account (MDM or file
          channel only — the server-managed channel reaches only accounts already signed in, so unmanaged
          devices are not pinned). With Enterprise Managed Users the 2FA policy is unavailable: MFA is the IdP's
          and, per GitHub, enforced only at IdP sign-in. Non-interactive paths that skip the second factor once
          issued: the OAuth token (gho_) kept in the OS keychain, whose lifetime "depend[s] on how the token was
          created"; fine-grained PATs with the Copilot Requests account permission and GitHub App user tokens
          (ghu_) read from COPILOT_GITHUB_TOKEN / GH_TOKEN / GITHUB_TOKEN; and the gh CLI token fallback.
          forceLoginOrgs still requires those accounts to belong to a listed organization; whether the PAT
          lifetime and restriction policies govern the Copilot Requests permission is not documented.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityIga
          reviewRequired: false
          original:
            - capability: capabilityIga
              coverage: native
              mechanism: >-
                Copilot seat plus the Copilot CLI policy (and the separate GitHub Copilot app policy); OAuth
                device/browser flow or a fine-grained PAT with the Copilot Requests permission; SAML SSO
                authorisation per organisation
              steps:
                - title: Enable the CLI for the right organisations
                  body:
                    - "Enterprise > AI controls > Copilot > Configure features & clients > Clients: set
                      Copilot CLI to Enabled everywhere, Disabled everywhere or Let organizations decide;
                      users still need an assigned seat."
                  url: >-
                    https://docs.github.com/en/copilot/how-tos/copilot-cli/administer-copilot-cli-for-your-enterprise
                - title: Set the desktop app policy separately
                  body:
                    - Since 2026-07-27 the GitHub Copilot app has its own policy under AI Controls > Copilot
                      Clients (default Enabled everywhere); it no longer follows the CLI policy.
                  url: >-
                    https://github.blog/changelog/2026-07-27-manage-github-copilot-app-access-with-a-dedicated-policy/
                - title: Constrain how the CLI authenticates
                  body:
                    - OAuth tokens (gho_) and fine-grained PATs (github_pat_, Copilot Requests permission) are
                      accepted; classic PATs are not. Tokens live in the OS keychain with a plaintext fallback
                      at ~/.copilot/config.json; SSO-protected organisations require Authorize at login.
                  url: >-
                    https://docs.github.com/en/copilot/how-tos/copilot-cli/set-up-copilot-cli/authenticate-copilot-cli
              verified: 2026-09-10
      - mitigation: cap-agent-action-policy-enforcement
        coverage: native
        mechanism: >-
          managed-settings.json permissions.deny / ask / allow with Shell(), Read(), Edit() / Write() and
          Domain() selectors; root-owned policy hooks (preToolUse, permissionRequest) in
          /etc/github-copilot/policy.d/ or HKLM\Software\Policies\GitHub\Copilot
        steps:
          - title: Write the managed permission rules
            body:
              - >-
                Under permissions set deny (blocks from any source), ask (fresh approval every time; bypass,
                auto-approval, hooks and saved grants cannot satisfy it) and allow (intersection across sources)
                with Shell(...), Read(...), Edit(...) and Domain(...) selectors; any managed rule makes unmatched
                operations default to ask.
            url: >-
              https://docs.github.com/en/copilot/reference/enterprise-administrators/enterprise-managed-settings
          - title: Add a machine-wide policy hook
            body:
              - >-
                Deploy a root-owned JSON file in /etc/github-copilot/policy.d/ (Windows
                C:\ProgramData\GitHub\Copilot\policy.d\ or HKLM\Software\Policies\GitHub\Copilot) whose preToolUse
                hook returns permissionDecision "deny"; errors and exit code 2 deny, timeouts fail open, and
                disableAllHooks cannot switch policy hooks off.
            url: https://docs.github.com/en/copilot/reference/hooks-reference
        note: >-
          Native by the rule applied to every vendor: admin-delivered, user-proof deny/ask/allow rules over shell
          commands (including redirection and sed -i writes), file paths and network domains are evaluated before
          each call, and an admin-locked pre-tool hook can deny any tool, MCP tools included (managed selectors
          do not name MCP tools). The hook is an integration point whose logic the organisation writes: command
          hooks fail closed on error but open on timeout, and HTTP preToolUse hooks fail open on any error, so set
          timeoutSec and prefer command hooks. Remote MCP servers' own actions are outside both; decisions reach
          telemetry only as hook span events.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAgentRuntimeEnforcement
          reviewRequired: false
          original:
            - capability: capabilityAgentRuntimeEnforcement
              coverage: native
              mechanism: >-
                managed-settings.json permissions.deny / ask / allow with Shell(), Read(), Edit(), Domain()
                selectors (GA 2026-09-09); root-owned policy hooks on preToolUse / permissionRequest
              steps:
                - title: Write the managed permission rules
                  body:
                    - 'Under permissions set deny (blocked from any source), ask (fresh approval every time, bypass cannot
                      satisfy) and allow (intersection across sources) with Shell(...) / Bash(...) /
                      PowerShell(...), Read(path), Edit(path) / Write(path) and Domain(host) selectors; mark
                      team-relaxable keys { "overridable": ... }.'
                  url: >-
                    https://docs.github.com/en/copilot/reference/enterprise-administrators/enterprise-managed-settings
                - title: Add a machine-wide policy hook
                  body:
                    - Deploy a root-owned policy hook file; a preToolUse hook returning permissionDecision "deny" blocks the
                      call, errors and exit code 2 deny (fail-closed), timeouts fail open — set timeoutSec
                      accordingly. disableAllHooks cannot switch policy hooks off.
                  url: https://docs.github.com/en/copilot/reference/hooks-reference
              note: >-
                Managed permissions are deterministic; policy hooks are an integration point whose logic the
                organisation writes and must fail closed. Remote MCP servers' own actions are outside both.
              verified: 2026-09-10
      - mitigation: cap-ai-vendor-assessment
        coverage: external
        mechanism: >-
          No vendor feature; the organisation's TPRM platform assesses GitHub and each model provider from the
          GitHub Copilot Trust Center and the model-hosting page
        evidence:
          - title: GitHub Copilot Trust Center (compliance reports; most documents behind Request access)
            url: https://copilot.github.trust.page/
          - title: Hosting of models for GitHub Copilot (providers and retention terms)
            url: https://docs.github.com/en/copilot/reference/ai-models/model-hosting
        note: >-
          External: the organisation's TPRM platform owns the assessment. Rendered in a browser on 2026-09-25 the
          trust center lists SOC 1, SOC 2 and SOC 3 (SOC 1 Type 2 and SOC 2 Type 2 reports), ISO 27001:2013,
          ISO/IEC 42001:2023, CSA STAR Level 2, TISAX, a 2026 CAIQ, a PCI DSS AOC and bug-bounty letters, most
          behind Request access; no penetration-test summary is listed. Model providers: Azure, AWS Bedrock,
          Anthropic, Google Cloud, xAI, Azure AI Foundry and Fireworks, with Claude Fable 5 / 5.1 retaining
          prompts by default (ZDR exemption through end-2026). Local BYOK in the CLI "is not controlled by
          enterprise policies" and changes the subprocessor set per developer; forceLoginOrgs, which refuses
          BYOK/API-key sign-in, is the lever that keeps it off managed devices.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAiTprm
          reviewRequired: false
          original:
            - capability: capabilityAiTprm
              coverage: external
              mechanism: No vendor feature; model-hosting page and provider ZDR terms are the assessment inputs
              note: >-
                Local BYOK changes the subprocessor set per developer — disable it through the "Enable custom
                models" policy if the vendor assessment did not cover the providers.
              steps:
                - title: Record model providers and retention terms
                  body:
                    - Enumerate hosting per model (Azure, AWS Bedrock, Anthropic, GCP, xAI, Fireworks) and the Claude Fable 5 /
                      5.1 retention exception.
                  url: https://docs.github.com/en/copilot/reference/ai-models/model-hosting
              verified: 2026-09-10
      - mitigation: cap-sensitive-data-redaction
        coverage: partial
        mechanism: >-
          Policy hooks that can rewrite or deny prompt and tool traffic (userPromptTransformed, preToolUse
          modifiedArgs, postToolUse modifiedResult); built-in redaction of GITHUB_TOKEN / COPILOT_GITHUB_TOKEN
          values from output and --secret-env-vars; content exclusion and Read() denies as data minimisation
        steps:
          - title: Hand prompt and tool traffic to your inspector
            body:
              - >-
                In a root-owned policy hook, return modifiedTransformedPrompt from userPromptTransformed with
                secrets masked, and have preToolUse and postToolUse call your DLP service and deny or return
                modifiedArgs / modifiedResult.
            url: https://docs.github.com/en/copilot/reference/hooks-reference
          - title: Redact named secrets from tool environments
            body:
              - >-
                Start sessions with --secret-env-vars=VAR,... to redact those variables from shell and MCP server
                environments; GITHUB_TOKEN and COPILOT_GITHUB_TOKEN values are redacted from output by default.
            url: >-
              https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-command-reference
          - title: Keep secret files out of context
            body:
              - >-
                Enterprise, organization and repository content-exclusion rules apply to the CLI ("Excluded files
                are not used as context").
            url: >-
              https://docs.github.com/en/copilot/how-tos/copilot-cli/administer-copilot-cli-for-your-enterprise
        note: >-
          Partial by the rule applied to every vendor: the CLI detects no secrets or PII in prompts or tool
          traffic itself. It masks two named token values and, per session, variables the user names with
          --secret-env-vars (a flag, not a managed key), and its policy hooks are an inline attach point that can
          block or rewrite traffic once the organisation attaches a detector (userPromptSubmitted config-file
          hooks cannot change the prompt; userPromptTransformed can). Content exclusion and managed Read(...)
          denies are path filtering, credited as data minimisation; the model still sees whatever the developer
          pastes.
          Local BYOK sends prompts straight to the configured provider.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAiDlp
          reviewRequired: false
          original:
            - capability: capabilityAiDlp
              coverage: partial
              mechanism: >-
                Content exclusion applies to the CLI and the app; Read() deny rules and sandbox deniedPaths
                keep files out of tools; telemetry.captureContent=false with lockCaptureContent
              note: >-
                A context filter and path denies, not inspection: nothing scans the prompt stream for
                sensitive content, and the model still sees whatever the developer pastes.
              steps:
                - title: Deny secret paths to the agent's tools
                  body:
                    - Put Read(**/.env) and similar under permissions.deny; add the same paths to
                      sandbox.userPolicy.filesystem.deniedPaths, which managed values add to rather than replace.
                  url: >-
                    https://docs.github.com/en/copilot/reference/enterprise-administrators/enterprise-managed-settings
                - title: Apply content exclusion and lock telemetry content
                  body:
                    - Enterprise and organisation content-exclusion rules apply to the CLI ("Excluded files are not used as
                      context"); set telemetry.captureContent=false and lockCaptureContent=true so exports never
                      carry prompts.
                  url: >-
                    https://docs.github.com/en/copilot/how-tos/copilot-cli/administer-copilot-cli-for-your-enterprise
              verified: 2026-09-10
      - mitigation: cap-input-guardrails
        coverage: partial
        mechanism: >-
          No classifier; a policy hook's postToolUse can replace a tool result before the model sees it
        steps:
          - title: Screen tool results with a post-tool hook
            body:
              - >-
                In a root-owned policy hook, have postToolUse send each result to your classifier and return
                modifiedResult (a replacement textResultForLlm) or a failure when it flags injected instructions;
                the hook runs for every tool unless a matcher narrows it.
            url: https://docs.github.com/en/copilot/reference/hooks-reference
        note: >-
          Partial by the rule applied to every vendor: GitHub ships no classifier for repository files, MCP
          results or fetched pages; the post-tool hook is an attach point. The CLI's command safety analysis and
          the parse-time blocking added for CVE-2026-29783 judge proposed shell commands — action policy, not
          input screening — and web_fetch SSRF protection limits destinations, not content. Folder trust and MCP
          server trust levels are admission. An AI or MCP gateway classifier on the brokered path is the
          external complement.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityPromptInjectionDefense
          reviewRequired: false
          original:
            - capability: capabilityPromptInjectionDefense
              coverage: partial
              mechanism: >-
                Vendor-side parse-time blocking of dangerous shell patterns and hardened system prompts (post
                CVE-2026-29783); userPromptSubmitted / preToolUse hooks; no classifier
              steps:
                - title: Keep the CLI current and add hook-based screening
                  body:
                    - Run >= 0.0.423 (the fix blocks ${var@P}-style expansions unconditionally); use policy hooks on
                      userPromptSubmitted and preToolUse to screen or deny suspicious inputs and tool arguments.
                  url: https://github.com/advisories/GHSA-g8r9-g2v8-jv6f
              note: >-
                Parse-time blocking detects a class of injected shell commands; the hooks are the attach point
                for a detector on prompts. Repository files, MCP results and fetched pages are not classified.
              verified: 2026-09-10
      - mitigation: AML.M0028
        coverage: native
        mechanism: >-
          Managed permissions.deny / ask / allow with argument-scoped Shell(), Read(), Edit() and Domain()
          selectors; permissions.disableBypassPermissionsMode; allowedMcpServers; session flags --deny-tool /
          --allow-tool / --available-tools with MyMCP(tool) patterns
        steps:
          - title: Remove the all-tools switches
            body:
              - >-
                Set permissions.disableBypassPermissionsMode to "disable": --yolo, --allow-all, --allow-all-tools,
                --allow-all-paths and --allow-all-urls are suppressed at startup and /yolo and /allow-all are
                blocked.
            url: >-
              https://docs.github.com/en/copilot/reference/enterprise-administrators/enterprise-managed-settings
          - title: Scope shell, file and domain operations
            body:
              - >-
                Put Shell(git push *), Read(~/.ssh/**), Edit(//etc/**) and Domain(...) selectors under
                permissions.deny and permissions.ask; deny from any managed source blocks for every user.
            url: >-
              https://docs.github.com/en/copilot/reference/enterprise-administrators/enterprise-managed-settings
          - title: Scope MCP tools per session
            body:
              - >-
                Use --deny-tool / --allow-tool with MyMCP(tool) and --available-tools for scripted runs; deny rules
                beat allow even under --allow-all.
            url: https://docs.github.com/en/copilot/how-tos/copilot-cli/use-copilot-cli/allowing-tools
        note: >-
          Native by the rule applied to every vendor: admin-lockable deny/ask/allow with argument and path
          scoping for shell, file and network operations, with the bypass modes removable. MCP tools are scoped
          at server level by allowedMcpServers; per-tool MCP scoping is a user flag or a policy hook, not a
          managed selector. A server-managed disableBypassPermissionsMode is cleared by switching to an account
          that does not set it — deliver it by MDM or pin accounts with forceLoginOrgs; "allow-auto-only" keeps
          LLM-assisted approval, "disable" removes it.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityToolPermissionScoping
          reviewRequired: false
          original:
            - capability: capabilityToolPermissionScoping
