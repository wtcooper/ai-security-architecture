# Microsoft Azure: the first-party cloud architectures as built on Azure, and the security-relevant
# settings that secure them. One settings library per cloud, so a setting used by several
# architectures is one row with one status in data/status.yaml; each implementation binds the
# drawing's blocks to services and lists the settings that apply to it.
#
# Every row follows data/tooling/BASELINE.md: the setting's name as Microsoft's page gives it, a
# url that resolved on its verified date, the baseline value, and the capabilities on the drawing
# it delivers. setVia "code" marks a control no Azure setting provides: the organisation builds it
# into its own agent.
id: cloudAzure
name: Microsoft Azure
short: Azure

settings:
  # --- Identity & access ---------------------------------------------------------------
  - id: entraAssignmentRequired
    name: Assignment required
    where: Microsoft Entra admin center › Enterprise applications › (your app) › Properties
    setVia: [identityProvider]
    area: identity
    default: "No"
    recommended: "Yes — assigned to the groups that use the app"
    why: Only assigned users and groups can get a token for the app at all, so access is a group decision rather than every account in the tenant.
    mitigations: [D3-APA]
    url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/application-properties
    verified: "2026-10-30"
  - id: appServiceRequireAuth
    name: App Service authentication — Require authentication
    where: App Service › Authentication › Restrict access
    setVia: [cloudPolicy]
    area: identity
    default: Unauthenticated access allowed
    recommended: Require authentication, Microsoft Entra ID as the provider
    why: The front end rejects every unauthenticated request before your code runs, and binds each session to an Entra identity.
    mitigations: [D3-APA]
    url: https://learn.microsoft.com/en-us/azure/app-service/overview-authentication-authorization
    verified: "2026-10-30"
  - id: agentManagedIdentity
    name: Managed identity on the agent's container app
    where: Container Apps › (agent app) › Identity
    setVia: [cloudPolicy]
    area: identity
    default: None
    recommended: System-assigned, granted only the roles the agent needs
    why: The agent authenticates to the gateway, the model and its stores with a platform-issued identity — no secret in its configuration to steal.
    mitigations: [D3-AA, D3-CH]
    url: https://learn.microsoft.com/en-us/azure/container-apps/managed-identity
    verified: "2026-10-30"
  - id: foundryDisableLocalAuth
    name: disableLocalAuth
    where: Foundry (Azure AI services) resource property, via Bicep, ARM, Terraform or PowerShell
    setVia: [cloudPolicy, apiCli]
    area: identity
    default: "false (API keys allowed)"
    recommended: "true"
    why: Model calls need an Entra token; an API key copied from a config file opens nothing. Enforce it fleet-wide with Azure Policy.
    mitigations: [D3-CH]
    url: https://learn.microsoft.com/en-us/azure/ai-services/disable-local-auth
    verified: "2026-10-30"
  - id: apimValidateToken
    name: validate-azure-ad-token policy
    where: API Management › APIs and MCP servers › Inbound processing
    setVia: [cloudPolicy]
    area: identity
    default: No policy
    recommended: On every model API and MCP server, checking the agent's identity and the role each operation needs
    why: The gateway verifies who is calling before any model or tool call goes through, and a tool the agent's role doesn't cover is refused.
    mitigations: [D3-AA, AML.M0028]
    url: https://learn.microsoft.com/en-us/azure/api-management/validate-azure-ad-token-policy
    verified: "2026-10-30"
  - id: apimCredentialManager
    name: Credential manager (user-delegated connections)
    where: API Management › Credential manager
    setVia: [cloudPolicy]
    area: identity
    default: Not configured
    recommended: Downstream OAuth tokens held by API Management per user; the agent never holds them
    why: Calls to SaaS tools run with the signed-in user's own grant, exchanged at the gateway, so the agent cannot reuse one user's access for another.
    mitigations: [D3-CTS]
    url: https://learn.microsoft.com/en-us/azure/api-management/credentials-overview
    verified: "2026-10-30"
  - id: serviceBusSenderRole
    name: Azure Service Bus Data Sender
    where: Service Bus namespace › (trigger queue) › Access control (IAM)
    setVia: [cloudPolicy]
    area: identity
    recommended: Assigned at the queue scope, only to the identities allowed to start a run; nothing at namespace scope
    why: Who can put work on the agent's queue is a named role assignment on that one queue, so starting a run is itself an authorization decision.
    mitigations: [D3-APA]
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/authenticate-application
    verified: "2026-10-30"
  - id: serviceBusDisableLocalAuth
    name: Local Authentication (disableLocalAuth)
    where: Service Bus namespace › Overview › Local Authentication; disableLocalAuth in Bicep or ARM
    setVia: [cloudPolicy, apiCli]
    area: identity
    default: "Enabled (SAS keys accepted)"
    recommended: Disabled
    why: Only an Entra identity holding the sender role can start a run; a SAS connection string copied from a config file starts nothing.
    mitigations: [D3-APA]
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/disable-local-authentication
    verified: "2026-10-30"
  - id: entraAgentIdentity
    name: Agent identities (Microsoft Entra Agent ID)
    where: Microsoft Entra admin center › Entra ID › Agents › Agent identities › New agent identity; or Microsoft Graph
    setVia: [identityProvider, apiCli]
    area: identity
    recommended: One agent identity per agent, created from a blueprint whose credential is a managed identity, each with an owner and a sponsor
    why: Every agent is a separately attributable, separately revocable principal in the directory — not one service account the whole system acts as.
    mitigations: [D3-AA]
    url: https://learn.microsoft.com/en-us/entra/agent-id/create-delete-agent-identities
    verified: "2026-10-30"
  - id: entraAgentObo
    name: On-behalf-of flow (agent identities)
    where: Agent code, through Microsoft.Identity.Web or the Microsoft Entra ID Auth SDK (sidecar)
    setVia: [identityProvider, code]
    area: identity
    default: Not configured
    recommended: Each agent exchanges the user's token for its own token, scoped to its task's resource; no token is handed from one agent to the next
    why: Authority narrows at each hop — a specialist holds a token for its own step, never the caller's or the supervisor's.
    mitigations: [D3-CTS]
    url: https://learn.microsoft.com/en-us/entra/agent-id/agent-on-behalf-of-oauth-flow
    verified: "2026-10-30"
  - id: entraApplicationIdUri
    name: Application ID URI (with requestedAccessTokenVersion 2)
    where: Microsoft Entra admin center › App registrations › (MCP server) › Expose an API; requestedAccessTokenVersion in the manifest
    setVia: [identityProvider]
    area: identity
    recommended: The server's exact canonical URL (every URL clients use), on v2 access tokens
    why: Entra matches the client's resource parameter to this URI, so every token is audience-bound to this server and one minted for another resource is refused.
    mitigations: [D3-CTS]
    url: https://learn.microsoft.com/en-us/entra/agent-id/secure-mcp-server-with-entra-id
    verified: "2026-10-30"
  - id: entraApiScopes
    name: Scopes (Expose an API › Add a scope)
    where: Microsoft Entra admin center › App registrations › (MCP server) › Expose an API
    setVia: [identityProvider]
    area: identity
    recommended: One scope per class of operation (tool.read, tool.execute), Admins only consent; no omnibus scope
    why: A client is granted only the operations it asked for and an administrator approved, and the server checks the scope before it runs a tool.
    mitigations: [AML.M0028]
    url: https://learn.microsoft.com/en-us/entra/agent-id/secure-mcp-server-with-entra-id
    verified: "2026-10-30"
  - id: entraAppRoles
    name: App roles (Allowed member types — Applications)
    where: Microsoft Entra admin center › App registrations › (your API) › App roles; assigned to each calling agent identity or application
    setVia: [identityProvider]
    area: identity
    recommended: A narrow role per autonomous caller, assigned individually; no tenant-wide application permission
    why: A workload with no user behind it gets only the roles assigned to its own identity, carried in the token's roles claim — no borrowed user authority.
    mitigations: [D3-AA]
    url: https://learn.microsoft.com/en-us/entra/agent-id/secure-mcp-server-with-entra-id
    verified: "2026-10-30"
  - id: entraCertificateCredentials
    name: Certificate credentials (client assertion)
    where: Microsoft Entra admin center › App registrations › (client) › Certificates & secrets › Certificates
    setVia: [identityProvider]
    area: identity
    recommended: A certificate credential on every non-interactive client; no client secrets
    why: The client proves possession of a private key (private_key_jwt) rather than presenting a shared secret that can be copied.
    mitigations: [D3-AA]
    url: https://learn.microsoft.com/en-us/entra/identity-platform/certificate-credentials
    verified: "2026-10-30"
  - id: entraObo
    name: On-behalf-of (OBO) flow
    where: Your server code, through MSAL or Microsoft.Identity.Web
    setVia: [code]
    area: identity
    default: Not used
    recommended: A handler that calls an upstream API exchanges the inbound token for a downstream token; the inbound token is never forwarded
    why: The caller's token stops at this server, so it cannot be replayed against another API, and each downstream call is a logged delegation step.
    mitigations: [D3-CTS]
    url: https://learn.microsoft.com/en-us/entra/identity-platform/v2-oauth2-on-behalf-of-flow
    verified: "2026-10-30"
  - id: entraRevokeSessions
    name: Revoke-MgUserSignInSession (revoke refresh tokens)
    where: Microsoft Graph PowerShell, or Microsoft Entra admin center › Users › (user) › Revoke sessions
    setVia: [identityProvider, apiCli]
    area: identity
    default: Access tokens last 1 hour
    recommended: Part of the leaver and incident runbook, with the default 1-hour access-token lifetime as the measured revocation delay
    why: Refresh tokens stop at once and issued access tokens expire within the hour, so a revoked grant cannot keep calling the server.
    mitigations: [D3-CR]
    url: https://learn.microsoft.com/en-us/entra/identity/users/users-revoke-access
    verified: "2026-10-30"
  - id: keyVaultReferences
    name: Key Vault references
    where: App Service or Functions › Environment variables › "@Microsoft.KeyVault(...)"; the app's managed identity holds Key Vault Secrets User
    setVia: [cloudPolicy]
    area: identity
    recommended: Every upstream credential a handler uses held in Key Vault, one per upstream, referenced without a version so rotation is picked up
    why: No upstream secret sits in app settings or code, and rotating one in Key Vault reaches the server without a redeploy.
    mitigations: [D3-CH]
    url: https://learn.microsoft.com/en-us/azure/app-service/app-service-key-vault-references
    verified: "2026-10-30"
  - id: amlComputeIdentity
    name: Compute cluster managed identity (identity-based data access)
    where: Azure Machine Learning › Compute › (training cluster) › Managed identity; datastores set to identity-based access
    setVia: [cloudPolicy, apiCli]
    area: identity
    recommended: A user-assigned identity per training workload, granted read on its approved dataset and write on its own output container — never the registry or the signing key
    why: The run reads and writes as its own identity, checked by each store, and holds nothing that could promote or sign what it produced.
    mitigations: [D3-AA]
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-identity-based-service-authentication
    verified: "2026-10-30"
  - id: kvSigningCryptoUser
    name: Key Vault Crypto User (on a dedicated signing vault)
    where: Key Vault (signing vault, Azure RBAC permission model) › Access control (IAM)
    setVia: [cloudPolicy]
    area: identity
    recommended: Assigned only to the promotion pipeline's identity, which runs after a separate human approval
    why: Only the promotion step can produce a release signature, so a signed model proves the gate was passed — the training job cannot sign its own output.
    mitigations: [AML.M0013]
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-guide
    verified: "2026-10-30"
  - id: aksWorkloadIdentity
    name: Microsoft Entra Workload ID (AKS)
    where: AKS cluster OIDC issuer and workload identity; a Kubernetes service account per rollout, federated to its own user-assigned identity
    setVia: [cloudPolicy, configFile]
    area: identity
    recommended: Every rollout pod runs under a service account federated to a narrowly scoped identity; no credential in the image
    why: A rollout presents a short-lived projected token that each platform service verifies, so a token stolen from one sandbox opens nothing in another.
    mitigations: [D3-AA]
    url: https://learn.microsoft.com/en-us/azure/aks/workload-identity-overview
    verified: "2026-10-30"

  # --- Data & retention ----------------------------------------------------------------
  - id: cosmosConversationTtl
    name: DefaultTimeToLive on the conversation container
    where: Azure Cosmos DB › (container) › Settings › Time to Live
    setVia: [cloudPolicy, apiCli]
    area: data
    default: Off (items never expire)
    recommended: 30 days
    why: Conversation state ages out instead of accumulating client material indefinitely in the agent's memory.
    mitigations: [AML.M0031]
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/time-to-live
    verified: "2026-10-30"
  - id: searchDocumentAccess
    name: Document-level access control (permission filters)
    where: Azure AI Search › index definition › permission filter fields; queries carry x-ms-query-source-authorization
    setVia: [apiCli, code]
    area: data
    default: "Off"
    recommended: On for every index that holds permissioned content
    why: Retrieval returns only documents the asking user may read, so the index cannot become a way round the source system's permissions.
    mitigations: [cap-data-access-governance, cap-retrieval-grounding-checks]
    url: https://learn.microsoft.com/en-us/azure/search/search-document-level-access-overview
    verified: "2026-10-30"
  - id: groundednessDetection
    name: Groundedness detection
    where: Azure AI Content Safety API, called on answers drawn from retrieved documents
    setVia: [apiCli, code]
    area: data
    default: Not called
    recommended: On for answers built from retrieval
    why: An answer that strays from — or was steered away from — its sources is flagged before the user acts on it.
    mitigations: [cap-retrieval-grounding-checks]
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-safety/concepts/groundedness
    verified: "2026-10-30"
  - id: piiRedaction
    name: PII detection (Azure AI Language)
    where: Azure AI Language API, called before a turn is written to memory
    setVia: [apiCli, code]
    area: data
    default: Not called
    recommended: Redact before storing conversation turns
    why: Personal data a user pasted is not kept in the thread for every later turn — and every later reader — to see.
    mitigations: [cap-sensitive-data-redaction]
    url: https://learn.microsoft.com/en-us/azure/ai-services/language-service/personally-identifiable-information/overview
    verified: "2026-10-30"
  - id: dtsAutopurge
    name: Autopurge retention policies
    where: Durable Task Scheduler › retention policies (applies to every task hub in the scheduler)
    setVia: [cloudPolicy, apiCli]
    area: data
    default: "Enabled, 30 days"
    recommended: "Enabled, 30 days (keep the default)"
    why: Finished runs' journals — every payload a step returned — are deleted on a schedule instead of building up as a second store of client data.
    mitigations: [AML.M0031]
    url: https://learn.microsoft.com/en-us/azure/durable-task/scheduler/durable-task-scheduler-auto-purge
    verified: "2026-10-30"
  - id: tenantClaimValidation
    name: Validate the tenant (tid) and subject claims
    where: Your server's handlers — every read and write keyed by the token's tid and oid
    setVia: [code]
    area: data
    default: Not enforced by the protocol or the platform
    recommended: Every record access filtered to the caller's tenant and delegation; never data from one tenant served to another
    why: MCP has no notion of a tenant, so the token's tenant claim checked in the handler is the only thing keeping one customer's records from another's caller.
    mitigations: [cap-data-access-governance]
    url: https://learn.microsoft.com/en-us/entra/identity-platform/claims-validation
    verified: "2026-10-30"
  - id: storageSharedKeyAccess
    name: AllowSharedKeyAccess
    where: Storage account property, via Bicep, ARM, Azure CLI or Azure Policy
    setVia: [cloudPolicy, apiCli]
    area: data
    default: "null (Shared Key and SAS permitted)"
    recommended: "false — every read and write authorized by Entra RBAC, the writer and reader roles held by named identities"
    why: Weights and datasets can be read only by identities granted a role on the account; an account key or SAS token copied out of a pipeline opens nothing.
    mitigations: [AML.M0005]
    url: https://learn.microsoft.com/en-us/azure/storage/common/shared-key-authorization-prevent
    verified: "2026-10-30"
  - id: defenderMalwareScanning
    name: On-upload malware scanning (Defender for Storage)
    where: Microsoft Defender for Cloud › Defender for Storage plan (subscription or storage account) › Malware scanning add-on
    setVia: [cloudPolicy]
    area: data
    default: "Off"
    recommended: On for every storage account that receives model files or training data, with malicious blobs soft-deleted
    why: An artifact carrying known malware is caught on arrival, before any promotion step or loader opens it.
    mitigations: [D3-FA]
    requires: Microsoft Defender for Storage plan
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/introduction-malware-scanning
    verified: "2026-10-30"
  - id: modelLoadVerification
    name: Verify the release signature before load
    where: Your serving image's init step — hash the files, verify the release signature with the signing key's public half
    setVia: [code]
    area: data
    default: Weights load without verification
    recommended: The runtime starts only if every file matches the signed release; a hub artifact only if it matches the digest in its promotion record
    why: A file replaced in storage — even with a new digest written beside it — fails verification and never loads.
    mitigations: [AML.M0014]
    url: https://learn.microsoft.com/en-us/azure/key-vault/keys/about-keys-details
    verified: "2026-10-30"
  - id: servingModelRecord
    name: Deploy by registry model name and version
    where: Your deployment manifests — the serving workload names the Azure Machine Learning registry model and version it loads
    setVia: [code]
    area: data
    default: Deployments point at a path
    recommended: Every serving deployment references a registered model version, never a bare path or a hub ID
    why: The question of what is running has an answer — each instance maps to a registry entry with its publisher, format, scan and lineage.
    mitigations: [AML.M0023]
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-models
    verified: "2026-10-30"
  - id: amlDataAssetVersions
    name: Data asset versions (Azure Machine Learning)
    where: Azure Machine Learning › Data › (asset) — referenced as azureml:<name>:<version>, with source and licence recorded as tags
    setVia: [apiCli, code]
    area: data
    recommended: Every training input registered as a data asset version with its source and licence; jobs read assets by version, never by raw path
    why: A version is immutable, so the exact bytes a run consumed — and where they came from — can be named after the fact.
    mitigations: [AML.M0025]
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-create-data-assets
    verified: "2026-10-30"
  - id: curationFilters
    name: Data-preparation components (Azure Machine Learning pipeline)
    where: Your curation pipeline — filtering components that call Azure AI Language PII detection and Azure AI Content Safety on each example
    setVia: [code]
    area: data
    default: Whatever the pipeline author runs
    recommended: Quality, safety and sensitive-content filters as required pipeline steps before a corpus version is registered
    why: A poisoned, harmful or restricted example is removed while it is still a deletion, not something the model has learned.
    mitigations: [AML.M0007]
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-ml-pipelines
    verified: "2026-10-30"
  - id: storageCmk
    name: Customer-managed keys for Azure Storage encryption
    where: Storage account › Encryption — key held in Key Vault
    setVia: [cloudPolicy, apiCli]
    area: data
    default: Microsoft-managed keys
    recommended: A customer-managed key in Key Vault on the dataset and model storage accounts
    why: The organisation can revoke the key and with it every read of the corpus and the checkpoints, independent of any role assignment.
    mitigations: [AML.M0012]
    url: https://learn.microsoft.com/en-us/azure/storage/common/customer-managed-keys-overview
    verified: "2026-10-30"
  - id: amlModelFromJob
    name: Register a model from a job output (azureml://jobs)
    where: Azure Machine Learning studio › Models › Register, from a job output; or az ml model create --path azureml://jobs/...
    setVia: [apiCli, code]
    area: data
    recommended: Every candidate registered from the run that produced it, never from a local file
    why: The registered model carries its lineage to the job — and through it the data asset versions, code and environment — so a discovered poisoning can be scoped.
    mitigations: [AML.M0023]
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-models
    verified: "2026-10-30"
  - id: amlModelTags
    name: Model description and tags (tags.stage)
    where: Azure Machine Learning registry › Models › (version) — the only mutable properties of a model version
    setVia: [apiCli, code]
    area: data
    recommended: Description and a model-card link on every version; tags.stage moved to Prod only by the promotion pipeline
    why: What the artifact is, what it was trained on and whether it was approved travel with it in the registry, not in someone's notes.
    mitigations: [cap-model-documentation]
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-models
    verified: "2026-10-30"
  - id: a2aPayloadRedaction
    name: PII redaction on A2A payloads (send-request to Azure AI Language)
    where: API Management › A2A agent APIs › policies — send-request to PII detection on each outbound task and each artifact we return
    setVia: [cloudPolicy, code]
    area: data
    default: Payloads cross unchanged
    recommended: Redact on every payload that leaves for a peer, vendor or partner alike
    why: Personal data in a delegated task or a returned artifact is removed at the boundary, not trusted to the peer's handling.
    mitigations: [cap-sensitive-data-redaction]
    url: https://learn.microsoft.com/en-us/azure/api-management/send-request-policy
    verified: "2026-10-30"

  # --- Tools & extensions --------------------------------------------------------------
  - id: apimContentSafety
    name: llm-content-safety policy with shield-prompt
    where: API Management › model APIs › Inbound processing
    setVia: [cloudPolicy]
    area: tools
    default: No policy
    recommended: shield-prompt="true" on every model API
    why: Prompt Shields screen each request for jailbreak and injected instructions at the gateway, before the model sees it.
    mitigations: [cap-input-guardrails]
    url: https://learn.microsoft.com/en-us/azure/api-management/llm-content-safety-policy
    verified: "2026-10-30"
  - id: apimTokenLimit
    name: llm-token-limit policy
    where: API Management › model APIs › Inbound processing
    setVia: [cloudPolicy]
    area: tools
    default: No limit
    recommended: Tokens-per-minute and a token quota per subscription
    why: A looping turn hits a ceiling at the gateway before it runs up cost or volume.
    mitigations: [AML.M0036]
    url: https://learn.microsoft.com/en-us/azure/api-management/llm-token-limit-policy
    verified: "2026-10-30"
  - id: apimMcpServers
    name: MCP servers in API Management
    where: API Management › MCP servers
    setVia: [cloudPolicy]
    area: tools
    default: Agents call MCP servers directly
    recommended: Every MCP server exposed only through API Management, with authentication and per-tool policies
    why: Each tool call crosses one gateway that authenticates it, applies policy and logs it — no direct path from agent to server.
    mitigations: [cap-mcp-tool-integrity, cap-agent-action-policy-enforcement]
    url: https://learn.microsoft.com/en-us/azure/api-management/mcp-server-overview
    verified: "2026-10-30"
  - id: apiCenterInventory
    name: MCP server inventory in API Center
    where: Azure API Center › Inventory
    setVia: [adminConsole]
    area: tools
    default: Not registered
    recommended: Every MCP server and API the agent can call, registered with an owner
    why: The list of tools an agent may be given is a governed registry, not whatever someone wired in.
    mitigations: [cap-agent-tool-registry]
    url: https://learn.microsoft.com/en-us/azure/api-center/register-discover-mcp-server
    verified: "2026-10-30"
  - id: agentToolApproval
    name: Tool Approval (human in the loop)
    where: Your agent code — Microsoft Agent Framework tool approval on write tools
    setVia: [code]
    area: tools
    default: Tools run without approval
    recommended: Approval required on every tool that writes to a system of record
    why: A person confirms each consequential action in the conversation before it happens.
    mitigations: [AML.M0029]
    url: https://learn.microsoft.com/en-us/agent-framework/agents/tools/
    verified: "2026-10-30"
  - id: agentOperatorApproval
    name: ApprovalRequiredAIFunction (human-in-the-loop approval)
    where: Your agent code — the approval request is routed to an operator work queue and the session resumes on the answer
    setVia: [code]
    area: tools
    default: Tools run without approval
    recommended: Wrapped around every action above the value or irreversibility threshold; the approver is an operator, never the requester
    why: A consequential write waits for someone other than its beneficiary; below the threshold the action's compensating transaction, not review, is the safety net.
    mitigations: [AML.M0029]
    url: https://learn.microsoft.com/en-us/agent-framework/agents/tools/tool-approval
    verified: "2026-10-30"
  - id: workflowRequestPort
    name: Human-in-the-loop request and response (RequestPort)
    where: Your workflow code — Agent Framework workflow, made durable with the Durable Extension
    setVia: [code]
    area: tools
    default: Steps run without approval
    recommended: A request port in front of every consequential write; the step suspends and resumes only on the operator's response to that request
    why: The approval is bound to the exact pending step and its checkpointed state, so a step resumed days later cannot run a different action than the one approved.
    mitigations: [AML.M0029]
    url: https://learn.microsoft.com/en-us/agent-framework/workflows/human-in-the-loop
    verified: "2026-10-30"
  - id: outputSanitisation
    name: Sanitise rendered model output
    where: Your front-end code
    setVia: [code]
    area: tools
    default: Depends on your renderer
    recommended: Render as text or sanitised markdown; strip HTML, block external images, set a Content Security Policy
    why: A model-written image link or script cannot carry the conversation to an attacker the moment it renders.
    mitigations: [cap-output-encoding]
    url: https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
    verified: "2026-10-30"
  - id: sessionPoolEgress
    name: Session pool network status
    where: Container Apps session pool › --network-status
    setVia: [cloudPolicy, apiCli]
    area: tools
    default: EgressDisabled
    recommended: EgressDisabled
    why: Code the agent writes runs in a Hyper-V-isolated session with no outbound network, so it cannot fetch or send anything.
    mitigations: [D3-EI, cap-agent-egress-control]
    url: https://learn.microsoft.com/en-us/azure/container-apps/session-pool
    verified: "2026-10-30"
  - id: containerAppsTrafficSplit
    name: Multiple revision mode with traffic splitting
    where: Container Apps › (agent app) › Revisions and replicas
    setVia: [cloudPolicy, apiCli]
    area: tools
    default: Single revision mode (all traffic to the latest)
    recommended: Multiple revision mode; a new agent, prompt or model revision takes a small share of traffic after its evaluation passes
    why: A change that behaves badly reaches a few users and rolls back by moving traffic, not by redeploying.
    mitigations: [cap-staged-rollout-gate]
    url: https://learn.microsoft.com/en-us/azure/container-apps/traffic-splitting
    verified: "2026-10-30"
  - id: artifactsUpstream
    name: Azure Artifacts upstream sources (externally sourced versions blocked)
    where: Azure Artifacts › (feed) › Upstream sources; package upstream behavior
    setVia: [adminConsole]
    area: tools
    default: External versions blocked once a package has an internal version
    recommended: Keep the default; packages enter the feed from approved upstreams only
    why: The agent's tools install from your feed, and a public package cannot shadow an internal one.
    mitigations: [D3-FA]
    url: https://learn.microsoft.com/en-us/azure/devops/artifacts/concepts/upstream-behavior
    verified: "2026-10-30"
  - id: apimRateLimitByKey
    name: rate-limit-by-key policy
    where: API Management › MCP servers › Inbound processing
    setVia: [cloudPolicy]
    area: tools
    default: No limit
    recommended: Per-client and per-tenant counters (counter-key on the token's appid and tid), sized for callers that retry and parallelise
    why: One looping or hostile client hits its own ceiling at the gateway instead of exhausting the server for every tenant.
    mitigations: [AML.M0004]
    url: https://learn.microsoft.com/en-us/azure/api-management/rate-limit-by-key-policy
    verified: "2026-10-30"
  - id: toolDefinitionPinning
    name: Pin tool definitions to a reviewed version
    where: Your server's loader — definitions shipped with the release and checked against the hash recorded at review
    setVia: [code]
    area: tools
    default: No integrity check in the protocol
    recommended: Refuse to serve any definition whose hash differs from the reviewed release; a wording change goes through the release gate
    why: A description edited outside the pipeline never reaches a caller's model, so the server cannot be turned into a tool-poisoning vector.
    mitigations: [cap-mcp-tool-integrity]
    url: https://microsoft.github.io/mcp-azure-security-guide/mcp/mcp03-tool-poisoning/
    verified: "2026-10-30"
  - id: ghazdoCodeScanning
    name: Code scanning (GitHub Advanced Security for Azure DevOps)
    where: Azure DevOps › Project settings › Repos › Repositories › (repo) › Advanced Security; code scanning default setup or CodeQL pipeline tasks
    setVia: [adminConsole, configFile]
    area: tools
    default: "Off"
    recommended: On for every repository that ships the server, with high-severity alerts blocking the release
    why: The handlers behind the protocol are tested like any published application before they serve callers.
    mitigations: [D3-SYSVA]
    requires: GitHub Advanced Security for Azure DevOps, or GitHub Code Security for Azure DevOps
    url: https://learn.microsoft.com/en-us/azure/devops/repos/security/github-advanced-security-code-scanning
    verified: "2026-10-30"
  - id: ghazdoDependencyScanning
    name: Dependency scanning (GitHub Advanced Security for Azure DevOps)
    where: Azure DevOps › repository dependency scanning default setup, or the AdvancedSecurity-Dependency-Scanning@1 pipeline task
    setVia: [adminConsole, configFile]
    area: tools
    default: "Off"
    recommended: On for every repository that ships the service, alerts triaged by exposure
    why: The SDK and every dependency are enumerated against vulnerability advisories, so an advisory maps to the release it affects.
    mitigations: [D3-AVE]
    requires: GitHub Advanced Security for Azure DevOps, or GitHub Code Security for Azure DevOps
    url: https://learn.microsoft.com/en-us/azure/devops/repos/security/github-advanced-security-dependency-scanning
    verified: "2026-10-30"
  - id: apimContentSafetyCompletions
    name: llm-content-safety policy with enforce-on-completions
    where: API Management › model APIs › Inbound processing
    setVia: [cloudPolicy]
    area: tools
    default: No policy
    recommended: enforce-on-completions="true" on every model API with no provider-side content filter
    why: With open weights and no provider applying policy, the gateway checks completions as well as prompts and blocks harmful output before it is returned.
    mitigations: [cap-output-guardrails]
    url: https://learn.microsoft.com/en-us/azure/api-management/llm-content-safety-policy
    verified: "2026-10-30"
  - id: apimWeightedPool
    name: Load-balanced pool — Weighted
    where: API Management › Backends › (pool); the model API routes to the pool
    setVia: [cloudPolicy, apiCli]
    area: tools
    default: One backend
    recommended: The new model version's backend takes a small weight after its evaluation passes; the previous version stays in the pool
    why: A new checkpoint serves a slice of traffic before everyone, and rollback is a weight change rather than a re-download.
    mitigations: [cap-staged-rollout-gate]
    url: https://learn.microsoft.com/en-us/azure/api-management/backends
    verified: "2026-10-30"
  - id: vllmRuntimeLora
    name: VLLM_ALLOW_RUNTIME_LORA_UPDATING
    where: vLLM server environment, in the serving deployment
    setVia: [configFile]
    area: tools
    default: Not set (runtime adapter loading off)
    recommended: Not set; adapters load only from a promoted release at start-up
    why: Nobody who can reach the server can load an adapter that changes the model's behaviour through /v1/load_lora_adapter.
    mitigations: [D3-ACH]
    url: https://docs.vllm.ai/en/stable/usage/security/
    verified: "2026-10-30"
  - id: vllmCacheSalt
    name: cache_salt (set per tenant at the gateway)
    where: API Management set-body policy on the model API — overwrites any cache_salt the caller sent
    setVia: [cloudPolicy, code]
    area: tools
    default: No salt (all requests share cached prefixes)
    recommended: A secret per tenant, derived at the gateway from the caller's identity
    why: Only requests from the same tenant can share prefix-cache blocks, closing the cache-timing path to another tenant's prompts.
    mitigations: [D3-ACH]
    url: https://docs.vllm.ai/en/stable/usage/security/
    verified: "2026-10-30"
  - id: aksGpuNodeTaints
    name: Node taints on dedicated GPU node pools
    where: AKS › az aks nodepool add --node-taints; tolerations on each tier's serving workload
    setVia: [apiCli, configFile]
    area: tools
    default: Pods can share any node
    recommended: A separate GPU node pool per sensitivity tier, tainted NoSchedule, so a tier's models run only on its own VMs and GPUs
    why: Tiers that must not share memory never share a host or an accelerator — the separation is the VM boundary, not the scheduler's goodwill.
    mitigations: [D3-HBPI]
    url: https://learn.microsoft.com/en-us/azure/aks/use-node-taints
    verified: "2026-10-30"
  - id: defenderContainerVa
    name: Container vulnerability assessment (Defender for Containers)
    where: Microsoft Defender for Cloud › Environment settings › Defender for Containers; registry and runtime scanning
    setVia: [cloudPolicy]
    area: tools
    default: "Off"
    recommended: On for the registry and every cluster that runs serving or training images
    why: The serving stack's known vulnerabilities are mapped to the images actually running, so each advisory points at the instances it affects.
    mitigations: [D3-AVE]
    requires: Microsoft Defender for Containers (or Defender CSPM for supported scenarios)
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/agentless-vulnerability-assessment-azure
    verified: "2026-10-30"
  - id: foundryRedTeaming
    name: AI Red Teaming Agent (Microsoft Foundry)
    where: Foundry SDK or portal, run against the candidate deployed to an isolated evaluation endpoint
    setVia: [apiCli, code]
    area: tools
    default: Not run
    recommended: Run on every candidate before promotion, its attack success rate a blocking threshold beside your capability, backdoor and memorisation tests
    why: A candidate that a fine-tune made unsafe fails the gate before it is signed, not after it serves.
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/ai-red-teaming-agent
    mitigations: [AML.M0008]
    verified: "2026-10-30"
  - id: aksPodSandboxing
    name: Pod Sandboxing (Kata Containers)
    where: AKS Azure Linux node pool with the Kata workload runtime; runtimeClassName on each untrusted pod
    setVia: [apiCli, configFile]
    area: tools
    default: Pods share the host kernel
    recommended: Every pod that runs model-generated code uses the Kata runtime class, one pod per task, deleted after
    why: Generated code runs in a lightweight VM with its own guest kernel, so a container escape lands in that VM rather than on the host or beside other pods.
    mitigations: [D3-EI]
    url: https://learn.microsoft.com/en-us/azure/aks/use-pod-sandboxing
    verified: "2026-10-30"
  - id: artifactsFeedReader
    name: Feed Reader (feed permission)
    where: Azure Artifacts › (feed) › Feed settings › Permissions
    setVia: [adminConsole]
    area: tools
    default: Build services hold Feed and Upstream Reader (Collaborator)
    recommended: Feed Reader for every rollout and agent identity; only the admission pipeline saves packages from upstream
    why: A rollout can install what was admitted but cannot write to the feed or make it fetch a new package from upstream — the cache cannot become a channel or a proxy.
    mitigations: [AML.M0028]
    url: https://learn.microsoft.com/en-us/azure/devops/artifacts/feeds/feed-permissions
    verified: "2026-10-30"
  - id: containmentPenTest
    name: Containment red teaming (penetration testing under the Rules of Engagement)
    where: Your pre-run security testing — agents attack the sandbox, the cluster network and the platform services
    setVia: [code]
    area: tools
    default: Not run
    recommended: Before every run that changes the sandbox, tools or egress list; findings block the run until fixed
    why: Escape routes through the sandbox, the host network and shared services are found by testing them, not assumed closed.
    mitigations: [D3-SYSVA]
    url: https://learn.microsoft.com/en-us/azure/security/fundamentals/pen-testing
    verified: "2026-10-30"
  - id: apimA2aApis
    name: A2A agent APIs in API Management
    where: API Management › APIs › + Add API › A2A Agent; per-skill policies on each operation
    setVia: [cloudPolicy]
    area: tools
    default: Agents call peers directly
    recommended: Our published agent and every peer we call imported as A2A agent APIs, with token validation and per-skill authorization on each
    why: Every task in either direction crosses one gateway that authenticates the peer, authorizes the skill and logs the call — the authorization A2A leaves to us.
    mitigations: [cap-agent-action-policy-enforcement]
    url: https://learn.microsoft.com/en-us/azure/api-management/agent-to-agent-api
    verified: "2026-10-30"
  - id: apiCenterAgents
    name: Agent registration in API Center
    where: Azure API Center › Inventory › Assets › + Register an asset › Agent (from the agent card JSON)
    setVia: [adminConsole, apiCli]
    area: tools
    default: Not registered
    recommended: Every admitted peer agent and every agent we publish registered from its reviewed card, with an owner
    why: An agent that is not in the registry is not a peer — the list of who our agent may delegate to is governed, not discovered.
    mitigations: [cap-agent-tool-registry]
    url: https://learn.microsoft.com/en-us/azure/api-center/register-manage-agents
    verified: "2026-10-30"
  - id: agentCardPinning
    name: Agent cards from your registry (AgentCard.AsAIAgent)
    where: Your agent code — build each peer client from the card held in the registry, after verifying its signature and hash
    setVia: [code]
    area: tools
    default: Card fetched live with A2ACardResolver
    recommended: Never resolve a peer's card live in production; a changed card is re-reviewed before the registry entry changes
    why: A peer that alters its card — new skills, new endpoint, new security scheme — is not trusted until someone has decided to trust the change.
    mitigations: [cap-mcp-tool-integrity]
    url: https://learn.microsoft.com/en-us/agent-framework/integrations/by-component/agent-services/a2a
    verified: "2026-10-30"
  - id: apimQuotaByKey
    name: quota-by-key policy
    where: API Management › A2A agent APIs › Inbound processing; forward-request timeout on the backend call
    setVia: [cloudPolicy]
    area: tools
    default: No quota
    recommended: Call and bandwidth quotas per peer and per task, with a timeout on every streamed task
    why: One partner task that retries, fans out or streams without end hits its own ceiling instead of our budget.
    mitigations: [AML.M0036]
    url: https://learn.microsoft.com/en-us/azure/api-management/quota-by-key-policy
    verified: "2026-10-30"

  # --- Network -------------------------------------------------------------------------
  - id: firewallEgress
    name: Azure Firewall application rules (via user-defined routes)
    where: Container Apps environment subnet route table → Azure Firewall › Application rules
    setVia: [cloudPolicy]
    area: network
    default: Direct outbound internet
    recommended: All outbound from the agent subnet through Azure Firewall, with an FQDN allowlist
    why: The agent and its tools reach only the hosts you list; anything else is dropped and logged.
    mitigations: [cap-agent-egress-control]
    url: https://learn.microsoft.com/en-us/azure/container-apps/use-azure-firewall
    verified: "2026-10-30"
  - id: foundryPublicNetworkAccess
    name: Public network access
    where: Foundry, Azure AI Search and Azure Cosmos DB › Networking
    setVia: [cloudPolicy]
    area: network
    default: Enabled
    recommended: Disabled, private endpoints only
    why: The model, the index and the memory store are reachable only from your virtual network, not from the internet.
    mitigations: []
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/configure-private-link
    verified: "2026-10-30"
  - id: wafRateLimit
    name: WAF rate limit rule
    where: Azure Front Door or Application Gateway WAF policy › Custom rules
    setVia: [cloudPolicy]
    area: network
    default: No rate limit
    recommended: Per-client rate limit on the chat endpoint
    why: A runaway client or scripted abuse is throttled at the edge, before it spends tokens or triggers actions.
    mitigations: [AML.M0004]
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/afds/waf-front-door-rate-limit
    verified: "2026-10-30"
  - id: appServiceRouteAll
    name: outboundVnetRouting.allTraffic
    where: App Service › Networking › Virtual network integration; set with the Azure CLI, subnet routed to Azure Firewall
    setVia: [cloudPolicy, apiCli]
    area: network
    default: Application traffic uses the default route
    recommended: "true, with the integration subnet's route table sending outbound traffic through Azure Firewall"
    why: Every outbound call the server makes leaves through the firewall's allowlist, so a handler or fetch steered to an internal or metadata address is dropped.
    mitigations: [D3-OTF]
    url: https://learn.microsoft.com/en-us/azure/app-service/configure-vnet-integration-routing
    verified: "2026-10-30"
  - id: aksNetworkPolicy
    name: Network policy engine (Azure CNI Powered by Cilium)
    where: AKS cluster network profile; a default-deny Kubernetes network policy in each serving or training namespace
    setVia: [cloudPolicy, configFile]
    area: network
    default: All pods can send and receive traffic without limitations
    recommended: Cilium, with default deny; only the gateway reaches the serving pods, and inter-node serving traffic stays inside the namespace
    why: The serving plane's unauthenticated job and inter-node channels are reachable from nothing else in the cluster.
    mitigations: [D3-NI]
    url: https://learn.microsoft.com/en-us/azure/aks/use-network-policies
    verified: "2026-10-30"
  - id: amlManagedNetwork
    name: Managed virtual network isolation mode
    where: Azure Machine Learning workspace › Networking › Workspace managed outbound access
    setVia: [cloudPolicy, apiCli]
    area: network
    recommended: Allow only approved outbound (Private with Approved Outbound in the portal), with the package mirror and the dataset and model storage as the only added rules
    why: The training job can reach the stores it needs and nothing else, so a compromised dependency or a run holding the corpus has no route out.
    mitigations: [D3-NI]
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-managed-network
    verified: "2026-10-30"
  - id: aksFqdnFiltering
    name: FQDN filtering (Advanced Container Networking Services)
    where: AKS with Azure CNI Powered by Cilium and Advanced Container Networking Services; a Cilium network policy listing the allowed FQDNs
    setVia: [cloudPolicy, configFile]
    area: network
    default: All pods can send and receive traffic without limitations
    recommended: The offline web, the package feed and the platform services as the rollout's whole list; every other DNS request refused
    why: DNS requests are checked against the policy before they are answered, so a rollout cannot resolve — or tunnel through — a name that is not on its list.
    mitigations: [cap-agent-egress-control]
    requires: Advanced Container Networking Services
    url: https://learn.microsoft.com/en-us/azure/aks/container-network-security-fqdn-filtering-concepts
    verified: "2026-10-30"

  # --- Audit & monitoring --------------------------------------------------------------
  - id: appInsightsOtel
    name: Azure Monitor OpenTelemetry (Application Insights)
    where: Agent code with the Azure Monitor OpenTelemetry Distro; Log Analytics workspace connected to Microsoft Sentinel
    setVia: [code, cloudPolicy]
    area: audit
    default: Not instrumented
    recommended: On, tracing every agent turn and tool call, exported to Log Analytics and Sentinel
    why: Each tool call, its arguments and its result are traceable per user and conversation when something goes wrong.
    mitigations: [cap-agent-tracing]
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/opentelemetry-enable
    verified: "2026-10-30"
  - id: apimSubscriptionState
    name: Subscription state (suspend)
    where: API Management › Subscriptions › (agent's subscription)
    setVia: [cloudPolicy, apiCli]
    area: audit
    default: Active
    recommended: Active, with suspend as the first step of your incident runbook
    why: Suspending the agent's subscription cuts its model and tool access at the gateway at once, without redeploying anything.
    mitigations: [cap-agent-kill-switch]
    url: https://learn.microsoft.com/en-us/azure/api-management/api-management-subscriptions
    verified: "2026-10-30"
  - id: dtsTerminate
    name: Terminate orchestration instances
    where: Durable Task client API (DurableTaskClient), or the Durable Task Scheduler dashboard
    setVia: [apiCli, code]
    area: audit
    default: Runs continue until they complete
    recommended: A runbook step that queries the workflow's running and suspended instances and terminates each, with a reason
    why: The stop reaches a workflow parked on a timer or an approval for days, not only one that is executing now.
    mitigations: [cap-agent-kill-switch]
    url: https://learn.microsoft.com/en-us/azure/durable-task/common/durable-task-instance-management
    verified: "2026-10-30"
  - id: entraAgentDisable
    name: Disable agent identity
    where: Microsoft Entra admin center › Entra ID › Agents › Agent identities (or Agent blueprints) › Disable
    setVia: [identityProvider]
    area: audit
    default: Enabled
    recommended: Enabled, with Disable as an incident-runbook step held by Agent ID Administrators
    why: A disabled agent identity receives no new tokens, so one agent is cut off without touching the others or redeploying.
    mitigations: [cap-agent-kill-switch]
    url: https://learn.microsoft.com/en-us/entra/agent-id/disable-agent-identities
    verified: "2026-10-30"
  - id: apimGatewayLogs
    name: Diagnostic setting — Logs related to ApiManagement Gateway
    where: API Management › Monitoring › Diagnostic settings; resource-specific ApiManagementGatewayLogs table in Log Analytics
    setVia: [cloudPolicy]
    area: audit
    default: Not collected
    recommended: On, sent to the Log Analytics workspace connected to Microsoft Sentinel, with the generative AI gateway logs where model APIs pass through
    why: Every call through the gateway is recorded with its caller and operation, where an incident can query it.
    mitigations: [AML.M0024]
    url: https://learn.microsoft.com/en-us/azure/api-management/monitor-api-management
    verified: "2026-10-30"
  - id: aksContainerLogs
    name: Container log collection (Azure Monitor)
    where: AKS › Monitoring — Azure Monitor agent collecting stdout/stderr and Kubernetes events to a Log Analytics workspace
    setVia: [cloudPolicy]
    area: audit
    default: Not collected
    recommended: On for every sandbox node pool, to a workspace no rollout identity can read or write
    why: Trajectories and host telemetry leave the node as they happen, so a rollout that disables what it can touch cannot erase what was already shipped.
    mitigations: [cap-agent-tracing]
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/containers/kubernetes-monitoring-overview
    verified: "2026-10-30"
  - id: monitorAutoStop
    name: Alert rule with an action group (automated stop)
    where: Azure Monitor › Alerts › Action groups — an Azure Function or Automation Runbook that tells the orchestrator to halt the run
    setVia: [cloudPolicy, code]
    area: audit
    default: No automated action
    recommended: Serious-risk detections stop the run and cordon its node pool automatically; resuming is a person's decision
    why: The stop is enforced from outside every sandbox the moment a monitor fires, without waiting for someone to read the alert.
    mitigations: [cap-agent-kill-switch]
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/action-groups
    verified: "2026-10-30"
  - id: entraAppSignInDisable
    name: Enabled for users to sign-in?
    where: Microsoft Entra admin center › Enterprise applications › (peer platform or peer agent) › Properties
    setVia: [identityProvider]
    area: audit
    default: "Yes"
    recommended: Yes, with No as the first step of the peer cut-off runbook
    why: Setting it to No stops every new token for that application at once, so a peer is cut off in one action alongside dropping its registry entry.
    mitigations: [cap-agent-kill-switch]
    url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/disable-user-sign-in-portal
    verified: "2026-10-30"
  - id: mdaAppRiskScore
    name: Cloud app catalog risk score (Defender for Cloud Apps)
    where: Microsoft Defender portal › Cloud apps › Cloud app catalog › (peer platform)
    setVia: [adminConsole]
    area: sharing
    recommended: Reviewed for every peer platform before the agreement is signed, alongside the questions A2A leaves open — tenant isolation, card signing, audit export
    why: A peer is admitted on an assessment of how it handles our users' identity and data, not only on its card.
    mitigations: [cap-ai-vendor-assessment]
    requires: Microsoft Defender for Cloud Apps
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/risk-score
    verified: "2026-10-30"

implementations:
  - architecture: archChatAgent
    asOf: "2026-10"
    reference:
      - title: Baseline Microsoft Foundry chat reference architecture
        url: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/baseline-microsoft-foundry-chat
      - title: AI gateway capabilities in Azure API Management
        url: https://learn.microsoft.com/en-us/azure/api-management/genai-gateway-capabilities
    summary:
      - >-
        Your own agent on Azure Container Apps behind App Service, reaching models and tools through
        API Management, inside a virtual network whose outbound traffic leaves through Azure
        Firewall. Azure's baseline puts Foundry Agent Service in the harness's place; that managed
        runtime is the API/SDK managed agent runtime drawing, so this one keeps the loop in your code.
    bindings:
      - { block: entry, service: App Service behind Application Gateway with WAF }
      - { block: events, service: Azure Functions with Event Grid triggers }
      - { block: agent, service: Your agent on Azure Container Apps (Microsoft Agent Framework), note: "Azure's baseline uses Foundry Agent Service here — the managed alternative." }
      - { block: localTools, service: Container Apps dynamic sessions (code interpreter) }
      - { block: memory, service: Azure Cosmos DB and Azure AI Search }
      - { block: gateway, service: Azure API Management (AI gateway) }
      - { block: provider, service: Azure OpenAI in Foundry Models }
      - { block: internalTools, service: Your MCP servers and APIs, exposed through API Management }
      - { block: orgData, service: Your systems of record, build: true, note: "Azure SQL, Blob Storage, SharePoint — whatever the tools act on." }
      - { block: openWeb, service: Grounding with Bing Search }
      - { block: sources, service: "Public registries (PyPI, npm)" }
      - { block: registry, service: Azure Artifacts feed }
    settings:
      - entraAssignmentRequired
      - appServiceRequireAuth
      - agentManagedIdentity
      - foundryDisableLocalAuth
      - apimValidateToken
      - apimCredentialManager
      - cosmosConversationTtl
      - searchDocumentAccess
      - groundednessDetection
      - piiRedaction
