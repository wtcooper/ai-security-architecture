      - mitigation: D3-OTF
        coverage: external
        mechanism: >-
          None in the product — no tenant-restriction header and no destination policy for the tunnel host;
          the organisation's egress firewall or proxy enforces, reached through tunnel-client's explicit proxy
          settings
        evidence:
          - title: Secure MCP Tunnel — Network requirements (checked 2026-09-25)
            url: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels
          - title: tunnel-client configuration — Outbound HTTP proxy
            url: https://github.com/openai/tunnel-client/blob/master/docs/configuration.md
          - title: tunnel-client — bundled Cloudflare Tunnel companion
            url: https://github.com/openai/tunnel-client/blob/master/docs/deployment/cloudflared.md
        note: >-
          External by the drawing rule: there is no tenant-restriction header, so the network layer is the only
          lever. The pin's browser objective is toolChatgptDesktop's. On the tunnel host — the one workload on
          this path that runs in our network, so our proxy does control its egress — the guide lists the only
          destinations: api.openai.com:443 (mtls.api.openai.com:443 with control-plane mTLS) on /v1/tunnel/*,
          plus the configured MCP server, with nothing inbound. tunnel-client enforces no destination list of
          its own and cannot be pinned to the corporate organisation, so a host holding a personal Platform
          organisation's runtime key (the guide supports personal organisations) exposes a private server
          through the same allowed hostname. Integration point: --control-plane.http-proxy, --mcp.http-proxy,
          --harpoon.http-proxy or the global --http-proxy, with --ca-bundle; an explicit proxy flag ignores
          HTTP(S)_PROXY and NO_PROXY for that target. The repository's Cloudflare flavor supervises a bundled
          cloudflared whose connection to Cloudflare is not in the guide's network table. Where requests can
          land inside our network (configured bindings, labelled Harpoon targets) is credited under AML.M0028.
        verified: "2026-09-25"
