      - mitigation: D3-APA
        coverage: unknown
        mechanism: >-
          Authentication of end users happens at your gateway; the agent receives pre-authenticated requests.
          Claude Console roles and SSO govern who can mint API keys; Retrieval runs with whatever filesystem
          mounts and MCP credentials the deployer grants
        steps:
          - title: Put user authentication in front of the agent
            body:
              - The hosting guide says the agent should not be the component that validates user tokens;
                terminate auth at a gateway and pass identity as resource attributes.
            url: https://code.claude.com/docs/en/agent-sdk/hosting
          - title: Control who can create API keys
            body:
              - Use Console roles (Claude Code role can only create Claude Code keys) and Console SSO for the
                humans who provision credentials.
            url: https://code.claude.com/docs/en/authentication
          - title: Mount only what the task needs
            body:
              - Mount code read-only, give each session its own cwd, and use per-tenant MCP credentials so
                retrieval runs as the requesting user.
            url: https://code.claude.com/docs/en/agent-sdk/secure-deployment
        evidence: []
        note: >-
          Capability scope changed: reassess this function. Retained configuration and evidence describe the
          former capability, not verified coverage of every replacement.


