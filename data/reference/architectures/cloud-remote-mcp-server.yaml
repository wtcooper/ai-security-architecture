id: archRemoteMcpServer
surface: surfaceCloud
rank: 4
title: Remote MCP server you publish
abbrev: Remote MCP server

summary:
  - >
    A tool server operated as a service for other people's agents: an OAuth resource server
    whose clients are language models. The scopes, the tenancy and the tool descriptions are all
    your design decisions — and the descriptions execute as instruction inside somebody else's
    model.

description:
  - >
    The inversion is what makes this its own architecture. Every other cloud archetype here
    calls tools; this one is the tool. The caller is an autonomous agent acting for a user, the
    arguments were produced by a model, and the tool descriptions this server publishes become
    instructions inside that model's context. A poorly worded description causes misuse; a
    deliberately worded one is an attack on the caller. Publishing a server means treating
    changes to descriptions and error messages with the seriousness of an API contract change.
  - >
    Authorization is the second inversion. Standard OAuth answers "may this client act for this
    user", and here that is necessary and not sufficient: the client is an agent that may have
    been steered by content it read elsewhere. Scopes therefore need to be narrow enough that a
    hijacked agent's blast radius is bounded, and consequential operations need confirmation
    semantics the protocol can express, rather than relying on the client to prompt its user.
    In an enterprise deployment the identity work is federated rather than invented: the user
    signs in at the IdP the organisation already governs, an identity assertion is exchanged
    for an audience-bound token, and admin policy and revocation stay where the organisation
    already enforces them. Client registration is pre-arranged or metadata-document based —
    the self-service dynamic registration of the early protocol is deprecated.
  - >
    The deployment shape is deliberately conventional: a service edge in front terminating
    hostile machine traffic, one stateless application behind it, data and upstream systems
    behind that. The protocol is stateless by design — there are no sessions to bind, only
    server-minted state handles whose possession proves nothing — so the service scales
    horizontally like any web tier, and every request re-verifies authorization from the
    token. The ordinary multi-tenant disciplines apply with unusual force: every read and
    write checks both that the scope permits the operation and that the tenant on the token
    matches the tenant on the record; rate limits are sized for machine callers that retry,
    loop and parallelise; and results are bounded in size, because an oversized result is
    both a cost problem for the caller and a way to crowd their context window. There is no
    model anywhere in this service — every distinctive control follows from the client being
    one.
  - >
    The one rule with no exceptions is at the back: the caller's token never travels upstream.
    A handler that reaches another system does so as its own OAuth client, on a credential a
    secrets manager issued to this service — passing the inbound token onward is the confused
    deputy the protocol documents by name, and it turns one compromised agent into a
    multi-service problem.

distinguishedBy:
  - >
    Against a third-party MCP server you consume: opposite side of the same boundary. There the
    scopes are someone else's design and the work is admission and observation; here the scopes,
    the tenancy and the descriptions are all design decisions.
  - >
    Against an AI-augmented API backend: that one has AI inside it and a conventional client.
    This one has no AI inside it at all and a model as the client. The security work is entirely
    about the caller's nature.

exemplars:
  - name: Product MCP servers
    note: >
      SaaS vendors publishing remote tool servers for their own products so customer agents can
      act without a bespoke integration.
    asOf: "2026-08"
  - name: Internal MCP servers
    note: >
      The same pattern inside one organisation, exposing internal systems to internal agents.
      Same architecture, and the temptation to skip the authorization work is much stronger.
    asOf: "2026-08"
  - name: Gateway-fronted fleets
    note: >
      Organisations publishing many servers behind one API-management or MCP gateway tier, with
      identity, metering and audit centralised at the edge. The protocol's routing headers were
      designed for exactly this mediation.
    asOf: "2026-08"

blocks:
  - id: delegatingUser
    kind: actor
    title: Delegating user
    icon: person
    col: 0
    row: 0
    note: >
      The person the calling agent acts for, and the source of the authorization. Not present at
      call time, which is why consequential operations cannot rely on them being asked.

  - id: callingAgent
    kind: actor
    title: Calling agent
    icon: agent
    col: 0
    row: 1
    note: >
      Someone else's agent, with arguments composed by a model that may have read hostile
      content. A non-human caller that is neither a person nor a bot to block.

  - id: idp
    kind: external
    title: Enterprise IdP
    col: 1
    row: 0
    note: >
      The identity provider the consuming organisation already governs. Users sign in here, and
      an identity assertion is exchanged for an audience-bound token — so admin policy,
      workforce lifecycle and revocation stay in the one place the organisation already
      enforces them, instead of being reinvented per server.
    items:
      - id: sso
        label: SSO & policy
        icon: person
        note: The sign-in and the admin policy every delegated grant traces back to.
      - id: tokenExchange
        label: Token exchange
        icon: key
        note: >
          The identity assertion swapped for a token bound to this server's authorization
          server — the enterprise-managed authorization profile, standardised so it works the
          same across servers.

  - id: authServer
    kind: service
    title: Authorization server
    col: 2
    row: 0
    note: >
      Issues scoped, expiring, audience-restricted tokens to named clients. The one place a
      compromised agent's access can be withdrawn without redeploying anything.
    items:
      - id: issuance
        label: Token issuance
        icon: key
        note: >
          Short-lived and audience-restricted — a token other resource servers accept turns one
          compromised agent into a multi-service problem.
      - id: registration
        label: Client registration
        icon: gear
        note: >
          Pre-registered clients or client-ID metadata documents. The early protocol's
          self-service dynamic registration is deprecated — anonymous clients were the cost.
      - id: consent
        label: Consent records
        icon: doc
        note: Which user authorised which client for which scopes, and when.

  - id: edge
    kind: service
    title: Service edge
    col: 1
    row: 1
    note: >
      The front door that terminates hostile machine traffic before the application sees it —
      an API gateway or MCP gateway tier. The protocol's routing headers exist so this tier can
      route, meter and rate-limit per tool without parsing request bodies.
    items:
      - id: waf
        label: WAF & DDoS
        icon: shield
        note: The commodity protections, in front because the callers are machines at machine rates.
      - id: rateLimits
        label: Rate limits & quotas
        icon: scale
        note: >
          Per-client and per-tenant, sized for callers that retry, loop and parallelise.
          Limits tuned for human clients are not limits here.
      - id: headerRouting
        label: Header routing
        icon: plug
        note: >
          Method and tool names ride request headers so the gateway can route and meter
          without reading bodies — mediation the current protocol was redesigned for.

  - id: service
    kind: service
    title: MCP service
    cosaiComponent: componentApplication
    col: 2
    row: 1
    note: >
      The application a team actually deploys: transport, tool router and handler code in one
      stateless service. Every request arrives self-contained and is re-authorized from the
      token — there is no session to inherit trust from.
    items:
      - id: endpoint
        label: Protocol endpoint
        icon: plug
        cosaiComponent: componentApplicationInputHandling
        note: >
          Streamable HTTP on a single POST endpoint, Origin validated, stateless by protocol
          design — which is what lets the tier scale horizontally.
      - id: stateHandles
        label: State handles
        icon: key
        note: >
          Server-minted names for cross-call state, bound to the token's subject and
          re-authorized on every request. Possession of a handle is not authentication.
      - id: handlers
        label: Tool handlers
        icon: code
        note: Execute with the request's brokered identity, never a standing service account.
      - id: argValidation
        label: Input validation
        icon: shield
        note: >
          Arguments arrive model-generated, so validation assumes plausible nonsense — and a
          handler that re-resolves the tenant from an argument is trusting a model to name it.

  - id: toolDefs
    kind: service
    title: Tool definitions
    col: 1
    row: 2
    cosaiComponent: componentTools
    note: >
      Names, descriptions and schemas — not documentation, but text the calling model treats as
      instruction. Changing them is changing somebody else's prompt.
    items:
      - id: descriptions
        label: Tool descriptions
        icon: doc
        note: Versioned, reviewed artifacts, because they execute inside another organisation's model.
      - id: schemas
        label: Input schemas
        icon: code
        note: The contract model-generated arguments are validated against.
      - id: confirmFlags
        label: Confirmation flags
        icon: shield
        note: >
          Operations marked as requiring the caller to confirm with its user. The server cannot
          enforce it; declaring it is the only lever it has.

  - id: tenantData
    kind: service
    title: Tenant data
    col: 3
    row: 1
    cosaiComponent: componentDataStorage
    note: >
      Per-tenant records the tools reach. Isolation here is the claim consuming organisations
      cannot verify and will ask about in assurance.
    items:
      - id: records
        label: Tenant records
        icon: db
        note: Every read and write checks the tenant on the token against the tenant on the record.
      - id: isolation
        label: Tenant isolation
        icon: shield
        note: A discipline across every handler, not one component's job.

  - id: downstream
    kind: external
    title: Downstream services
    cosaiComponent: componentDataSources
    col: 2
    row: 3
    note: >
      The systems the tools actually wrap — most published servers are a thin governed surface
      over existing APIs. Reached on the server's own credential, issued by a secrets manager,
      to named destinations only. The caller's token stops at the service.
    items:
      - id: apis
        label: Web & APIs
        icon: globe
        note: The internal and partner APIs the handlers call as this service, never as the caller.
      - id: saas
        label: SaaS
        icon: mail
        note: Vendor systems reached on standing service credentials the secrets manager scopes and rotates.

  - id: governance
    kind: governance
    title: Governance plane
    col: 4
    row: 0
    rowSpan: 3
    note: >
      Scope design, description review, registry listing, audit and revocation — the controls
      that decide a hijacked agent's blast radius long before any call arrives.
    items:
      - id: scopeCatalogue
        label: Scope catalogue
        icon: scale
        note: >
          What each scope permits. Coarse scopes are the difference between a hijacked agent
          doing one thing and doing everything the user could.
      - id: registryListing
        label: Registry listing
        icon: db
        note: >
          The server published to the registry or private subregistry clients are allowed to
          admit from, versions pinned — so consumers can detect a definition that quietly
          changed after approval.
      - id: descriptionReview
        label: Description review
        icon: doc
        note: >
          Tool text reviewed as a security artifact, because it executes in a caller's context.
          A benign-looking copy edit can change how thousands of agents behave.
      - id: callAudit
        label: Call audit
        icon: eye
        note: >
          Which client, for which user, called what with which arguments and what came back —
          with trace context propagated, because the protocol now carries it. Also the only way
          to answer a customer asking what their agent did here.
      - id: revocation
        label: Revocation & kill
        icon: stop
        note: Withdraw a client's tokens or disable a tool without redeploying the service.

edges:
  - from: delegatingUser
    to: idp
    path: primary
    label: SSO & consent
    note: >
      The user signs in where the organisation already governs identity, and consents to a
      named client with named scopes. The last point at which a human decides anything in this
      architecture — every subsequent call happens without them.
  - from: idp
    to: authServer
    path: external
    label: token exchange
    note: >
      The IdP's identity assertion is exchanged for a token audience-bound to this server.
      Central policy and revocation ride this edge — disable the user at the IdP and the
      delegation chain dies with them.
  - from: callingAgent
    to: edge
    path: primary
    bidir: true
    label: tool call / result
    note: >
      Model-composed arguments in; bounded results back into the caller's context window. The
      identity check cannot establish whether the agent was steered by content it read
      elsewhere.
  - from: edge
    to: service
    path: primary
    label: routed call
    note: >
      Routed and metered on the protocol's method and tool-name headers, throttled before the
      application spends anything on it.
  - from: authServer
    to: service
    path: primary
    label: token validation
    note: >
      Every request is validated against the issued token — client, user, scopes, audience,
      expiry — before it reaches a handler. The service re-verifies even when the edge
      pre-checks, because audience validation is this server's own obligation.
  - from: service
    to: tenantData
    path: primary
    bidir: true
    label: scoped read / write
    note: >
      Two checks on every operation: the scope permits it, and the tenant on the token matches
      the tenant on the record. Skipping the second is how cross-tenant access happens in
      practice.
  - from: service
    to: downstream
    path: external
    bidir: true
    label: server's own credential
    note: >
      The rule with no exceptions: the caller's token never travels upstream. Handlers call
      out as this service, on secrets-managed credentials, to named destinations only —
      egress anywhere else is an exfiltration path, not a feature.
  - from: toolDefs
    to: callingAgent
    path: external
    label: schema into caller's context
    note: >
      Tool text crossing into another organisation's model, where it executes as instruction.
      No authentication applies to what a description means.
  - from: governance
    to: authServer
    path: governance
    label: scope definitions
    note: >
      The scope catalogue is where a hijacked agent's blast radius is actually decided — long
      before any call arrives.
  - from: governance
    to: toolDefs
    path: governance
    label: description review
    note: >
      Because the text runs in someone else's model, editing it is closer to shipping an API
      change than to updating documentation.

pins:
  risks:
    - risk: riskPromptInjection
      at: toolDefs->callingAgent
      note: >
        This server is on the causing side. Its descriptions, errors and results all land in a
        caller's context, so its output hygiene is somebody else's input security.
    - risk: riskToolSourceProvenance
      at: toolDefs
      note: >
        Tool text treated as editable copy rather than a versioned artifact — a quiet edit
        changes how every consuming agent behaves.
    - risk: riskAgenticDelegationConfusedDeputy
      at: callingAgent->edge
      note: >
        The token proves a user consented; it cannot prove the agent still represents their
        intent. Scope design is the whole of the answer.
    - risk: riskStaleAgentIdentityBinding
      at: authServer
      note: >
        Long-lived or unrevocable tokens keep a decommissioned or compromised client alive.
        Expiry and revocation are the only levers after issuance.
    - risk: riskMCPTransportHijacking
      at: service
      note: >
        The stateless protocol renamed the threat, not the stakes: a state handle that is
        guessable, or honoured without re-checking the token it was minted for, hands one
        caller another's context and tenant.
    - risk: riskDenialOfMLService
      at: edge
      note: >
        Machine callers retry, loop and parallelise. Limits tuned for human clients are not
        limits here — and they belong in front of the application, not inside it.
    - risk: riskRogueActions
      at: service
      note: >
        Arguments are model-generated plausible nonsense, and the user is not present to be
        asked. Confirmation semantics are declared, not enforced, by this side.
    - risk: riskCrossTenantCredentialPropagation
      at: service->tenantData
      note: >
        Every read and write needs the tenant on the token checked against the tenant on the
        record. It is a discipline across all handlers, not one component's job.
    - risk: riskCrossTenantCredentialPropagation
      at: service->downstream
      note: >
        Passing the caller's token upstream is the confused deputy the protocol forbids by
        name — it converts one compromised agent into access at every system that accepts the
        token.
    - risk: riskSensitiveDataDisclosure
      at: service->tenantData
      note: >
        The read path carries the volume. A coarse scope plus a broad query returns everything
        the user could see, to an agent that may have been steered.
    - risk: riskInsecureModelOutput
      at: edge->callingAgent
      note: >
        Results enter the caller's context as content. An oversized or manipulative result is a
        denial-of-service against a model rather than a server.
    - risk: riskZombieShadowMCPServers
      at: governance
      note: >
        A server nobody listed, versioned or watches is still reachable and still trusted by
        every client that once admitted it. Registry listing and pinning are how consumers
        notice a change — or a corpse.

  capabilities:
    - capability: capabilityIga
      at: delegatingUser->idp
      note: >
        Bind consent to a named client and named scopes at the IdP the organisation already
        governs — the delegated grant every later call traces back to, revocable where the
        workforce already is.
    - capability: capabilityNhiManagement
      at: authServer
      note: >
        Named clients with short-lived, audience-restricted tokens and working revocation. The
        calling agent is a non-human identity you did not create but must manage.
    - capability: capabilityToolPermissionScoping
      at: governance->authServer
      note: >
        Design scopes narrow enough that a hijacked agent's blast radius is one operation, not
        everything the user could do.
    - capability: capabilityRateLimiting
      at: edge
      note: >
        Per-client and per-tenant limits sized for machine callers, with idempotency keys
        because agents retry — enforced at the edge on the protocol's routing headers.
    - capability: capabilityTransportSecurity
      at: service
      note: >
        TLS, Origin validation, and state handles bound to the authenticated subject with
        authorization re-verified per request — possession of a handle proves nothing.
    - capability: capabilityDataAccessGovernance
      at: service->tenantData
      note: >
        Enforce both checks on every operation: scope permits it, and token tenant matches
        record tenant — on reads as well as writes.
    - capability: capabilitySecretsManagement
      at: service->downstream
      note: >
        Upstream credentials issued by a secrets manager to this service, scoped and rotated —
        never embedded in configuration, and never the caller's token.
    - capability: capabilityEgressControl
      at: service->downstream
      note: >
        Handlers reach named upstreams and nothing else. Unbounded egress from a tool server
        is the exfiltration path a steered agent is looking for.
    - capability: capabilityMcpToolSecurity
      at: toolDefs
      note: >
        Treat definitions as versioned security artifacts: schema-pinned, change-controlled, and
        published with provenance callers can check.
    - capability: capabilityAiRedTeaming
      at: governance->toolDefs
      note: >
        Adversarially review descriptions and error text before release — the question is what a
        model will do with the words, not what a human reads into them.
    - capability: capabilityHitlControls
      at: service
      note: >
        Declare confirmation semantics on consequential tools so the caller must confirm with
        its user. Declaring it is the only lever this side of the boundary has.
    - capability: capabilityOutputEncoding
      at: edge->callingAgent
      note: >
        Bound result size and structure before it leaves — what returns becomes part of another
        organisation's prompt.
    - capability: capabilityAuditLogging
      at: governance
      note: >
        Record client, user, tool, arguments and result per call, with trace context — the
        trail that answers a customer asking what their agent did here.

scenarios:
  - title: A user authorises a client
    steps:
      - follow: delegatingUser->idp
        note: Consent happens at the IdP the organisation already governs. The last human decision in the flow.
      - follow: idp->authServer
        note: The identity assertion is exchanged for a token audience-bound to this server.
      - follow: callingAgent->edge
        note: The agent calls in with its scoped token; the user is no longer present.
      - follow: edge->service
        note: Routed and metered at the edge before the application spends anything.
      - follow: authServer->service
        note: Client, user, scopes, audience and expiry are validated per request.
      - follow: service->tenantData
        note: Scope check plus tenant-match check, on this and every subsequent operation.
  - title: A hijacked agent calls in
    steps:
      - follow: callingAgent->edge
        note: >
          The agent was steered by content it read elsewhere. Its token is valid, and the rate
          limits constrain the mechanics, not the intent.
      - follow: edge->service
        note: Every identity check passes; argument validation assumes plausible nonsense.
      - follow: service->tenantData
        note: The tenant check bounds reach to the one tenant; the scope bounds it to named operations.
      - follow: edge->callingAgent
        note: The blast radius was decided by scope design long before this call arrived.
  - title: A handler reaches upstream
    steps:
      - follow: callingAgent->edge
        note: The tool call arrives on the caller's audience-bound token.
      - follow: edge->service
        note: The handler runs with the request's brokered identity.
      - follow: service->downstream
        note: >
          The caller's token stops here. The handler calls upstream as this service, on a
          secrets-managed credential, to a named destination — nothing else is reachable.
  - title: A description edit ships
    steps:
      - follow: governance->toolDefs
        note: The edit is reviewed as an interface change — text a model will act on, not copy.
      - follow: toolDefs->callingAgent
        note: The new wording lands in every consuming agent's context on their next session.

deviations:
  - subject: The service is drawn as one application block, not protocol stages
    reason: >
      Transport, router and handlers deploy as one stateless service, so they are one block
      with items — the thing a team ships and scales. Tool definitions stay separate because
      they are a different artifact class: versioned content with a review pipeline, whose
      distinctive edge runs into the caller's context rather than through the service.
  - subject: An enterprise IdP is drawn even though the protocol does not require one
    reason: >
      The target state federates identity to the provider the organisation already governs —
      the standardised enterprise-managed authorization profile — because per-server identity
      silos are how revocation gets missed. A consumer-facing server without an enterprise IdP
      collapses this edge into the authorization server and keeps everything else.
  - subject: Sessions are gone because the protocol removed them
    reason: >
      The current protocol revision deleted sessions and the initialize handshake; cross-call
      state is explicit server-minted handles carried as arguments. The old session-hijacking
      risk is drawn as state-handle hijacking on the service instead.

