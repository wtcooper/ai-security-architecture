    vendor: "NVIDIA"
    asOf: "2026-11"
    status: mixed
    summary: "NVIDIA's suite on your own Kubernetes: NIM microservices run by the NIM Operator (Dynamo for distributed serving), models and containers from NGC, and the open-source NeMo Helix control plane for fine-tuning, evaluation with garak, guardrails and an inference gateway, with NeMo Curator, NeMo RL and Gym, and OpenShell for sandboxed agents. NVIDIA supports the licensed products; you run the cluster."
