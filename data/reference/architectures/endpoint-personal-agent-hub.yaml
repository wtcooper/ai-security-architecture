id: archPersonalAgentHub
surface: surfaceEndpoint
rank: 6
title: Personal agent — one door (spike B)
abbrev: Personal agent · hub

summary:
  - >
    Research preview, and the second half of an A/B. The same archetype and the same nine
    numbered flows as the zone-map spike, wired as a hub: one bundled enterprise crossing that
    every path goes through, including the messaging path, with the endpoint drawn as a single
    runtime rather than a set of parts.

description:
  - >
    The thesis is stronger here than in the zone map: if the organisation operates one gateway
    tier that already bundles model proxying, MCP brokerage and the skills plugin path, then
    the honest drawing is one door with everything radiating from it — messages inbound,
    inference and tool calls outbound, skills and images arriving on the same crossing. The
    endpoint keeps no path of its own to anything external.
  - >
    The endpoint is drawn coarse on purpose. The loop, the channel bridges, the heartbeat and
    the local tool surface are items of one runtime block, because at this altitude the
    question a reviewer asks is not how the harness is internally arranged but what leaves it
    and under whose authority. The parts the zone map draws separately are still named — they
    are items, and the risks pin to them through the runtime.
  - >
    Unsolicited senders are not drawn as an actor here. They are a property of the surfaces the
    owner already uses, carried as a risk pin and as the threats on flow F2. Whether that reads
    as an honest simplification or as the archetype's defining trait going missing is exactly
    what this variant is meant to test against its sibling.

distinguishedBy:
  - >
    Against the zone-map spike: same zones, same nine flows, opposite decomposition. That one
    draws the parts and the two separate ways out (relay for messaging, gateway for everything
    else); this one collapses the endpoint into a runtime and routes the messaging path through
    the gateway too, so the drawing has exactly one crossing to govern.
  - >
    Against the personal autonomous agent in the main grammar: same archetype, and this is the
    furthest departure — flows carry the design, zones carry the geometry, and the component
    count is deliberately low enough to read in one pass.

exemplars:
  - name: OpenClaw
    note: >
      The reference implementation, and the one whose gateway daemon most closely matches the
      single-runtime reading: one process owning bridges, loop, memory and scheduler.
    url: https://docs.openclaw.ai/concepts/architecture
    asOf: "2026-08"
  - name: Hermes Agent
    note: >
      An independent implementation whose relay pattern is already the hub shape — the endpoint
      dials one service, and that service is where policy can live.
    url: https://hermes-agent.nousresearch.com/docs/user-guide/security
    asOf: "2026-08"

zones:
  - id: zoneUser
    title: Owner surfaces
    owner: user
    note: Where the person is, and every surface they instruct the agent from.
  - id: zoneEndpoint
    title: Managed endpoint
    owner: endpoint
    note: The device and its sandbox — with no route of its own to anything outside.
  - id: zoneEnterprise
    title: Enterprise crossing
    owner: enterprise
    note: One bundled gateway and the control plane behind it. Everything passes here.
  - id: zoneExternal
    title: External
    owner: external
    note: Providers, tool servers and content nobody in this drawing operates.

blocks:
  - id: owner
    kind: actor
    title: Owner
    icon: person
    zone: zoneUser
    col: 0
    row: 0
    note: The person the agent acts for — authenticated by a messaging platform and, past that, by nothing.

  - id: remoteDevice
    kind: service
    title: Remote device
    cosaiComponent: componentAgentUserQuery
    zone: zoneUser
    col: 0
    row: 1
    note: >
      Every surface the owner instructs from — messaging apps, the control UI, the local
      terminal. These are also the surfaces an unbounded sender set can reach, which is this
      architecture's admission problem in one block.
    items:
      - id: messagingApps
        label: Messaging apps
        icon: chat
        note: >
          The owner's chat clients, and the path anyone the platform admits uses to address
          the agent.
      - id: controlUi
        label: Control UI
        icon: globe
        note: The gateway's dashboard, and a documented token-exfiltration surface.

  - id: gateway
    kind: service
    title: AI gateway
    zone: zoneEnterprise
    col: 2
    row: 1
    note: >
      The one door. This organisation's bundled tier fronts model inference, MCP and tool
      brokerage, the skills plugin path and the messaging relay together — so every flow in
      this architecture, inbound or outbound, is a flow through a component the organisation
      runs and can change.
    items:
      - id: relay
        label: Messaging relay
        icon: chat
        note: Outbound-only; platform credentials stay here and the endpoint never listens.
      - id: llmProxy
        label: Model proxy
        icon: model
        note: The only provider endpoint the runtime knows — allowlisted models, routed by data class.
      - id: mcpBroker
        label: MCP & tool broker
        icon: plug
        note: Approved catalogue, tool-level scoping, token exchange to the owner's scope.
      - id: skillsBroker
        label: Skills broker
        icon: gear
        note: Signed, pinned skills and images from the internal registry — the sandbox installs from nowhere else.
      - id: credBroker
        label: Credential broker
        icon: key
        note: Short-lived credentials injected per call; nothing at rest inside the sandbox.
      - id: allowlist
        label: Egress allowlist
        icon: shield
        note: Deny by default. Everything named, everything logged.

  - id: runtime
    kind: service
    title: Agent runtime
    cosaiComponent: componentReasoningCore
    zone: zoneEndpoint
    col: 1
    row: 2
    note: >
      The whole endpoint side in one block: the loop, the channel bridges it listens on, the
      heartbeat that wakes it, and the local tool surface — all inside a microVM-class sandbox
      whose spec the operator owns and the agent cannot edit.
    items:
      - id: loop
        label: Agent loop
        icon: agent
        note: Plans, calls tools, reads results back as context. Nobody reviews the plan.
      - id: adapters
        label: Channel adapters
        icon: chat
        note: Bound to loopback, fed by the gateway's relay — never by an open port.
      - id: heartbeat
        label: Heartbeat
        icon: clock
        note: The tick that converts a one-time injection into a recurring one.
      - id: localTools
        label: File & edit tools
        icon: folder
        note: Files, shell and skills inside the sandbox — the local surface, and all of it.
      - id: shell
        label: Shell commands
        icon: code
        note: Command execution inside the sandbox, never on the host.

  - id: memory
    kind: service
    title: Memory & state
    cosaiComponent: componentDataStorage
    zone: zoneEndpoint
    col: 1
    row: 3
    note: >
      What the agent keeps and reads back as instruction, plus the owner workspace it is
      allowed to see — one governed volume, encrypted, scanned, and destroyed with the sandbox.
    items:
      - id: memoryFiles
        label: Memory files
        icon: folder
        note: Prose the next turn treats as instruction.
      - id: sharedPaths
        label: Shared folders
        icon: folder
        note: The owner's explicitly shared paths, read-only with a private clone.

  - id: controlPlane
    kind: governance
    title: Control plane
    zone: zoneEnterprise
    col: 2
    row: 3
    note: >
      Identity, secrets, policy, registry and telemetry — the services the one door consumes,
      and the only place an operator changes what the agent may do.
    items:
      - id: idp
        label: Agent identity
        icon: person
        note: One workload identity per agent, bound to owner and device. Revoking it is the kill switch.
      - id: secrets
        label: Secrets vault
        icon: key
        note: Short-lived tokens issued from outside the sandbox, at sandbox start.
      - id: policy
        label: Policy engine
        icon: scale
        note: The per-call decisions the gateway enforces, authored where the agent cannot reach them.
      - id: registry
        label: Skill & image registry
        icon: db
        note: Internal, scanned, signed, pinned — served to the sandbox through the gateway.
      - id: telemetry
        label: Telemetry sink
        icon: eye
        note: One correlated trace per message, written where the agent cannot amend it.

  - id: provider
    kind: provider
    title: Model provider
    cosaiComponent: componentModelServing
    zone: zoneExternal
    col: 3
    row: 0
    note: The inference API, reached only through the door, on a brokered credential.
    items:
      - id: inference
        label: Inference API
        icon: model
        note: The completion it returns is unauthenticated content that chooses the next tool call.

  - id: remoteTools
    kind: service
    title: Remote tool services
    cosaiComponent: componentTools
    zone: zoneExternal
    col: 3
    row: 1
    note: The MCP servers and connectors the catalogue admits — reachable only through the door.
    items:
      - id: mcp
        label: MCP servers
        icon: plug
        note: Admitted by catalogue, never discovered; descriptions enter context as model input.
      - id: apis
        label: APIs & connectors
        icon: plug
        note: Service calls on brokered, owner-scoped credentials.

  - id: downstream
    kind: external
    title: Downstream services
    cosaiComponent: componentDataSources
    zone: zoneExternal
    col: 3
    row: 2
    note: Where actions land, and where fetched content comes back from as untrusted context.
    items:
      - id: saas
        label: SaaS
        icon: mail
        note: The owner's mail, calendar and service accounts.
      - id: web
        label: Web & APIs
        icon: globe
        note: Attacker-writable content that re-enters the loop as context.

edges:
  - from: owner
    to: remoteDevice
    path: primary
    bidir: true
    label: instruction / reply
    note: The owner writes on their own surfaces; everything past this rides platform identity.
  - from: remoteDevice
    to: gateway
    path: primary
    bidir: true
    label: messages via relay
    note: >
      Messaging reaches the agent through the same door as everything else — the relay holds
      the platform credentials, and the endpoint opens no port to receive them.
  - from: gateway
    to: runtime
    path: primary
    bidir: true
    route: hv
    label: admitted work
    note: >
      Normalised, sender-checked messages in; model calls, tool calls and skill fetches back
      out. This single crossing is the whole of the endpoint's connectivity.
  - from: runtime
    to: memory
    path: primary
    bidir: true
    label: local execution & memory
    note: >
      The loop's local surface: files and shell inside the sandbox, memory written and read
      back as instruction, the owner's shared folders visible read-only.
  - from: gateway
    to: provider
    path: external
    bidir: true
    route: vh
    note: Inference on a brokered credential against an allowlisted model, inspected on both legs.
  - from: gateway
    to: remoteTools
    path: external
    bidir: true
    label: brokered tool calls
    note: Catalogue admission and owner-scoped, short-lived credentials on every call.
  - from: remoteTools
    to: downstream
    path: external
    bidir: true
    note: Actions land on real accounts; whatever returns re-enters the loop as context.
  - from: controlPlane
    to: gateway
    path: governance
    label: identity · secrets · policy · registry
    note: >
      Everything the door enforces is authored here, on identities issued here — which is why
      one revocation ends every flow at once.

pins:
  risks:
    - risk: riskPromptInjection
      at: remoteDevice
      note: >
        The surfaces the owner uses are the surfaces anyone the platform admits can use. The
        message body is model input, from a set the organisation does not bound.
    - risk: riskPromptInjection
      at: memory
      note: >
        Memory is prose the next turn treats as instruction; an injection written here survives
        restarts and re-executes on the heartbeat.
    - risk: riskPromptInjection
      at: remoteTools->downstream
      note: Fetched content re-enters the loop indistinguishable from the owner's own words.
    - risk: riskStaleAgentIdentityBinding
      at: remoteDevice->gateway
      note: >
        Pairing records outlive devices and people, and the relay cannot tell a stale pairing
        from a current one.
    - risk: riskMCPTransportHijacking
      at: gateway->runtime
      note: >
        The door is also the single point of compromise: whoever controls the crossing controls
        every flow, which is the cost of consolidating them.
    - risk: riskRunawayAgentToolLoops
      at: runtime
      note: The heartbeat restarts the loop unattended, and nothing inside the sandbox bounds what it spends.
    - risk: riskShadowAndUnknownAgents
      at: runtime
      note: Installed by one person in an afternoon, in no inventory until something looks for it.
    - risk: riskSensitiveDataDisclosure
      at: gateway->provider
      note: >
        Everything the loop assembled — memory, shared folders, tool results — leaves here. The
        gateway's inspection is the only place it can be seen.
    - risk: riskInsecureModelOutput
      at: gateway->provider
      note: The completion is unauthenticated content, and it chooses the next tool call.
    - risk: riskRogueActions
      at: remoteTools->downstream
      note: Unattended triggering, owner-scoped authority and no approval gate compound here.
    - risk: riskToolSourceProvenance
      at: controlPlane->gateway
      note: >
        Skills are prose plus executable code. Serving them through the door means the registry's
        review is the only review — and it has to be real.
    - risk: riskToolRegistryTampering
      at: gateway->remoteTools
      note: The catalogue decides what the agent can be made to do; whoever edits it programs the agent.

  capabilities:
    - capability: capabilityPromptInjectionDefense
      at: remoteDevice->gateway
      note: Classify inbound content at the door, before it reaches a loop that will act on it.
    - capability: capabilityAgentRuntimeEnforcement
      at: gateway->runtime
      note: >
        One admission decision for every channel and every call, enforced at the crossing
        rather than reimplemented per bridge inside the runtime.
    - capability: capabilityTransportSecurity
      at: remoteDevice->gateway
      note: Outbound-only relay with signature and replay checks; the endpoint never listens.
    - capability: capabilityAgentSandboxing
      at: runtime
      note: >
        A microVM-class boundary around the whole runtime, with an operator-owned spec the
        agent cannot edit — the reason approval-free unattended operation is defensible at all.
    - capability: capabilityToolPermissionScoping
      at: gateway->runtime
      note: Per-tool grants evaluated at the door against the agent's identity, not inside the loop.
    - capability: capabilityMemoryProtection
      at: runtime->memory
      note: Treat memory as untrusted input on read; scan what is written; scope what is kept.
    - capability: capabilityCredentialIsolation
      at: memory
      note: Shared folders read-only with a private clone; the home directory and its keys stay out.
    - capability: capabilitySecretsManagement
      at: gateway
      note: Credentials brokered per call at the door, short-lived and scoped; nothing at rest inside.
    - capability: capabilityEgressControl
      at: gateway
      note: Deny-by-default egress at the one crossing — models, tools and destinations each named.
    - capability: capabilityModelGuardrails
      at: gateway->provider
      note: The inspection a hosted product would have applied, run by the organisation on both legs.
    - capability: capabilityMcpToolSecurity
      at: gateway->remoteTools
      note: Catalogue admission, description pinning and drift alerting before a server is reachable.
    - capability: capabilityHitlControls
      at: remoteTools->downstream
      note: An approval gate on consequential actions, because no human saw the plan.
    - capability: capabilityRateLimiting
      at: gateway
      note: Spend and iteration ceilings at the door, sized for a loop that wakes itself.
    - capability: capabilityAuditLogging
      at: controlPlane
      note: One correlated trace per message, written where the agent cannot amend it.
    - capability: capabilityKillSwitch
      at: controlPlane->gateway
      note: Revoking the agent's identity denies every flow at the door within seconds.
    - capability: capabilityShadowAiDiscovery
      at: runtime
      note: Find the installs nobody registered, derived from the device rather than self-reported.

flows:
  - id: F1
    title: Owner instructs the agent
    moves: Instructions, files and approvals in; replies and clarifying questions back.
    path: [owner->remoteDevice, remoteDevice->gateway, gateway->runtime]
    threats: [Unauthorised sender steers the agent, Approval fatigue on a low-assurance surface]
    controls: [capabilityAgentRuntimeEnforcement, capabilityTransportSecurity]
    note: The owner's instruction and a stranger's take the same road — F2 is why that matters.
  - id: F2
    title: Unsolicited inbound
    moves: Messages from anyone the platform admits, carrying content the loop reads as instruction.
    path: [remoteDevice->gateway, gateway->runtime]
    threats: [Indirect prompt injection, Channel hijack, Group-chat exposure]
    controls: [capabilityPromptInjectionDefense, capabilityAgentRuntimeEnforcement]
    note: >
      Same edges as F1, different threat model — which is the argument for making flows
      first-class rather than reading controls off the connectors.
  - id: F3
    title: Model inference
    moves: The assembled prompt — system instruction, memory, conversation, tool results — and the completion.
    path: [runtime->gateway, gateway->provider]
    threats: [Sensitive context leaving the tenant, Unapproved models, Injection reaching the model, Cost abuse]
    controls: [capabilitySecretsManagement, capabilityModelGuardrails, capabilityRateLimiting]
    note: The door is the only provider endpoint the runtime knows.
  - id: F4
    title: Remote tools and actions
    moves: Tool discovery, calls and results — and the actions that land on the owner's accounts.
    path: [runtime->gateway, gateway->remoteTools, remoteTools->downstream]
    threats: [Tool poisoning, Confused deputy, Over-scoped grants, Exfiltration through arguments]
    controls: [capabilityMcpToolSecurity, capabilityHitlControls, capabilityEgressControl]
    note: One bundled crossing carries model, MCP and skills traffic; the controls are per-flow regardless.
  - id: F5
    title: Local execution
    moves: Shell commands and file operations inside the sandbox; results back into context.
    path: [runtime->memory]
    threats: [Sandbox escape, Destructive file operations, Implicit execution of edited host files]
    controls: [capabilityAgentSandboxing, capabilityToolPermissionScoping, capabilityCredentialIsolation]
    note: The shared folders are the only host surface in reach, and read-only is what keeps them reviewable.
  - id: F6
    title: Skill and image supply
    moves: Skill packages, plugins and sandbox base images.
    path: [controlPlane->gateway, gateway->runtime]
    threats: [Malicious public skills, Unpinned auto-update, Self-authored skills encoding injected behaviour]
    controls: [capabilityMcpToolSecurity, capabilityAgentRuntimeEnforcement]
    note: >
      The supply chain uses the same door as everything else — which is the hub's clearest
      advantage: one place to refuse an unsigned artifact.
  - id: F7
    title: Memory persistence
    moves: Long-term memory files, transcripts and the user model the next turn reads as instruction.
    path: [runtime->memory]
    threats: [Memory poisoning, Sensitive accumulation in plaintext, Config tampering]
    controls: [capabilityMemoryProtection]
    note: The persistence primitive, and the reason one successful injection outlives its message.
  - id: F8
    title: Autonomous triggers
    moves: Heartbeat and scheduled wake-ups that start the loop with nobody present.
    path: [memory->runtime, runtime->gateway]
    threats: [Unattended execution of injected instructions, Runaway loops, Off-hours action]
    controls: [capabilityRateLimiting, capabilityHitlControls]
    note: Unattended runs belong to a read-only action class enforced at the door, not to an attended turn's authority.
  - id: F9
    title: Control plane and telemetry
    moves: Identity, secrets, policy and registry down to the door; traces and decisions back up.
    path: [controlPlane->gateway]
    threats: [Stale or unrevocable agent identity, Audit the agent can amend]
    controls: [capabilityAuditLogging, capabilityKillSwitch, capabilityShadowAiDiscovery]
    note: The flow that is not about the agent's work, and the one that ends every other flow when it has to.

scenarios:
  - title: A stranger messages the agent
    steps:
      - follow: remoteDevice->gateway
        note: The message arrives at the door from a sender set the platform bounds and the organisation does not.
      - follow: gateway->runtime
        note: Classification and admission happen here or nowhere; what passes enters the loop as model input.
      - follow: runtime->gateway
        note: The turn's model and tool calls come straight back out to the same crossing.
      - follow: gateway->remoteTools
        note: Anything remote is admitted by catalogue and carries an owner-scoped credential.
      - follow: remoteTools->downstream
        note: Actions land on real accounts — the approval gate is the last control standing.
  - title: The heartbeat fires with nobody watching
    steps:
      - follow: memory->runtime
        note: The tick re-reads memory, including anything written there last week.
      - follow: runtime->gateway
        note: The unattended turn hits the door like any other — and should be refused write scope here.
      - follow: gateway->remoteTools
        note: A one-time injection has become a recurring one, bounded now by the action class.
  - title: A skill is installed
    steps:
      - follow: controlPlane->gateway
        note: The registry serves signed, pinned artifacts to the door.
      - follow: gateway->runtime
        note: The sandbox installs from the door and from nowhere else — one place to refuse an unsigned skill.

deviations:
  - subject: One bundled AI gateway rather than the research's separate brokers
    reason: >
      The source research draws messaging relay, AI gateway, MCP gateway, API gateway and
      egress proxy as five tiers. This organisation runs a LiteLLM-class tier bundling model
      proxying, MCP brokerage and the skills plugin path, and this variant takes the
      consolidation to its conclusion by routing the messaging relay through it too. The flows
      are unchanged; an organisation with separate tiers splits the block and keeps them.
  - subject: The endpoint is one block, and the sandbox is absorbed into it
    reason: >
      Bridges, loop, heartbeat and local tools are items of a single runtime rather than
      separate blocks, and the microVM boundary is absorbed into that block rather than drawn as
      a frame around parts this variant does not separate. At this altitude the reviewer's
      question is what leaves the endpoint and under whose authority, not how the harness is
      internally arranged — and the sibling spike draws the parts for anyone who needs them.
  - subject: Unsolicited senders are a pin, not an actor
    reason: >
      They are a property of the surfaces the owner already uses, so they are carried as a risk
      pin on the remote device and as the threats on F2. Whether that loses the archetype's
      defining trait is the specific question this A/B is meant to settle.

