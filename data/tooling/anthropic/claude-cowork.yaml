# Claude Cowork — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# Local and cloud Cowork sessions share one admin console (Organization settings > Cowork), but
# the cloud sessions run on a different runtime with a different drawing, so since 2026-09-17
# they are a second entity (toolClaudeCoworkCloud, archHostedAgentSessions) below; the desktop
# entity keeps the device MDM keys that reach only local sessions.
# Standard (claude.ai) deployments document only the device keys on the Help Center "Enterprise
# configuration for Claude Desktop" page; the wider key set on claude.com/docs/third-party/claude-desktop/
# configuration (coworkEgressAllowedHosts, disabledBuiltinTools, disableBypassPermissionsMode, ...) is
# documented for Claude Desktop on 3P, and rows name it as 3P only.
# 2026-09-25: re-verified toolClaudeCowork and toolClaudeCoworkCloud against the MITRE capability rules;
# every cited URL answered 200 with no redirect (support.claude.com did not wall curl or WebFetch);
# trust.anthropic.com renders client-side and was read in a browser; the Cowork Enterprise Admin Guide
# (claude.com/resources/tutorials/claude-cowork-enterprise-administrator-guide) redirects to
# academy.claude.com/tutorials/claude-cowork-enterprise-administrator-guide and is not cited.
vendor: anthropic
family: Claude Cowork
tools:
  - id: toolClaudeCowork
    name: Claude Cowork
    surfaceClasses:
      - desktopApp
      - cloudAgent
    variants:
      - name: Cowork in Claude Desktop (local session in the Cowork VM sandbox)
        class: desktopApp
        url: https://claude.com/docs/cowork/overview
      - name: Cowork in the cloud (web, mobile, Chrome side panel; sessions on Anthropic servers)
        class: cloudAgent
        url: >-
          https://support.claude.com/en/articles/15520349-use-claude-cowork-on-web-desktop-and-mobile
        note: >-
          Announced 7 July 2026 (beta, Max first). "Run Cowork in the cloud" is on by default on Team and off
          by default on Enterprise, where an owner turns it on and grants the "Cowork in the cloud" capability
          through custom roles. Device managed settings do not reach these sessions.
      - name: Dispatch (background tasks) and scheduled tasks
        class: cloudAgent
        url: https://claude.com/docs/cowork/guide/dispatch
        note: >-
          Dispatch runs its tasks on the desktop (Pro and Max, not offered to new users); scheduled tasks run
          in the cloud with no device online.
    architecture: archCodingAgentThirdParty
    status: ga
    asOf: "2026-09"
    summary:
      - >-
        Cowork is Anthropic's agentic workspace for non-developers: the Claude Code architecture inside Claude
        Desktop, working on the user's own files, connectors, skills and plugins, with sub-agents, browser use
        (Claude in Chrome or a built-in browser) and computer use. Local sessions run shell and document tools
        in a hardened VM on the device with file access scoped to connected folders and shell traffic held to
        the organisation's egress policy; cloud sessions (web, mobile, Chrome side panel) run on Anthropic's
        servers, save sessions and files to the account, keep working with every device offline, and can only
        touch local folders while the desktop app is open. Inference is the Anthropic API on first-party plans, or the
        organisation's provider on Claude Desktop on 3P.
      - >-
        Modelled as a third-party coding and desktop agent: it is the Claude Code runtime inside a vendor
        desktop app, driven by a present user who connects folders and approves tool calls, and administered
        through the same two planes as Claude Code (the claude.ai console and device managed configuration).
        It is not the self-hosted autonomous personal-agent class; the cloud variant stretches towards a
        managed agent runtime and is noted on the variant. Admin control is in the claude.ai console at
        Organization settings > Cowork: "Enable for your organization", "Run Cowork in the cloud", the
        built-in browser toggle, "Allow 'Automatically approve' mode", "Allow 'Always allow' for connector
        tools", an OTLP collector for session events, and curated plugin marketplaces (Installed by default /
        Available / Required / Not available), with role-based access on Enterprise; on the device, Claude
        Desktop's enterprise policy (com.anthropic.claudefordesktop, HKLM\SOFTWARE\Policies\Claude) adds
        allowedWorkspaceFolders, secureVmFeaturesEnabled, isLocalDevMcpEnabled, isDesktopExtensionEnabled and
        forceLoginOrgUUID, and local sessions read Claude Code managed settings deployed on the device; the
        wider key set (coworkEgressAllowedHosts, disabledBuiltinTools, disableBypassPermissionsMode,
        coworkTabEnabled) is documented for Claude Desktop on 3P. Cowork sessions never fetch Claude Code
        server-managed settings. No behavioural
        baseline or drift detection is offered; the OTLP event stream is the raw material if one is built.
    facts:
      - label: Plans
        value: >-
          Pro, Max, Team and Enterprise in Claude Desktop; web and mobile in beta for Pro, Max and Team and
          for Enterprise where admins enable it; Claude Desktop on 3P runs Cowork on Bedrock, Vertex, Foundry
          or a gateway.
        url: >-
          https://support.claude.com/en/articles/15520349-use-claude-cowork-on-web-desktop-and-mobile
      - label: Inference & routing
        value: >-
          Anthropic API (first-party) or the provider configured in Claude Desktop managed configuration
          (inferenceProvider gateway / bedrock / vertex / foundry / anthropic) on 3P deployments.
        url: https://claude.com/docs/third-party/claude-desktop/configuration
      - label: Data leaving the device
        value: >-
          Prompts, the contents of files in connected folders that Claude reads, tool outputs, browser page
          content and connector data go to the model provider; cloud sessions store sessions and files in the
          account; the OTLP exporter (inside the VM, subject to egress rules) sends events to the
          organisation's collector.
        url: https://claude.com/docs/cowork/monitoring
      - label: Retention & training
        value: >-
          Local conversation history stays on the device outside standard retention (Compliance API captures
          local sessions server-side for 6 years or the custom period); cloud sessions are saved to the
          account (remote transcripts 6 years unless deleted). Cowork is not covered by ZDR. Commercial terms:
          no training.
        url: https://platform.claude.com/docs/en/manage-claude/compliance-sessions
      - label: Usage limits & models
        value: >-
          Organisation, group and per-user usage limits (Organization settings > Usage) are shared across
          Cowork, Claude Code and chat, with no per-task budget; model access and effort caps under
          Organization settings > Models are enforced across most Claude products including Cowork.
        url: https://support.claude.com/en/articles/14782391-claude-enterprise-consumption-guide
      - label: Network path
        value: >-
          TLS to the provider; on Claude Desktop on 3P, egressProxyUrl / egressProxyPacUrl in managed
          configuration route app and agent traffic; HTTPS_PROXY, NODE_EXTRA_CA_CERTS and
          CLAUDE_CODE_CLIENT_CERT/KEY are read from managed and user settings only in app-managed sessions, never
          from repository settings.
        url: https://code.claude.com/docs/en/network-config
      - label: Docs index
        value: claude.com/docs/cowork plus the Help Center Cowork on Team and Enterprise article
        url: https://claude.com/docs/cowork/overview
    riskNotes:
      - risk: riskPromptInjection
        note: >-
          Cowork reads documents, web pages (via the built-in browser or Claude in Chrome) and connector
          results as instructions, with the "Automatically approve" mode offered to members by default on Team
          and Enterprise; the egress policy and connector tool approvals are the containment.
      - risk: riskRogueActions
        note: >-
          "Always allow" for connector tools is off by default because it removes the per-tool prompt; bypass
          ("Skip all approvals") can be removed with disableBypassPermissionsMode only on Claude Desktop on 3P.
      - risk: riskSensitiveDataDisclosure
        note: >-
          Users can attach home folders, Documents, AppData and whole drives (4 September 2026; SSH keys and
          cloud credentials inside them stay off-limits); allowedWorkspaceFolders in the enterprise policy is
          the fence. The Help Center says OTLP events include prompt content by default, while the Cowork
          monitoring reference says metadata only unless content capture is enabled; filter at the collector.
      - risk: riskShadowAndUnknownAgents
        note: >-
          Cloud sessions and scheduled tasks run unattended without a device; the Enterprise console can enable
          cloud capability per group, and the Compliance API lists remote Cowork sessions including
          agent-owned scheduled runs.
      - risk: riskToolSourceProvenance
        note: >-
          Users can add plugin marketplaces and upload plugins; admins curate marketplaces (Installed by
          default, Available, Required, Not available), claude.ai applies the admin console's
          strictKnownMarketplaces and blockedMarketplaces to marketplaces added from Cowork, and turning off
          user marketplaces and uploads is a Claude Desktop on 3P key.
    controls:
      - mitigation: cap-input-guardrails
        coverage: partial
        mechanism: >-
          Anthropic's content classifiers scan untrusted content entering Claude's context (no administrator
          setting); Inference hooks (Enterprise, beta) hold every governed Cowork prompt and returned tool result
          for an allow or deny verdict from the organisation's AI security server
        steps:
          - title: Put an inspector on returned tool content (Enterprise, beta)
            body:
              - At Organization settings > Data and privacy > Inference hooks turn on "Allow for your
                organization", register your AI security server, set Failure handling to "Block the request" and
                turn on "Enforce verdicts" so Cowork prompts and tool results wait for its verdict.
            url: https://platform.claude.com/docs/en/manage-claude/inference-hooks-configuration
          - title: Know what the vendor screening covers
            body:
              - The Cowork safety page states that content classifiers scan all untrusted content entering
                Claude's context and flag potential injections; there is no setting, threshold or event export
                for them.
            url: https://support.claude.com/en/articles/13364135-use-claude-cowork-safely
        note: >-
          Partial on the rule applied to every vendor: vendor-internal screening that is not admin-configurable,
          plus an inline hook that is an attach point until the organisation's server does the classifying.
          Inference hooks govern Cowork on web, desktop and mobile, including tool results, but return only allow
          or deny (no strip or quarantine), are an Enterprise beta, never send system prompts or tool
          definitions, and are not available on Bedrock or Google Cloud deployments. The "Automatically approve"
          safety check judges proposed actions, which is action policy, not input screening.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityPromptInjectionDefense
          reviewRequired: false
          original:
            - capability: capabilityPromptInjectionDefense
              coverage: partial
              mechanism: >-
                Auto-mode classifier ("Automatically approve"), browser safety classifiers, egress allowlist;
                Enterprise Inference hooks govern Cowork prompts
              steps:
                - title: Keep tool approvals in the loop
                  body:
                    - Leave "Allow 'Always allow' for connector tools" off and consider turning off "Allow 'Automatically
                      approve' mode" under Organization settings > Cowork > Permissions for sensitive teams.
                  url: >-
                    https://support.claude.com/en/articles/13455879-use-claude-cowork-on-team-and-enterprise-plans
                - title: Inspect prompts inline (Enterprise, beta)
                  body:
                    - Inference hooks send every governed Cowork prompt, including tool results, to your AI security server for
                      an allow/deny verdict before inference.
                  url: https://platform.claude.com/docs/en/manage-claude/inference-hooks
              note: >-
                The auto-mode and browser classifiers screen proposed actions; the egress allowlist contains.
                Document and connector content is not classified for injected instructions.
              verified: 2026-09-10
      - mitigation: cap-sensitive-data-redaction
        coverage: partial
        mechanism: >-
          Inference hooks (Enterprise, beta) hand every governed Cowork prompt, tool result and uploaded file
          text to the organisation's DLP server for allow or deny; allowedWorkspaceFolders, the built-in
          exclusion of credential locations and a Blocked or read-only connector tool policy minimise what can be
          read
        steps:
          - title: Inspect prompts and tool results inline (Enterprise, beta)
            body:
              - At Organization settings > Data and privacy > Inference hooks connect your DLP or AI security
                server and turn on "Enforce verdicts"; it denies requests carrying regulated content, since
                rewriting or redacting a prompt is not supported.
            url: https://platform.claude.com/docs/en/manage-claude/inference-hooks-configuration
          - title: Fence the folders Cowork can mount
            body:
              - Set allowedWorkspaceFolders in com.anthropic.claudefordesktop or HKLM\SOFTWARE\Policies\Claude to
                the folders users may connect (unset is unrestricted).
            url: >-
              https://support.claude.com/en/articles/12622667-enterprise-configuration-for-claude-desktop
          - title: Keep sensitive connectors read-only
            body:
              - Set write tools to Blocked at Organization settings > Connectors, or per custom role on the
                Connectors tab under Organization settings > Roles (Enterprise).
            url: https://support.claude.com/en/articles/13930452-manage-custom-roles-on-enterprise-plans
        note: >-
          Partial by the rule: an inline hook that can block is an attach point, and nothing in the product
          masks or tokenises a value. Folder allowlists, the exclusion of SSH keys, AWS and Google Cloud
          credentials and shell profiles from attached home folders (changelog, 4 September 2026) and read-only
          connector policy are data minimisation, not detection. Hooks see what reaches the model (browser pages
          and file contents only as far as they enter the conversation); the Compliance API supports DLP after
          the fact.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAiDlp
          reviewRequired: false
          original:
            - capability: capabilityAiDlp
              coverage: partial
              mechanism: >-
                allowedWorkspaceFolders and Read deny rules limit what can be read; connector write
                permissions can be removed; Inference hooks (Enterprise) inspect prompts inline;
                coworkEgressAllowedHosts limits where data can go
              steps:
                - title: Fence data paths
                  body:
                    - Combine allowedWorkspaceFolders, disabledBuiltinTools Read rules for secret paths and connector read-only
                      permissions; add Inference hooks for inline DLP on Enterprise.
                  url: https://claude.com/docs/third-party/claude-desktop/configuration
              note: >-
                Folder scoping, deny rules and the egress allowlist restrict paths; Inference hooks are the
                only content-inspection path and only for prompts the organisation's server governs. File
                contents read inside the VM are not scanned.
              verified: 2026-09-10
      - mitigation: D3-MFA
        coverage: partial
        mechanism: >-
          "Require SSO for Claude" (Organization settings > Organization and access > Authentication) sends
          every interactive sign-in through the IdP, whose MFA policy applies; forceLoginOrgUUID pins Claude
          Desktop to the organisation; "Shortened session length" bounds how long a sign-in lasts (Enterprise)
        steps:
          - title: Enforce SSO
            body:
              - After domain verification and IdP setup, toggle on "Require SSO for Claude" under Organization
                settings > Organization and access > Authentication, and require MFA in the IdP.
            url: https://support.claude.com/en/articles/13132885-set-up-single-sign-on-sso
          - title: Pin the desktop app to your organisation
            body:
              - Deploy forceLoginOrgUUID in com.anthropic.claudefordesktop or HKLM\SOFTWARE\Policies\Claude; login
                fails for any account outside the listed organisations.
            url: >-
              https://support.claude.com/en/articles/12622667-enterprise-configuration-for-claude-desktop
          - title: Bound session lifetime (Enterprise)
            body:
              - At Organization settings > Organization and access > Session security enable "Shortened session
                length" (1, 7, 14 or 28 days) so users sign in, and meet the IdP's MFA, again.
            url: https://support.claude.com/en/articles/13163631-configuring-session-security-settings
        note: >-
          Partial by the rule: MFA is configured in the IdP, not in Claude, which documents no second-factor
          requirement of its own. Paths that skip a fresh challenge: the desktop's signed-in session (kept while
          the user stays active unless Shortened session length is set), cloud sessions and scheduled tasks that
          keep running on that sign-in with no device present (the architecture overview describes a
          trusted-device and recent-sign-in requirement for cloud sessions without naming the toggle), and
          personal accounts on unmanaged devices, which the tenant-restriction header or Enterprise domain
          capture address. Claude Desktop on 3P has no Anthropic identity; sign-in is the provider's or the
          organisation's IdP.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityIga
          reviewRequired: false
          original:
            - capability: capabilityIga
              coverage: native
              mechanism: >-
                "Enable for your organization" toggle at Organization settings > Cowork; Enterprise custom
                roles and groups gate Cowork and cloud capability; SSO/SCIM at the organisation;
                forceLoginOrgUUID in Claude Desktop managed configuration
              steps:
                - title: Enable Cowork for the right people
                  body:
                    - Turn on "Enable for your organization" at Organization settings > Cowork and, on
                      Enterprise, grant Cowork and cloud sessions to specific groups through custom roles.
                  url: >-
                    https://support.claude.com/en/articles/13455879-use-claude-cowork-on-team-and-enterprise-plans
                - title: Pin the desktop app to your organisation
                  body:
                    - Deploy forceLoginOrgUUID in the com.anthropic.claudefordesktop profile or
                      HKLM\SOFTWARE\Policies\Claude so the app only accepts your organisation's logins.
                  url: >-
                    https://support.claude.com/en/articles/12622667-enterprise-configuration-for-claude-desktop
              verified: 2026-09-10
      - mitigation: cap-ai-vendor-assessment
        coverage: external
        mechanism: >-
          The Anthropic Trust Center (SOC 2 Type 2 and CSA STAR L2 report, ISO 27001 and ISO 42001
          certificates, 2025 annual penetration testing reports, SIG Lite and CAIQ questionnaires, "Claude Cowork
          Desktop Security Architecture Overview" and "Claude Cowork Security Best Practices") and the Help
          Center architecture overview feed the organisation's TPRM platform
        evidence:
          - title: Anthropic Trust Center (compliance scope table and resources, read 2026-09-25)
            url: https://trust.anthropic.com/
          - title: Claude Cowork architecture overview (execution modes, isolation, admin controls)
            url: https://support.claude.com/en/articles/14479288-claude-cowork-architecture-overview
          - title: What Certifications has Anthropic obtained?
            url: https://support.claude.com/en/articles/10015870-what-certifications-has-anthropic-obtained
          - title: Legal and compliance (Claude Desktop on 3P)
            url: https://claude.com/docs/third-party/claude-desktop/legal
        note: >-
          External by the rule applied to every vendor: the questionnaire, evidence expiry and reassessment
          trigger live in the organisation's TPRM platform. The Trust Center lists SOC 2 Type II, ISO
          27001:2022, ISO/IEC 42001:2023, HIPAA and CSA STAR against Claude Enterprise and Claude Team, and most
          documents are behind a request-access form. Reassess when the defaults move: cloud sessions on by
          default for Team, the built-in browser and Claude in Chrome on by default for Enterprise from 10
          September 2026, skill and plugin scanning on by default for Enterprise from 2 October 2026. On Claude
          Desktop on 3P the compliance posture follows the configured inference provider.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAiTprm
          reviewRequired: false
          original:
            - capability: capabilityAiTprm
              coverage: external
              mechanism: >-
                Help Center "Claude Cowork architecture overview" (execution models, per-session cloud
                sandbox, session-scoped tokens) and the Trust Center "Claude Cowork desktop security
                architecture overview" plus certifications feed the buyer's TPRM platform; cadence and
                reassessment live in the organisation's own tooling
              steps:
                - title: Attach the Cowork architecture evidence
                  body:
                    - Record the architecture overview (a sandbox per cloud session, a mandatory egress proxy, connector tokens
                      never entering the sandbox) and request the desktop security architecture overview it points
                      to on the Trust Center.
                  url: https://support.claude.com/en/articles/14479288-claude-cowork-architecture-overview
                - title: Collect certifications and the 3P data path
                  body:
                    - Pull the certifications and compliance reports from the Trust Center; for Claude Desktop on 3P the legal
                      page states conversation content goes only to the configured inference endpoint and the
                      compliance posture follows that provider.
                  url: https://claude.com/docs/third-party/claude-desktop/legal
              verified: 2026-09-10
      - mitigation: cap-agent-action-policy-enforcement
        coverage: partial
        mechanism: >-
          Organisation-wide connector tool policy and custom-role grants (Always allow / Needs approval /
          Blocked per connector or tool) enforced on Anthropic's servers for local and cloud sessions; Claude
          Code managed settings on the device (permissions.deny / ask, allowManagedPermissionRulesOnly) for
          local sessions; the "Automatically approve" safety check is a classifier
        steps:
          - title: Set the connector tool policy
            body:
              - At Organization settings > Connectors set each connector's tools to Always allow, Needs approval or
                Blocked, and on Enterprise narrow them per role on the Connectors tab under Organization settings >
                Roles.
            url: https://support.claude.com/en/articles/13930452-manage-custom-roles-on-enterprise-plans
          - title: Deny tools in local sessions from device policy
            body:
              - Deploy permissions.deny rules in Claude Code managed settings (MDM or managed-settings.json); a
                whole-tool Bash or WebFetch deny also stops Cowork's mcp__workspace__bash and
                mcp__workspace__web_fetch, but allow rules and argument-scoped Bash rules do not carry over.
            url: https://code.claude.com/docs/en/permissions
          - title: Know which sessions read device policy
            body:
              - Local Cowork sessions read the MDM policy and managed-settings file on the device and never fetch
                server-managed settings; cloud sessions read neither.
            url: https://code.claude.com/docs/en/managed-settings
        note: >-
          Partial by the rule: deterministic rules exist, but connector tools are matched by name only (no
          arguments or target), shell commands in local sessions only as a whole tool, and cloud sessions get
          the connector policy and console toggles alone. The Automatically approve check is a model, not a
          policy decision point. Browser actions follow the site allowlist and blocklist at Organization
          settings > Claude in Chrome. Decisions reach the OTLP export as tool_decision events (source "config").
          Claude Desktop on 3P adds disabledBuiltinTools and builtinToolPolicy with argument-scoped rules, of
          which Cowork's own sandboxed shell honours bare tool names only.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAgentRuntimeEnforcement
          reviewRequired: false
          original:
            - capability: capabilityAgentRuntimeEnforcement
              coverage: partial
              mechanism: >-
                Managed configuration disabledBuiltinTools (tool or argument-scoped rules such as
                Read(**/.env)) and builtinToolPolicy (ask / allow per tool); Claude Code managed deny rules
                apply to Cowork's mcp__workspace__bash and web_fetch tools in local sessions
              steps:
                - title: Deny tools by policy on the device
                  body:
                    - Set disabledBuiltinTools (for example Bash, Read(**/.env)) and builtinToolPolicy ask entries in Claude
                      Desktop managed configuration; managed Bash and WebFetch deny rules in Claude Code policy also
                      stop Cowork's workspace tools.
                  url: https://claude.com/docs/third-party/claude-desktop/configuration
              note: >-
                Cloud sessions do not read device policy; only the console toggles and connector tool settings
                reach them.
              verified: 2026-09-10
      - mitigation: AML.M0031
        coverage: partial
        mechanism: >-
          Account memory is off by default on Team and Enterprise and turned on at Organization settings >
          Capabilities (local sessions do not use it); skills and plugins locked to reviewed sources at
          Organization settings > Plugins & skills > Policy; organisation instructions;
          desktopSessionCleanupPeriodDays for local transcripts; folder and project instructions have no admin
          control
        steps:
          - title: Decide on memory
            body:
              - Leave memory off or turn it on at Organization settings > Capabilities (and grant the Memory
                capability per role on Enterprise); users can view, edit and delete what is saved.
            url: >-
              https://support.claude.com/en/articles/11817273-use-claude-s-chat-search-and-memory-to-build-on-previous-context
          - title: Lock instruction sources to reviewed skills and plugins
            body:
              - At Organization settings > Plugins & skills > Policy turn off "User-created skills" and set
                Publishing to "Requires review", and deliver standing skills in plugins set to Required.
            url: https://support.claude.com/en/articles/13119606-provision-and-manage-skills-for-your-organization
          - title: Set organisation instructions
            body:
              - Enter them under Organization settings > Organization and access > Organization instructions (up
                to 3,000 characters, up to an hour to apply); they are prompt-level guidance, not enforcement.
            url: https://support.claude.com/en/articles/14546867-set-organization-instructions
          - title: Bound local transcripts
            body:
              - Set desktopSessionCleanupPeriodDays in Claude Code managed settings on the device; Desktop and
                Cowork transcripts are otherwise kept at any age.
            url: https://code.claude.com/docs/en/settings-reference
        note: >-
          Partial by the rule: memory can be disabled and instruction sources partly locked, but nothing
          validates what is written. Folder instructions, which Claude "can also update on its own during a
          session", and project instructions and project memory have no admin control ("owners cannot restrict
          project creation"). Local conversation history sits outside standard retention and cannot be deleted
          centrally. Claude Desktop on 3P adds coworkSessionRetentionDays, which deletes idle local tasks but
          keeps memory.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityMemoryProtection
            - capabilitySystemPromptManagement
          reviewRequired: false
          original:
            - capability: capabilityMemoryProtection
              coverage: partial
              mechanism: >-
                desktopSessionCleanupPeriodDays for local transcripts; cloud sessions deletable by users;
                Compliance API retention follows custom periods; skills and memory managed in Customize
              steps:
                - title: Bound local transcripts
                  body:
                    - Set desktopSessionCleanupPeriodDays in managed settings; Desktop and Cowork transcripts
                      are otherwise exempt from cleanupPeriodDays.
                  url: https://code.claude.com/docs/en/settings-reference
              note: >-
                Retention only: cleanup periods and deletion bound how long transcripts and memory persist.
                Nothing validates memory writes or restores a known-good state.
              verified: 2026-09-10
            - capability: capabilitySystemPromptManagement
              coverage: partial
              mechanism: organizationInstructions in Claude Desktop managed configuration (MDM + bootstrap; appended to the
                system prompt in Chat, Cowork and Code, up to 3,000 characters, guidance not enforcement);
                skills and plugins locked to admin sources (skillCreationEnabled,
                userPluginMarketplacesEnabled, userPluginUploadsEnabled false; required marketplaces);
                Enterprise skill scanning; project instructions are user-authored and local
              steps:
                - title: Append organisation instructions
                  body:
                    - Set organizationInstructions in the com.anthropic.claudefordesktop profile or
                      HKLM\SOFTWARE\Policies\Claude; the docs state it is guidance the model follows, not an
                      enforced control.
                  url: https://claude.com/docs/third-party/claude-desktop/configuration
                - title: Lock instruction sources to admin-provisioned plugins
                  body:
                    - Set skillCreationEnabled, userPluginMarketplacesEnabled and userPluginUploadsEnabled
                      false and deliver skills and hooks through allowedPluginMarketplaces or org-plugins/ so
                      only reviewed instructions load.
                  url: https://claude.com/docs/third-party/claude-desktop/extensions
                - title: Scan skills and plugins (Enterprise)
