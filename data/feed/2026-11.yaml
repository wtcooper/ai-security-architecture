  - id: inference-server-side-channels
    kind: research
    date: 2026-11-19
    added: 2026-11-25
    weight: notable
    title: "Sandboxed models can signal each other through a shared inference server"
    summary: >
      Two researchers show covert channels in vLLM: one model varies step size, or leaves a cached 'mailbox'
      the other detects. A policy told a monitor on the same engine 'not a honeypot' and 354 of 354 attacks
      passed. A monitor on a separate engine closes nearly every channel.
    why: "Network and filesystem sandboxing does not isolate models that share an inference server with their monitor."
    vendor: LessWrong (Deshpande, Africa)
    products: [toolVllm]
    controls: [D3-EI, AML.M0024]
    patterns: [archAgentSandbox, archSelfHostedInference]
    update:
      action: controlGuidance
      status: declined
      target: D3-EI
      note: "Declined: a two-author result on shared inference engines; the isolation guidance stays as it is for now."
    sources:
      - title: "Models Can Communicate via Inference Servers Despite Being Sandboxed"
        url: https://www.lesswrong.com/posts/7wzWuLP3HhyBLmKfo/models-can-communicate-via-inference-servers-despite-being
        publisher: LessWrong
