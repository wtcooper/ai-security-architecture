          private-network tunnel for Anthropic-hosted sessions; connectors reach your servers from Anthropic's
          side. Self-hosted environments are the private-network option: the environment secret is shown once,
          expires after 365 days and is rotated and revoked per environment (the orchestrator's SCM connector
