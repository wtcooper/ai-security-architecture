id: coding-agent-hijack
title: "Coding agents hijacked through repository files, issues and PR comments"
subtitle: >
  Coding agents read issues, pull-request comments and instruction files as trusted context.
  In 2026 attackers started writing to all three.
dateRange: April – August 2026
perspective: target
archetype: archCodingAgentThirdParty
summary:
  - >
    A coding agent's context is assembled from the repository around it: `CLAUDE.md`,
    `.cursorrules`, issue threads, PR comments, CI logs. Most of those are writable by people
    who have no commit access.
  - >
    Attackers used that. Hostile GitHub comments steered Claude Code, Gemini CLI and Copilot
    Agent into running attacker-chosen actions. The Claude Code GitHub Action was driven into
    exfiltrating secrets. TrapDoor went upstream of all of it and poisoned instruction files
    distributed through npm, PyPI and crates.io.
  - >
    This is the only case in this set where the agent's *system instructions* are the target,
    which makes instruction files a supply-chain artefact that needs the same provenance
    controls as code.
  - >
    In August 2026 the pattern stopped needing an attacker at the keyboard. CHAINDROP is a
    self-propagating npm worm that writes its own persistence into an agent's configuration —
    a session-start hook in `.claude/settings.json`, a folder-open task in `.vscode/tasks.json`
    — and then republishes itself through every package its stolen credentials can reach. What
    TrapDoor did by hand to instruction files, CHAINDROP does at 1.3 billion monthly downloads.
patterns:
  - Social Engineering of AI Agents
  - Config-as-Code Execution
  - Tool Poisoning
  - Credential Theft via AI Tools
  - Self-Propagating Supply Chain Worm
cves: []
risks:
  - riskPromptInjection
  - riskToolSourceProvenance
  - riskRogueActions
  - riskPromptResponseCachePoisoning
  - riskInsecureIntegratedComponent
  - riskSensitiveDataDisclosure
controls:
  - controlInputValidationAndSanitization
  - controlComponentIdentityProvenance
  - controlAgentExecutionBounds
  - controlAgentCredentialIsolation
  - controlAgentObservability
  - controlModelAndDataIntegrityManagement
steps:
  - n: 1
    title: Instruction files get poisoned at the source
    phase: introduced
    narrative: >
      TrapDoor planted malicious directives in `CLAUDE.md` and `.cursorrules` files shipped
      through npm, PyPI and crates.io. Developers pulled them in as ordinary dependencies. The
      agent read them as its own standing instructions.
    components:
      - actorExternalSources
      - componentAgentInputHandling
      - componentAgentSystemInstruction
    path: [harness->toolPlane, toolPlane->aiGateway, aiGateway->extTools, extTools->downstream, harness->memory]
    risks:
      - riskToolSourceProvenance
      - riskPromptInjection
    sources:
      - title: "TrapDoor poisons CLAUDE.md and .cursorrules across npm, PyPI and crates.io"
        url: https://github.com/webpro255/awesome-ai-agent-attacks
        publisher: Awesome AI Agent Attacks timeline
        date: 2026-05-24
  - n: 2
    title: A comment on a pull request becomes a command
    phase: introduced
    narrative: >
      Claude Code, Gemini CLI and Copilot Agent were hijacked through GitHub comments and PR
      bodies. Anyone able to comment could reach the agent's context — no repository write
      access required. Azure DevOps MCP had the same shape, via hidden PR comments.
    components:
      - actorExternalSources
      - componentAgentUserQuery
      - componentAgentInputHandling
      - componentRAGContent
    path: [aiGateway->hostedTools, hostedTools->orgData, aiGateway->harness]
    risks:
      - riskPromptInjection
    sources:
      - title: "Claude Code, Gemini CLI, Copilot Agent hijacked via GitHub comments"
        url: https://github.com/webpro255/awesome-ai-agent-attacks
        publisher: Awesome AI Agent Attacks timeline
        date: 2026-04-15
  - n: 3
    title: The agent acts with the pipeline's credentials
    phase: exposed
    narrative: >
      In CI the agent holds real credentials. The Claude Code GitHub Action was driven into
      exfiltrating secrets — the injected instruction executed with the permissions of the
      workflow, not of the person who wrote the comment.
    components:
      - componentReasoningCore
      - componentTools
      - componentOrchestrationOutputHandling
    path: [vendorService->aiGateway, aiGateway->hostedTools, hostedTools->orgData]
    risks:
      - riskRogueActions
      - riskPromptInjection
    sources:
      - title: "Claude Code GitHub Action prompt-injection secret exfiltration"
        url: https://github.com/webpro255/awesome-ai-agent-attacks
        publisher: Awesome AI Agent Attacks timeline
        date: 2026-06-05
  - n: 4
    title: Poisoned context persists
    phase: exposed
    narrative: >
      Because the instruction lives in a checked-in file or a cached context, it fires again
      on the next run and the next developer. One injection becomes a standing capability.
    components:
      - componentMemory
      - componentAgentSystemInstruction
      - componentReasoningCore
    path: [harness->memory]
    risks:
      - riskPromptResponseCachePoisoning
      - riskPromptInjection
    sources:
      - title: "Awesome AI agent attacks — 2026 timeline"
        url: https://github.com/webpro255/awesome-ai-agent-attacks
        publisher: webpro255
  - n: 5
    title: The agent's config file becomes a worm's home
    phase: exposed
    narrative: >
      4 August 2026: a maintainer's npm account falls, and CHAINDROP backdoors every package
      that account can publish to — 444 packages across 2,212 versions in under four hours,
      later past 1,300, together carrying more than a billion downloads a month. Its persistence
      is the new part. It writes a session-start hook into `.claude/settings.json` and a
      folder-open task into `.vscode/tasks.json`, each pointing at a copy of the dropper in the
      other directory, so removing one restores it from the other — and where a repository token
      allows, it commits those hooks to as many as fifty branches. Among the 300+ secret patterns
      it hunts are Anthropic, Claude, Codex, Cursor, OpenAI and Gemini credentials. Its
      command-and-control addresses live in an Ethereum smart contract, so the operators moved
      the entire infrastructure with a single transaction and no new malware.
    components:
      - actorExternalSources
      - componentAgentSystemInstruction
      - componentTools
      - componentOrchestrationOutputHandling
      - componentModelFrameworksAndCode
    path: [harness->toolPlane, toolPlane->aiGateway, aiGateway->extTools, extTools->downstream, harness->memory]
    risks:
      - riskToolSourceProvenance
      - riskInsecureIntegratedComponent
      - riskSensitiveDataDisclosure
      - riskRogueActions
    sources:
      - title: "Shai-Hulud CHAINDROP: npm supply chain worm analysis"
        url: https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain
        publisher: Elastic Security Labs
        date: 2026-08-06
      - title: "CHAINDROP npm worm analysis"
        url: https://unit42.paloaltonetworks.com/chaindrop-npm-worm-analysis/
        publisher: Unit 42, Palo Alto Networks
        date: 2026-08-06
  - n: 6
    title: Where this chain breaks
    phase: mitigated
    narrative: >
      Treat instruction files as code: signed, reviewed, provenance-checked. Treat repository
      content from non-collaborators as untrusted input. Give CI agents their own scoped,
      short-lived credentials, and require a second factor that a stolen publishing token cannot
      satisfy. Bound what an agent may execute without a human confirming. And watch the agent's
      own configuration directories the way you would watch a startup folder — CHAINDROP is the
      proof that `.claude/` and `.vscode/` are now execution surfaces, not preferences.
    components:
      - componentAgentInputHandling
      - componentAgentSystemInstruction
      - componentReasoningCore
      - componentTools
      - componentOrchestrationInputHandling
    path: [harness->memory, harness->toolPlane, toolPlane->aiGateway, aiGateway->hostedTools, govSupplyChain, govSecrets]
    sources:
      - title: "Securing agentic apps: how to vet the tools your AI agents depend on"
        url: https://workos.com/blog/mcp-supply-chain-security
        publisher: WorkOS
alsoSeen:
  - title: "Clinejection — a compromised release of an open-source coding agent CLI"
    date: 2026
    note: >
      The first-party half of this pattern: a harness release published with stolen publisher
      tokens, so the supply chain delivered the agent itself. Plays out on the first-party
      coding agent drawing (archCodingAgentFirstParty), whose private-registry mirror and
      version pinning are the answering controls.
    sources:
      - title: "Clinejection — supply-chain compromise of an open-source coding agent CLI"
        url: https://adnanthekhan.com/posts/clinejection/
        publisher: Adnan Khan
  - title: "AWS Kiro rewrites its own MCP config from hidden web text (CVE-2026-10591)"
    date: July 2026
    note: An agent persuaded to edit its own configuration turns a one-off injection into persistence.
    sources:
      - title: "Awesome AI agent attacks — 2026 timeline"
        url: https://github.com/webpro255/awesome-ai-agent-attacks
        publisher: webpro255
  - title: "Week of sandbox escapes — Cursor, Codex, Gemini CLI and Antigravity (CVE-2026-48124)"
    date: July 2026
    note: Four coding agents breached from inside their own sandboxes in a single week.
    sources:
      - title: "Awesome AI agent attacks — 2026 timeline"
        url: https://github.com/webpro255/awesome-ai-agent-attacks
        publisher: webpro255
