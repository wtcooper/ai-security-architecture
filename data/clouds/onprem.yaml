    area: tools
    requires: "A Kyverno release with ImageValidatingPolicy; the older ClusterPolicy verifyImages rule is marked deprecated"
    recommended: "Enforced for every workload namespace: matchImageReferences limited to the organisation's Harbor, a Cosign attestor holding the release key, and images referenced by digest"
    why: "Only the image built from the reviewed release, tool definitions included, can run."
    mitigations: [cap-mcp-tool-integrity]
    url: https://kyverno.io/docs/policy-types/image-validating-policy/
    verified: "2026-11-18"
  - id: promptfooMcpRedTeam
