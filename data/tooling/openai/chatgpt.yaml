vendor: openai
family: ChatGPT
tools:
  - id: toolChatgptWeb
    name: ChatGPT Enterprise (chatgpt.com)
    surfaceClasses:
      - saasChat
    variants:
      - name: ChatGPT web (chatgpt.com)
        class: saasChat
        url: https://learn.chatgpt.com/docs/use-chatgpt
      - name: ChatGPT Work Cloud (hosted tasks in OpenAI's cloud)
        class: saasChat
        url: https://learn.chatgpt.com/docs/enterprise/chatgpt-work-cloud-security
      - name: ChatGPT desktop and mobile apps as chat clients (the same synced chats)
        class: saasChat
        url: https://learn.chatgpt.com/docs/whats-new
        note: >-
          Cloud Work conversations sync across web, mobile and desktop, and the desktop app shows chats started
          on web and mobile. What the desktop app executes or reaches locally is the endpoint record
          toolChatgptDesktop.
    architecture: archEnterpriseAiChat
    status: ga
    asOf: "2026-10"
    summary:
      - >-
        ChatGPT Enterprise in the browser at chatgpt.com: Chat, Work Cloud (hosted multi-step tasks), projects,
        plugins and connected apps, Workspace Agents and GPTs, administered from the Admin Console
        (admin.openai.com) and workspace settings. The desktop and mobile apps show the same synced chats, so as
        chat clients they are this record; the desktop app's local reach — Work Local, Allow local computer
        access, Computer Use, the built-in browser and browser extension acting on the machine, and the
        requirements.toml and MDM keys that govern them — is the endpoint record toolChatgptDesktop.
      - >-
        Inference is at OpenAI. Chat and Work Cloud run entirely on OpenAI infrastructure (Work Cloud in
        VM-backed sandboxes with a hosted browser whose cookies stay separate from the device); the cloud
        environment does not inherit local files, applications, browser sessions or private-network access.
      - >-
        Enterprise administration is role-based (Owner, Admin, Member, Analytics Viewer plus custom roles
        whose grants add up, so On in any assigned role grants access), provisioned by SCIM, with plugins and apps off by default on
        Enterprise and Edu (new workspaces start with a vendor-selected set of apps enabled), per-connection
        action controls, a GPT actions domain allowlist, access-token lifetime limits, service accounts, and a
        Compliance API whose records live 30 days at source.
    facts:
      - label: Plans
        value: >-
          Business, Enterprise and Edu carry the admin controls; apps and plugins default on for Business and
          off for Enterprise and Edu, except that new Enterprise and Edu workspaces start with a vendor-selected
          set of apps enabled.
        url: https://help.openai.com/en/articles/11509118-admin-controls-security-and-compliance-for-plugins-and-apps
      - label: Inference & routing
        value: >-
          Work Cloud runs the Codex harness in an isolated OpenAI environment; the web cannot access local
          files, apps or tabs.
        url: https://learn.chatgpt.com/docs/enterprise/chatgpt-work-overview
      - label: Data leaving the device
        value: >-
          What a member types, uploads, attaches from Library or a project, or reaches through a connected app;
          the cloud environment inherits nothing else from the device. Excerpts, screenshots and browser content
          sent by local work are the endpoint record's (toolChatgptDesktop).
        url: https://learn.chatgpt.com/docs/enterprise/chatgpt-work-cloud-security
      - label: Retention & training
        value: >-
          Conversations follow workspace retention settings with deletion scheduled within 30 days; Compliance
          Logs Platform keeps 30 days; connected-app data follows the source system.
        url: https://learn.chatgpt.com/docs/enterprise/chatgpt-work-cloud-security
      - label: Docs index
        value: learn.chatgpt.com/docs/enterprise/chatgpt-work-overview (links every admin page)
        url: https://learn.chatgpt.com/docs/enterprise/chatgpt-work-overview
    items:
      - title: Workspace controls over connectors, apps and memory
        body:
          - On Enterprise and Edu workspaces, new plugins and apps are disabled by default (new workspaces start
            with a vendor-selected set of apps enabled) and enabled per role, with per-app configuration for
            real-time access, actions, approvals and domain restrictions — one control set that applies across
            web, mobile, desktop and Codex. Memory and record mode are workspace-level toggles (record off by
            default), and the Compliance Logs Platform exports immutable audit, authentication and usage events
            with 30-day source retention, so longer retention requires continuous export.
        links:
          - title: Admin controls, security, and compliance for plugins and apps
            url: https://help.openai.com/en/articles/11509118-admin-controls-security-and-compliance-for-plugins-and-apps
          - title: OpenAI Compliance Platform for Enterprise and Edu customers
            url: https://help.openai.com/en/articles/9261474-openai-compliance-platform-for-enterprise-and-edu-customers
      - title: Keeping the endpoint out of the web product
        body:
          - For cloud-only Work without cross-device sync, enable Work Cloud and leave Work Local off for the
            role; Allow local computer access sits under Work Cloud and is a separate opt-in, and turning it off
            interrupts running turns. Both are tenant switches, so they appear on the endpoint record
            (toolChatgptDesktop) as well.
        links:
          - title: ChatGPT Work cloud security — access and permissions
            url: https://learn.chatgpt.com/docs/enterprise/chatgpt-work-cloud-security
          - title: Roles and workspace permissions — local computer access with Work Cloud
            url: https://learn.chatgpt.com/docs/enterprise/roles-and-workspace-permissions
    riskNotes:
      - risk: riskExcessiveDataHandlingDuringInference
        note: >-
          Shared connections retrieve with the connected account's permissions, which the vendor warns may be
          broader than the individual user's; file excerpts and screenshots from local work are the endpoint
          record's (toolChatgptDesktop).
      - risk: riskPromptInjection
        note: >-
          The hosted cloud browser and connected apps feed arbitrary content to the model; OpenAI's
          screening (MCP content monitoring, link-generation controls, a sign-in review model) is vendor-internal
          and not admin-tunable, and a Lockdown Mode role cuts exfiltration paths without screening content.
      - risk: riskAgenticDelegationConfusedDeputy
        note: >-
          Agent-owned and shared connected accounts act for whoever triggers the task; action control
          (read-only or a custom set) is the bound.
    controls:
      - mitigation: D3-APA
        coverage: native
        mechanism: >-
          Admin Console > Permissions custom roles (Default / On / Off; grants combine additively) over Work,
          plugins and apps, developer mode, agents and GPTs; target-tenant admin consent for connector apps
          (Admin > Plugins > Configure Microsoft permissions to Entra organisation-wide consent, Google Workspace
          scope authorisation)
        steps:
          - title: Model feature access as custom roles
            body:
              - >-
                Workspace owners keep Work, plugins, custom MCP plugins, agent building or publishing and GPT
                sharing off in the workspace default and grant them through custom roles (Permissions & roles >
                Custom roles) assigned to SCIM groups; grants are additive, so Off in one role does not remove
                access another assigned role grants.
            url: https://learn.chatgpt.com/docs/enterprise/roles-and-workspace-permissions
          - title: Grant Microsoft permissions through Entra admin consent
            body:
              - >-
                In Admin > Plugins select Configure Microsoft permissions, keep only the permissions you intend to
                grant, then have an Entra administrator grant organisation-wide consent to the verified ChatGPT /
                OpenAI, L.L.C. application; actions stay off until enabled in ChatGPT.
            url: https://help.openai.com/en/articles/11509118-admin-controls-security-and-compliance-for-plugins-and-apps
          - title: Authorise Google scopes in Google Workspace
            body:
              - >-
                Have the Google Workspace administrator authorise the Drive, Docs, Sheets and Slides scopes (and
                domain-wide delegation for administrator-managed sync), or turn off the actions whose scopes you
                will not grant.
            url: https://help.openai.com/en/articles/11509118-admin-controls-security-and-compliance-for-plugins-and-apps
          - title: Require SSO for the workspace
            body:
              - >-
                In Admin Console (admin.openai.com) open Global settings > Access > Single Sign-On and, after
                testing the connection, set the ChatGPT product policy (or the workspace override) to Required;
                Required applies to members whose email is on a verified domain the policy covers.
            url: https://help.openai.com/en/articles/9534785-single-sign-on-sso-setup-for-openai-products
          - title: Verify every sign-in domain
            body:
              - >-
                Under Global settings > Access > Domains add each exact domain and subdomain, publish the DNS TXT
                record, select Check Domain, then use Manage eligibility to scope it to the intended workspaces.
            url: https://help.openai.com/en/articles/8871611-verifying-your-domain-for-openai-identity
        note: >-
          Native by the rule applied to every vendor: the console administers role- and group-based
          authorisation over connectors, agents and features (custom roles on SCIM-synced groups, whose grants add up), and
          OpenAI documents the target-tenant consent path for its connector apps — Entra organisation-wide
          consent to the verified ChatGPT / OpenAI, L.L.C. application for Outlook, Teams and SharePoint, Google
          Workspace scope authorisation and domain-wide delegation, and Slack admin approval for the ChatGPT
          Agents app. The target-tenant consent itself is the other tenant's control (Entra, Google Workspace,
          Slack, GitHub organisation approval); OpenAI does not publish the Entra app ID, so confirm the app
          identity on the consent screen. Custom roles are Enterprise, Edu and Healthcare only and take about five
          minutes to apply. Policy administration is not the runtime decision, which OpenAI makes per request.
          Required SSO sends verified-domain members through the IdP, but invited members from other domains may
          still use another permitted sign-in method; domain claiming (a separate request to OpenAI) also blocks
          corporate app connections from personal or other workspaces.
        verified: "2026-10-30"
        migration:
          from:
            - capabilityIga
            - capabilityDataAccessGovernance
          reviewRequired: false
          original:
            - capability: capabilityIga
              coverage: native
              mechanism: >-
                SCIM provisioning, workspace roles and custom roles (Permissions & roles), access-token
                expiration limit
              note: >-
                SAML/OIDC setup lives in the Help Center, which returned 403 today; the roles model is
                verified.
              steps:
                - title: Provision from the IdP
                  body:
                    - SCIM provisions membership and groups (manually managed or IdP managed); group
                      membership alone grants no feature permission.
                  url: https://learn.chatgpt.com/docs/enterprise/groups-and-provisioning
                - title: Assign roles with deny-wins semantics
                  body:
                    - Owner, Admin, Member, Analytics Viewer and custom roles carry Default / On / Off per
                      feature; an explicit Off in any role blocks access.
                  url: https://learn.chatgpt.com/docs/enterprise/roles-and-workspace-permissions
                - title: Bound token lifetime
                  body:
                    - Owners set "Access token expiration limit" in Permissions & roles.
                  url: https://learn.chatgpt.com/docs/enterprise/access-tokens
              verified: 2026-09-10
            - capability: capabilityDataAccessGovernance
              coverage: partial
              mechanism: Connected-service permissions govern retrieval; source-system permission mapping
              note: >-
                Shared connections use the connected account's permissions, potentially broader than the
                user's.
              steps:
                - title: Test with a least-privileged account
                  body:
                    - A member can use an MCP server only when the plugin is available to their role and they
                      have access to the connected service; verify with an account holding only intended
                      permissions.
                  url: https://learn.chatgpt.com/docs/enterprise/apps-and-connectors
              verified: 2026-09-10
      - mitigation: D3-OTF
        coverage: partial
        mechanism: >-
          ChatGPT-Allowed-Workspace-Id header injected on https://chatgpt.com/* by the organisation's SASE or
          TLS-inspecting proxy and enforced by OpenAI; workspace IP allowlisting (inbound)
        steps:
          - title: Inject the allowed-workspace header
            body:
              - >-
                Have the SASE or proxy add ChatGPT-Allowed-Workspace-Id with the workspace UUID(s), comma-separated
                without spaces, to requests for https://chatgpt.com/*; OpenAI filters out every other workspace,
                personal ones included, and returns 403 when none remain.
            url: https://help.openai.com/en/articles/20001323-corporate-network-controls-in-chatgpt-enterprise
          - title: Block logged-out use and cover the apps
            body:
              - >-
                Block URLs starting https://chatgpt.com/backend-anon/, and add the proxy's certificates to the
                desktop and mobile apps' pin list by MDM (the apps pin certificates), or block desktop.chatgpt.com,
                ios.chat.openai.com and android.chat.openai.com outright.
            url: https://help.openai.com/en/articles/20001323-corporate-network-controls-in-chatgpt-enterprise
          - title: Restrict where the workspace is reachable from
            body:
              - >-
                Workspace Settings > Identity & access > Access Restrictions, add IP ranges for Workspace and
                Compliance API, then toggle Activate IP Allowlist (changes take 5-15 minutes).
            url: https://help.openai.com/en/articles/12111596-ip-allowlisting-for-chatgpt
        note: >-
          Partial by the rule applied to every vendor: OpenAI honours a documented allowed-workspace header that
          the organisation's proxy injects and enforces the block server-side; the SSE only admits the
          destination, and a pinned session to the approved tenant is not readable. It holds only on traffic the
          proxy sees and can decrypt — the desktop and mobile apps pin certificates, so devices without the MDM
          pin exception are outside it. A customer proxy does not control OpenAI's own egress: Work Cloud code and
          shell (public internet toggle and managed allowlist), the cloud browser, deep research, agent mode and
          connector calls leave from OpenAI infrastructure; the vendor-side levers are the Work network setting
          and a Lockdown Mode role (live browsing, agent mode, deep research and file downloads off; Codex
          unaffected). IP allowlisting limits inbound access to the workspace and Compliance API, not outbound
          traffic. The desktop app's local runtime — its workspace pin, command networking and desktop-app
          destination rules — is the endpoint record toolChatgptDesktop.
        verified: "2026-10-30"
        migration:
          from:
            - capabilitySse
            - capabilityEgressControl
          reviewRequired: false
          original:
            - capability: capabilitySse
              coverage: partial
              mechanism: >-
                Tenancy pinning in product (allowed_chatgpt_workspaces for the desktop app, IP access
                restrictions referenced); inline inspection is a third-party SSE
              note: >-
                Comparable to Claude chat: the vendor pins tenancy (allowed_chatgpt_workspaces) and offers
                workspace IP access restrictions, and the inline inspection is the customer's SSE; rated
                partial for the same reason.
              steps:
                - title: Pin the desktop app to the workspace
                  body:
                    - allowed_chatgpt_workspaces in requirements.toml restricts sign-in to listed workspace UUIDs.
                  url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
              verified: 2026-09-10
            - capability: capabilityEgressControl
              coverage: partial
              mechanism: '"Allow public internet access" for Work Cloud code/shell (managed allowlist when off);
                [experimental_network] for Work Local'
              steps:
                - title: Turn off public internet for cloud code and shell
                  body:
                    - When disabled, commands reach only required hostnames from a managed allowlist; this
                      controls destinations, not commands.
                  url: https://learn.chatgpt.com/docs/sandboxing
                - title: Allowlist domains for local commands
                  body:
                    - "[experimental_network] with managed_allowed_domains_only = true; browser tools and MCP
                      are outside it."
                  url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
              note: Work Cloud code and shell follow the managed allowlist when public internet access is off; Work Local
                commands follow [experimental_network]. Browser, computer use and connector traffic are
                outside both and need a network-layer control.
              verified: 2026-09-10
      - mitigation: cap-sensitive-data-redaction
        coverage: partial
        mechanism: >-
          SharePoint app Safety & Security Controls > Excluded sensitivity labels without encryption (label-based
          restriction); no in-product inspection of prompts, uploads or responses in Chat or Work
        steps:
          - title: Exclude labelled SharePoint files
            body:
              - >-
                In the SharePoint app's Safety & Security Controls enter each non-encrypting Microsoft Purview
                label GUID under Excluded sensitivity labels without encryption; files with encrypting labels are
                already excluded.
            url: https://help.openai.com/en/articles/20001502-managing-sharepoint-site-access-and-sensitivity-label-exclusions
          - title: Inspect prompts at the endpoint or browser
            body:
              - >-
                Apply endpoint, browser or SSE DLP inline to chatgpt.com; the desktop and mobile apps need the
                proxy certificate added to their pin list by MDM before SSL inspection works.
            url: https://help.openai.com/en/articles/20001323-corporate-network-controls-in-chatgpt-enterprise
          - title: Scan conversations after the fact
            body:
              - >-
                Have a workspace owner create an Admin key with Conversation messages and app-log access and feed
                the Compliance Logs Platform to a DLP partner such as Microsoft Purview, Netskope, Cyberhaven,
                Forcepoint or Palo Alto Networks.
            url: https://help.openai.com/en/articles/9261474-openai-compliance-platform-for-enterprise-and-edu-customers
        note: >-
          Partial only by the label-restriction clause of the rule applied to every vendor: the SharePoint
          sensitivity-label exclusion, enforced by OpenAI, keeps labelled files out of SharePoint app results
          (supported Office, PDF and MP4 files; TXT and CSV are treated as unlabelled; OneDrive is separate).
          Nothing in Chat or Work detects identifiers, secrets or classified content in what an employee types or
          uploads, in connector payloads or in responses, and nothing masks them; Prisma AIRS external guardrails
          scan Codex prompts only. The pin's objective — classification before material leaves the person — is
          met by endpoint or browser DLP inline; Compliance Logs Platform partners scan conversations after they
          reach OpenAI (detection after the fact, 30-day source window). Action controls and parameter
          constraints limit where data can go but inspect nothing; the desktop app's local minimisation keys
          (deny_read, allow_appshots) are on toolChatgptDesktop.
        verified: "2026-10-30"
        migration:
          from:
            - capabilityAiDlp
            - capabilityBrowserDetectionResponse
          reviewRequired: false
          original:
            - capability: capabilityAiDlp
              coverage: partial
              mechanism: Action control per connection and requirements.toml deny_read / allow_appshots
              note: >-
                In-product controls limit what agents can reach and screenshot; nothing inspects prompt or
                upload content.
              steps:
                - title: Limit what connections may do
                  body:
                    - Action control allows read-only, all or a custom set of actions per connection.
                  url: https://learn.chatgpt.com/docs/enterprise/apps-and-connectors
                - title: Stop screenshots and secret reads on the desktop
                  body:
                    - allow_appshots = false and [permissions.filesystem] deny_read in requirements.toml.
                  url: https://learn.chatgpt.com/docs/enterprise/chatgpt-work-local-security
              verified: 2026-09-10
            - capability: capabilityBrowserDetectionResponse
              coverage: partial
              mechanism: Managed browser controls for the built-in browser (origins, uploads, downloads, developer access;
                browser_use flags)
              note: Covers the agent's browser, not the employee's browser session on chatgpt.com. Rated partial for the
                managed agent browser only; the employee's own browser on chatgpt.com is secured by the
                organisation's browser tooling, which is external here as for every other chat SaaS.
              steps:
                - title: Restrict the built-in browser
                  body:
                    - Set [features] browser_use and browser_use_full_cdp_access = false, or use the managed
                      browser controls to restrict origins, uploads, downloads and developer access.
                  url: https://learn.chatgpt.com/docs/browser
              verified: 2026-09-10
      - mitigation: cap-input-guardrails
        coverage: partial
        mechanism: >-
          Vendor-operated screening of returned content (online and offline monitoring of MCP content for prompt
          injection, policy screening of MCP prompts, known-malicious-domain blocking, link-generation controls,
          a cloud-browser sign-in review model); none of it is admin-configurable
        steps:
          - title: Verify the vendor's returned-content defenses
            body:
              - >-
                Assess the app and MCP safeguards the App security whitepaper describes (injection monitoring,
                malicious-domain blocking, link-generation controls) and record that no admin toggle, threshold
                or detection event exists for them.
            url: https://cdn.openai.com/business-guides-and-resources/app-security-whitepaper.pdf
          - title: Limit untrusted MCP sources
            body:
              - >-
                In Permissions & roles grant Upload plugins with custom MCP servers and Create plugins with MCPs
                only to vetted builders; only admins and owners can publish a custom app.
            url: https://learn.chatgpt.com/docs/enterprise/apps-and-connectors
          - title: Put high-risk groups in a Lockdown Mode role
            body:
              - >-
                Designate a custom role as a Lockdown Mode role and assign the groups that handle sensitive data,
                which turns off live browsing, agent mode and deep research; it limits exfiltration and does not
                screen content.
            url: https://help.openai.com/en/articles/20001061-lockdown-mode
        note: >-
          Partial by the rule applied to every vendor: OpenAI documents vendor-internal screening of returned
          content — online and offline monitoring for prompt injection originating from MCP servers, policy
          screening of MCP prompts, blocking of known malicious domains, link-generation controls against
          URL-based exfiltration and a review model on cloud-browser sign-in pages — but none of it can be
          switched on, tuned or set to block by the admin, and no detection event is a documented Compliance Logs
          Platform type. Lockdown Mode cuts outbound paths and, per the vendor, does not prevent prompt injections
          from appearing in the content ChatGPT processes; Auto approve and Important actions classify
          actions, not input; the frozen tool snapshot of custom MCP apps guards definitions, not results; Prisma
          AIRS (Codex only) screens prompts, not tool results. Records read through the organisation's own MCP
          tier can be classified by its gateway (the drawing's second pin).
        verified: "2026-10-30"
        migration:
          from:
            - capabilityPromptInjectionDefense
          reviewRequired: false
          original:
            - capability: capabilityPromptInjectionDefense
              coverage: partial
              mechanism: >-
                Sign-in review model in the built-in browser, automated risk checks on Auto approve, safety
                review pauses
              steps:
                - title: Know what the vendor checks
                  body:
                    - A review model checks sign-in requests for phishing or deception; the feature is tested against prompt
                      injection.
                  url: https://learn.chatgpt.com/docs/browser
              note: >-
                Vendor-operated review on browser sign-in and Auto approve actions; page and file content the
                assistant reads is not classified for injected instructions, and nothing is customer-tunable.
              verified: 2026-09-10
      - mitigation: cap-ai-vendor-assessment
        coverage: external
        mechanism: >-
          Vendor evidence from the OpenAI Trust Portal and the App security and Workspace agents security papers,
          consumed by the organisation's TPRM platform
        evidence:
          - title: >-
              OpenAI Trust Portal (SafeBase) — SOC 2 Type 2, SOC 3, ISO/IEC 27001/27017/27018/27701 and 42001, CSA
              STAR, PCI DSS, FedRAMP 20x, pentest report, subprocessors and DPA (2026-09-25)
            url: https://trust.openai.com/
          - title: App security whitepaper (June 2026)
            url: https://cdn.openai.com/business-guides-and-resources/app-security-whitepaper.pdf
          - title: Workspace agents security overview
            url: https://cdn.openai.com/business-guides-and-resources/workspace-agents-security-overview.pdf
        note: >-
          External by the rule applied to every vendor: the assessment runs in the organisation's TPRM platform.
          The portal describes itself as covering ChatGPT Enterprise and Edu and lists SOC 2 Type 2 (the 2026
