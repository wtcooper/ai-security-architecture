id: archCodingAgentZones
surface: surfaceEndpoint
rank: 6
title: Coding & desktop agents — zone map (spike)
abbrev: Coding agents · zones

summary:
  - >
    Research preview. The vendored coding and desktop agents redrawn in the spike grammar
    (data/ONTOLOGY-SPIKE.md): five ownership bands as geometry, nine numbered data flows as the
    content. The same archetype as the main coding-agent architecture, organised so the reader
    sees which boundary each path crosses and what the organisation put on it.

description:
  - >
    The bands make one thing explicit that the main drawing leaves implicit: every path out of
    the endpoint crosses a control the organisation operates, and that control does a different
    job depending on where the path goes. Traffic to the vendor's own service is a sanctioned
    product path under an enterprise agreement — the crossing there is destination admission,
    an allowlist entry that exists because third-party risk management cleared the vendor, and
    the session is not inspected because a pinned TLS session cannot be. Traffic to registries,
    the open web and third-party servers is arbitrary, and gets admission and inspection both.
  - >
    The band split matters just as much. The vendor's service is external — outside the company,
    whatever the contract says — while our repositories, internal MCP servers and org data sit
    in their own band. So the drawing distinguishes three crossings with three different jobs:
    admission for the approved vendor, admission plus inspection for the open internet, and
    brokered scoped grants through the MCP gateway for our own systems. That distinction is
    what a risk owner needs and what a single "gateway" box hides.
  - >
    The vendor's own control plane — managed settings, connector brokering, audit export,
    remote and scheduled sessions — stays inside the vendor block as items. Under the
    three-zone responsibility rule those are the vendor's internals: assured, not drawn as
    ours. What the organisation operates is the two crossings, and everything on this page that
    can be configured, revoked or logged by us lives in that band.

distinguishedBy:
  - >
    Against the coding and desktop agents in the main grammar: same archetype and the same
    exemplars, different organising principle — and one thing made explicit that the main
    drawing leaves to a pin, which is that the vendor session, the internet and our own systems
    are three different crossings with three different enforcement jobs.
  - >
    Against the personal agent zone map, its sibling in this spike: the same five bands on an
    archetype with a vendor in it. There the workload is assembled by the owner with no vendor
    anywhere; here the workload is a vendor's application and the vendor's cloud sits in the
    external band, which is why this drawing has two crossings rather than one.

exemplars:
  - name: Terminal CLIs and IDE extensions
    note: >
      The engine in a shell or an editor against a working directory, with a permission model
      for writes and command execution and project-scoped tool servers.
    asOf: "2026-08"
  - name: Desktop assistant apps
    note: >
      The same engine behind a desktop GUI, with standing connectors and an opt-in computer-use
      mode behind OS grants.
    asOf: "2026-08"
  - name: Managed enterprise deployments
    note: >
      The same product with centrally managed settings, a tool-server allowlist and exported
      audit — the vendor control plane switched on, which is the difference between a governed
      deployment and a shadow one.
    asOf: "2026-08"

zones:
  - id: zonePrincipal
    title: Developer surfaces
    owner: principal
    note: The person at the keyboard, and the surfaces they steer the session from when they are not.
  - id: zoneWorkload
    title: Vendor application on the endpoint
    owner: workload
    note: >
      The application the vendor ships, running on the organisation's device: the harness, its
      tool surface and its memory. Ours to manage, theirs to build — and with no route of its
      own to our systems or the outside.
  - id: zoneCrossing
    title: Enterprise crossing
    owner: crossing
    note: >
      What the organisation operates and can change: the egress control every outbound path
      crosses — admitting the approved vendor, admitting and inspecting everything else — and
      the MCP gateway that admits agents into our own systems.
  - id: zoneEnterprise
    title: Enterprise systems & data
    owner: enterprise
    note: >
      Our repositories, internal tool servers and org data — the systems the agent is meant to
      work on, reached through our gateway rather than directly.
  - id: zoneExternal
    title: External
    owner: external
    note: >
      Outside the company, including the vendor's own cloud: their backend and control plane,
      the model providers behind it, package registries and the open web.

blocks:
  - id: remoteDevice
    kind: service
    title: Remote device
    cosaiComponent: componentAgentUserQuery
    zone: zonePrincipal
    col: 0
    row: 0
    note: >
      The surfaces that steer a session when the developer is not at the machine — phone, web
      and chat. Bound to the owner's vendor account, and admin-toggleable, which is what
      separates this from a personal agent's open channels.
    items:
      - id: phoneWeb
        label: Phone & web apps
        icon: phone
        note: The owner's own surfaces, signed into the same vendor account as the harness.
      - id: chatChannels
        label: Chat channels
        icon: chat
        note: >
          The @-mention surfaces — and the widest admission decision here, because whoever the
          channel admits can raise a session.

  - id: developer
    kind: actor
    title: Developer
    icon: person
    zone: zonePrincipal
    col: 0
    row: 1
    note: >
      Present, watching, and the approval gate for what matters — the property the whole
      archetype's posture rests on, and the one that unattended modes quietly remove.

  - id: harness
    kind: service
    title: Agent harness
    cosaiComponent: componentReasoningCore
    zone: zoneWorkload
    col: 1
    row: 1
    note: >
      The loop behind the terminal, editor or chat window, running as the user. Remote steering
      reaches it over an outbound relay; it opens no port of its own.
    items:
      - id: loop
        label: Agent loop
        icon: agent
        note: Decides the next edit, command or screen action from everything it has read.
      - id: context
        label: Context assembly
        icon: doc
        note: Merges the instruction, the memory and the tool results into one prompt.

  - id: memory
    kind: service
    title: Memory & state
    cosaiComponent: componentDataStorage
    zone: zoneWorkload
    col: 1
    row: 2
    note: >
      Agent-written notes and the rules files merged into every later session — on by default
      in several products, and repo-committed in all of them.
    items:
      - id: memoryFiles
        label: Memory files
        icon: folder
        note: Agent-written notes loaded at the start of every session.
      - id: rules
        label: Rules & instructions
        icon: doc
        note: The AGENTS.md-class files — the repo-committed ones authored by whoever last committed.

  - id: toolPlane
    kind: service
    title: Tool services
    cosaiComponent: componentTools
    zone: zoneWorkload
    col: 2
    row: 2
    note: >
      The application's action surface, running as the user on a machine that also holds their
      SSH keys, cloud credentials and browser sessions.
    items:
      - id: editTools
        label: File & edit tools
        icon: folder
        note: Read and write across the working tree and the user's documents.
      - id: shell
        label: Shell commands
        icon: code
        note: Command execution with the user's authority when it runs outside the sandbox.
      - id: mcp
        label: Local & remote MCP
        icon: plug
        note: Local child processes with the user's privileges, and remote servers behind the gateway.
      - id: sandboxedTools
        label: Sandboxed tools
        icon: shield
        note: Where builds, tests and driven desktops run when isolation is on.

  - id: egressControl
    kind: service
    title: Egress control
    zone: zoneCrossing
    col: 3
    row: 1
    note: >
      The organisation's firewall and proxy tier — the crossing every outbound path from the
      endpoint takes, doing a different job on each. To the approved vendor it is destination
      admission: the vendor's endpoints are in the allowlist because third-party risk
      management put them there, and the session itself is not inspected. To the open internet
      it is admission and inspection both.
    items:
      - id: approvedDestinations
        label: Approved destinations
        icon: scale
        note: >
          The vendor endpoints an assessment cleared. The allowlist entry is where the approval
          decision is actually enforced — and its absence is what stops an unapproved tool.
      - id: allowlist
        label: Egress allowlist
        icon: shield
        note: Deny by default for everything else — registries, the web, third-party servers each named.
      - id: inspection
        label: Content inspection
        icon: eye
        note: >
          Applied to the arbitrary-destination traffic, not to the vendor session — a pinned
          TLS session cannot be inspected, and breaking it breaks the product.
      - id: edgeAudit
        label: Audit tap
        icon: doc
        note: Our own record of what left and where it went, independent of the vendor's export.

  - id: mcpGateway
    kind: service
    title: MCP gateway
    zone: zoneCrossing
    col: 3
    row: 3
    note: >
      The crossing into our own systems: the connector marketplace on the organisation's
      gateway tier, which is how both the local agent and the vendor's hosted sessions reach
      org data — and the only place that reach is scoped and recorded.
    items:
      - id: marketplace
        label: Connector marketplace
        icon: db
        note: Which internal servers and connectors an agent may be offered — admission, not discovery.
      - id: scopedGrants
        label: Scoped grants & BYOK
        icon: key
        note: Short-lived, audience-bound grants on the organisation's own keys.
      - id: gwAudit
        label: Audit tap
        icon: doc
        note: The org-side record of everything an agent touched in our systems.

  - id: repos
    kind: external
    title: Repos & documents
    cosaiComponent: componentDataSources
    zone: zoneEnterprise
    col: 4
    row: 3
    note: >
      Our source control and document stores. The content is ours; it is also contributed to by
      many hands, which makes a clone untrusted input the moment it lands on the endpoint.
    items:
      - id: code
        label: Code & project docs
        icon: doc
        note: A repository is a document the attacker may have contributed to.
      - id: dotfile
        label: Tool config dotfile
        icon: gear
        note: The tool-server declaration that ships with the code — the most attacked artifact here.

  - id: orgData
    kind: external
    title: Enterprise data
    cosaiComponent: componentDataSources
    zone: zoneEnterprise
    col: 4
    row: 4
    note: >
      The systems of record behind our internal connectors — tickets, documents and business
      data the agent reads and changes through the gateway.
    items:
      - id: records
        label: Org data
        icon: db
        note: Reached under the developer's scope, never a standing service account.
      - id: fileStorage
        label: File storage
        icon: folder
        note: Governed content stores reached through our connectors rather than the device's mounts.

  - id: vendorService
    kind: provider
    title: Vendor service
    zone: zoneExternal
    col: 5
    row: 0
    note: >
      The vendor's backend and the published surfaces of its control plane — outside the
      company, whatever the contract says. Its internals are assured, not drawn: what is listed
      here is only what the organisation can configure or receive.
    items:
      - id: managedSettings
        label: Managed settings
        icon: gear
        note: Centrally enforced permissions and a tool-server allowlist. Off by default.
      - id: auditExport
        label: Session audit export
        icon: eye
        note: Exported prompts, tool calls and approvals — in an unmanaged install, no record at all.
      - id: remoteSessions
        label: Remote & scheduled sessions
        icon: phone
        note: The relay behind phone steering and the scheduler behind unattended runs.

  - id: provider
    kind: provider
    title: Model provider
    cosaiComponent: componentModelServing
    zone: zoneExternal
    col: 5
    row: 1
    note: The inference API behind the vendor's service. The completion drives writes, commands and clicks.
    items:
      - id: inference
        label: Inference API
        icon: model
        note: Receives code, documents and screenshots; returns the plan.

  - id: downstream
    kind: external
    title: Downstream services
    cosaiComponent: componentDataSources
    zone: zoneExternal
    col: 5
    row: 2
    note: >
      What the tool plane reaches on the open internet — dependency registries, the web, and
      third-party SaaS the developer has grants into.
    items:
      - id: registries
        label: Package registries
        icon: db
        note: Dependencies and their metadata, authored by strangers and read into context.
      - id: web
        label: Web & APIs
        icon: globe
        note: Attacker-writable content that re-enters the loop, and the exfiltration path out.
      - id: saas
        label: SaaS
        icon: mail
        note: Third-party accounts reached on standing grants that outlive the conversation.

edges:
  - from: developer
    to: harness
    path: primary
    bidir: true
    label: task / approval
    note: >
      The developer states the task and answers the prompts. Whoever is at the machine is the
      user, as far as the application is concerned.
  - from: developer
    to: remoteDevice
    path: primary
    bidir: true
    label: away from the machine
    note: The same person, not at the keyboard — or, on a chat surface, not necessarily the same person.
  - from: remoteDevice
    to: egressControl
    path: primary
    bidir: true
    label: remote steering
    note: >
      Steering from away reaches the vendor's relay through the organisation's edge, so a
      session raised from a phone is a session the organisation can see and refuse.
  - from: harness
    to: egressControl
    path: primary
    bidir: true
    label: app session & inference
    note: >
      The application session and every model call inside it, leaving for an allowlisted
      destination. The control here is that the vendor is approved and named — not inspection,
      which the pinned session forbids and the agreement makes unnecessary.
  - from: egressControl
    to: vendorService
    path: external
    bidir: true
    route: vh
    label: to the approved vendor
    note: >
      Out to the vendor's backend on a session-scoped credential. This destination is in the
      allowlist because an assessment cleared it, and the enterprise agreement — retention,
      training terms, tenancy — is what governs the data once it arrives.
  - from: vendorService
    to: provider
    path: external
    bidir: true
    note: The vendor's service calls the model provider; everything behind that interface is theirs.
  - from: harness
    to: memory
    path: primary
    bidir: true
    note: The loop writes what it learns and reads it back as instruction on the next task.
  - from: harness
    to: toolPlane
    path: primary
    bidir: true
    route: hv
    label: tool calls
    note: Tool calls out with whatever scope the permission model granted; results back into context.
  - from: toolPlane
    to: egressControl
    path: primary
    bidir: true
    route: hv
    label: web & package egress
    note: >
      Dependency fetches and web reads leave through the same edge — the last boundary between
      a content-borne injection and an attacker's collection endpoint.
  - from: toolPlane
    to: mcpGateway
    path: primary
    bidir: true
    route: hv
    label: internal connectors
    note: >
      The path into our own systems: connectors the marketplace admits, on grants scoped to the
      developer rather than to the machine.
  - from: egressControl
    to: mcpGateway
    path: primary
    bidir: true
    label: hosted sessions inbound
    note: >
      Cloud and scheduled sessions running in the vendor's environment come back through the
      edge and are admitted to org systems by our own gateway — never directly.
  - from: mcpGateway
    to: repos
    path: primary
    bidir: true
    label: source & documents
    note: >
      Repository and document reads, and the writes that become pull requests — recorded on our
      side of the boundary.
  - from: mcpGateway
    to: orgData
    path: primary
    bidir: true
    route: vh
    label: scoped reads & writes
    note: Business systems reached under the developer's scope, logged by us rather than by the vendor.
  - from: egressControl
    to: downstream
    path: external
    bidir: true
    route: vh
    label: internet egress
    note: >
      Registries, the web and third-party SaaS — allowlisted at the edge, because everything
      fetched here re-enters the loop as context.

pins:
  risks:
    - risk: riskPromptInjection
      at: mcpGateway->repos
      note: >
        Source files, manifests, issue text and documents are unrelated paths into the same
        context window, none of which is the developer's instruction.
    - risk: riskPromptInjection
      at: memory
      note: >
        Memory files and rules are prose a later session treats as instruction — including
        rules committed by whoever last touched the repo.
    - risk: riskToolRegistryTampering
      at: toolPlane
      note: >
        Configuration admits the whole tool plane and can arrive with the clone. Injecting into
        it and swapping it after approval are the disclosed paths.
    - risk: riskInsecureModelOutput
      at: harness->egressControl
      note: The completion is unauthenticated content, and it drives file writes, commands and clicks.
    - risk: riskExcessiveDataHandlingDuringInference
      at: egressControl->vendorService
      note: >
        Code, documents and screenshots leave the company here — usually more than the
        developer pictured sharing, and only the edge can see how much.
    - risk: riskStaleAgentIdentityBinding
      at: remoteDevice->egressControl
      note: >
        A remote channel is only as good as the account and device binding behind it; a stale
        login steering a machine full of credentials is an account-compromise blast radius.
    - risk: riskAgenticDelegationConfusedDeputy
      at: egressControl->mcpGateway
      note: >
        A hosted session arriving with a connector grant is the vendor's infrastructure
        exercising our authority — the grant is what bounds it, and our gateway issues it.
    - risk: riskSensitiveDataDisclosure
      at: toolPlane->egressControl
      note: >
        The machine also holds SSH keys, cloud credentials and browser sessions; outside the
        sandbox nothing separates them from the agent's shell on the way out.
    - risk: riskToolSourceProvenance
      at: egressControl->downstream
      note: >
        Dependencies and remote servers arrive on publisher self-attestation, and their
        descriptions and contents are read into context as model input.
    - risk: riskRogueActions
      at: mcpGateway->orgData
      note: Writes into systems of record from a loop whose plan nobody reviewed.
    - risk: riskShadowAndUnknownAgents
      at: harness
      note: >
        A binary a developer can fetch without asking anyone. Unmanaged, it has no policy, no
        audit and no inventory entry — and that is the common case.

  capabilities:
    - capability: capabilityIga
      at: remoteDevice->egressControl
      note: >
        Bind the session to a named user on a managed device before it reaches the vendor's
        relay — the admission decision belongs to us, not to the account alone.
    - capability: capabilityAgentRuntimeEnforcement
      at: harness->egressControl
      note: Session admission and per-call policy evaluated at the edge, outside the application being governed.
    - capability: capabilityAiTprm
      at: egressControl->vendorService
      note: >
        The assessment behind the allowlist entry. On this path the vendor's own controls,
        retention terms and tenancy are the substance of the review — because once the
        destination is approved and named, the session itself is not something we inspect.
    - capability: capabilityAiDlp
      at: toolPlane->egressControl
      note: >
        Inspection belongs on the arbitrary-destination path, where the agent fetches from
        registries and the open web — not on the pinned vendor session.
    - capability: capabilityEgressControl
      at: egressControl->downstream
      note: Default-deny outbound with an allowlist — the vendor's endpoints and the approved registries, nothing else.
    - capability: capabilityToolPermissionScoping
      at: harness->toolPlane
      note: >
        Per-tool grants scoped to the working tree and the task, instead of the developer's
        full authority on the machine.
    - capability: capabilityAgentSandboxing
      at: toolPlane
      note: >
        Make sandboxed tools the default path for commands and computer use, so the approval
        gate fires only for actions that leave the box.
    - capability: capabilityCredentialIsolation
      at: toolPlane
      note: Keep SSH keys, cloud credentials and browser profiles outside the agent's reachable filesystem.
    - capability: capabilityMemoryProtection
      at: harness->memory
      note: Treat memory and rules as untrusted input on read; a repo-committed rules change is a code change.
    - capability: capabilityPromptInjectionDefense
      at: mcpGateway->repos
      note: Treat repository and document content as untrusted; it cannot be authenticated, only bounded.
    - capability: capabilitySecretsManagement
      at: mcpGateway
      note: >
        Org access rides short-lived, connector-scoped grants issued at the marketplace on our
        own keys — the vendor's cloud never holds a standing org credential.
    - capability: capabilityMcpToolSecurity
      at: toolPlane->mcpGateway
      note: Provenance and behavioural review before a server is admitted; pin versions so an update is a decision.
    - capability: capabilityHitlControls
      at: mcpGateway->orgData
      note: Non-overridable approval on consequential writes, kept rare enough that each prompt is read.
    - capability: capabilityAgentRegistry
      at: mcpGateway
      note: >
        A managed allowlist of connectors and tool servers, enforced from our gateway rather
        than from the configuration file it governs.
    - capability: capabilityAuditLogging
      at: egressControl
      note: >
        Our own session record, fused with the vendor's export — only the combination covers
        what the vendor's console cannot see.
    - capability: capabilityShadowAiDiscovery
      at: harness
      note: Find the installs that never enrolled, because this archetype spreads one developer at a time.

flows:
  - id: F1
    title: Developer works at the machine
    moves: The task, the diffs, and the approvals that gate what matters.
    path: [developer->harness, harness->toolPlane]
    threats: [Approval fatigue, Unreviewed writes to the working tree]
    controls: [capabilityToolPermissionScoping, capabilityAgentSandboxing]
    note: The attended path, and the one the archetype's whole posture assumes is the normal case.
  - id: F2
    title: Remote steering
    moves: Instructions and approvals from a phone, a browser or a chat thread, and the results back.
    path: [developer->remoteDevice, remoteDevice->egressControl, egressControl->vendorService]
    threats: [Stale account or device binding, Chat channels admitting more than the owner]
    controls: [capabilityIga, capabilityAgentRuntimeEnforcement]
    note: >
      Outbound relay, no inbound port — but the admission decision now lives with the vendor's
      identity system unless our edge makes it ours too.
  - id: F3
    title: Model inference
    moves: Code, documents and screenshots out for inference; the completion that drives the next action back.
    path: [harness->egressControl, egressControl->vendorService, vendorService->provider]
    threats: [Unapproved vendor or model, Excessive data under the agreement, Tenant drift to a personal account]
    controls: [capabilityAiTprm, capabilityEgressControl, capabilityAgentRuntimeEnforcement]
    note: >
      A sanctioned path: the vendor is approved, its endpoints are allowlisted, and the
      agreement governs the data once it arrives. What we enforce here is that the destination
      is the approved one and the session belongs to our tenant — not what is inside it.
  - id: F4
    title: Repository and document content
    moves: Clones, file reads, issue text and documents — read into context as though instruction.
    path: [toolPlane->mcpGateway, mcpGateway->repos]
    threats: [Indirect prompt injection, Tool config arriving with the clone]
    controls: [capabilityPromptInjectionDefense, capabilityMcpToolSecurity]
    note: The content is ours and still untrusted — many hands wrote it, and none of them are authenticated.
  - id: F5
    title: Local execution and memory
    moves: Commands, edits and generated files; the notes and rules the next session reads back.
    path: [harness->toolPlane, harness->memory]
    threats: [Command execution with the developer's authority, Memory poisoning, Credential harvesting]
    controls: [capabilityAgentSandboxing, capabilityCredentialIsolation, capabilityMemoryProtection]
    note: The machine holds the developer's keys and sessions; the sandbox is what stands between them and the loop.
  - id: F6
    title: Enterprise systems
    moves: Calls into our internal connectors, and the records they read and change.
    path: [toolPlane->mcpGateway, mcpGateway->orgData]
    threats: [Over-scoped internal grants, Bulk reads of org data, Writes with no approval]
    controls: [capabilitySecretsManagement, capabilityHitlControls, capabilityAgentRegistry]
    note: >
      The flow the deployment exists for — and the one where our gateway, not the vendor's
      console, decides what the agent may touch.
  - id: F7
    title: Internet egress
    moves: Dependency fetches, web reads and third-party SaaS calls.
    path: [toolPlane->egressControl, egressControl->downstream]
    threats: [Web-borne injection, Exfiltration to an attacker endpoint, Malicious dependencies]
    controls: [capabilityEgressControl, capabilityAiDlp, capabilityAuditLogging]
    note: Everything fetched here re-enters the loop as context, which is why the allowlist is a security control.
  - id: F8
    title: Hosted sessions reach back
    moves: Requests from cloud and scheduled sessions running in the vendor's environment into our systems.
    path: [vendorService->egressControl, egressControl->mcpGateway, mcpGateway->orgData]
    threats: [Vendor infrastructure exercising our authority, Standing org credentials in a vendor cloud]
    controls: [capabilitySecretsManagement, capabilityAgentRegistry, capabilityHitlControls]
    note: >
      Nobody's laptop is involved in this one. It is the crossing that most often has no
      component on it at all, and the reason the MCP gateway is drawn.
  - id: F9
    title: Vendor control plane
    moves: Managed settings and allowlists down; session audit export back.
    path: [egressControl->vendorService]
    threats: [Unmanaged install with no policy or audit, Settings left at default]
    controls: [capabilityAuditLogging, capabilityShadowAiDiscovery, capabilityAiTprm]
    note: >
      The vendor's plane, not ours — assured rather than drawn. What we own is fusing its
      export with our edge's record, and finding the installs that never enrolled.

scenarios:
  - title: The developer asks for a change
    steps:
      - follow: developer->harness
        note: The task is stated by a human who will stay for the session.
      - follow: harness->egressControl
        note: Context leaves for an allowlisted destination — the vendor our assessment approved, and no other.
      - follow: egressControl->vendorService
        note: The vendor's service takes the session and calls the model behind it.
      - follow: harness->toolPlane
        note: Edits and commands execute with whatever scope the permission model granted.
      - follow: toolPlane->mcpGateway
        note: Anything reaching our systems is admitted by our marketplace, on our grants.
  - title: A poisoned document phones home
    steps:
      - follow: mcpGateway->repos
        note: A hidden instruction in a source file or document is read into context.
      - follow: harness->egressControl
        note: The instruction shapes the completion, which the loop treats as the plan.
      - follow: toolPlane->egressControl
        note: The exfiltration attempt has to cross the egress allowlist — the last control standing.
  - title: A hosted session reaches back
    steps:
      - follow: vendorService->egressControl
        note: A cloud or scheduled session asks for org data; nobody's laptop is involved.
      - follow: egressControl->mcpGateway
        note: Our edge hands it to our gateway rather than letting the vendor's cloud reach in.
      - follow: mcpGateway->orgData
        note: The scoped, BYOK-backed grant reaches exactly the admitted connector, and we record it.

deviations:
  - subject: The vendor session crosses the egress control but is not inspected there
    reason: >
      An approved vendor's own service is a sanctioned destination: the allowlist entry exists
      because third-party risk management cleared it, and the session is pinned TLS that cannot
      be inspected without breaking the product. Drawing an inspection point on that path would
      assert a control nobody operates. The controls that do apply are the approval behind the
      allowlist entry, the tenant binding in managed settings, and the agreement itself.
  - subject: The vendor's cloud sits in the external band
    reason: >
      A vendor's backend is outside the company whatever the contract says, so it belongs with
      the model providers and the open web rather than in a band of its own. Its control-plane
      surfaces are items on the block because the organisation configures and consumes them —
      its internals are assured, not drawn.
  - subject: The sandbox is not drawn as a frame
    reason: >
      The workload band already carries the containment reading, and a frame inside a band
      reads as a second boundary of the same kind. Sandboxing is stated on the tool surface and
      pinned as a capability instead.

