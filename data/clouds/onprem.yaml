      - title: "Temporal Platform security features"
        url: https://docs.temporal.io/self-hosted-guide/security
    summary:
      - "Your agent runs as a Temporal Workflow on your own Kubernetes cluster, started only by triggers from Kafka, webhooks or timers. Every model and tool call passes LiteLLM Proxy, which holds the agent's virtual key, its catalogue of pinned actions, a policy check on each call and spend ceilings, and calls your own vLLM models on GPU nodes in the same data centre. Costly actions wait for an operator's Signal, and generated code runs in throwaway gVisor sandboxes. Data, prompts and weights stay in your data centre, and you carry everything a cloud provider would otherwise run."
    bindings:
