              verified: 2026-09-10
      - mitigation: D3-OTF
        coverage: partial
        mechanism: >-
          The anthropic-allowed-org-ids tenant-restriction header, injected by the organisation's proxy on
          claude.ai, api.anthropic.com, claude.com and anthropic.com (Enterprise), covers the add-in's
          Claude-account sign-in and inference; the per-path domain allowlist; disabled_features web_search
          removes Anthropic-served web search and fetch in custom-manifest deployments
        steps:
          - title: Inject the tenant-restriction header
            body:
              - >-
                Have your proxy add anthropic-allowed-org-ids with your organisation UUIDs on claude.ai,
                api.anthropic.com, claude.com and anthropic.com; a request for any other organisation fails
                with 403 tenant_restriction_violation.
            url: https://support.claude.com/en/articles/13198485-enforce-network-level-access-control-with-tenant-restrictions
          - title: Allow only the documented destinations
            body:
              - >-
                Permit pivot.claude.ai, claude.ai, api.anthropic.com, appsforoffice.microsoft.com and, when
                used, login.microsoftonline.com, graph.microsoft.com, mcp-proxy.anthropic.com and
                bridge.claudeusercontent.com (Claude account), or your gateway and cloud endpoints (third-party
                platform).
            url: https://claude.com/docs/office-agents/third-party-platforms
          - title: Keep web search inside your network
            body:
              - >-
                In custom-manifest deployments set disabled_features=web_search and attach an in-network search
                tool with mcp_servers, so search queries stop going to Anthropic's search provider.
            url: https://claude.com/docs/office-agents/third-party-platforms
        note: >-
          Partial by the rule: Anthropic enforces the tenant block server-side and the organisation's SSE
          injects the header. The header article lists web, desktop, API-key and OAuth-token access but does
          not name the Office add-ins, so confirm with a personal-organisation sign-in through the proxy. A
          customer proxy does not control egress Anthropic performs for the add-in: built-in web search and web
          fetch (Anthropic's search provider), code-execution containers and MCP connector calls through
          mcp-proxy.anthropic.com leave from Anthropic's cloud. On third-party platforms inference goes only to
          the organisation's gateway or cloud endpoint, so the header is moot there and the gateway is the
          egress point.
        verified: "2026-09-25"
        migration:
          from:
            - capabilitySse
            - capabilityEgressControl
          reviewRequired: false
          original:
            - capability: capabilitySse
              coverage: external
              mechanism: >-
                pivot.claude.ai and the model endpoint are ordinary HTTPS from the Office webview;
