    url: https://genai.owasp.org/resource/owasp-genai-llm-top-10-2026/
  - title: "OWASP Top 10 for Agentic Applications 2026 — ASI10 rogue agents"
    url: https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/
  - title: "CSA AI Controls Matrix v1.1 — inventory and third-party governance"
    url: https://cloudsecurityalliance.org/artifacts/ai-controls-matrix-v1-1
  - title: "Thoughtworks Technology Radar vol. 34 — AI-accelerated shadow IT, on hold"
    url: https://www.thoughtworks.com/radar/techniques
  - title: "NIST AI 600-1 — generative AI profile, governance actions"
    url: https://www.nist.gov/itl/ai-risk-management-framework
