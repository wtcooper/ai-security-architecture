            url: https://docs.github.com/en/billing/how-tos/set-up-budgets
          - title: Cap the cloud agent and stop at the limit
            body:
              - >-
                Add a SKU-level budget for Copilot cloud agent (and an Actions product budget for its runner
                minutes) with "Stop usage when budget limit is reached" selected; without it usage is not
                stopped.
            url: https://docs.github.com/en/billing/how-tos/set-up-budgets
          - title: Decide on paid overage
            body:
