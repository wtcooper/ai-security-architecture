# Apps in Microsoft Copilot Studio and Copilot Cowork — one entity per product × reference architecture. Facts are
# dated (asOf) and cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# Scope: apps built by describing them in Copilot Studio (App, preview) or with the App skill in Copilot Cowork,
# hosted on Microsoft Copilot Managed Runtime and governed from the Microsoft 365 admin center (Apps) and the Power
# Platform admin center. Exclusions: Copilot Studio agents are toolCopilotStudio on the low-code agent runtime
# drawing; Copilot Code (Frontier), which the admin overview lists as an app-building tool for business users and
# developers, and the Copilot Managed Runtime CLI and SDK reach the same host and are cited only where a setting
# differs for them (Copilot Code app building follows its spending policy; the CLI is off by default); canvas,
# model-driven and code apps stay in Power Apps and the Power Platform admin center; the predecessor App Builder
# agent and vibe.powerapps.com retire on 2026-11-30 (MC1505609). Microsoft also documents Lovable deploying into
# Copilot Managed Runtime (configure-lovable); that path is Lovable's product and is not assessed here.
# Status: Copilot Studio's FAQ (2026-11-17) says apps are in preview, so status is preview. MC1558033 (2026-11-17)
# announces Copilot Managed Runtime as generally available, rolling out from mid-November to mid-December 2026,
# and app building in Cowork beyond the Frontier Program; re-check the status when that rollout completes.
# 2026-11-25: onboarded against the hosted app builder pins. Read that day (learn.microsoft.com, HTML, all 200):
# microsoft-365/admin/manage/apps (the fwlink from MC1469329 lands there; last updated 2026-11-17), governance,
# inventory, security-compliance, roles-responsibilities, visibility-monitoring, faq-about-apps, licensing-credits,
# configure-lovable; microsoft-365/copilot-managed-runtime overview, managed-runtime-security-governance (updated
# 2026-11-25), architecture (developer/apps/architecture redirects there), developer/apps connect-to-data,
# shared-connections, share-app, secret-scanning, dev-inner-loop, content-security-policy; microsoft-copilot-studio
# apps-experience/apps-overview, apps-experience/publish-share-app, apps-experience/create-app, faq-apps,
# geo-data-residency-build-apps; copilot/cowork/cowork-build-apps (microsoft-365/copilot/cowork/* redirects to
# copilot/cowork/*); power-platform/admin default-environment-routing-copilot-managed-runtime, tenant-settings and
# admin-activity-logging (redirects to activity-logging-auditing/activity-logs-power-platform-admin). Also the
# Microsoft Copilot blog (10 Sep 2026; /microsoft-copilot/blog/... redirects to /en-us/copilot/blog/...) and the
# Message Center mirror at mc.merill.net for MC1469329, MC1558033 and MC1505609. 404:
# power-platform/admin/security/conditional-access. No advisory specific to these apps was found.
vendor: microsoft
family: Microsoft Copilot Managed Runtime
tools:
  - id: toolCopilotStudioApps
    name: Apps in Copilot Studio and Copilot Cowork
    surfaceClasses:
      - saasAgentPlatform
    variants:
      - name: Apps in Microsoft Copilot Studio (preview)
        class: saasAgentPlatform
        url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/apps-experience/apps-overview
        note: >-
          The App tile in Copilot Studio: Copilot asks clarifying questions, proposes an approach, generates a preview
          with a read-only code view, and the maker publishes and shares it. App creation is powered by the GitHub
          Copilot harness and billed in Copilot Credits from the environment.
      - name: App skill in Copilot Cowork
        class: saasAgentPlatform
        url: https://learn.microsoft.com/en-us/copilot/cowork/cowork-build-apps
        note: >-
          Ask Cowork for an app; the App skill builds it from Microsoft 365 context, can create its data schema in
          supported connectors, saves automatically and is shared by link. Needs a Microsoft 365 Copilot license and
          usage-based billing for Cowork.
    architecture: archHostedAppBuilder
    status: preview
    asOf: "2026-11"
    summary:
      - >-
        Microsoft's hosted app builder inside the Microsoft 365 tenant. A maker describes an app in Copilot Studio or
        Copilot Cowork; Copilot writes a single-page app, keeps it in a platform-managed Git repository, builds it in a
        network-restricted sandbox and runs it on Microsoft Copilot Managed Runtime, where the host signs users in with
        Microsoft Entra ID and Conditional Access, applies a content security policy in the browser, and routes every
        data call through Microsoft connectors under the tenant's advanced connector policies. Users open shared apps at
        managedapps.cloud.microsoft.
      - >-
        Governance is in place before the first app exists: each maker is routed to a personal managed environment in a
        Microsoft-managed default environment group whose rules set the allowed connectors, actions and MCP servers,
        the sharing limits and the content security policy. Administrators review and take over those rules in the
        Microsoft 365 admin center (Apps › Settings › Environment groups), see every app built on Copilot Managed
        Runtime in the tenant under Apps › All apps, block or delete it there, and investigate app activity in
        Microsoft Purview Audit.
    facts:
      - label: Plans
        value: >-
          Building in Cowork or Copilot Code needs a Microsoft 365 Copilot license and Copilot Credits through a
          spending policy; Copilot Studio bills building to the environment's Copilot Credits; running any app needs a
          Power Apps Premium license or a spending policy that includes Copilot Managed Runtime (a Microsoft 365 Copilot
          license alone does not cover it). Apps in Copilot Studio are in preview; MC1558033 announces general
          availability of Copilot Managed Runtime rolling out from mid-November to mid-December 2026.
        url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/apps/licensing-credits?view=o365-worldwide
      - label: Inference & routing
        value: >-
          Copilot Studio's app creation is powered by the GitHub Copilot harness inside Copilot Studio; Cowork uses its
          App skill. Builds of platform-managed repositories run in a Microsoft sandbox with restricted network access,
          and apps run on the Microsoft-operated Copilot Managed Runtime host.
        url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/apps-experience/apps-overview
      - label: Data leaving the device
        value: >-
          A vendor-hosted builder and host: the published app is stored in the Power Platform environment's geography,
          but Copilot Studio stores and processes app-building data in the geography of the maker's profile (preferred
          data location, then Country or region, then the tenant's country), which can differ from the environment's.
          App data stays in the connected services (SharePoint, Dataverse, Microsoft 365) and is read through connectors.
        url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/geo-data-residency-build-apps
      - label: Retention & training
        value: >-
          The Power Platform tenant setting Data sharing for Dynamics 365 Copilot and Power Platform Copilot AI Features
          (human review and model improvement) is disabled by default; the app pages read do not say whether it covers
          app building. Audit record retention follows the organisation's Purview licensing and policies.
        url: https://learn.microsoft.com/en-us/power-platform/admin/tenant-settings
      - label: Docs index
        value: Microsoft 365 admin › Copilot Managed Runtime overview for admins, with Security and governance in the Copilot Managed Runtime
        url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/apps/?view=o365-worldwide
      - label: Admin roles
        value: >-
          Manage: Power Platform administrator and Global administrator (both admin centers), Dynamics 365 administrator
          (Power Platform admin center only). Read only: AI administrator, AI reader and Global reader in the Microsoft
          365 admin center. Purview Audit needs the Audit Logs or View-Only Audit Logs role.
        url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/apps/roles-responsibilities?view=o365-worldwide
    items:
      - title: Where each control lives
        body:
          - >-
            Microsoft 365 admin center: Copilot › Settings › Build apps in Copilot (Cowork); Apps › Settings ›
            Environment groups › (group) › routing, Connectors and MCP servers, Sharing (Manage app sharing), Content
            security policy, Backend as a Service (Fabric); Apps › All apps (inventory, Block, Delete, Export); Apps ›
            Monitor; Copilot › Cost management (spending policies, the only control on who builds in Copilot Code).
            Power Platform admin center: Copilot › Settings › Managed apps (CLI app creation, external artifacts);
            Manage › Environments › Edit › Security group; Manage › Environment groups › Rules; tenant settings set
            with pac admin update-tenant-settings for Copilot Studio app creation. Microsoft Purview: Audit
            (CopilotManagedRuntime record type).
        links:
          - title: Copilot Managed Runtime default governance settings
            url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/apps/governance?view=o365-worldwide
          - title: Manage security and compliance for Copilot Managed Runtime
            url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/apps/security-compliance?view=o365-worldwide
      - title: Existing Power Platform governance comes first
        body:
          - >-
            Where a tenant already has environment routing, environment groups or advanced connector policies, Copilot
            Managed Runtime keeps them and layers its own rules in. For an existing group the effective connector access
            depends on whether it has an advanced connector policy and whether Advanced connector policies only is on;
            with neither a policy nor an applicable data policy, connectors are not restricted, even though the Microsoft
            365 admin center may show none allowed. Routing for Copilot Managed Runtime cannot be turned off.
        links:
          - title: "Default governance settings: If you're an existing Power Platform customer"
            url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/apps/governance?view=o365-worldwide
    riskNotes:
      - risk: riskSensitiveDataDisclosure
        note: >-
          A Cowork share link lets anyone in the organisation who has it open the app and its data, and recipients can
          pass the link on while organisation-wide sharing is on; organisation-only links include guest users once guest
          sharing is allowed.
      - risk: riskAgenticDelegationConfusedDeputy
        note: >-
          A maker can configure a shared connection, so every user reads through the connection's credentials;
          allowedActions limits the operations, not which rows each person can read.
      - risk: riskRogueActions
        note: >-
          The Cowork App skill can create the app's data schema in supported connectors while it builds, writing to the
          maker's own SharePoint or Dataverse with the maker's connection.
      - risk: riskShadowAndUnknownAgents
        note: >-
          App building is on by default: all users in Cowork, and eligible makers in Copilot Studio, until an
          administrator scopes it.
      - risk: riskInsecureIntegratedComponent
        note: >-
          The default content security policy stops bundled packages from sending data to outside endpoints or loading
          scripts from other hosts; externally built artifacts, when allowed, skip the platform's sandboxed build and
          secret scanning.
      - risk: riskInsecureModelOutput
        note: >-
          Microsoft's FAQ says generated layouts, calculations, actions and behaviour might be incomplete or incorrect,
          and the code view in Copilot Studio is read-only.
      - risk: riskPromptInjection
        note: >-
          Documents, spreadsheets, meetings and messages added as Microsoft 365 context become the agent's
          instructions while it builds.
    controls:
      - mitigation: D3-APA
        coverage: native
        mechanism: >-
          Apps private to their owners until shared; the environment group's sharing rule (Allow organization-wide
          sharing, Allow sharing with guest users); the environment's Entra security group; Build apps in Copilot
          (Cowork) and the Copilot Studio app-creation tenant settings scoped to security groups; the spending policy
          that selects Copilot Code, which decides who builds there; CLI app creation off by default
        steps:
          - title: Scope who can build
            body:
              - >-
                In Microsoft 365 admin center › Copilot › Settings › Build apps in Copilot choose Specific users and
                groups, scope Copilot Studio app creation with enabledGroupsManagedAppsMcsPreview, and include only
                the same group in the spending policy that selects Copilot Code.
            url: https://learn.microsoft.com/en-us/copilot/cowork/cowork-build-apps
          - title: Set the sharing limits
            body:
              - >-
                In Apps › Settings › Environment groups › (group) › Sharing set Allow organization-wide sharing and keep
                Allow sharing with guest users off.
            url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/apps/governance?view=o365-worldwide
          - title: Bind environments to a security group
            body:
              - >-
                In Power Platform admin center › Manage › Environments › Edit set the Security group; users outside it
                cannot run apps there, whatever was shared with them.
            url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/apps/security-compliance?view=o365-worldwide
        note: >-
          Native on the rule applied to every builder on this drawing: an administrator can keep the default audience to
          the owner or the workspace and decide how widely makers may share, and the host enforces it before it serves
          any app content. Defaults to change: Cowork app building is on for all users and Copilot Studio app creation
          is enabled by default for eligible makers; Allow organization-wide sharing is on, so owners can create links
          anyone in the organisation can redeem and pass on. Copilot Code has no app-building setting, and Build apps in
          Copilot does not cover it: anyone in a spending policy that selects Copilot Code can build apps there. Guest
          users cannot open them today even when guest sharing is on (a known issue). Owners share with people and groups
          in the organisation's directory, and sharing rules apply per environment group, not per app.
        verified: "2026-11-25"
      - mitigation: D3-AVE
        coverage: partial
        mechanism: >-
          Secret scanning on every push to a platform-managed repository, which rejects the update when it finds a
          credential; publish-time validation of build status, connections and policy; no vulnerability or dependency
          scan documented
        steps:
          - title: Keep apps on platform-managed builds
            body:
              - >-
                Leave External artifacts in managed apps off, so every deployed build comes from the scanned,
                platform-managed repository.
            url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/apps/governance?view=o365-worldwide
          - title: Review secret-scanning exceptions
            body:
              - >-
                Treat changes to a repository's secret-scanning allow list as code changes that need review.
            url: https://learn.microsoft.com/en-us/microsoft-365/copilot-managed-runtime/developer/apps/secret-scanning?view=o365-worldwide
        note: >-
          Partial on the rule applied to every builder on this drawing: the one scan that blocks covers a single class of
          finding (credentials), and no page documents a scan for vulnerable code, dependencies or exposed records before
          publish. Secret scanning applies only to platform-managed repositories, not to external GitHub repositories or
          externally built artifacts. Developers using the CLI with an external GitHub Enterprise Cloud repository can add
          their own code scanning in that repository's branch rules.
        verified: "2026-11-25"
      - mitigation: cap-data-access-governance
        coverage: native
        mechanism: >-
          Connector calls go through the managed host on each user's own connection by default, so an app returns only
          what the signed-in user can already read; a shared connection is a deliberate maker choice, limited to the
          actions declared in allowedActions and enforced by the platform's connection proxy
        steps:
          - title: Keep per-user connections the default
            body:
              - >-
                Require makers to use per-user connections, and allow a shared connection only on a dedicated account
                with access to the app's data alone.
            url: https://learn.microsoft.com/en-us/microsoft-365/copilot-managed-runtime/developer/apps/shared-connections?view=o365-worldwide
          - title: Allow only the connectors apps need
            body:
              - >-
                Keep the environment group's Connectors and MCP servers rule Microsoft-curated, or add a connector with
                only the actions a reviewed app needs.
            url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/apps/governance?view=o365-worldwide
        note: >-
          Native on the rule applied to every builder on this drawing: connectors act as the signed-in visitor by default
          and a shared identity is a deliberate, scoped exception. Microsoft states that publishing or sharing an app does
          not give anyone data they could not otherwise reach, and the record-level rules are the source system's own
          permissions (SharePoint, Dataverse). Boundary: with a shared connection every user reads with its credentials,
          and allowing an action such as reading a table does not restrict which rows each person sees; no page documents
          an administrator setting that forbids shared connections outright.
        verified: "2026-11-25"
      - mitigation: D3-CH
        coverage: native
        mechanism: >-
          Host-managed Entra tokens kept out of app code (the app runs in a sandboxed iframe), connectors instead of keys
          in code, a default content security policy that blocks direct calls to outside services, and secret scanning
          that rejects pushes containing credentials
        steps:
          - title: Keep the content security policy enforced
            body:
              - >-
                In Apps › Settings › Environment groups › (group) › Content security policy keep Enforce content security
                policy on and add only specific origins.
            url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/apps/governance?view=o365-worldwide
          - title: Leave secret scanning in the path
            body:
              - >-
                Keep apps on platform-managed repositories, where a push with a key, password, token or connection string
                is rejected until it is removed and rotated, and review every change to .grs/secrets-allowlist.json.
            url: https://learn.microsoft.com/en-us/microsoft-365/copilot-managed-runtime/developer/apps/secret-scanning?view=o365-worldwide
        note: >-
          Native on the rule applied to every builder on this drawing: secrets stay server-side by design and the
          platform refuses code that carries one. Boundaries: anyone who can push clears a finding by committing an
          exception to .grs/secrets-allowlist.json with the rejected change, and no page documents a second person
          approving it; external GitHub repositories and externally built artifacts are not scanned; a shared
          connection's credentials are managed by its owner and rotated at the source system.
        verified: "2026-11-25"
      - mitigation: cap-staged-rollout-gate
        coverage: partial
        mechanism: >-
          A personal managed environment per maker; preview builds per commit and branch available to contributors;
          publishing as a separate, explicit step; any earlier commit redeployable to roll back
        steps:
          - title: Publish only tested builds
            body:
              - >-
                Test the main scenarios in preview, then Publish (or ms app deploy); later changes stay invisible to users
                until the next publish.
            url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/apps-experience/publish-share-app
          - title: Roll back by redeploying a commit
            body:
              - >-
                Redeploy a known good commit with ms app deploy --commit <sha>; the previous deployed version stays live
                if a build fails.
            url: https://learn.microsoft.com/en-us/microsoft-365/copilot-managed-runtime/developer/apps/dev-inner-loop?view=o365-worldwide
        note: >-
          Partial on the rule applied to every builder on this drawing: code is staged and restorable, but previews and
          the live app read the same connected data. Microsoft advises testing with representative accounts and data
          before using production data; no separate test data store is documented, and redeploying a commit restores code,
          not the records an earlier version changed.
        verified: "2026-11-25"
      - mitigation: D3-MFA
        coverage: native
        mechanism: >-
          Makers and app users sign in with Microsoft Entra ID; the host follows the tenant's Conditional Access policies
          and delivers no app content before sign-in and an access check
        steps:
          - title: Require MFA through Conditional Access
            body:
              - >-
                Apply a Conditional Access policy requiring MFA, and a compliant device where the firm uses one, to the
                users who build and run apps.
            url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/apps/?view=o365-worldwide
        note: >-
          Native on the rule applied to every builder on this drawing: single sign-on through the organisation's IdP is
          the way in, for makers and for app users; Microsoft describes Entra ID as the host's sign-in and documents no
          other login method. The pages read do not name the
          cloud app a Conditional Access policy should target for the runtime; test the policy with a non-compliant
          sign-in before relying on it.
        verified: "2026-11-25"
      - mitigation: AML.M0029
        coverage: none
        mechanism: >-
          No approval step: the maker publishes and shares within the environment group's rules
        evidence:
          - title: Publish and share an app in Microsoft Copilot Studio
            url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/apps-experience/publish-share-app
          - title: "Build apps in Copilot Cowork: Publish your app"
            url: https://learn.microsoft.com/en-us/copilot/cowork/cowork-build-apps
        note: >-
          None on the rule applied to every builder on this drawing: nothing holds a version for someone other than its
          maker. Publishing checks build status, connections and policy, which is enforcement, not a person's approval.
          Stand-in: turn organisation-wide sharing off in groups whose apps reach confidential data, bind those
          environments to a security group, and review new apps from the inventory, blocking any that fail review; CLI
          developers with an external GitHub Enterprise Cloud repository can require pull-request reviews there.
        verified: "2026-11-25"
      - mitigation: AML.M0028
        coverage: native
        mechanism: >-
          The environment group's Connectors and MCP servers rule (advanced connector policy): an allow list of
          connectors, per-connector actions and MCP servers, with open-ended HTTP, Run script and arbitrary platform API
          actions blocked by default; enforced at design, deploy and run time
        steps:
          - title: Review the default allow list
            body:
              - >-
                In Apps › Settings › Environment groups › (group) › Connectors and MCP servers review the 19 connectors, 12
                MCP servers and the blocked actions, and take full control only with a reviewed request.
            url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/apps/governance?view=o365-worldwide
          - title: Check existing environment groups
            body:
              - >-
                For groups that existed before, confirm the advanced connector policy and Advanced connector policies only
                setting in the Power Platform admin center; without a policy, connectors may be unrestricted.
            url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/apps/governance?view=o365-worldwide
        note: >-
          Native on the rule applied to every builder on this drawing: an administrator keeps an allow list of the
          connectors apps may use and the platform refuses the rest, down to individual actions. Defaults are restrictive:
          Microsoft first-party, generally available connectors authenticating only through Entra ID. Taking full control
          stops Microsoft's automatic additions. The business and non-business classification of classic DLP is not
          supported for apps.
        verified: "2026-11-25"
      - mitigation: D3-AI
        coverage: native
        mechanism: >-
          Apps › All apps in the Microsoft 365 admin center: every app built with Copilot Managed Runtime in the tenant
          (status such as Active or Blocked), with owner, location, environment group and creation date, a Data & tools
          tab listing connectors, data sources and dependencies, and CSV export
        steps:
          - title: Export and reconcile the inventory
            body:
              - >-
                In Apps › All apps add the Created by and Last modified columns, Export the view, and reconcile owners and
                connectors monthly; leavers' apps are reassigned or blocked.
            url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/apps/inventory?view=o365-worldwide
        note: >-
          Native on the rule applied to every builder on this drawing: the platform lists every app in the tenant with its
          owner and what it connects to. New, changed and deleted apps appear within 15 minutes. The inventory shows the
          environment group, whose sharing rule is the audience limit, rather than each app's own share list; canvas,
          model-driven and code apps stay in the Power Platform admin center.
        verified: "2026-11-25"
      - mitigation: cap-shadow-ai-discovery
        coverage: partial
        mechanism: >-
          Every app built with Copilot Managed Runtime, whichever tool built it, lands in the tenant's All apps
          inventory; apps built on other builders are found by the organisation's SSE or CASB
        steps:
          - title: Use the inventory as the baseline
            body:
              - >-
                Treat Apps › All apps as the complete list for this product and reconcile other builders' domains, found in
                proxy and SSE logs, against it.
            url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/apps/inventory?view=o365-worldwide
        note: >-
          Partial on the rule applied to every builder on this drawing: where every app made with the product lands in the
          organisation's inventory and there is no personal-account path, that half is done; looking for apps made on
          other builders, or in personal accounts elsewhere, is the SSE or CASB's job and certificate-transparency search,
          as for every other product here.
        verified: "2026-11-25"
      - mitigation: cap-agent-kill-switch
        coverage: native
        mechanism: >-
          Block in Apps › All apps (immediate, preserving the app and its data) and Delete; per-user connections end with
          the user's access; shared connection credentials revoked at the source system
        steps:
          - title: Block the app
            body:
              - >-
                In Apps › All apps select the app and Block; users who launch it see a blocked status, and an admin can
                unblock after the investigation.
            url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/apps/inventory?view=o365-worldwide
          - title: Revoke what it holds
            body:
              - >-
                Revoke a shared connection's credentials at its data source and remove share links, which are fully
                revocable.
            url: https://learn.microsoft.com/en-us/microsoft-365/copilot-managed-runtime/developer/apps/share-app?view=o365-worldwide
        note: >-
          Native on the rule applied to every builder on this drawing: an administrator can take any app in the tenant
          offline at once from the console. Blocking needs a Manage role (Global, Power Platform or Dynamics 365
          administrator); the pages say blocking is immediate and do not state a delay for sessions already open. Apps on
          other builders are out of its reach.
        verified: "2026-11-25"
      - mitigation: AML.M0024
        coverage: native
        mechanism: >-
          Microsoft Purview Audit records under the CopilotManagedRuntime record type (519): app created, build started
          or uploaded, deployed, share link created or deleted, permission edited, launched, content served, quarantine
          state changed, deleted; Power Platform admin activity logs for environment group and rule changes
        steps:
          - title: Export the app events to the SIEM
            body:
              - >-
                Turn on audit log search, and collect the CopilotManagedRuntime operations through the Office 365
                Management Activity API into the SIEM.
            url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/apps/security-compliance?view=o365-worldwide
          - title: Include governance changes
            body:
              - >-
                Collect the PowerPlatformAdministratorActivity records for environment groups and rules, which hold the
                sharing, connector and CSP settings.
            url: https://learn.microsoft.com/en-us/power-platform/admin/activity-logging-auditing/activity-logs-power-platform-admin
        note: >-
          Native on the rule applied to every builder on this drawing: publishes, audience changes and connector policy
          changes reach the organisation's log store with the actor. The page qualifies it "when Copilot Managed Runtime
          auditing is available in your environment"; ingestion time is not guaranteed; retention follows Purview
          licensing; events cover app activities, not every action inside an app.
        verified: "2026-11-25"
      - mitigation: cap-ai-vendor-assessment
        coverage: external
        mechanism: >-
          The organisation's TPRM platform, consuming Microsoft's Service Trust Portal reports and the Copilot Studio and
          Power Platform data-residency and compliance pages
        evidence:
          - title: Security and governance in the Copilot Managed Runtime (what the host enforces)
            url: https://learn.microsoft.com/en-us/microsoft-365/copilot-managed-runtime/managed-runtime-security-governance?view=o365-worldwide
          - title: Data residency when building apps in Copilot Studio
            url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/geo-data-residency-build-apps
        note: >-
          External on the rule applied to every product: the assessment is the organisation's, fed by the vendor's
          attestations. Questions only Microsoft can answer: how the shared host's sign-in and sandbox are tested, how the
          build sandbox chooses packages, and where app-building data goes when a maker's profile resolves to another
          geography than the environment's. Preview terms apply until general availability completes.
        verified: "2026-11-25"
    settings:
      - id: buildAppsInCopilot
        name: Build apps in Copilot
        where: Microsoft 365 admin center › Copilot › Settings › View all › Build apps in Copilot (All users, No users, Specific users and groups)
        setVia: [adminConsole, identityProvider]
        area: identity
        default: "All users"
        recommended: Specific users and groups, a security group of trained makers
        value: "A group of trained makers"
        why: Only people the firm has trained and can name build apps in Cowork, instead of every licensed user.
        mitigations: [D3-APA]
        requires: Applies to Cowork only
        url: https://learn.microsoft.com/en-us/copilot/cowork/cowork-build-apps
        verified: "2026-11-25"
      - id: studioAppCreation
        name: powerPlatform.powerapps.enableManagedAppsMcsPreview and enabledGroupsManagedAppsMcsPreview
        where: Power Platform tenant settings, set with pac admin update-tenant-settings
        setVia: [apiCli]
        area: identity
        default: "On for eligible makers, no group scope"
        recommended: Scoped to the same makers' security group by object ID
        value: "Scoped to the makers' group"
        why: Copilot Studio's App tile is limited to the same trained makers; the setting is cached up to 15 minutes in an open tab.
        mitigations: [D3-APA]
        url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/apps/?view=o365-worldwide
        verified: "2026-11-25"
      - id: copilotCodeSpendingPolicy
        name: Spending policy for Copilot Code
        where: Microsoft 365 admin center › Copilot › Cost management › Configuration › Add spending policy (user-based, with Copilot Code selected under Select agents and services)
        setVia: [adminConsole, identityProvider]
        area: identity
        default: Not stated
        recommended: Only the trained makers' security group, and no policy scoped to All users that selects Copilot Code
        value: "Only the makers' group"
        why: Copilot Code has no app-building setting of its own and Build apps in Copilot does not cover it, so only users in its spending policy build apps there.
        mitigations: [D3-APA]
        requires: Usage-based billing turned on; each maker needs a Microsoft 365 Copilot license
        url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/apps/?view=o365-worldwide#control-who-can-build-apps-in-copilot-code
        verified: "2026-11-25"
      - id: cliAppCreation
        name: Allow app creation with the Copilot Managed Runtime command line interface (CLI)
        where: Power Platform admin center › Copilot › Settings › Managed apps, or Manage › Environment groups › (group) › Rules
        setVia: [adminConsole]
        area: identity
        default: "Off"
        recommended: Off, except in an environment group set aside for professional developers
        value: "Off outside developer groups"
        why: Apps reach the tenant only through the governed builders unless a developer group has been set up for code-first work.
        mitigations: [D3-APA]
        url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/apps/governance?view=o365-worldwide
        verified: "2026-11-25"
      - id: orgWideSharing
        name: Allow organization-wide sharing
        where: Microsoft 365 admin center › Apps › Settings › Environment groups › (group) › Sharing › Manage app sharing
        setVia: [adminConsole]
        area: sharing
        default: "On"
        recommended: Off in environment groups whose apps reach confidential data; on elsewhere
        value: "Off where apps reach confidential data"
        why: An organisation-wide link can be redeemed and passed on by anyone in the tenant; with it off, owners share only with named people and groups.
        mitigations: [D3-APA]
        url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/apps/governance?view=o365-worldwide
        verified: "2026-11-25"
      - id: guestSharing
        name: Allow sharing with guest users
        where: Microsoft 365 admin center › Apps › Settings › Environment groups › (group) › Sharing › Manage app sharing
        setVia: [adminConsole]
        area: sharing
        default: "Off"
        recommended: "Off"
        why: Organisation-only links stay employees-only; with it on, they include every guest in the directory.
        mitigations: [D3-APA]
        url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/apps/governance?view=o365-worldwide
        verified: "2026-11-25"
      - id: environmentSecurityGroup
        name: Security group (environment)
        where: Power Platform admin center › Manage › Environments › (environment) › Edit › Security group
        setVia: [adminConsole, identityProvider]
        area: identity
        recommended: The owning team's Entra group on every environment apps with confidential data are published from
        value: "The owning team's Entra group"
        why: A user must be in the group and have been shared the app; sharing cannot reach past it, and removing someone from the group revokes access.
        mitigations: [D3-APA]
        url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/apps/security-compliance?view=o365-worldwide
        verified: "2026-11-25"
      - id: adminRoles
        name: Copilot Managed Runtime admin roles (Manage and Read only)
        where: Microsoft 365 admin center › Roles (Power Platform administrator, Global administrator; AI administrator, AI reader, Global reader)
        setVia: [adminConsole, identityProvider]
        area: identity
        recommended: Manage roles for the small group that governs apps; AI reader or Global reader for reviewers and help desk
        value: "Manage for a named few"
        why: Changing sharing, connector and CSP rules, or blocking apps, stays with the people accountable for them.
        mitigations: [D3-APA]
        url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/apps/roles-responsibilities?view=o365-worldwide
        verified: "2026-11-25"
      - id: conditionalAccess
        name: Conditional Access (Microsoft Entra ID)
        where: Microsoft Entra admin center › Conditional Access, for the users who build and run apps
        setVia: [identityProvider]
        area: identity
        recommended: MFA required, and a compliant device where the firm uses one
        value: "MFA required"
        why: The host signs users in with Entra ID and follows Conditional Access, so the firm's MFA applies to every maker and app user.
        mitigations: [D3-MFA]
        url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/apps/?view=o365-worldwide
        verified: "2026-11-25"
      - id: connectorsAndMcpServers
        name: Connectors and MCP servers (environment group rule)
        where: Microsoft 365 admin center › Apps › Settings › Environment groups › (group) › Connectors and MCP servers
        setVia: [adminConsole]
        area: tools
        default: "Microsoft-curated: 19 first-party connectors with Entra-only sign-in, 12 Microsoft MCP servers, open-ended HTTP, Run script and arbitrary API actions blocked"
        recommended: Microsoft-curated until a reviewed request; then only the connector and the actions the app needs, in that app's group
        value: "Microsoft-curated; additions per reviewed app"
        why: Apps reach only approved services and operations, and approving a connector does not approve every action it offers.
        mitigations: [AML.M0028, cap-data-access-governance]
        url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/apps/governance?view=o365-worldwide
        verified: "2026-11-25"
      - id: sharedConnectionActions
        name: allowedActions (shared connection)
        where: The app's ms.config.json › connectionReferences › (shared connection) › allowedActions, and dataSets › (table) › allowedActions
        setVia: [code]
        area: tools
        default: "Per-user connections; a shared connection needs a non-empty allowedActions list to deploy"
        recommended: Per-user connections; a shared connection only on a dedicated account scoped to the app's data, with get alone where the app only reads
        value: "Per-user; shared only when scoped"
        why: Users then read with their own permissions, and a shared account can do no more than the actions listed for it.
        mitigations: [cap-data-access-governance, AML.M0028, D3-CH]
        url: https://learn.microsoft.com/en-us/microsoft-365/copilot-managed-runtime/developer/apps/shared-connections?view=o365-worldwide
        verified: "2026-11-25"
      - id: externalArtifacts
        name: External artifacts in managed apps (Allow external artifact deployment)
        where: Power Platform admin center › Copilot › Settings › Managed apps, or Manage › Environment groups › (group) › Rules
        setVia: [adminConsole]
        area: tools
        default: "Off"
        recommended: "Off"
        why: Every deployed build comes from the platform's sandboxed build of a scanned repository, not an artifact built somewhere else.
        mitigations: [D3-AVE, D3-CH]
        url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/apps/governance?view=o365-worldwide
        verified: "2026-11-25"
      - id: secretScanning
        name: Secret scanning (platform-managed Git)
        where: Every push to the app's platform-managed repository; exceptions in .grs/secrets-allowlist.json on each branch
        setVia: [code]
        area: data
        default: "On for platform-managed repositories"
        recommended: Left in the path, with every change to .grs/secrets-allowlist.json reviewed after the fact, since anyone who can push may add an exception in the same push
        value: "On; allow-list changes reviewed"
        why: A push carrying a key, password, token or connection string is rejected before it becomes part of the branch's history.
        mitigations: [D3-CH, D3-AVE]
        url: https://learn.microsoft.com/en-us/microsoft-365/copilot-managed-runtime/developer/apps/secret-scanning?view=o365-worldwide
        verified: "2026-11-25"
      - id: contentSecurityPolicy
        name: Enforce content security policy
        where: Microsoft 365 admin center › Apps › Settings › Environment groups › (group) › Content security policy
        setVia: [adminConsole]
        area: network
        default: "Enforced, restrictive (connect-src 'self', no outside scripts)"
        recommended: Enforced; additions as specific origins only, tried in report-only mode first
        value: "Enforced; specific origins only"
        why: App code and its packages cannot send data from the browser to outside endpoints or load outside scripts.
        mitigations: [D3-CH]
        url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/apps/governance?view=o365-worldwide
        verified: "2026-11-25"
      - id: publishTestedBuild
        name: Publish (Copilot Studio) and ms app deploy --commit
        where: The app in Copilot Studio › Publish; for CLI apps, ms app deploy --commit <sha>
        setVia: [adminConsole, apiCli]
        area: tools
        recommended: Publish only after the main scenarios pass in preview with representative accounts; roll back by redeploying the last good commit
        value: "Tested builds only; rollback by commit"
        why: Users run a version someone tested, and a bad change is reversed by redeploying a known commit.
        mitigations: [cap-staged-rollout-gate]
        url: https://learn.microsoft.com/en-us/microsoft-365/copilot-managed-runtime/developer/apps/dev-inner-loop?view=o365-worldwide
        verified: "2026-11-25"
      - id: allApps
        name: All apps (Copilot Managed Runtime tab)
        where: Microsoft 365 admin center › Apps › All apps › Choose columns, Export
        setVia: [adminConsole]
        area: audit
        recommended: Exported monthly and reconciled with owners, connectors and environment groups; leavers' apps reassigned or blocked
        value: "Reconciled monthly"
        why: Every app built with Copilot Managed Runtime in the tenant has a named owner and a reviewed set of connections.
        mitigations: [D3-AI, cap-shadow-ai-discovery]
        url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/apps/inventory?view=o365-worldwide
        verified: "2026-11-25"
      - id: blockApp
        name: Block
        where: Microsoft 365 admin center › Apps › All apps › (app) › Block
        setVia: [adminConsole]
        area: tools
        recommended: In the incident runbook; Block first, Delete only after the investigation
        value: "Block first; delete after review"
        why: Users are stopped at once while the app and its data are kept for investigation.
        mitigations: [cap-agent-kill-switch]
        requires: Manage role (Global, Power Platform or Dynamics 365 administrator)
        url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/apps/inventory?view=o365-worldwide
        verified: "2026-11-25"
      - id: purviewAudit
        name: Audit (CopilotManagedRuntime record type)
        where: Microsoft Purview portal › Solutions › Audit; the Office 365 Management Activity API for collection
        setVia: [adminConsole, apiCli]
        area: audit
        recommended: Audit log search on, and the CopilotManagedRuntime operations collected into the SIEM
        value: "Collected into the SIEM"
        why: Who created, deployed, shared or blocked each app, and when, is kept where makers cannot change it.
        mitigations: [AML.M0024]
        requires: Microsoft Purview Audit subscription; Audit Logs or View-Only Audit Logs role
        url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/apps/security-compliance?view=o365-worldwide
        verified: "2026-11-25"
      - id: platformAdminActivity
        name: Power Platform admin activity (PowerPlatformAdministratorActivity)
        where: Microsoft Purview portal › Audit, record type PowerPlatformAdministratorActivity (environment groups and rules)
        setVia: [adminConsole, apiCli]
        area: audit
        recommended: Collected with the app events
        value: "Collected with the app events"
        why: A change to a group's sharing, connector or CSP rule is attributed to the administrator who made it.
        mitigations: [AML.M0024]
        url: https://learn.microsoft.com/en-us/power-platform/admin/activity-logging-auditing/activity-logs-power-platform-admin
        verified: "2026-11-25"
      - id: makerCountry
        name: Country or region (maker profile) and preferred data location
        where: Microsoft Entra admin center › Entra ID › Users › (user) › Edit properties › Contact information › Country or region; preferred data location in Multi-Geo tenants
        setVia: [identityProvider]
        area: data
        recommended: Every maker's two-letter Country or region (or preferred data location) set to the geography of the environments they build in
        value: "Set to the environment's geography"
        why: Copilot Studio stores and processes app-building data in the geography the maker's profile resolves to, which can differ from the environment's.
        mitigations: []
        url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/geo-data-residency-build-apps
        verified: "2026-11-25"
      - id: copilotDataSharing
        name: Data sharing for Dynamics 365 Copilot and Power Platform Copilot AI Features
        where: Power Platform admin center › Manage › Tenant settings
        setVia: [adminConsole]
        area: data
        default: "Disabled"
        recommended: "Disabled"
        why: Microsoft does not capture and manually review inputs and outputs of Power Platform Copilot features for model improvement.
        mitigations: []
        url: https://learn.microsoft.com/en-us/power-platform/admin/tenant-settings
        verified: "2026-11-25"
