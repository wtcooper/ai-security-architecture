id: archLowCodeAgentBuilder
surface: surfaceSaas
title: Vendor low-code agent builder
abbrev: Low-code builder

summary:
  - >
    A vendor platform where non-engineers assemble agents from prompts, connectors and triggers.
    The agents are real, the authors are not engineers, and there is no code review between an
    afternoon's work and something that acts on production data.

description:
  - >
    Everything that makes this category valuable is also what makes it distinct as an architecture:
    the builder is a self-service surface. A business user can create an agent, grant it connectors,
    give it a trigger and publish it to colleagues, without any of the checkpoints a software
    delivery pipeline would impose. There is no pull request, no review, no staged rollout and no
    security sign-off unless the platform enforces one.
  - >
    The result is a population problem rather than an instance problem. Individual agents are
    usually simple; the risk is that there are four hundred of them, each with connector grants,
    each authored by someone who has left, and no one can list which reach customer data. Every
    control in this archetype is therefore about the population — an inventory, a publication gate,
    an environment boundary between draft and shared, and a way to revoke a class of grant.
  - >
    Credential inheritance is the specific technical trap. A low-code agent typically runs on
    connections authorised by its author, so a published agent acts with its author's access for
    every colleague who uses it. A user who could not read a table directly can often read it
    through an agent someone else built, and neither party intended that. Whether the platform
    supports per-invoker authorization rather than author-credential execution is the single
    question worth asking during evaluation.
  - >
    The authoring surface is also an injection surface. Instructions, knowledge sources and
    connector descriptions are assembled by someone who is not thinking about untrusted input, and
    a shared agent's knowledge source is frequently a folder anyone can write to.

distinguishedBy:
  - >
    Against the vendor action agent: that is one agent the vendor built and you configured. This is
    a platform on which your own people build many, and the unit of concern moves from the
    configuration of one to the governance of a population.
  - >
    Against an internal AI platform you operate: same intent — a paved road for many builders —
    with the paving done by a vendor. You inherit their guardrails and their environment model, and
    you cannot add a deployment gate they did not build.

exemplars:
  - name: Suite-embedded agent builders
    note: >
      Low-code agent authoring bundled with a productivity or CRM suite, available to any licensed
      user by default unless an administrator turns it off.
    asOf: "2026-08"
  - name: Standalone agent-building platforms
    note: >
      Vendor platforms whose product is the builder itself, with connector marketplaces and
      publication to internal or external audiences.
    asOf: "2026-08"

zones:
  - id: outside
    type: outsideWorld
    personas: []
    note: Whoever ends up talking to a published agent, and whoever wrote its knowledge sources.

  - id: builders
    type: device
    personas: [personaEndUser, personaApplicationDeveloper]
    note: >
      Business users authoring agents, and colleagues consuming them. Not engineers, and not
      operating under an engineering process.

  - id: edge
    type: network
    personas: [personaGovernance]
    note: Who is authenticated, and whose credentials an agent ends up running on.

  - id: yourData
    type: data
    personas: [personaDataProvider]
    note: The systems the connectors reach. Reached by agents nobody reviewed.

  - id: vendor
    type: vendorOpaque
    personas: [personaAgenticProvider]
    note: Authoring, hosting and execution of the agents. The Governance persona decides who may use it, not how it runs.

  - id: governance
    type: management
    personas: [personaGovernance, personaAgenticProvider]
    note: >
      Population management: who may build, what may be published, what is connected, and what can
      be revoked at once.

nodes:
  - id: consumer
    type: humanUser
    zone: outside
    label: Agent consumers
    note: >
      Colleagues, and sometimes customers, using an agent built by someone else. Rarely aware of
      whose credentials it runs on.
    risks: [riskAgenticDelegationConfusedDeputy]
    capabilities: [capabilityIga]

  - id: knowledgeSource
    type: untrustedSource
    zone: outside
    label: Attached knowledge sources
    note: >
      Folders, sites and documents attached to an agent as grounding. Often writable by more people
      than the agent's audience, which turns a shared drive into an instruction channel.
    risks: [riskPromptInjection, riskRetrievalVectorStorePoisoning]
    capabilities: [capabilityPromptInjectionDefense, capabilityDataAccessGovernance]

  - id: builder
    type: humanUser
    zone: builders
    label: Citizen builder
    note: >
      Authors the instructions, attaches the connectors, and publishes. Not operating under code
      review, and frequently no longer at the company by the time the agent matters.
    risks: [riskShadowAndUnknownAgents, riskExcessiveDataHandling]
    capabilities: [capabilityAiGovernancePlatform, capabilityModelDocumentation]

  - id: authoringUi
    type: appUi
    zone: builders
    label: Authoring surface
    note: >
      Prompt, connectors, triggers, publication. Every one of those is a security decision made by
      someone who was not asked to make one.
    risks: [riskExcessiveDataHandling, riskPromptInjection]
    capabilities: [capabilitySystemPromptManagement, capabilityAiGovernancePlatform]

  - id: idp
    type: identityProvider
    zone: edge
    label: Identity provider
    note: >
      Authenticates builders and consumers. Whether the consumer's identity — rather than the
      author's — reaches the connector is the archetype's decisive question.
    risks: [riskAgenticDelegationConfusedDeputy, riskStaleAgentIdentityBinding]
    capabilities: [capabilityIga, capabilityNhiManagement, capabilitySse]

  - id: connectedData
    type: corpus
    zone: yourData
    label: Connected systems
    note: >
      Whatever the connectors reach. The union across all published agents is the platform's real
      data footprint, and no single agent's author can see it.
    risks: [riskExcessiveDataHandling, riskSensitiveDataDisclosure]
    capabilities: [capabilityDataAccessGovernance, capabilityDspm, capabilityAiDlp]

  - id: platformApi
    type: apiEndpoint
    zone: vendor
    label: Agent runtime
    note: The published interface. Authoring, hosting and execution behind it are the vendor's.
    risks: [riskRogueActions, riskInsecureIntegratedComponent]
    capabilities: [capabilityAiTprm, capabilityVendorAssurance, capabilityAgentRegistry]

  - id: platformConnector
    type: connector
    zone: vendor
    label: Connector framework
    note: >
      The vendor's integration layer. Its authorization model — author credentials or invoker
      credentials — decides whether publishing an agent is also a privilege grant.
    risks: [riskAgenticDelegationConfusedDeputy, riskCrossTenantCredentialPropagation]
    capabilities: [capabilityNhiManagement, capabilityToolPermissionScoping, capabilityIga]

  - id: agentInventory
    type: registry
    zone: governance
    label: Agent inventory
    note: >
      Every agent, its author, its connectors, its audience and its last use. The one control that
      makes the population tractable, and the one most platforms report on rather than enforce.
    risks: [riskShadowAndUnknownAgents, riskZombieShadowMCPServers]
    capabilities: [capabilityAgentRegistry, capabilityShadowAiDiscovery, capabilityAiGovernancePlatform]

  - id: publishGate
    type: hitlGate
    zone: governance
    label: Publication gate
    note: >
      Review before an agent reaches an audience beyond its author. The nearest available thing to
      code review, and it exists only if the platform offers it and an administrator turned it on.
    risks: [riskShadowAndUnknownAgents, riskRogueActions]
    capabilities: [capabilityHitlControls, capabilityAiGovernancePlatform, capabilityThreatModeling]

  - id: envPolicy
    type: policyEngine
    zone: governance
    label: Environment and connector policy
    note: >
      Which connectors may be combined, which environments allow publication, and who may build at
      all. Blocking a connector pairing is more tractable than reviewing every agent.
    risks: [riskExcessiveDataHandling, riskSensitiveDataDisclosure]
    capabilities: [capabilityAiGovernancePlatform, capabilityToolPermissionScoping, capabilityDataAccessGovernance]

  - id: audit
    type: auditSink
    zone: governance
    label: Usage audit
    note: Which agents ran, for whom, reaching what. The basis for retiring the ones nobody uses.
    risks: [riskShadowAndUnknownAgents]
    capabilities: [capabilityAuditLogging, capabilityAiDetectionResponse, capabilityBehavioralDriftDetection]

edges:
  - from: builder
    to: authoringUi
    label: authors and publishes
    control:
      kind: userIdentity
      note: >
        Building an agent typically requires no elevated role. The permission to create something
        that acts on company data is the same permission as opening a document.
    risks: [riskShadowAndUnknownAgents]

  - from: authoringUi
    to: platformApi
    label: agent definition
    control:
      kind: userIdentity
      note: Authenticates the author. Says nothing about whether anyone reviewed what they wrote.
    risks: [riskExcessiveDataHandling]

  - from: consumer
    to: platformApi
    label: uses a published agent
    control:
      kind: userIdentity
      note: >
        Authenticates the consumer to the platform. Whether that identity continues to the
        connector, or is replaced by the author's, is the difference between an access-control
        system that works and one that is bypassed by publishing.
    risks: [riskAgenticDelegationConfusedDeputy]

  - from: knowledgeSource
    to: platformApi
    label: grounding content
    control:
      kind: contentPermissions
      note: >
        Whoever can write to the attached folder can write instructions the agent will follow for
        every one of its users.
    risks: [riskPromptInjection, riskRetrievalVectorStorePoisoning]

  - from: platformApi
    to: platformConnector
    label: connector invocation
    control:
      kind: providerInternal
      note: Not observable. The decision and the call both happen inside the vendor boundary.
    risks: [riskRogueActions]

  - from: platformConnector
    to: connectedData
    label: read and write
    control:
      kind: delegatedGrant
      note: >
        The archetype's decisive crossing. Author-delegated means a published agent lends the
        author's access to everyone who uses it; invoker-delegated preserves the access model the
        organisation already has.
    risks: [riskAgenticDelegationConfusedDeputy, riskExcessiveDataHandling, riskSensitiveDataDisclosure]

  - from: idp
    to: platformApi
    label: authentication and entitlements
    kind: control
    control:
      kind: userIdentity
      note: >
        Also where building can be restricted to a licensed subset, which is the bluntest and often
        most effective population control available.
    risks: [riskShadowAndUnknownAgents]

  - from: envPolicy
    to: platformConnector
    label: connector combination rules
    kind: control
    control:
      kind: tenantConfiguration
      note: >
        Preventing a combination — a source of confidential data plus a path to send mail — scales
        where reviewing individual agents does not.
    risks: [riskExcessiveDataHandling, riskSensitiveDataDisclosure]

  - from: publishGate
    to: platformApi
    label: review before sharing
    kind: control
    control:
      kind: humanApproval
      note: >
        Only covers publication, not creation. A private agent with production connectors is
        outside its scope and inside the risk.
    risks: [riskShadowAndUnknownAgents]

  - from: agentInventory
    to: platformApi
    label: enumeration
    kind: control
    control:
      kind: admission
      note: >
        Reported by the platform rather than discovered independently. Adequate here, because
        unlike a local install there is no way to build an agent off-platform.
    risks: [riskShadowAndUnknownAgents]

  - from: platformApi
    to: audit
    label: run history
    kind: control
    control:
      kind: auditTrail
      note: Vendor-shaped, and the basis for retiring agents nobody has used in a year.
    risks: [riskShadowAndUnknownAgents]

crossCutting:
  - risk: riskShadowAndUnknownAgents
    note: >
      Not a property of any agent. It is what happens when creation is self-service and retirement
      is nobody's job, and it is the reason every control here is a population control.
  - risk: riskAgenticDelegationConfusedDeputy
    note: >
      Whether an agent runs as its author or its invoker determines whether publishing is also a
      privilege grant. One platform setting, and it decides whether the access model holds.
  - risk: riskExcessiveDataHandling
    note: >
      Each connector grant is defensible alone. The union across hundreds of agents authored by
      people who never met is nobody's decision and nobody's picture.

risks:
  - riskShadowAndUnknownAgents
  - riskAgenticDelegationConfusedDeputy
  - riskExcessiveDataHandling
  - riskPromptInjection
  - riskSensitiveDataDisclosure
  - riskRogueActions
  - riskZombieShadowMCPServers
  - riskCrossTenantCredentialPropagation
  - riskRetrievalVectorStorePoisoning
  - riskStaleAgentIdentityBinding
  - riskInsecureIntegratedComponent

capabilities:
  - capabilityAgentRegistry
  - capabilityShadowAiDiscovery
  - capabilityAiGovernancePlatform
  - capabilityIga
  - capabilityNhiManagement
  - capabilityDataAccessGovernance
  - capabilityToolPermissionScoping
  - capabilityHitlControls
  - capabilityAuditLogging
  - capabilityBehavioralDriftDetection
  - capabilityDspm
  - capabilityAiDlp
  - capabilityPromptInjectionDefense
  - capabilitySystemPromptManagement
  - capabilitySse
  - capabilityAiTprm
  - capabilityVendorAssurance
  - capabilityAiDetectionResponse
  - capabilityThreatModeling
  - capabilityModelDocumentation

deviations:
  - subject: One diagram stands for a population of agents
    reason: >
      The platform hosts hundreds of agents and the diagram shows one path through it. That is the
      right abstraction here: the individual agents are simple and near-identical in structure,
      and everything that makes the archetype hard is in the governance column, which is drawn per
      population rather than per agent.
  - subject: The builder is drawn as a node inside a trust zone rather than a boundary actor
    reason: >
      They are your own staff, inside your perimeter. They are drawn as a node because in this
      archetype the author is a component of the system — their credentials frequently execute it —
      rather than a party who merely uses it.
  - subject: No sandbox or runtime enforcement appears
    reason: >
      Neither is available. You cannot insert a policy decision point into a vendor's agent loop,
      and the capability taxonomy records that as structurally unavailable on this surface. The
      controls that remain are admission, connector scoping and inventory, and those are what is
      drawn.

sources:
  - title: "OWASP Top 10 for Agentic Applications 2026 — ASI03 identity and privilege abuse, ASI10 rogue agents"
    url: https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/
  - title: "Microsoft Learn — governance and data security for agents built on vendor platforms"
    url: https://learn.microsoft.com/en-us/purview/ai-agents
  - title: "CoSAI Shared Responsibility Framework V1.0 — AI-enabled SaaS operating model"
    url: https://www.coalitionforsecureai.org/wp-content/uploads/2026/05/CoSAI-Shared-Responsibility-Framework.pdf
  - title: "CSA AI Controls Matrix v1.1 — governance and inventory controls"
    url: https://cloudsecurityalliance.org/artifacts/ai-controls-matrix-v1-1
