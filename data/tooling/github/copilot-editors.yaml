              verified: 2026-09-10
      - mitigation: cap-agent-kill-switch
        coverage: partial
        mechanism: >-
          Enterprise AI controls policies for agent mode and chat in the IDE set to Disabled everywhere;
          enterprise licence unassignment; ChatAgentMode=false device policy; Visual Studio ADMX Disable Agent
          Mode
        steps:
          - title: Disable IDE agent mode at enterprise scope
            body:
              - >-
                Enterprise > AI controls > Copilot > Configure features & clients: select the disabled
                enforcement option for the IDE agent-mode and IDE chat policies.
            url: >-
              https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-enterprise/manage-enterprise-policies
          - title: Set it where the least restrictive organization cannot win
            body:
              - >-
                "Copilot Agent Mode in IDE Chat" and "Copilot Chat in the IDE" resolve to the least restrictive
                organization for a user, so only an enterprise-level setting is a stop.
            url: https://docs.github.com/en/copilot/reference/enterprise-administrators/policy-conflicts
          - title: Revoke the seat at enterprise level
            body:
              - >-
                Remove the user from the enterprise team or unassign their licence in enterprise settings, "which
                revokes access immediately".
            url: >-
              https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-organization/manage-access/revoke-access
          - title: Remove agent mode on the device
            body:
              - >-
                ChatAgentMode=false (chat.agent.enabled) removes agent mode and side-effect tools in VS Code
                regardless of the signed-in account.
            url: https://code.visualstudio.com/docs/enterprise/policies
        note: >-
          Partial by the rule applied to every vendor: the admin controls block new work, but no vendor control
          stops a session already running on the device, and the delay for a running session is not documented.
          Enterprise licence unassignment "revokes access immediately", yet GitHub does not say that the running
          agent's next model call fails; organization-level removal is documented both as immediate
          (license-changes) and as lasting to the end of the billing cycle (revoke-access). Managed settings
          reach clients within about an hour or on restart, device policies on the next policy read, and an
          Agent Host session can keep running with no client window open. A command already started in the
          terminal runs to completion; local BYOK sessions do not touch the Copilot API. EDR process kill is the
          external complement.
