# Claude in Chrome — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# Fetch log 2026-09-10: trust.anthropic.com and trust.anthropic.com/resources render client-side
# and returned only a page title (certifications taken from privacy.claude.com instead);
# www.anthropic.com/trust and www.anthropic.com/security 404; chromeenterprise.google/policies
# returned navigation only (policy text taken from the Chromium policy_definitions source and
# support.google.com/chrome/a); support.google.com/chrome/a/answer/9945456 404;
# cloud.google.com/chrome-enterprise-premium/docs 301 -> docs.cloud.google.com.
# 2026-09-25: re-verified toolClaudeChrome (all 15 rows) against the MITRE capability rules; every cited
# support.claude.com, code.claude.com and platform.claude.com page answered 200 with no redirect (docs read as
# .md); support.google.com/chrome/a answers 404 to HEAD but 200 to GET; trust.anthropic.com renders client-side;
# the extension's managed policy schema (forceLoginOrgUUID, blockedUrlPatterns) was read from the 1.0.94 CRX
# served by the Chrome Web Store update service, since no Anthropic page lists it.
vendor: anthropic
family: Claude in Chrome
tools:
  - id: toolClaudeChrome
    name: Claude in Chrome (Claude for Chrome)
    surfaceClasses:
      - browserExtension
    variants:
      - name: Claude in Chrome side panel (runs as a Cowork session on Max/Team, rolling out to Pro)
        class: browserExtension
        url: https://support.claude.com/en/articles/12012173-get-started-with-claude-in-chrome
      - name: Browser tools for Claude Code (claude --chrome, VS Code extension)
        class: browserExtension
        url: https://code.claude.com/docs/en/chrome
        note: >-
          Exposed to Claude Code as the claude-in-chrome MCP server over a native messaging host and
          bridge.claudeusercontent.com; requires a claude.ai login (not API keys or third-party providers).
      - name: "Browser use from Cowork (Preferred browser: Claude in Chrome or the built-in browser)"
        class: browserExtension
        url: >-
          https://support.claude.com/en/articles/16635803-set-up-browser-use-in-claude-cowork-for-team-and-enterprise-plans
    architecture: archAgenticBrowser
    status: ga
    asOf: "2026-09"
    summary:
      - >-
        A Chrome extension (Chrome Web Store id fcoeoabgfenejglbffodgkkbkcdhcgfn, version 1.0.94, updated 19
        September 2026) that lets Claude read, click, type and navigate in the user's own browser with the
        user's live login state, from the side panel, from Cowork, or as tools for Claude Code. Inference runs
        on the Anthropic API under the signed-in claude.ai account (Pro, Max, Team, Enterprise); page content,
        screenshots and actions leave the browser to Anthropic, and side-panel sessions are saved to history
        and synced across devices. It is the vendor-extension shape of the browser-agent drawing: no runtime
        of its own, the browser's APIs as its tools, and the profile's cookie jar as its credential, so the
        controls that bound it are the managed profile, browser extension policy and the secure web gateway
        the organisation supplies, plus the site lists and toggle in the vendor console.
      - >-
        Anthropic's safeguards are model training, injection and action-screening classifiers, default-blocked
        site categories (adult, piracy; financial sites need explicit permission), prohibited actions
        (purchases, account creation, captcha solving, permanent deletions, "completing instructions from
        emails or web content") and always-confirm actions (downloads, sensitive data entry, granting
        authorisations). Admin controls sit in the claude.ai console at Organization settings > Claude in
        Chrome: an org enable toggle (on by default on Team; on Enterprise it turns on by default starting 10
        September 2026 unless an owner already turned it off), site allowlists and blocklists that override
        user permissions, a per-role capability on Enterprise, and forceLoginOrgUUID as a Chrome enterprise
        policy. Users choose Manually approve, Automatically approve (the Cowork side panel's default) or Skip
        all approvals, and the side panel keeps the choice; the console does not pin the mode. Zero data
        retention is not supported for Claude in Chrome, and the product does not yet honour role-level model
        or effort restrictions.
    facts:
      - label: Plans
        value: >-
          Pro, Max, Team and Enterprise, but not organisations covered by HIPAA; generally available in Cowork
          and Claude Code, beta in the Chrome side panel; extension 1.0.36+ for Claude Code; not through Bedrock,
          Vertex or Foundry.
        url: https://code.claude.com/docs/en/chrome
      - label: Inference & routing
        value: >-
          Anthropic API with the claude.ai login; Claude Code sessions reach the extension through
          bridge.claudeusercontent.com, which must share the proxy egress used for claude.ai when IP
          allowlisting is on.
        url: https://code.claude.com/docs/en/network-config
      - label: Data leaving the device
        value: >-
          Page content, DOM and screenshots of the tabs Claude works in, console and network readers when
          used, and uploaded files (up to 10 MB) go to Anthropic; GIF recordings capture everything visible
          including logged-in account details.
        url: https://code.claude.com/docs/en/chrome
      - label: Retention & training
        value: >-
          Follows the account's plan policy (commercial: no training, 30-day retention); side-panel sessions
          are Cowork sessions saved to history; zero data retention is not supported for Claude in Chrome.
        url: https://support.claude.com/en/articles/13065128-claude-in-chrome-admin-controls
      - label: Docs index
        value: >-
          support.claude.com Claude in Chrome articles (get started, safety, permissions, admin controls) and
          code.claude.com/docs/en/chrome
        url: https://support.claude.com/en/articles/13065128-claude-in-chrome-admin-controls
      - label: Network requirements
        value: >-
          claude.ai, api.anthropic.com, platform.claude.com and wss://bridge.claudeusercontent.com; the bridge
          must leave through the same proxy egress as claude.ai when IP allowlisting is enabled, or that
          egress address must be on the org allowlist.
        url: https://code.claude.com/docs/en/network-config
      - label: Supported browsers
        value: >-
          The support article says only Google Chrome; the Claude Code page says Chrome and Edge, with
          detection in Brave, Arc, Vivaldi and Opera (not WSL). Plan for the wider set.
        url: https://support.claude.com/en/articles/12012173-get-started-with-claude-in-chrome
      - label: Usage & model governance
        value: >-
          Side-panel work consumes as Cowork agentic work against organisation, group and user spend limits
          (managed under Organization settings > Cowork); model access and effort-level restrictions by role
          do not yet apply to Claude in Chrome.
        url: https://support.claude.com/en/articles/14782391-claude-enterprise-consumption-guide
      - label: Extension permissions
        value: >-
          Requests sidePanel, storage, scripting, debugger, tabGroups, tabs, alarms, notifications,
          system.display, webNavigation, declarativeNetRequestWithHostAccess, offscreen, nativeMessaging,
          downloads and unlimitedStorage; the Web Store listing declares handling of personally identifiable
          information, personal communications, location, web history, user activity and website content.
        url: https://support.claude.com/en/articles/12012173-get-started-with-claude-in-chrome
    riskNotes:
      - risk: riskPromptInjection
        note: >-
          Web content is the attack surface; ShadowPrompt (March 2026, fixed 1.0.41) let any site inject
          prompts through a trusted *.claude.ai subdomain, and Anthropic's own safety article says the risk of
          a successful attack "is not zero". Allowlists and separate browser profiles are the practical
          containment.
      - risk: riskAgenticDelegationConfusedDeputy
        note: >-
          Claude acts inside every session the user is logged into (Gmail, GitHub, Drive, banking if
          permitted) with no separate identity; ClaudeBleed (May 2026) showed another zero-permission
          extension could issue commands to it.
      - risk: riskInsecureIntegratedComponent
        note: >-
          The extension requests debugger, scripting, nativeMessaging and downloads permissions and updates
          automatically from the Chrome Web Store (1.0.94 on 19 September 2026); the native messaging host for
          Claude Code is started by the browser, outside Claude Code's corporate launcher.
      - risk: riskRogueActions
        note: >-
          "Skip all approvals" disables safety checks entirely; "Automatically approve" is the Cowork side
          panel's default and nothing in the admin console pins the mode. Purchases are prohibited outright and
          downloads, sensitive-data entry and granting authorisations always ask, but sending messages and
          publishing are not in the always-ask set.
      - risk: riskSensitiveDataDisclosure
        note: >-
          Screenshots and page text of authenticated apps leave the browser; Anthropic advises against use for
          financial, legal, medical or regulated data, and zero data retention is not available for this
          product.
    controls:
      - mitigation: AML.M0029
        coverage: partial
        mechanism: >-
          Side-panel mode selector chosen by the user and kept for later sessions: Manually approve (each
          action; a plan to approve first in the classic panel), Automatically approve (an AI safety check on
          each action, the Cowork side panel's default) and Skip all approvals; always-ask on modifying
          permission settings, granting authorisations and entering sensitive information; per-site "Allow this
          action" / "Always allow actions on this site"; vendor-prohibited action classes; in Claude Code,
          managed permission rules on the claude-in-chrome tools and permissions.disableBypassPermissionsMode
        steps:
          - title: Keep users on per-action approval
            body:
              - >-
                Have users pick Manually approve in the side panel's mode drop-down and answer site prompts with
                "Allow this action" rather than "Always allow actions on this site"; the side panel keeps the
                chosen mode and no admin setting pins it.
            url: https://support.claude.com/en/articles/12902446-claude-in-chrome-permissions-guide
          - title: Force prompts on browser tools in Claude Code
            body:
              - >-
                In managed settings add permissions.ask rules for mcp__claude-in-chrome__* with
                allowManagedPermissionRulesOnly, and set permissions.disableBypassPermissionsMode to "disable" so
                plan-mode browser calls cannot run unprompted.
            url: https://code.claude.com/docs/en/permissions
          - title: Remove the classifier mode from Cowork
            body:
              - >-
                Turn off Allow "Automatically approve" mode under Organization settings > Cowork > Permissions;
                the page documents it for Cowork's mode selector and does not say it reaches the Chrome side
                panel, so test it there.
            url: >-
              https://support.claude.com/en/articles/13455879-use-claude-cowork-on-team-and-enterprise-plans
        note: >-
          Partial by the architecture rule: named consequential classes are confirmed by a present user, but the
          covered set is vendor-chosen and narrower than the pin's (purchases and financial transactions are
          prohibited outright and sensitive-data entry and authorisations always ask, while sending messages
          and publishing are not in the always-ask set), and nothing on the Chrome admin page removes Skip all
          approvals or Automatically approve. The permissions guide says the always-ask actions apply
          "regardless of your permission mode" yet describes Skip all approvals as never pausing; treat Skip as
          unconfirmed. Automatically approve is a model reviewer and never counts as human approval. "Always
          allow actions on this site" pre-approves every later action on that origin except the protected ones,
          and scheduled shortcuts run with nobody present. Only the Claude Code path is admin-enforceable, by
          managed permission rules.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityHitlControls
          reviewRequired: false
          original:
            - capability: capabilityHitlControls
              coverage: partial
              mechanism: >-
                Manually approve (plan shown before acting), Automatically approve (pauses on flagged risks),
                Skip all approvals; always-confirm actions regardless of mode; Claude Code prompts "Claude in
                Chrome wants to" per site
              steps:
                - title: Set the approval mode
                  body:
                    - Choose Manually approve to review each action before it runs; Automatically approve
                      still requires approval for downloads, sensitive data entry and granting authorisations,
                      and Skip all approvals removes every pause.
                  url: https://support.claude.com/en/articles/12902446-claude-in-chrome-permissions-guide
                - title: Keep state-changing browser tools behind a prompt in Claude Code
                  body:
                    - In plan mode read-only calls (read_page, get_page_text, find, screenshot) run without a
                      prompt and clicks, typing, navigation and GIF recording prompt for approval.
                  url: https://code.claude.com/docs/en/chrome
              note: >-
                The approval mode is a per-user choice with no admin setting that forces Manually approve;
                only the Claude Code path is admin-manageable, through permissions rules.
              verified: 2026-09-10
      - mitigation: AML.M0028
        coverage: partial
        mechanism: >-
          Organisation allowlist and blocklist at Organization settings > Claude in Chrome (the blocklist holds
          regardless of user permissions; the same lists govern Cowork's built-in browser); per-user site grants
          ("Allow this action" / "Always allow actions on this site", revocable under Extension settings >
          Permissions); vendor default-blocked categories and financial-site prompts; in Claude Code, managed
          permission rules per claude-in-chrome tool
        steps:
          - title: Scope sites in the vendor console
            body:
              - >-
                At Organization settings > Claude in Chrome add the sites Claude may work on to the allowlist and
                the sites it must never touch to the blocklist, which applies regardless of user permissions.
            url: https://support.claude.com/en/articles/13065128-claude-in-chrome-admin-controls
          - title: Review users' standing grants
            body:
              - >-
                Users review and revoke "always allow" sites under Your approved sites on the Extension settings >
                Permissions page.
            url: https://support.claude.com/en/articles/12902446-claude-in-chrome-permissions-guide
          - title: Scope individual browser tools in Claude Code
            body:
              - >-
                Add permissions.deny or permissions.ask rules for mcp__claude-in-chrome__<tool> in managed
                settings to remove or gate single browser tools in Claude Code sessions.
            url: https://code.claude.com/docs/en/permissions
        note: >-
          Partial by the architecture rule: the admin sets per-origin allow and block lists that the extension
          enforces over the user's grants, but there is no read-only tier (a permitted site is fully actionable,
          subject to the user's approval mode) and no per-tool or per-operation scope in the side panel. The
          extension's managed policy schema (managed_schema.json in 1.0.94) also accepts blockedUrlPatterns, a
          device-delivered block list by hostname and path, but no Anthropic page documents it. Chrome's
          ExtensionSettings runtime_blocked_hosts is not a usable scope for this extension: from Chrome 154 it
          disables chrome.debugger.attach() entirely for an extension with the debugger permission, which is how
          Claude clicks and types. Claude Code sessions inherit the extension's site permissions.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityToolPermissionScoping
          reviewRequired: false
          original:
            - capability: capabilityToolPermissionScoping
              coverage: native
              mechanism: >-
                Site-level scoping: org allowlist and blocklist at Organization settings > Claude in Chrome
                override user grants; per-site "Allow this action" / "Always allow actions on this site";
                default-blocked categories and financial-site gating; Chrome ExtensionSettings
                runtime_blocked_hosts / runtime_allowed_hosts at the browser policy tier
              steps:
                - title: Scope by site in the vendor console
                  body:
                    - Add approved sites to the allowlist so Claude can only browse those, and forbidden sites
                      to the blocklist, which applies regardless of user settings; the vendor recommends a
                      restrictive allowlist during rollout.
                  url: https://support.claude.com/en/articles/13065128-claude-in-chrome-admin-controls
                - title: Let users grant the minimum per site
                  body:
                    - Advise "Allow this action" over "Always allow actions on this site"; users review and
                      revoke always-allow grants under Extension settings > Permissions.
                  url: https://support.claude.com/en/articles/12902446-claude-in-chrome-permissions-guide
                - title: Enforce host scope from browser policy
                  body:
                    - In ExtensionSettings for id fcoeoabgfenejglbffodgkkbkcdhcgfn set runtime_blocked_hosts
                      for origins the extension must never touch; the Chromium policy text warns that from
                      Chrome 154 runtime_blocked_hosts on an extension with the debugger permission disables
                      chrome.debugger.attach() entirely, so test before rollout.
                  url: >-
                    https://chromium.googlesource.com/chromium/src/+/HEAD/components/policy/resources/templates/policy_definitions/Extensions/ExtensionSettings.yaml
              note: >-
                Scoping is by site, not by tool: the org allowlist and blocklist hide sites, per-site grants
                pre-approve actions there, and default-blocked categories limit reach. In Claude Code the
                extension's tools follow permission rules.
              verified: 2026-09-10
      - mitigation: D3-CTS
        coverage: partial
        mechanism: >-
          No credential scoping in the extension: Claude acts with the profile's cookies on every site it may
          access; the organisation allowlist at Organization settings > Claude in Chrome bounds which signed-in
          origins it can use; 1Password for Claude (macOS, beta) is off by default under Control password manager
          access and fills credentials without passing them to Claude; the vendor recommends a separate profile
          without sensitive accounts but does not provision one
        steps:
          - title: Bound the signed-in origins the agent can use
            body:
              - >-
                Keep a restrictive allowlist at Organization settings > Claude in Chrome so Claude can act only in
                the sessions of the listed origins.
            url: https://support.claude.com/en/articles/13065128-claude-in-chrome-admin-controls
          - title: Keep the password-manager bridge off
            body:
              - >-
                Leave 1Password for Claude off under Control password manager access at Organization settings >
                Claude in Chrome unless a team needs sign-in tasks.
            url: https://support.claude.com/en/articles/13065128-claude-in-chrome-admin-controls
          - title: Install the extension only in a managed agent profile
            body:
              - >-
                Set installation_mode "force_installed" for fcoeoabgfenejglbffodgkkbkcdhcgfn in ExtensionSettings
                only for the organisational unit or profile used for agent work, and block it everywhere else.
            url: https://support.google.com/chrome/a/answer/7532015
        note: >-
          Partial by the architecture rule: the admin allowlist denies the agent the sessions of unlisted origins
          and the 1Password bridge is an admin toggle, but the dedicated profile is vendor advice ("consider
          using a separate browser profile without access to sensitive accounts"), not something the product
          provisions or enforces, and nothing in the product keeps Chrome's own saved passwords away from the
          agent. On every allowed origin Claude acts with the user's full session: there is no agent identity or
          on-behalf-of exchange, and downstream applications see the user. Chrome's PasswordManagerEnabled false
          stops new saves only ("previously saved passwords will still work"). Claude Code and desktop-driven
          tasks use the same browser profile. Cowork's built-in browser, which does not see users' logins
          unless they import them, is the logged-out alternative (Organization settings > Cowork).
        verified: "2026-09-25"
        migration:
          from:
            - capabilityCredentialIsolation
          reviewRequired: false
          original:
            - capability: capabilityCredentialIsolation
              coverage: external
              mechanism: >-
                The extension uses the profile's own sessions; the isolation is a dedicated browser profile
                with few signed-in origins and no saved passwords, which the vendor recommends but does not
                provision. 1Password for Claude access control is off by default (macOS only).
              steps:
                - title: Run the agent in a separate profile
                  body:
                    - Follow the vendor's advice to use a separate browser profile without access to sensitive
                      accounts, and keep work accounts holding sensitive data out of it.
                  url: https://support.claude.com/en/articles/12902428-use-claude-in-chrome-safely
                - title: Leave the password-manager bridge off
                  body:
                    - Keep "1Password for Claude access control" at its default off unless a task needs it; it
                      is the only vendor path that hands stored credentials to the agent.
                  url: https://support.claude.com/en/articles/13065128-claude-in-chrome-admin-controls
              note: >-
                There is no agent identity or on-behalf-of exchange; downstream applications see the user.
                Provision the dedicated profile through Chrome enterprise policy so it is managed rather than
                a user habit.
              verified: 2026-09-10
      - mitigation: cap-input-guardrails
        coverage: partial
        mechanism: >-
          Anthropic's content classifier scans all untrusted content entering Claude's context and a second
          classifier checks every action before it runs (no administrator setting, threshold or event export);
          Inference hooks (Enterprise, beta) can hold governed Cowork and Claude Code requests, including tool
          results, for an allow or deny verdict from the organisation's AI security server
        steps:
          - title: Put an inspector on returned page content (Enterprise, beta)
            body:
              - >-
                At Organization settings > Data and privacy > Inference hooks turn on "Allow for your
                organization", register your AI security server, set Failure handling to "Block the request" and
                turn on "Enforce verdicts".
            url: https://platform.claude.com/docs/en/manage-claude/inference-hooks-configuration
          - title: Know what the vendor screening covers
            body:
              - >-
                The safety article states that content classifiers scan all untrusted content entering Claude's
                context and flag potential injections; there is no setting for them.
            url: https://support.claude.com/en/articles/12902428-use-claude-in-chrome-safely
        note: >-
          Partial on the rule applied to every vendor: vendor-internal screening that is not admin-configurable,
          plus an inline hook that is an attach point until the organisation's server does the classifying. No
          hidden or off-screen content stripping is documented; Claude reads pages from screenshots and page
          text. Inference hooks name claude.ai, Cowork, Claude Code and Claude Tag, not Claude in Chrome: the
          Cowork side panel runs as a Cowork session and Claude Code's browser tools return into a Claude Code
          session, but the classic side panel is not covered. Hooks return allow or deny only (no strip or
          quarantine). The action classifier and the confirmations are action policy, not input screening.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityPromptInjectionDefense
          reviewRequired: false
          original:
            - capability: capabilityPromptInjectionDefense
              coverage: partial
              mechanism: >-
                Anthropic-side content injection classifier and action screening classifier; no admin-tunable
                detector or page-content stripping
              steps:
                - title: Keep the approving modes on
                  body:
                    - Advise users to stay in Manually approve or Automatically approve; Skip all approvals turns off the safety
                      checks that screen actions.
                  url: https://support.claude.com/en/articles/12902446-claude-in-chrome-permissions-guide
                - title: Reduce exposure with allowlists and profiles
                  body:
                    - Start with a restrictive org allowlist and recommend a separate browser profile for sensitive accounts,
                      per the safety guidance.
                  url: https://support.claude.com/en/articles/12902428-use-claude-in-chrome-safely
              note: >-
                The classifiers are Anthropic-operated and not tunable; they screen page content and proposed
                actions. Allowlists and profiles reduce exposure but detect nothing.
              verified: 2026-09-10
      - mitigation: cap-sensitive-data-redaction
        coverage: partial
        mechanism: >-
          Inference hooks (Enterprise, beta) let the organisation's DLP server deny governed Cowork and Claude
          Code requests, tool results included, that carry regulated content; the organisation blocklist and
          allowlist keep Claude off data-bearing sites; always-ask on entering sensitive information; Claude Code
          Read deny rules also block uploads; Chrome Enterprise Premium DLP and the SSE as the external layer
        steps:
          - title: Inspect what leaves for inference (Enterprise, beta)
            body:
              - >-
                At Organization settings > Data and privacy > Inference hooks connect your DLP or AI security
                server and turn on "Enforce verdicts"; it can deny a request but not redact it.
            url: https://platform.claude.com/docs/en/manage-claude/inference-hooks-configuration
          - title: Keep Claude off data-bearing sites
            body:
              - >-
                Add sites holding regulated or confidential data to the blocklist at Organization settings > Claude
                in Chrome, or keep them off the allowlist.
            url: https://support.claude.com/en/articles/13065128-claude-in-chrome-admin-controls
          - title: Block uploads of protected files from Claude Code
            body:
              - >-
                Permission rules that deny Read on a file also block uploading it through the extension; uploads
                are capped at 10 MB.
            url: https://code.claude.com/docs/en/chrome
        note: >-
          Partial by the rule: an inline hook that can block is an attach point, and nothing in the product masks
          or tokenises a value; the vendor states Claude "can't filter sensitive content out of what it sees",
          and screenshots of the tabs it works in become part of the conversation. The hooks page does not name
          Claude in Chrome (it reaches the Cowork side panel and Claude Code as Cowork and Claude Code sessions,
          not the classic side panel) and does not say whether screenshots are sent. Site lists and always-ask
          are data minimisation, not detection. Claude in Chrome is not available to HIPAA organisations and
          does not support zero data retention. Chrome Enterprise Premium DLP rules (File uploaded, Content
          pasted) and an SSE with TLS inspection of the profile's traffic are the external content inspection.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAiDlp
          reviewRequired: false
          original:
            - capability: capabilityAiDlp
              coverage: partial
              mechanism: >-
                Always-confirm on sensitive data entry and downloads; org blocklist for data-bearing sites;
                Read deny rules govern uploads from Claude Code; Chrome Enterprise Premium DLP rules on upload
                and paste as the external layer
              steps:
                - title: Block uploads of protected files from Claude Code
                  body:
                    - Permission rules that deny Read on a file also block uploading it through the extension; uploads are
                      capped at 10 MB.
                  url: https://code.claude.com/docs/en/chrome
                - title: Inspect what the agent uploads and pastes
                  body:
                    - Chrome Enterprise Premium DLP rules on File uploaded and Content pasted block or audit content moving
                      through the agent's profile.
                  url: https://support.google.com/chrome/a/answer/17128928
              note: >-
                Always-confirm and the site blocklist restrict actions and destinations; nothing in the
                extension inspects what is typed, uploaded or returned. Content inspection is Chrome
                Enterprise DLP or the SSE.
              verified: 2026-09-10
      - mitigation: AML.M0031
        coverage: partial
        mechanism: >-
          Account memory (off by default on Team and Enterprise, turned on at Organization settings >
          Capabilities) is shared with Cowork in the cloud, which the side panel runs as; side-panel sessions are
          saved to account history and synced across devices; shortcuts, scheduled shortcuts and recorded
          workflows (classic panel) keep standing instructions in the extension; "always allow" site grants
          persist
        steps:
          - title: Decide on account memory
            body:
              - >-
                Leave memory off or turn it on at Organization settings > Capabilities; turning it off deletes
                every member's memory entries immediately.
            url: >-
              https://support.claude.com/en/articles/11817273-use-claude-s-chat-search-and-memory-to-build-on-previous-context
          - title: Review saved instructions
            body:
              - >-
                Users edit or delete shortcuts through the extension settings, including any scheduled to run
                automatically.
            url: https://support.claude.com/en/articles/12012173-get-started-with-claude-in-chrome
          - title: Review standing site grants
            body:
              - >-
