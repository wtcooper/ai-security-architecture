# Per-tool assessments reference organization capability IDs, never MITRE or CoSAI IDs.
# Re-authored from the pre-migration records preserved in archive/ (migration.original[]).
tools:
  - tool: toolClaudeCode
    available: true
    note: Approved for engineering on managed laptops; managed settings pushed by MDM.
    capabilities:
      EX-AUTH:
        status: enabled
        note: SSO enforced through the claude.ai organisation; forceLoginMethod claudeai and forceLoginOrgUUID pinned in managed-settings.json.
      EX-AGENT:
        status: enabled
        note: >-
          permissions.deny rules for destructive shell commands and force-push in managed settings; a PreToolUse hook
          blocks commands that leave the repository. permissions.deny and allowManagedPermissionRulesOnly in
          managed-settings.json. disableBypassPermissionsMode set; permissions.ask on git push and package publish.
          allowedMcpServers allowlist and managed-mcp.json as the only server set (admission by identity);
          tool-definition integrity is not covered and is accepted as a residual.
        evidence: CHG-1042
      EX-TPRM:
        status: enabled
        note: Anthropic assessed in the TPRM platform against the SOC 2 Type 2 and ISO 27001 artifacts; annual re-review.
        evidence: TPRM-0417
      EX-SANDBOX:
        status: gap
        note: sandbox.enabled pending bubblewrap packaging for the Linux fleet.
      EX-PAM:
        status: enabled
        note: >-
          forceLoginOrgUUID; API keys blocked; the apps gateway holds the upstream key. apiKeyHelper issues
          short-lived gateway tokens; no long-lived key on the device.
      EX-AISPM:
        status: gap
        note: >-
          AI BOM: vendor offers nothing; the inventory is kept by hand in the governance register. Seats assigned
          per role in the admin console; agent teams disabled until the inventory is complete. Corporate proxy
          header blocks personal logins; EDR inventory of the claude binary not yet reconciled against seat
          assignments.
      EX-SIEM:
        status: inProgress
        note: OTel export to the SIEM from a pilot group.
      EX-EDR:
        status: enabled
        note: EDR agent on every managed laptop with the documented process exclusions.
      EX-SWG:
        status: inProgress
        note: Gateway enforced for inference; sandbox network policy not yet rolled out.
      EX-DLP:
        status: inProgress
        note: Read() deny rules cover .env and ~/.aws; sandbox credential masking waits on the sandbox rollout.
      EX-GUARDRAILS:
        status: inProgress
        note: Built-in detections only; WebFetch limited to allowed domains, no inline classifier yet.
  - tool: toolCursor
    available: true
    note: Pilot with one team; Privacy Mode enforced, MCP allowlist under evaluation.
    capabilities:
      EX-AUTH:
        status: enabled
        note: SSO through the team dashboard; MDM AllowedTeamId pins the tenant.
      EX-AGENT:
        status: inProgress
        note: >-
          Run Mode policy set to Auto-review for the pilot team; Allowlist mode planned. MCP Configuration
          allowlist drafted and under evaluation with the pilot team; permissions.json not yet pushed by MDM.
          Auto-review Run Mode; MCP tools prompt by default.
      EX-TPRM:
        status: enabled
        note: Cursor assessed in the TPRM platform; ownership change flagged for re-review.
        evidence: TPRM-0522
      EX-DLP:
        status: inProgress
        note: beforeReadFile hook redacts .env files; no beforeSubmitPrompt hook yet.
      EX-GUARDRAILS:
        status: inProgress
        note: Auto-review classifier on; Browser Controls domain allowlist not set.
      EX-SANDBOX:
        status: gap
        note: sandbox.json not configured; developers run in the default mode.
      EX-PAM:
        status: gap
        note: >-
          Vendor offers nothing for the local agent; it runs with the developer's own credentials. Personal API
          keys blocked in Team Settings; tool credentials in the developer's shell are not vaulted and .env files
          are readable by terminal tools.
      EX-AISPM:
        status: gap
        note: >-
          AI BOM: vendor offers nothing; kept by hand in the governance register. Team Marketplaces not yet
          configured; plugins are open. MDM AllowedTeamId blocks personal logins; endpoint inventory of Cursor
          installs not yet reconciled against team membership.
      EX-SIEM:
        status: inProgress
        note: Enterprise Audit Log enabled; SIEM streaming not yet connected.
      EX-EDR:
        status: enabled
        note: EDR agent with the documented process exclusions.
      EX-SWG:
        status: gap
        note: sandbox.json network policy not configured; the corporate proxy is the only control.
  - tool: toolClaudeManagedAgents
    available: true
    note: Design partner programme; vault scoping under review.
    capabilities:
      EX-AUTH:
        status: enabled
        note: Console organisation on SSO; one workspace per team.
      EX-IGA:
        status: inProgress
        note: Vault display_name mapped to the owning service; no lifecycle review yet.
      EX-PAM:
        status: inProgress
        note: >-
          Vault credentials with managed OAuth refresh for MCP; static bearer tokens still in two vaults. Vault
          credentials substituted at egress; one shared vault per agent, so per-user vaults for tenant scoping are
          still to be built.
      EX-KMS:
        status: gap
        note: No customer-managed keys for sessions; accepted for the design partner phase.
      EX-AISPM:
        status: inProgress
        note: >-
          Agents are workspace resources with metadata naming the owner. Configuration read back through the API
          into the register; comparison against the policy baseline and drift alerting not yet built.
      EX-EVALS:
        status: gap
        note: No release-gate evaluation before an agent version goes live.
      EX-AGENT:
        status: inProgress
        note: >-
          Toolsets default to enabled false; per-tool review in progress. permission_policy always_ask on write
          tools, on bash and on every MCP toolset; evaluated_permission kept from each tool event in the SIEM.
          MCP servers declared per agent definition and gated in the deployment pipeline; default_config.enabled
          false with named tools on two of five agents.
      EX-GUARDRAILS:
        status: gap
        note: >-
          Read-only memory stores and limited networking; no inline classifier. Model-side safeguards only; no
          organisation guardrail on the session.
      EX-TPRM:
        status: enabled
        note: Covered by the Anthropic TPRM assessment.
        evidence: TPRM-0417
      EX-GRC:
        status: inProgress
        note: Agent and vault listings pulled into the governance register weekly by script.
      EX-SIEM:
        status: inProgress
        note: Session events retained; export to the SIEM not yet automated.
      EX-SANDBOX:
        status: enabled
        note: Cloud environments only; no self-hosted sandbox yet, so isolation is Anthropic's container per session.
      EX-FIREWALL:
        status: inProgress
        note: >-
          networking type limited with allowed_hosts on the production environment; two development environments
          still unrestricted, and web_fetch domain lists not yet set.
  - tool: toolClaudeDesktop
    available: true
    note: Enterprise plan; connector directory restricted to approved connectors.
    capabilities:
      EX-AUTH:
        status: enabled
        note: Require SSO for Claude; SCIM provisioning with groups.
      EX-ACCESS:
        status: inProgress
        note: Connectors act as the user; managed authorisation scoping under review.
      EX-SWG:
        status: enabled
        note: >-
          IP allowlisting to the corporate egress ranges; tenant restrictions header on the proxy. Documented host
          allowlist on the proxy; egressProxyUrl pushed by MDM.
      EX-DLP:
        status: inProgress
        note: Endpoint DLP covers the desktop app; SaaS-side inspection pending.
      EX-GUARDRAILS:
        status: inProgress
        note: Connector tool restrictions in place; inference hooks pending.
      EX-GRC:
        status: inProgress
        note: Compliance API pulled into the governance register; usage exports still manual.
      EX-TPRM:
        status: enabled
        note: Covered by the Anthropic TPRM assessment.
        evidence: TPRM-0417
      EX-AGENT:
        status: enabled
        note: >-
          Connector tools prompt per call; always-allow disabled by the Owner. Connector directory restricted;
          write tools off for the organisation.
      EX-IGA:
        status: enabled
        note: Compliance and Admin API keys scoped and rotated quarterly.
      EX-AISPM:
        status: inProgress
        note: >-
          Connector catalogue and extension allowlist in the console. Domain capture on; personal accounts on the
          verified domain pulled in. Effective settings read back through the Compliance API; comparison against
          the policy baseline and drift alerting not yet built.
      EX-KMS:
        status: gap
        note: Customer-managed keys not requested; default encryption accepted.
      EX-PAM:
        status: enabled
        note: Enterprise-managed connector authorisation; no per-user OAuth grants.
      EX-SIEM:
        status: enabled
        note: Audit log export to the SIEM.
