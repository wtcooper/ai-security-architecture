      - framework: cisa-tic
        entry: 3.UNI.LPRIV
        relationship: supports
        rationale: Just-in-time privilege can constrain administrative access.
      - framework: nist-csf
        entry: PR.AA
        relationship: supports
        rationale: Privileged-access enforcement supports authorization.
    mitigationMappings:
      - mitigation: D3-CRO
        rationale: Can rotate managed privileged credentials.
      - mitigation: D3-CH
        rationale: Vaulting and policy can harden credentials.
      - mitigation: D3-CR
        rationale: Can revoke privileged credentials.
  - id: tech-authentication
