          per-call records but run on the endpoint and fail open by default. All three are Enterprise.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAuditLogging
          reviewRequired: false
          original:
            - capability: capabilityAuditLogging
              coverage: native
              mechanism: >-
                Enterprise Audit Log (dashboard audit-log) with SIEM streaming; Admin API /teams/audit-logs;
                Team Settings → OpenTelemetry Export
              steps:
                - title: Stream the audit log
                  body:
                    - Request streaming to Splunk, Sumo Logic, Datadog, a webhook, S3, Elasticsearch or
                      CloudWatch via hi@cursor.com; logged events cover logins, membership, API keys, Privacy
                      Mode, MCP authentication, team rules, hooks and Cloud Agent environments — not agent
                      responses or generated code.
                  url: https://cursor.com/docs/enterprise/compliance-and-monitoring
                - title: Pull it programmatically
                  body:
                    - Query /teams/audit-logs with an Admin API key (Basic auth, 20 requests per minute).
                  url: https://cursor.com/docs/account/teams/admin-api
                - title: Export activity telemetry
                  body:
                    - In Team Settings → OpenTelemetry Export add an OTLP/HTTP destination for token,
                      tool-call, hook and plugin events; no prompt content is exported.
                  url: https://cursor.com/docs/enterprise/opentelemetry-export
              note: Tamper-evidence and the retention period are not stated on the pages fetched.
              verified: 2026-09-10
      - mitigation: cap-agent-kill-switch
        coverage: partial
        mechanism: >-
          Remove the member (Members → Remove, SCIM unassignment, Enterprise Admin API /teams/remove-member);
          Remote Control team switch (Dashboard → Cloud Agents → Self-Hosted); Team Settings → Models; no stop
          for a running local session
        steps:
          - title: Remove the member
            body:
              - Remove the member from Members (context menu → Remove), or unassign them in your identity
                provider when the team uses SCIM.
            url: https://cursor.com/docs/account/teams/members
          - title: Automate it
            body:
              - Call POST /teams/remove-member with the userId or email (Enterprise, 50 requests per minute)
                from your offboarding or incident workflow.
            url: https://cursor.com/docs/account/teams/admin-api
          - title: Cut remote steering
            body:
              - Turn Remote Control off in Dashboard → Cloud Agents → Self-Hosted so members cannot hand local
                sessions to other devices.
            url: https://cursor.com/docs/cloud-agent/mobile
          - title: Withdraw a model
            body:
              - Remove the model or provider from Team Settings → Models (Enterprise) so members can no longer
                use it.
            url: https://cursor.com/docs/enterprise/model-and-integration-management
        note: >-
          Partial by the rule applied to every vendor: each lever blocks new use from the vendor control plane,
          none is documented to stop a running local session, and the delay before a removed member's
          in-flight agent fails is not documented. Active Sessions in the dashboard lets admins monitor and
          manage sessions; whether ending one stops a running agent is not documented. The agent's tools run on
          the device, so stopping active work is local: an EDR process kill of Cursor or the agent CLI is the
          external complement. The API overview says API keys "are unaffected by the original creator's
          account status", so revoke the member's keys as well; AllowedTeamId keeps a removed user from signing
          back in with a personal account on managed devices.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityKillSwitch
          reviewRequired: false
          original:
            - capability: capabilityKillSwitch
              coverage: partial
              mechanism: >-
                SCIM deprovisioning; Admin API /teams/remove-member; Model Access Control to disable a model;
                AllowedExtensions to remove an extension
              steps:
                - title: Cut a user or model
                  body:
                    - Deprovision through SCIM or call /teams/remove-member (Enterprise); disable a provider
                      or model under Team Settings → Models and Cursor stops routing to it.
                  url: https://cursor.com/docs/account/teams/admin-api
              note: >-
                There is no fleet-wide stop for running local agent sessions; Remote Control can be switched
                off for the team from Dashboard → Cloud Agents → Self-Hosted.
              verified: 2026-09-10
      - mitigation: D3-PA
        coverage: external
        mechanism: >-
          Third-party EDR; integration points are the code-signed Cursor.app / Cursor.exe and agent CLI
          processes, the CURSOR_SANDBOX variable Cursor injects into every sandboxed child process, and hook
          events carrying the command text and sandbox flag
        evidence:
          - title: Cursor endpoint security configuration — process and path exclusions
            url: https://cursor.com/docs/enterprise/endpoint-security
          - title: Cursor Run Modes — environment variables injected into sandboxed processes
            url: https://cursor.com/docs/agent/security/run-modes
          - title: Cursor hooks — beforeShellExecution / afterShellExecution payloads
            url: https://cursor.com/docs/hooks
        note: >-
          External by the rule applied to every vendor: Cursor analyses no process behaviour. The endpoint
          security page lists process and path exclusions (Cursor.exe, rg.exe, inno_updater.exe, Cursor.app) to
          avoid startup timeouts; exclude those binaries only, never the agent's child processes, so the EDR
          still sees what agent commands execute. For correlation, CURSOR_SANDBOX (seatbelt or native) and
          CURSOR_ORIG_UID mark sandboxed agent children, and hook payloads carry command, cwd, sandbox,
          conversation_id and user_email for the SIEM.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityEdr
          reviewRequired: false
          original:
            - capability: capabilityEdr
              coverage: external
              mechanism: >-
                Third-party EDR with the documented process exclusions; hooks (preToolUse,
                beforeShellExecution) as the pre-tool-call boundary EDR can consume
              steps:
                - title: Register the exclusions
                  body:
                    - Exclude Cursor.exe, rg.exe and inno_updater.exe (Windows) and Cursor.app (macOS) from
                      scanning to avoid timeouts.
                  url: https://cursor.com/docs/enterprise/endpoint-security
                - title: Feed hook events to your endpoint tooling
                  body:
                    - Enterprise hooks.json runs at every tool boundary and can forward command and file
                      events to an endpoint agent before execution.
                  url: https://cursor.com/docs/hooks
              note: >-
                Sensor scope: the host, where Cursor and its sandboxed commands run; hooks are where the
                sensor can be consulted, not a sensor themselves. Apply the documented process exclusions
                rather than exempting the agent's child processes.
              verified: 2026-09-10
      - mitigation: cap-agent-egress-control
        coverage: partial
        mechanism: >-
          Sandbox network policy (networkPolicy default deny, allow / deny domains and CIDRs; a team-admin
          allowlist replaces local lists; private ranges and cloud metadata blocked); per-server network mode
          for stdio MCP servers; Enterprise Browser Controls origin allowlist
        steps:
          - title: Set the team's sandbox networking rules
            body:
              - In the web dashboard's team controls configure the sandbox networking rules for terminal
                commands with only the domains agents need; team settings take precedence over individual and
                project configuration.
            url: https://cursor.com/docs/agent/security/run-modes
          - title: Rely on the merge rules
            body:
              - A team-admin allowlist replaces the per-user and per-repo lists, networkPolicy.default deny
                wins over allow and deny patterns always win; add denies for internal domains (RFC 1918, IPv6
                private ranges and 169.254.169.254 are blocked by default).
            url: https://cursor.com/docs/reference/sandbox
          - title: Constrain local MCP servers
            body:
              - Give each stdio server in MCP Configuration the Allowlist or Deny all network mode, never Allow
                all or No sandbox.
            url: https://cursor.com/docs/enterprise/model-and-integration-management
          - title: Restrict the browser tool
            body:
              - Set Browser Controls (Enterprise) to the allowlist of origins agents may visit.
            url: https://cursor.com/docs/enterprise/llm-safety-and-controls
        note: >-
          Partial by the rule applied to every vendor: the domain allowlist exists and the team-admin layer
          cannot be weakened by local files, but it binds only sandboxed terminal commands and sandboxed stdio
          MCP servers, not all agent-executed commands. Bypasses: commands escalated outside the sandbox (after
          a user approval, or in Auto-review after the classifier allows them), Run Everything if not removed,
          MCP servers set to Allow all or No sandbox, remote MCP servers (restricted only to their own URL
          pattern), the extension host, the agent's built-in fetch and search tools, and Cursor's own API
          traffic. The docs do not say whether the admin policy also locks a member's Allow All network mode
          (which ignores sandbox.json) or whether denied attempts are logged. The endpoint firewall or SSE is
          the complement for everything else.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityEgressControl
          reviewRequired: false
          original:
            - capability: capabilityEgressControl
              coverage: native
              mechanism: >-
                sandbox.json network policy (default deny, allow/deny patterns, RFC 1918 and metadata
                blocked); per-server MCP network modes; Browser Controls domain allowlist
              steps:
                - title: Default-deny sandbox egress
                  body:
                    - Set networkPolicy.default to deny and list allowed domains, wildcards or CIDRs; private
                      ranges and cloud metadata endpoints are blocked regardless, and the team-admin layer
                      cannot be weakened.
                  url: https://cursor.com/docs/reference/sandbox
                - title: Constrain local MCP servers
                  body:
                    - Choose Allowlist or Deny all as the network mode for each stdio server in MCP
                      Configuration.
                  url: https://cursor.com/docs/enterprise/model-and-integration-management
              note: >-
                Applies to sandboxed commands only; commands that run outside the sandbox (Run Everything, No
                sandbox MCP servers) reach anything the device can.
              verified: 2026-09-10
      - mitigation: D3-FA
        coverage: partial
        mechanism: >-
          Cursor's extension marketplace proxy (marketplace.cursorapi.com) scans extensions for malware before
          serving them; Marketplace Install Cooldown; Enterprise Require Extension Signature Verification;
          AllowedExtensions version pins; Cursor's manual review of marketplace plugins
        steps:
          - title: Delay and verify extension installs
            body:
              - In Team settings → Security & automation set Marketplace Install Cooldown (hours) above 0,
                applied fleet-wide, and on Enterprise turn on Require Extension Signature Verification.
            url: https://cursor.com/help/customization/extensions
          - title: Pin approved extensions
            body:
              - Set AllowedExtensions by MDM or in the dashboard to approved publishers and extension IDs,
                pinning versions or a release channel where needed.
            url: https://cursor.com/docs/enterprise/identity-and-access-management
          - title: Force dependency installs through your mirror
            body:
              - Make the team-admin sandbox allowlist permit only your scanned package mirror's domains for
                package managers, so sandboxed installs cannot reach public registries directly.
            url: https://cursor.com/docs/reference/sandbox
        note: >-
          Partial by the rule applied to every vendor: Cursor itself scans what it serves on one channel,
          extensions through its marketplace proxy (automated malware and supply-chain analysis, with a
          blocklist), and manually reviews marketplace plugins and every update; the cooldown and signature
          checks are client-side install gates. Outside that boundary: project dependencies and MCP server
          packages the agent installs through the terminal (npm, pip, npx), plugins from GitHub-imported team
          marketplaces or local imports, and extensions from a custom ExtensionGalleryServiceUrl. Those need
          the organisation's package mirror or artifact repository with malware scanning; the sandbox allowlist
          enforces the route only for sandboxed commands. No model files are loaded on the device, since
          inference is hosted.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityModelScanning
            - capabilityAiBom
          reviewRequired: false
          original:
            - capability: capabilityModelScanning
              coverage: notApplicable
              mechanism: Not applicable — no model artifacts are loaded on the device
              note: >-
                All inference is on Cursor's hosted providers; which models may be used is governed by Model
                Access Control. Nothing to scan locally.
              evidence:
                - title: Vendor docs index, reviewed for applicability (2026-09-10)
                  url: https://cursor.com/docs/enterprise
              verified: 2026-09-10
            - capability: capabilityAiBom
              coverage: none
              mechanism: Not offered
              note: No manifest or signature of the models, plugins and tools composing a session. Extension installs can
                require signature verification and an Install Cooldown (security hardening page), and the
                official marketplace is manually reviewed, but nothing is machine-readable or verified at
                load.
              evidence:
                - title: Vendor docs index, reviewed; no setting for this control (2026-09-10)
                  url: https://cursor.com/docs/enterprise
              verified: 2026-09-10
