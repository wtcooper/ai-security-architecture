# Authored specialisations of MITRE mitigations: one actionable countermeasure each, one MITRE parent each.
attribution: >-
  The cap-* identifiers are repository keys only; the parent MITRE D3FEND or ATLAS entry is the citable
  mitigation and the sole source of canonical names and definitions. Each specialisation's definition,
  data-flow placement, CoSAI control subset and legacy mapping are authored in this repository to restore
  the pre-MITRE capability taxonomy where a single MITRE entry is too coarse to act on.
specializations:
  - id: cap-sensitive-data-redaction
    parent: AML.M0020
    title: Sensitive Data Detection and Redaction
    abbrev: Data Redaction
    legacy: [capabilityAiDlp, capabilityPromptRedaction]
    implementation: >-
      Detect identifiers, secrets and classified content in prompts, uploads, connector payloads, retrieved
      context and model responses, inline at the boundary where the traffic crosses into or out of the
      model: the endpoint agent or browser for user input, the gateway or application layer for the
      inference path. On a hit the policy either blocks the exchange (DLP) or masks, tokenises or
      de-identifies the span so the model and the downstream consumer never see the raw value.
    features:
      - PII, secret and classification-label detection on inbound prompts and uploads
      - Masking, tokenisation or de-identification applied before the request leaves the boundary
      - Response-side inspection and blocking of sensitive spans before delivery to the user or tool
      - Coverage of machine egress through agent tool calls, not only human-typed prompts
    controls:
      - controlInputValidationAndSanitization
      - controlOutputValidationAndSanitization
      - controlRuntimePrivacyEnhancingTechnologies
      - controlUserDataManagement
    examples:
      - endpoint DLP agents
      - network and API DLP inspection
      - in-session prompt and upload controls
      - PII and secret detectors
      - de-identification and masking services
      - context minimization filters
    risks: [riskSensitiveDataDisclosure, riskExcessiveDataHandlingDuringInference, riskInferredSensitiveData]

  - id: cap-retrieval-grounding-checks
    parent: AML.M0020
    title: Retrieval Trust and Grounding Checks
    abbrev: Retrieval Checks
    legacy: [capabilityRagSecurity, capabilityGroundednessChecking]
    implementation: >-
      Two checks on the retrieval path of an assistant the organisation operates: at ingest and query time,
      trust-tier the sources, isolate indexes per tenant and screen documents for poisoning before they can
      steer generation; at output time, verify that a response is supported by the retrieved sources and
      that any proposed tool call matches the stated task before the harness acts on it. Content or claims
      that fail are excluded from context or held for review rather than executed.
    features:
      - Source trust scoring and per-tenant index isolation in the retrieval corpus and embedding store
      - Ingest-time and query-time anomaly screening of retrieved documents
      - Claim-to-source grounding verification of responses before delivery
      - Tool-call validation against the task before execution
    controls: [controlOutputValidationAndSanitization, controlRetrievalAndVectorSystemIntegrity]
    surfaces:
      surfaceSaas:
        applies: false
        responsibility: provider-inherited
        note: >-
          The vendor owns the index, its tenancy model and any grounding step; the customer's lever is
          repository permissions, not retrieval controls. Requires supplier evidence.
    examples:
      - retrieval source trust scoring
      - per-tenant index isolation
      - ingest and retrieval anomaly detection
      - contextual grounding checks
      - claim-to-source verification
      - tool-call validation before execution
    risks:
      - riskRetrievalVectorStorePoisoning
      - riskPromptInjection
      - riskSensitiveDataDisclosure
      - riskInsecureModelOutput
      - riskRogueActions

  - id: cap-ai-vendor-assessment
    parent: D3-ORA
    title: AI Vendor Risk Assessment
    abbrev: Vendor Assessment
    legacy: [capabilityAiTprm]
    implementation: >-
      Assess each supplier of a model, hosting platform, agent runtime, extension or AI-enabled SaaS
      against AI-specific criteria (training-data practices, subprocessors, model provenance, incident and
      disclosure obligations) before the integration is connected, and re-run the assessment when the
      vendor ships new AI features or the evidence expires. It sits ahead of the data flow at the
      onboarding gate: an unfavourable outcome blocks or conditions the connection, a favourable one
      records the accepted residual risk with an owner and a review date.
    features:
      - AI-specific questionnaire content covering data use, provenance and incident obligations
      - Evidence collection with expiry and a reassessment trigger on vendor feature changes
      - A recorded approval, condition or rejection tied to the integration in the AI asset inventory
    surfaces:
      surfaceSaas:
        applies: true
        responsibility: customer-operated
        note: >-
          The dominant control for vendor AI: the assessment is the customer's own process run at the
          integration boundary, where most technical capabilities cannot reach.
    examples:
      - vendor risk platforms with AI questionnaire content
      - attestation and evidence collection workflows
      - continuous vendor monitoring and reassessment triggers
    risks: [riskInsecureIntegratedComponent, riskUnauthorizedTrainingData, riskModelSourceTampering]
    process:
      - title: Intake assessment before connection
        note: >-
          No model, runtime or AI-enabled SaaS is connected to organisational data or identity until the
          AI-specific questionnaire and attestations have been reviewed and a risk decision recorded.
      - title: Reassessment on change or expiry
        note: >-
          Vendor AI feature releases, subprocessor changes and evidence expiry each re-open the assessment;
          the reassessment cadence is set per vendor tier.
      - title: Risk acceptance with an accountable owner
        note: >-
          Residual risk is accepted by a named business owner, not the assessor, and is revisited at the
          next reassessment.

  - id: cap-ai-threat-modeling
    parent: D3-ORA
    title: AI System Threat Modelling
    abbrev: Threat Modelling
    legacy: [capabilityThreatModeling]
    implementation: >-
      Build and maintain a threat model of each specific AI system: enumerate its attack surface against a
      published AI threat taxonomy, map the trust boundaries between user input, retrieval, model, tools
      and downstream consumers from the architecture, and keep the model current as the system changes.
      It runs ahead of and alongside the data flow, at design and change review: findings become required
      countermeasures pinned at the identified boundaries and tracked to closure.
    features:
      - Attack surface enumerated against an AI threat taxonomy such as MITRE ATLAS or the OWASP lists
      - Trust boundaries and data flows mapped from the actual architecture, not a generic template
      - Findings linked to the countermeasures and controls that close them
      - Model refreshed when tools, data sources, models or autonomy level change
    surfaces:
      surfaceSaas:
        applies: true
        responsibility: customer-operated
        note: >-
          Modelled at the integration boundary (identity, connectors, network path, data shared) rather
          than inside the vendor's system; the vendor's own threat model is supplier evidence.
    examples:
      - threat modelling platforms with AI threat libraries
      - automated attack surface and trust boundary mapping
      - architecture-linked threat model maintenance
    risks: [riskInsecureIntegratedComponent, riskPromptInjection, riskRogueActions]
    process:
      - title: Threat model before first deployment
        note: >-
          Every new AI system or agent passes a threat-modelling review that records its trust boundaries
          and required countermeasures before it handles production data.
      - title: Refresh on architectural change
        note: >-
          Adding a tool, data source, model or autonomy level re-opens the model; the change is not
          approved until the affected boundaries have been re-examined.

  - id: cap-model-documentation
    parent: D3-ORA
    title: Model Registry and Documentation
    abbrev: Model Registry
    legacy: [capabilityModelDocumentation]
    implementation: >-
      Hold each model, agent definition and prompt version in a registry with its lineage, evaluation
      results, approval state and a generated model card, emitted as a build artifact of the training or
      deployment pipeline rather than a hand-maintained document. It sits on the release path between
      evaluation and serving: a version without a current card and an approval record is not eligible for
      promotion, and the card is what downstream teams and regulators consume.
    features:
      - Version, lineage and evaluation results recorded per model or agent definition
      - Approval state gating promotion to serving
      - Model card and regulatory disclosure artifacts generated from the pipeline
    surfaces:
      surfaceSaas:
        applies: false
        responsibility: provider-inherited
        note: >-
          The customer consumes the vendor's model card rather than producing one; its quality is the
          vendor's. The customer's part is to obtain, file and review it against the assessed use.
    examples:
      - model registries with version and approval state
      - automated model card generation
      - regulatory disclosure artifact export
    risks: [riskInsecureIntegratedComponent, riskInsecureModelOutput, riskUnauthorizedTrainingData]

  - id: cap-agent-action-policy-enforcement
    parent: D3-AMED
    title: Agent Action Policy Enforcement
    abbrev: Action Policy
    legacy: [capabilityAgentRuntimeEnforcement]
    implementation: >-
      A deterministic policy decision point that evaluates every proposed tool call or state change
      (principal, operation, arguments, target resource) against declarative rules before it executes,
      outside the model's reasoning. It sits between the agent's output handling and the tool or
      resource, in the harness, gateway or tool-call broker: an allow forwards the call, a deny returns a
      structured refusal to the agent, and an escalate routes the call to human approval.
    features:
      - Policy-as-code over tool name, arguments and target, evaluated per call
      - Allow, deny and escalate-to-human outcomes with the decision logged
      - Caller and tenant scope preserved across delegation hops
      - Intent or semantic conformance check of the proposed action against the stated task
    controls:
      - controlApplicationAccessManagement
      - controlAgentExecutionBounds
      - controlAgentPluginPermissions
    surfaces:
      surfaceSaas:
        applies: true
        responsibility: customer-configurable
        note: >-
          A decision point cannot be inserted into a fused chat product's loop, but API/SDK managed
          runtimes evaluate a customer-authored per-tool permission policy before each built-in or MCP tool
          runs; applies to that class.
    examples:
      - policy engines over tool calls
      - declarative action policies
      - intent and semantic conformance checks
    risks: [riskRogueActions, riskRunawayAgentToolLoops, riskAgenticDelegationConfusedDeputy]

  - id: cap-data-access-governance
    parent: D3-AMED
    title: Data Access Governance for Retrieval
    abbrev: Data Access Governance
    legacy: [capabilityDataAccessGovernance]
    implementation: >-
      Enforce that retrieval runs with the requesting user's identity and entitlements rather than a
      privileged service principal, and remediate over-broad permissions in the repositories an assistant
      indexes before it can surface them. It sits on the retrieval path between the orchestrator and the
      data sources: the caller's identity is carried through to the repository query, and results the user
      could not open directly are never returned into context.
    features:
      - Identity-scoped retrieval with the caller's entitlements applied at the data source
      - Oversharing and permission analysis of indexed repositories with remediation
      - Purpose or label-based restriction of what the assistant may index or return
    controls: [controlModelAndDataAccessControls, controlApplicationAccessManagement]
    surfaces:
      surfaceEndpoint:
        applies: false
        responsibility: not-applicable
        note: >-
          The repositories and their permission models live server-side; the enforcement point is in the
          cloud or SaaS retrieval layer, so there is nothing to deploy on the device.
    examples:
      - permission and oversharing analysis
      - purpose-based access control
      - identity-scoped retrieval enforcement
    risks: [riskSensitiveDataDisclosure, riskExcessiveDataHandling, riskAgenticDelegationConfusedDeputy]

  - id: cap-output-encoding
    parent: AML.M0033
    title: Output Encoding and Safe Rendering
    abbrev: Output Encoding
    legacy: [capabilityOutputEncoding]
    implementation: >-
      Treat model output as untrusted input to whatever consumes it: context-aware encoding for the actual
      interpreter (HTML, terminal, SQL, shell, markdown), control-character stripping and suppression of
      auto-rendered content that triggers outbound requests. It sits at the output-handling stage between
      the model and the renderer, tool or downstream system; output that cannot be safely encoded for its
      consumer is rendered as inert text rather than passed through.
    features:
      - Encoding selected for the consuming interpreter, not a single generic escape
      - Terminal and IDE escape-sequence sanitisation for CLI and editor agents
      - Content security policy and render restrictions on auto-loaded images and links
      - Parameterised or schema-validated hand-off to downstream tools and queries
    surfaces:
      surfaceSaas:
        applies: false
        responsibility: provider-inherited
        note: The vendor owns the rendering surface entirely; requires supplier evidence.
    examples:
      - context-aware output encoding
      - terminal control-character sanitization
      - content security policy and render restrictions
    risks: [riskInsecureModelOutput, riskCovertChannelsInModelOutputs, riskRogueActions]

  - id: cap-agent-tool-registry
    parent: D3-AI
    title: Agent and Tool Registry
    abbrev: Agent Registry
    legacy: [capabilityAgentRegistry]
    implementation: >-
      Maintain an authoritative record of every agent and tool server: owner, declared capabilities,
      version and approval state, with reconciliation that surfaces anything discovered but unregistered.
      It sits on the control plane beside the runtime rather than in the request path: the gateway,
      harness and identity provider consult it so that agents and keys not in the registry are denied,
      and listing an asset does not by itself authorise it.
    features:
      - Agent and MCP server entries with owner, capability descriptor and approval state
      - Reconciliation of endpoint, browser and cloud discovery against the registry
      - Registry consulted by the gateway or harness before an agent or tool is admitted
    controls: [controlAgentInventoryManagement]
    examples:
      - agent and MCP server registries
      - capability descriptors and agent cards
      - ownership and approval reconciliation
    risks: [riskShadowAndUnknownAgents, riskZombieShadowMCPServers, riskToolRegistryTampering]

  - id: cap-shadow-ai-discovery
    parent: D3-AI
    title: Shadow AI Discovery
    abbrev: Shadow AI
    legacy: [capabilityShadowAiDiscovery]
    implementation: >-
      Find the AI that was never registered: unsanctioned assistants and personal accounts seen in browser
      and network telemetry, unmanaged extensions and local agents found by endpoint inventory, undeclared
      model endpoints and agent workloads found by cloud discovery, and tool servers not in the registry.
      It observes the edges of the data flow (device, browser, network path, cloud account) rather than
      the inference path, and its output is a reconciliation queue: each finding is registered, blocked or
      brought under policy.
    features:
      - Network and browser detection of unsanctioned AI services and personal accounts
      - Endpoint inventory of installed agents, extensions and local tool servers
      - Cloud discovery of undeclared model endpoints and agent workloads
      - Findings reconciled against the agent and tool registry
    controls: [controlAgentInventoryManagement]
    surfaces:
      surfaceSaas:
        applies: true
        responsibility: customer-operated
        note: >-
          The classic case (employees reaching consumer AI through personal accounts) is discovered from
          the customer's own network, browser and identity telemetry, not from a vendor tenant setting.
    examples:
      - unsanctioned AI service discovery
      - shadow agent and tool server detection
      - unmanaged extension inventory
    risks: [riskShadowAndUnknownAgents, riskZombieShadowMCPServers, riskSensitiveDataDisclosure]

  - id: cap-agent-egress-control
    parent: D3-OTF
    title: Agent Egress Control
    abbrev: Egress Control
    legacy: [capabilityEgressControl]
    implementation: >-
      Allow-list the outbound destinations reachable from the location where the agent's tools and
      workloads actually execute: the device sandbox and network stack for local agents, the subnet,
      firewall and egress proxy for hosted inference and agent runtimes. It sits on the network path out
      of the execution environment; a compromised or injected agent that tries to reach an unlisted host
      to exfiltrate data or fetch instructions is blocked at that boundary and the attempt is logged.
    features:
      - Outbound domain and IP allow-lists enforced at the execution location
      - Network segmentation of inference and agent workloads from general workloads
      - Egress proxy for agent traffic with logging of denied destinations
    examples:
      - outbound domain allow-lists
      - workload network segmentation
      - egress proxies for agent traffic
    risks: [riskModelExfiltration, riskRogueActions, riskSensitiveDataDisclosure]

  - id: cap-agent-kill-switch
    parent: D3-PT
    title: Agent Kill Switch and Quarantine
    abbrev: Kill Switch
    legacy: [capabilityKillSwitch]
    implementation: >-
      Stop a misbehaving agent or model immediately: terminate its execution, revoke the credentials and
      tokens it held, quarantine it from peer agents and queued work, and decommission it with secure
      deletion of what it stored. The stop is enforced from outside the agent, at the runtime, identity
      provider and orchestrator, so the agent cannot suppress its own termination, and cancellation of
      delegated and queued work is verified rather than assumed.
    features:
      - One-action stop of an agent's execution from the runtime or orchestrator
      - Credential and token revocation on trigger
      - Quarantine from peer agents and cancellation of queued and delegated work
      - Decommissioning with secure deletion of held state
    examples:
      - agent kill switches and quarantine
      - credential revocation on trigger
      - decommissioning with secure deletion
    risks: [riskRogueActions, riskRunawayAgentToolLoops, riskShadowAndUnknownAgents]
    process:
      - title: Stop authority and trigger criteria
        note: >-
          A named role holds the authority to stop any agent, and the behaviours that trigger a stop are
          written down before the agent runs in production.
      - title: Rehearsed stop and revoke
        note: >-
          The stop, revocation and quarantine path is exercised on a schedule and after each runtime
          change, and the time to full stop is recorded.

  - id: cap-staged-rollout-gate
    parent: AML.M0008
    title: Staged Rollout and Rollback Gate
    abbrev: Rollout Gate
    legacy: [capabilityStagedRollout]
    implementation: >-
      Version models, prompts and agent definitions, promote a new version only after its security
      evaluation results are reviewed, release it progressively (canary traffic, graduated autonomy) and
      keep an automated path back to the last known-good version when behaviour regresses. It sits on the
      release path between evaluation and serving: the gate holds the version until the evidence passes,
      and the rollback trigger watches the serving telemetry once it is live.
    features:
      - Version control of model, prompt and agent-definition artifacts
      - Promotion gated on reviewed evaluation and red-team results
      - Progressive release with canary traffic or graduated autonomy
      - Automated rollback to the last known-good version on drift or regression
    surfaces:
      surfaceSaas:
        applies: true
        responsibility: customer-operated
        note: >-
          The vendor's software ships when it ships, but the agent definitions the customer deploys onto a
          managed runtime are the customer's artifacts; their versioning, canary aliases and rollback are
          the customer's to run.
    examples:
      - model and prompt version control
      - progressive rollout with graduated autonomy
      - automated rollback on drift
    risks: [riskModelDeploymentTampering, riskModelSourceTampering, riskDenialOfMLService]
    process:
      - title: Promotion gate on evaluation evidence
        note: >-
          A version moves to production only when its evaluation results have been reviewed and signed off
          by someone other than its author.
      - title: Canary before full release
        note: >-
          New versions serve a limited share of traffic or operate at reduced autonomy until the agreed
          observation window passes without regression.
      - title: Rollback rehearsed
        note: >-
          The path back to the previous version is exercised on a schedule so that it works under
          incident conditions.

  - id: cap-agent-tracing
    parent: AML.M0024
    title: Agent Execution Tracing
    abbrev: Agent Tracing
    legacy: [capabilityAgentObservability]
    implementation: >-
      Capture each agent run end to end as a structured, queryable trace: prompts, reasoning steps, tool
      calls with arguments and results, memory reads and writes, retrieval events and inter-agent
      handoffs, correlated by session and delegation chain. Instrumentation sits in the harness,
      orchestrator and gateway on every hop of the data flow and ships off the execution host to a store
      the agent cannot alter; the trace is what incident reconstruction and detection consume.
    features:
      - Per-step trace of prompts, reasoning, tool calls and results with correlation ids
      - Memory, retrieval and handoff events captured, not only inputs and outputs
      - Traces exported off the execution host with privacy controls applied
      - Session and delegation-chain reconstruction across agents
    examples:
      - agent execution tracing
      - tool invocation telemetry
      - session and handoff reconstruction
    risks: [riskAgentDelegationChainOpacity, riskRogueActions, riskRunawayAgentToolLoops]

  - id: cap-mcp-tool-integrity
    parent: AML.M0014
    title: Tool and MCP Server Integrity
    abbrev: Tool Integrity
    legacy: [capabilityMcpToolSecurity]
    implementation: >-
      Screen, pin and continuously verify the tool servers an agent connects to: static analysis of tool
      definitions for poisoned descriptions, content-hash pinning against silent redefinition, and an
      allow-list of approved servers and versions. It sits at the point where the harness or runtime
      loads a tool definition, before the tool is offered to the model; a definition whose hash or
      provenance does not match is refused, and the check is repeated after every update.
    features:
      - Static scanning of tool definitions and descriptions before admission
      - Content-hash pinning of tool servers with refusal on silent change
      - Allow-list of approved tool servers and versions consulted at load time
      - Re-verification after tool or server updates
    surfaces:
      surfaceSaas:
        applies: true
        responsibility: customer-configurable
        note: >-
          A fused chat product's internal tool catalogue is not exposed, but API/SDK managed runtimes take
          the MCP servers the customer declares and some vendors allow-list them organisation-wide; applies
          to that class.
    examples:
      - tool definition scanning
      - content-hash pinning of tool servers
      - approved tool and version allow-lists
    risks:
      - riskToolSourceProvenance
      - riskToolRegistryTampering
      - riskZombieShadowMCPServers
      - riskInsecureIntegratedComponent
