            url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/shared-responsibility
        quickstart:
          - title: "Deploy to Google Kubernetes Engine (GKE), Agent Development Kit"
            url: https://adk.dev/deploy/gke/
          - title: "Authenticate to Google Cloud APIs from GKE workloads"
            url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/workload-identity
          - title: "Best practices for hardening your cluster's security"
            url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/hardening-your-cluster
