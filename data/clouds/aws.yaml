    recommended: Declare only agentcore_gateway tools and the built-ins the agent needs. Have your application strip or allowlist tools, model, additionalParams and skills on every InvokeHarness it forwards, and let the harness security group reach only the gateway endpoint
    value: Gateway tools only; caller overrides stripped
    why: A remote_mcp tool, or one a caller supplies on the call, connects from the session microVM straight to its server, so the gateway's policy and record see only the calls the harness is configured to send it.
    mitigations: [D3-ACH, cap-agent-egress-control]
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-security.html
    verified: "2026-11-24"
  - id: regionDenyScp
    name: "Region deny (aws:RequestedRegion)"
