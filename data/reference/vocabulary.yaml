# Canonical component vocabulary for the flow-style reference architectures — the machine
# half of data/ONTOLOGY.md. The build (npm run data) checks architectures against this file
# and reports drift as warnings: a canonical item label carrying the wrong icon, a canonical
# block title carrying the wrong kind, and inline capabilities pinned without an embodying
# component or a recorded absorption.
#
# Derivation: converged from CoSAI's 23 risk-map components, OWASP Securing Agentic
# Applications KC1-KC6, the Azure Well-Architected AI workload layers, CSA MAESTRO, the F5 AI
# reference architecture grammar, and the 2026 managed-agent-runtime product decompositions —
# the same five catalogues the zone-era vocabulary was converged from, re-expressed in the
# flow grammar. Our registry is authoritative; cosaiComponent anchors are crosswalks.

# Item labels that name a CONTROL rather than a thing. A control belongs on the drawing as a
# numbered pin (where it is enforced) and, where useful, as a call-out in the security and
# governance band (which technology delivers it) — never as an item inside the component it
# governs, which states the same control twice in two grammars. The build warns on these.
controlItemLabels:
  - Egress allowlist
  - Audit tap
  - Audit taps
  - Credential broker
  - Credential injection
  - Policy enforcement
  - Rate & budget limits
  - Rate limits & quotas
  - Approved destinations
  - Content inspection
  - Sender allowlist
  - Signature check
  - Tenant isolation
  - Argument validation
  - Input validation
  - Confirmation flags
  - Scoped grants & BYOK

# One meaning per icon, catalogue-wide.
icons:
  agent: reasoning loops and agent runtimes
  chat: conversation and messaging surfaces
  clock: time, schedules, and rate/spend limits
  code: executable code and schemas
  db: stores and registries of records or artifacts
  doc: content, documents, and recorded text
  eye: observation, audit, and review
  folder: files and filesystems
  gear: configuration and mechanism
  globe: the web, external APIs, and browsers
  key: credentials, tokens, and signing
  mail: mail and SaaS communication systems
  model: models and inference interfaces
  people: groups of external parties
  person: individual identities
  phone: personal devices
  plug: protocol endpoints and connectors
  scale: policy, quotas, and evaluation criteria
  search: retrieval and discovery
  shield: validation, gating, and protection
  stop: halting and revocation

# The five ownership bands (data/ONTOLOGY.md §4a). The owner is a closed
# set and the title is FIXED per owner — a band means the same thing on every drawing, or the
# comparison a reader makes across architectures is worthless. Architecture-specific detail
# belongs in the zone's note, never in its title. The build fails a mismatch and fills the
# title in when an author omits it.
zones:
  user:
    title: User surfaces
    when: the person's own devices and channels — phone, chat client, browser, local terminal.
  endpoint:
    title: Managed endpoint
    when: devices the organisation manages, and whatever runs on them. Aligns with
      surfaceEndpoint.
  cloud:
    title: Enterprise cloud
    when: infrastructure the organisation operates — crossings, agent tiers, our own systems
      and data. Aligns with surfaceCloud.
  vendor:
    title: Vendor platform
    when: environments a vendor operates under an agreement we hold. Aligns with surfaceSaas.
  external:
    title: External
    when: outside the company with no agreement — public hubs, the open web, unsolicited
      senders, third-party services we have not assessed.
  governance:
    title: Security & governance control plane
    when: >
      the band drawn across the full width beneath every other, holding the security and
      governance services that implement controls in the bands above. Named for security
      explicitly because most of what lives here is security tooling, not policy documents.

# Named item packs — the canonical contents of a block, reusable by name. A block writes
# `pack: toolServicesRemote` instead of re-listing the items, so the same component drawn in
# five architectures is provably identical in all five rather than similar in four and subtly
# different in the fifth. The build resolves a pack into items before anything else runs.
#
# Reuse before you create: if the block you are drawing matches a pack, reference it. If it
# matches except for one item, reference the pack and add the item — do not fork the pack.
itemPacks:
  aiGatewayTraffic:
    when: >
      the AI gateway, in every architecture. The three traffic classes a LiteLLM-class tier
      brokers. The checks it runs — egress allowlist, audit tap, credential broker, rate
      limits — are NOT items here; they are numbered pins on the crossing and call-outs in the
      governance band. Writing them as items too states one control in two grammars, which is
      what 28 of the catalogue's 31 conformance warnings were.
    items:
      - { label: Model proxy, icon: model }
      - { label: MCP & tool broker, icon: plug }
      - { label: Skills broker, icon: gear }
  toolServicesLocal:
    when: Tool services in the endpoint band — the action surface running as the user.
    items:
      - { label: File & edit tools, icon: folder }
      - { label: Shell commands, icon: code }
      - { label: MCP servers, icon: plug }
  toolServicesRemote:
    when: >
      Tool services in the cloud, vendor and external bands. Deliberately identical in all
      three — the band says where it is, this pack says what it offers.
    items:
      - { label: MCP servers, icon: plug }
      - { label: APIs & connectors, icon: plug }
  memoryLocal:
    when: Memory & state beside a harness — what the loop reads back as instruction.
    items:
      - { label: Memory files, icon: folder }
      - { label: Rules & instructions, icon: doc }
  modelProvider:
    when: Model provider, everywhere. Everything behind the published interface is theirs.
    items:
      - { label: Inference API, icon: model }
  enterpriseData:
    when: Enterprise data — the terminus of patternDataChain.
    items:
      - { label: Org data, icon: db }
      - { label: File storage, icon: folder }
  downstreamPublic:
    when: Downstream services — what a tool surface reaches on the open internet.
    items:
      - { label: SaaS, icon: mail }
      - { label: Web & APIs, icon: globe }

# Named edge chains — the shapes that recur across architectures, with their registered path
# class, direction, routing hint and label. ONTOLOGY.md rule 9 says a shared pattern is drawn
# identically everywhere it appears; this section is that rule in machine-readable form, so
# the build can check it instead of a reviewer remembering it.
#
# `requires` lists the block titles that must all be present for the pattern to apply. If an
# architecture has them, it must draw the pattern — divergence is a defect, not a variation.
patterns:
  patternDataChain:
    when: >
      how an agent reaches the organisation's own data, at every band and in every
      architecture that has one. Never harness -> Enterprise data directly: the gateway
      brokers it and the cloud tool surface serves it.
    requires: [Agent harness, AI gateway, Tool services, Enterprise data]
    legs:
      - { from: Agent harness, to: AI gateway, path: primary, bidir: true, label: model & tool calls }
      - { from: AI gateway, to: Tool services, toBand: cloud, path: primary, bidir: true, route: vh, label: internal tool calls }
      - { from: Tool services, fromBand: cloud, to: Enterprise data, path: primary, bidir: true, label: scoped reads & writes }
  patternLocalSession:
    when: >
      a person working at the machine the agent runs on. Endpoint-only by construction: where
      the harness runs in our cloud the person arrives through an application front end
      instead, and that is a different pattern with a different admission story.
    requires: [Agent harness]
    legs:
      - { from: actor, to: Agent harness, toBand: endpoint, path: primary, bidir: true, label: local session }
  patternLocalTools:
    when: the harness driving its own tool surface on the endpoint.
    requires: [Agent harness, Tool services]
    legs:
      - { from: Agent harness, to: Tool services, toBand: endpoint, path: primary, bidir: true, route: hv, label: local tool calls }
  patternMemory:
    when: cross-session state beside the loop. Unlabelled — the endpoints say it.
    requires: [Agent harness, Memory & state]
    legs:
      - { from: Agent harness, to: Memory & state, path: primary, bidir: true }
  patternSupplyBackhaul:
    when: >
      what the endpoint tool surface installs, pulled back through the crossing. One
      direction only: things come in, nothing goes out this way.
    requires: [Tool services, AI gateway]
    legs:
      - { from: Tool services, fromBand: endpoint, to: AI gateway, path: primary, route: hv }
  patternExternalTools:
    when: brokered reach to third-party tool surfaces and what sits behind them.
    requires: [AI gateway, Tool services, Downstream services]
    legs:
      - { from: AI gateway, to: Tool services, toBand: external, path: external, bidir: true, route: vh }
      - { from: Tool services, fromBand: external, to: Downstream services, path: external, bidir: true }
  patternRemoteEntry:
    when: the person steering from somewhere other than the machine.
    requires: [Remote device]
    legs:
      - { from: actor, to: Remote device, path: primary, bidir: true }
  patternModelPath:
    when: >
      inference. Two registered shapes: direct where we broker it ourselves, and via the
      vendor where an agreement puts their service on the path. Not a divergence — the vendor
      leg is present or absent, and the rest is identical.
    requires: [AI gateway, Model provider]
    legs:
      - { from: AI gateway, to: Model provider, path: external, bidir: true }
    viaVendor:
      - { from: AI gateway, to: Vendor service, path: external, bidir: true, route: vh, label: to the approved vendor }
      - { from: Vendor service, to: Model provider, path: external, bidir: true }
  patternUnsolicitedInbound:
    when: >
      content arriving from someone who was never authorised to instruct the agent — the
      defining ingress of an always-on agent on a messaging channel.
    requires: [Unsolicited senders, Messaging platform, Messaging relay, Channel bridges, Agent harness]
    legs:
      - { from: Unsolicited senders, to: Messaging platform, path: external, label: unsolicited message }
      - { from: Messaging platform, to: Messaging relay, path: external, bidir: true }
      - { from: Messaging relay, to: Channel bridges, path: primary, bidir: true, label: outbound only }
      - { from: Channel bridges, to: Agent harness, path: primary, bidir: true }
  patternGovernanceBand:
    when: >
      the security and governance control plane, on every architecture. Five standalone
      call-outs at row 5, in this order, each carrying the chip numbers of the controls it
      implements and NO edges — governance applies across every band rather than being another
      hop in the data path. A sixth, Data protection, is available where classification and
      DLP carry real weight on the drawing.
    blocks:
      - { id: govIdentity, title: Identity services, icon: person, col: 1 }
      - { id: govSecrets, title: Secrets & key management, icon: key, col: 2 }
      - { id: govPolicy, title: Policy & authorization, icon: scale, col: 3 }
      - { id: govSupplyChain, title: Supply-chain assurance, icon: db, col: 4 }
      - { id: govObservability, title: Observability & response, icon: eye, col: 5 }

components:
  # --- The agent core -----------------------------------------------------------------
  - title: Agent harness
    kind: service
    cosaiComponent: componentReasoningCore
    when: the reasoning core and its machinery; qualify only for multi-agent (Supervisor
      agent / Subagents) or fused runtimes (Sandboxed runtime, Managed runtime).
    items:
      - { label: Agent loop, icon: agent }
      - { label: Context assembly, icon: doc }
      - { label: Heartbeat, icon: clock }
      - { label: Local API server, icon: plug }
  - title: Tool services
    kind: service
    cosaiComponent: componentTools
    when: >
      the actuation surface — and it keeps this one name in every band. A tool surface on the
      managed endpoint, in our cloud, at a vendor and out on the internet are the same kind of
      thing at different surfaces, so the band says where it is and the item pack says what it
      offers. Do not rename by location ("Internal MCP & APIs", "Remote tool services"): that
      hides the symmetry a reader needs. Item packs by band — endpoint: file & edit tools,
      shell, MCP servers, installed skills, computer use, sandboxed tools; cloud: MCP servers,
      APIs & connectors; vendor and external: MCP servers, APIs & connectors, A2A peer agents,
      admitted by assessment even when the service is free and unsupported, refused at the
      crossing otherwise. MCP appears in every band because users install local servers too.
    items:
      - { label: File & edit tools, icon: folder }
      - { label: Shell commands, icon: code }
      - { label: Local & remote MCP, icon: plug }
      - { label: MCP servers, icon: plug }
      - { label: APIs & connectors, icon: plug }
      - { label: A2A peer agents, icon: agent }
      - { label: Installed skills, icon: gear }
      - { label: Computer use, icon: eye }
      - { label: Sandboxed tools, icon: shield }
  - title: Memory & state
    kind: service
    cosaiComponent: componentDataStorage
    when: cross-session state the loop reads back as context.
    items:
      - { label: Memory files, icon: folder }
      - { label: Rules & instructions, icon: doc }
      - { label: Search index, icon: search }
      - { label: Vector index, icon: search }
      - { label: Conversation state, icon: folder }
      - { label: Step journal, icon: doc }
      - { label: Shared memory, icon: folder }
  - title: Application front end
    kind: service
    crossing: true
    cosaiComponent: componentApplication
    when: only where human interaction is the core input; autonomous workflows draw
      triggers straight into the harness.
    items:
      - { label: App & API endpoint, icon: globe }
      - { label: Identity binding, icon: shield }

  # --- Customer-operated crossings (the grey control surfaces) -------------------------
  - title: AI gateway
    kind: service
    crossing: true
    when: >
      the one customer-operated broker for model, tool and connector traffic — a
      LiteLLM-class tier bundling the model proxy, the MCP and tool brokerage and the
      skills path. It works in both directions: our agents reaching out, and
      externally-hosted agents admitted back into our systems. There is deliberately no
      separate "MCP gateway"; qualify only when ownership differs (Shared AI gateway,
      Managed tool gateway).
      Its items name the TRAFFIC CLASSES it brokers, never the checks it runs: the checks are
      numbered pins on the crossing plus call-outs in the governance band. This is the single
      biggest source of control-as-item drift in the catalogue — see itemPacks.aiGatewayTraffic.
    pack: aiGatewayTraffic
  - title: Egress control
    kind: service
    crossing: true
    when: the organisation's firewall and proxy tier — destination admission for approved
      vendors (the allowlist entry is where a TPRM decision is enforced), admission plus
      inspection for arbitrary destinations. Its checks are pins, not items; it is drawn as a
      separate block only where the organisation genuinely operates a proxy tier distinct from
      the AI gateway.
    items:
      - { label: Outbound connector, icon: plug }
  - title: Messaging relay
    kind: service
    crossing: true
    when: the outbound-only connector between an endpoint and a messaging platform, so
      platform credentials never sit on the device and no inbound port is opened.
    items:
      - { label: Outbound connector, icon: plug }
      - { label: Platform credentials, icon: key }
  - title: Enterprise systems
    kind: external
    deprecated: Enterprise data
    when: >
      RETIRED — use "Enterprise data". Two names for the systems of record behind our own
      crossings; the catalogue settled on Enterprise data because that is what both gold
      standards draw.
  - title: Internal MCP & APIs
    kind: service
    deprecated: Tool services
    when: >
      RETIRED — use "Tool services" in the cloud band. Renaming a tool surface by its location
      hides the symmetry a reader needs (ONTOLOGY.md rule 7): the band says where, the item
      pack says what.
  - title: Channel bridges
    kind: service
    cosaiComponent: componentAgentUserQuery
    when: per-platform inbound and outbound message handling on the endpoint, each bridge its
      own admission surface.
    items:
      - { label: Channel adapters, icon: chat }
      - { label: Pairing records, icon: doc }
  - title: Owner workspace
    kind: external
    cosaiComponent: componentDataSources
    when: the host folders shared into a sandbox — the third opening, drawn wherever a
      workspace mount exists.
    items:
      - { label: Shared folders, icon: folder }
  - title: Remote tool services
    kind: service
    deprecated: Tool services
    when: >
      RETIRED — use "Tool services" in the external band. Same reasoning as Internal MCP &
      APIs: location belongs to the band, not the title.
  - title: Messaging platform
    kind: external
    cosaiComponent: componentDataSources
    when: the vendor messaging cloud a relay speaks to; it authenticates senders to its own
      satisfaction, which is the only sender assurance the architecture inherits.
    items:
      - { label: Platform tenant, icon: chat }
  - title: Service edge
    kind: service
    crossing: true
    when: the front door of a service the organisation publishes — WAF, quotas, routing —
      in front of internet-facing machine traffic.
    items:
      - { label: App & API endpoint, icon: globe }
      - { label: Header routing, icon: plug }
  - title: Remote device
    kind: service
    cosaiComponent: componentAgentUserQuery
    when: the owner's steering surfaces away from the machine — drawn on the user's path
      in every architecture with a remote-control or channel capability; the admission
      model belongs in its notes.
    items:
      - { label: Phone & web apps, icon: phone }
      - { label: Chat channels, icon: chat }
      - { label: Messaging apps, icon: chat }
      - { label: Control UI, icon: globe }

  # --- Identity ------------------------------------------------------------------------
  - title: Enterprise IdP
    kind: external
    deprecated: Identity services
    when: >
      RETIRED — the identity provider is a governance call-out (Identity services), not a
      block in the data path. Draw it as a block only where tokens genuinely flow through it
      on the drawing, in which case the component is Authorization server.
  - title: Authorization server
    kind: service
    when: token issuance for a service the organisation publishes.
    items:
      - { label: Token issuance, icon: key }
      - { label: Client registration, icon: gear }
      - { label: Consent records, icon: doc }

  # --- Model side ----------------------------------------------------------------------
  - title: Model provider
    kind: provider
    cosaiComponent: componentModelServing
    when: the published inference interface; everything behind it is the provider's and is
      not drawn.
    items:
      - { label: Inference API, icon: model }
  - title: Inference runtime
    kind: service
    cosaiComponent: componentModelServing
    when: a runtime the organisation (or user) operates that loads weights and serves
      completions.
    items:
      - { label: Weight loader, icon: gear }
      - { label: Loaded model, icon: model }
  - title: Storage
    kind: external
    cosaiComponent: componentModelStorage
    when: weight artifacts at rest.
    items:
      - { label: Model files, icon: db }

  # --- Outside -------------------------------------------------------------------------
  - title: Downstream services
    kind: external
    cosaiComponent: componentDataSources
    when: what the tool plane reaches; drawn directly beneath Tool services. Items extend
      this set but never rename it.
    items:
      - { label: Org data, icon: db }
      - { label: SaaS, icon: mail }
      - { label: Web & APIs, icon: globe }
      - { label: Vectorstore, icon: db }
      - { label: Package registries, icon: db }
      - { label: File storage, icon: folder }
  - title: Private pkg registry
    kind: external
    cosaiComponent: componentDataSources
    when: the organisation-maintained mirror of approved packages and skills — also the
      supply chain that delivers an open-source harness itself.
    items:
      - { label: Approved packages, icon: db }
  - title: Vendor service
    kind: provider
    when: a vendor's application backend and the published surfaces of its control plane.
    items:
      - { label: Managed settings, icon: gear }
      - { label: Connector broker, icon: plug }
      - { label: Session audit export, icon: eye }
      - { label: Remote & scheduled sessions, icon: phone }

  # --- Governance ----------------------------------------------------------------------
  # The governance band's standalone services. Each is a call-out naming the technology group
  # that implements one or more numbered controls elsewhere on the drawing; they carry
  # `capabilities` rather than edges, because governance is a set of services and processes
  # that apply across every band, not another hop in the data path.
  - { title: Identity services, kind: governance, icon: person, when: IdP, workforce and non-human identity, device posture, revocation }
  - { title: Secrets & key management, kind: governance, icon: key, when: vaulting, just-in-time credentials, BYOK and signing keys }
  - { title: Policy & authorization, kind: governance, icon: scale, when: the policy engine the crossings consult, and the egress and rate decisions it carries }
  - { title: Supply-chain assurance, kind: governance, icon: db, when: registry, signing, scanning, version pinning and vendor assessment }
  - { title: Observability & response, kind: governance, icon: eye, when: telemetry, audit, discovery of unregistered use, containment and kill switch }
  - { title: Data protection, kind: governance, icon: shield, when: classification, DLP and the retention decisions applied across the bands }

  - title: Governance plane
    kind: governance
    deprecated: patternGovernanceBand
    when: >
      RETIRED — draw patternGovernanceBand instead: five standalone call-outs across the
      bottom band, each naming the technology group that implements numbered controls
      elsewhere on the drawing. A single column holding ten control items is the same
      control stated twice (once as an item, once as the pin it cites), and a band holding
      one block that holds the real content is nesting for its own sake.

  # --- Registered by the 2026-08 completeness pass -------------------------------------
  # Components already in use across the catalogue that had never been registered. Listed so
  # the name is canonical and reusable; the architecture's own file carries the detail.
  - { title: Supervisor agent, kind: service, cosaiComponent: componentReasoningCore, when: the coordinating loop in a multi-agent workflow }
  - { title: Subagents, kind: service, cosaiComponent: componentReasoningCore, when: the specialists a supervisor drives, drawn as one block because the risks are properties of the delegation pattern }
  - { title: Agent definition & code, kind: service, cosaiComponent: componentAgentSystemInstruction, when: the deployable artifact that decides what a hosted agent may do }
  - { title: Application front end, kind: service, crossing: true, cosaiComponent: componentApplication, when: see above }
  - { title: Chat surface & uploads, kind: service, cosaiComponent: componentAgentUserQuery, when: a vendor chat client on the user's device, where the prompt and the attachment are still visible to something the organisation runs }
  - { title: Identity & secure edge, kind: service, crossing: true, when: a combined identity assertion and inline inspection tier; embodies both IGA and SSE on one drawing }
  - { title: Identity & entitlements, kind: service, deprecated: Identity services, when: RETIRED — a third name for identity. The entitlement decision pins as a control; the technology is the Identity services call-out. }
  - title: Local HTTP API
    kind: service
    crossing: true
    cosaiComponent: componentModelServing
    when: >
      the loopback API a local inference runtime publishes. Marked as a crossing because that
      is precisely what it is: the admission surface of the endpoint, unauthenticated by
      design in the flagship runtimes, where which interface it binds and who may call it are
      the architecture's real security decisions.
    items:
      - { label: Completion endpoint, icon: plug }
      - { label: Interface binding, icon: gear }
      - { label: Cross-origin policy, icon: globe }
  - { title: Public model hub, kind: external, cosaiComponent: componentModelStorage, when: open-weights distribution, where publisher identity says nothing about load-time behaviour }
  - { title: Model sources, kind: external, cosaiComponent: componentModelStorage, when: where weights arrive from — a public hub or the organisation's own pipeline }
  - { title: "Repos, docs & screen", kind: external, cosaiComponent: componentDataSources, when: everything a coding or desktop agent reads — repository content, documents, screenshots }
  - { title: Owner workspace, kind: external, cosaiComponent: componentDataSources, when: see above }
  - { title: Attached knowledge, kind: external, deprecated: Enterprise data, when: RETIRED — grounding folders and sites are Enterprise data; that they were attached by a maker rather than an admin belongs in the note. }
  - { title: Connected systems, kind: service, cosaiComponent: componentDataSources, when: whatever a platform's connectors reach }
  - { title: User-connected systems, kind: service, cosaiComponent: componentDataSources, when: sources each user authorises individually, whose union is the organisation's real data path }
  - title: Enterprise data
    kind: external
    cosaiComponent: componentDataSources
    when: >
      the organisation's own systems and data behind our crossings — repositories, internal
      servers, systems of record. The terminus of patternDataChain, and the one name for what
      was also being called "Enterprise systems", "Tenant data" and "Attached knowledge".
      Items extend this set but never rename it.
    items:
      - { label: Org data, icon: db }
      - { label: File storage, icon: folder }
      - { label: Code & project docs, icon: doc }
      - { label: Tool config dotfile, icon: gear }
  - { title: Tenant data, kind: service, deprecated: Enterprise data, when: RETIRED — per-tenant records are Enterprise data from the publisher's side; whose tenant it is belongs in the note. }
  - { title: MCP service, kind: service, cosaiComponent: componentApplication, when: the stateless application a team deploys to publish an MCP server }
  - { title: Tool definitions, kind: service, cosaiComponent: componentTools, when: names, descriptions and schemas — versioned content that executes as instruction in a caller's model }
  - { title: Curation & filtering, kind: service, cosaiComponent: componentDataFilteringAndProcessing, when: the last point a poisoned example can be removed rather than baked in }
  - { title: Training content origins, kind: external, cosaiComponent: componentDataSources, when: scraped, purchased and internal corpora entering a pipeline }
  - { title: Training corpus, kind: service, cosaiComponent: componentTrainingData, when: the assembled, versioned dataset }
  - { title: Base model & deps, kind: external, cosaiComponent: componentModelStorage, when: the starting checkpoint and frameworks pulled from outside }
  - { title: Training job, kind: service, cosaiComponent: componentModelTrainingTuning, when: the build that produces a checkpoint }
  - { title: Evaluation & red teaming, kind: service, cosaiComponent: componentModelEvaluation, when: the blocking gate in front of promotion, where candidates flow through }
  - { title: Model registry, kind: service, cosaiComponent: componentModelStorage, when: versioned artifacts with lineage and a promotion gate }
  - { title: Serving & consumers, kind: external, cosaiComponent: componentModelServing, when: the platforms that pull promoted models }
  - { title: Vendor chat service, kind: provider, cosaiComponent: componentApplication, when: a vendor's assistant backend and the published surfaces of its control plane }
  - { title: Consumer product, kind: external, cosaiComponent: componentApplication, when: the same vendor's unmanaged offering, one login away and carrying none of the enterprise terms }
  - { title: Agent builder platform, kind: provider, cosaiComponent: componentApplication, when: a vendor's low-code authoring, hosting and execution surface }
  - { title: Managed runtime, kind: provider, cosaiComponent: componentReasoningCore, when: a provider-hosted agent loop, invoked through published interfaces }
  - { title: Managed memory, kind: provider, cosaiComponent: componentDataStorage, when: a provider's separately billed memory service, whose scope is a configuration flag }
  - { title: Managed sandbox, kind: provider, when: provider-operated code execution and browsing }
  - { title: Managed tool gateway, kind: provider, crossing: true, when: a provider's brokered path to tools and MCP servers }
  - { title: Maker governance, kind: governance, deprecated: patternGovernanceBand, when: RETIRED — a fourth name for the governance band. Who governs belongs in the block notes, not the band title. }
  - { title: Tenant governance, kind: governance, deprecated: patternGovernanceBand, when: RETIRED — see Maker governance. }
  - { title: Customer governance, kind: governance, deprecated: patternGovernanceBand, when: RETIRED — see Maker governance. }

# Enforcement classification for every capability (ONTOLOGY.md §2). inline requires an
# embodying component (or a recorded absorption); embedded pins on flows/blocks only;
# management lives on the governance plane.
capabilityEnforcement:
  inline:
    capabilityAiGateway: [AI gateway]
    capabilitySse: [Service edge, Identity & secure edge]
