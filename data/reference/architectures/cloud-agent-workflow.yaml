id: archAgentWorkflow
surface: surfaceCloud
rank: 2
title: Durable multi-agent workflow
abbrev: Multi-agent workflow

summary:
  - >
    A hosted agent system doing real work over business records: requests, schedules and events
    start it, a durable orchestration layer plans and delegates across subagents, and every tool
    call leaves through one governed gateway. The shape agent deployments converge on once the work outlives
    a single request.

description:
  - >
    The spine is a trigger path: requests, schedules and events start the process, and it runs
    through supervisor agent, subagents, AI gateway, tool services and downstream systems —
    there is no user interface, because nobody is conversing with it. The architecture's security posture lives almost entirely
    in one decision — that agents do not hold credentials or reach tools directly. Every tool
    call, model call and connector call leaves through the gateway, which brokers short-lived
    credentials, enforces policy per call, applies rate and budget limits, and writes the audit
    trail as a tap rather than a favour asked of the agent.
  - >
    Orchestration is durable: a supervisor decomposes work for subagents and an engine journals
    every step so the process survives crashes. Durability has two consequences nobody expects
    from reliability machinery. Everything a step returns is written down, so a step that returns
    a credential has persisted it. And the engine replays steps to recover, so a side effect that
    is not idempotent can execute more than once — including a payment.
  - >
    Delegation is the other axis. Each subagent is, structurally, the single agent workflow
    nested one level down — the same loop, the same gateway crossing, a narrower grant. A
    subagent should inherit a narrowed slice of the supervisor's authority, not all of it;
    delegation that does not narrow is privilege distribution. And
    inter-agent messages are model output becoming model input — one confused agent propagates
    through the graph, which is what distinguishes multi-agent failure from a single agent with
    more tools.
  - >
    The governance plane is drawn as its own column because it is what the personal-agent
    archetype lacks: workload identities for every agent, a registry deciding what may run and
    which tools are admitted, evaluation gates in front of change, an append-only audit sink, and
    a stop that works while a process is mid-flight.

distinguishedBy:
  - >
    Against the endpoint personal agent: the loop is nearly identical; the governance is not.
    Hosting buys an identity per agent, a policy boundary on every tool call, an audit trail and
    an administrator — none of which the endpoint pattern supplies.
  - >
    Against a RAG assistant: that architecture retrieves and answers. This one acts — its outputs
    are writes to business systems, which is why the gateway, the approval gate and replay safety
    carry the weight here.

exemplars:
  - name: Durable execution engines running agent steps
    note: >
      Workflow platforms that journal step results and replay to recover, with agent invocations
      as steps alongside conventional ones.
    asOf: "2026-08"
  - name: Supervisor and subagent orchestration
    note: >
      A coordinating agent decomposing work across specialists, each with its own context and
      tool set, over a process too long to hold in one conversation.
    asOf: "2026-08"
  - name: Managed agent runtimes
    note: >
      Cloud agent services package this same shape — runtime, gateway, registry, observability —
      as discrete products behind one control plane.
    asOf: "2026-08"

blocks:
  - id: initiator
    kind: actor
    title: Initiator
    icon: person
    col: 0
    row: 1
    note: >
      Starts the process and is absent for the rest of it. The approval they gave at the start is
      the only human decision until something escalates.

  - id: events
    kind: actor
    title: Schedules & events
    icon: clock
    col: 0
    row: 0
    note: Timers, webhooks and queue messages that start work with no human in the room.

  - id: orchestration
    kind: service
    title: Supervisor agent
    col: 1
    row: 1
    cosaiComponent: componentReasoningCore
    note: >
      Decomposes the goal, routes work to the subagents and owns the process; the durable
      engine journals every step and replays to recover. Delegation should narrow authority at
      every hop.
    items:
      - id: supervisor
        label: Planning loop
        icon: agent
        note: Decomposes the goal and routes work to specialists.
      - id: engine
        label: Durable engine
        icon: gear
        note: Journals results and replays to recover. Replay without re-authorisation re-executes side effects.

  - id: subagents
    kind: service
    title: Subagents
    col: 2
    row: 2
    cosaiComponent: componentReasoningCore
    note: >
      The specialists the supervisor drives, each with its own context and tool set.
      Structurally each one is the single agent workflow nested one level down — the
      supervisor above it is the only real difference.
    items:
      - id: specialists
        label: Specialist agents
        icon: agent
        note: Each runs the same loop as the single agent workflow, under its own workload identity.
      - id: messages
        label: Inter-agent messages
        icon: chat
        note: Model output becoming model input — one confused agent propagates through the graph.

  - id: state
    kind: service
    title: Memory & state
    col: 1
    row: 2
    cosaiComponent: componentDataStorage
    note: >
      What the workflow knows and what it has done. The journal is a reliability feature and a
      secrets sink in the same breath.
    items:
      - id: journal
        label: Step journal
        icon: doc
        note: Everything a step returns is persisted here. A returned credential is a stored one.
      - id: index
        label: Vector index
        icon: search
        note: Retrieval context for the agents.
      - id: memory
        label: Shared memory
        icon: folder
        note: Cross-step working state the agents read back as context.

  - id: gateway
    kind: service
    title: AI gateway
    col: 3
    row: 1
    note: >
      The one door. Agents hold no credentials and reach nothing directly; every model and tool
      call is brokered, policy-checked, rate-limited and logged here.
    items:
      - id: broker
        label: Credential broker
        icon: key
        note: Short-lived, scoped credentials fetched at step time — never held for the process's life.
      - id: policy
        label: Policy enforcement
        icon: shield
        note: A per-call decision about this agent, this tool, this argument — not a standing grant.
      - id: limits
        label: Rate & budget limits
        icon: clock
        note: The brake on loops and runaway spend, enforced outside the loop it limits.
      - id: audit
        label: Audit taps
        icon: eye
        note: The trail is recorded by the gateway, not volunteered by the agent.

  - id: provider
    kind: provider
    title: Model provider
    col: 4
    row: 0
    cosaiComponent: componentModelServing
    note: >
      The published inference interface, called many times across the process. Everything behind
      it is the provider's, and is not drawn.
    items:
      - id: inference
        label: Inference API
        icon: model
        note: Reached only through the gateway, on brokered credentials.

  - id: tools
    kind: service
    title: Tool services
    col: 4
    row: 1
    cosaiComponent: componentTools
    note: >
      The action surface: MCP servers, plain APIs and connectors, and A2A peer agents.
      Everything here is admitted by
      the registry and reached only through the gateway.
    items:
      - id: mcp
        label: MCP servers
        icon: plug
        note: Tool providers with declared scopes, admitted against the registry.
      - id: connectors
        label: APIs & connectors
        icon: plug
        note: Vendor-side capabilities the workflow drives on scoped grants.
      - id: peers
        label: A2A peer agents
        icon: agent
        note: Cross-org delegation over the A2A protocol. A peer's output enters this graph as input.

  - id: downstream
    kind: external
    title: Downstream services
    cosaiComponent: componentDataSources
    col: 4
    row: 2
    note: The systems the workflow actually changes — where a wrong action becomes a real one.
    items:
      - id: records
        label: Org data
        icon: db
        note: The systems of record the agents write to.
      - id: saas
        label: SaaS
        icon: mail
        note: Mail sent, tickets moved and calendar entries written on the organisation's behalf.
      - id: apis
        label: Web & APIs
        icon: globe
        note: Third-party services, and the untrusted content they return.

  - id: governance
    kind: governance
    title: Governance plane
    col: 5
    row: 0
    rowSpan: 3
    note: >
      The column the personal-agent archetype is missing. Identity, admission, evaluation, audit
      and the ability to stop a running process — each its own service, none of them inside the
      loop they govern.
    items:
      - id: idp
        label: Identity provider
        icon: person
        note: A workload identity per agent, distinct from any user.
      - id: registry
        label: Agent & tool registry
        icon: gear
        note: What may run, and which tools it may be offered. Admission, not discovery.
      - id: evals
        label: Evaluation gates
        icon: scale
        note: Behavioural checks in front of every model, prompt or tool change.
      - id: auditSink
        label: Audit sink
        icon: eye
        note: Append-only, off the agents' write path, able to reconstruct the delegation chain.
      - id: stop
        label: Kill switch
        icon: stop
        note: Stops a mid-flight process without waiting for it to finish misbehaving.

edges:
  - from: initiator
    to: orchestration
    path: primary
    bidir: true
    label: request / result
    note: >
      The human's request in — authenticated, with a scoped grant minted for it — and the
      outcome back, often days later.
  - from: events
    to: orchestration
    path: primary
    label: trigger
    note: Unattended starts. Most of this architecture's runs begin here, not with a person.
  - from: orchestration
    to: state
    path: primary
    bidir: true
    note: >
      Steps journal their results and read shared state back as context — the replay and
      persistence surface.
  - from: orchestration
    to: subagents
    path: primary
    bidir: true
    route: hv
    label: delegate / results
    note: >
      Work lands with a narrowed slice of the supervisor's authority; results return as model
      output another agent will read as input.
  - from: subagents
    to: gateway
    path: primary
    bidir: true
    route: hv
    note: Every model and tool call the subagents make leaves through here. There is no side door.
  - from: orchestration
    to: gateway
    path: primary
    bidir: true
    note: >
      The supervisor's own planning calls take the same door as its specialists' — brokered,
      limited and logged per call, with no side door for anyone.
  - from: subagents
    to: state
    path: primary
    bidir: true
    note: >
      Specialists journal their steps and read shared memory back as context — the same
      persistence surface as the supervisor's, and the same secrets sink.
  - from: gateway
    to: provider
    path: primary
    bidir: true
    route: vh
    note: Inference on brokered credentials, with limits and logging applied per call.
  - from: gateway
    to: tools
    path: primary
    bidir: true
    note: Tool calls carry the narrowed, per-step grant — not the supervisor's authority.
  - from: tools
    to: downstream
    path: external
    bidir: true
    note: >
      Actions land on real systems; whatever comes back — records, pages, API responses — is
      untrusted content entering agent context.
  - from: governance
    to: tools
    path: governance
    label: admission
    note: Tools and servers exist here only if the registry admitted them.
  - from: governance
    to: provider
    path: governance
    label: evaluation
    note: Model and prompt changes pass an evaluation gate before they serve traffic.

pins:
  risks:
    - risk: riskPromptInjection
      at: tools->downstream
      note: >
        Records, documents and API responses read over the process's lifetime are chances to
        steer an agent whose output another agent will trust.
    - risk: riskInsecureModelOutput
      at: orchestration->subagents
      note: Inter-agent messages are model output landing in another agent's context as instruction.
    - risk: riskAgenticDelegationConfusedDeputy
      at: orchestration->subagents
      note: A subagent that inherits its parent's full authority is privilege distribution, not delegation.
    - risk: riskSensitiveDataDisclosure
      at: orchestration->state
      note: The journal records everything a step returns. A returned secret is a persisted one.
    - risk: riskSensitiveDataDisclosure
      at: subagents->state
      note: >
        Specialists journal too — every subagent's steps persist to the same store, so the
        secrets-sink risk multiplies with the agent count.
    - risk: riskRogueActions
      at: tools->downstream
      note: >
        Consequential writes with no human present — and replay can execute a non-idempotent one
        twice.
    - risk: riskRunawayAgentToolLoops
      at: gateway
      note: An unbounded loop between agents burns budget for as long as nobody notices.
    - risk: riskEconomicDenialOfWallet
      at: gateway->provider
      note: Inference called many times across days of process is a spend surface worth a brake.
    - risk: riskToolRegistryTampering
      at: governance->tools
      note: The admission list is the tool supply chain; whoever writes it programs the agents.

  capabilities:
    - capability: capabilityIga
      at: initiator->orchestration
      note: The user's identity and a delegated grant scoped to this request, not a standing power.
    - capability: capabilityNhiManagement
      at: orchestration
      note: A workload identity for the supervisor, distinct from any user, so the chain starts attributable.
    - capability: capabilityNhiManagement
      at: subagents
      note: >
        A workload identity per specialist — not the supervisor's shared one — so every step in
        the chain is attributable and separately revocable.
    - capability: capabilitySecretsManagement
      at: gateway
      note: Credentials brokered at step time, short-lived and scoped; agents hold none.
    - capability: capabilityAgentRuntimeEnforcement
      at: gateway
      note: A policy decision on every tool call — agent, tool, arguments — outside the loop.
    - capability: capabilityToolPermissionScoping
      at: gateway->tools
      note: Each delegation hop carries a narrower grant than its parent.
    - capability: capabilityRateLimiting
      at: gateway->provider
      note: Rate and budget ceilings that end loops the agents cannot end themselves.
    - capability: capabilityPromptInjectionDefense
      at: tools->downstream
      note: Returned content is classified before it re-enters any agent's context.
    - capability: capabilityAiDlp
      at: orchestration->state
      note: Redaction on what steps may journal, because the journal outlives the process.
    - capability: capabilityAiDlp
      at: subagents->state
      note: The same redaction on the specialists' journaling path — every writer to the journal is in scope.
    - capability: capabilityHitlControls
      at: tools->downstream
      note: An approval gate on consequential writes, sized to the blast radius.
    - capability: capabilityAgentRegistry
      at: governance->tools
      note: Admission for agents and tools — nothing runs or is offered by default.
    - capability: capabilityAuditLogging
      at: governance
      note: An append-only trail that can reconstruct who delegated what to whom.
    - capability: capabilityKillSwitch
      at: governance
      note: A stop that works mid-flight, because these processes run for days.

scenarios:
  - title: A user asks the agent to act
    steps:
      - follow: initiator->orchestration
        note: >
          The request arrives authenticated with a scoped grant; the supervisor decomposes the
          goal into work for specialists.
      - follow: orchestration->subagents
        note: Each specialist takes its task with a narrowed grant, not the supervisor's authority.
      - follow: subagents->gateway
        note: Every call the agents make funnels through the one door.
      - follow: gateway->provider
        note: Inference on brokered credentials, limits applied.
      - follow: gateway->tools
        note: Tool calls carry the narrowed per-step grant.
      - follow: tools->downstream
        note: The write lands — behind an approval gate when it is consequential.
      - follow: orchestration->initiator
        note: The result returns, possibly days after the request.
  - title: A step replays after a crash
    steps:
      - follow: state->orchestration
        note: The engine rebuilds state from the journal — including anything a step persisted.
      - follow: orchestration->subagents
        note: Replayed steps land on their specialists again.
      - follow: subagents->gateway
        note: Replayed steps re-request credentials; nothing survives from the first run.
      - follow: gateway->tools
        note: Idempotency fencing decides whether the side effect may run again.
      - follow: tools->downstream
        note: Without fencing, the payment executes twice. The journal replays; the world does not.
  - title: An event fires days into the process
    steps:
      - follow: events->orchestration
        note: >
          A timer or webhook resumes work with nobody watching — the waiting step wakes days
          after the request that started the process.
      - follow: orchestration->subagents
        note: Delegation re-narrows — the waking specialist gets its slice, not the initiator's.
      - follow: subagents->gateway
        note: Credentials are fetched now — the ones from day one would be stale authority.
      - follow: gateway->tools
        note: The action proceeds under the same per-call policy as an attended run.

deviations:
  - subject: Subagents are drawn as one block
    reason: >
      There are several, with different contexts and tools. They share one block because the
      risks — inherited authority, message propagation, chain opacity — are properties of the
      delegation pattern rather than of any particular specialist; each specialist individually
      is the single agent workflow, one level down.
  - subject: Two of this architecture's risks have no CoSAI equivalent
    reason: >
      OWASP's agentic taxonomy names memory poisoning and cascading hallucination as distinct
      threats; CoSAI's risk set has neither. They are pinned here as prompt injection and insecure
      model output, the nearest true statements, which lose the compounding that makes both
      dangerous in a multi-agent system. Recorded rather than papered over.

