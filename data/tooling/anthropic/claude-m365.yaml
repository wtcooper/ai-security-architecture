          pivot.claude.ai and the model endpoint are ordinary HTTPS from the Office webview;
          tenant-restriction header and IP allowlisting apply to claude.ai traffic
        steps: &a1
          - title: Keep add-in traffic in the corporate tenant
            body:
              - Inject anthropic-allowed-org-ids at the proxy for claude.ai and api.anthropic.com so the add-in cannot
                sign in to a personal organisation.
            url: >-
              https://support.claude.com/en/articles/13198485-enforce-network-level-access-control-with-tenant-restrictions
        note: >-
          The add-in itself offers nothing; the vendor-side tenant restriction is credited on the Claude chat
          entity, and the proxy that enforces the header is the organisation's SSE. Confirm the Office webview
          honours the proxy before relying on it.
