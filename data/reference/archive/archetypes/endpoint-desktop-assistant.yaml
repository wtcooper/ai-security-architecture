id: archDesktopAssistant
surface: surfaceEndpoint
title: Desktop assistant with computer use
abbrev: Desktop assistant

summary:
  - >
    A consumer-shaped desktop application that can read local files and drive the graphical
    interface — moving the pointer, typing, and clicking through applications that have no API and
    no concept of an agent operating them.

description:
  - >
    Computer use is the distinguishing capability and the distinguishing problem. When an agent
    acts through the GUI it inherits every application already open and signed in, and it does so
    through an interface built entirely on the assumption that a human is driving. There is no
    authorization decision available at the point of action: the application receives a click.
  - >
    This makes the archetype's authority impossible to scope with the usual tools. Tool permission
    scoping works when tools are named and enumerable; here the tool is "the screen", and the set
    of reachable actions is the set of things a person at that desk could do. The controls that
    remain are all about containment — running computer use inside a virtual machine with its own
    filesystem and its own signed-in accounts — and about the approval gate.
  - >
    The input side is broad in a way the coding-agent archetype is not. A desktop assistant reads
    whatever the user points it at: documents, spreadsheets, screenshots, mail. Any of those may
    have been authored by someone else, and a screenshot in particular carries text the extraction
    step has no reliable way to classify. Screen content is model input with no provenance at all.
  - >
    Connectors are the third axis. Desktop assistants increasingly hold standing grants into
    calendars, mail and file storage, authorised once through an OAuth flow the user completed in a
    moment of enthusiasm. Those grants outlive the task and are not scoped to it, which puts this
    archetype's real reach well beyond the machine it runs on.

distinguishedBy:
  - >
    Against the agentic browser: that one's authority is a cookie jar and its input is a web page.
    This one's authority includes the local filesystem and every open desktop application, and its
    input includes screenshots — where an injection can be a picture of text.
  - >
    Against the coding agent: same vendor discipline around credentials and updates, but no working
    directory to scope to and no repository to blame. The coding agent's blast radius is a project;
    this one's is a desktop.

exemplars:
  - name: Desktop assistants with a computer-use mode
    note: >
      A consumer application with local file access and an opt-in mode that drives the GUI, usually
      inside a contained virtual desktop rather than the user's own session.
    asOf: "2026-08"
  - name: OS-integrated assistants
    note: >
      Assistants shipped with the operating system, holding read access across local content and
      increasingly the ability to act in first-party applications.
    asOf: "2026-08"

zones:
  - id: outside
    type: outsideWorld
    personas: []
    note: The user, and the documents and screens they point the assistant at.

  - id: device
    type: device
    personas: [personaEndUser]
    note: The assistant process, local files, and the user's own signed-in desktop session.

  - id: vm
    type: sandbox
    personas: [personaEndUser, personaAgenticProvider]
    note: >
      A separate virtual desktop with its own filesystem and accounts, where computer use runs when
      the product offers it. The difference between a bounded blast radius and an unbounded one.

  - id: connected
    type: network
    personas: [personaEndUser, personaDataProvider]
    note: >
      Mail, calendar and storage the assistant holds standing OAuth grants into. Shared ownership
      because those grants are issued and revocable by each service, not by this device.

  - id: vendor
    type: vendorOpaque
    personas: [personaAgenticProvider, personaModelProvider]
    note: Inference, and the connector broker behind the OAuth grants.

  - id: governance
    type: management
    personas: [personaGovernance]
    note: Device management, and whatever the vendor's administrative console exposes.

nodes:
  - id: user
    type: humanUser
    zone: outside
    label: User
    note: Grants access, sets the task, and approves the actions the product decides to ask about.

  - id: documents
    type: untrustedSource
    zone: outside
    label: Documents and screen content
    note: >
      Files, mail, spreadsheets and screenshots. A screenshot carries text with no provenance at
      all, which makes it the hardest input on this diagram to filter.
    risks: [riskPromptInjection, riskModelEvasion]
    capabilities: [capabilityPromptInjectionDefense, capabilityAiDlp]

  - id: assistantApp
    type: appUi
    zone: device
    label: Assistant application
    note: The window the user talks to, and where approvals appear.
    capabilities: [capabilityHitlControls, capabilityEdr]

  - id: agentLoop
    type: reasoningCore
    zone: device
    label: Agent loop
    note: Reads content, plans, and issues file operations or screen actions.
    risks: [riskRogueActions, riskPromptInjection]
    capabilities: [capabilityAgentRuntimeEnforcement, capabilityAgentObservability]

  - id: localFiles
    type: tool
    zone: device
    label: Local file access
    note: >
      Read and often write across the user's documents. Scoped by folder selection, which is a
      preference rather than an enforced boundary.
    risks: [riskSensitiveDataDisclosure, riskExcessiveDataHandling]
    capabilities: [capabilityToolPermissionScoping, capabilityAiDlp, capabilityEdr]

  - id: approval
    type: hitlGate
    zone: device
    label: Action approval
    note: >
      The only authorization point available for GUI actions, because the applications being driven
      have none. Its coverage is a product decision.
    risks: [riskRogueActions, riskAgenticDelegationConfusedDeputy]
    capabilities: [capabilityHitlControls]

  - id: egress
    type: egressProxy
    zone: device
    label: Egress control
    note: Where an exfiltration attempt is still stoppable after everything upstream has failed.
    risks: [riskSensitiveDataDisclosure, riskCovertChannelsInModelOutputs]
    capabilities: [capabilityEgressControl, capabilitySse, capabilityAiDlp]

  - id: computerUse
    type: browserRuntime
    zone: vm
    label: Screen and input control
    note: >
      Pointer, keyboard and screen capture. The tool that cannot be enumerated, because its
      reachable action set is everything visible.
    risks: [riskRogueActions, riskAgenticDelegationConfusedDeputy]
    capabilities: [capabilityAgentSandboxing, capabilityHitlControls]

  - id: vmFiles
    type: memoryStore
    zone: vm
    label: Contained workspace
    note: >
      Files and sessions inside the container. What the agent can reach when containment is on, and
      the reason containment is the archetype's primary control.
    risks: [riskSensitiveDataDisclosure]
    capabilities: [capabilityAgentSandboxing, capabilityCredentialIsolation]

  - id: connectors
    type: connector
    zone: connected
    label: Connected services
    note: >
      Standing grants into mail, calendar and storage. Authorised once, scoped to a service rather
      than a task, and outliving the conversation that prompted them.
    risks: [riskExcessiveDataHandling, riskCrossTenantCredentialPropagation, riskSensitiveDataDisclosure]
    capabilities: [capabilityIga, capabilityNhiManagement, capabilityRagSecurity]

  - id: modelApi
    type: inferenceEndpoint
    zone: vendor
    label: Inference API
    note: Receives document text and screenshots. The published interface; nothing behind it is drawn.
    risks: [riskExcessiveDataHandlingDuringInference]
    capabilities: [capabilityAiGateway, capabilityTransportSecurity]

  - id: mdm
    type: policyEngine
    zone: governance
    label: Device management
    note: >
      Whether the application may be installed, whether computer use may be enabled, and which
      folders it may reach.
    risks: [riskShadowAndUnknownAgents]
    capabilities: [capabilityAiGovernancePlatform, capabilityShadowAiDiscovery, capabilityEdr]

  - id: audit
    type: auditSink
    zone: governance
    label: Audit and detection
    note: >
      Endpoint telemetry plus whatever the vendor exports. Screen actions are the hardest thing on
      this diagram to reconstruct after the fact.
    risks: [riskShadowAndUnknownAgents]
    capabilities: [capabilityAuditLogging, capabilityAiDetectionResponse, capabilityEdr]

edges:
  - from: user
    to: assistantApp
    label: task and consent
    control:
      kind: delegatedGrant
      note: >
        The consent that matters is granted once, in a dialog, and covers every future turn. It is
        the broadest authorization decision in the archetype and the least deliberated.
    risks: [riskExcessiveDataHandling]

  - from: documents
    to: localFiles
    label: content read
    control:
      kind: contentInspection
      note: >
        Documents and screen captures are classified on the way in. Screenshot text has no
        provenance at all, which is the hardest input on this diagram to filter.
    risks: [riskPromptInjection]

  - from: assistantApp
    to: agentLoop
    label: turn

  - from: localFiles
    to: agentLoop
    label: file context
    risks: [riskPromptInjection, riskSensitiveDataDisclosure]

  - from: agentLoop
    to: egress
    label: outbound

  - from: egress
    to: modelApi
    label: inference request
    control:
      kind: brokeredCredential
      note: Carries documents and screenshots, which is usually more than the user pictured.
    risks: [riskExcessiveDataHandlingDuringInference, riskSensitiveDataDisclosure]

  - from: modelApi
    to: agentLoop
    label: completion
    control:
      kind: transport
      note: The response drives a click on a real application. Its content is not authenticated.
    risks: [riskInsecureModelOutput]

  - from: agentLoop
    to: approval
    label: proposed action
    risks: [riskRogueActions]

  - from: approval
    to: computerUse
    label: approved screen action
    control:
      kind: isolation
      note: >
        Where computer use runs uncontained, this edge crosses into the user's own desktop instead
        and the boundary disappears entirely — leaving the approval prompt as the sole control.
    risks: [riskRogueActions]

  - from: computerUse
    to: vmFiles
    label: reads and writes

  - from: agentLoop
    to: connectors
    label: connector call
    control:
      kind: delegatedGrant
      note: >
        Scoped to a service, not to a task or a turn. The grant that lets the assistant read one
        calendar invite lets it read the whole calendar, on every subsequent turn.
    risks: [riskExcessiveDataHandling, riskCrossTenantCredentialPropagation]

  - from: connectors
    to: agentLoop
    label: retrieved content
    control:
      kind: transport
      note: >
        Mail and documents from connected services re-enter context. This is the same indirect
        injection path as retrieval, arriving through a grant the user forgot they gave.
    risks: [riskPromptInjection, riskSensitiveDataDisclosure]

  - from: mdm
    to: assistantApp
    label: install and feature policy
    kind: control
    control:
      kind: tenantConfiguration
      note: >
        The only control here that does not depend on the assistant or the vendor behaving as
        described.
    risks: [riskShadowAndUnknownAgents]

  - from: agentLoop
    to: audit
    label: telemetry
    kind: control
    control:
      kind: auditTrail
      note: >
        Two partial views. Neither reliably reconstructs a sequence of screen actions, which is the
        archetype's weakest point for investigation.
    risks: [riskShadowAndUnknownAgents]

crossCutting:
  - risk: riskRogueActions
    note: >
      Driving a GUI means acting through interfaces with no authorization model. There is no node
      to attach the control to, because the applications being driven cannot tell an agent from a
      person — which is why containment rather than permission is the answer here.
  - risk: riskPromptInjection
    note: >
      Three unrelated inputs — local documents, screen pixels and connector content — reach the
      same context window, and the screenshot path has no provenance at all.
  - risk: riskExcessiveDataHandling
    note: >
      Standing connector grants plus broad local file access. Each was consented to individually;
      the reach is their union, and nobody consented to that.

risks:
  - riskRogueActions
  - riskPromptInjection
  - riskSensitiveDataDisclosure
  - riskExcessiveDataHandling
  - riskAgenticDelegationConfusedDeputy
  - riskCrossTenantCredentialPropagation
  - riskShadowAndUnknownAgents
  - riskModelEvasion
  - riskInsecureModelOutput
  - riskExcessiveDataHandlingDuringInference
  - riskCovertChannelsInModelOutputs

capabilities:
  - capabilityAgentSandboxing
  - capabilityHitlControls
  - capabilityEdr
  - capabilityToolPermissionScoping
  - capabilityAiDlp
  - capabilityEgressControl
  - capabilityCredentialIsolation
  - capabilityIga
  - capabilityNhiManagement
  - capabilityPromptInjectionDefense
  - capabilityAgentRuntimeEnforcement
  - capabilityAgentObservability
  - capabilityAuditLogging
  - capabilityAiDetectionResponse
  - capabilityShadowAiDiscovery
  - capabilityAiGovernancePlatform
  - capabilitySse
  - capabilityRagSecurity
  - capabilityAiGateway
  - capabilityTransportSecurity

deviations:
  - subject: Screen and input control uses the browser-runtime node type
    reason: >
      The vocabulary has no computer-use type, and the browser runtime is the closest honest match:
      a driven interface carrying the user's existing authority, where every rendered surface is
      both input and action space. A dedicated type would be warranted if a second archetype needed
      it, and one does not yet.
  - subject: The contained desktop is drawn as a zone even where products run uncontained
    reason: >
      Containment is the archetype's primary control and the products that offer it make it the
      default. Drawing it always would overstate the field; omitting it would leave the strongest
      mitigation off the diagram. It is drawn, and the edge into it says what happens without it.
  - subject: Connected accounts are a zone rather than nodes inside the vendor boundary
    reason: >
      The grants are held by third-party services that are not the model vendor, and their
      revocation is controlled by neither the user's device nor the assistant. A separate zone with
      shared ownership is the only accurate placement.

sources:
  - title: "OWASP Securing Agentic Applications Guide 1.0 — computer use and desktop agents"
    url: https://genai.owasp.org/resource/securing-agentic-applications-guide-1-0/
  - title: "OWASP Top 10 for Agentic Applications 2026 — ASI03 identity and privilege abuse"
    url: https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/
  - title: "Five Eyes joint guidance — careful adoption of agentic AI services"
    url: https://www.ncsc.govt.nz/assets/guidance/Documents/Careful-adoption-of-agentic-AI-services_FINAL.pdf
  - title: "NIST AI 600-1 — generative AI profile, information security actions"
    url: https://www.nist.gov/itl/ai-risk-management-framework
