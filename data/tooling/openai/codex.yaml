              mechanism: "[otel] OTLP export from the client and the workspace Compliance API"
              note: >-
                The Compliance API keeps records 30 days; Work Local warns that not every local file
                operation, screenshot or browser action appears there. OTel is opt-in per client.
              steps:
                - title: Export client events
                  body:
                    - Set [otel] exporter = "otlp-http" or "otlp-grpc" with your endpoint; log_user_prompt
                      defaults to false (redacted).
                  url: https://learn.chatgpt.com/docs/config-file/config-advanced
                - title: Pull workspace records
                  body:
                    - Use the Compliance API with COMPLIANCE_API_KEY; the Admin API reference is the source of
                      truth for event coverage and retention.
                  url: https://learn.chatgpt.com/docs/enterprise/compliance-api
              verified: 2026-09-10
      - mitigation: cap-agent-kill-switch
        coverage: partial
        mechanism: >-
          Codex Local role permission, access-token and service-account revocation, and allow_remote_control =
          false in requirements.toml
        steps:
          - title: Turn local Codex off for the affected roles
            body:
              - In Workspace settings > Permissions & roles set "Allow members to use Codex locally" (or "Allow members
                to use Codex and Work Locally") to Off; an explicit Off in any role wins.
            url: https://learn.chatgpt.com/docs/enterprise/roles-and-workspace-permissions
          - title: Revoke automation credentials
            body:
              - Revoke tokens at chatgpt.com/admin/access-tokens; removing local permission only suspends them, while
                disabling or deleting a service account revokes all of its tokens.
            url: https://learn.chatgpt.com/docs/enterprise/access-tokens
          - title: Cut phone steering
            body:
              - Set allow_remote_control = false in requirements.toml to disable device remote control.
            url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
        note: >-
          Partial: every lever blocks new access rather than stopping a session in progress. Custom-role changes take
          about five minutes to appear and revoked tokens can no longer start new authenticated runs; whether a
          running local session stops is not documented, so the delay for active work is not documented and the
          operator or EDR kills the process. Requirement changes load at the next client start (a background refresh
          doesn't replace the loaded policy, MDM is read at launch), and the admin FAQ says managed configuration
          isn't an access-revocation mechanism. The vendor's asynchronous safety monitoring can pause a task but is
          not an admin action.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityKillSwitch
          reviewRequired: false
          original:
            - capability: capabilityKillSwitch
              coverage: partial
              mechanism: Role permission off, token revocation, service-account disable, federation rule disable
              steps:
                - title: Turn the surface off
                  body:
                    - Set "Allow members to use Codex locally" (or the combined Codex and Work Locally toggle) to Off for the
                      affected roles.
                  url: https://learn.chatgpt.com/docs/enterprise/admin-setup
                - title: Revoke automation credentials
                  body:
                    - Owners and admins revoke any workspace access token; disabling a service account revokes all of its
                      tokens.
                  url: https://learn.chatgpt.com/docs/enterprise/access-tokens
              note: >-
                The role toggle and token revocation block future access; a running local process and the
                commands inside its sandbox are not stopped remotely — the operator stops the process. A
                cloud-managed requirements bundle is re-fetched on its own schedule, so treat that interval as
                the cessation delay.
              verified: 2026-09-10
      - mitigation: D3-PA
        coverage: external
        mechanism: >-
          EDR on the endpoint; Codex exposes process identity (sandbox-exec, bwrap, dedicated Windows sandbox users)
          and OTel tool events for correlation
        evidence:
          - title: Agent approvals & security — sandbox-exec on macOS, bwrap on Linux, OTel event catalogue (2026-09-25)
            url: https://learn.chatgpt.com/docs/agent-approvals-security
          - title: Windows sandbox — elevated mode runs commands as dedicated lower-privilege sandbox users (2026-09-25)
            url: https://learn.chatgpt.com/docs/windows/windows-sandbox
          - title: Configuration Reference — log_dir enforceable in requirements.toml (2026-09-25)
            url: https://learn.chatgpt.com/docs/config-file/config-reference
        note: >-
          External: Codex does not analyse process behaviour; the organisation's EDR does. Integration points: agent
          commands run as children of the Codex process under sandbox-exec on macOS and bwrap on Linux, the elevated
          native Windows sandbox runs them as dedicated lower-privilege sandbox users, OTel codex.tool_decision and
          codex.tool_result events can be joined to EDR telemetry, log_dir can be enforced in requirements.toml, and a
          managed PreToolUse hook can log each command. Detections worth writing from the advisories: batch or
          executable files created in project roots (the web.run node.bat chain), Docker-socket use from the agent,
          and non-admin writes under %ProgramData%\OpenAI\Codex (pre-create and ACL it; Cymulate, 2026-08, no Codex
          CVE).
        verified: "2026-09-25"
        migration:
          from:
            - capabilityEdr
          reviewRequired: false
          original:
            - capability: capabilityEdr
              coverage: external
              mechanism: EDR rules around the runtime; no vendor hook for endpoint security products
              note: >-
                Watch for batch or executable files created in project roots (web.run node.bat chain),
                Docker-socket use from the agent, and non-admin writes under %ProgramData%\OpenAI\Codex;
                pre-create and ACL that directory (Cymulate ProgramData config-trust report, 2026-08; no Codex
                CVE assigned).
              evidence:
                - title: Vendor docs index, reviewed for the integration point (2026-09-10)
                  url: https://learn.chatgpt.com/docs
              verified: 2026-09-10
      - mitigation: cap-agent-egress-control
        coverage: partial
        mechanism: >-
          requirements.toml [experimental_network] (enabled, managed_allowed_domains_only, domains) over sandboxed
          commands, with command network off by default
        steps:
          - title: Enforce a managed domain allowlist
            body:
              - Set [experimental_network] enabled = true and managed_allowed_domains_only = true with
                [experimental_network.domains] "allow" and "deny" entries; deny wins.
            url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
          - title: Keep command network off where it isn't needed
            body:
              - sandbox_workspace_write.network_access defaults to false; the managed proxy never grants network a
                sandbox keeps off.
            url: https://learn.chatgpt.com/docs/config-file/config-reference
          - title: Close the paths the proxy doesn't see
            body:
              - Use allowed_web_search_modes, features.apps = false, the [mcp_servers] allowlist and [browser_use]
                origin policies for web search, connectors, MCP servers and the browser.
            url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
        note: >-
          Partial: the admin-owned allowlist is enforced on commands inside the sandbox, but the vendor marks
          [experimental_network] experimental, says not to enable it broadly without validation, and calls Windows
          support limited; DNS-rebinding protection is best effort. It does not filter web search, apps and
          connectors, MCP server connections, native-app traffic from Computer Use, or Codex's own model and
          service requests; browser tools check managed denies separately. An endpoint firewall or SSE policy covers
          the rest.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityEgressControl
          reviewRequired: false
          original:
            - capability: capabilityEgressControl
              coverage: partial
              mechanism: >-
                [experimental_network] managed_allowed_domains_only and sandbox_workspace_write.network_access
              note: >-
                Domain rules apply to command proxying inside the sandbox, not to browser tools, web search or
                MCP servers; those need a network-layer control.
              steps:
                - title: Allowlist domains for sandboxed commands
                  body:
                    - In requirements.toml set [experimental_network] allowed and denied domains with
                      managed_allowed_domains_only = true.
                  url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
                - title: Keep network off by default
                  body:
                    - sandbox_workspace_write.network_access = false is the default; features.network_proxy adds allow/deny
                      domain maps when it is on.
                  url: https://learn.chatgpt.com/docs/config-file/config-reference
              verified: 2026-09-10
      - mitigation: D3-FA
        coverage: external
        mechanism: >-
          Package mirror or artifact repository with malware scanning; Codex's integration point is the
          [experimental_network.domains] allowlist that forces sandboxed installs through the mirror
        evidence:
          - title: Managed configuration — [experimental_network] domains and [marketplaces] allowed_sources (2026-09-25)
            url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
          - title: Plugin management — marketplace import pinned to a branch, tag or commit, no scanning (2026-09-25)
            url: https://learn.chatgpt.com/docs/enterprise/plugin-management
          - title: Configuration Reference — features.skill_mcp_dependency_install on by default (2026-09-25)
            url: https://learn.chatgpt.com/docs/config-file/config-reference
        note: >-
          External: Codex scans nothing it downloads or installs — plugins, skills, MCP dependencies installed for
          skills (features.skill_mcp_dependency_install, on by default) or packages its commands fetch. Admission
          scanning belongs at the organisation's package mirror; the integration point is an
          [experimental_network.domains] allowlist that admits only the mirror for sandboxed commands, with registry
          variables set through shell_environment_policy as a managed default. [marketplaces] allowed_sources pins
          plugin Git sources and refs, which is admission, not file analysis. No model weights load in Codex;
          inference is remote unless a user points model_provider at a local server, which loads them itself.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityModelScanning
            - capabilityAiBom
          reviewRequired: false
          original:
            - capability: capabilityModelScanning
              coverage: notApplicable
              mechanism: Not applicable
              note: >-
                No model artifacts are loaded by the product; inference is remote. model_provider can point at
                a local server (ollama, lmstudio) — that server, not Codex, loads the weights, and scanning
                them is the obligation of whoever runs it.
              evidence:
