            url: https://geminicli.com/docs/cli/sandbox/
        note: >-
          External: Gemini CLI does no process analysis of its own; EDR is the product class. EDR sees the node
          process running the npm package @google/gemini-cli (binary gemini), the shells it spawns for
          run_shell_command, stdio MCP server processes and, when sandboxed, the docker or podman container from
          ghcr.io/google/gemini-cli or the sandbox-exec wrapper. There is no processWrapper or launcher key; the
          enterprise page's wrapper script on PATH is the nearest launcher point. Correlate EDR events with the
          OTel gemini_cli.tool_call records (command text in function_args, session.id, user.email). A
          hooks.BeforeTool command can call a local EDR agent and deny on its verdict, an attach point that the
          user can disable.
