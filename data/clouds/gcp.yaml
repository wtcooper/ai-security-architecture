  - id: modelArmorDocumentScreening
    name: "Document screening (Model Armor sanitizeUserPrompt with byteItem)"
    where: "Your intake service › Model Armor sanitizeUserPrompt on each request, and on each upload as byteItem with its byteDataType (PLAINTEXT_UTF8, PDF, WORD_DOCUMENT, EXCEL_DOCUMENT, POWERPOINT_DOCUMENT, TXT, CSV, or IMAGE for JPEG, PNG and BMP)"
    setVia: [code]
    area: tools
    default: "Not called"
    recommended: "Screen every request and upload with a template whose prompt injection and jailbreak and malicious URL filters block. Refuse uploads Model Armor cannot scan: files over 4 MB are skipped, and other formats are not supported."
    value: "Every request and file screened; unscannable refused"
    why: "A file anyone wrote can carry instructions for the agent; screening it before it becomes the spec stops known attacks, and refusing what cannot be scanned closes the gap."
    mitigations: [cap-input-guardrails]
    url: https://docs.cloud.google.com/model-armor/sanitize-prompts-responses
    verified: "2026-11-21"
  - id: factoryLogSink
    name: "Aggregated sink (folder) with Data Access audit logs"
    where: "Cloud Logging › factory and apps folders › aggregated sink to a locked log bucket in a logging project; IAM & Admin › Audit Logs › Data Access for Secure Source Manager and the other factory services that write them"
    setVia: [cloudPolicy, apiCli]
    area: audit
    default: "Data Access logs off for most services; logs per project"
    recommended: "One sink from both folders to a locked bucket, with those Data Access logs on, and the app ID as a label or annotation on every project, job, release and rollout so one query joins request, build, checks, approval and release."
    value: "Both folders to one locked bucket, keyed by app ID"
    why: "When an app misbehaves you can show who asked for it, what the agent pushed, what the checks found, who approved and which release ran."
    mitigations: [cap-agent-tracing]
    url: https://docs.cloud.google.com/logging/docs/export/aggregated_sinks
    verified: "2026-11-21"
  - id: cloudRunDisableService
    name: "Disable an existing service (manual scaling, 0 instances)"
    where: "Cloud Run › (app service) › Scaling › Manual scaling, 0 instances (gcloud run services update --scaling=0); IAM & Admin › Service accounts › Disable"
    setVia: [adminConsole, apiCli]
    area: audit
    default: "Serving"
    recommended: "A runbook the platform team runs without the owner: scale the service to zero, remove its traffic tags (revisions served only through tags keep serving), disable the app's service account and add a deploy policy that blocks rollouts."
    value: "Scale to 0, drop tags, disable the account"
    why: "Requests to a disabled service fail at once, and a disabled service account stops its calls to Google APIs and connectors, all without waiting for a release."
    mitigations: [cap-agent-kill-switch]
    url: https://docs.cloud.google.com/run/docs/managing/services
    verified: "2026-11-21"
  - id: appHubRegistry
    name: "App Hub application with attributes (owners, environment, criticality)"
    where: "App Hub › apps folder boundary › one application per generated app; Resource Manager › a tag on the app's project for its end date"
    setVia: [apiCli, cloudPolicy]
    area: audit
    recommended: "Register each app with its owner in business_owners, the requester in developer_owners and the platform team in operator_owners. Tag the project with an end date, and have a scheduled job shut it down after that date unless the owner renews."
    value: "Every app registered with owner and end date"
    why: "The registry says whom to call, and the end date retires apps nobody renews. A shut-down project can be restored for 30 days."
    mitigations: [D3-AI, AML.M0043]
    url: https://docs.cloud.google.com/app-hub/docs/overview
    verified: "2026-11-21"
  - id: aiProtectionDiscovery
    name: "AI Protection AI inventory (Security Command Center)"
    where: "Security Command Center › AI Security dashboard and Assets › AI resources, organisation-level activation; Cloud Asset Inventory searches for Cloud Run services outside the apps folder"
    setVia: [adminConsole, cloudPolicy]
    area: audit
    requires: "Premium tier for AI Discovery and Gemini model detection"
    recommended: "Activate AI Protection for the organisation and review its inventory, including Model-as-a-Service assets that call models, for anything outside the factory's folders, such as apps published from Google AI Studio. Bring each in or shut it down."
    value: "Organisation-wide; reviewed against the registry"
    why: "An app made in a vendor's tool or a personal project has no owner, no checks and no end date; the inventory finds projects calling models that the factory did not create."
    mitigations: [cap-shadow-ai-discovery]
    url: https://docs.cloud.google.com/security-command-center/docs/ai-protection-overview
    verified: "2026-11-21"
  - id: cloudSqlCmek
    name: "Customer-managed encryption keys (CMEK) for Cloud SQL"
    where: "Cloud SQL › (app's instance, in the app's project) › customer-managed encryption key from a key ring in your key project; private IP from the app's VPC"
    setVia: [cloudPolicy, apiCli]
    area: data
    default: "Google default encryption"
    recommended: "One instance per app, encrypted with a per-app key in your key project and reachable on private IP only, deleted or archived with the app. Backups are encrypted with the instance's key."
    value: "Per-app instance and key; private IP only"
    why: "No other app can reach the store, and the key that protects it, backups included, is yours to disable when the app is retired."
    mitigations: [D3-NI]
    url: https://docs.cloud.google.com/sql/docs/postgres/cmek
    verified: "2026-11-21"
  # <<< software factory rows

implementations:
  - architecture: archChatAgent
    asOf: "2026-10"
    # >>> checked against the vendor's documentation
    verified: "2026-11-18"
    sources:
      entry: https://docs.cloud.google.com/armor/docs/security-policy-overview
      events: https://docs.cloud.google.com/scheduler/docs/overview
      agent: https://docs.cloud.google.com/architecture/single-agent-ai-system-adk-cloud-run
      localTools: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sandbox/code-execution-overview
      memory: https://docs.cloud.google.com/run/docs/ai-agents
      gateway: https://docs.cloud.google.com/apigee/docs/api-platform/get-started/ai-capabilities
      provider: https://docs.cloud.google.com/gemini-enterprise-agent-platform/overview
      internalTools: https://docs.cloud.google.com/apigee/docs/api-platform/apigee-mcp/manage-mcp-tool-access
      openWeb: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/grounding/grounding-with-google-search
      registry: https://docs.cloud.google.com/artifact-registry/docs/repositories/remote-overview
    differences:
      - at: agent->gateway
        text: "ADK sends model calls straight to Gemini with the agent's own service account unless you wrap the model in ApigeeLlm. To force the gateway, point model and MCP addresses at Apigee and remove direct model permission from the agent's account."
        url: https://adk.dev/agents/models/apigee/
      - at: gateway->provider
        text: "Google's reference sends the model call from the agent through Model Armor to Gemini, with no Apigee. Here Apigee calls the model with its own service account, so also turn on Model Armor floor settings to catch calls that bypass Apigee."
        url: https://docs.cloud.google.com/architecture/single-agent-ai-system-adk-cloud-run
      - at: gateway->internalTools
        text: "Google's reference has the agent call MCP servers on Cloud Run directly, protected by IAP and IAM, or through Agent Gateway. To make Apigee the only door, allow only Apigee's service account to invoke the tool services."
        url: https://docs.cloud.google.com/architecture/single-agent-ai-system-adk-cloud-run
      - at: gateway->openWeb
        text: "Grounding with Google Search is a switch inside the model request: Google runs the search, and Apigee never sees or filters the pages. Google's page also says search cannot share one request with function calling, so they need separate model calls."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/grounding/grounding-with-google-search
      - at: localTools
        text: "Code Execution is a separate Agent Platform service with no network, called by API. ADK says the agent's service account needs roles/aiplatform.user for it, the same role that permits direct model calls, which weakens the gateway-only rule unless narrowed."
        url: https://adk.dev/integrations/code-exec-agent-runtime/
      - at: agent
        text: "Apigee is not the network exit. Cloud Run reaches the internet freely unless you send all outbound traffic into the VPC and through Secure Web Proxy with an allow list. Agent Gateway for Cloud Run uses that same proxy and is Limited Preview."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/gateways/agent-gateway-overview
      - at: memory
        text: "ADK's built-in session stores are in-memory, SQL database and Agent Platform Sessions; Firestore needs a session store you write. ADK's confirmation page says confirmations do not work with the database or Agent Platform stores, so test approvals on yours."
        url: https://adk.dev/sessions/session/
      - at: events->agent
        text: "IAP replaces the caller's identity, and Google warns that services using their own authentication may fail behind it. Scheduled and event triggers must call the agent service directly with their own service account, not the IAP-protected front end."
        url: https://docs.cloud.google.com/run/docs/securing/identity-aware-proxy-cloud-run
    alsoNeeded:
      - service: "IAM service accounts"
        role: identity
        why: "Each Cloud Run service, and Apigee's proxies, run as a service account you create and scope."
        url: https://docs.cloud.google.com/apigee/docs/api-platform/security/google-auth/overview
      - service: "VPC network with Direct VPC egress and Secure Web Proxy"
        role: network
        why: "The only way to control where Cloud Run workloads can connect on the internet."
        url: https://docs.cloud.google.com/secure-web-proxy/docs/overview
      - service: "Apigee networking (Private Service Connect or VPC peering)"
        role: network
        why: "Lets agents reach Apigee privately and lets Apigee reach tool services on Cloud Run."
        url: https://docs.cloud.google.com/apigee/docs/api-platform/get-started/networking-options
      - service: "Secret Manager"
        role: secrets
        why: "Google's recommended store for API keys and passwords that Cloud Run services need."
        url: https://docs.cloud.google.com/run/docs/configuring/services/secrets
      - service: "Cloud KMS"
        role: keys
        why: "Customer-managed encryption keys for stored conversations, sessions and logs, where policy requires them."
        url: https://docs.cloud.google.com/kms/docs/cmek
      - service: "Binary Authorization"
        role: registry
        why: "Allows only approved container images to deploy to Cloud Run; Google's reference names it."
        url: https://docs.cloud.google.com/binary-authorization/docs/overview
      - service: "Model Armor templates"
        role: other
        why: "Apigee's prompt policy and the platform floor settings both need a Model Armor template to exist."
        url: https://docs.cloud.google.com/model-armor/model-armor-vertex-integration
      - service: "Cloud Logging and Cloud Trace"
        role: logging
        why: "Cloud Run sends logs here by default; route them onward to your security monitoring."
        url: https://docs.cloud.google.com/logging/docs/overview
      - service: "Regional external Application Load Balancer with Cloud Armor"
        role: ingress
        why: "Fronts the Cloud Run front end once its default address is disabled; filters and rate-limits requests."
        url: https://docs.cloud.google.com/armor/docs/security-policy-overview
      - service: "Identity Platform or Firebase Authentication"
        role: identity
        why: "Signs in users outside the organisation; IAP covers staff only."
        url: https://docs.cloud.google.com/architecture/single-agent-ai-system-adk-cloud-run
    quickstart:
      - title: "Build and deploy an AI agent to Cloud Run using the Agent Development Kit (ADK)"
        url: https://docs.cloud.google.com/run/docs/ai/build-and-deploy-ai-agents/deploy-adk-agent
    # <<< checked
    reference:
      - title: Single-agent AI system using ADK and Cloud Run
        url: https://docs.cloud.google.com/architecture/single-agent-ai-system-adk-cloud-run
      - title: AI gateway capabilities in Apigee
        url: https://docs.cloud.google.com/apigee/docs/api-platform/get-started/ai-capabilities
      - title: Apigee AI Gateway for ADK agents
        url: https://adk.dev/agents/models/apigee/
    summary:
      - >-
        Your own agent on Cloud Run (built with ADK in Google's reference; any framework serves) behind
        an IAP-protected Cloud Run front end, reaching Gemini and its MCP tools through an AI gateway,
        Apigee here, with Model Armor screening the crossing and outbound traffic leaving through Secure
        Web Proxy. Google's reference names Agent Runtime as the alternative home for the agent; that
        managed runtime is the API/SDK managed agent runtime drawing, so this one keeps the loop in your
        code. Agent Gateway, the Agent Platform's own gateway, is in early preview for Cloud Run.
    bindings:
      - { block: entry, service: Cloud Run front end behind Cloud Armor, note: "A regional external Application Load Balancer with Cloud Armor in front, IAP on the service for staff; Identity Platform for users outside the organisation." }
      - block: events
        service: "Cloud Scheduler and Eventarc triggers"
        options:
          - { name: "Cloud Scheduler and Eventarc triggers", kind: commercial, url: "https://docs.cloud.google.com/eventarc/docs/overview", note: "Cron jobs from Cloud Scheduler and event routing from Eventarc start the agent.", packs: [googleCloudNative] }
          - { name: "Pub/Sub push and Cloud Scheduler", kind: commercial, url: "https://docs.cloud.google.com/pubsub/docs/overview", note: "Push subscriptions deliver each message to the agent's endpoint; Cloud Scheduler sends the timed jobs." }
          - { name: "Managed Service for Apache Kafka", kind: commercial, url: "https://docs.cloud.google.com/managed-service-for-apache-kafka/docs/overview", note: "Google-run open-source Kafka clusters, for organisations whose business events already flow through Kafka." }
      - { block: agent, service: Your agent on Cloud Run, builtWith: Agent Development Kit (ADK), note: "Google's reference names Agent Runtime on Gemini Enterprise Agent Platform here as the alternative, the managed runtime." }
      - block: localTools
        service: "Your function tools and Code Execution"
        note: "Tools compiled into the agent run in its container; generated code runs in an Agent Platform Code Execution sandbox."
        options:
          - { name: "Your function tools and Code Execution", kind: commercial, url: "https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sandbox/code-execution-overview", note: "Tools run in the agent's container; generated code runs in an Agent Platform Code Execution sandbox that keeps state up to 14 days.", packs: [googleCloudNative] }
          - { name: "Cloud Run sandboxes", kind: commercial, url: "https://docs.cloud.google.com/run/docs/code-execution", note: "Preview: sandboxes created inside the Cloud Run service or job the agent runs in, for code, sub-agents or a browser." }
          - { name: "Agent Sandbox on GKE with GKE Sandbox", kind: commercial, url: "https://docs.cloud.google.com/kubernetes-engine/docs/concepts/machine-learning/agent-sandbox", note: "A kernel-isolated Pod per agent from the open-source SIG Apps controller, under gVisor or microVMs; you upgrade the controller." }
          - { name: "Agent Sandbox with Kata Containers", kind: open, url: "https://agent-sandbox.sigs.k8s.io/docs/use-cases/examples/kata-gke-sandbox/", note: "The same controller with Kata Containers you install on Ubuntu node pools; Google's support and SLAs do not cover Kata.", packs: [openSourceOnGke] }
          - { name: "Agent Substrate on GKE", kind: commercial, url: "https://docs.cloud.google.com/kubernetes-engine/ai-ml/about-agent-substrate", note: "Google's recommended default for CPU agents: idle sessions suspend and restore in under a second; GKE Standard 1.37+, no GPUs." }
      - block: memory
        service: "Firestore and Agent Search"
        note: "Agent Search was Vertex AI Search. Memory Bank is the managed alternative for long-term memory."
        options:
          - { name: "Firestore and Agent Search", kind: commercial, url: "https://docs.cloud.google.com/firestore/native/docs/overview", note: "Firestore holds conversations through a session store you write; Agent Search (formerly Vertex AI Search) is the index.", packs: [googleCloudNative] }
          - { name: "Agent Platform Sessions and Memory Bank", kind: commercial, url: "https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/memory-bank", note: "Managed session history and long-term memories per user scope; ADK's VertexAiSessionService needs an Agent Runtime resource.", packs: [agentPlatformGovernance] }
          - { name: "Cloud SQL for PostgreSQL or AlloyDB with pgvector", kind: commercial, url: "https://docs.cloud.google.com/sql/docs/postgres/generate-manage-vector-embeddings", note: "ADK's DatabaseSessionService keeps sessions in PostgreSQL; the same managed database can hold embeddings with pgvector." }
          - { name: "Memorystore for Valkey", kind: commercial, url: "https://docs.cloud.google.com/memorystore/docs/valkey/about-vector-search", note: "Managed Valkey for fast session state, with vector search for retrieval." }
          - { name: "PostgreSQL with pgvector on GKE (CloudNativePG)", kind: open, url: "https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/deploy-pgvector", note: "Google's GKE tutorial runs the CloudNativePG operator with pgvector; you operate the cluster.", packs: [openSourceOnGke] }
      - block: gateway
        service: "Apigee (AI gateway)"
        note: "Agent Gateway is the Agent Platform's own gateway: Google-managed for agents on Agent Runtime, early preview for Cloud Run."
        options:
          - { name: "Apigee (AI gateway)", kind: commercial, url: "https://docs.cloud.google.com/apigee/docs/api-platform/get-started/ai-capabilities", note: "Model Armor, LLM token limits, semantic cache and MCP proxies as policies in an Apigee organisation you provision.", packs: [googleCloudNative] }
          - { name: "Agent Gateway with Model Armor", kind: commercial, url: "https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/gateways/agent-gateway-overview", note: "Google's references draw it: Google-managed for Agent Runtime, Preview on GKE, Limited Preview on Cloud Run; token budgets not yet available.", packs: [agentPlatformGovernance] }
          - { name: "LiteLLM Proxy on GKE or Cloud Run", kind: open, url: "https://docs.litellm.ai/docs/proxy/deploy/cloud/gcp", note: "Vertex AI provider, MCP and A2A gateways, keys per team; LiteLLM documents Cloud Run and GKE layouts. JWT sign-in needs Enterprise.", packs: [openSourceOnGke] }
          - { name: "Kong AI Gateway", kind: commercial, url: "https://developer.konghq.com/ai-gateway/ai-providers/gemini/", note: "Calls Gemini on Agent Platform with GCP credentials; AI MCP Proxy (3.12+) and A2A Proxy (3.14+) need AI Gateway Enterprise.", packs: [kongAiGateway] }
          - { name: "agentgateway", kind: open, url: "https://agentgateway.dev/", note: "Linux Foundation project started by Solo.io: one data plane for LLM, MCP and A2A traffic, with Gemini and Vertex providers." }
      - block: provider
        service: "Gemini on Agent Platform"
        note: "Gemini Enterprise Agent Platform, formerly Vertex AI."
        options:
          - { name: "Gemini on Agent Platform", kind: commercial, url: "https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/control-model-access", note: "Gemini on Gemini Enterprise Agent Platform (formerly Vertex AI); an organisation policy limits which Model Garden models are callable.", packs: [googleCloudNative] }
          - { name: "Claude on Agent Platform", kind: commercial, url: "https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/partner-models/claude", note: "Anthropic's models as a managed API on Agent Platform endpoints, a Separate Offering under its own terms." }
          - { name: "Open models as a service (MaaS)", kind: commercial, url: "https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/maas/use-open-models", note: "Serverless open models from Model Garden, for example DeepSeek, Gemma, GLM, gpt-oss and Llama, on Agent Platform endpoints." }
          - { name: "Self-hosted open model on GKE (vLLM)", kind: open, url: "https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/serve-gemma-gpu-vllm", note: "An open-weight model you serve yourself, as the self-hosted inference pattern draws; Google's GKE tutorials use vLLM.", packs: [openSourceOnGke] }
      - block: internalTools
        service: "Your MCP servers on Cloud Run, behind the gateway"
        options:
          - { name: "Your MCP servers on Cloud Run, behind the gateway", kind: commercial, url: "https://docs.cloud.google.com/run/docs/host-mcp-servers", note: "Tool servers you write and host on Cloud Run, which Google documents for MCP, reached only through the gateway.", packs: [googleCloudNative] }
          - { name: "MCP Toolbox for Databases", kind: open, url: "https://mcp-toolbox.dev/", note: "Google's open-source MCP server for AlloyDB, BigQuery, Cloud SQL, Spanner and other databases, with client SDKs and ADK support (release 1.18.0)." }
          - { name: "Google Cloud remote MCP servers", kind: commercial, url: "https://docs.cloud.google.com/mcp/overview", note: "Google-hosted MCP servers for Google and Google Cloud services, governed with IAM; no server for you to run." }
          - { name: "MCP in Apigee (APIs exposed as MCP tools)", kind: commercial, url: "https://docs.cloud.google.com/apigee/docs/api-platform/apigee-mcp/apigee-mcp-overview", note: "Turns APIs already managed in Apigee into MCP tools with OAuth and per-tool policies; on Apigee hybrid from 1.17.0." }
      - { block: orgData, service: Your systems of record, build: true, note: "Cloud SQL, BigQuery, Cloud Storage, Google Drive: whatever the tools act on." }
      - block: openWeb
        service: "Grounding with Google Search"
        note: "Web Grounding for Enterprise where a client contract asks for it."
        options:
          - { name: "Grounding with Google Search", kind: commercial, url: "https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/grounding/grounding-with-google-search", note: "A tool of the Gemini call: Google runs the search and returns grounded answers with links to the sources.", packs: [googleCloudNative] }
          - { name: "Web Grounding for Enterprise", kind: commercial, url: "https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/grounding/web-grounding-enterprise", note: "A subset of Google's web index for regulated industries: no customer data logged, VPC Service Controls supported." }
          - { name: "URL context", kind: commercial, url: "https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/url-context", note: "Gemini retrieves the URLs given in the prompt and uses their content in its answer." }
          - { name: "Grounding with Parallel Web Search", kind: commercial, url: "https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/grounding/grounding-with-parallel", note: "Parallel Web Systems' LLM-optimised web index behind Gemini, a Separate Offering under your Google Cloud agreement." }
          - { name: "Grounding with your search API", kind: commercial, url: "https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/grounding/grounding-with-your-search-api", note: "Gemini queries an external search endpoint you provide, so any search service can ground its answers." }
      - { block: sources, service: "Public registries (PyPI, npm)" }
      - block: registry
        service: "Artifact Registry remote and virtual repos"
        note: "What the agent's image and tool builds install from; the Code Execution sandbox ships a fixed library set and installs nothing."
        options:
          - { name: "Artifact Registry remote and virtual repos", kind: commercial, url: "https://docs.cloud.google.com/artifact-registry/docs/repositories/remote-overview", note: "Remote repositories proxy PyPI, npm, Maven and Docker upstreams; a virtual repository gives builds one address.", packs: [googleCloudNative] }
          - { name: "Assured Open Source Software", kind: commercial, url: "https://docs.cloud.google.com/assured-open-source-software/docs/overview", note: "Google-secured, signed builds of over a thousand popular Java, Go, Python and npm packages, with SBOMs and VEX." }
          - { name: "JFrog Artifactory", kind: commercial, url: "https://jfrog.com/reference-architecture/jfrog-saas/", note: "Package and artefact manager as JFrog SaaS in AWS, Azure and Google Cloud regions, or self-hosted." }
          - { name: "Sonatype Nexus Repository", kind: commercial, url: "https://help.sonatype.com/en/blob-stores.html", note: "Self-hosted repository manager whose blob store can be a Google Cloud Storage bucket." }
    # >>> hosting options (compared against the vendor's pages; one is the mapping itself)
    hosting:
      - id: cloudRun
        kind: runtime
        name: "Cloud Run"
        url: https://docs.cloud.google.com/run/docs/overview/what-is-cloud-run
        asOf: "2026-11"
        mapped: true
        compare:
          runs: "Your code runs the loop in your own container; Cloud Run starts, scales and stops the container instances."
          patching: "Google manages the infrastructure and sandbox; you rebuild your image, unless a service uses a Google buildpacks base image with automatic updates."
          data: "Instances are stateless and run in the region you choose in your project; prompts and state persist only in the stores you connect, such as Firestore."
          network: "Direct VPC egress can route all outbound traffic into your VPC for firewall rules, NAT or a proxy; by default it leaves for the internet from a shared address pool."
          identity: "A service account attached to each service or job, user-managed recommended over the Compute Engine default; Agent Identity is in Preview."
          accepts: "Any language and any agent framework that builds into a container image; Google's page names ADK, Dify, LangGraph and n8n as examples."
          workload: "Service requests end at 5 minutes by default and 60 at most; jobs run tasks for up to 7 days, worker pools pull from queues, and Pub/Sub or schedules trigger services."
          portability: "The agent is a container image, which Google says runs anywhere a container can run; the Cloud Run configuration around it is rewritten for the new host."
          effort: "Your container image, the service's configuration and the data stores it uses; there is no cluster or server infrastructure for you to manage."
          fits: "Google's guidance: when you require container deployment and portability with a balance of flexibility and control, running agents like any other service."
        sources:
          - https://docs.cloud.google.com/run/docs/overview/what-is-cloud-run
          - https://docs.cloud.google.com/run/docs/ai-agents
          - https://docs.cloud.google.com/run/docs/securing/security
          - https://docs.cloud.google.com/run/docs/securing/service-identity
          - https://docs.cloud.google.com/run/docs/ai/agent-platform-features
          - https://docs.cloud.google.com/run/docs/configuring/vpc-direct-vpc
          - https://docs.cloud.google.com/run/docs/configuring/request-timeout
          - https://docs.cloud.google.com/run/docs/configuring/task-timeout
          - https://docs.cloud.google.com/run/docs/configuring/services/automatic-base-image-updates
          - https://docs.cloud.google.com/run/docs/container-contract
          - https://docs.cloud.google.com/run/docs/authenticating/overview
          - https://docs.cloud.google.com/architecture/choose-agentic-ai-architecture-components
      - id: gke
        kind: cluster
        name: "Google Kubernetes Engine (GKE)"
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/kubernetes-engine-overview
        asOf: "2026-11"
        compare:
          runs: "Your code runs the loop in Pods you deploy; GKE schedules those Pods onto the nodes of your cluster."
          patching: "Google patches the control plane and the node OS through auto-upgrades; you keep Standard node pools enrolled, upgrade by hand when delayed, and rebuild your images."
          data: "Prompts and tool results are processed in Pods on nodes in your project and VPC; Pods are ephemeral, so state is kept in the stores or volumes you attach."
          network: "Pods run in your VPC; private nodes, network policies, FQDN network policies and firewall rules limit traffic, but by default Pods talk freely and nodes get external IPs."
          identity: "A Kubernetes ServiceAccount granted IAM roles through Workload Identity Federation for GKE, always on in Autopilot; Agent Identity for GKE is in Preview."
          accepts: "Any language and any framework packaged as a container; ADK documents a GKE deployment and an adk deploy gke command for Python agents."
          workload: "Deployments keep Pods running, CronJobs create Jobs on a schedule, and Pods can pull from Pub/Sub; node auto-upgrades and scale-down can evict running Pods."
          portability: "The agent is a container image plus Kubernetes manifests on a managed implementation of open source Kubernetes; GKE-specific resources and IAM bindings are redone."
          effort: "The cluster's node pools, networking, scaling policies, upgrades and access control, plus your workloads; in Autopilot mode Google manages the nodes."
          fits: "Google's guidance: when you require full control of the infrastructure, your platform team runs Kubernetes, or you already run applications on GKE."
        sources:
          - https://docs.cloud.google.com/kubernetes-engine/docs/concepts/kubernetes-engine-overview
          - https://docs.cloud.google.com/kubernetes-engine/docs/concepts/shared-responsibility
          - https://docs.cloud.google.com/kubernetes-engine/docs/concepts/autopilot-overview
