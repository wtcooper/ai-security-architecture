          additional approval for unattributed Copilot pull requests"; enterprise "Allow Copilot to approve pull
          requests" (Disabled everywhere by default); no per-action approval inside the session
        steps:
          - title: Keep workflow approval on
            body:
              - >-
                Repository Settings > Copilot > Cloud agent > Actions workflow approval: leave Require approval
                for workflow runs enabled so a user with write access must click Approve and run workflows.
            url: >-
              https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/configuring-agent-settings
          - title: Require approvals, including the extra one for unattributed pull requests
            body:
              - >-
                In the branch ruleset's "Require a pull request before merging", require at least one approval
                and leave "Require an additional approval for unattributed Copilot pull requests" on (the
                default).
            url: >-
              https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/available-rules-for-rulesets
          - title: Keep Copilot from approving
            body:
              - >-
                Enterprise > AI controls > Copilot code review > "Allow Copilot to approve pull requests": keep
                Disabled everywhere (the default); organisations otherwise decide "Count Copilot approvals
                toward merge requirements".
            url: >-
              https://docs.github.com/en/copilot/how-tos/copilot-on-github/set-up-copilot/configure-code-review
        note: >-
          Partial by the rule applied to every hosted product: a merge gate approves the output, not the
          actions. Every tool call, MCP call and network request in the session is pre-approved and has already
          happened when the reviewer arrives (a preToolUse "ask" is treated as deny because nobody is there to
          answer). The requester's own approval does not count toward required approvals, and workflows wait for
          a person. The workflow gate is a repository setting a repository administrator can turn off, not
          locked at organisation level. The automation "Full control" level for issue changes is, in GitHub's
          words, a workflow convenience and not a security control. Copilot code review approvals are an AI
          reviewer and never count as human approval here.
