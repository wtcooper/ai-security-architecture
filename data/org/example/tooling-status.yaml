  - tool: toolBedrockAgentcore
    available: false
    note: Not in use. Assessed as a candidate managed agent runtime for the AWS estate; no harness, runtime or gateway
      is approved. Each note below is the baseline the platform team would set before the first workload.
    capabilities:
      EX-D3-MFA:
        status: gap
        note: Not deployed. Baseline is IAM Identity Center MFA on "Every time they sign in (always-on)" and
          aws:MultiFactorAuthPresent in the trust policy of the role holding CreateHarness, UpdateHarness,
          UpdateGateway and credential-provider actions; front-end user MFA stays with the corporate IdP
      EX-AGENT-TOOL-REGISTRY:
        status: gap
        note: Not deployed. Baseline is an organization-scoped AWS Agent Registry with auto-detection of Runtimes
          and Gateways, auto-approval off, and CreateHarness / UpdateHarness / CreateAgentRuntime granted only to
          the delivery pipeline role
      EX-STAGED-ROLLOUT-GATE:
        status: gap
        note: Not deployed. Baseline is a production harness endpoint pinned by targetVersion with rollback by
          UpdateHarnessEndpoint, and a 90/10 A/B test through the gateway with online evaluation before promote;
          promotion stays a human decision because evaluations do not block
      EX-AML-M0008:
        status: gap
        note: Not deployed. Online evaluation configurations (Builtin.GoalSuccessRate, Builtin.ToolSelectionAccuracy)
          would score candidate versions; no adversarial evaluation exists in AgentCore, so red-team tests stay in
          our own pipeline
      EX-D3-AA:
        status: gap
        note: Not deployed. Baseline is one execution role per agent scoped to its own workload identity and
          credential providers, list-workload-identities reviewed monthly, and GetWorkloadAccessTokenForUserId
          denied
      EX-D3-CTS:
        status: gap
        note: Not deployed. Baseline is tools only behind AgentCore Gateway with on-behalf-of outbound credentials,
          customJWTAuthorizer on the harness (SigV4 loses per-user identity), and an SCP on
          bedrock-agentcore:CredentialProviderType; remote_mcp headers not allowed
      EX-AGENT-ACTION-POLICY-ENFORCEMENT:
        status: gap
        note: Not deployed. Baseline is a Cedar policy engine attached in ENFORCE on every gateway, an SCP requiring
          bedrock-agentcore:PolicyEngineMode ENFORCE (to be tested, since one AWS page says no key protects the
          mode), and a before_tool_call Lambda hook with failureMode deny for tools outside the gateway
      EX-AML-M0031:
        status: gap
        note: Not deployed. Baseline is harness memory set to disabled unless a use case needs it, otherwise BYO memory
          with a CMK, /actor/{actorId}/ namespaces, actorId bound to the JWT sub through the Memory connector's Cedar
          policy, and eventExpiryDuration of 30 days
      EX-AI-VENDOR-ASSESSMENT:
        status: gap
        note: AWS is assessed in the TPRM platform for the wider estate, but AgentCore itself has not been reviewed;
          the review would take the Artifact SOC 2 and ISO reports, HIPAA eligibility, cross-region inference for
          Memory and Policy, and any third-party model provider the harness calls
      EX-D3-ORA:
        status: gap
        note: No AgentCore-specific risk assessment yet; it would follow the AWS TPRM record and add the 2026
          bulletins (CVE-2026-18830 harness tool dispatch, CVE-2026-15737 prompts in spans)
      EX-D3-EI:
        status: gap
        note: Not deployed. Baseline is microVM compute only (no Instances capacity providers), runtimeSessionId
          derived server-side from the user, and lifecycleConfiguration idle 900 s / max 4 h
      EX-AGENT-EGRESS-CONTROL:
        status: gap
        note: Not deployed. Baseline is networkMode VPC enforced by SCP on bedrock-agentcore:subnets, egress through
          the cloud firewall's domain allowlist and Route 53 Resolver DNS Firewall, and Code Interpreter in Sandbox
          or VPC mode; the harness actions are not covered by the subnet keys, so its VPC setting is reviewed in
          the pipeline
      EX-AML-M0028:
        status: gap
        note: Not deployed. Baseline is allowedTools naming each tool (shell excluded), MCP servers only as gateway
          targets with a static mcpToolSchema, InvokeAgentRuntimeCommand granted to nobody, and the front end
          stripping tools, allowedTools and skills from InvokeHarness calls
      EX-D3-CH:
        status: gap
        note: Not deployed. Baseline is a CMK on the token vault, Private Key JWT on custom OAuth providers, and
          GetResourceApiKey / GetSecretValue scoped to named ARNs; the vault is not write-only to the execution
          role, so credentials stay on gateway targets
      EX-AML-M0029:
        status: gap
        note: Not deployed. Consequential actions would be inline_function tools approved in our front end, with a
          temporal gateway policy requiring a recorded approval; built-in and MCP tools have no ask mode
      EX-INPUT-GUARDRAILS:
        status: gap
        note: Not deployed. Baseline is guardrail policies at the gateway (suppressOutput over tool output,
          PromptAttack forbid over input) tuned in LOG_ONLY first; results of built-in tools, Browser and direct
          remote MCP stay unscreened, so those tools are not enabled
      EX-AGENT-TRACING:
        status: gap
        note: Not deployed. Baseline is CloudWatch Transaction Search on, agent log groups subscribed to the SIEM,
          and CloudTrail data events for AgentCore into the logging account
      EX-AML-M0024:
        status: gap
        note: Not deployed. Harness traces and CloudTrail data events would be retained in the logging account for
          the standard 13 months
      EX-AGENT-KILL-SWITCH:
        status: gap
        note: Not deployed. Runbook would be StopRuntimeSession on the session, a resource-based Deny on
          InvokeAgentRuntime, Revoke active sessions on the execution role, credential-provider deletion and a
          gateway rate of 0; stopping a harness session through its underlying agentRuntimeArn is to be proven in a drill
