          - title: Terminate a running query
            body:
              - >-
                Call close() on the Query object (or abort its abortController) to end the query and terminate
                the CLI subprocess with its subagents.
            url: https://code.claude.com/docs/en/agent-sdk/typescript
          - title: Stop one background subagent
            body:
              - >-
                Call stopTask(taskId) (Python stop_task) with the task ID from the task notification.
            url: https://code.claude.com/docs/en/agent-sdk/typescript
          - title: Purge what the run stored
            body:
              - >-
                Call deleteSession() against the SessionStore, which cascades to subagent transcripts when the
                adapter implements delete, and remove the container's working directory.
            url: https://code.claude.com/docs/en/agent-sdk/session-storage
        note: >-
          Partial by the rule for this drawing: the stop is an in-process call by the application that holds
          the Query handle. close() ends that query and its in-process subagents, but no runtime-level cancel
          reaches a run on another worker or a session that can be resumed from a SessionStore; interrupt()
          stops the turn while queued messages still run unless the control request sets cancel_queued;
          whether commands a Bash tool left running in the background die with the subprocess is not
          documented. Revoking the API key or federation rule refuses only the next model request (delay not
          documented), and quarantine and deletion are the deployer's steps.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityKillSwitch
          reviewRequired: false
          original:
            - capability: capabilityKillSwitch
              coverage: partial
              mechanism: >-
                Revoke the Console API key or federation rule; kill the subprocess or container; maxTurns;
                hooks can deny all calls
              steps:
                - title: Revoke and stop
                  body:
                    - Delete the API key in the Console (or the WIF rule), stop the container, and delete session transcripts
                      and working directories the container held.
                  url: https://code.claude.com/docs/en/agent-sdk/hosting
              verified: 2026-09-10
      - mitigation: cap-mcp-tool-integrity
        coverage: partial
        mechanism: >-
          mcpServers declared in options with strictMcpConfig; mcp__server__tool entries in allowedTools and
          disallowedTools; versioned stdio commands and a managed allowedMcpServers serverCommand list;
          canUseTool receives the server's name and config source
        steps:
          - title: Admit only the servers you declare
            body:
              - >-
                Pass mcpServers and set strictMcpConfig true (Python strict_mcp_config) so .mcp.json, user
                settings, plugin servers and claude.ai connectors are ignored.
            url: https://code.claude.com/docs/en/agent-sdk/typescript
          - title: Pin stdio server versions
            body:
              - >-
                Start each stdio server with a versioned command (npx -y pkg@1.2.3) and, for a fixed set, bake
                allowedMcpServers serverCommand entries with allowManagedMcpServersOnly into managed settings.
            url: https://code.claude.com/docs/en/managed-mcp
          - title: Grant tools per server
            body:
              - >-
                Pre-approve mcp__<server>__<tool> entries in allowedTools and treat failed or needs-auth
                statuses in the init message as blockers.
            url: https://code.claude.com/docs/en/agent-sdk/mcp
        note: >-
          Partial by core rule 1: declaration and an exact command admit servers but verify nothing they serve.
          A versioned command pins stdio servers only; remote HTTP and SSE servers stay unpinned, list_changed
          refreshes tool definitions with no re-approval, and nothing hashes or scans tool descriptions. The
          mcpServer provenance canUseTool receives names where the config came from, not what it serves.
          In-process SDK MCP servers are the application's own code.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityMcpToolSecurity
          reviewRequired: false
          original:
            - capability: capabilityMcpToolSecurity
              coverage: partial
              mechanism: >-
                mcpServers configured in code or .mcp.json, mcp__ allow patterns, strictMcpConfig /
                disableClaudeAiConnectors, host managed policy (allowedMcpServers,
                strictPluginOnlyCustomization)
              steps:
                - title: Declare servers in code, not from the repository
                  body:
                    - Pass mcpServers in options and set settingSources [] so a checked-in .mcp.json cannot add servers; set
                      strictMcpConfig or disableClaudeAiConnectors to suppress claude.ai connectors.
                  url: https://code.claude.com/docs/en/agent-sdk/claude-code-features
                - title: Allow tools per server
                  body:
                    - Grant mcp__<server>__<tool> entries in allowedTools and treat needs-auth / failed statuses in the init
                      message as blockers.
                  url: https://code.claude.com/docs/en/agent-sdk/mcp
              note: >-
                The application decides which servers a session gets; host managed policy can constrain it
                where Claude Code's managed settings are deployed. Admission is not integrity — nothing pins
                the tool descriptions a server returns.
              verified: 2026-09-10
      - mitigation: cap-agent-egress-control
        coverage: partial
        mechanism: >-
          sandbox.network allowedDomains / deniedDomains with strictAllowlist for sandboxed Bash;
          WebFetch(domain:) permission rules for the fetch tool; a --network none container whose Unix-socket
          proxy enforces the allowlist (deployer-built)
        steps:
          - title: Allowlist sandboxed command egress
            body:
              - >-
                In the sandbox option set network.allowedDomains and strictAllowlist true, so sandboxed commands
                reach only listed hosts instead of prompting.
            url: https://code.claude.com/docs/en/agent-sdk/typescript
          - title: Restrict the fetch tool
            body:
              - >-
                Allow only WebFetch(domain:host) rules or put WebFetch in disallowedTools; the sandbox allowlist
                does not govern WebFetch.
            url: https://code.claude.com/docs/en/permissions
          - title: Block everything else at the container
            body:
              - >-
                Run with --network none and a mounted proxy socket, or in a private subnet that allows only the
                proxy; enforce domain allowlists and log at the proxy.
            url: https://code.claude.com/docs/en/agent-sdk/secure-deployment
        note: >-
          Partial on the same finding as D3-EI and Claude Code: the domain allowlist binds sandboxed Bash only.
          WebFetch is bounded by permission rules, and MCP servers, hooks, in-process custom tools (the local
          tools this pin sits on) and the CLI's own traffic leave through the host network unless the
          deployer's container and proxy block them. The sandbox proxy decides on the client-supplied hostname
          without TLS inspection (domain fronting). strictAllowlist is documented as honoured only from user,
          managed or --settings sources, so confirm it takes effect from the option or bake it into managed
          settings; allowManagedDomainsOnly has no effect from SDK options.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityEgressControl
          reviewRequired: false
          original:
            - capability: capabilityEgressControl
              coverage: partial
              mechanism: >-
                Claude Code sandbox network allowlist when enabled; container --network none with a
                Unix-socket or vsock proxy; HTTPS_PROXY / ANTHROPIC_BASE_URL; cloud security groups
              steps:
                - title: Remove the network interface and proxy everything
                  body:
                    - Run with --network none and mount a proxy socket, or in a private subnet with firewall rules that allow
                      only the proxy; enforce domain allowlists and log at the proxy.
                  url: https://code.claude.com/docs/en/agent-sdk/secure-deployment
              note: >-
                The sandbox allowlist bounds commands only when enabled; every other path (MCP servers,
                WebFetch, the host process) is bounded by the container network and proxy the deployer builds.
                Proxy variables are routing until direct egress is blocked.
              verified: 2026-09-10
      - mitigation: D3-FA
        coverage: external
        mechanism: >-
          None in the SDK; admission scanning at the package mirror or artifact repository the container's
          package managers and egress proxy point at
        evidence:
          - title: Plugins in the SDK (local paths only; marketplace plugins are downloaded first)
            url: https://code.claude.com/docs/en/agent-sdk/plugins
          - title: Hosting the Agent SDK (bundled CLI pinned to the SDK version)
            url: https://code.claude.com/docs/en/agent-sdk/hosting
        note: >-
          External (package firewall or artifact-repository scanning at the mirror): the SDK scans nothing it
          loads or the agent installs — plugins come from local paths in the plugins option, stdio MCP servers
          start from whatever command the application gives, and packages installed through Bash come from
          whichever registry the host reaches. Integration points: point the image's package managers at the
          scanning mirror and allow only its host in sandbox.network.allowedDomains and the egress proxy; pin
          the SDK, which bundles a CLI binary pinned to its version, in the lockfile. No model weights load.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityModelScanning
            - capabilityAiBom
          reviewRequired: false
          original:
            - capability: capabilityModelScanning
              coverage: notApplicable
