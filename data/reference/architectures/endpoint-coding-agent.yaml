id: archCodingAgent
surface: surfaceEndpoint
rank: 1
title: Coding and desktop agents
abbrev: Coding & desktop

summary:
  - >
    An agent application driven by a person who is present — a vendor's terminal CLI, IDE
    extension or desktop GUI, or an open-source harness, all the same engine in a different
    shell. The harness and its tool surface ship inside the application: file and edit tools, a shell, MCP servers,
    installed skills, and optionally computer use, with sandboxed execution for the tools that
    need containing. The shell changes the review surface, not the security architecture.
    Remote steering, scheduled runs and agent-written memory are now opt-in features of the
    same engine — owner-bound and admin-toggleable, which is what still separates this from the
    personal autonomous agent.

description:
  - >
    The defining property is the human in the loop and the fact that the loop is scoped to a task.
    The person starts it, watches it, and is the approval gate for the actions that matter. That
    is the default posture rather than a guarantee: every product now ships opt-in unattended
    modes — scheduled automations, event triggers, sessions steered from a phone over an
    outbound relay — each bound to the owner's account and switchable off from the vendor
    control plane. Most
    of this archetype's security posture rests on that gate being real rather than nominal — and
    approval fatigue is the failure mode that makes everything else matter. A gate that fires on
    every file write trains the user to accept, so the architectures that hold up narrow what
    needs approving: sandboxed tools, permissions scoped in advance on the harness-to-tools path,
    and default-deny egress, so the prompts that do fire are rare enough to read.
  - >
    Everything the agent reads is untrusted input with the same standing as the user's
    instruction: source files, dependency manifests, issue text, documents, mail — and
    screenshots, where an injection can be a picture of text. The tool plane is admitted by
    configuration that often arrives with the content itself: a project dotfile that ships in the
    clone can register tool servers the user never chose, and the disclosed vulnerability pattern
    in this archetype is overwhelmingly about that file. The same convergence produced a memory
    layer: agent-written notes and rules files merged into every later session — the persistent
    instruction channel the personal agent used to own alone, now on by default in several of
    the products. Computer use is the sharpest tool the
    application can switch on — the agent acts through the GUI and inherits every application
    already signed in, through an interface built on the assumption that a human is driving.
  - >
    The application boundary is the vendor's: tool capabilities and connectors are built into the
    CLI or GUI and configured there, and the only governance this archetype has is the published
    surface of the vendor's control plane — managed settings, a tool-server allowlist, audit
    export. In a managed deployment they are the difference between a governed tool and a shadow
    one; in the default install none of them are on, and the same binary runs with no policy, no
    audit and no inventory entry.
  - >
    The open-source harnesses are this same drawing with the vendor column empty: the loop
    calls the model provider directly on a pasted, long-lived key that is usually plaintext on
    disk, governance is a configuration file on the same disk the agent can edit, and the
    binary arrives through community package registries — the credential and distribution story
    of the personal agent in a coding agent's body. The category's landmark incident is a
    compromised harness release published with stolen marketplace tokens; the archetype's
    supply chain includes the agent itself.

distinguishedBy:
  - >
    Against the personal autonomous agent: the capabilities have converged — this one now takes
    remote steering, scheduled runs and agent-written memory too — so what separates the
    archetypes is defaults, identity and custody. Here each of those is opt-in, addressable
    only by the owner's vendor account over an outbound relay that opens no inbound port, and
    switchable off from an admin console. The personal harness listens as its resting state, on
    raw platform identities an unbounded sender set can use, holds long-lived keys the user
    pasted in — and has no console anyone can switch anything off from.
  - >
    Against a vendor-managed runtime in the cloud: the same engine run by the vendor on their
    infrastructure gets an isolated filesystem, default-deny egress and a clean teardown. Here it
    runs on a machine that also holds the user's SSH keys, cloud credentials and browser
    sessions, and sandboxed tools are the only thing separating them from the agent's shell.

exemplars:
  - name: Terminal CLIs
    note: >
      The engine in a shell against a working directory — Claude Code and Codex in their CLI
      form — with a permission model for file writes and command execution and project-scoped
      tool servers.
    asOf: "2026-08"
  - name: IDE extensions and agent-first IDEs
    note: >
      The same engine in an editor: the VS Code extensions are the identical loop with an inline
      review surface, and Cursor is an IDE built around one. The tool-server configuration lives
      in a repository dotfile — the specific location that has repeatedly proven to be a
      code-execution path when written or swapped between approval and use.
    asOf: "2026-08"
  - name: Desktop assistant apps
    note: >
      Claude Desktop and the ChatGPT desktop app: chat over local files and standing connectors
      with the vendor's coding engine embedded underneath, plus an opt-in computer-use mode that
      drives the graphical interface behind OS screen-recording and input grants.
    asOf: "2026-08"
  - name: Managed enterprise deployments
    note: >
      The same product with centrally managed settings, an allowlist of permitted tool servers and
      exported audit. The architecture is unchanged; the vendor control plane being switched on is
      the difference.
    asOf: "2026-08"
  - name: Open-source harnesses
    note: >
      The same engine without the vendor: the opencode/Crush-class TUIs, the Cline fork family,
      Aider and Goose. Direct model-provider calls on user-held keys, no control plane by
      default, distribution through community registries — this drawing with the vendor column
      empty.
    asOf: "2026-08"

blocks:
  - id: developer
    kind: actor
    title: User
    icon: person
    col: 0
    row: 1
    note: >
      Present, watching, and the approval gate — a developer at a CLI or anyone at the desktop
      app. The archetype's posture depends on that staying true, which is why every other control
      exists to keep the prompts rare enough to read.

  - id: repoOrigin
    kind: external
    title: Repos, docs & screen
    cosaiComponent: componentDataSources
    col: 0
    row: 2
    note: >
      Everything the agent reads: repository content arriving in the clone, documents and mail the
      user points it at, and screenshots. Contributed to by people who are not the user, and read
      into context as though it were instruction.
    items:
      - id: code
        label: Code & project docs
        icon: doc
        note: A repository is a document the attacker may have contributed to.
      - id: dotfile
        label: Tool config dotfile
        icon: gear
        note: >
          The tool-server declaration that ships with the code. The single most attacked artifact
          in this archetype.
      - id: documents
        label: Docs & screenshots
        icon: eye
        note: >
          Documents authored by anyone, and screenshot text as pixels — an injection can be a
          picture of an instruction, with no provenance at all.

  - id: client
    kind: service
    title: Agent harness
    col: 1
    row: 1
    cosaiComponent: componentReasoningCore
    note: >
      The loop behind the terminal, editor or chat window, running as the user. Remote steering
      arrives over an outbound relay — no inbound port — and only the owner's vendor account
      can address it. Who may address the loop, not whether it can be reached, is what now
      separates it from a personal agent harness.
    items:
      - id: loop
        label: Agent loop
        icon: agent
        note: Decides the next edit, command or screen action from the task and everything it has read so far.
      - id: context
        label: Context assembly
        icon: doc
        note: Merges the instruction, the memory and the tool results into one prompt.

  - id: remoteDevice
    kind: service
    title: Remote device
    cosaiComponent: componentAgentUserQuery
    col: 0
    row: 0
    note: >
      The steering surfaces away from the machine: the phone, the browser, the chat thread.
      Everything they send reaches the harness through the vendor's relay on the owner's
      account — which makes this box, not the machine, the place remote-control policy is
      enforced: trusted-device enrolment, fresh sign-in requirements, and the admin toggle
      that turns the path off.
    items:
      - id: phoneWeb
        label: Phone & web apps
        icon: phone
        note: The owner's own surfaces, signed into the same vendor account as the harness.
      - id: chatChannels
        label: Chat channels
        icon: chat
        note: >
          The @-mention surfaces — and the widest admission decision here, because whoever
          the channel admits can raise a session of their own.

  - id: memory
    kind: service
    title: Memory & state
    col: 1
    row: 3
    cosaiComponent: componentDataStorage
    note: >
      The cross-session layer the products converged on: notes the agent writes itself and
      rules files merged into every later prompt. Read back as instruction on the next task —
      the personal agent's persistence primitive, now on by default in several vendor products
      and present as rules files in all of them.
    items:
      - id: memoryFiles
        label: Memory files
        icon: folder
        note: >
          Agent-written notes loaded at the start of every session. Context, not enforced
          configuration — and prose the next task treats as instruction.
      - id: rules
        label: Rules & instructions
        icon: doc
        note: >
          The AGENTS.md-class files, user-level and repo-committed — the repo-committed ones
          are authored by whoever last committed.

  - id: toolPlane
    kind: service
    title: Tool services
    col: 2
    row: 2
    cosaiComponent: componentTools
    note: >
      The application's action surface, running as the user on a machine that also holds their
      SSH keys, cloud credentials and browser sessions. Admission is configuration — which may
      have arrived with the clone.
    items:
      - id: editTools
        label: File & edit tools
        icon: folder
        note: Read and write across the working tree and the user's documents. Scope is a setting, not a boundary.
      - id: shell
        label: Shell commands
        icon: code
        note: Command execution with the user's full authority when it runs outside the sandbox.
      - id: mcp
        label: Local & remote MCP
        icon: plug
        note: >
          Local child processes with the user's privileges, and remote servers on an authorised
          grant — both admitted by configuration, and both feeding tool descriptions into
          context as model input.
      - id: skills
        label: Installed skills
        icon: gear
        note: >
          Packaged instructions and helpers the engine loads — project- or user-installed,
          executing with the agent's authority.
      - id: computerUse
        label: Computer use
        icon: eye
        note: >
          The opt-in mode that drives the GUI through OS grants. The tool that cannot be
          enumerated: the reachable action set is everything a person at the desk could do.
      - id: sandboxedTools
        label: Sandboxed tools
        icon: shield
        note: >
          Where builds, tests, shell commands and driven desktops run when isolation is on — a
          container or VM whose own configuration the agent must not be able to reach. The
          control that turns "approve every command" into "approve the ones that leave the box".

  - id: vendor
    kind: provider
    title: Vendor service
    col: 3
    row: 0
    note: >
      The vendor's application backend and the published surfaces of its control plane — managed
      settings, connector brokering, audit export, and the relay behind the remote and scheduled
      features. The partial governance this archetype has, operated by the vendor rather than
      the organisation. In the open-source harnesses this block is absent altogether. Everything
      behind the published interfaces is the vendor's, and is not drawn.
    items:
      - id: managedSettings
        label: Managed settings
        icon: gear
        note: >
          Centrally enforced permissions and a tool-server allowlist the user cannot override.
          Off by default; the difference between a governed deployment and a shadow one.
      - id: connectorBroker
        label: Connector broker
        icon: plug
        note: Holds the OAuth grants into the user's services and exercises them on the agent's behalf.
      - id: auditExport
        label: Session audit export
        icon: eye
        note: Exported prompts, tool calls and approvals. In an unmanaged install there is no record at all.
      - id: remoteSessions
        label: Remote & scheduled sessions
        icon: phone
        note: >
          The relay that lets a phone or chat mention steer the local loop, and the scheduler
          that runs it with nobody watching. Outbound-only and bound to the owner's account —
          and the admin console can turn both off.

  - id: provider
    kind: provider
    title: Model provider
    col: 4
    row: 0
    cosaiComponent: componentModelServing
    note: >
      The inference API behind the vendor's service. The completion it returns drives file
      writes, commands and screen actions.
    items:
      - id: inference
        label: Inference API
        icon: model
        note: The published interface. Receives code, documents and screenshots; returns the plan.

  - id: remote
    kind: external
    title: Downstream services
    cosaiComponent: componentDataSources
    col: 2
    row: 3
    note: >
      What the tool plane reaches over the network: registries, the web, and the SaaS accounts
      behind standing connector grants — and where fetched content comes back in as context
      indistinguishable from the user's instruction.
    items:
      - id: registries
        label: Package registries
        icon: db
        note: Dependencies and their metadata, authored by strangers and read into context.
      - id: web
        label: Web & APIs
        icon: globe
        note: Attacker-writable content that re-enters the loop as context, and the exfiltration path out.
      - id: saas
        label: SaaS
        icon: mail
        note: >
          Mail, calendar and workspace accounts reached through standing OAuth grants — authorised
          once, scoped to a service rather than a task, and outliving the conversation.
      - id: storage
        label: File storage
        icon: folder
        note: Cloud documents pulled into context through a grant the user forgot they gave.

edges:
  - from: developer
    to: client
    path: primary
    bidir: true
    label: task / approval
    note: >
      The user states the task and answers the approval prompts. Whoever is at the machine is the
      user, as far as the agent is concerned.
  - from: client
    to: memory
    path: primary
    bidir: true
    route: vh
    note: >
      The loop writes what it learns and reads it back as instruction on the next task — the
      same edge the personal agent has always had, now drawn here too.
  - from: repoOrigin
    to: client
    path: external
    label: read into context
    note: >
      Repository content, documents and screenshots are read into context as instruction, and the
      tool-server declaration arrives in the same clone. A contributor is not the user, and
      nothing authenticates the difference.
  - from: client
    to: vendor
    path: primary
    bidir: true
    route: vh
    label: app session
    note: >
      The application session on a vendor-issued, session-scoped credential that expires on its
      own. Code, documents and screenshots leave for inference; the completion that comes back is
      unauthenticated content, and it drives the tool calls.
  - from: developer
    to: remoteDevice
    path: primary
    label: away from the machine
    note: >
      The same person, not at the keyboard: the instruction is written on a phone, in a
      browser, or in a chat thread instead of the terminal.
  - from: remoteDevice
    to: vendor
    path: primary
    label: remote steering
    note: >
      Instructions from away arrive through the vendor relay: the local harness polls
      outbound, no inbound port opens, and only the owner's account can address it. The trade
      is that the session's admission decision now lives with the vendor's identity system —
      and with whatever a chat channel admits.
  - from: client
    to: provider
    path: external
    route: hv
    label: OSS variant — direct on a user-held key
    note: >
      The open-source harnesses' model path: no vendor service, no session credential — the
      harness calls the provider directly on a pasted, long-lived key that usually sits in
      plaintext on disk. The enterprise target state puts an AI gateway at this crossing; the
      common state has nothing.
  - from: vendor
    to: provider
    path: primary
    bidir: true
    label: model inference
    note: >
      The vendor's service calls the model provider's inference API — the same consistent block
      every architecture uses for model inference.
  - from: client
    to: toolPlane
    path: primary
    bidir: true
    label: tool calls
    note: >
      Tool calls out with whatever scope the permission model granted; file contents, screen
      content and tool results back into context. The permission gate on this path is the
      archetype's standard control.
  - from: toolPlane
    to: remote
    path: external
    bidir: true
    note: >
      Remote tool calls, package fetches and connector reads out; descriptions, dependencies,
      mail and page content back in as model input. Also the path an exfiltration attempt takes.

pins:
  risks:
    - risk: riskPromptInjection
      at: repoOrigin->client
      note: >
        Source files, manifests, issue text, documents and screenshots are unrelated paths into
        the same context window, none of which is the user's instruction — and screenshot text
        carries no provenance at all.
    - risk: riskToolRegistryTampering
      at: toolPlane
      note: >
        Configuration admits the whole tool plane and can arrive with the clone. Injecting into
        it, swapping it after approval and auto-registration are the disclosed paths.
    - risk: riskPromptInjection
      at: memory
      note: >
        Memory files and rules are prose a later session treats as instruction. An injection
        that writes here outlives the task that carried it — including rules committed by
        whoever last touched the repo.
    - risk: riskInsecureModelOutput
      at: client->vendor
      note: The completion is unauthenticated content, and it drives file writes, shell commands and clicks.
    - risk: riskExcessiveDataHandlingDuringInference
      at: client->vendor
      note: Code, documents and screenshots leave for inference — usually more than the user pictured sharing.
    - risk: riskRogueActions
      at: client
      note: >
        A gate that fires on every action trains the user to accept, and an accepted prompt is
        not oversight.
    - risk: riskShadowAndUnknownAgents
      at: client
      note: >
        A binary a user can fetch without asking anyone. Unmanaged, it has no policy, no audit
        and no inventory entry — and that is the common case.
    - risk: riskAgenticDelegationConfusedDeputy
      at: toolPlane
      note: >
        On the computer-use path the driven applications carry whatever authority is already
        signed in, and cannot tell an agent from the person the session belongs to.
    - risk: riskInsecureIntegratedComponent
      at: toolPlane
      note: Local MCP servers are third-party code running as the user, in the same trust zone as everything else.
    - risk: riskSensitiveDataDisclosure
      at: toolPlane->remote
      note: >
        The machine also holds SSH keys, cloud credentials and browser sessions, and outside the
        sandbox nothing separates them from the agent's shell on the way out.
    - risk: riskSensitiveDataDisclosure
      at: client->provider
      note: >
        The open-source variant's credential story: a long-lived key pasted into configuration,
        plaintext on disk in most of the harnesses, revocable by nobody but the user who
        pasted it.
    - risk: riskStaleAgentIdentityBinding
      at: remoteDevice->vendor
      note: >
        The remote channel is only as good as the account and device binding behind it — a
        stale login or an unenrolled device steering a machine full of credentials is an
        account-compromise blast radius, not a UX feature.
    - risk: riskToolSourceProvenance
      at: toolPlane->remote
      note: >
        A remote server's grant is explicit and revocable, but says nothing about whether its tool
        descriptions are honest — and they are model input.

  capabilities:
    - capability: capabilityToolPermissionScoping
      at: client->toolPlane
      note: >
        The standard permission gate between harness and tools: per-tool grants scoped to the
        working tree and the task — and, on the desktop, OS grants narrowed to folders and the
        contained display — instead of the user's full authority.
    - capability: capabilityAgentSandboxing
      at: toolPlane
      note: >
        Make sandboxed tools the default path for commands and computer use — an isolated
        runtime with its own filesystem and accounts, so the approval gate only fires for
        actions that leave the box.
    - capability: capabilityHitlControls
      at: client
      note: >
        Non-overridable approval on consequential actions, kept rare by the surrounding controls
        so each prompt is actually read.
    - capability: capabilityMemoryProtection
      at: client->memory
      note: >
        Treat memory and rules as untrusted input on read; review what the agent writes, and
        treat a repo-committed rules change like a code change.
    - capability: capabilityMcpToolSecurity
      at: toolPlane
      note: Provenance and behavioural review before a server is admitted; pin versions so an update is a decision.
    - capability: capabilityCredentialIsolation
      at: toolPlane
      note: >
        Keep the user's SSH keys, cloud credentials and browser profile outside the agent's
        reachable filesystem and environment.
    - capability: capabilityAgentRuntimeEnforcement
      at: remoteDevice->vendor
      note: >
        Trusted-device enrolment and the admin toggle decide which surfaces may steer at all —
        enforced at the relay, outside the machine being steered.
    - capability: capabilitySecretsManagement
      at: client->provider
      note: >
        Where no vendor brokers the credential, vault it: keychain-backed storage, short-lived
        keys where the provider offers them, and never a plaintext key in a dotfile a repo
        script can read.
    - capability: capabilityAgentRegistry
      at: vendor
      note: >
        A managed allowlist of tool servers, enforced from the vendor control plane outside the
        configuration file it governs — never auto-registration from a cloned repo.
    - capability: capabilityAuditLogging
      at: vendor
      note: Turn on session audit export — prompts, tool calls and approvals — so an incident is reconstructable.
    - capability: capabilityAiDlp
      at: client->vendor
      note: Redact what code, document and screen content may leave for inference, because the inputs are the user's private files.
    - capability: capabilityEgressControl
      at: toolPlane->remote
      note: >
        Default-deny outbound with an allowlist — the last boundary between a content-borne
        injection and an attacker's collection endpoint.
    - capability: capabilityIga
      at: toolPlane->remote
      note: Review and narrow the standing connector grants; expire the ones no task has used.
    - capability: capabilityPromptInjectionDefense
      at: repoOrigin->client
      note: Treat repository and document content as untrusted on read; it cannot be authenticated, only bounded.
    - capability: capabilityShadowAiDiscovery
      at: client
      note: Find the installs that never enrolled, because this archetype spreads one user at a time.

scenarios:
  - title: The user asks for a change
    steps:
      - follow: developer->client
        note: The task is stated by a human who will stay for the whole session.
      - follow: client->vendor
        note: The session rides a vendor-issued credential; context leaves for the model.
      - follow: vendor->provider
        note: The vendor's service calls inference; the completion becomes the next action.
      - follow: client->toolPlane
        note: Edits and commands execute with whatever scope the permission model granted.
      - follow: client->developer
        note: The diff comes back to the person who asked, who approves what matters.
  - title: A clone brings its own tool servers
    steps:
      - follow: repoOrigin->client
        note: The tool configuration dotfile arrives with the code, authored by whoever last committed.
      - follow: client->toolPlane
        note: >
          Declared servers launch as the user — unless a managed allowlist enforced from the
          vendor control plane says otherwise.
      - follow: toolPlane->remote
        note: A declared remote server is reached, and its tool descriptions enter context as model input.
  - title: A poisoned document phones home
    steps:
      - follow: repoOrigin->client
        note: A hidden instruction in a source file, document or screenshot is read into context.
      - follow: client->vendor
        note: The instruction shapes the completion, which the loop treats as the plan.
      - follow: client->toolPlane
        note: >
          The plan becomes a file write, a command or a screen action, inside whatever scope the
          tools hold — contained if it runs in the sandboxed tools, signed-in everywhere if not.
      - follow: toolPlane->remote
        note: The exfiltration attempt has to cross the egress allowlist — the last control standing.

  - title: A phone steers the session
    steps:
      - follow: developer->remoteDevice
        note: The person steps away from the machine; the instruction is written on a phone or in a chat thread.
      - follow: remoteDevice->vendor
        note: The vendor relay authenticates the owner's account — and the trusted-device policy fires here or nowhere.
      - follow: vendor->client
        note: The local harness picks it up on its outbound poll — no port opened, nothing for a scanner to find.
      - follow: client->toolPlane
        note: Execution is local, with the machine's full context — the person just is not at the keyboard.
      - follow: client->vendor
        note: Results stream back through the relay; approvals can be answered from the phone.
  - title: The same engine without the vendor
    steps:
      - follow: developer->client
        note: An open-source harness, installed from a community registry, run by a developer who is present.
      - follow: client->provider
        note: The model call goes direct, on a pasted key — no session credential, no managed settings, no audit export.
      - follow: client->toolPlane
        note: The same tool surface as the vendor products, admitted by configuration files on the same disk the agent can edit.

deviations:
  - subject: The desktop assistant is folded into this architecture rather than drawn separately
    reason: >
      The desktop apps embed the same engine the CLIs run, pointed at a broader audience; what
      varied between the two drawings was the GUI shell, the connector emphasis and the
      computer-use toggle — all items on this diagram, not different architectures.
  - subject: The application boundary is drawn as a containment frame, not a block
    reason: >
      The harness and tool services ship inside one application — a vendor's CLI or GUI, or an
      open-source harness; the React Flow view draws that as a labelled frame around both,
      because the application is a boundary things live in, not a service things call.
  - subject: The OS permission layer is a control on the harness-to-tools path, not a block
    reason: >
      One-time OS consent dialogs gate file access, screen recording and input control, but they
      are a permission-scoping control on tool calls, not a service in the data path — so they
      live with the permission-scoping capability on that edge.
  - subject: The open-source harnesses are drawn on this architecture, not their own
    reason: >
      An opencode/Crush-class harness is this graph with the vendor service column absent, and
      its one structural difference is drawn: the amber crossing from the harness straight to
      the model provider, on a user-held key. Everything else — governance defaulting to files
      the agent can edit, distribution through community registries — is credential-custody
      and supply-chain difference, carried as notes and pins the way the desktop assistant's
      differences are. A reader should take one diagram with an either/or model path, not two
      architectures.
  - subject: Connector traffic is drawn from Tool services, not the vendor
    reason: >
      The OAuth grants live with the vendor's connector broker, so the bytes flow through the
      vendor. The drawing keeps the standard Tool services to Downstream services reading and
      names the broker on the vendor block, because the reader's question is what the agent can
      reach, not which datacentre the call transits.

