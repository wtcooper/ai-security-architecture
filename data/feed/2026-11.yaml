  - id: microsoft-post-training-backdoors-coding-agents
    kind: research
    date: 2026-11-12
    added: 2026-11-25
    weight: notable
    title: "Microsoft AI Red Team: poisoned fine-tuning data can turn coding agents on their users"
    summary: >
      In lab work, 90 poisoned examples in about 9,000 conversations gave a 78% attack success rate; a
      backdoored checkpoint reached 84.1% to 94.8% on unseen repos. Advice: pin datasets, evaluate checkpoints
      in the production harness, and enforce authorization at the tool layer.
    why: "Benchmarks do not show a checkpoint is free of triggers; the tool boundary has to hold if one fires."
    vendor: Microsoft
    controls: [AML.M0008, AML.M0014, AML.M0025, AML.M0028]
    patterns: [archTrainingPipeline, archSelfHostedInference, archCodingAgentFirstParty]
    update:
      action: controlGuidance
      status: applied
      target: AML.M0008
      note: "Treat third-party checkpoints as untrusted: test in the production harness; benchmark passes are not backdoor-free evidence."
    sources:
      - title: "Trained to betray: How post-training supply chain attacks hijack coding agents"
        url: https://www.microsoft.com/en-us/security/blog/2026/11/12/trained-to-betray-how-post-training-supply-chain-attacks-hijack-coding-agents/
        publisher: Microsoft Security
        date: 2026-11-12

