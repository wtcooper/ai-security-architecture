# Claude Desktop and claude.ai — one entity per product × reference architecture. Facts are dated
# (asOf) and cite the vendor's own documentation; re-verify before enforcing.
# Schema: data/tooling/README.md. Claude Desktop on 3P (Bedrock / Vertex / Foundry / gateway
# inference with local conversation storage) is recorded as a variant, not an entity.
vendor: anthropic
family: Claude Desktop
tools:
  - id: toolClaudeDesktop
    name: Claude (claude.ai web, mobile and Claude Desktop)
    surfaceClasses:
      - desktopApp
      - saasChat
    variants:
      - name: Claude Desktop (macOS PKG/DMG, Windows MSIX, Linux beta)
        class: desktopApp
        url: https://support.claude.com/en/articles/12611117-deploy-claude-desktop-for-macos
      - name: claude.ai web and the iOS / Android apps
        class: saasChat
        url: https://support.claude.com/en/articles/9797531-what-is-the-enterprise-plan
      - name: Claude Desktop on 3P (inference via Bedrock, Vertex, Foundry or a gateway; local history)
        class: desktopApp
        url: https://claude.com/docs/third-party/claude-desktop/overview
        note: >-
          Configured only through MDM or a bootstrap server (or the claude.ai admin console in
          beta); conversation content goes only to your endpoint; no Anthropic account identity.
    architecture: archEnterpriseAiChat
    status: ga
    asOf: "2026-09"
    summary:
      - >-
        Anthropic's chat surfaces: claude.ai in the browser, the mobile apps, and Claude Desktop
        with its Chat, Cowork and Code tabs. Chat runs on the Anthropic API under the user's
        organisation login; connectors (MCP) reach Google Drive, Microsoft 365, GitHub, Slack and
        custom remote servers through mcp-proxy.anthropic.com; desktop extensions (.mcpb) and
        local MCP servers add device-side tools. Prompts, uploads and connector results go to
        Anthropic; Team and Enterprise data is not used for training and follows the organisation's
        retention setting (indefinite by default until a custom period is set).
      - >-
        Team and Enterprise administration is in the claude.ai console: SSO (SAML/OIDC via WorkOS)
        with domain verification and "Require SSO for Claude", JIT or SCIM provisioning with
        group-to-role mapping, custom roles and groups gating Claude Code, Cowork, Chrome,
        connectors, Claude Tag and models, connector enablement and per-tool read/write
        restrictions, enterprise-managed connector authorisation through the IdP, the desktop
        extension allowlist, audit logs (180-day export) and the Compliance API (Activity Feed,
        chats, files, projects, session transcripts, effective settings), custom retention, spend
        limits, IP allowlisting, CMEK and US-only inference. Enterprise installers deploy via
        Jamf, Kandji, Intune, SCCM or GPO with device policies in com.anthropic.claudefordesktop or
        HKLM\SOFTWARE\Policies\Claude covering extensions, local MCP, Claude Code and Cowork tabs,
        auto-updates and forced org login; device policy overrides the in-console allowlist.
    facts:
      - label: Plans
        value: >-
          Free, Pro, Max (consumer terms); Team (SSO, server-managed settings, analytics);
          Enterprise (SCIM, custom roles, Compliance API, audit logs, custom retention, CMEK, IP
          allowlisting, ZDR for Claude Code, HIPAA-ready option, US-only inference).
        url: https://support.claude.com/en/articles/9797531-what-is-the-enterprise-plan
      - label: Inference & routing
        value: Anthropic API; Claude Desktop on 3P routes Chat, Cowork and Code to Bedrock, Vertex, Foundry, the Anthropic API or an LLM / Claude apps gateway with local conversation storage.
        url: https://claude.com/docs/third-party/claude-desktop/overview
      - label: Data leaving the device
        value: >-
          Prompts, attachments, artifact content and connector retrievals to Anthropic; the
          desktop app also loads application code from claude.ai and *.claudeusercontent.com CDN
          hosts; the tenant-restrictions header and IP allowlist are the network-side gates.
        url: https://code.claude.com/docs/en/desktop
      - label: Retention & training
        value: >-
          Commercial plans: no training; chat and project retention indefinite by default,
          configurable from 30 days at Organization settings > Data and privacy; audit logs 180
          days; Compliance API local/remote session transcripts 6 years or the custom period.
        url: https://support.claude.com/en/articles/10440198-configure-custom-data-retention-controls-for-enterprise-plans
      - label: Docs index
        value: support.claude.com Team and Enterprise plans collection plus platform.claude.com manage-claude (Compliance API, inference hooks)
        url: https://support.claude.com/en/articles/9797531-what-is-the-enterprise-plan
    items:
      - title: Managed deployment and device policies
        body:
          - "Device policies live in the macOS configuration-profile domain
            com.anthropic.claudefordesktop and the Windows HKLM\\SOFTWARE\\Policies\\Claude registry
            key (HKCU is ignored when HKLM exists). The keys that matter for control:
            isDesktopExtensionEnabled and isDesktopExtensionDirectoryEnabled (kill switches for
            extensions and the directory), isLocalDevMcpEnabled (local MCP server connections),
            isClaudeCodeForDesktopEnabled, secureVmFeaturesEnabled (Cowork access),
            forceLoginOrgUUID, allowedWorkspaceFolders, effortLevel, disableAutoUpdates and
            autoUpdaterEnforcementHours. Device-level policy overrides the in-app allowlist."
          - "Claude Desktop on 3P extends the same stores with inferenceProvider and credential
            keys, disabledBuiltinTools, builtinToolPolicy, disableBypassPermissionsMode,
            coworkEgressAllowedHosts, managedMcpServers, allowedPluginMarketplaces,
            userPluginMarketplacesEnabled / userPluginUploadsEnabled, sshHostAllowlist,
            egressProxyUrl and OTLP telemetry keys; a Linux /etc/claude-desktop/managed-settings.json
            uses native JSON."
        links:
          - title: Enterprise configuration for Claude Desktop
            url: https://support.claude.com/en/articles/12622667-enterprise-configuration-for-claude-desktop
          - title: Claude Desktop configuration reference (3P managed keys)
            url: https://claude.com/docs/third-party/claude-desktop/configuration
      - title: Extension allowlist and managed connector authorization
        body:
          - Team and Enterprise Owners can turn on the desktop extension allowlist (Organization
            settings > Connectors > Desktop). It ships disabled — every extension is available until
            it is enabled — and enabling it force-deletes existing non-allowlisted installs; custom
            org-scoped extensions upload in .mcpb format. Enterprise-managed connector
            authorization (GA) lets admins provision MCP connectors org-wide through the IdP (Okta
            today), assign them by role and scope the permissions Claude may request; Owners can
            also restrict each connector's tools to read-only and block verified-domain services
            from connecting to outside accounts.
        links:
          - title: Desktop extension allowlist
            url: https://support.claude.com/en/articles/12592343-enabling-and-using-the-desktop-extension-allowlist
          - title: Org-wide MCP connector authorization
            url: https://support.claude.com/en/articles/15537633-authorize-mcp-connectors-for-your-entire-organization
          - title: Use connectors (admin controls)
            url: https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities
      - title: Identity, audit and compliance for the organisation
        body:
          - SSO via WorkOS (Okta, Entra ID, Google, OneLogin, JumpCloud, Duo SAML) with "Require
            SSO for Claude", JIT or SCIM provisioning with group-to-role mapping and automatic
            removal; Enterprise custom roles and groups; IP allowlisting (CIDR ranges enabled by
            Anthropic support); tenant restrictions via the proxy-injected
            anthropic-allowed-org-ids header.
          - Audit logs (Enterprise, 180 days, CSV by email) from Organization settings > Data and
            privacy; the Compliance API for the Activity Feed, chats, files, projects, directory,
            effective settings and Cowork / Claude Code / M365 session transcripts; custom data
            retention from 30 days; Inference hooks (beta) for inline allow/deny of every governed
            prompt across claude.ai, Cowork and Claude Code.
        links:
          - title: Set up single sign-on
            url: https://support.claude.com/en/articles/13132885-set-up-single-sign-on-sso
          - title: Set up JIT or SCIM provisioning
            url: https://support.claude.com/en/articles/13133195-set-up-jit-or-scim-provisioning
          - title: Compliance API
            url: https://platform.claude.com/docs/en/manage-claude/compliance-api
    riskNotes:
      - risk: riskSensitiveDataDisclosure
        note: >-
          Chat and project retention is indefinite until an Owner sets a period; uploads,
          connector results and artifacts persist with the chat. Custom retention and the
          Compliance API delete endpoints are the levers.
      - risk: riskToolSourceProvenance
        note: >-
          Custom remote MCP connectors and desktop extensions are user-addable by default; the
          extension allowlist ships disabled and Anthropic reviews Directory connectors against
          listing criteria without auditing them.
      - risk: riskAgenticDelegationConfusedDeputy
        note: >-
          Connectors act with the user's granted scopes; org-wide tool restrictions (read vs
          write) and managed authorisation scoping keep Claude from sending mail or writing
          tickets when only reading is intended.
      - risk: riskShadowAndUnknownAgents
        note: >-
          Personal accounts on the corporate network are blocked only by tenant restrictions or IP
          allowlisting; domain capture and SSO enforcement pull verified-domain users into the
          organisation.
    controls:
      - capability: capabilityIga
        coverage: native
        mechanism: SSO (SAML/OIDC) with Require SSO for Claude, domain verification and capture, JIT or SCIM provisioning with group-to-role mapping, custom roles and groups (Enterprise)
        steps:
          - title: Enforce SSO
            body:
              - Verify domains at claude.ai/admin-settings/organization, configure the IdP through
                WorkOS, then toggle "Require SSO for Claude" in Authentication settings.
            url: https://support.claude.com/en/articles/13132885-set-up-single-sign-on-sso
          - title: Provision and deprovision from the directory
            body:
              - Enable SCIM with group-to-role mapping (Enterprise / Console); users removed from all
                mapped groups are removed at the next sync.
            url: https://support.claude.com/en/articles/13133195-set-up-jit-or-scim-provisioning
          - title: Gate features by role
            body:
              - Create custom roles and groups at Organization settings > Roles and Groups to gate
                Claude Code, Cowork, Chrome, connectors, Claude Tag, models and admin scopes.
            url: https://support.claude.com/en/articles/13930458-set-up-role-based-permissions-on-enterprise-plans
        verified: "2026-09-10"
      - capability: capabilitySse
        coverage: native
        mechanism: IP allowlisting (Enterprise, CIDR ranges enabled by Anthropic support) and tenant restrictions (anthropic-allowed-org-ids header injected by a TLS-inspecting proxy)
        steps:
          - title: Restrict where Claude can be used from
            body:
              - Compile CIDR ranges and have Anthropic enable IP allowlisting; every authenticated
                request outside the ranges is denied (Anthropic-hosted cloud sessions then need an
                exemption).
            url: https://support.claude.com/en/articles/13200993-restrict-access-to-claude-with-ip-allowlisting
          - title: Block other tenants at the proxy
            body:
              - Inject anthropic-allowed-org-ids with your org UUIDs for claude.ai,
                api.anthropic.com, claude.com and anthropic.com (up to 500 UUIDs across numbered
                headers).
            url: https://support.claude.com/en/articles/13198485-enforce-network-level-access-control-with-tenant-restrictions
        verified: "2026-09-10"
      - capability: capabilityAiDlp
        coverage: partial
        mechanism: Inference hooks (Enterprise, beta) route every governed prompt to your AI security server for allow/deny; connector tool restrictions limit outbound actions; no built-in content classifier
        steps:
          - title: Enable Inference hooks
            body:
              - Configure the AI security server endpoint and signing secret, run shadow mode, then
                enforce; denied requests never reach the model and are recorded in the Activity
                Feed. Not available on Bedrock or Google Cloud.
            url: https://platform.claude.com/docs/en/manage-claude/inference-hooks
        verified: "2026-09-10"
      - capability: capabilityBrowserDetectionResponse
        coverage: external
        mechanism: claude.ai is a browser SaaS; paste and upload inspection is the organisation's browser-security tooling
        note: Anthropic offers no in-page inspection; pair the tenant-restriction header with browser D&R or SSE inline controls.
        steps:
          - title: Instrument the browser session
            body:
              - Apply your browser-security policy to claude.ai and *.claudeusercontent.com and use
                the tenant-restriction header to keep sessions in the corporate tenant.
            url: https://support.claude.com/en/articles/13198485-enforce-network-level-access-control-with-tenant-restrictions
        verified: "2026-09-10"
      - capability: capabilityEgressControl
        coverage: partial
        mechanism: Documented host allowlist for Claude Desktop and claude.ai; egressProxyUrl / PAC keys on 3P; connector traffic through mcp-proxy.anthropic.com; custom connectors reachable only via allowlisted Anthropic IPs
        steps:
          - title: Allowlist the documented hosts
            body:
              - Permit anthropic.com, claude.ai, claude.com, platform.claude.com, downloads.claude.ai,
                *.claudeusercontent.com and *.claudemcpcontent.com (plus optional CDN hosts for
                artifacts) and route through egressProxyUrl on managed devices.
            url: https://code.claude.com/docs/en/desktop
        verified: "2026-09-10"
      - capability: capabilityAiGovernancePlatform
        coverage: external
        mechanism: Compliance API directory and settings endpoints, Enterprise Analytics API and usage exports feed the organisation's governance platform
        steps:
          - title: Mirror organisation state
            body:
              - Pull organizations, users, roles, groups and effective settings from the Compliance
                API and per-user engagement from the Enterprise Analytics API.
            url: https://platform.claude.com/docs/en/manage-claude/compliance-api
        verified: "2026-09-10"
      - capability: capabilityHitlControls
        coverage: partial
        mechanism: Connector tool calls prompt per tool unless the user chooses always allow; Owners can set connector tools to ask or blocked org-wide; no approval workflow for chat outputs
        steps:
          - title: Force approval on connector actions
            body:
              - At Organization settings > Connectors set tools that write (send message, create
                issue) to ask or remove them; these settings are enforced in Claude Code and Cowork
                sessions too.
            url: https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities
        verified: "2026-09-10"
      - capability: capabilityPromptInjectionDefense
        coverage: partial
        mechanism: Anthropic model-side safeguards and web-fetch isolation; connector tool restrictions; Inference hooks for inline policy
        steps:
          - title: Limit what an injected instruction can do
            body:
              - Restrict connectors to read-only tools and enable only vetted connectors; use
                Inference hooks to deny prompts carrying policy-violating content.
            url: https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities
        note: No admin-configurable injection classifier is exposed for chat.
        verified: "2026-09-10"
      - capability: capabilityNhiManagement
        coverage: partial
        mechanism: Compliance Access Keys and Admin API keys with scopes; connector service identities via enterprise-managed authorisation; no per-agent identity for chat
        steps:
          - title: Scope machine credentials
            body:
              - Create a Compliance Access Key with only the scopes needed (read:compliance_activities,
                read:compliance_user_data) rather than an Owner's session.
            url: https://platform.claude.com/docs/en/manage-claude/compliance-api
        verified: "2026-09-10"
      - capability: capabilityVendorAssurance
        coverage: native
        mechanism: Compliance API effective-settings and Activity Feed endpoints, audit log export, and admin console readback let posture tooling verify training opt-out, retention, connectors and roles
        steps:
          - title: Evidence configuration continuously
            body:
              - Poll each organisation's effective settings and the Activity Feed with a Compliance
                Access Key; use the CSV audit export (180 days) for point-in-time evidence.
            url: https://platform.claude.com/docs/en/manage-claude/compliance-api
        verified: "2026-09-10"
      - capability: capabilityDspm
        coverage: native
        mechanism: Custom data retention (30 days to indefinite) for chats and projects, Compliance API retrieve and delete for chats, files and projects, organisation data export
        steps:
          - title: Set retention and delete on demand
            body:
              - Configure retention at Organization settings > Data and privacy (Owner) and use the
                Compliance API content endpoints to retrieve or delete chats, files and projects.
            url: https://support.claude.com/en/articles/10440198-configure-custom-data-retention-controls-for-enterprise-plans
        verified: "2026-09-10"
      - capability: capabilityAiTprm
        coverage: external
        mechanism: Trust Center artifacts (SOC 2, ISO 27001, HIPAA implementation guide, architecture overviews) feed the buyer's TPRM platform
        steps:
          - title: Collect artifacts
            body:
              - Request the Trust Center resources referenced across the docs, including the Cowork
                desktop security architecture overview and the M365 architecture diagrams.
            url: https://trust.anthropic.com
        verified: "2026-09-10"
      - capability: capabilityEncryptionKeyManagement
        coverage: native
        mechanism: Customer-managed encryption keys (Enterprise; AWS KMS, Azure Key Vault, Google Cloud KMS) and US-only inference; TLS in transit
        steps:
          - title: Bring your own key
            body:
              - Provision a key in your cloud KMS and enable CMEK on the Enterprise plan; note the
                audit-log CSV export is unavailable under CMEK (use the Compliance API) and local
                session transcripts are encrypted under the key.
            url: https://support.claude.com/en/articles/9797531-what-is-the-enterprise-plan
        verified: "2026-09-10"
      - capability: capabilitySecretsManagement
        coverage: partial
        mechanism: Connector OAuth tokens held by the platform; enterprise-managed authorisation replaces per-user grants; API and compliance keys are scoped and revocable in the console
        steps:
          - title: Centralise connector credentials
            body:
              - Use enterprise-managed authorisation so connector access is inherited from IdP roles
                on first login instead of users pasting tokens.
            url: https://support.claude.com/en/articles/15537633-authorize-mcp-connectors-for-your-entire-organization
        verified: "2026-09-10"
      - capability: capabilityToolPermissionScoping
        coverage: native
        mechanism: Connector enablement per organisation, per-tool read/write restrictions, role-based connector access, desktop extension allowlist, isLocalDevMcpEnabled, isDesktopExtensionEnabled
        steps:
          - title: Enable and scope connectors
            body:
              - Enable connectors at Organization settings > Connectors > Browse connectors and
                restrict each connector's tools (for example search but not send) for the whole
                organisation.
            url: https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities
          - title: Lock down device-side tools
            body:
              - Turn on the desktop extension allowlist and set isLocalDevMcpEnabled or
                isDesktopExtensionEnabled false in device policy where local tools are not wanted.
            url: https://support.claude.com/en/articles/12592343-enabling-and-using-the-desktop-extension-allowlist
        verified: "2026-09-10"
      - capability: capabilityDataAccessGovernance
        coverage: partial
        mechanism: Connectors retrieve as the authenticated user (OAuth) or as the scoped managed authorisation; verified-domain restriction stops org services connecting to outside accounts
        steps:
          - title: Keep retrieval per user
            body:
              - Prefer user OAuth or role-scoped managed authorisation over shared service accounts
                and turn on the verified-domain connector restriction on Enterprise.
            url: https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities
        verified: "2026-09-10"
      - capability: capabilityAgentRegistry
        coverage: partial
        mechanism: Organisation connector catalogue, extension allowlist and role assignments in the console; Compliance API session listings for Cowork and Claude Code
        steps:
          - title: Treat the connector catalogue as the registry
            body:
              - Only Owner-enabled connectors and allowlisted extensions are available to members;
                review them under Organization settings > Connectors.
            url: https://support.claude.com/en/articles/12592343-enabling-and-using-the-desktop-extension-allowlist
        verified: "2026-09-10"
      - capability: capabilityAuditLogging
        coverage: native
        mechanism: Enterprise audit logs (30+ event types, 180-day CSV export) and the Compliance API Activity Feed with actor, IP, user agent and device; session transcripts for Cowork, Claude Code, M365 and Science
        steps:
          - title: Export or stream audit events
            body:
              - Owners export logs from Organization settings > Data and privacy, or query
                GET /v1/compliance/activities continuously into the SIEM.
            url: https://support.claude.com/en/articles/9970975-access-audit-logs
        verified: "2026-09-10"
      - capability: capabilityShadowAiDiscovery
        coverage: partial
        mechanism: Domain capture pulls verified-domain accounts into the organisation; tenant restrictions and IP allowlisting block personal accounts on corporate networks
        steps:
          - title: Capture and block
            body:
              - Verify domains for account claiming and deploy the tenant-restriction header so
                personal claude.ai use from managed networks is refused.
            url: https://support.claude.com/en/articles/13198485-enforce-network-level-access-control-with-tenant-restrictions
        verified: "2026-09-10"
      - capability: capabilityKillSwitch
        coverage: native
        mechanism: SCIM deprovisioning, member removal, connector disable (revokes for all), extension allowlist force-delete, device keys (isClaudeCodeForDesktopEnabled, secureVmFeaturesEnabled, isDesktopExtensionEnabled), Compliance API delete
        steps:
          - title: Cut access and remove data
            body:
              - Remove the member or SCIM group, disable the connector at Organization settings >
                Connectors, and delete chats, files or projects through the Compliance API.
            url: https://platform.claude.com/docs/en/manage-claude/compliance-api
        verified: "2026-09-10"
