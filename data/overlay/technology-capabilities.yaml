  - id: tech-sandbox
    title: Sandboxing
    category: Infrastructure protection
    description: Runs untrusted code in a constrained environment. Detonation for analysis is one specialized sandbox use.
    primarySource:
      framework: ecso-market
      entry: sandbox
    frameworkMappings:
