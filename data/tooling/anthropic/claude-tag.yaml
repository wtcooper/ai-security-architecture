              evidence:
                - title: Vendor docs index, reviewed for applicability (2026-09-10)
                  url: https://claude.com/docs/claude-tag/overview
              verified: 2026-09-10
      - mitigation: cap-input-guardrails
        coverage: partial
        mechanism: >-
          No administrator-configurable screening of Slack messages or tool results; restricted members' and
          guests' messages are withheld or reach Claude only as context, and personal-connector tasks take
          direction only from the requester; Inference hooks (Enterprise, beta) hand each governed request,
          thread and tool results included, to the organisation's AI security server
        steps:
          - title: Put a screen on thread and tool content (Enterprise, beta)
            body:
              - >-
                Register an AI security server under Organization settings > Data and privacy > Inference hooks
                that classifies Slack messages and tool results for injection, and turn on Enforce verdicts.
            url: https://platform.claude.com/docs/en/manage-claude/inference-hooks-configuration
          - title: Keep untrusted authors out of Claude's input
            body:
              - >-
                Turn on the member-access restriction so unlinked members' thread replies are withheld, and keep
                Allow Claude to work in channels with guests at Restrict or Channel only.
            url: https://claude.com/docs/claude-tag/admins/restrict-access
        note: >-
          Partial on the rule applied to every vendor: the vendor's measures are structural (who Claude reads,
          whose instructions it takes) rather than content screening an administrator can switch on and see
          events from, and the hook is an attach point returning allow or deny only. The auto-mode permission
          checker judges proposed actions, which is action policy, not input screening. Claude reads whole
          threads and may reply untagged while Respond automatically is on; the credential-free sandbox and
          default-deny egress contain an injection rather than detect it.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityPromptInjectionDefense
          reviewRequired: false
          original:
            - capability: capabilityPromptInjectionDefense
              coverage: partial
