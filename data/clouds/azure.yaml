    hosting:
      - id: aks
        kind: cluster
        name: "AKS Pod Sandboxing (Kata Containers) on dedicated node pools"
        url: https://learn.microsoft.com/en-us/azure/aks/concepts-pod-sandboxing
        asOf: "2026-11"
        mapped: true
        compare:
          runs: "Your orchestrator creates and deletes a pod per rollout; each runs in its own lightweight virtual machine with a separate guest kernel (Kata Containers)."
          patching: "You keep the Azure Linux node image current through the upgrade channel you choose and rebuild the sandbox images; Azure manages the control plane."
          data: "Code, files and results of a run stay on cluster nodes and storage in your own subscription; the pod virtual machine boundary does not isolate storage or data paths."
          network: "You build every wall: the virtual network, network policies, FQDN filtering and the outbound route to a firewall; pods have unrestricted traffic until you do."
          identity: "Pods use Microsoft Entra Workload ID through a federated service account you assign; by default they can also reach the node's metadata service."
          accepts: "Linux container images on Azure Linux x86-64 node pools; Arm64 and host networking are not supported, and privileged pods get no host devices."
          workload: "Jobs are queued by the Volcano scheduler on nodes you provision; node autoscaling is unsupported for training unless you replace the default Volcano configuration."
          portability: "Kata Containers, Cloud Hypervisor and the manifests are open source and run on other Kubernetes clusters; node pools, identity and network wiring are redone."
          effort: "Your team operates the cluster, Kata node pools and their sizing, network policy, firewall and logs; Defender for Containers does not assess Kata pods."
          fits: "Microsoft describes it for isolating untrusted or multi-tenant workloads from the host kernel and each other while they share one cluster's capacity."
        sources:
          - https://learn.microsoft.com/en-us/azure/aks/concepts-pod-sandboxing
          - https://learn.microsoft.com/en-us/azure/aks/considerations-pod-sandboxing
          - https://learn.microsoft.com/en-us/azure/aks/use-pod-sandboxing
