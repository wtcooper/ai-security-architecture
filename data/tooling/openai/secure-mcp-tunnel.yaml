# Secure MCP Tunnel — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
#
# Verified 2026-09-10 against developers.openai.com/api/docs/guides/secure-mcp-tunnels and the
# openai/tunnel-client repository. Placed on archEnterpriseAiChat because its job is to let
# ChatGPT connectors (and the Responses API and Codex) reach private MCP servers.
vendor: openai
family: Secure MCP Tunnel
tools:
  - id: toolOpenaiMcpTunnel
    name: Secure MCP Tunnel (tunnel-client)
    surfaceClasses:
      - chatIntegration
    variants:
      - name: tunnel-client (binary and ghcr.io/openai/tunnel-client container)
        class: chatIntegration
        url: https://github.com/openai/tunnel-client
    architecture: archEnterpriseAiChat
    status: ga
    asOf: "2026-09"
    summary:
      - >-
        Secure MCP Tunnel lets a private or localhost MCP server serve ChatGPT developer-mode
        apps, the Responses API and Codex without inbound exposure: a customer-run tunnel-client
        polls api.openai.com (or mtls.api.openai.com) over outbound HTTPS, forwards each request
        to the local stdio or HTTP MCP server, and returns the response through the same tunnel.
      - >-
        The tunnel itself carries no inference; it is the connectivity leg between OpenAI's hosted
        chat and the organisation's tool server, which is why it sits on the enterprise-chat
        architecture. Tunnels are created, rotated and revoked in Platform tunnel settings, are
        scoped to one or more Platform organisations or ChatGPT workspaces, authenticate with a
        runtime API key (CONTROL_PLANE_API_KEY) and optionally mTLS in both directions, and
        support outbound proxies and custom CA bundles.
      - >-
        Audit is split: tunnel.created / updated / deleted appear in Platform audit logs, but
        control-plane tunnel traffic is not emitted as Compliance Platform app events; app-level
        invocation and auth-lifecycle logging still applies when ChatGPT reaches the app through
        the tunnel.
    facts:
      - label: Plans
        value: Platform organisation permissions (Tunnels Read / Read + Manage / Read + Use); ChatGPT developer-mode access is granted separately by workspace admins.
        url: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels
      - label: Inference & routing
        value: No inference; requests are polled from api.openai.com:443 or mtls.api.openai.com:443 and forwarded to the private MCP server.
        url: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels
      - label: Data leaving the device
        value: MCP requests and responses transit OpenAI's control plane; the MCP server address stays private to the tunnel-client environment.
        url: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels
      - label: Docs index
        value: developers.openai.com/api/docs/guides/secure-mcp-tunnels
        url: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels
      - label: Data retention / training
        value: Tunnel traffic is not emitted as Compliance Platform app events; app-level logs apply. API data is not used for training by default.
        url: https://developers.openai.com/api/docs/guides/your-data
    riskNotes:
      - risk: riskCrossTenantCredentialPropagation
        note: A tunnel can be associated with several organisations or workspaces; every association is a tenant that can reach the private server.
      - risk: riskAgenticDelegationConfusedDeputy
        note: The tunnel presents one runtime key; per-user authorization has to happen in the MCP server or the app's auth flow.
      - risk: riskStaleAgentIdentityBinding
        note: Rotation and revocation are manual in Platform tunnel settings; a forgotten tunnel keeps polling.
