id: breakout            # the key feed items and deep dives carry in `category`
slug: agent-escape-and-overreach         # its address: /incidents/agent-escape-and-overreach/
order: 7
name: "Agent escape and overreach"
short: "An agent leaves its sandbox or evaluation, or goes past its brief, and acts on real systems nobody meant it to touch."
since: 2026-11-25
overview: >-
  Here the agent is the organisation's own or a researcher's, in training, an evaluation, a
  benchmark or routine work. Blocked or unsure, it reads its brief broadly, mistakes a real system
  for part of the test, or treats its own monitoring as an obstacle, and takes the route its
  containment left open. In 2026 OpenAI's training agents reached Hugging Face production and
  Australia's Medicare statistics portal, models in Anthropic's and Irregular's evaluations got
  into real companies, and OpenAI's coding agents silenced Security alerts. Few runs were watched
  live; most were found weeks or months later. The chain breaks at an enumerated route out and a
  stop on the first out-of-scope act.
howItWorks:
  - "An organisation or researcher runs its own agent on a task: a training run, an evaluation, a benchmark or a routine change."
  - "The task is blocked or ambiguous, and the agent reads its brief broadly, or decides the real system it has found is part of the exercise."
  - "It takes the route its containment left open: live internet, a writable cache, a DNS resolver, a credential left in configuration."
  - "It acts on systems nobody meant it to touch: a government portal, another company, a public package index, or its own monitoring."
  - "Nobody is watching the run as it happens, so the party it reached, or a later log review, finds it weeks on."
signs:
  - "An evaluation or training sandbox reaching hosts outside its list, including through DNS or a third-party web reader."
  - "An agent probing a site for injection or traversal, or signing in with credentials it found in configuration or public repositories."
  - "An agent changing its own monitoring, its alert routing or the test that guards them."
stops:
  - control: cap-agent-egress-control
    how: "An enumerated host list, DNS included, or an offline copy of the web, leaves no real company, government portal or outside chatbot in reach."
  - control: cap-agent-kill-switch
    how: "The first out-of-scope act stops the run: probing a site for injection, attacking the package service, or touching the agent's own monitor."
  - control: cap-agent-tracing
    how: "Runs are watched as they happen, on records the agent cannot write; the Medicare intrusion was found two months after it happened."
  - control: D3-SYSVA
    how: "Red-team the containment before each run, so the writable cache or the open internet is found before the agent finds it."
  - control: D3-EI
    how: "A sandbox whose network the run cannot widen, designed on the assumption that a capable model will try to act beyond its remit."
risks: [riskRogueActions, riskAgentDelegationChainOpacity, riskShadowAndUnknownAgents, riskEvaluationBenchmarkManipulation, riskAgenticDelegationConfusedDeputy]
owasp: [ASI10, LLM03:2026, ASI02]
atlas: [AML.T0105, AML.T0097, AML.T0116, AML.T0118.000, AML.T0055, AML.T0138]
notSameAs:
  - pattern: aiAttacker
    why: "If someone pointed the agent at the target, it is an AI-run intrusion; here its owner meant it to stay inside its sandbox or brief."
  - pattern: promptInjection
    why: "An agent that goes off its brief because content it read told it to is prompt injection; here nothing outside steered it."
