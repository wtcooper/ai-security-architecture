  - architecture: archTrainingPipeline
    asOf: "2026-10"
    # >>> checked against the vendor's documentation
    verified: "2026-11-18"
    sources:
      upstreamArtifacts: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/model-garden/use-models
      pkgRegistry: https://docs.cloud.google.com/artifact-registry/docs/repositories/remote-overview
      curation: https://docs.cloud.google.com/dataflow/docs/overview
      corpus: https://docs.cloud.google.com/storage/docs/object-versioning
      trainJob: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/training/overview
      storage: https://docs.cloud.google.com/storage/docs/encryption/customer-managed-keys
      evaluation: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/evaluation/introduction
      registry: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/model-registry/introduction
    differences:
      - at: trainJob
        text: "Google's blueprint uses Managed Airflow as its main production orchestrator, with Pipelines as an alternative, and still calls the platform Vertex AI. Choosing Agent Platform Pipelines works, but the blueprint's code and diagrams will not match one-to-one."
        url: https://docs.cloud.google.com/architecture/blueprints/genai-mlops-blueprint
      - at: pkgRegistry->trainJob
        text: "A serverless training job keeps Google-managed internet access by default, even with a Private Service Connect interface, so it can bypass the mirror. Internet is blocked only once the project is inside a VPC Service Controls perimeter. The builder must enforce that perimeter."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/training/psc-i-egress
      - at: corpus->trainJob
        text: "By default training code runs as a shared Google-managed service agent, not a per-pipeline identity. The builder must attach a dedicated service account to every job so it can read only its approved dataset version."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/general/custom-service-account
      - at: trainJob->storage
        text: "A training pipeline can create a Model resource by itself the moment training ends, skipping the candidate bucket and the evaluation gate. The builder should run plain jobs that only write to the bucket and deny the training identity permission to upload models."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/training/create-training-pipeline
      - at: storage->evaluation
        text: "The Gen AI evaluation service scores a model by calling it, not by reading files in a bucket. The builder must first serve the candidate on a temporary test endpoint, or run batch inference, and supply red-teaming tooling separately."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/evaluation-overview
      - at: evaluation->registry
        text: "In Google's blueprint the pipeline itself imports a validated model into Model Registry and a data scientist decides what goes to production. There is no signing step or separate promotion identity; the builder must add both."
        url: https://docs.cloud.google.com/architecture/blueprints/genai-mlops-blueprint
      - at: storage->registry
        text: "Model Registry records a Cloud Storage folder path and a serving container image, not a digest or signature. The builder's promotion step must compute the digest, sign it, and keep both beside the artifact or as labels on the version."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/model-registry/import-model
      - at: upstreamArtifacts->pkgRegistry
        text: "Model Garden lets users tune and deploy open models directly, without passing the mirror. With no organisation policy set, all models and actions are allowed. The builder must set the Model Garden policy to deny or list permitted models."
        url: https://docs.cloud.google.com/vertex-ai/generative-ai/docs/control-model-access
    alsoNeeded:
      - service: "IAM service accounts (training, evaluation, promotion)"
        role: identity
        why: "Separate identities so the training job cannot sign or register its own output."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/general/custom-service-account
      - service: "VPC network, network attachment and Private Service Connect endpoint for Google APIs"
        role: network
        why: "The PSC interface needs a subnet and attachment; inside the perimeter Google APIs resolve through a PSC endpoint."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/training/psc-i-egress
      - service: "Cloud KMS"
        role: keys
        why: "CMEK keys in the same region as training resources, plus the asymmetric signing key."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/general/cmek
      - service: "Secret Manager"
        role: secrets
        why: "Hub tokens and other credentials for intake and training jobs; part of Google's blueprint."
        url: https://docs.cloud.google.com/secret-manager/docs/overview
      - service: "Artifact Registry Docker repository"
        role: registry
        why: "Holds the training, evaluation and pipeline container images; the blueprint stores pipeline containers there."
        url: https://docs.cloud.google.com/artifact-registry/docs/overview
      - service: "Cloud Audit Logs and Cloud Logging"
        role: logging
        why: "Data Access logs for aiplatform.googleapis.com are off by default and must be enabled."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/general/audit-logging
      - service: "Cloud Build"
        role: other
        why: "The blueprint uses it to build containers and deploy pipeline definitions from reviewed branches."
        url: https://docs.cloud.google.com/architecture/blueprints/genai-mlops-blueprint
      - service: "Temporary serving endpoint for candidates"
        role: other
        why: "Gen AI evaluation calls a running model, so each candidate must be served somewhere isolated first."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/evaluation-overview
      - service: "Organization Policy (Model Garden model access)"
        role: other
        why: "Stops users tuning or deploying Model Garden models outside the approved intake path."
        url: https://docs.cloud.google.com/vertex-ai/generative-ai/docs/control-model-access
    quickstart:
      - title: "Build a pipeline"
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/pipelines/build-pipeline
      - title: "Create a serverless training job"
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/training/create-custom-job
    # <<< checked
    reference:
      - title: Build and deploy generative AI and machine learning models in an enterprise
        url: https://docs.cloud.google.com/architecture/blueprints/genai-mlops-blueprint
      - title: "MLOps: Continuous delivery and automation pipelines in machine learning"
        url: https://docs.cloud.google.com/architecture/mlops-continuous-delivery-and-automation-pipelines-in-machine-learning
    summary:
      - >-
        A pipeline orchestrator (Agent Platform Pipelines here; Google's blueprint names Managed Airflow
        as its main production orchestrator) running curation, serverless training, evaluation and
        promotion, with the corpus and candidates in CMEK-encrypted Cloud Storage, every artifact's
        lineage in ML Metadata, and the training projects inside a VPC Service Controls perimeter that
        blocks the job's internet egress. A candidate becomes loadable only when a separate promotion
        identity signs it into Agent Platform Model Registry: Google's enterprise generative AI and ML
        blueprint, with signing added at the gate.
    bindings:
      - { block: upstreamArtifacts, service: "Public hubs and Model Garden", note: "Base checkpoints and frameworks, admitted through the mirror before any job pulls them." }
      - { block: dataOrigins, service: Your content sources, build: true, note: "Internal records in Cloud Storage and BigQuery beside purchased and scraped sets." }
      - block: pkgRegistry
        service: "Artifact Registry remote and virtual repos"
        note: "Python and container dependencies; base checkpoints admitted into a mirror bucket by the same intake gate."
        options:
          - { name: "Artifact Registry remote and virtual repos", kind: commercial, url: "https://docs.cloud.google.com/artifact-registry/docs/repositories/remote-overview", note: "Remote repositories proxy PyPI, npm, Maven and Docker upstreams; a virtual repository gives builds one address.", packs: [googleCloudNative] }
          - { name: "Assured Open Source Software", kind: commercial, url: "https://docs.cloud.google.com/assured-open-source-software/docs/overview", note: "Google-secured, signed builds of over a thousand popular Java, Go, Python and npm packages, with SBOMs and VEX." }
          - { name: "JFrog Artifactory", kind: commercial, url: "https://jfrog.com/reference-architecture/jfrog-saas/", note: "Package and artefact manager as JFrog SaaS in AWS, Azure and Google Cloud regions, or self-hosted." }
          - { name: "Sonatype Nexus Repository", kind: commercial, url: "https://help.sonatype.com/en/blob-stores.html", note: "Self-hosted repository manager whose blob store can be a Google Cloud Storage bucket." }
      - block: curation
        service: "Dataflow with Sensitive Data Protection"
        options:
          - { name: "Dataflow with Sensitive Data Protection", kind: commercial, url: "https://docs.cloud.google.com/dataflow/docs/overview", note: "Apache Beam pipelines that call Sensitive Data Protection to find and de-identify sensitive records.", packs: [googleCloudNative] }
          - { name: "Managed Service for Apache Spark (serverless)", kind: commercial, url: "https://docs.cloud.google.com/managed-spark/docs/serverless-overview", note: "Serverless Spark batches (formerly Serverless for Apache Spark), for curation code already written in Spark." }
      - { block: corpus, service: Cloud Storage (versioned corpus bucket) }
      - block: trainJob
        service: "Agent Platform serverless training"
        note: "Formerly Vertex AI custom training; GKE with GPU node pools is the self-managed alternative."
        options:
          - { name: "Agent Platform serverless training", kind: commercial, url: "https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/training/overview", note: "Any framework in your container, with built-in support for PyTorch, TensorFlow, scikit-learn and XGBoost.", packs: [googleCloudNative] }
          - { name: "Ray Train on the GKE Ray operator", kind: open, url: "https://docs.cloud.google.com/kubernetes-engine/docs/integrations/ai-infra", note: "Google's GKE tutorials train with Ray Train and PyTorch on GPUs, or JAX and MaxText on TPU Trillium.", packs: [openSourceOnGke] }
          - { name: "Kubeflow Trainer on GKE", kind: open, url: "https://www.kubeflow.org/docs/components/trainer/overview/", note: "Kubernetes-native TrainJobs for LLM fine-tuning and distributed training across frameworks; you install and run it." }
          - { name: "Slurm on Cluster Director", kind: commercial, url: "https://docs.cloud.google.com/cluster-director/docs/overview", note: "Google-configured AI and HPC clusters with Slurm orchestration, for teams whose jobs are Slurm scripts." }
      - { block: storage, service: Cloud Storage (candidate bucket) }
      - block: evaluation
        service: "Gen AI evaluation service (Agent Platform), in a pipeline step"
        note: "For tuned generative models, in its own project in front of promotion. Agent Platform model evaluation covers only predictive image and tabular models. Red teaming is builder-supplied."
        options:
          - { name: "Gen AI evaluation service (Agent Platform), in a pipeline step", kind: commercial, url: "https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/evaluation-overview", note: "Evaluates generative models against criteria you set; red teaming is added by the builder.", packs: [googleCloudNative] }
          - { name: "garak", kind: open, url: "https://docs.garak.ai/garak", note: "Open-source LLM vulnerability scanner with probes for prompt injection, jailbreaks, toxicity and data leaks.", packs: [openSourceOnGke] }
          - { name: "promptfoo", kind: open, url: "https://www.promptfoo.dev/docs/red-team/", note: "Open-source red teaming that generates adversarial inputs against a model or app and reports the risk." }
          - { name: "Inspect", kind: open, url: "https://inspect.aisi.org.uk/", note: "UK AI Security Institute's open-source evaluation framework, with 200+ prebuilt evaluations and sandboxed agent tasks." }
      - block: registry
        service: "Agent Platform Model Registry"
        options:
          - { name: "Agent Platform Model Registry", kind: commercial, url: "https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/model-registry/introduction", note: "Versions with aliases such as default say which model is ready for production.", packs: [googleCloudNative] }
          - { name: "MLflow Model Registry", kind: open, url: "https://mlflow.org/docs/latest/ml/model-registry/", note: "Self-run; MLflow's Google Cloud guide puts its server on Cloud Run with Cloud SQL and Cloud Storage.", packs: [openSourceOnGke] }
    # >>> hosting options (compared against the vendor's pages; one is the mapping itself)
    hosting:
      - id: agentPlatformTraining
        kind: runtime
        name: "Gemini Enterprise Agent Platform serverless training"
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/training/overview
        asOf: "2026-11"
        mapped: true
        compare:
          runs: "You submit a training job with your code in a container; Google provisions the machines, runs the code and releases the machines when the job ends."
          patching: "Google manages the compute and maintains its prebuilt training containers; a custom container image is yours to build and keep up to date."
          data: "Data is read from Cloud Storage, BigQuery or NFS shares you name, and your code writes checkpoints and weights to your bucket; the workers are Google-managed."
          network: "A Private Service Connect interface or VPC peering reaches your VPC; internet egress stays Google-managed unless a service perimeter blocks it."
          identity: "Training code runs as the project's Custom Code Service Agent by default, or as a custom service account that you attach to the job."
          accepts: "Any ML framework in a custom container, or prebuilt containers with integrated support for PyTorch, TensorFlow, scikit-learn and XGBoost."
          workload: "GPUs and distributed workers per job; workers can restart after maintenance or errors, so Google advises checkpoints; Spot VMs and Dynamic Workload Scheduler exist."
          portability: "The training container and code run elsewhere unchanged; the job specification, service agents and pipeline wiring are specific to the platform."
          effort: "You operate the training code, container, job specification and quotas; there is no cluster, and Google handles job queuing, logging and monitoring."
          fits: "Google calls it ideal for experimentation and for jobs that do not need assured capacity, with no infrastructure to provision or manage."
        sources:
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/training/overview
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/start/training-methods
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/training/create-custom-job
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/training/containers-overview
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/training/understanding-training-service
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/training/use-spot-vms
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/training/schedule-jobs-dws
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/training/psc-i-egress
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/training/configure-compute
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/general/custom-service-account
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/general/vpc-service-controls
      - id: gke
        kind: cluster
        name: "GKE (Jobs or JobSet with Kueue)"
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/machine-learning
        asOf: "2026-11"
        compare:
          runs: "Your training code runs as Kubernetes Jobs, JobSets or Ray jobs on GPU or TPU node pools in your own cluster; you submit, queue and schedule them."
          patching: "Google upgrades the control plane and auto-upgrades nodes; you maintain the training images and the components you install, such as Kueue."
          data: "Data, checkpoints and weights stay in your buckets or volumes, for example Cloud Storage mounted with the Cloud Storage FUSE CSI driver, on your nodes."
          network: "Jobs run on nodes in your VPC; you choose private nodes, the network policies and the outbound path, so what a job can reach is your configuration."
          identity: "Each Job runs as a Kubernetes ServiceAccount that Workload Identity Federation for GKE maps to IAM roles on the buckets it needs."
          accepts: "Any framework in a container; Google's guides show TensorFlow, JAX and Ray, and Kueue can queue Jobs, JobSets, RayJobs and Kubeflow job kinds."
          workload: "Kueue queues and can preempt jobs against quotas; flex-start nodes run for at most seven days and Spot VMs can be preempted, so checkpointing is yours."
          portability: "Job manifests, images and Kueue configuration move to other Kubernetes clusters; node pool, flex-start and storage driver settings are GKE-specific."
          effort: "You operate the cluster, the GPU node pools and their capacity, the queueing layer, storage mounts and failed jobs, and are on call for them."
          fits: "Google's guidance picks GKE for infrastructure control, training very large models, cost control with Spot and flex-start VMs, and portability."
        sources:
          - https://docs.cloud.google.com/kubernetes-engine/docs/concepts/machine-learning
          - https://docs.cloud.google.com/kubernetes-engine/docs/quickstarts/train-model-gpus-standard
          - https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/mixed-workloads
          - https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/kueue-intro
          - https://docs.cloud.google.com/kubernetes-engine/docs/how-to/provisioningrequest
          - https://docs.cloud.google.com/kubernetes-engine/docs/concepts/dws
          - https://docs.cloud.google.com/kubernetes-engine/docs/add-on/ray-on-gke/concepts/overview
          - https://docs.cloud.google.com/kubernetes-engine/docs/how-to/persistent-volumes/cloud-storage-fuse-csi-driver
          - https://docs.cloud.google.com/kubernetes-engine/docs/concepts/workload-identity
          - https://docs.cloud.google.com/kubernetes-engine/docs/how-to/node-auto-upgrades
          - https://docs.cloud.google.com/kubernetes-engine/docs/concepts/network-isolation
          - https://docs.cloud.google.com/kubernetes-engine/docs/how-to/fqdn-network-policies
          - https://docs.cloud.google.com/kubernetes-engine/docs/how-to/audit-logging
        summary: "Training runs as Kubernetes Jobs or JobSets on GPU node pools in your own GKE cluster, queued by Kueue, reading the corpus and writing candidates through the Cloud Storage FUSE CSI driver. Curation, evaluation, signing and Model Registry stay as mapped. You now carry what serverless training did for you: node pools and GPU capacity, queueing, restarts and checkpoints, node upgrades, the job's identity and its outbound network path."
        bindings:
          - { block: trainJob, service: "Kubernetes Jobs or JobSets on GKE GPU node pools", note: "Queued by Kueue, which you install; flex-start or Spot VMs supply GPUs; buckets are mounted with the Cloud Storage FUSE CSI driver.", url: https://docs.cloud.google.com/kubernetes-engine/docs/quickstarts/train-model-gpus-standard }
        dropSettings: [trainingServiceAccount, trainingPerimeterEgress]
        addSettings: [workloadIdentityGke, gkeNetworkPolicy, fqdnNetworkPolicy, gkeNodeServiceAccount, gkeAuditLogs]
        differences:
          - at: trainJob
            text: "GKE has no managed job service for training. Kueue and JobSet are components you install and upgrade, and Ray is an add-on you enable. Google's GKE training guides cover plain Jobs, JobSet, Ray and Kueue; no Kubeflow Trainer guide was found in Google's documentation, so that controller would be yours to install and support."
            url: https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/kueue-intro
          - at: pkgRegistry->trainJob
            text: "Nothing pins a training Pod to the mirror. What it can reach is set by the cluster: keep nodes private with no Cloud NAT of your own, allow only the Artifact Registry names with FQDN network policies, and keep the projects inside the VPC Service Controls perimeter, because allowing a Google API name also allows other services on the same shared addresses."
            url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/fqdn-network-policies
          - at: corpus->trainJob
            text: "The Cloud Storage FUSE CSI driver mounts whatever bucket the Pod's identity may read. With Workload Identity Federation for GKE that identity is the Job's Kubernetes ServiceAccount: give each pipeline its own, grant it read access to its approved dataset version only, and keep bucket roles off the node service account."
            url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/persistent-volumes/cloud-storage-fuse-csi-driver
          - at: trainJob->storage
            text: "Flex-start nodes run for at most seven days, Spot VMs can be preempted, and Kueue can preempt a low-priority job to admit a higher one. Nothing resumes a job from a checkpoint for you: the training code must write checkpoints to the bucket and restart from the latest one."
            url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/dws
          - at: storage->evaluation
            text: "A Kubernetes Job is not an Agent Platform Pipelines step. The pipeline that runs evaluation and promotion has to launch the Job or wait for it through your own component, and lineage for the training step is recorded in ML Metadata only if that component writes it."
            url: https://docs.cloud.google.com/kubernetes-engine/docs/quickstarts/train-model-gpus-standard
        alsoNeeded:
          - service: "Kueue"
            role: other
            why: "Queues jobs against GPU quota and decides when they start or wait; you install it on the cluster and upgrade it."
            url: https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/kueue-intro
          - service: "Cloud Storage FUSE CSI driver"
            role: other
            why: "Mounts the corpus and candidate buckets into training Pods; it is enabled on the cluster."
            url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/persistent-volumes/cloud-storage-fuse-csi-driver
          - service: "Workload Identity Federation for GKE"
            role: identity
            why: "Gives each Job an IAM principal of its own in place of the custom service account attached to a serverless job."
            url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/workload-identity
          - service: "Flex-start provisioning mode (Dynamic Workload Scheduler)"
            role: other
            why: "Obtains scarce GPUs for a bounded run of up to seven days; serverless training found capacity for you."
            url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/dws
        quickstart:
          - title: "Quickstart: Train a model with GPUs on GKE Standard mode"
            url: https://docs.cloud.google.com/kubernetes-engine/docs/quickstarts/train-model-gpus-standard
          - title: "Optimize GKE resource utilization for mixed AI/ML training and inference workloads"
            url: https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/mixed-workloads
          - title: "Deploy a batch system using Kueue"
            url: https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/kueue-intro
      - id: agentPlatformTuning
        kind: managed
        name: "Gemini Enterprise Agent Platform open model tuning (managed tuning)"
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/tuning/open-model-tuning
        asOf: "2026-11"
        compare:
          runs: "Google runs the fine-tuning as a managed tuning job; you supply a base model, a JSONL dataset in Cloud Storage and a few settings such as epochs."
          patching: "Google operates and maintains the tuning infrastructure and training code; there is no image or node for you to patch."
          data: "Training data is read from your Cloud Storage bucket; the tuned safetensors weights and up to 10 checkpoints are written to your output bucket."
          network: "Open model tuning is on the list of Agent Platform features that VPC Service Controls supports; the tuning page describes no other network setting."
          identity: "Jobs run under Google-managed service agents, which need access to your buckets; the tuning page names no way to attach your own service account."
          accepts: "Listed Gemma, MedGemma, Llama, Qwen and GLM models, or a checkpoint of the same architecture; full fine-tuning, LoRA or distillation, depending on the model."
          workload: "Google picks the capacity, with the global endpoint recommended; a project can run one tuning job at a time by default, raised by a quota request."
          portability: "Tuned weights land in your bucket as safetensors files and can be exported and deployed elsewhere; the tuning job definition is not portable."
          effort: "You prepare datasets, start jobs, watch quota and the cost per training token, and evaluate the result; no training infrastructure is yours."
          fits: "Google documents it for supervised fine-tuning or distillation of supported open models, and advises distillation when a much stronger teacher model exists."
        sources:
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/tuning/open-model-tuning
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/tuning
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/general/vpc-service-controls
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/model-garden/deploy-models-with-custom-weights
        offers:
          - name: "Supervised fine-tuning"
            what: "Full fine-tuning or Low-Rank Adaptation (LoRA), depending on the model, for the listed open models, which include Gemma, Llama, Qwen and GLM variants."
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/tuning/open-model-tuning
          - name: "Distillation fine-tuning"
            what: "A teacher model, listed as GLM 5.2 MaaS, generates responses and a smaller Qwen 3 or Gemma 3 student model is tuned on them, through the Gen AI SDK."
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/tuning/open-model-tuning
          - name: "Tuning from a custom checkpoint"
            what: "A job can start from a custom checkpoint or a previously tuned model that has the same architecture as one of the supported base models."
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/tuning/open-model-tuning
          - name: "Tuned model artefacts"
            what: "The final weights and at most 10 intermediate checkpoints are stored as safetensors files in your Cloud Storage output directory."
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/tuning/open-model-tuning
          - name: "Deployment of the tuned model"
            what: "The tuned model can be deployed to an Agent Platform endpoint through Model Garden's Deploy model with custom weights, a Preview feature, or exported from Cloud Storage and deployed elsewhere."
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/tuning/open-model-tuning
          - name: "Managed tuning in the console"
            what: "The Fine tune button on a model card offers Managed tuning, and the Tuning page has Create tuned model."
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/tuning/open-model-tuning
