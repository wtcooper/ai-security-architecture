# Controls guidance for the enterprise AI chat archetype. Audience: admins, architects and
# security teams. This is a use pattern: the product is the vendor's, so the controls are the
# tenant configuration you author plus the inspection you run independently of the vendor.
# The build's derivation check fails this document if its cited capabilities stop being pinned.
archetype: archEnterpriseAiChat
mode: use
status: draft
attribution: >-
  Authored in this repository. Pattern-level by design; incidents are cited, vendors are not
  named in the items.

overview:
  - >-
    The organisation's exposure here is a sum nobody computes by default: thousands of
    individually reasonable connector grants, a file-upload path no connector governance
    sees, and a consumer version of the same product one session cookie away. The controls
    split cleanly into two halves — the vendor tenant you configure, and the edge and browser
    telemetry you own — and the second half matters more, because it covers the consumer
    product the vendor's console cannot see and the upload path before anything leaves.
  - >-
    One material change to re-review against: these products are agents now. The same
    standing grants that powered retrieval also carry write actions — mail sent, files
    changed, tickets moved — through vendor-side agent modes, scheduled tasks and code
    execution. The documented incident class is zero-click: content in a connected mailbox or
    drive steers the assistant into exfiltrating without the user clicking anything.

items:
  - title: Restrict the tenant at the edge, or the enterprise terms are optional
    mitigations: [D3-OTF, D3-APA, cap-data-access-governance, D3-DI]
    body:
      - >-
        Everything the enterprise agreement promises — retention, training opt-out, audit
        export — applies only to traffic that reaches the managed tenant. Tenant restriction
        enforced at the secure edge is what stops the consumer product being an alternative;
        without it, the crossing simply succeeds and corporate data leaves under consumer
        terms, invisibly. Identity establishes who is licensed and which tenant they may
        reach; the edge blocks or logs everything else. A hostname allowlist cannot tell the
        two tenants apart at the same host — that takes the vendor's tenant-restriction
        header, injected by a proxy that inspects TLS for the client in use, or a managed
        browser. Test a personal session to the same host.

  - title: Inspect the upload path, because nothing else can
    mitigations: [cap-sensitive-data-redaction]
    body:
      - >-
        A pasted or uploaded document crosses the boundary with no connector and no grant —
        every control that watches connectors misses it entirely. Inspect it at submission:
        endpoint or managed-browser DLP that blocks or masks a hit before the request is sent.
        Whether the network edge can also read it depends on the client and on TLS inspection
        being supported for it, so test the client you deploy with pasted text and uploaded
        files. The vendor's audit export may record the exchange afterwards, with coverage and
        retention that vary by plan; the endpoint record is the one you control.

  - title: Gate the agent modes and write-capable connectors deliberately
    mitigations: [cap-ai-vendor-assessment, AML.M0029, cap-input-guardrails]
    body:
      - >-
        Own tenant configuration as living policy, re-reviewed every time the vendor ships a
        connector or an agent capability — the default for new ones is rarely off. Write
        actions get the strictest treatment the vendor offers: admin-gated per app and per
        action, with confirmation required on writes; the vendor ships the toggles, and
        leaving them at default is the decision not to use them. On our own tools, the gateway
        refuses a write without approval bound to the exact action; that approval is relayed
        through the vendor's client, so confirm per client that it is supported, and fail
        closed where it is not. Treat connector-retrieved content as untrusted in policy and
        user guidance: the vendor's own guardrails are assured, not configured, and the
        zero-click incident record says they are not sufficient alone; records returning
        through our gateway are screened there.

  - title: Inventory and revoke standing grants, and classify before connecting
    mitigations: [cap-agent-tool-registry, cap-agent-kill-switch, cap-data-access-governance, D3-APA, D3-DI]
    body:
      - >-
        Standing OAuth grants authorize the vendor's client on a person's behalf and can
        outlive that person: inventory them, expire them where the vendor allows, and revoke
        them when the employee or project goes — the broker keeps calling on grants issued for
        projects that ended. Govern by classification which systems may be connected at all, so
        individual consent cannot outrun policy, and know what sensitive data sits inside
        connector reach before the grants aggregate it — an assistant makes pre-existing
        oversharing instantly discoverable.

  - title: Assess once, then watch the tenant continuously
    mitigations: [cap-ai-vendor-assessment, cap-agent-tool-registry]
    body:
      - >-
        The point-in-time assessment — retention terms, tenancy, subprocessors, the controls
        behind the allowlist entry — is the admission ticket; the standing control is
        continuous posture over the tenant: configuration drift detection, the vendor's audit
        stream ingested as it changes, and the connector inventory kept current across both
        the admin-granted corpora and the user-granted long tail. A tenant reviewed once and
        watched never is a tenant whose controls are whatever the last admin left behind.

  - title: Hold the crossing's keys, and scope what the product may reach
    mitigations: [ D3-CH, AML.M0028 ]
    body:
      - >-
        The tunnel host's runtime credential is the load-bearing secret on the one path we run
        — issued short-lived, rotated, and revocable without a redeploy, with the host
        patched and monitored like the crossing it is. Our gateway decides which MCP servers
        the product may reach and on whose grant.

  - title: Fuse the vendor's audit with your own, and hunt the shadow traffic
    mitigations: [AML.M0024, cap-shadow-ai-discovery, cap-agent-kill-switch]
    body:
      - >-
        The vendor's export covers the managed tenant, as far as its fields and
        retention go; your edge and browser telemetry cover the consumer product it will
        never see and the uploads before they leave — only the fused record answers what
        actually left. Run discovery for personal-account and competitor traffic
        independently of the vendor: it is usually the larger flow, and it is the
        population the sanctioned tenant exists to absorb.

sources:
  - title: "EchoLeak (CVE-2025-32711) — zero-click prompt-injection exfiltration through an enterprise copilot"
    url: https://thehackernews.com/2025/06/zero-click-ai-vulnerability-exposes.html
  - title: "ShadowLeak — service-side zero-click exfiltration via a chat agent's connectors"
    url: https://thehackernews.com/2025/09/shadowleak-zero-click-flaw-leaks-gmail.html
  - title: "CoSAI Shared Responsibility Framework V1.0 — AI-enabled SaaS operating model"
    url: https://www.coalitionforsecureai.org/wp-content/uploads/2026/05/CoSAI-Shared-Responsibility-Framework.pdf
