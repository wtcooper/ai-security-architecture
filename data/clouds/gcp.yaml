  # >>> managed agent service mapping (checked against the vendor's pages by two people)
  - architecture: archCloudManagedAgent
    asOf: "2026-11"
    verified: "2026-11-18"
    reference:
      - title: "Multi-agent private networking patterns in Google Cloud"
        url: https://docs.cloud.google.com/architecture/multi-agent-private-networking-patterns
    summary:
      - "On Google Cloud the pattern is built on Agent Runtime, a ReasoningEngine resource in your project that runs agent code you deploy. Each agent gets its own Agent Identity. Its outbound calls are forced through Agent Gateway, whose proxy Google hosts, and into your VPC over a Private Service Connect network attachment. Inbound, the Agent Platform API is closed with VPC Service Controls. Sessions and Memory Bank stay in the service under your Cloud KMS key, and organisation policy and Cloud Logging hold the baseline and the record."
    bindings:
      - { block: entry, service: "Cloud Run front end behind Identity-Aware Proxy", build: true, note: "Your application signs users in, then calls the agent's query or streamQuery method on the Agent Platform API as its own service account. A Client-to-Agent Agent Gateway can screen that call." }
      - { block: agentDef, service: "Agent code and runtime config (ADK, Terraform)", build: true, note: "The definition is your agent code or container plus the instance config: identity_type, encryption_spec, psc_interface_config and agent_gateway_config. Your pipeline deploys it." }
      - { block: memory, service: "Agent Platform Sessions and Memory Bank", note: "Child resources of the Agent Runtime instance in your project, reached through the Agent Platform API. Your key covers them only when the instance was created with encryption_spec." }
      - { block: aiGateway, service: "Agent Gateway (Agent-to-Anywhere, Google-managed)", note: "You own the gateway resource, the Agent Registry entries and the access policies; Google hosts the proxy. A connectivity template sends its egress into your VPC through a network attachment." }
      - { block: internalTools, service: "MCP servers on Cloud Run or GKE, internal ingress", build: true, note: "Your tool servers, registered in Agent Registry and reached from the gateway through the network attachment. Ingress is set to internal so they have no route from the internet." }
      - { block: orgData, service: "BigQuery, Cloud SQL, Cloud Storage, Agent Search", note: "Systems of record behind your tool servers. Access is enforced in each store: IAM on the agent identity or the user's delegated token, row-level security, and data store access control." }
      - { block: managedRuntime, service: "Agent Runtime (ReasoningEngine resource)", note: "Runs your agent code or container on Google-managed infrastructure outside your VPC. The loop is the code you deploy (ADK, LangGraph or custom), not a harness that Google supplies." }
      - { block: nativeTools, service: "Agent Platform sandboxes; Gemini built-in tools", note: "Code Execution, Shell and Computer Use sandboxes run under gVisor in a Google tenant project. Grounding and model code execution are tools of the Gemini API call, not of the runtime." }
      - { block: vendorTools, service: "Google Cloud remote MCP servers", note: "Google-hosted MCP servers for Google and Google Cloud services, controlled with IAM and managed in Agent Registry. Calls from an agent bound to an egress gateway still cross Agent Gateway." }
      - block: openWeb
        service: "Grounding with Google Search; URL context"
        note: "Web tools of the model call. The search runs inside Google's service, and Grounding with Google Search supports neither VPC Service Controls nor CMEK. Organisation policy can disable it."
        options:
          - { name: "Grounding with Google Search; URL context", kind: commercial, url: "https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/grounding/grounding-with-google-search", note: "Web tools of the Gemini call; Google runs the search and the fetch inside its service.", packs: [googleCloudNative] }
          - { name: "Web Grounding for Enterprise", kind: commercial, url: "https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/grounding/web-grounding-enterprise", note: "A subset of Google's web index for regulated industries: no customer data logged, VPC Service Controls supported." }
          - { name: "Grounding with Parallel Web Search", kind: commercial, url: "https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/grounding/grounding-with-parallel", note: "Parallel Web Systems' LLM-optimised web index behind Gemini, a Separate Offering under your Google Cloud agreement." }
          - { name: "Grounding with your search API", kind: commercial, url: "https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/grounding/grounding-with-your-search-api", note: "Gemini queries an external search endpoint you provide, so any search service can ground its answers." }
    sources:
      entry: https://docs.cloud.google.com/run/docs/securing/identity-aware-proxy-cloud-run
      agentDef: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/use-terraform
      memory: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sessions
      aiGateway: https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/gateways/agent-gateway-managed-overview
      internalTools: https://docs.cloud.google.com/run/docs/securing/ingress
      orgData: https://docs.cloud.google.com/bigquery/docs/row-level-security-intro
      managedRuntime: https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/runtime
      nativeTools: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sandbox
      vendorTools: https://docs.cloud.google.com/mcp/overview
      openWeb: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/grounding/grounding-with-google-search
    differences:
      - at: managedRuntime
        text: "You supply the loop. Agent Runtime hosts agent code or a container you deploy (ADK, LangGraph, custom), so tool-call decisions and retries are your code, not the provider's. The configuration-only Managed Agents API (Agents and Interactions APIs on the Antigravity harness) is Pre-GA, and Google says not to use it for production or with sensitive data."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/managed-agents
      - at: aiGateway
        text: "The gateway on the agent's path is Agent Gateway, and Google hosts its proxy: you own the gateway resource, the Agent Registry entries and the access policies, not the machine. Egress is default deny once an agent is bound, and a custom organisation policy constraint can require the binding. All agents in one project and region must share one egress gateway."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/agent-gateway-runtime-deploy
      - at: managedRuntime->aiGateway
        text: "Inference is not kept off the gateway. Agent code calls the model, Sessions and Memory Bank through the Agent Platform API, so once an enforcing gateway is bound those calls cross it too and must be allowlisted, or invocations fail with a 498 error. With no gateway, Private Service Connect interface or perimeter, the runtime has internet access by default."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/agent-gateway-runtime-deploy
      - at: entry->managedRuntime
        text: "An agent has no private endpoint of its own. It is invoked through the Agent Platform API, which is reachable from the internet by default with IAM as the only gate. A Private Service Connect endpoint for Google APIs or Private Google Access adds a private route but leaves the public one open; only a VPC Service Controls perimeter around the project blocks it."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/general/vpc-service-controls
      - at: memory
        text: "State is not in stores you bring. Sessions and Memory Bank are child resources of the Agent Runtime instance, kept by the service. Your Cloud KMS key covers them only if encryption_spec was set when the instance was created, and never on the global endpoint. The key cannot be changed later, and display names, descriptions and environment variables stay on Google's keys."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sessions
      - at: nativeTools->openWeb
        text: "Grounding with Google Search is a tool of the model call and runs on Google's side. It supports none of data residency at rest, CMEK, VPC Service Controls or Access Transparency, and Google keeps query logs for up to three days. Organisation policy can disable it or limit grounding sources. Web Grounding for Enterprise supports VPC Service Controls and stores no customer data."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/security-controls
      - at: nativeTools
        text: "Sandboxes run in a Google tenant project under gVisor without the agent's credentials. Code Execution has no network access. Other sandbox templates have no domain allowlist: internet_access without a network attachment is unrestricted egress to public addresses, and filtering by domain needs a Private Service Connect interface into your VPC and controls there."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sandbox/configure-vpc-sc
      - at: agentDef->managedRuntime
        text: "Cloud policy on the deploy call is thinner than drawn. Custom constraints on the ReasoningEngine resource are in Preview and skip existing agents. There is no public-endpoint setting to refuse. Location restriction is not enforced through the REST API or Gen AI SDKs, so Google points to the Restrict endpoint usage constraint. Revisions and traffic splitting are Preview."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/predictions/custom-constraints
    alsoNeeded:
      - service: "Identity and Access Management (Agent Identity)"
        role: identity
        why: "Issues each agent's principal and holds the allow, deny and Principal Access Boundary policies on it, and the roles of the application and the pipeline."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/agent-identity-overview
      - service: "Identity-Aware Proxy"
        role: ingress
        why: "Signs users in at the front end. It is also the engine that evaluates Agent Gateway's access policies on each outbound call."
        url: https://docs.cloud.google.com/run/docs/securing/identity-aware-proxy-cloud-run
      - service: "VPC network with Private Service Connect and Cloud DNS"
        role: network
        why: "Holds the network attachment the runtime and gateway egress through, the endpoint for Google APIs the application calls, and the private zones both resolve."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/private-service-connect-interface
      - service: "VPC Service Controls"
        role: network
        why: "The only control that blocks public access to the Agent Platform API. A perimeter also blocks the runtime's default internet access."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/general/vpc-service-controls
      - service: "Cloud Key Management Service"
        role: keys
        why: "Holds the single-region key named in encryption_spec, kept in a separate project so that disabling it cuts off the agent's stored data."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/general/cmek
      - service: "Secret Manager"
        role: secrets
        why: "Holds API keys and OAuth client secrets that agent code references, where the Agent Identity auth manager is not used for a tool."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/manage-agent-access
      - service: "Agent Registry"
        role: registry
        why: "The catalogue of agents, MCP servers and endpoints that Agent Gateway checks before it lets a call out; access policies are written against its entries."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/agent-registry
      - service: "Artifact Registry"
        role: registry
        why: "Holds the container images you bring for agents and custom sandboxes. Inside a perimeter, source-based deployments also need an ingress rule to Artifact Registry for the runtime service agent."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/runtime/setup
      - service: "Cloud Logging and Cloud Trace"
        role: logging
        why: "why: Receive Cloud Audit Logs, Agent Gateway request logs, runtime stdout and stderr logs and OpenTelemetry traces. Google's audited-operations list names sessions, memories and sandboxes but no reasoningEngines method."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/optimize/observability/overview
      - service: "Organization Policy Service"
        role: other
        why: "Holds the constraints that refuse unapproved models, regions, grounding sources, keyless storage and agent configurations before a deployment exists."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/predictions/custom-constraints
      - service: "Model Armor"
        role: other
        why: "Screens prompts, tool responses and model payloads that pass Agent Gateway, through templates you attach to the gateway."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/configure-model-armor
    quickstart:
      - title: "Set up the environment (Agent Runtime)"
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/runtime/setup
      - title: "Route Agent Runtime traffic through Agent Gateway"
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/agent-gateway-runtime-deploy
      - title: "Using Private Service Connect interface with Agent Runtime"
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/private-service-connect-interface
    settings: [iapCloudRun, disableSaKeyCreation, agentRegistry, agentEvaluation, sessionsTtl, agentSearchAccessControl, vpcServiceControls, pscGoogleApisEndpoint, vpcScAgentPerimeterRules, attachmentSubnetFirewall, toolServiceInternalIngress, swpAgentRuntimeEgress, cloudKmsAgentKey, restrictNonCmekServices, agentArtifactsCmek, resourceLocationsEndpointUsage, allowedModelsConstraint, groundingSourcesConstraint, saApiKeyBindings, agentLogSink, agentPlatformVendorReview, bigQueryRowLevelSecurity]
  # <<< managed agent service mapping
  # >>> software factory mapping (checked against the vendor's pages by two people)
  - architecture: archSoftwareFactory
    asOf: "2026-11"
    verified: "2026-11-21"
    reference:
      - title: "Deploy an enterprise developer platform on Google Cloud"
        url: https://docs.cloud.google.com/architecture/blueprints/enterprise-application-blueprint
      - title: "Single-agent AI system using ADK and Cloud Run"
        url: https://docs.cloud.google.com/architecture/single-agent-ai-system-adk-cloud-run
      - title: "Choose your agentic AI architecture components"
        url: https://docs.cloud.google.com/architecture/choose-agentic-ai-architecture-components
    summary:
      - >-
        On Google Cloud the factory runs in its own projects: a chat front end on Cloud Run (ADK in
        Google's reference) behind Identity-Aware Proxy, the coding agent as a Cloud Run job per app
        whose commands run in Cloud Run sandboxes (Preview), an AI gateway (Apigee here) in front of
        Gemini on Agent Platform, Artifact Registry as the mirror, source control and CI (Secure Source
        Manager and Cloud Build here; GitHub or GitLab through Developer Connect also serve) with Binary
        Authorization, and Cloud Deploy for the owner's approval and canary. Each app gets its own
        project, Cloud Run service with IAP, Cloud SQL store and secrets.
    bindings:
      - { block: intake, service: "ADK agent on Cloud Run behind IAP", build: true, builtWith: "Agent Development Kit (ADK)", note: "Your chat front end: IAP admits the factory's user groups, Model Armor screens each request and upload, and the confirmed spec is stored with the app's record.", url: https://docs.cloud.google.com/architecture/single-agent-ai-system-adk-cloud-run }
      - block: previews
        service: "Cloud Run revisions in a preview project"
        note: "Each branch deploys with --no-traffic and a tag to a preview service whose IAP access lists only the requester and owner, on test data with no connector grants."
        url: https://docs.cloud.google.com/run/docs/rollouts-rollbacks-traffic-migration
        options:
          - { name: "Cloud Run revisions in a preview project", kind: commercial, url: "https://docs.cloud.google.com/run/docs/rollouts-rollbacks-traffic-migration", note: "Each branch deploys with --no-traffic and a tag, so only its tagged URL serves it.", packs: [googleCloudNative] }
          - { name: "GitLab review apps", kind: commercial, url: "https://docs.gitlab.com/ci/review_apps/", note: "An environment per merge request from GitLab CI, in every GitLab tier.", packs: [gitlabGoogleCloud] }
          - { name: "Argo CD ApplicationSet Pull Request generator", kind: open, url: "https://argo-cd.readthedocs.io/en/stable/operator-manual/applicationset/Generators-Pull-Request/", note: "Generates an Argo CD Application for each open pull request on your Git host, deployed to GKE.", packs: [openSourceOnGke] }
      - block: deployGate
        service: "Cloud Deploy pipeline to Cloud Run"
        note: "Takes releases the pipeline creates, holds the production rollout for the owner's approval, runs a canary and rolls back to the last release that succeeded."
        url: https://docs.cloud.google.com/deploy/docs/promote-release
        options:
          - { name: "Cloud Deploy pipeline to Cloud Run", kind: commercial, url: "https://docs.cloud.google.com/deploy/docs/promote-release", note: "requireApproval on a target holds each rollout until an approver acts; deploys to Cloud Run and GKE.", packs: [googleCloudNative] }
          - { name: "Argo CD with Argo Rollouts", kind: open, url: "https://argoproj.github.io/argo-rollouts/", note: "GitOps sync to GKE with canary and blue-green rollouts that can wait for a manual judgement.", packs: [openSourceOnGke] }
          - { name: "GitLab protected environments with deployment approvals", kind: commercial, url: "https://docs.gitlab.com/ci/environments/deployment_approvals/", note: "Required approvals before a deployment to a protected environment runs; Premium and Ultimate tiers.", packs: [gitlabGoogleCloud] }
          - { name: "GitHub environments with required reviewers", kind: commercial, url: "https://docs.github.com/en/actions/how-tos/deploy/configure-and-manage-deployments/manage-environments", note: "Up to six reviewers hold a deployment job; on private repositories required reviewers need GitHub Enterprise.", packs: [githubGoogleCloud] }
      - { block: harness, service: "Agent as a Cloud Run job", build: true, note: "One execution per build under that app's agent service account. Any coding agent that runs headless serves: for example Google's Antigravity CLI with Agent Platform credentials, Gemini CLI, Claude Code, or one you build with ADK.", url: https://docs.cloud.google.com/run/docs/ai-agents }
      - { block: nativeTools, service: "Cloud Run sandboxes (Preview)", note: "Every shell command, build and test runs through the sandbox command: no host variables, secrets or metadata server, and no egress unless the harness allows it.", url: https://docs.cloud.google.com/run/docs/code-execution }
      - block: gateway
        service: "Apigee model and tool proxies"
        note: "Apigee calls Gemini as its own service account, so the agent holds no model key; skills ship in the agent image. Agent Gateway on Cloud Run is a gated Preview for allowlisted projects."
        url: https://docs.cloud.google.com/apigee/docs/api-platform/security/google-auth/overview
        options:
          - { name: "Apigee model and tool proxies", kind: commercial, url: "https://docs.cloud.google.com/apigee/docs/api-platform/get-started/ai-capabilities", note: "Apigee calls Gemini as its own service account, so the agent holds no model key; MCP proxies front the tools.", packs: [googleCloudNative] }
          - { name: "Agent Gateway with Model Armor", kind: commercial, url: "https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/gateways/agent-gateway-overview", note: "Google's references draw it: Google-managed for Agent Runtime, Preview on GKE, Limited Preview on Cloud Run; token budgets not yet available.", packs: [agentPlatformGovernance] }
          - { name: "LiteLLM Proxy on GKE or Cloud Run", kind: open, url: "https://docs.litellm.ai/docs/proxy/deploy/cloud/gcp", note: "Vertex AI provider, MCP and A2A gateways, keys per team; LiteLLM documents Cloud Run and GKE layouts. JWT sign-in needs Enterprise.", packs: [openSourceOnGke] }
          - { name: "Kong AI Gateway", kind: commercial, url: "https://developer.konghq.com/ai-gateway/ai-providers/gemini/", note: "Calls Gemini on Agent Platform with GCP credentials; AI MCP Proxy (3.12+) and A2A Proxy (3.14+) need AI Gateway Enterprise.", packs: [kongAiGateway] }
          - { name: "agentgateway", kind: open, url: "https://agentgateway.dev/", note: "Linux Foundation project started by Solo.io: one data plane for LLM, MCP and A2A traffic, with Gemini and Vertex providers." }
      - block: registry
        service: "Artifact Registry remote repositories"
        note: "The sandbox reads a virtual repository of admitted packages; remote repositories proxy PyPI and npm for your intake job only."
        url: https://docs.cloud.google.com/artifact-registry/docs/repositories/virtual-overview
        options:
          - { name: "Artifact Registry remote repositories", kind: commercial, url: "https://docs.cloud.google.com/artifact-registry/docs/repositories/remote-overview", note: "Remote repositories proxy PyPI, npm, Maven and Docker upstreams; a virtual repository gives builds one address.", packs: [googleCloudNative] }
          - { name: "Assured Open Source Software", kind: commercial, url: "https://docs.cloud.google.com/assured-open-source-software/docs/overview", note: "Google-secured, signed builds of over a thousand popular Java, Go, Python and npm packages, with SBOMs and VEX." }
          - { name: "JFrog Artifactory", kind: commercial, url: "https://jfrog.com/reference-architecture/jfrog-saas/", note: "Package and artefact manager as JFrog SaaS in AWS, Azure and Google Cloud regions, or self-hosted." }
          - { name: "Sonatype Nexus Repository", kind: commercial, url: "https://help.sonatype.com/en/blob-stores.html", note: "Self-hosted repository manager whose blob store can be a Google Cloud Storage bucket." }
      - block: sourceControl
        service: "Secure Source Manager (private instance)"
        note: "One repository per app from the template. The agent pushes branches with a custom role that lacks merge; branch rules and secret scanning guard the default branch."
        url: https://docs.cloud.google.com/secure-source-manager/docs/overview
        options:
          - { name: "Secure Source Manager (private instance)", kind: commercial, url: "https://docs.cloud.google.com/secure-source-manager/docs/overview", note: "Regional, single-tenant Git hosting on Google Cloud; its triggers file starts Cloud Build.", packs: [googleCloudNative] }
          - { name: "GitHub via Developer Connect", kind: commercial, url: "https://docs.cloud.google.com/developer-connect/docs/connect-github-repo", note: "Repositories linked to Google Cloud through Developer Connect, which can trigger builds and Cloud Run deploys on commit.", packs: [githubGoogleCloud] }
          - { name: "GitLab via Developer Connect", kind: commercial, url: "https://docs.cloud.google.com/developer-connect/docs/connect-gitlab", note: "GitLab repositories connected through Developer Connect; GitLab's own Google Cloud integration adds keyless CI access.", packs: [gitlabGoogleCloud] }
          - { name: "Bitbucket", kind: commercial, url: "https://docs.cloud.google.com/build/docs/overview", note: "Cloud Build triggers integrate with Bitbucket repositories as well as GitHub." }
      - block: pipeline
        service: "Cloud Build private pool"
        note: "An SSM push webhook starts a trigger whose inline config builds, tests, scans, deploys the preview and signs the attestation. It is the only identity that creates releases."
        url: https://docs.cloud.google.com/build/docs/triggers
        options:
          - { name: "Cloud Build private pool", kind: commercial, url: "https://docs.cloud.google.com/build/docs/overview", note: "Private, dedicated worker pools in a private network, hosted and scaled by Google.", packs: [googleCloudNative] }
          - { name: "GitHub Actions with Workload Identity Federation", kind: commercial, url: "https://docs.cloud.google.com/iam/docs/workload-identity-federation-with-deployment-pipelines", note: "Workflows exchange their OIDC token for short-lived Google credentials, so no service account key is stored.", packs: [githubGoogleCloud] }
          - { name: "GitLab CI with Workload Identity Federation", kind: commercial, url: "https://docs.gitlab.com/integration/google_cloud_iam/", note: "Jobs reach Google Cloud with OIDC tokens and no keys; on GitLab.com the integration also provisions runners.", packs: [gitlabGoogleCloud] }
      - { block: appTenant, service: "One project per app", note: "Here the factory creates a project per app with its own VPC, service accounts, secrets and store, and organisation policies on the folder set the baseline every app inherits. Per-app service accounts, IAM and VPCs inside shared projects is the other way; isolation rests on per-app IAM either way.", url: https://docs.cloud.google.com/resource-manager/docs/cloud-platform-resource-hierarchy }
      - block: appHosting
        service: "Cloud Run service with IAP enabled"
        note: "IAP signs users in on every ingress path. The app runs as its own service account, reads pinned secrets and sends all outbound traffic into its own VPC."
        url: https://docs.cloud.google.com/run/docs/securing/identity-aware-proxy-cloud-run
        options:
          - { name: "Cloud Run service with IAP enabled", kind: commercial, url: "https://docs.cloud.google.com/run/docs/securing/identity-aware-proxy-cloud-run", note: "IAP enabled directly on the Cloud Run service signs users in on every ingress path.", packs: [googleCloudNative] }
          - { name: "GKE behind IAP", kind: commercial, url: "https://docs.cloud.google.com/iap/docs/enabling-kubernetes-howto", note: "Deployments behind a GKE Ingress with IAP, for generated apps that need Kubernetes features." }
      - block: appData
        service: "Cloud SQL for PostgreSQL, per app"
        note: "An instance in the app's project, private IP only, encrypted with a per-app key from your key project, and deleted or archived with the project."
        url: https://docs.cloud.google.com/sql/docs/postgres/cmek
        options:
          - { name: "Cloud SQL for PostgreSQL, per app", kind: commercial, url: "https://docs.cloud.google.com/sql/docs/postgres/introduction", note: "A managed PostgreSQL instance in each app's project, private IP only.", packs: [googleCloudNative] }
          - { name: "AlloyDB for PostgreSQL", kind: commercial, url: "https://docs.cloud.google.com/alloydb/docs/overview", note: "Fully managed, PostgreSQL-compatible database, with AlloyDB AI for vector search in generative AI apps." }
          - { name: "Firestore", kind: commercial, url: "https://docs.cloud.google.com/firestore/native/docs/overview", note: "Serverless document database, with no instance to size for each app." }
          - { name: "PostgreSQL on GKE (CloudNativePG)", kind: open, url: "https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/deploy-pgvector", note: "An operator-run PostgreSQL cluster per app, as Google's GKE tutorial deploys it; you own backups and upgrades.", packs: [openSourceOnGke] }
      - { block: orgData, service: "Systems of record via connector proxies", build: true, note: "Each app's service account may invoke only the connector deployments approved for it; the backends filter by the signed-in user's entitlements.", url: https://docs.cloud.google.com/apigee/docs/api-platform/security/iam/iam-overview }
      - block: provider
        service: "Gemini and partner models"
        note: "Reached only by the gateway's service account. The vertexai.allowedModels constraint limits which models any project in the factory may call."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/control-model-access
        options:
          - { name: "Gemini and partner models", kind: commercial, url: "https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/control-model-access", note: "Gemini and partner models such as Claude, reached only by the gateway; vertexai.allowedModels limits the choice.", packs: [googleCloudNative] }
          - { name: "Open models as a service (MaaS)", kind: commercial, url: "https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/maas/use-open-models", note: "Serverless open models from Model Garden, for example DeepSeek, Gemma, GLM, gpt-oss and Llama, on Agent Platform endpoints." }
          - { name: "Self-hosted open model on GKE (vLLM)", kind: open, url: "https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/serve-gemma-gpu-vllm", note: "An open-weight model you serve yourself, as the self-hosted inference pattern draws; Google's GKE tutorials use vLLM.", packs: [openSourceOnGke] }
      - { block: sources, service: "PyPI, npm and other public upstreams", note: "Remote repositories need internet-reachable upstreams; inside a VPC Service Controls perimeter they reach them only after you allow it for that location.", url: https://docs.cloud.google.com/artifact-registry/docs/repositories/remote-overview }
    sources:
      intake: https://docs.cloud.google.com/architecture/single-agent-ai-system-adk-cloud-run
      previews: https://docs.cloud.google.com/run/docs/rollouts-rollbacks-traffic-migration
      deployGate: https://docs.cloud.google.com/deploy/docs/promote-release
      harness: https://docs.cloud.google.com/run/docs/ai-agents
      nativeTools: https://docs.cloud.google.com/run/docs/code-execution
      gateway: https://docs.cloud.google.com/apigee/docs/api-platform/security/google-auth/overview
      registry: https://docs.cloud.google.com/artifact-registry/docs/repositories/virtual-overview
      sourceControl: https://docs.cloud.google.com/secure-source-manager/docs/overview
      pipeline: https://docs.cloud.google.com/build/docs/triggers
      appTenant: https://docs.cloud.google.com/resource-manager/docs/cloud-platform-resource-hierarchy
      appHosting: https://docs.cloud.google.com/run/docs/securing/identity-aware-proxy-cloud-run
      appData: https://docs.cloud.google.com/sql/docs/postgres/cmek
      orgData: https://docs.cloud.google.com/apigee/docs/api-platform/security/iam/iam-overview
      provider: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/control-model-access
      sources: https://docs.cloud.google.com/artifact-registry/docs/repositories/remote-overview
    differences:
      - at: sourceControl->pipeline
        text: "Secure Source Manager starts Cloud Build from a triggers file on the default branch, but the build config that file names is read from the branch being built, which the agent writes. Send an SSM push webhook to a Cloud Build webhook trigger with an inline config instead, so the pipeline's definition lives in the trigger and not in the repository."
        url: https://docs.cloud.google.com/secure-source-manager/docs/create-triggers-file
      - at: sources->registry
        text: "Artifact Registry remote repositories cache whatever the upstream serves: there is no hold on newly published versions and no look-alike name check. Package scanning, off by default, checks Maven, Python and npm packages pushed to standard repositories for vulnerabilities and OpenSSF-listed malicious packages, so the age and name checks are an intake job you build."
        url: https://docs.cloud.google.com/artifact-registry/docs/release-notes
      - at: harness
        text: "Cloud Run can deny the agent deploy rights, but only by your choice: a job given no service account runs as the Compute Engine default, which can hold broad roles in organisations created before May 2024. One job and service account per app is what scopes the agent's push to that app's repository."
        url: https://docs.cloud.google.com/run/docs/securing/service-identity
      - at: nativeTools
        text: "Cloud Run sandboxes are in Preview, and --allow-egress is all or nothing: it opens every host and VPC endpoint the job can reach. The limit to the mirror, gateway and repository is the job's own path, Direct VPC egress through Secure Web Proxy and a VPC Service Controls perimeter, not a setting on the sandbox."
        url: https://docs.cloud.google.com/run/docs/code-execution
      - at: appHosting
        text: "A new Cloud Run service requires IAM invocation, but IAP is off until you enable it, and anyone with Cloud Run Admin can make a service public by disabling the invoker check unless run.managed.requireInvokerIam is enforced, which it is not by default. Apps published from Google AI Studio get a public URL that anyone can open."
        url: https://docs.cloud.google.com/run/docs/securing/managing-access
      - at: appUsers->appHosting
        text: "Google's 2-step verification requirement covers the Google Cloud console for non-federated accounts, but not yet federated SSO accounts, and not apps behind IAP. IAP reauthentication can demand an enrolled second factor, but not for Workforce Identity Federation or external identities, whose MFA must come from your identity provider."
        url: https://docs.cloud.google.com/docs/authentication/mfa-requirement
      - at: previews
        text: "A Cloud Run tag gives a revision its own URL, but IAP access is set per service, so a preview tag on the production service would be open to the app's real users. Previews therefore go to a separate preview project, as Google's own guidance tests tagged revisions in a staging project first."
        url: https://docs.cloud.google.com/run/docs/rollouts-rollbacks-traffic-migration
      - at: appTenant
        text: "Separate projects share no network or database by default, but Cloud Run sends outbound traffic to the internet through a shared pool until you route it into a VPC. Isolation holds only while no app joins a Shared VPC, and a perimeter allows free communication inside it, so one VPC Service Controls perimeter around many apps does not separate them; per-app IAM does."
        url: https://docs.cloud.google.com/run/docs/configuring/networking-best-practices
    alsoNeeded:
      - service: "Cloud Identity or Google Workspace groups with 2-step verification"
        role: identity
        why: "Groups decide who may use the factory and which owner approves each app; enforce 2-step verification yourself, as Google's console requirement does not yet cover federated accounts."
        url: https://docs.cloud.google.com/docs/authentication/mfa-requirement
      - service: "VPC Service Controls"
        role: network
        why: "Perimeters around the factory and app projects; Cloud Run, Cloud Build, Cloud Deploy, Secure Source Manager, Artifact Registry and Secret Manager are GA."
        url: https://docs.cloud.google.com/vpc-service-controls/docs/supported-products
      - service: "Secure Web Proxy"
        role: network
        why: "The agent job's only path out, allowing the mirror, gateway and repository by URL list."
        url: https://docs.cloud.google.com/secure-web-proxy/docs/policies-and-rules-overview
      - service: "Secure Source Manager private instance (Private Service Connect)"
        role: ingress
        why: "Keeps the repositories off the internet so the build job and pipeline reach them on private addresses."
        url: https://docs.cloud.google.com/secure-source-manager/docs/create-private-service-connect-instance
      - service: "Cloud KMS"
        role: keys
        why: "Per-app CMEK keys and the Binary Authorization attestor's signing key, held in a separate key project."
        url: https://docs.cloud.google.com/binary-authorization/docs/cloud-build
      - service: "Secret Manager"
        role: secrets
        why: "Each app's run-time secrets in its own project; nothing in repositories or in the agent's reach."
        url: https://docs.cloud.google.com/secret-manager/docs/overview
      - service: "App Hub"
        role: registry
        why: "The register of generated apps with their owners, environment and criticality."
        url: https://docs.cloud.google.com/app-hub/docs/overview
      - service: "Cloud Logging aggregated sinks"
        role: logging
        why: "One locked record across the factory and every app project."
        url: https://docs.cloud.google.com/logging/docs/export/aggregated_sinks
    quickstart:
      - title: "Deploy an app to Cloud Run using Cloud Deploy"
        url: https://docs.cloud.google.com/deploy/docs/deploy-app-run
      - title: "Cloud Run sandboxes (code execution)"
        url: https://docs.cloud.google.com/run/docs/code-execution
      - title: "Configure IAP for Cloud Run"
        url: https://docs.cloud.google.com/run/docs/securing/identity-aware-proxy-cloud-run
    hosting:
      - id: cloudRunJobs
        kind: runtime
        name: "Cloud Run jobs with Cloud Run sandboxes"
        url: https://docs.cloud.google.com/run/docs/code-execution
        asOf: "2026-11"
        mapped: true
        compare:
          runs: "Your harness runs as a Cloud Run job, one execution per build, and runs the agent's commands in Cloud Run sandboxes, isolated from the host and each other."
          patching: "Google manages the infrastructure and supplies the sandbox binary; you rebuild the agent's container image and the toolchains in it."
          data: "Specs, code and build output sit in the job's instance and sandbox overlays, deleted afterwards unless exported, and in your repository and buckets."
          network: "Sandboxes have no egress unless --allow-egress, which opens all the job can reach; Direct VPC egress and Secure Web Proxy narrow that path."
          identity: "The job runs as its service account; sandboxed commands get no metadata server credentials, so only the harness pushes or calls the gateway."
          accepts: "Any agent and toolchain in your image; Google's launch post names an ADK CloudRunSandboxCodeExecutor; sandboxes can install with apt, pip or npm."
          workload: "Each build is a job execution whose task may run up to 168 hours; sandboxes share the instance's CPU and memory, and nothing runs between builds."
          portability: "The container image is portable, but the sandbox command exists only on Cloud Run, so the code that launches sandboxes is rewritten elsewhere."
          effort: "You operate the harness image, one job per app and the egress path; there is no cluster, and sandboxes are in Preview."
          fits: "Google presents jobs for run-to-completion agent work and sandboxes for running untrusted or generated code inside an existing Cloud Run resource."
        sources:
          - https://docs.cloud.google.com/run/docs/code-execution
          - https://docs.cloud.google.com/run/docs/configuring/jobs/sandboxes
          - https://docs.cloud.google.com/run/docs/ai-agents
          - https://docs.cloud.google.com/run/docs/configuring/task-timeout
          - https://docs.cloud.google.com/run/docs/securing/service-identity
          - https://docs.cloud.google.com/run/docs/configuring/vpc-direct-vpc
          - https://cloud.google.com/blog/topics/developers-practitioners/google-cloud-run-sandboxes-are-in-public-preview
      - id: gkeAgentSandbox
        kind: cluster
        name: "Agent Sandbox on GKE"
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/machine-learning/agent-sandbox
        asOf: "2026-11"
        compare:
          runs: "The Agent Sandbox controller you install gives each build a dedicated Pod from a SandboxTemplate; GKE Sandbox isolates it with gVisor or a microVM."
          patching: "Google upgrades the control plane and can auto-upgrade nodes; you upgrade the Agent Sandbox controller and rebuild the sandbox images."
          data: "Code and build output stay in the Pod and the volumes or buckets you attach on your nodes; Pod snapshots keep state only if you take them."
          network: "Each SandboxTemplate carries a NetworkPolicy you write; FQDN network policies limit names outside the cluster, with GKE Dataplane V2."
          identity: "Each sandbox Pod runs as a Kubernetes ServiceAccount mapped to IAM by Workload Identity Federation for GKE; Pods in one warm pool share it."
          accepts: "Any container image and a full Kubernetes PodSpec, including sidecars and GPUs; a Python SDK requests and drives sandboxes."
          workload: "Warm pools hand out ready Pods, typically in under a second; a sandbox can be suspended and resumed; parallel builds are bounded by your nodes."
          portability: "Agent Sandbox is an open source Kubernetes SIG Apps project, so templates move to other clusters; GKE Sandbox and Pod snapshots are GKE features."
          effort: "You operate the cluster, node pools, controller, router, warm pools, network policies and upgrades."
          fits: "Google advises it when each agent needs a dedicated Pod, a full PodSpec, GPUs or TPUs, or Autopilot, and Agent Substrate for most other agent work."
        sources:
          - https://docs.cloud.google.com/kubernetes-engine/docs/concepts/machine-learning/agent-sandbox
          - https://docs.cloud.google.com/kubernetes-engine/docs/how-to/agent-sandbox
          - https://docs.cloud.google.com/kubernetes-engine/docs/concepts/machine-learning/agent-workloads
          - https://docs.cloud.google.com/kubernetes-engine/ai-ml/about-agent-substrate
          - https://docs.cloud.google.com/kubernetes-engine/docs/concepts/sandbox-pods
          - https://docs.cloud.google.com/kubernetes-engine/docs/concepts/workload-identity
          - https://docs.cloud.google.com/kubernetes-engine/docs/how-to/node-auto-upgrades
          - https://docs.cloud.google.com/kubernetes-engine/docs/how-to/fqdn-network-policies
        summary: "On GKE the coding agent runs in Agent Sandbox: the controller you install gives each build a dedicated Pod from a per-app SandboxTemplate, isolated by GKE Sandbox with gVisor or a microVM, under a Kubernetes ServiceAccount mapped by Workload Identity Federation for GKE to the app's agent service account. The template's network policy and FQDN network policies limit egress to the mirror, gateway and repository. The pipeline, deploy gate and app projects stay as mapped."
        bindings:
          - { block: harness, service: "Your coding agent on GKE, one sandbox per build", build: true, note: "The harness claims a sandbox per build from that app's template and drives it with the Agent Sandbox Python SDK, under the app's own Kubernetes ServiceAccount.", url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/agent-sandbox }
          - { block: nativeTools, service: "Agent Sandbox Pods with GKE Sandbox (gVisor)", note: "Each build's commands run in a kernel-isolated Pod deleted after the build; the template's NetworkPolicy and FQDN policies set where it may connect.", url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/machine-learning/agent-sandbox }
        dropSettings: [buildSandboxFlags, swpEgress]
        addSettings: [gkeSandbox, agentSandboxPolicy, workloadIdentityGke, gkeNetworkPolicy, fqdnNetworkPolicy, gkeNodeServiceAccount]
        differences:
          - at: harness
            text: "Agent Sandbox is open source software you install and upgrade yourself. Google advises Agent Substrate on GKE for most agent workloads and Agent Sandbox where each agent needs a dedicated Pod or a full PodSpec, which suits one build per Pod."
            url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/machine-learning/agent-sandbox
          - at: nativeTools->sourceControl
            text: "Pods from one warm pool share a Kubernetes ServiceAccount, so a pool cannot serve builds for different apps if each agent identity is to reach only its own repository. Keep a template and pool per app, or create sandboxes on demand."
            url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/agent-sandbox
          - at: nativeTools->registry
            text: "FQDN network policies use the networking.gke.io/v1alpha1 API, need GKE Dataplane V2 and cannot allow ClusterIP or headless Services, so in-cluster peers such as a gateway Service need label-based NetworkPolicy beside them."
            url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/fqdn-network-policies
        alsoNeeded:
          - service: "GKE Dataplane V2"
            role: network
            why: "Enforces the sandbox templates' network policies and the FQDN policies."
            url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/fqdn-network-policies
          - service: "Workload Identity Federation for GKE"
            role: identity
            why: "Maps each app's Kubernetes ServiceAccount to its agent identity, with no keys on nodes."
            url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/workload-identity
        quickstart:
          - title: "Isolate AI code execution with Agent Sandbox"
            url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/agent-sandbox
      - id: managedAgentsApi
        kind: managed
        name: "Managed Agents API on Agent Platform (Antigravity harness, Preview)"
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/managed-agents
        asOf: "2026-11"
        compare:
          runs: "Google runs the Antigravity harness and a managed, isolated Linux sandbox for each environment; your agent is a resource you create through the Agents API."
          patching: "Google maintains the harness, sandbox and pre-installed tools; the only base_agent value accepted is antigravity-preview-05-2026."
          data: "Specs and code sit in the sandbox's persistent file system, kept 7 days after the last interaction, and in Cloud Storage buckets you mount."
          network: "The sandbox has no network until you set a domain allowlist in the environment configuration; a * entry allows every domain."
          identity: "The sandbox holds no ambient credentials: mounts get downscoped tokens, and MCP headers you configure are sent only to their endpoints."
          accepts: "Bash and file tools, Python 3.11 and Node.js 20 with git and gcloud, skills from Skill Registry, and MCP servers over Streamable HTTP."
          workload: "Interactions can run in the background and stream; agents sharing an env_id share one sandbox; only the global location is supported."
          portability: "Agents are defined through Google's Agents and Interactions APIs, so the harness and its configuration do not move to another platform."
          effort: "You manage agent configurations, allowlists, mounts and credentials; there is no infrastructure, but the API is a Pre-GA preview."
          fits: "Google presents it for config-driven autonomous agents that plan, run code and edit files; its terms bar production use and confidential data."
        sources:
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/managed-agents
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/managed-agents/create-manage
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/managed-agents/sandbox-environment
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/managed-agents/interact-with-agents
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/managed-agents/evaluate
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/skill-registry
          - https://docs.cloud.google.com/gemini/docs/codeassist/sunset
          - https://docs.cloud.google.com/gemini/enterprise/docs/ai-developer-tools-overview
          - https://jules.google/docs/changelog
          - https://antigravity.google/docs/remote-agents
        offers:
          - name: "Agents API"
            what: "Control plane to create, update, list and delete agents and set their sandbox, Cloud Storage mounts, network allowlist, MCP servers and skills (Preview)."
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/managed-agents/create-manage
          - name: "Interactions API"
            what: "Data plane to send an agent work, stream it or run it in the background, and reuse or override an environment by env_id (Preview)."
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/managed-agents/interact-with-agents
          - name: "Managed sandbox environment"
            what: "Isolated Linux sandbox with bash and file tools, persistent files for 7 days and no network until an allowlist is set (Preview)."
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/managed-agents/sandbox-environment
          - name: "Evaluate agents"
            what: "Evaluate agents built with the Managed Agents API using the GenAI Evaluation Service (Preview)."
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/managed-agents/evaluate
