id: aiAttacker            # the key feed items and deep dives carry in `category`
slug: ai-run-intrusions         # its address: /incidents/ai-run-intrusions/
order: 8
name: "AI-run intrusions"
short: "Attackers hand the intrusion to their own AI agents, which find, exploit and move through targets at machine speed."
since: 2026-11-25
overview: >-
  Here the AI system is the attacker's. Agent frameworks such as ARTEX and Cairn turn a target
  list and a goal into scanning, credential attacks and exploitation, run in parallel on any model
  the operator connects, with a person approving a few steps or none. From autumn 2026 the FBI,
  Microsoft, CrowdStrike, Amazon, Google and CERT-In described many separate actors using such
  frameworks against Microsoft 365 tenants, banks, universities and governments. The doors were
  mostly ordinary: exposed services, stolen app identities, published flaws, now and then a
  zero-day the agents found. What is new sits with whoever serves the model: spotting the pattern
  across sessions and cutting accounts off.
howItWorks:
  - "An operator connects an agent framework such as ARTEX or Cairn to a model, often one chosen for its weak guardrails."
  - "It supplies targets and a goal, framed as an authorised penetration test, a claim the model has no way to check."
  - "Agents scan, try credentials and exploit flaws in parallel, adjusting between runs, with a person approving at most the key steps."
  - "They go through ordinary doors: exposed services, weak or stolen credentials, trusted app identities, published CVEs, now and then a new flaw."
signs:
  - "Activity in machine order across many targets: hundreds of sign-ins in minutes, sorted tenant lists, parallel sessions from one source."
  - "Prompts claiming an authorised test against addresses the account does not own, seen by whoever serves the model."
  - "Calls to model APIs from hosts that never use them; the FBI's ARTEX indicators include api.anthropic.com and api.deepseek.com."
stops:
  - control: cap-input-guardrails
    how: "Whoever serves the model treats \"this is an authorised test\" against addresses the account does not own as a claim that needs proof."
  - control: cap-agent-tracing
    how: "Detection across sessions at the provider or router: hundreds of sign-ins in minutes, or recon then exploit in the tool calls, which no single prompt shows."
  - control: cap-agent-kill-switch
    how: "Cut the operator's accounts, keys and running agents together once one run is flagged; pulling ARTEX's repository did not stop its use."
  - control: AML.M0036
    how: "Limits on parallel runs and spend per account slow a fan-out across thousands of tenants to a pace people can answer."
risks: [riskRogueActions, riskAgentDelegationChainOpacity, riskCrossTenantCredentialPropagation, riskSensitiveDataDisclosure]
owasp: [LLM01:2026]
atlas: [AML.T0054, AML.T0116, AML.T0117, AML.T0124, AML.T0017.001, AML.T0016.004]
notSameAs:
  - pattern: breakout
    why: "An agent its own organisation or a researcher meant to keep inside a sandbox or brief is escape and overreach; here someone aimed it."
  - pattern: exploitedSoftware
    why: "A flaw in AI software that people exploit is exploited software; when the attacker's agents found and used it, as Cairn did with MONAI Label, it is filed here."
  - pattern: supplyChain
    why: "An agent that only builds a poisoned artefact, as ARTEX did on Hugging Face, is supply chain: any intrusion runs when a victim loads it."
