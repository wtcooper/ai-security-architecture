# Amazon Quick Automate — one entity per product × reference architecture. Facts are dated (asOf) and cite
# the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# Scope: Quick Automate (projects, automation groups, the visual designer, UI agents, custom agents, HITL task
# center, deployments and triggers) in Amazon Quick accounts provisioned through the AWS Management Console.
# Exclusions: Quick Flows, Quick Research, Quick chat agents, spaces and Quick Desktop are other Amazon Quick
# applications with their own controls (Quick Flows' share approval, Desktop's per-tool access levels); the
# account-level controls they share with Automate (identity, custom permissions, CloudTrail) are recorded here
# only as they apply to automations. Free, Plus and Max accounts created at aws.com/quick cannot use Automate.
# 2026-10-30: onboarded against the MITRE capability rules from the Amazon Quick User Guide, read as .md
# (docs.aws.amazon.com/quick/latest/userguide/<page>.md; the page list from toc-contents.json, all 200). The
# exemplar URL aws.amazon.com/quick/automate/ (200) is the product page. No StopAutomationJob API is
# documented (the Automation Job APIs are StartAutomationJob and DescribeAutomationJob only).
vendor: aws
family: Amazon Quick Automate
tools:
  - id: toolQuickAutomate
    name: Amazon Quick Automate (automation groups, UI agents, custom agents, human-in-the-loop tasks, scheduled and API triggers)
    surfaceClasses:
      - saasAgentPlatform
    variants:
      - name: UI agent (natural-language browser automation in a managed browser)
        class: saasAgentPlatform
        url: https://docs.aws.amazon.com/quick/latest/userguide/ui-agents.html
        note: >-
          Navigates websites, clicks, types and reads data in a browser Quick Automate manages, signing in with
          website credentials saved to the automation group; egress is the public internet unless a VPC
          connection is associated with the group.
      - name: Custom agent (tool-calling step; Fast, Pro or Custom mode with a Bedrock model)
        class: saasAgentPlatform
        url: https://docs.aws.amazon.com/quick/latest/userguide/automate-custom-agents.html
        note: >-
          Uses the automation group's integration actions, Code and Create user task as tools, and can query
          datasets and knowledge bases in spaces linked to the group; Custom mode bills inference to the account
          behind the Bedrock integration.
    architecture: archLowCodeAgentBuilder
    status: ga
    asOf: "2026-10"
    summary:
      - >-
        AWS's agentic business-process automation inside Amazon Quick: builders describe a process or upload its
        documentation, a planning agent drafts the automation, and the visual designer combines actions (browser,
        Excel, PDF, files, code in a restricted Python environment, integrations), UI agents that operate web
        applications, custom agents that call integration actions as tools, and human-in-the-loop tasks. Committed
        versions are deployed with runtime configuration, HITL resolvers and the credentials and connections they
        run on, then started by schedule or by the StartAutomationJob API. Everything runs in AWS's managed
        environment; the managed browser reaches the public internet unless the automation group is associated
        with a VPC connection in the customer's account.
      - >-
        The administrator is the Amazon Quick administrator (Manage Quick) and the automation group Owner:
        identity through IAM Identity Center, custom permissions profiles (the Automate capability, Deny by
        Default for AI capabilities, per-connector Create and Update, Share and Use action), automation groups
        with Viewer, Contributor and Owner roles that hold the integrations, credentials, spaces and datasets an
        automation may use, IAM on StartAutomationJob, and CloudTrail and CloudWatch for monitoring. AWS states
        that automated workflows authenticate at service level, are not bounded by an individual user's
        connector permissions and run unattended, so the review belongs at approval time.
    facts:
      - label: Plans
        value: >-
          Amazon Quick accounts provisioned through the AWS Management Console (not Free or Plus accounts from
          aws.com/quick); custom permissions and MCP integrations need an Enterprise subscription; automations and
          flows consume agent hours.
        url: https://docs.aws.amazon.com/quick/latest/userguide/using-amazon-quick-automate.html
      - label: Inference & routing
        value: >-
          Custom agents run in fully managed Fast or Pro modes, or Custom mode, which calls a model the customer
          selects in Amazon Bedrock through a Bedrock runtime integration billed to that account.
        url: https://docs.aws.amazon.com/quick/latest/userguide/automate-custom-agents.html
      - label: Data leaving the device
        value: >-
          A vendor-hosted platform: process documents, run data, browser sessions and model calls are processed
          in AWS. The managed browser and integrations reach target systems from AWS, over the public internet by
          default or through an ENI in the customer's VPC when a VPC connection is associated with the automation
          group.
        url: https://docs.aws.amazon.com/quick/latest/userguide/getting-started-quick-automate.html
      - label: Retention & training
        value: >-
          Quick does not use conversations, files or personal context to train or improve AI models. Customer
          managed keys cover only participating Automate stores (group and trigger content, validated inbound
          email); workflow, deployment and run data, execution artifacts and credentials use service-controlled
          keys.
        url: https://docs.aws.amazon.com/quick/latest/userguide/customer-managed-keys.html
      - label: Docs index
        value: Amazon Quick User Guide › Using Amazon Quick automations › Using Amazon Quick Automate; Administering Amazon Quick
        url: https://docs.aws.amazon.com/quick/latest/userguide/using-amazon-quick-automate.html
      - label: Compliance scope
        value: >-
          Quick is a HIPAA Eligible Service (BAA required) and in scope for SOC 1, SOC 2 and SOC 3; confirm Quick
          Automate on AWS services in scope.
        url: https://docs.aws.amazon.com/quick/latest/userguide/sec-compliance.html
    items:
      - title: Where each control lives
        body:
          - >-
            Manage Quick: Permissions › Custom permissions (Automate, Restrict AI capabilities, connector Create and
            Update action, Share action, Use action), IP and VPC endpoint restrictions, VPC connections, AWS KMS
            keys. Automate: Projects › Manage groups (roles, Assets › Actions, Credentials, Spaces, Datasets, VPC
            connection), Deployments (Release details, Runtime configuration, Tasks, Access), Task center,
            Monitoring. AWS: IAM Identity Center, IAM policies on quicksight:StartAutomationJob, SCPs on
            quicksight:Subscribe, CloudTrail, CloudWatch metrics in the QuickSight namespace.
        links:
          - title: Getting started with Quick Automate
            url: https://docs.aws.amazon.com/quick/latest/userguide/getting-started-quick-automate.html
          - title: AI and agent security in Amazon Quick
            url: https://docs.aws.amazon.com/quick/latest/userguide/sec-agentic-security.html
      - title: Whose authority an automation runs on
        body:
          - >-
            Deployments select the website credentials and integration connections the automation uses; they are
            stored encrypted and never shown to authors, but every run uses them, whoever triggered it. AWS's own
            guidance is that an automated workflow can reach any resource its service-level credential permits,
            regardless of which user created it, so give each automation group connections to dedicated service
            accounts scoped at the target system.
        links:
          - title: Deploying automations — Access (Credentials and Connections)
            url: https://docs.aws.amazon.com/quick/latest/userguide/deploying-automations.html
    riskNotes:
      - risk: riskAgenticDelegationConfusedDeputy
        note: >-
          Automations authenticate at service level and are not bounded by the triggering user's connector
          permissions; anyone who can start a deployed automation borrows the reach of its connections.
      - risk: riskRogueActions
        note: >-
          Scheduled and API-triggered automations run unattended; a human-in-the-loop task pauses only where the
          author placed one, and the custom agent's Create user task tool fires when the agent decides it is stuck.
      - risk: riskPromptInjection
        note: >-
          UI agents read live web pages and custom agents read integration results and knowledge bases; AWS
          documents its content-safety screening and blocked words for chat agents and flows, not for automations.
      - risk: riskSensitiveDataDisclosure
        note: >-
          Linking a space grants the automation group access to every knowledge base and file in it, and datasets
          with row-level or column-level security cannot be attached, so retrieval is not trimmed per user.
      - risk: riskShadowAndUnknownAgents
        note: >-
          Any user with Contributor rights in an automation group can build, test and deploy; nothing outside the
          group's Owner approves a deployment.
    controls:
      - mitigation: D3-APA
        coverage: partial
        mechanism: >-
          Custom permissions profile capability Automate (users cannot create, update or run automations); automation
          group roles Viewer, Contributor and Owner; integrations, credentials, spaces and datasets made available per
          automation group by its Owner; HITL task resolvers set at deployment; IAM on quicksight:StartAutomationJob
          scoped to the automation ARN
        steps:
          - title: Restrict Automate to builders
            body:
              - >-
                In Manage Quick › Permissions › Custom permissions create a profile that restricts Automate, assign it
                at account level, and assign an allow profile to the builders' role.
            url: https://docs.aws.amazon.com/quick/latest/userguide/custom-permissions.html
          - title: Keep Owner rights with a named few
            body:
              - >-
                In each automation group give Owner (integrations, credentials, user access) to the process owner and
                IT, Contributor to trained builders and Viewer to everyone else.
            url: https://docs.aws.amazon.com/quick/latest/userguide/getting-started-quick-automate.html
          - title: Scope who can start an automation by API
            body:
              - >-
                Grant quicksight:StartAutomationJob only on the specific automation ARN to the calling system's role.
            url: https://docs.aws.amazon.com/quick/latest/userguide/deploying-automations.html
        note: >-
          Partial on the authorisation rule, the same word as toolAgentforce: the administrator decides who may build,
          deploy and start automations and which connections a group can use, but AWS documents that automated
          workflows authenticate at service level rather than as the invoking user, so there is no end-user mode to
          enforce (toolCopilotStudio is native because it can remove maker credentials). Custom permissions need an
          Enterprise subscription and an account administrator can change them; an SCP cannot reach them.
        verified: "2026-10-30"
      - mitigation: D3-AA
        coverage: none
        mechanism: >-
          No agent identity: a deployed automation runs on the website credentials and integration connections
          selected at deployment, authenticated at service level
        evidence:
          - title: Deploying automations — Access (Credentials and Connections)
            url: https://docs.aws.amazon.com/quick/latest/userguide/deploying-automations.html
          - title: AI and agent security in Amazon Quick — Autonomy and identity
            url: https://docs.aws.amazon.com/quick/latest/userguide/sec-agentic-security.html
        note: >-
          None on the agent-identity rule: toolCopilotStudio mints an Entra Agent ID and toolAgentforce a dedicated
          agent user, while Quick Automate documents no principal of its own per automation; target systems see
          whatever account the connection or website credential belongs to. Stand-in: give each automation group's
          connections a dedicated service account at the target system, named for the automation, so its activity
          is attributable and revocable there.
        verified: "2026-10-30"
      - mitigation: cap-agent-tool-registry
        coverage: partial
        mechanism: >-
          Projects and automation groups listing every automation with its versions and deployments; Monitoring
          summary of automations and runs; the analytics dashboard's assets-created and users-by-asset-type views
          (quicksight:QuickSuiteUsageMetrics); CloudTrail records of automation API calls
        steps:
          - title: Read the automation population
            body:
              - >-
                Use the analytics dashboard (permission quicksight:QuickSuiteUsageMetrics) for automations created and
                the users building them, and the Monitoring summary for what is deployed and running.
            url: https://docs.aws.amazon.com/quick/latest/userguide/incident-response-logging-and-monitoring-quick-suite.html
          - title: Organise by accountable group
            body:
              - >-
                Create one automation group per business unit or process family so every automation sits under an
                Owner who answers for it.
            url: https://docs.aws.amazon.com/quick/latest/userguide/getting-started-quick-automate.html
        note: >-
          Partial on the registry rule, the same word as toolAgentforce: the platform's own lists are authoritative
          for the account, but no owner, approval state or credential mode is documented per automation, the
          inventory is not exportable as a registry, and nothing denies an unregistered automation. The AWS Agent
          Registry integration surfaces MCP servers to Quick's chat, agents, apps, Flows and Research, not to
          Automate.
        verified: "2026-10-30"
      - mitigation: cap-staged-rollout-gate
        coverage: partial
        mechanism: >-
          Committed versions (only committed versions deploy; restoring a version keeps the history); Test and
          production environments in Monitoring; runtime configuration overridden per environment at deployment;
          export and import between accounts
        steps:
          - title: Deploy only committed, tested versions
            body:
              - >-
                Test the automation end to end, commit the version, and select it in Release details; move a version
                between accounts with export and import rather than editing production.
            url: https://docs.aws.amazon.com/quick/latest/userguide/deploying-automations.html
          - title: Promote across accounts
            body:
              - >-
                Export the tested automation from the development account and import it into production.
            url: https://docs.aws.amazon.com/quick/latest/userguide/export-import-automations.html
        note: >-
          Partial on the rollout rule: versioning, a test environment and rollback by redeploying an earlier
          committed version exist, but any Contributor can deploy, no approval step or evaluation gate stands
          before production, and there is no canary or percentage release.
        verified: "2026-10-30"
      - mitigation: cap-ai-vendor-assessment
        coverage: external
        mechanism: >-
          Amazon Quick compliance validation (HIPAA eligible, SOC 1/2/3) and AWS Artifact reports feed the
          organisation's TPRM platform
        evidence:
          - title: Compliance validation for Amazon Quick
            url: https://docs.aws.amazon.com/quick/latest/userguide/sec-compliance.html
          - title: AWS services in scope by compliance program
            url: https://aws.amazon.com/compliance/services-in-scope/
        note: >-
          External: the assessment, evidence expiry and reassessment trigger live in the TPRM platform, as for every
          vendor. Re-assess when Custom mode brings a Bedrock model, and for each third-party system the UI agent
          signs in to.
        verified: "2026-10-30"
      - mitigation: AML.M0028
        coverage: partial
        mechanism: >-
          Integrations usable only after an Owner adds them to the automation group (Assets › Add › Actions); custom
          permissions per connector (Create and Update action, Share action, Use action); custom agents limited to
          the actions the author selects from the group; Code in a restricted Python environment that is not the
          path to external systems
        steps:
          - title: Add only the integrations a group needs
            body:
              - >-
                In Projects › Manage groups › Assets › Add › Actions link only the integrations the group's processes
                use; automations in other groups cannot select them.
            url: https://docs.aws.amazon.com/quick/latest/userguide/getting-started-quick-automate.html
          - title: Restrict connector use by profile
            body:
              - >-
                In the custom permissions profile, under Connectors, restrict Create and Update action to
                administrators and Use action for connectors builders should not reach.
            url: https://docs.aws.amazon.com/quick/latest/userguide/custom-permissions.html
        note: >-
          Partial on the tool-permission rule, the same word as toolAgentforce: tools are admitted per group and per
          connector, and AWS states MCP tools do not become available until reviewed and turned on, but there is no
          per-operation scope for an automation, no connector classification or combination rule, and an integration
          linked to a group is usable by every automation in it.
        verified: "2026-10-30"
      - mitigation: D3-CH
        coverage: partial
        mechanism: >-
          Website credentials and action credentials stored encrypted and supplied at runtime without being shown to
          authors; Default OAuth app (90-day refresh tokens) or Custom OAuth app for connectors; VPC connections with
          ENIs in the customer's VPC instead of a relay host; service-controlled keys for Automate credentials
        steps:
          - title: Keep secrets in the group's credential store
            body:
              - >-
                Save website and integration credentials to the automation group and select them under Access at
                deployment; never put them in runtime configuration or code.
            url: https://docs.aws.amazon.com/quick/latest/userguide/deploying-automations.html
          - title: Use the firm's own OAuth app
            body:
              - >-
                Configure connectors used by automations with Custom OAuth app so the client and its revocation are
                the firm's.
            url: https://docs.aws.amazon.com/quick/latest/userguide/quick-action-auth.html
          - title: Reach private systems through the VPC
            body:
              - >-
                Create a Quick VPC connection and associate it with the automation group so traffic to private
                systems leaves through ENIs in the firm's VPC.
            url: https://docs.aws.amazon.com/quick/latest/userguide/getting-started-quick-automate.html
        note: >-
          Partial on the credential rule, the same word as toolCopilotStudio and toolAgentforce: secrets are held by
          the platform and kept from authors, and private systems are reached through the customer's VPC with no
          tunnel credential to custody. But website credentials are standing usernames and passwords, rotation is a
          manual edit, Automate credentials use service-controlled keys rather than the customer's, and no
          short-lived issuance is documented.
        verified: "2026-10-30"
      - mitigation: cap-input-guardrails
        coverage: none
        mechanism: >-
          Built-in content-safety and prompt-attack screening and blocked words are documented for user requests in
          chat agents and flows, not for automations, UI agent page reads or custom agent tool results
        evidence:
          - title: AI guardrails in Amazon Quick (blocked words apply to chat agents and flows)
            url: https://docs.aws.amazon.com/quick/latest/userguide/guardrails.html
          - title: AI and agent security in Amazon Quick — Guardrail screening and blocked words
            url: https://docs.aws.amazon.com/quick/latest/userguide/sec-agentic-security.html
        note: >-
          None: no screening of web pages, files or tool results entering an automation's agents is documented, and
          no attach point for the firm's own classifier. Stand-in: keep UI agents on known sites, attach only
          reviewed knowledge, and place a human-in-the-loop task before any step that acts on what an agent read.
        verified: "2026-10-30"
      - mitigation: cap-data-access-governance
        coverage: partial
        mechanism: >-
          Spaces and datasets attached to an automation group only by their owner; knowledge bases with ACL support
          enforce document permissions on retrieval; datasets with row-level or column-level security cannot be
          attached; linking a space grants the group access to every knowledge base and file in it
        steps:
          - title: Link only purpose-built spaces
            body:
              - >-
                In Manage groups › Assets › Add › Spaces link a space built for the process, not a team's general
                space, since the group gains everything in it.
            url: https://docs.aws.amazon.com/quick/latest/userguide/automate-custom-agents.html
          - title: Create knowledge bases with ACL support
            body:
              - >-
                Create knowledge bases with document-level ACLs; the choice is permanent and later retrieval returns
                nothing rather than unfiltered results when permissions cannot be evaluated.
            url: https://docs.aws.amazon.com/quick/latest/userguide/sec-agentic-security.html
        note: >-
          Partial on the retrieval rule, the same word as toolAgentforce: the owner decides what a group may ground
          on, but an automation reads as the group, not as the person whose case it is working, and the docs do not
          say which identity ACL enforcement evaluates for a run-as-service automation.
        verified: "2026-10-30"
      - mitigation: cap-agent-tracing
        coverage: partial
        mechanism: >-
          Monitoring dashboards (automation summary, runs with version, duration, cases and HITL task counts, and
          logs); CloudWatch metrics in the QuickSight namespace by AutomationId and AutomationGroupId; CloudTrail
          management and data events for Quick API calls; AGENT_HOURS_LOGS vended log entries for AUTOMATION
        steps:
          - title: Alarm on runs in CloudWatch
            body:
              - >-
                In CloudWatch › Metrics › QuickSight choose the AutomationId dimension and alarm on failed and
                StoppedAutomationRunCount runs.
            url: https://docs.aws.amazon.com/quick/latest/userguide/monitoring-performance.html
          - title: Record API activity off-account
            body:
              - >-
                Send Quick CloudTrail management events, and data events through advanced event selectors, to a
                separate logging account.
            url: https://docs.aws.amazon.com/quick/latest/userguide/monitoring-cloudtrail.html
        note: >-
          Partial on the tracing rule: run status, metrics and API calls reach the firm's account, but the per-step
          log of what a UI agent saw and did lives in the Quick console, and no export of step-level traces (actions,
          tool inputs, pages) to a sink the firm runs is documented; CloudTrail records no action inputs or approval
          decisions.
        verified: "2026-10-30"
      - mitigation: cap-agent-kill-switch
        coverage: partial
        mechanism: >-
          Custom permissions capability Automate (users cannot run automations); IAM deny on
          quicksight:StartAutomationJob; schedule triggers with end dates; revoking the credentials and connections
          a deployment uses
        steps:
          - title: Refuse new API starts
            body:
              - >-
                Remove or deny quicksight:StartAutomationJob for the automation's ARN in the calling roles' policies.
            url: https://docs.aws.amazon.com/quick/latest/userguide/deploying-automations.html
          - title: Withdraw the capability
            body:
              - >-
                Restrict Automate in the custom permissions profile for the affected users.
            url: https://docs.aws.amazon.com/quick/latest/userguide/custom-permissions.html
        note: >-
          Partial on the kill-switch rule: levers that block new starts exist, but no administrator stop for a
          production run in progress is documented (the Automation Job APIs are start and describe only; Stop is a
          test-run debug control), and whether restricting Automate halts scheduled triggers is not stated.
          Revoking the target-system credential is the reliable stop.
        verified: "2026-10-30"
    # The security-relevant settings, each with the baseline value (data/tooling/BASELINE.md).
    # Account-wide rows are in Manage Quick and AWS IAM; per-automation rows are automation-group assets
    # and deployment choices the group Owner makes. Verified 2026-10-30.
    settings:
      - id: identityCenter
        name: IAM Identity Center
        where: Amazon Quick sign-up › identity method (cannot be changed after the account is created)
        setVia: [identityProvider]
        area: identity
        recommended: IAM Identity Center with the firm's IdP as the identity source, MFA enforced at the IdP
        why: Every Quick user signs in through the corporate IdP and its MFA, and leaving the IdP ends their access.
        mitigations: [D3-APA]
        url: https://docs.aws.amazon.com/quick/latest/userguide/setting-up-sso.html
        verified: "2026-10-30"
      - id: subscribeScp
        name: quicksight:DirectoryType / quicksight:Edition (quicksight:Subscribe)
        where: AWS Organizations SCP › Deny quicksight:Subscribe outside the approved edition and directory type
        setVia: [cloudPolicy]
        area: identity
        recommended: Only the firm's approved edition with IAM Identity Center, in approved accounts
        why: No team can start a separate Quick subscription, with its own automations and users, outside the governed account.
        mitigations: [D3-APA, cap-agent-tool-registry]
        url: https://docs.aws.amazon.com/quick/latest/userguide/security-scp-admin.html
        verified: "2026-10-30"
      - id: ipVpcRestrictions
        name: IP and VPC endpoint restrictions
        where: Manage QuickSight › Security and Permissions › IP and VPC endpoint restrictions › Rules
        setVia: [adminConsole]
        area: network
        recommended: On, allowing the firm's egress ranges and its VPC endpoints
        why: The Quick web console, where automations and their credentials are managed, is reachable only from the firm's network paths; the public API needs an IAM source-IP condition as well.
        mitigations: [D3-APA]
        url: https://docs.aws.amazon.com/quick/latest/userguide/manage-ip-vpc.html
        verified: "2026-10-30"
      - id: automateCapability
        name: Automate (custom permissions)
        where: Manage Quick › Permissions › Custom permissions › profile › Capabilities & features › AI capabilities › Automate
        setVia: [adminConsole, apiCli]
        area: identity
        default: Allowed for all users
        recommended: Restricted at account level; allowed on the builders' role
        why: Only trained builders can create, update or run automations; restricting it is also how the capability is withdrawn from a user.
        mitigations: [D3-APA, cap-agent-kill-switch]
        requires: Enterprise subscription
        url: https://docs.aws.amazon.com/quick/latest/userguide/custom-permissions.html
        verified: "2026-10-30"
      - id: denyByDefaultAi
        name: Restrict AI capabilities (Deny by Default)
        where: Manage Quick › Permissions › Custom permissions › profile › Restrict capabilities
        setVia: [adminConsole, apiCli]
        area: tools
        default: Allow by default (new capabilities available on release)
        recommended: On in the account-level profile, with the capabilities the firm uses allowed explicitly
        why: A new AI capability AWS ships, including new agent abilities in Automate, is denied until someone has evaluated it.
        mitigations: [cap-staged-rollout-gate, D3-APA]
        requires: Enterprise subscription
        url: https://docs.aws.amazon.com/quick/latest/userguide/custom-permissions-governance.html
        verified: "2026-10-30"
      - id: groupRoles
        name: Viewer, Contributor, and Owner (automation group roles)
        where: Automate › Projects › Manage groups › (group) › users
        setVia: [adminConsole]
        area: identity
        recommended: Owner held by the process owner and IT; Contributor for trained builders; Viewer for everyone else
        why: Only Owners decide which systems and credentials a group's automations can use, and only Contributors can deploy.
        mitigations: [D3-APA, AML.M0028]
        url: https://docs.aws.amazon.com/quick/latest/userguide/getting-started-quick-automate.html
        verified: "2026-10-30"
      - id: groupIntegrations
        name: Automation Group › Assets › Actions
        where: Automate › Projects › Manage groups › (group) › Assets › Add › Actions
        setVia: [adminConsole]
        area: tools
        recommended: Only the integrations the group's processes use
        why: An automation can call only systems its group has been given, so a builder cannot wire in a connector nobody approved for the process.
        mitigations: [AML.M0028]
        url: https://docs.aws.amazon.com/quick/latest/userguide/getting-started-quick-automate.html
        verified: "2026-10-30"
      - id: connectorPermissions
        name: Create and Update action / Share action / Use action (connector features)
        where: Manage Quick › Permissions › Custom permissions › profile › Connectors
        setVia: [adminConsole, apiCli]
        area: tools
        recommended: Create and Update action restricted to administrators; Use action restricted for connectors builders should not reach
        why: New integrations, MCP servers included, are created by the people who review them, not by any builder.
        mitigations: [AML.M0028, cap-agent-tool-registry]
        requires: Enterprise subscription
        url: https://docs.aws.amazon.com/quick/latest/userguide/custom-permissions.html
        verified: "2026-10-30"
      - id: deploymentAccess
        name: Access (Credentials and Connections)
        where: Automate › (automation) › Deploy › Additional settings › Access
        setVia: [adminConsole]
        area: identity
        recommended: Connections and website credentials of a dedicated service account per automation group, never a builder's own
        why: Every run uses these whoever triggers it, so they must be scoped and attributable at the target system.
        mitigations: [D3-CH, D3-APA]
        url: https://docs.aws.amazon.com/quick/latest/userguide/deploying-automations.html
        verified: "2026-10-30"
      - id: customOauthApp
        name: Custom OAuth app
        where: Connections › Integrations › (connector) › OAuth Configuration
        setVia: [adminConsole]
        area: identity
        default: Default OAuth app where the connector supports it
        recommended: Custom OAuth app registered by the firm for connectors automations use
        why: The OAuth client, its scopes and its revocation belong to the firm, not to the Quick-managed application.
        mitigations: [D3-CH]
        url: https://docs.aws.amazon.com/quick/latest/userguide/quick-action-auth.html
        verified: "2026-10-30"
      - id: vpcConnection
        name: VPC connection (automation group)
        where: Quick admin tools › create VPC connection, then the automation group page › VPC connection section
        setVia: [adminConsole, apiCli]
        area: network
        default: Public internet endpoints only
        recommended: Associated with every group that reaches private systems, with egress through the firm's firewall
        why: Browser and integration traffic leaves through ENIs in the firm's VPC, so private systems stay private and egress is the firm's to filter.
        mitigations: [D3-CH]
        url: https://docs.aws.amazon.com/quick/latest/userguide/getting-started-quick-automate.html
        verified: "2026-10-30"
      - id: linkedSpaces
        name: Automation group › Assets › Spaces / Datasets
        where: Automate › Projects › Manage groups › (group) › Assets › Add › Spaces or Datasets
        setVia: [adminConsole]
        area: data
        recommended: Only spaces and datasets built for the process; knowledge bases in them created with ACL support
        why: Linking a space gives the group every knowledge base and file in it, so the scope of what agents can read is decided here.
        mitigations: [cap-data-access-governance]
        url: https://docs.aws.amazon.com/quick/latest/userguide/automate-custom-agents.html
        verified: "2026-10-30"
      - id: hitlResolvers
        name: Tasks (for HITL assignments)
        where: Automate › (automation) › Deploy › Additional settings › Tasks
        setVia: [adminConsole]
        area: tools
        recommended: A named resolver group for every human-in-the-loop task
        why: Approvals and exceptions go to people accountable for the process, not to whoever built it.
        mitigations: [D3-APA]
        url: https://docs.aws.amazon.com/quick/latest/userguide/deploying-automations.html
        verified: "2026-10-30"
      - id: committedVersion
        name: Release details (committed version)
        where: Automate › (automation) › Deploy › Release details
        setVia: [adminConsole]
        area: tools
        recommended: Only versions tested end to end and committed; the previous version kept for redeployment
        why: Production runs an immutable version someone tested, and rolling back is redeploying the one before.
        mitigations: [cap-staged-rollout-gate]
        url: https://docs.aws.amazon.com/quick/latest/userguide/deploying-automations.html
        verified: "2026-10-30"
      - id: exportImport
        name: Export and import automations
        where: Automate › (automation) › Export, then Import in the target account
        setVia: [adminConsole]
        area: tools
        recommended: Builders work in a development account; production receives imports only
        why: Nobody edits a production automation in place, so what runs there is what was tested.
        mitigations: [cap-staged-rollout-gate]
        url: https://docs.aws.amazon.com/quick/latest/userguide/export-import-automations.html
        verified: "2026-10-30"
      - id: startAutomationJobIam
        name: quicksight:StartAutomationJob
        where: IAM policy of the calling role › Resource arn:aws:quicksight:<region>:<account>:automation-group/<group>/automation/<automation>
        setVia: [cloudPolicy]
        area: tools
        recommended: Granted per automation ARN to the one system that triggers it; a Deny ready for incidents
        why: Only the intended caller can start the automation, and a single policy change refuses new starts.
        mitigations: [D3-APA, cap-agent-kill-switch]
        url: https://docs.aws.amazon.com/quick/latest/userguide/deploying-automations.html
        verified: "2026-10-30"
      - id: cloudtrail
        name: CloudTrail data events (Amazon Quick)
        where: CloudTrail › trail › advanced event selectors for Quick resource types, plus management events
        setVia: [cloudPolicy]
        area: audit
        default: Data events off
        recommended: On, delivered to a separate logging account
        why: Automation and connector API activity, and changes to custom permissions, are recorded where the Quick account cannot alter them.
        mitigations: [cap-agent-tracing]
        url: https://docs.aws.amazon.com/quick/latest/userguide/monitoring-cloudtrail.html
        verified: "2026-10-30"
      - id: cloudwatchAlarms
        name: CloudWatch metrics (QuickSight namespace, AutomationId)
        where: CloudWatch › Metrics › QuickSight › AutomationId or AutomationGroupId
        setVia: [cloudPolicy]
        area: audit
        recommended: Alarms on failed and StoppedAutomationRunCount runs per production automation
        why: An automation that starts failing or being stopped is noticed by operations, not discovered in the console later.
        mitigations: [cap-agent-tracing]
        url: https://docs.aws.amazon.com/quick/latest/userguide/monitoring-performance.html
        verified: "2026-10-30"
      - id: agentHoursLogs
        name: AGENT_HOURS_LOGS (vended log)
        where: Amazon Quick vended logs › delivery to CloudWatch Logs, Amazon S3 or Firehose
        setVia: [cloudPolicy]
        area: audit
        default: Vended logs do not flow
        recommended: Delivered to the firm's log store
        why: Each automation's consumption is recorded against its resource ARN, a cheap signal of an automation that has started running far more than expected.
        mitigations: [cap-agent-tracing, cap-agent-tool-registry]
        url: https://docs.aws.amazon.com/quick/latest/userguide/monitoring-cloudwatch-logs.html
        verified: "2026-10-30"
      - id: analyticsDashboard
        name: quicksight:QuickSuiteUsageMetrics (analytics dashboard)
        where: IAM permission for the analytics dashboard › Assets created, users by asset type
        setVia: [cloudPolicy]
        area: audit
        recommended: Granted to the platform team, who review new automations and their builders monthly
        why: New automations and who is building them are visible to the people who keep the inventory; the dashboard can expose query text, so access stays narrow.
        mitigations: [cap-agent-tool-registry]
        url: https://docs.aws.amazon.com/quick/latest/userguide/incident-response-logging-and-monitoring-quick-suite.html
        verified: "2026-10-30"
