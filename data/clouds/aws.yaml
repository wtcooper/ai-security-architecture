    default: "No resource-based policy"
    requires: "Harness tool type agentcore_gateway with outboundAuth awsIam"
    recommended: "Allow bedrock-agentcore:InvokeGateway only to the execution roles of the harnesses that use this gateway, and deny when aws:SourceVpce is not your gateway endpoint. Give each execution role InvokeGateway on that one gateway ARN."
    value: "InvokeGateway for the harness roles only, via endpoint"
    why: "The harness then signs each tool call with short-lived credentials for its own role, so no key is stored and the gateway can tell agents apart."
