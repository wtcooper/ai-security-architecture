      - mitigation: D3-MAN
        coverage: unknown
        mechanism: >-
          HTTPS MCP servers with OAuth 2.1 (auth: oauth) or mutual TLS (client_cert/client_key) per server in
          mcp_servers; A2A binds loopback until a bearer or per-peer token is set; no protocol-version pinning
        steps:
          - title: Use client certificates for internal MCP servers
            body:
              - Set mcp_servers.<name>.client_cert (combined PEM or [cert, key] list) and client_key on remote
                HTTP servers that require mTLS; a missing file raises a server-scoped error rather than an
                opaque handshake failure.
            url: https://hermes-agent.nousresearch.com/docs/user-guide/features/mcp
          - title: Prefer OAuth over static bearer headers
            body:
              - "Write auth: oauth on hosted MCP servers so Hermes performs discovery, PKCE and refresh;
                tokens are cached at ~/.hermes/mcp-tokens/<server>.json with 0600 permissions and hermes mcp
                login <server> forces re-authentication."
            url: https://hermes-agent.nousresearch.com/docs/user-guide/features/mcp
          - title: Authenticate every A2A peer
            body:
              - Give each peer its own credential with A2A_PEER_TOKENS="alice:tok1,bob:tok2", restrict callers
                with A2A_TRUSTED_PEERS, and only then widen A2A_HOST from 127.0.0.1; inbound text is framed as
                untrusted and cannot invoke slash commands.
            url: https://hermes-agent.nousresearch.com/docs/user-guide/messaging/a2a
        evidence: []
        note: >-
          Capability scope changed: reassess this function. Retained configuration and evidence describe the
          former capability, not verified coverage of every replacement.


