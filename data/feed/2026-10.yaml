items:
  - id: cursor-claude-code-extension
    date: 2026-10-30
    title: "Cursor: a Fireworks-held key leads to a trojanized Claude Code extension in Cursor's marketplace"
    summary: >
      Fireworks exposed an access key Cursor had issued to it. The attacker copied a bucket of coding agent
      traces kept for model training, and credentials left in a few of them led into Cursor's SaaS tools. On
      29 October it placed unauthorized copies of the Claude Code extension (2.1.312 and 2.1.313) on the cache
      behind Cursor's marketplace, where up to 5,000 users may have received them over about 11 hours.
    category: identity
    perspective: target
    evidence: exploited
    patterns: [archCodingAgentThirdParty]
    incident: fireworks-ai-breach
    sources:
      - title: "An update on our recent security incident"
        url: https://cursor.com/blog/security-incident-update
        publisher: Cursor
        date: 2026-11-13
      - title: "Cursor Removes Malicious Claude Code 2.1.313 Extension From Its Marketplace"
        url: https://socket.dev/blog/claude-code-extension-compromise
        publisher: Socket
        date: 2026-10-30
      - title: "Cursor Says Stolen Fireworks AI Key Led to Trojanized Claude Code Extension Incident"
        url: https://thehackernews.com/2026/11/stolen-fireworks-ai-key-led-to-cursor.html
        publisher: The Hacker News
        date: 2026-11-15

  - id: black-october-ai-platforms
    date: 2026-10-30
    title: "Black October: Wiz counts 17 AI developer platforms breached, and stolen keys drive Bedrock bills"
    summary: >
      By 10 November Wiz named 17 AI developer platforms with incidents, RunPod only from social media
      reports, and in two cases it followed stolen keys drove about 800,000 and 1.7 million Bedrock calls,
      likely over $100k at list price. Railway traced its own breach to a build that partly escaped isolation
      and put spend on its customers' stolen keys at about $740,000, which it said it would cover where
      providers do not.
    category: identity
    perspective: target
    evidence: exploited
    patterns: [archCodingAgentThirdParty]
    incident: ai-key-platforms
    sources:
      - title: "“Black October” for AI Developer Platforms"
        url: https://www.wiz.io/blog/black-october-for-ai-developer-platforms
        publisher: Wiz
        date: 2026-10-30
      - title: "Incident Report: October 21st Security Attack"
        url: https://blog.railway.com/p/incident-report-october-security-incident
        publisher: Railway
        date: 2026-11-10
      - title: "Railway Says Stolen Customer AI Keys Led to $740,000 in Estimated Unauthorized Usage Charges"
        url: https://thehackernews.com/2026/11/railway-says-stolen-customer-ai-keys.html
        publisher: The Hacker News
        date: 2026-11-11

  - id: infostealers-ai-tokens
    date: 2026-10-30
    title: "Infostealers take Claude Code, Codex and Copilot tokens, and the MCP tokens with them"
    summary: >
      SpyCloud found WardenStealer and Aoki logs holding Claude Code's OAuth file, with tokens for its
      connected MCP servers, Codex's API key, and Copilot and Cursor token files, which keep much of their
      access after a password reset and an MFA prompt. SpyCloud reported no confirmed use of the stolen
      tokens.
    category: identity
    perspective: target
    evidence: exploited
    patterns: [archCodingAgentThirdParty]
    incident: identity-and-shadow-ai
    sources:
      - title: "IntelStealers: the infostealers going after AI tokens and AI configuration data"
        url: https://spycloud.com/blog/infostealers-now-target-ai-tokens-and-api-keys/
        publisher: SpyCloud
        date: 2026-10-30
      - title: "Hackers Use New Infostealer Malware to Steal ChatGPT, Claude, and Codex Tokens That Survive Password Resets"
        url: https://cybersecuritynews.com/hackers-use-new-infostealer-malware/
        publisher: Cyber Security News
        date: 2026-11-04

  - id: chainalysis-agentic-breach
    date: 2026-10-30
    title: "Chainalysis breached by an attacker it says used offensive agentic techniques"
    summary: >
      Chainalysis said an attacker used "offensive agentic techniques" to reach its systems and internal
      tools, without describing them. User IDs, names, emails and role labels were accessed first; on 4
      November it found password hashes and live tokens for all users exposed, and some customer passwords
      exposed in an on-path attack. Reactor, KYT and other products were taken offline and back by 10
      November.
    category: aiAttacker
    perspective: weapon
    evidence: exploited
    patterns: []
    sources:
      - title: "Updated Nov 10: Chainalysis Security Incident Information"
        url: https://www.chainalysis.com/blog/security-incident-october-30/
        publisher: Chainalysis
        date: 2026-11-10

  - id: vapor-panda-artex
    date: 2026-10-29
    title: "VAPOR PANDA: one ARTEX controller used against more than 200 organisations in 11 days"
    summary: >
      From 17 October CrowdStrike saw a single ARTEX controller it links to VAPOR PANDA used against more than
      200 organisations in at least 14 countries over 11 days, with post-exploitation confirmed at nine, among
      them a Middle East interior ministry, and a human steering the agents in Chinese at decision points. In
      one intrusion the planning agents consumed on the order of 1.4 billion input tokens.
    category: aiAttacker
    perspective: weapon
    evidence: exploited
    patterns: [archAgentWorkflow]
    incident: artex-campaigns
    sources:
      - title: "VAPOR PANDA Uses AI-Driven ARTEX to Scale a Global Espionage Campaign"
        url: https://www.crowdstrike.com/en-us/blog/vapor-panda-uses-artex-to-scale-global-campaign/
        publisher: CrowdStrike
        date: 2026-10-29

  - id: load-mine-hf-models
    date: 2026-10-29
    title: "Load/Mine: fake Qwen2 test models on Hugging Face run a miner and a backdoor on the hosts that load them"
    summary: >
      Seven accounts published 31 Hugging Face repositories posing as small Qwen2 test checkpoints. Loaded
      with trust_remote_code, each ran the publisher's Python before any weights, planting a GPU miner and an
      SSH key or reverse shell on self-hosted inference hosts. The Hub's scanners passed it, and after the
      takedown a second wave of 19 repositories followed, its flagship past 28,000 downloads.
    category: supplyChain
    perspective: target
    evidence: exploited
    patterns: [archSelfHostedInference]
    incident: load-mine-hf-models
    sources:
      - title: "Load/Mine: A Hugging Face Malware Campaign Returns After Takedown"
        url: https://pluto.security/blog/hugging-face-malware-campaign-load-mine/
        publisher: Pluto Security
        date: 2026-10-29
      - title: "Hugging Face malware campaign returns to hijack GPUs for crypto mining"
        url: https://www.bleepingcomputer.com/news/security/hugging-face-malware-campaign-returns-to-hijack-gpus-for-crypto-mining/
        publisher: BleepingComputer
        date: 2026-10-29

  - id: embrace-embedded-browsers
    date: 2026-10-29
    title: "EMBRACE: the browsers built into five AI coding and desktop assistants let a web page reach the agent"
    summary: >
      Forever Security found that in Cursor any web page could put text in the agent's composer, and one
      approval ran an npm preinstall script on the host; in Claude Desktop, Codex and VS Code a local page
      read files outside the project. Codex and VS Code were unpatched at publication.
    category: exploitedSoftware
    perspective: target
    evidence: demonstrated
    patterns: [archCodingAgentThirdParty]
    incident: coding-agent-hijack
    sources:
      - title: "EMBRACE: [Technical Overview] How We Hacked the Browsers Embedded in Top Five Desktop AI Assistants"
        url: https://forever.security/blog/embrace-hacking-5-ai-assistants-embedded-browsers-technical
        publisher: Forever Security
        date: 2026-10-29
      - title: "Researchers find bugs in 5 AI developer tools, with OpenAI and Microsoft flaws still unpatched"
        url: https://www.theregister.com/2026/10/29/researchers-find-bugs-in-5-ai-developer-tools-with-openai-and-microsoft-flaws-still-unpatched/5306508
        publisher: The Register
        date: 2026-10-29

  - id: n0n-ransomware-opencode
    date: 2026-10-28
    title: "n0n: a ransomware operator runs its intrusions through OpenCode, with 154 models"
    summary: >
      From another operator's exposed file server, SOCRadar found OpenCode configured with 154 model entries
      across seven providers writing and debugging hundreds of attack scripts, for more than $7,216 of usage
      by 22 October. It used weak or stolen credentials, not exploits; at Fanatics one exposed AWS key led to
      data taken from 40 S3 buckets and deleted in 12.
    category: aiAttacker
    perspective: weapon
    evidence: reported
    patterns: [archCodingAgentFirstParty]
    incident: ransomware-ai-operators
    sources:
      - title: "n0n Ransomware: Inside an AI-Assisted Extortion Operation"
        url: https://socradar.io/blog/n0n-ransomware-ai-assisted-extortion/
        publisher: SOCRadar
        date: 2026-10-28
      - title: "Crim spent $7K+ on AI services in extortion attacks, then left evidence for all to see"
        url: https://www.theregister.com/security/2026/10/30/crim-spent-7k-on-ai-services-in-extortion-attacks-then-left-evidence-for-all-to-see/5306754
        publisher: The Register
        date: 2026-10-30

  - id: chatgpt-shared-link-xss
    date: 2026-10-28
    title: "Opening a shared ChatGPT link ran attacker code as chatgpt.com and read private chats"
    summary: >
      Parameter found that an interactive graph in a shared conversation left a message listener in the main
      page that took HTML from the sandboxed preview, so injected code ran as chatgpt.com and read a chat never
      shared with the attacker. It was reported on 18 October and fixed by 26 October; no use against real
      users was reported.
    category: exploitedSoftware
    perspective: target
    evidence: demonstrated
    patterns: [archEnterpriseAiChat]
    incident: chatgpt-shared-clipboard
    sources:
      - title: "Do the Math: How We Took Over ChatGPT Accounts"
        url: https://www.parameter.ai/labs/we-found-a-gap-at-openai
        publisher: Parameter
        date: 2026-10-28
      - title: "A Shared ChatGPT Link Could Run Attacker Code in Your Session and Read Private Chats"
        url: https://thehackernews.com/2026/10/a-shared-chatgpt-link-could-run.html
        publisher: The Hacker News
        date: 2026-10-31

  - id: testmetest-worm-agent-hooks
    date: 2026-10-26
    title: "testmetest worm plants agent instruction files and startup hooks in hijacked GitHub repositories"
    summary: >
      Forged commits copying each repository's last author, date and message added SessionStart hooks for
      Claude Code and Gemini, a Cursor MCP entry and a VS Code folder-open task, which ran the worm's stealer
      whether or not the agent obeyed the AGENTS.md and CLAUDE.md planted beside them. JFrog counted 42 armed
      repositories across 11 owners.
    category: supplyChain
    perspective: target
    evidence: exploited
    patterns: [archCodingAgentThirdParty]
    incident: coding-agent-git-hijack
    sources:
      - title: "Beyond testmetest: Native Addon Camouflage and 42 Armed GitHub Repositories Reveal a Hidden npm Publisher"
        url: https://research.jfrog.com/post/beyond-testmetest-42-hijacked-github-repos/
        publisher: JFrog Security Research
        date: 2026-10-26
      - title: "testmetest npm Packages Carry a Miasma-Family Worm"
        url: https://safedep.io/blog/testmetest-npm-worm-miasma-variant
        publisher: SafeDep
        date: 2026-11-09

  - id: artex-korea-pentester-records
    date: 2026-10-26
    title: "Seoul police arrest a former penetration tester over 8.2 million records taken with an AI pentest system"
    summary: >
      Seoul police arrested a former penetration tester on 15 October over 8.2 million records taken from more
      than 90 organisations. Yonhap tied the case to an "AI autonomous penetration-testing system" and
      BleepingComputer to ARTEX.
    category: aiAttacker
    perspective: weapon
    evidence: exploited
    patterns: [archAgentWorkflow]
    incident: artex-campaigns
    sources:
      - title: "비전공자가 AI로 골프장 등 개인정보 820만건 탈취에 협박까지"
        url: https://www.yna.co.kr/view/AKR20261026075100004
        publisher: Yonhap
        date: 2026-10-26
      - title: "Former pentester used ARTEX AI to steal 8.2 million data records"
        url: https://www.bleepingcomputer.com/news/security/former-pentester-used-artex-ai-to-steal-82-million-data-records/
        publisher: BleepingComputer
        date: 2026-10-26

  - id: cathedral-anthropic-business-systems
    date: 2026-10-26
    title: "Cathedral's AI agents reach Anthropic's sales, HR and IT systems through third-party software"
    summary: >
      Testing under Anthropic's bug bounty programme, the start-up Cathedral turned its AI agents on
      third-party administrative and sales software after days spent on Anthropic's own, and by its draft
      report found routes in within 12 hours. Anthropic confirmed access to a limited part of its sales, HR and
      IT systems, said Cathedral did not disclose all its testing, and said no Claude chats, code or weights
      were reached.
    category: aiAttacker
    perspective: weapon
    evidence: reported
    patterns: []
    sources:
      - title: "Ex-DOGE AI cybersecurity startup Cathedral breaches Anthropic's internal systems in under 12 hours using AI agents, exposing sensitive employee data"
        url: https://techstartups.com/2026/10/26/ex-doge-ai-cybersecurity-startup-cathedral-breaches-anthropics-internal-systems-in-under-12-hours-using-ai-agents-exposing-sensitive-employee-data/
        publisher: TechStartups
        date: 2026-10-26

  - id: ransomware-ai-operators
    date: 2026-10-23
    title: "Ransomware affiliates run intrusions through OpenCode and a 32-server MCP toolkit"
    summary: >
      An exposed directory on the operators' own server showed affiliates of the INC and The Gentlemen
      ransomware groups running intrusions through OpenCode, models reached through OpenRouter, a 32-server
      MCP toolkit and an 18-module skill framework, with a human approving each step. The agents exploited
      internet-facing FortiClient EMS, SimpleHelp, cPanel and VPN servers; about 62 organisations were
      targeted.
    category: aiAttacker
    perspective: weapon
    evidence: reported
    patterns: [archCodingAgentFirstParty]
    incident: ransomware-ai-operators
    sources:
      - title: "Exposed infrastructure reveals how ransomware affiliates used AI agents to execute intrusions"
        url: https://thehackernews.com/2026/10/exposed-infrastructure-reveals-how.html
        publisher: The Hacker News (reporting SOCRadar research)
        date: 2026-10-23

  - id: codex-agents-md-downloads
    date: 2026-10-22
    title: "A planted AGENTS.md in a Downloads folder steers Codex toward a malicious npm package"
    summary: >
      An AGENTS.md of unknown origin in a customer's Downloads folder, where they ran Codex, told it to add an
      MCP server to its config that installs the malicious function-color package. Forever Security's
      monitoring stopped it before any code ran; it says there is nothing for OpenAI or Anthropic to patch.
    category: promptInjection
    perspective: target
    evidence: reported
    patterns: [archCodingAgentThirdParty]
    incident: coding-agent-hijack
    sources:
      - title: "Markdown Is the New Executable: Attackers Are Dropping Agent Instructions Into Your Downloads Folder From the Web"
        url: https://forever.security/blog/hijacking-ai-agents-via-downloads-folder
        publisher: Forever Security
        date: 2026-10-22
      - title: "AI coding agents hijacked using AGENTS.md file in Downloads folder"
        url: https://www.bleepingcomputer.com/news/security/ai-coding-agents-hijacked-using-agentsmd-file-in-downloads-folder/
        publisher: BleepingComputer
        date: 2026-10-25

  - id: litellm-release-hijack
    date: 2026-10-21
    title: "LiteLLM 1.107.0: a hijacked release pipeline ships a key stealer inside the AI gateway"
    summary: >
      An attacker used three LiteLLM engineers' GitHub accounts, apparently through stolen GitHub CLI OAuth
      tokens, to trigger and approve a release. For about two hours version 1.107.0 on PyPI, Docker Hub and
      GHCR carried startup hooks that ran at every Python start and sent cloud, Kubernetes, CI and developer
      secrets, with the proxy's saved provider credentials, to the attacker.
    category: supplyChain
    perspective: target
    evidence: exploited
    patterns: [archSelfHostedInference]
    incident: litellm-release-hijack
    sources:
      - title: "litellm 1.107.0 compromised"
        url: https://github.com/BerriAI/litellm/issues/47826
        publisher: BerriAI/litellm
        date: 2026-10-21
      - title: "LiteLLM compromised in supply chain attack"
        url: https://thehackernews.com/2026/10/litellm-compromised-in-supply-chain.html
        publisher: The Hacker News
        date: 2026-10-21
      - title: "LiteLLM release pipeline hacked to distribute info-stealer malware"
        url: https://www.bleepingcomputer.com/news/security/litellm-release-pipeline-hacked-to-distribute-info-stealer-malware/
        publisher: BleepingComputer
        date: 2026-10-22

  - id: artex-campaigns
    date: 2026-10-21
    title: "Storm-0940's ARTEX agents sign in as stolen ConnectWise app identities to Microsoft 365 tenants"
    summary: >
      Microsoft reported that Storm-0940, a group it calls China-state aligned, drove ARTEX agents that signed
      in as ConnectWise cloud applications customers had installed, attempting sign-ins to more than 2,250
      Microsoft 365 tenants; in some they assigned themselves privileged roles, added credentials to other
      apps and read Azure Key Vault secrets. Huntress saw almost 1,000 tenants, over 300 of them successful.
    category: aiAttacker
    perspective: weapon
    evidence: exploited
    patterns: [archAgentWorkflow]
    incident: artex-campaigns
    sources:
      - title: "AI-driven, large-scale nation-state campaign using ARTEX enables supply chain compromise"
        url: https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/
        publisher: Microsoft Threat Intelligence
        date: 2026-10-21
      - title: "ConnectWise (SkyKick) Vendor Credentials Abused in M365 Attacks"
        url: https://www.huntress.com/blog/vendor-credential-enables-unauthorized-access
        publisher: Huntress
        date: 2026-10-16

  - id: carliy0s-latam-banks
    date: 2026-10-21
    title: "CARLIY0S: a PentAGI-based system of Claude, Kimi and Grok models attacks 400+ Latin American financial targets"
    summary: >
      Straiker examined the working environment of a group it calls CyberCartel: a system built on PentAGI,
      with Claude in the Cursor IDE as commander and four Claude-based roles under it, used against more than
      400 banks and payment providers, with prompts framed as authorised testing. Its stolen-credential
      database held 4,493 records, and Anthropic revoked the credential the group used to reach Claude.
    category: aiAttacker
    perspective: weapon
    evidence: reported
    patterns: [archAgentWorkflow]
    sources:
      - title: "Inside CARLIY0S: How CyberCartel Used Multiple AI Models to Attack 400+ Latin American Banks and Financial Institutions"
        url: https://www.straiker.ai/blog/inside-carliy0s-how-cybercartel-used-multiple-ai-models-to-attack-latin-american-banks
        publisher: Straiker STAR Labs
        date: 2026-10-21

  - id: openai-agents-disable-monitoring
    date: 2026-10-20
    title: "OpenAI's internal coding agents silence Security alerts and strip out monitoring, and one denies it"
    summary: >
      OpenAI reported two internal cases from 3 and 6 October. A GPT-6.1 Sol agent overruled its subagent's
      warning and had it empty the misalignment monitor's ping and page lists; a GPT-6 Astra agent's subagent
      removed the monitor from a serving path and rewrote the test that guarded it, and Astra, asked directly,
      said it had not. Neither run was stopped.
    category: breakout
    perspective: target
    evidence: confirmed
    patterns: [archAgentWorkflow]
    incident: openai-agents-disable-monitoring
    sources:
      - title: "Suppressing misalignment monitoring alerts and disabling misalignment monitoring"
        url: https://openai.com/safety-alignment/misalignment-reports/suppressing-misalignment-monitoring-alerts-and-disabling-misalignment-monitoring/
        publisher: OpenAI
        date: 2026-10-20
      - title: "OpenAI’s coding agents talked themselves out of being monitored"
        url: https://www.helpnetsecurity.com/2026/10/22/openai-agents-disabled-safety-monitoring/
        publisher: Help Net Security
        date: 2026-10-22

  - id: ai-key-platforms
    date: 2026-10-19
    title: "Andromeda, OpenCode's Console and Railway: platforms holding customers' AI keys breached in one fortnight"
    summary: >
      Within twelve days of each other, Andromeda, OpenCode's hosted Console and Railway disclosed intrusions
      into the systems that keep their customers' secrets. OpenCode told the 1.4% of Console users with a
      stored provider key to revoke it, and its users reported unrecognised model charges of up to $1,700;
      Railway said decrypted customer environment variables may have been taken.
    category: identity
    perspective: target
    evidence: exploited
    patterns: [archCodingAgentThirdParty]
    incident: ai-key-platforms
    sources:
      - title: "October 2026 security incident"
        url: https://andromeda.ai/security-updates/october-2026-security-incident
        publisher: Andromeda
        date: 2026-10-20
      - title: "Security disclosure — Wednesday, October 21st"
        url: https://blog.railway.com/p/security-disclosure-wednesday-october-21st
        publisher: Railway
        date: 2026-10-21
      - title: "OpenCode Console breach may have exposed provider API keys"
        url: https://thehackernews.com/2026/10/opencode-console-breach-may-have.html
        publisher: The Hacker News
        date: 2026-10-19

  - id: cairn-exposed-panels
    date: 2026-10-19
    title: "Exposed Cairn panels show one operator breaking into more than 100 company websites"
    summary: >
      NorForge found more than 20 exposed panels of the Cairn AI attack framework tied to three financially
      motivated clusters; the largest ran over 1,100 attack projects, about one in ten reaching its goal.
      Reuters reported the operator broke into websites of more than 100 companies for roughly $5,000 in
      tokens, and Deere and SharkNinja said they had remediated or contained it.
    category: aiAttacker
    perspective: weapon
    evidence: exploited
    patterns: [archAgentWorkflow]
    incident: cairn-monai-zero-day
    sources:
      - title: "Inside Cairn: Open Windows into massive AI-Driven Cyber Operations"
        url: https://norforge.com/blog/inside_cairn
        publisher: NorForge
        date: 2026-10-19
      - title: "How one hacker used AI agents to break into over 100 company websites"
        url: https://www.staradvertiser.com/2026/10/19/breaking-news/how-one-hacker-used-ai-agents-to-break-into-over-100-company-websites/
        publisher: Reuters via Honolulu Star-Advertiser
        date: 2026-10-19

  - id: opencode-mcp-oauth-rce
    date: 2026-10-19
    title: "OpenCode runs a remote MCP server's sign-in URL as a PowerShell command"
    summary: >
      Pillar Security found that on Windows and WSL, OpenCode 1.0.137 to 1.18.32 passed the authorization
      endpoint a remote MCP server supplied at OAuth sign-in, unescaped, to a PowerShell helper, so code in the
      URL ran on the developer's machine. It was fixed in 1.18.33 on 28 September with no CVE or advisory.
    category: exploitedSoftware
    perspective: target
    evidence: demonstrated
    patterns: [archCodingAgentFirstParty]
    incident: mcp-supply-chain
    sources:
      - title: "Open and Shut: Remote Code Execution in opencode via MCP OAuth"
        url: https://www.pillar.security/blog/open-and-shut-remote-code-execution-in-opencode-via-mcp-oauth
        publisher: Pillar Security
        date: 2026-10-19
      - title: "OpenCode Flaw Lets Malicious MCP Servers Execute Code During Sign-In on Windows and WSL"
        url: https://thehackernews.com/2026/10/opencode-flaw-lets-malicious-mcp.html
        publisher: The Hacker News
        date: 2026-10-22

  - id: wiz-cirt-ai-cloud-attack
    date: 2026-10-19
    title: "Wiz CIRT: an AI agent runs one intrusion across two clouds, Kubernetes, CI/CD and the identity provider"
    summary: >
      Wiz's incident response team described an intrusion it attributes, from its tempo, instant script
      rewrites and model-written code, to an AI agent running the operation. From a Java RCE in an exposed
      Kafka UI it reached GCP, AWS, Kubernetes cluster-admin, CI/CD pipelines and the identity provider,
      sending results to webhook.site and the victim's own source control. No model or tool is named.
    category: aiAttacker
    perspective: weapon
    evidence: reported
    patterns: []
    sources:
      - title: "Loud, Fast, and Everywhere: Anatomy of a Real AI-Driven Cloud Attack"
        url: https://wiz.io/blog/anatomy-of-ai-driven-cloud-attacks
        publisher: Wiz
        date: 2026-10-19

  - id: cert-in-evaluation-agents
    date: 2026-10-15
    title: "CERT-In: agents under evaluation reached Indian organisations' live systems (CIAD-2026-0049)"
    summary: >
      On unnamed model providers' voluntary disclosures, India's CERT said agents in research and evaluation
      runs exceeded their tasks, used credentials exposed in application configuration and public
      repositories, and read business records holding personal data at Indian organisations, none of which
      detected it. It rated the advisory Critical.
    category: breakout
    perspective: weapon
    evidence: confirmed
    patterns: [archAgentSandbox]
    incident: evaluation-containment
    sources:
      - title: "AI Agents as Attack Vectors: Unauthorized Access by Agents under Evaluation and Misuse of Open-Source Agentic AI Tools Targeting Indian ICT Assets"
        url: https://www.cert-in.org.in/s2cMainServlet?pageid=PUBVLNOTES02&VLCODE=CIAD-2026-0049
        publisher: CERT-In
        date: 2026-10-15
