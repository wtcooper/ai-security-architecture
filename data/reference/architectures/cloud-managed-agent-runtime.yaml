id: archManagedAgentRuntime
surface: surfaceCloud
title: Managed agent runtime
abbrev: Managed agent runtime

summary:
  - >
    A cloud provider's hosted agent service: the loop, the memory, the sandbox and the tool
    gateway supplied as published, separately billed products, with the customer owning the
    front end, the agent definitions, the tools admitted, the identities and the audit export.
    The governance plane arrives built in, and the trade is that it is configured rather than
    designed.

description:
  - >
    Every provider converged on the same decomposition: a runtime, a memory service, a tool
    gateway, an identity service, a code interpreter and browser, observability, evaluation and
    policy. That convergence is itself the finding — the governance plane most self-built agent
    architectures never get is exactly what these services sell. The provider blocks on this
    diagram are drawn because they are documented, separately addressable products, not
    inferred internals; the loop's execution behind them remains genuinely uninspectable.
  - >
    The consequential choice is between the managed harness and the code escape hatch. Every
    provider offers both: a declarative agent whose loop they run, and a bring-your-own-code
    runtime where they supply the sandbox and the identity but the loop is the customer's. The
    first inherits the platform's guardrails automatically; the second inherits only what it
    explicitly calls. Teams routinely start with the first, hit a limitation, move to the
    second, and do not notice which controls stopped applying.
  - >
    Managed memory is the component most likely to be switched on without a decision. Its scope
    — per session, per user, or shared across users — is a configuration flag with a
    data-protection consequence, and cross-user scope means one user's content can shape
    another's turn.
  - >
    The genuine advantage is agent identity: first-class, revocable principals distinct from
    the service and from the user, supplied as a service. Using them properly — rather than
    collapsing everything onto one service principal — is most of what separates a
    well-governed deployment from a poorly governed one on the same platform. The costs are
    portability and opacity: the policy language moves to no other provider, and debugging a
    misbehaviour means reading traces rather than code.

distinguishedBy:
  - >
    Against building the agent tier: the same components with the provider supplying them. The
    work moves from designing an identity model, a policy engine and a sandbox to configuring
    three, and from having to build observability to having to export it.
  - >
    Against a vendor in-app action agent: that agent belongs to a SaaS product and acts on its
    records. This is a platform for building the customer's own agents on the customer's own
    data, with the loop hosted rather than the application.

exemplars:
  - name: Hyperscaler agent runtimes
    note: >
      Managed agent services decomposed into runtime, memory, gateway, identity, sandbox,
      observability, evaluation and policy, billed per component.
    asOf: "2026-08"
  - name: Managed harness with a code escape hatch
    note: >
      A declarative agent the provider runs, alongside a bring-your-own-code runtime for cases
      the declarative form cannot express. The pair is now standard across providers.
    asOf: "2026-08"

blocks:
  - id: endUser
    kind: actor
    title: End user
    icon: person
    col: 0
    row: 1
    note: >
      Whose identity should reach the tool call, rather than being replaced by the agent's along
      the way.

  - id: agentDef
    kind: service
    title: Agent definition & code
    col: 1
    row: 0
    cosaiComponent: componentAgentSystemInstruction
    note: >
      The deployable artifact that decides what the agent may do — instructions, tool
      configuration, or the customer's own loop code. Treating it with less rigour than
      application code is common and unwarranted.
    items:
      - id: definition
        label: Declarative definition
        icon: doc
        note: Instructions and tool bindings the provider's harness runs, inheriting platform guardrails automatically.
      - id: customCode
        label: Custom loop code
        icon: code
        note: The escape hatch. It inherits only the controls it explicitly calls.

  - id: frontEnd
    kind: service
    title: Application front end
    col: 1
    row: 1
    cosaiComponent: componentApplication
    note: >
      The customer's surface, where the user's identity is established — and where output
      handling still belongs, because only the application knows where the text will land.
    items:
      - id: ui
        label: App & API surface
        icon: globe
        note: The published entry point users and systems call.
      - id: identity
        label: User identity
        icon: shield
        note: Established here and carried into the runtime, or the agent acts as itself for everyone.

  - id: managedRuntime
    kind: provider
    title: Managed runtime
    col: 2
    row: 1
    cosaiComponent: componentReasoningCore
    note: >
      The hosted loop, invoked and configured through published interfaces; the execution itself
      is not inspectable. Provider code in the path, released on the provider's schedule, with
      the customer's agent inside it.
    items:
      - id: runtimeApi
        label: Runtime API
        icon: plug
        note: Where agents are invoked and sessions managed — the published surface over an unreadable loop.
      - id: declarativeHarness
        label: Declarative harness
        icon: agent
        note: The provider runs the loop and applies guardrails automatically.
      - id: codeRuntime
        label: Custom-code runtime
        icon: code
        note: The customer's loop in the provider's container — sandbox and identity supplied, guardrails only on request.

  - id: managedMemory
    kind: provider
    title: Managed memory
    col: 3
    row: 0
    cosaiComponent: componentMemory
    note: >
      A documented, separately billed memory service whose scope — session, user or cross-user —
      is selected by configuration. Cross-user scope means one user's content reaches another's
      turn, and it is a flag rather than a design review.
    items:
      - id: memoryStore
        label: Memory store
        icon: folder
        note: What the agent keeps between turns and reads back as context.
      - id: scopeConfig
        label: Scope configuration
        icon: gear
        note: The whole control, in one flag.

  - id: managedSandbox
    kind: provider
    title: Managed sandbox
    col: 2
    row: 2
    note: >
      Code interpreter and hosted browser, isolated by the provider. Among the strongest reasons
      to choose a managed runtime over building the tier — and the isolation guarantee is a
      vendor claim the customer cannot test.
    items:
      - id: interpreter
        label: Code interpreter
        icon: code
        note: Generated code runs here, not in the application's process.
      - id: browser
        label: Hosted browser
        icon: globe
        note: Web content is fetched and rendered inside the provider's isolation.

  - id: toolGateway
    kind: provider
    title: Managed tool gateway
    col: 3
    row: 1
    note: >
      The provider's brokered path to tools and MCP servers, with scoping and logging supplied.
      Reached automatically by a declarative agent and only on request by custom code — the
      asymmetry deployments most often lose coverage to.
    items:
      - id: brokering
        label: Scoped tool brokering
        icon: key
        note: Per-tool grants under the agent's own identity, not a service-wide credential.
      - id: mcpEndpoints
        label: MCP & connectors
        icon: plug
        note: The tool population the customer admits — the part of the tool plane the customer owns.

  - id: downstream
    kind: external
    title: Customer systems
    col: 4
    row: 2
    note: >
      The records the agent acts on under grants the customer issues, and the external content
      it reads — which comes back as context nothing has authenticated.
    items:
      - id: records
        label: Business records
        icon: db
        note: Reached under grants issued to the platform, ideally per tool and per agent.
      - id: webContent
        label: External content
        icon: globe
        note: Documents and pages the agent reads; the platform's guardrails see it, nothing vouches for it.

  - id: governance
    kind: governance
    title: Customer governance
    col: 5
    row: 0
    rowSpan: 3
    note: >
      The controls the customer owns on a platform the provider operates: agent identities, tool
      and agent admission, policy and guardrail configuration, evaluation gates, and the audit
      export that keeps the trail out of the provider's console alone.
    items:
      - id: agentIdentities
        label: Agent identities
        icon: key
        note: A first-class, revocable principal per agent — supplied by the platform and frequently collapsed back into one shared principal by teams who do not use it.
      - id: admission
        label: Agent & tool admission
        icon: gear
        note: Which definitions may deploy and which tools may be offered. Admission, not discovery.
      - id: policyConfig
        label: Policy & guardrail config
        icon: shield
        note: Authored by the customer, enforced by the provider inside a loop the customer cannot see.
      - id: evalGates
        label: Evaluation gates
        icon: scale
        note: An agent definition that has not faced adversarial input should not reach a production alias.
      - id: auditExport
        label: Audit export
        icon: eye
        note: Traces exported out of the provider's console, so they can be correlated with everything else.

edges:
  - from: endUser
    to: frontEnd
    path: primary
    bidir: true
    label: request / response
    note: >
      The user's identity is established here and must be carried the rest of the way, or
      per-user authorization silently becomes a service-wide grant.
  - from: frontEnd
    to: managedRuntime
    path: primary
    bidir: true
    label: invoke agent
    note: >
      Two identities on one call — the application's and the user it acts for. Dropping the
      second is the confused-deputy failure this architecture makes easy to avoid and easy to
      commit.
  - from: agentDef
    to: managedRuntime
    path: secondary
    label: deploy
    note: >
      An agent definition is a deployable artifact that decides what the agent may do. It
      deserves the same review, gating and provenance as application code.
  - from: managedRuntime
    to: managedMemory
    path: secondary
    bidir: true
    route: vh
    label: session & memory
    note: >
      The scope flag on this edge is the whole control. Cross-user scope is a supported
      configuration whose consequence is one user's content shaping another's turn.
  - from: managedRuntime
    to: managedSandbox
    path: secondary
    bidir: true
    label: code & browsing
    note: Generated code and web rendering go to provider-operated isolation rather than anywhere nearer the data.
  - from: managedRuntime
    to: toolGateway
    path: primary
    bidir: true
    note: >
      Automatic for a declarative agent, opt-in for custom code. The controls on this edge are
      the ones the escape hatch silently drops.
  - from: toolGateway
    to: downstream
    path: external
    bidir: true
    label: tool calls / content
    note: >
      Actions land on customer systems under per-tool grants; whatever is read comes back as
      context indistinguishable from instruction.
  - from: governance
    to: toolGateway
    path: governance
    label: identity & admission
    note: >
      Per-agent principals and the admitted tool list are applied here — where the managed
      identity earns its place, and where one shared principal undoes it.
  - from: governance
    to: managedMemory
    path: governance
    label: scope configuration
    note: Memory scope is decided here as a reviewed policy choice, not left as a default.

pins:
  risks:
    - risk: riskAgenticDelegationConfusedDeputy
      at: frontEnd->managedRuntime
      note: Three identities are in play — the application's, the user's and the agent's — and the failure is collapsing them into one.
    - risk: riskShadowAndUnknownAgents
      at: agentDef
      note: A managed runtime makes agents cheap to create, so the population grows faster than the inventory.
    - risk: riskInsecureIntegratedComponent
      at: managedRuntime
      note: The runtime, its memory, its gateway and its sandbox are the provider's code in the path, released on the provider's schedule.
    - risk: riskAgentDelegationChainOpacity
      at: managedRuntime
      note: The loop is not inspectable; traces are the only window, and they only exist where the platform emits them.
    - risk: riskSensitiveDataDisclosure
      at: managedMemory
      note: Cross-user memory scope puts one user's content in another user's turn, selected by a configuration flag.
    - risk: riskPromptInjection
      at: toolGateway->downstream
      note: Content read through tools re-enters the loop as context; the platform's guardrails see it, nothing authenticates it.
    - risk: riskRogueActions
      at: toolGateway->downstream
      note: Consequential writes on customer systems from a loop nobody watches, bounded only by the grants and policy the customer configured.
    - risk: riskStaleAgentIdentityBinding
      at: governance->toolGateway
      note: Revocable per-agent principals only help if revocation actually happens when agents are retired or repurposed.
    - risk: riskToolRegistryTampering
      at: toolGateway
      note: The admitted tool list programs the agents; whoever writes it decides what every agent can be made to do.
    - risk: riskInsecureModelOutput
      at: frontEnd
      note: The runtime's response is unauthenticated content, and only the application knows whether it is about to be rendered or executed.

  capabilities:
    - capability: capabilityNhiManagement
      at: governance
      note: Use the platform's per-agent identities — distinct, revocable principals — instead of collapsing every agent onto one service principal.
    - capability: capabilityIga
      at: endUser->frontEnd
      note: Establish the user's identity here and propagate it to the tool call, so authorization stays per-user.
    - capability: capabilityToolPermissionScoping
      at: governance->toolGateway
      note: Per-tool, per-agent grants configured at the gateway, not a standing credential shared by everything.
    - capability: capabilityAgentRegistry
      at: agentDef
      note: Admit and inventory agent definitions like deployable code, because that is what they are.
    - capability: capabilityModelGuardrails
      at: managedRuntime
      note: Verify guardrail coverage on the custom-code path explicitly — declarative agents get it free, the escape hatch does not.
    - capability: capabilityMemoryProtection
      at: managedRuntime->managedMemory
      note: Set memory scope per session or per user as a reviewed decision; treat cross-user scope as a design exception.
    - capability: capabilityAgentSandboxing
      at: managedRuntime->managedSandbox
      note: Keep code execution and browsing in the provider's isolation as the only path, not an option.
    - capability: capabilityAgentRuntimeEnforcement
      at: managedRuntime
      note: Author per-invocation policy the platform enforces inside the loop — the customer's half of the shared-responsibility shape.
    - capability: capabilityAgentObservability
      at: managedRuntime
      note: Traces of steps, tool calls and decisions are the only window into an unreadable loop; turn all of it on.
    - capability: capabilityAuditLogging
      at: governance
      note: Export the trail — a trace that lives only in the provider's console cannot be correlated with anything else.
    - capability: capabilityModelEvals
      at: agentDef
      note: Gate every definition change behind adversarial evaluation before it reaches a production alias.
    - capability: capabilityAiTprm
      at: managedSandbox
      note: The isolation guarantee is a vendor claim the customer cannot test; assure it the way any critical vendor control is assured.

scenarios:
  - title: A user's request becomes a tool call
    steps:
      - follow: endUser->frontEnd
        note: The user's identity is established at the customer's own surface.
      - follow: frontEnd->managedRuntime
        note: The invocation carries two identities — the application's and the user's.
      - follow: managedRuntime->toolGateway
        note: The loop plans; the tool call leaves under the agent's own principal, scoped per tool.
      - follow: toolGateway->downstream
        note: The action lands on customer systems under the grant the customer issued.
      - follow: downstream->toolGateway
        note: Whatever was read returns as context nothing has authenticated.
      - follow: managedRuntime->frontEnd
        note: The response comes back; output handling is still the application's job.
  - title: A team takes the code escape hatch
    steps:
      - follow: agentDef->managedRuntime
        note: The declarative definition is replaced with custom loop code after hitting a limitation.
      - follow: managedRuntime->toolGateway
        note: Tool brokering now happens only if the code calls the gateway — nothing routes it there automatically.
      - follow: managedRuntime->managedMemory
        note: The guardrails and scoping the declarative harness applied for free now apply only where the code asks. Nobody notices which controls stopped.
  - title: Memory scope crosses users
    steps:
      - follow: frontEnd->managedRuntime
        note: User A's turn runs, and the agent writes what it learned.
      - follow: managedRuntime->managedMemory
        note: The write lands in a store whose scope flag was left at a shared default.
      - follow: managedMemory->managedRuntime
        note: User B's turn reads it back as context — one user's content shaping another's session, looking like a feature.

