# GitHub Copilot cloud agent — one entity per product × reference architecture. Facts are dated
# (asOf) and cite the vendor's own documentation; re-verify before enforcing. Schema:
# data/tooling/README.md. Excluded: Jules, Devin and Cursor inside GitHub — announced partners,
# not shipped; Copilot Workspace — gone.
# 2026-09-15: added sandboxing, egress, runtime enforcement, credential isolation and MCP rows after the managed-runtime drawing pinned them; fetched about-cloud-agent, customize-the-firewall, hooks-reference, configure-secrets-and-variables, mcp-and-cloud-agent, supported-surfaces-for-policies, risks-and-mitigations (all 200).
vendor: github
family: GitHub Copilot cloud agent
tools:
  - id: toolCopilotCloudAgent
    name: GitHub Copilot cloud agent
    surfaceClasses:
      - cloudAgent
      - ciIntegration
    variants:
      - name: Copilot cloud agent (formerly "coding agent") and automations
        class: cloudAgent
        url: https://docs.github.com/en/copilot/concepts/agents/cloud-agent/about-cloud-agent
      - name: Copilot code review (agentic; PR approval in public preview since 2026-09-01)
        class: ciIntegration
        url: https://docs.github.com/en/copilot/concepts/agents/code-review
      - name: Partner coding agents — Anthropic Claude and OpenAI Codex (public preview)
        class: cloudAgent
        url: https://docs.github.com/en/copilot/concepts/agents/about-third-party-coding-agents
      - name: Agent apps (partner GitHub Apps exposing agents; "Agent apps" policy)
        class: cloudAgent
        url: https://docs.github.com/en/copilot/concepts/agents/agent-apps
      - name: GitHub Agentic Workflows (public preview; markdown compiled to a hardened .lock.yml)
        class: ciIntegration
        url: https://docs.github.com/en/copilot/concepts/agents/about-github-agentic-workflows
    architecture: archHostedAgentSessions
    status: ga
    asOf: "2026-09"
    summary:
      - "The cloud agent takes an issue, PR comment, chat hand-off or automation trigger and works
        in an ephemeral GitHub Actions environment (59-minute hard limit) on a copilot/ branch,
        pushing a draft PR that a human must review and merge. Code review, partner agents
        (Claude, Codex), agent apps and Agentic Workflows run on the same Actions substrate and
        share its mitigations; automations re-run the agent on schedules and repository events."
      - "Inference runs on the Copilot API against enterprise-enabled models; the runner talks to
        api.<plan>.githubcopilot.com behind an egress firewall that, by default, allows package
        registries and certificate authorities only. The GitHub MCP server is wired in with a
        read-only token scoped to the repository; other MCP servers run with whatever secrets the
        administrator places in the Agents secret type — and are used without approval prompts."
      - "Governance is enterprise-first: AI controls > Agents > Copilot Cloud Agent with Enabled
        for selected organisations (custom properties via REST), organisation and repository
        access controls, Actions workflow approval, validation tools (CodeQL, secret scanning,
        dependency review, Copilot review), runner type and the firewall. Sessions are visible at
        github.com/copilot/agents and in the audit log as actor:Copilot with agent_session_id."
    facts:
      - label: Plans
        value: "All paid Copilot plans; Business and Enterprise require the cloud agent policy. Billing is GitHub Actions minutes plus AI credits; organisation budgets block agent features when exhausted."
        url: https://docs.github.com/en/copilot/concepts/agents/cloud-agent/about-cloud-agent
      - label: Inference & routing
        value: "Copilot API from the Actions runner (api.business / api.enterprise.githubcopilot.com); models per the enterprise Configure models policy; data-resident routing under the \"Restrict Copilot to data residency compliant models\" policy (+10% credits). Enterprise BYOK does not apply to the cloud agent."
        url: https://docs.github.com/en/enterprise-cloud@latest/admin/data-residency/github-copilot-with-data-residency
      - label: Data leaving the environment
        value: "Repository contents, issue and PR text and tool output go to the Copilot API; outbound network from Bash tools is firewalled; MCP servers and copilot-setup-steps are not firewalled; session logs and commits persist on GitHub."
        url: https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-the-firewall
      - label: Data retention / training
        value: "Ephemeral environment destroyed after the session; each agent commit links permanently to its session logs (application card). GitHub does not use Copilot Business or Enterprise customer data to train AI models; provider terms are per model on the model-hosting page (OpenAI and xAI zero retention, Anthropic per its ZDR documentation, Google no training)."
        url: https://docs.github.com/en/copilot/reference/ai-models/model-hosting
      - label: Policy change 2026-09-28
        value: "Copilot Chat on github.com, Chat in GitHub Mobile and the cloud agent merge under one policy on or after 2026-09-28; chat retention moves from 28 days to the life of the account. Admins must confirm the unified policy before that date."
        url: https://github.blog/changelog/2026-08-28-upcoming-changes-to-github-copilot-policies-and-billing/
      - label: Docs index
        value: "Cloud agent concepts: about, risks and mitigations, MCP, automations, access management."
        url: https://docs.github.com/en/copilot/concepts/agents/cloud-agent/risks-and-mitigations
    items:
      - title: Enablement, targeting and repository scope
        body:
          - "Enterprise > AI controls > Agents > Copilot Cloud Agent: Disabled (default), Enabled
            for all organizations, Enabled for selected organizations (UI, or by custom property
            through the REST API), or let organisations decide. Organisation owners then set
            Repository access (all or selected repositories); owners and users can opt individual
            repositories out. Only users with write access can trigger the agent, and automations
            ignore events from users without write access by default."
          - "Third-party agents and agent apps are separate policies: disabling the cloud agent does
            not disable Claude or Codex agents, and the \"Agent apps\" policy gates partner apps
            installed in the enterprise's organisations. Content exclusion does not apply to
            third-party agents."
        links:
          - title: Enabling the cloud agent in your enterprise
            url: https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-enterprise/manage-agents/enable-copilot-cloud-agent
          - title: Managing access to the cloud agent
            url: https://docs.github.com/en/copilot/concepts/enterprise/cloud-agent-access
          - title: Supported surfaces for policies
            url: https://docs.github.com/en/copilot/reference/supported-surfaces-for-policies
      - title: The environment — setup steps, secrets, runners, firewall
        body:
          - ".github/workflows/copilot-setup-steps.yml on the default branch (job name
            copilot-setup-steps; only steps, permissions, runs-on, services, snapshot and
            timeout-minutes are honoured; 59 minutes maximum) prepares the runner. Secrets and
            variables come only from the Agents type (repository or organisation Settings > Secrets
            and variables > Agents); COPILOT_MCP_* entries reach MCP servers only; Actions,
            Codespaces and Dependabot secrets are never exposed."
          - "The firewall is on by default with a recommended allowlist (OS and language package
            registries, container registries, certificate authorities, Playwright browser hosts);
            organisations and repositories add domain or URL rules or disable it. It applies only
            to processes the agent starts through its Bash tools — not MCP servers, not setup
            steps. Blocked requests are reported in the PR body or a comment. Runners default to
            GitHub-hosted; larger runners and ARC-managed self-hosted runners (Ubuntu x64; never
            non-ARC) need api.githubcopilot.com, uploads.github.com and
            user-images.githubusercontent.com."
        links:
          - title: Configure the development environment
            url: https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/customize-the-agent-environment
          - title: Configure secrets and variables for the cloud agent
            url: https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/configure-secrets-and-variables
          - title: Customizing or disabling the firewall
            url: https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-the-firewall
          - title: Configure runners for Copilot
            url: https://docs.github.com/en/copilot/how-tos/copilot-on-github/set-up-copilot/configure-runners
      - title: Output controls — workflow approval, validation, code review approvals
        body:
          - "Repository Settings > Copilot > cloud agent: Validation tools (CodeQL, secret
            scanning, dependency advisories, Copilot code review; on by default) and Actions
            workflow approval (Require approval for workflow runs; keep it on — the docs warn about
            auto-running workflows on agent code). The agent cannot mark a PR ready, approve or
            merge; rulesets add one more approval when the PR is opened under the agent's app
            identity, and the requesting user cannot approve their own request."
          - "Copilot code review can be authorised to approve PRs (public preview): enterprise
            \"Allow Copilot to approve pull requests\" is Disabled everywhere by default, organisations
            choose whether approvals count toward merge requirements, repositories can limit that
            to file-path globs."
        links:
          - title: Configuring settings for the cloud agent
            url: https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/configuring-agent-settings
          - title: Risks and mitigations
            url: https://docs.github.com/en/copilot/concepts/agents/cloud-agent/risks-and-mitigations
          - title: Configure Copilot code review (approvals)
            url: https://docs.github.com/en/copilot/how-tos/copilot-on-github/set-up-copilot/configure-code-review
    riskNotes:
      - risk: riskPromptInjection
        note: >-
          Every trigger is attacker-reachable text (issues, PR bodies, comments, repository files).
          GitHub strips hidden characters and HTML comments before prompting and ignores
          non-write-access events for automations, but MCP tools run without approval, so an
          injection that reaches a write-capable MCP tool acts immediately.
      - risk: riskSensitiveDataDisclosure
        note: >-
          The firewall covers only Bash-spawned processes; MCP servers and copilot-setup-steps have
          unrestricted egress, and Agents secrets are plain environment variables inside the
          runner. Put nothing in the Agents secret type that a compromised MCP server should not see.
      - risk: riskAgenticDelegationConfusedDeputy
        note: >-
          Automations act under their creator's identity and cannot approve the resulting PRs;
          partner agents install as GitHub Apps (anthropic code agent, openai code agent) with
          their own permissions. Rulesets and the extra-approval rule are the boundary, not the
          agent.
      - risk: riskShadowAndUnknownAgents
        note: >-
          Cloud agent, third-party agents and agent apps are three independent policies; a
          "disabled" cloud agent still leaves Claude, Codex and any installed agent app enabled
          unless each is switched off.
    controls:
      - capability: capabilityIga
        coverage: native
        mechanism: Enterprise policy Enabled for selected organizations (UI or custom properties via REST), organisation Repository access, per-repository opt-out; write access required to trigger
        steps:
          - title: Enable for selected organisations
            body:
              - "Enterprise > AI controls > Agents > Copilot Cloud Agent: choose Enabled for selected organizations and pick organisations, or select them by custom property with the REST API."
            url: https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-enterprise/manage-agents/enable-copilot-cloud-agent
          - title: Scope repositories
            body:
              - Organisation owners set Repository access to all or selected repositories; repository owners can opt out. Only users with write access can trigger the agent.
            url: https://docs.github.com/en/copilot/concepts/enterprise/cloud-agent-access
        verified: "2026-09-10"
      - capability: capabilityNhiManagement
        coverage: partial
        mechanism: The agent acts under its own app identity with signed ("Verified") commits, co-authored by the requesting human; audit events carry actor_is_agent and agent_session_id; partner agents install as named GitHub Apps
        note: >-
          The identity is GitHub's, not the customer's: there is no key custody or lifecycle to
          manage, only the app installations of partner agents and agent apps to review. Compared with
          Claude Tag: the organisation owns Tag's per-tool service accounts and their lifecycle; here
          GitHub owns the app identity, so the organisation manages only which installations are
          permitted. PR and commit actions carry the agent's app identity; workflow runs carry the
          repository's Actions token.
        steps:
          - title: Review partner-agent app installations
            body:
              - Enabling Claude or Codex agents installs the "anthropic code agent" / "openai code agent" GitHub Apps; their actions appear in the audit log — review installations under third-party access.
            url: https://docs.github.com/en/copilot/concepts/agents/about-third-party-coding-agents
          - title: Attribute agent actions in the audit log
            body:
              - Filter actor:Copilot; agentic events carry actor_is_agent=true, agent_session_id and the initiating user.
            url: https://docs.github.com/en/copilot/reference/enterprise-administrators/agentic-audit-log-events
        verified: "2026-09-10"
      - capability: capabilitySecretsManagement
        coverage: native
        mechanism: Agents-type secrets and variables (repository / organisation Settings > Secrets and variables > Agents); COPILOT_MCP_* prefix scopes values to MCP servers; no access to Actions, Codespaces or Dependabot secrets
        steps:
          - title: Use the Agents secret type only
            body:
              - Add secrets under Settings > Secrets and variables > Agents; prefix MCP credentials COPILOT_MCP_ so they are only available to MCP server configuration and never exported as general environment variables.
            url: https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/configure-secrets-and-variables
          - title: Keep engine credentials out of Agentic Workflow agents
            body:
              - In Agentic Workflows the real engine key stays in the AWF API proxy sidecar; the agent container sees only a dummy key — configure ANTHROPIC_API_KEY / OPENAI_API_KEY / GEMINI_API_KEY as repository secrets, not in the workflow body.
            url: https://github.github.com/gh-aw/reference/engines/
        note: >-
          Agents secrets are readable by the setup steps and MCP servers they are scoped to
          (COPILOT_MCP_*), and by commands the agent runs in the session; the model sees a value if a
          command prints it. They are stored secrets, not ephemeral issuance.
        verified: "2026-09-10"
      - capability: capabilityEncryptionKeyManagement
        coverage: partial
        mechanism: >-
          Vendor-managed encryption under GitHub's security programme (TLS in transit, encrypted at
          rest); no customer-managed keys; regional routing via the data residency policy
        steps:
          - title: Record the key owner and residency
            body:
              - >-
                GitHub holds the keys for repository data, session logs and Agents secrets; obtain the
                encryption statement from the Copilot Trust Center (client-rendered, not verifiable by
                automated fetch) and enable the data residency policy if residency is required.
            url: https://copilot.github.trust.page/
        note: >-
          Lack of a customer-managed key is not absence of encryption: GitHub encrypts and holds the
          keys. Assets: repository data, session logs and Agents secrets (GitHub keys); the Actions
          runner disk for the session (GitHub-managed, ephemeral). Residency is a routing property,
          not a key-custody one.
        verified: "2026-09-10"
      - capability: capabilityAgentRegistry
        coverage: partial
        mechanism: Enterprise-level custom agents (AI Controls, REST API), agent sessions list at github.com/copilot/agents, agent apps marketplace category
        note: >-
          The enterprise can publish approved custom agents and see sessions, but partner agents
          and agent apps are approved by policy toggle, not registered — and content exclusion
          and the registry restriction do not apply to them.
        steps:
          - title: Publish enterprise custom agents
            body:
              - Define custom agents at enterprise level under AI Controls or through the REST API and control who may manage them.
            url: https://docs.github.com/en/copilot/concepts/enterprise/agent-management
        verified: "2026-09-10"
      - capability: capabilityStagedRollout
        coverage: partial
        mechanism: Organisation-by-organisation enablement (custom properties), repository access lists, Configure models policy; no versioned agent definitions
        note: >-
          Roll out by organisation and repository; there is no canary or rollback for the agent
          itself, and model deprecations are announced on the changelog rather than pinned.
        steps:
          - title: Stage by organisation and repository
            body:
              - Use Enabled for selected organizations plus Repository access lists to widen scope in steps; agent apps and partner agents are enabled separately.
            url: https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-enterprise/manage-agents/enable-copilot-cloud-agent
        verified: "2026-09-10"
      - capability: capabilityToolPermissionScoping
        coverage: native
        mechanism: MCP configuration "tools" arrays, read-only GitHub MCP token scoped to the repository, per-automation tool selection, least-privilege permissions in copilot-setup-steps, no push to default branch / no merge
        steps:
          - title: Name the tools each MCP server may expose
            body:
              - "In Repository Settings > Copilot > MCP servers set \"tools\" to the specific tool names rather than \"*\"; Copilot uses configured tools autonomously and will not ask for approval."
            url: https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/configure-mcp-servers
          - title: Pick tools per automation
            body:
              - When creating an automation choose exactly which tools it can use; Suggest tools proposes a minimal set.
            url: https://docs.github.com/en/copilot/concepts/agents/cloud-agent/about-automations
          - title: Keep setup-step permissions minimal
            body:
              - "Set permissions in copilot-setup-steps.yml to the lowest needed (contents: read only if the step clones)."
            url: https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/customize-the-agent-environment
        note: >-
          tools arrays hide MCP tools, the read-only token and no-push/no-merge rules limit resources;
          nothing pre-approves because runs are unattended. copilot-setup-steps permissions are the
          customer's to keep minimal.
        verified: "2026-09-10"
      - capability: capabilityHitlControls
        coverage: partial
        mechanism: Human review and merge of draft PRs; Actions workflow approval; ruleset extra approval for agent-opened PRs; code review approval policy off by default
        note: The human gate is the pull request and the workflow-run approval; tool calls, network access and MCP actions taken while the agent produces the PR are not individually approved.
        steps:
          - title: Keep workflow approval on
            body:
              - "Repository Settings > Copilot > cloud agent > Actions workflow approval: leave Require approval for workflow runs enabled so a user with write access must click Approve and run workflows."
            url: https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/configuring-agent-settings
          - title: Keep the extra approval rule and required checks
            body:
              - Rulesets require one more approval when a PR is opened under the agent's app identity (enabled by default); the requester cannot approve, and branch protections apply.
            url: https://docs.github.com/en/copilot/concepts/agents/cloud-agent/risks-and-mitigations
          - title: Decide whether Copilot may approve PRs
            body:
              - "Enterprise > AI controls > Copilot code review > \"Allow Copilot to approve pull requests\" is Disabled everywhere by default; organisations decide whether approvals count toward merge requirements."
            url: https://docs.github.com/en/copilot/how-tos/copilot-on-github/set-up-copilot/configure-code-review
        verified: "2026-09-10"
      - capability: capabilityPromptInjectionDefense
        coverage: partial
        mechanism: Hidden-character and HTML-comment stripping before prompting, automations ignore non-write events, a content safety system on prompts and responses; Agentic Workflows sanitise user content and gate writes behind a threat-detection job
        note: >-
          No customer-configurable classifier; the structural gates (firewall, tool selection,
          workflow approval) carry the weight once injection succeeds.
        steps:
          - title: Leave untrusted-event handling at its default
            body:
              - Automations ignore events from users without write access by default; do not opt in unless the tool set is read-only.
            url: https://docs.github.com/en/copilot/concepts/agents/cloud-agent/about-automations
          - title: Use Agentic Workflows for event-driven automation that must be hardened
            body:
              - Agents run read-only; writes are buffered as safe outputs, scanned by a detection job and executed by a separate job — with @mention neutralisation, size limits and min-integrity filtering of inputs.
            url: https://github.github.com/gh-aw/introduction/architecture/
        verified: "2026-09-10"
      - capability: capabilityAiTprm
        coverage: external
        mechanism: No vendor feature; partner agents add Anthropic and OpenAI as processors of repository content
        note: >-
          The third-party agent page does not state where partner agents execute or what data
          reaches the partner; obtain that from the partner before enabling the policy.
        steps:
          - title: Record the partner-agent data path before enabling
            body:
              - Partner agents consume Actions minutes and AI credits and install partner GitHub Apps; the docs do not describe partner-side processing — ask the vendor.
            url: https://docs.github.com/en/copilot/concepts/agents/about-third-party-coding-agents
        verified: "2026-09-10"
      - capability: capabilityAgentObservability
        coverage: partial
        mechanism: Session logs (reasoning, tool calls, token usage) at github.com/copilot/agents and in the repository Agents tab; commit messages link to sessions; no OpenTelemetry export for the cloud agent
        note: >-
          Logs are queryable in the UI and streamed live, but the managed telemetry export does
          not cover the cloud agent, so traces cannot leave GitHub programmatically.
        steps:
          - title: Use session logs and the agents panel
            body:
              - Open github.com/copilot/agents or the repository Agents tab; each session shows internal reasoning, tools used, token usage and session length, and every agent commit links back to it.
            url: https://docs.github.com/en/copilot/how-tos/copilot-on-github/use-copilot-agents/manage-and-track-agents
        verified: "2026-09-10"
      - capability: capabilityAuditLogging
        coverage: native
        mechanism: Enterprise / organisation audit log (actor:Copilot, actor_is_agent, agent_session_id, 180 days, streaming to SIEM); signed commits with human co-author
        steps:
          - title: Stream agent audit events
            body:
              - Filter actor:Copilot for agent actions and action:copilot for policy changes; stream the enterprise audit log to a SIEM for retention beyond 180 days.
            url: https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-enterprise/review-audit-logs
          - title: Correlate on agent_session_id
            body:
              - Agentic events record the action, actor_is_agent=true, agent_session_id and the initiating user; available to EMU enterprises and GHEC with data residency.
            url: https://docs.github.com/en/copilot/reference/enterprise-administrators/agentic-audit-log-events
        note: >-
          The audit log attributes agent events and the commits are signed, but a signed commit
          attests the commit, not the session's tool calls and network actions that produced it.
          180-day retention; tamper evidence beyond that is the SIEM's.
        verified: "2026-09-10"
      - capability: capabilityModelGuardrails
        coverage: partial
        mechanism: Vendor safety system that scans prompts and responses for harmful, offensive or insecure content; not customer-configurable
        note: >-
          Vendor-operated safeguard, not an organisation-configured policy: no denied-topic or
          blocked-term configuration; validation tools (CodeQL, secret scanning) act on the output
          instead.
        steps:
          - title: Rely on the built-in filter and output validation
            body:
              - The application card describes a safety system on prompts and responses plus CodeQL, secret scanning and dependency analysis on generated code.
            url: https://docs.github.com/en/copilot/responsible-use/agents
        verified: "2026-09-10"
      - capability: capabilityMemoryProtection
        coverage: partial
        mechanism: "Copilot Memory policy (public preview): repository-scoped facts validated against the current branch, user preferences owned by the billing entity, 28-day unused expiry, admin export / delete"
        steps:
          - title: Set the Memory policy
            body:
              - "Enterprise > AI controls > Copilot > Configure features & clients > Features > Copilot Memory: Enabled everywhere, Disabled everywhere or Let organizations decide."
            url: https://docs.github.com/en/copilot/how-tos/use-copilot-agents/copilot-memory/manage-as-administrator
          - title: Know the scope and expiry
            body:
              - Repository facts stay in their repository and carry code citations; entries unused for 28 days are deleted; code review uses repository facts only.
            url: https://docs.github.com/en/copilot/concepts/agents/copilot-memory
        note: >-
          Validation against the current branch and expiry are integrity and retention contributions;
          there is no quarantine or rollback — an admin can only delete. Public preview.
        verified: "2026-09-10"
      - capability: capabilityModelEvals
        coverage: partial
        mechanism: Vendor-side evaluation (SWE-Bench, internal suites, RAI red teaming) and per-session validation tools on the output; no customer evaluation harness
        note: >-
          Credited only for the per-session validation tools, which the customer can keep on as a gate
          on each PR. SWE-Bench results, internal suites and RAI red teaming are supplier evaluation
          evidence for TPRM — they are not the customer's agent evaluation harness and do not
          establish safety regression coverage for the customer's tasks. Add your own CI checks.
        steps:
          - title: Keep validation tools enabled
            body:
              - "Repository Settings > Copilot > cloud agent > Validation tools: CodeQL, secret scanning, dependency advisories and Copilot code review run before the PR is handed over; disabling them speeds the agent up at the cost of the gate."
            url: https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/configuring-agent-settings
        verified: "2026-09-10"
      - capability: capabilityAiGovernancePlatform
        coverage: external
        mechanism: Enterprise AI controls tab (Agents, Copilot, MCP policies), Copilot usage metrics, REST API for cloud agent management
        note: >-
          Policy switches, usage metrics and the management API are inputs; the catalogue, intake,
          risk decisions and evidence workflow are the organisation's governance platform. Rated
          external on the same rule as every other vendor.
        steps:
          - title: Centralise policy on the AI controls tab
            body:
              - Agents, Copilot and MCP policies live under Enterprise > AI controls; within a single enterprise, policy is set at enterprise level first, and the most restrictive policy applies when a user holds licenses across multiple enterprises, so set lockdowns at enterprise level.
            url: https://docs.github.com/en/copilot/concepts/enterprise/policies
        verified: "2026-09-10"
      - capability: capabilityRateLimiting
        coverage: native
        mechanism: 59-minute hard session limit, organisation AI-credit budgets that block agent features when exhausted, Actions minutes, autopilot continuation limits in automations
        steps:
          - title: Set AI-credit budgets
            body:
              - When budget limits are exhausted, code reviews and other AI-credit features are blocked; enable AI credits paid usage deliberately.
            url: https://docs.github.com/en/copilot/concepts/agents/code-review
          - title: Rely on the session ceiling
            body:
              - Each cloud agent session runs at most 59 minutes and cannot be extended; setup steps share that limit.
            url: https://docs.github.com/en/copilot/concepts/agents/cloud-agent/about-cloud-agent
        note: >-
          Sub-limits: runtime (59-minute session limit, hard), spend (AI-credit budgets that block
          features when exhausted, hard at the organisation), Actions minutes (hard). No per-session
          tool-call or iteration cap.
        verified: "2026-09-10"
      - capability: capabilityKillSwitch
        coverage: native
        mechanism: Enterprise policy Disabled, repository opt-out, Stop session, firewall on, separate third-party and agent-app policies
        steps:
          - title: Stop a running session
            body:
              - Click Stop session in the session log viewer to end the Actions run; pushed commits are preserved.
            url: https://docs.github.com/en/copilot/how-tos/copilot-on-github/use-copilot-agents/manage-and-track-agents
          - title: Disable every agent policy, not just one
            body:
              - Set Copilot Cloud Agent to Disabled, and separately disable Third-party agents and Agent apps under AI controls > Agents — disabling the cloud agent does not disable the others.
            url: https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-enterprise/manage-agents/enable-copilot-cloud-agent
        verified: "2026-09-10"
      - capability: capabilityVendorAssurance
        coverage: external
        mechanism: REST endpoints for cloud agent management and the audit log stream are the inputs an SSPM product would read
        note: >-
          No first-party posture report; poll the cloud agent management API and audit log from an
          SSPM tool to evidence firewall, approval and policy settings.
        evidence:
          - title: Vendor docs index, reviewed for the integration point (2026-09-10)
            url: https://docs.github.com/en/copilot/concepts/agents/cloud-agent/risks-and-mitigations
        verified: "2026-09-10"
      - capability: capabilityAgentSandboxing
        coverage: native
        mechanism: >-
          Ephemeral development environment per job powered by GitHub Actions — a non-interactive
          Linux sandbox with a constrained network, destroyed when the job ends; 59-minute hard
          limit; optionally on the organisation's own runners
        steps:
          - title: Keep the agent on the ephemeral Actions environment
            body:
              - >-
                Each task runs in its own ephemeral environment on GitHub Actions and ends within 59
                minutes, a limit that cannot be extended; if you route it to self-hosted runners
                (configure-runners), the isolation of that runner is yours.
            url: https://docs.github.com/en/copilot/concepts/agents/cloud-agent/about-cloud-agent
          - title: Know what runs inside the sandbox
            body:
              - >-
                Setup steps, the agent's commands, hooks and MCP server processes all run inside the
                job's sandbox; the firewall applies to the agent's Bash processes but not to MCP
                server processes.
            url: https://docs.github.com/en/copilot/reference/hooks-reference
        note: >-
          Inside the boundary: commands, setup steps, hooks and MCP servers. Outside: the model and
          GitHub's own services, reached through the agent's app identity. The boundary is a job,
          not a session: nothing persists after it ends except what was pushed.
        verified: "2026-09-15"
      - capability: capabilityEgressControl
        coverage: partial
        mechanism: >-
          Firewall on by default with the recommended allowlist (OS packages, container and
          language registries, certificate authorities, Playwright hosts); custom allowlist per
          repository; organisation Settings > Copilot > Internet access can enforce or delegate
        steps:
          - title: Enforce the firewall at organisation level
            body:
              - >-
                Under Settings > Copilot > Internet access keep the firewall enabled and enforce it
                for every repository, adding only the hosts your builds need; disabling it lets
                Copilot connect to any host.
            url: https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-the-firewall
        note: >-
          Rated partial on the egress rule: the firewall applies only to processes the agent starts
          through its Bash tool, not to MCP server processes — including the Playwright MCP server
          enabled by default — and the vendor states that sophisticated attacks may bypass it. Bound
          MCP servers through their configuration and tools arrays, and treat the firewall as
          blast-radius reduction.
        verified: "2026-09-15"
      - capability: capabilityAgentRuntimeEnforcement
        coverage: partial
        mechanism: >-
          preToolUse and permissionRequest hooks from the repository run inside the job's sandbox
          and can deny a tool call; command preToolUse hooks fail closed on error; no
          enterprise-managed permission rules reach this surface
        steps:
          - title: Commit fail-closed hooks
            body:
              - >-
                Add preToolUse and permissionRequest hooks under the repository's hooks
                configuration; a crash or non-zero exit denies the call even if stdout says allow,
                and hooks run inside the ephemeral sandbox.
            url: https://docs.github.com/en/copilot/reference/hooks-reference
        note: >-
          Rated partial on the same rule as Cursor cloud: hooks are repository code, writable by
          anyone with push access, not enterprise policy — the enterprise-managed permissions.deny
          rules apply to the CLI and VS Code Agent Host, not to the cloud agent. The deterministic
          organisation-level controls here are the tools arrays, the firewall and branch rules.
        verified: "2026-09-15"
      - capability: capabilityCredentialIsolation
        coverage: partial
        mechanism: >-
          Agents secrets and variables (repository or organisation) exposed as environment
          variables to setup steps and the agent's commands; COPILOT_MCP_ prefix limits a value to
          MCP servers; no access to Actions, Codespaces or Dependabot secrets; pushes go through the
          agent's own push path, not git commands
        steps:
          - title: Scope secrets to MCP servers with the prefix
            body:
              - >-
                Store values MCP servers need under COPILOT_MCP_* so they reach only those servers;
                everything else under Agents secrets is an environment variable every command can
                read.
            url: https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/configure-secrets-and-variables
          - title: Keep the agent's own reach narrow
            body:
              - >-
                The agent cannot run git push itself and can only perform simple push operations;
                rulesets keep the requester from approving its PR.
            url: https://docs.github.com/en/copilot/concepts/agents/cloud-agent/risks-and-mitigations
        note: >-
          Rated partial because Agents secrets sit inside the execution boundary: any command in the
          job can read them and print them to the model. The isolation that exists is scope — no
          other secret types, MCP-only values, and an app identity rather than a person's token.
          No on-behalf-of exchange: actions carry the agent's app identity with the requesting
          human as co-author.
        verified: "2026-09-15"
      - capability: capabilityMcpToolSecurity
        coverage: partial
        mechanism: >-
          Enterprise policy "MCP servers in Copilot" applies to the cloud agent (on or off); the
          registry restriction does not; servers configured per repository by administrators in a
          JSON configuration with tools arrays; GitHub and Playwright MCP servers enabled by default
        steps:
          - title: Decide the enterprise switch, then the repository lists
            body:
              - >-
                The MCP servers in Copilot policy covers the cloud agent, but Restrict MCP access to
                registry servers does not; the allowlist for this surface is the per-repository MCP
                configuration.
            url: https://docs.github.com/en/copilot/reference/supported-surfaces-for-policies
          - title: Name every server and its tools per repository
            body:
              - >-
                In repository settings configure only the servers needed and set tools to specific
                names rather than a wildcard; custom-agent servers are processed before repository
                configuration.
            url: https://docs.github.com/en/copilot/concepts/agents/cloud-agent/mcp-and-cloud-agent
        note: >-
          Rated partial on the hosted-runtime rule: there is no organisation-level allowlist of
          servers for this surface, only an on/off policy and per-repository admission by whoever
          administers the repository. Admission is not integrity — nothing pins what a server
          serves, and MCP server processes sit outside the firewall.
        verified: "2026-09-15"
