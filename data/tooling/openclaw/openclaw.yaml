# OpenClaw — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
vendor: openclaw
family: OpenClaw
tools:
  - id: toolOpenclaw
    name: OpenClaw
    surfaceClasses:
      - endpointCli
    architecture: archPersonalAgent
    status: ga
    asOf: 2026-08
    summary:
      - "A self-hosted personal agent whose gateway is the control plane — channels, tool policy and
        auth under an explicit single-trusted-operator model. Official hardening is real and
        specific: loopback-plus-token gateway auth, DM pairing, high-risk tools disabled or
        sandboxed, and a container sandbox whose defaults are no network, a read-only root and all
        capabilities dropped."
    items:
      - title: Gateway lockdown and the version floor
        body:
          - "The gateway defaults to loopback binding; the docs say plainly never to expose it
            unauthenticated on 0.0.0.0, and token auth is the recommended mode. DM hardening is
            dmPolicy pairing (time-limited codes for unknown senders), contact allowlists and
            requireMention in groups; `openclaw security audit` checks a deployment and can apply
            safe fixes. Enforce a version floor of 2026.1.29: earlier Control UI builds
            auto-connected to an attacker-supplied gatewayUrl and sent the operator token
            (CVE-2026-25253, CVSS 8.8), and internet scans found thousands of exposed instances."
        links:
          - title: OpenClaw gateway security model
            url: https://docs.openclaw.ai/gateway/security
          - title: NVD — CVE-2026-25253
            url: https://nvd.nist.gov/vuln/detail/CVE-2026-25253
      - title: Sandbox defaults and proxy-injected credentials
        body:
          - With the Docker sandbox backend enabled, tool execution runs in a container whose
            defaults are network none, readOnlyRoot true, all capabilities dropped and a non-root
            user, with the workspace mounted read-only or read-write by policy; per-agent sandbox
            and tool-policy overrides layer on top, and the docs warn never to mount the Docker
            socket into a sandbox. Docker's own Sandboxes product wraps the same agent with a
            configurable egress proxy that denies arbitrary hosts and injects provider API keys at
            the proxy, so the agent process never holds them.
        links:
          - title: OpenClaw sandboxing
            url: https://docs.openclaw.ai/gateway/sandboxing
          - title: "Docker: Run OpenClaw securely in Docker Sandboxes"
            url: https://www.docker.com/blog/run-openclaw-securely-in-docker-sandboxes/
    controls: []
    sources:
      - title: OpenClaw gateway security model
        url: https://docs.openclaw.ai/gateway/security
      - title: OpenClaw sandboxing
        url: https://docs.openclaw.ai/gateway/sandboxing
