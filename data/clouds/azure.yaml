        asOf: "2026-11"
        compare:
          runs: "Container Apps runs your containerised MCP server as replicas behind its HTTPS ingress; the platform has no MCP-specific awareness and you supply the image."
          patching: "Microsoft describes the platform as keeping the underlying resources up to date; the image, its base layers and the MCP SDK are yours to rebuild and redeploy."
          data: "Requests and tool results are handled by your replicas in the environment's region; console logs go to the environment's Log Analytics workspace by default."
          network: "IP restrictions, internal environments and private endpoints limit inbound traffic; a workload profiles environment in your own network can route outbound to a firewall."
