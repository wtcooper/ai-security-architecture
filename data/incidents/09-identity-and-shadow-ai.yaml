id: identity-and-shadow-ai
title: "The 2026 AI breaches: stolen OAuth tokens, leaked credentials, unapproved AI tools"
subtitle: >
  Through 2026 the prompt-injection research produced the headlines and almost no victims. The
  breaches with named companies and real records came through OAuth tokens, dormant credentials,
  an employee's paste, and a support tool that forgot to check who was asking.
dateRange: February – June 2026
perspective: target
archetype: archEnterpriseAiChat
summary:
  - >
    This entry exists to correct an emphasis. Read the year's research output and AI security
    looks like prompt injection: EchoLeak, SearchLeak, the agentic-browser work, the Copilot
    findings. Read the year's breach notifications instead and almost none of them involve a
    model being tricked. They involve an identity that should not have worked.
  - >
    An AI vendor's integration service was reached through a credential left over from abandoned
    prototype work, never revoked. The attacker pushed code that harvested customers' OAuth
    tokens in transit — and an OAuth token is the authentication, so passwords and multi-factor
    were simply not in the path. Hundreds of customers were affected and more than fifteen named
    security and software companies disclosed themselves as victims.
  - >
    Elsewhere an employee signed into a small third-party AI tool with their corporate account.
    That vendor's own employee was hit by commodity infostealer malware, and the attacker used
    the tool's OAuth grant to take over the corporate account and pivot into production, reading
    environment variables across a subset of customer projects. Nobody had inventoried the grant.
  - >
    A bank filed the first SEC material-cybersecurity disclosure to name AI as root cause: an
    employee pasted non-public customer data — names, social security numbers, dates of birth —
    into an unapproved AI application, from a personal device and a personal account, while an
    approved alternative existed. And Meta's AI-powered support tool failed to verify that the
    email requesting a password reset belonged to the account, which cost 20,225 Instagram users
    their accounts.
patterns:
  - Overprivileged Integration
  - Stale Credential
  - Shadow AI
  - Credential Theft via AI Tools
  - Confused Deputy
cves: []
risks:
  - riskStaleAgentIdentityBinding
  - riskCrossTenantCredentialPropagation
  - riskShadowAndUnknownAgents
  - riskSensitiveDataDisclosure
  - riskExcessiveDataHandlingDuringInference
  - riskAgenticDelegationConfusedDeputy
  - riskInsecureIntegratedComponent
controls:
  - controlApplicationAccessManagement
  - controlAgentCredentialIsolation
  - controlAgentInventoryManagement
  - controlModelAndDataInventoryManagement
  - controlUserDataManagement
  - controlInternalPoliciesAndEducation
  - controlThreatDetection
steps:
  - n: 1
    title: A credential nobody remembered, never revoked
    phase: introduced
    narrative: >
      The way into an AI vendor's backend was a credential created for prototype work that had
      long since been abandoned. It still worked. Every architecture in this catalogue issues
      credentials to integrations; almost none of them has a story for retiring one.
    components:
      - actorExternalSources
      - componentApplication
      - componentTools
    risks:
      - riskStaleAgentIdentityBinding
      - riskInsecureIntegratedComponent
    sources:
      - title: "Klue breach investigation"
        url: https://www.huntress.com/blog/klue-breach-investigation
        publisher: Huntress
        date: 2026-06-18
  - n: 2
    title: The token is the authentication
    phase: exposed
    narrative: >
      Code pushed into the integration service harvested customer OAuth tokens as they passed
      through. Those tokens granted direct API access to the customers' CRM — bypassing passwords
      and multi-factor entirely, because with OAuth the token *is* the authentication. Bulk
      queries went out for weeks; the tell that exposed it was a scripting user-agent string on
      the API calls. Hundreds of customers were in scope, with more than fifteen named companies
      self-disclosing.
    components:
      - actorExternalSources
      - componentTools
      - componentApplication
      - componentOrchestrationOutputHandling
    risks:
      - riskCrossTenantCredentialPropagation
      - riskSensitiveDataDisclosure
      - riskAgenticDelegationConfusedDeputy
    sources:
      - title: "Security shops among the hundreds of Klue hack victims"
        url: https://www.theregister.com/cyber-crime/2026/06/22/security_shops_among_the_hundreds_of_klue_hack_victims/
        publisher: The Register
        date: 2026-06-22
  - n: 3
    title: An AI tool nobody registered becomes the way in
    phase: exposed
    narrative: >
      An employee authenticated to a small third-party AI tool with their corporate workspace
      account. Upstream, that vendor's own employee was hit by commodity infostealer malware,
      surrendering credentials, live session cookies and stored OAuth tokens. The attacker used
      the tool's workspace application to take over the employee's account and pivot into the
      company's production platform, enumerating and decrypting environment variables across a
      subset of customer projects. Variables marked sensitive stayed encrypted.
    components:
      - actorExternalSources
      - componentApplication
      - componentTools
      - componentDataStorage
    risks:
      - riskShadowAndUnknownAgents
      - riskCrossTenantCredentialPropagation
      - riskSensitiveDataDisclosure
    sources:
      - title: "Vercel April 2026 security incident"
        url: https://vercel.com/kb/bulletin/vercel-april-2026-security-incident
        publisher: Vercel
        date: 2026-04-24
  - n: 4
    title: The paste
    phase: exposed
    narrative: >
      Preparing a presentation, a bank employee pasted non-public customer information into an
      unapproved AI application, from a personal device and a personal account, while a sanctioned
      alternative was available. The bank filed a Form 8-K under Item 1.05 — the first SEC
      material-cybersecurity disclosure naming AI as the cause — and reported contacting the
      vendor to keep the data out of training. Materiality rested on the sensitivity of the
      information, not on any operational impact: names, social security numbers, dates of birth.
    components:
      - actorUser
      - componentAgentUserQuery
      - componentApplication
      - actorExternalSources
    risks:
      - riskShadowAndUnknownAgents
      - riskExcessiveDataHandlingDuringInference
      - riskSensitiveDataDisclosure
    sources:
      - title: "Form 8-K, Item 1.05 — CB Financial Services"
        url: https://www.sec.gov/Archives/edgar/data/1605301/000160530126000021/cbfv-20260507.htm
        publisher: U.S. Securities and Exchange Commission
        date: 2026-05-11
      - title: "A bank breaks its silence on its shadow AI breach"
        url: https://www.americanbanker.com/news/a-bank-breaks-its-silence-on-its-shadow-ai-breach
        publisher: American Banker
        date: 2026-06-08
  - n: 5
    title: The support agent that did not check who was asking
    phase: exposed
    narrative: >
      Meta's AI-powered high-touch support tool did not verify that the email address given in a
      password-reset request actually belonged to the account. Attackers supplied addresses that
      did not, received reset links, and took over 20,225 Instagram accounts that lacked
      two-factor authentication. Meta disabled the tool, invalidated the links and filed a breach
      notification with a state attorney general. This is an authorization bug in an AI-branded
      workflow — no model was tricked into anything.
    components:
      - actorExternalSources
      - componentApplication
      - componentApplicationInputHandling
      - componentAgentUserQuery
    risks:
      - riskAgenticDelegationConfusedDeputy
      - riskSensitiveDataDisclosure
    sources:
      - title: "Meta AI support data breach affects 20,000 Instagram accounts"
        url: https://www.bleepingcomputer.com/news/security/meta-ai-support-data-breach-affects-20-000-instagram-accounts/
        publisher: BleepingComputer
        date: 2026-06-08
  - n: 6
    title: Where this chain breaks
    phase: mitigated
    narrative: >
      None of these needed an AI-specific control. Inventory the integrations and expire their
      credentials on a schedule, so a forgotten prototype token stops working before someone finds
      it. Treat an OAuth grant to an AI tool as the standing access it is, and review it like one.
      Give people a sanctioned place to paste, because the alternative is not that they stop
      pasting. And hold AI-branded workflows to the same authorization checks as everything else —
      the support tool's flaw would have been caught by any ordinary review of a reset flow.
    components:
      - componentApplication
      - componentApplicationInputHandling
      - componentTools
      - componentAgentUserQuery
      - componentDataStorage
    sources:
      - title: "Klue breach investigation"
        url: https://www.huntress.com/blog/klue-breach-investigation
        publisher: Huntress
        date: 2026-06-18
alsoSeen:
  - title: "Thirty fake AI assistant extensions, roughly 260,000 users"
    date: February 2026
    note: >
      The extensions shipped no AI at all — each rendered a full-screen frame pointing at
      attacker infrastructure, so behaviour could change server-side with no store review. Half
      carried a dedicated script reading Gmail threads and drafts. AI was the lure, not the
      target: conventional credential theft in AI costume.
    sources:
      - title: "Fake AI Chrome extensions with 300K users steal credentials, emails"
        url: https://www.bleepingcomputer.com/news/security/fake-ai-chrome-extensions-with-300k-users-steal-credentials-emails/
        publisher: BleepingComputer
        date: 2026-02-12
  - title: "Copilot summarised Confidential-labelled mail for months"
    date: January–February 2026
    note: >
      A code defect let Copilot Chat ingest sent items and drafts carrying Confidential
      sensitivity labels, bypassing the data-loss policies written specifically to keep them out
      of AI. Microsoft declined to quantify affected tenants and argued nobody saw data they were
      not already entitled to — which is the argument sensitivity labels exist to reject.
    sources:
      - title: "Microsoft says bug causes Copilot to summarize confidential emails"
        url: https://www.bleepingcomputer.com/news/microsoft/microsoft-says-bug-causes-copilot-to-summarize-confidential-emails/
        publisher: BleepingComputer
        date: 2026-02-18
