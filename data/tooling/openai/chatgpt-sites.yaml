# ChatGPT Sites — one entity per product × reference architecture. Facts are dated (asOf) and cite the
# vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# Scope: Sites built in ChatGPT Work or Codex and hosted by OpenAI at chatgpt.site addresses, with the workspace
# controls (role permissions, public publishing, external visitors, plugins in Sites, private tunnels) and the
# owner's site settings (audience, editors, secrets, domains). Exclusions: the ChatGPT conversation and Work Cloud
# surface the site is built in is toolChatgptWeb (enterprise AI chat) and the Codex app is toolCodex; their
# workspace-wide settings (SSO, Directory Sync, plugin installation) are repeated here only where they decide who
# builds or opens a site. The OpenAI Apps SDK and plugins in ChatGPT are other products; a site can host an MCP
# server for a plugin, recorded as a variant. Custom domains are not available in Enterprise workspaces at launch.
# 2026-11-25: onboarded against the hosted app builder pins. Read that day: learn.chatgpt.com/docs (.md, all 200)
# sites, sites/creating-a-site, sites/data-and-connections, sites/managing-a-site, sites/publishing-and-sharing,
# sites/usage-and-cost, sign-in-with-chatgpt, enterprise/sites, enterprise/compliance-api, enterprise/governance,
# enterprise/user-lifecycle, enterprise/work-admin-faq, enterprise/apps-and-connectors; help.openai.com answered 200
# to curl that day: 20001339 (the exemplar's /articles/20001339-creating-and-managing-chatgpt-sites redirects to
# /en/articles/20001339-creating-and-using-chatgpt-sites), 20001338 (managing Sites for your workspace, "updated 28
# days ago"), 20001337, 20001547, 20001606, 12289294, 9261474, 9903489; openai.com/policies/sub-processor-list,
# openai.com/policies/chatgpt-sites-terms and openai.com/enterprise-privacy (200). The Admin API reference
# (chatgpt.com/public/admin/api-reference) renders client-side; no Sites event type could be read there. No page
# documents a security scan before publishing, an approval step, or a workspace list of sites; those rows say so.
# Status ga holds for Plus, Pro and Business; in Enterprise, Sites is granted under the Early access › Sites role
# permission and the Sites admin preview, tunnels and external invitations are still rolling out (20001338 and
# sites/publishing-and-sharing, 2026-11-25). No advisory specific to ChatGPT Sites was found.
# 2026-11-25 (daily feed): the Enterprise default was re-checked. The Enterprise and Edu release notes of 2026-10-29
# (help.openai.com 10128477, 200) say Sites is enabled by default in eligible Enterprise workspaces, reviewed as Use Sites
# under Permissions › Workspace capabilities, with public publishing off and separate, and that workspaces whose opt-out
# was not honoured should contact OpenAI Support. 20001338 ("updated 28 days ago") and learn.chatgpt.com
# docs/enterprise/sites (both 200) still describe the admin preview, launch access and Early access › Sites. The two
# disagree; the Plans fact, the D3-APA note and the two role rows now record both and say to set access explicitly.
vendor: openai
family: ChatGPT Sites
tools:
  - id: toolChatgptSites
    name: ChatGPT Sites
    surfaceClasses:
      - saasAgentPlatform
      - remoteMcpServer
    variants:
      - name: Sites built in ChatGPT Work (web) or Work and Codex in the desktop app
        class: saasAgentPlatform
        url: https://learn.chatgpt.com/docs/sites/creating-a-site
        note: >-
          The same Sites service whichever surface starts it; sites are saved, deployed, shared and managed from
          Sites in ChatGPT on the web or the desktop app, not from the Codex CLI or IDE extension.
      - name: Site-hosted plugin (an MCP server served by a Site)
        class: remoteMcpServer
        url: https://help.openai.com/en/articles/20001547-hosting-a-plugin-with-chatgpt-sites
        note: >-
          A Site can host an MCP server that a ChatGPT plugin calls; access to the plugin and to its host Site are
          granted separately.
    architecture: archHostedAppBuilder
    status: ga
    asOf: "2026-11"
    summary:
      - >-
        OpenAI's hosted app builder. A member asks ChatGPT Work or Codex for a website; the agent writes the site and
        its server code, gives it a D1 database (up to 10 GB) and R2 file storage, and deploys it to OpenAI's Sites
        runtime at a chatgpt.site address or a custom domain. Workspace-restricted sites use ChatGPT sign-in to
        enforce their audience; public sites can add Sign in with ChatGPT, which forwards the visitor's email and name
        to server code. In supported workspaces a site can read each visitor's own connected apps through plugins, and
        on eligible Enterprise workspaces reach a private service through a tunnel.
      - >-
        Three levels of control: workspace permissions decide who may create and publish sites, whether public
        publishing and external visitors are allowed, which plugins sites may use and who may attach tunnels; the
        site owner chooses the audience, the editors and the site's secrets within those limits; and record-level
        access is whatever the site's server code enforces. A new site is private to its owner and the workspace's
        admins. Publishing has no approval step: the owner, or an editor after the owner's first publish, deploys.
    facts:
      - label: Plans
        value: >-
          ChatGPT Plus and Pro accounts and Business and Enterprise workspaces (not Free or Go). Business has Sites on
          by default and no separate external-invitation setting. In Enterprise, OpenAI's release notes say Sites has
          been enabled by default in eligible workspaces since 29 October 2026 (Use Sites under Permissions › Workspace
          capabilities), while the Sites admin article still describes an admin preview with launch access and the
          Early access › Sites role permission; public publishing is off by default either way, and tunnels and
          external invitations are still rolling out. Hosting is waived for Enterprise for now; building and editing
          count toward Codex usage.
        url: https://help.openai.com/en/articles/10128477-chatgpt-enterprise-and-edu-release-notes
      - label: Inference & routing
        value: >-
          Sites are built by ChatGPT Work or Codex on OpenAI's models; the site itself runs on the Sites runtime (HTTP,
          HTTPS and WebSockets; no raw TCP), with D1 and R2 storage. OpenAI's sub-processor list names Cloudflare for web
          hosting of Sites pages for Enterprise, Edu and Business.
        url: https://learn.chatgpt.com/docs/sites
      - label: Data leaving the device
        value: >-
          A vendor-hosted builder and host: prompts, files, site code, storage, metadata and logs are processed by OpenAI
          and its hosting sub-processors, which may run security and safety classifiers on pages. Connected-app data is
          read with each visitor's own connection at page load; a tunnel carries requests to a private service through a
          client the customer runs.
        url: https://openai.com/policies/sub-processor-list/
      - label: Retention & training
        value: >-
          Business, Enterprise and Edu conversations that create or edit a site are not used for training by default;
          Plus and Pro follow Improve the model for everyone. Site retention and deletion questions go to OpenAI Support;
          deleting a site is permanent, and Sites has no backup of database records and files together. New sites in US
          or EU residency workspaces use that region; other residency regions do not yet apply to Sites.
        url: https://help.openai.com/en/articles/20001338-managing-chatgpt-sites-for-your-workspace
      - label: Docs index
        value: learn.chatgpt.com/docs/sites and learn.chatgpt.com/docs/enterprise/sites, with the ChatGPT Sites collection in the Help Center
        url: https://learn.chatgpt.com/docs/enterprise/sites
    items:
      - title: Where each control lives
        body:
          - >-
            Workspace settings › Permissions & roles › (role) › Early access › Sites (Sites for the role, Allow members to
            invite external visitors to sites, Allow members to attach private tunnels, Allow public Sites with private
            tunnels); Workspace settings for public publishing; Workspace settings › Sites (external viewers); Admin
            Preview › Sites › Set launch access. Admin Console › Plugins › (plugin) › Sites settings › Allow site visitors
            to use this plugin. OpenAI Admin Console (global admin) › External access › ChatGPT Sites › Access ›
            Connected apps. Per site, the owner: Share › Who has access (audience, Can view or Can edit), More actions ›
            Settings (name and URL, secrets and environment variables, custom domain, transfer ownership), Delete site.
        links:
          - title: Managing ChatGPT Sites for your workspace
            url: https://help.openai.com/en/articles/20001338-managing-chatgpt-sites-for-your-workspace
          - title: Sites administration
            url: https://learn.chatgpt.com/docs/enterprise/sites
      - title: What editors can do
        body:
          - >-
            An owner can give an active member of the same workspace Can edit. Editors can inspect the live database,
            publish code that uses the site's secrets and storage, and, once the owner has published the first time,
            publish later versions to the same address with no owner approval. They cannot change the audience, invite
            people, manage settings or transfer ownership.
        links:
          - title: "Publish and share: Collaborate on a site"
            url: https://learn.chatgpt.com/docs/sites/publishing-and-sharing
    riskNotes:
      - risk: riskSensitiveDataDisclosure
        note: >-
          An uploaded spreadsheet becomes a shared snapshot in the site, and a public site opens without any sign-in;
          records in the site's database are protected only by the access checks in its server code.
      - risk: riskInsecureModelOutput
        note: >-
          Who may read or change which record is code the agent writes; OpenAI's own guidance is that hiding a page
          element does not enforce the rule and that separate accounts must be used to test it.
      - risk: riskRogueActions
        note: >-
          Publishing can change the site's database before the new version goes live, and a failed publish can leave
          some changes saved; restoring an earlier version restores the code, not the database or uploaded files.
      - risk: riskShadowAndUnknownAgents
        note: >-
          Plus and Pro personal accounts can publish sites to the public at chatgpt.site addresses, outside any workspace
          setting.
      - risk: riskAgenticDelegationConfusedDeputy
        note: >-
          Plugins in Sites read with each visitor's own connected account, but a site's secrets and a private tunnel act
          with the site's own credentials for every visitor, so data reached that way is the owner's access shared.
      - risk: riskCrossTenantCredentialPropagation
        note: >-
          The Sign in with ChatGPT bypass token lets any holder pass a site's sign-in gate; a replacement works at once,
          but the old token can stay valid for up to five minutes.
      - risk: riskPromptInjection
        note: >-
          Remixing a coworker's site, attached files and plugin results all become the agent's instructions while it
          builds.
    controls:
      - mitigation: D3-APA
        coverage: native
        mechanism: >-
          Role permissions for Sites (create and publish) in Enterprise, public publishing off by default in Enterprise
          workspaces, the separate permission to invite external visitors, and new sites private to the owner and
          workspace admins until the owner shares them
        steps:
          - title: Limit Sites to approved roles
            body:
              - >-
                In Workspace settings › Permissions & roles enable Sites under Early access › Sites only for the roles of
                trained makers, or set Launch access to Off for the others in Admin Preview; where Sites has launched,
                review Use Sites under Permissions › Workspace capabilities, which the release notes say is on by default.
            url: https://help.openai.com/en/articles/20001338-managing-chatgpt-sites-for-your-workspace
          - title: Keep public publishing off
            body:
              - >-
                Leave public publishing off in Workspace settings; if a public site is approved, grant publish permission
                only to the role that reviews it.
            url: https://help.openai.com/en/articles/20001338-managing-chatgpt-sites-for-your-workspace
          - title: Keep external invitations with a reviewed role
            body:
              - >-
                Turn on Allow members to invite external visitors to sites only for a role whose sites have been reviewed
                for outside viewers.
            url: https://learn.chatgpt.com/docs/enterprise/sites
        note: >-
          Native on the rule applied to every builder on this drawing: an administrator can keep the default audience to
          the workspace and reserve wider publishing for a few roles. New sites start with Owner and workspace admins;
          Enterprise keeps public publishing off until an admin turns it on and invitations to named external viewers
          need their own permission. Gaps: Business has Sites on by default, no separate external-invitation setting,
          and no documented public-publishing default; eligible Enterprise workspaces have had Sites on by default since
          29 October 2026 by the release notes, so a workspace that set nothing may have it on for its members (the
          admin article still describes launch access); role grants and audience methods add up (removing one invitation
          does not remove access through group, workspace or public sharing); Plus and Pro personal accounts are outside
          every workspace control. Who may build is the same role permission (the maker-to-builder pin).
        verified: "2026-11-25"
      - mitigation: D3-AVE
        coverage: none
        mechanism: >-
          No security scan before publishing is documented; review is described as the organisation's step, not a
          product gate
        evidence:
          - title: "Sites administration: Saved versions and publishing (review is an organizational step)"
            url: https://learn.chatgpt.com/docs/enterprise/sites
          - title: OpenAI sub-processor list (hosting providers may run security and safety classifiers on Sites pages)
            url: https://openai.com/policies/sub-processor-list/
        note: >-
          None on the rule applied to every builder on this drawing: the platform runs no scan the workspace can see or
          make blocking. OpenAI's administration guide says an owner or eligible editor can publish without a separate
          approval and that "review is an organizational step, not a product approval gate"; the safety classifiers its
          hosting sub-processors may run report to OpenAI for abuse enforcement. Stand-in: save a version without
          deploying, ask Codex to export the source, run the firm's code and dependency scanners on it and test the
          record checks with separate accounts before the owner deploys.
        verified: "2026-11-25"
      - mitigation: cap-data-access-governance
        coverage: partial
        mechanism: >-
          Plugins in Sites read with each visitor's own connected account and existing permissions, only on sites private
          to the workspace and only after the visitor approves; records in the site's D1 database are protected only by
          server-side code
        steps:
          - title: Allow only reviewed plugins in Sites
            body:
              - >-
                In each plugin's Sites settings turn on Allow site visitors to use this plugin only for plugins reviewed
                for that use.
            url: https://help.openai.com/en/articles/20001338-managing-chatgpt-sites-for-your-workspace
          - title: Test record access with separate accounts
            body:
              - >-
                Before first publication and after material changes, check with two ordinary visitor accounts that one
                cannot read or change the other's records.
            url: https://learn.chatgpt.com/docs/enterprise/sites
        note: >-
          Partial on the rule applied to every builder on this drawing: one path is enforced by the platform and the other
          is code. Connected-app data always uses the visitor's own account (no maker-grant option is documented), the
          site must be private to the workspace, external viewers do not qualify, and scheduled tasks cannot use a
          visitor's approval. The site's own database has no row rules: OpenAI tells owners to enforce record access in
          server-side code, so what a visitor reads there is decided by the code the agent wrote.
        verified: "2026-11-25"
      - mitigation: D3-CH
        coverage: partial
        mechanism: >-
          Owner-only secrets and environment variables in the site's settings, the Sign in with ChatGPT bypass token
          (replaceable), and tunnel runtime credentials kept on the host that runs the tunnel client
        steps:
          - title: Keep keys in site secrets
            body:
              - >-
                In Sites › (site) › More actions › Settings add every key as a secret, never in prompts, attachments, site
                content or .openai/hosting.json.
            url: https://learn.chatgpt.com/docs/sites/managing-a-site
          - title: Treat the bypass token as a secret
            body:
              - >-
                Store any SIWC bypass token in the calling service's secret store and regenerate it if exposed; the old
                token may work for up to five minutes.
            url: https://learn.chatgpt.com/docs/sites/data-and-connections
        note: >-
          Partial on the rule applied to every builder on this drawing: a server-side secret store exists, but nothing
          refuses a publish whose pages or code hold a key. Editors can publish code that uses the site's secrets. On
          regionally hosted sites a changed secret value reaches the live site without publishing. A key pasted into the
          building conversation stays in that conversation.
        verified: "2026-11-25"
      - mitigation: cap-staged-rollout-gate
        coverage: partial
        mechanism: >-
          Save a version (a reviewable build) separate from Deploy a version; the preview stays private in ChatGPT;
          earlier versions can be inspected and redeployed
        steps:
          - title: Save, review, then deploy
            body:
              - >-
                Ask ChatGPT to save a version without deploying, review it, and deploy only that version; every Sites
                deployment URL is a production deployment.
            url: https://learn.chatgpt.com/docs/sites/creating-a-site
          - title: Review migrations before publishing
            body:
              - >-
                Check the database changes a publish will make, and export data first; restoring a version restores code,
                not the database or files.
            url: https://help.openai.com/en/articles/20001339-creating-and-using-chatgpt-sites
        note: >-
          Partial on the rule applied to every builder on this drawing: code is staged and restorable, but the live data
          is not kept apart. There is no separate staging URL, publishing can change the database before the new version
          goes live, and Sites has no built-in backup of records and files.
        verified: "2026-11-25"
      - mitigation: D3-MFA
        coverage: native
        mechanism: >-
          SSO for the workspace's verified domains, set in the Global Admin Console, with MFA enforced at the identity
          provider; workspace-restricted sites sign visitors in with the same ChatGPT identity
        steps:
          - title: Require SSO with MFA
            body:
              - >-
                Manage SSO for every verified domain in the Global Admin Console and enforce MFA on the ChatGPT application
                in the IdP; ChatGPT has no workspace-wide MFA switch.
            url: https://learn.chatgpt.com/docs/enterprise/work-admin-faq
          - title: Provision from the IdP
            body:
              - >-
                Turn on Directory Sync so workspace membership, and with it access to workspace sites, follows the IdP.
            url: https://learn.chatgpt.com/docs/enterprise/user-lifecycle
        note: >-
          Native on the rule applied to every builder on this drawing: single sign-on can be required for makers and for
          visitors of workspace sites, with MFA at the IdP. Gaps: external viewers sign in with their own ChatGPT
          accounts, outside the firm's IdP; public sites need no sign-in; Directory Sync needs Enterprise, Edu or
          Healthcare.
        verified: "2026-11-25"
      - mitigation: AML.M0029
        coverage: none
        mechanism: >-
          No approval step: the owner publishes, and editors publish later versions without owner approval
        evidence:
          - title: "Sites administration: Saved versions and publishing"
            url: https://learn.chatgpt.com/docs/enterprise/sites
          - title: "Creating and using ChatGPT Sites: Edit a Site with collaborators"
            url: https://help.openai.com/en/articles/20001339-creating-and-using-chatgpt-sites
        note: >-
          None on the rule applied to every builder on this drawing: nothing holds a version for someone other than its
          maker. Stand-in, as the pattern recommends where the platform has no approval step: keep public publishing and
          external invitations off or limited to a reviewing role, give Can edit only to people trusted to publish, and
          require the save-review-deploy sequence by policy.
        verified: "2026-11-25"
      - mitigation: AML.M0028
        coverage: native
        mechanism: >-
          Allow site visitors to use this plugin per plugin (off by default in Enterprise, allowed by default in
          Business), the tenant's connected-app policy for ChatGPT Sites, each visitor's approval of the access a site
          requests, and the tunnel permissions for private services
        steps:
          - title: Allow plugins in Sites one by one
            body:
              - >-
                In each plugin's Sites settings save an explicit choice for Allow site visitors to use this plugin; turn it
                on only for plugins reviewed for Sites.
            url: https://help.openai.com/en/articles/20001338-managing-chatgpt-sites-for-your-workspace
          - title: Set the tenant's policy explicitly
            body:
              - >-
                As a global admin open External access › ChatGPT Sites › Access and set Connected apps; with no saved
                policy it is allowed.
            url: https://help.openai.com/en/articles/12289294-managing-your-tenant-in-admin-console
          - title: Keep tunnels to named owners
            body:
              - >-
                Enable Allow members to attach private tunnels only for the owners of reviewed sites, and leave Allow
                public Sites with private tunnels off.
            url: https://help.openai.com/en/articles/20001606-connecting-chatgpt-sites-to-private-services-with-tunnels
        note: >-
          Native on the rule applied to every builder on this drawing: an administrator keeps an allowlist of the
          connectors sites may use and the platform refuses the rest. Write access needs each visitor's approval for
          their own account. Boundary: a site's server code can call any HTTPS API with a key from its secrets, which no
          plugin setting governs; on Business, available plugins are allowed in Sites unless an admin saves a choice; the
          tenant-level policy is allowed when none is saved, and workspaces without a tenant do not have it.
        verified: "2026-11-25"
      - mitigation: D3-AI
        coverage: none
        mechanism: >-
          No list of the workspace's sites is documented; workspace admins can open private sites and transfer ownership
        evidence:
          - title: Managing ChatGPT Sites for your workspace (sharing, ownership transfer)
            url: https://help.openai.com/en/articles/20001338-managing-chatgpt-sites-for-your-workspace
          - title: "Sites administration: Ongoing maintenance"
            url: https://learn.chatgpt.com/docs/enterprise/sites
        note: >-
          None on the rule applied to every builder on this drawing: the pages read describe no inventory of sites with
          their owner, audience, data and connections. Admins are in every new site's default audience and can transfer
          ownership to another active member, and Workspace settings › Sites manages external viewers. Stand-in: a
          register kept by process, each site named with an owner and reporting route as OpenAI's guide asks, reconciled
          with the Compliance API's records of the conversations that build sites.
        verified: "2026-11-25"
      - mitigation: cap-shadow-ai-discovery
        coverage: external
        mechanism: >-
          Nothing in the product lists sites made in personal accounts; the organisation's SSE or CASB (chatgpt.com/sites
          and chatgpt.site traffic) and certificate-transparency searches find them, with domain claiming as prevention
        evidence:
          - title: Creating and using ChatGPT Sites (availability on Plus and Pro)
            url: https://help.openai.com/en/articles/20001339-creating-and-using-chatgpt-sites
          - title: "Plugin controls: verified-domain restrictions"
            url: https://learn.chatgpt.com/docs/enterprise/apps-and-connectors
        note: >-
          External on the same rule as toolChatgptWeb: no page documents a report of personal accounts or their sites.
          Personal sites default to a random identifier in their address, so searching certificate logs for a person's
          name finds little; proxy and SSE logs of chatgpt.com/sites use from corporate devices are the dependable
          signal. Domain claiming (Enterprise, by request) stops corporate apps connecting to personal workspaces.
        verified: "2026-11-25"
      - mitigation: cap-agent-kill-switch
        coverage: partial
        mechanism: >-
          The owner restricts a site's access or deletes it; workspace owners and admins "may be able to change who can
          access a Site" and can transfer ownership; the bypass token is replaced and tunnels are stopped at the client
        steps:
          - title: Restrict, then decide
            body:
              - >-
                Open the site's Share settings and restrict Who has access to the owner or selected people, confirm the
                previous audience is locked out, and delete only after investigation.
            url: https://help.openai.com/en/articles/20001339-creating-and-using-chatgpt-sites
          - title: Cut its connections
            body:
              - >-
                Stop the tunnel client or remove the site's tunnel connection, and regenerate the SIWC bypass token and
                rotate the site's secrets.
            url: https://help.openai.com/en/articles/20001606-connecting-chatgpt-sites-to-private-services-with-tunnels
        note: >-
          Partial on the rule applied to every builder on this drawing: the stop is a sharing change made by the owner,
          and OpenAI's own page says only that workspace admins may be able to change a site's access. Revoking a
          tunnel's runtime key "may not stop a connection that's already running"; deletion is permanent. Personal sites
          are taken down through OpenAI's content-reporting form.
        verified: "2026-11-25"
      - mitigation: AML.M0024
        coverage: partial
        mechanism: >-
          The Compliance Logs Platform (Enterprise and Edu) records the Work and Codex conversations in which sites are
          built, edited and deployed, kept 30 days for collection by Admin key; the Admin Console also has workspace
          audit logs for eligible workspace owners and admins, but no page says they record Sites events
        steps:
          - title: Collect the compliance logs
            body:
              - >-
                Create a workspace Admin key with the log permissions needed and collect conversation and Codex records
                continuously into the SIEM; the platform keeps them 30 days.
            url: https://learn.chatgpt.com/docs/enterprise/compliance-api
        note: >-
          Partial on the rule applied to every builder on this drawing: the building conversations reach the
          organisation's log store, but no page documents audit events for a site's publish, audience change, editor
          grant or plugin consent, in the workspace audit logs (separate from tenant audit logs) or elsewhere. The
          Admin API reference that lists event types renders client-side and was not read. Enterprise and Edu only.
        verified: "2026-11-25"
      - mitigation: cap-ai-vendor-assessment
        coverage: external
        mechanism: >-
          The organisation's TPRM platform, consuming OpenAI's trust portal, the ChatGPT Sites Terms, the sub-processor
          list and the residency pages
        evidence:
          - title: ChatGPT Sites Terms
            url: https://openai.com/policies/chatgpt-sites-terms/
          - title: OpenAI sub-processor list (web hosting of Sites pages)
            url: https://openai.com/policies/sub-processor-list/
          - title: OpenAI Trust Portal
            url: https://trust.openai.com/
        note: >-
          External on the rule applied to every product: the assessment is the organisation's. Questions only OpenAI can
          answer: how one customer's sites, databases and sign-in gate are kept apart on the shared runtime, how a flaw
          in the sign-in gate is fixed for every site, how builds choose packages, and retention of site storage and
          logs (the administration guide sends retention and deletion questions to Support). trust.openai.com refused
          automated fetch on 2026-11-25, so its contents are unverified here.
        verified: "2026-11-25"
    settings:
      - id: sitesRolePermission
        name: Sites (role permission); Use Sites (workspace capability)
        where: Workspace settings › Permissions & roles › (role or workspace defaults) › Early access › Sites (admin article); Permissions › Workspace capabilities › Use Sites (release notes, 2026-10-29)
        setVia: [adminConsole, identityProvider]
        area: identity
        default: "Business: on. Enterprise: on by default in eligible workspaces since 29 October 2026 by the release notes; the admin article still says role and launch access decide"
        recommended: Set explicitly, on only for the roles of trained makers mapped from an IdP group, and checked in both places the pages name
        value: "Trained makers' roles only, set explicitly"
        why: Who may build and publish sites is the first decision about what reaches visitors, and an Enterprise workspace that set nothing may now have Sites on.
        mitigations: [D3-APA]
        requires: Enterprise for role-based control
        url: https://help.openai.com/en/articles/20001338-managing-chatgpt-sites-for-your-workspace
        verified: "2026-11-25"
      - id: launchAccess
        name: Launch access (Sites in Admin Preview)
        where: Admin Preview › Sites › Set launch access or Edit launch access
        setVia: [adminConsole]
        area: identity
        default: "On at launch unless set Off; the release notes say Sites is on by default since 29 October 2026, and an opt-out that was not honoured goes to OpenAI Support"
        recommended: Off for every role except the pilot group, and reopened to check that Off was saved
        value: "Off except the pilot group"
        why: Sites does not reach every member when it launches in the workspace; where launch has passed, the Use Sites capability and role permission are the switch.
        mitigations: [D3-APA]
        requires: Eligible Enterprise workspaces
        url: https://help.openai.com/en/articles/20001338-managing-chatgpt-sites-for-your-workspace
        verified: "2026-11-25"
      - id: publicPublishing
        name: Public publishing
        where: Workspace settings (public publishing), then the publish permission for the role
        setVia: [adminConsole]
        area: sharing
        default: "Off in Enterprise workspaces"
        recommended: Off; where a public site is approved, publishing granted only to the role that reviewed it
        value: "Off"
        why: No site can be opened by anyone on the internet without sign-in unless the firm decided it.
        mitigations: [D3-APA, AML.M0029]
        requires: Business or Enterprise (Business default not stated)
        url: https://help.openai.com/en/articles/20001338-managing-chatgpt-sites-for-your-workspace
        verified: "2026-11-25"
      - id: externalVisitors
        name: Allow members to invite external visitors to sites
        where: Workspace settings › Permissions & roles › (role) › Early access › Sites
        setVia: [adminConsole]
        area: sharing
        default: "Off in Enterprise until enabled"
        recommended: Off, or on only for a role whose sites are reviewed for outside viewers
        value: "Off"
        why: Named outsiders can open a site's pages and data without the site being public; that is a decision per site, not a member's.
        mitigations: [D3-APA]
        requires: Enterprise (Business has no separate setting)
        url: https://learn.chatgpt.com/docs/enterprise/sites
        verified: "2026-11-25"
      - id: externalViewersReview
        name: External viewers (Workspace settings › Sites)
        where: Workspace settings › Sites
        setVia: [adminConsole]
        area: sharing
        recommended: Reviewed monthly; viewers removed when their engagement ends
        value: "Reviewed monthly"
        why: Invited outsiders keep their view until someone removes them, and removal of one invitation can leave access through another audience.
        mitigations: [D3-APA]
        url: https://help.openai.com/en/articles/20001338-managing-chatgpt-sites-for-your-workspace
        verified: "2026-11-25"
      - id: siteAudience
        name: Who has access (Share)
        where: Sites › (site) › Share › Who has access (Owner and workspace admins, selected users or groups, invited external viewers, anyone in the workspace, anyone on the internet)
        setVia: [adminConsole]
        area: sharing
        default: "Owner and workspace admins"
        recommended: Selected users or groups; anyone in the workspace only for sites that hold no personal or confidential data
        value: "Selected users or groups"
        why: Sharing methods add up, so the narrowest audience that fits is the only one that is easy to reason about.
        mitigations: [D3-APA]
        url: https://help.openai.com/en/articles/20001339-creating-and-using-chatgpt-sites
        verified: "2026-11-25"
      - id: siteEditors
        name: Can edit
        where: Sites › (site) › Share › Who has access › (member) › Can edit
        setVia: [adminConsole]
        area: sharing
        default: "Visitors only (Can view)"
        recommended: Only colleagues trusted with the live database and secrets; reviewed when the site gains data or connections
        value: "Trusted collaborators only"
        why: Editors can inspect the live database, publish code that uses the site's secrets, and publish without owner approval after the first publish.
        mitigations: [D3-APA, D3-CH]
        url: https://help.openai.com/en/articles/20001339-creating-and-using-chatgpt-sites
        verified: "2026-11-25"
      - id: allowPluginInSites
        name: Allow site visitors to use this plugin
        where: Admin console › (workspace) › Plugins › (plugin) › Sites settings
        setVia: [adminConsole]
        area: tools
        default: "Business: available plugins allowed; Enterprise: off"
        recommended: An explicit choice saved for every plugin, on only for plugins reviewed for Sites
        value: "On only for reviewed plugins"
        why: Sites can read visitors' connected apps only through plugins the firm has looked at.
        mitigations: [AML.M0028, cap-data-access-governance]
        url: https://help.openai.com/en/articles/20001338-managing-chatgpt-sites-for-your-workspace
        verified: "2026-11-25"
      - id: tenantConnectedApps
        name: Connected apps (External access › ChatGPT Sites)
        where: OpenAI Admin Console › External access › ChatGPT Sites › Access › Connected apps
        setVia: [adminConsole]
        area: tools
        default: "Allowed when no explicit policy has been saved"
        recommended: Saved explicitly; Allowed only once the per-plugin Sites settings are in place
        value: "Set explicitly"
        why: The organisation's choice covers current and future sites, instead of an unsaved default that allows them.
        mitigations: [AML.M0028]
        requires: A tenant in the OpenAI Admin Console; global admin
        url: https://help.openai.com/en/articles/12289294-managing-your-tenant-in-admin-console
        verified: "2026-11-25"
      - id: privateTunnels
        name: Allow members to attach private tunnels
        where: Workspace settings › Permissions & roles › (role)
        setVia: [adminConsole]
        area: tools
        default: "Must be enabled before a tunnel can be attached"
        recommended: On only for the owners of reviewed sites and the IT staff who connect tunnels
        value: "Owners of reviewed sites only"
        why: A tunnel lets a site reach a private service with the tunnel's credentials, for every visitor of that site.
        mitigations: [AML.M0028, D3-APA]
        requires: Eligible Enterprise workspaces (rolling out)
        url: https://help.openai.com/en/articles/20001606-connecting-chatgpt-sites-to-private-services-with-tunnels
        verified: "2026-11-25"
      - id: publicTunnelSites
        name: Allow public Sites with private tunnels
        where: Workspace settings › Permissions & roles › (role)
        setVia: [adminConsole]
        area: sharing
        default: "Off until enabled for both the owner and the publisher"
        recommended: "Off"
        why: A private service reached through a tunnel is never exposed through a site anyone on the internet can open.
        mitigations: [D3-APA, cap-data-access-governance]
        requires: Eligible Enterprise workspaces (rolling out)
        url: https://help.openai.com/en/articles/20001606-connecting-chatgpt-sites-to-private-services-with-tunnels
        verified: "2026-11-25"
      - id: siteSecrets
        name: Secrets and environment variables (site settings)
        where: Sites › (site) › More actions › Settings
        setVia: [adminConsole]
        area: data
        recommended: Every key held here, none in prompts, attachments, site content or .openai/hosting.json; any key pasted into a chat rotated
        value: "Every key in site secrets"
        why: Owner-only settings keep keys out of the pages and the code; a key in the conversation stays there.
        mitigations: [D3-CH]
        url: https://learn.chatgpt.com/docs/sites/managing-a-site
        verified: "2026-11-25"
      - id: siwcBypassToken
        name: Sign in with ChatGPT bypass token (OAI-Sites-Authorization)
        where: Generated by asking ChatGPT Work or Codex (generate_siwc_bypass_token); sent in the OAI-Sites-Authorization header
        setVia: [code]
        area: identity
        default: "None until generated"
        recommended: Only for a named service, stored in its secret store, regenerated whenever it may have been exposed
        value: "Named service only, regenerated on exposure"
        why: Anyone holding the token passes the site's sign-in gate; a new token works at once and the old one may last five minutes.
        mitigations: [D3-CH, D3-APA]
        url: https://learn.chatgpt.com/docs/sites/data-and-connections
        verified: "2026-11-25"
      - id: saveVersionFirst
        name: Save a version (before Deploy a version)
        where: Sites in ChatGPT, asking ChatGPT to save a version without deploying it, then to deploy that version
        setVia: [code]
        area: tools
        default: "Deploying changes updates the live site"
        recommended: Every change saved as a version, reviewed and tested with ordinary accounts, then deployed by someone other than its author where policy requires
        value: "Save, review, then deploy"
        why: Every Sites deployment URL is production, so the saved version is the only place to look before visitors do.
        mitigations: [cap-staged-rollout-gate, AML.M0029]
        url: https://learn.chatgpt.com/docs/sites/creating-a-site
        verified: "2026-11-25"
      - id: sso
        name: SSO
        where: Global Admin Console (admin.openai.com) › SSO and related identity settings, after domain verification
        setVia: [adminConsole, identityProvider]
        area: identity
        recommended: Required for every verified domain, with MFA enforced on the ChatGPT application in your IdP
        value: "Required, with MFA enforced in your IdP"
        why: Makers and visitors of workspace sites sign in through the IdP, the only place ChatGPT's MFA is enforced.
        mitigations: [D3-MFA, D3-APA]
        requires: Business or Enterprise
        url: https://learn.chatgpt.com/docs/enterprise/work-admin-faq
        verified: "2026-11-25"
      - id: directorySync
        name: Enable Directory Sync
        where: Workspace settings › Identity & access › Enable Directory Sync
        setVia: [adminConsole, identityProvider]
        area: identity
        default: "Manual invitations"
        recommended: On, with membership and the roles that grant Sites driven by IdP groups
        value: "On, driven by IdP groups"
        why: Removing someone in the IdP removes their membership, and with it their access to workspace sites and their editor rights.
        mitigations: [D3-MFA, D3-APA]
        requires: Enterprise, Edu or Healthcare
        url: https://learn.chatgpt.com/docs/enterprise/user-lifecycle
        verified: "2026-11-25"
      - id: transferOwnership
        name: Transfer ownership
        where: Sites › (site) › Settings (owner), or by a workspace owner or admin
        setVia: [adminConsole]
        area: sharing
        recommended: Every site of a leaver transferred to a named member before the leaver's account is removed
        value: "Reassigned before offboarding"
        why: A site keeps running after its maker leaves; a named owner is the one who can restrict or retire it.
        mitigations: [D3-APA, cap-agent-kill-switch]
        url: https://help.openai.com/en/articles/20001338-managing-chatgpt-sites-for-your-workspace
        verified: "2026-11-25"
      - id: restrictOrDelete
        name: Share settings (restrict access) and Delete site
        where: Sites › (site) › Share; Sites › (site) › Delete site (type the slug, then Permanently delete)
        setVia: [adminConsole]
        area: sharing
        recommended: In the incident runbook; restrict first, delete only after the investigation and any data export
        value: "Restrict first; delete after review"
        why: Restricting the audience stops visitors at once and keeps the site and its records for investigation; deletion cannot be undone.
        mitigations: [cap-agent-kill-switch]
        url: https://help.openai.com/en/articles/20001339-creating-and-using-chatgpt-sites
        verified: "2026-11-25"
      - id: complianceLogs
        name: Admin keys (Compliance Logs Platform)
        where: A workspace-scoped Admin key created by a workspace owner or admin in Admin Console, read by the download script or the Admin API
        setVia: [adminConsole, apiCli]
        area: audit
        recommended: A workspace-scoped key with the log permissions needed, collecting continuously into the SIEM
        value: "Collected continuously into the SIEM"
        why: The conversations that build and deploy sites are kept 30 days at OpenAI; the SIEM keeps them as long as the firm needs.
        mitigations: [AML.M0024]
        requires: Enterprise or Edu
        url: https://help.openai.com/en/articles/9261474-openai-compliance-platform-for-enterprise-and-edu-customers
        verified: "2026-11-25"
      - id: improveTheModel
        name: Improve the model for everyone
        where: The personal account's data controls (Plus and Pro), as the Help Center's Sites FAQ names the setting
        setVia: [adminConsole]
        area: data
        default: "Business, Enterprise and Edu: not used for training; Plus and Pro: per this setting"
        recommended: Off on any personal account used for work; workspace accounts for anything with firm data
        value: "Off; workspace accounts for work"
        why: Site-building conversations on personal accounts can otherwise be used for training, site information included.
        mitigations: []
        url: https://help.openai.com/en/articles/20001339-creating-and-using-chatgpt-sites
        verified: "2026-11-25"
