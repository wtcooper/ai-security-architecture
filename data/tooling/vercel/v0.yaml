# Vercel v0 — one entity per product × reference architecture. Facts are dated (asOf) and cite the
# vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# A separate entity from toolVercelAiSdk: the AI SDK is a framework the customer hosts (single-agent workflow and
# the hosted patterns it builds); v0 is Vercel's hosted builder, which writes the app and publishes it to the
# team's Vercel project, so it sits on the hosted AI app builder drawing and carries no builder.also entry.
# Scope: v0.app chats and projects in a team workspace, the publish flow, and the Vercel team and project settings
# that decide who can open what v0 publishes (Deployment Protection, Passport, Deployment Policies, environment
# variables, Vercel Connect, Audit Logs). Exclusions: the v0 iOS app shows the same chats (noted, not modelled);
# the v0 MCP server and Platform API used from an IDE are programmatic access to the same service (the API is a
# variant); Vercel AI Gateway and Vercel Sandbox are separate products recorded only as facts; databases come from
# Vercel Marketplace providers (Supabase, Neon, Upstash, Vercel Blob) whose own row-level rules and consoles are
# theirs, not v0's.
# 2026-11-25: onboarded against the hosted app builder pins. Read that day as Markdown (append .md; all 200):
# v0.app/docs deployments, full-stack-apps, security, security-check, sharing, teams, enterprise, MCP, databases,
# external-apis, vercel-integration, github, projects, custom-domains, faqs, pricing, account, usage-dashboard,
# sandbox, vercel-connect, versions, private-dependencies, terminal-commands, agentic-features, slack,
# api/v2/guides/security-review; vercel.com/docs deployment-protection (last_updated 2026-09-15),
# vercel-authentication, passport, password-protection, methods-to-bypass-deployment-protection, saml,
# directory-sync, audit-log, drains/reference/audit-logs, deployments/deployment-policy,
# environment-variables/sensitive-environment-variables, instant-rollback, projects/managing-projects, connect,
# connect/concepts/authentication, agent/security-review and its usage page; vercel.com/kb/guide/vercel-passport;
# vercel.com/changelog/updates-to-terms-of-service-march-2026; v0.app/policy (HTML, 200). Moved or failed:
# vercel.com/docs/vercel-sandbox/concepts/firewall redirects to /docs/sandbox/concepts/firewall;
# vercel.com/docs/observability/activity-log redirects to /docs/logs#activity-logs; vercel.com/legal/ai-policy and
# /legal/v0-ai-policy 404 (v0.app/policy is the AI policy); security.vercel.com 403 to automated fetch (trust
# portal, unverified today); vercel.com/docs/projects/overview, /docs/environment-variables/secret-scanning and
# /docs/security/data-preferences 404. Two pages disagree on the training opt-out: the March 2026 terms changelog
# says paid Pro teams are opted out by default with a Data Preferences toggle on every plan, while the v0 pricing
# table lists Data Opt-out only on Business and Enterprise; both are recorded on dataPreferences. Vercel's
# 2025-08-04 blog says v0 blocks deployments that expose secrets; the current security page (2026-11-24) says v0
# analyses NEXT_PUBLIC_ usage and warns, so the warning is what is credited. No v0-specific advisory was found;
# Next.js advisories affect v0-built apps and belong to Next.js.
vendor: vercel
family: v0
tools:
  - id: toolVercelV0
    name: Vercel v0
    surfaceClasses:
      - saasAgentPlatform
      - chatIntegration
    variants:
      - name: v0.app (chat, preview, code editor and Publish)
        class: saasAgentPlatform
        url: https://v0.app/docs/deployments
        note: >-
          The builder most makers use. Each VM-backed chat runs in its own Vercel Sandbox, and Publish creates or
          updates the team's Vercel project and its production deployment.
      - name: v0 Platform API v2 (chats, deployments, security reviews from code)
        class: saasAgentPlatform
        url: https://v0.app/docs/api/v2/guides/security-review
        note: >-
          The same service driven from the customer's own code with a v0 API key; DeepSec reviews and deployments
          can be requested through it.
      - name: v0 bot for Slack (beta)
        class: chatIntegration
        url: https://v0.app/docs/slack
        note: >-
          Anyone in a channel where the bot is installed can mention @v0 to change a connected GitHub repository;
          v0 opens a branch and a pull request, and Vercel builds a preview of each commit. Each Slack user links
          their own Vercel account.
    architecture: archHostedAppBuilder
    status: ga
    asOf: "2026-11"
    summary:
      - >-
        Vercel's AI app builder. A maker describes an app; v0's agent writes a Next.js app in a per-chat Vercel
        Sandbox, adds databases, storage and AI models through Vercel Marketplace integrations (Supabase, Neon,
        Upstash, Vercel Blob), connects third-party services through Vercel Connect, and on Publish deploys it to
        the team's Vercel project at a vercel.app address or a custom domain. Sign-in is code v0 writes, so the
        platform's own audience check is Vercel Deployment Protection in front of the deployment.
      - >-
        The administrator works in two places: v0's workspace settings (chat visibility, sharing limits, custom
        models, Agent Permissions, Sandbox Network Policy) and the Vercel team behind it (v0 roles, SAML, Directory
        Sync and Access Groups, Deployment Protection defaults and Passport, Deployment Policies, environment
        variable types, Audit Logs). v0 roles govern actions in the v0 web app; Vercel roles govern the dashboard,
        the CLI and Git-triggered deployments. Many controls follow the Vercel team's plan rather than the v0
        plan.
    facts:
      - label: Plans
        value: >-
          Free, Premium (being sunset), Plus ($30 per user a month), Business ($100 per user a month) and Enterprise.
          Team features start on Plus; only Enterprise has the v0 Builder, Creator and Viewer roles, SAML SSO and
          audit logs. A team plan is linked to a Vercel team, whose own plan decides Deployment Policies (Pro and
          Enterprise), Password Protection (Pro add-on), and Passport, Trusted IPs, Directory Sync, Access Groups
          and Audit Logs (Enterprise).
        url: https://v0.app/docs/pricing
      - label: Inference & routing
        value: >-
          v0 models by default. Enterprise teams can browse AI Gateway models, which stay locked until a team Owner
          turns on Allow custom models; ChatGPT Plus, Pro and Business users can pay for eligible responses from
          supported OpenAI models with their ChatGPT plan.
        url: https://v0.app/docs/enterprise
      - label: Data leaving the device
        value: >-
          A vendor-hosted builder: chats, uploads and code are processed by Vercel; each VM-backed chat runs in a
          Vercel Sandbox holding the project's Development environment variables, with outbound network allow-all
          by default; the deployed app runs on Vercel Functions; databases and storage are provisioned at the
          Marketplace provider, which receives the app's records.
        url: https://v0.app/docs/sandbox
      - label: Retention & training
        value: >-
          Enterprise content is not used for training. The March 2026 terms put Hobby and trial Pro teams opted in
          by default and paid Pro teams opted out, with Team Settings › Data Preferences on every plan; v0's plan
          table lists Data Opt-out only on Business and Enterprise. Archived chats are kept 30 days; deletion of
          v0 outputs is requested by email.
        url: https://v0.app/docs/faqs
      - label: Docs index
        value: v0.app/docs/llms.txt (every v0 page; append .md for Markdown) and vercel.com/docs for the team and project settings
        url: https://v0.app/docs/llms.txt
      - label: Compliance scope
        value: v0 is included in Vercel's SOC 2 Type 2 attestation (Security, Confidentiality, Availability).
        url: https://v0.app/docs/security
    items:
      - title: Where each control lives
        body:
          - >-
            v0 › Settings › Workspace: Default Chat Visibility, Restrict Chat Sharing (Enterprise), Allow custom
            models (Enterprise), Allow v0 to Act on Behalf of Members, Transfer Data. v0 › Settings › Advanced: Agent
            Permissions (User and Team tabs), Sandbox Network Policy. v0 › Project menu › Settings: Vercel Project
            (production visibility), Integrations (Remote MCP per integration), Environment Variables, GitHub,
            Domains. Vercel › Team Settings: Security & Privacy (SAML, Directory Sync, Audit Log, Separate
            Production Secret Values), Deployment Protection team default, Passport, Access Groups, Members (Manage
            v0 role), Build and Deployment (Deployment Sources, Git Sources), Agent (Security Reviews), Data
            Preferences. Vercel › Project › Settings: Deployment Protection, Environment Variables, General (Pause
            Project), and Instant Rollback on the production tile.
        links:
          - title: "v0 docs: Enterprise (roles, SSO, privacy settings)"
            url: https://v0.app/docs/enterprise
          - title: "v0 docs: Deployments (publish flow, visibility, advanced settings)"
            url: https://v0.app/docs/deployments
          - title: Deployment Protection on Vercel
            url: https://vercel.com/docs/deployment-protection
      - title: Two role systems, and the Owner's reach
        body:
          - >-
            v0 roles (v0 Builder, v0 Creator, v0 Viewer, No v0 access) control what a member does in the v0 web app;
            Vercel team and project roles control the dashboard, the CLI and Git-triggered deployments. The v0
            Builder role is team-wide: it can deploy and manage environment variables on every v0-connected project,
            not only the ones the member was added to. Members with the Vercel Owner role can open, edit and archive
            any chat the team owns by URL, including chats set to Only people with access and history from before a
            personal chat was moved into the team; that access is not shown in listings.
        links:
          - title: "v0 docs: Enterprise (choosing the right role)"
            url: https://v0.app/docs/enterprise
          - title: "v0 docs: Teams (Team Owner administrative access)"
            url: https://v0.app/docs/teams
      - title: What decides who can open a published app
        body:
          - >-
            The app's own sign-in is code v0 writes. The platform's check in front of it is the project's Deployment
            Protection: a method (Vercel Authentication, Passport, Password Protection, Trusted IPs) and a scope.
            Standard Protection protects every deployment except production domains, so a published app's production
            address answers anyone until the project uses All Deployments. Shareable Links, Deployment Protection
            Exceptions, Trusted Sources, the OPTIONS allowlist and Protection Bypass for Automation all let requests
            past it; disabling Vercel Authentication leaves every existing deployment unprotected.
        links:
          - title: Deployment Protection on Vercel (methods and scopes)
            url: https://vercel.com/docs/deployment-protection
          - title: Bypass Deployment Protection for testing, sharing, and automation
            url: https://vercel.com/docs/deployment-protection/methods-to-bypass-deployment-protection
    riskNotes:
      - risk: riskSensitiveDataDisclosure
        note: >-
          Any environment variable with the NEXT_PUBLIC_ prefix is shipped to the browser; v0 analyses that usage and
          warns, and nothing an administrator sets refuses the publish. Under Standard Protection the production
          domain is public, so the warning and the agent's code are all that stand between a key and every visitor.
      - risk: riskRogueActions
        note: >-
          Marketplace database integrations give the builder agent tools that create, update and drop tables, on
          by default (Ask for Approval) for each new integration; the default Auto mode lets v0 decide when to ask,
          and Full mode skips every team rule. Unless the project's environments point at separate database
          resources, the chat works on the live app's data.
      - risk: riskInsecureModelOutput
        note: >-
          Sign-in and authorisation are code v0 writes (for example Supabase auth and its row-level policies); the
          DeepSec review runs only when someone asks for it in the chat, and Vercel Security Review only on
          GitHub-connected projects.
      - risk: riskShadowAndUnknownAgents
        note: >-
          Any Vercel account has a personal scope with a free v0 plan; chats and projects made there publish to
          vercel.app outside the team, and nothing in the team lists them.
      - risk: riskAgenticDelegationConfusedDeputy
        note: >-
          With Vercel Connect, v0 chooses between each user's own account and a shared app account from what the
          maker asked for; with the shared account every visitor acts through one credential.
      - risk: riskCrossTenantCredentialPropagation
        note: >-
          A chat's history, including any key pasted into it, is readable by every Vercel Owner of the team that owns
          it, by URL and without an invitation, and moving a personal chat into a team carries its whole history.
      - risk: riskPromptInjection
        note: >-
          Screenshots, Figma files, uploaded code, web search, the agent's browser and MCP tool results all become
          the agent's context; MCP servers configured by a member join every chat they start.
      - risk: riskInsecureIntegratedComponent
        note: >-
          The sandbox installs whatever packages the agent adds, with the Sandbox Network Policy at allow-all unless a
          team Owner narrows it, and the build ships them.
    controls:
      - mitigation: D3-APA
        coverage: native
        mechanism: >-
          Vercel Deployment Protection on the project (Vercel Authentication, Passport, Password Protection, Trusted
          IPs; scope Standard Protection or All Deployments) with a team default for new projects; v0 roles assigned
          per member or through Access Groups mapped by Directory Sync; Deployment Policies limiting which sources
          deploy to production; v0 workspace settings for chat visibility and sharing
        steps:
          - title: Default new projects to All Deployments
            body:
              - >-
                In the team's Deployment Protection default choose All Deployments with Vercel Authentication (Passport
                on Enterprise), so every project v0 creates is closed to anyone outside the team.
            url: https://vercel.com/docs/deployment-protection
          - title: Protect existing v0 projects
            body:
              - >-
                In each project's Settings › Deployment Protection set Vercel Authentication to All Deployments, or set
                ssoProtection.deploymentType to all through the projects API.
            url: https://vercel.com/docs/deployment-protection/methods-to-protect-deployments/vercel-authentication
          - title: Give makers a role that cannot widen access
            body:
              - >-
                Under Members › Manage v0 role give most makers v0 Creator on the Vercel Viewer role, and v0 Builder
                only to people who may deploy every v0-connected project.
            url: https://v0.app/docs/enterprise
          - title: Close the chat-sharing options
            body:
              - >-
                In v0 › Settings › Workspace set Default Chat Visibility to Team can view and turn on Restrict Chat
                Sharing to remove Anyone with the link and Anyone on the web.
            url: https://v0.app/docs/sharing
        note: >-
          Native on the rule applied to every builder on this drawing: an administrator can make the platform's own
          audience check default to the workspace and keep the power to widen it with a few roles. The Deployment
          Protection default for new projects is a team setting, and Vercel Authentication is managed by the Owner,
          Member and admin roles, so makers on the Vercel Viewer role cannot change it in the dashboard; the v0
          publish flow offers visibility choices that "depend on your team's plan and deployment protection
          settings", and whether a v0 Builder on the Viewer role can widen production visibility there is not stated,
          so test it. Gaps: the pages read do not state the protection a new project gets when no team default is set;
          Standard Protection (the recommended scope) leaves production domains public; Shareable Links, Deployment
          Protection Exceptions, Trusted Sources and Protection Bypass for Automation let requests through, and access
          requests let named Vercel users in; v0 Builder is team-wide; the three v0 roles, Restrict Chat Sharing,
          Access Groups and Directory Sync need Enterprise. Who may build at all (the maker-to-builder pin) is the v0
          role, No v0 access for everyone outside the approved groups.
        verified: "2026-11-25"
      - mitigation: D3-AVE
        coverage: partial
        mechanism: >-
          Vercel Security Review (public beta, Pro and Enterprise) reviews every push to GitHub-connected projects,
          records findings in the Vulnerabilities dashboard and adds a GitHub check; DeepSec reviews a chat's changes
          when a member asks; v0's own NEXT_PUBLIC_ analysis warns; GitHub-backed publishes wait on the repository's
          required status checks
        steps:
          - title: Turn on Security Review for every project
            body:
              - >-
                In Team Settings › Agent › Security Reviews turn on Review Changes Automatically with All projects, and
                add a team policy naming the data the apps hold.
            url: https://vercel.com/docs/agent/security-review
          - title: Send every production publish through GitHub
            body:
              - >-
                In Team Settings › Build and Deployment › Deployment Sources add a Production rule that allows Git and
                clears v0, so v0 publishes by merging a pull request.
            url: https://vercel.com/docs/deployments/deployment-policy
          - title: Require the review's check before merge
            body:
              - >-
                In the repository's branch protection require the Security Review check; v0 keeps the pull request
                open while a required check has not passed.
            url: https://v0.app/docs/github
        note: >-
          Partial on the rule applied to every builder on this drawing: a scan an administrator can switch on that
          reports findings but has no setting that blocks the publish on them. Security Review covers only projects
          whose code is pushed to GitHub, it is in public beta, and its page says it adds a GitHub check without saying
          the check fails on a finding, so requiring that check gates the merge only as far as the check's own result
          does; projects published without GitHub deploy straight from the chat and are not reviewed. DeepSec runs
          only when someone asks, on paid plans, and "some enterprise deployments aren't eligible". Vercel's 2025 blog
          describes deploy blocks for exposed secrets run by Vercel; the current security page says v0 warns. What the
          scan cannot see, such as a table with no row rule at the database provider, needs the review in the
          data-access row.
        verified: "2026-11-25"
      - mitigation: cap-data-access-governance
        coverage: partial
        mechanism: >-
          Row rules live at the Marketplace database provider (Supabase row-level security, for example) and are code
          v0 writes; Vercel Connect issues per-user tokens when the app is set up on users' own accounts; Passport
          gives server code a verified visitor identity it can forward
        steps:
          - title: Choose users' own accounts for connections
            body:
              - >-
                When v0 proposes a Vercel Connect connection, accept the model that uses each person's own account for
                any app that reads records, and refuse a shared app account except for bots and schedules.
            url: https://v0.app/docs/vercel-connect
          - title: Read the database's own rules before real data
            body:
              - >-
                Open the integration from Project menu › Settings › Integrations and review each table's policies at
                the provider before the app holds real records.
            url: https://v0.app/docs/databases
        note: >-
          Partial on the rule applied to every builder on this drawing: per-visitor access is available but nothing an
          administrator sets requires it. v0 picks the Connect authorisation model from the request and tells the maker
          which before setup; a shared app account makes every visitor act as one identity. Rows in the app's database
          are protected only by the rules v0 writes at the provider, and v0 documents no check of what those rules
          allow; DeepSec looks for missing authorisation in code when asked. Passport identity is read by server code,
          so record-level decisions remain the app's.
        verified: "2026-11-25"
      - mitigation: D3-CH
        coverage: partial
        mechanism: >-
          Project and team environment variables typed Secret (write-only after saving); the Separate Production
          Secret Values team policy; Vercel Connect short-lived OAuth tokens in place of pasted keys (beta in v0);
          private registry tokens injected at the sandbox's network boundary; the Vercel GitHub App on selected
          repositories for export and sync
        steps:
          - title: Store keys as Secret variables
            body:
              - >-
                In Project › Settings › Environment Variables add every key with Type Secret and never under a
                NEXT_PUBLIC_ name.
            url: https://vercel.com/docs/environment-variables/sensitive-environment-variables
          - title: Separate production secrets
            body:
              - >-
                In Team Settings › Security turn on Separate Production Secret Values so Production never shares a
                value with Preview or Development.
            url: https://vercel.com/docs/environment-variables/sensitive-environment-variables
          - title: Limit the GitHub App to named repositories
            body:
              - >-
                In the Vercel GitHub App's installation settings on GitHub choose only the repositories v0 projects
                sync with.
            url: https://v0.app/docs/github
        note: >-
          Partial on the rule applied to every builder on this drawing: a server-side secret store and short-lived
          connector tokens exist, but nothing an administrator sets refuses a publish whose front end exposes a key.
          v0 analyses NEXT_PUBLIC_ usage and warns, and can move code server-side; it does not stop the deploy. A key
          pasted into the chat stays in the history, readable by the team's Owners. Integration-created variables
          cannot be switched to Secret in place. The npm and shared-variable credentials are kept from the model and
          the sandbox filesystem by design.
        verified: "2026-11-25"
      - mitigation: cap-staged-rollout-gate
        coverage: partial
        mechanism: >-
          Preview deployments per working branch, environment variables per environment (the chat's preview reads only
          Development), Remote MCP availability per integration, Instant Rollback of production, and Deployment
          Policies that send production through Git
        steps:
          - title: Turn off the agent's database tools on live data
            body:
              - >-
                In Project menu › Settings › Integrations › (integration) › Remote MCP choose Disabled for any database
                that holds the live app's records.
            url: https://v0.app/docs/MCP
          - title: Give each environment its own resources
            body:
              - >-
                Connect separate database resources to Development, Preview and Production and keep production
                credentials out of the other two.
            url: https://v0.app/docs/external-apis
          - title: Keep a rollback ready
            body:
              - >-
                Use Instant Rollback on the production tile to return to an earlier deployment; it restores the build,
                not environment variables or database contents.
            url: https://vercel.com/docs/instant-rollback
        note: >-
          Partial on the rule applied to every builder on this drawing: code is staged and restorable, but keeping the
          agent and previews off the live app's data is the deployer's arrangement. Integrations add their variables
          to the project when connected and v0 "can generate and execute SQL", creating, updating and dropping tables;
          new integrations default to Ask for Approval, which in the runtime does not override the chat's permission
          mode (Auto by default; Full skips every rule). Restores cover code only.
        verified: "2026-11-25"
      - mitigation: D3-MFA
        coverage: native
        mechanism: >-
          SAML SSO for the Vercel team with Require Team Members to login with SAML, MFA enforced at the identity
          provider; Directory Sync for provisioning; Passport signing app visitors in through the organisation's
          OpenID Connect provider
        steps:
          - title: Enforce SAML for the team
            body:
              - >-
                In Team Settings › Security & Privacy › Authentication and User Provisioning configure SAML, then turn on
                Require Team Members to login with SAML.
            url: https://vercel.com/docs/saml
          - title: Sign app visitors in through your IdP
            body:
              - >-
                In Team Settings › Passport turn on Passport with a Connect application for your IdP as the team default,
                and assign it to existing projects.
            url: https://vercel.com/kb/guide/vercel-passport
          - title: Provision from the IdP
            body:
              - >-
                Configure Directory Sync and map IdP groups to Access Groups that carry the v0 role, so removal at the
                IdP removes v0 access.
            url: https://v0.app/docs/enterprise
        note: >-
          Native on the rule applied to every builder on this drawing: single sign-on can be required for makers and
          for visitors of workspace apps, with MFA at the IdP. Holds on Enterprise: v0's plan table lists SAML SSO on
          Enterprise only (Vercel's SAML page also offers it to Pro teams as a paid add-on), and Passport and Directory
          Sync are Enterprise. Vercel Authentication alone admits any Vercel account with access, and the team's
          SAML enforcement covers team members, not external Vercel users granted access by request or anyone holding a
          Shareable Link; SAML sessions last 24 hours unless session_lifetime is set.
        verified: "2026-11-25"
      - mitigation: AML.M0029
        coverage: partial
        mechanism: >-
          Deployment Policies (Pro and Enterprise) that keep v0 from deploying to production without Git, so every v0
          publish merges a pull request on which GitHub branch protection's required reviews apply
        steps:
          - title: Block direct v0 deployments to production
            body:
              - >-
                In Team Settings › Build and Deployment › Deployment Sources add a rule for Production that allows Git and
                clears v0, and a Git Sources rule naming the firm's GitHub organisation.
            url: https://vercel.com/docs/deployments/deployment-policy
          - title: Require a reviewer on the base branch
            body:
              - >-
                In the repository's branch protection require an approving review; v0 cannot complete a publish until
                the review is done in GitHub.
            url: https://v0.app/docs/github
        note: >-
          Partial on the rule applied to every builder on this drawing: a person approves the version before it goes
          live, but the approval is a code review in GitHub, not an admin's decision on the app's audience or
          connectors. The reviewer approves the merged change (the output), and a change to a project's Deployment
          Protection or a new Connect link is not gated by it. Needs Pro or Enterprise for Deployment Policies and a
          GitHub-backed project.
        verified: "2026-11-25"
      - mitigation: AML.M0028
        coverage: partial
        mechanism: >-
          The Integrations Manager permission (who can install Marketplace integrations), Vercel Connect RBAC and
          project links (which projects and environments can request tokens from a connector), per-token scopes in the
          app's code, Remote MCP availability per integration and team Agent Permissions rules for the builder agent
        steps:
          - title: Keep integration installs with the platform team
            body:
              - >-
                Give makers the Vercel Viewer role without Integrations Manager, so only the platform team installs
                Marketplace integrations.
            url: https://v0.app/docs/enterprise
          - title: Link each connector only where it is needed
            body:
              - >-
                In Vercel Connect attach each connector only to the projects and environments that use it; requests
                from any other project are refused with 403.
            url: https://vercel.com/docs/connect/concepts/authentication
          - title: Set team rules for the builder's commands
            body:
              - >-
                In v0 › Settings › Agent Permissions › Team add ask and deny rules for deployment, database and network
                commands.
            url: https://v0.app/docs/terminal-commands
        note: >-
          Partial on the rule applied to every builder on this drawing: who may connect a service is role-gated and the
          platform refuses unlinked projects, but there is no allowlist of the connectors apps may use, and each token's
          scopes are set in the app's code that v0 writes. Members can add their own MCP servers to chats (No Auth,
          headers, bearer or OAuth); those are builder tools, not app connectors. Team Agent Permissions rules do not
          apply in Full mode, and no page says an administrator can remove Full mode.
        verified: "2026-11-25"
      - mitigation: D3-AI
        coverage: partial
        mechanism: >-
          The team's Vercel projects list and API, v0's Projects tab, and the Usage & Activity dashboard grouped by
          project (Owners and Billing role, team plans)
        steps:
          - title: Reconcile the team's projects monthly
            body:
              - >-
                In v0.app/settings/usage open Activity › Team grouped by Projects, download the table and reconcile it
                with the Vercel project list and each project's protection and integrations.
            url: https://v0.app/docs/usage-dashboard
        note: >-
          Partial on the rule applied to every builder on this drawing: the platform lists the workspace's apps but not
          their audience, data and connectors together; those are read project by project (Deployment Protection,
          Integrations, Connect links). Chats and projects in members' personal scopes are not in the team's lists, and
          Owners see teammates' chats only by URL.
        verified: "2026-11-25"
      - mitigation: cap-shadow-ai-discovery
        coverage: external
        mechanism: >-
          Nothing in v0 or the Vercel team lists apps people build in personal scopes; the organisation's SSE or CASB
          (v0.app and vercel.app traffic) and certificate-transparency searches find them
        evidence:
          - title: "v0 docs: How do v0 and Vercel accounts differ? (the personal scope)"
            url: https://v0.app/docs/vercel-integration
          - title: "v0 docs: Teams (transferring chats into a team)"
            url: https://v0.app/docs/teams
        note: >-
          External on the rule applied to every builder on this drawing: no page documents a way to find v0 chats or
          Vercel projects made outside the team. Every Vercel account has a personal scope with a free v0 plan, and its
          deployments get vercel.app addresses. Stand-in: SSE or CASB discovery of v0.app sign-ins with corporate
          email, certificate-transparency and passive-DNS searches for the organisation's names under vercel.app, and
          moving what is found into the team with Transfer Chat.
        verified: "2026-11-25"
      - mitigation: cap-agent-kill-switch
        coverage: native
        mechanism: >-
          Pause Project (dashboard or REST API) serving 503 DEPLOYMENT_PAUSED on the production deployment; Deployment
          Protection All Deployments; revocation of Vercel Connect tokens; rotation of Secret variables
        steps:
          - title: Pause the app
            body:
              - >-
                In Project › Settings › General select Pause Project, or POST /v1/projects/<id>/pause, and visitors to
                production get 503 DEPLOYMENT_PAUSED.
            url: https://vercel.com/docs/projects/managing-projects
          - title: Revoke its connections
            body:
              - >-
                From the Vercel Connect dashboard revoke the app's tokens, then rotate any Secret environment variable it
                held.
            url: https://v0.app/docs/vercel-connect
        note: >-
          Native on the rule applied to every builder on this drawing: an administrator can take any workspace app
          offline at once and revoke what it holds. Pausing needs the Owner, Member or Project Administrator role and
          takes effect on the production deployment; the page does not say it stops preview URLs, which Standard
          Protection already keeps private. Resuming takes a few minutes. Marketplace database credentials are rotated at
          the provider. Apps in personal scopes are out of reach; the route for those is Vercel's abuse reporting.
        verified: "2026-11-25"
      - mitigation: AML.M0024
        coverage: partial
        mechanism: >-
          Vercel Audit Logs (Enterprise; Owner and Security roles) exported as CSV for 90 days or streamed by Audit Log
          Drains, recording protection, password, environment variable, integration, member and Passport access events
        steps:
          - title: Stream the audit log to the SIEM
            body:
              - >-
                In Team Settings › Security & Privacy › Audit Log configure a drain to the SIEM (Custom SIEM Log Streaming
                is being replaced by Audit Log Drains).
            url: https://vercel.com/docs/audit-log
        note: >-
          Partial on the rule applied to every builder on this drawing: audience and secret changes reach the
          organisation's log store, but publishes do not appear in the documented action list. The list covers
          project.sso_protection and password protection changes, environment variable changes, integrations installed,
          team membership, alias access requests and passport-access-granted, but no deployment-created or v0 chat
          events (deployment events listed are deleted, errored, pruned and undeleted). Enterprise only.
        verified: "2026-11-25"
      - mitigation: cap-ai-vendor-assessment
        coverage: external
        mechanism: >-
          The organisation's TPRM platform, consuming Vercel's SOC 2 Type 2 report (v0 in scope), the AI policy and the
          Marketplace providers' own terms
        evidence:
          - title: "v0 docs: Security (compliance, enterprise data isolation)"
            url: https://v0.app/docs/security
          - title: Vercel AI Policy (training use by plan)
            url: https://v0.app/policy
          - title: "v0 docs: Sandbox (isolation boundaries)"
            url: https://v0.app/docs/sandbox
        note: >-
          External on the rule applied to every product: the assessment is the organisation's, fed by the vendor's
          attestations. Questions only Vercel can answer: how chats, projects and sandboxes are isolated between teams,
          how fast a flaw in Deployment Protection or Passport is fixed for every project, how the sandbox chooses and
          checks packages (network policy is allow-all by default), and which Marketplace provider holds each app's
          data. security.vercel.com refused automated fetch, so the trust portal's contents are unverified here.
        verified: "2026-11-25"
    settings:
      - id: teamDeploymentProtection
        name: Team default Deployment Protection
        where: Vercel › Team Settings › Deployment Protection (team default for new projects)
        setVia: [adminConsole]
        area: sharing
        default: "Not stated on the page read; existing projects keep their own setting"
        recommended: All Deployments with Vercel Authentication, or Passport on Enterprise, for every new project
        value: "All Deployments, Vercel Authentication"
        why: Standard Protection leaves production domains public, so without this a v0 publish answers anyone who has the address.
        mitigations: [D3-APA]
        url: https://vercel.com/docs/deployment-protection
        verified: "2026-11-25"
      - id: projectVercelAuthentication
        name: Vercel Authentication
        where: Vercel › Project › Settings › Deployment Protection › Vercel Authentication (or v0 › Project menu › Settings › Vercel Project); API ssoProtection.deploymentType
        setVia: [adminConsole, apiCli]
        area: sharing
        recommended: "On, scope All Deployments (deploymentType all) for internal apps; Standard Protection only for an app approved to be public"
        value: "All Deployments"
        why: The platform's audience check then covers the production domain as well as previews.
        mitigations: [D3-APA]
        url: https://vercel.com/docs/deployment-protection/methods-to-protect-deployments/vercel-authentication
        verified: "2026-11-25"
      - id: passport
        name: Passport
        where: Vercel › Team Settings › Passport (Passport toggle and Connect application), then assign to existing projects
        setVia: [adminConsole, identityProvider]
        area: identity
        default: "Off"
        recommended: On as the team default with the firm's IdP, restricted to assigned users there, and All Deployments scope
        value: "On, firm IdP, team default"
        why: Visitors sign in through the firm's IdP and its MFA before the app loads, and the app receives their verified identity.
        mitigations: [D3-MFA, D3-APA]
        requires: Enterprise; Owner role
        url: https://vercel.com/kb/guide/vercel-passport
        verified: "2026-11-25"
      - id: protectionBypasses
        name: Shareable Links, Deployment Protection Exceptions and Protection Bypass for Automation
        where: Vercel › Project › Settings › Deployment Protection (bypass methods)
        setVia: [adminConsole]
        area: sharing
        default: "None configured"
        recommended: No Shareable Links or Exceptions on production; bypass secrets only for named automation, regenerated when a holder leaves
        value: "None on production"
        why: Each one lets a request past the audience check, so an approved audience means nothing while one is open.
        mitigations: [D3-APA]
        url: https://vercel.com/docs/deployment-protection/methods-to-bypass-deployment-protection
        verified: "2026-11-25"
      - id: v0Roles
        name: Manage v0 role (v0 Builder, v0 Creator, v0 Viewer, No v0 access)
        where: Vercel › Team Settings › Members › (member) › Manage v0 role, or v0 › Settings › Members
        setVia: [adminConsole]
        area: identity
        recommended: "v0 Creator for most makers, v0 Builder only for people trusted to deploy every v0-connected project, No v0 access for everyone else"
        value: "Creator by default; Builder for a few"
        why: v0 Builder is team-wide, so one Builder can deploy and change secrets on every project connected to v0.
        mitigations: [D3-APA]
        requires: Enterprise for three roles (Plus and Business assign v0 Builder only)
        url: https://v0.app/docs/enterprise
        verified: "2026-11-25"
      - id: accessGroups
        name: Access Groups with v0 roles, mapped through Directory Sync
        where: Vercel › Team Settings › Access Groups; Security & Privacy › Authentication and User Provisioning › Directory Sync
        setVia: [adminConsole, identityProvider]
        area: identity
        recommended: Each IdP group mapped to an Access Group carrying its team role and v0 role; no manual v0 assignments
        value: "IdP groups drive v0 roles"
        why: Who may build follows the IdP, and removing someone there removes their v0 access.
        mitigations: [D3-APA, D3-MFA]
        requires: Enterprise
        url: https://v0.app/docs/enterprise
        verified: "2026-11-25"
      - id: requireSaml
        name: Require Team Members to login with SAML
        where: Vercel › Team Settings › Security & Privacy › Authentication and User Provisioning
        setVia: [adminConsole, identityProvider]
        area: identity
        default: "Off"
        recommended: On, with MFA enforced on the Vercel application in your IdP
        value: "On, MFA in your IdP"
        why: Team members cannot reach any team information, v0 chats included, on a session that did not come through the IdP.
        mitigations: [D3-MFA]
        requires: Enterprise (Vercel also sells SAML to Pro teams as an add-on; v0's plan table lists SAML SSO on Enterprise only)
        url: https://vercel.com/docs/saml
        verified: "2026-11-25"
      - id: defaultChatVisibility
        name: Default Chat Visibility
        where: v0 › Settings › Workspace › Default Chat Visibility (Private, Team can view, Team can edit)
        setVia: [adminConsole]
        area: sharing
        default: "Team can edit"
        recommended: "Team can view"
        why: A new chat, and whatever was pasted into it, is no longer editable by the whole team, while colleagues can still read and duplicate it.
        mitigations: [D3-APA]
        requires: Plus, Business or Enterprise; team Owner
        url: https://v0.app/docs/sharing
        verified: "2026-11-25"
      - id: restrictChatSharing
        name: Restrict Chat Sharing
        where: v0 › Settings › Workspace › Restrict Chat Sharing
        setVia: [adminConsole]
        area: sharing
        default: "Off (Anyone with the link and Anyone on the web offered to members)"
        recommended: "On"
        why: A chat, its code and its history cannot be opened by anyone with the link or listed in public galleries.
        mitigations: [D3-APA]
        requires: Enterprise; team Owner
        url: https://v0.app/docs/enterprise
        verified: "2026-11-25"
      - id: actOnBehalf
        name: Allow v0 to Act on Behalf of Members
        where: v0 › Settings › Workspace
        setVia: [adminConsole]
        area: identity
        default: "Off (members need their own access to the repository)"
        recommended: "Off"
        why: When on, v0 uses the workspace's GitHub integration for members without a GitHub connection, so repository access stops following GitHub's permissions.
        mitigations: [D3-CH, D3-APA]
        requires: Plus, Business or Enterprise
        url: https://v0.app/docs/teams
        verified: "2026-11-25"
      - id: githubAppRepositories
        name: Repository access (Vercel GitHub App)
        where: GitHub › organisation › Settings › Installed GitHub Apps › Vercel › Repository access
        setVia: [adminConsole]
        area: tools
        recommended: Only selected repositories, those v0 projects sync with
        value: "Only selected repositories"
        why: The builder reaches the code host through an installation on named repositories rather than a person's token.
        mitigations: [D3-CH]
        url: https://v0.app/docs/github
        verified: "2026-11-25"
      - id: secretEnvironmentVariables
        name: "Type: Secret (environment variables)"
        where: Vercel › Project or Team › Settings › Environment Variables › Type (Config or Secret); or v0 › Project menu › Settings › Environment Variables
        setVia: [adminConsole, apiCli]
        area: data
        recommended: Secret for every password, key and token; nothing secret under a NEXT_PUBLIC_ name
        value: "Secret for every credential"
        why: Secret values are write-only after saving and redacted from build logs; a NEXT_PUBLIC_ value is shipped to every visitor.
        mitigations: [D3-CH]
        url: https://vercel.com/docs/environment-variables/sensitive-environment-variables
        verified: "2026-11-25"
      - id: separateProductionSecrets
        name: Separate Production Secret Values
        where: Vercel › Team Settings › Security
        setVia: [adminConsole]
        area: data
        default: "Off (optional team policy)"
        recommended: "On"
        why: Production secrets never share a value with Preview or Development, which the chat's preview and the agent's tools can read.
        mitigations: [D3-CH, cap-staged-rollout-gate]
        requires: Owner role
        url: https://vercel.com/docs/environment-variables/sensitive-environment-variables
        verified: "2026-11-25"
      - id: connectAuthorizationModel
        name: "Whose account does the app use? (Your users' accounts or A shared app account)"
        where: The setup card v0 shows before a Vercel Connect connection; connectors listed in Project menu › Settings › Integrations
        setVia: [code]
        area: tools
        default: "v0 chooses from the request and says which before setup"
        recommended: Your users' accounts for any app that reads or changes records; a shared app account only for a bot or schedule on a service identity scoped to it
        value: "Your users' accounts"
        why: Each visitor then sees only what their own account allows, instead of borrowing one shared credential.
        mitigations: [cap-data-access-governance, D3-CH]
        requires: Vercel Connect in v0 (beta)
        url: https://v0.app/docs/vercel-connect
        verified: "2026-11-25"
      - id: connectProjectLinks
        name: Project links (Vercel Connect)
        where: Vercel › Connect › (connector) › project links, or vercel connect attach
        setVia: [adminConsole, apiCli]
        area: tools
        recommended: Each connector linked only to the projects and environments that use it; production connectors not linked to Preview or Development
        value: "Linked only where used"
        why: Any other project's token request is refused, and a preview cannot reach the production installation.
        mitigations: [AML.M0028, cap-staged-rollout-gate]
        url: https://vercel.com/docs/connect/concepts/authentication
        verified: "2026-11-25"
      - id: integrationsManager
        name: Integrations Manager permission
        where: Vercel › Team Settings › Members › (member) › Manage v0 role › Integrations Manager
        setVia: [adminConsole]
        area: tools
        default: "Held by every member with the Vercel Member role"
        recommended: Makers on the Vercel Viewer role without Integrations Manager; the permission held by the platform team
        value: "Platform team only"
        why: Only reviewed Marketplace integrations, with the grants they create, are attached to v0 projects.
        mitigations: [AML.M0028]
        url: https://v0.app/docs/enterprise
        verified: "2026-11-25"
      - id: remoteMcp
        name: Remote MCP (Disabled, Ask for Approval, Always Run)
        where: v0 › Project menu › Settings › Integrations › (integration) › Manage Integration › Remote MCP
        setVia: [adminConsole]
        area: tools
        default: "Ask for Approval (Manual) for new integrations"
        recommended: Disabled for every database integration that holds live records
        value: "Disabled on live databases"
        why: The agent's database tools can create, update and drop tables, and Ask for Approval does not override the chat's permission mode.
        mitigations: [cap-staged-rollout-gate, AML.M0028]
        url: https://v0.app/docs/MCP
        verified: "2026-11-25"
      - id: agentPermissionsTeam
        name: Agent Permissions (Team tab)
        where: v0 › Settings › Agent Permissions › Team (allow, ask and deny arrays of Bash patterns)
        setVia: [adminConsole]
        area: tools
        default: "Built-in allow list only; Auto Permissions mode"
        recommended: ask rules for git push, vercel deploy and database CLIs, a deny rule for curl and wget, and Full Permissions kept off any project with production credentials
        value: "ask on push, deploy and database commands"
        why: Team rules apply to every member's chats in Ask and Auto modes; Full mode skips them, so the rules are a floor only where Full is not used.
        mitigations: [AML.M0028]
        requires: Team Owner
        url: https://v0.app/docs/terminal-commands
        verified: "2026-11-25"
      - id: sandboxNetworkPolicy
        name: Sandbox Network Policy
        where: v0 › Settings › Advanced (team settings)
        setVia: [adminConsole]
        area: network
        default: "allow-all"
        recommended: An allowlist of the package registries (the firm's mirror where it has one) and the APIs builds need
        value: "Allowlist of registries and APIs"
        why: The builder's sandbox holds Development secrets and installs packages the agent picks, so its egress is worth narrowing.
        mitigations: []
        requires: Team Owner
        url: https://v0.app/docs/sandbox
        verified: "2026-11-25"
      - id: securityReview
        name: Review Changes Automatically (Security Reviews)
        where: Vercel › Team Settings › Agent › Security Reviews (Projects to Review, Repositories to Review, Policy)
        setVia: [adminConsole]
        area: tools
        default: "Off"
        recommended: On for All projects, with a team policy naming the data the apps hold, and the check required in branch protection
        value: "On, all projects"
        why: Every push to a v0 project's repository is reviewed for injection, authorisation bypass and credential exposure before a reviewer merges it.
        mitigations: [D3-AVE]
        requires: Pro or Enterprise (public beta); GitHub-connected projects; billed per review
        url: https://vercel.com/docs/agent/security-review
        verified: "2026-11-25"
      - id: deploymentSources
        name: Deployment Sources (Deployment Policies)
        where: Vercel › Team Settings › Build and Deployment › Deployment Sources
        setVia: [adminConsole]
        area: tools
        default: "No rule (every source can deploy)"
        recommended: "A Production rule allowing Git only (v0, CLI, REST API and Deploy Hooks cleared)"
        value: "Production: Git only"
        why: A v0 publish to production must merge a pull request, where branch protection's reviews and checks apply.
        mitigations: [AML.M0029, cap-staged-rollout-gate, D3-AVE]
        requires: Pro or Enterprise; Owner role
        url: https://vercel.com/docs/deployments/deployment-policy
        verified: "2026-11-25"
      - id: gitSources
        name: Git Sources (Deployment Policies)
        where: Vercel › Team Settings › Build and Deployment › Git Sources
        setVia: [adminConsole]
        area: tools
        default: "No rule (any connected repository can deploy)"
        recommended: A Production rule naming the firm's GitHub organisation
        value: "Production: the firm's organisation"
        why: Production deployments come only from repositories whose branch protection the firm controls.
        mitigations: [AML.M0029]
        requires: Pro or Enterprise; Owner role
        url: https://vercel.com/docs/deployments/deployment-policy
        verified: "2026-11-25"
      - id: branchProtection
        name: Required reviews and required status checks (GitHub branch protection)
        where: GitHub › repository › Settings › Branches or Rulesets, on the chat's base branch
        setVia: [adminConsole]
        area: tools
        recommended: One approving review from someone other than the maker, and the Security Review check required
        value: "One review and the security check"
        why: v0 keeps the pull request open until GitHub's required reviews and checks pass, so nobody publishes alone.
        mitigations: [AML.M0029, D3-AVE]
        url: https://v0.app/docs/github
        verified: "2026-11-25"
      - id: instantRollback
        name: Instant Rollback
        where: Vercel › Project › Production Deployment tile › Instant Rollback
        setVia: [adminConsole, apiCli]
        area: tools
        recommended: In the release runbook, with the reminder that it restores the build, not environment variables or data
        value: "In the release runbook"
        why: A bad publish is reverted in seconds; production auto-assignment stays off until someone promotes again.
        mitigations: [cap-staged-rollout-gate]
        requires: Pro or Enterprise for any earlier production deployment (Hobby rolls back one)
        url: https://vercel.com/docs/instant-rollback
        verified: "2026-11-25"
      - id: usageActivity
        name: Usage & Activity (Activity › Team, grouped by Projects)
        where: v0.app/settings/usage › Activity › Team › group by Projects › Download Table
        setVia: [adminConsole]
        area: audit
        recommended: Downloaded monthly and reconciled with the Vercel project list, each project's protection and its integrations
        value: "Reconciled monthly"
        why: Every v0 project in the team, with its activity and last use, has an owner and a reviewed audience.
        mitigations: [D3-AI]
        requires: Plus, Business or Enterprise; Owner or Billing role
        url: https://v0.app/docs/usage-dashboard
        verified: "2026-11-25"
      - id: pauseProject
        name: Pause Project
        where: Vercel › Project › Settings › General › Pause Project, or POST /v1/projects/<id>/pause
        setVia: [adminConsole, apiCli]
        area: tools
        recommended: In the incident runbook with the people who hold the Owner, Member or Project Administrator role
        value: "Ready in the incident runbook"
        why: Production returns 503 DEPLOYMENT_PAUSED at once, before anyone has worked out what the app exposed.
        mitigations: [cap-agent-kill-switch]
        url: https://vercel.com/docs/projects/managing-projects
        verified: "2026-11-25"
      - id: connectRevoke
        name: Revoke access (Vercel Connect dashboard)
        where: Vercel › Connect › (connector) › revoke tokens
        setVia: [adminConsole, apiCli]
        area: tools
        recommended: Part of the same runbook, with Secret variables rotated after it
        value: "Revoke, then rotate secrets"
        why: A paused app's connector grants and keys stop working, not only its pages.
        mitigations: [cap-agent-kill-switch, D3-CH]
        url: https://v0.app/docs/vercel-connect
        verified: "2026-11-25"
      - id: auditLog
        name: Audit Log (Export CSV and Audit Log Drains)
        where: Vercel › Team Settings › Security & Privacy › Audit Log › Configure
        setVia: [adminConsole]
        area: audit
        default: "Not streamed; CSV export covers 90 days"
        recommended: Streamed to the SIEM through an Audit Log Drain
        value: "Streamed to the SIEM"
        why: Protection, secret, integration and membership changes are recorded where the team cannot alter them.
        mitigations: [AML.M0024]
        requires: Enterprise; Owner or Security role
        url: https://vercel.com/docs/audit-log
        verified: "2026-11-25"
      - id: allowCustomModels
        name: Allow custom models
        where: v0 › Settings › Workspace › Allow custom models
        setVia: [adminConsole]
        area: data
        default: "Off (v0 models only)"
        recommended: Off until each AI Gateway provider has been assessed; on accepts future models too
        value: "Off until providers are assessed"
        why: Chats and code go only to model providers the firm has assessed, and turning it on accepts future releases as well.
        mitigations: [cap-ai-vendor-assessment]
        requires: Enterprise; team Owner
        url: https://v0.app/docs/enterprise
        verified: "2026-11-25"
      - id: dataPreferences
        name: Data Preferences (AI model training)
        where: Vercel › Team Settings › Data Preferences (and Project Settings for project-level opt-out)
        setVia: [adminConsole]
        area: data
        default: "Opted in on Hobby and trial Pro; opted out on paid Pro; Enterprise never used"
        recommended: Opted out, checked on every team that uses v0
        value: "Opt-out"
        why: Code, v0 prompts and build telemetry are not used or shared for model training; v0's plan table lists the opt-out on Business and Enterprise only, so confirm it on the plan you buy.
        mitigations: []
        url: https://vercel.com/changelog/updates-to-terms-of-service-march-2026
        verified: "2026-11-25"
