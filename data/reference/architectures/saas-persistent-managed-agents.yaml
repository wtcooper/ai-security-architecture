id: archPersistentManagedAgents
surface: surfaceSaas
rank: 5
title: Persistent managed agents
abbrev: Persistent agents

summary:
  - >
    A vendor-hosted agent that keeps working context and usable authority across tasks.
    People invoke it through the vendor's product or approved channels; scheduled work can
    continue between conversations. The organisation governs membership, retained state,
    connected accounts, browser access and the conditions under which actions may proceed.

description:
  - >
    The continuing agent is the unit of governance. Record its owner, audience, triggers,
    retained context and effective accounts together: a new conversation does not reset
    its authority or erase material it acquired earlier. A shared channel can have a wider
    audience than the person whose account supplies a connector grant.
  - >
    This drawing separates customer-visible configuration surfaces, not provider internals.
    Vendor service admits requests and approved schedules; Managed runtime represents the
    hosted loop, inference and retained state. Its Native tools expose hosted file and browser
    operations. Backend connectors and browser sessions have separate paths and credentials.
    The vendor band includes the agent provider and approved SaaS suppliers; it does not imply
    common ownership or a shared security boundary between those suppliers.
  - >
    The baseline uses scoped reads and returns drafts. Consequential writes require an
    authenticated human approval bound to the proposed action at dispatch; if a product cannot
    enforce that gate, leave those operations unavailable. Pins describe required configuration
    or acceptance criteria. Product coverage must establish which requirements are actually
    available; a provider's undocumented implementation is assessed through vendor assurance.

distinguishedBy:
  - >
    Enterprise chat centres on conversations and tenant content. This pattern centres on a
    continuing agent with retained context, connected authority and recurring work.
  - >
    Hosted task sessions bound coding or desktop work to a task execution. Here the same
    agent continues across tasks. Persistent disk alone does not establish this distinction;
    the continuing context and authority do.
  - >
    An API/SDK managed runtime is invoked and integrated by customer software. This pattern
    is consumed through a vendor product and its approved channels, without a customer-built
    application or a presumed customer gateway on the provider's connector path.

exemplars:
  - name: OpenAI Dots
    note: >
      Persistent assistants with continuing context, connected apps and a cloud computer.
      Rolling out to Pro and Business Premium; Enterprise access is an admin-enabled beta.
    url: https://openai.com/index/introducing-dots/
    asOf: "2026-10"
  - name: Grok Bot
    note: >
      Persistent personal and team bots with hosted computers, browser sessions and connected
      apps, offered on paid individual and Teams plans. Personal bots share their user's computer.
    url: https://cursor.com/docs/grok-bot
    asOf: "2026-10"

zones:
  - id: zoneUser
    owner: user
    note: The authorised requester and the owner who approves consequential actions.
  - id: zoneVendor
    owner: vendor
    note: The managed agent provider and approved SaaS suppliers under their respective agreements.
  - id: zoneExternal
    owner: external
    note: Public websites whose content remains untrusted when returned to the agent.
  - id: zoneGovernance
    owner: governance
    note: Customer administration, supplier assurance and response across the continuing agent's lifetime.

blocks:
  - id: user
    kind: actor
    title: End user
    icon: person
    zone: zoneUser
    col: 0
    row: 1
    note: An authenticated requester; only an authorised approver may approve the proposed action.
  - id: vendorService
    kind: provider
    title: Vendor service
    cosaiComponent: componentApplication
    zone: zoneVendor
    col: 1
    row: 1
    note: The vendor's product and approved channels, including the customer-visible configuration surface.
    items:
      - id: settings
        label: Managed settings
        icon: gear
        note: Membership, agent ownership, sharing and available action modes.
      - id: schedules
        label: Remote & scheduled sessions
        icon: phone
        note: Registered triggers with a named owner, scope and expiry; recurrence does not renew authority.
      - id: audit
        label: Session audit export
        icon: eye
        note: Available product events, exported with documented gaps in tool and browser visibility.
  - id: managedRuntime
    kind: provider
    title: Managed runtime
    cosaiComponent: componentReasoningCore
    zone: zoneVendor
    col: 2
    row: 1
    note: >
      The hosted agent loop and its continuing context. Per-agent, per-user and shared computer
      or memory scopes must be established from the product; no per-agent VM is assumed.
    items:
      - id: harness
        label: Agent harness
        icon: agent
        note: Runs admitted work and consumes tool results within the configured authority.
      - id: inference
        label: Model inference
        icon: model
        note: Provider-operated inference inside the managed service.
      - id: memory
        label: Memory store
        icon: folder
        note: >
          Context retained across tasks. Saved memory, conversation history, workspace files
          and browser sessions can have different sharing and deletion lifetimes.
      - id: vault
        label: Credential vault
        icon: key
        note: >
          The product's credential custody surface. Backend connector grants, browser cookies
          and saved logins are distinct authority; a vault claim need not cover all three.
  - id: nativeTools
    kind: provider
    title: Native tools
    cosaiComponent: componentTools
    zone: zoneVendor
    parent: managedRuntime
    col: 0
    row: 0
    note: >
      Hosted file and browser operations invoked by the enclosing runtime. Containment represents
      that local dispatch and result path, as in the other managed-runtime architectures.
    items:
      - id: files
        label: File & edit tools
        icon: folder
        note: Work files may survive individual tasks; restrict accessible material and verify its lifecycle.
      - id: browser
        label: Browser tools
        icon: globe
        note: Hosted browsing with separately governed cookies, saved accounts and destination rules.
  - id: tools
    kind: service
    title: Tool services
    cosaiComponent: componentTools
    zone: zoneVendor
    col: 3
    row: 0
    note: Approved backend connectors, invoked on an identified account grant.
    items:
      - id: connectors
        label: APIs & connectors
        icon: plug
        note: The API integration route, independent of the hosted browser's logged-in session.
  - id: apps
    kind: external
    title: Downstream services
    cosaiComponent: componentDataSources
    zone: zoneVendor
    col: 3
    row: 2
    note: Approved SaaS accounts and records reached by a connector or by the hosted browser.
    items:
      - id: saas
        label: SaaS
        icon: mail
      - id: files
        label: File storage
        icon: folder
  - id: web
    kind: external
    title: Downstream services
    cosaiComponent: componentDataSources
    zone: zoneExternal
    col: 4
    row: 1
    note: Approved public browsing destinations; returned pages cannot authorise further actions.
    items:
      - id: publicWeb
        label: Web & APIs
        icon: globe
  - id: govIdentity
    kind: governance
    title: Identity services
    icon: person
    zone: zoneGovernance
    col: 0
    row: 3
    mitigations: [D3-MFA, D3-APA]
    note: Enrol authorised users and approvers, and remove access when their role changes.
  - id: govSecrets
    kind: governance
    title: Secrets & key management
    icon: key
    zone: zoneGovernance
    col: 1
    row: 3
    mitigations: [D3-CH, D3-CTS]
    note: Track connector tokens and browser credentials separately, including revocation at each issuer.
  - id: govPolicy
    kind: governance
    title: Policy & authorization
    icon: scale
    zone: zoneGovernance
    col: 2
    row: 3
    mitigations: [AML.M0028, AML.M0029, AML.M0031, AML.M0036, cap-agent-egress-control]
    note: Define permitted actions, approval conditions, retained-state policy and continuing-work limits.
  - id: govSupplyChain
    kind: governance
    title: Supply-chain assurance
    icon: db
    zone: zoneGovernance
    col: 3
    row: 3
    mitigations: [cap-ai-vendor-assessment, cap-agent-tool-registry]
    note: Maintain the approved population and assess provider controls that the customer cannot configure.
  - id: govObservability
    kind: governance
    title: Observability & response
    icon: eye
    zone: zoneGovernance
    col: 4
    row: 3
    mitigations: [cap-agent-tracing, cap-agent-kill-switch]
    note: Correlate available activity records and exercise stopping work and revoking continuing authority.

edges:
  - from: user
    to: vendorService
    path: external
    bidir: true
    label: request / approval / result
    note: Authenticated product or approved channel; channel audience and approval authority are checked separately.
  - from: vendorService
    to: managedRuntime
    path: primary
    bidir: true
    label: admitted work / status
    note: User requests and approved recurring work enter here; results and proposed actions return for review.
  - from: managedRuntime
    to: tools
    path: external
    bidir: true
    label: scoped API call / result
    route: vh
    note: Backend connector request on a specific grant; returned records are untrusted task input.
  - from: tools
    to: apps
    path: external
    bidir: true
    label: account-scoped operation
    note: The downstream service enforces the granted account's resource and operation permissions.
  - from: nativeTools
    to: apps
    path: external
    bidir: true
    label: browser action / page
    note: Separate browser session and cookies; connector OAuth restrictions do not automatically constrain this route.
  - from: nativeTools
    to: web
    path: external
    outbound: true
    label: public fetch / page
    note: Outbound browsing to allowed destinations; the reply brings untrusted content into the runtime.

pins:
  risks:
    - risk: riskShadowAndUnknownAgents
      at: vendorService
      note: An unregistered persistent agent or schedule continues outside the approved owner and connector inventory.
    - risk: riskAgenticDelegationConfusedDeputy
      at: vendorService->managedRuntime
      note: A channel participant induces work using a broader owner's or shared account's authority.
    - risk: riskSensitiveDataDisclosure
      at: managedRuntime
      note: Retained context acquired for one audience is reused in a task or channel with a wider audience.
    - risk: riskPromptInjection
      at: managedRuntime
      note: An instruction retained from untrusted content influences later tasks through continuing memory or files.
    - risk: riskRunawayAgentToolLoops
      at: managedRuntime
      note: Repeated tasks and retries consume resources after the original requester has stopped watching.
    - risk: riskPromptInjection
      at: managedRuntime->tools
      note: A connector response embeds instructions that try to redirect the agent's next action.
    - risk: riskRogueActions
      at: tools->apps
      note: A write exceeds the current approved purpose even though the connected account can technically perform it.
    - risk: riskSensitiveDataDisclosure
      at: nativeTools->apps
      note: A logged-in browser exports retained sensitive material through an account unrelated to the current task.
    - risk: riskRogueActions
      at: nativeTools->apps
      note: A browser operation changes records or sends material beyond the exact action its owner approved.
    - risk: riskPromptInjection
      at: nativeTools->web
      note: A returned public page attempts to obtain connected-account actions or disclosure of retained context.
  mitigations:
    - mitigation: D3-MFA
      at: user->vendorService
      note: Require a verified second factor for product access and privileged approval sessions; SSO alone is insufficient.
    - mitigation: D3-APA
      at: vendorService
      note: Administer who may create, invoke, share or reschedule agents, and who may change their account grants.
    - mitigation: AML.M0028
      at: managedRuntime->tools
      note: Limit admitted tools and effective account grants by operation and resource; use read-only accounts for draft work.
    - mitigation: AML.M0028
      at: nativeTools
      note: Bound file access and browser-account permissions separately; do not attach a write-capable account to read-only work.
    - mitigation: AML.M0029
      at: vendorService->managedRuntime
      note: >
        Require an authenticated human decision bound to the exact consequential operation,
        arguments and target before dispatch. Auto-review or permission to log in is not this
        gate; leave consequential operations unavailable where it cannot be enforced.
    - mitigation: D3-CH
      at: managedRuntime
      note: >
        Configure protected credential storage, short lifetimes and rotation; keep raw secrets
        out of prompts and work files. Establish separately how saved browser credentials and
        cookies are protected and cleared.
    - mitigation: D3-CTS
      at: managedRuntime->tools
      note: Restrict each connector credential to its designated recipient and audience; do not forward it to another tool or browser route.
    - mitigation: AML.M0031
      at: managedRuntime
      note: >
        Govern retained-state readers and writers, source provenance, correction, retention and
        recovery. Verify what deletion clears across memory, files and history; restrict sensitive
        durable use when the product cannot meet the required lifecycle.
    - mitigation: AML.M0036
      at: vendorService
      note: Enforce task duration, iteration and tool budgets plus aggregate recurring-work limits; a fresh run must not reset the owner's total allowance.
    - mitigation: cap-agent-egress-control
      at: nativeTools
      note: >
        Configure destination restrictions for the hosted browser's actual network route and
        verify redirects and alternate fetch tools. Enable this route only for the data class
        its enforceable restrictions support; a connector allowlist is not browser egress control.
    - mitigation: cap-agent-tool-registry
      at: govSupplyChain
      note: >
        Register each agent's owner, audience, version, approval state, triggers, tools and grants.
        Reconcile actual tenant activity against that record and configure admission to deny
        unapproved agents and grants; inventory alone does not authorise their use.
    - mitigation: cap-ai-vendor-assessment
      at: managedRuntime
      note: Verify provider isolation, hidden credential handling, internal screening and retention claims with evidence; record gaps instead of drawing unobservable controls.
    - mitigation: cap-agent-tracing
      at: govObservability
      note: Correlate available agent, requester, schedule, tool and downstream activity records; establish coverage gaps before relying on reconstruction.
    - mitigation: cap-agent-kill-switch
      at: govObservability
      note: Stop active work, disable recurring triggers and queued restarts, and revoke connector and browser authority; verify that work cannot resume with surviving grants.

walkthrough:
  title: A continuing agent prepares a work summary
  moves: Read approved records and public context, retain permitted working state, and return a draft to the authorised audience.
  steps:
    - follow: user->vendorService
      label: request a draft
      note: Resolve the requester and permitted audience before admitting the task.
    - follow: vendorService->managedRuntime
      label: admit scoped work
      note: Apply the continuing agent's current scope and budgets, not the authority of an arbitrary channel member.
    - follow: managedRuntime->tools
      label: request permitted records
      note: Invoke an approved connector on the intended user's scoped grant.
    - follow: tools->apps
      label: read account records
      note: The downstream service enforces resource access.
    - follow: apps->tools
      label: return records
      note: Return only the data accessible to that grant.
    - follow: tools->managedRuntime
      label: consume records as data
      note: Record source and scope for any context retained beyond this task.
    - follow: nativeTools->web
      label: fetch allowed public context
      note: The runtime dispatches its nested browser tool; this route has its own egress restrictions.
    - follow: web->nativeTools
      label: return untrusted page
      note: The tool returns page content to its enclosing runtime; the page grants no authority.
    - follow: managedRuntime->vendorService
      label: return draft and provenance
      note: Preserve only permitted continuing context, with the configured audience and retention.
    - follow: vendorService->user
      label: show draft to authorised audience
      note: A completed draft does not authorise sending or publishing it elsewhere.

scenarios:
  - title: A consequential browser action needs approval
    steps:
      - follow: managedRuntime->vendorService
        label: propose exact action
        note: Present the operation, account, target and arguments before any effect.
      - follow: vendorService->user
        label: request owner approval
        note: Use an authenticated approval surface; an untrusted page or channel participant cannot approve.
      - follow: user->vendorService
        label: approve this action
        note: Bind the decision to the presented action and reject changed or expired proposals.
      - follow: vendorService->managedRuntime
        label: release approved dispatch
        note: Refuse the operation if the product cannot enforce the required human gate.
      - follow: nativeTools->apps
        label: perform approved browser action
        note: Recheck the browser account and target against the approved proposal before effect.
      - follow: apps->nativeTools
        label: return action result
        note: The browser returns status to its enclosing runtime on the same session.
      - follow: managedRuntime->vendorService
        label: report outcome
        note: Report the actual effect and available evidence, including failures.
      - follow: vendorService->user
        label: deliver receipt
        note: The requester receives the outcome; continuing grants remain subject to revocation.

deviations:
  - subject: Only the active tool and data roles are listed
    reason: >
      The shared Tool services role contains backend APIs and connectors. A2A peers, skill
      installation, local execution and private-network access are outside this baseline.
      Enabling any requires a reviewed flow, identity and stop boundary rather than a dormant box.
  - subject: Hosted browser and backend connector routes remain separate
    reason: >
      Provider-hosted tools are shown within Managed runtime using the existing SaaS grammar.
      The browser has a real outbound route and separate account state. Local desktop browsing,
      shell execution, VPN routing or delegated child agents require their own enforcement and
      lifecycle review; none inherits connector restrictions automatically.

