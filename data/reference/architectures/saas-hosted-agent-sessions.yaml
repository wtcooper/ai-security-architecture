    - mitigation: D3-MFA
      at: vendorService->aiGateway
      note: >-
        Who the call is for: a per-user OAuth grant our authorization server issued to the vendor's connector
        service, bound to the vendor's audience and the user's session, expiring on its own. The vendor's IP
        ranges and its own service identity admit the connection; they never stand in for the user.
    - mitigation: D3-APA
      at: vendorService->aiGateway
      note: >-
        Who the call is for: a per-user OAuth grant our authorization server issued to the vendor's connector
