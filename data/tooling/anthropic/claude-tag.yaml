# Claude Tag — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# Exclusions: the earlier "Claude Code in Slack" (routes @Claude coding mentions to a Claude Code
# on the web session under the requesting user's own account) is being retired on Team and
# Enterprise in favour of Claude Tag and remains only as the Pro/Max path; it is recorded as a
# variant note here and its cloud runtime is toolClaudeCodeWeb.
# 2026-09-25: re-verified toolClaudeTag against the MITRE capability rules; every cited claude.com,
# support.claude.com and platform.claude.com page answered 200 with no redirect (docs read as .md);
# code.claude.com/docs/en/claude-tag returned 403 (Cloudflare challenge; kept as a source only);
# trust.anthropic.com renders client-side and was read in a browser.
vendor: anthropic
family: Claude Tag
tools:
  - id: toolClaudeTag
    name: Claude Tag (Claude in Slack)
    surfaceClasses:
      - chatIntegration
    variants:
      - name: "@Claude in Slack channels (organisation agent identity)"
        class: chatIntegration
        url: https://claude.com/docs/claude-tag/overview
      - name: "@Claude direct messages (runs on the member's own claude.ai account)"
        class: chatIntegration
        url: https://claude.com/docs/claude-tag/concepts/agent-identity
        note: >-
          DMs use the member's personal connectors and seat; Owners can disable DMs organisation-wide.
      - name: Claude Code in Slack (earlier per-user version; Pro/Max, retiring on Team/Enterprise)
        class: chatIntegration
        url: https://code.claude.com/docs/en/slack
    architecture: archEnterpriseAiChat
    status: beta
    asOf: "2026-09"
    summary:
      - >-
        Claude Tag is Anthropic's organisation-managed @Claude for Slack (public beta on Team and Enterprise,
        first-party service only, not for ZDR or CMEK organisations). In channels Claude acts under its own
        service accounts that an Owner provisions, not as the person who tagged it; each thread runs in an
        ephemeral sandbox on the same infrastructure as Claude Code on the web (or in a self-hosted
        environment, where Access bundles don't apply yet), and in an Anthropic-hosted environment every
        outbound request crosses Agent Proxy, which injects credentials from a write-only store and blocks
        hosts no allow layer covers. Direct messages instead run on the sender's own claude.ai account with
        their personal connectors.
      - >-
        Admin control lives at claude.ai/admin-settings/claude-tag (Owner role): pairing workspaces, Access
        bundles of credentials, repository grants, domains, plugins and instructions attached per scope
        (organisation, workspace or channel), the "Enable Claude Tag for your organization" toggle, per-scope
        version Off, member and guest restrictions, blocked channel patterns, DM toggle, auto-mode allow
        rules, and spend limits at claude.ai/admin-settings/usage/claude-tag. Channel work bills to the
        organisation's usage balance. Session transcripts, channel and workspace memory, routines and
        artifacts are stored by Anthropic with no automatic retention period during the beta and are not yet
        in the Compliance API session endpoints.
    facts:
      - label: Plans
        value: >-
          Team and Enterprise only; not on Free, Pro, Max, third-party deployments, or ZDR or CMEK
          organisations; not covered by Anthropic's BAA.
          Routines must be enabled at claude.ai/admin-settings/claude-code. Slack Connect (externally shared)
          channels are never served.
        url: https://claude.com/docs/claude-tag/admins/setup-overview
      - label: Inference & routing
        value: >-
          Anthropic first-party API from Anthropic-managed sandboxes; self-hosted environments run the sandbox
          on your runners but still call api.anthropic.com.
        url: https://claude.com/docs/claude-tag/concepts/security-and-data
      - label: Data leaving the device
        value: >-
          Slack messages Claude is shown (including other people's and guests'), attached files, Slack search
          results, data retrieved from connected tools and everything Claude did are held as session
          transcripts on Anthropic's side; web search runs on Anthropic's servers outside Agent Proxy rules.
        url: https://claude.com/docs/claude-tag/concepts/data-lifecycle
      - label: Retention & training
        value: >-
          No automatic retention period during the beta; custom organisation retention does not apply to
          transcripts or memory (it does to artifacts); deletion is by disconnecting a workspace, removing a
          channel scope, deleting memory files or routines, or uninstalling the app. Commercial terms (no
          training).
        url: https://claude.com/docs/claude-tag/concepts/data-lifecycle
      - label: Docs index
        value: claude.com/docs/claude-tag (concepts, admins, users)
        url: https://claude.com/docs/claude-tag/overview
    riskNotes:
      - risk: riskAgenticDelegationConfusedDeputy
        note: >-
          Anyone in a channel under a bundle's scope can make Claude act with that bundle's credentials; the
          docs say to connect a dedicated service account per tool, attach narrow bundles to private channels,
          and never a personal login.
      - risk: riskPromptInjection
        note: >-
          Claude reads whole threads and can respond without being tagged; guests' and other members' messages
          become instructions and transcript content. Auto-mode allow rules pre-approve actions per scope, and
          there is no per-thread deny list.
      - risk: riskSensitiveDataDisclosure
        note: >-
          Public-channel memory is shared workspace-wide and survives a channel going private; Claude can
          keyword-search public channels without being added to them; artifacts are readable by anyone with
          access to the source channel.
      - risk: riskCrossTenantCredentialPropagation
        note: >-
          On an Enterprise Grid paired to several Claude organisations, one organisation's access settings
          govern the whole grid; bundle isolation comes from where a bundle is attached, not from the bundle
          itself.
      - risk: riskShadowAndUnknownAgents
        note: >-
          Routines and channel watches run unattended with the channel's credentials and are created by any
          channel member; the Audit page's Scheduled work tab is the inventory.
    controls:
      - mitigation: D3-MFA
        coverage: partial
        mechanism: >-
          Slack's own sign-in authenticates each invoker; "Restrict to roles with Claude Tag access" (Enterprise)
          or "Restrict to your organization" (Team) at claude.ai/admin-settings/claude-tag > Where Claude Tag
          works > Member access limits use to Slack users linked to an account in the Claude organisation, whose
          sign-in goes through "Require SSO for Claude"; "Restrict to your verified domains" limits who can link
        steps:
          - title: Require a linked organisation account to use Claude
            body:
              - >-
                At claude.ai/admin-settings/claude-tag under Where Claude Tag works click Manage next to Member
                access and turn on Restrict to roles with Claude Tag access (Enterprise) or Restrict to your
                organization (Team); it covers channels and DMs.
            url: https://claude.com/docs/claude-tag/admins/restrict-access
          - title: Send the Claude sign-in through the IdP
            body:
              - >-
                Turn on Require SSO for Claude in the Authentication section at
                claude.ai/admin-settings/organization and enforce MFA on the Claude app in your IdP.
            url: https://support.claude.com/en/articles/13132885-set-up-single-sign-on-sso
          - title: Limit account linking to your domains (Enterprise)
            body:
              - >-
                In the same Manage dialog turn on Restrict to your verified domains so Slack users whose profile
                email is off your verified domains cannot link a Claude account.
            url: https://claude.com/docs/claude-tag/admins/restrict-access
        note: >-
          Partial on the MFA rule: by default anyone in a paired Slack workspace can use Claude even without a
          Claude account, so the only authentication is Slack's, whose SSO and two-factor settings are the Slack
          administrator's. With the restriction toggle on, the linked Claude account met the IdP's MFA when it
          signed in, but each later request is authenticated by the member's Slack session, not by a fresh
          Claude sign-in. Channel sessions then act under the agent identity whoever asked; members removed from
          the Claude organisation lose access within minutes. On an Enterprise Grid paired to several Claude
          organisations, one organisation's access settings govern the whole grid.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityIga
          reviewRequired: false
          original:
            - capability: capabilityIga
              coverage: native
              mechanism: >-
                Owner-only setup and configuration; "Restrict to roles with Claude Tag access" (Enterprise
                custom roles with the Claude Tag in Slack capability) or "Restrict to your organization"
                (Team); "Restrict to your verified domains" for account linking; channel managers via custom
                roles
              steps:
                - title: Restrict who can invoke Claude
                  body:
                    - At claude.ai/admin-settings/claude-tag > Where Claude Tag works > Member access, turn on
                      "Restrict to roles with Claude Tag access" (Enterprise) or "Restrict to your
                      organization" (Team); the toggle covers channels and DMs.
                  url: https://claude.com/docs/claude-tag/admins/restrict-access
                - title: Gate by custom role
                  body:
                    - Create groups at claude.ai/admin-settings/groups and a custom role at
                      claude.ai/admin-settings/roles with the "Claude Tag in Slack" capability; built-in roles
                      always grant it.
                  url: https://claude.com/docs/claude-tag/admins/restrict-access
              verified: 2026-09-10
      - mitigation: D3-APA
        coverage: native
        mechanism: >-
          Enterprise custom roles with the "Claude Tag in Slack" capability (effective once "Restrict to roles
          with Claude Tag access" is on), channel managers through a custom role holding only "Claude Tag channel
          setup", Owner-only pairing, bundles and scopes; target-tenant consent documented: a Slack workspace
          admin approves the Claude app and its bot scopes, a GitHub organisation owner installs the Claude GitHub
          App and approves its permissions, and each other tool's service account is created in that tool
        steps:
          - title: Authorise use by role (Enterprise)
            body:
              - >-
                Turn on Restrict to roles with Claude Tag access at claude.ai/admin-settings/claude-tag, create
                groups at claude.ai/admin-settings/groups and a custom role with the Claude Tag in Slack
                capability at claude.ai/admin-settings/roles.
            url: https://claude.com/docs/claude-tag/admins/restrict-access
          - title: Let the Slack administrator decide the install
            body:
              - >-
                A Slack workspace admin reviews the scopes on Slack's consent screen (or under Manage apps > App
                requests) before approving the Claude app; uninstalling it later deletes the workspace's Claude
                data.
            url: https://claude.com/docs/claude-tag/admins/for-slack-admins
          - title: Let the GitHub organisation owner decide the app
            body:
              - >-
                At claude.ai/admin-settings/github link or install the Claude GitHub App; a Needs permissions
                status sends an owner to github.com to approve the request.
            url: https://claude.com/docs/claude-tag/admins/configure-github
        note: >-
          Native on Enterprise by the rule: the console administers role- and group-based authorisation over
          who may use Claude Tag and who may configure which channel, enforced by Anthropic (a restricted member's
          mentions get a private notice and their thread replies are withheld), and the vendor documents the
          target-tenant approval for its Slack and GitHub apps. Team plans have the organisation-wide toggle only,
          which is partial. Built-in roles always grant the capability, and any grant wins across roles. The Slack
          and GitHub approvals are those tenants' controls, and Enterprise Grid pairings to several Claude
          organisations are governed by one organisation's settings.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityIga
            - capabilityDataAccessGovernance
          reviewRequired: false
          original:
            - capability: capabilityIga
              coverage: native
              mechanism: >-
                Owner-only setup and configuration; "Restrict to roles with Claude Tag access" (Enterprise
                custom roles with the Claude Tag in Slack capability) or "Restrict to your organization"
                (Team); "Restrict to your verified domains" for account linking; channel managers via custom
                roles
              steps:
                - title: Restrict who can invoke Claude
                  body:
                    - At claude.ai/admin-settings/claude-tag > Where Claude Tag works > Member access, turn on
                      "Restrict to roles with Claude Tag access" (Enterprise) or "Restrict to your
                      organization" (Team); the toggle covers channels and DMs.
                  url: https://claude.com/docs/claude-tag/admins/restrict-access
                - title: Gate by custom role
                  body:
                    - Create groups at claude.ai/admin-settings/groups and a custom role at
                      claude.ai/admin-settings/roles with the "Claude Tag in Slack" capability; built-in roles
                      always grant it.
                  url: https://claude.com/docs/claude-tag/admins/restrict-access
              verified: 2026-09-10
            - capability: capabilityDataAccessGovernance
              coverage: partial
              mechanism: >-
                Reach inside a tool equals what the service account can access; account-level scoping is the
                control; DMs run as the user
              steps:
                - title: Scope the service account, not just the connection
                  body:
                    - Share only the folders, spaces or projects Claude should see with its dedicated account;
                      host and path rules limit endpoints, not records.
                  url: https://claude.com/docs/claude-tag/admins/add-connections
              note: >-
                Service-owned in channels: retrieval carries the service account's access, so every member of
                a scope reaches what that account can, regardless of their own entitlements. Delegated in DMs,
                which run as the member.
              verified: 2026-09-10
      - mitigation: D3-OTF
        coverage: external
        mechanism: >-
          No Claude Tag tenant-restriction header: the anthropic-allowed-org-ids header reaches only the
          claude.ai sign-in used to link accounts, and which Slack workspaces are reachable is Slack's control; the
          sandbox's egress is Anthropic's Agent Proxy (default-deny, admin-set allow layers), which no customer
          proxy sees
        evidence:
          - title: Enforce network-level access control with Tenant Restrictions
            url: https://support.claude.com/en/articles/13198485-enforce-network-level-access-control-with-tenant-restrictions
          - title: Security and data handling (Agent Proxy network egress)
            url: https://claude.com/docs/claude-tag/concepts/security-and-data
        note: >-
          External on the D3-OTF rule: Claude Tag is used inside Slack and runs server-side, so the browser-side
          lever is the organisation's SSE admitting the corporate Slack workspace (a Slack-side control) and
          injecting anthropic-allowed-org-ids on claude.ai so members link only to the corporate
          organisation. A customer proxy does not control the agent's egress: every channel request leaves
          Anthropic's sandbox through Agent Proxy, which blocks hosts no connection, bundle Domains entry or
          environment network level allows (Trusted by default; allow-all is an Anthropic-enabled opt-in; private
          ranges and cloud metadata always blocked), while web search runs on Anthropic's servers outside those
          rules. Those allow layers are recorded under AML.M0028.
        verified: "2026-09-25"
        migration:
          from:
            - capabilitySse
            - capabilityEgressControl
          reviewRequired: false
          original:
            - capability: capabilitySse
              coverage: external
              mechanism: >-
                Corporate proxy tenant-restriction header for claude.ai; Slack-side app approval and
                Enterprise Grid distribution controls
              note: >-
                Claude Tag runs server-side, so the only network-layer levers are the Slack admin's app
                approval and the anthropic-allowed-org-ids header on claude.ai traffic for the account linking
                flow.
              steps:
                - title: Control the Slack side
                  body:
                    - Slack workspace admins decide whether the Claude app is installed; on Enterprise Grid, org admins choose
                      which workspaces get it; removing the app revokes access immediately.
                  url: https://code.claude.com/docs/en/slack
              verified: 2026-09-10
            - capability: capabilityEgressControl
              coverage: native
              mechanism: "Agent Proxy allow layers: connection allowed websites (credentialed), bundle Domains tab
                (uncredentialed, wildcard leftmost label, ports), and the scope's environment network access
                level (Trusted default, Custom, Full, No access); private ranges and cloud metadata always
                blocked; HTTP/HTTPS only"
              steps:
                - title: Allow hosts per bundle
                  body:
                    - On the bundle's Domains tab add each hostname (and non-443 ports); requests to unlisted
                      hosts are blocked and Claude names the blocked host in the thread.
                  url: https://claude.com/docs/claude-tag/admins/add-connections
                - title: Pin a stricter environment on the scope
                  body:
                    - Create an organisation-shared cloud environment with No access or a Custom list and
                      choose it under the scope's Advanced > Environment.
                  url: https://claude.com/docs/claude-tag/admins/customize
              note: Enforced server-side by the Agent Proxy for the sandbox; artifact publishing and Slack posting are
                separate egress paths governed by scope settings, not the domain lists.
              verified: 2026-09-10
      - mitigation: cap-sensitive-data-redaction
        coverage: partial
        mechanism: >-
          Inference hooks (Enterprise, beta) govern Claude Tag sessions: each governed request, with the Slack
          thread, tool calls and tool results, waits for an allow or deny verdict from the organisation's DLP
          server; for tasks run with a member's personal connectors (limited availability) a vendor
          sensitive-content check holds flagged results for the requester's review, and an Owner can require
          review of every result per scope
        steps:
          - title: Put your DLP inline (Enterprise, beta)
            body:
              - >-
                At claude.ai Organization settings > Data and privacy > Inference hooks turn on Allow for your
                organization, register your DLP server, set Failure handling to Block the request and turn on
                Enforce verdicts.
            url: https://platform.claude.com/docs/en/manage-claude/inference-hooks-configuration
          - title: Require review of delegated task results (Enterprise)
            body:
              - >-
                At claude.ai/admin-settings/claude-tag > Claude Tag's access > Slack > the scope > Advanced set
                Delegated task results to Require review.
            url: https://claude.com/docs/claude-tag/concepts/personal-connectors
        note: >-
          Partial by the rule: the hook is an attach point that can block (allow or deny only, no masking; a
          denied message must be edited or deleted in Slack before `@Claude !restart`), and the vendor check holds
          rather than masks, covers only results of personal-connector tasks, and "is a screen, not a guarantee".
          Nothing inspects what the service accounts retrieve or what Claude posts in ordinary channel work, and
          artifacts are readable by everyone with access to the source channel. Default-deny egress through Agent
          Proxy limits where data can go but is not detection. Claude Tag is not covered by Anthropic's BAA.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAiDlp
            - capabilityBrowserDetectionResponse
          reviewRequired: false
          original:
            - capability: capabilityAiDlp
              coverage: partial
              mechanism: >-
                Default-deny egress through Agent Proxy (data leaves only to allowed hosts); credentials never
