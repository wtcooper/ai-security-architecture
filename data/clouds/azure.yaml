        summary: "The MCP server is a container you build, run as a Deployment on an AKS cluster you operate and published to API Management through an internal load balancer or gateway. Nothing on the cluster does what App Service did for the server: you now carry token validation and the discovery document in code, secrets through the Key Vault CSI driver, outbound routing, network policy, node patching and image scanning."
        bindings:
