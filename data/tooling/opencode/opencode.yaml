# opencode — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# Exclusions: OpenCode Zen and OpenCode Go (the vendor's optional model gateway and subscription) are
# providers the harness can use, recorded as facts and in the spend and kill-switch rows, not entities.
# OpenCode Enterprise (central config with SSO and gateway-only routing) is sales-led with no public
# configuration reference, so no row relies on it. The GitLab integration and ACP editors (Zed, JetBrains)
# are further clients of the same engine, noted in facts rather than variants.
# 2026-09-25: onboarded toolOpencode against the MITRE capability rules; every opencode.ai/docs page cited
# answered 200 with no redirect; github.com/sst/opencode redirects to github.com/anomalyco/opencode; docs
# key names were cross-checked against the docs source (packages/web/src/content/docs) and config
# precedence against packages/opencode/src/config/config.ts on the dev branch (commit adee738).
vendor: opencode
family: opencode
tools:
  - id: toolOpencode
    name: opencode
    surfaceClasses:
      - endpointCli
      - desktopApp
      - ideExtension
      - ciIntegration
    variants:
      - name: opencode TUI and CLI (npm opencode-ai, v1.18.32 2026-09-21)
        class: endpointCli
        url: https://opencode.ai/docs/cli/
      - name: opencode serve / opencode web (headless HTTP server and browser UI)
        class: endpointCli
        url: https://opencode.ai/docs/web/
      - name: OpenCode Desktop (beta)
        class: desktopApp
        url: https://opencode.ai/download
      - name: OpenCode IDE extension (VS Code, Cursor, Windsurf, VSCodium; sst-dev.opencode)
        class: ideExtension
        url: https://opencode.ai/docs/ide/
      - name: OpenCode GitHub agent (anomalyco/opencode/github action on the customer's runners)
        class: ciIntegration
        url: https://opencode.ai/docs/github/
    architecture: archCodingAgentFirstParty
    status: ga
    asOf: "2026-09"
    summary:
      - >-
        Anomaly's (formerly SST) open-source terminal coding agent (MIT, npm opencode-ai): a TUI over a local
        client/server core whose HTTP API also serves the web UI, the desktop app, the IDE extension, ACP
        editors and the SDK. Built-in build and plan agents plus subagents drive bash, edit, write, read, grep,
        glob, webfetch, websearch, task and skill tools, MCP servers, plugins, custom tools and skills.
        Inference is whatever provider the developer connects — any models.dev provider with a pasted key,
        a local model server, or the vendor's optional Zen and Go gateways.
      - >-
        Prompts, file contents and tool output go straight to the chosen provider; the vendor states it
        stores no code or context. The exception is /share, which syncs the whole conversation to opencode.ai
        and publishes it at opncd.ai/s/<id> (CDN-cached); the GitHub agent shares by default on public
        repositories. Provider keys pasted with /connect sit in ~/.local/share/opencode/auth.json.
      - >-
        No vendor control plane governs the harness. A managed tier — opencode.json in /etc/opencode,
        /Library/Application Support/opencode or %ProgramData%\opencode, and the ai.opencode.managed macOS
        preference domain via MDM — outranks remote, global, project and inline config for the keys it sets.
        It is not a lock: OPENCODE_PERMISSION is merged after it in the current source, command-line flags beat
        the server settings, --auto approves every prompt, and a cloned repository's .opencode/ agents and
        plugins load without a trust prompt. The vendor's SECURITY.md says opencode does not sandbox the agent
        and that the permission system is a UX feature, not security isolation.
      - >-
        Enterprise controls are bolt-on: OpenCode Enterprise sells a central config with SSO and
        internal-gateway-only routing (no public reference), and OpenCode Zen team workspaces (beta) give admins
        member, API-key, model-access and monthly-spend controls over Zen traffic only.
    facts:
      - label: Plans
        value: >-
          Free and open source. Optional OpenCode Zen (pay-per-request gateway; team workspaces free during
          beta) and OpenCode Go ($10/month open-model subscription). OpenCode Enterprise is per-seat and
          sales-led (central config, SSO, internal AI gateway); no tokens are charged when the organisation's
          own gateway is used.
        url: https://opencode.ai/docs/enterprise/
      - label: Inference & routing
        value: >-
          Remote or local, bring your own key: /connect or opencode auth login for any models.dev provider,
          environment variables or a project .env file; provider.<id>.options.baseURL points a provider at a
          proxy or gateway; enabled_providers / disabled_providers and experimental.policies (provider.use)
          restrict which providers load.
        url: https://opencode.ai/docs/providers/
      - label: Data leaving the device
        value: >-
          Prompts, context files and tool output to the model provider; the model catalogue from models.dev
          (OPENCODE_DISABLE_MODELS_FETCH); update downloads at startup (autoupdate); npm plugin installs with Bun
          at startup; LSP server downloads (OPENCODE_DISABLE_LSP_DOWNLOAD); full conversations to opencode.ai
          when shared (share manual by default, auto or disabled).
        url: https://opencode.ai/docs/share/
      - label: Retention & training
        value: >-
          The vendor stores no code or context; shared conversations stay public until /unshare deletes them.
          Locally, session data sits under ~/.local/share/opencode/project/ and the last ten log files under
          ~/.local/share/opencode/log/. Training and retention are the provider's terms; Zen models are
          US-hosted with zero retention except named free models (used for training) and OpenAI and Anthropic
          (30 days).
        url: https://opencode.ai/docs/zen/
      - label: Docs index
        value: >-
          opencode.ai/docs — Config, Permissions, Policies, Agents, Enterprise, Server, Web, Share, Network,
          MCP servers, Plugins, Rules, Troubleshooting, GitHub.
        url: https://opencode.ai/docs/
      - label: Managed configuration
        value: >-
          opencode.json or opencode.jsonc in /Library/Application Support/opencode/, /etc/opencode/ or
          %ProgramData%\opencode (root/admin-writable), and a .mobileconfig with PayloadType ai.opencode.managed
          on macOS; highest priority, merged key by key; opencode debug config shows the resolved result.
        url: https://opencode.ai/docs/config/
      - label: Security model
        value: >-
          No sandbox; the permission system is a UX feature; the server is unauthenticated unless
          OPENCODE_SERVER_PASSWORD is set; malicious config files, MCP server behaviour and opted-in server
          access are out of scope for vulnerability reports.
        url: https://github.com/anomalyco/opencode/blob/dev/SECURITY.md
      - label: Distribution
        value: >-
          curl install script (to $OPENCODE_INSTALL_DIR, $XDG_BIN_DIR, ~/bin or ~/.opencode/bin), npm, Bun, pnpm,
          Yarn, Homebrew (anomalyco/tap/opencode or opencode), Scoop, Chocolatey, Arch, Mise and the
          ghcr.io/anomalyco/opencode image; the IDE extension installs itself when opencode runs in an IDE
          terminal. npm opencode-ai 1.18.32 carries registry signatures and no provenance attestation.
        url: https://opencode.ai/docs/
    items:
      - title: Config tiers and what the managed tier does not hold
        body:
          - >-
            Sources merge in order: remote .well-known/opencode defaults, ~/.config/opencode/opencode.json,
            OPENCODE_CONFIG, the project's opencode.json (found by walking up to the git root), .opencode
            directories, OPENCODE_CONFIG_CONTENT, the managed files, then macOS managed preferences. Later
            sources override earlier ones only for the keys they set; instructions arrays are concatenated.
          - >-
            Outside the managed tier's reach: OPENCODE_PERMISSION (merged into permission after the managed
            files in packages/opencode/src/config/config.ts), --auto and the TUI's auto-approve toggle,
            --hostname / --port / --mdns (flags beat config), repository agents under .opencode/agents/ (agent
            rules outrank global rules) and repository plugins under .opencode/plugins/, which execute on load.
        links:
          - title: Config precedence and managed settings
            url: https://opencode.ai/docs/config/
          - title: Config loader source (dev branch)
            url: https://github.com/anomalyco/opencode/blob/dev/packages/opencode/src/config/config.ts
      - title: Server mode
        body:
          - >-
            opencode serve listens on 127.0.0.1:4096 by default, opencode web on 127.0.0.1 with a random port;
            --hostname 0.0.0.0 or --mdns exposes it to the network. The API can post prompts, run
            /session/:id/shell, answer permission requests and abort sessions. OPENCODE_SERVER_PASSWORD (and
            OPENCODE_SERVER_USERNAME) turns on HTTP basic auth; there is no config key for it.
        links:
          - title: Server
            url: https://opencode.ai/docs/server/
          - title: Web
            url: https://opencode.ai/docs/web/
    riskNotes:
      - risk: riskInsecureIntegratedComponent
        note: >-
          The local HTTP server is the harness's control surface (shell, PTY, file read, upgrade endpoints).
          CVE-2026-22812 (no authentication and permissive CORS), CVE-2026-22813 (web-UI XSS reaching /pty) and
          GHSA-632h-h47v-g4x4 (cross-site /global/upgrade installing an arbitrary npm package) each turned a
          web page into code execution. Password auth remains opt-in.
      - risk: riskToolSourceProvenance
        note: >-
          A cloned repository's .opencode/plugins/ run as code at startup with no trust prompt, and its
          opencode.json can add MCP servers and npm plugins that Bun installs on launch; SECURITY.md treats
          malicious config files as out of scope. The harness self-updates at startup unless autoupdate is
          false.
      - risk: riskRogueActions
        note: >-
          Every permission defaults to allow except doom_loop and external_directory, there is no sandbox, and
          --auto approves every prompt that is not an explicit deny; the organisation cannot remove auto mode.
      - risk: riskSensitiveDataDisclosure
        note: >-
          /share uploads the full conversation to opencode.ai and publishes it at a public link until unshared;
          share "auto" shares every session and the GitHub agent's share input defaults to true on public
          repositories. Set share "disabled" in the managed file. Pasted keys sit in auth.json.
      - risk: riskPromptInjection
        note: >-
          AGENTS.md (or CLAUDE.md) is read from the working directory upward, instructions accepts remote URLs,
          and a repository's .opencode/ adds agents, commands and skills — all without a trust prompt and with no
          content screening.
      - risk: riskInsecureModelOutput
        note: >-
          CVE-2026-22813: the web UI rendered model output as unsanitised HTML with no CSP, so a manipulated
          response ran script on the local API origin; fixed in 1.1.10.
      - risk: riskRunawayAgentToolLoops
        note: >-
          With steps unset an agent iterates until the model stops or the user interrupts; the doom_loop guard
          asks after three identical calls, and --auto approves that prompt unless doom_loop is deny.
    controls:
      - mitigation: D3-MFA
        coverage: partial
        mechanism: >-
          OPENCODE_SERVER_PASSWORD (HTTP basic auth; username OPENCODE_SERVER_USERNAME, default opencode) on
          opencode serve and opencode web; server.hostname "127.0.0.1" and server.mdns false in the managed
          opencode.json; no user identity or second factor anywhere in the product
        steps:
          - title: Require the shared secret on every server launch
            body:
              - >-
                Set OPENCODE_SERVER_PASSWORD (and OPENCODE_SERVER_USERNAME) in the environment of every process
                that runs opencode serve or opencode web, including launch scripts and the desktop and IDE
                clients that attach to it; without it the server answers unauthenticated.
            url: https://opencode.ai/docs/server/
          - title: Keep the listener on loopback
            body:
              - >-
                In the managed opencode.json (or the ai.opencode.managed plist) set server.hostname to
                "127.0.0.1" and server.mdns to false, and publish any remote access only through the
                organisation's identity-aware proxy or zero-trust tunnel to that loopback port.
            url: https://opencode.ai/docs/config/
        note: >-
          Partial on the drawing's rule for a shared secret on the serve port: opencode has no user identity and
          no second factor on its remote surfaces. The server (serve on 127.0.0.1:4096 by default, web on a random
          port) takes HTTP basic auth only when OPENCODE_SERVER_PASSWORD is set — an environment variable with no
          config key, so the organisation cannot require it — and otherwise runs unauthenticated with a warning;
          SECURITY.md declares opted-in server access expected behaviour. The web page says command-line flags beat
          the config file, so --hostname 0.0.0.0 or --mdns (which defaults the hostname to 0.0.0.0 and advertises
          opencode.local) overrides a managed hostname. There is no relay: remote and mobile use means exposing the
          web port, so MFA comes from an identity-aware proxy or zero-trust tunnel in front of it. Browser-cached
          basic credentials were enough for the cross-site upgrade attack (GHSA-632h-h47v-g4x4). The server page
          says the TUI also starts a server on a random port, while SECURITY.md calls server mode opt-in. The
          GitHub agent is admitted by GitHub (a commenter's /oc or /opencode on a repository with the workflow).
        verified: "2026-09-25"
      - mitigation: cap-agent-action-policy-enforcement
        coverage: partial
        mechanism: >-
          permission rules (allow / ask / deny per tool, with wildcard patterns over bash commands, file paths,
          subagent and skill names and MCP tool names; last match wins) in the managed opencode.json or the
          ai.opencode.managed plist, agent.<name>.permission for the built-in agents, and a managed npm plugin's
          tool.execute.before hook as an organisation-written attach point
        steps:
          - title: Ship the rules in the managed tier
            body:
              - >-
                Put a permission block in /etc/opencode/opencode.json, /Library/Application
                Support/opencode/opencode.json or %ProgramData%\opencode\opencode.json (or the ai.opencode.managed
                .mobileconfig): a catch-all "*" first, then deny patterns such as bash {"*": "ask", "rm *": "deny",
                "git push *": "deny"}.
            url: https://opencode.ai/docs/config/
          - title: Cover every tool key
            body:
              - >-
                Write rules for read, edit, glob, grep, bash, task, skill, webfetch, websearch and
                external_directory, and "<server>_*" patterns for MCP tools; the last matching rule wins.
            url: https://opencode.ai/docs/permissions/
          - title: Pin the agents as well
            body:
              - >-
                Repeat the rules under agent.build.permission, agent.plan.permission and any organisation agent
                in the managed file, because agent rules take precedence over the global block.
            url: https://opencode.ai/docs/agents/
          - title: Add a policy hook
            body:
              - >-
                List the organisation's npm plugin in the managed plugin array; its tool.execute.before hook
                receives each call's tool name and arguments and blocks the call by throwing.
            url: https://opencode.ai/docs/plugins/
        note: >-
          Partial on the drawing's tier rule: deterministic allow/ask/deny rules over tool name and arguments are
          evaluated by the harness before each built-in, custom and MCP tool call, and the managed tier outranks
          every other config file for the keys it sets, but the organisation cannot make them non-overridable.
          OPENCODE_PERMISSION (the CLI page's "inlined json permissions config") is merged after the managed tier
          in the current source, so a developer's environment rewrites any rule; agent rules outrank global rules
          and a repository can add a new agent under .opencode/agents/ with its own permission block; repository
          plugins load without a prompt and a plugin tool replaces a built-in of the same name; --auto turns every
          ask into allow. Bash patterns match parsed command text. The vendor's SECURITY.md calls the permission
          system a UX feature, not isolation. experimental.policies covers provider.use only. Remote steering: the
          serve API admits any caller holding the basic-auth secret (anyone, if unset) to post prompts, run
          /session/:id/shell and answer permission requests; GitHub comment triggers are permission-checked
          against the commenter (the GitHub page notes scheduled runs have no user to check).
        verified: "2026-09-25"
      - mitigation: cap-sensitive-data-redaction
        coverage: partial
        mechanism: >-
          A managed npm plugin's tool.execute.before (block by throwing) and tool.execute.after (rewrite the
          output) hooks as the attach point for an organisation inspector; permission.read patterns as
          minimisation; provider baseURL to route model traffic through an inspecting AI gateway; no vendor
          detection
        steps:
          - title: Wire an inspection plugin
            body:
              - >-
                Add the organisation's npm plugin to the managed plugin array; its tool.execute.before hook
                blocks calls whose arguments carry sensitive data and tool.execute.after replaces the tool output
                before the model reads it.
            url: https://opencode.ai/docs/plugins/
          - title: Route model traffic through the gateway
            body:
              - >-
                Set provider.<id>.options.baseURL to the organisation's inspecting AI gateway and list only that
                provider in enabled_providers in the managed file.
            url: https://opencode.ai/docs/providers/
        note: >-
          Partial by the rule: the tool-path hooks can block or mask, but opencode detects nothing itself; the
          inspector is organisation code running in-process on the device, alongside any plugins a repository
          ships. Content that enters without a tool call (the typed prompt, AGENTS.md, instruction files and
          URLs) is reachable only through the undocumented experimental.chat.messages.transform hook. The read
          rule's .env handling keeps named files out — minimisation, not detection; the permissions page says .env
          files are denied by default while the current source asks, so set the rule explicitly. The inline
          alternative is an AI gateway at the provider baseURL, or endpoint DLP. share "disabled" in the managed
          file stops whole conversations leaving for opencode.ai.
        verified: "2026-09-25"
      - mitigation: AML.M0036
        coverage: partial
        mechanism: >-
          agent.<name>.steps (maximum agentic iterations) and subagent_depth in the managed opencode.json; the
          doom_loop permission (the same call repeated three times); OpenCode Zen workspace and per-member monthly
          usage limits for Zen traffic only
        steps:
          - title: Cap iterations per agent
            body:
              - >-
                In the managed file set agent.build.steps (and plan, general and every organisation agent); at the
                limit the agent is told to stop and summarise its work.
            url: https://opencode.ai/docs/agents/
          - title: Stop repeated calls and deep delegation
            body:
              - >-
                Set permission.doom_loop to "deny" (the default ask is approved by --auto) and subagent_depth to 1
                or 0 in the managed file.
            url: https://opencode.ai/docs/permissions/
          - title: Cap spend on the Zen path
            body:
              - >-
                As a Zen workspace admin set a monthly usage limit for the workspace and for each member, and
                turn auto-reload off.
            url: https://opencode.ai/docs/zen/
        note: >-
          Partial: the harness limits one kind (iterations, per agent) and a cost ceiling exists only on the
          vendor's optional Zen gateway; there is no per-run token or cost budget. steps is unset by default — the
          agent iterates until the model stops or the user interrupts — and binds only the agents the managed file
          names; a repository's .opencode/agents/ definitions carry their own. Zen limits are monthly, stop Zen
          requests only, and auto-reload can charge past them; workspaces are beta. With a bring-your-own key the
          provider invoice or the organisation's gateway budget is the only meter, which is the drawing's pin.
          compaction and tool_output thresholds bound context size, not spend.
        verified: "2026-09-25"
      - mitigation: AML.M0028
        coverage: partial
        mechanism: >-
          permission per tool (read, edit, glob, grep, bash, task, skill, webfetch, websearch, lsp and MCP
          tool-name patterns) with path and command patterns, external_directory for paths outside the working
          directory, agent.<name>.permission and subagent_depth, delivered in the managed opencode.json or the
          ai.opencode.managed plist
        steps:
          - title: Deliver grants in the managed tier
            body:
              - >-
                Place the permission block in the managed opencode.json (or the MDM plist) so user, project and
                inline config cannot override those keys, and check the result with opencode debug config.
            url: https://opencode.ai/docs/config/
          - title: Scope to the working tree
            body:
              - >-
                Set external_directory {"*": "deny"} with explicit allows, edit patterns for the paths a task may
                change, and "<server>_*": "deny" for MCP servers a role must not use.
            url: https://opencode.ai/docs/permissions/
          - title: Narrow per agent
            body:
              - >-
                Give each managed agent its own permission block (for example plan with edit deny) and set
                task rules for the subagents it may launch.
            url: https://opencode.ai/docs/agents/
        note: >-
          Partial on the tier rule (Claude Code and Gemini CLI are native because their rules are admin-locked):
          per-tool grants with path and command patterns exist and the harness enforces them outside the model,
          but OPENCODE_PERMISSION, repository-defined agents and repository plugins can widen them, and --auto
          turns ask into allow (see action policy). Limits: bash patterns match command text and the vendor says
          the permission system is not isolation; the config schema gives webfetch and websearch a single action
          (no per-URL rule), although the permissions page says webfetch matches the URL; MCP tools are scoped by
          name, not arguments; every tool runs with the developer's own authority.
        verified: "2026-09-25"
      - mitigation: D3-EI
        coverage: external
        mechanism: >-
          A VM or dev container the organisation supplies (the ghcr.io/anomalyco/opencode image is an install
          option); opencode ships no sandbox
        evidence:
          - title: opencode SECURITY.md (No Sandbox)
            url: https://github.com/anomalyco/opencode/blob/dev/SECURITY.md
          - title: opencode docs index (Docker install)
            url: https://opencode.ai/docs/
        note: >-
          External: the vendor's SECURITY.md says opencode does not sandbox the agent, that the permission system
          is not designed to provide isolation, and that true isolation means running it in a Docker container or
          VM. Integration points: the ghcr.io/anomalyco/opencode image (docker run -it --rm on the docs index), an
          organisation dev container with only the workspace mounted, and managed external_directory deny rules as
          a tool-argument filter inside it. Otherwise every tool, MCP server, plugin and LSP server runs as the
          developer on the host.
        verified: "2026-09-25"
      - mitigation: D3-CTS
        coverage: external
        mechanism: >-
          An OS boundary the organisation supplies (dev container or VM without credential mounts); managed
          external_directory and read deny rules and a plugin's shell.env hook are the product's contributions
        evidence:
          - title: opencode SECURITY.md (No Sandbox)
            url: https://github.com/anomalyco/opencode/blob/dev/SECURITY.md
          - title: Permissions (external_directory, read defaults)
            url: https://opencode.ai/docs/permissions/
          - title: Plugins (shell.env)
            url: https://opencode.ai/docs/plugins/
        note: >-
          External on the same finding as D3-EI: with no sandbox, bash inherits the developer's ssh-agent socket,
          git credential helper, ~/.aws, kube and cloud CLI configuration and browser profiles. Contributions:
          managed external_directory {"*": "deny"} and read deny patterns stop the file tools (and bash commands
          whose parsed arguments name those paths) reaching outside the workspace, and a managed plugin's
          shell.env hook can override variables in every shell execution; both are filters the vendor says are
          not isolation, and neither covers MCP servers or plugins. Routing models through a gateway key keeps
          upstream provider keys off the device; git, cloud CLIs and MCP servers still act as the developer.
        verified: "2026-09-25"
      - mitigation: AML.M0031
        coverage: partial
        mechanism: >-
          edit ask/deny rules on AGENTS.md, CLAUDE.md, opencode.json and .opencode/** and snapshot true (per-session
          undo and revert) in the managed opencode.json; managed instructions added to every session;
          OPENCODE_DISABLE_CLAUDE_CODE; no agent-written memory store
        steps:
          - title: Gate writes to instruction and config files
            body:
              - >-
                In the managed permission block set edit patterns such as "**/AGENTS.md", "**/CLAUDE.md",
                "**/opencode.json" and ".opencode/**" to "ask" or "deny".
            url: https://opencode.ai/docs/permissions/
          - title: Keep agent edits revertible
            body:
              - >-
                Set snapshot to true in the managed file so every change the agent makes can be undone or
                reverted from the session.
            url: https://opencode.ai/docs/config/
          - title: Publish organisation rules centrally
            body:
              - >-
                List the organisation's rule files or URL in the managed instructions array; they load in every
                session next to the repository's AGENTS.md.
            url: https://opencode.ai/docs/rules/
          - title: Drop the Claude Code fallbacks
            body:
              - >-
                Export OPENCODE_DISABLE_CLAUDE_CODE=1 in the launch environment so ~/.claude/CLAUDE.md and
                .claude/skills are not read.
            url: https://opencode.ai/docs/rules/
        note: >-
          Partial: writes can be gated and reverted, but instruction sources cannot be locked and nothing
          validates content. opencode has no agent-written memory; its persistent state is instruction files and
          session history under ~/.local/share/opencode/project/. AGENTS.md (or CLAUDE.md when none exists) loads
          from the working directory upward, ~/.config/opencode/AGENTS.md and ~/.claude/CLAUDE.md load globally,
          instructions accepts globs and remote URLs, and a repository's .opencode/ adds agents, commands, skills,
          tools and plugins — none behind a trust prompt. Managed instructions are concatenated with the
          repository's, not substituted; OPENCODE_DISABLE_CLAUDE_CODE is an environment variable only. Edit rules
          cover the edit, write and patch tools, not bash, and yield to OPENCODE_PERMISSION; snapshots use an
          internal git repository.
        verified: "2026-09-25"
      - mitigation: cap-input-guardrails
        coverage: partial
        mechanism: >-
          A managed npm plugin's tool.execute.after hook (rewrites the output the model receives) as the attach
          point for an organisation classifier; no vendor screening
        steps:
          - title: Screen tool results
            body:
              - >-
                In the organisation's managed plugin, have tool.execute.after send read, webfetch, websearch, grep
                and MCP output to the classifier and replace flagged output before the model reads it.
            url: https://opencode.ai/docs/plugins/
        note: >-
          Partial by the rule: a post-tool hook that can replace output is an attach point; nothing is classified
          until the organisation attaches a classifier, and opencode documents no injection screening. The plugins
          page lists tool.execute.after; its writable output comes from the @opencode-ai/plugin types. AGENTS.md,
          CLAUDE.md, remote instruction URLs and skills enter context without a tool call, and repository plugins
          run alongside the organisation's. The external alternative is an AI gateway or MCP gateway classifier on
          the brokered path.
        verified: "2026-09-25"
      - mitigation: D3-CH
        coverage: partial
        mechanism: >-
          {env:VAR} and {file:path} substitution for provider apiKey; keys pasted with /connect or opencode auth
          login stored in ~/.local/share/opencode/auth.json; MCP OAuth tokens in ~/.local/share/opencode/mcp-auth.json;
          provider credential chains (AWS profiles and web identity for Bedrock, Azure CLI Entra ID); managed
          enabled_providers limited to the organisation's gateway provider
        steps:
          - title: Reference credentials, don't paste them
            body:
              - >-
                In the managed file set provider.<gateway>.options.apiKey to "{env:VAR}" or "{file:path}" pointing
                at a short-lived token the organisation's credential helper writes.
            url: https://opencode.ai/docs/config/
          - title: Make other providers' keys inert
            body:
              - >-
                Set enabled_providers to the gateway's provider ID in the managed file (or experimental.policies
                deny "*" then allow it) so keys for any other provider are not loaded.
            url: https://opencode.ai/docs/policies/
          - title: Prefer short-lived cloud credentials
            body:
              - >-
                For Bedrock use the AWS credential chain (aws sso login profiles, EKS IRSA) rather than
                AWS_BEARER_TOKEN_BEDROCK, and for Azure choose Microsoft Entra ID (Azure CLI) in /connect.
            url: https://opencode.ai/docs/providers/
        note: >-
          Partial: references and short-lived provider chains exist, but storage is not hardened and plaintext
          keys cannot be forbidden. /connect and opencode auth login write keys to auth.json (a 0600 file in the
          current source; no keychain), keys are also read from environment variables and a project's .env file,
          and a Bedrock bearer token outranks the AWS credential chain. enabled_providers makes keys for other
          providers inert but does not stop a developer pasting the gateway key itself. The Enterprise page's
          SSO-issued gateway credentials come with the sales-led central config and have no public reference.
          Keeping secrets away from agent commands is under D3-CTS.
        verified: "2026-09-25"
      - mitigation: cap-mcp-tool-integrity
        coverage: partial
        mechanism: >-
          autoupdate false in the managed opencode.json with opencode-ai installed at a fixed version from the
          organisation's mirror; managed mcp.<name> definitions (command arrays naming a pinned package version,
          remote url) that outrank same-named project entries
        steps:
          - title: Pin the harness version
            body:
              - >-
                Set autoupdate to false in the managed file and install opencode-ai at a fixed version from the
                organisation's package mirror or artifact repository.
            url: https://opencode.ai/docs/config/
          - title: Define tool servers centrally
            body:
              - >-
                Define approved servers under mcp in the managed file, with local commands naming an exact package
                version (for example ["npx", "-y", "pkg@1.2.3"]).
            url: https://opencode.ai/docs/mcp-servers/
        note: >-
          Partial by the rule applied to every vendor: definitions admit servers and pin nothing they serve.
          opencode hashes and re-verifies nothing: tool definitions refresh with the server, remote servers are
          unpinned, and a repository's opencode.json can add servers under new names or enable ones the
          .well-known defaults disable. The update channel is on by default (autoupdate downloads new versions at
          startup); a managed autoupdate false stops that, but opencode upgrade still installs on demand, the
          config page says notify mode does not apply to package-manager installs, and the server's
          /global/upgrade endpoint installed arbitrary packages before 1.18.22 (GHSA-632h-h47v-g4x4). npm plugins
          install with Bun at every startup and the plugins page shows only unversioned specs. npm opencode-ai
          1.18.32 has registry signatures but no provenance attestation.
        verified: "2026-09-25"
      - mitigation: AML.M0029
        coverage: partial
        mechanism: >-
          permission "ask" rules in the managed opencode.json (once / always for the session / reject); doom_loop
          and external_directory ask by default; no key removes --auto or the TUI auto-approve toggle
        steps:
          - title: Deliver ask rules in the managed tier
            body:
              - >-
                In the managed opencode.json (or MDM plist) set "ask" for consequential actions, for example bash
                {"git push *": "ask", "npm publish *": "ask"} and edit "ask".
            url: https://opencode.ai/docs/config/
          - title: Deny what must never run unattended
            body:
              - >-
                Use "deny" rather than "ask" for irreversible actions, because auto mode still enforces explicit
                deny rules.
            url: https://opencode.ai/docs/permissions/
        note: >-
          Partial on the tier rule (non-overridable approval): a present developer approves each matched call in a
          once / always / reject prompt, but the organisation cannot stop the switch to auto — --auto on opencode
          and opencode run, and the TUI's "Enable auto-approve permissions", approve every ask that is not an
          explicit deny, and no config key removes them (the current source also accepts --yolo and
          --dangerously-skip-permissions). "always" approves matching patterns for the rest of the session;
          OPENCODE_PERMISSION and repository agents can turn ask into allow; any serve client holding the
          basic-auth secret can answer POST /session/:id/permissions/:permissionID from another device; defaults
          allow almost everything. Rated below Claude Code and Gemini CLI (native), whose administrators can
          remove the bypass modes.
        verified: "2026-09-25"
      - mitigation: cap-agent-tool-registry
        coverage: partial
        mechanism: >-
          Managed mcp definitions plus a managed permission allowlist over tool names ("*": "deny" first, then
          "<server>_*": "allow" for approved servers); remote defaults from the organisation's
          .well-known/opencode endpoint; no registry
        steps:
          - title: Keep approved servers in the managed file
            body:
              - >-
                Define each approved MCP server under mcp in the managed opencode.json, which outranks project and
                user entries of the same name.
            url: https://opencode.ai/docs/config/
          - title: Allow only listed servers' tools
            body:
              - >-
                In the managed permission block deny "*" first and then allow the built-in tools and each
                approved server's "<server>_*" pattern; MCP tools are named with the server as prefix.
            url: https://opencode.ai/docs/agents/
        note: >-
          Partial by the rule: the nearest thing to an allowlist is a name-pattern permission list in a tier the
          developer can override (OPENCODE_PERMISSION, repository agents), with no owner, version or approval
          record. It admits tools by name, so a repository server whose name matches an allowed prefix passes.
          The .well-known/opencode remote config is organisation-hosted but supplies defaults every other tier
          overrides, not an enforced list. Plugins, custom tools and skills from npm or the repository sit
          outside any list, and plugins execute on load before any permission is consulted. An MCP gateway is
          the enforced registry; reconciliation against discovered installs is the governance platform's job.
        verified: "2026-09-25"
      - mitigation: AML.M0024
        coverage: partial
        mechanism: >-
          Local logs (~/.local/share/opencode/log/, last ten files, --log-level) and session storage under
          ~/.local/share/opencode/project/; a managed plugin subscribing to tool.execute.before / after,
          permission.asked / replied and session events to ship records; experimental.openTelemetry (AI SDK spans)
          in the config schema only
        steps:
          - title: Ship tool and approval events
            body:
              - >-
                Have the organisation's managed plugin forward tool.execute.before and tool.execute.after (tool,
                arguments, session) and permission.replied events to the SIEM.
            url: https://opencode.ai/docs/plugins/
          - title: Collect the local logs
            body:
              - >-
                Point the endpoint log agent at ~/.local/share/opencode/log/ (the ten most recent files are
                kept) and raise the level with --log-level where needed.
            url: https://opencode.ai/docs/troubleshooting/
        note: >-
          Partial: the product writes local logs and session history the developer can delete, and export is
          organisation-written plugin code running in a process the developer controls, so capture is not
          tamper-resistant. No telemetry or OpenTelemetry export is documented; experimental.openTelemetry appears
          only in the config schema (AI SDK spans for model calls, not tool decisions) with no documented
          exporter setting. There is no vendor console and the vendor stores nothing unless /share is used. The
          gateway tap the drawing pins is the complete record for model traffic; local tool execution is visible
          only to the plugin or EDR.
        verified: "2026-09-25"
      - mitigation: cap-shadow-ai-discovery
        coverage: external
        mechanism: >-
          EDR / MDM software inventory and SSE/CASB; the opencode binary and package names, config and data
          directories, the IDE extension ID and the default serve port are the integration points
        evidence:
          - title: opencode docs index (install methods)
            url: https://opencode.ai/docs/
          - title: Troubleshooting (storage locations)
            url: https://opencode.ai/docs/troubleshooting/
          - title: IDE extension
            url: https://opencode.ai/docs/ide/
        note: >-
          External: opencode has no account plane that reports installs (the Zen console sees only Zen keys).
          Find installs with EDR or MDM inventory: the opencode binary (~/.opencode/bin by default from the
          install script), npm opencode-ai, Homebrew anomalyco/tap/opencode or opencode, Scoop and Chocolatey
          opencode, the ghcr.io/anomalyco/opencode image, OpenCode Desktop, the VS Code extension sst-dev.opencode
          (installed automatically when opencode runs in an IDE terminal), and ~/.config/opencode,
          ~/.local/share/opencode and ~/.cache/opencode. On the network, SSE/CASB sees models.dev catalogue
          fetches, opncd.ai shares and Zen or Go traffic to opencode.ai; in repositories, the opencode-agent
          GitHub App and workflows using anomalyco/opencode/github.
        verified: "2026-09-25"
      - mitigation: D3-PA
        coverage: external
        mechanism: >-
          EDR on the endpoint; the opencode process tree, its HTTP listener and a managed plugin's tool events are
          the integration points
        evidence:
          - title: Server (default port and endpoints)
            url: https://opencode.ai/docs/server/
          - title: Plugins (tool events)
            url: https://opencode.ai/docs/plugins/
        note: >-
          External (EDR): opencode analyses no process behaviour. EDR sees the opencode process and the shells it
          spawns for bash, stdio MCP server processes (often npx), downloaded LSP servers, Bun installs of plugins
          at startup, and the listener — 127.0.0.1:4096 by default for serve, a random port for web, 0.0.0.0 with
          --hostname or --mdns (advertised as opencode.local). There is no process-wrapper key; a launcher script
          on PATH is the nearest point. Correlate EDR events with a managed plugin's tool.execute.before records
          (command text, session ID).
        verified: "2026-09-25"
      - mitigation: cap-agent-kill-switch
        coverage: external
        mechanism: >-
          Credential revocation at the organisation's AI gateway (on the Zen path, an admin removes the member or
          API key) plus an EDR process kill; POST /session/:id/abort is local to the device's server
        evidence:
          - title: Server (POST /session/:id/abort)
            url: https://opencode.ai/docs/server/
          - title: Zen (team roles and API keys)
            url: https://opencode.ai/docs/zen/
        note: >-
          External: opencode offers no organisation-reachable stop. The server's POST /session/:id/abort stops a
          running session but only through the device's own listener. Revoking the key at the organisation's
          gateway — or, on Zen, an admin removing the member or API key (beta team workspaces) — fails the
          session's next model request; the delay is not documented and tool calls already dispatched complete.
          Keys pasted into auth.json must be rotated at each provider. An EDR kill of the opencode process tree is
          the stop for local work; no live policy refresh is documented, so managed config changes apply at the
          next start.
        verified: "2026-09-25"
      - mitigation: cap-agent-egress-control
        coverage: partial
        mechanism: >-
          permission.webfetch and permission.websearch "deny" in the managed file (on/off for the fetch tools);
          managed enabled_providers with provider baseURL pinning model traffic to the organisation's gateway;
          share "disabled"; HTTPS_PROXY honoured
        steps:
          - title: Pin model traffic to the gateway
            body:
              - >-
                In the managed file set enabled_providers to the gateway's provider ID and its
                provider.<id>.options.baseURL to the gateway URL.
            url: https://opencode.ai/docs/config/
          - title: Turn off the fetch tools
            body:
              - >-
                Set permission.webfetch and permission.websearch to "deny" in the managed file where browsing
                is not needed.
            url: https://opencode.ai/docs/permissions/
          - title: Disable share uploads
            body:
              - >-
                Set share to "disabled" in the managed file so no conversation is synced to opencode.ai.
            url: https://opencode.ai/docs/share/
          - title: Send the rest through the proxy
            body:
              - >-
                Export HTTPS_PROXY with NO_PROXY=localhost,127.0.0.1 (the TUI talks to its local server) and
                NODE_EXTRA_CA_CERTS for the organisation's CA.
            url: https://opencode.ai/docs/network/
        note: >-
          Partial on the drawing's rule for on/off controls: the harness's own named egress (model calls, the
          two fetch tools, share uploads) can be pinned or switched off from the managed tier, but there is no
          destination allowlist. bash (curl, git, package managers), MCP servers, plugins, LSP downloads and npm
          plugin installs reach the network with the host's routes; bash deny patterns match command text only;
          HTTPS_PROXY is an environment variable the developer controls and is routing until direct egress is
          blocked. The config schema gives webfetch no per-URL rule. The endpoint egress allowlist enforced by
          device management is the control the drawing pins.
        verified: "2026-09-25"
      - mitigation: D3-FA
        coverage: external
        mechanism: >-
          Package mirror / artifact repository with malware scanning; integration points are the private npm
          registry in ~/.npmrc (honoured for plugin installs), the managed plugin array and installing opencode-ai
          itself from the mirror
        evidence:
          - title: Enterprise (private npm registry FAQ)
            url: https://opencode.ai/docs/enterprise/
          - title: Plugins (npm install with Bun at startup)
            url: https://opencode.ai/docs/plugins/
        note: >-
          External: opencode scans nothing it downloads or installs. npm plugins install with Bun at startup (a
          .opencode/package.json triggers bun install too), stdio MCP servers commonly launch through npx, LSP
          servers download automatically unless OPENCODE_DISABLE_LSP_DOWNLOAD is set, and agent commands install
          packages at will. The enterprise page documents private registries (Artifactory, Nexus) through
          ~/.npmrc, the integration point for admission scanning at the mirror. No model files are loaded unless
          the developer points a provider at a local model server.
        verified: "2026-09-25"
