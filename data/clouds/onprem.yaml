    mitigations: [cap-agent-action-policy-enforcement]
    url: https://docs.litellm.ai/docs/proxy/guardrails/tool_permission
    verified: "2026-11-18"
  - id: temporalApprovalUpdate
    name: "Wait for an approval Update before a consequential write"
    where: "Your supervisor Workflow › an Update handler with a validator, awaited with workflow.wait_condition"
    setVia: [code]
    area: tools
    recommended: "The Workflow records the pending action and a hash of its arguments, then blocks; the Update validator rejects any approval that does not come from the approval service or does not carry that same hash"
