id: archInternalPlatform
surface: surfaceCloud
title: Internal multi-tenant AI platform
abbrev: Internal AI platform

summary:
  - >
    The paved road: a shared platform on which internal product teams build AI features, with
    the gateway, the agent runtime, the data plane and the templates supplied centrally so
    every tenant inherits controls it did not have to build. The architecture whose unit of
    concern is the population of workloads rather than any one of them.

description:
  - >
    Every organisation that gets past its third AI workload builds some version of this,
    usually after discovering it has three different credential arrangements and no aggregate
    view. The platform's purpose is to make the governed path the easy path, so that a team
    choosing the quickest route also chooses the controlled one. That framing produces the
    design rule: adoption is a security control. A platform teams route around produces worse
    outcomes than no platform, because it also produces the belief that AI use is governed —
    so the adoption rate is monitored as carefully as any control on this page.
  - >
    Tenancy is the hard technical part. Product teams share a gateway, an agent runtime, a
    vector store and node pools, and the isolation between them is a platform property no
    tenant can verify. Namespace, network and data isolation each fail differently, and a
    shared vector store with per-tenant filtering rather than per-tenant separation is a
    disclosure waiting for a query bug. The drawing keeps the planes honest: the data path is
    tenants calling shared services; everything in the governance column — tenancy policy, the
    catalogue, the inventory, evaluations, operator access — is control plane, and it governs
    only the workloads that actually run here.
  - >
    The platform's own access is the concentration risk. Platform operators can typically read
    across tenants by construction, the central log holds every product's prompts, and the
    shared credential store holds every provider relationship. The platform team's privileges
    deserve the scrutiny normally reserved for a domain administrator, and they rarely get it.
    In exchange, this is where organisation-wide controls become possible at all: model
    approval, evaluation gates, inventory and cost attribution work here and nowhere else,
    because nowhere else sees all of it.

distinguishedBy:
  - >
    Against the AI gateway: that is one component of this, and usually the first built. This is
    the whole paved road — runtime, data plane, templates and standards — with the population
    problem as its subject.
  - >
    Against any single application architecture: those describe one workload. This describes
    the substrate several of them share, and its risks are aggregation, isolation and adoption
    rather than anything in a request path.

exemplars:
  - name: Internal AI platform teams
    note: >
      A central team offering gateway, runtime, vector store and templates as a product to
      internal product teams, with an onboarding path and a support rota.
    asOf: "2026-08"
  - name: Multi-tenant generative AI platform reference designs
    note: >
      Cloud providers publish this as a named architecture, which is a reasonable indicator
      that most large organisations converge on it.
    asOf: "2026-08"

blocks:
  - id: teams
    kind: actor
    title: Product teams
    icon: people
    col: 0
    row: 1
    note: >
      The tenants. Each builds its own workload, and each can leave the platform if leaving is
      easier — which is why friction anywhere on this page is a security parameter.

  - id: onboarding
    kind: service
    title: Onboarding & templates
    col: 1
    row: 0
    note: >
      How a team gets started, and the reference implementations it starts from. Slow
      onboarding produces workloads built somewhere else; the templates are the most effective
      security artifact the platform ships, and a supply chain into every workload at once.
    items:
      - id: registration
        label: Registration
        icon: doc
        note: Entry into the inventory. A team that starts without it is invisible to every governance control here.
      - id: templates
        label: Paved-road templates
        icon: gear
        note: Controls arriving pre-wired — and one reviewed artifact propagating into every tenant's codebase.

  - id: workloads
    kind: service
    title: Tenant workloads
    col: 1
    row: 1
    cosaiComponent: componentApplication
    note: >
      Whatever each team is building — an assistant, an agent, a pipeline. Each is one of the
      other architectures in this catalogue, running here and inheriting the platform's
      controls.
    items:
      - id: assistants
        label: Assistants & agents
        icon: agent
        note: Per-team products with per-team data, sharing one substrate.
      - id: pipelinesItem
        label: Batch pipelines
        icon: clock
        note: Unattended tenants of the same shared services.

  - id: sharedGateway
    kind: service
    title: Shared AI gateway
    col: 2
    row: 1
    note: >
      One crossing to model providers for every tenant, with per-tenant quotas, tenant-tagged
      telemetry and cost attribution. Described in full as its own architecture; here it is the
      component every tenant inherits first.
    items:
      - id: crossing
        label: Provider crossing
        icon: globe
        note: One relationship per provider, used on behalf of every tenant.
      - id: tenantQuotas
        label: Per-tenant quotas
        icon: clock
        note: One tenant's loop must not be everyone's budget.
      - id: telemetryTap
        label: Tenant-tagged telemetry
        icon: eye
        note: Tagged so a team can see its own traffic without seeing everyone's.

  - id: sharedRuntime
    kind: service
    title: Shared agent runtime
    col: 2
    row: 2
    cosaiComponent: componentReasoningCore
    note: >
      A common place to run agents, with sandboxing, workload identity and observability
      supplied. Tenants inherit controls they did not build — and an isolation guarantee they
      cannot verify.
    items:
      - id: execution
        label: Tenant execution
        icon: agent
        note: Every tenant's agents on shared infrastructure, separated by platform-asserted isolation.
      - id: sandboxing
        label: Sandboxed execution
        icon: shield
        note: Isolation supplied by the platform rather than rebuilt per team.

  - id: dataPlane
    kind: service
    title: Shared data plane
    col: 3
    row: 2
    cosaiComponent: componentMemory
    note: >
      Vector stores, memory and state for several tenants in one system. Per-tenant separation
      means a bug returns nothing; per-tenant filtering means a bug returns another tenant's
      data — and the difference only shows up when something goes wrong.
    items:
      - id: vectorStore
        label: Shared vector store
        icon: search
        note: Several tenants' embeddings, one query bug from crossing.
      - id: memoryState
        label: Memory & state
        icon: folder
        note: Keying is the whole of the isolation; a key that omits the tenant collapses it silently.

  - id: providers
    kind: provider
    title: Model providers
    col: 3
    row: 0
    cosaiComponent: componentModelServing
    note: >
      Several, consumed on behalf of every tenant through one relationship each. Everything
      behind the published interfaces is the provider's, and is not drawn.
    items:
      - id: inferenceApis
        label: Inference APIs
        icon: model
        note: Reached only through the shared gateway, on the platform's credentials.

  - id: governance
    kind: governance
    title: Platform governance
    col: 4
    row: 0
    rowSpan: 3
    note: >
      The organisation-wide controls that are only possible because one place sees everything:
      tenancy policy, the model catalogue, the workload inventory and adoption signal, shared
      evaluation, and the central log with the operator access that reads across every tenant.
    items:
      - id: tenancyPolicy
        label: Tenancy & isolation policy
        icon: shield
        note: Stated and tested by the platform team, because no tenant can verify it — a guarantee, not a wiki claim.
      - id: modelCatalogue
        label: Model catalogue
        icon: gear
        note: Which models any tenant may use, at which versions, with which terms — enforceable only because there is one gateway.
      - id: inventory
        label: Inventory & adoption
        icon: search
        note: Every workload, its owner, its data and its risk class — plus what fraction of AI workloads actually run here, tracked as a security metric.
      - id: platformEvals
        label: Shared evaluation service
        icon: scale
        note: Adversarial and safety testing offered as a service, which is why teams actually do it.
      - id: centralLog
        label: Central log & operator access
        icon: eye
        note: Every tenant's prompts in one place, readable by a platform team whose privileges deserve domain-administrator scrutiny.

edges:
  - from: teams
    to: workloads
    path: primary
    bidir: true
    label: build & operate
    note: Each team ships and runs its own product on the shared substrate.
  - from: onboarding
    to: workloads
    path: primary
    label: paved-road start
    note: >
      Registration puts the workload in the inventory and the template wires the controls in
      before the first line of product code.
  - from: workloads
    to: sharedGateway
    path: primary
    bidir: true
    label: model calls
    note: >
      Per-tenant workload identity on every call, because quota, cost attribution and the log
      all key off it. A shared platform credential makes every downstream record anonymous.
  - from: workloads
    to: sharedRuntime
    path: primary
    bidir: true
    route: vh
    label: agent execution
    note: >
      Agents run on shared infrastructure under isolation the tenant cannot test — which is why
      the tenancy policy has to be stated and verified by the platform.
  - from: sharedRuntime
    to: sharedGateway
    path: primary
    bidir: true
    note: Runtime-hosted agents make their model calls through the same crossing as everything else, attributed per tenant.
  - from: sharedRuntime
    to: dataPlane
    path: primary
    bidir: true
    label: retrieval & state
    note: >
      Separation versus filtering is decided on this edge. Separation means a bug returns
      nothing; filtering means a bug returns another tenant's data.
  - from: sharedGateway
    to: providers
    path: primary
    bidir: true
    route: vh
    label: provider call
    note: >
      One relationship per provider used on behalf of every tenant — concentration as the
      benefit and the exposure at once.
  - from: governance
    to: sharedGateway
    path: governance
    label: catalogue & quotas
    note: >
      The approved-model catalogue and per-tenant ceilings are enforced at the one crossing,
      which is the only reason an organisation-wide model policy can exist at all.
  - from: governance
    to: dataPlane
    path: governance
    label: tenancy & entitlements
    note: >
      Isolation guarantees and data entitlements applied to the shared stores — tested and
      published by the platform team, because the tenants cannot test them.

pins:
  risks:
    - risk: riskShadowAndUnknownAgents
      at: onboarding->workloads
      note: A slow or restrictive onboarding produces workloads built somewhere else, with none of these controls and full confidence that AI use is governed.
    - risk: riskInsecureIntegratedComponent
      at: onboarding
      note: Templates are a supply chain into every tenant's codebase; a flaw here propagates platform-wide.
    - risk: riskCrossTenantCredentialPropagation
      at: sharedRuntime
      note: Gateway, runtime, vector store and memory all share tenants, and each isolates differently — tenancy is a claim about four systems at once.
    - risk: riskAcceleratorAndSystemSideChannels
      at: sharedRuntime
      note: Shared node pools put every tenant on common physical substrate, below every namespace boundary.
    - risk: riskSensitiveDataDisclosure
      at: dataPlane
      note: Per-tenant filtering in a shared store is one query bug away from returning another tenant's records.
    - risk: riskRetrievalVectorStorePoisoning
      at: dataPlane
      note: A poisoned embedding in a shared index steers retrieval for whichever tenant matches it.
    - risk: riskEconomicDenialOfWallet
      at: sharedGateway
      note: One tenant's runaway loop spends against the organisation's provider relationships unless per-tenant ceilings hold.
    - risk: riskExcessiveDataHandlingDuringInference
      at: sharedGateway->providers
      note: Every tenant's prompts cross to providers through one relationship, under terms the platform negotiated once for all of them.
    - risk: riskModelDeploymentTampering
      at: governance->sharedGateway
      note: The catalogue is the organisation-wide model supply chain; whoever writes it decides what every tenant serves.
    - risk: riskExcessiveDataHandling
      at: governance
      note: Platform operators can read across tenants by construction, and the central log holds every product's prompts — domain-administrator privileges without the name.

  capabilities:
    - capability: capabilityAiGateway
      at: sharedGateway
      note: The shared crossing, built once — the first platform component because it pays for itself immediately.
    - capability: capabilityNhiManagement
      at: workloads->sharedGateway
      note: Per-tenant workload identity on every call, so attribution, quotas and the log never collapse into one anonymous principal.
    - capability: capabilityAgentRegistry
      at: onboarding->workloads
      note: Registration at onboarding is the inventory entry; nothing the platform governs exists outside it.
    - capability: capabilityAgentSandboxing
      at: sharedRuntime
      note: Sandboxed execution supplied by the platform, so tenant isolation is engineered once instead of assumed twenty times.
    - capability: capabilityDataAccessGovernance
      at: sharedRuntime->dataPlane
      note: Per-tenant separation over per-tenant filtering wherever the data warrants it, decided as policy rather than left to schema convenience.
    - capability: capabilityRagSecurity
      at: dataPlane
      note: Tenant-scoped retrieval with entitlement checks at query time, because the vector store serves everyone.
    - capability: capabilityRateLimiting
      at: sharedGateway
      note: Per-tenant token and spend ceilings, plus the cost attribution that keeps the platform funded.
    - capability: capabilityMlSecureDefaults
      at: onboarding->workloads
      note: Templates with the controls pre-wired, so the quickest start is also the governed one.
    - capability: capabilityAiSpm
      at: governance
      note: Posture across the whole estate — every workload, its models, its data and its drift — possible only where everything is visible.
    - capability: capabilityModelEvals
      at: governance
      note: Evaluation as a shared service; a policy requiring testing without supplying a harness produces evidence rather than testing.
    - capability: capabilityIga
      at: governance
      note: Domain-administrator scrutiny on platform operator access, because the team that runs the platform can read every tenant by construction.
    - capability: capabilityShadowAiDiscovery
      at: onboarding
      note: Monitor adoption and drift — which teams left and why — because a workload that left has none of these controls.

scenarios:
  - title: A team onboards onto the paved road
    steps:
      - follow: teams->workloads
        note: A product team starts building. The platform's job is to be the quickest way to do this.
      - follow: onboarding->workloads
        note: Registration enters the workload in the inventory; the template arrives with controls pre-wired.
      - follow: workloads->sharedGateway
        note: The first model call goes out attributed, quota'd and logged per tenant, with nothing extra built.
      - follow: sharedGateway->providers
        note: The provider is reached through the organisation's one governed relationship.
  - title: Two tenants share the substrate
    steps:
      - follow: workloads->sharedRuntime
        note: Tenant A's agent executes on infrastructure tenant B also uses.
      - follow: sharedRuntime->dataPlane
        note: Retrieval hits the shared store — separation returns nothing on a bug, filtering returns tenant B's data.
      - follow: governance->dataPlane
        note: The tenancy policy is the platform's answer, tested and published, because neither tenant can verify it.
      - follow: sharedRuntime->sharedGateway
        note: Both tenants' model calls stay individually attributed through the same crossing.
  - title: Adoption drops and governance follows
    steps:
      - follow: onboarding->workloads
        note: Friction at onboarding sends the next team elsewhere — the leak starts here, not at the firewall.
      - follow: governance->sharedGateway
        note: The catalogue, the quotas and the aggregate view now cover a shrinking fraction of the organisation's AI use.
      - follow: teams->workloads
        note: The teams that left still ship — ungoverned, uninventoried, and officially believed to be covered. Adoption is the multiplier on every control on this page.

