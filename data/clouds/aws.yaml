        asOf: "2026-11"
        compare:
          runs: "You run the MCP server as pods on worker nodes in your EKS cluster; AWS runs the Kubernetes control plane."
          patching: "AWS patches the control plane; you patch node operating systems and images, unless EKS Auto Mode patches nodes and replaces them within 21 days."
          data: "Requests and tool results are processed in pods on EC2 instances in your account and VPC; state lives in the data stores you attach."
          network: "Pods sit in your VPC subnets behind an internal Application Load Balancer; Kubernetes network policies and security groups filter traffic."
          identity: "A Kubernetes service account mapped to an IAM role through EKS Pod Identity."
          accepts: "Any container that serves Streamable HTTP; AWS's sample runs a Python MCP server at /mcp behind an HTTPS internal load balancer."
