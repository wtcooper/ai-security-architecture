    # >>> hosting options (compared against the vendor's pages; one is the mapping itself)
    hosting:
      - id: agentCoreRuntime
        kind: runtime
        name: "Amazon Bedrock AgentCore Runtime"
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agents-tools-runtime.html
        asOf: "2026-11"
        mapped: true
        compare:
          runs: "Your code runs the loop, in any framework or none, packaged as a container image or code zip that AWS hosts with one microVM per session."
          patching: "AWS patches the host, the OS kernel and, for direct code deployments, the language runtime; you rebuild container images from patched base images."
          data: "Prompts and tool results are processed in a per-session microVM that AWS runs and ends with the session; lasting state goes to AgentCore Memory or mounted storage."
          network: "Network mode is PUBLIC or VPC; VPC mode puts network interfaces in your subnets under your security groups, with no internet route unless you add a NAT gateway."
          identity: "An IAM execution role that AgentCore Runtime assumes, plus a workload identity in AgentCore Identity; callers are checked by IAM SigV4 or an OAuth JWT authoriser."
          accepts: "Any framework or custom code, such as Strands Agents, LangGraph, CrewAI, Google ADK or OpenAI Agents SDK, serving HTTP, MCP, A2A or AG-UI from ARM64 containers."
          workload: "Sessions run up to 8 hours on microVMs or 14 days on Instances and end after 15 idle minutes by default; schedules and events arrive through a caller that invokes it."
          portability: "The agent is a container serving /invocations and /ping, so it can run elsewhere; sessions and inbound auth need replacing, and AgentCore services stay callable."
          effort: "You own agent code, image rebuilds, IAM and resource policies, session-to-user mapping, input validation and VPC settings; AWS runs scaling, isolation and patching."
          fits: "AWS guidance: the code-defined path when you need custom orchestration or multi-agent patterns in any framework; microVMs are called the best starting point."
        sources:
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agents-tools-runtime.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-how-it-works.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-instances-how-it-works.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-security-best-practices.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-vpc.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-permissions.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-long-run.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-lifecycle-settings.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-http-protocol-contract.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/using-any-agent-framework.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-vs-runtime.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-filesystem-configurations.html
          - https://docs.aws.amazon.com/bedrock/latest/userguide/agents-classic-maintenance-mode.html
          - https://docs.aws.amazon.com/decision-guides/latest/decision-guides/genai-guide.html
          - https://aws.amazon.com/bedrock/agentcore/faqs/
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
      - id: eks
        kind: cluster
        name: "Amazon Elastic Kubernetes Service (Amazon EKS)"
        url: https://docs.aws.amazon.com/eks/latest/userguide/what-is-eks.html
        asOf: "2026-11"
        compare:
          runs: "Your code runs the loop in containers you build and deploy as Kubernetes workloads; EKS runs the control plane and schedules the pods."
          patching: "AWS patches the control plane; you patch node operating systems and images, unless EKS Auto Mode is on, where AWS patches nodes and replaces them within 21 days."
          data: "Prompts, tool results and state are processed in pods on EC2 nodes in your account and VPC; lasting state sits in whichever stores you attach."
          network: "Pods get VPC addresses with no traffic restriction by default; Kubernetes network policies, security groups for Pods and your VPC routing control outbound traffic."
          identity: "An IAM role bound to the pod's Kubernetes service account by an EKS Pod Identity association, with credentials served by the Pod Identity Agent on the node."
          accepts: "Any framework or language that runs in a container; an AWS example of agents on EKS Auto Mode uses the Strands Agents SDK."
          workload: "Pods run as Deployments or Jobs with no session limit, though Auto Mode replaces nodes within 21 days; HPA or KEDA scale them, and durable waits need an engine you add."
          portability: "The agent ships as containers on the Kubernetes API, which AWS notes eases moves across clouds and on premises; IAM, load balancer and add-on bindings change."
          effort: "You operate cluster version upgrades, add-ons, node capacity, ingress, network policy, autoscaling and telemetry; EKS Auto Mode takes over nodes and core add-ons."
          fits: "AWS guidance: choose EKS for the Kubernetes API and ecosystem, portability across clouds and on premises, or existing Kubernetes skills and tooling."
        sources:
          - https://docs.aws.amazon.com/eks/latest/userguide/what-is-eks.html
          - https://docs.aws.amazon.com/eks/latest/userguide/security.html
          - https://docs.aws.amazon.com/eks/latest/userguide/automode.html
          - https://docs.aws.amazon.com/eks/latest/userguide/ml-on-eks.html
          - https://docs.aws.amazon.com/eks/latest/userguide/pod-identities.html
          - https://docs.aws.amazon.com/eks/latest/userguide/cni-network-policy.html
          - https://docs.aws.amazon.com/eks/latest/userguide/auto-net-pol.html
          - https://docs.aws.amazon.com/eks/latest/userguide/security-groups-for-pods.html
          - https://docs.aws.amazon.com/eks/latest/userguide/sandboxing.html
          - https://docs.aws.amazon.com/eks/latest/userguide/horizontal-pod-autoscaler.html
          - https://docs.aws.amazon.com/eks/latest/userguide/ml-inference-autoscaling-hpa-keda.html
          - https://docs.aws.amazon.com/eks/latest/userguide/sample-deployment.html
          - https://docs.aws.amazon.com/eks/latest/userguide/cluster-endpoint.html
          - https://docs.aws.amazon.com/eks/latest/best-practices/identity-and-access-management.html
          - https://docs.aws.amazon.com/decision-guides/latest/decision-guides/choosing-aws-container-service.html
          - https://docs.aws.amazon.com/step-functions/latest/dg/connect-eks.html
          - https://aws.amazon.com/blogs/containers/observability-patterns-for-ai-agents-on-amazon-eks/
        summary: "Our A2A agent, server and client, runs in pods on Amazon EKS. Peers still enter and leave through AgentCore Gateway, which now reaches the agent as an HTTP passthrough target of protocol type A2A on an internal load balancer, not as a Runtime target. Cognito, AgentCore Identity and AWS Agent Registry are unchanged. You now carry the microVM per session, Runtime's inbound authoriser, the workload identity token calls, patching, scaling and telemetry."
        bindings:
          - { block: harness, service: "Your A2A agent in pods on Amazon EKS", note: "Registered on the gateway as an HTTP passthrough target (protocolType A2A) whose endpoint is an internal load balancer in the cluster VPC.", url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-http-passthrough.html }
          - { block: localTools, service: "Your tool handlers in the agent pod", note: "In-process handlers in the agent's container; they call AgentCore Memory under the pod's Pod Identity role.", url: https://docs.aws.amazon.com/eks/latest/userguide/pod-identities.html }
        dropSettings: [runtimeInboundJwt, runtimeExecutionRole]
        addSettings: [eksPodIdentity, eksNetworkPolicy, agentWorkloadIdentity, eksImdsHopLimit, eksAppNetworkPolicy, eksIsolatedPods, eksAgentQuarantine, eksClusterAccessEntries, eksControlPlaneLogs, eksPrivateEndpoint, gatewayTargetPrivateEndpoint]
        dropDifferences: [entry->harness]
        alsoNeeded:
          - service: "AWS Load Balancer Controller (built into EKS Auto Mode)"
            role: ingress
            why: "Creates the Application Load Balancer target groups for the agent's pods from an Ingress; Runtime exposed its own endpoint."
            url: https://docs.aws.amazon.com/eks/latest/userguide/alb-ingress.html
          - service: "Amazon VPC Lattice resource gateway (managed by AgentCore or self-managed)"
            role: network
            why: "Gives AgentCore Gateway a private path into the cluster VPC; a Runtime target needed none."
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/vpc-egress-private-endpoints.html
          - service: "EKS Pod Identity Agent (EKS add-on; built into EKS Auto Mode)"
            role: identity
            why: "Serves the pod its role credentials, which Runtime supplied from the runtime's execution role."
            url: https://docs.aws.amazon.com/eks/latest/userguide/pod-id-agent-setup.html
          - service: "Amazon VPC CNI network policy agent, or the EKS Auto Mode Network Policy Controller"
            role: network
            why: "Enforces pod-level network policy; it is off until you enable it, and without it no policy takes effect."
            url: https://docs.aws.amazon.com/eks/latest/userguide/cni-network-policy-configure.html
          - service: "ADOT SDK settings and an agent log group in CloudWatch"
            role: logging
            why: "Agents hosted outside AgentCore Runtime need their own log group and the OpenTelemetry environment variables before AgentCore Observability shows their traces."
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/observability-configure.html
          - service: "Horizontal Pod Autoscaler or KEDA, with Karpenter or EKS Auto Mode for nodes"
            role: other
            why: "Pods and nodes scale by rules you write; Runtime started and stopped a microVM per session for you."
            url: https://docs.aws.amazon.com/eks/latest/userguide/autoscaling.html
        quickstart:
          - title: "Get started with Amazon EKS: EKS Auto Mode"
            url: https://docs.aws.amazon.com/eks/latest/userguide/getting-started-automode.html
          - title: "HTTP passthrough targets (AgentCore Gateway)"
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-http-passthrough.html
          - title: "Get workload access token (AgentCore Identity)"
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/get-workload-access-token.html
      - id: agentCoreHarness
        kind: managed
        name: "Amazon Bedrock AgentCore harness"
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness.html
        asOf: "2026-11"
        pattern: archCloudManagedAgent
        tool: toolBedrockAgentcore
        compare:
          runs: "AWS runs the loop, powered by Strands Agents; you declare the model, system prompt, tools, memory and limits as configuration and call InvokeHarness."
          patching: "AWS patches the infrastructure, the OS kernel and the managed harness runtime; you rebuild any custom container image you bring."
          data: "Each session runs in its own microVM on AgentCore Runtime; conversation state persists in AgentCore Memory, which the service provisions unless you configure your own."
          network: "Sessions run on the public network by default and can be placed in your VPC; tools are reached through AgentCore Gateway, remote MCP servers or built-in tools."
          identity: "An IAM execution role you own, which the harness assumes; callers use IAM SigV4 or a JWT authoriser, and per-user identity reaches tools only with JWT."
          accepts: "No framework choice: one managed loop with models from Amazon Bedrock, OpenAI, Google Gemini or LiteLLM-compatible providers; graph and workflow patterns are unsupported."
          workload: "A microVM session lasts up to 8 hours, with iteration, time and token limits per invocation; a Step Functions task can call InvokeHarness for up to 15 minutes."
          portability: "Export to code turns the configuration into a Strands Agents Python agent for AgentCore Runtime; Gateway, Browser and Code Interpreter tools are rewired by hand."
          effort: "You own the configuration, IAM, caller authorisation, input validation, skill sources and network settings; AWS runs the loop, compute and scaling."
          fits: "AWS guidance: use the harness unless you need to own the loop; it is also the recommended target for Amazon Bedrock Agents Classic, now in maintenance mode."
        sources:
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-vs-runtime.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-security.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-tools.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-memory.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-environment.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-operations.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-export.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-versioning.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
          - https://docs.aws.amazon.com/bedrock/latest/userguide/agents-classic-maintenance-mode.html
          - https://docs.aws.amazon.com/step-functions/latest/dg/connect-bedrockagentcore.html
          - https://docs.aws.amazon.com/bedrock/latest/userguide/bedrock-managed-agents-openai.html
          - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-get-started-bma.html
          - https://aws.amazon.com/bedrock/agentcore/faqs/
        offers:
          - name: "AgentCore harness"
            what: "A managed agent loop, generally available per the developer guide, that you define with a model, system prompt and tools and invoke with one API call, each session in its own microVM."
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness.html
          - name: "Harness in a custom environment (container image)"
            what: "The same managed loop running inside a linux/arm64 container image that you build and push to Amazon ECR, for agents that need their own dependencies and tools."
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-environment.html
          - name: "Subagent delegation (built-in subagent tool)"
            what: "The agent hands a self-contained task to a fresh child agent, which is not a separately configured harness, and receives its result; AWS describes wider multi-agent collaboration as limited."
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-tools.html
          - name: "Human-in-the-loop agent (inline function tools)"
            what: "Tool schemas that execute on the client side: the harness pauses, returns the call to your code and resumes when you send the result, which is the documented pattern for approvals."
            url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-tools.html
          - name: "Harness as a workflow step (AgentCore InvokeHarness state)"
            what: "An AWS Step Functions task state that invokes a harness in request-response mode, with a maximum of 15 minutes per task."
            url: https://docs.aws.amazon.com/step-functions/latest/dg/connect-bedrockagentcore.html
