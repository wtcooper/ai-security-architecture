# Amazon Web Services: the first-party cloud architectures as built on AWS, and the
# security-relevant settings that secure them. One settings library per cloud, so a setting used by
# several architectures is one row with one status in data/org/products.yaml; each implementation binds
# the drawing's blocks to services and lists the settings that apply to it.
#
# Every row follows data/tooling/BASELINE.md: the setting's name as AWS's page gives it, a url that
# resolved on its verified date, the baseline value, and the controls on the drawing it
# delivers. setVia "code" marks a control no AWS setting provides: the organisation builds it into
# its own agent or service.
#
# 2026-11-21: gatewayMcpSupportedVersions from gateway-using-mcp-call, gateway-target-MCPservers, the
# MCPGatewayConfiguration and UpdateGateway API references and AWS's blog "How AgentCore Gateway supports the MCP
# 2026-07-28 spec" (28 July 2026); that a gateway created earlier lists only 2025-03-26 and 2025-11-25 is shown in
# dev.classmethod.jp/en/articles/agentcore-gateway-enable-mcp-2026-07-28/. The Runtime session note on the
# remote MCP server's service binding is from runtime-mcp-protocol-contract and gateway-headers (X-Amzn- headers refused).
#
# 2026-11-24: the difference notes moved to their homes, each fact re-read on the page cited that day: settings
# rows (new: bedrockDenySystemTools, runtimeRequestHeaderAllowlist, hyperPodAutoPatch, harnessGatewayToolsOnly,
# ecsImageSignatureHook), watch notes on the service or option they describe, and one change of shape (the
# SageMaker AI runtime outside your cluster). A note stays under differences only where the drawing would need a
# change the shape engine cannot make: a box taken out of the one that holds it in the same zone, a new arrow, a box
# inserted beside a nested one, or a change that holds for the mapped hosting option but not its variants.
id: cloudAws
name: Amazon Web Services
short: AWS

# Technology packs: sets of products their vendor or project documents as working together,
# researched 2026-11-24. The first is the provider's own services, the mapping as drawn; a platform
# pack fills most boxes, an add-on replaces some boxes of either. None is ranked. A pack's product for
# a box is the box's option that lists the pack; each box still names the service drawn.
packs:
  - id: awsNative
    name: "AWS managed services"
    kind: commercial
    scope: platform
    vendor: "Amazon Web Services"
    asOf: "2026-11"
    status: ga
    summary: "The provider's own services in every box: Amazon Bedrock AgentCore (Runtime, Gateway with Policy, Identity, Memory, Code Interpreter, Browser, Web Search), Amazon Bedrock, SageMaker AI and the AWS developer tools. AWS runs them; you configure accounts, roles, keys and networks."
