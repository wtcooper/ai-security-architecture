  - architecture: archAgentSandbox
    asOf: "2026-10"
    reference:
      - title: About Agent Sandbox on GKE
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/machine-learning/agent-sandbox
      - title: GKE Sandbox
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/sandbox-pods
    summary:
      - >-
        Rollouts as Agent Sandbox on GKE sandboxes — each a Pod in GKE Sandbox, gVisor by default
        or a microVM with its own kernel — on node pools separated by trust group, with FQDN
        network policies limiting every rollout to the offline web, the read-only package mirror
        and the platform services it needs. The policy model is served by vLLM on GPU node pools
        the sandboxes reach only through its API; trajectories land in a locked log bucket. Google
        publishes no Architecture Center design for RL environments; its Agent Sandbox and GKE
        Sandbox guides are the reference.
    bindings:
      - { block: graders, service: Your graders on a separate node pool, build: true, note: "Programmatic checks and reward models; read a rollout's end state through the orchestrator, never from inside a sandbox." }
      - { block: platform, service: "GKE metadata server, Cloud Logging and Monitoring", note: "Every one reachable from a sandbox host is a route out, so each is named on the egress list or blocked." }
      - { block: orchestrator, service: Your run orchestrator on GKE, build: true, note: "Drives the Agent Sandbox controller's SandboxClaims and holds the automatic stop." }
      - { block: sandbox, service: Agent Sandbox on GKE (GKE Sandbox), note: "gVisor under the recommended security policy; microVMs (Kata Containers) where a task needs a full kernel." }
      - { block: harness, service: Your episode loop in the sandbox, build: true }
      - { block: localTools, service: "Shell, files and browser in the sandbox", build: true }
      - { block: storage, service: Cloud Storage (checkpoint bucket) }
      - { block: inference, service: vLLM on GKE GPU node pools }
      - { block: offlineWeb, service: Your offline web snapshot, build: true, note: "A cached crawl and simulated applications served inside the cluster." }
      - { block: registry, service: Artifact Registry remote and virtual repos }
      - { block: openWeb, service: The live web (crawled offline only) }
      - { block: sources, service: "Public registries (PyPI, npm)" }
