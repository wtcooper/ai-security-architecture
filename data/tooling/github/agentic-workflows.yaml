# GitHub Agentic Workflows — one entity per product × reference architecture. Facts are dated (asOf) and cite
# the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# Scope: gh-aw (the gh aw CLI extension, its compiler and the compiled .lock.yml workflows) running a coding agent
# in GitHub Actions on github.com, with the Agent Workflow Firewall (AWF), the MCP gateway, safe outputs and the
# threat detection job. On the agentic software factory it builds the agent harness and its build sandbox; the
# pipeline's scans, previews, the deploy gate, app hosting and the register of apps are other products.
# Exclusions: the Copilot cloud agent assigned through the assign-to-agent safe output (toolCopilotCloudAgent);
# GitHub Enterprise Server and data-residency tenants (the docs give compatibility settings only and say end-to-end
# availability is unconfirmed); experimental features (merge-pull-request, enclaves, drive memory, token broker,
# hosted gateway-dispatch triggers) beyond the notes below.
# 2026-11-26: onboarded on archSoftwareFactory from the feed item github-agentic-workflows-ga. Read that day: the GA
# changelog (github.blog, 200, redirects to the same path with a trailing slash), docs.github.com about-github-agentic-
# workflows (200) and about 50 pages of github.github.com/gh-aw (all 200, read as HTML; the site's llms.txt lists agent
# prompt files, not the reference pages). github.github.io/gh-aw/reference/integrity/, linked from the changelog,
# serves the same page as github.github.com. Fetch log: github.com/github/gh-aw/releases and the repository's API
# answered 403 to this environment, so no CLI release number or advisory was read; versions come from the docs'
# Enterprise Configuration page. Two pages state the per-run AI-credit cap differently (docs.github.com: 1,000 AIC by
# default; the threat detection page: 400 for the detection run); no pinned control on this drawing depends on it.
vendor: github
family: GitHub Agentic Workflows
tools:
  - id: toolGithubAgenticWorkflows
    name: GitHub Agentic Workflows
    surfaceClasses:
      - ciIntegration
    variants:
      - name: Agentic workflows on GitHub-hosted runners (Docker sandbox by default; Cloud Hypervisor microVM in preview)
        class: ciIntegration
        url: https://github.github.com/gh-aw/reference/agent-runtimes/
      - name: Agentic workflows on self-hosted Linux runners and Actions Runner Controller with Docker-in-Docker
        class: ciIntegration
        url: https://github.github.com/gh-aw/reference/self-hosted-runners/
        note: >-
          The runner host, its Docker daemon and its persistent state are the organisation's to isolate; the docs give
          a host isolation checklist and say the compiler does not prove host cleanliness.
      - name: gh aw CLI extension (compile, lint, audit, logs, enable and disable, env)
        class: ciIntegration
        url: https://github.github.com/gh-aw/setup/cli/
    architecture: archSoftwareFactory
    fills: [harness, nativeTools]
    builder:
      kind: framework
      what: "GitHub's open-source framework that compiles Markdown workflows into Actions jobs running Copilot, Claude, Codex or Gemini behind a firewall."
      languages: ["Markdown", "GitHub Actions YAML"]
    status: ga
    asOf: "2026-11"
    summary:
      - >-
        GitHub Agentic Workflows (gh-aw), an open-source project from GitHub Next, generally available on github.com
        since 2026-10-28: a workflow is a Markdown file whose YAML frontmatter sets triggers, permissions, tools,
        network and safe outputs, compiled by the gh aw CLI into a .lock.yml GitHub Actions workflow. The agent job runs
        a coding agent (Copilot CLI by default, or Claude Code, Codex, Gemini or Pi) inside the Agent Workflow
        Firewall: a container (or a preview Cloud Hypervisor or NVX microVM) whose only egress is a Squid proxy
        enforcing the workflow's domain allowlist, with an API proxy that holds the engine credential so the agent
        sees a placeholder key.
      - >-
        The agent job's GitHub token is read-only by default. Writes (issues, comments, pull requests, pushes) are
        buffered as safe outputs and applied by separate jobs with scoped write permissions, after a threat detection
        job has an AI detector, and any scanners you add, check the output and patch; draft pull requests and
        protected files (manifests, lockfiles, .github/, agent instruction files) are the defaults. Organisation and
        enterprise defaults are GitHub Actions variables set with gh aw env and one runtime policy variable; they are
        cooperative, since a repository variable overrides them, so the enforcement points are the compile step
        (strict mode, aw.json) and required checks. On the software factory it is one way to build the agent harness
        and its sandbox inside your own Actions estate; it does not scan, gate, host or retire the generated app.
    facts:
      - label: Plans
        value: >-
          Generally available on github.com for GitHub Free, Team and Enterprise; the default Copilot CLI engine needs a
          Copilot licence. Organisation billing needs the Copilot policy "Allow use of Copilot CLI billed to the
          organization" and copilot-requests: write in each workflow; other engines bill through their provider, and
          every run also uses Actions minutes. On GitHub Enterprise Server and data-residency tenants the docs give
          compatibility settings only.
        url: https://github.blog/changelog/2026-10-28-github-agentic-workflows-generally-available/
      - label: Inference & routing
        value: >-
          engine: copilot (default), claude, codex, gemini or pi, with the model per workflow or from
          GH_AW_DEFAULT_MODEL_* variables. Model traffic goes through AWF's API proxy, which holds the credential;
          keyless options are Anthropic, OpenAI and Google workload identity federation and Azure Entra OIDC.
        url: https://github.github.com/gh-aw/reference/engines/
      - label: Data leaving the device
        value: >-
          The prompt, the repository content and GitHub items the agent reads, and tool results go to the engine's
          provider. The agent's own requests reach only network.allowed, by default network: defaults (certificate,
          JSON schema and Ubuntu archive hosts). Claude's and Codex's provider-hosted web search and fetch run on
          provider infrastructure, outside that list, under a separate hosted-web policy.
        url: https://github.github.com/gh-aw/reference/network/
      - label: Retention & training
        value: >-
          Prompts and outputs fall under the engine provider's terms. Run artifacts (agent output, the patch, firewall
          and usage logs) are Actions artifacts, kept for GH_AW_DEFAULT_ARTIFACT_RETENTION_DAYS when it is set.
        url: https://github.github.com/gh-aw/reference/compiler-enterprise-environment-controls/
      - label: Docs index
        value: github.github.com/gh-aw (reference, guides, specs); product page on docs.github.com under Copilot › agent-powered workflows.
        url: https://github.github.com/gh-aw/
      - label: Versions
        value: >-
          Weekly or bi-weekly minor releases, installed as latest or pinned to vMAJOR.MINOR.PATCH. The docs revision
          read on 2026-11-26 defaults to AWF v0.29.7 and MCP gateway v0.5.4; a compiled .lock.yml keeps its pins
          until it is recompiled.
        url: https://github.github.com/gh-aw/reference/enterprise-configuration/
      - label: Who sets what
        value: >-
          Workflow authors set the frontmatter; a repository's .github/workflows/aw.json can force strict mode, a
          self-hosted-runner check and safe-output authorization; organisation and enterprise admins set Actions
          variables with gh aw env, which repository variables override.
        url: https://github.github.com/gh-aw/reference/governance/
    items:
      - title: Where each control lives
        body:
          - >-
            In the workflow's frontmatter (permissions, network, sandbox, tools, safe-outputs, on.roles,
            on.manual-approval, observability), compiled into the .lock.yml; in .github/workflows/aw.json for the
            repository (strict, require_self_hosted_runners, safe_output_authorization, admission); and in GitHub
            Actions variables at repository, organisation or enterprise scope (GH_AW_DEFAULT_* through gh aw env, and
            GH_AW_POLICY_ALLOW_CREATE_PULL_REQUEST). GitHub's own settings (Copilot policies, rulesets, environments,
            runner groups) sit around it.
        links:
          - title: Configuration Governance
            url: https://github.github.com/gh-aw/reference/governance/
          - title: Compiler Enterprise Environment Controls
            url: https://github.github.com/gh-aw/reference/compiler-enterprise-environment-controls/
      - title: What it covers on the software factory
        body:
          - >-
            The agent harness and its build sandbox: the agent's loop, its tools, its egress and the writes it may
            make, ending in a draft pull request. The factory's pipeline scans, previews, the owner's release approval,
            the staged release, the app's tenancy, sign-in and connectors, and the register of apps are not in gh-aw;
            those rows say so and name whose objective they are.
        links:
          - title: Security Architecture
            url: https://github.github.com/gh-aw/introduction/architecture/
    riskNotes:
      - risk: riskPromptInjection
        note: >-
          Issue, pull request and comment text reaches the agent as instruction. In a private repository every item
          counts as approved, so integrity filtering separates content only at merged there; on.roles: all lets any
          GitHub user trigger a run.
      - risk: riskRogueActions
        note: >-
          The default Docker runtime runs the agent as the runner's user and shares the runner's /tmp, so the docs say a
          sandbox escape can reach runner processes and their tokens; authored setup steps, post-steps and custom jobs
          run outside the sandbox altogether.
      - risk: riskInsecureModelOutput
        note: >-
          Threat detection is an AI review in warn mode by default: a detected threat or a detector failure annotates
          the outputs and turns branch pushes into review pull requests instead of blocking them, and the docs call
          detection defence in depth, not proof the change is safe.
      - risk: riskInsecureIntegratedComponent
        note: >-
          The python, node and other ecosystem identifiers in network.allowed open the public registries to the agent,
          not your mirror; changes to manifests and lockfiles are protected files, so a pull request that edits them
          asks for review by default.
      - risk: riskShadowAndUnknownAgents
        note: >-
          An agentic workflow is a pair of files committed to .github/workflows/ on the default branch, so whoever can
          merge there can add one, and the organisation-level defaults are cooperative; gh aw list and gh aw status show
          the workflows of one repository at a time.
    controls:
      - mitigation: AML.M0028
        coverage: native
        mechanism: >-
          Read-only GITHUB_TOKEN on the agent job (permissions:), writes only through declared safe outputs run by
          separate jobs with scoped permissions, draft pull requests by policy, allowed-branches and allowed-base-
          branches globs, protected files, the bash command allowlist, strict mode, and the runtime policy variable
          GH_AW_POLICY_ALLOW_CREATE_PULL_REQUEST
        steps:
          - title: Keep the agent job read-only
            body:
              - >-
                Declare only read scopes under permissions: (contents: read and what the task reads) and route every
                write through a safe output; strict mode, the default, rejects write permissions on the agent job.
            url: https://github.github.com/gh-aw/reference/permissions/
          - title: Let the agent open a draft pull request and nothing more
            body:
              - >-
                Configure safe-outputs.create-pull-request with draft: true (the default and a policy the agent cannot
                override), max: 1, allowed-branches for the agent's branch names and protected-files left at
                request-review or set to blocked; leave merge-pull-request unconfigured.
            url: https://github.github.com/gh-aw/reference/safe-outputs-pull-requests/#pull-request-creation-create-pull-request
          - title: Lock strict mode for the repository
            body:
              - >-
                Set "strict": true at the top level of .github/workflows/aw.json so no workflow in the repository can
                compile with strict: false.
            url: https://github.github.com/gh-aw/reference/frontmatter/#strict-mode-strict
        note: >-
          Native on the rule written for this drawing: the agent's own credential cannot write, and every write is a
          declared, scoped operation applied by a separate job after detection. Enforced by the compiled workflow and
          GitHub's token permissions. Boundaries: workflow authors set the frontmatter, so the repository's branch
          rules on .github/workflows/ and aw.json decide who can widen it; a GitHub App or PAT given to tools.github or
          a safe output carries its own scopes; authored steps and custom jobs are trusted code with whatever
          permissions their job holds; push-to-pull-request-branch and the experimental merge-pull-request (which
          always refuses the default branch) widen the agent's reach where configured; GitHub branch protection still
          has to stop the safe-output job's token merging.
        verified: "2026-11-26"
      - mitigation: AML.M0029
        coverage: partial
        mechanism: >-
          on.manual-approval and environment: put a GitHub environment's required reviewers before the agent job;
          protected-files: request-review makes a person approve before a pull request touching protected files can
          merge; submit-pull-request-review.allowed-events keeps the agent from approving; staged mode previews writes;
          merge-pull-request.required-approvers (experimental)
        steps:
          - title: Keep the agent from approving pull requests
            body:
              - >-
                Where the workflow reviews pull requests, set submit-pull-request-review.allowed-events to [COMMENT] (or
                COMMENT and REQUEST_CHANGES) so its review never counts as an approval.
            url: https://github.github.com/gh-aw/reference/safe-outputs-pull-requests/#submit-pr-review-submit-pull-request-review
          - title: Require a person before the run
            body:
              - >-
                For workflows started by hand, set on.manual-approval to an environment whose required reviewers and
                self-review restriction are configured in Settings › Environments.
            url: https://github.github.com/gh-aw/reference/triggers/#manual-approval-gates-manual-approval
          - title: Preview a new workflow's writes
            body:
              - >-
                Run a new or changed workflow with safe-outputs.staged: true until its proposed writes match what a
                reviewer would accept.
            url: https://github.github.com/gh-aw/reference/staged-mode/#enabling-staged-mode
        note: >-
          Partial by the rule that a merge gate approves the output, not the actions, and that the release approval
          pinned here is the deploy gate's. gh-aw can put a person before a run (an environment approval on the
          activation job, which does not bind the reviewed commit unless the workflow checks it) and keeps its own
          reviews from counting as approval; the decision that a release may meet real data is made outside gh-aw, at
          the deploy tooling (for example GitHub Actions environments on the release job). Branch protection decides
          who approves the agent's pull request.
        verified: "2026-11-26"
      - mitigation: cap-staged-rollout-gate
        coverage: notApplicable
        note: >-
          gh-aw does not release or roll back the generated app; the staged release and rollback belong to the deploy
          gate (for example Argo Rollouts or GitHub Actions environments). No setting exists here for this pin. Its
          staged mode and safe-rollout guidance stage the agent workflow's own writes and are recorded under human
          approval, not as a release gate.
        evidence:
          - title: Safe Rollout in Organizations
            url: https://github.github.com/gh-aw/guides/safe-rollout/
          - title: Staged Mode
            url: https://github.github.com/gh-aw/reference/staged-mode/
        verified: "2026-11-26"
      - mitigation: D3-EI
        coverage: native
        mechanism: >-
          Agent Workflow Firewall (sandbox.agent: awf, the default) around every agent run; sandbox.agent.runtime
          docker (default, rootless AWF), cloud-hypervisor or nvx microVMs (preview); disabling the sandbox needs a
          dangerously- feature flag and strict: false; MCP servers in their own containers; ephemeral GitHub-hosted
          runners
        steps:
          - title: Keep the agent sandbox on
            body:
              - >-
                Leave sandbox.agent at awf (or omit sandbox) and never set features.dangerously-disable-sandbox-agent;
                strict mode rejects disabling it.
            url: https://github.github.com/gh-aw/reference/sandbox/#coding-agent-sandbox
          - title: Use a microVM where untrusted actors can trigger the run
            body:
              - >-
                Set sandbox.agent.runtime: nvx (Linux x86_64 KVM hosts with attested AWF assets) or cloud-hypervisor
                (GitHub-hosted Ubuntu x86_64 runners), both preview, for workflows that admit untrusted roles.
            url: https://github.github.com/gh-aw/reference/agent-runtimes/#nvx-preview
        note: >-
          Native: the sandbox is on by default, enforced outside the agent by AWF on the runner, and the Docker socket is
          hidden from the agent. Boundaries stated by the docs: the default Docker runtime shares the host kernel, runs
          as the runner's user and shares /tmp, so an escape reaches runner processes and tokens; docker-sudo-iptables
          raises AWF's privileges for host ports; authored setup steps, post-steps and custom jobs are not confined to
          the sandbox; on self-hosted runners and ARC the host's isolation and persistent state are the organisation's;
          the microVM runtimes are preview and refuse self-hosted, ARC and enclave combinations (Cloud Hypervisor) or
          need provisioning and attestation (NVX).
        verified: "2026-11-26"
      - mitigation: cap-agent-egress-control
        coverage: native
        mechanism: >-
          network: in the frontmatter (defaults when omitted), allowed and blocked domain and ecosystem lists, enforced
          by AWF's Squid proxy as the agent container's only egress; a separate network.hosted-web policy for Claude's
          and Codex's provider-hosted web tools; strict mode requires explicit network configuration
        steps:
          - title: List the hosts the agent may reach
            body:
              - >-
                Set network.allowed to defaults plus your package mirror and the hosts the task needs, not public
                ecosystem identifiers such as python or node where a mirror exists; use network: {} for no access.
            url: https://github.github.com/gh-aw/reference/network/#configuration
          - title: Bound provider-hosted web tools
            body:
              - >-
                For engine: claude or codex, set network.hosted-web to an allowed list, or hosted-web: false, because
                network.allowed does not constrain those tools.
            url: https://github.github.com/gh-aw/reference/network/#hosted-web-tools
        note: >-
          Native: the agent's HTTP and HTTPS traffic leaves only through the proxy, which enforces the workflow's list,
          and the same list redacts untrusted URLs in sanitized content. Boundaries: listed domains match their
          subdomains and wildcards are accepted; provider-hosted web search and fetch run outside the list; MCP traffic
          goes through the gateway on the host; authored steps outside the sandbox and the runner host are not behind
          the proxy; the docs warn that a domain allowlist constrains destinations, not the safety of every request
          to an allowed service.
        verified: "2026-11-26"
      - mitigation: D3-FA
        coverage: notApplicable
        note: >-
          gh-aw has no package mirror and inspects no package; admission scanning belongs to the private registry (for
          example JFrog Curation). No setting exists here for this pin. Point network.allowed at the mirror rather than
          at public ecosystems so the sandbox installs only what the mirror admitted.
        evidence:
          - title: Network Permissions (ecosystem identifiers)
            url: https://github.github.com/gh-aw/reference/network/
        verified: "2026-11-26"
      - mitigation: D3-SYSVA
        coverage: partial
        mechanism: >-
          The threat detection job (on whenever safe outputs are configured) has an AI detector read the agent's output
          and patch for malicious changes, secret leaks and prompt injection, runs custom steps such as Semgrep or
          TruffleHog, and blocks safe outputs only with continue-on-error: false
        steps:
          - title: Make detection block
            body:
              - >-
                Leave safe-outputs.threat-detection enabled and set continue-on-error: false so a detected threat or a
                detector failure fails the job and no safe output is applied.
            url: https://github.github.com/gh-aw/reference/threat-detection/#configuration-options
          - title: Add your scanners to detection
            body:
              - >-
                Add the static analysis and secret scanners the pipeline already trusts under
                threat-detection.steps, reading /tmp/gh-aw/aw.patch.
            url: https://github.github.com/gh-aw/reference/threat-detection/#advanced-configuration
        note: >-
          Partial: the scan sits before the agent's changes are written, and blocks only when an administrator sets
          continue-on-error: false; by default it is warn mode. The detector is a model with a security prompt, which the
          docs call defence in depth, and a detector failure is no verdict. It does not replace the pipeline's
          scans of the built app, its dependencies and its settings on every push, which this pin asks to stop the
          release; that is the CI's (for example code scanning and dependency review).
        verified: "2026-11-26"
      - mitigation: D3-CH
        coverage: partial
        mechanism: >-
          AWF's API proxy holds the engine credential (the agent sees a placeholder key); copilot-requests: write uses
          the Actions token instead of a PAT; workload identity federation for Anthropic, OpenAI and Google; write
          tokens only in safe-output jobs; secret redaction of logs and artifacts; threat detection for leaked secrets
        steps:
          - title: Use the Actions token for Copilot inference
            body:
              - >-
                Declare copilot-requests: write under permissions: (with the organisation's Copilot CLI billing policy
                on), so no personal access token is stored as COPILOT_GITHUB_TOKEN.
            url: https://github.github.com/gh-aw/reference/permissions/#special-permission-copilot-requests-write
          - title: Federate other engines' credentials
            body:
              - >-
                For Claude, Codex or Gemini, use the engine.auth workload identity federation options instead of a
                long-lived API key secret.
            url: https://github.github.com/gh-aw/reference/auth/
        note: >-
          Partial: the model key stays out of the agent's container and the agent's token cannot write, which meets the
          gateway sub-objective of this pin; the docs add that the API proxy is not an authentication boundary against
          code already running in the agent container. Secret scanning on every push and the app's secrets at release
          are the pipeline's and the vault's (for example GitHub push protection and a secrets manager); gh-aw's own
          check is the detector reading the agent's patch.
        verified: "2026-11-26"
      - mitigation: D3-CTS
        coverage: notApplicable
        note: >-
          gh-aw does not run the generated app or its connectors; scoping each app's identity to its approved
          connectors belongs to the app's platform. No setting exists here for this pin.
        evidence:
          - title: Security Architecture
            url: https://github.github.com/gh-aw/introduction/architecture/
        verified: "2026-11-26"
      - mitigation: D3-APA
        coverage: partial
        mechanism: >-
          on.roles (default [admin, maintainer, write]) and on.bots decide who can trigger a run; fork pull requests
          blocked by default; strict mode refuses pull_request_target with roles all or read
        steps:
          - title: Limit who can start the agent
            body:
              - >-
                Keep on.roles at the default [admin, maintainer, write] or narrower and list only the bots that may
                trigger it under on.bots; never use roles: all on a workflow that can write.
            url: https://github.github.com/gh-aw/reference/triggers/#filtering-by-repository-access-roles-onroles-onskip-roles
        note: >-
          Partial: gh-aw decides who can make the agent act through repository roles, which is the factory's "who may
          ask" half of this pin only where the request arrives as a GitHub event. Repository roles come from GitHub,
          not from your identity provider's groups, and permission to trigger is not approval. Sign-in in front of each
          generated app is the app platform's.
        verified: "2026-11-26"
      - mitigation: D3-MFA
        coverage: notApplicable
        note: >-
          gh-aw has no sign-in of its own: who triggers a run is a GitHub account whose second factor is the GitHub
          organisation's two-factor requirement or your identity provider's, and the app users' and owner's factors
          belong to the identity provider in front of the app and the deploy gate. No setting exists here for this pin.
        evidence:
          - title: Workflows (Triggers)
            url: https://github.github.com/gh-aw/reference/triggers/
        verified: "2026-11-26"
      - mitigation: D3-NI
        coverage: notApplicable
        note: >-
          gh-aw does not host previews or generated apps; isolating each app's tenancy and the previews' network is the
          app platform's. No setting exists here for this pin.
        evidence:
          - title: Security Architecture
            url: https://github.github.com/gh-aw/introduction/architecture/
        verified: "2026-11-26"
      - mitigation: cap-data-access-governance
        coverage: notApplicable
        note: >-
          gh-aw does not serve the app's users or broker its connectors to enterprise data; per-user data access belongs
          to the connectors and the systems of record. No setting exists here for this pin.
        evidence:
          - title: Security Architecture
            url: https://github.github.com/gh-aw/introduction/architecture/
        verified: "2026-11-26"
      - mitigation: cap-input-guardrails
        coverage: partial
        mechanism: >-
          Integrity filtering (tools.github.min-integrity, with blocked-users, trusted-users, approval and refusal
          labels) removes GitHub content below a trust level before the agent sees it; activation sanitizes event text
          (mentions, HTML and XML tags, untrusted URLs, control characters, size limits); the detector also looks for
          prompt injection in the output
        steps:
          - title: Filter what the agent reads by author trust
            body:
              - >-
                Set tools.github.min-integrity to approved (the default only on public repositories), or merged where
                the agent should read only reviewed content, and list known abusive accounts under blocked-users.
            url: https://github.github.com/gh-aw/reference/integrity/#configuration-reference
        note: >-
          Partial on the rule applied to both products onboarded on this drawing on 2026-11-26: filtering which
          authors' text reaches the agent, and normalising it, is not classification of the content. A collaborator's
          issue or an uploaded file with a hidden instruction passes both, and in a private repository every item
          counts as approved, so only merged filters there. Screening the request and uploads at intake, where this
          pin sits, is the intake's classifier.
        verified: "2026-11-26"
      - mitigation: AML.M0023
        coverage: partial
        mechanism: >-
          The compiled .lock.yml embeds the frontmatter (engine and model) and pins every action to a commit SHA and
          container images to digests; .github/aw/actions-lock.json caches the action-to-SHA map; gh aw audit reports
          each run's usage
        steps:
          - title: Commit the pins
            body:
              - >-
                Commit .github/aw/actions-lock.json with every .lock.yml, refresh pins only with gh aw update-actions or
                a recompile, and do not merge Dependabot bumps of github/gh-aw-actions.
            url: https://github.github.com/gh-aw/reference/compilation-process/#the-actions-lockjson-cache
        note: >-
          Partial: gh-aw records what the agent's own workflow ran with, which supplies the "which agent and model"
          part of this pin; the bill of materials of each release's packages is the pipeline's (an SBOM generator in
          CI), joined to the run that wrote the code.
        verified: "2026-11-26"
      - mitigation: D3-ACH
        coverage: notApplicable
        note: >-
          gh-aw does not check a generated app's environment definition against a baseline; that is the pipeline's
          policy check before release. No setting exists here for this pin. Its strict mode and gh aw lint harden the
          agent workflow's own configuration and are recorded under tool access and isolation.
        evidence:
          - title: Workflow Linters
            url: https://github.github.com/gh-aw/reference/workflow-linters/
        verified: "2026-11-26"
      - mitigation: cap-agent-tracing
        coverage: partial
        mechanism: >-
          OpenTelemetry export (observability.otlp, or GH_AW_DEFAULT_OTLP_ENDPOINT and headers as repository,
          organisation or enterprise variables and secrets), opt-in unified session logs, firewall activity logs and run
          artifacts, gh aw logs and gh aw audit
        steps:
          - title: Export every run's spans
            body:
              - >-
                Set GH_AW_DEFAULT_OTLP_ENDPOINT (and GH_AW_DEFAULT_OTLP_HEADERS as a secret) at organisation scope, or
                observability.otlp in a shared import, and add the collector's host to network.allowed.
            url: https://github.github.com/gh-aw/reference/open-telemetry/#write-telemetry-through-otlp
          - title: Keep run artifacts long enough to investigate
            body:
              - >-
                Set GH_AW_DEFAULT_ARTIFACT_RETENTION_DAYS with gh aw env so agent output, patches and firewall logs
                outlive the incident window.
            url: https://github.github.com/gh-aw/reference/compiler-enterprise-environment-controls/#enterprise-control-variables
        note: >-
          Partial: the agent's runs can be exported to your collector, but the organisation-level variables are
          cooperative (a repository variable or the workflow's env overrides them), so a repository can stop
          exporting; and gh-aw sees only the agent's part of the record, not the request, the approval or the release.
        verified: "2026-11-26"
      - mitigation: cap-agent-kill-switch
        coverage: partial
        mechanism: >-
          gh aw disable disables workflows and cancels in-progress runs in a repository; the runtime variable
          GH_AW_POLICY_ALLOW_CREATE_PULL_REQUEST=false stops the safe-outputs server for every workflow that opens pull
          requests across an organisation or enterprise; on.stop-after ends triggering at a deadline
        steps:
          - title: Stop the agent in a repository
            body:
              - Run gh aw disable --repo owner/repo, which disables the workflows and cancels any run in progress.
            url: https://github.github.com/gh-aw/setup/cli/#disable
          - title: Stop agent pull requests organisation-wide
            body:
              - >-
                Set the Actions variable GH_AW_POLICY_ALLOW_CREATE_PULL_REQUEST to "false" at organisation or enterprise
                scope; workflows with create-pull-request then refuse to start their safe outputs.
            url: https://github.github.com/gh-aw/reference/governance/#disabling-create-pull-request-org-wide
        note: >-
          Partial: gh-aw stops the factory's agent (in-progress runs are cancelled per repository, and the organisation
          variable takes effect at the next safe-outputs start, overridable by a repository variable "true"), but the
          stop this pin asks for takes a generated app offline and cancels its credentials, which is the app platform's
          and the identity provider's.
        verified: "2026-11-26"
      - mitigation: cap-shadow-ai-discovery
        coverage: notApplicable
        note: >-
          Finding apps built with AI outside the factory is cloud and network discovery's objective; gh-aw lists only
          its own workflows, one repository at a time. No setting exists here for this pin.
        evidence:
          - title: CLI Commands (list, status)
            url: https://github.github.com/gh-aw/setup/cli/
        verified: "2026-11-26"
      - mitigation: D3-AI
        coverage: notApplicable
        note: >-
          The register of generated apps with owner, data class and end date belongs to the factory's catalogue (for
          example Backstage); gh-aw records no app. No setting exists here for this pin.
        evidence:
          - title: Security Architecture
            url: https://github.github.com/gh-aw/introduction/architecture/
        verified: "2026-11-26"
      - mitigation: AML.M0043
        coverage: partial
        mechanism: >-
          safe-outputs.create-pull-request.expires (and expires on issues and discussions) generates a maintenance
          workflow that closes what the agent created after a set time; on.stop-after disables a workflow's triggers at
          a deadline
        steps:
          - title: Give agent pull requests an end date
            body:
              - >-
                Set safe-outputs.create-pull-request.expires (for example 14) so the generated agentics-maintenance
                workflow closes the agent's pull requests that nobody merged.
            url: https://github.github.com/gh-aw/reference/ephemerals/#pull-request-expiration
          - title: Give trial workflows a deadline
            body:
              - Set on.stop-after (for example "+7d") on a workflow under trial so it stops triggering on its own.
            url: https://github.github.com/gh-aw/reference/triggers/#stop-after-configuration-stop-after
        note: >-
          Partial: the resources the agent creates on GitHub (pull requests, issues, discussions, same repository only)
          get an end date the platform enforces, not the agent. The previews this pin names, and their credentials, are
          created by the pipeline and are deleted by its own job; the branch a closed pull request leaves is not
          documented as deleted.
        verified: "2026-11-26"
    settings:
      - id: agentJobPermissions
        name: permissions
        where: Workflow frontmatter › permissions (compiled into the agent job of the .lock.yml)
        setVia: [configFile]
        area: tools
        default: Read-only (the compiler adds actions read; write scopes are rejected in strict mode)
        recommended: Read scopes only, for what the task reads; every write through a safe output
        value: "Read scopes only"
        why: Even a fully compromised agent cannot change the repository, because its own token cannot write.
        mitigations: [AML.M0028]
        url: https://github.github.com/gh-aw/reference/permissions/
        verified: "2026-11-26"
      - id: strictRepository
        name: strict (aw.json)
        where: .github/workflows/aw.json › "strict"
        setVia: [configFile]
        area: tools
        default: strict true per workflow, which a workflow can turn off with strict false
        recommended: '"strict": true in aw.json, so no workflow in the repository can opt out'
        value: '"strict": true'
        why: Write permissions on the agent job, wildcard domains, a disabled sandbox and dangerous trigger combinations then fail compilation in every workflow.
        mitigations: [AML.M0028, D3-EI, cap-agent-egress-control]
        url: https://github.github.com/gh-aw/reference/frontmatter/#strict-mode-strict
        verified: "2026-11-26"
      - id: createPullRequestPolicy
        name: safe-outputs.create-pull-request (draft, max, allowed-branches)
        where: Workflow frontmatter › safe-outputs › create-pull-request
        setVia: [configFile]
        area: tools
        default: draft true (enforced as policy), max 1 per run, any branch name, fallback to an issue when blocked
        recommended: draft true, max 1, allowed-branches limited to the agent's branch prefix, fallback-as-issue false
        value: "Draft, one per run, agent branches only"
        why: The agent's only write is one draft pull request from a branch named for it, which branch protection and the pipeline then gate.
        mitigations: [AML.M0028]
        url: https://github.github.com/gh-aw/reference/safe-outputs-pull-requests/#pull-request-creation-create-pull-request
        verified: "2026-11-26"
      - id: protectedFiles
        name: protected-files
        where: Workflow frontmatter › safe-outputs › create-pull-request (and push-to-pull-request-branch) › protected-files
        setVia: [configFile]
        area: tools
        default: request-review (a REQUEST_CHANGES review lists the protected files, so a person must approve before merge)
        recommended: request-review, with no exclusions for .github/, manifests, lockfiles or agent instruction files; blocked where the agent should never touch them
        value: "request-review, no exclusions"
        why: A prompt-injected change to dependencies, CI definitions or the agent's own instructions waits for a person instead of merging with the rest of the patch.
        mitigations: [AML.M0028, AML.M0029]
        url: https://github.github.com/gh-aw/reference/safe-outputs-pull-requests/#protected-files
        verified: "2026-11-26"
      - id: reviewAllowedEvents
        name: submit-pull-request-review.allowed-events
        where: Workflow frontmatter › safe-outputs › submit-pull-request-review › allowed-events
        setVia: [configFile]
        area: tools
        recommended: "[COMMENT] (add REQUEST_CHANGES only with supersede-older-reviews)"
        value: "[COMMENT]"
        why: A review workflow's verdict never counts as the approval branch protection requires.
        mitigations: [AML.M0029]
        url: https://github.github.com/gh-aw/reference/safe-outputs-pull-requests/#submit-pr-review-submit-pull-request-review
        verified: "2026-11-26"
      - id: mergePullRequest
        name: merge-pull-request (experimental)
        where: Workflow frontmatter › safe-outputs › merge-pull-request
        setVia: [configFile]
        area: tools
        default: Not configured (when configured, merges to the default branch are always refused)
        recommended: Not configured; merges stay with people and the pipeline
        value: "Not configured"
        why: The agent cannot merge its own work; where a team turns it on, required-approvers must name people outside the agent's control.
        mitigations: [AML.M0028, AML.M0029]
        url: https://github.github.com/gh-aw/reference/safe-outputs-pull-requests/#merge-pull-request-merge-pull-request
        verified: "2026-11-26"
      - id: manualApproval
        name: on.manual-approval
        where: Workflow frontmatter › on › manual-approval (an environment in Settings › Environments)
        setVia: [configFile, adminConsole]
        area: tools
        default: Not set (activation inherits the top-level environment, if any)
        recommended: An environment with required reviewers and self-review prevented, on workflows that a person starts and that can write
        value: "Environment with required reviewers"
        why: A named person approves the run before the agent starts; naming an environment without protection rules requires nobody.
        mitigations: [AML.M0029]
        url: https://github.github.com/gh-aw/reference/triggers/#manual-approval-gates-manual-approval
        verified: "2026-11-26"
      - id: stagedMode
        name: safe-outputs.staged
        where: Workflow frontmatter › safe-outputs › staged
        setVia: [configFile]
        area: tools
        default: Not set (writes are applied)
        recommended: true for a new or changed workflow's first runs, then false once its proposals match what reviewers accept
        value: "true until reviewed"
        why: People see every write a new workflow would make, in the run summary, before any is applied.
        mitigations: [AML.M0029]
        url: https://github.github.com/gh-aw/reference/staged-mode/#enabling-staged-mode
        verified: "2026-11-26"
      - id: agentSandbox
        name: sandbox.agent
        where: Workflow frontmatter › sandbox › agent (and features.dangerously-disable-sandbox-agent)
        setVia: [configFile]
        area: tools
        default: awf (Agent Workflow Firewall)
        recommended: awf; never set dangerously-disable-sandbox-agent
        value: "awf"
        why: Every agent run stays in a container whose only way out is the firewall's proxy, with the Docker socket hidden.
        mitigations: [D3-EI, cap-agent-egress-control]
        url: https://github.github.com/gh-aw/reference/sandbox/#coding-agent-sandbox
        verified: "2026-11-26"
      - id: agentRuntime
        name: sandbox.agent.runtime
        where: Workflow frontmatter › sandbox › agent › runtime
        setVia: [configFile]
        area: tools
        default: docker (rootless AWF, shared host kernel)
        recommended: docker; nvx or cloud-hypervisor (preview) on workflows that untrusted actors can trigger; docker-sudo-iptables only where host ports are unavoidable
        value: "docker, microVM for untrusted triggers"
        why: A microVM keeps a sandbox escape away from the runner's processes and tokens, which the default container shares.
        mitigations: [D3-EI]
        url: https://github.github.com/gh-aw/reference/sandbox/#runtime-profiles
        verified: "2026-11-26"
      - id: networkAllowed
        name: network (allowed, blocked)
        where: Workflow frontmatter › network
        setVia: [configFile]
        area: network
        default: defaults (certificate validation, JSON schema and Ubuntu archive hosts only)
        recommended: defaults plus your package mirror, the AI gateway where you use one, and the hosts the task needs; no bare *
        value: "defaults, your mirror and named hosts"
        why: Commands the agent runs reach only listed hosts, so an injected instruction cannot post code or secrets elsewhere.
        mitigations: [cap-agent-egress-control]
        url: https://github.github.com/gh-aw/reference/network/#configuration
        verified: "2026-11-26"
      - id: hostedWeb
        name: network.hosted-web
        where: Workflow frontmatter › network › hosted-web
        setVia: [configFile]
        area: network
        default: Hosted web tools emitted as disabled when network is configured for Claude or Codex without hosted-web
        recommended: An allowed list of documentation hosts with max-uses, or false
        value: "Allowed list, or false"
        why: Claude's and Codex's provider-hosted search and fetch run outside network.allowed, so they need a list of their own.
        mitigations: [cap-agent-egress-control]
        url: https://github.github.com/gh-aw/reference/network/#hosted-web-tools
        verified: "2026-11-26"
      - id: bashAllowlist
        name: tools.bash
        where: Workflow frontmatter › tools › bash
        setVia: [configFile]
        area: tools
        default: Safe commands only (echo, printf, ls, pwd, cat, head, tail, grep, wc, sort, uniq, date, yq)
        recommended: The build, test and git commands the task needs, listed; never [":*"]
        value: "Named build and test commands"
        why: The agent runs only the commands the workflow lists, not whatever an instruction in an issue suggests.
        mitigations: [AML.M0028]
        url: https://github.github.com/gh-aw/reference/tools/#bash-tool-bash
        verified: "2026-11-26"
      - id: threatDetectionBlocking
        name: safe-outputs.threat-detection (enabled, continue-on-error)
        where: Workflow frontmatter › safe-outputs › threat-detection
        setVia: [configFile]
        area: tools
        default: Enabled when safe outputs exist; continue-on-error true (warn mode)
        recommended: enabled true, continue-on-error false
        value: "Enabled, continue-on-error false"
        why: A patch the detector flags as malicious or leaking a secret, or a detector failure, stops every safe output instead of opening a review pull request.
        mitigations: [D3-SYSVA, D3-CH]
        url: https://github.github.com/gh-aw/reference/threat-detection/#configuration-options
        verified: "2026-11-26"
      - id: threatDetectionSteps
        name: threat-detection.steps
        where: Workflow frontmatter › safe-outputs › threat-detection › steps
        setVia: [configFile]
        area: tools
        default: None (AI detection only)
        recommended: The static analysis and secret scanners your pipeline trusts, run against the agent's patch
        value: "Your SAST and secret scanners"
        why: Deterministic scanners check the agent's change before it is written, alongside the model's judgment.
        mitigations: [D3-SYSVA, D3-CH]
        url: https://github.github.com/gh-aw/reference/threat-detection/#advanced-configuration
        verified: "2026-11-26"
      - id: copilotRequestsWrite
        name: copilot-requests (permission)
        where: Workflow frontmatter › permissions › copilot-requests (with the Copilot policy "Allow use of Copilot CLI billed to the organization")
        setVia: [configFile, adminConsole]
        area: identity
        default: Not set (inference then needs a COPILOT_GITHUB_TOKEN personal access token)
        recommended: write, with organisation billing on; for other engines, engine.auth workload identity federation
        value: "write"
        why: No personal access token sits in the repository's secrets, and the model credential stays in AWF's API proxy.
        mitigations: [D3-CH]
        requires: An organisation with a Copilot plan (Copilot engine)
        url: https://github.github.com/gh-aw/reference/permissions/#special-permission-copilot-requests-write
        verified: "2026-11-26"
      - id: minIntegrity
        name: tools.github.min-integrity
        where: Workflow frontmatter › tools › github › min-integrity (with blocked-users, trusted-users, approval-labels, refusal-labels)
        setVia: [configFile]
        area: data
        default: approved on public repositories; none on private repositories (where every item counts as approved)
        recommended: approved, or merged where the agent should read only reviewed content, with known abusive accounts under blocked-users
        value: "approved, merged where possible"
        why: Issues and comments from authors outside the owners, members and collaborators, or content not yet merged, are removed before the agent reads them.
        mitigations: [cap-input-guardrails]
        url: https://github.github.com/gh-aw/reference/integrity/#configuration-reference
        verified: "2026-11-26"
      - id: onRoles
        name: on.roles
        where: Workflow frontmatter › on › roles (and on.bots)
        setVia: [configFile]
        area: identity
        default: "[admin, maintainer, write]"
        recommended: The default or narrower, with only named bots under on.bots; never all on a workflow that can write
        value: "[admin, maintainer, write]"
        why: Only people who can already write to the repository can make the agent act, and failed checks cancel the run.
        mitigations: [D3-APA]
        url: https://github.github.com/gh-aw/reference/triggers/#filtering-by-repository-access-roles-onroles-onskip-roles
        verified: "2026-11-26"
      - id: actionsLock
        name: .github/aw/actions-lock.json
        where: Repository › .github/aw/actions-lock.json, committed with each .lock.yml
        setVia: [configFile]
        area: tools
        default: Created by gh aw compile
        recommended: Committed, refreshed only with gh aw update-actions or a recompile
        value: "Committed"
        why: Every run's actions and images are pinned to the SHAs and digests reviewed, so the record of what the agent ran with is exact.
        mitigations: [AML.M0023]
        url: https://github.github.com/gh-aw/reference/compilation-process/#the-actions-lockjson-cache
        verified: "2026-11-26"
      - id: otlpDefaultEndpoint
        name: GH_AW_DEFAULT_OTLP_ENDPOINT
        where: GitHub Actions variable or secret at repository or organisation scope (variable at enterprise scope), set with gh aw env, with GH_AW_DEFAULT_OTLP_HEADERS as a secret
        setVia: [apiCli, adminConsole]
        area: audit
        default: Not set (no export)
        recommended: Your collector's OTLP endpoint at organisation scope, its host in network.allowed
        value: "Your collector, organisation-wide"
        why: Every agentic workflow's spans reach your SIEM's collector without each workflow configuring it; a repository variable can still override it.
        mitigations: [cap-agent-tracing]
        url: https://github.github.com/gh-aw/reference/compiler-enterprise-environment-controls/#enterprise-control-variables
        verified: "2026-11-26"
      - id: artifactRetention
        name: GH_AW_DEFAULT_ARTIFACT_RETENTION_DAYS
        where: GitHub Actions variable at repository, organisation or enterprise scope (gh aw env)
        setVia: [apiCli, adminConsole]
        area: audit
        default: Not set
        recommended: Your incident-investigation window, for example 90
        value: "90"
        why: The agent's output, patch and firewall log of a run are still there when someone asks what it did.
        mitigations: [cap-agent-tracing]
        url: https://github.github.com/gh-aw/reference/compiler-enterprise-environment-controls/#enterprise-control-variables
        verified: "2026-11-26"
      - id: ghAwDisable
        name: gh aw disable
        where: gh aw disable [workflow-id] --repo owner/repo
        setVia: [apiCli]
        area: tools
        recommended: In the on-call runbook as the stop for a misbehaving agent
        value: "In the stop runbook"
        why: Disables the repository's agentic workflows and cancels runs in progress, so the agent stops mid-task.
        mitigations: [cap-agent-kill-switch]
        url: https://github.github.com/gh-aw/setup/cli/#disable
        verified: "2026-11-26"
      - id: policyAllowCreatePullRequest
        name: GH_AW_POLICY_ALLOW_CREATE_PULL_REQUEST
        where: GitHub Actions variable at organisation or enterprise scope (gh variable set --org)
        setVia: [apiCli, adminConsole]
        area: tools
        default: Unset (allowed)
        recommended: Unset; "false" as the organisation-wide stop for agent pull requests, with repository variables that set it to "true" reviewed
        value: "Unset, false to stop"
        why: One variable stops every workflow that opens pull requests without recompiling any of them.
        mitigations: [cap-agent-kill-switch, AML.M0028]
        url: https://github.github.com/gh-aw/reference/governance/#disabling-create-pull-request-org-wide
        verified: "2026-11-26"
      - id: pullRequestExpires
        name: safe-outputs.create-pull-request.expires
        where: Workflow frontmatter › safe-outputs › create-pull-request › expires
        setVia: [configFile]
        area: tools
        default: Not set (agent pull requests stay open)
        recommended: 14 days
        value: "14"
        why: An agent's pull request that nobody merges is closed by the generated maintenance workflow instead of staying open indefinitely.
        mitigations: [AML.M0043]
        url: https://github.github.com/gh-aw/reference/ephemerals/#pull-request-expiration
        verified: "2026-11-26"
      - id: stopAfter
        name: on.stop-after
        where: Workflow frontmatter › on › stop-after
        setVia: [configFile]
        area: tools
        default: Not set
        recommended: A deadline on trial and experimental workflows, for example "+7d"
        value: '"+7d" on trials'
        why: A trial workflow stops triggering on its own date; runs in progress finish.
        mitigations: [AML.M0043, cap-agent-kill-switch]
        url: https://github.github.com/gh-aw/reference/triggers/#stop-after-configuration-stop-after
        verified: "2026-11-26"
