                  url: https://learn.chatgpt.com/docs/environments/cloud-environment
              verified: 2026-09-10
      - mitigation: AML.M0028
        coverage: partial
        mechanism: >-
          Per-environment agent internet access (Off, or On with a domain allowlist and GET / HEAD / OPTIONS),
          repositories chosen at connection, GitLab service account scoped to selected groups or projects, and the
          source system's branch protections
        steps:
          - title: Keep agent internet off or narrow
            body:
              - Per environment choose Off, or On with the None preset, named domains and methods restricted to GET,
                HEAD and OPTIONS.
            url: https://learn.chatgpt.com/docs/cloud/internet-access
