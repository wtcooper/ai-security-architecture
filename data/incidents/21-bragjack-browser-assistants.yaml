id: bragjack-browser-assistants
title: "BragJack: one extension takes over the AI assistants built into five browsers"
subtitle: >
  A single extension, using abilities any extension can ask for, got inside the pages each
  browser's assistant trusts and handed the agent whole prompts. The assistants read files, took
  screenshots and sent the user's mail on the attacker's word.
date: 2026-09
dateRange: January – September 2026 (published 16 September)
category: supplyChain
perspective: target
# The assistant built into the browser, or added to it as an extension, driven from the browser's
# own extension host: the browser AI drawing, whose extension install edge and managed profile are
# where the chain is cut.
archetype: archAgenticBrowser
caveat: >
  BragJack is one researcher's proof of concept. Google and Microsoft assigned CVEs and the five
  vendors paid bounties, but none of the sources reports the technique used against real users.
breaks:
  - control: cap-agent-tool-registry
    how: "Allow only reviewed extensions to install, by identifier and pinned version; BragJack needs one extension that can rewrite requests on every site."
  - control: cap-shadow-ai-discovery
    how: "List what people installed, starting with extensions that ask to rewrite requests, so an unreviewed one is found before it is used."
  - control: D3-CTS
    how: "Give the agent its own managed profile signed in to a few sites, so a forced prompt reaches those and not the person's mail."
  - control: AML.M0028
    how: "Stop the agent acting on sites it may only read, so a forced prompt cannot send mail from them."
  - control: cap-ai-vendor-assessment
    how: "Each opening was in the vendor's channel between its assistant and its own pages; ask how that channel checks what is driving it, and keep the browser on the fixed version."
summary:
  - >
    Browsers now ship an assistant wired to the vendor's own web pages through a privileged
    channel, so the assistant can read tabs, take screenshots and act on sites for the user. Gal
    Weizman of Forever Security showed that one ordinary extension could get inside those trusted
    pages in Chrome, Edge, Opera Neon, Perplexity Comet and Claude in Chrome, the last itself an
    extension.
  - >
    The extension needed no unusual permission: content scripts, which inject code into pages,
    and request rules that rewrite requests and responses. With them it reached each assistant's
    trusted channel and gave the agent a whole prompt, which Weizman calls prompt forcing. No
    model was tricked and no guardrail bypassed; the agent did what it was told with the
    browser's own privileges, and once the extension was installed nobody had to click.
  - >
    Chrome fixed its flaw as CVE-2026-0628 in January, and Edge its race condition as
    CVE-2026-55945, and each of the five vendors paid a bounty of between $600 and $7,000. The
    lesson for an organisation is the extension, not the model: which extensions may install,
    and what the agent's profile is signed in to.
patterns:
  - Malicious Browser Extension
  - Prompt Forcing
  - Confused Deputy
cves:
  - CVE-2026-0628
  - CVE-2026-55945
risks:
  - riskToolSourceProvenance
  - riskInsecureIntegratedComponent
  - riskAgenticDelegationConfusedDeputy
  - riskRogueActions
  - riskSensitiveDataDisclosure
steps:
  - n: 1
    title: One extension, with abilities any extension can ask for
    phase: introduced
    narrative: >
      The attack starts from a single extension already installed in the victim's browser. It
      uses two abilities extensions have by default: content scripts, which inject JavaScript into
      pages, and declarativeNetRequest rules, which change how requests are handled, response
      headers and redirects included. The same extension was used against all five targets.
    path: [openWeb->browser]
    risks:
      - riskToolSourceProvenance
    sources:
      - title: "BragJack: How We Hijacked 5 Of The World's Most Popular Browsers Using Their Built-In AI Assistants"
        url: https://forever.security/blog/bragjack-hijacking-5-browsers-via-built-in-ai-assistants/
        publisher: Forever Security
        date: 2026-09-16
      - title: "BragJack attacks hijack AI browser agents through malicious extensions"
        url: https://www.bleepingcomputer.com/news/security/bragjack-attacks-hijack-ai-browser-agents-through-malicious-extensions/
        publisher: BleepingComputer
        date: 2026-09-19
  - n: 2
    title: The extension gets inside the pages the assistant trusts
    phase: introduced
    narrative: >
      Each browser left an opening an extension could reach. Chrome blocked extensions from its
      AI component and from Gemini's site, but its request rules still applied to the embedded
      Gemini web app: weakening its security headers and redirecting one script ran the
      researcher's code inside Gemini, talking straight to Chrome's AI component. Comet's agent
      trusted a Perplexity testing domain that lacked the main site's protections. Edge had split
      its agent into "Think" and "Do" modes, and a race condition briefly lifted the restriction.
      Claude in Chrome was driven by another extension.
    path: [browser]
    risks:
      - riskInsecureIntegratedComponent
    cves:
      - CVE-2026-0628
      - CVE-2026-55945
    sources:
      - title: "BragJack attacks hijack AI browser agents through malicious extensions"
        url: https://www.bleepingcomputer.com/news/security/bragjack-attacks-hijack-ai-browser-agents-through-malicious-extensions/
        publisher: BleepingComputer
        date: 2026-09-19
      - title: "BragJack: One Extension Hijacks Five Browsers' AI Agents"
        url: https://labs.cloudsecurityalliance.org/research/csa-research-note-bragjack-browser-ai-agent-hijack-20260922/
        publisher: Cloud Security Alliance
        date: 2026-09-22
  - n: 3
    title: The attacker hands the agent a whole prompt
    phase: exposed
    narrative: >
      Instead of hiding an instruction in content the agent reads, the extension gave the agent
      an entire prompt and its follow-up instructions, and the agent took them as the user's.
      Weizman calls this prompt forcing. It needs no wording that slips past a guardrail, and once
      the extension is installed it runs without the user doing anything.
    path: [browser->toolPlane, harness]
    risks:
      - riskAgenticDelegationConfusedDeputy
    sources:
      - title: "BragJack: How We Hijacked 5 Of The World's Most Popular Browsers Using Their Built-In AI Assistants"
        url: https://forever.security/blog/bragjack-hijacking-5-browsers-via-built-in-ai-assistants/
        publisher: Forever Security
        date: 2026-09-16
      - title: "BragJack attacks hijack AI browser agents through malicious extensions"
        url: https://www.bleepingcomputer.com/news/security/bragjack-attacks-hijack-ai-browser-agents-through-malicious-extensions/
        publisher: BleepingComputer
        date: 2026-09-19
  - n: 4
    title: The assistant acts with the browser's privileges
    phase: exposed
    narrative: >
      The attacker got whatever the assistant could do. In Chrome that meant reading local files
      and web content, taking screenshots and potentially reaching the camera and microphone.
      Comet's agent gave up browsing history and was made to summarise the victim's emails and
      send the results to another address; Opera Neon's could be made to summarise and send
      email from the victim's account. Legitimate browser software carried out every action, so
      the final step was not malicious code an endpoint defence would recognise.
    path: [toolPlane->browser, browser->webInspection, webInspection->downstream]
    risks:
      - riskRogueActions
      - riskSensitiveDataDisclosure
      - riskAgenticDelegationConfusedDeputy
    sources:
      - title: "BragJack attacks hijack AI browser agents through malicious extensions"
        url: https://www.bleepingcomputer.com/news/security/bragjack-attacks-hijack-ai-browser-agents-through-malicious-extensions/
        publisher: BleepingComputer
        date: 2026-09-19
      - title: "BragJack: How We Hijacked 5 Of The World's Most Popular Browsers Using Their Built-In AI Assistants"
        url: https://forever.security/blog/bragjack-hijacking-5-browsers-via-built-in-ai-assistants/
        publisher: Forever Security
        date: 2026-09-16
  - n: 5
    title: Where this chain breaks
    phase: mitigated
    narrative: >
      Allow only reviewed extensions to install, by identifier and pinned version, and look for
      the ones that got through, starting with any that ask to rewrite requests or attach a
      debugger. Run the agent in its own managed profile, signed in to a few sites, so a forced
      prompt reaches those and not the person's mail, and stop it acting on sites it may only
      read. Ask each vendor how the channel between its assistant and its own pages checks what
      is driving it, and keep browsers on the fixed versions: Chrome 143.0.7499.192 and Edge
      150.0.4078.48.
    path: [openWeb->browser, browser, profile, toolPlane, vendorService, govSupplyChain]
    sources:
      - title: "BragJack: One Extension Hijacks Five Browsers' AI Agents"
        url: https://labs.cloudsecurityalliance.org/research/csa-research-note-bragjack-browser-ai-agent-hijack-20260922/
        publisher: Cloud Security Alliance
        date: 2026-09-22
alsoSeen:
  - title: "Thirty fake AI assistant extensions, more than 300,000 users"
    date: February 2026
    note: >
      The install half of this chain, in the wild. The AiFrame extensions implemented no AI
      themselves: each rendered a full-screen frame from the operator's server, so what it did
      could change with no store review. They read the pages people visited, and fifteen of them
      carried a script that read Gmail threads and drafts. AI was the lure, not the target.
    sources:
      - title: "Fake AI Chrome extensions with 300K users steal credentials, emails"
        url: https://www.bleepingcomputer.com/news/security/fake-ai-chrome-extensions-with-300k-users-steal-credentials-emails/
        publisher: BleepingComputer
        date: 2026-02-12
  - title: "ThisBash: an extension on claude.ai drives Claude Dispatch to run code on the desktop"
    date: November 2026
    note: >
      The same researcher's prompt forcing, carried out of the browser: an extension able to
      script claude.ai prompted the paired Claude Desktop through Dispatch in the user's name and
      clicked each Allow itself, until Claude ran an `npm install` whose hook opened Calculator.
      Anthropic closed the May report as a duplicate of its own finding and, the researchers
      say, told them it would retire Dispatch; no real attacks are reported.
    sources:
      - title: "ThisBash Escape: Claude Dispatch Flaw Enables Browser Extensions RCE on the OS"
        url: https://forever.security/blog/thisbash-claude-dispatch-browser-extension-rce
        publisher: Forever Security
        date: 2026-11-04
      - title: "Malicious Browser Extensions Could Use Claude Dispatch to Run Code on Users' Computers"
        url: https://thehackernews.com/2026/11/malicious-browser-extensions-could-use.html
        publisher: The Hacker News
        date: 2026-11-06
