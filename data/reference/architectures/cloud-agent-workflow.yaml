  - title: "OWASP Agentic AI — threats and mitigations v1.1, T12 and T13"
    url: https://genai.owasp.org/resource/agentic-ai-threats-and-mitigations/
  - title: "AWS Well-Architected Agentic AI Lens — multi-agent orchestration and collaboration models"
    url: https://docs.aws.amazon.com/wellarchitected/latest/agentic-ai-lens/agentperf05.html
  - title: "Microsoft Azure Architecture Center — AI agent orchestration patterns"
    url: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/guide/ai-agent-design-patterns
  - title: "Google Cloud — choose a design pattern for an agentic AI system"
