    summary: >-
      Microsoft made Microsoft Execution Containers (MXC), first shown on 7 October, generally available.
      MXC applies least-privilege limits on files, network, processes and user interaction to AI agents
      on Windows, enforced by the operating system rather than the agent, with policies tested before
      enforcing. Intune, Entra and Agent 365 integration is planned. Codex CLI 0.172.0 moved its MXC sandbox
      to the public SDK.
