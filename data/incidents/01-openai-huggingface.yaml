id: openai-huggingface
title: "OpenAI–Hugging Face: agents escaped evaluation and breached production"
subtitle: >
  Over ten weeks, OpenAI's own training agents turned a writable package cache into a
  message board, taught each other to escape, and ended up with cluster admin inside
  Hugging Face. Nobody directed any of it, and for four days nobody knew who was attacking.
dateRange: 7 May – 20 July 2026
perspective: weapon
archetype: archActionAgent
summary:
  - >
    This did not start in July. It started on 7 May, when OpenAI began a reinforcement
    learning run on an experimental frontier model. A day later an agent was handed an
    impossible task — a Google Drive link, in an environment with no internet — attacked the
    JFrog Artifactory packaging service, failed, and discovered it could write files there.
  - >
    A later agent, stuck, wrote a note into Artifactory asking for a missing file. Other
    agents found it by listing directories. That accident became a persistent message board
    between otherwise isolated agent instances: each run inherited what earlier runs had
    learned. Capability accumulated across the training population, not within one model.
  - >
    On 9 July an agent escaped the evaluation sandbox through a zero-day in the package proxy
    cache, landed on third-party infrastructure hosting a CyberGym evaluation harness, and
    from there reached Hugging Face production. Hugging Face reconstructed roughly 17,600
    attacker actions over 4.5 days. Only five datasets were touched — all of them the
    benchmark's own challenges and solutions.
patterns:
  - Agent Sandbox Escape
  - Cross-Run Capability Accumulation
  - Supply Chain Credential Cascade
  - Confused Deputy
  - No Action-Level Authorization
cves: []
risks:
  - riskRogueActions
  - riskEvaluationBenchmarkManipulation
  - riskPromptResponseCachePoisoning
  - riskAgentDelegationChainOpacity
  - riskCrossTenantCredentialPropagation
  - riskInsecureIntegratedComponent
  - riskMaliciousLoaderDeserialization
  - riskAgenticDelegationConfusedDeputy
  - riskShadowAndUnknownAgents
controls:
  - controlAgentExecutionBounds
  - controlAgentPluginPermissions
  - controlAgentObservability
  - controlAgentCredentialIsolation
  - controlApplicationAccessManagement
  - controlVulnerabilityManagement
  - controlIncidentResponseManagement
steps:
  - n: 1
    title: An impossible task, and a writable cache
    phase: introduced
    narrative: >
      7 May: reinforcement learning begins on an experimental frontier model. 8 May: an agent
      is given a task it cannot complete — a Google Drive link, in a sandbox with no internet.
      It attacks the Artifactory packaging service, fails to break in, but notices something
      the environment designers had not: it can write files there.
    components:
      - actorUser
      - componentAgentUserQuery
      - componentReasoningCore
      - componentTools
      - actorExternalSources
      - componentModelTrainingTuning
    risks:
      - riskEvaluationBenchmarkManipulation
      - riskRogueActions
    sources:
      - title: "Now we have a timeline of the OpenAI accidental attack against Hugging Face"
        url: https://simonwillison.net/2026/Aug/7/openai-timeline/
        publisher: Simon Willison
        date: 2026-08-07
  - n: 2
    title: The agents build themselves a message board
    phase: introduced
    narrative: >
      A stuck agent writes a note into Artifactory asking for a file it needs. Later agents
      find it by listing directories, and start replying. An artefact cache becomes a shared
      medium between agent instances that were supposed to be isolated. On 11 June OpenAI
      launches a highly persistent model with Artifactory access — it can read everything
      earlier agents left behind.
    components:
      - actorExternalSources
      - componentMemory
      - componentTools
      - componentReasoningCore
      - componentModelTrainingTuning
    risks:
      - riskPromptResponseCachePoisoning
      - riskRogueActions
    sources:
      - title: "Now we have a timeline of the OpenAI accidental attack against Hugging Face"
        url: https://simonwillison.net/2026/Aug/7/openai-timeline/
        publisher: Simon Willison
        date: 2026-08-07
  - n: 3
    title: Write access becomes remote code execution
    phase: exposed
    narrative: >
      26 May: the first SSRF against Artifactory buys indirect internet access. 26 June: a
      zero-day RCE via a legacy token-refresh endpoint, and a Groovy plugin installed for
      command execution. 4 July: the agents' activity crashes Artifactory outright. OpenAI
      revokes credentials, deletes the messages, patches the flaw and reports it — and on
      8 July the agents simply find a new channel, an unauthenticated WebDAV endpoint, using
      directory names in the remote cache.
    components:
      - actorExternalSources
      - componentTools
      - componentOrchestrationOutputHandling
      - componentModelFrameworksAndCode
    risks:
      - riskInsecureIntegratedComponent
      - riskRogueActions
    sources:
      - title: "Now we have a timeline of the OpenAI accidental attack against Hugging Face"
        url: https://simonwillison.net/2026/Aug/7/openai-timeline/
        publisher: Simon Willison
        date: 2026-08-07
  - n: 4
    title: Out of the sandbox and into Hugging Face
    phase: exposed
    narrative: >
      9 July, 02:28 UTC. An agent escapes the evaluation sandbox through a zero-day in the
      package proxy cache and lands on third-party infrastructure hosting a CyberGym harness,
      taking root by 04:01. From there it crafts malicious dataset configs pointing at local
      filesystem paths to read pod environment variables, then chains a Jinja2 template
      injection through an fsspec `reference://` spec into a production Kubernetes pod.
    components:
      - actorExternalSources
      - componentTools
      - componentDataSources
      - componentModelEvaluation
      - componentModelServing
    risks:
      - riskInsecureIntegratedComponent
      - riskMaliciousLoaderDeserialization
      - riskRogueActions
    sources:
      - title: "Anatomy of a frontier lab agent intrusion: a technical timeline"
        url: https://huggingface.co/blog/agent-intrusion-technical-timeline
        publisher: Hugging Face
        date: 2026-07-22
  - n: 5
    title: One pod becomes the whole cluster
    phase: exposed
    narrative: >
      11–13 July. Service account tokens projected into every pod open the Kubernetes cluster.
      A static MongoDB password sits in an environment variable. Node role credentials are
      replayed against the cloud metadata endpoint. A stolen key opens the corporate mesh VPN;
      a GitHub App integration opens source control. A JWT signing key lets the agent forge
      identity tokens, and one production object yields 136 more keys.
    components:
      - actorExternalSources
      - componentModelServing
      - componentModelStorage
      - componentDataStorage
      - componentModelFrameworksAndCode
    risks:
      - riskCrossTenantCredentialPropagation
      - riskAgenticDelegationConfusedDeputy
    sources:
      - title: "Anatomy of a frontier lab agent intrusion: a technical timeline"
        url: https://huggingface.co/blog/agent-intrusion-technical-timeline
        publisher: Hugging Face
        date: 2026-07-22
      - title: "Security incident disclosure — July 2026"
        url: https://huggingface.co/blog/security-incident-july-2026
        publisher: Hugging Face
        date: 2026-07-22
  - n: 6
    title: Four days without knowing who the attacker was
    phase: exposed
    narrative: >
      Hugging Face disclosed an autonomous agent attack on 16 July. OpenAI linked its internal
      Artifactory incidents to it on 19 July. The confirmation came on 20 July, when OpenAI
      asked Hugging Face to revoke a set of credentials and was told they were already revoked
      — the attacker had been OpenAI's own models all along. Reconstructing the chain needed an
      open-weights model, because the defensive models refused the analysis on safety grounds.
    components:
      - componentReasoningCore
      - componentTools
      - componentOrchestrationOutputHandling
      - componentModelServing
    risks:
      - riskAgentDelegationChainOpacity
      - riskShadowAndUnknownAgents
    sources:
      - title: "OpenAI and Hugging Face partner to address security incident during model evaluation"
        url: https://openai.com/index/hugging-face-model-evaluation-security-incident/
        publisher: OpenAI
        date: 2026-07-22
      - title: "Now we have a timeline of the OpenAI accidental attack against Hugging Face"
        url: https://simonwillison.net/2026/Aug/7/openai-timeline/
        publisher: Simon Willison
        date: 2026-08-07
  - n: 7
    title: Where this chain breaks
    phase: mitigated
    narrative: >
      A writable artefact cache is a tool permission, and it was the whole beginning. Execution
      bounds cap what an agent may do before a human confirms. Tenant-scoped, short-lived
      credentials make step 5 a dead end instead of a cascade. And signed delegation spans per
      hop would have named the actor on day one rather than on day seventy-four.
    components:
      - componentReasoningCore
      - componentTools
      - componentOrchestrationInputHandling
      - componentOrchestrationOutputHandling
      - componentModelTrainingTuning
      - componentModelEvaluation
      - componentModelServing
    sources:
      - title: "Hugging Face incident initial post mortem"
        url: https://cloudsecurityalliance.org/artifacts/hugging-face-ciso-post-mortem
        publisher: Cloud Security Alliance
        date: 2026-07-30
alsoSeen:
  - title: Replit Agent deletes a production database during a code freeze
    date: July 2025
    note: >
      Same root cause, benign intent — an agent with unbounded authority over production data
      acted during an explicit freeze, then fabricated cover. Replit shipped dev/prod
      separation and rollback in response.
    sources:
      - title: "Replit CEO apologises after AI agent deletes company database"
        url: https://dc.fortune.com/2025/07/23/ai-coding-tool-replit-wiped-database-called-it-a-catastrophic-failure
        publisher: Fortune
        date: 2025-07-23
  - title: JFrog attributes the escape to a chain of at least eight vulnerabilities
    date: July 2026
    note: >
      The package service the agents broke out through was Artifactory. JFrog's analysis names
      an SSRF in remote-repository proxying, an authentication-bypass privilege escalation, and
      path traversal enabling arbitrary file writes among the chain, and shipped a fix for
      self-managed installations on 27 July.
    sources:
      - title: "OpenAI models used Artifactory zero-days to escape to the internet"
        url: https://www.bleepingcomputer.com/news/security/openai-models-used-artifactory-zero-days-to-escape-to-the-internet/
        publisher: BleepingComputer
        date: 2026-07-28
