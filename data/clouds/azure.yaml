        summary: "The MCP server is a container you build, run as a container app behind the platform's HTTPS ingress, published through API Management. Microsoft runs the hosts and scaling; the builder now carries a Dockerfile, an image registry and the minimum replica count. Built-in authentication checks Entra tokens much as App Service does, but no protected resource metadata support is documented, and outbound filtering needs an environment created in your own virtual network."
        bindings:
          - { block: service, service: "Your MCP server on Azure Container Apps", note: "A container serving Streamable HTTP behind Container Apps ingress, with built-in authentication set to return 401 and ingress reachable only from API Management.", url: https://learn.microsoft.com/en-us/azure/container-apps/mcp-overview }
        dropSettings: [appServiceRequireAuth, keyVaultReferences, appServiceRouteAll]
        addSettings: [agentManagedIdentity, firewallEgress, containerAppsTrafficSplit, containerAppsRequireAuth, containerAppsKeyVaultSecrets, containerAppsEnvironmentVnet]
        differences:
          - at: service
            text: "In this hosting model Container Apps has, in Microsoft's words, no MCP-specific awareness. Its built-in authentication validates Microsoft Entra bearer tokens, but the pages read do not mention the protected resource metadata that App Service Authentication publishes. Plan for the server to serve its own discovery document, or for clients configured with the scope in advance."
            url: https://learn.microsoft.com/en-us/azure/container-apps/mcp-overview
          - at: gateway->service
            text: "A container app with external ingress in a default environment is reachable from the internet, and with no IP restriction rules all inbound traffic is allowed. To keep API Management as the only door, use an internal environment joined to the gateway's network or IP restrictions, and leave built-in authentication on Return401."
            url: https://learn.microsoft.com/en-us/azure/container-apps/ingress-overview
          - at: service->orgData
            text: "By default the environment sits on an Azure-generated network and can call any internet-accessible endpoint. Routing outbound traffic to Azure Firewall needs a workload profiles environment in a virtual network you supply, and the network type cannot be changed afterwards, so an environment created with defaults has to be rebuilt."
            url: https://learn.microsoft.com/en-us/azure/container-apps/networking
          - at: service
            text: "Replicas scale to zero by default, and Microsoft's troubleshooting page puts the first request after idle at 10 to 30 seconds; set minimum replicas to 1. The ingress request timeout is 240 seconds; premium ingress can raise the idle limit to 30 minutes. Default probes are TCP; point any HTTP health probe at a separate GET path, not the MCP endpoint, which accepts only POST."
            url: https://learn.microsoft.com/en-us/azure/container-apps/mcp-troubleshooting
          - at: service->authServer
            text: "Microsoft's steps give built-in authentication a client secret for the server's app registration and store it as a secret in the container app, where the mapping uses certificate credentials. A secret changed by hand does not reach running revisions until a new revision is deployed or the revision is restarted; a Key Vault reference without a version avoids that."
            url: https://learn.microsoft.com/en-us/azure/container-apps/authentication-entra
        alsoNeeded:
          - service: "Azure Container Registry"
            role: registry
            why: "The server ships as a container image that the app pulls, with a managed identity for the pull; App Service took a code deployment."
            url: https://learn.microsoft.com/en-us/azure/container-apps/managed-identity
          - service: "Container Apps environment (workload profiles)"
            role: other
            why: "Every container app runs in an environment, which holds the network type and logging destination that an App Service plan did not."
            url: https://learn.microsoft.com/en-us/azure/container-apps/networking
          - service: "Virtual network with Azure Firewall and a route table"
            role: network
            why: "Outbound filtering is not a flag on the app: it is a subnet you delegate to the environment and a user-defined route to a firewall you run."
            url: https://learn.microsoft.com/en-us/azure/container-apps/user-defined-routes
          - service: "Log Analytics workspace"
            role: logging
            why: "Container console and system logs are stored in the environment's Log Analytics workspace, the default destination."
            url: https://learn.microsoft.com/en-us/azure/container-apps/log-options
