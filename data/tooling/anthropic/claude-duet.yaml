# Claude Duet — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# 2026-10-22: onboarded on archPersistentManagedAgents. Duet is a continuing, vendor-hosted agent
# with its own cloud computer and browser, a persistent thread, retained memory and its own
# check-in schedule; it is not a coding session (archHostedAgentSessions) and the user does not
# host it (archPersonalAgent).
# Consumer rule: Duet is a research preview on Pro and Max only, with no Team or Enterprise plan and
# no administrator surface. A control the person can set is rated partial at most, because no
# organisation can require or see it; vendor-built safeguards that nobody can configure are partial
# on the same rule as toolOpenaiDots.
# Fetch log: claude.com/resources/articles/claude-duet, claude.com/product/claude-duet and
# support.claude.com articles 17631495, 11176164, 17666484, 11647753, 11817273 all 200;
# anthropic.com/engineering/managed-agents redirects to /research/managed-agents. No Duet admin,
# retention, audit-log or pause documentation exists yet; the announcement says more safety detail
# follows "in the coming days".
vendor: anthropic
family: Claude Duet
tools:
  - id: toolClaudeDuet
    name: Claude Duet
    surfaceClasses:
      - managedRuntime
    variants:
      - name: Claude Duet app (iOS and Android)
        class: managedRuntime
        url: https://claude.com/product/claude-duet
        note: Standalone app, separate from the Claude app; one ongoing thread plus side channels that share memory.
      - name: Claude Duet on claude.ai
        class: managedRuntime
        url: https://support.claude.com/en/articles/17631495-get-started-with-claude-duet
    architecture: archPersistentManagedAgents
    status: preview
    asOf: "2026-10"
    summary:
      - >-
        A proactive personal agent operated by Anthropic. It works on its own computer in the cloud with
        its own browser, keeps one persistent thread, and carries the person's Claude memory, skills and
        connectors from the first message. It sends a morning brief, checks connected accounts at set
        intervals and keeps working after the app is closed, asking before it sends, pays, signs or
        deletes anything.
      - >-
        It is a consumer research preview for US Pro and Max accounts by waitlist. Nothing about it is
        administered by an organisation: the risk for an enterprise is an employee connecting a work
        mailbox, calendar or Slack to it from a personal plan.
    facts:
      - label: Plans
        value: >-
          Research preview by waitlist for Pro and Max accounts in the US, included in the plan and sharing
          its usage limits. Not available on Team or Enterprise.
        url: https://support.claude.com/en/articles/17631495-get-started-with-claude-duet
      - label: Inference & routing
        value: >-
          Anthropic operates the agent and its cloud computer. It runs on Claude Opus 5.5 and sets its own
          effort per job; the model cannot be chosen.
        url: https://support.claude.com/en/articles/17631495-get-started-with-claude-duet
      - label: Data leaving the device
        value: >-
          Connected-app content, Claude memory and skills, and Claude chats outside projects reach the
          hosted agent. Passwords are typed into a separate form on the device and sent to the cloud browser.
        url: https://support.claude.com/en/articles/17631495-get-started-with-claude-duet
      - label: Retention & training
        value: >-
          The Duet documentation states no retention period or training rule; consumer plans fall under the
          Anthropic Privacy Policy and Consumer Terms. Disconnecting an app keeps what Duet already learned.
        url: https://www.anthropic.com/legal/privacy
      - label: Docs index
        value: Get started with Claude Duet (support centre); product page and announcement.
        url: https://support.claude.com/en/articles/17631495-get-started-with-claude-duet
      - label: Purchases
        value: >-
          Link by Stripe and Shop Pay, connected inside Duet; each purchase uses a one-time card. Trading
          securities and moving money between accounts are refused even with approval.
        url: https://support.claude.com/en/articles/17666484-how-to-use-link-by-stripe-with-claude-duet
    items:
      - title: Decide whether work accounts may connect to it
        body:
          - Duet has no organisation plan, so the only enterprise lever is at the services it connects to.
            Use the identity provider's or each SaaS admin console's third-party app consent controls to
            decide whether Claude connectors may reach work mail, calendars, drives and Slack from a
            personal account.
        links:
          - title: Use connectors to extend Claude's capabilities
            url: https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities
      - title: Treat the approval prompt as a bounded safeguard
        body:
          - Duet asks before sending, paying, signing or deleting, and finishes the rest of a task while an
            approval waits. Reading and drafting are not gated, and its cloud browser cannot be watched or
            taken over, so what it read on the way to a proposed action is not visible.
        links:
          - title: Claude Duet announcement
            url: https://claude.com/resources/articles/claude-duet
    riskNotes:
      - risk: riskShadowAndUnknownAgents
        note: A personal-plan agent with standing access to a work mailbox or Slack is invisible to every admin console.
      - risk: riskPromptInjection
        note: Email and web pages it reads on its own schedule can steer later work; the vendor says no defence is perfect.
      - risk: riskSensitiveDataDisclosure
        note: Memory, connected content and Claude chats outside projects all reach the hosted agent and outlive a disconnect.
      - risk: riskAgenticDelegationConfusedDeputy
        note: It acts with the owner's connector grants and saved browser sessions, including on items others sent.
    controls:
      - mitigation: D3-APA
        coverage: external
        mechanism: No organisation plan or admin switch; the connected services' third-party app consent controls decide what it can reach.
        evidence:
          - title: Plan availability (not on Team or Enterprise)
            url: https://support.claude.com/en/articles/17631495-get-started-with-claude-duet
          - title: Connectors and where they are managed
            url: https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities
        note: >-
          External: Duet runs only on individual Pro and Max accounts, so no organisation can turn it on or off.
          Govern it at the destination — the identity provider's or Google Workspace, Microsoft 365 and Slack
          admins' OAuth app approval for the Claude connectors — and in acceptable-use policy for personal AI
          plans.
        verified: "2026-10-22"
      - mitigation: AML.M0028
        coverage: partial
        mechanism: >-
          The person starts every connection and manages it in Customize > Connectors; vendor-fixed limits refuse
          trading securities, moving money between accounts and using someone else's account.
        steps:
          - title: Connect only what it needs
            body:
              - In Customize > Connectors, disconnect any service Duet should not reach and, per connector, set
                write and delete tool groups to Needs approval or Blocked under Tool permissions.
            url: https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities
        note: >-
          Partial on the consumer rule: the person sets it and no organisation can require it. The Duet article
          does not say whether Duet honours the per-tool permissions set for Claude; verify before relying on
          them. Sites without a connector are reached through its cloud browser, with no per-site setting.
        verified: "2026-10-22"
      - mitigation: AML.M0029
        coverage: partial
        mechanism: >-
          Approval in the Duet app before sending a message, making a payment, signing a document or deleting
          anything; deferred approvals return later.
        steps:
          - title: Review each approval request
            body:
              - Read the exact action Duet shows before approving; it may finish the rest of a task first, so
                check the draft and what it read, and mark tasks complete yourself in the Tasks tab.
            url: https://support.claude.com/en/articles/17631495-get-started-with-claude-duet
        note: >-
          Partial on the same rule as toolOpenaiDots: the categories are vendor-defined, an auto-mode classifier
          decides which actions count, and the person approves in the app; nothing is configurable by an
          organisation and reading or drafting is never gated.
        verified: "2026-10-22"
      - mitigation: D3-MFA
        coverage: none
        mechanism: Sign-in is the person's own Claude account; no organisation SSO or MFA policy applies.
        evidence:
          - title: Plan availability and account requirements
            url: https://support.claude.com/en/articles/17631495-get-started-with-claude-duet
        note: >-
          None for an organisation: Duet is not on Team or Enterprise, so no SSO, conditional access or MFA
          requirement reaches it. Any second factor is whatever the person's own sign-in method provides.
        verified: "2026-10-22"
      - mitigation: D3-CH
        coverage: partial
        mechanism: Passwords are typed into a separate on-device form and sent straight to the cloud browser, kept out of the chat.
        evidence:
          - title: Password handling
            url: https://support.claude.com/en/articles/17631495-get-started-with-claude-duet
          - title: Credential design for Anthropic's hosted agents
            url: https://www.anthropic.com/research/managed-agents
        note: >-
          Partial on the same rule as toolOpenaiDots: the signed-in browser session that results still carries
          the account's authority, and token storage for connectors is not described for Duet.
        verified: "2026-10-22"
      - mitigation: D3-CTS
        coverage: partial
        mechanism: Each Link or Shop Pay purchase uses a one-time card valid only for that purchase.
        steps:
          - title: Pay only through Link or Shop Pay
            body:
              - Connect Link inside Claude Duet rather than giving it a stored card, so each approved purchase
                gets its own one-time card.
            url: https://support.claude.com/en/articles/17666484-how-to-use-link-by-stripe-with-claude-duet
        note: >-
          Partial: scoping is documented for payment credentials only. Connector tokens and saved browser logins
          are not documented as bound to a recipient, so confirm that before crediting the whole pin.
        verified: "2026-10-22"
      - mitigation: AML.M0031
        coverage: partial
        mechanism: Claude memory settings and chat deletion; deleted chats are removed from Duet's search.
        steps:
          - title: Review what it remembers
            body:
              - In Settings > Memory, review or remove what Claude remembers, and delete chats you do not want Duet
                to search.
            url: https://support.claude.com/en/articles/11817273-use-claude-s-chat-search-and-memory-to-build-on-previous-context
        note: >-
          Partial on the consumer rule. Disconnecting an app keeps what Duet learned from it; nothing validates
          what it writes to memory, and no recovery point or Duet-specific memory view is documented.
        verified: "2026-10-22"
      - mitigation: AML.M0036
        coverage: partial
        mechanism: Plan usage limits; background checks and larger tasks draw on the five-hour and weekly limits.
        steps:
          - title: Know what it consumes
            body:
              - Background briefs and check-ins count toward the plan's five-hour and weekly limits; ask Duet to
                check in less often if it runs into them.
            url: https://support.claude.com/en/articles/11647753-how-do-usage-and-length-limits-work
        note: >-
          Partial: the plan limit bounds total work, but no per-task time, spend or step cap is documented, and
          the check-in interval is set by the vendor.
        verified: "2026-10-22"
      - mitigation: cap-agent-egress-control
        coverage: none
        mechanism: No destination control is documented for the cloud computer or its browser.
        evidence:
          - title: Cloud browser behaviour
            url: https://support.claude.com/en/articles/17631495-get-started-with-claude-duet
        note: >-
          None documented: sites without a connector are reached through its own cloud browser, which cannot be
          watched or restricted. The organisation's only lever is at its own services (conditional access,
          OAuth app approval); revisit when Anthropic publishes the promised safety detail.
        verified: "2026-10-22"
      - mitigation: cap-input-guardrails
        coverage: partial
        mechanism: Vendor-run classifiers for sensitive data and prompt injection; content from email and web pages is treated as information.
        evidence:
          - title: Safety section of the announcement
            url: https://claude.com/resources/articles/claude-duet
          - title: Prompt-injection limits
            url: https://support.claude.com/en/articles/17631495-get-started-with-claude-duet
        note: >-
          Partial on the rule applied to every vendor: vendor-internal screening documented in general terms,
          with no setting, threshold or event anyone can see. The help article says prompt injection is still
          possible.
        verified: "2026-10-22"
      - mitigation: cap-agent-tool-registry
        coverage: external
        mechanism: No organisation view of who runs Duet; discover it from OAuth grants in the connected services.
        evidence:
          - title: Plan availability (no organisation plan)
            url: https://support.claude.com/en/articles/17631495-get-started-with-claude-duet
        note: >-
          External: a SaaS-management or OAuth-grant review in Google Workspace, Microsoft 365 and Slack is the
          only way to find work accounts connected to a personal Duet.
        verified: "2026-10-22"
      - mitigation: cap-ai-vendor-assessment
        coverage: external
        mechanism: The organisation's third-party risk process consumes Anthropic's assurance material.
        evidence:
          - title: Anthropic trust portal
            url: https://trust.anthropic.com/
          - title: Consumer Terms
            url: https://www.anthropic.com/legal/consumer-terms
        note: >-
          External. Record that Duet is a research preview under the Consumer Terms, not the Commercial Terms,
          with no Duet-specific retention, DPA or audit commitments yet.
        verified: "2026-10-22"
      - mitigation: cap-agent-tracing
        coverage: partial
        mechanism: The Tasks tab shows current work and what needs input; the main thread records finished tasks and decisions.
        steps:
          - title: Check the Tasks tab
            body:
              - Open the Tasks tab to see current work and tasks waiting on you; Duet posts finished work and
                decisions to the main thread and the Make tab.
            url: https://support.claude.com/en/articles/17631495-get-started-with-claude-duet
        note: >-
          Partial on the consumer rule, and thinner than a trace: no step-level or exportable log is documented,
          the cloud browser cannot be watched, and no organisation sees any of it.
        verified: "2026-10-22"
      - mitigation: cap-agent-kill-switch
        coverage: none
        mechanism: No pause or stop is documented; disconnecting a connector stops its future access only.
        evidence:
          - title: Get started with Claude Duet (no pause or stop documented)
            url: https://support.claude.com/en/articles/17631495-get-started-with-claude-duet
          - title: Disconnecting connectors
            url: https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities
        note: >-
          None documented as of 2026-10-22. The nearest levers are disconnecting each connector in Customize >
          Connectors (future access only; memory is kept) and declining pending approvals; neither is shown to
          halt work already running in its browser.
        verified: "2026-10-22"
    advisories: []
    sources:
      - title: Introducing Claude Duet
        url: https://claude.com/resources/articles/claude-duet
      - title: Claude Duet product page
        url: https://claude.com/product/claude-duet
      - title: Get started with Claude Duet
        url: https://support.claude.com/en/articles/17631495-get-started-with-claude-duet
      - title: Use connectors to extend Claude's capabilities
        url: https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities
      - title: How to use Link by Stripe with Claude Duet
        url: https://support.claude.com/en/articles/17666484-how-to-use-link-by-stripe-with-claude-duet
