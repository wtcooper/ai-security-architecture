      EX-AML-M0008:
        status: gap
        note: Not deployed. Ollama evaluates nothing and a pull makes a model servable at once; baseline is the
          evaluation harness run against a staging instance's /v1 endpoint, with the approved digest recorded before
          the model is allowed on devices
