# ChatGPT — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
vendor: openai
family: ChatGPT
tools:
  - id: toolChatgptDesktop
    name: ChatGPT desktop app
    surfaceClasses:
      - desktopApp
      - saasChat
    variants:
      - name: ChatGPT desktop app
        class: desktopApp
      - name: ChatGPT web
        class: saasChat
    architecture: archEnterpriseAiChat
    status: ga
    asOf: 2026-08
    summary:
      - The current desktop app bundles Chat, Work and Codex, and is governed by the same
        managed-configuration system as Codex — requirements.toml cloud policies and the
        com.openai.codex MDM domain — plus workspace admin controls for plugins, apps, memory and
        identity from the ChatGPT admin panel.
    items:
      - title: Managed deployment and update control
        body:
          - Windows ships only as a Store-signed MSIX (no MSI or standalone EXE), deployable via
            Intune, MECM or winget with offline packages available; macOS deploys from the
            enterprise DMG, with device management arriving through the com.openai.codex MDM payload
            rather than a dedicated packaging guide. The built-in updater is disabled with an
            enforced requirements.toml feature pin, targeted by group, user or platform from the
            managed-configs console.
        links:
          - title: Windows deployment
            url: https://learn.chatgpt.com/docs/enterprise/windows-deployment
          - title: Managing app updates
            url: https://learn.chatgpt.com/docs/enterprise/manage-app-updates
      - title: Workspace controls over connectors, apps and memory
        body:
          - On Enterprise and Edu workspaces, plugins and their underlying apps are disabled by
            default and enabled per role, with per-app configuration for real-time access, actions,
            approvals and domain restrictions — one control set that applies across web, mobile,
            desktop and Codex. Memory and record mode are workspace-level toggles (record off by
            default), and the Compliance Logs Platform exports immutable audit, authentication and
            usage events with 30-day source retention, so longer retention requires continuous
            export.
        links:
          - title: Apps and plugin controls for workspaces
            url: https://help.openai.com/en/articles/11509118
          - title: Compliance APIs and audit logs
            url: https://help.openai.com/en/articles/9261474
    controls: []
    sources:
      - title: ChatGPT desktop Windows deployment
        url: https://learn.chatgpt.com/docs/enterprise/windows-deployment
      - title: Codex/ChatGPT managed configuration
        url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
      - title: ChatGPT Enterprise release notes
        url: https://help.openai.com/en/articles/10128477-chatgpt-enterprise-edu-release-notes
