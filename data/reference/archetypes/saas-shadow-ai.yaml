id: archShadowAi
surface: surfaceSaas
title: Shadow AI services and extensions
abbrev: Shadow AI

summary:
  - >
    AI services in use that nobody sanctioned: consumer accounts on enterprise-grade tools, browser
    extensions with page access, and API keys expensed to a team card. Not a design — a discovered
    architecture, and the one most organisations actually have.

description:
  - >
    This archetype is drawn because the alternative is pretending it does not exist. Every other
    architecture in this catalogue assumes someone decided to build or buy it. This one assembles
    itself from individually reasonable choices: a person with a deadline, a free tier, and a
    browser. The diagram is what the environment already looks like before any governance
    programme reaches it.
  - >
    Three distinct paths carry data out, and they need different detection. A consumer account on a
    web service moves data through the browser under a personal login. A browser extension with
    host permissions reads pages continuously with no login at all. A direct API key on a corporate
    card moves data from a server or a script, never touches a browser, and shows up in expense
    data long before it shows up in network logs.
  - >
    The Governance persona's problem is that discovery is the whole control. There is no
    configuration to harden and no vendor to negotiate with, because the relationship was never
    formed. Every downstream control — DLP, tenant enforcement, contractual terms — presupposes
    knowing the service is in use, and the discovery signals are network telemetry, browser
    inventory, identity logs and expense records, which sit in four different systems owned by
    three different teams.
  - >
    The outcome that matters is not blocking. Blocking a service without providing a sanctioned
    equivalent moves the traffic to a service that is harder to see. The productive path is
    discovery, then a sanctioned tenant of the same class of tool, then enforcement that makes the
    sanctioned path the easy one — which is why this archetype's natural terminus is the enterprise
    chat archetype, and why they are drawn as a pair.

distinguishedBy:
  - >
    Against the enterprise AI chat archetype: the same traffic, on the wrong side of every control.
    That one has a tenant, terms, an admin console and an audit export. This one has none, and the
    work is finding it rather than configuring it.
  - >
    Against every other archetype here: those describe systems someone designed. This one describes
    what is discovered, and it is the only diagram in the catalogue where the governance column is
    the entire architecture rather than a plane beside it.

exemplars:
  - name: Consumer accounts on enterprise tools
    note: >
      A personal login to the same vendor the organisation may already pay for, with consumer
      retention and training terms and no administrative visibility.
    asOf: "2026-08"
  - name: AI browser extensions
    note: >
      Extensions requesting host permissions across all sites, installed in one click and updated
      silently. Reads pages continuously rather than when invoked.
    asOf: "2026-08"
  - name: Direct API keys on expense
    note: >
      A provider key paid for on a team card and used from a script or a server. Invisible to
      browser controls and usually the largest single data volume of the three.
    asOf: "2026-08"

zones:
  - id: outside
    type: outsideWorld
    personas: []
    note: >
      Providers with no contract, no tenant configuration and no relationship. Not adversaries —
      simply parties nobody agreed terms with.

  - id: workforce
    type: device
    personas: [personaEndUser]
    note: >
      Where all three paths begin, and the only place two of them are observable. Device and
      browser telemetry does most of the work in this archetype.

  - id: edge
    type: network
    personas: [personaGovernance, personaPlatformProvider]
    note: The vantage point that sees destinations regardless of which path the data took.

  - id: corp
    type: compute
    personas: [personaApplicationDeveloper]
    note: >
      Servers and scripts calling provider APIs directly. The path with no browser in it, and
      therefore no browser control on it.

  - id: governance
    type: management
    personas: [personaGovernance]
    note: >
      In this archetype the control plane is the architecture. Everything else on the diagram is
      what it is trying to find.

nodes:
  - id: consumerService
    type: apiEndpoint
    zone: outside
    label: Consumer AI service
    note: >
      Reached with a personal login. Consumer retention and training terms apply, and no
      administrator anywhere can see the account exists.
    risks: [riskShadowAndUnknownAgents, riskSensitiveDataDisclosure, riskExcessiveDataHandling]
    capabilities: [capabilityShadowAiDiscovery, capabilitySse, capabilityAiTprm]

  - id: extensionStore
    type: skillPackage
    zone: outside
    label: Extension distribution
    note: >
      Install and silent update for extensions holding page-read permissions. A supply chain with
      no enrolment step.
    risks: [riskInsecureIntegratedComponent, riskToolSourceProvenance, riskShadowAndUnknownAgents]
    capabilities: [capabilityShadowAiDiscovery, capabilityBrowserDetectionResponse, capabilityAiTprm]

  - id: providerApi
    type: inferenceEndpoint
    zone: outside
    label: Provider API
    note: >
      A model API reached with a key nobody registered. The highest-volume path and the least
      visible to anything watching browsers.
    risks: [riskShadowAndUnknownAgents, riskExcessiveDataHandlingDuringInference, riskEconomicDenialOfWallet]
    capabilities: [capabilityShadowAiDiscovery, capabilityEgressControl, capabilityAiGateway]

  - id: employee
    type: humanUser
    zone: workforce
    label: Employee
    note: >
      Solving a real problem with the tool that was available. Treating this as misconduct rather
      than as unmet demand is what pushes the next attempt somewhere harder to see.
    risks: [riskShadowAndUnknownAgents]
    capabilities: [capabilityAiGovernancePlatform]

  - id: browser
    type: browserRuntime
    zone: workforce
    label: Browser
    note: >
      Carries two of the three paths — the consumer login and the extension. The single most
      valuable place to instrument on this diagram.
    risks: [riskSensitiveDataDisclosure, riskShadowAndUnknownAgents]
    capabilities: [capabilityBrowserDetectionResponse, capabilityAiDlp, capabilitySse]

  - id: extension
    type: skillPackage
    zone: workforce
    label: Installed extension
    note: >
      Reads pages whether or not it is being used. Its permission grant was one click and its
      updates need none.
    risks: [riskInsecureIntegratedComponent, riskSensitiveDataDisclosure]
    capabilities: [capabilityBrowserDetectionResponse, capabilityShadowAiDiscovery, capabilityAiGovernancePlatform]

  - id: sse
    type: egressProxy
    zone: edge
    label: Secure service edge
    note: >
      Sees destinations for every path, and content for the ones where inspection is terminated.
      The backstop when device controls are absent or bypassed.
    risks: [riskSensitiveDataDisclosure, riskShadowAndUnknownAgents]
    capabilities: [capabilitySse, capabilityEgressControl, capabilityAiDlp]

  - id: script
    type: apiEndpoint
    zone: corp
    label: Scripts and services
    note: >
      Code calling a provider directly. No browser, no login, no user — and frequently the largest
      volume of data leaving.
    risks: [riskShadowAndUnknownAgents, riskExcessiveDataHandling]
    capabilities: [capabilityEgressControl, capabilityAiSpm, capabilityShadowAiDiscovery]

  - id: keyOnCard
    type: credentialStore
    zone: corp
    label: Unregistered API keys
    note: >
      Expensed, shared, and long-lived. Expense data usually finds these months before network
      analysis does, which makes finance a security telemetry source here.
    risks: [riskShadowAndUnknownAgents, riskSensitiveDataDisclosure, riskEconomicDenialOfWallet]
    capabilities: [capabilitySecretsManagement, capabilityShadowAiDiscovery, capabilityNhiManagement]

  - id: discovery
    type: registry
    zone: governance
    label: Discovery
    note: >
      Correlating network telemetry, browser inventory, identity logs and expense records. Four
      signals in four systems, and no one of them sees all three paths.
    risks: [riskShadowAndUnknownAgents]
    capabilities: [capabilityShadowAiDiscovery, capabilityAiSpm, capabilityAiTprm]

  - id: inventory
    type: registry
    zone: governance
    label: AI service inventory
    note: >
      What discovery found, triaged into sanction, replace or block. The artifact that turns a scan
      result into a programme.
    risks: [riskShadowAndUnknownAgents]
    capabilities: [capabilityAiGovernancePlatform, capabilityAiTprm, capabilityAgentRegistry]

  - id: sanctionedPath
    type: policyEngine
    zone: governance
    label: Sanctioned alternative
    note: >
      A supported tenant of the same class of tool. Drawn as a control because it is one: blocking
      without it relocates the traffic rather than stopping it.
    risks: [riskShadowAndUnknownAgents]
    capabilities: [capabilityAiGovernancePlatform, capabilityIga, capabilityAiTprm]

  - id: response
    type: auditSink
    zone: governance
    label: Detection and response
    note: >
      What happens when discovery finds something already carrying regulated data. The part that is
      an incident rather than a policy conversation.
    risks: [riskSensitiveDataDisclosure]
    capabilities: [capabilityAiDetectionResponse, capabilityAuditLogging, capabilityAiDlp]

edges:
  - from: employee
    to: browser
    label: uses what is available

  - from: browser
    to: sse
    label: outbound traffic
    control:
      kind: postureInspection
      note: >
        An unmanaged or personal device carries the same traffic with none of this, which is why
        discovery cannot rely on the endpoint alone.
    risks: [riskSensitiveDataDisclosure]

  - from: extension
    to: browser
    label: reads every page
    control:
      kind: admission
      note: >
        One click, all sites, permanent. The broadest standing grant in this catalogue and the
        least deliberated.
    risks: [riskSensitiveDataDisclosure, riskInsecureIntegratedComponent]

  - from: extensionStore
    to: extension
    label: install and silent update
    control:
      kind: admission
      note: >
        No enrolment, no approval, and no notification on update. The extension that is reviewed is
        not necessarily the extension that runs next week.
    risks: [riskInsecureIntegratedComponent, riskToolSourceProvenance]

  - from: sse
    to: consumerService
    label: personal-account traffic
    control:
      kind: brokeredCredential
      note: >
        Authenticated to the provider and anonymous to the organisation. No contract governs what
        happens to anything sent here.
    risks: [riskSensitiveDataDisclosure, riskExcessiveDataHandling]

  - from: keyOnCard
    to: script
    label: provider credential
    kind: control
    risks: [riskShadowAndUnknownAgents]

  - from: script
    to: providerApi
    label: direct API traffic
    control:
      kind: brokeredCredential
      note: >
        Server to server, no browser, no user identity. Invisible to every browser control on this
        diagram and often the largest volume of the three paths.
    risks: [riskShadowAndUnknownAgents, riskExcessiveDataHandlingDuringInference]

  - from: discovery
    to: sse
    label: network signal
    kind: control
    control:
      kind: discovery
      note: Sees destinations for all three paths, and content only where inspection terminates.
    risks: [riskShadowAndUnknownAgents]

  - from: discovery
    to: extension
    label: browser inventory
    kind: control
    control:
      kind: discovery
      note: >
        The only signal that finds an extension reading pages it was never invoked on, because that
        traffic looks like the page load it is attached to.
    risks: [riskShadowAndUnknownAgents]

  - from: discovery
    to: keyOnCard
    label: expense correlation
    kind: control
    control:
      kind: discovery
      note: >
        The signal that finds the direct-API path, and it lives in a system no security team owns.
        Worth arranging access to before it is needed.
    risks: [riskShadowAndUnknownAgents]

  - from: discovery
    to: inventory
    label: findings

  - from: inventory
    to: sanctionedPath
    label: triage to a supported tool

  - from: sanctionedPath
    to: browser
    label: makes the sanctioned path the easy one
    kind: control
    control:
      kind: admission
      note: >
        The only durable outcome. Enforcement without a supported alternative relocates the traffic
        to something that is harder to find than what was blocked.
    risks: [riskShadowAndUnknownAgents]

  - from: inventory
    to: response
    label: escalation

  - from: response
    to: sse
    label: containment
    kind: control
    control:
      kind: egressAllowlist
      note: >
        Applied where discovery finds regulated data already in transit. A blunt instrument, and
        the right one at that point.
    risks: [riskSensitiveDataDisclosure]

crossCutting:
  - risk: riskShadowAndUnknownAgents
    note: >
      This archetype is that risk drawn as an architecture. Every node exists because the risk
      materialised somewhere, and the governance column exists because nothing else will find it.
  - risk: riskSensitiveDataDisclosure
    note: >
      Three paths, three different detection signals, three different owners. Covering one and
      declaring the problem solved is the most common failure here.
  - risk: riskInsecureIntegratedComponent
    note: >
      Extensions and unvetted services are third-party code and third-party processing with no
      assurance behind either, because no relationship was ever formed to hang assurance on.

risks:
  - riskShadowAndUnknownAgents
  - riskSensitiveDataDisclosure
  - riskExcessiveDataHandling
  - riskInsecureIntegratedComponent
  - riskToolSourceProvenance
  - riskExcessiveDataHandlingDuringInference
  - riskEconomicDenialOfWallet
  - riskInferredSensitiveData

capabilities:
  - capabilityShadowAiDiscovery
  - capabilitySse
  - capabilityBrowserDetectionResponse
  - capabilityAiDlp
  - capabilityEgressControl
  - capabilityAiTprm
  - capabilityAiGovernancePlatform
  - capabilityAiSpm
  - capabilitySecretsManagement
  - capabilityNhiManagement
  - capabilityIga
  - capabilityAgentRegistry
  - capabilityAuditLogging
  - capabilityAiDetectionResponse
  - capabilityAiGateway

deviations:
  - subject: This is drawn as an architecture although nobody designed it
    reason: >
      Every other archetype in the catalogue describes an intended system. This one describes what
      is found. It is included because the discovered environment is the one the controls have to
      work in, and because leaving it out would let the catalogue imply that all AI use in an
      organisation was chosen.
  - subject: The governance column carries most of the nodes
    reason: >
      Inverted from every other diagram here, and correct: there is no configuration to harden and
      no vendor to negotiate with, so discovery and triage are not a plane beside the architecture,
      they are the architecture.
  - subject: A sanctioned alternative is drawn as a control node
    reason: >
      It is a procurement decision rather than a security product, so it does not obviously belong
      on a security diagram. It is drawn because the evidence is consistent that enforcement
      without it relocates traffic instead of reducing it, which makes it load-bearing for every
      other control on the diagram.

sources:
