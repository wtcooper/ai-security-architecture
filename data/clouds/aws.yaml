  - id: smEndpointPerTier
    name: "One endpoint per sensitivity tier (ProductionVariants)"
    where: "SageMaker AI › CreateEndpointConfig ProductionVariants (InstanceType, InitialInstanceCount); one endpoint configuration per tier"
    setVia: [apiCli]
    area: network
    default: "You choose what each endpoint hosts"
    recommended: "Deploy each sensitivity tier to its own endpoint and endpoint configuration; do not co-host tiers as inference components or containers on one endpoint."
    value: "Own endpoint per sensitivity tier, no co-hosting"
    why: "Models sharing an endpoint share its instances and GPUs. A separate endpoint gives each tier its own instances, as a tainted node pool did on EKS."
    mitigations: [D3-HBPI]
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/realtime-endpoints-deploy-models.html
    verified: "2026-11-18"
  - id: smModelPackageDeploy
    name: "Deploy from the approved model package (ModelPackageName)"
    where: "SageMaker AI › CreateModel Containers.ModelPackageName (the approved version ARN in Model Registry); digest check in the deployment pipeline"
    setVia: [apiCli, code]
    area: data
    default: "A model can point at any S3 location"
    recommended: "Create the model from the approved model package ARN, never from a bare S3 path, after the pipeline has checked the artifact's SHA-256 and signature against the registry record."
    value: "Approved model package ARN only, never an S3 path"
    why: "There is no init container to hash the weights: SageMaker copies them in itself. Deploying by package ARN ties the endpoint to the approved version, and the pipeline does the check."
    mitigations: [AML.M0014]
    requires: "For weights above 40 GB, a raised model download timeout (ModelDataDownloadTimeoutInSeconds) and, if health checks time out, a raised ContainerStartupHealthCheckTimeoutInSeconds"
