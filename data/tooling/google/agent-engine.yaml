# Gemini Enterprise Agent Platform Agent Runtime (formerly Vertex AI Agent Engine) — one entity per product ×
# reference architecture. Facts are dated (asOf) and cite the vendor's own documentation; re-verify before enforcing.
# Schema: data/tooling/README.md.
# Excluded: the Gemini Enterprise app (the employee chat and agent product — enterprise AI chat, not this runtime),
# Agent Studio (the low-code builder — the UI/low-code runtime sibling), CodeMender, RAG Engine and Vector Search
# (services an agent calls, not the runtime). Agent Identity, Agent Registry, Agent Gateway and Model Armor are the
# platform's governance planes and are recorded on this entity's rows, not as entities. The Pre-GA Managed Agents API
# (Antigravity harness) is a variant: same platform, project, IAM and billing.
# 2026-09-25: onboarded toolVertexAgentEngine against the MITRE capability rules; the Agent Engine overview
# (cloud.google.com and docs.cloud.google.com vertex-ai/generative-ai/docs/agent-engine/overview, agent-builder/
# agent-engine/overview) now lands on docs.cloud.google.com/gemini-enterprise-agent-platform/scale;
# vertex-ai/generative-ai/docs/data-governance → .../resources/zero-data-retention; vertex-ai/docs/general/audit-logging
# → .../machine-learning/general/audit-logging; resource-manager/docs/organization-policy/restricting-service-accounts
# → organization-policy/restrict-service-accounts; a fetch without Accept-Language may bounce to a machine-translated
# ?hl= locale, so read with hl=en; vertex-ai/docs/general/custom-constraints and .../scale/runtime/quotas 404. Pages
# disagree on Agent Gateway with VPC-SC (manage-agent-access: unsupported; 2026-09-09 release note: supported for
# gateways created after 2026-09-08).
vendor: google
family: Gemini Enterprise Agent Platform (Vertex AI Agent Engine)
tools:
  - id: toolVertexAgentEngine
    name: Gemini Enterprise Agent Platform Agent Runtime (Vertex AI Agent Engine)
    surfaceClasses:
      - managedRuntime
    variants:
      - name: >-
          Agent Runtime (ReasoningEngine resource): our agent code — ADK, LangChain, LangGraph, AG2, LlamaIndex, A2A or
          any container meeting the runtime contract — with Sessions, Memory Bank and sandboxes
        class: managedRuntime
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/runtime
      - name: Managed Agents API on Agent Platform (Agents API + Interactions API, Antigravity harness)
        class: managedRuntime
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/managed-agents
        note: >-
          Pre-GA and not for production or confidential data: a config-only agent (base_agent
          antigravity-preview-05-2026, global location only) in an isolated Linux sandbox per env_id with
          network off by default; an interaction's tools and MCP servers replace the agent's for that turn.
    architecture: archManagedAgentRuntime
    status: ga
    asOf: "2026-09"
    summary:
      - >-
        Google Cloud's managed agent runtime, renamed on 2026-04-22 from Vertex AI Agent Engine to Agent
        Runtime on the Gemini Enterprise Agent Platform (the API resource is still ReasoningEngine on
        aiplatform.googleapis.com). Our own agent code is deployed from source files, a Dockerfile, an
        Artifact Registry image or a Developer Connect Git link and served as query and streamQuery endpoints:
        the loop is ours, while the container, scaling (operations up to 7 days), Agent Platform Sessions,
        Memory Bank, the Code Execution, Shell and Computer Use sandboxes and telemetry are Google's. The
        Pre-GA Managed Agents API adds a config-only variant on Google's Antigravity harness.
      - >-
        Governance is Google Cloud's own control plane: a SPIFFE agent identity per agent with
        certificate-bound tokens, IAM allow, deny and Principal Access Boundary policies on it, Agent Registry
        as the inventory, Agent Gateway as a default-deny enforcement point for IAM Unified Access Policies,
        Model Armor and Semantic Governance (Preview), an org-policy constraint that pins agents to approved
        gateways, Model Armor floor settings over Gemini calls, revisions with percentage traffic split
        (Preview), OpenTelemetry into our project, VPC-SC, a PSC interface and CMEK. Missing: a runtime
        approval pause, a documented interrupt of a running query, and egress substitution of third-party
        credentials — the auth manager hands tokens to the agent's own process.
    facts:
      - label: Plans
        value: >-
          Google Cloud pay-as-you-go: Agent Compute $0.085 per vCPU-hour after 50 free hours a month and Agent
          Memory $0.009 per GiB-hour after 100 free GiB-hours, one SKU set for all Scale products (Runtime,
          Sessions, Memory Bank, sandboxes); model tokens are billed separately. The Managed Agents API is
          Pre-GA.
        url: https://cloud.google.com/products/gemini-enterprise-agent-platform/pricing
      - label: Inference & routing
        value: >-
          Whatever the agent's code calls: Gemini and Model Garden models on Agent Platform (locational,
          jurisdictional multi-region or global endpoints — a global endpoint may process anywhere and gives
          no residency guarantee) or an external model. Inference is inside Google, not behind our AI gateway;
          Model Armor floor settings are the tenant-side screen for Gemini calls.
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/resources/data-residency
      - label: Data leaving the device
        value: >-
          The agent runs in a Google-managed network in a Google-owned tenant project, so its code,
          environment variables, session events, memories, sandbox files and telemetry sit with Google; a PSC
          interface routes its egress into our VPC, and an Agent-to-Anywhere gateway TLS-inspects every
          outbound call.
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/private-service-connect-interface
      - label: Retention & training
        value: >-
          No training or fine-tuning on customer data without permission. Stateful by design: Sessions and
          Memory Bank keep data until TTL or deletion (see the memory row); for zero data retention, don't use
          sandbox snapshots, and Gemini calls carry abuse-monitoring prompt logging and 24-hour in-memory
          caching unless the page's conditions are met.
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/resources/zero-data-retention
      - label: Docs index
        value: >-
          docs.cloud.google.com/gemini-enterprise-agent-platform (Build, Scale, Govern, Optimize); old Agent
          Engine URLs redirect to /scale
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/overview
      - label: Network requirements
        value: >-
          Public internet by default; a PSC interface (psc_interface_config with a network attachment on a /28
          subnet and DNS peering) routes egress into our VPC; with VPC-SC the perimeter blocks public internet
          unless our VPC provides a proxy; an Agent Gateway binding sends all egress, platform APIs included,
          through the gateway.
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/private-service-connect-interface
      - label: Naming
        value: >-
          2026-04-22: Vertex AI became part of Gemini Enterprise Agent Platform, Agent Engine became Agent
          Runtime and Agent Builder Sessions became Agent Platform Sessions; SDK 2.0.1 moved
          vertexai.agent_engines to agentplatform.Client().runtimes.
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/release-notes
    items:
      - title: Make the gateway a floor, then choose it over revisions
        body:
          - >-
            A custom org-policy constraint on aiplatform.googleapis.com/ReasoningEngine (CREATE, UPDATE) can
            require spec.deploymentSpec.agentGatewayConfig.agentToAnywhereConfig.agentGateway to name an
            approved gateway, and a gateway binding forces identity_type AGENT_IDENTITY. Agent Gateway cannot
            be attached to agents that use revisions, cannot bind engines created before 2026-04-29, and every
            agent in a project and region must use the same egress gateway — plan projects around it.
        links:
          - title: Route Agent Runtime traffic through Agent Gateway
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/agent-gateway-runtime-deploy
      - title: Set agent identity at creation and clean up bindings on deletion
        body:
          - >-
            identity_type AGENT_IDENTITY cannot be patched onto an existing engine. A redeploy creates a new
            reasoningEngines ID and so a new principal; deleting an agent leaves its IAM bindings as inactive
            grants. Grant baseline roles to the project principalSet and keep principal:// bindings for
            sensitive data.
        links:
          - title: Use agent identity with Agent Runtime
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/agent-identity
          - title: Agent Identity overview
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/agent-identity-overview
    riskNotes:
      - risk: riskAgenticDelegationConfusedDeputy
        note: >-
          Without agent identity every agent in a project runs as the shared AI Platform Reasoning Engine
          Service Agent; Unit 42 (2026-03) and XM Cyber (2026-01) showed agent code reading that identity's
          token from the metadata server to reach buckets, sessions and memories beyond the agent's own.
      - risk: riskStaleAgentIdentityBinding
        note: >-
          Deleting an agent leaves every binding to its principal in IAM policies, and a redeployed agent gets
          a new principal, so delete-and-recreate pipelines leave orphaned grants and silently lose access.
      - risk: riskShadowAndUnknownAgents
        note: >-
          Agent Registry auto-registers Agent Runtime agents only in their own project; agents in other
          projects need manual registration, and a non-A2A agent registers without endpoint, identity or
          skills.
      - risk: riskPromptInjection
        note: >-
          Memory Bank writes LLM-extracted memories from conversation events and feeds them into later
          sessions; the docs name memory poisoning and point to Model Armor, which only screens what passes a
          gateway or a Gemini call.
      - risk: riskToolSourceProvenance
        note: >-
          Agent Registry does not introspect a manually registered MCP server's tools — tool-level policies
          match the toolspec.json we upload — and Model Armor passes tools/list unscreened, so a changed tool
          description is not caught.
      - risk: riskRogueActions
        note: >-
          The default split, trafficSplitAlwaysLatest, sends all traffic to every new revision the moment it
          exists; set a manual split before shipping.
      - risk: riskSensitiveDataDisclosure
        note: >-
          CMEK does not cover display names, descriptions, service-account emails, class method names or
          environment variables, and content capture writes prompts, responses and user.id to Cloud Logging or
          Cloud Storage.
    controls:
      - mitigation: D3-MFA
        coverage: native
        mechanism: >-
          Google Workspace / Cloud Identity 2-Step Verification enforcement (Admin console > Security >
          Authentication > 2-step verification > Enforcement) on the accounts that can deploy or change
          agents, gateways, Model Armor floors and IAM; Google Cloud session control reauthentication with a
          security key; Google Cloud's own 2SV requirement for the console
        steps:
          - title: Enforce 2-Step Verification on agent administrators
            body:
              - >-
                In the Admin console go to Security > Authentication > 2-step verification, select the
                organizational unit or group holding Agent Platform administrators and deploying identities,
                check Allow users to turn on 2-Step Verification and set Enforcement to On.
            url: https://knowledge.workspace.google.com/admin/security/deploy-2-step-verification
          - title: Require security-key reauthentication for Google Cloud
            body:
              - >-
                Admin console > Security > Access and data control > Google Cloud session control: Require
                reauthentication at 1 to 24 hours with Reauthentication method Security key; it applies to the
                console and the gcloud CLI.
            url: https://knowledge.workspace.google.com/admin/security/set-session-length-for-google-cloud-services
          - title: Close the key path
            body:
              - >-
                Enforce iam.managed.disableServiceAccountKeyCreation so no one mints long-lived
                service-account keys that can update a ReasoningEngine without a second factor.
            url: https://docs.cloud.google.com/organization-policy/restrict-service-accounts
        note: >-
          Rated native on the MFA rule applied to every vendor (as on toolBedrockAgentcore): Google's own
          account layer can require a second factor for everyone who can deploy, update or delete an agent or
          change its IAM, gateway or Model Armor floor. That holds for Google-managed Workspace and Cloud
          Identity accounts; where the organisation federates to a third-party IdP (SSO or Workforce Identity
          Federation) the factor is the IdP's, which is partial for that organisation. Google Cloud's own 2SV
          requirement covers the console only (Cloud Identity accounts from 2026-10-20, federated accounts to
          be announced); gcloud asks for the factor only once the account has 2SV. Paths around it:
          service-account keys, federated workload tokens and any CI identity holding
          aiplatform.reasoningEngines.update. End-user MFA — which of our people a session runs for — is our
          front end's; Agent Runtime authenticates the calling workload.
        verified: "2026-09-25"
      - mitigation: cap-agent-tool-registry
        coverage: native
        mechanism: >-
          reasoningEngines list and get (console Deployments page with an Identity column, gcloud ai
          reasoning-engines describe), runtimeRevisions list, Agent Registry auto-registration of Agent
          Runtime agents plus registered MCP servers and endpoints; IAM on aiplatform.reasoningEngines.create
          / update / delete; custom org-policy constraints on aiplatform.googleapis.com/ReasoningEngine for
          CREATE and UPDATE
        steps:
          - title: Inventory from the platform
            body:
              - >-
                List agents with reasoningEngines.list (console Agent Platform Deployments page) and each
                agent's revisions with runtimeRevisions.list; put owner and environment in labels at deploy.
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/manage-deployed-agents
          - title: Register the rest of the estate
            body:
              - >-
                SDK-deployed Agent Runtime agents register in Agent Registry automatically, same project only;
                register agents from other projects, MCP servers (with a toolspec.json) and endpoints with
                gcloud agent-registry services create.
            url: https://docs.cloud.google.com/agent-registry/register-agents
          - title: Gate who can deploy
            body:
              - >-
                Grant aiplatform.reasoningEngines.create, update and delete only to the release pipeline's
                identity — roles/aiplatform.user carries them — so a definition reaches the runtime only
                through review.
            url: https://docs.cloud.google.com/iam/docs/roles-permissions/aiplatform
          - title: Constrain what may be deployed
            body:
              - >-
                Apply a custom constraint on aiplatform.googleapis.com/ReasoningEngine with method_types
                CREATE and UPDATE (the documented example requires an approved Agent Gateway) with gcloud
                org-policies set-custom-constraint and set-policy.
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/agent-gateway-runtime-deploy
        note: >-
          Native on the registry rule (as on toolBedrockAgentcore): a listable inventory of agents, revisions
          and identities, and the tenant gates create and update by IAM and org policy. Not an approval
          workflow: registration records, it does not approve, and anyone holding roles/aiplatform.user can
          deploy (XM Cyber's 2026 finding started from aiplatform.reasoningEngines.update). "Unregistered
          means denied" holds only for egress through an Agent Gateway. Auto-registration is per project, and
          a non-A2A agent registers without endpoint or skills. In the Managed Agents API an interaction can
          replace the agent's tools and MCP servers, so a call can run a configuration the registry never saw.
        verified: "2026-09-25"
      - mitigation: cap-staged-rollout-gate
        coverage: partial
        mechanism: >-
          runtimeRevisions (an immutable snapshot on every versioned-field change), trafficConfig
          trafficSplitManual percentages or trafficSplitAlwaysLatest (the default), a per-revision query path;
          the Evaluation Service and online monitors beside the release (revisions are Preview, v1beta1)
        steps:
          - title: Set a manual split before shipping
            body:
              - >-
                Govern > Deployments > agent > Revisions > Manage traffic > Split mode Manual (trafficConfig
                trafficSplitManual) so a new revision starts at 0% instead of taking all traffic under Always
                latest.
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/manage-revisions-and-traffic
          - title: Evaluate the candidate revision first
            body:
              - >-
                Query it on runtimeRevisions/REVISION_ID:query, which bypasses the split, with Evaluation
                Service cases and simulated users, then raise its percentage.
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/optimize/evaluation/agent-evaluation
          - title: Watch and roll back by pointer
            body:
              - >-
                Run online monitors over the live traces (scored about every 10 minutes) and set the previous
                revision back to 100% in trafficSplitManual on regression.
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/optimize/evaluation/evaluate-online
        note: >-
          Partial: versioning, percentage canary and one-step rollback exist (Preview), but the evaluation is
          not in the promotion path — the Evaluation Service and online monitors score beside the release,
          nothing holds a split until they pass, and no automated rollback is documented. Rated partial where
          toolBedrockAgentcore is native because AgentCore's evaluation step sits in its promote flow; here
          moving traffic is an ordinary update. The default split sends 100% to each new revision, direct
          revision queries bypass the split, and an agent bound to Agent Gateway cannot use revisions, so an
          organisation chooses between the gateway's policy and canary releases. IAM grants, gateway policies
          and Model Armor templates are not versioned with the agent.
        verified: "2026-09-25"
      - mitigation: D3-AA
        coverage: native
        mechanism: >-
          identity_type AGENT_IDENTITY mints a SPIFFE principal per ReasoningEngine
          (principal://agents.global.org-ORG_ID.system.id.goog/resources/aiplatform/projects/N/locations/L/reasoningEngines/ID)
          with an auto-rotated 24-hour X.509 certificate and certificate-bound tokens under a Google-managed
          Context-Aware Access policy; listed as spec.effectiveIdentity
        steps:
          - title: Deploy every agent with its own identity
            body:
              - >-
                Set identity_type AGENT_IDENTITY in client.runtimes.create (".agent_engine_config.json" for
                adk deploy, agents-cli deploy --agent-identity, identity_type in
                google_vertex_ai_reasoning_engine); it cannot be patched onto an existing engine.
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/agent-identity
          - title: Grant, deny and bound per principal
            body:
              - >-
                Bind roles to the agent's principal:// identifier, baseline roles to the project principalSet,
                and cap it with an IAM deny policy or a Principal Access Boundary (gcloud iam
                principal-access-boundary-policies bindings create).
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/agent-identity
          - title: Inventory the identities
            body:
              - >-
                Read spec.effectiveIdentity (gcloud ai reasoning-engines describe ID --format
                "value(spec.effectiveIdentity)") or the Identity column on Deployments, and leave
                GOOGLE_API_PREVENT_AGENT_TOKEN_SHARING_FOR_GCP_SERVICES at its default so tokens stay bound.
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/agent-identity
        note: >-
          Native on the architecture rule: the platform mints, inventories and lets us revoke a principal per
          agent, separate from users and from the project's service accounts — the layer the pin says to
          select for. It is opt-in: without identity_type an agent runs as the shared AI Platform Reasoning
          Engine Service Agent (service-N@gcp-sa-aiplatform-re) or a custom service account, and
          manage-agent-access still labels agent identity Preview (a gateway binding forces it). Revocation is
          IAM's: deleting an agent leaves its bindings, and a redeploy gets a new principal. The identity
          authenticates to Google APIs and through Agent Gateway; a third-party tool sees whatever credential
          the auth manager issued. The Managed Agents API documents no per-agent principal.
        verified: "2026-09-25"
      - mitigation: D3-CTS
        coverage: partial
        mechanism: >-
          Agent Identity auth manager auth providers (3-legged OAuth per end user, 2-legged OAuth, API key) in
          a Google-managed vault, each gated by IAM on the agent's SPIFFE ID (roles/agentidentity.user on the
          provider), retrieved by the agent and attached by ADK; certificate-bound Google Cloud tokens (mTLS,
          DPoP beyond the gateway); Secret Manager references in env_vars
        steps:
          - title: Keep third-party credentials in auth providers
            body:
              - >-
                Create them with gcloud agent-identity auth-providers create (--three-legged-oauth-* for
                user-delegated access) and grant only this agent's principal roles/agentidentity.user on the
                provider.
            url: https://docs.cloud.google.com/iam/docs/auth-with-3lo-v2
          - title: Keep Google API tokens bound to the agent
            body:
              - >-
                Leave the default Context-Aware Access policy on — do not set
                GOOGLE_API_PREVENT_AGENT_TOKEN_SHARING_FOR_GCP_SERVICES to False — so a token used outside the
                agent's runtime fails with 401.
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/agent-identity
        note: >-
          Partial on the vault rule applied to every vendor (toolBedrockAgentcore is native only on its
          gateway, which injects outside the agent): scoping is real — per end user (3LO), per agent (IAM on
          each provider) and, for Google APIs, bound to the agent's certificate — but the auth manager returns
          the credential to the agent's own process, where ADK sets the header; it is not substituted at
          egress. Decrypt-at-the-gateway is documented only for Gemini Enterprise connectors behind Agent
          Gateway. Secret Manager references in env_vars become environment variables of every instance,
          shared by all its sessions. Model-generated code runs in sandboxes with no ambient credentials; the
          agent's own function tools run beside the credential.
        verified: "2026-09-25"
      - mitigation: cap-agent-action-policy-enforcement
        coverage: native
        mechanism: >-
          Agent Gateway in Agent-to-Anywhere mode (governedAccessPath AGENT_TO_ANYWHERE) enforcing IAM Unified
          Access Policies through IAP — default deny, allow and deny rules in CEL over the agent principal,
          MCP server, tool name and annotations, endpoint host, path and method, iamEnforcementMode DRY_RUN or
          ENFORCE — plus custom authorization extensions and Semantic Governance (Preview); custom constraint
          custom.allowlistedEgressAgentGatewaysForAgentEngine; Model Armor floor settings
        steps:
          - title: Create an egress gateway that authorises through IAP
            body:
              - >-
                Console Agent Gateway page > create in Agent-to-Anywhere mode with Access Authorization set to
                IAP; test with iamEnforcementMode DRY_RUN (denials logged to Cloud Audit Logs), then remove it
                to enforce.
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/gateways/set-up-agent-gateway
          - title: Write per-tool allow and deny rules
            body:
              - >-
                gcloud iam access-policies create with rules on
                destination.agent_registry.mcp_server.tool.name and tool.annotations.read_only_hint or
                destructive_hint, bound with gcloud iam policy-bindings create after turning off
                constraints/iam.managed.disableAccessPolicyBindings; deny overrides allow.
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/policies/configure-iam-policies-uap
          - title: Make the gateway binding mandatory
            body:
              - >-
                Enforce a custom constraint on aiplatform.googleapis.com/ReasoningEngine requiring
                agentToAnywhereConfig.agentGateway in an approved list (gcloud org-policies set-policy; up to
                15 minutes to take effect).
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/agent-gateway-runtime-deploy
          - title: Set the Model Armor floor
            body:
              - >-
                gcloud model-armor floorsettings update --add-integrated-services=VERTEX_AI and
                --vertex-ai-enforcement-type=INSPECT_AND_BLOCK on the project; set template-conformance floors
                at the organisation or folder with the API.
            url: https://docs.cloud.google.com/model-armor/configure-floor-settings
        note: >-
          Native on the architecture rule: a declarative per-call policy evaluated by the provider at its tool
          gateway, default-deny, plus tenant floors — the org-policy gateway binding and Model Armor floor
          settings — that a builder without IAM admin on the gateway project cannot lower. CEL sees principal,
          destination, MCP method, tool name and annotations, not arguments: argument rules need a custom
          authorization extension (our service) or Semantic Governance, which is an LLM verdict in Preview,
          and there is no escalate-to-human outcome. The gateway sees network calls only; on Agent Runtime
          every tool is our code, so work done inside the agent's process, in sandboxes or by Google-side
          tools is outside it, and a result our application executes returns unevaluated. Unavailable to
          engines created before 2026-04-29 and to agents using revisions.
        verified: "2026-09-25"
      - mitigation: AML.M0031
        coverage: native
        mechanism: >-
          Memory Bank scope dictionaries isolating memories per identity; IAM Conditions on
          aiplatform.googleapis.com/memoryScope and aiplatform.googleapis.com/sessionUserId; memoryViewer /
          memoryEditor roles and the agent's default agentContextEditor; ttl_config (default_ttl,
          granular_ttl); memory revisions with rollback and disable_memory_revisions; DeleteMemory; Sessions
          ttl / expire_time
        steps:
          - title: Scope memories and restrict who reads them
            body:
              - >-
                Generate and retrieve with a per-user scope such as {"user_id": ...} and grant memory roles
                with a condition on api.getAttribute('aiplatform.googleapis.com/memoryScope', {}); sessions
                take the same condition on sessionUserId.
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/memory-bank/iam-conditions
          - title: Make memories expire
            body:
              - >-
                Set ttl_config.default_ttl (or granular_ttl create_ttl, generate_created_ttl,
                generate_updated_ttl) on the Memory Bank — without it memories never expire — and a ttl on
                each session (default 365 days).
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/memory-bank/setup
          - title: Audit and roll back
            body:
              - >-
                Keep revisions on (memory_revision_default_ttl 365 days), list them to see what was extracted,
                and call client.memory_banks.memories.rollback or delete on poisoned memories.
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/memory-bank/revisions
        note: >-
          Native on the memory rule: scope, write permission, expiry, rollback and deletion are all settable.
          Isolation holds only if our application derives scope and user ID from the authenticated user — both
          are request fields — and the default agentContextEditor role reaches all of that agent's own
          sessions and memories. Contents are not validated: memories are LLM-extracted and consolidated into
          later turns, and the docs put memory poisoning on Model Armor, which sees only what a gateway or
          template routes to it. Sessions and Memory Bank write no Cloud Logging entries of their own; global
          endpoints may process generation out of region.
        verified: "2026-09-25"
      - mitigation: cap-ai-vendor-assessment
        coverage: external
        mechanism: >-
          The organisation's TPRM platform, consuming Google Cloud's compliance reports (Compliance Reports
          Manager), the services-in-scope and HIPAA covered-products lists, and the Agent Platform ZDR and
          Access Transparency pages
        evidence:
          - title: >-
              Google Cloud services in scope by compliance program (Gemini Enterprise Agent Platform: ISO
              27001/27017/27018, SOC 1/2/3, PCI DSS, penetration testing; last modified 2026-07-16)
            url: https://cloud.google.com/security/compliance/services-in-scope
          - title: HIPAA covered products (Gemini Enterprise Agent Platform, Model Armor listed)
            url: https://cloud.google.com/security/compliance/hipaa
          - title: Agent Platform and zero data retention
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/resources/zero-data-retention
          - title: Access Transparency for Agent Platform (Agent Engine listed)
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/general/access-transparency
          - title: Google Cloud compliance resource center
            url: https://cloud.google.com/compliance
        note: >-
          External: the assessment is the organisation's TPRM process; Google publishes the evidence. The
          platform is in scope for ISO 27001/27017/27018, SOC 1/2/3 and PCI DSS and on the HIPAA
          covered-products list, but Agent Runtime, Sessions and Memory Bank are not broken out, so confirm
          component scope in the reports and the BAA. Access Transparency covers Agent Engine. Pre-GA pieces —
          the Managed Agents API (no confidential data), revisions, Semantic Governance, agent identity — sit
          under Pre-GA terms. Re-assess on the platform's cadence: the April 2026 rename moved features
          between products and SDKs.
        verified: "2026-09-25"
      - mitigation: D3-EI
        coverage: partial
        mechanism: >-
          Agent Runtime containers per deployed agent (min_instances, max_instances, container_concurrency
          default 9) in a Google-managed network; Agent Platform sandboxes the agent's code creates — Code
          Execution (no network, state up to 14 days), Shell, Computer Use and custom containers (7 days) —
          each isolated by container sandboxing; Managed Agents API sandbox per env_id
        steps:
          - title: Run generated code in a sandbox, not the runtime
            body:
              - >-
                Create a Code Execution sandbox (client.sandboxes.create) for model-written code: limited file
                system, no network, no libraries beyond the preinstalled set.
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sandbox/code-execution-overview
          - title: Tie sandbox lifetime to the session
            body:
              - >-
                Create one sandbox per session with config.ttl and delete it when the session ends
                (client.sandboxes.delete), pausing idle ones rather than sharing them.
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sandbox/manage-sandboxes
          - title: Separate trust boundaries by agent and project
            body:
              - >-
                One instance serves up to container_concurrency sessions at once, so deploy untrusted
                workloads as separate agents and projects rather than relying on the container between
                sessions.
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/deploy-an-agent
        note: >-
          Partial on the isolation rule (a per-session sandbox, reclaimed after): the sandbox boundary is
          documented — each isolated from other sandboxes and the host, no ambient credentials — but
          per-session binding is our code's choice, sandboxes persist 7 to 14 days and can be shared, and the
          agent's loop and function tools run in runtime containers serving several sessions at once. Rated
          partial where toolBedrockAgentcore, a microVM per session around the loop, is native.
          installation_scripts run as root at build. Managed Agents API: one sandbox per env_id, shared by any
          interaction or agent passing the same env_id, 7-day TTL.
        verified: "2026-09-25"
      - mitigation: cap-agent-egress-control
        coverage: native
        mechanism: >-
          Agent Gateway Agent-to-Anywhere binding (agent_gateway_config.agent_to_anywhere_config) routing all
          agent egress, platform APIs included, through default-deny IAP access policies over registered
          endpoints or host/path rules; alternatively VPC-SC with PSC interface egress into our VPC; Code
          Execution without network; Managed Agents API base_environment.network.allowlist (off by default)
        steps:
          - title: Bind every agent to an egress gateway
            body:
              - >-
                Set agent_gateway_config.agent_to_anywhere_config.agent_gateway with identity_type
                AGENT_IDENTITY at creation (Terraform deployment_spec.agent_gateway_config), after
                allowlisting the Google API hostnames the agent uses, regional and mTLS variants included, or
                while policies are DRY_RUN.
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/agent-gateway-runtime-deploy
          - title: Allow only named destinations
            body:
              - >-
                Register endpoints in Agent Registry and grant iap.resources.egressViaIAP per agent principal;
                avoid base URIs, which admit a whole domain.
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/policies/configure-iam-policies-uap
          - title: Or close the perimeter
            body:
              - >-
                Put aiplatform.googleapis.com in a VPC-SC perimeter and give the agent a psc_interface_config
                network attachment, so any internet path is our proxy and Cloud NAT.
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/private-service-connect-interface
          - title: Managed Agents API
            body:
              - >-
                Leave base_environment.network unset (no network) or list exact domains in network.allowlist;
                a domain of "*" is unrestricted.
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/managed-agents/create-manage
        note: >-
          Native on the architecture rule: an exact-host (and path) allowlist enforced by Google around the
          runtime, default-deny, logged, and mandatory by org policy. It covers every outbound call from a
          bound agent. Not seen: Google-side tools such as Search grounding and url_context, sandboxes
          (governed by their own template's PSC interface or VPC-SC), and unbound agents — engines created
          before 2026-04-29 and agents using revisions. Without a gateway or VPC-SC an agent has public
          internet access. Pages disagree: manage-agent-access says VPC-SC is unsupported with Agent Gateway;
          the 2026-09-09 release note supports it for gateways created after 2026-09-08 with an ALL_TRAFFIC
          connectivity template — test before relying on both.
        verified: "2026-09-25"
      - mitigation: AML.M0028
        coverage: native
        mechanism: >-
          IAM Unified Access Policies at Agent Gateway by agent principal, MCP server, tool name and
          annotations, and endpoint host, path and method; IAM roles, deny policies and Principal Access
          Boundary on the agent identity for Google Cloud resources; the agent's tool list in its own code
        steps:
          - title: Scope tools per agent at the gateway
            body:
              - >-
                Allow rules naming destination.agent_registry.mcp_server.tool.name for each tool the agent may
                call (or tool.annotations.read_only_hint == true) and deny rules for destructive tools.
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/policies/configure-iam-policies-uap
          - title: Scope Google Cloud resources by the agent's principal
            body:
              - >-
                Grant roles on specific resources to the principal:// identifier and cap it with a Principal
                Access Boundary policy.
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/agent-identity
          - title: Register MCP servers with their tool specs
            body:
              - Upload a toolspec.json when registering a server so tool-level rules have names to match.
            url: https://docs.cloud.google.com/agent-registry/register-mcp-servers
        note: >-
          Native on the permissions rule (as on toolBedrockAgentcore): per-tool enablement and per-principal
          permission by operation and resource, enforced outside the model at the gateway and in IAM.
          Arguments are not in the policy language. The policies live in the gateway project and IAM, not in
          the agent's code, so the next revision cannot widen them — though a redeployed agent gets a new
          principal and loses per-principal grants. Tools that never leave the agent's process are bounded
          only by IAM; registration pins nothing a server serves. In the Managed Agents API an interaction's
          tools list replaces the agent's for that turn.
        verified: "2026-09-25"
      - mitigation: D3-CH
        coverage: partial
        mechanism: >-
          Agent Identity auth manager vault (API keys, OAuth client secrets, user tokens; IAM per auth
          provider); Secret Manager references for env_vars; auto-rotated 24-hour agent certificates with
          bound tokens and no service-account keys; iam.managed.disableServiceAccountKeyCreation; CMEK through
          encryption_spec; no vendor tunnel — private reach is a PSC interface network attachment
        steps:
          - title: Keep tool secrets in the auth manager
            body:
              - >-
                Register API keys and OAuth clients as auth providers (gcloud agent-identity auth-providers
                create) and grant use per agent principal, rather than putting values in env_vars.
            url: https://docs.cloud.google.com/iam/docs/auth-manager-overview
          - title: Reference Secret Manager for anything the code reads
            body:
              - >-
                Pass env_vars as {"secret": SECRET_ID, "version": VERSION} (same project only) and grant
                secretmanager.versions.access to the Agent Platform Service Agent, which fetches them at
                deployment.
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/deploy-an-agent
          - title: Run on short-lived credentials
            body:
              - >-
                Use agent identity — 24-hour certificates, bound tokens, no long-lived keys — and enforce
                iam.managed.disableServiceAccountKeyCreation for the pipeline and callers.
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/agent-identity-overview
        note: >-
          Partial on the vault rule applied to every vendor (as on toolBedrockAgentcore): custody and lifetime
          are strong — a Google-managed vault gated per agent principal, 24-hour certificates, bound tokens —
          but the vault is not write-only: retrieveCredentials returns the value to the agent's process, and
          Secret Manager values become environment variables of every instance, which CMEK does not cover.
          Tunnel story: Google offers no outbound-only tunnel; a private MCP server is reached through a PSC
          interface network attachment in our VPC, which carries no token or TLS key to rotate — the control
          is who may change the attachment. Our application's own credential for the API is ours to federate.
        verified: "2026-09-25"
      - mitigation: AML.M0029
        coverage: partial
        mechanism: >-
          No runtime approval pause. ADK tool confirmation (FunctionTool require_confirmation,
          request_confirmation, an adk_request_confirmation call answered with the same function_call_id) is
          experimental and not supported with VertexAiSessionService; an Agent Gateway custom authorization
          extension can hold a call
        steps:
          - title: Build the approval into the agent
            body:
              - >-
                Wrap consequential tools with require_confirmation so the run pauses on
                adk_request_confirmation and our front end answers with a FunctionResponse carrying the same
                function_call_id — on a session service that supports it, which Agent Platform Sessions
                (VertexAiSessionService) does not.
            url: https://adk.dev/tools-custom/confirmation/
          - title: Or hold the call at the gateway
            body:
              - >-
                Import a custom authorization extension (gcloud service-extensions authz-extensions import)
                whose service refuses a consequential tool call until our approval service has recorded a
                person's decision.
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/gateways/delegate-authorization
        note: >-
          Partial on the approval rule (as on toolBedrockAgentcore and toolOpenaiAgentsApi): the runtime has
          no approval primitive, so approval is our code on an attach point. ADK's confirmation binds to the
          exact call but is experimental and unsupported with the managed Sessions Agent Runtime pairs with,
          so on the managed stack the gate is our own logic or a gateway extension. Semantic Governance is an
          LLM verdict and Model Armor a classifier — neither is human approval. The Managed Agents API
          documents no approval step.
        verified: "2026-09-25"
      - mitigation: cap-input-guardrails
        coverage: native
        mechanism: >-
          Model Armor templates on Agent Gateway — egress: MCP tools/call and prompts/get responses and tool
          execution errors, A2A v1 SendMessage, OpenAI-compatible LLM payloads; ingress: ADK streamQuery —
          with prompt-injection and jailbreak, malicious-URI and Sensitive Data Protection filters under
          INSPECT_AND_BLOCK; floor settings over Gemini generateContent (integrated service VERTEX_AI)
        steps:
          - title: Turn Model Armor on at the egress gateway
            body:
              - >-
                Create templates with pi_and_jailbreak_filter_settings ENABLED and enforcement_type
                INSPECT_AND_BLOCK, switch on Enable Model Armor on the Agent-to-Anywhere gateway, and grant
                the Service Extensions service agent roles/modelarmor.calloutUser and roles/modelarmor.user.
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/configure-model-armor
          - title: Screen every Gemini call in the project
            body:
              - >-
                Floor settings with --add-integrated-services=VERTEX_AI and --vertex-ai-enforcement-type
                INSPECT_AND_BLOCK apply even when a generateContent call omits modelArmorConfig.
            url: https://docs.cloud.google.com/model-armor/model-armor-vertex-integration
        note: >-
          Native on the guardrail rule (unlike toolBedrockAgentcore, whose documented output checks omit injection): returned tool content is classified at
          the gateway with a block and a logged verdict. Inspected: MCP tools/call responses and tool errors,
          A2A v1 SendMessage, OpenAI-compatible completions. Passed unscreened: tools/list, resources/*,
          notifications, MCP and A2A streaming (SSE), pre-v1 A2A, plain REST responses to function tools, and
          anything from an agent without a gateway. The floor covers Gemini generateContent only (not file
          uploads) and fails open when Model Armor is unreachable or errors; ingress screening covers ADK
          streamQuery only.
        verified: "2026-09-25"
      - mitigation: cap-agent-tracing
        coverage: native
        mechanism: >-
          OpenTelemetry traces (GOOGLE_CLOUD_AGENT_ENGINE_ENABLE_TELEMETRY, OTEL_SEMCONV_STABILITY_OPT_IN,
          OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT) to Cloud Trace with prompts and responses in
          Cloud Logging or Cloud Storage in our project; reasoning_engine_stdout / stderr logs; Agent Gateway
          telemetry; Cloud Audit Logs for sessions and memories; Log Router sinks
        steps:
          - title: Turn telemetry and content capture on
            body:
              - >-
                Set the three env_vars at deploy, or Deployments > Telemetry configuration > Configure: Enable
                instrumentation of OpenTelemetry traces and logs, and Enable logging of prompt inputs and
                response outputs.
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/tracing
          - title: Enable Data Access audit logs
            body:
              - >-
                Turn on Data Access logs for aiplatform.googleapis.com: sessions.create, sessionEvents.append,
                memories.retrieve and related calls are DATA_READ / DATA_WRITE and off by default.
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/general/audit-logging
          - title: Ship it off-platform
            body:
              - >-
                A Log Router sink to Pub/Sub, BigQuery or a Cloud Storage bucket in a separate project keeps a
                copy the agent's project cannot alter.
            url: https://docs.cloud.google.com/logging/docs/routing/overview
        note: >-
          Native on the tracing rule: spans for model calls and tool executions, grouped by session, land in
          our own project and can be exported. Instrumentation is opt-in and emitted by the agent's own
          framework, so a custom or compromised agent's trace is only as complete as its code; gateway
          telemetry and audit logs are the independent record. Prompts, responses and user.id are captured
          only with content capture on; Sessions, Memory Bank and Code Execution write no Cloud Logging
          entries of their own; Model Armor trace spans are Pre-GA. Not tamper-evident in the project: route
          to another one.
        verified: "2026-09-25"
      - mitigation: cap-agent-kill-switch
        coverage: partial
        mechanism: >-
          reasoningEngines.delete with force=true (console Deployments > Delete agent), removing the agent
          with its sessions and memories; IAM deny policy or binding removal on the agent's principal; deny
          rules in the gateway access policy; removing aiplatform.reasoningEngines.query from callers; sandbox
          delete
        steps:
          - title: Cut the agent off
            body:
              - >-
                Add an IAM deny policy naming the agent's principal (or a deny rule in the gateway's access
                policy), then remove its allow bindings and revoke callers' aiplatform.reasoningEngines.query.
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/agent-identity
          - title: Decommission
            body:
              - >-
                client.runtimes.delete(name=..., force=True) or DELETE .../reasoningEngines/ID removes the
                agent and its child sessions and memories; then delete its sandboxes and the now-inactive IAM
                bindings.
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/manage-deployed-agents
        note: >-
          Partial on the kill-switch rule (toolBedrockAgentcore is native on StopRuntimeSession): disable and
          revoke are documented, but no operation interrupts a running query — Agent Runtime supports
          operations up to 7 days — and whether delete ends in-flight streams is not documented; IAM
          propagation time is not stated (delay not documented). Deleting the agent leaves its principal's
          bindings in place, and nothing cancels work handed to A2A subagents. Managed Agents API: DELETE the
          agent resource; its environment lasts 7 days after the last interaction.
        verified: "2026-09-25"
    advisories:
      - title: >-
          Unit 42 "Double Agents": code in a deployed Agent Engine agent read the Reasoning Engine service agent's
          credentials from the metadata server and reached consumer buckets and Google-owned Artifact Registry images
          (no CVE; Google updated its docs and recommends a custom service account)
        url: https://unit42.paloaltonetworks.com/double-agents-vertex-ai/
        date: "2026-03"
      - title: >-
          XM Cyber: a user with aiplatform.reasoningEngines.update deploys a tool that reads the Reasoning Engine
          service agent token from metadata, reaching memories, sessions, storage and logging (no CVE; Google: working
          as intended)
        url: https://cybersecuritynews.com/google-vertex-ai-vulnerability/
        date: "2026-01"
