    setVia: [cloudPolicy]
    area: tools
    default: "Not set. All models and actions are allowed."
    recommended: "A custom allow list of the approved models with the predict action, in the form publishers/PUBLISHER/models/MODEL_NAME:predict. Every model not listed is then denied."
