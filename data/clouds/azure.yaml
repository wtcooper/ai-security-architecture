  - architecture: archRemoteMcpServer
    asOf: "2026-10"
    reference:
      - title: Secure a Model Context Protocol (MCP) server with Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/agent-id/secure-mcp-server-with-entra-id
      - title: Secure access to MCP servers in API Management
        url: https://learn.microsoft.com/en-us/azure/api-management/secure-mcp-servers
      - title: Configure built-in MCP server authorization on App Service
        url: https://learn.microsoft.com/en-us/azure/app-service/configure-authentication-mcp
    summary:
      - >-
        Your MCP server on Azure App Service, published through API Management's MCP servers, with
        Microsoft Entra ID as both the identity provider and the authorization server: the server is
        an app registration whose Application ID URI is its canonical URL, so every token is
        audience-bound to it. Entra offers no dynamic client registration, so clients are pre-registered
        and preauthorized, and the organisation's callers are governed where they sign in: the server's
        enterprise app assignment and Conditional Access.
    bindings:
      - { block: idp, service: Microsoft Entra ID, note: "Sign-in, the server's enterprise app assignment and Conditional Access decide who can get a token at all." }
      - { block: gateway, service: Azure API Management (MCP servers) }
      - { block: authServer, service: Microsoft Entra ID (server app registration), note: "Issues v2 access tokens for the server's Application ID URI; clients are pre-registered, so there is no client-metadata fetch to bound here." }
      - { block: service, service: Your MCP server on Azure App Service, note: "Built-in MCP server authorization serves the protected resource metadata; Azure Functions MCP bindings are the serverless alternative." }
      - { block: toolDefs, service: Tool definitions in your repository, build: true, note: "Versioned with the release and pinned by hash where the server loads them." }
      - { block: orgData, service: Your systems of record, build: true, note: "Reached on an on-behalf-of token or the server's own managed identity, never the caller's token." }
    settings:
      - entraAssignmentRequired
      - appServiceRequireAuth
      - entraApplicationIdUri
      - entraApiScopes
