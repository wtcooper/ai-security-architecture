                  url: https://learn.chatgpt.com/docs/enterprise/apps-and-connectors
              verified: 2026-09-10
      - mitigation: D3-OTF
        coverage: partial
        mechanism: >-
          ChatGPT-Allowed-Workspace-Id header injected on https://chatgpt.com/* by the organisation's SASE or
          TLS-inspecting proxy and enforced by OpenAI; workspace IP allowlisting (inbound) and
          allowed_chatgpt_workspaces for the desktop app's local runtime
        steps:
          - title: Inject the allowed-workspace header
            body:
              - >-
                Have the SASE or proxy add ChatGPT-Allowed-Workspace-Id with the workspace UUID(s), comma-separated
                without spaces, to requests for https://chatgpt.com/*; OpenAI filters out every other workspace,
                personal ones included, and returns 403 when none remain.
            url: https://help.openai.com/en/articles/20001323-corporate-network-controls-in-chatgpt-enterprise
          - title: Block logged-out use and cover the apps
            body:
              - >-
                Block URLs starting https://chatgpt.com/backend-anon/, and add the proxy's certificates to the
                desktop and mobile apps' pin list by MDM (the apps pin certificates), or block desktop.chatgpt.com,
                ios.chat.openai.com and android.chat.openai.com outright.
            url: https://help.openai.com/en/articles/20001323-corporate-network-controls-in-chatgpt-enterprise
          - title: Restrict where the workspace is reachable from
            body:
              - >-
                Workspace Settings > Identity & access > Access Restrictions, add IP ranges for Workspace and
                Compliance API, then toggle Activate IP Allowlist (changes take 5-15 minutes).
            url: https://help.openai.com/en/articles/12111596-ip-allowlisting-for-chatgpt
          - title: Pin the desktop app's local runtime to the workspace
            body:
              - >-
                Set allowed_login_methods = ["chatgpt"] and allowed_chatgpt_workspaces = ["<uuid>"] in the system
                requirements.toml or macOS MDM; both keys are ignored in cloud-managed requirements.
            url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
        note: >-
          Partial by the rule applied to every vendor: OpenAI honours a documented allowed-workspace header that
          the organisation's proxy injects and enforces the block server-side; the SSE only admits the
          destination, and a pinned session to the approved tenant is not readable. It holds only on traffic the
          proxy sees and can decrypt — the desktop and mobile apps pin certificates, so devices without the MDM
          pin exception are outside it. A customer proxy does not control OpenAI's own egress: Work Cloud code and
          shell (public internet toggle and managed allowlist), the cloud browser, deep research, agent mode and
          connector calls leave from OpenAI infrastructure; the vendor-side levers are the Work network setting
          and a Lockdown Mode role (live browsing, agent mode, deep research and file downloads off; Codex
          unaffected). IP allowlisting limits inbound access to the workspace and Compliance API, not outbound
          traffic. Work Local commands follow [experimental_network] (experimental); browser use, computer use
          and MCP are outside it.
        verified: "2026-09-25"
        migration:
          from:
            - capabilitySse
            - capabilityEgressControl
          reviewRequired: false
          original:
            - capability: capabilitySse
              coverage: partial
              mechanism: >-
                Tenancy pinning in product (allowed_chatgpt_workspaces for the desktop app, IP access
                restrictions referenced); inline inspection is a third-party SSE
              note: >-
                Comparable to Claude chat: the vendor pins tenancy (allowed_chatgpt_workspaces) and offers
                workspace IP access restrictions, and the inline inspection is the customer's SSE; rated
                partial for the same reason.
              steps:
                - title: Pin the desktop app to the workspace
                  body:
                    - allowed_chatgpt_workspaces in requirements.toml restricts sign-in to listed workspace UUIDs.
                  url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
              verified: 2026-09-10
            - capability: capabilityEgressControl
              coverage: partial
              mechanism: '"Allow public internet access" for Work Cloud code/shell (managed allowlist when off);
                [experimental_network] for Work Local'
              steps:
                - title: Turn off public internet for cloud code and shell
                  body:
                    - When disabled, commands reach only required hostnames from a managed allowlist; this
                      controls destinations, not commands.
                  url: https://learn.chatgpt.com/docs/sandboxing
                - title: Allowlist domains for local commands
                  body:
                    - "[experimental_network] with managed_allowed_domains_only = true; browser tools and MCP
                      are outside it."
                  url: https://learn.chatgpt.com/docs/enterprise/managed-configuration
              note: Work Cloud code and shell follow the managed allowlist when public internet access is off; Work Local
                commands follow [experimental_network]. Browser, computer use and connector traffic are
                outside both and need a network-layer control.
              verified: 2026-09-10
      - mitigation: cap-sensitive-data-redaction
        coverage: partial
        mechanism: >-
          SharePoint app Safety & Security Controls > Excluded sensitivity labels without encryption (label-based
          restriction); no in-product inspection of prompts, uploads or responses in Chat or Work
        steps:
          - title: Exclude labelled SharePoint files
            body:
              - >-
                In the SharePoint app's Safety & Security Controls enter each non-encrypting Microsoft Purview
                label GUID under Excluded sensitivity labels without encryption; files with encrypting labels are
                already excluded.
            url: https://help.openai.com/en/articles/20001502-managing-sharepoint-site-access-and-sensitivity-label-exclusions
          - title: Inspect prompts at the endpoint or browser
            body:
              - >-
                Apply endpoint, browser or SSE DLP inline to chatgpt.com; the desktop and mobile apps need the
                proxy certificate added to their pin list by MDM before SSL inspection works.
            url: https://help.openai.com/en/articles/20001323-corporate-network-controls-in-chatgpt-enterprise
          - title: Scan conversations after the fact
            body:
              - >-
                Have a workspace owner create an Admin key with Conversation messages and app-log access and feed
                the Compliance Logs Platform to a DLP partner such as Microsoft Purview, Netskope, Cyberhaven,
                Forcepoint or Palo Alto Networks.
            url: https://help.openai.com/en/articles/9261474-openai-compliance-platform-for-enterprise-and-edu-customers
        note: >-
          Partial only by the label-restriction clause of the rule applied to every vendor: the SharePoint
          sensitivity-label exclusion, enforced by OpenAI, keeps labelled files out of SharePoint app results
          (supported Office, PDF and MP4 files; TXT and CSV are treated as unlabelled; OneDrive is separate).
          Nothing in Chat or Work detects identifiers, secrets or classified content in what an employee types or
          uploads, in connector payloads or in responses, and nothing masks them; Prisma AIRS external guardrails
          scan Codex prompts only. The pin's objective — classification before material leaves the person — is
          met by endpoint or browser DLP inline; Compliance Logs Platform partners scan conversations after they
          reach OpenAI (detection after the fact, 30-day source window). Action controls, parameter constraints,
          deny_read and allow_appshots limit where data can go or what the agent can read but inspect nothing.
        verified: "2026-09-25"
        migration:
