    # The security-relevant settings, each with the baseline value (data/tooling/BASELINE.md). The framework runs
    # inside the application, so every row is a parameter, class, environment variable or builder option the deployer
    # sets in code; identity for model calls is set up in Entra. Verified 2026-11-21 against learn.microsoft.com.
    settings:
      - id: toolApprovalMode
        name: approval_mode / ApprovalRequiredAIFunction
        where: "@tool(approval_mode=...) (Python); new ApprovalRequiredAIFunction(AIFunction) (.NET); tool.ApprovalRequiredFunc (Go)"
        setVia: [code]
        area: tools
        default: never_require (tools run without approval)
        recommended: always_require on every tool that changes records, moves money or sends data out; in .NET wrap those functions in ApprovalRequiredAIFunction
        value: "always_require on every consequential tool"
        why: The run stops with the tool name and arguments for a person to approve or reject that call, instead of the model acting on its own.
        mitigations: [AML.M0029]
        url: https://learn.microsoft.com/en-us/agent-framework/agents/tools/tool-approval
        verified: "2026-11-21"
      - id: approvalResponseBinding
        name: disable_approval_response_binding / DisableApprovalResponseBinding
        where: "client.function_invocation_configuration[\"disable_approval_response_binding\"] (Python); HarnessAgentOptions.DisableApprovalResponseBinding (.NET)"
        setVia: [code]
        area: tools
        default: "False (responses bound to the issuing session)"
        recommended: Leave False, and pass the same AgentSession to the run that raises the request and the run that resumes it
        value: "False (binding kept on)"
        why: Only a response matching a pending request in the same session authorises the call, so a fabricated or replayed approval message can't run a privileged tool.
        mitigations: [AML.M0029]
        url: https://learn.microsoft.com/en-us/agent-framework/agents/tools/tool-approval
        verified: "2026-11-21"
      - id: harnessAutoApproval
        name: auto_approval_rules / AutoApprovalRules
        where: "create_harness_agent(auto_approval_rules=...) (Python); HarnessAgentOptions ToolApprovalAgentOptions.AutoApprovalRules (.NET)"
        setVia: [code]
        area: tools
        default: None (no heuristic auto-approval; standing approvals saved in the session)
        recommended: Read-only rules only, such as SkillsProvider.read_only_tools_auto_approval_rule; start a new session whenever the agent's tools or MCP servers change
        value: "Read-only rules only; new session on tool change"
        why: Standing approvals persist in session state and match by tool name, so a replacement tool or MCP tool with the same name could reuse an earlier yes.
        mitigations: [AML.M0029, cap-mcp-tool-integrity]
        url: https://learn.microsoft.com/en-us/agent-framework/agents/tools/tool-approval
        verified: "2026-11-21"
      - id: mcpApprovalMode
        name: approval_mode (MCP tools)
        where: "MCPStdioTool / MCPStreamableHTTPTool(approval_mode={\"always_require_approval\": [...], \"never_require_approval\": [...], \"default\": ...})"
        setVia: [code]
        area: tools
        default: Tools and prompts not listed don't require approval
        recommended: A mapping that lists read-only tools in never_require_approval and sets default to always_require
        value: "default always_require; reads listed"
        why: A tool nobody listed, or one the server adds later, waits for a person instead of running unapproved.
        mitigations: [AML.M0029, cap-mcp-tool-integrity]
        url: https://learn.microsoft.com/en-us/agent-framework/agents/tools/local-mcp-tools
        verified: "2026-11-21"
      - id: mcpAllowedTools
        name: allowed_tools
        where: "MCPStdioTool / MCPStreamableHTTPTool(allowed_tools=[...]); hosted MCP tools from FoundryChatClient or OpenAIChatClient; AllowedTools on .NET hosted MCP"
        setVia: [code]
        area: tools
        default: Omitted (every tool the server lists; hosted tools send no filter)
        recommended: The approved raw tool names for each server, and an explicit empty list for a server whose tools the agent must not call
        value: "Approved raw tool names per server"
        why: Tools a server adds or renames are never offered to the agent, and a configured name that matches several remote tools fails instead of guessing.
        mitigations: [cap-mcp-tool-integrity, cap-agent-tool-registry, AML.M0028, AML.M0037]
        url: https://learn.microsoft.com/en-us/agent-framework/agents/tools/local-mcp-tools
        verified: "2026-11-21"
      - id: mcpHeaderProvider
        name: header_provider / static_headers
        where: MCPStreamableHTTPTool(header_provider=..., static_headers=...)
        setVia: [code]
        area: identity
        default: No authentication headers
        recommended: header_provider returning the token minted for this agent or the requesting user, captured in a closure or ContextVar; static_headers only for a fixed service credential
        value: "Per-run token from header_provider"
        why: Each call carries the right principal's token, headers go only to the configured origin and are dropped on cross-origin redirects, and a changed identity reconnects first.
        mitigations: [D3-CTS, D3-AA, cap-data-access-governance]
        url: https://learn.microsoft.com/en-us/agent-framework/agents/tools/local-mcp-tools
        verified: "2026-11-21"
      - id: functionInvocationLimits
        name: max_iterations, max_function_calls, max_duration_seconds
        where: "client.function_invocation_configuration (Python); HarnessAgentOptions.MaximumIterationsPerRequest (.NET); ToolAutoCall.MaximumIterationsPerRequest (Go)"
        setVia: [code]
        area: tools
        default: "max_function_calls and max_duration_seconds None (unlimited); Go 40 rounds"
        recommended: Explicit values on every client, sized to the task, for example 5 iterations, 20 calls and a few minutes
        value: "Explicit iteration, call and time caps"
        why: A looping agent stops calling tools and must give a final answer; limits are checked after each batch, so one batch can overrun.
        mitigations: [AML.M0036]
        url: https://learn.microsoft.com/en-us/agent-framework/agents/tools/function-tools
        verified: "2026-11-21"
      - id: magenticLimits
        name: max_round_count, max_stall_count, max_reset_count
        where: "MagenticBuilder(max_round_count=..., max_stall_count=..., max_reset_count=...) (Python); WithMaxRounds / WithMaxStalls / WithMaxResets (.NET)"
        setVia: [code]
        area: tools
        requires: Magentic types are experimental in .NET (MAAIW001)
        recommended: Explicit caps on every Magentic workflow, for example 10 rounds, 3 stalls and 2 resets
        value: "Explicit round, stall and reset caps"
        why: The supervisor can't keep replanning and re-dispatching subagents without bound when a task stalls or a page steers it.
        mitigations: [AML.M0036]
        url: https://learn.microsoft.com/en-us/agent-framework/workflows/orchestrations/magentic
        verified: "2026-11-21"
      - id: handoffAutonomousMode
        name: with_autonomous_mode (turn_limits)
        where: "HandoffBuilder(...).with_autonomous_mode(agents=..., turn_limits={...}) (Python); WithAutonomousMode(turnLimit: ...) (.NET)"
        setVia: [code]
        area: tools
        default: Off; when on, 50 autonomous turns per agent
        requires: Autonomous mode is an experimental feature in Python
        recommended: Off for agents holding consequential tools; elsewhere turn_limits of 3 to 5 with a termination_condition
        value: "Off, or a few turns per agent"
        why: An agent that never hands off can't run 50 turns on a canned continue prompt with nobody reading.
        mitigations: [AML.M0036, AML.M0029]
        url: https://learn.microsoft.com/en-us/agent-framework/workflows/orchestrations/handoff
        verified: "2026-11-21"
      - id: magenticPlanReview
        name: enable_plan_review / RequirePlanSignoff
        where: "MagenticBuilder(enable_plan_review=...) (Python); MagenticWorkflowBuilder.RequirePlanSignoff(...) (.NET)"
        setVia: [code]
        area: tools
        default: "Python False; .NET true"
        requires: Magentic types are experimental in .NET (MAAIW001)
        recommended: True in both languages, resuming only with a MagenticPlanReviewResponse from an authenticated reviewer
        value: "True in both languages"
        why: A person approves or revises the supervisor's plan before any subagent is dispatched on it.
        mitigations: [AML.M0029]
        url: https://learn.microsoft.com/en-us/agent-framework/workflows/orchestrations/magentic
        verified: "2026-11-21"
      - id: agentHooks
        name: create_agent_hooks_middleware
        where: "create_agent_hooks_middleware(interceptors=..., mode=..., resolver=..., record_sink=...) as the first element of Agent(middleware=[...])"
        setVia: [code]
        area: tools
        default: Not installed
        requires: agent-hooks-sdk installed separately; experimental, Python only
        recommended: One bundle per agent, first in its middleware list, mode "enforce", with pre_tool_call and post_tool_call interceptors and a record_sink to the audit store
        value: "One enforce-mode bundle, first in the chain"
        why: Tool calls, model calls and final output each get a verdict that fails closed, and a policy deny at a tool returns a control error instead of running it.
        mitigations: [cap-agent-action-policy-enforcement, cap-input-guardrails]
        url: https://learn.microsoft.com/en-us/agent-framework/agents/agent-hooks
        verified: "2026-11-21"
      - id: policyMiddleware
        name: Function and agent middleware (MiddlewareTermination)
        where: "Agent(middleware=[...]) with function and agent middleware (Python); agent.AsBuilder().Use(...) function calling middleware (.NET)"
        setVia: [code]
        area: tools
        default: None
        recommended: Function middleware on every agent that checks the caller's grant, the tool and its arguments before call_next(), and agent middleware that ends the run when an operator stop flag is set
        value: "Policy check per call; stop flag per run"
        why: A call the policy forbids returns a refusal without executing, and an operator can stop an agent before its next model or tool call.
        mitigations: [cap-agent-action-policy-enforcement, D3-APA, AML.M0028, cap-agent-kill-switch, AML.M0037]
        url: https://learn.microsoft.com/en-us/agent-framework/concepts/agents/middleware/
        verified: "2026-11-21"
      - id: fidesSecureAgentConfig
        name: SecureAgentConfig
        where: "agent_framework.security › SecureAgentConfig(...) in context_providers; sink tools' additional_properties accepts_untrusted and max_allowed_confidentiality"
        setVia: [code]
        area: data
        default: Not installed; when installed, unlabelled tool output is untrusted and violations are blocked
        requires: Experimental, Python only; not supported with Monty or Hyperlight CodeAct
        recommended: On agents that read external content, block_on_violation True, every write or send tool accepts_untrusted False with a max_allowed_confidentiality, and a message_labeler marking retrieved content untrusted
        value: "On; sinks annotated, block on violation"
        why: A write or send tool can't run while untrusted or more confidential content is in context, decided deterministically before the call rather than by a classifier.
        mitigations: [cap-input-guardrails, cap-agent-action-policy-enforcement, cap-retrieval-grounding-checks]
        url: https://learn.microsoft.com/en-us/agent-framework/agents/security
        verified: "2026-11-21"
      - id: purviewMiddleware
        name: PurviewChatPolicyMiddleware / WithPurview
        where: "agent_framework.microsoft › PurviewChatPolicyMiddleware(...) with PurviewSettings and an Azure credential (Python); .WithPurview(credential, new PurviewSettings(...)) (.NET)"
        setVia: [code]
        area: data
        default: Not installed
        requires: Microsoft Purview with Microsoft 365 E5 and pay-as-you-go billing; the Python package is beta and the .NET package (1.28.0-rc1) prerelease
        recommended: Chat-level middleware placed last in the list, ignore_exceptions left unset, and the user and tenant taken from a validated server-side token
        value: "Chat-level, placed last, fails closed"
        why: Prompts, context-provider output, replayed history and tool calls are checked against the firm's DLP policies on every model call, and blocked content never reaches the model.
        mitigations: [cap-sensitive-data-redaction]
        url: https://learn.microsoft.com/en-us/agent-framework/integrations/by-component/middleware/purview
        verified: "2026-11-21"
      - id: otelSensitiveData
        name: ENABLE_SENSITIVE_DATA / EnableSensitiveData
        where: "ENABLE_SENSITIVE_DATA or configure_otel_providers(enable_sensitive_data=...) (Python); UseOpenTelemetry(configure: cfg => cfg.EnableSensitiveData = ...) (.NET)"
        setVia: [configFile, code]
        area: audit
        default: "false"
        recommended: false in production; if content must be kept, redact it in your own exporter
        value: "false"
        why: Spans keep their structure without prompts, responses, tool arguments, results or exception messages, so client material stays out of the trace store.
        mitigations: [cap-sensitive-data-redaction, cap-agent-tracing]
        url: https://learn.microsoft.com/en-us/agent-framework/agents/observability
        verified: "2026-11-21"
      - id: otelExport
        name: configure_otel_providers / UseOpenTelemetry
        where: "configure_otel_providers() reading OTEL_EXPORTER_OTLP_ENDPOINT and OTEL_SERVICE_NAME (Python); .UseOpenTelemetry(sourceName: ...) with a matching AddSource (.NET)"
        setVia: [code, configFile]
        area: audit
        default: Instrumentation on (ENABLE_INSTRUMENTATION true); no exporter installed
        recommended: OTLP export of traces, metrics and logs to the firm's collector, with OTEL_SERVICE_NAME set per agent workload
        value: "OTLP to the firm's collector"
        why: Every agent run, model call, tool call and workflow step lands as one trace in the SIEM; nothing is exported until an exporter is configured.
        mitigations: [cap-agent-tracing]
        url: https://learn.microsoft.com/en-us/agent-framework/agents/observability
        verified: "2026-11-21"
      - id: checkpointStorage
        name: CosmosCheckpointStorage (allowed_checkpoint_types)
        where: "checkpoint_storage=CosmosCheckpointStorage(..., allowed_checkpoint_types=[...]) on the workflow or orchestration builder (Python); CheckpointManager (.NET)"
        setVia: [code]
        area: data
        default: No checkpoints unless storage is passed; a restricted unpickler admitting built-in safe types
        recommended: CosmosCheckpointStorage with managed identity on a container scoped to the workflow service, allowed_checkpoint_types listing only your own state classes, and no global register_checkpoint_type
        value: "Cosmos, managed identity, minimal type list"
        why: Checkpoints hold every executor's state, pending messages and the agent session; a private store and a short type list stop a tampered checkpoint being read or executed.
        mitigations: [AML.M0031, AML.M0012]
        url: https://learn.microsoft.com/en-us/agent-framework/workflows/checkpoints
        verified: "2026-11-21"
      - id: redisScope
        name: application_id, tenant_id, agent_id, user_id (Redis providers)
        where: "RedisHistoryProvider(application_id=..., tenant_id=..., agent_id=...); RedisContextProvider(application_id=..., agent_id=..., user_id=...)"
        setVia: [code]
        area: data
        default: Scoped history keys; omitted memory dimensions are not filtered
        recommended: Every stable boundary set from the authenticated identity, never from model output, over TLS with authenticated Redis users
        value: "Tenant, application, agent and user ids set"
        why: One tenant's transcript or extracted memories are never loaded into another tenant's or agent's run.
        mitigations: [AML.M0031, cap-data-access-governance, cap-retrieval-grounding-checks]
        url: https://learn.microsoft.com/en-us/agent-framework/integrations/by-component/context-providers/redis
        verified: "2026-11-21"
      - id: agUiAuthorizationScope
        name: authorization_scope_resolver
        where: add_agent_framework_fastapi_endpoint(app, agent, path, authorization_scope_resolver=...)
        setVia: [code]
        area: identity
        default: Required since Python 1.23 (or single_user=True)
        recommended: A resolver returning the authenticated tenant and user; single_user=True only for a local, single-user application
        value: "Authenticated tenant and user scope"
        why: Snapshots, sessions, checkpoints, detached runs and approval state resolve only within the caller's scope, so one user can't resume or approve another's run.
        mitigations: [D3-APA, AML.M0031]
        url: https://learn.microsoft.com/en-us/agent-framework/support/upgrade/migrate-to-mcp-2-x
        verified: "2026-11-21"
      - id: azureCredential
        name: credential (ManagedIdentityCredential)
        where: "FoundryChatClient / OpenAIChatClient(credential=...) (Python); AIProjectClient(endpoint, credential) (.NET)"
        setVia: [code, identityProvider]
        area: identity
        default: Samples use AzureCliCredential or DefaultAzureCredential; otherwise api_key from the environment
        recommended: ManagedIdentityCredential for a user-assigned identity per agent workload, with no API keys in the environment
        value: "ManagedIdentityCredential per agent workload"
        why: No standing key sits in the process, each workload is a separately revocable principal, and DefaultAzureCredential's fallback chain is never probed.
        mitigations: [D3-CH, D3-AA]
        url: https://learn.microsoft.com/en-us/agent-framework/integrations/by-component/model-providers/openai
        verified: "2026-11-21"
      - id: shellTool
        name: DockerShellTool / LocalShellTool
        where: "agent_framework.tools › DockerShellTool(...) or LocalShellTool(...).as_function() (Python); DockerShellExecutor / LocalShellExecutor (.NET)"
        setVia: [code]
        area: tools
        default: "LocalShellTool on the host at always_require; DockerShellTool with no network, non-root, read-only root"
        requires: agent-framework-tools (beta) or the prerelease Microsoft.Agents.AI.Tools.Shell; Docker or Podman for DockerShellTool
        recommended: DockerShellTool with its defaults for any shell the model drives; LocalShellTool only for trusted commands, kept at always_require, never with acknowledge_unsafe=True, and no unsafe_extra_run_args from input
        value: "DockerShellTool, defaults kept"
        why: Model-written commands run in a container with no network, no root and a read-only root filesystem instead of on the host with the process's access.
        mitigations: [D3-EI, cap-agent-egress-control, AML.M0029]
        url: https://learn.microsoft.com/en-us/agent-framework/integrations/by-component/tools/shell-tools
        verified: "2026-11-21"
      - id: hyperlightSandbox
        name: HyperlightCodeActProvider (allowed_domains, file_mounts, execution_timeout_seconds)
        where: HyperlightCodeActProvider(tools=..., allowed_domains=..., file_mounts=..., execution_timeout_seconds=...)
        setVia: [code]
        area: tools
        default: 30-second guest execution budget
        requires: agent-framework-hyperlight (beta); x86-64 Linux with KVM or AMD64 Windows
        recommended: Hyperlight for model-written code, allowed_domains limited to the hosts a task needs, file_mounts for inputs only, and side-effecting tools kept as direct tools with approval
        value: "Hyperlight; allowed_domains task hosts only"
        why: Generated code runs in a microVM that reaches only listed hosts and mounted files; host tools it calls still run outside with the host's access.
        mitigations: [D3-EI, cap-agent-egress-control, AML.M0036]
        url: https://learn.microsoft.com/en-us/agent-framework/integrations/by-component/context-providers/hyperlight
        verified: "2026-11-21"
      - id: a2aClient
        name: A2AAgent auth_interceptor, forwarded_kwargs and timeout
        where: "agent_framework.a2a › A2AAgent(url=..., auth_interceptor=..., forwarded_kwargs=..., timeout=...) (Python); A2ACardResolver.GetAIAgentAsync(httpClient: ...) (.NET)"
        setVia: [code]
        area: identity
        default: No authentication; no run kwargs forwarded; 10 s connect and 60 s read
        requires: agent-framework-a2a (beta); the .NET A2A packages are prerelease
        recommended: An auth_interceptor attaching a token minted for that peer and skill, forwarded_kwargs listing only non-secret keys, an explicit timeout, and the server's accepted lists left empty unless needed
        value: "Peer-bound token; no secrets forwarded"
        why: Each peer receives only a credential meant for it and only allowlisted, non-secret context, and the receiving service accepts nothing it doesn't list.
        mitigations: [D3-CTS, D3-AA, AML.M0036]
        url: https://learn.microsoft.com/en-us/agent-framework/integrations/by-component/agent-services/a2a
        verified: "2026-11-21"
      - id: backgroundRelease
        name: release_session (cancel_running)
        where: Background agents provider › release_session(session, cancel_running=True, timeout=30.0)
        setVia: [code]
        area: tools
        default: "cancel_running True, 30-second timeout"
        requires: Background agents are experimental and Python only
        recommended: Called in a finally block whenever a parent session ends or is evicted, and from the operator stop control
        value: "Called on stop and at every session end"
        why: Running child agents are cancelled and their handles released, instead of continuing after the parent run was stopped.
        mitigations: [cap-agent-kill-switch]
        url: https://learn.microsoft.com/en-us/agent-framework/agents/background-agents
        verified: "2026-11-21"
      - id: evaluateInCi
        name: evaluate_agent / evaluate_workflow (raise_for_status)
        where: "evaluate_agent(...), evaluate_workflow(...) and results.raise_for_status() (Python); results.AssertAllPassed() (.NET)"
        setVia: [code]
        area: tools
        default: Not run
        recommended: Run in CI on every model, instruction, tool or workflow change against a protected test set, with tool_call_args_match and safety evaluators, failing the release on EvalNotPassedError
        value: "CI evaluation gate on every change"
        why: A change that makes an agent call the wrong tool, pass the wrong arguments or produce unsafe output fails the build before it ships.
        mitigations: [cap-staged-rollout-gate]
        url: https://learn.microsoft.com/en-us/agent-framework/agents/evaluation
        verified: "2026-11-21"
      - id: toolSchema
        name: "@tool schema and Pydantic Field constraints"
        where: "@tool(schema=PydanticModel) or Annotated[..., Field(...)] parameters"
        setVia: [code]
        area: tools
        default: Schema from type annotations; Pydantic-model arguments validated before invocation
        recommended: A Pydantic input model with bounded Field, Literal and pattern constraints on every action tool
        value: "Constrained Pydantic input model per tool"
        why: Arguments outside the declared types and ranges fail validation before the function runs, so the model can't pass an unexpected account or amount.
        mitigations: [AML.M0028]
        url: https://learn.microsoft.com/en-us/agent-framework/agents/tools/function-tools
        verified: "2026-11-21"
      - id: disableWebSearch
        name: disable_web_search / DisableWebSearch
        where: "create_harness_agent(disable_web_search=...) (Python); HarnessAgentOptions.DisableWebSearch (.NET)"
        setVia: [code]
        area: network
        default: "False (a web-search tool is added when the client supports one)"
        recommended: True on every harness agent except those whose task is research
        value: "True except on research agents"
        why: Only the agents meant to read the open web get a web-search tool, so one hostile page can't reach every agent in the workflow.
        mitigations: [AML.M0028, cap-agent-egress-control]
        url: https://learn.microsoft.com/en-us/agent-framework/agents/tools/function-tools
        verified: "2026-11-21"
      - id: structuredOutput
        name: response_format / RunAsync<T>
        where: "agent.run(..., options={\"response_format\": PydanticModel}) or default_options (Python); RunAsync<T> or AgentRunOptions.ResponseFormat (.NET)"
        setVia: [code]
        area: data
        default: Plain text
        recommended: A Pydantic model or JSON schema on every agent whose output feeds code, another agent or a page, reading response.value and rejecting the turn when it is empty
        value: "Typed schema; reject when value is empty"
        why: Downstream code receives a validated object instead of free text it must parse, so markup or instructions in the reply don't pass as data.
        mitigations: [cap-output-encoding]
        url: https://learn.microsoft.com/en-us/agent-framework/agents/structured-outputs
        verified: "2026-11-21"
