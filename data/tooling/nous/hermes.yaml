              - "Only plugins named in plugins.enabled load; hermes plugins list shows enabled, disabled and
                not-enabled plugins, and hermes plugins pack export --enabled-only emits a hermes-pack.yaml with the
                repo and exact commit SHA of each, which hermes plugins pack install reproduces after a mandatory review
                screen."
            url: https://hermes-agent.nousresearch.com/docs/reference/cli-commands
          - title: Inventory tool servers and skills
            body:
              - "hermes mcp list and hermes skills list show what this profile can reach, hermes mcp test <name> checks
                a server connects as configured, and skills/.hub/lock.json records each hub skill's source URL and
                content hash."
            url: https://hermes-agent.nousresearch.com/docs/reference/cli-commands
          - title: Inventory the agents
            body:
              - "hermes gateway list shows every profile and whether its gateway is running with its PID; each profile is
                a separate agent with its own credentials, so record each in your organisation's agent register."
            url: https://hermes-agent.nousresearch.com/docs/reference/cli-commands
        note: >-
          Partial on the registry rule: plugins meet it (an enforced allowlist with source and revision recorded), but
          MCP servers are admitted by an mcp_servers entry with no version or source record, agent-created and
          project skills are not in the hub lock, and gateway hooks under ~/.hermes/hooks/ load by placement with no
          list at all. Nothing records an owner or approval state, and the listings cover one installation — an
          organisation keeps the cross-device register itself.
        verified: "2026-09-25"
