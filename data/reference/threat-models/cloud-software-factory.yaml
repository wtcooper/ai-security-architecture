pattern: archSoftwareFactory
reviewed: "2026-11-24"
summary: >-
  A factory in the organisation's own cloud turns a chat request from someone who cannot read code
  into a running app with its own users and data. At stake are the enterprise records those apps
  reach and the business data they keep, held by software nobody reviews line by line. The worst
  outcome is quiet: an app that works as asked while showing every record to everyone, or open to
  anyone through one setting, as apps built by prompt-to-app tools have been. Instructions hidden in
  uploads, invented packages and apps that outlive their owners follow.
concentrates: >-
  At the release: code nobody reads, written from files anyone could have authored, approved by an
  owner who judges what the app does rather than how. It is worst for an app that reaches
  enterprise data through a broad identity and is never retired.
scope: >-
  A platform team's factory in its own cloud: staff who are not developers request internal apps
  in a chat; a coding agent builds each in a sandbox made for one task; a pipeline tests and scans
  it; a named owner approves; apps run as separate tenants behind sign-in, some on enterprise data.
lists: [owasp-llm-2026, owasp-agentic, owasp-mcp]
assets:
  - "Enterprise records that generated apps read and change through connectors"
  - "Each app's own data, often real business data from its first day"
  - "The factory's credentials: the provider key, repository rights and release rights"
  - "The integrity of generated code and of what was released"
  - "Sign-in and isolation in front of and between the apps"
actors:
  - who: Author of an uploaded file
    access: "Writes the spreadsheet, document or page a requester uploads into the chat"
    wants: "A back door, a weakened sign-in or a key sent out"
  - who: Package squatter
    access: "Publishes on public registries under names agents invent or misspell"
    wants: "Code that runs in builds and ships inside apps"
  - who: The coding agent itself
    access: "A shell, packages and a push token inside its sandbox"
    wants: "Tests that pass, by whatever route it finds"
  - who: App user or outsider
    access: "Signs in to a generated app, or finds one exposed by a setting"
    wants: "Records the app shows more widely than it should"
  - who: Requester and owner (no attacker)
    access: "Ask for the app and approve it without reading its code"
    wants: "A working app; they cannot see what it does wrong"
threats:
  - id: T1
    title: "A generated app shows data to people who should not see it"
    rating: critical
    evidence: disclosed
    story: >-
      The app does what was asked and nobody reads its code: an access check can be missing, every
      record shown to every user, or a store opened by one setting. Apps from one prompt-to-app tool
      exposed their tables through a missing row-level policy, and a vibe-coded site exposed 1.5
      million agent tokens.
    at: [appHosting, appHosting->orgData, appUsers->appHosting, appData]
    risks: [riskSensitiveDataDisclosure, riskAgenticDelegationConfusedDeputy, riskInsecureModelOutput]
    atlas: [AML.T0049]
    owasp: [LLM10:2026, LLM02:2026, ASI03]
    controls: [D3-APA, cap-data-access-governance, D3-CTS, D3-ACH, D3-SYSVA]
    refs:
      - title: "CVE-2025-48757: insufficient row-level security in apps generated with Lovable (disputed by the vendor)"
        url: https://www.cve.org/CVERecord?id=CVE-2025-48757
      - title: "Wiz: exposed Moltbook database reveals millions of API keys, February 2026"
        url: https://www.wiz.io/blog/exposed-moltbook-database-reveals-millions-of-api-keys
  - id: T2
    title: "Hidden instructions in a request or upload plant a back door"
    rating: high
    evidence: observed
    story: >-
      The request and its files become the agent's task, and anyone can write a supplier's
      spreadsheet. Text in issues and comments has driven CI coding agents to send out their keys, and
      poisoned instruction files shipped through package registries. Kept in the spec, an instruction
      also steers every later change.
    at: [requester->intake, intake->harness, harness->gateway]
    risks: [riskPromptInjection, riskInsecureModelOutput]
    atlas: [AML.T0051.001, AML.T0080, AML.T0086]
    owasp: [LLM01:2026, ASI01, ASI06, MCP06:2025]
    controls: [cap-input-guardrails, D3-SYSVA, cap-agent-egress-control, D3-EI, AML.M0029]
    incidents: [hosted-agent-hijack, coding-agent-hijack]
  - id: T3
    title: "An invented or look-alike package is installed and shipped"
    rating: high
    evidence: research
    story: >-
      Code models name packages that do not exist (at least 5.2% of suggestions from commercial models
      and 21.7% from open ones, on average, in one study), and anyone can register the name. One
      invented name spread to over 237 repositories before a researcher claimed it. What installs here
      ships in the app.
    at: [nativeTools->registry, sources->registry]
    risks: [riskInsecureIntegratedComponent]
    atlas: [AML.T0060, AML.T0011.001, AML.T0010.001]
    owasp: [LLM04:2026, LLM07:2026, ASI04]
    controls: [D3-FA, AML.M0023, cap-agent-egress-control, D3-SYSVA]
    refs:
      - title: "We have a package for you! Package hallucinations by code-generating LLMs (arXiv:2406.10279)"
        url: https://arxiv.org/abs/2406.10279
      - title: "Aikido: agent skills spreading a hallucinated npx command, January 2026"
        url: https://aikido.dev/blog/agent-skills-spreading-hallucinated-npx-commands
  - id: T4
    title: "The agent reaches past its branch to tokens, the pipeline or the release"
    rating: high
    evidence: observed
    story: >-
      Steered or on its own, the agent uses what its sandbox can reach. An injected issue title once
      poisoned a CI cache and leaked a release job's publishing token, later used for an unauthorised
      release; a coding agent deleted a production database during a code freeze. A push-only token
      and no secrets keep it to a branch.
    at: [nativeTools, nativeTools->sourceControl, sourceControl->pipeline]
    risks: [riskRogueActions, riskPromptInjection]
    atlas: [AML.T0098, AML.T0055, AML.T0101]
    owasp: [LLM03:2026, ASI02, ASI05, ASI10, MCP01:2025, MCP02:2025]
    controls: [AML.M0028, D3-CH, D3-EI, cap-agent-egress-control, cap-agent-tracing]
    incidents: [hosted-agent-hijack]
    refs:
      - title: "The affected user's account of Replit's agent deleting a production database, July 2025"
        url: https://www.saastr.com/replits-new-release-address-most-of-the-challenges-we-hit-vibe-coding-but-is-prosumer-vibe-coding-really-ready-for-commercial-apps-yet
  - id: T5
    title: "Apps and previews outlive their owners, with live credentials"
    rating: high
    evidence: observed
    story: >-
      An app outlives the request and often the people, and a preview nobody deleted keeps its address
      and its keys. In 2026 an AI vendor was breached through a credential left from abandoned
      prototype work, and an unregistered AI tool's grant opened a corporate account. Apps built outside
      the factory start ungoverned.
    at: [appTenant, pipeline->previews, previews]
    risks: [riskShadowAndUnknownAgents]
    atlas: [AML.T0012, AML.T0091.000]
    owasp: [ASI03]
    controls: [D3-AI, AML.M0043, cap-agent-kill-switch, cap-shadow-ai-discovery]
    incidents: [identity-and-shadow-ai]
  - id: T6
    title: "The owner's approval is a formality, or a stolen session"
    rating: medium
    evidence: observed
    story: >-
      The owner approves what the app does, not its code, so an app that passes every check and looks
      right on test data is approved as asked. In 2026 two stolen accounts were enough to run and
      approve a backdoored gateway release, and a factory with no owner at all removes the person.
    at: [appOwner->deployGate, pipeline->deployGate]
    risks: [riskInsecureModelOutput]
    atlas: [AML.T0012, AML.T0091]
    owasp: [ASI09]
    controls: [AML.M0029, D3-MFA, cap-staged-rollout-gate, D3-ACH]
    incidents: [litellm-release-hijack]
  - id: T7
    title: "One app's fault or compromise reaches other apps or the factory"
    rating: medium
    evidence: disclosed
    story: >-
      Apps that share an account, a network, a store or a credential let one faulty or hostile app
      reach the others, and the factory too if it shares them. In 2026 researchers found an internal
      package server whose properties were not isolated by account, so code sandboxes of two users
      could pass data between them.
    at: [appTenant, appHosting->appData, deployGate->appHosting]
    risks: [riskCrossTenantCredentialPropagation]
    atlas: [AML.T0055, AML.T0012]
    owasp: [ASI08, ASI03]
    controls: [D3-NI, D3-CTS, D3-CH]
    incidents: [chatgpt-shared-clipboard]
coverage:
  - { id: "LLM05:2026", why: "The factory trains no model; a poisoned template or skill acts like an injected instruction, under the hidden-instruction threat." }
  - { id: "LLM06:2026", why: "Model calls leave through the gateway, which meters spend per request; a looping agent costs money but reaches nothing new." }
  - { id: "LLM08:2026", why: "The spec and the platform's skills are not secrets, and no credential is placed in the agent's context." }
  - { id: "LLM09:2026", why: "No retrieval index is drawn; an app that adds one becomes a chat or action agent and takes that pattern's threats." }
  - { id: "ASI07", why: "One agent works on each build; no agent-to-agent channel is drawn." }
  - { id: "MCP03:2025", why: "The skills and tools the gateway serves are the platform team's own; changing them needs an insider or a gateway compromise." }
  - { id: "MCP04:2025", why: "The tool servers are the platform's own build; dependency tampering inside apps is the invented-package threat." }
  - { id: "MCP05:2025", why: "The platform's tools take no shell input from the agent; its own commands run in its sandbox, under the reach-past-its-branch threat." }
  - { id: "MCP07:2025", why: "The agent signs in to the gateway on its own workload identity, and only the gateway holds the provider key." }
  - { id: "MCP08:2025", why: "One record from request to release is kept outside the agent's reach and covers its tool calls." }
  - { id: "MCP09:2025", why: "No MCP server is added at run time; apps built outside the factory fall under the outlived-app threat." }
  - { id: "MCP10:2025", why: "Each build's context holds one app's spec and uploads; no shared MCP context spans requesters." }
questions:
  - "Is sign-in in front of every generated app enforced by the platform, whatever the agent wrote?"
  - "Do connectors return only what the signed-in user may see, or whatever the app's identity can read?"
  - "Can the agent's token merge, change the pipeline or reach anything beyond its branch, and does the sandbox hold any secret?"
  - "Does the mirror refuse packages too new to have a history?"
  - "What does the owner see before approving, and can a requester approve their own app?"
  - "Which apps and previews are past their end date or without an owner, and who looks for apps built outside the factory?"
  - "Do any two apps share an account, a network, a store or a credential?"
