id: archPersonalAgent
surface: surfaceEndpoint
rank: 3
title: Personal autonomous agent
abbrev: Personal agent

summary:
  - >
    An always-on daemon on a personal device that takes ambient messages from anyone who can reach
    its channels, runs an unattended agent loop with the user's own credentials, and keeps what it
    learns in files it will read back as instruction. Assembled by the user from a harness, wired-up
    tools and pasted-in keys — there is no vendor application wrapping it.

description:
  - >
    The harness is a long-lived process, not an invocation. It owns the channel bridges, the agent
    loop, a heartbeat that fires with nobody watching, and a memory directory the next turn treats
    as context. Nothing about it is scoped to a task: it starts when the machine starts and ends
    when the user kills it.
  - >
    Three default postures make this a distinct architecture rather than a variation on a coding
    assistant — each now exists as an opt-in feature over there, and is the resting state here.
    It listens — whoever can reach a bridge can address the agent, and the bridge is
    the authorization decision. It runs unattended — the heartbeat starts the loop with no human
    seeing the plan before the tools execute. And it remembers in a medium it re-reads as
    instruction — one successful injection written into memory survives restarts and re-executes
    on the schedule.
  - >
    The target state wraps the harness whole. A microVM-class sandbox contains the daemon, its
    memory and a deliberately local tool surface — files, shell and skills, with their own
    kernel, filesystem, packages and network — and remote reach is pushed outside the boundary.
    The AI gateway is the general-purpose exit: deny-by-default egress for all outbound
    traffic, credentials injected at the crossing so the sandbox itself holds no secrets, and
    the audit tap. Remote MCP servers and external APIs sit behind the gateway as their own
    tool surface, and only they touch downstream services. Two other openings exist: a
    read-only pull from a private, organisation-maintained package registry, and the owner's
    workspace folders, shared into the sandbox explicitly and nothing else. The boundary is
    also what the approval prompts traded away — shipped sandboxes run the agent approval-free
    inside, on the position that isolation, egress policy and credential injection replace
    per-command consent. Products now ship exactly this wrap for the popular harnesses; the
    drawing is that pattern, vendor-neutral.
  - >
    The governance band this drawing carries is entirely the organisation's addition — the
    assembled-by-user common state has none of it: no agent identity distinct from the user,
    no policy engine consulted per tool call, no audit sink beyond the gateway's tap, no kill
    switch beyond killing the process. The sandbox bounds the blast radius; the governance
    services drawn beneath are what it takes to actually govern the agent.

distinguishedBy:
  - >
    Against the coding and desktop agents: the capabilities have converged — those now take
    remote steering, scheduled runs and agent-written memory too — so what separates the
    archetypes is defaults, identity and custody. There, each of those is opt-in, reaches the
    machine as an outbound relay only the owner's vendor account can address, and can be
    switched off from an admin console. Here, listening is the resting state, the sender set is
    whoever the messaging platform admits, the keys are long-lived and pasted in, and the whole
    thing is pieced together by the user with no console anyone can switch anything off from.
    The exposure scans still tell the story: personal gateways bind ports and get found by the
    tens of thousands; a vendor agent's remote channel opens no inbound port at all.
  - >
    Against a cloud agent service: the same loop hosted by a provider gets an identity, a policy
    boundary, an audit trail and an administrator by default. Moving this architecture off the
    endpoint changes almost nothing about the loop and almost everything about the governance.

exemplars:
  - name: OpenClaw
    note: >
      The reference implementation of the pattern: a gateway daemon owning all state, channel
      bridges for a dozen messaging platforms, an embedded agent runtime, Markdown memory with a
      scheduled heartbeat, in-process skills from a public registry, and paired device nodes.
    url: https://docs.openclaw.ai/concepts/architecture
    asOf: "2026-08"
  - name: Hermes Agent
    note: >
      An independent implementation with a candid threat model, which states plainly that its deny
      rules guard against an honest-but-wrong agent rather than an adversarial one. Its
      self-improvement feature — the agent writing its own skills — is this archetype's
      persistence vector made into a product decision.
    url: https://hermes-agent.nousresearch.com/docs/user-guide/security
    asOf: "2026-08"
  - name: Homegrown harnesses
    note: >
      The long tail: a script, a messaging webhook, an API key in a dotfile, and cron.
      Structurally identical and considerably more common than either named project.
    asOf: "2026-08"

zones:
  - id: zoneUser
    owner: user
    note: >
      The owner and the surfaces they instruct the agent from — messaging apps, the gateway's
      control UI, the local terminal.
  - id: zoneEndpoint
    owner: endpoint
    note: >
      The managed device and the sandbox on it: the loop, its local tools and its state.
      Nothing here reaches our systems or the outside except through a crossing.
  - id: zoneCloud
    owner: cloud
    note: >
      Infrastructure we operate — the messaging relay, the bundled AI gateway, and the internal
      servers and data the agent is meant to reach. The crossings live here alongside what they
      protect.
  - id: zoneVendor
    owner: vendor
    note: >
      The contracted messaging tenant — the one vendor relationship this architecture has. A
      consumer channel with no agreement is a different posture, recorded as a deviation
      rather than drawn.
  - id: zoneExternal
    owner: external
    note: >
      Outside the company: model providers, third-party tool servers, the open web — and the
      unsolicited senders who arrive through the messaging platform.
  - id: zoneGovernance
    owner: governance
    note: >
      Drawn across every band because it governs every band: identity and secrets the crossing
      consumes, the policy it enforces, the registry it serves from, the audit it writes, and
      the kill switch that ends all of it — including what may be reached externally.

blocks:
  - id: owner
    kind: actor
    title: Owner
    icon: person
    zone: zoneUser
    col: 0
    row: 1
    note: The person the agent acts for — and, from the agent's side, indistinguishable from anyone else the platform admits.

  - id: remoteDevice
    kind: service
    title: Remote device
    cosaiComponent: componentAgentUserQuery
    zone: zoneUser
    col: 0
    row: 0
    note: >
      The surfaces the owner instructs from: messaging apps, the gateway's control UI, and the
      local terminal. Identity here is whatever the platform asserts.
    items:
      - id: messagingApps
        label: Messaging apps
        icon: chat
        note: The owner's chat clients — the same platforms an unbounded sender set can reach.

  - id: sandbox
    kind: boundary
    title: Sandbox
    zone: zoneEndpoint
    col: 1
    row: 2
    note: >
      A microVM-class boundary around the loop, its state and its local tools — the core
      recommendation for this archetype, and the control that bounds every other failure on
      this page. Its own kernel, filesystem and network, and no approval prompts inside,
      because the boundary replaces them.
      Three openings are deliberate and each is a control decision. The workspace is mounted
      directly at the same path and propagates both ways, so a read-only clone is the safer
      default. Skills persist across sandboxes and are therefore a contamination channel
      between them. Egress leaves through a host-side proxy whose allowlist ships with broad
      wildcards worth pruning. The target state runs local MCP servers inside this boundary
      with the rest of the tool surface; the common state runs them on the host with host
      privileges — the gap every implementation shares, carried as the risk pinned on the
      tool plane.
      What earns the boundary its keep: the model credential is injected into request headers
      by that host-side proxy, so the key never enters the sandbox and an agent that can
      exfiltrate cannot steal it.

  - id: bridges
    kind: service
    title: Channel bridges
    parent: sandbox
    cosaiComponent: componentAgentUserQuery
    zone: zoneEndpoint
    col: 1
    row: 0
    note: >
      One adapter per platform, each implementing its own sender check. The count of channels
      is the count of independent admission surfaces.
    items:
      - id: adapters
        label: Channel adapters
        icon: chat
        note: Per-platform inbound and outbound handling, bound to loopback.
      - id: pairing
        label: Pairing records
        icon: doc
        note: >
          Which platform identity is bound to this agent — the artifact the admission decision
          reads, and as strong as the platform that issued it.

  - id: harness
    kind: service
    title: Agent harness
    cosaiComponent: componentReasoningCore
    parent: sandbox
    zone: zoneEndpoint
    col: 0
    row: 1
    note: >
      The long-lived loop that plans, calls tools and reads results back as context, with the
      heartbeat that starts it when nobody is watching.
    items:
      - id: loop
        label: Agent loop
        icon: agent
        note: Plans, calls tools, reads results back as context. Nobody reviews the plan.
      - id: heartbeat
        label: Heartbeat
        icon: clock
        note: The tick that converts a one-time injection into a recurring one.
      - id: context
        label: Context assembly
        icon: doc
        note: Merges the message, the memory and the tool results into one prompt.
      - id: apiServer
        label: Local API server
        icon: plug
        note: >
          The daemon's control WebSocket and dashboard on loopback — the surface the exposure
          scans keep finding on routable interfaces, and a documented token-exfiltration
          surface even when the bind is right.

  - id: memory
    kind: service
    title: Memory & state
    cosaiComponent: componentDataStorage
    parent: sandbox
    zone: zoneEndpoint
    col: 0
    row: 2
    note: >
      Cross-session files the agent writes and reads back as instruction — the persistence
      primitive, and the reason an injection outlives the message that carried it.
    items:
      - id: memoryFiles
        label: Memory files
        icon: folder
        note: Prose the next turn treats as instruction.
      - id: rules
        label: Rules & instructions
        icon: doc
        note: >
          The bootstrap files the agent reads as its own standing instruction — and, on the
          harnesses that write their own skills, edits.
      - id: index
        label: Search index
        icon: search
        note: Retrieval over everything the agent has ever kept.

  - id: toolPlane
    kind: service
    title: Tool services
    cosaiComponent: componentTools
    parent: sandbox
    zone: zoneEndpoint
    col: 1
    row: 2
    note: >
      The local surface inside the sandbox — files, shell and skills. Remote transports are not
      here: they live behind the enterprise crossing by construction.
    items:
      - id: editTools
        label: File & edit tools
        icon: folder
        note: Read and write on the sandbox filesystem and the mounted workspace.
      - id: shell
        label: Shell commands
        icon: code
        note: Command execution inside the sandbox, never on the host.
      - id: localMcp
        label: MCP servers
        icon: plug
        note: >
          Local child processes, run inside the boundary in the target state so they hold the
          sandbox's authority rather than the user's. The common state runs them on the host —
          the containment gap the risk pin records.
      - id: skills
        label: Installed skills
        icon: gear
        note: >
          Prose that instructs the loop to run installers, plus code loaded into the daemon's
          own process — the "prerequisites" step is where a stealer ran.
      - id: computerUse
        label: Computer use
        icon: eye
        note: >
          Drives the host browser over the debugging protocol and inherits every signed-in
          session in it — outside the boundary by construction. Disabled in the target state,
          or pointed at a browser that lives inside the sandbox.

  - id: workspace
    kind: external
    title: Owner workspace
    cosaiComponent: componentDataSources
    zone: zoneEndpoint
    col: 1
    row: 3
    note: >
      The host folders shared into the sandbox — mounted read-only with a private clone in the
      enterprise posture, so an agent edit is a reviewable diff rather than a host write.
    items:
      - id: sharedPaths
        label: Shared folders
        icon: folder
        note: Explicitly listed paths only; the home directory and its credentials are simply absent.

  - id: relay
    kind: service
    title: Messaging relay
    zone: zoneCloud
    col: 2
    row: 1
    note: >
      The outbound-only connector between the endpoint and the messaging platform, so platform
      credentials never sit on the device and no inbound port is ever opened.
    items:
      - id: outbound
        label: Outbound connector
        icon: plug
        note: The endpoint dials out; nothing dials in.
      - id: platformCreds
        label: Platform credentials
        icon: key
        note: The messaging tenant's credentials, held here so they never sit on the device.

  - id: gateway
    kind: service
    title: AI gateway
    zone: zoneCloud
    col: 2
    row: 2
    note: >
      The single bundled crossing this organisation operates: model proxying, MCP and tool
      brokerage, and skills admission in one tier. Every call out of the endpoint that is not
      the relay or a pull from the mirror leaves through here.
    items:
      - id: llmProxy
        label: Model proxy
        icon: model
        note: The only provider endpoint the harness knows — allowlisted models, routed by data class.
      - id: mcpBroker
        label: MCP & tool broker
        icon: plug
        note: The approved server catalogue, tool-level scoping and token exchange to the owner's scope.
      - id: skillsBroker
        label: Skills broker
        icon: gear
        note: >
          Admission for skills: which skills and images are permitted at all, and the pins the
          mirror serves against. The bytes do not pass through here — the sandbox pulls them
          from the mirror directly.

  - id: registry
    kind: external
    title: Private pkg registry
    cosaiComponent: componentDataSources
    zone: zoneCloud
    col: 3
    row: 3
    note: >
      The organisation-maintained mirror the sandbox pulls skills and images from — reviewed,
      signed and pinned before anything is installable. The registry moves the review
      earlier; it does not remove the risk.
    items:
      - id: approvedPackages
        label: Approved packages
        icon: db
        note: Skills, plugins and sandbox base images — the only sources the gateway will serve.

  - id: govIdentity
    kind: governance
    title: Identity services
    icon: person
    zone: zoneGovernance
    col: 1
    row: 6
    capabilities: [capabilityKillSwitch, capabilityIga]
    note: >
      The IdP and the non-human identity plane: one workload identity per agent, bound to its
      owner and device, the pairing admission the bridges enforce, and the revocation that
      ends every path at once.

  - id: govSecrets
    kind: governance
    title: Secrets & key management
    icon: key
    zone: zoneGovernance
    col: 2
    row: 6
    capabilities: [capabilitySecretsManagement, capabilityCredentialIsolation]
    note: >
      The vault and the just-in-time credential path — short-lived, scoped tokens issued from
      outside whatever is asking for them.

  - id: govPolicy
    kind: governance
    title: Policy & authorization
    icon: scale
    zone: zoneGovernance
    col: 3
    row: 6
    capabilities: [capabilityAgentRuntimeEnforcement, capabilityEgressControl, capabilityRateLimiting]
    note: >
      The policy engine the crossings consult per call, and the egress and rate decisions it
      carries — authored where the workload cannot reach them.

  - id: govSupplyChain
    kind: governance
    title: Supply-chain assurance
    icon: db
    zone: zoneGovernance
    col: 4
    row: 6
    capabilities: [capabilityMcpToolSecurity]
    note: >
      The registry, signing and scanning that decide which agents, tools, servers and images
      are admitted at all, and the vendor assessments behind them.

  - id: govObservability
    kind: governance
    title: Observability & response
    icon: eye
    zone: zoneGovernance
    col: 5
    row: 6
    capabilities: [capabilityAuditLogging, capabilityShadowAiDiscovery, capabilityBehavioralDriftDetection]
    note: >
      Telemetry, the audit trail the workload cannot amend, discovery of what nobody
      registered, the baseline that notices drift, and the containment path when something
      goes wrong.

  - id: internalTools
    kind: service
    title: Tool services
    cosaiComponent: componentTools
    zone: zoneCloud
    col: 2
    row: 3
    note: >
      The organisation's own tool servers and service APIs — the connectors we publish for our
      own agents. This is what the agent is actually meant to reach, and the gateway in front
      of it is what decides which of them it may.
    items:
      - id: internalMcp
        label: MCP servers
        icon: plug
        note: Our own servers, listed in the catalogue the gateway enforces.
      - id: internalApis
        label: APIs & connectors
        icon: plug
        note: Service APIs reached on grants the gateway issues, scoped to the owner.

  - id: orgData
    kind: external
    title: Enterprise data
    cosaiComponent: componentDataSources
    zone: zoneCloud
    col: 2
    row: 4
    note: >
      The systems of record behind our own tool servers — the data the agent reads and the
      records it changes. Ours to classify, ours to log, and the reason the crossing exists.
    items:
      - id: records
        label: Org data
        icon: db
        note: Documents, tickets and records the internal servers read and write.
      - id: fileStorage
        label: File storage
        icon: folder
        note: Governed content stores reached through our own connectors, not the device's mounts.

  - id: platform
    kind: external
    title: Messaging platform
    cosaiComponent: componentDataSources
    zone: zoneVendor
    col: 4
    row: 0
    note: >
      The messaging vendor's cloud, holding the corporate tenant under an agreement we signed.
      It authenticates senders to its own satisfaction, which is the only sender assurance
      this architecture inherits.
    items:
      - id: tenant
        label: Platform tenant
        icon: chat
        note: Where the corporate bot lives, and where message retention actually happens.

  - id: provider
    kind: provider
    title: Model provider
    cosaiComponent: componentModelServing
    zone: zoneExternal
    col: 5
    row: 1
    note: The inference API, reached only through the gateway on a brokered credential.
    items:
      - id: inference
        label: Inference API
        icon: model
        note: The completion it returns is unauthenticated content that drives tool calls.

  - id: remoteTools
    kind: service
    title: Tool services
    cosaiComponent: componentTools
    zone: zoneExternal
    col: 5
    row: 3
    note: >
      The MCP servers and connectors the gateway's catalogue admits — outside the boundary,
      reachable only through it.
    items:
      - id: mcp
        label: MCP servers
        icon: plug
        note: Admitted by catalogue, never discovered; their descriptions enter context as model input.
      - id: apis
        label: APIs & connectors
        icon: plug
        note: Service calls made on brokered, owner-scoped credentials.

  - id: downstream
    kind: external
    title: Downstream services
    cosaiComponent: componentDataSources
    zone: zoneExternal
    col: 5
    row: 4
    note: >
      Where actions land and where fetched content comes back from — untrusted on the way in,
      consequential on the way out.
    items:
      - id: saas
        label: SaaS
        icon: mail
        note: The owner's mail, calendar and service accounts.
      - id: web
        label: Web & APIs
        icon: globe
        note: Attacker-writable content that re-enters the loop as context.

  - id: senders
    kind: actor
    title: Unsolicited senders
    icon: people
    zone: zoneExternal
    col: 5
    row: 0
    note: >
      Anyone the messaging platform admits. On a public network that is an unbounded set, and
      the message body is model input.

edges:
  - from: owner
    to: remoteDevice
    path: primary
    bidir: true
    label: instruction / reply
    note: The owner writes on their own surfaces; everything after this rides platform identity.
  - from: owner
    to: harness
    path: primary
    bidir: true
    route: vh
    label: local session
    note: >
      The other way in, and the one most owners actually use day to day: a terminal or TUI on
      the machine attaching straight to the loop. No bridge, no pairing record, no channel
      admission — proximity to the device is the whole of the authorisation, which is why the
      device's own posture carries this path.
  - from: remoteDevice
    to: platform
    path: external
    bidir: true
    label: messaging apps
    note: >
      The owner's chat client talks to the messaging platform, exactly like anybody else's. It
      does not reach the laptop directly and has no privileged route to it — which is why the
      owner's instruction and a stranger's arrive by the same path and are told apart, if at
      all, by whatever the platform asserts about the sender.
  - from: bridges
    to: relay
    path: primary
    bidir: true
    label: outbound only
    note: >
      The endpoint dials the relay; the relay holds the platform credentials. No inbound port
      is opened on the device, which is what the exposure scans keep finding elsewhere.
  - from: relay
    to: platform
    path: external
    bidir: true
    route: hv
    note: The relay speaks to the messaging tenant on credentials that never touch the endpoint.
  - from: senders
    to: platform
    path: external
    label: unsolicited message
    note: >
      Anyone the platform admits can address the bot. The bridge's allowlist is the only thing
      between that set and the loop.
  - from: bridges
    to: harness
    path: primary
    bidir: true
    note: Normalised messages in; rendered replies out, to wherever the agent addresses them.
  - from: harness
    to: memory
    path: primary
    bidir: true
    note: The loop writes what it learns and reads it back as instruction on every later turn.
  - from: harness
    to: toolPlane
    path: primary
    bidir: true
    route: hv
    label: local tool calls
    note: Files, shell and skills — all inside the sandbox, none of it on the host.
  - from: toolPlane
    to: workspace
    path: primary
    bidir: true
    label: workspace mount
    note: >
      The shared folders, mounted read-only with a private clone so an agent edit returns as a
      reviewable diff rather than a host write.
  - from: harness
    to: gateway
    path: primary
    bidir: true
    label: model & tool calls
    note: >
      The one general-purpose crossing: every model call, every remote tool call and every
      skill fetch leaves the endpoint here, on a credential the gateway injects.
  - from: gateway
    to: provider
    path: external
    bidir: true
    route: hv
    note: Inference on a brokered credential, against an allowlisted model, logged at the crossing.
  - from: gateway
    to: remoteTools
    path: external
    bidir: true
    label: brokered tool calls
    route: hv
    note: Admission is the catalogue; every call carries an owner-scoped, short-lived credential.
  - from: remoteTools
    to: downstream
    path: external
    bidir: true
    note: Actions land on real accounts; whatever comes back re-enters the loop as context.
  - from: gateway
    to: internalTools
    path: primary
    bidir: true
    label: internal tool calls
    note: >
      The path the organisation actually wants the agent to use: our own MCP servers and APIs,
      admitted by the catalogue and reached on grants the crossing issues.
  - from: internalTools
    to: orgData
    path: primary
    bidir: true
    label: scoped reads & writes
    note: >
      Our systems of record, reached under the owner's scope rather than a standing service
      account — and logged on our side of the boundary.
  - from: toolPlane
    to: registry
    path: primary
    bidir: true
    route: hv
    label: pinned installs
    note: >
      Skills, images and packages pulled straight from the mirror, pinned by digest — never
      from a community hub. The sandbox's egress policy is what makes the mirror the only
      place it can fetch from; the AI gateway brokers model and tool calls and is not on this
      path.
pins:
  risks:
    - risk: riskInsecureIntegratedComponent
      at: toolPlane
      note: >
        The target draws MCP servers inside the boundary; every current implementation runs
        them on the host with host privileges, and browser control drives the host browser
        outright — true of Docker Sandboxes, OpenClaw and Hermes
        alike. Until an implementation closes that gap, third-party code in this surface has
        the user's full authority, and the containment the drawing shows is the requirement,
        not the shipped state.
    - risk: riskPromptInjection
      at: senders->platform
      note: The message body is model input, from a set the platform bounds and the organisation does not.
    - risk: riskPromptInjection
      at: memory
      note: >
        Memory is prose the next turn treats as instruction; an injection written here survives
        restarts and re-executes on the heartbeat.
    - risk: riskPromptInjection
      at: remoteTools->downstream
      note: Fetched content re-enters the loop indistinguishable from the owner's own words.
    - risk: riskPromptInjection
      at: internalTools->orgData
      note: >
        Org documents and records are unrelated instruction entering context — many hands
        wrote them, none of them authenticated as the owner.
    - risk: riskAgenticDelegationConfusedDeputy
      at: gateway->remoteTools
      note: >
        The agent acts on the owner's accounts with whatever the token exchange granted —
        delegation that does not narrow to the task is the owner's whole reach on a loop
        nobody is watching.
    - risk: riskInsecureIntegratedComponent
      at: harness
      note: >
        The listening surface itself: the daemon's control WebSocket bound to a routable
        interface instead of loopback is the exposure the scans keep finding, and the loopback
        dashboard is a documented token-exfiltration surface even when the bind is right — the
        owner's own browser defeats "localhost is not reachable" from inside.
    - risk: riskStaleAgentIdentityBinding
      at: relay->bridges
      note: >
        Pairing records outlive devices and people, and this is the hop where they are the only
        thing distinguishing the owner's message from anybody else's arriving off the same
        platform.
    - risk: riskRunawayAgentToolLoops
      at: harness
      note: The heartbeat restarts the loop unattended, and nothing bounds what a bad turn spends.
    - risk: riskShadowAndUnknownAgents
      at: harness
      note: Installed by one person in an afternoon, in no inventory until something looks for it.
    - risk: riskSensitiveDataDisclosure
      at: harness->gateway
      note: >
        Everything the loop has assembled — memory, workspace content, tool results — crosses
        here. The gateway's inspection is the only place it can be seen.
    - risk: riskInsecureModelOutput
      at: harness
      note: The completion is unauthenticated content, and it chooses the next tool call.
    - risk: riskCovertChannelsInModelOutputs
      at: gateway->provider
      note: >
        An always-on loop with an outbound path and no human reading its traffic is where
        encoded output stops being a curiosity: the completion that carries hidden content is
        also the completion that decides the next tool call, so the channel and the actuator
        are the same hop. The gateway's record is the only place the pattern could be seen.
    - risk: riskToolSourceProvenance
      at: toolPlane->registry
      note: Skills are prose plus executable code; the registry moves the review earlier, it does not remove it.
    - risk: riskRogueActions
      at: remoteTools->downstream
      note: Unattended triggering, owner-scoped authority and no approval gate compound here.
    - risk: riskToolRegistryTampering
      at: gateway->remoteTools
      note: The catalogue decides what the agent can be made to do; whoever edits it programs the agent.

    - risk: riskSensitiveDataDisclosure
      at: bridges->relay
      note: >
        The reply is addressed by the loop, not the owner: whatever the turn read — memory,
        workspace content, tool results — leaves here to whichever chat the message named, and
        never touches the gateway.
  capabilities:
    - capability: capabilityPromptInjectionDefense
      at: relay
      note: >
        Classify inbound content at the first tier we operate — every message is untrusted,
        the owner's included; the platform before this hop is somebody else's cloud.
    - capability: capabilityIga
      at: bridges
      note: >
        One admission decision for every channel — directory-bound pairing, re-checked, and
        enforced identically per bridge rather than reimplemented per platform. Identity is
        the whole of the admission on this surface.
    - capability: capabilityAgentRuntimeEnforcement
      at: gateway
      note: >
        Proposed actions evaluated per call at the crossing before they leave — this action,
        this scope, now — rather than a session-time grant the loop argues with itself about.
        Unattended turns are tagged at ingress and bound to a read-only or draft class on
        every outbound leg, internal and remote alike.
    - capability: capabilityTransportSecurity
      at: harness
      note: >
        Loopback binding, authenticated dashboard transport with origin checks, and an
        outbound-only relay — so the endpoint never listens, and the browser next door is
        treated as hostile.
    - capability: capabilityMemoryProtection
      at: harness->memory
      note: Treat memory as untrusted input on read; scan what is written; scope what is kept.
    - capability: capabilityAgentSandboxing
      at: sandbox
      note: >
        The boundary itself, with its own kernel, filesystem and network — the operator owns
        the spec and the agent cannot edit it. Note what this buys beyond containment: with the
        model credential injected at the host-side proxy, the key never enters the boundary, so
        an agent that can exfiltrate has nothing to exfiltrate.
    - capability: capabilityToolPermissionScoping
      at: harness->toolPlane
      note: Per-tool grants on the local surface instead of the daemon's full authority.
    - capability: capabilityCredentialIsolation
      at: gateway->remoteTools
      note: >
        On-behalf-of exchange at the crossing: each remote call carries a token narrowed to
        the task, never the owner's standing grants — the bounded delegation that answers the
        confused deputy pinned beside it.
    - capability: capabilitySecretsManagement
      at: harness->gateway
      note: >
        Credentials brokered per call at the crossing and injected into request headers by the
        host-side proxy, so nothing is at rest inside the boundary and the loop never holds a
        key it could leak.
    - capability: capabilityEgressControl
      at: gateway
      note: Deny-by-default egress at the one crossing — models, tools and destinations each named.
    - capability: capabilityModelGuardrails
      at: gateway->provider
      note: The inspection a hosted product would have applied, run by the organisation on both legs.
    - capability: capabilityMcpToolSecurity
      at: toolPlane->registry
      note: >
        Provenance, signing and version pinning on the supply path — an update is a decision,
        and drift between what was reviewed and what installs is an alert.
    - capability: capabilityHitlControls
      at: gateway->remoteTools
      note: >
        The approval gate fires at the crossing, before the call leaves anything we operate —
        because no human saw the plan, and past this hop nobody can pause it.
    - capability: capabilityHitlControls
      at: internalTools->orgData
      note: >
        Approval on consequential writes to systems of record, mirroring the coding-agent
        siblings — rare enough that each prompt is read.
    - capability: capabilityToolPermissionScoping
      at: internalTools->orgData
      note: Reads and writes bounded to the owner's scope on the record, never a standing service account.
    - capability: capabilityRateLimiting
      at: harness->gateway
      note: Spend and iteration ceilings on the crossing, sized for a loop that wakes itself.
    - capability: capabilityAuditLogging
      at: gateway
      note: >
        One correlated trace per message — prompt, tool calls, effects — captured at the
        crossing every call already passes, and written where the agent cannot amend it.
    - capability: capabilityKillSwitch
      at: gateway
      note: >
        Revoking the agent's identity denies every flow at the crossing within seconds, without
        a deploy — which is why the crossing is where the stop is enforced.
    - capability: capabilityShadowAiDiscovery
      at: harness
      note: Find the installs nobody registered, derived from the device rather than self-reported.
    - capability: capabilityEdr
      at: harness
      note: >
        A long-lived daemon with shell access is exactly the workload endpoint telemetry
        exists for — incident 06's payload was a commodity stealer, and the device tooling is
        what would have seen it.
    - capability: capabilityBehavioralDriftDetection
      at: govObservability
      note: >
        A baseline over the gateway's record is the only place a covert channel or a runaway
        pattern could be seen — somebody has to be reading the trace the pins keep citing.

    - capability: capabilityAiDlp
      at: relay
      note: >
        Outbound classification on the reply leg — the only inspection the messaging path gets,
        because the gateway never sees it.
    - capability: capabilityAgentRegistry
      at: gateway
      note: >
        Every daemon that reaches the crossing is inventoried there — the one archetype whose
        incident says owners were found by scanning, not by inventory.
    - capability: capabilityEgressControl
      at: toolPlane->registry
      note: >
        The sandbox's egress policy is what makes the mirror the only place it may fetch from —
        a deny-by-default allowlist with one entry. The AI gateway is not on this path; it never
        was for a package manager.
walkthrough:
  title: The owner asks the agent to do something
  moves: >-
    An instruction from the owner, the inference it drives, and the action that lands on
    their accounts.
  steps:
    - follow: owner->harness
      note: >
        The owner is at the machine and talks to the loop directly — authorised by nothing but
        holding the device, which is the assumption the whole drawing rests on.
    - follow: harness->memory
      note: >
        The loop assembles context: the system instruction, long-term memory files, and the
        transcript of everything said before.
    - follow: memory->harness
      note: All of it loads as context — including whatever an earlier turn persisted.
    - follow: harness->gateway
      note: The one exit the harness knows; direct provider domains are refused at this tier.
    - follow: gateway->provider
      note: Inference on a brokered credential, against an allowlisted provider.
    - follow: provider->gateway
      note: The completion comes back across the crossing.
    - follow: gateway->harness
      note: >
        And into the loop as a plan, not a decision — what happens next is the loop's to act
        on and ours to bound.
    - follow: harness->toolPlane
      note: Local work runs inside the sandbox, with the workspace mounted read-only.
    - follow: toolPlane->harness
      note: The result comes back to the loop.
    - follow: harness->gateway
      note: >
        The action leaves on the same brokered crossing, which is where scope, spend and the
        record are decided rather than at the tool.
    - follow: gateway->internalTools
      note: >
        The flow the deployment exists for: our own servers and APIs, admitted by the
        catalogue on grants the crossing issues.
    - follow: internalTools->orgData
      note: >
        Reads and writes on our systems of record, under the owner's scope and behind the
        approval gate — logged on our side of the boundary.
    - follow: orgData->internalTools
      note: The record comes back.
    - follow: internalTools->gateway
      note: Through the crossing again, where it is logged against the call that caused it.
    - follow: gateway->remoteTools
      note: A tool call on the owner's own accounts, on a grant we scoped rather than one they pasted.
    - follow: remoteTools->downstream
      note: And the effect lands. Read the stranger's walk next; it converges on this same pipe.

scenarios:
  - title: The owner steers the agent from their phone
    steps:
      - follow: owner->remoteDevice
        note: >
          The owner types into a chat client, away from the machine. Everything after this
          rides platform identity — there is no privileged owner channel.
      - follow: remoteDevice->platform
        note: The chat client reaches the messaging platform, exactly as anybody else's would.
      - follow: platform->relay
        note: Our relay collects from the platform; it is outbound-only and opens no inbound port.
      - follow: relay->bridges
        note: >
          Down to the per-platform adapter, where the pairing record is the whole admission
          decision.
      - follow: bridges->harness
        note: >
          Into the loop — indistinguishable at this point from a stranger's message, because
          the owner's instruction arrived by the identical hops. Read the stranger's walk
          beside this one: they are the same road, told apart only by what the platform
          asserts about the sender. Consequential approvals deserve a surface with better
          assurance than either.
  - title: A stranger messages the agent
    steps:
      - follow: senders->platform
        note: The message arrives from a set the platform bounds and the organisation does not.
      - follow: platform->relay
        note: Our relay collects it from the tenant, exactly as it collects the owner's.
      - follow: relay->bridges
        note: The relay hands it to the endpoint over the connection the endpoint opened.
      - follow: bridges->harness
        note: The body enters the loop as model input, past whatever the allowlist checked.
      - follow: harness->gateway
        note: The turn's model call crosses on a brokered credential, inspected on the way out.
      - follow: gateway->remoteTools
        note: Anything remote is admitted by catalogue and carries an owner-scoped credential.
      - follow: remoteTools->downstream
        note: Actions land on real accounts — the approval gate is the last control standing.
      - follow: harness->bridges
        note: The reply carries whatever the turn read.
      - follow: bridges->relay
        note: Out to a chat the stranger chose — the second egress, and the one the gateway never inspects.
  - title: The heartbeat fires with nobody watching
    steps:
      - follow: memory->harness
        note: >
          The heartbeat has no arrow of its own because it fires inside the harness rather
          than calling it from outside — so what it actually carries into the loop is
          whatever is written here, including anything an earlier turn persisted last week.
      - follow: harness->gateway
        note: >
          The unattended turn crosses like any other, but it belongs to a read-only or draft
          action class enforced here at the crossing — not to the same authority an attended
          turn carries.
      - follow: gateway->remoteTools
        note: A one-time injection has become a recurring one, bounded now by the action class.
  - title: A page in the owner's browser reaches the dashboard
    steps:
      - follow: owner->harness
        note: >
          A malicious page in the owner's own browser makes the same loopback calls the
          dashboard makes — localhost is not a boundary against software already on the right
          side of it. An admitted call enters the loop, or walks off with the dashboard token:
          the documented exfiltration surface, defeated only by authenticated transport and
          origin checks on the bind.
      - follow: harness->gateway
        note: >
          Whatever the pivot achieved leaves through the crossing — which is where the record,
          and the revocation, live.
  - title: A skill is installed
    steps:
      - follow: harness->toolPlane
        note: The install runs as a shell command inside the sandbox.
      - follow: toolPlane->registry
        note: Served from the mirror — scanned, signed, pinned — and from nowhere else; the egress policy allows no other source.
      - follow: registry->toolPlane
        note: The signed skill comes back into the sandbox.
      - follow: toolPlane->harness
        note: >
          Its prerequisites run as shell — inside the boundary, where a stealer finds no
          keychain and no key. Signing and pinning admit exactly this step; containment is
          what bounds it.

deviations:
  - subject: The messaging tenant is contracted; consumer channels are a variant
    reason: >
      The drawn posture is an enterprise tenant under an agreement, which is why the platform
      sits in the vendor band. A consumer channel with no agreement — the common state for
      personal installs — moves the platform to the external band and removes the tenant
      controls with it; that posture is recorded here rather than drawn as a second topology.
  - subject: The kill switch is cited from Identity services and pinned at the gateway
    reason: >
      Revocation-as-stop: killing the agent's identity denies every flow at the crossing
      within seconds, so the enforcement point is the gateway while the implementing service
      is the identity plane. Deliberate, not drift.
  - subject: The local session is drawn as its own path
    reason: >
      A terminal on the machine and a phone across town are not the same admission problem:
      the phone's message is checked by a bridge against a pairing record, while the local
      session is authorised by nothing but being on the device. Drawing one edge for both hid
      that difference, so the direct path is drawn and the device posture is what governs it.

  - subject: Pairing admission and inbound injection defense are absorbed by the bridges and the relay
    reason: >
      Two inline pins sit on components that are not their registered embodiment. Identity
      governance on the channel bridges is the directory-bound pairing check inside each
      adapter; injection defense on the relay is a content classifier on the collected
      messages. Nothing else on the messaging path can hold either, and both are named so
      the assessment can ask for them by product.
  - subject: The remote dashboard is reached over a tunnel that is not drawn
    reason: >
      The daemon's dashboard is served on the same loopback port as its control socket. Away
      from the machine it is reached over an identity-bound tunnel service — the coding
      agents' Remote relay — never over the messaging relay, which carries chat and nothing
      else. The tunnel is not drawn here because the messaging path is this drawing's remote
      surface; the local API server item and its pins carry the exposure either way.
  - subject: Stale agent identity binding is read as a stale pairing
    reason: >
      The catalogue defines the risk as credentials persisting across an artifact swap. On the
      relay-to-bridges hop the mechanism is the same shape one layer up — a pairing record
      that outlives the device or person it was issued to. The third-party coding agent reads
      the tag the same way on its remote-steering edge.

