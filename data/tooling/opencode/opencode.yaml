# opencode — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# Exclusions: OpenCode Zen and OpenCode Go (the vendor's optional model gateway and subscription) are
# providers the harness can use, recorded as facts and in the spend and kill-switch rows, not entities.
# OpenCode Enterprise (central config with SSO and gateway-only routing) is sales-led with no public
# configuration reference, so no row relies on it. The GitLab integration and ACP editors (Zed, JetBrains)
# are further clients of the same engine, noted in facts rather than variants.
# 2026-09-25: onboarded toolOpencode against the MITRE control rules; every opencode.ai/docs page cited
# answered 200 with no redirect; github.com/sst/opencode redirects to github.com/anomalyco/opencode; docs
# key names were cross-checked against the docs source (packages/web/src/content/docs) and config
# precedence against packages/opencode/src/config/config.ts on the dev branch (commit adee738).
# 2026-10-30: settings table added from the docs source (raw.githubusercontent.com/anomalyco/opencode/dev/
# packages/web/src/content/docs) and the live pages (200). Corrections: opencode.ai/docs/share/ now 404s and
# share appears only in the config schema (opencode.ai/config.json); autoupdate never installs updates (notify
# only); experimental.policies is OpenCode 2 only; the GitHub page no longer documents a share input.
# Latest npm opencode-ai is 1.19.5 (2026-10-28).
# 2026-11-21: opencode.ai/docs now opens on V2 (latest); V1 pages moved under opencode.ai/v1/docs/ and V1 config
# still loads (docs/migrate-v1). Config says "Settings alone cannot stop users from adding providers, MCP servers,
# agents, or plugins; use policies in managed configuration", and docs/policies documents top-level policies
# (experimental.policies still merges) outranking user and project files, so the policiesProviderUse and
# policiesMcpSkillPlugin rows were added. permissionBash had a reviewer's instruction pasted into its name; it is
# permission.bash again, cited to the V1 page. Still open, from migrate-v1: the other permission.* rows (V2
# permissions with actions shell, edit, read; external_directory is allowed by default in V2), snapshot (snapshots),
# subagent_depth (ignored at top level in V2; experimental.subagent_depth), server (ignored in V2) and urls that
# now land on V2 pages.
# 2026-11-21 (follow-up): every row moved to V2 names from docs/migrate-v1, permissions, policies, config, agents,
# mcp-servers, plugins, build/plugins/migrate-v1, cli/web, cli/commands, snapshots and console/budgets (all 200):
# permissions arrays (shell, edit, read, external_directory, webfetch), agents.<id>.steps, experimental.subagent_depth,
# snapshots, mcp.servers, plugins, providers.<id>.settings, update, ctx.tool.hook plugin hooks, and opencode service set
# hostname and password for the ignored server key. The doom_loop row was removed (not a V2 action) and enabled_providers
# folded into policiesProviderUse. Redirects: docs/server/ -> docs/api, docs/web/ -> docs/cli/web/, docs/rules/ ->
# docs/instructions/, docs/zen/ -> docs/console/models/, docs/ide/ and docs/github/ -> v1/docs/ (V1 only).
# OPENCODE_PERMISSION and the TUI auto-approve toggle are not in the V2 docs, so no row relies on them.
vendor: opencode
family: opencode
tools:
  - id: toolOpencode
    name: opencode
    surfaceClasses:
      - endpointCli
      - desktopApp
      - ideExtension
      - ciIntegration
    variants:
      - name: opencode TUI and CLI (V2, npm @opencode/cli 2.3.2, 2026-11-18; V1 is npm opencode-ai 1.19.6)
        class: endpointCli
        url: https://opencode.ai/docs/cli/
      - name: Shared background service, opencode serve and the web UI (headless HTTP server and browser UI)
        class: endpointCli
        url: https://opencode.ai/docs/cli/web/
      - name: OpenCode Desktop
        class: desktopApp
        url: https://opencode.ai/product
      - name: OpenCode IDE extension (VS Code, Cursor, Windsurf, VSCodium; sst-dev.opencode)
        class: ideExtension
        url: https://opencode.ai/v1/docs/ide/
        note: Documented only in the V1 docs; opencode.ai/docs/ide/ redirects there.
      - name: OpenCode GitHub agent (anomalyco/opencode/github action on the customer's runners)
        class: ciIntegration
        url: https://opencode.ai/v1/docs/github/
        note: Documented only in the V1 docs; opencode.ai/docs/github/ redirects there.
    architecture: archCodingAgentFirstParty
    status: ga
    asOf: "2026-11"
    summary:
      - >-
        Anomaly's (formerly SST) open-source terminal coding agent (MIT; npm @opencode/cli): a TUI over a local
        client/server core whose HTTP API also serves the web UI, the desktop app, the IDE extension, ACP
        editors and the SDK. Built-in build and plan agents plus subagents drive shell, edit, read, grep, glob,
        webfetch, websearch, subagent and skill tools, MCP servers, plugins, custom tools and skills; OpenCode 2
        (V2) is the current release and still reads V1 configuration.
        Inference is whatever provider the developer connects: any models.dev provider with a pasted key,
        a local model server, or the vendor's optional OpenCode Console (its models, Go subscriptions and the
        workspace's own providers through the Console gateway).
      - >-
        Prompts, file contents and tool output go straight to the chosen provider; the vendor states it
        stores no code or context. The exception is session sharing (config key share: manual, auto or
        disabled), which syncs the conversation to opencode.ai and publishes a public link; its docs page was
        removed (opencode.ai/docs/share/ answered 404 on 2026-10-30) and the key is documented only in the
        config schema, while the Enterprise page recommends disabling the share pages. Provider keys pasted
        with /connect sit in ~/.local/share/opencode/auth.json.
      - >-
        No vendor control plane governs the harness. A managed tier (opencode.json in /etc/opencode,
        /Library/Application Support/opencode or %ProgramData%\opencode, and the ai.opencode.managed macOS
        preference domain via MDM) outranks global and project config for the keys it sets, and its policies
        (hard denies for providers, tool checks, MCP servers, skills and plugins) cannot be lifted by a user or
        repository. Ordinary settings are not a lock: the config page says they cannot stop users adding
        providers, MCP servers, agents or plugins, opencode run --auto approves every request that is not an
        explicit deny, and a cloned repository's .opencode/ agents and plugins load without a trust prompt. The
        vendor's SECURITY.md says opencode does not sandbox the agent and that the permission system is a UX
        feature, not security isolation.
      - >-
        Enterprise controls are bolt-on: OpenCode Enterprise sells SSO, SCIM, budgets and policies through an
        OpenCode Console workspace, whose Providers and Tools policies reach connected clients, and Console
        budgets cap monthly spend on Console traffic only.
    facts:
      - label: Plans
        value: >-
          Free and open source. The optional OpenCode Console adds workspaces, paid inference, budgets,
          team-wide policies and the Go, Go Plus and Go Teams subscriptions ($10, $40 and $20 a member a
          month); every account starts with a Personal workspace. OpenCode Enterprise adds SSO, SCIM,
          budgets and policies for larger organisations and is sales-led.
        url: https://opencode.ai/docs/console/
      - label: Inference & routing
        value: >-
          Remote or local, bring your own key: /connect or opencode auth login for any models.dev provider,
          environment variables or a project .env file; providers.<id>.settings.baseURL points a provider at a
          proxy or gateway; policies with action provider.use restrict which providers load (V1's
          enabled_providers and disabled_providers still load and become the same policies).
        url: https://opencode.ai/docs/providers/
      - label: Data leaving the device
        value: >-
          Prompts, context files and tool output to the model provider; the model catalogue from models.dev
          (OPENCODE_DISABLE_MODELS_FETCH); an update check (update: notify by default, auto installs, disable
          stops it); plugin package installs and, for plugins that follow a tag, range or branch, update checks at
          startup and every 24 hours; full conversations to opencode.ai when shared (share manual, auto or disabled in the config
          schema).
        url: https://opencode.ai/config.json
      - label: Retention & training
        value: >-
          The vendor stores no code or context; shared conversations stay public until /unshare deletes them.
          Locally, session data sits under ~/.local/share/opencode/project/ and the last ten log files under
          ~/.local/share/opencode/log/. Training and retention are the provider's terms; Console models are
          hosted in the US and EU and their providers keep no data and do not train on it, except the named
          models the Console page lists (for example a free model that keeps data for 30 days).
        url: https://opencode.ai/docs/console/models/
      - label: Docs index
        value: >-
          opencode.ai/docs (V2): Config, Migrate from V1, Permissions, Policies, Agents, Enterprise, Web,
          Network, MCP servers, Plugins, Instructions, Console; V1 pages under opencode.ai/v1/docs/.
        url: https://opencode.ai/docs/
      - label: Managed configuration
        value: >-
          opencode.json or opencode.jsonc in /Library/Application Support/opencode/, /etc/opencode/ or
          %ProgramData%\opencode (root/admin-writable), and a .mobileconfig with PayloadType ai.opencode.managed
          on macOS; highest priority for ordinary settings, merged key by key, and its policies outrank every
          user and project file.
        url: https://opencode.ai/docs/config/
      - label: Security model
        value: >-
          No sandbox; the permission system is a UX feature; malicious config files, MCP server behaviour and
          opted-in server access are out of scope for vulnerability reports. SECURITY.md still says server mode
          is unauthenticated unless OPENCODE_SERVER_PASSWORD is set, while the V2 web page says the shared
          background service is password-protected by default; set the password explicitly.
        url: https://github.com/anomalyco/opencode/blob/dev/SECURITY.md
      - label: Distribution
        value: >-
          V2: the curl install script (opencode.ai/v2/install), npm, Bun and pnpm (@opencode/cli), Homebrew
          (anomalyco/tap/opencode-v2), Vite+, mise and versioned ghcr.io/anomalyco/opencode images; Windows
          package managers are not supported. V1 remains on npm as opencode-ai.
        url: https://opencode.ai/docs/
    items:
      - title: Config tiers and what the managed tier does not hold
        body:
          - >-
            Settings merge from lowest to highest precedence: ~/.config/opencode/opencode.json, the project's
            direct opencode.json(c) files from the farthest directory to the closest, then .opencode/ files in
            the same order, then the system file, then macOS managed preferences. Policies run the other way:
            broader files are evaluated later, and the managed files and a connected Console workspace outrank
            every user and project file.
          - >-
            Outside the managed tier's reach: opencode run --auto, which approves every request that is not an
            explicit deny; the background service's hostname, port and password, set with opencode service set
            (the server key is ignored in V2); repository agents under .opencode/agents/, whose permissions are
            appended after the global rules; and repository plugins under .opencode/plugins/, which execute on
            load unless a plugin.use policy denies them.
        links:
          - title: Config precedence and managed settings
            url: https://opencode.ai/docs/config/
          - title: Policies (precedence)
            url: https://opencode.ai/docs/policies/
      - title: Server mode
        body:
          - >-
            Every local client connects to one shared background service per user, which owns sessions,
            configuration, permissions and tool execution and listens on localhost (port 49374 on macOS, Linux and
            WSL, 28894 on Windows) behind a generated password. opencode service set hostname, port and password
            change it, opencode pair --remote exposes it to the internet through an OpenTunnel address, and
            opencode serve runs the same server in the foreground with --hostname and --port. OPENCODE_PASSWORD
            fixes the password (OPENCODE_SERVER_PASSWORD still works); the username is always opencode.
        links:
          - title: Web (access, remote access, configure, authentication)
            url: https://opencode.ai/docs/cli/web/
          - title: CLI (background service)
            url: https://opencode.ai/docs/cli/
    riskNotes:
      - risk: riskInsecureIntegratedComponent
        note: >-
          The local HTTP server is the harness's control surface (shell, PTY, file read, upgrade endpoints).
          CVE-2026-22812 (no authentication and permissive CORS), CVE-2026-22813 (web-UI XSS reaching /pty) and
          GHSA-632h-h47v-g4x4 (cross-site /global/upgrade installing an arbitrary npm package) each turned a
          web page into code execution. In V2 the shared service is password-protected by default, and opencode
          pair --remote can expose it to the internet.
      - risk: riskToolSourceProvenance
        note: >-
          A cloned repository's .opencode/plugins/ run as code at startup with no trust prompt, and its
          opencode.json can add MCP servers and plugin packages installed on launch; SECURITY.md treats
          malicious config files as out of scope. Plugins that follow a tag, range or branch update themselves on
          startup and every 24 hours, and update "auto" installs new harness versions automatically.
      - risk: riskRogueActions
        note: >-
          The V2 base policy allows every action, outside-workspace paths included, and asks only for .env reads;
          there is no sandbox, and opencode run --auto approves every request that is not an explicit deny; the
          organisation cannot remove auto mode.
      - risk: riskSensitiveDataDisclosure
        note: >-
          /share uploads the full conversation to opencode.ai and publishes it at a public link until unshared;
          share "auto" shares every session. Set share "disabled" in the managed file. Pasted keys sit in
          auth.json.
      - risk: riskPromptInjection
        note: >-
          AGENTS.md (or CLAUDE.md) is read from the working directory upward, instructions accepts HTTP(S) URLs,
          and a repository's .opencode/ adds agents, commands and skills: all without a trust prompt and with no
          content screening.
      - risk: riskInsecureModelOutput
        note: >-
          CVE-2026-22813: the web UI rendered model output as unsanitised HTML with no CSP, so a manipulated
          response ran script on the local API origin; fixed in 1.1.10.
      - risk: riskRunawayAgentToolLoops
        note: >-
          With steps unset an agent iterates until the model stops or the user interrupts; V2 has no doom_loop
          guard (it is not a V2 permission action), and subagents always run in the background.
    controls:
      - mitigation: cap-agent-action-policy-enforcement
        coverage: partial
        mechanism: >-
          Ordered permissions rules ({ action, resource, effect } with allow, ask or deny over shell commands,
          file paths, URLs, subagent and skill ids and MCP tool names; last match wins) in the managed
          opencode.json or the ai.opencode.managed plist; policies with action tool.use, which hard-deny a check
          after agent rules and saved approvals and outrank every user and project file; and a managed plugin's
          ctx.tool.hook("execute.before") as an organisation-written attach point; the background service kept
          on localhost behind its password
        steps:
          - title: Hard-deny in the managed tier
            body:
              - >-
                Put policies in /etc/opencode/opencode.json, /Library/Application Support/opencode/opencode.json
                or %ProgramData%\opencode\opencode.json (or the ai.opencode.managed .mobileconfig), for example
                { "action": "tool.use", "resource": "shell:git push *", "effect": "deny" } and shell:rm *.
            url: https://opencode.ai/docs/policies/
          - title: Ship the ask and allow rules there too
            body:
              - >-
                In the same file add a permissions array: { "action": "shell", "resource": "*", "effect": "ask" }
                first, then allows for read-only commands; cover read, edit, glob, grep, shell, subagent, skill,
                webfetch, websearch, external_directory and "<server>_*" for MCP tools.
            url: https://opencode.ai/docs/permissions/
          - title: Add a policy hook
            body:
              - >-
                List the organisation's plugin in the managed plugins array; its ctx.tool.hook("execute.before")
                callback receives each call's tool and arguments and blocks the call by throwing.
            url: https://opencode.ai/docs/build/plugins/migrate-v1/
          - title: Keep the service on localhost
            body:
              - >-
                Leave the background service's hostname unset (localhost only) and never run opencode service set
                hostname 0.0.0.0 or opencode pair --remote on managed devices, so prompts and permission answers
                reach the server only from the device itself.
            url: https://opencode.ai/docs/cli/web/
        note: >-
          Partial on the drawing's tier rule: deterministic allow/ask/deny rules over tool and resource are
          evaluated by the harness before each built-in, custom and MCP tool call, and a managed tool.use policy is
          a deny no user or repository can lift, but only denies can be locked. Agent permissions are appended
          after the global rules, so a repository can add an agent under .opencode/agents/ whose rules allow what
          the global block asks for; repository plugins load without a prompt unless a plugin.use policy denies
          them; opencode run --auto turns every ask into allow. Shell rules match the scanner's command text, and
          a command it cannot analyse fails rather than runs. The vendor's SECURITY.md calls the permission system
          a UX feature, not isolation. Remote steering: the background service admits any caller holding its
          password to post prompts and answer permission requests, and opencode service set hostname or opencode
          pair --remote, run by the developer, exposes it beyond the device; GitHub comment triggers are
          permission-checked against the commenter (the GitHub page notes scheduled runs have no user to check).
        verified: "2026-11-21"
      - mitigation: cap-sensitive-data-redaction
        coverage: partial
        mechanism: >-
          A managed plugin's ctx.tool.hook("execute.before") (block by throwing) and ctx.tool.hook("execute.after")
          (edit the result) as the attach point for an organisation inspector; read permissions as minimisation;
          providers.<id>.settings.baseURL and a provider.use policy to route model traffic through an inspecting
          AI gateway; no vendor detection
        steps:
          - title: Wire an inspection plugin
            body:
              - >-
                Add the organisation's plugin to the managed plugins array; its execute.before hook blocks calls
                whose arguments carry sensitive data and its execute.after hook replaces the tool result before
                the model reads it.
            url: https://opencode.ai/docs/build/plugins/migrate-v1/
          - title: Route model traffic through the gateway
            body:
              - >-
                Set providers.<id>.settings.baseURL to the organisation's inspecting AI gateway, and in the managed
                file deny provider.use for "*" and allow only that provider.
            url: https://opencode.ai/docs/providers/
        note: >-
          Partial by the rule: the tool-path hooks can block or mask, but opencode detects nothing itself; the
          inspector is organisation code running in the shared service on the device, alongside any plugins a
          repository ships. Content that enters without a tool call (the typed prompt, AGENTS.md, instruction
          files and URLs) is reachable through ctx.session.hook("context"), the V2 destination for the V1
          messages transform. The base policy asks before *.env and *.env.* reads, which keeps named files out
          only while someone answers; that is minimisation, not detection, so set a deny explicitly. The inline
          alternative is an AI gateway at the provider baseURL, or endpoint DLP. share "disabled" in the managed
          file stops whole conversations leaving for opencode.ai.
        verified: "2026-11-21"
      - mitigation: AML.M0036
        coverage: partial
        mechanism: >-
          agents.<id>.steps (maximum model steps) and experimental.subagent_depth in the managed opencode.json;
          OpenCode Console budgets (workspace, members, tags and service accounts) for Console traffic only
        steps:
          - title: Cap steps per agent
            body:
              - >-
                In the managed file set agents.build.steps (and plan, general and every organisation agent); on the
                final step the tools are removed and the model is asked to summarise.
            url: https://opencode.ai/docs/agents/
          - title: Bound delegation depth
            body:
              - >-
                Leave experimental.subagent_depth at its default of 1 (a subagent cannot start another) in the
                managed file; the setting is experimental and may change.
            url: https://opencode.ai/docs/config/
          - title: Cap spend on the Console path
            body:
              - >-
                As a Console workspace owner or admin, add a Budget rule in Controls for the entire workspace and
                for all members, so each member has a monthly allowance.
            url: https://opencode.ai/docs/console/budgets/
        note: >-
          Partial: the harness limits one kind (steps, per agent) and a cost ceiling exists only on the vendor's
          optional Console; there is no per-run token or cost budget. steps is unset by default (the agent
          iterates until the model stops or the user interrupts), new user input resets the allowance, and it
          binds only the agents the managed file names; a repository's .opencode/agents/ definitions carry their
          own. Console budgets are monthly and cover paid Console models and the workspace's own providers with a
          price set. With a bring-your-own key the provider invoice or the organisation's gateway budget is the
          only meter, which is the drawing's pin. compaction and tool_output thresholds bound context size, not
          spend. V2 has no doom_loop guard.
        verified: "2026-11-21"
      - mitigation: AML.M0028
        coverage: partial
        mechanism: >-
          permissions rules per action (read, edit, glob, grep, shell, subagent, skill, webfetch with the URL,
          websearch and "<server>_<tool>" MCP tool names) over paths, commands and URLs, external_directory for
          paths outside the location and worktree, agents.<id>.permissions and experimental.subagent_depth,
          delivered in the managed opencode.json or the ai.opencode.managed plist, with tool.use policies for the
          denies that must hold
        steps:
          - title: Deliver grants in the managed tier
            body:
              - >-
                Place the permissions array in the managed opencode.json (or the MDM plist), and repeat each deny
                that must hold as a tool.use policy, which no user or project file can lift.
            url: https://opencode.ai/docs/policies/
          - title: Scope to the working tree
            body:
              - >-
                Add { "action": "external_directory", "resource": "*", "effect": "ask" } (V2 allows outside paths
                by default) with narrower allows after it, edit rules for the paths a task may change, and a
                "<server>_*" deny for MCP servers a role must not use.
            url: https://opencode.ai/docs/permissions/
          - title: Narrow per agent
            body:
              - >-
                Give each managed agent its own permissions under agents.<id>.permissions (for example plan with
                edit deny) and subagent rules for the agents it may launch.
            url: https://opencode.ai/docs/agents/
        note: >-
          Partial on the tier rule (Claude Code and Gemini CLI are native because their rules are admin-locked):
          per-action grants with path, command and URL patterns exist and the harness enforces them outside the
          model, and managed tool.use denies hold, but allows and asks are not locked: repository-defined agents
          append their own rules, a custom subagent uses its own permissions rather than a subset of its
          parent's, repository plugins can add tools, and opencode run --auto turns ask into allow (see action
          policy). Limits: shell rules match command text and the vendor says the permission system is not
          isolation; MCP tools are scoped by name, not arguments; every tool runs with the developer's own
          authority.
        verified: "2026-11-21"
      - mitigation: D3-EI
        coverage: external
        mechanism: >-
          A VM or dev container the organisation supplies (the ghcr.io/anomalyco/opencode image is an install option);
          opencode ships no sandbox. Credential paths: kept out only by that boundary (no credential mounts); managed
          external_directory and read deny rules and a plugin's ctx.shell.hook("create.before") are the product's
          contributions
        evidence:
          - title: opencode SECURITY.md (No Sandbox)
            url: https://github.com/anomalyco/opencode/blob/dev/SECURITY.md
          - title: opencode docs index (Docker install)
            url: https://opencode.ai/docs/
          - title: Permissions (external_directory, read defaults)
            url: https://opencode.ai/docs/permissions/
          - title: Migrate plugins from V1 (shell.env becomes ctx.shell.hook create.before)
            url: https://opencode.ai/docs/build/plugins/migrate-v1/
        note: >-
          External: the vendor's SECURITY.md says opencode does not sandbox the agent, that the permission system is
          not designed to provide isolation, and that true isolation means running it in a Docker container or VM.
          Integration points: the ghcr.io/anomalyco/opencode image (versioned tags on the docs index), an
          organisation dev container with only the workspace mounted, and managed external_directory deny rules as a
          tool-argument filter inside it. Otherwise every tool, MCP server and plugin runs as the developer on the
          host. Credential paths: with no sandbox, the shell tool inherits the developer's ssh-agent socket,
          git credential helper, ~/.aws, kube and cloud CLI configuration and browser profiles. Contributions: a
          managed external_directory deny (V2 allows outside paths by default) and read deny rules stop the file
          tools (and shell commands whose inferred directories are those paths) reaching outside the workspace, and a
          managed plugin's ctx.shell.hook("create.before") can override variables in every shell it starts; both are
          filters the vendor says are not isolation, and neither covers MCP servers or plugins. Routing models
          through a gateway key keeps upstream provider keys off the device; git, cloud CLIs and MCP servers still
          act as the developer.
        verified: "2026-11-21"
      - mitigation: AML.M0031
        coverage: partial
        mechanism: >-
          edit ask or deny rules on AGENTS.md, CLAUDE.md, opencode.json and .opencode/ files, or tool.use policy
          denies for them, and snapshots true (undo and revert) in the managed opencode.json; managed instructions
          added to every session; OPENCODE_DISABLE_CLAUDE_CODE; no agent-written memory store
        steps:
          - title: Gate writes to instruction and config files
            body:
              - >-
                In the managed file add edit rules such as { "action": "edit", "resource": "*AGENTS.md", "effect":
                "deny" } for AGENTS.md, CLAUDE.md, opencode.json and .opencode/*, or the same as tool.use policies.
            url: https://opencode.ai/docs/permissions/
          - title: Keep agent edits revertible
            body:
              - >-
                Leave snapshots at true in the managed file so the changes of each model step can be undone or
                reverted from the session.
            url: https://opencode.ai/docs/snapshots/
          - title: Publish organisation rules centrally
            body:
              - >-
                List the organisation's rule files or URL in the managed instructions array; they load in every
                session next to the repository's AGENTS.md.
            url: https://opencode.ai/docs/instructions/
          - title: Drop the Claude Code fallbacks
            body:
              - >-
                Export OPENCODE_DISABLE_CLAUDE_CODE=1 in the launch environment so no CLAUDE.md file is read.
            url: https://opencode.ai/docs/migrate-v1/
        note: >-
          Partial: writes can be gated and reverted, but instruction sources cannot be locked and nothing
          validates content. opencode has no agent-written memory; its persistent state is instruction files and
          session history under ~/.local/share/opencode/project/. AGENTS.md (or CLAUDE.md when none exists) loads
          from the working directory upward, ~/.config/opencode/AGENTS.md and ~/.claude/CLAUDE.md load globally,
          instructions accepts globs and HTTP(S) URLs, and a repository's .opencode/ adds agents, commands, skills,
          tools and plugins: none behind a trust prompt. Managed instructions are concatenated with the
          repository's, not substituted; OPENCODE_DISABLE_CLAUDE_CODE is an environment variable only. Edit rules
          cover the edit, write and patch tools, not shell, and a repository agent's own rules can allow what the
          global rules ask for unless a tool.use policy denies it; snapshots are taken before and after each model
          step.
        verified: "2026-11-21"
      - mitigation: cap-input-guardrails
        coverage: partial
        mechanism: >-
          A managed plugin's ctx.tool.hook("execute.after") (edits the result the model receives) as the attach
          point for an organisation classifier; no vendor screening
        steps:
          - title: Screen tool results
            body:
              - >-
                In the organisation's managed plugin, have the execute.after hook send read, webfetch, websearch,
                grep and MCP results to the classifier and replace flagged output before the model reads it.
            url: https://opencode.ai/docs/build/plugins/migrate-v1/
        note: >-
          Partial by the rule: a post-tool hook that can replace output is an attach point; nothing is classified
          until the organisation attaches a classifier, and opencode documents no injection screening. V1 plugins
          do not run in V2 and must be ported to the setup(ctx) API. AGENTS.md, CLAUDE.md, remote instruction URLs
          and skills enter context without a tool call (ctx.session.hook("context") is the attach point there),
          and repository plugins run alongside the organisation's. The external alternative is an AI gateway or
          MCP gateway classifier on the brokered path.
        verified: "2026-11-21"
      - mitigation: D3-CH
        coverage: partial
        mechanism: >-
          {env:VAR} and {file:path} substitution for provider apiKey; keys pasted with /connect or opencode auth
          login stored in ~/.local/share/opencode/auth.json; MCP OAuth tokens in ~/.local/share/opencode/mcp-auth.json;
          provider credential chains (AWS profiles and web identity for Bedrock, Azure CLI Entra ID); managed
          provider.use policies limited to the organisation's gateway provider
        steps:
          - title: Reference credentials, don't paste them
            body:
              - >-
                In the managed file set providers.<gateway>.settings.apiKey to "{env:VAR}" or "{file:path}"
                pointing at a short-lived token the organisation's credential helper writes.
            url: https://opencode.ai/docs/config/
          - title: Make other providers' keys inert
            body:
              - >-
                In the managed file deny provider.use for "*" and allow only the gateway's provider ID, so a key
                for any other provider, however it became known, is not used.
            url: https://opencode.ai/docs/policies/
          - title: Prefer short-lived cloud credentials
            body:
              - >-
                For Bedrock use the AWS credential chain (aws sso login profiles, EKS IRSA) rather than
                AWS_BEARER_TOKEN_BEDROCK, and for Azure choose Microsoft Entra ID (Azure CLI) in /connect.
            url: https://opencode.ai/docs/providers/
        note: >-
          Partial: references and short-lived provider chains exist, but storage is not hardened and plaintext
          keys cannot be forbidden. /connect and opencode auth login write keys to auth.json (a 0600 file in the
          current source; no keychain), keys are also read from environment variables and a project's .env file,
          and a Bedrock bearer token outranks the AWS credential chain. A provider.use policy makes keys for other
          providers inert but does not stop a developer pasting the gateway key itself. A connected Console
          workspace can supply the providers instead. Keeping secrets away from agent commands is under D3-EI.
        verified: "2026-11-21"
      - mitigation: cap-mcp-tool-integrity
        coverage: partial
        mechanism: >-
          opencode installed at a fixed version from the organisation's mirror, with update "disable" or "notify"
          (the default) so nothing installs itself; managed mcp.servers.<name> definitions (command arrays naming a
          pinned package version, remote url) that outrank same-named project entries; a managed plugins list of
          exact package versions
        steps:
          - title: Pin the harness version
            body:
              - >-
                Install opencode at a fixed version from the organisation's package mirror or artifact repository
                and set update to "disable" in the global config; "auto" would install new versions itself.
            url: https://opencode.ai/docs/config/
          - title: Define tool servers centrally
            body:
              - >-
                Define approved servers under mcp.servers in the managed file, with local commands naming an exact
                package version (for example ["npx", "-y", "pkg@1.2.3"]).
            url: https://opencode.ai/docs/mcp-servers/
        note: >-
          Partial by the rule applied to every vendor: definitions admit servers and pin nothing they serve.
          opencode hashes and re-verifies nothing: tool definitions refresh with the server, remote servers are
          unpinned, and a repository's opencode.json can add servers under new names unless an mcp.use policy
          denies them. update defaults to "notify" and "auto" installs new versions without asking; the server's
          /global/upgrade endpoint installed arbitrary packages before 1.18.22 (GHSA-632h-h47v-g4x4). Plugins
          that name what to follow (name@latest, a version range or a Git branch) update themselves on startup and
          every 24 hours; bare names stay on the version installed, and exact versions and commit hashes are
          pinned. npm opencode-ai 1.18.32 (V1) had registry signatures but no provenance attestation.
        verified: "2026-11-21"
      - mitigation: AML.M0029
        coverage: partial
        mechanism: >-
          permissions rules with effect "ask" in the managed opencode.json (once / always, saved for the project /
          reject); only .env reads ask by default; no key removes opencode run --auto
        steps:
          - title: Deliver ask rules in the managed tier
            body:
              - >-
                In the managed opencode.json (or MDM plist) add asks for consequential actions, for example
                { "action": "shell", "resource": "git push *", "effect": "ask" } and an ask for edit "*".
            url: https://opencode.ai/docs/permissions/
          - title: Deny what must never run unattended
            body:
              - >-
                Use a tool.use policy deny rather than an ask for irreversible actions, because auto mode and
                saved approvals still yield to it.
            url: https://opencode.ai/docs/policies/
        note: >-
          Partial on the tier rule (non-overridable approval): a present developer approves each matched call in a
          once / always / reject prompt, but the organisation cannot stop the switch to auto: opencode run --auto
          approves every ask that is not an explicit deny, and no config key removes it. "Allow always" saves the
          proposed pattern as a durable, project-scoped allow; repository agents can turn ask into allow; any
          client holding the service password can answer a permission request from another device; the base
          policy allows almost everything. Rated below Claude Code and Gemini CLI (native), whose administrators
          can remove the bypass modes.
        verified: "2026-11-21"
      - mitigation: cap-agent-tool-registry
        coverage: partial
        mechanism: >-
          Managed mcp.servers definitions plus managed mcp.use, skill.use and plugin.use policies (deny "*" first,
          then allow the approved names); a connected Console workspace's MCP servers; no registry
        steps:
          - title: Keep approved servers in the managed file
            body:
              - >-
                Define each approved MCP server under mcp.servers in the managed opencode.json, which outranks
                project and user entries of the same name.
            url: https://opencode.ai/docs/mcp-servers/
          - title: Admit only listed servers, skills and plugins
            body:
              - >-
                In the managed file deny mcp.use, skill.use and plugin.use for "*", then allow each approved MCP
                server name, skill id and plugin package; clients older than 2.2.3 ignore these actions.
            url: https://opencode.ai/docs/policies/
        note: >-
          Partial by the rule: the managed policies are an enforced allowlist a user or repository cannot widen,
          but they admit by name only, with no owner, version or approval record, so a repository server given an
          allowed name passes; custom tools a repository defines sit outside the lists. An MCP gateway is the
          enforced registry for what a server serves; reconciliation against discovered installs is the governance
          platform's job.
        verified: "2026-11-21"
      - mitigation: cap-agent-tracing
        coverage: partial
        mechanism: >-
          Local logs (opencode debug paths log; OPENCODE_LOG_LEVEL) and the session database (opencode debug paths
          db); a managed plugin registering ctx.tool.hook("execute.before" / "execute.after") and subscribing to
          events with ctx.event.subscribe() to ship records
        steps:
          - title: Ship tool and approval events
            body:
              - >-
                Have the organisation's managed plugin forward what its execute.before and execute.after hooks see
                (tool, arguments, session) and the events it subscribes to with ctx.event.subscribe() to the SIEM.
            url: https://opencode.ai/docs/build/plugins/migrate-v1/
          - title: Collect the local logs
            body:
              - >-
                Point the endpoint log agent at ~/.local/share/opencode/log/ (the ten most recent files are
                kept) and raise the level with --log-level where needed.
            url: https://opencode.ai/docs/troubleshooting/
        note: >-
          Partial: the product writes local logs and session history the developer can delete, and export is
          organisation-written plugin code running in a process the developer controls, so capture is not
          tamper-resistant. No telemetry or OpenTelemetry export is documented, and V2 ignores V1's openTelemetry
          key. The vendor stores nothing unless /share or a Console workspace is used. The gateway tap the drawing
          pins is the complete record for model traffic; local tool execution is visible only to the plugin or EDR.
        verified: "2026-11-21"
      - mitigation: cap-shadow-ai-discovery
        coverage: external
        mechanism: >-
          EDR / MDM software inventory and SSE/CASB; the opencode binary and package names, config and data
          directories, the IDE extension ID and the default serve port are the integration points
        evidence:
          - title: opencode docs index (install methods)
            url: https://opencode.ai/docs/
          - title: Troubleshooting (storage locations)
            url: https://opencode.ai/docs/troubleshooting/
          - title: IDE extension (V1 docs)
            url: https://opencode.ai/v1/docs/ide/
        note: >-
          External: opencode has no account plane that reports installs (the Console sees only its own members and keys).
          Find installs with EDR or MDM inventory: the opencode binary (~/.opencode/bin by default from the
          install script), npm @opencode/cli (V2) and opencode-ai (V1), Homebrew anomalyco/tap/opencode-v2 or
          opencode, Scoop and Chocolatey opencode (V1), the ghcr.io/anomalyco/opencode image, OpenCode Desktop,
          the VS Code extension sst-dev.opencode, and ~/.config/opencode, ~/.local/share/opencode and
          ~/.cache/opencode. On the network, SSE/CASB sees models.dev catalogue fetches, opncd.ai shares and
          Console or Go traffic to opencode.ai; in repositories, the opencode-agent GitHub App and workflows using
          anomalyco/opencode/github.
        verified: "2026-11-21"
      - mitigation: D3-PA
        coverage: external
        mechanism: >-
          EDR on the endpoint; the opencode process tree, its HTTP listener and a managed plugin's tool events are
          the integration points
        evidence:
          - title: Web (default ports of the background service)
            url: https://opencode.ai/docs/cli/web/
          - title: Migrate plugins from V1 (tool hooks)
            url: https://opencode.ai/docs/build/plugins/migrate-v1/
        note: >-
          External (EDR): opencode analyses no process behaviour. EDR sees the shared background service and the
          shells it spawns, stdio MCP server processes (often npx), plugin package installs at startup, and the
          listener: localhost port 49374 on macOS, Linux and WSL and 28894 on Windows by default, every interface
          after opencode service set hostname 0.0.0.0, and an OpenTunnel address after opencode pair --remote.
          There is no process-wrapper key; a launcher script on PATH is the nearest point. Correlate EDR events with
          a managed plugin's execute.before records (command text, session ID).
        verified: "2026-11-21"
      - mitigation: cap-agent-kill-switch
        coverage: external
        mechanism: >-
          Credential revocation at the organisation's AI gateway (on the Console path, removing the member, which
          revokes their keys, or a $0 budget) plus an EDR process kill; the API's session interrupt is local to the
          device's service
        evidence:
          - title: Server API (POST /api/session/{sessionID}/interrupt)
            url: https://opencode.ai/docs/api
          - title: Console budgets (a $0 budget blocks all counted spend)
            url: https://opencode.ai/docs/console/budgets/
          - title: Policies (Console policy changes apply on the next fetch)
            url: https://opencode.ai/docs/policies/
        note: >-
          External: opencode offers no organisation-reachable stop for the local process. The session interrupt
          endpoint stops active execution only through the device's own service. Revoking the key at the
          organisation's gateway, or on the Console removing the member or setting a $0 budget, fails the session's
          next model request; the
          delay is not documented and tool calls already dispatched complete. Console policy changes reach a
          connected client on its next fetch, about once a minute. Keys pasted into auth.json must be rotated at
          each provider. An EDR kill of the opencode process tree is the stop for local work; no page says a
          running tool call stops when configuration changes.
        verified: "2026-11-21"
      - mitigation: cap-agent-egress-control
        coverage: partial
        mechanism: >-
          webfetch rules over the requested URL and websearch rules in the managed file, websearch.use policies
          over search providers; managed provider.use policies with providers.<id>.settings.baseURL pinning model
          traffic to the organisation's gateway; share "disabled"; HTTP_PROXY and HTTPS_PROXY honoured
        steps:
          - title: Pin model traffic to the gateway
            body:
              - >-
                In the managed file deny provider.use for "*", allow the gateway's provider ID, and set its
                providers.<id>.settings.baseURL to the gateway URL.
            url: https://opencode.ai/docs/policies/
          - title: Bound the fetch tools
            body:
              - >-
                Add webfetch rules that deny "*" and allow approved URLs, and a websearch deny, where browsing is
                not needed; repeat the denies as tool.use policies so no repository rule lifts them.
            url: https://opencode.ai/docs/permissions/
          - title: Disable share uploads
            body:
              - >-
                Set share to "disabled" in the managed file so no conversation is synced to opencode.ai.
            url: https://opencode.ai/config.json
          - title: Send the rest through the proxy
            body:
              - >-
                Export HTTP_PROXY and HTTPS_PROXY with NO_PROXY=localhost,127.0.0.1,::1 (the CLI talks to its
                background service), and pass them to the service with opencode service set env.
            url: https://opencode.ai/docs/network/
        note: >-
          Partial on the drawing's rule for on/off controls: the harness's own named egress (model calls, the
          fetch and search tools, share uploads) can be pinned or bounded from the managed tier, and webfetch rules
          match the URL, but there is no destination allowlist for the rest. Shell commands (curl, git, package
          managers), MCP servers, plugins and plugin installs reach the network with the host's routes; shell deny
          rules match command text only; the proxy variables are environment the developer controls and are
          routing until direct egress is blocked. The endpoint egress allowlist enforced by device management is
          the control the drawing pins.
        verified: "2026-11-21"
      - mitigation: D3-FA
        coverage: external
        mechanism: >-
          Package mirror / artifact repository with malware scanning; integration points are the private npm
          registry in ~/.npmrc (honoured for plugin installs), the managed plugins array and installing opencode
          itself from the mirror
        evidence:
          - title: Enterprise, V1 docs (private npm registry FAQ)
            url: https://opencode.ai/v1/docs/enterprise/
          - title: Plugins (package installs and updates)
            url: https://opencode.ai/docs/plugins/
        note: >-
          External: opencode scans nothing it downloads or installs. Plugin packages install at startup and those
          that follow a tag, range or branch update every 24 hours, stdio MCP servers commonly launch through npx,
          and agent commands install packages at will (V2 runs no language servers). The V1 enterprise page
          documents private registries (Artifactory, Nexus) through ~/.npmrc, the integration point for admission
          scanning at the mirror; the V2 page does not repeat it. No model files are loaded unless the developer
          points a provider at a local model server.
        verified: "2026-11-21"
    # The security-relevant settings, each with the baseline value (data/tooling/BASELINE.md).
    # Every key below is delivered in the managed opencode.json (or the ai.opencode.managed macOS
    # profile) by MDM, which outranks user and project config; only its policies are locks. Keys are
    # V2 names (V1 names still load). Verified 2026-10-30; V2 names 2026-11-21.
    settings:
      - id: managedConfig
        name: Managed settings
        where: /Library/Application Support/opencode/, /etc/opencode/ or %ProgramData%\opencode → opencode.json; macOS ai.opencode.managed profile
        setVia: [mdm]
        area: tools
        default: None deployed
        recommended: The keys below in a root-owned managed file on every developer device
        why: Managed keys win over remote, global, project and inline config, so a cloned repository's opencode.json cannot loosen them.
        mitigations: []
        url: https://opencode.ai/docs/config/
        verified: "2026-10-30"
      - id: policiesProviderUse
        name: policies (action provider.use)
        where: Managed opencode.json(c) in the system directory or the macOS ai.opencode.managed profile → policies; or an OpenCode Console workspace's Providers policies
        setVia: [mdm, adminConsole]
        area: data
        default: No statements, so every provider is allowed
        recommended: A deny for "*" followed by an allow for the organisation gateway's provider id only
        value: "Deny every provider, then allow the gateway's"
        why: A denied provider disappears however it became known (catalogue, environment variable, saved account, plugin or config), and no user or project file can allow it again; V1's enabled_providers is turned into the same policy.
        mitigations: [D3-CH, cap-agent-egress-control, cap-sensitive-data-redaction, cap-input-guardrails]
        requires: OpenCode 2
        url: https://opencode.ai/docs/policies/
        verified: "2026-11-21"
      - id: policiesMcpSkillPlugin
        name: policies (actions mcp.use, skill.use and plugin.use)
        where: Managed opencode.json(c) in the system directory or the macOS ai.opencode.managed profile → policies
        setVia: [mdm]
        area: tools
        default: No statements, so every configured MCP server, skill and plugin loads
        recommended: A deny for "*" on each action, followed by allows for the approved MCP server names, skill ids and plugin packages
        value: "Deny all, then allow the approved ones"
        why: Settings alone cannot stop a user or a repository adding servers, skills or plugins; a denied one is removed or not loaded however it was configured. It admits by name only, so version pinning stays with the mcp and plugin rows.
        mitigations: [cap-agent-tool-registry]
        requires: OpenCode 2.2.3 or later on every client
        url: https://opencode.ai/docs/policies/
        verified: "2026-11-21"
      - id: permissionBash
        name: permissions (action shell)
        where: 'managed opencode.json → permissions → { "action": "shell", "resource": ..., "effect": ... } (V1 permission.bash)'
        setVia: [mdm, configFile]
        area: tools
        default: Allow (the base policy allows every action)
        recommended: 'An ask for "*" first, then allows for read-only commands (git status *, ls *) and denies for rm -rf * and git push --force *'
        value: "ask, allow read-only, deny destructive"
        why: Every other shell command waits for approval, and deny rules hold even under opencode run --auto; the last matching rule wins.
        mitigations: [cap-agent-action-policy-enforcement, AML.M0029, AML.M0028]
        url: https://opencode.ai/docs/permissions/
        verified: "2026-11-21"
      - id: permissionEdit
        name: permissions (action edit)
        where: 'managed opencode.json → permissions → { "action": "edit", ... } (V1 permission.edit, write and patch)'
        setVia: [mdm, configFile]
        area: tools
        default: Allow
        recommended: 'An ask for "*", then denies for *opencode.json*, *AGENTS.md and .opencode/*'
        value: "ask, deny config and instruction files"
        why: Each write shows for approval, and the agent cannot rewrite its own config, instructions or plugins.
        mitigations: [AML.M0029, AML.M0031, cap-agent-action-policy-enforcement]
        url: https://opencode.ai/docs/permissions/
        verified: "2026-11-21"
      - id: permissionRead
        name: permissions (action read)
        where: 'managed opencode.json → permissions → { "action": "read", ... } (V1 permission.read)'
        setVia: [mdm, configFile]
        area: data
        default: Allow, with *.env and *.env.* on ask (*.env.example allowed)
        recommended: Allow, with deny for *.env and *.env.* (*.env.example allowed)
        why: Project secrets never enter the context, even when a developer runs opencode run --auto, which turns the default ask into allow.
        mitigations: [AML.M0028, cap-sensitive-data-redaction]
        url: https://opencode.ai/docs/permissions/
        verified: "2026-11-21"
      - id: permissionExternalDirectory
        name: permissions (action external_directory)
        where: 'managed opencode.json → permissions → { "action": "external_directory", "resource": "*", ... } (V1 permission.external_directory)'
        setVia: [mdm, configFile]
        area: tools
        default: Allow (V1 asked)
        recommended: An ask for "*", with no allow entries for the home directory
        why: Any tool touching a path outside the location and worktree, ~/.ssh and ~/.aws included, needs a click; V2 lets them through unasked unless this rule is set.
        mitigations: [AML.M0028]
        url: https://opencode.ai/docs/permissions/
        verified: "2026-11-21"
      - id: permissionWebfetch
        name: permissions (actions webfetch and websearch)
        where: 'managed opencode.json → permissions → { "action": "webfetch", "resource": <URL pattern>, ... } (V1 permission.webfetch and permission.websearch)'
        setVia: [mdm, configFile]
        area: network
        default: Allow
        recommended: Allow
        why: Web fetch is why people use the tool; rules match the requested URL, so regulated teams deny "*" and allow approved hosts.
        mitigations: [cap-agent-egress-control]
        url: https://opencode.ai/docs/permissions/
        verified: "2026-11-21"
      - id: agentSteps
        name: steps
        where: managed opencode.json → agents.build.steps (and agents.plan.steps; V1 agent.<name>.steps or maxSteps)
        setVia: [mdm, configFile]
        area: tools
        default: Unset (the agent iterates until the model stops or the user interrupts)
        recommended: A ceiling such as 100
        why: On the final step the tools are removed and the model must summarise, so a runaway loop ends without someone watching it; new user input resets the allowance.
        mitigations: [AML.M0036]
        url: https://opencode.ai/docs/agents/
        verified: "2026-11-21"
      - id: subagentDepth
        name: experimental.subagent_depth
        where: managed opencode.json → experimental.subagent_depth (top-level subagent_depth is V1)
        setVia: [mdm, configFile]
        area: tools
        default: "1"
        recommended: "1"
        why: Subagents cannot launch further subagents, which bounds fan-out; the setting is experimental and may change without notice.
        mitigations: [AML.M0036]
        url: https://opencode.ai/docs/config/
        verified: "2026-11-21"
      - id: providerBaseUrl
        name: baseURL
        where: managed opencode.json → providers.<id>.settings.baseURL (V1 provider.<id>.options.baseURL)
        setVia: [mdm, configFile]
        area: data
        default: The provider's public endpoint
        recommended: The organisation's AI gateway URL
        why: Model traffic passes the gateway's DLP, injection screening and budgets before any provider sees it.
        mitigations: [cap-sensitive-data-redaction, cap-input-guardrails, cap-agent-egress-control]
        url: https://opencode.ai/docs/providers/
        verified: "2026-11-21"
      - id: providerApiKey
        name: apiKey
        where: managed opencode.json → providers.<id>.settings.apiKey (V1 provider.<id>.options.apiKey)
        setVia: [mdm, configFile]
        area: identity
        default: Unset (keys from /connect, the environment or .env)
        recommended: '"{env:VAR}" or "{file:path}" pointing at a short-lived gateway token the credential helper writes'
        value: "A short-lived gateway token reference"
        why: No long-lived key is written into config or auth.json; a developer can still paste a key, so the gateway should reject long-lived ones.
        mitigations: [D3-CH]
        url: https://opencode.ai/docs/config/
        verified: "2026-11-21"
      - id: mcpServers
        name: mcp.servers
        where: managed opencode.json → mcp.servers.<name> (V1 mcp.<name>)
        setVia: [mdm, configFile]
        area: tools
        default: Unset
        recommended: The approved servers, local commands naming an exact package version
        why: Managed definitions outrank same-named project entries, so a repository cannot repoint an approved server; only an mcp.use policy stops it adding servers under new names.
        mitigations: [cap-agent-tool-registry, cap-mcp-tool-integrity]
        url: https://opencode.ai/docs/mcp-servers/
        verified: "2026-11-21"
      - id: pluginList
        name: plugins
        where: managed opencode.json → plugins (V1 plugin)
        setVia: [mdm, configFile]
        area: tools
        default: Unset
        recommended: The organisation's audit and inspection plugin and approved packages at exact versions, from the private npm registry
        value: "Your audit plugin and pinned approved packages"
        why: Its tool execute.before and execute.after hooks are where tool calls are logged and inspected; exact versions stay pinned, while repository .opencode/plugins still load unless a plugin.use policy denies them.
        mitigations: [cap-agent-tracing, cap-input-guardrails, cap-sensitive-data-redaction, cap-agent-tool-registry, cap-mcp-tool-integrity]
        url: https://opencode.ai/docs/plugins/
        verified: "2026-11-21"
      - id: share
        name: share
        where: managed opencode.json → share
        setVia: [mdm, configFile]
        area: sharing
        recommended: '"disabled"'
        why: No session is uploaded to opencode.ai and published at a public link; the vendor's enterprise page also recommends disabling the share pages.
        mitigations: [cap-agent-egress-control]
        url: https://opencode.ai/config.json
        verified: "2026-10-30"
      - id: snapshot
        name: snapshots
        where: managed opencode.json → snapshots (V1 snapshot)
        setVia: [mdm, configFile]
        area: tools
        default: "true"
        recommended: "true"
        why: Agent edits, to instruction and config files included, can be undone and reverted within the session; keep Git commits for anything important.
        mitigations: [AML.M0031]
        url: https://opencode.ai/docs/config/
        verified: "2026-11-21"
      - id: serverHostname
        name: opencode service set hostname
        where: opencode service set hostname (V2 ignores the V1 server.hostname and server.mdns keys); opencode serve --hostname for a foreground server
        setVia: [apiCli]
        area: network
        default: Localhost only
        recommended: Unset (localhost only); no opencode pair --remote on managed devices
        why: The background service can post prompts and run shell commands, so it stays off the network; it is a per-user command, not a managed key, so device management checks it.
        mitigations: [cap-agent-action-policy-enforcement]
        url: https://opencode.ai/docs/cli/web/
        verified: "2026-11-21"
      - id: serverPassword
        name: OPENCODE_PASSWORD
        where: opencode service set password, or the OPENCODE_PASSWORD environment variable (OPENCODE_SERVER_PASSWORD still works)
        setVia: [mdm, apiCli]
        area: identity
        default: A generated password
        recommended: The generated password, or a long secret from the wrapper that starts opencode serve; never shared
        value: "Generated, or a long secret"
        why: A web page or local process cannot drive the server's shell and PTY endpoints without it, the path behind CVE-2026-22812; changing it signs every web session out.
        mitigations: [cap-agent-action-policy-enforcement]
        url: https://opencode.ai/docs/cli/web/
        verified: "2026-11-21"
      - id: autoMode
        name: --auto
        where: opencode run --auto
        setVia: [apiCli]
        area: tools
        default: "Off"
        recommended: Not used; the deny rules and tool.use policies above cover what must never run
        why: Auto mode approves every request that is not an explicit deny, and no config key removes it.
        mitigations: [AML.M0029]
        url: https://opencode.ai/docs/cli/commands/
        verified: "2026-11-21"
