      - mitigation: D3-PA
        coverage: external
        mechanism: >-
          Nothing in the product analyses process behaviour; the docs send containment to OS permissions and an
          isolated backend, and a fail-closed pre_tool_call shell hook is where an endpoint agent can veto commands
        evidence:
          - title: Hermes Agent — Security (threat model, supervised gateway process, containment advice)
            url: https://hermes-agent.nousresearch.com/docs/user-guide/security
          - title: Hermes Agent — Event Hooks (pre_tool_call, fail_closed shell hooks)
            url: https://hermes-agent.nousresearch.com/docs/user-guide/features/hooks
        note: >-
          External: run the host's EDR. Integration points: the gateway is a python process started by a
          hermes-gateway-<profile> systemd unit, launchd plist, s6 run script or Windows Scheduled Task (each exports
          HERMES_SUPERVISED_CHILD); agent commands on the local backend run as child processes of it, and container
          backends run them inside the hermes-agent=1 labelled containers; logs are under ~/.hermes/logs/. An EDR with
          a CLI can veto commands from a hooks.pre_tool_call entry with fail_closed: true. hermes doctor's
          supply-chain advisory catalog checks the Python venv for known-compromised packages; it is not process
          analysis.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityEdr
          reviewRequired: false
          original:
            - capability: capabilityEdr
              coverage: external
              mechanism: >-
                The docs defer containment to OS permissions and an isolated backend; pre_tool_call shell
                hooks and tirith are the pre-execution hook points an endpoint agent could use
              note: >-
                Keep your EDR on the host and, if it exposes a CLI, wire it into a hooks.pre_tool_call entry
                with fail_closed true so it can veto commands. hermes doctor surfaces the built-in
                supply-chain advisory catalog for the Python venv but is not endpoint detection.
              evidence:
                - title: Hermes Agent — official site, reviewed for the integration point (2026-09-10)
                  url: https://hermes-agent.nousresearch.com/
              verified: 2026-09-10
      - mitigation: cap-agent-egress-control
        coverage: partial
        mechanism: >-
          terminal.docker_network false air-gaps the Docker sandbox; the iron-proxy egress proxy, reached through
          HTTPS_PROXY / HTTP_PROXY set in the container, refuses hosts outside its bundled list and
          proxy.extra_allowed_hosts and denies private and metadata ranges (proxy.upstream_deny_cidrs); SSRF
          protection and security.website_blocklist bound the URL tools in the host process
        steps:
          - title: Remove sandbox network access entirely where you can
            body:
              - "Set terminal.docker_network: false to start the execution container with --network=none for terminal,
                execute_code and the file tools."
            url: https://hermes-agent.nousresearch.com/docs/user-guide/configuration
          - title: Otherwise route sandbox traffic through the allowlisting proxy
            body:
              - "Run hermes egress install, hermes egress setup and hermes egress start with proxy.enforce_on_docker:
                true; a proxied request to a host not on the bundled list or proxy.extra_allowed_hosts gets HTTP 403
                and is logged, and private, link-local and metadata ranges are refused."
            url: https://hermes-agent.nousresearch.com/docs/user-guide/egress/iron-proxy
          - title: Keep the URL tools off the local network
            body:
              - "Leave security.allow_private_urls at false so web, browser, vision and gateway media fetches reject RFC
                1918, loopback, link-local, CGNAT and cloud-metadata destinations, and enable
                security.website_blocklist for named hosts."
            url: https://hermes-agent.nousresearch.com/docs/user-guide/security
        note: >-
          Partial on the egress rule: the sandbox's enforced network control is on or off (docker_network: false).
          The domain allowlist is a proxy the container is pointed at through environment variables, not a network
          policy — the container keeps its bridge network, and the vendor lists "sandbox processes that bypass
          HTTPS_PROXY by using a raw socket" as a limitation (Node.js clients with their own CA are the known case).
          The proxy covers the Docker backend only; the local backend, the host process's own model, web, browser and
          gateway traffic, and stdio MCP servers have no Hermes egress control, and an allowlisted host can still
          carry exfiltrated data in a request body.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityEgressControl
          reviewRequired: false
          original:
            - capability: capabilityEgressControl
              coverage: native
              mechanism: >-
                terminal.docker_network false air-gaps the sandbox; the iron-proxy egress proxy is
                default-deny with proxy.extra_allowed_hosts and upstream_deny_cidrs; SSRF protection and
                security.website_blocklist bound URL-capable tools; the host process's own LLM calls are not
                proxied
              steps:
                - title: Route sandbox traffic through the allowlisting proxy
                  body:
                    - Run hermes egress install, hermes egress setup and hermes egress start; a request from the Docker
                      sandbox to a host not on the bundled list or proxy.extra_allowed_hosts gets HTTP 403 before any
                      bytes leave the host, and private, link-local and metadata ranges are refused via
                      proxy.upstream_deny_cidrs.
                  url: https://hermes-agent.nousresearch.com/docs/user-guide/egress/iron-proxy
                - title: Or remove sandbox network access entirely
                  body:
                    - "Set terminal.docker_network: false to start the execution container with --network=none for
                      terminal, execute_code and the file tools."
                  url: https://hermes-agent.nousresearch.com/docs/user-guide/configuration
                - title: Keep the URL tools off the local network
                  body:
                    - Leave security.allow_private_urls at false so web, browser, vision and gateway media fetches
                      reject RFC 1918, loopback, link-local, CGNAT and cloud-metadata destinations, and enable
                      security.website_blocklist for named hosts.
                  url: https://hermes-agent.nousresearch.com/docs/user-guide/security
              note: >-
                The local backend and the host process itself have no egress control from Hermes; an
                allowlisted host such as api.openai.com can still carry exfiltrated data in a request body,
                which the proxy logs but does not prevent.
              verified: 2026-09-10
      - mitigation: D3-FA
        coverage: partial
        mechanism: >-
          Skills Guard scans every hub, URL and project skill bundle before admission (a dangerous verdict is
          quarantined and --force cannot override it) and hermes skills audit re-scans; hermes doctor flags
          known-compromised Python packages from a curated advisory catalog; hermes security audit checks OSV;
          managed tool and engine archives are SHA-256 pinned
        steps:
          - title: Let the skill scanner gate every install
            body:
              - "Install skills through hermes skills install so the complete bundle is quarantined and scanned for
                exfiltration, prompt injection, destructive commands and supply-chain signals; --force overrides
                caution findings only, never a dangerous verdict."
            url: https://hermes-agent.nousresearch.com/docs/user-guide/features/skills
          - title: Re-scan installed skills
            body:
              - "Run hermes skills audit after updates or on a schedule; project skills in trusted repositories are
                re-scanned automatically whenever their content changes."
            url: https://hermes-agent.nousresearch.com/docs/user-guide/features/skills
          - title: Act on supply-chain advisories
            body:
              - "Read the startup banner and hermes doctor, which match the active venv against a curated catalog of
                known-compromised package versions, and acknowledge each with hermes doctor --ack <advisory-id> only
                after remediation."
            url: https://hermes-agent.nousresearch.com/docs/user-guide/security
          - title: Fail on known vulnerabilities
            body:
              - "hermes security audit --fail-on high checks the venv, plugin requirements and pinned npx/uvx MCP
                servers against OSV.dev."
            url: https://hermes-agent.nousresearch.com/docs/reference/cli-commands
        note: >-
          Partial on the D3-FA rule: the project content-scans one artifact class it installs — skills, with a
          pattern scanner — and checks its own Python environment against known-bad versions and CVEs. Plugins
          (arbitrary code, admitted by commit pin and catalog review), MCP servers, gateway hooks, packages the agent
          installs in its sandbox and model weights (downloads get a completeness check; community Hugging Face
          models carry no validation badge) are not scanned: admission scanning at a package mirror or artifact
          repository is the external control. CVE-2026-9353 was a pattern-injection flaw in the skill scanner, fixed
          in 0.15.0.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityModelScanning
          reviewRequired: false
          original:
            - capability: capabilityModelScanning
              coverage: none
              mechanism: >-
                The CLI loads no weights — inference is an API or a local llama.cpp / Ollama server; the
                desktop managed runtime downloads GGUF files with a byte-size check only
              note: >-
                The local-models page states that only the runtime engine zips are SHA-256 verified, not model
                downloads, and community Hugging Face models carry no validation badge. Scan any .gguf you add
                with your own tooling before "Add model file", and keep local_runtime.tag on the release
                Hermes validated. Rated none rather than not applicable because the desktop runtime itself
                downloads model files and checks only their size; that is a real artifact-scanning obligation
                the product does not meet.
              evidence:
                - title: Hermes Agent — official site, reviewed; no setting for this control (2026-09-10)
                  url: https://hermes-agent.nousresearch.com/
              verified: 2026-09-10
