id: prompt-injection-lineage
title: "Prompt injection: from one zero-click email to a self-spreading worm"
subtitle: >
  EchoLeak needed a single email and no click. A year later the same class of flaw was
  propagating itself from document to document inside Microsoft 365 Copilot.
dateRange: June 2025 – July 2026
perspective: target
archetype: archTenantAssistant
summary:
  - >
    Indirect prompt injection works because an assistant cannot tell the difference between
    content it was asked to read and instructions it was asked to follow. Everything the
    assistant can reach becomes an input channel.
  - >
    EchoLeak (CVSS 9.3) proved the zero-click case: one crafted email, a payload hidden in an
    HTML comment, and Copilot exfiltrated internal files on its own. It chained past the XPIA
    classifier, link redaction, and content-security policy using auto-fetched images and a
    Teams proxy.
  - >
    By mid-2026 the chain had grown shorter and the bypasses more inventive. SearchLeak
    (CVE-2026-42824, Varonis, June 2026) turned a single click into theft of mail, calendar and
    SharePoint content: the `q` URL parameter injected straight into the prompt, an HTML
    rendering race condition that fired attacker image tags before sanitisation finished, and
    an SSRF through Bing's own allowlisted image-search endpoint to defeat the content-security
    policy. Its sibling Reprompt beat Copilot Personal's safeguards by sending a second
    request — the checks only applied to the first.
  - >
    Self-propagating variants, where the assistant writes the injection into the next document
    it edits, have been demonstrated by researchers rather than observed in the wild. That gap
    is worth keeping in view: findings in this class are overwhelmingly laboratory work, while
    the 2026 breaches with named victims came through identity and credentials.
patterns:
  - Self-Propagating Prompt Injection
  - No Output Destination Control
  - Overprivileged Integration
cves:
  - CVE-2025-32711
  - CVE-2026-42824
risks:
  - riskPromptInjection
  - riskRetrievalVectorStorePoisoning
  - riskSensitiveDataDisclosure
  - riskInsecureModelOutput
  - riskCovertChannelsInModelOutputs
  - riskExcessiveDataHandlingDuringInference
controls:
  - controlInputValidationAndSanitization
  - controlOutputValidationAndSanitization
  - controlRetrievalAndVectorSystemIntegrity
  - controlApplicationAccessManagement
  - controlUserTransparencyAndControls
  - controlAdversarialTrainingAndTesting
steps:
  - n: 1
    title: Instructions arrive as ordinary content
    phase: introduced
    narrative: >
      An attacker sends a normal-looking email. The payload sits in an HTML comment or as
      white-on-white text — invisible to the recipient, fully readable by the assistant that
      indexes the mailbox. No one has to open it.
    components:
      - actorExternalSources
      - componentRAGContent
      - componentApplicationInputHandling
    risks:
      - riskPromptInjection
    cves:
      - CVE-2025-32711
    sources:
      - title: "EchoLeak: the first real-world zero-click prompt injection exploit in a production LLM system"
        url: https://arxiv.org/abs/2509.10540
        publisher: arXiv
        date: 2025-09-12
  - n: 2
    title: Retrieval pulls the payload into the prompt
    phase: introduced
    narrative: >
      The assistant retrieves the message as context for an unrelated user question. At that
      moment the attacker's text is sitting in the same window as the system instructions,
      with no boundary between them.
    components:
      - componentRAGContent
      - componentApplicationInputHandling
      - componentTheModel
    risks:
      - riskRetrievalVectorStorePoisoning
      - riskPromptInjection
    sources:
      - title: "EchoLeak (CVE-2025-32711): what the Copilot prompt injection vulnerability means for your data"
        url: https://sentra.io/blog/copilot-echoleak-prompt-injection
        publisher: Sentra
        date: 2025-06-11
  - n: 3
    title: The model follows them, and finds an exit
    phase: exposed
    narrative: >
      Copilot read internal files and sent them out. Each defence was bypassed in turn: the
      XPIA classifier, link redaction (via reference-style Markdown), and the content-security
      policy (via auto-fetched images and an allowed Teams proxy).
    components:
      - componentTheModel
      - componentApplicationOutputHandling
      - componentApplication
      - actorExternalSources
    risks:
      - riskSensitiveDataDisclosure
      - riskInsecureModelOutput
      - riskCovertChannelsInModelOutputs
      - riskExcessiveDataHandlingDuringInference
    sources:
      - title: "Inside CVE-2025-32711 (EchoLeak): prompt injection meets AI exfiltration"
        url: https://www.hackthebox.com/blog/cve-2025-32711-echoleak-copilot-vulnerability
        publisher: Hack The Box
        date: 2025-06-16
  - n: 4
    title: One click, and the bypasses stack
    phase: exposed
    narrative: >
      SearchLeak (CVE-2026-42824) needed one click on a crafted link. The `q` parameter became
      prompt text; a rendering race condition executed attacker image tags before sanitisation
      completed; and the exfiltration left through Bing's allowlisted Search-by-Image endpoint,
      so the content-security policy never saw a foreign destination. Researchers have since
      shown the same class writing its payload into the documents the assistant edits.
    components:
      - componentApplication
      - componentApplicationOutputHandling
      - componentRAGContent
      - componentMemory
    risks:
      - riskPromptInjection
      - riskRetrievalVectorStorePoisoning
    cves:
      - CVE-2026-42824
    sources:
      - title: "SearchLeak: one-click data theft in Microsoft 365 Copilot Enterprise Search"
        url: https://www.varonis.com/blog/searchleak
        publisher: Varonis
        date: 2026-06-15
      - title: "Reprompt: bypassing Copilot safeguards with a second request"
        url: https://www.varonis.com/blog/reprompt
        publisher: Varonis
        date: 2026-06-15
  - n: 5
    title: Where this chain breaks
    phase: mitigated
    narrative: >
      Treat retrieved content as data, never as instructions. Validate and sanitise on the way
      in and on the way out. Constrain where output may go — an assistant that cannot reach an
      arbitrary destination cannot exfiltrate to one. Red-team the classifier rather than
      trusting it.
    components:
      - componentApplicationInputHandling
      - componentApplicationOutputHandling
      - componentRAGContent
      - componentModelEvaluation
      - componentApplication
    sources:
      - title: "AI security in 2026: prompt injection, the lethal trifecta, and how to defend"
        url: https://airia.com/ai-security-in-2026-prompt-injection-the-lethal-trifecta-and-how-to-defend/
        publisher: Airia
        date: 2026-01-15
alsoSeen:
  - title: "Ghostcommit — prompt injection hidden inside PNG images"
    date: July 2026
    note: The input channel does not have to be text. Image payloads reached secrets the same way.
    sources:
      - title: "Awesome AI agent attacks — 2026 timeline"
        url: https://github.com/webpro255/awesome-ai-agent-attacks
        publisher: webpro255
  - title: "Grok and Bankr AI wallet drained via Morse-code prompt injection"
    date: May 2026
    note: Same class, financial outcome — an encoded instruction reached an agent holding funds.
    sources:
      - title: "Awesome AI agent attacks — 2026 timeline"
        url: https://github.com/webpro255/awesome-ai-agent-attacks
        publisher: webpro255
