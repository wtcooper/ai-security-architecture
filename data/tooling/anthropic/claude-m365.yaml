# Claude for Microsoft 365 — one entity per product × reference architecture. Facts are dated
# (asOf) and cite the vendor's own documentation; re-verify before enforcing.
# Schema: data/tooling/README.md.
# 2026-09-25: re-verified toolClaudeM365 (all 16 rows) against the MITRE capability rules; every claude.com/docs/office-agents, platform.claude.com, support.claude.com, learn.microsoft.com and github.com page cited answered 200 with no redirect (support.claude.com/en/articles/12650343-use-claude-for-excel now redirects to claude.com/docs/office-agents/excel and is not cited); trust.anthropic.com renders client-side and was read in a browser; the add-in pages call Compliance API coverage "public beta" while the Compliance API reference calls it stable; the add-in pages no longer say Claude for Excel is not ZDR-eligible.
vendor: anthropic
family: Claude for Microsoft 365
tools:
  - id: toolClaudeM365
    name: Claude for Microsoft 365 (Excel, PowerPoint, Word, Outlook add-ins)
    surfaceClasses:
      - officeAddin
    variants:
      - name: Claude for Excel
        class: officeAddin
        url: https://claude.com/docs/office-agents/excel
      - name: Claude for Outlook (requires one-time Microsoft Graph admin consent)
        class: officeAddin
        url: https://claude.com/docs/office-agents/outlook
      - name: >-
          Third-party platform mode (Bedrock, Vertex AI, Foundry or an LLM gateway via a custom manifest)
        class: officeAddin
        url: https://claude.com/docs/office-agents/third-party-platforms
        note: Identity comes from the Entra ID sign-in; cross-app mode is unavailable.
    architecture: archEnterpriseAiChat
    status: ga
    asOf: "2026-09"
    summary:
      - >-
        Office add-ins served from pivot.claude.ai inside Excel, PowerPoint, Word and Outlook that read and
        write the open file or mail thread, with connectors, skills and an optional cross-app mode. Users sign
        in with their Claude account (Pro, Max, Team, Enterprise) and requests go to Anthropic, or the add-in
        is pointed at the organisation's Bedrock, Vertex, Foundry or gateway endpoint. Chat history, uploaded
        skills, connector registrations and the sign-in credential live in the Office webview's browser
        storage on each device; Anthropic deletes inputs and outputs from its backend within 30 days.
      - >-
        Admins deploy and gate the add-ins through the Microsoft 365 Admin Center and toggle "Let Claude work
        across apps" at Organization settings > Office agents. Governance gaps are explicit in the docs: the
        add-ins do not inherit custom data retention and activity is not in Enterprise audit logs or data
        exports. Enterprise organisations with the Compliance API get add-in session transcripts
        (office_agents/* local sessions), which the add-in pages label public beta and the Compliance API
        reference calls stable. A custom OpenTelemetry collector receives the full unfiltered audit trail
        (prompts, tool inputs and outputs, document references) from each user's browser and must support
        CORS.
    facts:
      - label: Plans
        value: >-
          Pro, Max, Team and Enterprise for first-party sign-in; third-party platforms through a custom
          manifest.
        url: https://claude.com/docs/office-agents/work-across-apps
      - label: Inference & routing
        value: >-
          Anthropic API, or your Bedrock / Vertex AI / Foundry / LLM gateway endpoint (with CORS) in
          third-party mode.
        url: https://claude.com/docs/office-agents/third-party-platforms
      - label: Data leaving the device
        value: >-
          Conversation text, attachments and the document or email content Claude works with go to the
          configured model endpoint; Anthropic's own telemetry collector is allowlist-filtered (no content), a
          custom collector receives everything.
        url: https://claude.com/docs/office-agents/data-storage
      - label: Retention & training
        value: >-
          Backend inputs and outputs deleted within 30 days per the add-in pages, but Enterprise organisations
          with the Compliance API have add-in session transcripts held 6 years by default (Compliance API
          reference); local history keeps the 50 most recent conversations per user, organisation and app
          with no admin retention window; commercial terms, no training.
        url: https://claude.com/docs/office-agents/data-storage
      - label: Docs index
        value: >-
          claude.com/docs/office-agents (overview, per-app pages, enterprise readiness, data storage,
          third-party platforms)
        url: https://claude.com/docs/office-agents/overview
    riskNotes:
      - risk: riskSensitiveDataDisclosure
        note: >-
          A gateway token or API key configured centrally is distributed unencrypted to every user's browser
          profile and included in data exports; shared OS accounts share uploaded skills and connector
          registrations.
      - risk: riskExcessiveDataHandlingDuringInference
        note: >-
          The add-in sends the open document, workbook or thread content the user asks about; Outlook requires
          Graph consent, and cross-app mode links context across Excel, PowerPoint, Word and Outlook sessions.
      - risk: riskStaleAgentIdentityBinding
        note: >-
          History is keyed to a Claude account or a hashed Entra object ID; Office builds without nested app
          authentication fall back to a per-installation identifier shared by everyone on the device.
      - risk: riskShadowAndUnknownAgents
        note: >-
          Add-ins can be installed from AppSource by users unless the M365 Admin Center restricts them;
          activity is absent from Enterprise audit logs and exports.
    controls:
      - mitigation: D3-MFA
        coverage: partial
        mechanism: >-
          Require SSO for Claude (claude.ai/admin-settings/organization, Authentication) governs the add-in's
          claude.ai sign-in and Migrate accounts using your domain sends new domain accounts through SSO; the
          Outlook Graph token and the Entra-based third-party paths sign in with Microsoft Entra ID through
          nested app authentication, governed by Conditional Access on the Claude for Office enterprise app or
          on your own app registration (graph_client_id)
        steps:
          - title: Require SSO so the IdP's MFA governs the add-in sign-in
            body:
              - >-
                After verifying your domain, turn on Require SSO for Claude in the Authentication section at
                claude.ai/admin-settings/organization and enforce MFA on the Claude application in your IdP;
                the add-in's Log in button completes that claude.ai sign-in in a browser window.
            url: https://support.claude.com/en/articles/13132885-set-up-single-sign-on-sso
          - title: Consolidate accounts on your domain
            body:
              - >-
                On Enterprise, turn on Migrate accounts using your domain under Organization settings >
                Organization and access > Security, so new accounts on the domain go straight through SSO into
                the workspace instead of becoming personal accounts.
            url: https://support.claude.com/en/articles/14625619-claim-and-migrate-accounts-on-your-domain
          - title: Put Conditional Access on the Entra sign-in
            body:
              - >-
                Target an MFA Conditional Access policy at the Claude for Office enterprise application
                (c2995f31-11e7-4882-b7a7-ef9def0a0266), or at your own single-tenant app set with
                graph_client_id, which governs the Outlook Graph token and Entra sign-in on Bedrock direct,
                keyless Foundry and gateway_auth_source=entra deployments.
            url: https://claude.com/docs/office-agents/outlook
        note: >-
          Partial on the MFA rule applied to every vendor: Anthropic has no organisation "require 2FA" switch of
          its own, so the second factor is whatever the IdP enforces — behind Require SSO on the Claude-account
          path, and Entra Conditional Access for the Graph token and the Entra-based third-party paths. Paths
          with no interactive factor: a static gateway token or Foundry API key delivered in the manifest,
          Entra extension attributes or a bootstrap response authenticates inference with no login, and Vertex
          AI direct relies on the user's Google account. The Claude-account access and refresh tokens sit in
          the webview's localStorage; no session lifetime is documented, so a sign-in lasts until the user
          signs out or the profile's storage is cleared. Personal Pro and Max accounts can sign in to the same
          AppSource add-in: domain capture covers only verified domains, and the tenant-restriction header at
          the proxy is the network-side backstop.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityIga
          reviewRequired: false
          original:
            - capability: capabilityIga
              coverage: native
              mechanism: >-
                Claude account sign-in (SSO/SCIM at the organisation) plus Microsoft 365 Admin Center add-in
                assignment; Entra ID identity in third-party mode
              steps:
                - title: Assign the add-ins to users
                  body:
                    - Manage member access to the Excel, PowerPoint, Word and Outlook add-ins through the
                      Microsoft 365 Admin Center and grant the one-time Microsoft Graph consent for Outlook.
                  url: https://claude.com/docs/office-agents/overview
                - title: Enforce the Claude organisation
                  body:
