  - id: langfuse-ai-gateway
    kind: tool
    date: '2026-11-04'
    title: >-
      Langfuse AI Gateway public beta: per-user gateway keys and a trace for every OpenAI or Anthropic
      call
    summary: 'Langfuse''s gateway forwards OpenAI and Anthropic requests with a provider credential held
      centrally, so teammates and coding agents get revocable, optionally expiring gateway keys instead
      of provider keys. Admins enable models per credential, every call is recorded with model, tokens,
