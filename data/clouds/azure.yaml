        dropSettings: [appServiceRequireAuth, keyVaultReferences, appServiceRouteAll]
        addSettings: [aksWorkloadIdentity, aksInternalLoadBalancer, aksNetworkPolicy, aksImdsRestriction, aksNodeOsUpgradeChannel, aksEntraIdAuthorisation, aksDisableLocalAccounts, defenderContainerVa, aksMcpAuthMiddleware, aksKeyVaultCsiProvider, aksOutboundUserDefinedRouting]
        differences:
          - at: service
            text: "AKS has no built-in MCP authorisation. Microsoft's guide says to secure the endpoint with Microsoft Entra Workload Identity for service-to-service calls or with custom authentication middleware, so the 401 challenge, the protected resource metadata document and token validation are all code the builder writes and tests."
            url: https://learn.microsoft.com/en-us/azure/container-apps/mcp-choosing-azure-service
          - at: gateway->service
            text: "A Kubernetes Service is reachable only inside the cluster until the builder publishes it. Use an internal load balancer or a Gateway, and join API Management to the virtual network. The NGINX-based application routing add-on loses Azure support after November 2026; Microsoft points to its Gateway API implementation instead."
            url: https://learn.microsoft.com/en-us/azure/aks/app-routing-gateway-api
          - at: service->orgData
            text: "By default all pods in an AKS cluster can send and receive traffic without limitations, and the default outbound type sends traffic out through a load balancer's public IP. The outbound filter of this pattern exists only once the builder adds network policies and routes the node subnet to a firewall."
