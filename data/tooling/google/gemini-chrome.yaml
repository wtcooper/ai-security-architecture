# Gemini in Chrome — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# Excluded: the Gemini web app, mobile apps and Gemini on Mac / Windows (the same "Gemini app" service, but chat
# surfaces with no browser actuation); Gemini Spark as an agent of its own (recorded here only as the policy that
# lets it drive Chrome auto browse); Gemini Enterprise in the Chrome address bar (the Enterprise search aggregator
# policy, recorded on toolGeminiEnterprise); the other Chrome generative AI features GenAiDefaultSettings covers
# (Help me write, Tab compare, AI history search, Lens, AI Mode). GeminiChromeFileUploadSettings and
# GeminiEnterpriseUrl are listed in the policy templates as future_on only (not yet supported) and are left out.
# 2026-10-30: onboarded toolGeminiChrome against the MITRE capability rules. chromeenterprise.google/policies/<slug>/
# pages render client-side (the HTML carries only the title), so policy text was read from the site's own
# policy_templates_en-US.json; /policies/gemini-act-on-web-allowed-for-urls/, -blocked-for-urls/ and
# gemini-chrome-file-upload-settings/ answer 404 (the policies are in the JSON and the admin help article).
# support.google.com/a/answer/14571493 and /1668854 redirect to knowledge.workspace.google.com/admin/...; the
# Gemini app conversation-history page has no URL of its own (it is a section of turn-the-gemini-app-on-or-off).
# Pages disagree: the admin help article says auto browse is off by default for managed users, while the
# GeminiActOnWebSettings policy says 0/unset allows it; the Workspace Gemini app page says Gemini in Chrome needs
# Chrome signed in in the US, the Chrome admin article lists many supported regions. Set the policies explicitly.
vendor: google
family: Gemini in Chrome
tools:
  - id: toolGeminiChrome
    name: Gemini in Chrome (with Chrome auto browse)
    surfaceClasses:
      - agenticBrowser
    variants:
      - name: Gemini in Chrome side panel (chat with tab context, desktop and iOS)
        class: agenticBrowser
        url: https://support.google.com/chrome/answer/16283624?hl=en&co=GENIE.Platform%3DDesktop
      - name: Chrome auto browse (multi-step tasks in the user's tabs, desktop)
        class: agenticBrowser
        url: https://support.google.com/chrome/answer/16821166?hl=en
        note: >-
          Experimental; US, English, 18+; for managed users only on the Workspace editions the admin article
          lists and only where GeminiActOnWebSettings allows it. Gemini Spark can drive it only when
          GeminiSparkSettings is 0.
    architecture: archAgenticBrowser
    status: ga
    asOf: "2026-10"
    summary:
      - >-
        Gemini built into Google Chrome: a side panel that answers with the content of the current tab (shared
        by default) and up to ten more tabs the user adds, and Chrome auto browse, where Gemini plans and runs
        multi-step tasks in the user's own browser — clicking, filling forms and, with the user's permission,
        signing in through Google Password Manager — with the same sites and sessions the user has. Inference is
        Google's; prompts, page content of shared tabs and auto browse actions leave the browser for the Gemini
        app service, and a task may finish in a remote browser in Google's cloud if the device goes away.
      - >-
        For a Workspace account it is part of the Gemini app core service, so it needs both the Admin console's
        Gemini app service status and Chrome's GeminiSettings policy on. Administrators shape it with Chrome
        Enterprise policies — GeminiSettings (on or off), GenAiDefaultSettings (whether Google may use the data
        to improve models), GeminiActOnWebSettings with GeminiActOnWebAllowedForURLs / BlockedForURLs (where
        auto browse may act) and GeminiSparkSettings — and with the Gemini app's conversation history,
        temporary chat, sharing and connected-apps settings, Vault, and Chrome Enterprise Premium DLP, which
        can single out transfers made by auto browse. The confirmation and take-over prompts are vendor-chosen;
        no policy adds an action class or forces a confirmation.
    facts:
      - label: Plans
        value: >-
          Core service with enterprise data protections on most Workspace Business, Enterprise, Essentials,
          Frontline, Nonprofit and Education editions; auto browse for managed users only on Business Standard
          and Plus, Enterprise Standard and Plus, AI Ultra Access, AI Expanded Access, Google AI Pro for
          Education and Gemini Education Premium. Users without a qualifying edition get it only under consumer
          terms if the admin grants that. Automatically blocked for customers who signed a HIPAA BAA.
        url: https://support.google.com/chrome/a/answer/16291696?hl=en
      - label: Inference & routing
        value: >-
          Google's Gemini app service; no customer model, region or gateway choice. Auto browse uses the local
          Chrome or, when the device is unavailable, a remote browser in Google's cloud.
        url: https://support.google.com/chrome/answer/16821166?hl=en
      - label: Data leaving the device
        value: >-
          Prompts, page content of the current tab (shared by default) and of any tab the user adds, and for
          auto browse the pages visited and the information Gemini shares with sites to complete a task (name,
          contact details, files, preferences); Gemini may read a shared Workspace page directly from the
          user's Workspace account.
        url: https://support.google.com/chrome/answer/16283624?hl=en&co=GENIE.Platform%3DDesktop
      - label: Retention & training
        value: >-
          Workspace editions: prompts, tab context and responses are not used to train models or human
          reviewed outside the domain without permission; chats are kept per the Gemini conversation history
          setting (3, 18 or 36 months, default 18) and Vault rules, and sites auto browse visited are marked in
          Chrome history. GenAiDefaultSettings 0 lets Google use data to improve models for users outside that
          protection; 1 is the default for Admin-console-managed enterprise users.
        url: https://knowledge.workspace.google.com/admin/generative-ai/gemini-app/turn-the-gemini-app-on-or-off
      - label: Docs index
        value: >-
          Chrome Enterprise and Education Help "Gemini in Chrome" (admin), Chrome Help "Use Gemini in Chrome"
          and "auto browse", the Chrome Enterprise policy list, and Workspace Admin Help Generative AI > Gemini
          app.
        url: https://support.google.com/chrome/a/answer/16291696?hl=en
      - label: Compliance scope
        value: >-
          The Workspace Gemini app page states Gemini in Chrome does not yet support HIPAA BAA, SOC 1/2/3, ISO/IEC
          27001, 27017, 27018, 27701, 9001, 42001, FedRAMP High or BSI C5:2020.
        url: https://knowledge.workspace.google.com/admin/generative-ai/gemini-app/turn-the-gemini-app-on-or-off
    items:
      - title: Two switches and a default
        body:
          - "Gemini in Chrome needs both the Admin console's Gemini app service (Generative AI > Gemini app >
            Service status) and Chrome's GeminiSettings (Devices > Chrome > Settings > Generative AI > Gemini
            integrations). Unset, GeminiSettings follows GenAiDefaultSettings, where 0 or 1 allow the feature and
            2 blocks it; GenAiDefaultSettings can only be set in the Admin console. GeminiSettings alone turns
            Gemini in Chrome off while leaving the Gemini web and mobile apps on."
        links:
          - title: Gemini in Chrome (admin)
            url: https://support.google.com/chrome/a/answer/16291696?hl=en
          - title: GenAiDefaultSettings
            url: https://chromeenterprise.google/policies/gen-ai-default-settings/
      - title: Where auto browse may act
        body:
          - "GeminiActOnWebSettings 1 stops Gemini acting on web pages; GeminiActOnWebAllowedForURLs and
            GeminiActOnWebBlockedForURLs take URL patterns, URLs on neither list follow GeminiActOnWebSettings, and
            a URL on both is allowed. So an allowlist is GeminiActOnWebSettings 1 plus the allowed list, with the
            blocklist kept free of overlap. The policies govern acting, not reading: a tab the user shares is
            still read. GeminiSparkSettings (default 1) separately keeps the Gemini Spark agent from driving
            auto browse."
        links:
          - title: GeminiActOnWebSettings
            url: https://chromeenterprise.google/policies/gemini-act-on-web-settings/
          - title: GeminiSparkSettings
            url: https://chromeenterprise.google/policies/gemini-spark-settings/
    riskNotes:
      - risk: riskPromptInjection
        note: >-
          Google's own auto browse page lists injected instructions that post private data to a public site or
          forward Gmail to an outside service; its safeguards (prohibited-task recognition, site and action
          restriction to the task) are vendor-internal and "don't guarantee protection against all risks".
      - risk: riskAgenticDelegationConfusedDeputy
        note: >-
          Auto browse acts in every site the user is signed into and can sign in to more through Google Password
          Manager with the user's permission; it has no identity of its own, so a site sees the user.
      - risk: riskInsecureIntegratedComponent
        note: >-
          CVE-2026-0628 (Unit 42, fixed in Chrome 143.0.7499.192 on 2026-01-06) let a low-privilege extension
          inject code into the Gemini panel's WebView and inherit its file, screenshot, camera and microphone
          access; extension policy is part of this product's boundary.
      - risk: riskSensitiveDataDisclosure
        note: >-
          The current tab is shared by default when a chat starts, and auto browse "may share your personal
          info with those sites"; only Chrome Enterprise Premium DLP inspects what leaves.
      - risk: riskShadowAndUnknownAgents
        note: >-
          A personal Google account signed in to Chrome gets consumer Gemini in Chrome, auto browse included on
          Google AI Pro or Ultra, outside every Workspace setting; Chrome sign-in restriction is the boundary.
    controls:
      - mitigation: D3-MFA
        coverage: native
        mechanism: >-
          Google Workspace / Cloud Identity 2-Step Verification enforcement on the accounts signed in to Chrome;
          RestrictSigninToPattern and AllowedDomainsForApps (which injects X-GoogApps-Allowed-Domains) bind Chrome
          and Google services to corporate accounts
        steps:
          - title: Enforce 2-Step Verification
            body:
              - In the Google Admin console go to Security > Authentication > 2-step verification and set
                Enforcement to On for the organizational units that use Gemini, or enforce MFA in the federated
                IdP.
            url: https://knowledge.workspace.google.com/admin/security/deploy-2-step-verification
          - title: Restrict Chrome sign-in to corporate accounts
            body:
              - Set RestrictSigninToPattern to a regular expression matching your domains, so a personal Google
                account cannot become the browser's primary account on managed browsers.
            url: https://chromeenterprise.google/policies/restrict-signin-to-pattern/
          - title: Restrict Google services to your domains
            body:
              - Set AllowedDomainsForApps to your Workspace domains; Chrome then adds the X-GoogApps-Allowed-Domains
                header and refuses other Google accounts, consumer accounts included.
            url: https://chromeenterprise.google/policies/allowed-domains-for-apps/
        note: >-
          Native on the MFA rule applied to Gemini CLI: Google's own account layer enforces the second factor
          for every member, and managed Chrome can be bound to corporate accounts. Boundaries: 2SV covers
          interactive sign-in; a long-lived Chrome session is not re-challenged before Gemini acts; an
          enforcement date or new-user enrollment period allows password-only sign-in until it ends; the
          sign-in policies hold only on managed browsers — an unmanaged browser with a personal account gets
          consumer Gemini in Chrome. Auto browse signing in to third-party sites uses those sites' own
          authentication, not this factor.
        verified: "2026-10-30"
      - mitigation: AML.M0028
        coverage: partial
        mechanism: >-
          GeminiActOnWebSettings with GeminiActOnWebAllowedForURLs / GeminiActOnWebBlockedForURLs; GeminiSparkSettings;
          the Gemini app's Apps settings (Workspace apps, Other Google apps)
        steps:
          - title: Deny auto browse by default
            body:
              - Set GeminiActOnWebSettings to 1 for every organizational unit, so Gemini cannot act on any web page
                unless a URL is explicitly allowed.
            url: https://chromeenterprise.google/policies/gemini-act-on-web-settings/
          - title: Allow named sites for the pilot
            body:
              - For the pilot organizational unit set GeminiActOnWebAllowedForURLs to the approved sites, and keep
                GeminiActOnWebBlockedForURLs free of overlap (a URL on both lists is allowed).
            url: https://support.google.com/chrome/a/answer/16291696?hl=en
          - title: Scope the apps Gemini can reach
            body:
              - In Admin console > Generative AI > Gemini app > Apps, keep Workspace apps on and turn Other Google
                apps (Maps, YouTube, Flights, Hotels) off.
            url: https://knowledge.workspace.google.com/admin/generative-ai/gemini-app/turn-google-apps-in-gemini-on-or-off
        note: >-
          Partial on the rule applied to Claude in Chrome: the admin sets per-site act/don't-act lists Chrome
          enforces over the user, but a permitted site is fully actionable (no read-only tier, no per-action
          scope) and the lists govern acting, not reading a tab the user shares. The policy is delivered by
          Chrome management and holds only on managed browsers and accounts; a task that moves to the remote
          cloud browser is not documented as bound by the device's policies.
        verified: "2026-10-30"
      - mitigation: AML.M0029
        coverage: partial
        mechanism: >-
          Vendor-chosen confirmations and take-over steps in auto browse; GeminiSparkSettings 1 keeps the
          autonomous Gemini Spark agent from driving Chrome
        steps:
          - title: Keep Gemini Spark off Chrome
            body:
              - Leave GeminiSparkSettings at 1 so the Gemini Spark agent cannot connect to Chrome and run auto
                browse without a person starting the task.
            url: https://chromeenterprise.google/policies/gemini-spark-settings/
        note: >-
          Partial on the human-approval rule: a present user reviews the plan, then is asked to confirm sending
          communications, modifying data, submitting forms, scheduling events and visiting highly sensitive
          financial or health sites, and must take over to finalise payments, accept terms or create accounts.
          The set is vendor-chosen and phrased as "aims to ask"; no policy adds an action class or forces a
          confirmation, and "Let Gemini browse for you" is a user setting. Google states the user is responsible
          for Gemini's actions, including purchases.
        verified: "2026-10-30"
      - mitigation: D3-CTS
        coverage: partial
        mechanism: >-
          Google Password Manager sign-in on the user's per-site permission (passwords not shared with Gemini);
          GeminiActOnWebBlockedForURLs and the allowlist keep auto browse off the sessions of unlisted sites
        steps:
          - title: Keep auto browse off high-value sessions
            body:
              - List banking, payroll, HR and admin-console domains in GeminiActOnWebBlockedForURLs so Gemini never
                acts in those signed-in sessions.
            url: https://support.google.com/chrome/a/answer/16291696?hl=en
        note: >-
          Partial on the rule applied to Claude in Chrome: the vendor keeps passwords away from the model and
          asks per site before signing in, and the admin site lists deny the agent the sessions of listed sites,
          but auto browse otherwise uses every cookie in the profile and there is no policy that stops Gemini
          using saved passwords (PasswordManagerEnabled stops only new saves). No dedicated profile is
          provisioned by the product.
        verified: "2026-10-30"
      - mitigation: cap-input-guardrails
        coverage: partial
        mechanism: >-
          Vendor-internal prohibited-task recognition and site-and-action restriction; Safe Browsing required for
          auto browse (SafeBrowsingProtectionLevel)
        steps:
          - title: Keep Safe Browsing mandatory
            body:
              - Set SafeBrowsingProtectionLevel to 1 (Standard) as a mandatory policy; auto browse needs Safe
                Browsing on and known-malicious pages are blocked before Gemini reads them.
            url: https://chromeenterprise.google/policies/safe-browsing-protection-level/
        note: >-
          Partial on the input-screening rule: Google documents vendor-internal defences against injected
          instructions (prohibited-task recognition, restricting actions to sites relevant to the task) that no
          administrator can tune or see verdicts from, and Safe Browsing screens only known-bad URLs. No
          Model Armor or inline hook is documented for Gemini in Chrome.
        verified: "2026-10-30"
      - mitigation: AML.M0031
        coverage: partial
        mechanism: >-
          Gemini conversation history (on/off, 3/18/36-month retention); Allow temporary chats and Allow users to
          delete conversations
        steps:
          - title: Bound what Gemini remembers
            body:
              - In Admin console > Generative AI > Gemini app > Gemini conversation history keep history on and set
                Conversation retention to 3 months.
            url: https://knowledge.workspace.google.com/admin/generative-ai/gemini-app/turn-the-gemini-app-on-or-off
        note: >-
          Partial on the disable-only rule applied to Claude in Chrome: the admin can turn conversation history
          off or shorten it, but nothing scopes which pages may inform what auto browse "reviews" from earlier
          chats and shared details, or treats remembered content as untrusted. Turning history off also turns
          off Workspace apps in Gemini.
        verified: "2026-10-30"
      - mitigation: D3-WSAA
        coverage: partial
        mechanism: >-
          Chrome Enterprise Premium data protection rules with the Source Chrome context "Gemini in Chrome (auto
          browse)"; Chrome history marks sites auto browse visited
        steps:
          - title: Single out agent transfers
            body:
              - In a Chrome data protection rule, add the condition Source Chrome context = Gemini in Chrome (auto
                browse), with audit or block on uploads and pastes, so transfers the agent makes are recorded
                apart from the user's.
            url: https://support.google.com/chrome/a/answer/17128928?hl=en
        note: >-
          Partial on the browser-activity rule: the vendor's own premium browser control can tell agent-originated
          content transfers apart and report them, but no export of every navigation, click and form entry auto
          browse made is documented, Chrome history is local to the profile, and the remote cloud browser's
          activity is outside it. Needs Chrome Enterprise Premium and Chrome Enterprise connectors.
        verified: "2026-10-30"
      - mitigation: cap-agent-tool-registry
        coverage: partial
        mechanism: >-
          Admin-set Gemini app Apps toggles (Workspace apps, Classroom app, Other Google apps) and GeminiSparkSettings
          over what Gemini in Chrome may connect to; browser enrolment in Chrome Enterprise Core for which managed
          browsers have it
        steps:
          - title: Fix the connected-app set
            body:
              - In Admin console > Generative AI > Gemini app > Apps, choose which app families Gemini may use;
                treat that page and GeminiSparkSettings as the record of what the browser agent can reach.
            url: https://knowledge.workspace.google.com/admin/generative-ai/gemini-app/turn-google-apps-in-gemini-on-or-off
        note: >-
          Partial on the registry rule: the admin decides which app families and which agent (Spark) may connect,
          per organizational unit, and Chrome Enterprise Core lists the managed browsers, but there is no record
          per user of auto browse use, connected-app grants or sites signed in to; those are the user's own
          Gemini and Chrome settings.
        verified: "2026-10-30"
      - mitigation: cap-shadow-ai-discovery
        coverage: external
        mechanism: >-
          SSE / CASB and browser management reporting; integration points are Chrome sign-in state on managed
          browsers and the X-GoogApps-Allowed-Domains header
        evidence:
          - title: Gemini in Chrome admin article (no report of personal-account use)
            url: https://support.google.com/chrome/a/answer/16291696?hl=en
          - title: AllowedDomainsForApps
            url: https://chromeenterprise.google/policies/allowed-domains-for-apps/
        note: >-
          External on the discovery rule: no Google page documents a report of staff using consumer Gemini in
          Chrome or auto browse under personal accounts; RestrictSigninToPattern and AllowedDomainsForApps
          prevent it on managed browsers rather than discover it. Use the SSE's generative-AI category and
          browser inventory for unmanaged browsers.
        verified: "2026-10-30"
      - mitigation: cap-agent-tracing
        coverage: partial
        mechanism: >-
          Gemini Apps Activity per user; Google Vault retention, hold, search and export of Gemini app prompts and
          responses
        steps:
          - title: Retain and export Gemini app conversations
            body:
              - In vault.google.com create a default retention rule for Gemini app with a retention period that
                matches your records policy, then search and export through Vault.
            url: https://knowledge.workspace.google.com/vault/retention/retain-gemini-app-messages-with-vault
        note: >-
          Partial on the tracing rule: prompts and responses are retrievable centrally through Vault (Gemini in
          Chrome is part of the Gemini app service; the Vault page does not name Chrome, so confirm coverage), but
          auto browse's own steps — sites visited, clicks, form entries — are recorded only in the user's Chrome
          history with a Gemini icon, not in an export. Media files are not retained by Vault. The Gemini for
          Workspace log events page does not say it covers Gemini in Chrome.
        verified: "2026-10-30"
      - mitigation: cap-sensitive-data-redaction
        coverage: partial
        mechanism: >-
          Chrome Enterprise Premium real-time DLP rules on paste and upload, with the Gemini in Chrome (auto
          browse) context condition
        steps:
          - title: Block sensitive data the agent sends
            body:
              - Create Chrome data protection rules for your detectors (credentials, national IDs, client account
                numbers) with action Block on upload and paste, including the Gemini in Chrome (auto browse)
                context.
            url: https://support.google.com/chrome/a/answer/17128928?hl=en
        note: >-
          Partial on the redaction rule: the vendor's premium browser DLP blocks matched content leaving through
          paste and upload, auto browse included, but it does not inspect the tab content Gemini reads when the
          user shares a tab, nothing masks a value, and it needs a Chrome Enterprise Premium licence. Workspace
          "DLP for Gemini" is a Drive control and does not apply to Gemini in Chrome.
        verified: "2026-10-30"
      - mitigation: cap-agent-egress-control
        coverage: native
        mechanism: >-
          GeminiActOnWebSettings 1 with GeminiActOnWebAllowedForURLs — an admin-set list of sites auto browse may
          act on, enforced by Chrome for the agent separately from the user's browsing
        steps:
          - title: Default-deny with an allowlist
            body:
              - Set GeminiActOnWebSettings to 1 and list approved sites in GeminiActOnWebAllowedForURLs; Gemini then
                acts only on those URLs, whatever the user asks.
            url: https://chromeenterprise.google/policies/gemini-act-on-web-settings/
          - title: Block the sites that must never be driven
            body:
              - Add banking, payroll and admin-console URL patterns to GeminiActOnWebBlockedForURLs, without
                overlapping the allowlist.
            url: https://support.google.com/chrome/a/answer/16291696?hl=en
        note: >-
          Native on the rule applied to Claude in Chrome: an admin-set allowlist of the sites the agent may work
          on, enforced by the browser for the agent and separable from the user's own browsing, with dynamic
          refresh. Boundaries: it governs acting on pages, not which sites a shared tab's content is read from;
          requests an allowed page makes itself are the page's; a task continued in Google's remote browser is
          not documented as bound by device policy; URL patterns follow the URLBlocklist format.
        verified: "2026-10-30"
      - mitigation: cap-agent-action-policy-enforcement
        coverage: partial
        mechanism: >-
          Admin-delivered site lists (GeminiActOnWeb*) the user cannot override; vendor-fixed prohibited and
          confirm-first action classes
        steps:
          - title: Deliver the site policy centrally
            body:
              - Set GeminiActOnWebSettings and its URL lists in Admin console > Devices > Chrome > Settings (or by
                MDM as mandatory policy) so users cannot change them.
            url: https://support.google.com/chrome/a/answer/16291696?hl=en
        note: >-
          Partial on the rule applied to Claude in Chrome: site lists are admin-delivered and non-overridable, but
          the blocked and confirm-first action classes are vendor-chosen (no admin can add one), the user can
          turn browsing on or off for themselves within what policy allows, and judging "instructions from web
          content" is left to Google's classifiers.
        verified: "2026-10-30"
      - mitigation: cap-ai-vendor-assessment
        coverage: external
        mechanism: >-
          The organisation's TPRM platform, consuming the Workspace Gemini app page's compliance statement and the
          Generative AI in Google Workspace Privacy Hub
        evidence:
          - title: Turn the Gemini App on or off — Gemini in Chrome compliance scope
            url: https://knowledge.workspace.google.com/admin/generative-ai/gemini-app/turn-the-gemini-app-on-or-off
          - title: Gemini in Chrome (admin) — data usage
            url: https://support.google.com/chrome/a/answer/16291696?hl=en
        note: >-
          External on the rule applied to every vendor: the assessment lives in the organisation's TPRM process.
          Google states Gemini in Chrome does not yet support SOC 1/2/3, the ISO/IEC 27001 family, ISO 42001,
          FedRAMP High, BSI C5 or a HIPAA BAA — the main finding for a firm that relies on those reports.
          Reassess when auto browse leaves its experimental stage or the compliance list changes.
        verified: "2026-10-30"
      - mitigation: cap-agent-kill-switch
        coverage: partial
        mechanism: >-
          GeminiSettings 1 or GeminiActOnWebSettings 1 (dynamic refresh) per organizational unit; Gemini app
          Service status off in the Admin console
        steps:
          - title: Switch auto browse or Gemini off
            body:
              - Set GeminiActOnWebSettings to 1 to stop actuation, or GeminiSettings to 1 to remove Gemini in
                Chrome, for the affected organizational unit; changes take minutes and up to 24 hours.
            url: https://support.google.com/chrome/a/answer/16291696?hl=en
        note: >-
          Partial on the kill-switch rule: both switches are reachable without the user and refresh dynamically,
          but no page says a task already running stops, propagation can take up to 24 hours, and a task Gemini
          moved to the remote cloud browser is not documented as reached by device policy. The user's own Stop
          and Take over task end a task immediately.
        verified: "2026-10-30"
    # The security-relevant settings, each with the baseline value (data/tooling/BASELINE.md).
    # Chrome policies are set in Admin console › Devices › Chrome › Settings (or by MDM as mandatory machine policy);
    # Gemini app settings live under Admin console › Generative AI › Gemini app. Changes take minutes and up to
    # 24 hours. Verified 2026-10-30.
    settings:
      - id: twoStepVerification
        name: 2-Step Verification — Enforcement
        where: Google Admin console › Security › Authentication › 2-step verification › Enforcement
        setVia: [adminConsole, identityProvider]
        area: identity
        recommended: On for every organizational unit that uses Gemini, or MFA enforced in your federated IdP
        why: The account Chrome is signed in with — and so the sessions Gemini acts in — needs a second factor at sign-in.
        mitigations: [D3-MFA]
        requires: Google Workspace or Cloud Identity
        url: https://knowledge.workspace.google.com/admin/security/deploy-2-step-verification
        verified: "2026-10-30"
      - id: restrictSigninToPattern
        name: RestrictSigninToPattern
        where: Admin console › Devices › Chrome › Settings, or MDM → RestrictSigninToPattern
        setVia: [mdm, adminConsole]
        area: identity
        default: Unset (any Google account)
        recommended: A pattern matching your corporate domains, e.g. .*@example\.com
        why: A personal Google account can't become the managed browser's primary account and bring consumer Gemini in Chrome with it.
        mitigations: [D3-MFA]
        url: https://chromeenterprise.google/policies/restrict-signin-to-pattern/
        verified: "2026-10-30"
      - id: allowedDomainsForApps
        name: AllowedDomainsForApps
        where: Admin console › Devices › Chrome › Settings, or MDM → AllowedDomainsForApps
        setVia: [mdm, adminConsole]
        area: identity
        default: Unset (any account)
        recommended: Your Workspace domains
        why: Chrome adds X-GoogApps-Allowed-Domains, so Google services, Gemini included, refuse consumer and other organisations' accounts on managed browsers.
        mitigations: [D3-MFA]
        url: https://chromeenterprise.google/policies/allowed-domains-for-apps/
        verified: "2026-10-30"
      - id: geminiAppServiceStatus
        name: Gemini app — Service status
        where: Admin console › Generative AI › Gemini app › Service status
        setVia: [adminConsole]
        area: identity
        recommended: On for the organizational units licensed and trained for Gemini
        why: Gemini in Chrome is part of the Gemini app; turning the service off for a unit removes it there with the web and mobile apps.
        mitigations: [cap-agent-kill-switch]
        url: https://knowledge.workspace.google.com/admin/generative-ai/gemini-app/turn-the-gemini-app-on-or-off
        verified: "2026-10-30"
      - id: geminiSettings
        name: GeminiSettings (Gemini integrations)
        where: Admin console › Devices › Chrome › Settings › Generative AI › Gemini integrations, or MDM → GeminiSettings
        setVia: [adminConsole, mdm]
        area: tools
        default: Follows GenAiDefaultSettings (allowed unless that is 2)
        recommended: 0 (Allow Gemini integrations) for Gemini-enabled units, set explicitly; 1 elsewhere
        why: The Chrome-side switch for Gemini in Chrome alone, refreshed without a restart — the fastest way to remove it from a unit.
        mitigations: [cap-agent-kill-switch]
        url: https://chromeenterprise.google/policies/gemini-settings/
        verified: "2026-10-30"
      - id: genAiDefaultSettings
        name: GenAiDefaultSettings
        where: Admin console › Devices › Chrome › Settings › Generative AI (Admin console only)
        setVia: [adminConsole]
        area: data
        default: 1 for Admin-console-managed enterprise users; 0 otherwise
        recommended: 1 (Allow GenAI features without improving AI models)
        why: Chrome's generative AI features stay on without Google using prompts, inputs or outputs to improve its models; regulated teams set 2.
        mitigations: []
        url: https://chromeenterprise.google/policies/gen-ai-default-settings/
        verified: "2026-10-30"
      - id: geminiActOnWebSettings
        name: GeminiActOnWebSettings
        where: Admin console › Devices › Chrome › Settings, or MDM → GeminiActOnWebSettings
        setVia: [adminConsole, mdm]
        area: tools
        default: 0 / unset allows (the admin article says off by default for managed users) — set it explicitly
        recommended: 1 (Disallow), with approved sites in GeminiActOnWebAllowedForURLs for the pilot unit
        why: Auto browse can't act on any page that isn't explicitly allowed, so an injected page can't send it into the user's other signed-in sessions.
        mitigations: [cap-agent-egress-control, AML.M0028, cap-agent-action-policy-enforcement, cap-agent-kill-switch]
        url: https://chromeenterprise.google/policies/gemini-act-on-web-settings/
        verified: "2026-10-30"
      - id: geminiActOnWebAllowedForUrls
        name: GeminiActOnWebAllowedForURLs
        where: Admin console › Devices › Chrome › Settings, or MDM → GeminiActOnWebAllowedForURLs
        setVia: [adminConsole, mdm]
        area: network
        default: Unset
        recommended: The internal apps and approved SaaS a pilot team uses auto browse on, widened as the pilot shows the need
        why: Gemini acts only on listed sites while GeminiActOnWebSettings is 1; reading a shared tab is unaffected.
        mitigations: [cap-agent-egress-control, AML.M0028, cap-agent-action-policy-enforcement]
        url: https://support.google.com/chrome/a/answer/16291696?hl=en
        verified: "2026-10-30"
      - id: geminiActOnWebBlockedForUrls
        name: GeminiActOnWebBlockedForURLs
        where: Admin console › Devices › Chrome › Settings, or MDM → GeminiActOnWebBlockedForURLs
        setVia: [adminConsole, mdm]
        area: network
        default: Unset
        recommended: Banking and payment sites, HR and payroll systems and your admin consoles — none of them also on the allowlist
        why: Gemini never acts in those signed-in sessions; a URL on both lists is allowed, so keep them disjoint.
        mitigations: [cap-agent-egress-control, D3-CTS]
        url: https://support.google.com/chrome/a/answer/16291696?hl=en
        verified: "2026-10-30"
      - id: geminiSparkSettings
        name: GeminiSparkSettings
        where: Admin console › Devices › Chrome › Settings, or MDM → GeminiSparkSettings
        setVia: [adminConsole, mdm]
        area: tools
        default: 1 (Gemini Spark not allowed)
        recommended: 1
        why: The autonomous Gemini Spark agent can't drive Chrome auto browse in the user's live session; Google's own warning cites credential risk and lost context-aware signals.
        mitigations: [AML.M0029, cap-agent-tool-registry]
        url: https://chromeenterprise.google/policies/gemini-spark-settings/
        verified: "2026-10-30"
      - id: safeBrowsingProtectionLevel
        name: SafeBrowsingProtectionLevel
        where: Admin console › Devices › Chrome › Settings, or MDM → SafeBrowsingProtectionLevel (mandatory)
        setVia: [adminConsole, mdm]
        area: network
        default: Unset (Standard, user can change)
        recommended: 1 (Standard), mandatory
        why: Auto browse requires Safe Browsing, and known-malicious pages are blocked before Gemini reads or acts on them; Enhanced shares more browsing data with Google.
        mitigations: [cap-input-guardrails]
        url: https://chromeenterprise.google/policies/safe-browsing-protection-level/
        verified: "2026-10-30"
      - id: geminiApps
        name: Apps — Workspace apps / Other Google apps
        where: Admin console › Generative AI › Gemini app › Apps
        setVia: [adminConsole]
        area: data
        default: Workspace apps on
        recommended: Workspace apps on; Other Google apps off
        why: Gemini can use the user's Gmail, Drive and Calendar under Workspace terms; Maps, YouTube, Flights and Hotels run under consumer Google terms.
        mitigations: [AML.M0028, cap-agent-tool-registry]
        url: https://knowledge.workspace.google.com/admin/generative-ai/gemini-app/turn-google-apps-in-gemini-on-or-off
        verified: "2026-10-30"
      - id: conversationHistory
        name: Gemini conversation history — Conversation retention
        where: Admin console › Generative AI › Gemini app › Gemini conversation history
        setVia: [adminConsole]
        area: data
        default: On, 18 months
        recommended: On, 3 months (the shortest offered)
        why: Chats, tab content shared into them included, are deleted after 3 months; turning history off would also switch off Workspace apps in Gemini.
        mitigations: [AML.M0031]
        url: https://knowledge.workspace.google.com/admin/generative-ai/gemini-app/turn-the-gemini-app-on-or-off
        verified: "2026-10-30"
      - id: temporaryChats
        name: Allow temporary chats
        where: Admin console › Generative AI › Gemini app › Gemini conversation history
        setVia: [adminConsole]
        area: audit
        default: On (without Vault for Gemini); Off (with Vault for Gemini)
        recommended: "Off, unless a Vault retention rule covers the Gemini app"
        why: Without Vault, Gemini logs nothing for a temporary chat, so there is no record of what a user asked or shared from a tab.
        mitigations: [cap-agent-tracing]
        url: https://knowledge.workspace.google.com/admin/generative-ai/gemini-app/enable-temporary-chats-in-gemini-app
        verified: "2026-10-30"
      - id: vaultGeminiRetention
        name: Vault default retention rule — Gemini app
        where: vault.google.com › Retention › Gemini app
        setVia: [adminConsole]
        area: audit
        default: No default retention
        recommended: A retention period matching your records policy for the Gemini-enabled units
        why: Prompts and responses can be held, searched and exported centrally even after users delete chats; Vault doesn't keep media files.
        mitigations: [cap-agent-tracing]
        requires: Workspace edition with Vault
        url: https://knowledge.workspace.google.com/vault/retention/retain-gemini-app-messages-with-vault
        verified: "2026-10-30"
      - id: conversationSharingLink
        name: Allow conversation sharing via link
        where: Admin console › Generative AI › Gemini app › Sharing › Conversation sharing
        setVia: [adminConsole]
        area: sharing
        default: "Off"
        recommended: "Off"
        why: A chat holding client page content can't be published to anyone with the link; Drive sharing (on by default) follows your Drive external-sharing settings.
        mitigations: []
        url: https://knowledge.workspace.google.com/admin/generative-ai/gemini-app/turn-conversation-sharing-on-or-off
        verified: "2026-10-30"
      - id: cepDlpAutoBrowse
        name: Chrome data protection rule — Source Chrome context "Gemini in Chrome (auto browse)"
        where: Admin console › Security › Access and data control › Data protection › rule with the Source Chrome context condition
        setVia: [adminConsole]
        area: data
        default: No rule
        recommended: Audit every auto browse upload and paste; block your sensitive detectors (credentials, national IDs, client account numbers)
        why: Content the agent sends to a site is inspected and recorded separately from the user's own transfers.
        mitigations: [cap-sensitive-data-redaction, D3-WSAA]
        requires: Chrome Enterprise Premium, with Chrome Enterprise connectors on
        url: https://support.google.com/chrome/a/answer/17128928?hl=en
        verified: "2026-10-30"
