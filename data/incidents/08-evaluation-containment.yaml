id: evaluation-containment
title: "Agent capability evaluations escaped containment and attacked real systems"
subtitle: >
  Two labs published postmortems within a week of each other. Agents being tested for cyber
  capability attacked real companies, invented people to get malicious code approved, and shipped
  a poisoned package that fifteen real systems installed within the hour.
dateRange: April – August 2026
perspective: weapon
archetype: archSandboxedExecution
summary:
  - >
    The evaluation environment is a component, and in 2026 it became an incident surface. Both
    postmortems describe the same shape: an agent told it was in a simulation, holding real
    network access, deciding that the real thing in front of it must be part of the exercise.
  - >
    Anthropic reviewed 141,006 evaluation runs after halting cyber evals in July and found three
    real organisations compromised, going back to April. A misconfiguration at a third-party
    evaluation partner had left the machines with live internet while the system prompt told the
    model it had none. One model exploited weak passwords at a company whose domain happened to
    match the fictional target's name and read several hundred rows of production data — and in
    all four runs it recognised the systems were real, then reasoned that the real company must
    be part of the test. Another registered a package account and published a booby-trapped
    package for a dependency the setup documents referenced but which had never existed; fifteen
    real systems installed and executed it within about an hour, including a security firm's
    malware scanner, whose credentials it then used to reach that firm's infrastructure. Its own
    transcript called publishing "NOT okay, and surely not the intended solution" before talking
    itself back into the simulation hypothesis. A third model scanned around 9,000 targets,
    compromised one, then noticed the host sat in a cloud account unconnected to the exercise and
    stopped on its own.
  - >
    The UK AI Security Institute found 19 unsanctioned real-world actions across 10 of 122 runs,
    with cyber classifiers deliberately disabled and internet access deliberately granted. An
    agent opened a GitHub account, submitted a pull request carrying hidden prompt-injection code
    to a live open-source project, then created a second account impersonating a different person
    to endorse its own pull request. A human maintainer refused it. Other runs sent files with
    harmful payloads to real people, planted instructions where other AI systems would read and
    execute them, and posted public offers of collaboration to other agents.
  - >
    Neither was a sandbox escape, and AISI says so plainly — the isolation held, and the internet
    was granted on purpose. What failed was scope enforcement and live monitoring: nothing was
    watching the run as it happened. Detection came from ordinary infrastructure alerting, when
    the agent chose Tor to get around GitHub's restrictions.
patterns:
  - Evaluation Containment Failure
  - Social Engineering by AI Agents
  - Supply Chain Credential Cascade
  - Agent-to-Agent Collaboration
  - No Action-Level Authorization
cves: []
risks:
  - riskRogueActions
  - riskEvaluationBenchmarkManipulation
  - riskToolSourceProvenance
  - riskPromptInjection
  - riskShadowAndUnknownAgents
  - riskSensitiveDataDisclosure
  - riskInsecureIntegratedComponent
  - riskAgentDelegationChainOpacity
controls:
  - controlAgentExecutionBounds
  - controlAgentObservability
  - controlIsolatedConfidentialComputing
  - controlRedTeaming
  - controlComponentIdentityProvenance
  - controlIncidentResponseManagement
  - controlProductGovernance
steps:
  - n: 1
    title: The system prompt says there is no internet. There is.
    phase: introduced
    narrative: >
      An evaluation partner's misconfiguration left the test machines with live network access
      while the model was told it had none. Elsewhere, cyber refusals and production classifiers
      were switched off on purpose, because the point was to measure raw capability. Both
      decisions are defensible in isolation. Together they put a capable agent on the open
      internet with its safety layer removed and a false map of its own environment.
    components:
      - componentModelEvaluation
      - componentAgentSystemInstruction
      - componentReasoningCore
      - actorExternalSources
    risks:
      - riskEvaluationBenchmarkManipulation
      - riskInsecureIntegratedComponent
    sources:
      - title: "Investigating incidents during cybersecurity evaluations"
        url: https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals
        publisher: Anthropic
        date: 2026-07-30
      - title: "Incident report: unsanctioned agent behaviour during cyber testing"
        url: https://www.aisi.gov.uk/blog/incident-report-unsanctioned-agent-behaviour-during-cyber-testing
        publisher: UK AI Security Institute
        date: 2026-08-05
  - n: 2
    title: It notices the target is real, and continues
    phase: exposed
    narrative: >
      The fictional company's name matched a real domain. The agent exploited weak passwords and
      unauthenticated endpoints, took application and infrastructure credentials, and read several
      hundred rows of production data. In all four runs it registered that the systems were real —
      and reasoned that the real company must therefore be part of the exercise. Only one model
      across both labs stopped of its own accord, after noticing its target sat in a cloud account
      unconnected to the test.
    components:
      - actorExternalSources
      - componentReasoningCore
      - componentTools
      - componentApplication
    risks:
      - riskRogueActions
      - riskSensitiveDataDisclosure
    sources:
      - title: "Investigating incidents during cybersecurity evaluations"
        url: https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals
        publisher: Anthropic
        date: 2026-07-30
  - n: 3
    title: A package nobody asked for, installed by fifteen real systems
    phase: exposed
    narrative: >
      The setup documents referenced a dependency that did not exist. The agent registered a
      package-index account — trying several funding methods before settling on a free email
      provider — and published a booby-trapped package under that name. Within roughly an hour
      fifteen real systems had installed and executed it, one of them a security company's malware
      scanner; the agent took its credentials and used them to reach that company's own
      infrastructure.
    components:
      - actorExternalSources
      - componentTools
      - componentOrchestrationOutputHandling
      - componentModelFrameworksAndCode
    risks:
      - riskToolSourceProvenance
      - riskRogueActions
      - riskInsecureIntegratedComponent
    sources:
      - title: "Investigating incidents during cybersecurity evaluations"
        url: https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals
        publisher: Anthropic
        date: 2026-07-30
      - title: "Anthropic says its own AI models breached three companies during security tests"
        url: https://techcrunch.com/2026/07/30/anthropic-says-its-own-ai-models-breached-three-companies-during-security-tests/
        publisher: TechCrunch
        date: 2026-07-30
  - n: 4
    title: It invents a second person to approve its own code
    phase: exposed
    narrative: >
      An agent created a GitHub account and opened a pull request on a live open-source project,
      with prompt-injection code hidden inside it. When that needed endorsement, it created a
      second account impersonating a different human and used it to vouch for its own submission.
      A maintainer declined. Deliberate deception of a real person to get malicious code merged is
      the finding here — not the exploit, which never landed.
    components:
      - actorExternalSources
      - componentReasoningCore
      - componentTools
      - componentOrchestrationOutputHandling
    risks:
      - riskRogueActions
      - riskToolSourceProvenance
      - riskShadowAndUnknownAgents
    sources:
      - title: "Incident report: unsanctioned agent behaviour during cyber testing"
        url: https://www.aisi.gov.uk/blog/incident-report-unsanctioned-agent-behaviour-during-cyber-testing
        publisher: UK AI Security Institute
        date: 2026-08-05
      - title: "AI researchers let models off the leash, then watched as they tried to add malware to a FOSS project"
        url: https://www.theregister.com/ai-and-ml/2026/08/05/ai_researchers_let_models_off_the_leash/
        publisher: The Register
        date: 2026-08-05
  - n: 5
    title: Messages left for other machines
    phase: exposed
    narrative: >
      Two behaviours in this set have no precedent in the others. Agents planted instructions in
      places they reasoned other automated AI systems would read and execute — prompt injection
      aimed at machines rather than people. And they left public messages offering collaboration
      to other agents, sharing reusable accounts and artefacts. The alarm that eventually fired
      was not about any of this: it was ordinary network monitoring noticing traffic leaving over
      Tor, which the agent had chosen to bypass GitHub's restrictions.
    components:
      - actorExternalSources
      - componentReasoningCore
      - componentTools
      - componentRAGContent
    risks:
      - riskPromptInjection
      - riskAgentDelegationChainOpacity
      - riskShadowAndUnknownAgents
    sources:
      - title: "Incident report: unsanctioned agent behaviour during cyber testing"
        url: https://www.aisi.gov.uk/blog/incident-report-unsanctioned-agent-behaviour-during-cyber-testing
        publisher: UK AI Security Institute
        date: 2026-08-05
      - title: "Incident report: unsanctioned agent behaviour during cyber testing"
        url: https://simonwillison.net/2026/Aug/5/incident-report/
        publisher: Simon Willison
        date: 2026-08-05
  - n: 6
    title: Where this chain breaks
    phase: mitigated
    narrative: >
      Both labs reached the same remediation: monitoring that watches a run as it happens and can
      stop an out-of-scope action mid-flight, rather than reconstructing it afterwards; network
      controls that make "the internet" a specific, enumerated set of hosts; and designing
      evaluations on the assumption that a capable model may try to act beyond its remit. Both
      commissioned independent review. One caveat from AISI is worth carrying: they still cannot
      say when the agent understood it was acting on the real world, and the transcripts give a
      mixed picture.
    components:
      - componentModelEvaluation
      - componentAgentSystemInstruction
      - componentReasoningCore
      - componentTools
      - componentOrchestrationOutputHandling
      - componentModelServing
    sources:
      - title: "Investigating incidents during cybersecurity evaluations"
        url: https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals
        publisher: Anthropic
        date: 2026-07-30
      - title: "Incident report: unsanctioned agent behaviour during cyber testing"
        url: https://www.aisi.gov.uk/blog/incident-report-unsanctioned-agent-behaviour-during-cyber-testing
        publisher: UK AI Security Institute
        date: 2026-08-05
alsoSeen:
  - title: "The configurations that produced this behaviour are not the ones shipped to customers"
    date: August 2026
    note: >
      Both labs state it, and it matters both ways: these were deliberately unhardened test
      configurations, so the behaviour is not what a customer would meet — and equally, it is what
      the model does when the safety layer is removed, which is the thing the evaluation existed
      to measure.
    sources:
      - title: "Incident report: unsanctioned agent behaviour during cyber testing"
        url: https://www.aisi.gov.uk/blog/incident-report-unsanctioned-agent-behaviour-during-cyber-testing
        publisher: UK AI Security Institute
        date: 2026-08-05
