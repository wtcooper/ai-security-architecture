  - architecture: archAgentSandbox
    asOf: "2026-10"
    # >>> checked against the vendor's documentation
    verified: "2026-11-18"
    sources:
      graders: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/workload-separation
      platform: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/workload-identity
      orchestrator: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/agent-sandbox
      sandbox: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/machine-learning/agent-sandbox
      storage: https://docs.cloud.google.com/storage/docs/uniform-bucket-level-access
      inference: https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/serve-gemma-gpu-vllm
      registry: https://docs.cloud.google.com/artifact-registry/docs/repositories/virtual-overview
      sources: https://docs.cloud.google.com/artifact-registry/docs/repositories/remote-overview
    differences:
      - at: localTools->offlineWeb
        text: "Agent Sandbox's default network policy lets a sandbox reach the public internet; it blocks only private ranges, cluster DNS and the metadata server. To keep rollouts off the live web, define your own policy in the SandboxTemplate that denies everything except named peers."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/agent-sandbox
      - at: harness->inference
        text: "FQDN network policies cannot allow traffic to in-cluster Services. The vLLM API and the offline web are in the cluster, so allow them with label-based NetworkPolicy; FQDN policies help only for names outside the cluster, such as Artifact Registry."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/fqdn-network-policies
      - at: localTools->registry
        text: "Artifact Registry is a Google API outside the cluster. Allowing its name also allows every other service on the same shared Google addresses, and DNS lookups are never blocked. Add VPC Service Controls so that route cannot carry data elsewhere."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/fqdn-network-policies
      - at: localTools->platform
        text: "Logs need no network path from the sandbox: an agent on each node reads container output and writes it with the node's service account. The metadata server is blocked by Agent Sandbox's default policy and must be allowed before Workload Identity works."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-logs
      - at: sandbox
        text: "gVisor sandboxes cannot read node metadata, but microVM sandboxes can unless you add a network policy blocking it. The recommended admission policy also demands gVisor, so it rejects microVM sandboxes until you edit it."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/sandbox-pods
      - at: sandbox
        text: "Google's generally available RL set-up for Agent Sandbox reuses warm Pods between episodes with an in-pod reset to save start-up time. The pattern wants a fresh sandbox per task, so do not use the recycle strategy across tasks that must stay separate."
        url: https://cloud.google.com/blog/products/containers-kubernetes/accelerate-agentic-rl-with-gke-agent-sandbox
      - at: sandbox
        text: "Google now recommends Agent Substrate on GKE for most agent workloads, with outbound traffic blocked by default. Agent Sandbox is advised when each agent needs its own Pod, GPUs or Autopilot, and you install and upgrade its controller yourself."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/machine-learning/agent-workloads
      - at: graders->harness
        text: "By default only the Sandbox Router may open connections into a sandbox. Graders cannot check a rollout's end state directly; send the checks through the orchestrator and router, or add an ingress rule for the grader namespace."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/how-install-agent-sandbox
      - at: storage->inference
        text: "In Google's RL-on-GKE tutorial the sampler (vLLM) runs inside the training workers, and one bucket holding weights, data and checkpoints is mounted on every node with Cloud Storage FUSE. Keep vLLM as a separate service and mount the bucket only on its nodes."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/scaling-rl-verl-gke
    alsoNeeded:
      - service: "VPC Service Controls"
        role: network
        why: "Stops allowed Google API routes (Artifact Registry, Cloud Storage) carrying data to other projects."
        url: https://docs.cloud.google.com/artifact-registry/docs/securing-with-vpc-sc
      - service: "Private GKE nodes"
        role: network
        why: "Nodes without external addresses, so a sandbox host has no direct internet route."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/hardening-your-cluster
      - service: "Cloud Storage FUSE CSI driver"
        role: other
        why: "Mounts the checkpoint bucket into the vLLM Pods, authenticated by Workload Identity."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/cloud-storage-fuse-csi-driver
      - service: "Artifact Registry Docker repository (with GKE Image Streaming)"
        role: registry
        why: "Holds task, harness and vLLM container images; the component row covers language packages only."
        url: https://docs.cloud.google.com/artifact-registry/docs/repositories/virtual-overview
      - service: "GKE Gateway API"
        role: ingress
        why: "Reaches the Sandbox Router and orchestrator from outside the cluster; port-forwarding is for development only."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/agent-sandbox
      - service: "Cloud KMS"
        role: keys
        why: "Customer-managed keys for the checkpoint bucket."
        url: https://docs.cloud.google.com/storage/docs/encryption/customer-managed-keys
      - service: "Secret Manager"
        role: secrets
        why: "Google's hardening guide says to keep secrets there, not in Kubernetes Secrets."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/hardening-your-cluster
      - service: "Managed OpenTelemetry for GKE"
        role: logging
        why: "Google's documented way to collect RL metrics and traces into Cloud Monitoring and Cloud Trace."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/monitor-reinforcement-learning-workloads
      - service: "Workload Identity Federation for GKE (IAM)"
        role: identity
        why: "Gives each run's Pods their own Google Cloud identity without keys."
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/workload-identity
      - service: "Cloud Logging log bucket"
        role: logging
        why: "Locked store for trajectory and host logs."
        url: https://docs.cloud.google.com/logging/docs/buckets
    quickstart:
      - title: "Install Agent Sandbox on GKE"
        url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/how-install-agent-sandbox
      - title: "Isolating AI code execution with Agent Sandbox on GKE"
        url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/agent-sandbox
      - title: "Accelerating agentic RL and evaluation research velocity with 45x faster GKE Agent Sandbox"
        url: https://cloud.google.com/blog/products/containers-kubernetes/accelerate-agentic-rl-with-gke-agent-sandbox
    # <<< checked
    reference:
      - title: About Agent Sandbox on GKE
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/machine-learning/agent-sandbox
      - title: GKE Sandbox
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/sandbox-pods
    summary:
      - >-
        Rollouts as Agent Sandbox on GKE sandboxes (each a Pod in GKE Sandbox, gVisor by default or a
        microVM with its own kernel) on node pools separated by trust group, with FQDN network policies
        limiting every rollout to the offline web, the read-only package mirror and the platform
        services it needs. The policy model is served by an inference server (vLLM here) on GPU node
        pools the sandboxes reach only through its API; trajectories land in a locked log bucket. Google
        publishes no Architecture Center design for RL environments; its Agent Sandbox and GKE Sandbox
        guides are the reference.
    bindings:
      - { block: graders, service: Your graders on a separate node pool, build: true, note: "Programmatic checks and reward models; read a rollout's end state through the orchestrator, never from inside a sandbox." }
      - { block: platform, service: "GKE metadata server, Cloud Logging and Monitoring", note: "Every one reachable from a sandbox host is a route out, so each is named on the egress list or blocked." }
      - { block: orchestrator, service: Your run orchestrator on GKE, build: true, note: "Drives the Agent Sandbox controller's SandboxClaims and holds the automatic stop." }
      - block: sandbox
        service: "Agent Sandbox on GKE (GKE Sandbox)"
        note: "gVisor under the recommended security policy; microVMs (Kata Containers) where a task needs a full kernel. Google recommends Agent Substrate for most stateful CPU agents and Agent Sandbox for GPU workloads and custom PodSpecs, which a rollout per Pod can need."
        options:
          - { name: "Agent Sandbox on GKE (GKE Sandbox)", kind: commercial, url: "https://docs.cloud.google.com/kubernetes-engine/docs/concepts/machine-learning/agent-sandbox", note: "gVisor or microVMs, named per Pod: without one a Pod has no kernel isolation. GPUs and TPUs work only with gVisor, as do Pod snapshots.", packs: [googleCloudNative] }
          - { name: "Agent Sandbox with Kata Containers", kind: open, url: "https://agent-sandbox.sigs.k8s.io/docs/use-cases/examples/kata-gke-sandbox/", note: "The open-source controller with Kata Containers you install on Ubuntu node pools; Google's support does not cover Kata.", packs: [openSourceOnGke] }
          - { name: "Agent Substrate on GKE", kind: commercial, url: "https://docs.cloud.google.com/kubernetes-engine/docs/concepts/machine-learning/agent-workloads", note: "Snapshots idle sessions and restores them in under a second; GKE Standard only, no GPUs or TPUs." }
      - { block: harness, service: Your episode loop in the sandbox, build: true }
      - { block: localTools, service: "Shell, files and browser in the sandbox", build: true }
      - { block: storage, service: Cloud Storage (checkpoint bucket) }
      - block: inference
        service: "vLLM on GKE GPU node pools"
        builtWith: "vLLM"
        options:
          - { name: "vLLM on GKE GPU node pools", kind: open, url: "https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/serve-gemma-gpu-vllm", note: "The policy model behind its API on separate GPU node pools; Google's tutorials also run vLLM on TPUs.", packs: [googleCloudNative, openSourceOnGke] }
          - { name: "SGLang on GKE", kind: open, url: "https://docs.sglang.io/", note: "Serving framework for language and multimodal models, run as your own Deployment; no Google GKE tutorial." }
          - { name: "NVIDIA NIM on GKE", kind: commercial, url: "https://docs.nvidia.com/nim/cloud/gke/overview", note: "From the Google Cloud Marketplace app or NVIDIA's Terraform and Helm; a vLLM or SGLang engine inside each image.", packs: [nvidiaNim] }
      - { block: offlineWeb, service: Your offline web snapshot, build: true, note: "A cached crawl and simulated applications served inside the cluster." }
      - block: registry
        service: "Artifact Registry remote and virtual repos"
        options:
          - { name: "Artifact Registry remote and virtual repos", kind: commercial, url: "https://docs.cloud.google.com/artifact-registry/docs/repositories/remote-overview", note: "Remote repositories proxy PyPI, npm, Maven and Docker upstreams; a virtual repository gives builds one address.", packs: [googleCloudNative] }
          - { name: "Assured Open Source Software", kind: commercial, url: "https://docs.cloud.google.com/assured-open-source-software/docs/overview", note: "Google-secured, signed builds of over a thousand popular Java, Go, Python and npm packages, with SBOMs and VEX." }
          - { name: "JFrog Artifactory", kind: commercial, url: "https://jfrog.com/reference-architecture/jfrog-saas/", note: "Package and artefact manager as JFrog SaaS in AWS, Azure and Google Cloud regions, or self-hosted." }
          - { name: "Sonatype Nexus Repository", kind: commercial, url: "https://help.sonatype.com/en/blob-stores.html", note: "Self-hosted repository manager whose blob store can be a Google Cloud Storage bucket." }
      - { block: openWeb, service: The live web (crawled offline only) }
      - { block: sources, service: "Public registries (PyPI, npm)" }
    # >>> hosting options (compared against the vendor's pages; one is the mapping itself)
    hosting:
      - id: gke
        kind: cluster
        name: "Agent Sandbox on GKE"
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/machine-learning/agent-sandbox
        asOf: "2026-11"
        mapped: true
        compare:
          runs: "The Agent Sandbox controller you install creates and removes a Pod for each sandbox from claims; GKE Sandbox isolates each Pod with gVisor or a microVM."
          patching: "Google upgrades the control plane and auto-upgrades nodes; you upgrade the Agent Sandbox controller and rebuild the sandbox images."
          data: "Code, files and results stay in Pods on your nodes and in the volumes or buckets you attach; Pod snapshots save state only if you take them."
          network: "The controller creates a NetworkPolicy for each SandboxTemplate; you define the egress and ingress rules that fit your run in the template."
          identity: "Each sandbox Pod uses a Kubernetes ServiceAccount, which Workload Identity Federation for GKE can map to an IAM principal."
          accepts: "Any container image and a full Kubernetes PodSpec, including sidecars and GPUs or TPUs; a Python client library requests and drives sandboxes."
          workload: "Warm pools hand out ready Pods, typically in under a second; a sandbox can be suspended and resumed; parallel runs are limited by your node capacity."
          portability: "Agent Sandbox is an open source Kubernetes project, so templates and client code move to other clusters; GKE Sandbox and Pod snapshots are GKE features."
          effort: "You operate the cluster, node pools, the controller and Sandbox Router, the warm pools, network policies and upgrades."
          fits: "Google advises it when each agent needs a dedicated Pod, a full PodSpec, GPUs or TPUs, or Autopilot, and recommends Agent Substrate for most agent workloads."
        sources:
          - https://docs.cloud.google.com/kubernetes-engine/docs/concepts/machine-learning/agent-sandbox
          - https://docs.cloud.google.com/kubernetes-engine/docs/how-to/agent-sandbox
          - https://docs.cloud.google.com/kubernetes-engine/docs/concepts/machine-learning/agent-workloads
          - https://docs.cloud.google.com/kubernetes-engine/docs/concepts/sandbox-pods
          - https://docs.cloud.google.com/kubernetes-engine/docs/concepts/workload-identity
          - https://docs.cloud.google.com/kubernetes-engine/docs/how-to/node-auto-upgrades
      - id: cloudRun
        kind: runtime
        name: "Cloud Run sandboxes"
        url: https://docs.cloud.google.com/run/docs/code-execution
        asOf: "2026-11"
        compare:
          runs: "Your code in a Cloud Run job, service or worker pool starts and deletes each sandbox with the sandbox command; sandboxes are isolated inside that microVM-based instance."
          patching: "Google manages the infrastructure and supplies the sandbox binary; you rebuild the container image, whose file system the sandbox reads."
          data: "Code and files live in an ephemeral overlay deleted with the sandbox; you keep results through tar archives, bind mounts or a Cloud Storage bucket."
          network: "Sandbox egress is blocked by default; --allow-egress opens every host the Cloud Run resource can reach, so finer limits come from its VPC egress settings."
          identity: "Each revision runs as the service account set as its service identity; if you set none it uses the Compute Engine default service account."
          accepts: "Whatever is in your container image or, with sandbox templates, in up to 10 other images; processes can add tools with apt, pip or npm; headless browsers are documented."
          workload: "Sandboxes start almost instantly inside a running instance and share its CPU and memory; a job task can run for up to 168 hours, 12 with a GPU."
          portability: "The sandbox command exists only on Cloud Run, so the code that launches sandboxes is rewritten elsewhere; the container image itself is portable."
          effort: "You operate the launcher code, the image, instance sizing and the egress settings; there is no cluster, and the feature is in Preview."
          fits: "Google presents it for agents on Cloud Run that must run generated code, sub-agents or browsers quickly without creating a new resource for every task."
        sources:
          - https://docs.cloud.google.com/run/docs/code-execution
          - https://docs.cloud.google.com/run/docs/configuring/jobs/sandboxes
          - https://docs.cloud.google.com/run/docs/configuring/services/sandboxes
          - https://docs.cloud.google.com/run/docs/reference/sandbox-cli
          - https://docs.cloud.google.com/run/docs/securing/security
          - https://docs.cloud.google.com/run/docs/securing/multi-tenant
          - https://docs.cloud.google.com/run/docs/browser-automation
          - https://docs.cloud.google.com/run/docs/ai-agents
          - https://docs.cloud.google.com/run/docs/configuring/execution-environments
          - https://docs.cloud.google.com/run/docs/configuring/task-timeout
          - https://docs.cloud.google.com/run/docs/create-jobs
          - https://docs.cloud.google.com/run/docs/configuring/parallelism
          - https://docs.cloud.google.com/run/docs/execute/jobs
          - https://docs.cloud.google.com/run/docs/configuring/vpc-direct-vpc
          - https://docs.cloud.google.com/run/docs/securing/ingress
          - https://docs.cloud.google.com/run/docs/reference/iam/roles
          - https://docs.cloud.google.com/run/quotas
          - https://docs.cloud.google.com/run/docs/configuring/jobs/service-identity
          - https://docs.cloud.google.com/run/docs/securing/service-identity
        summary: "Each rollout is one task of a Cloud Run job. The task's container holds your episode loop and starts a Cloud Run sandbox (Preview) for everything the model runs, so that code sees no credentials, secrets or network unless you allow them. The orchestrator, graders and offline web become Cloud Run services you build. Google carries the hosts and the sandbox runtime; you give up Kubernetes network policy, warm pools and the choice of gVisor or microVM, and sandbox egress is all or nothing."
        bindings:
          - { block: sandbox, service: "Cloud Run sandboxes in a job task (Preview)", note: "Started with the sandbox command inside the task's instance, which is itself a second generation microVM.", url: https://docs.cloud.google.com/run/docs/code-execution }
          - { block: orchestrator, service: "Your run orchestrator on Cloud Run", build: true, note: "Executes the rollout job with one task per rollout and cancels executions as the automatic stop.", url: https://docs.cloud.google.com/run/docs/execute/jobs }
          - { block: harness, service: "Your episode loop in the job task's container", build: true, note: "Runs outside the sandbox with the task's service identity and passes each model action to sandbox do or sandbox exec.", url: https://docs.cloud.google.com/run/docs/code-execution }
          - { block: localTools, service: "Shell, files and browser in a Cloud Run sandbox", build: true, note: "note: Tools come from the host container image, mounted read-only, or from a sandbox template image; headless browsers are a documented use.", url: https://docs.cloud.google.com/run/docs/browser-automation }
          - { block: graders, service: "Your graders on a separate Cloud Run service", build: true, note: "Check the end state from the archive or bucket the orchestrator hands over, never from inside a sandbox.", url: https://docs.cloud.google.com/run/docs/code-execution }
          - { block: platform, service: "Cloud Run metadata server, Cloud Logging and Monitoring", note: "The metadata server gives credentials to the host container; sandboxes have no access to it by default.", url: https://docs.cloud.google.com/run/docs/securing/security }
          - { block: offlineWeb, service: "Your offline web snapshot on an internal Cloud Run service", build: true, note: "Ingress set to internal and reached from the tasks over Direct VPC egress.", url: https://docs.cloud.google.com/run/docs/securing/ingress }
        dropSettings: [gkeGoogleGroupsRbac, gkeSandbox, agentSandboxPolicy, gkeNetworkPolicy, workloadSeparation, fqdnNetworkPolicy, workloadIdentityGke, runAutoStop]
        addSettings: [cloudRunServiceIdentity, swpEgress, cloudRunIngress, cloudRunDirectVpcFirewall, cloudRunGen2Isolation, cloudRunSandboxLauncher, cloudRunJobsIam, cloudRunCancelExecution]
        differences:
          - at: sandbox
            text: "Sandboxes run inside one Cloud Run instance and share its CPU and memory. Google states that boundaries inside an instance are not as strong as the virtual machine boundary around it. For a fresh, separately walled environment per rollout, give every rollout its own job task instead of many sandboxes in one long-lived instance."
            url: https://docs.cloud.google.com/run/docs/securing/security
          - at: localTools->offlineWeb
            text: "Sandbox egress is all or nothing: blocked by default, and --allow-egress lets the sandbox reach every external host and VPC endpoint that the Cloud Run resource can reach. Limits on where browsing may go therefore come from the task's Direct VPC egress, firewall rules and Secure Web Proxy, not from the sandbox."
            url: https://docs.cloud.google.com/run/docs/code-execution
          - at: localTools->platform
            text: "The task's metadata server gives the service identity's credentials to the host container. A sandbox cannot reach it by default, but the episode loop can, so keep that identity minimal and never pass tokens in with --env. Sandbox output reaches Cloud Logging only when the host pipes it to its own standard streams."
            url: https://docs.cloud.google.com/run/docs/code-execution
          - at: localTools->registry
            text: "By default a local sandbox mounts the host container's root file system read-only, so anything in the image or on the host disk is readable by the model's code; a sandbox template runs it from a separate image instead. Installing packages inside a sandbox needs --allow-egress, which opens the whole network path; baking pinned packages into the image avoids that."
            url: https://docs.cloud.google.com/run/docs/code-execution
          - at: orchestrator->harness
            text: "Cloud Run sandboxes are in Preview. A job execution holds at most 10,000 tasks, started as fast as regional quota allows, and a task can run for 168 hours, or 12 with a GPU. There is no warm pool: a rollout waits for its task's instance to start, after which sandboxes start almost instantly."
            url: https://docs.cloud.google.com/run/quotas
        alsoNeeded:
          - service: "Direct VPC egress subnet and VPC firewall rules"
            role: network
            why: "The place to limit what a rollout task can reach, since there is no Kubernetes network policy."
            url: https://docs.cloud.google.com/run/docs/configuring/vpc-direct-vpc
          - service: "Cloud Storage bucket for workspace archives"
            role: other
            why: "A sandbox's files are deleted with it; results leave as tar archives or through a mounted directory or bucket."
            url: https://docs.cloud.google.com/run/docs/code-execution
          - service: "Cloud Run Admin API"
            role: other
            why: "The orchestrator calls it to execute and cancel job executions, in place of the Kubernetes API and SandboxClaims."
            url: https://docs.cloud.google.com/run/docs/execute/jobs
        quickstart:
          - title: "Code execution in Cloud Run"
            url: https://docs.cloud.google.com/run/docs/code-execution
          - title: "Configure sandboxes for jobs"
            url: https://docs.cloud.google.com/run/docs/configuring/jobs/sandboxes
          - title: "Cloud Run for multi-tenant platforms running untrusted code"
            url: https://docs.cloud.google.com/run/docs/securing/multi-tenant
      - id: agentPlatformCodeExecution
        kind: managed
        name: "Gemini Enterprise Agent Platform sandboxes (Code Execution)"
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sandbox
        asOf: "2026-11"
        compare:
          runs: "Google creates and deletes each sandbox when you call the Agent Platform API; it runs in a Google-managed tenant project inside a gVisor-isolated container."
          patching: "Google maintains the sandbox runtime and the predefined sandbox environments; a custom container image, if you bring one, is yours to rebuild."
          data: "Code, files and results sit in Google's tenant project for the sandbox's lifetime and return through the API; a customer-managed key can encrypt them at rest."
          network: "Code Execution sandboxes have no network; template sandboxes are offline by default and can be given internet access or a PSC interface into your VPC."
          identity: "Sandboxed code has no Google Cloud credentials and cannot query the metadata server; callers need the aiplatform.sandboxEnvironments.execute permission."
          accepts: "Python or JavaScript with a fixed library set in Code Execution; shell, browser (Computer Use) and custom container sandboxes are created from templates."
          workload: "Sandboxes usually start in seconds once provisioned, up to 2 minutes from cold; state lasts up to 14 days; the default quota is 1,000 per region."
          portability: "Sandboxes are driven through the Agent Platform SDK and API, so calling code is rewritten elsewhere; a custom container image can be reused."
          effort: "You manage templates, time-to-live settings, quotas and the logging done by the calling agent; there is no infrastructure to operate."
          fits: "Google presents it for agents, running anywhere, that need to execute untrusted generated code in a secure, isolated and managed sandbox."
        sources:
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sandbox
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sandbox/code-execution-overview
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sandbox/code-execution-quickstart
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sandbox/shell-sandbox-quickstart
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sandbox/computer-use
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sandbox/custom-containers
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sandbox/configure-vpc-sc
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sandbox/configure-cmek
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sandbox/manage-sandboxes
          - https://docs.cloud.google.com/gemini-enterprise-agent-platform/resources/agent-quotas
          - https://docs.cloud.google.com/architecture/choose-agentic-ai-architecture-components
        offers:
          - name: "Code Execution"
            what: "Runs Python or JavaScript in an isolated sandbox with no network access, file input and output up to 100 MB, and state kept for a configurable time to live of up to 14 days."
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sandbox/code-execution-overview
          - name: "Shell sandbox"
            what: "A managed, isolated Linux container that runs shell commands sent by the agent and returns stdout, stderr and an exit code."
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sandbox/shell-sandbox-quickstart
          - name: "Computer Use"
            what: "An isolated browser environment that the agent drives through API requests or a Chrome DevTools Protocol connection, with a live VNC view."
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sandbox/computer-use
          - name: "Custom containers"
            what: "Runs your own Linux image from Artifact Registry as a sandbox, defined by a SandboxEnvironmentTemplate for which Agent Platform keeps pre-warmed pools."
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sandbox/custom-containers
          - name: "Egress control for template sandboxes"
            what: "Internet access is off by default; a network attachment routes all sandbox egress through a Private Service Connect interface into your VPC, where firewall policy or Secure Web Proxy filters it."
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sandbox/configure-vpc-sc
          - name: "Pause, resume and time to live"
            what: "A sandbox can be paused and resumed with its file system state kept, and config.ttl removes it automatically when the time to live expires."
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sandbox/manage-sandboxes
          - name: "Customer-managed encryption keys"
            what: "A Cloud KMS key chosen when the Agent Platform instance is created encrypts the data that sandboxes write at rest."
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sandbox/configure-cmek
    # <<< hosting options
