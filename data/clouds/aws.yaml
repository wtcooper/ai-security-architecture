  - id: hyperPodAutoPatch
    name: AutoPatchConfig (AMI automatic patching)
    where: SageMaker HyperPod › cluster › each instance group's AutoPatchConfig on CreateCluster or UpdateCluster (PatchingStrategy WhenIdle); UpdateClusterSoftware for clusters that cannot use it
    setVia: [apiCli]
    area: tools
    default: "Off: node software is not refreshed per job, and AMI patches reach nodes only when you call UpdateClusterSoftware or opt an instance group in"
    recommended: AutoPatchConfig with PatchingStrategy WhenIdle on every instance group, keeping each patch date at the 21 days HyperPod sets rather than deferring it; on clusters created before 2026, UpdateClusterSoftware on a schedule you run
    value: Auto-patching on every instance group
