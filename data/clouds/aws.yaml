    setVia: [apiCli]
    area: tools
    default: "Updates use a blue/green deployment; the traffic shifting mode and alarms are yours to set"
    recommended: "Update endpoints with canary traffic shifting, a baking period and auto-rollback alarms on error rate and latency."
    value: "Canary shifting, baking period, auto-rollback alarms"
    why: "A new release takes a small share of traffic first and rolls back by itself if its alarms trip, on top of the weighted route at the gateway."
    mitigations: [cap-staged-rollout-gate]
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/deployment-guardrails-blue-green.html
    verified: "2026-11-18"
  - id: smEndpointKms
    name: "KmsKeyId on the endpoint configuration"
    where: "SageMaker AI › CreateEndpointConfig KmsKeyId (storage volume of the ML instances)"
    setVia: [cloudPolicy, apiCli]
    area: data
    default: "No customer managed key on the volume"
    recommended: "Your customer managed key, with a key policy that lets only the endpoint's execution role and SageMaker use it."
    value: "Your customer managed key, endpoint role only"
    why: "The copy of the weights on the EBS storage volume is encrypted under a key you control and can revoke. On Nitro instance types with local NVMe storage, a hardware module encrypts that storage and the KMS key does not apply."
    mitigations: [AML.M0005]
