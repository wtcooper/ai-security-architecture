# Lovable: one entity per product × reference architecture. Facts are dated (asOf) and cite the vendor's own
# documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# Scope: the Lovable editor and Chats on the web, the built-in backend (database, users, storage and edge
# functions on Supabase's open-source foundation, run by Lovable), publishing and hosting at lovable.app, a
# workspace-branded address or a custom domain, connectors, and the workspace and organization settings of
# Business and Enterprise workspaces.
# Exclusions: the Lovable desktop app (an endpoint shell; only its Local desktop MCP servers switch, which the
# workspace admin sets, is recorded); the mobile app, Telegram bot and ChatGPT app (shells over the same
# workspace); Automations and Chats used without a project; projects that connect their own Supabase project
# (row rules and secrets then live in the customer's Supabase, outside these settings); apps published to
# Databricks (Databricks governs who opens them).
# 2026-11-25: onboarded on archHostedAppBuilder. Every docs.lovable.dev page was read as Markdown (<path>.md, as
# listed in docs.lovable.dev/llms.txt), all 200; the URLs below are the same pages without .md. Two pages state the
# Third-party MCP clients default differently: the privacy settings page says it is always on for Free and Pro and
# on by default for Business, the MCP server page says enabled by default on Free, Pro and Business; both agree it
# is off by default on Enterprise. Not read: trust.lovable.dev and lovable.dev/security (portal pages that answered
# 200 but render client-side), so the compliance facts come from the Lovable for Enterprise page.
# Fetch log: mattpalmer.io/posts/CVE-2025-48757/ redirects to /posts/2025/05/CVE-2025-48757/.
vendor: lovable
family: Lovable
tools:
  - id: toolLovable
    name: Lovable (builder agent, built-in backend and publishing)
    surfaceClasses:
      - saasAgentPlatform
      - chatIntegration
    variants:
      - name: Lovable editor and Chats (web)
        class: saasAgentPlatform
        url: https://docs.lovable.dev/features/projects/editor
      - name: Lovable MCP server and Lovable API (build and publish from another client)
        class: saasAgentPlatform
        url: https://docs.lovable.dev/integrations/lovable-mcp-server
      - name: Lovable in Slack
        class: chatIntegration
        url: https://docs.lovable.dev/integrations/lovable-for-slack
    architecture: archHostedAppBuilder
    status: ga
    asOf: "2026-11"
    summary:
      - >-
        Lovable's agent builds a web app from the project chat, creates its database, sign-in, storage and edge
        functions in Lovable's built-in backend, stores secrets server-side and shows each change in a preview.
        Publishing puts the app at its own lovable.app address, a workspace-branded address or a custom domain,
        for anyone with the link, the workspace, groups, named people or (on Enterprise) the organization or a
        verified email domain. The front end calls the database from each visitor's browser with a publishable
        key, so the row-level security policies decide what each visitor reads.
      - >-
        Administration is the workspace's: Workspace settings › Security › Privacy & security (access, publishing
        defaults, publishing policies, security checks, connector switches, data protection), Identity (verified
        domains, SSO, SCIM, group mappings), the Security center and Action center, Connectors › Admin settings,
        audit logs and scheduled exports. Most publishing defaults need Business; approval policies, audit logs,
        sensitive data scanning and SCIM need Enterprise. A workspace with nothing set publishes new apps to
        anyone with the link and lets critical scan findings through.
    facts:
      - label: Plans
        value: >-
          Free, Pro, Business and Enterprise. Business adds workspace SSO, groups, the Security center, Insights,
          App login methods, restricted projects, training-data exclusion by default and connector controls;
          Enterprise adds SCIM, organizations, workspace policies (approval to publish), audit logs and data
          exports, sensitive data scanning and scheduled scans.
        url: https://docs.lovable.dev/introduction/lovable-for-enterprise
      - label: Inference & routing
        value: >-
          The agent calls Lovable's model providers; by default an Enterprise workspace uses only zero-data-retention
          models (Extended-retention models off), and EU inference (Enterprise) moves build and app AI requests to
          EU endpoints, with some agent tools still outside the EU.
        url: https://docs.lovable.dev/features/eu-inference
      - label: Data leaving the device
        value: >-
          Prompts, attachments, code, chat history and app data are processed and stored by Lovable. The built-in
          backend runs in the Americas, Europe or Asia Pacific region chosen when it is enabled (a workspace
          default on Business and Enterprise); visitors' browsers call the database directly with the publishable
          key.
        url: https://docs.lovable.dev/features/cloud
      - label: Retention & training
        value: >-
          From 2026-09-09 Free and Pro content may train Lovable's models unless each user opts out; Business and
          Enterprise workspace data is excluded by default under the DPA, and apps' end-user data is not used.
          Audit logs are kept 13 weeks, deleted projects 60 days, connector request records 6 months.
        url: https://docs.lovable.dev/features/business/data-opt-out
      - label: Docs index
        value: docs.lovable.dev (index at docs.lovable.dev/llms.txt); admin pages under Features › Workspace and Security.
        url: https://docs.lovable.dev/features/workspace-admin-settings
      - label: Compliance scope
        value: >-
          SOC 2 Type II, ISO 27001:2022 and AIUC-1, GDPR and a DPA, with the subprocessor list on the trust portal.
          Lovable signs no BAA and is not for protected health information.
        url: https://docs.lovable.dev/introduction/lovable-for-enterprise
    items:
      - title: Where each control lives
        body:
          - >-
            Workspace settings › Security › Privacy & security has five tabs: Access (membership, 2FA, preview links,
            code downloads), Publishing (default audience, external viewer invites, Block publishing with critical
            issues, App login methods, publishing policies), Security (auto-fix, inactive projects), Integrations
            (Lovable MCP server, MCP connectors, connector requests) and Data protection (sensitive data scanning,
            public buckets, backend approval, data region, EU inference, extended-retention models). Identity,
            Security center, Audit logs and Data exports sit beside it; per-connector availability is under
            Connectors › Admin settings, and approvals in the Action center.
        links:
          - title: Privacy & security settings
            url: https://docs.lovable.dev/features/privacy-and-security-settings
          - title: Workspace admin settings
            url: https://docs.lovable.dev/features/workspace-admin-settings
      - title: Project access and website access are two settings
        body:
          - >-
            Project access decides who sees the code, the chat history and unpublished work in the editor; website
            access decides who opens the published URL. Preview links bypass the published audience until they
            expire, and a password on a link identifies nobody. Connection-level access on a connector is not
            enforced once the app is published.
        links:
          - title: Control who can visit your published app
            url: https://docs.lovable.dev/features/website-access
          - title: Manage connectors in your workspace
            url: https://docs.lovable.dev/integrations/admin-controls
    riskNotes:
      - risk: riskSensitiveDataDisclosure
        note: >-
          Default published app access is Anyone, and preview links open the in-progress app to anyone holding the
          link whatever the published audience; switching the audience off public does not change what the
          database answers to someone holding the publishable key.
      - risk: riskInsecureModelOutput
        note: >-
          The row-level security policies are written by the agent. CVE-2025-48757 found generated apps whose
          tables answered the publishable key without per-row rules; the automatic Database security check now
          flags missing and permit-all rules, but it reports common mistakes, not whether a rule matches intent.
      - risk: riskRogueActions
        note: >-
          The main version of a project works on the live backend: data the agent or the maker changes there, and
          structure changes accepted from a draft, reach the live app at once, and a version revert restores code
          only.
      - risk: riskCrossTenantCredentialPropagation
        note: >-
          Between 2026-02-03 and 2026-04-20 a backend regression let any Lovable user with a link read the chat
          history and code of public projects, and HackerOne triage closed the reports; Lovable made public
          projects private and changed its triage.
      - risk: riskShadowAndUnknownAgents
        note: >-
          Every Lovable account gets a personal workspace unless the domain's workspace creation is blocked
          (Enterprise, enabled by Lovable support or an org admin), and an editor can move a project into one
          when Editor project transfers is on.
      - risk: riskAgenticDelegationConfusedDeputy
        note: >-
          An app + chat connector uses one shared account for every visitor of the app; only app user connectors
          make each visitor sign in to the service with their own account.
      - risk: riskPromptInjection
        note: >-
          Attachments, pasted links, remixed projects and cross-project references all become context for the
          agent; cross-project sharing is on by default and read-only.
      - risk: riskInsecureIntegratedComponent
        note: >-
          Lovable installs any public npm package asked for and says it cannot vouch for them; the dependency
          check reports known vulnerabilities after install and, with the publishing block on, counts critical
          ones.
    settings:
      - id: defaultPublishedAppAccess
        name: Default published app access
        where: Workspace settings › Security › Privacy & security › Publishing
        setVia: [adminConsole]
        area: sharing
        default: Anyone (anyone with the link)
        recommended: Workspace
        why: A new app opens only to signed-in workspace members unless its maker picks a wider audience, instead of to whoever has or finds the link.
        mitigations: [D3-APA]
        requires: Business or Enterprise
        url: https://docs.lovable.dev/features/privacy-and-security-settings#default-published-app-access
        verified: "2026-11-25"
      - id: externalViewerInvites
        name: External viewer invites
        where: Workspace settings › Security › Privacy & security › Publishing
        setVia: [adminConsole]
        area: sharing
        default: Anyone
        recommended: Specific email domains only, listing your verified domains and the partner domains you approve
        value: "Specific email domains only"
        why: An internally published app can be opened by outsiders only from domains you chose, and access requests from other addresses cannot be approved.
        mitigations: [D3-APA]
        requires: Business or Enterprise
        url: https://docs.lovable.dev/features/privacy-and-security-settings#external-viewer-invites
        verified: "2026-11-25"
      - id: externalProjectCollaborators
        name: External project collaborators
        where: Workspace settings › Security › Privacy & security › Access
        setVia: [adminConsole]
        area: identity
        default: Allow all
        recommended: None allowed; contractors join as members through your identity provider
        value: "None allowed"
        why: Only people your identity provider admits build in the workspace, so no outside account edits or publishes an app.
        mitigations: [D3-APA]
        requires: Business or Enterprise
        url: https://docs.lovable.dev/features/privacy-and-security-settings#external-project-collaborators
        verified: "2026-11-25"
      - id: ssoGroupRestriction
        name: Group restriction (provisioning groups)
        where: Workspace settings › Access › Identity › Provisioning groups
        setVia: [adminConsole, identityProvider]
        area: identity
        default: Disabled (anyone the provider authenticates joins at the Default role for new members, Editor)
        recommended: Enabled, with only the IdP groups approved to build mapped to Editor
        value: "Enabled, approved groups only"
        why: Who may build is decided by group membership at your identity provider, not by whoever signs in first.
        mitigations: [D3-APA]
        requires: Business or Enterprise, with an SSO provider
        url: https://docs.lovable.dev/features/business/sso#map-idp-groups-to-workspace-roles
        verified: "2026-11-25"
      - id: scimProvisioning
        name: SCIM provisioning
        where: Workspace settings › Access › Identity
        setVia: [identityProvider, adminConsole]
        area: identity
        default: "Off"
        recommended: "On"
        why: Removing someone at the identity provider removes them from the workspace, its groups and the apps those groups open.
        mitigations: [D3-APA]
        requires: Enterprise
        url: https://docs.lovable.dev/features/business/scim
        verified: "2026-11-25"
      - id: thirdPartyMcpClients
        name: Third-party MCP clients
        where: Workspace settings › Security › Privacy & security › Integrations › Lovable MCP server
        setVia: [adminConsole]
        area: tools
        default: Off on Enterprise; on for Business (and always on for Free and Pro)
        recommended: "Off, unless the clients your members use are approved"
        value: "Off"
        why: Projects are built and published only from Lovable itself, not from any MCP client a member connects to mcp.lovable.dev.
        mitigations: [D3-APA]
        requires: Business or Enterprise
        url: https://docs.lovable.dev/features/privacy-and-security-settings#third-party-mcp-clients
        verified: "2026-11-25"
      - id: blockPublishingCriticalIssues
        name: Block publishing with critical issues
        where: Workspace settings › Security › Privacy & security › Publishing
        setVia: [adminConsole]
        area: tools
        default: Disabled, except on new Enterprise workspaces Lovable creates
        recommended: Enabled
        why: An app with an unresolved critical finding from any check is not published from the dialog, the chat, Slack, the API or the MCP server.
        mitigations: [D3-AVE]
        url: https://docs.lovable.dev/features/privacy-and-security-settings#block-publishing-with-critical-issues
        verified: "2026-11-25"
      - id: sensitiveDataScanning
        name: Sensitive data scanning
        where: Workspace settings › Security › Privacy & security › Data protection
        setVia: [adminConsole]
        area: data
        default: Disabled
        recommended: Enabled
        why: Personal data in chat, files, the database and storage is recorded as findings, which Security insights and the publishing policy can act on.
        mitigations: [D3-AVE]
        requires: Enterprise
        url: https://docs.lovable.dev/features/sensitive-data-scanning
        verified: "2026-11-25"
      - id: restrictPublishingSensitiveData
        name: Restrict publishing with unresolved sensitive data findings
        where: Workspace settings › Security › Privacy & security › Publishing policies
        setVia: [adminConsole]
        area: sharing
        default: "Off; Block is the default mode once on"
        recommended: On, Block
        value: "On, Block"
        why: An app holding unreviewed personal data is not published or updated, and the policy applies to admins and owners too.
        mitigations: [D3-AVE]
        requires: Enterprise, with Sensitive data scanning enabled
        url: https://docs.lovable.dev/features/workspace-policies#restrict-publishing-with-unresolved-sensitive-data-findings
        verified: "2026-11-25"
      - id: scheduledSecurityScans
        name: Schedule security scans (Projects, Cadence)
        where: Workspace settings › Security › Security center › Security automation
        setVia: [adminConsole]
        area: tools
        default: No projects (off)
        recommended: Published projects, Weekly
        value: "Published projects, Weekly"
        why: The advanced checks re-read every published app's code each week, so a finding introduced after publish is found without the maker asking.
        mitigations: [D3-AVE]
        requires: Enterprise
        url: https://docs.lovable.dev/features/security-center#schedule-security-scans-enterprise-only
        verified: "2026-11-25"
      - id: autoFixSecurityIssues
        name: Auto-fix security issues
        where: Workspace settings › Security › Privacy & security › Security › Security checks
        setVia: [adminConsole]
        area: tools
        default: Selected project (off unless enabled per project)
        recommended: All published projects
        why: Critical database findings and vulnerable packages in published apps are fixed in the next build request rather than left open.
        mitigations: [D3-AVE]
        url: https://docs.lovable.dev/features/privacy-and-security-settings#auto-fix-security-issues
        verified: "2026-11-25"
      - id: rlsPolicies
        name: Row level security (RLS) policies
        where: Project › More › Database › Manage › Policies
        setVia: [adminConsole]
        area: data
        default: Written by the agent as it creates each table
        recommended: A policy on every table that limits each row to its owner or role; nothing readable without sign-in unless public by design
        value: "Every table limited to its owner or role"
        why: Visitors' browsers query the database with the publishable key, so these policies alone decide who reads which rows.
        mitigations: [cap-data-access-governance]
        url: https://docs.lovable.dev/features/database-access#row-level-security-rls-policies
        verified: "2026-11-25"
      - id: blockPublicStorageBuckets
        name: Block public storage buckets
        where: Workspace settings › Security › Privacy & security › Data protection
        setVia: [adminConsole]
        area: data
        default: Enabled
        recommended: Enabled
        why: Every new bucket in the built-in storage is private, so files are served only through rules and signed access.
        mitigations: [cap-data-access-governance]
        url: https://docs.lovable.dev/features/privacy-and-security-settings#block-public-storage-buckets
        verified: "2026-11-25"
      - id: appChatConnectorCreators
        name: Who can create connections and clients (App + chat connectors)
        where: Connectors › Admin settings › App + chat connectors
        setVia: [adminConsole]
        area: tools
        default: Admins (some Enterprise workspaces start at No one)
        recommended: No one for connectors to your systems of record; Admins for the connectors you approve
        value: "No one for systems of record"
        why: A shared connection gives every visitor of the app the connecting account's access, so systems of record are reached only through app user connectors.
        mitigations: [cap-data-access-governance, AML.M0028]
        requires: Business or Enterprise
        url: https://docs.lovable.dev/integrations/admin-controls#who-can-create-connections-and-clients
        verified: "2026-11-25"
      - id: appUserConnectorCreators
        name: Who can create connections and clients (App user connectors)
        where: Connectors › Admin settings › App user connectors
        setVia: [adminConsole]
        area: tools
        default: Admins (some Enterprise workspaces start at No one)
        recommended: Admins, with each client registered on your own OAuth app and the narrowest scopes
        value: "Admins"
        why: Each visitor signs in to the service with their own account, so the system of record decides what the app shows them.
        mitigations: [cap-data-access-governance, AML.M0028]
        requires: Business or Enterprise
        url: https://docs.lovable.dev/integrations/app-user-connectors
        verified: "2026-11-25"
      - id: buildSecrets
        name: Build secrets
        where: Workspace settings › Build & deploy › Build secrets
        setVia: [adminConsole]
        area: data
        default: None
        recommended: Registry and build tokens held here, never in a project's code or .env
        value: "All build tokens here"
        why: A private-registry token is set once by an admin and never appears in project files that every editor and the Git sync can read.
        mitigations: [D3-CH]
        requires: Enterprise
        url: https://docs.lovable.dev/features/build-secrets
        verified: "2026-11-25"
      - id: ipAllowlistsRequired
        name: IP allowlists required
        where: Workspace settings › Security › Privacy & security › Access › Public API keys
        setVia: [adminConsole]
        area: network
        default: Disabled
        recommended: Enabled
        why: A leaked workspace API key, which can publish and unpublish, is refused from any network not on its allowlist.
        mitigations: [D3-CH]
        requires: Business or Enterprise
        url: https://docs.lovable.dev/features/privacy-and-security-settings#ip-allowlists-required
        verified: "2026-11-25"
      - id: githubWorkspaceConnection
        name: GitHub workspace connection (Lovable GitHub app repository access)
        where: Workspace settings › Build & deploy › Git › GitHub › Install & Authorize
        setVia: [adminConsole]
        area: tools
        default: Chosen at install (All repositories or Only select repositories)
        recommended: Only select repositories, in an organization whose branch protection you set
        value: "Only select repositories"
        why: Sync runs on an app installation limited to named repositories, not on a person's access to every repository they can reach.
        mitigations: [D3-CH]
        requires: "Workspace owner or admin; GitHub Enterprise Cloud data residency and Enterprise Server need Enterprise"
        url: https://docs.lovable.dev/integrations/github
        verified: "2026-11-25"
      - id: rotateLovableApiKey
        name: LOVABLE_API_KEY Rotate
        where: Project › More › Settings › Secrets
        setVia: [adminConsole]
        area: data
        default: Issued with the project
        recommended: Rotated whenever the key may have been exposed, and when a connector credential leaks
        value: "Rotate on any suspected exposure"
        why: The project key that reaches the connector gateway and built-in AI is replaced; the old key can still work for up to an hour.
        mitigations: [D3-CH]
        url: https://docs.lovable.dev/integrations/security#rotation
        verified: "2026-11-25"
      - id: previewLinkSharing
        name: Preview link sharing
        where: Workspace settings › Security › Privacy & security › Access › Sharing
        setVia: [adminConsole]
        area: sharing
        default: Enabled
        recommended: Disabled
        why: Preview links bypass Default published app access and open the in-progress app to anyone holding one, a password identifying nobody.
        mitigations: [cap-staged-rollout-gate]
        requires: Disabling needs Enterprise
        url: https://docs.lovable.dev/features/privacy-and-security-settings#preview-link-sharing
        verified: "2026-11-25"
      - id: enforceSso
        name: Enforce SSO (with Session duration)
        where: Workspace settings › Access › Identity
        setVia: [adminConsole, identityProvider]
        area: identity
        default: Off; Session duration Indefinite until one is chosen
        recommended: On, removing external collaborators, with a Session duration of 24 hours and MFA at the identity provider
        value: "On, Session duration 24 hours"
        why: Makers need an SSO session through your identity provider to use the workspace, so its MFA and its leaver process apply to the builder.
        mitigations: [D3-MFA]
        requires: Business or Enterprise, with a verified domain and an SSO provider tested for six hours
        url: https://docs.lovable.dev/features/business/sso#enforce-sso
        verified: "2026-11-25"
      - id: requireTwoFactor
        name: Require two-factor authentication
        where: Workspace settings › Security › Privacy & security › Access
        setVia: [adminConsole]
        area: identity
        default: "Off"
        recommended: External collaborators (Everyone cannot be chosen while Enforce SSO is on)
        value: "External collaborators"
        why: Anyone working in the workspace without your SSO session must still pass a second factor.
        mitigations: [D3-MFA]
        requires: Enterprise
        url: https://docs.lovable.dev/features/privacy-and-security-settings#require-two-factor-authentication
        verified: "2026-11-25"
      - id: appLoginMethods
        name: App login methods
        where: Workspace settings › Security › Privacy & security › Publishing › App login methods › Configure
        setVia: [adminConsole]
        area: identity
        default: All methods allowed
        recommended: SSO and Lovable workspace identity allowed; Email, Phone, Google, Apple, Microsoft and Lovable blocked in a workspace for internal apps
        value: "SSO and Lovable workspace identity only"
        why: Apps built in the workspace cannot offer an emailed link or a personal social account as a way round your sign-in.
        mitigations: [D3-MFA]
        requires: Business or Enterprise
        url: https://docs.lovable.dev/features/privacy-and-security-settings#app-login-methods
        verified: "2026-11-25"
      - id: restrictPublishingExternally
        name: Restrict publishing externally
        where: Workspace settings › Security › Privacy & security › Publishing policies
        setVia: [adminConsole]
        area: sharing
        default: "Off; Require approval is the default mode once on, with Approval lasts 14 days"
        recommended: On, Require approval, Who publishes without approval set to Owners only, Approval lasts 1 hour
        value: "Require approval, Owners only"
        why: Making an app public, or updating a public app, waits for a workspace admin or owner who is not the requester.
        mitigations: [AML.M0029, D3-APA]
        requires: Enterprise
        url: https://docs.lovable.dev/features/workspace-policies#restrict-publishing-externally
        verified: "2026-11-25"
      - id: requireApprovalConnectors
        name: Require approval to publish apps that use connectors
        where: Workspace settings › Security › Privacy & security › Publishing policies
        setVia: [adminConsole]
        area: tools
        default: "Off"
        recommended: On, Connector types set to All connector types
        value: "On, All connector types"
        why: An app that moves data out of a system you control goes live only after an admin has seen its connectors and audience.
        mitigations: [AML.M0029, AML.M0028]
        requires: Enterprise
        url: https://docs.lovable.dev/features/workspace-policies#require-approval-to-publish-apps-that-use-connectors
        verified: "2026-11-25"
      - id: restrictBackendServices
        name: Restrict Lovable backend services
        where: Workspace settings › Security › Privacy & security › Data protection
        setVia: [adminConsole]
        area: data
        default: Enabled once Lovable sets it up for the workspace; not available until then
        recommended: Enabled
        why: The agent creates a database, user accounts and storage for a project only after an admin approves, so every project holding data is known.
        mitigations: [AML.M0029]
        requires: Enterprise, set up by your Lovable account team
        url: https://docs.lovable.dev/features/workspace-policies#restrict-lovable-backend-services
        verified: "2026-11-25"
      - id: customMcp
        name: Custom MCP (Allow members to connect their own MCP servers)
        where: Connectors › Admin settings › Chat connectors
        setVia: [adminConsole]
        area: tools
        default: Enabled
        recommended: Disabled, with only the chat connectors you approve enabled
        value: "Disabled"
        why: The builder agent reaches only MCP servers an admin enabled; disabling it removes members' custom servers.
        mitigations: [AML.M0028]
        url: https://docs.lovable.dev/integrations/admin-controls#chat-connector-controls
        verified: "2026-11-25"
      - id: localDesktopMcpServers
        name: Local desktop MCP servers
        where: Workspace settings › Security › Privacy & security › Integrations › MCP connectors
        setVia: [adminConsole]
        area: tools
        default: Enabled (disabled on Enterprise workspaces)
        recommended: Disabled
        why: The agent cannot reach localhost tools and private services on a member's machine through the desktop app.
        mitigations: [AML.M0028]
        url: https://docs.lovable.dev/features/privacy-and-security-settings#local-desktop-mcp-servers
        verified: "2026-11-25"
      - id: connectorRequests
        name: Connector requests
        where: Workspace settings › Security › Privacy & security › Integrations › Connector policies
        setVia: [adminConsole]
        area: tools
        default: Enabled when a workspace becomes Enterprise; disabled on workspaces that already were
        recommended: Enabled
        why: An editor who needs a blocked connector asks an admin in the Action center instead of pasting a key into a project.
        mitigations: [AML.M0028]
        requires: Enterprise
        url: https://docs.lovable.dev/features/workspace-policies#connector-requests
        verified: "2026-11-25"
      - id: securityInsights
