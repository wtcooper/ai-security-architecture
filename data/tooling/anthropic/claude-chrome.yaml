# Claude in Chrome — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# Fetch log 2026-09-10: trust.anthropic.com and trust.anthropic.com/resources render client-side
# and returned only a page title (certifications taken from privacy.claude.com instead);
# www.anthropic.com/trust and www.anthropic.com/security 404; chromeenterprise.google/policies
# returned navigation only (policy text taken from the Chromium policy_definitions source and
# support.google.com/chrome/a); support.google.com/chrome/a/answer/9945456 404;
# cloud.google.com/chrome-enterprise-premium/docs 301 -> docs.cloud.google.com.
vendor: anthropic
family: Claude in Chrome
tools:
  - id: toolClaudeChrome
    name: Claude in Chrome (Claude for Chrome)
    surfaceClasses:
      - browserExtension
    variants:
      - name: Claude in Chrome side panel (runs as a Cowork session on Max/Team, rolling out to Pro)
        class: browserExtension
        url: https://support.claude.com/en/articles/12012173-get-started-with-claude-in-chrome
      - name: Browser tools for Claude Code (claude --chrome, VS Code extension)
        class: browserExtension
        url: https://code.claude.com/docs/en/chrome
        note: >-
          Exposed to Claude Code as the claude-in-chrome MCP server over a native messaging host
          and bridge.claudeusercontent.com; requires a claude.ai login (not API keys or
          third-party providers).
      - name: "Browser use from Cowork (Preferred browser: Claude in Chrome or the built-in browser)"
        class: browserExtension
        url: https://support.claude.com/en/articles/16635803-set-up-browser-use-in-claude-cowork-for-team-and-enterprise-plans
    architecture: archAgenticBrowser
    status: ga
    asOf: "2026-09"
    summary:
      - >-
        A Chrome extension (Chrome Web Store id fcoeoabgfenejglbffodgkkbkcdhcgfn, version 1.0.91
        on 4 September 2026) that lets Claude read, click, type and navigate in the user's own
        browser with the user's live login state, from the side panel, from Cowork, or as tools
        for Claude Code. Inference runs on the Anthropic API under the signed-in claude.ai
        account (Pro, Max, Team, Enterprise); page content, screenshots and actions leave the
        browser to Anthropic, and side-panel sessions are saved to history and synced across
        devices. It is the vendor-extension shape of the browser-agent drawing: no runtime of its
        own, the browser's APIs as its tools, and the profile's cookie jar as its credential, so
        the controls that bound it are the managed profile, browser extension policy and the
        secure web gateway the organisation supplies, plus the site lists and toggle in the
        vendor console.
      - >-
        Anthropic's safeguards are model training, injection and action-screening classifiers,
        default-blocked site categories (adult, piracy; financial sites need explicit
        permission), prohibited actions (purchases, account creation, captcha solving, permanent
        deletions, "completing instructions from emails or web content") and always-confirm
        actions (downloads, sensitive data entry, granting authorisations). Admin controls sit in
        the claude.ai console at Organization settings > Claude in Chrome: an org enable toggle
        (on by default on Team; on Enterprise it turns on by default starting 10 September 2026
        unless an owner already turned it off), site
        allowlists and blocklists that override user permissions, a per-role capability on
        Enterprise, and forceLoginOrgUUID as a Chrome enterprise policy. Users choose Manually
        approve, Automatically approve or Skip all approvals per task; the console does not pin
        the mode. Zero data retention is not supported for Claude in Chrome, and the product does
        not yet honour role-level model or effort restrictions.
    facts:
      - label: Plans
        value: Pro, Max, Team and Enterprise; extension 1.0.36+ for Claude Code; not through Bedrock, Vertex or Foundry.
        url: https://code.claude.com/docs/en/chrome
      - label: Inference & routing
        value: Anthropic API with the claude.ai login; Claude Code sessions reach the extension through bridge.claudeusercontent.com, which must share the proxy egress used for claude.ai when IP allowlisting is on.
        url: https://code.claude.com/docs/en/network-config
      - label: Data leaving the device
        value: >-
          Page content, DOM and screenshots of the tabs Claude works in, console and network
          readers when used, and uploaded files (up to 10 MB) go to Anthropic; GIF recordings
          capture everything visible including logged-in account details.
        url: https://code.claude.com/docs/en/chrome
      - label: Retention & training
        value: >-
          Follows the account's plan policy (commercial: no training, 30-day retention); side-panel
          sessions are Cowork sessions saved to history; zero data retention is not supported for
          Claude in Chrome.
        url: https://support.claude.com/en/articles/13065128-claude-in-chrome-admin-controls
      - label: Docs index
        value: support.claude.com Claude in Chrome articles (get started, safety, permissions, admin controls) and code.claude.com/docs/en/chrome
        url: https://support.claude.com/en/articles/13065128-claude-in-chrome-admin-controls
      - label: Network requirements
        value: >-
          claude.ai, api.anthropic.com, platform.claude.com and wss://bridge.claudeusercontent.com;
          the bridge must leave through the same proxy egress as claude.ai when IP allowlisting
          is enabled, or that egress address must be on the org allowlist.
        url: https://code.claude.com/docs/en/network-config
      - label: Supported browsers
        value: >-
          The support article says only Google Chrome; the Claude Code page says Chrome and Edge,
          with detection in Brave, Arc, Vivaldi and Opera (not WSL). Plan for the wider set.
        url: https://support.claude.com/en/articles/12012173-get-started-with-claude-in-chrome
      - label: Usage & model governance
        value: >-
          Side-panel work consumes as Cowork agentic work against organisation, group and user
          spend limits (managed under Organization settings > Cowork); model access and
          effort-level restrictions by role do not yet apply to Claude in Chrome.
        url: https://support.claude.com/en/articles/14782391-claude-enterprise-consumption-guide
      - label: Extension permissions
        value: >-
          Requests sidePanel, storage, scripting, debugger, tabGroups, tabs, alarms, notifications,
          system.display, webNavigation, declarativeNetRequestWithHostAccess, offscreen,
          nativeMessaging, downloads and unlimitedStorage; the Web Store listing declares handling
          of personal communications, web history, user activity and website content.
        url: https://support.claude.com/en/articles/12012173-get-started-with-claude-in-chrome
    riskNotes:
      - risk: riskPromptInjection
        note: >-
          Web content is the attack surface; ShadowPrompt (March 2026, fixed 1.0.41) let any site
          inject prompts through a trusted *.claude.ai subdomain, and Anthropic's own safety
          article says the risk of a successful attack "is not zero". Allowlists and separate
          browser profiles are the
          practical containment.
      - risk: riskAgenticDelegationConfusedDeputy
        note: >-
          Claude acts inside every session the user is logged into (Gmail, GitHub, Drive, banking
          if permitted) with no separate identity; ClaudeBleed (May 2026) showed another
          zero-permission extension could issue commands to it.
      - risk: riskInsecureIntegratedComponent
        note: >-
          The extension requests debugger, scripting, nativeMessaging and downloads permissions
          and updates automatically from the Chrome Web Store (1.0.91 on 4 September 2026); the
          native messaging host for Claude Code is started by the browser, outside Claude Code's
          corporate launcher.
      - risk: riskRogueActions
        note: >-
          "Skip all approvals" disables safety checks entirely; "Automatically approve" is the
          Cowork default and nothing in the admin console pins the mode. Publishing, sending
          messages and payments still require confirmation in the approving modes.
      - risk: riskSensitiveDataDisclosure
        note: >-
          Screenshots and page text of authenticated apps leave the browser; Anthropic advises
          against use for financial, legal, medical or regulated data, and zero data retention is
          not available for this product.
    controls:
      - capability: capabilityHitlControls
        coverage: native
        mechanism: >-
          Manually approve (plan shown before acting), Automatically approve (pauses on flagged
          risks), Skip all approvals; always-confirm actions regardless of mode; Claude Code
          prompts "Claude in Chrome wants to" per site
        steps:
          - title: Set the approval mode
            body:
              - Choose Manually approve to review each action before it runs; Automatically approve
                still requires approval for downloads, sensitive data entry and granting
                authorisations, and Skip all approvals removes every pause.
            url: https://support.claude.com/en/articles/12902446-claude-in-chrome-permissions-guide
          - title: Keep state-changing browser tools behind a prompt in Claude Code
            body:
              - In plan mode read-only calls (read_page, get_page_text, find, screenshot) run without
                a prompt and clicks, typing, navigation and GIF recording prompt for approval.
            url: https://code.claude.com/docs/en/chrome
        note: The approval mode is a per-user choice; the admin console has no setting that forces Manually approve.
        verified: "2026-09-10"
      - capability: capabilityToolPermissionScoping
        coverage: native
        mechanism: >-
          Site-level scoping: org allowlist and blocklist at Organization settings > Claude in
          Chrome override user grants; per-site "Allow this action" / "Always allow actions on
          this site"; default-blocked categories and financial-site gating; Chrome
          ExtensionSettings runtime_blocked_hosts / runtime_allowed_hosts at the browser policy
          tier
        steps:
          - title: Scope by site in the vendor console
            body:
              - Add approved sites to the allowlist so Claude can only browse those, and forbidden
                sites to the blocklist, which applies regardless of user settings; the vendor
                recommends a restrictive allowlist during rollout.
            url: https://support.claude.com/en/articles/13065128-claude-in-chrome-admin-controls
          - title: Let users grant the minimum per site
            body:
              - Advise "Allow this action" over "Always allow actions on this site"; users review
                and revoke always-allow grants under Extension settings > Permissions.
            url: https://support.claude.com/en/articles/12902446-claude-in-chrome-permissions-guide
          - title: Enforce host scope from browser policy
            body:
              - In ExtensionSettings for id fcoeoabgfenejglbffodgkkbkcdhcgfn set runtime_blocked_hosts
                for origins the extension must never touch; the Chromium policy text warns that from
                Chrome 154 runtime_blocked_hosts on an extension with the debugger permission
                disables chrome.debugger.attach() entirely, so test before rollout.
            url: https://chromium.googlesource.com/chromium/src/+/HEAD/components/policy/resources/templates/policy_definitions/Extensions/ExtensionSettings.yaml
        verified: "2026-09-10"
      - capability: capabilityCredentialIsolation
        coverage: external
        mechanism: >-
          The extension uses the profile's own sessions; the isolation is a dedicated browser
          profile with few signed-in origins and no saved passwords, which the vendor recommends
          but does not provision. 1Password for Claude access control is off by default
          (macOS only).
        steps:
          - title: Run the agent in a separate profile
            body:
              - Follow the vendor's advice to use a separate browser profile without access to
                sensitive accounts, and keep work accounts holding sensitive data out of it.
            url: https://support.claude.com/en/articles/12902428-use-claude-in-chrome-safely
          - title: Leave the password-manager bridge off
            body:
              - Keep "1Password for Claude access control" at its default off unless a task needs it;
                it is the only vendor path that hands stored credentials to the agent.
            url: https://support.claude.com/en/articles/13065128-claude-in-chrome-admin-controls
        note: >-
          There is no agent identity or on-behalf-of exchange; downstream applications see the
          user. Provision the dedicated profile through Chrome enterprise policy so it is managed
          rather than a user habit.
        verified: "2026-09-10"
      - capability: capabilityPromptInjectionDefense
        coverage: partial
        mechanism: Anthropic-side content injection classifier and action screening classifier; no admin-tunable detector or page-content stripping
        steps:
          - title: Keep the approving modes on
            body:
              - Advise users to stay in Manually approve or Automatically approve; Skip all approvals
                turns off the safety checks that screen actions.
            url: https://support.claude.com/en/articles/12902446-claude-in-chrome-permissions-guide
          - title: Reduce exposure with allowlists and profiles
            body:
              - Start with a restrictive org allowlist and recommend a separate browser profile for
                sensitive accounts, per the safety guidance.
            url: https://support.claude.com/en/articles/12902428-use-claude-in-chrome-safely
        verified: "2026-09-10"
      - capability: capabilityMemoryProtection
        coverage: partial
        mechanism: >-
          Side-panel sessions are Cowork sessions saved to account history and synced to web,
          desktop and mobile; per-site permission history in Extension settings; no browser
          memories index and no admin memory controls
        steps:
          - title: Review saved permissions and sessions
            body:
              - Users open Extension settings > Permissions to revoke always-allow sites; session
                history follows the organisation's conversation retention setting.
            url: https://support.claude.com/en/articles/12902446-claude-in-chrome-permissions-guide
        verified: "2026-09-10"
      - capability: capabilityBrowserDetectionResponse
        coverage: external
        mechanism: >-
          Nothing in-browser from the vendor; Chrome Enterprise Premium DLP rules (File uploaded,
          Content pasted, URL visited) and Chrome Enterprise reporting connectors with extension
          telemetry to a SIEM
        steps:
          - title: Turn on browser event reporting
            body:
              - Under Devices > Chrome > Connectors configure a reporting connector (Google Security
                Operations, Splunk, CrowdStrike, Palo Alto or Pub/Sub); extension telemetry needs
                the Chrome Enterprise Premium upgrade.
            url: https://support.google.com/chrome/a/answer/11375053
          - title: Write DLP rules for the agent's profile
            body:
              - Under Security > Access and data control > Data protection create rules on File
                uploaded, Content pasted and URL visited with Block, Allow with warning or Audit
                only, scoped to the organisational unit that holds the agent profile.
            url: https://support.google.com/chrome/a/answer/17128928
        note: The vendor exposes no telemetry of what the agent read or clicked beyond the session transcript.
        verified: "2026-09-10"
      - capability: capabilityEdr
        coverage: external
        mechanism: Browser and endpoint sensors; the native messaging host is started by the browser, outside Claude Code's corporate launcher
        note: >-
          The corporate-launcher page states the Chrome native-messaging host is not covered by
          processWrapper; EDR must watch it directly.
        steps:
          - title: Cover the native messaging host
            body:
              - Monitor com.anthropic.claude_code_browser_extension host registrations under the
                browser's NativeMessagingHosts directory (or HKCU registry key on Windows) and the
                process it starts with endpoint tooling.
            url: https://code.claude.com/docs/en/chrome
        verified: "2026-09-10"
      - capability: capabilityAgentRegistry
        coverage: external
        mechanism: >-
          Chrome extension policy: ExtensionInstallBlocklist "*" with ExtensionInstallAllowlist,
          or ExtensionSettings with installation_mode per id and blocked_permissions; the vendor
          keeps no registry of who runs the extension
        steps:
          - title: Admit the extension by id
            body:
              - Block all extensions by default and list fcoeoabgfenejglbffodgkkbkcdhcgfn in
                ExtensionInstallAllowlist, or set its installation_mode in ExtensionSettings; the
                ExtensionSettings policy overrides the legacy allow and block lists.
            url: https://support.google.com/chrome/a/answer/7532015
          - title: Block by permission where the id is not enough
            body:
              - Use blocked_permissions in ExtensionSettings to refuse any other extension that
                requests debugger, downloads or nativeMessaging.
            url: https://chromium.googlesource.com/chromium/src/+/HEAD/components/policy/resources/templates/policy_definitions/Extensions/ExtensionSettings.yaml
        verified: "2026-09-10"
      - capability: capabilityShadowAiDiscovery
        coverage: external
        mechanism: >-
          Chrome Enterprise Core Apps & extensions usage report; Enterprise tenant restrictions
          (anthropic-allowed-org-ids header) block personal claude.ai accounts at the proxy
        steps:
          - title: Inventory installs
            body:
              - Open Devices > Chrome > Reports > Apps & extensions usage, search by App ID or by
                Permission (debugger, nativeMessaging), and export the CSV.
            url: https://support.google.com/chrome/a/answer/9902456
          - title: Refuse personal accounts at the edge
            body:
              - Inject anthropic-allowed-org-ids with your organisation UUIDs so a sign-in to an
                unlisted organisation gets a 403; pair with forceLoginOrgUUID on the extension.
            url: https://support.claude.com/en/articles/13198485-enforce-network-level-access-control-with-tenant-restrictions
        note: The tenant-restrictions page lists web, desktop and API access and does not name the extension; it signs in through claude.ai, so test the header against it.
        verified: "2026-09-10"
      - capability: capabilitySse
        coverage: external
        mechanism: >-
          The organisation's secure web gateway on the managed profile's sessions; the extension
          uses the browser's network stack, so it trusts the enterprise root and its traffic to
          claude.ai, api.anthropic.com and the bridge can be inspected and allowlisted
        steps:
          - title: Steer the vendor endpoints through one egress
            body:
              - Allow claude.ai, api.anthropic.com, platform.claude.com and
                wss://bridge.claudeusercontent.com, and route the bridge through the same proxy
                egress as claude.ai (same Zscaler app segment or Netskope steering policy) when IP
                allowlisting is on.
            url: https://code.claude.com/docs/en/network-config
          - title: Enforce tenancy at the edge
            body:
              - Add anthropic-allowed-org-ids at the proxy so only your organisations' sessions pass.
            url: https://support.claude.com/en/articles/13198485-enforce-network-level-access-control-with-tenant-restrictions
        verified: "2026-09-10"
      - capability: capabilityAuditLogging
        coverage: partial
        mechanism: >-
          Compliance API session endpoints (Enterprise) return Cowork transcripts including tool
          calls; the audit-log export (Organization settings > Data and Privacy > Export logs,
          180 days) covers authentication and membership events; Claude Code tool events via
          OpenTelemetry; the gateway's session record is the organisation's own
        steps:
          - title: Retrieve session transcripts
            body:
              - Enterprise organisations pull Cowork session transcripts through the Compliance API
                local and remote session endpoints (product_surface cowork and cowork_remote).
            url: https://platform.claude.com/docs/en/manage-claude/compliance-sessions
          - title: Export the audit log
            body:
              - Owners export 180 days of organisation events from Organization settings >
                Data and Privacy; it carries identifiers, not content.
            url: https://support.claude.com/en/articles/9970975-access-audit-logs
        note: >-
          Side-panel sessions are Cowork sessions, but the Compliance API page does not name
          Claude in Chrome among its product surfaces; confirm they appear before relying on it.
          Browser actions are visible only as tool calls in a transcript.
        verified: "2026-09-10"
      - capability: capabilityAiDlp
        coverage: partial
        mechanism: >-
          Always-confirm on sensitive data entry and downloads; org blocklist for data-bearing
          sites; Read deny rules govern uploads from Claude Code; Chrome Enterprise Premium DLP
          rules on upload and paste as the external layer
        steps:
          - title: Block uploads of protected files from Claude Code
            body:
              - Permission rules that deny Read on a file also block uploading it through the
                extension; uploads are capped at 10 MB.
            url: https://code.claude.com/docs/en/chrome
          - title: Inspect what the agent uploads and pastes
            body:
              - Chrome Enterprise Premium DLP rules on File uploaded and Content pasted block or
                audit content moving through the agent's profile.
            url: https://support.google.com/chrome/a/answer/17128928
        verified: "2026-09-10"
      - capability: capabilityEgressControl
        coverage: partial
        mechanism: >-
          Org allowlist restricts browsing destinations; Chrome runtime_blocked_hosts and the
          secure web gateway's URL policy on the agent profile enforce it outside the extension
        steps:
          - title: Use the allowlist as the egress policy
            body:
              - Approve only the sites Claude may open; the blocklist applies regardless of user
                settings.
            url: https://support.claude.com/en/articles/13065128-claude-in-chrome-admin-controls
          - title: Back it with browser policy
            body:
              - Mirror the deny set as runtime_blocked_hosts on the extension id so the block holds
                even if the console setting changes.
            url: https://support.google.com/chrome/a/answer/7532015
        verified: "2026-09-10"
      - capability: capabilityMcpToolSecurity
        coverage: partial
        mechanism: >-
          Extension admission is Chrome policy (installation_mode, minimum_version_required,
          update_url) against the Web Store listing; in Claude Code the extension is the built-in
          claude-in-chrome MCP server governed by allowedMcpServers / deniedMcpServers
        steps:
          - title: Pin the extension version
            body:
              - Force-install fcoeoabgfenejglbffodgkkbkcdhcgfn through ExtensionSettings with
                minimum_version_required at or above 1.0.70 (the ClaudeBleed fix) and treat each
                Web Store update as a change to review.
            url: https://chromium.googlesource.com/chromium/src/+/HEAD/components/policy/resources/templates/policy_definitions/Extensions/ExtensionSettings.yaml
          - title: Allow or block the server organisation-wide
            body:
              - List claude-in-chrome in deniedMcpServers to block it (Claude Code then never
                prompts to install the extension); built-in servers skip the allowlist check.
            url: https://code.claude.com/docs/en/managed-mcp
        verified: "2026-09-10"
      - capability: capabilityIga
        coverage: native
        mechanism: >-
          Org enable toggle "Enable for your team" at Organization settings > Claude in Chrome,
          per-role capability on Enterprise custom roles (separate from Cowork access),
          forceLoginOrgUUID deployable as a Chrome enterprise policy
        steps:
          - title: Decide who gets the extension
            body:
              - At Organization settings > Claude in Chrome set "Enable for your team" (Team default
                on; Enterprise turns on by default starting 10 September 2026 unless already
                disabled) and grant the Claude in Chrome capability per custom role on Enterprise.
            url: https://support.claude.com/en/articles/13065128-claude-in-chrome-admin-controls
          - title: Pin the extension to your organisation
            body:
              - Deploy forceLoginOrgUUID through Chrome enterprise policy so the extension can only
                be used with your Claude organisation.
            url: https://support.claude.com/en/articles/13065128-claude-in-chrome-admin-controls
        verified: "2026-09-10"
      - capability: capabilityAgentRuntimeEnforcement
        coverage: partial
        mechanism: >-
          Org allowlist / blocklist enforced regardless of user permission; built-in prohibited
          actions (including "completing instructions from emails or web content") and
          always-confirm actions; in Claude Code, permission rules and hooks on the
          claude-in-chrome MCP tools; no admin-authored action policy
        steps:
          - title: Enforce site policy centrally
            body:
              - Add approved sites to the allowlist and forbidden sites to the blocklist under
                Organization settings > Claude in Chrome; the blocklist applies regardless of user
                settings and beyond the default blocked categories.
            url: https://support.claude.com/en/articles/13065128-claude-in-chrome-admin-controls
          - title: Gate browser tools in Claude Code
            body:
              - Deny or ask on mcp__claude-in-chrome__* tools in managed permissions, or block the
                server with deniedMcpServers so the install prompt never appears.
            url: https://code.claude.com/docs/en/chrome
        verified: "2026-09-10"
      - capability: capabilityAiTprm
        coverage: external
        mechanism: >-
          Anthropic Trust Portal (trust.anthropic.com) for SOC 2 Type I & II, ISO 27001:2022,
          ISO/IEC 42001:2023 and HIPAA-ready documentation; product terms for this surface are
          the retention policy, no ZDR, and the Web Store privacy disclosure
        steps:
          - title: Collect the vendor evidence
            body:
              - Request the SOC 2 and ISO reports through the Trust Portal linked from the
                certifications article, and file the Claude in Chrome facts (no ZDR, Cowork
                retention, extension permissions) against the assessment.
            url: https://privacy.claude.com/en/articles/10015870-what-certifications-has-anthropic-obtained
        note: >-
          trust.anthropic.com renders client-side and returned no content to automated fetch on
          2026-09-10; the certifications list above comes from privacy.claude.com. Reassess on
          each extension release, since the store update channel is automatic.
        verified: "2026-09-10"
      - capability: capabilityKillSwitch
        coverage: native
        mechanism: >-
          Org toggle off, role capability removal, Chrome ExtensionInstallBlocklist (disables an
          installed extension with no user re-enable) or ExtensionSettings installation_mode
          "removed", user revocation of site permissions
        steps:
          - title: Turn it off for the organisation
            body:
              - Disable "Enable for your team" at Organization settings > Claude in Chrome or remove
                the capability from roles.
            url: https://support.claude.com/en/articles/13065128-claude-in-chrome-admin-controls
          - title: Remove it from every browser
            body:
              - Add fcoeoabgfenejglbffodgkkbkcdhcgfn to ExtensionInstallBlocklist; already-installed
                copies are disabled and users cannot re-enable them.
            url: https://chromium.googlesource.com/chromium/src/+/HEAD/components/policy/resources/templates/policy_definitions/Extensions/ExtensionInstallBlocklist.yaml
        verified: "2026-09-10"
    advisories:
      - title: "ShadowPrompt — zero-click prompt injection via a trusted *.claude.ai subdomain and third-party CAPTCHA XSS (fixed extension 1.0.41)"
        url: https://cloudsecurityalliance.org/blog/2026/09/04/top-6-claude-in-chrome-security-risks-to-model-before-you-roll-it-out
        date: "2026-03"
      - title: "ClaudeBleed — zero-permission Chrome extensions could issue commands to Claude in Chrome; partial fix in 1.0.70 bypassed"
        url: https://cloudsecurityalliance.org/blog/2026/09/04/top-6-claude-in-chrome-security-risks-to-model-before-you-roll-it-out
        date: "2026-05"
