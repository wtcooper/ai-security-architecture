id: archTenantAssistant
surface: surfaceSaas
rank: 2
title: Tenant-wide assistant over your corpus
abbrev: Tenant assistant

summary:
  - >
    A vendor-operated assistant granted standing access to the organisation's whole document
    estate, answering any employee's question by retrieving across it. You configure a tenant; you
    do not operate an architecture — the retriever, the index and the model are all behind a
    boundary you cannot inspect.

description:
  - >
    Structurally this is retrieval-augmented generation with one difference that changes every
    control decision: the retriever, the index, the model and the orchestration are all inside the
    vendor's boundary. What you own is the identity that authenticates users, the grant that
    decides what the vendor may index, the permissions already sitting on the source content, the
    network path, and the contract. The drawing shows exactly that — the vendor block carries only
    its published surfaces, and every control sits on an edge you operate.
  - >
    The security question is not "is the vendor's RAG pipeline sound". It is a permissions
    question you can answer without the vendor's cooperation: given that the assistant inherits a
    user's entitlements and can search the entire indexed corpus in one turn, what does each user
    turn out to be entitled to? Over-permissioned content that was safe by obscurity stops being
    safe the moment retrieval is exhaustive and instant. That is the dominant failure mode of the
    archetype, and it is a pre-existing condition the assistant surfaces rather than a flaw it
    introduces — which is why content permissions fidelity is the first capability on this page.
  - >
    The second exposure is that indexed content is attacker-writable. Any document a colleague, a
    customer or an external collaborator can place into an indexed location is model input for
    every employee who later asks a related question. The injection point and the impact point are
    different users on different days, and the vendor's guardrails are the only thing between
    retrieval-borne instruction and whatever the assistant can do with it.

distinguishedBy:
  - >
    Against an embedded retrieval assistant you build: there, the index, the retrieval-time ACL
    check and the guardrails are yours to design. Here every one of them is the vendor's, and your
    architecture is the grant model and the edges. Almost no capability transfers between the two.
  - >
    Against an enterprise AI chat subscription: that archetype connects a general assistant to a
    handful of sources each user authorises. This one is granted the corpus up front, tenant-wide,
    by an administrator — the difference between a per-user data path and an organisational one.

exemplars:
  - name: Tenant-wide productivity assistants
    note: >
      Vendor assistants indexing the organisation's mail, files and chat and answering across all
      of it. Sold as a per-seat add-on to a suite the organisation already runs, which is why the
      grant decision often precedes any security review.
    asOf: "2026-08"
  - name: Enterprise search assistants
    note: >
      Standalone vendors that connect to many systems of record and build a unified index. Same
      shape, more connectors, and permissions mirroring is their central engineering claim — worth
      testing rather than accepting.
    asOf: "2026-08"

blocks:
  - id: employee
    kind: actor
    title: Employee
    icon: person
    col: 0
    row: 1
    note: >
      The person asking. The assistant answers with this user's entitlements, whatever those turn
      out to be — which is the whole game.

  - id: externalAuthors
    kind: actor
    title: External authors
    icon: people
    col: 0
    row: 2
    note: >
      Anyone who can put a document into an indexed location — inbound mail, a shared folder, a
      guest in a workspace. Their text becomes context for employees who never opened it.

  - id: workspace
    kind: service
    title: Managed workspace
    col: 1
    row: 1
    cosaiComponent: componentAgentUserQuery
    note: >
      The browser or client the employee types into — the last point where the prompt and the
      answer are visible to anything you operate. On this surface, in-browser inspection
      substitutes for application logging you will never get.
    items:
      - id: surface
        label: Assistant surface
        icon: chat
        note: The vendor's panel rendered in your browser. The prompt and response are visible here and nowhere else you control.
      - id: browserDlp
        label: Browser & DLP controls
        icon: eye
        note: Device-resident inspection of what leaves. There is no vendor host to instrument, so this is the substitute.

  - id: edge
    kind: service
    title: Identity & secure edge
    col: 2
    row: 1
    note: >
      The identity decision and the network path — the two enforcement points that still bind on a
      surface where nothing behind the API is yours.
    items:
      - id: idp
        label: Identity provider
        icon: key
        note: Authenticates the user to the vendor and carries the entitlements the assistant will inherit. Conditional access here still binds.
      - id: sse
        label: Secure service edge
        icon: shield
        note: Inline inspection of traffic to the vendor, and the control deciding which vendor AI services are reachable at all.

  - id: vendor
    kind: provider
    title: Vendor assistant
    cosaiComponent: componentApplication
    col: 3
    row: 1
    note: >
      Retrieval, ranking, inference and orchestration, none of it observable — only the published
      surfaces are drawn. Whether index-time permissions stay in step with the source as content
      is reshared is the provider's central claim, and the central question for assurance.
    items:
      - id: tenantApi
        label: Tenant API
        icon: globe
        note: The interface users reach. The token it receives is the access-control decision — everything retrieved is decided by the entitlements it carries.
      - id: connectors
        label: Indexing connectors
        icon: plug
        note: The crawl and sync path the vendor runs under your indexing grant. Schedule, retention and permission mirroring are claims, not observations.
      - id: adminSurface
        label: Tenant configuration
        icon: gear
        note: Where your policy lands — licensing, source scope, indexing exclusions. You author it; the provider enforces it; neither is verifiable by the other.

  - id: estate
    kind: service
    title: Systems of record
    col: 2
    row: 2
    cosaiComponent: componentDataSources
    note: >
      Mail, files, chat, tickets, wikis — the authoritative permissions live here, and every
      over-share predates the assistant. The permissions on this content are the real access
      control; the assistant reflects them, and reflects their mistakes.
    items:
      - id: repositories
        label: Mail, files & wikis
        icon: folder
        note: The corpus the vendor indexes. Designed on the assumption that reaching content required knowing it existed.
      - id: permissions
        label: Source permissions
        icon: shield
        note: The control the assistant inherits. Exhaustive retrieval turns every stale grant into a findable answer.
      - id: grant
        label: Indexing grant
        icon: key
        note: One tenant-level authorisation deciding which repositories the vendor may crawl. A single administrative decision sets the assistant's entire reachable set.

  - id: governance
    kind: governance
    title: Tenant governance
    col: 4
    row: 0
    rowSpan: 3
    note: >
      What remains enforceable on a vendor-operated service: who may use it, what it may reach,
      what is visible afterwards, and what the contract obliges the provider to do.
    items:
      - id: policy
        label: Tenant policy
        icon: gear
        note: Who is licensed, which sources are in scope, whether the assistant may act, what is excluded from indexing.
      - id: audit
        label: Exported audit
        icon: eye
        note: Whatever the vendor exports, at whatever fidelity and latency it chooses. Plan detection against traffic you can actually see.
      - id: assurance
        label: Vendor assurance
        icon: scale
        note: Due diligence, contract terms and whatever red-team evidence the vendor shares. On this surface it substitutes for testing you cannot perform.
      - id: discovery
        label: Shadow tenant discovery
        icon: search
        note: Finding the tenants nobody declared, from traffic and expense data rather than anything the vendor supplies.

edges:
  - from: employee
    to: workspace
    path: primary
    bidir: true
    label: question / answer
    note: >
      The question goes in with this user's identity, and the grounded answer comes back rendered
      in a browser. Citations are the vendor's claim about its own retrieval.
  - from: workspace
    to: edge
    path: primary
    bidir: true
    note: >
      The prompt is inspected here or nowhere. Once it reaches the vendor, only the vendor can see
      it, and only at the fidelity its export offers.
  - from: edge
    to: vendor
    path: primary
    bidir: true
    label: user query / grounded answer
    note: >
      The vendor answers as this user. Everything the assistant will retrieve is decided by the
      entitlements the identity assertion carries, so the token is the access-control decision.
  - from: externalAuthors
    to: estate
    path: external
    label: inbound content
    note: >
      Whatever already governs writes to the repository is the only gate. Nothing AI-specific
      inspects a document on its way into an indexed location.
  - from: estate
    to: vendor
    path: primary
    label: crawl & sync
    note: >
      The vendor's connectors read whole repositories under the standing indexing grant. Whether
      index-time permissions track the source as content is reshared is not observable from
      outside.
  - from: governance
    to: vendor
    path: governance
    bidir: true
    label: configure / export
    note: >
      Tenant policy goes down and audit events come back — both on the vendor's terms. You author
      the policy, the provider enforces it, and assurance exists to compensate for the fact that
      neither can verify the other.

pins:
  risks:
    - risk: riskExcessiveDataHandling
      at: estate
      note: >
        Produced jointly by the tenant-wide grant, pre-existing permissions and retrieval that is
        exhaustive where human search was not. No single decision is wrong; the combination is.
    - risk: riskPromptInjection
      at: externalAuthors->estate
      note: >
        Any document an outsider can land in an indexed location is model input for every employee
        who later asks a related question.
    - risk: riskRetrievalVectorStorePoisoning
      at: estate->vendor
      note: The crawl carries poisoned content into an index you can neither inspect nor purge directly.
    - risk: riskSensitiveDataDisclosure
      at: edge->vendor
      note: >
        Prompts and grounded answers cross to the vendor here. Where inspection is absent they
        leave unobserved, and the vendor's export is the only remaining record.
    - risk: riskStaleAgentIdentityBinding
      at: edge
      note: The assistant inherits whatever entitlements the identity assertion carries — including ones that should have been revoked.
    - risk: riskInsecureIntegratedComponent
      at: vendor
      note: The entire vendor is one integrated component you did not build and cannot test — which is what makes assurance a control here rather than a formality.
    - risk: riskExcessiveDataHandlingDuringInference
      at: vendor
      note: One turn can retrieve across the whole indexed corpus, and how much is pulled into context per answer is invisible from outside.
    - risk: riskInsecureModelOutput
      at: workspace
      note: >
        The answer is unauthenticated content rendered into a browser. A cited document can be
        checked; what else was retrieved cannot be checked at all.
    - risk: riskShadowAndUnknownAgents
      at: governance
      note: On a surface reached by signing up, undeclared tenants precede every other control problem.

  capabilities:
    - capability: capabilityDataAccessGovernance
      at: estate
      note: >
        Fix the source permissions before the grant is made — the assistant makes every
        over-share findable, so entitlement hygiene is THE control on this surface.
    - capability: capabilityDspm
      at: estate
      note: Find over-shared and sensitive content in the repositories the grant covers, before exhaustive retrieval finds it for you.
    - capability: capabilityIga
      at: edge
      note: Govern the entitlements the assistant inherits — joiner/leaver hygiene and conditional access on the identity path the vendor trusts.
    - capability: capabilityAiGovernancePlatform
      at: governance->vendor
      note: Own the tenant configuration as policy — licensing, source scope, indexing exclusions, whether the assistant may act — and re-review it as the product ships features.
    - capability: capabilitySse
      at: edge
      note: Inline inspection of the vendor path, and enforcement of which AI services are reachable at all.
    - capability: capabilityAiDlp
      at: workspace
      note: Inspect prompts and responses at the browser — the one point you operate where both are still visible.
    - capability: capabilityBrowserDetectionResponse
      at: workspace
      note: In-browser telemetry and control for a service with no vendor host to instrument.
    - capability: capabilityPromptInjectionDefense
      at: externalAuthors->estate
      note: Constrain and monitor which locations external parties can write into scope, and treat indexed inbound content as untrusted.
    - capability: capabilityAiTprm
      at: vendor
      note: Assess the vendor's permission-mirroring, tenancy and retention claims as a supply-chain relationship — they cannot be tested directly.
    - capability: capabilityVendorAssurance
      at: vendor
      note: Contractual commitments on retention, training use and breach notice — the only control that reaches past the published interfaces.
    - capability: capabilityAuditLogging
      at: governance
      note: Combine the vendor's exported audit with first-party edge and browser telemetry; plan investigations around what you can actually see.
    - capability: capabilityShadowAiDiscovery
      at: governance
      note: Discover undeclared tenants from network and expense data — the inventory problem precedes every other control.

scenarios:
  - title: An employee asks a question
    steps:
      - follow: employee->workspace
        note: The question is typed into the vendor's surface — the last point first-party controls can see it.
      - follow: workspace->edge
        note: The prompt is inspected on the way out, or never.
      - follow: edge->vendor
        note: The identity assertion decides everything — the vendor retrieves as this user, across the whole indexed corpus, in one turn.
      - follow: vendor->edge
        note: The grounded answer returns with citations that are the vendor's own claim about what it retrieved.
      - follow: workspace->employee
        note: The answer renders. What else was pulled into context is not knowable from outside.
  - title: Oversharing surfaces through the assistant
    steps:
      - follow: estate->vendor
        note: The crawl indexes everything the grant covers, including the folder shared to "everyone" in 2019.
      - follow: employee->workspace
        note: An innocent question lands near the over-shared content.
      - follow: edge->vendor
        note: The user is technically entitled to the document, so retrieval returns it.
      - follow: vendor->edge
        note: Content that was safe by obscurity is now a cited answer. The permissions were the bug; the assistant is the reporter.
  - title: A poisoned document steers an answer
    steps:
      - follow: externalAuthors->estate
        note: An outsider lands a document with embedded instructions in an indexed location — an email, a shared folder, a guest workspace.
      - follow: estate->vendor
        note: The crawl indexes it like anything else.
      - follow: vendor->edge
        note: A later employee's related question retrieves it, and the injected text shapes the answer — or the action, where the assistant can act.

