    setVia: [apiCli]
    area: data
    default: "Root volume encrypted with an AWS owned key"
    recommended: "Your customer managed key on the secondary volume and, with RootVolume set to True, on the root volume of every instance group that runs training."
    value: "Your customer managed key on root and secondary volumes"
    why: "Datasets and checkpoints staged on cluster nodes are encrypted under a key you control; by default the root volume uses an AWS owned key."
