# Microsoft 365 Copilot — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# Exclusions: Microsoft Copilot Studio (the low-code agent builder) is a separate architecture and is not
# onboarded; the agents it publishes into Copilot are governed here only through the Agent Registry.
# Consumer Microsoft Copilot (personal Microsoft account) is the shadow path, not the product. Security
# Copilot, Copilot in Fabric / Power Platform / Dynamics 365, Microsoft Foundry agents and Agent 365 as a
# standalone control plane are other products. Restricted SharePoint Search is retiring (no new enablement
# from 2026-07-31) and is recorded only as a note. Copilot Cowork is kept as a variant (same admin plane,
# identity and audit); revisit if it gains its own policy surface.
# 2026-09-25: onboarded toolM365Copilot against the MITRE capability rules; learn.microsoft.com/en-us/copilot/microsoft-365/* redirects to /en-us/microsoft-365/copilot/* (microsoft-365-copilot-ai-security -> security-microsoft-365-copilot, copilot-control-system/overview -> copilot-controls/overview); microsoftsearch/connectors-overview -> microsoft-365/copilot/connectors/overview; microsoftsearch/graph-connector-agent -> microsoft-365/copilot/connectors/connector-agent; sharepoint/get-ready-copilot-sharepoint-advanced-management -> microsoft-365/copilot/; entra/agent-id/identity-platform/what-is-agent-id -> entra/agent-id/what-are-agent-identities; purview/get-started-with-service-trust-portal -> compliance/assurance/stp-get-started; entra conditional-access/policy-all-users-copilot-ai-security now lands on plan-conditional-access (Copilot page retired, not cited); 404: entra/identity/enterprise-apps/tenant-restrictions-v2, copilot/microsoft-365/microsoft-365-copilot-service-description, conditional-access/policy-all-users-mfa; servicetrust.microsoft.com and msrc.microsoft.com/update-guide render client-side (CVE titles and dates read from api.msrc.microsoft.com).
vendor: microsoft
family: Microsoft 365 Copilot
tools:
  - id: toolM365Copilot
    name: Microsoft 365 Copilot (Microsoft Copilot app, Copilot Chat, in-app Copilot, agents and connectors)
    surfaceClasses:
      - saasChat
      - officeAddin
      - cloudAgent
    variants:
      - name: Microsoft Copilot app and Copilot Chat (web, desktop, mobile; copilot.cloud.microsoft)
        class: saasChat
        url: https://learn.microsoft.com/en-us/copilot/manage
        note: >-
          Copilot Chat (Basic) is included for Entra users with a qualifying Microsoft 365 subscription and is
          web-grounded; Graph-grounded chat needs the Microsoft 365 Copilot add-on licence.
      - name: Copilot in Word, Excel, PowerPoint, Outlook and Teams
        class: officeAddin
        url: https://learn.microsoft.com/en-us/microsoft-365/copilot/microsoft-365-copilot-overview
        note: >-
          Built into the apps, not an add-in; the Multiple account access to Copilot for work documents
          policy decides whether a personal Copilot subscription can act on work files.
      - name: Researcher and Analyst
        class: saasChat
        url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/manage-copilot-agents-integrated-apps?view=o365-worldwide
        note: >-
          Part of the core Copilot Chat experience and outside agent-related settings; availability is
          controlled only by blocking the agent tenant-wide.
      - name: Agents from the Agent Store and Copilot connectors (synced and federated MCP connectors)
        class: saasChat
        url: https://learn.microsoft.com/en-us/microsoft-365/copilot/connectors/overview
      - name: Copilot Cowork (agentic system, usage-based billing, local Edge browser use)
        class: cloudAgent
        url: https://learn.microsoft.com/en-us/microsoft-365/copilot/cowork/cowork-admin-governance
        note: >-
          Access is granted only by a spending policy that selects Cowork (Copilot > Cost Management >
          Configuration); the Cowork entry under Agents > All agents no longer controls access.
    architecture: archEnterpriseAiChat
    status: ga
    asOf: "2026-09"
    summary:
      - >-
        Microsoft's work-grounded assistant, renamed Microsoft Copilot (and Copilot Chat to Microsoft Copilot
        Chat) during 2026 with no change to its security, compliance or privacy terms: the Copilot app and
        Copilot Chat, Copilot inside Word, Excel, PowerPoint, Outlook and Teams, the Researcher and Analyst
        reasoning agents, agents from the Agent Store, Copilot connectors, and the Cowork agentic system.
        Inference runs inside the Microsoft 365 service boundary on Microsoft-hosted models, with OpenAI and
        Anthropic as subprocessors; grounding reads Microsoft Graph content with the signed-in user's
        permissions, and web grounding sends a generated query to Bing outside the DPA and EU Data Boundary.
      - >-
        The admin planes are the tenant's own: Microsoft Entra (Conditional Access, tenant restrictions v2,
        agent identities), the Microsoft 365 admin center (Copilot > Settings, Agents > All agents, Copilot
        connectors > Your connections), Microsoft Purview (DLP location "Microsoft 365 Copilot and Copilot
        Chat", sensitivity labels, DSPM, audit, retention, eDiscovery), the SharePoint admin center (SharePoint
        Advanced Management), Cloud Policy (Allow web search in Copilot) and Defender. Interaction content is
        stored in the user's mailbox and exported through a Graph API; CopilotInteraction audit records stream
        through the Office 365 Management Activity API.
    facts:
      - label: Plans
        value: >-
          Copilot Chat (Basic): web-grounded, no extra cost with a qualifying Microsoft 365 subscription.
          Microsoft 365 Copilot (Premium) add-on: Graph and Work IQ grounding and the full in-app experience;
          Cowork is billed by usage on top. Microsoft 365 E7 bundles E5, Microsoft Copilot, Agent 365 and the
          Entra Suite.
        url: https://learn.microsoft.com/en-us/microsoft-365/copilot/microsoft-365-copilot-overview
      - label: Inference & routing
        value: >-
          Microsoft-hosted models plus OpenAI and Anthropic as subprocessors (admin toggle at Copilot > Settings
          > Data access > AI providers for other large language models). LLM calls go to the closest region and
          may overflow to other regions at peak; EU traffic stays in the EU Data Boundary, except Anthropic
          models, which are currently excluded from it.
        url: https://learn.microsoft.com/en-us/microsoft-365/copilot/microsoft-365-copilot-privacy
      - label: Data leaving the device
        value: >-
          Prompts, grounding content and responses are processed in the Microsoft 365 service boundary. With web
          search on, a generated query (the whole prompt only when it is very short; no user or tenant
          identifiers) goes to Bing, where the DPA, HIPAA and the EU Data Boundary do not apply.
        url: https://learn.microsoft.com/en-us/microsoft-365/copilot/manage-public-web-access
      - label: Retention & training
        value: >-
          Prompts, responses and Graph data are not used to train foundation models; Azure OpenAI abuse
          monitoring is opted out. Interaction history is stored with the organisation's Microsoft 365 content,
          deletable by users in My Account and governed by Purview retention policies (location Microsoft
          Copilot experiences).
        url: https://learn.microsoft.com/en-us/microsoft-365/copilot/microsoft-365-copilot-privacy
      - label: Docs index
        value: learn.microsoft.com/microsoft-365/copilot (Copilot documentation hub; Copilot controls overview)
        url: https://learn.microsoft.com/en-us/microsoft-365/copilot/
      - label: Network requirements
        value: >-
          Allow *.cloud.microsoft (primary URL copilot.cloud.microsoft); Microsoft does not support managing
          Copilot Chat through domain, URL or IP blocking.
        url: https://learn.microsoft.com/en-us/copilot/manage
      - label: Data residency
        value: >-
          A covered workload in the Product Terms data-residency commitments since 2024-03-01, including
          Advanced Data Residency and Multi-Geo.
        url: https://learn.microsoft.com/en-us/microsoft-365/copilot/microsoft-365-copilot-privacy
    items:
      - title: Where each control lives
        body:
          - >-
            Microsoft 365 admin center: Copilot > Settings (User access, Data access, Copilot actions), Copilot >
            Overview > Security (the Copilot security dashboard), Agents > All agents (Registry, Requests,
            Block, Delete), Agents > Settings (Allowed agent types, User access, Sharing, Agent management
            rules) and Copilot connectors > Your connections. Purview portal: Data Loss Prevention, DSPM, Audit,
            eDiscovery, Data Lifecycle Management. SharePoint admin center: Active sites (Restrict content from
            Microsoft Copilot), Reports > Data access governance, Advanced Management. Entra admin center:
            Conditional Access, Cross-tenant access settings, Agent identities.
        links:
          - title: Copilot controls overview
            url: https://learn.microsoft.com/en-us/microsoft-365/copilot/copilot-controls/overview
          - title: Manage Microsoft Copilot settings in the Microsoft 365 admin center
            url: https://learn.microsoft.com/en-us/microsoft-365/copilot/microsoft-365-copilot-page
          - title: Security for Microsoft Copilot (security dashboard, Security Dashboard for AI)
            url: https://learn.microsoft.com/en-us/microsoft-365/copilot/security-microsoft-365-copilot
      - title: Prompt-injection defence in depth
        body:
          - >-
            Microsoft runs jailbreak and cross-prompt-injection (XPIA) classifiers on inputs before model
            execution and sanitises hidden Unicode in pasted prompts; detections surface as JailbreakDetected
            and XPIADetected in CopilotInteraction audit records and as Defender alerts. The customer-side
            levers are source controls: DLP exclusion of external email from grounding, Defender for Office 365
            Plan 2 prompt-injection detection on inbound mail, web-grounding domain exclusion and the web search
            policy.
        links:
          - title: Microsoft Copilot prompt defense in depth
            url: https://learn.microsoft.com/en-us/microsoft-365/copilot/copilot-prompt-defense-in-depth
    riskNotes:
      - risk: riskPromptInjection
        note: >-
          Every mail, file, chat and connector result Copilot grounds on is model input. MSRC has published a
          run of server-side-fixed Critical command-injection disclosures (CVE-2025-32711, the EchoLeak zero-click
          chain; CVE-2026-26129, -26164, -42824); the XPIA classifiers that answer them are vendor-run and may not
          cover every scenario.
      - risk: riskSensitiveDataDisclosure
        note: >-
          Copilot returns whatever the user's permissions already reach, so oversharing in SharePoint, OneDrive
          and Teams becomes an answer. Web-grounding queries leave the DPA and the EU Data Boundary.
      - risk: riskShadowAndUnknownAgents
        note: >-
          Agent Builder agents can be shared with named colleagues without admin approval; a personal Copilot
          subscription can act on work documents unless Multiple account access to Copilot for work documents is
          disabled; consumer Copilot with a personal Microsoft account is outside the tenant.
      - risk: riskRogueActions
        note: >-
          Federated connectors gain write, update and delete tools from early October 2026 and Cowork automated
          tasks run without a person present; both let users persist approval.
      - risk: riskToolSourceProvenance
        note: >-
          Federated connectors are Microsoft-published or partner-submitted and Microsoft-approved, and the tools
          an MCP server exposes can change after approval; Microsoft-published connectors are on by default.
      - risk: riskStaleAgentIdentityBinding
        note: >-
          Shared agents become ownerless when their creator is deleted, and per-user connector OAuth grants have
          no admin-visible expiry.
    controls:
      - mitigation: D3-MFA
        coverage: native
        mechanism: >-
          Microsoft Entra Conditional Access policy (Users: All users; Target resources: All resources; Grant:
          Require authentication strength > Multifactor authentication), which Copilot honours like every
          Microsoft 365 service; security defaults turn MFA on for tenants without Entra ID P1
        steps:
          - title: Require MFA for every user
            body:
              - >-
                In the Microsoft Entra admin center go to Entra ID > Conditional Access > Policies > New policy:
                include All users (exclude break-glass accounts), target All resources, grant Require
                authentication strength > Multifactor authentication, then move the policy from Report-only to On.
            url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/policy-all-users-mfa-strength
          - title: Confirm Copilot inherits the policy
            body:
              - >-
                Copilot honours Conditional Access and the tenant's MFA settings, including Intune device
                compliance conditions; on tenants without Entra ID P1, keep security defaults on.
            url: https://learn.microsoft.com/en-us/microsoft-365/copilot/microsoft-365-copilot-architecture
        note: >-
          Native on the MFA rule applied to every vendor: the product's own identity layer (the tenant's Entra
          ID) can require a second factor for every member, and Copilot sits behind it. Outside it: break-glass
          accounts excluded by design; service principals and apps using application permissions such as
          AiEnterpriseInteraction.Read.All (Conditional Access for workload identities is separate); sessions
          that live on refresh tokens between sign-ins (sign-in frequency bounds them); agent identities, which
          do not use human MFA; and consumer Copilot on a personal Microsoft account, which the tenant policy
          never sees (tenant restrictions v2 is that lever). Conditional Access needs Entra ID P1, which
          Microsoft 365 E3 and E5 include.
        verified: "2026-09-25"
      - mitigation: D3-OTF
        coverage: partial
        mechanism: >-
          Tenant restrictions v2 in Entra ID > External Identities > Cross-tenant access settings, enforced by
          Entra when the sec-Restrict-Tenant-Access-Policy: <TenantId>:<policyGuid> header reaches
          login.live.com, login.microsoft.com, login.microsoftonline.com and login.windows.net (proxy
          injection, authentication plane only) or through universal tenant restrictions (Global Secure Access)
          or Windows GPO
        steps:
          - title: Block external tenants and personal Microsoft accounts
            body:
              - >-
                In Entra ID > External Identities > Cross-tenant access settings set the default tenant
                restrictions to block external accounts and apps, and add a policy for the Microsoft account
                tenant so personal-account sign-ins are refused.
            url: https://learn.microsoft.com/en-us/entra/external-id/tenant-restrictions-v2
          - title: Signal the policy on every sign-in
            body:
              - >-
                Have the proxy insert sec-Restrict-Tenant-Access-Policy with your tenant ID and the
                cross-tenant access policy ID on the four Microsoft sign-in domains, or use universal tenant
                restrictions in Global Secure Access to tag traffic without a proxy.
            url: https://learn.microsoft.com/en-us/entra/external-id/tenant-restrictions-v2
        note: >-
          Partial on the browser-pin rule: Microsoft documents a tenant-restriction header that the
          organisation's proxy or SSE injects and Entra enforces server-side, so personal tenants and personal
          Microsoft accounts are refused at sign-in. Proxy injection covers only the authentication plane
          (Windows GPO and Global Secure Access add data-plane coverage), and anonymous resources are not
          blocked. Microsoft does not support managing Copilot Chat by domain, URL or IP blocking. A customer
          proxy does not control Microsoft's own egress: Bing web grounding, federated connector calls and
          Cowork's hosted environment leave from Microsoft's cloud; the vendor-side levers there are the Allow
          web search in Copilot policy and web-grounding domain exclusion (up to 1,000 sites).
        verified: "2026-09-25"
      - mitigation: cap-sensitive-data-redaction
        coverage: native
        mechanism: >-
          Microsoft Purview DLP policy on the "Microsoft 365 Copilot and Copilot Chat" location: Content contains
          > Sensitive information types with Prevent Copilot from processing content > Processing prompts
          (preview) or > Performing Web Searches, and Content contains > Sensitivity labels to keep labelled files
          and email out of grounding; encrypting labels without the EXTRACT usage right withhold content; Endpoint
          DLP blocks paste into web Copilot Chat
        steps:
          - title: Block prompts that carry sensitive information
            body:
              - >-
                In the Purview portal go to Data Loss Prevention > Policies > + Create policy > Custom > Custom
                policy, turn on the Microsoft 365 Copilot and Copilot Chat location, and add Content contains >
                Sensitive information types with Prevent Copilot from processing content > Processing prompts
                (and > Performing Web Searches to keep those prompts off Bing).
            url: https://learn.microsoft.com/en-us/purview/dlp-microsoft365-copilot-location-learn-about
          - title: Keep labelled items out of responses
            body:
              - >-
                In a separate rule of the same location add Content contains > Sensitivity labels with Prevent
                Copilot from processing content, so labelled files and email are cited but not read.
            url: https://learn.microsoft.com/en-us/purview/dlp-microsoft365-copilot-location-learn-about
          - title: Withhold EXTRACT on encrypting labels
            body:
              - >-
                Configure encrypting sensitivity labels so groups that must not get Copilot answers lack the
                EXTRACT usage right; Copilot returns encrypted content only with VIEW and EXTRACT.
            url: https://learn.microsoft.com/en-us/purview/ai-m365-copilot
          - title: Block paste into web Copilot Chat
            body:
              - >-
                Use Endpoint DLP to block paste of sensitive content and files by sensitivity label into the
                web version of Copilot Chat on onboarded devices.
            url: https://learn.microsoft.com/en-us/purview/ai-m365-copilot
        note: >-
          Native on the redaction rule: a vendor tenant control inspects typed prompts for sensitive information
          types and blocks the turn, and excludes labelled items from grounding, server-side. Boundaries: block
          only, no masking; the prompt block is in preview and rolling out; DLP does not scan files uploaded into
          a prompt, only the typed text; no response-side inspection is documented (labels are displayed and
          inherited, not enforced on output); SIT and label conditions cannot share a rule; the label rule
          covers files and email sent on or after 2025-01-01, not calendar invites, and in Word, Excel and
          PowerPoint is evaluated at file open; policy changes take up to four hours; evaluations that time out
          are deferred (DLPEvaluationDeferred in the audit record), so watch that field.
        verified: "2026-09-25"
      - mitigation: cap-ai-vendor-assessment
        coverage: external
        mechanism: >-
          Service Trust Portal audit reports and whitepapers, and the Copilot privacy page's compliance
          statement, feed the organisation's TPRM platform
        evidence:
          - title: Get started with the Microsoft Service Trust Portal (ISO/IEC, SOC 1-3, GDPR, FedRAMP, PCI, CSA STAR)
            url: https://learn.microsoft.com/en-us/compliance/assurance/stp-get-started
          - title: Data, Privacy, and Security for Microsoft Copilot (compliance offerings, subprocessors, EUDB)
            url: https://learn.microsoft.com/en-us/microsoft-365/copilot/microsoft-365-copilot-privacy
        note: >-
          External: the assessment, its evidence expiry and the reassessment trigger live in the organisation's
          TPRM platform. The Service Trust Portal publishes the ISO/IEC, SOC 1-3, GDPR, FedRAMP, PCI and CSA STAR
          material behind an Entra sign-in and NDA; the privacy page states GDPR, ISO 27001, HIPAA and ISO 42001
          coverage for Copilot, points to a Copilot & Copilot Chat Risk Assessment Quickstart, and names OpenAI
          and Anthropic as subprocessors with Anthropic excluded from the EU Data Boundary. Re-assess on model
          and subprocessor changes; the portal itself renders client-side and was not read.
        verified: "2026-09-25"
      - mitigation: AML.M0029
        coverage: partial
        mechanism: >-
          Federated connector write, update and delete tools (rolling out from early October 2026) show a
          confirmation card with the action parameters and default to Needs approval per tool, with Allow once,
          Allow for conversation or Always allow; Cowork asks before an automated task sends email, posts or
          changes a shared system, and users can pre-authorise; no admin setting forces approval
        steps:
          - title: Review which connectors can write
            body:
              - >-
                In the Microsoft 365 admin center open Copilot connectors > Your connections, select a federated
                connector and read its Tools section (coming soon); disable or scope connectors whose write tools
                you do not accept.
            url: https://learn.microsoft.com/en-us/microsoft-365/copilot/connectors/federated-connectors-overview
          - title: Tell users how to reset approvals
            body:
              - >-
                Users set the connector's Write/Delete tools back to Needs approval in Copilot Settings > Sources;
                a publisher change to a tool resets it to Needs approval.
            url: https://learn.microsoft.com/en-us/microsoft-365/copilot/connectors/federated-connectors-overview
          - title: Limit who can run Cowork
            body:
              - >-
                Grant Cowork only through a spending policy scoped to a security group at Copilot > Cost
                Management > Configuration; users outside every Cowork policy cannot start tasks.
            url: https://learn.microsoft.com/en-us/microsoft-365/copilot/cowork/cowork-admin-governance
        note: >-
          Partial on the human-approval rule: a present person approves each write seeing its parameters, but
          users can persist Always allow per tool or pre-authorise Cowork automated tasks, and the administrator
          can neither require approval nor remove Always allow. Read tools never prompt. Actions run with the
          user's own permissions in the target system. Agents with their own actions (Copilot Studio, API
          plugins) carry their publisher's confirmation behaviour, which this row does not cover.
        verified: "2026-09-25"
      - mitigation: cap-input-guardrails
        coverage: partial
        mechanism: >-
          Vendor-run jailbreak and cross-prompt-injection (XPIA) classifiers screen inputs before model
          execution, always on and not configurable, logged as JailbreakDetected and XPIADetected in
          CopilotInteraction audit records and raised as Defender alerts; admin-set source controls: DLP Email is
          received from > External users (preview), Defender for Office 365 Plan 2 prompt-injection detection on
          inbound mail, web-grounding domain exclusion
        steps:
          - title: Watch the classifier signals
            body:
              - >-
                In the Purview portal Audit search, filter the CopilotInteraction operation and alert on
                AccessedResources.XPIADetected and Messages.JailbreakDetected; SecOps sees the same detections in
                the Defender portal.
            url: https://learn.microsoft.com/en-us/purview/audit-copilot
          - title: Keep external email out of grounding
            body:
              - >-
                Add a rule to the Microsoft 365 Copilot and Copilot Chat DLP location with Email is received from >
                External users and Prevent Copilot from processing content.
            url: https://learn.microsoft.com/en-us/purview/dlp-microsoft365-copilot-location-learn-about
          - title: Screen inbound mail for injection
            body:
              - >-
                With Defender for Office 365 Plan 2, inbound messages carrying prompt injection get the High
                confidence phishing verdict with detection technology Prompt injection protection; route that
                verdict to quarantine in your anti-spam policy.
            url: https://learn.microsoft.com/en-us/defender-office-365/step-by-step-guides/prompt-injection-protection-defender-for-office-365
          - title: Narrow web grounding
            body:
              - >-
                Run ConfigureTenantDomainExclusions.ps1 (Search Administrator) to exclude up to 1,000 sites from
                web grounding, or disable web search with the Allow web search in Copilot policy.
            url: https://learn.microsoft.com/en-us/copilot/domain-exclusion
        note: >-
          Partial on the input-screening rule: screening of retrieved content is vendor-internal, documented but
          not configurable ("may not be available in all Microsoft Copilot scenarios"), and a detection is an
          audit event, not an admin quarantine. The switches the administrator does own act on sources rather
          than classifying content: the external-email rule reads sender metadata only; Defender for Office 365
          covers inbound mail only and a focused set of intents (URL exfiltration, system-prompt and tool
          discovery). SharePoint files, Teams chats, Copilot connector content and federated MCP results have no
          admin-tunable screening.
        verified: "2026-09-25"
      - mitigation: D3-AA
        coverage: partial
        mechanism: >-
          Copilot acts as the signed-in user; agents with a Microsoft Entra agent identity (Agent 365 instances,
          Copilot Studio agents with automatic identity creation, preview) are listed in the Entra admin center with a
          sponsor, get expiring access-package assignments and transfer sponsorship to the manager when the
          sponsor leaves; the Agent Registry flags ownerless agents; connector grants are per-user OAuth consents
          that users disconnect in Settings > Sources
        steps:
          - title: Inventory agent identities
            body:
              - >-
                Review agent identities and their sponsors in the Microsoft Entra admin center; agent sign-ins
                are logged as AI agents.
            url: https://learn.microsoft.com/en-us/entra/agent-id/what-are-agent-identities
          - title: Give agent access an expiry
            body:
              - >-
                Assign agent identities access through access packages with an end date (policy "For users,
                service principals, and agent identities" > All agents) so access lapses unless the sponsor
                extends it.
            url: https://learn.microsoft.com/en-us/entra/id-governance/agent-id-governance-overview
          - title: Resolve ownerless agents
            body:
              - >-
                At Agents > Settings > Agent management rules run Reassign ownerless agents created with Agent
                Builder to manager, or Block ownerless agents without usage.
            url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/agent-settings?view=o365-worldwide
        note: >-
          Partial on the connector-grant rule: agent identities are inventoried with sponsor lifecycle and
          expiring access (Agent 365 licence with Entra ID P1 or Microsoft 365 E3), but the grants that carry
          Copilot into third-party systems, federated and self-serve connectors, are per-user OAuth consents the
          administrator cannot list or expire per grant; the only admin lever is disabling a connector for
          everyone. Disabling the Entra user stops Copilot use; revocation of the third-party tokens Microsoft
          holds for that user is not documented. Agents without an agent identity run under the user.
        verified: "2026-09-25"
      - mitigation: D3-DI
        coverage: native
        mechanism: >-
          Purview DSPM data risk assessments (default weekly assessment of the top 100 SharePoint sites by usage,
          custom and item-level assessments) with sensitive-information classification and oversharing counts;
          SharePoint Advanced Management data access governance reports and the Content Management Assessment
        steps:
          - title: Run data risk assessments
            body:
              - >-
                In the Purview portal open Solutions > DSPM > Discover > Data risk assessments, review the default
                weekly assessment and create custom assessments for the sites and users Copilot will serve.
            url: https://learn.microsoft.com/en-us/purview/data-security-posture-management-learn-about
          - title: Run the data access governance reports
            body:
              - >-
                In the SharePoint admin center open Reports > Data access governance and run Site permissions
                across your organization and Sensitivity labels applied to files, then the Sharing links and
                'Everyone except external users' activity reports.
            url: https://learn.microsoft.com/en-us/sharepoint/data-access-governance-reports
          - title: Start the Content Management Assessment
            body:
              - >-
                In the SharePoint admin center select Advanced Management > Start assessment and rerun it every
                30 days to track oversharing, inactive and ownerless sites.
            url: https://learn.microsoft.com/en-us/microsoft-365/copilot/get-ready-copilot-sharepoint-advanced-management
        note: >-
          Native on the inventory rule: the vendor inventories and classifies what Copilot can reach in
          SharePoint and OneDrive and reports the oversharing. Limits: the default assessment covers the top 100
          sites by usage; 200,000 items per location; item-level scanning is SharePoint only and at most 10
          sites; Exchange mailboxes, Teams chats, synced Copilot connector content and federated sources are not
          in the oversharing assessments; results lag by days. DSPM needs Purview licensing; SharePoint Advanced
          Management features come with Copilot licences, and E5 alone gets only part of the reports.
        verified: "2026-09-25"
      - mitigation: D3-CH
        coverage: partial
        mechanism: >-
          No customer-run tunnel for MCP servers; the Microsoft Graph connector agent (on-premises, outbound
          port 443) authenticates with an Entra app registration's client secret (expiry chosen at creation) or
          certificate; connectors such as ServiceNow offer Microsoft Entra ID OpenID Connect federated auth with
          no stored secret; federated connector OAuth tokens are held by Microsoft per user; Entra sessions are
          bounded by sign-in frequency and revoked with Revoke-MgUserSignInSession
        steps:
          - title: Prefer secretless connector auth
            body:
              - >-
                Where the connector offers it, choose Microsoft Entra ID OpenID Connect (Federated Auth) so the
                connector authenticates to the source without storing or rotating a client secret.
            url: https://learn.microsoft.com/en-us/microsoft-365/copilot/connectors/servicenow-knowledge-deployment
          - title: Bound the connector agent's credential
            body:
              - >-
                Configure the Graph connector agent with a certificate, or a client secret created under App
                registration > Certificates and secrets with a short expiry, and rotate it there.
            url: https://learn.microsoft.com/en-us/microsoft-365/copilot/connectors/connector-agent
          - title: Revoke a user's tokens
            body:
              - >-
                Run Revoke-MgUserSignInSession to invalidate the user's refresh tokens; access tokens last up to
                an hour unless the app supports continuous access evaluation.
            url: https://learn.microsoft.com/en-us/entra/identity/users/users-revoke-access
        note: >-
          Partial on the credential rule for a product without an MCP tunnel: the Entra-issued credentials
          (connector agent app, Graph export apps, user sessions) are scoped, expiring and rotatable by the
          administrator, and connector tokens never reach the model; but the per-user OAuth tokens federated
          connectors hold for third-party services are in Microsoft's custody with lifetime set by the third
          party and no admin rotation or revocation documented, and some synced connectors still accept Basic
          authentication with a stored password. The Graph connector agent is an indexing agent for synced
          connectors, not a tunnel; its app credential is the load-bearing secret on that path.
        verified: "2026-09-25"
      - mitigation: AML.M0028
        coverage: partial
        mechanism: >-
          Agents > Settings > Allowed agent types (built by Microsoft / your organization / external publishers;
          also governs default federated connectors), Agents > Settings > User access, per-agent publish and
          install audiences, and per-connector allowed-user scope and staged rollout to Entra groups at Copilot
          connectors > Your connections; write, update and delete tools are not enabled separately
        steps:
          - title: Switch connectors to allowlist mode
            body:
              - >-
                At Agents > Settings > Allowed agent types clear the Microsoft-published and third-party options so
                federated connectors, including future ones, are off until an administrator enables each one.
            url: https://learn.microsoft.com/en-us/microsoft-365/copilot/connectors/manage-federated-connectors
          - title: Scope each connector to groups
            body:
              - >-
                At Copilot connectors > Your connections enable a connector and use Add staging to limit it to
                specific Microsoft Entra ID groups.
            url: https://learn.microsoft.com/en-us/microsoft-365/copilot/connectors/federated-connectors-overview
          - title: Scope agent access
            body:
              - >-
                At Agents > Settings > User access choose Specific users/groups, and publish each agent to named
                groups rather than everyone.
            url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/agent-settings?view=o365-worldwide
        note: >-
          Partial on the tool-permission rule: an admin-locked allowlist of connectors and agents with group
          scoping, but no per-tool or read/write scoping: a connector admitted for reads admits the write, update
          and delete tools its publisher ships (from early October 2026), and the admin Tools list is view-only.
          Actions keep the caller's authority (the user's own permissions at the source). Researcher and
          Analyst sit outside agent settings. The Set-FederatedConnectorToggle cmdlet is retired; its state is
          honoured only until 2026-10-20.
        verified: "2026-09-25"
      - mitigation: cap-agent-tool-registry
        coverage: native
        mechanism: >-
          Microsoft 365 admin center Agents > All agents > Registry (every agent available to the tenant, with
          publisher type, owner, channel, platform, status and risk signals; Export; Agents without owners),
          Requests (Pending review / update / activate; Publish to store or Reject submission), Block, and
          Copilot connectors > Your connections; Allowed agent types for allowlist mode
        steps:
          - title: Review and export the registry
            body:
              - >-
                At Agents > All agents > Registry filter by publisher type, platform and status, export to CSV,
                and work the Agents without owners card.
            url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/agent-registry?view=o365-worldwide
          - title: Approve before anything is published
            body:
              - >-
                At Agents > All agents > Requests review each agent's data sources, tools and permissions, then
                Publish to store to a named audience or Reject submission; updates wait as Pending update.
            url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/agent-requests?view=o365-worldwide
          - title: Close the default-allow paths
            body:
              - >-
                Restrict Agents > Settings > Allowed agent types and Sharing (Specific users), and Block any agent
                in the registry that should not run.
            url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/agent-settings?view=o365-worldwide
        note: >-
          Native on the registry rule: an authoritative record of every agent and connector in the tenant with
          owner and approval state, and admin enforcement (approval queue, allowed types, block). Gaps to watch:
          Agent Builder agents can still be shared with named individuals without approval (Sharing set to No
          users keeps direct sharing, and the control covers only Agent Builder agents); they appear in the
          registry and can be blocked, but are not pre-approved. Microsoft-published federated connectors are on
          until Allowed agent types is changed. Registry risk signals need E7 or Agent 365; Cowork plugins are
          managed on their own page.
        verified: "2026-09-25"
      - mitigation: AML.M0024
        coverage: native
        mechanism: >-
          CopilotInteraction records in the unified audit log (Audit Standard; auditing on by default for new
          tenants) with AppHost,
          AgentId, AISystemPlugin (BingWebSearch), AccessedResources (SensitivityLabelId, PolicyDetails,
          XPIADetected) and Messages (JailbreakDetected), streamed through the Office 365 Management Activity API
          (Audit.General, record type 261); prompt and response text through the Graph getAllEnterpriseInteractions
          API
        steps:
          - title: Stream the audit records to the SIEM
            body:
              - >-
                Subscribe to the Audit.General content type in the Office 365 Management Activity API and parse
                record type 261 (CopilotInteraction) with the Copilot schema.
            url: https://learn.microsoft.com/en-us/office/office-365-management-api/office-365-management-activity-api-schema
          - title: Export prompts and responses
            body:
              - >-
                Grant an app AiEnterpriseInteraction.Read.All and call GET
                /copilot/users/{id}/interactionHistory/getAllEnterpriseInteractions per user, or subscribe to
                aiInteraction change notifications.
            url: https://learn.microsoft.com/en-us/microsoft-365/copilot/extensibility/api/ai-services/interaction-export/aiinteractionhistory-getallenterpriseinteractions
          - title: Confirm auditing and search it
            body:
              - >-
                In the Purview portal Audit, filter Activities - operation names on CopilotInteraction; web
                queries appear as AISystemPlugin.Id BingWebSearch.
            url: https://learn.microsoft.com/en-us/purview/audit-copilot
        note: >-
          Native on the telemetry rule: programmatic export of interaction events (with the files, sites,
          plugins, agents and policy decisions involved) and of conversation content, for fusion with the
          gateway's record. Limits: audit records carry references, not prompt text, so content comes from the
          Graph export API, which needs a Copilot licence, has no delta and does not return Copilot Studio agent
          interactions; capture is not tamper resistance, so the SIEM copy is the record of truth.
        verified: "2026-09-25"
      - mitigation: cap-shadow-ai-discovery
        coverage: external
        mechanism: >-
          Nothing in Copilot lists personal accounts or unsanctioned assistants; Microsoft's own SSE/CASB
          products (Defender for Cloud Apps cloud app catalog, Generative AI category; Global Secure Access
          shadow AI discovery) and Purview DSPM browser and endpoint signals do the discovery
        evidence:
          - title: Manage generative AI apps for your organization (DSPM for AI, Defender for Cloud Apps)
            url: https://learn.microsoft.com/en-us/microsoft-365/copilot/manage-generative-ai-apps
          - title: Shadow AI discovery in Global Secure Access
            url: https://learn.microsoft.com/en-us/entra/global-secure-access/concept-shadow-ai-discovery
          - title: Multiple account access to Microsoft Copilot for work and school documents
            url: https://learn.microsoft.com/en-us/microsoft-365/copilot/multiple-account-access
        note: >-
          External on the discovery rule: Copilot does not report personal Microsoft accounts on the
          organisation's domains or other AI tools staff use; the integration points are Defender for Cloud Apps
          (Cloud apps > Cloud app catalog, Category Generative AI, tag Unsanctioned), Global Secure Access and the
          Purview browser extension; the Security Dashboard for AI aggregates their findings (third-party AI apps,
          shadow agents) but is Microsoft's security stack around Copilot, not Copilot. The Agent Registry's
          Unmanaged agents count covers agents inside the tenant only. Prevention, credited here only:
          tenant restrictions v2 refusing the Microsoft account tenant, and the Cloud Policy setting Multiple
          account access to Copilot for work documents set to Disabled so personal Copilot subscriptions cannot
          act on work files.
        verified: "2026-09-25"
      - mitigation: cap-data-access-governance
        coverage: native
        mechanism: >-
          Grounding through Microsoft Graph and the Semantic Index with the signed-in user's permissions, synced
          connector items carrying source ACLs, federated connectors calling as the user; admin corpus scoping
          with Restricted Content Discovery (Restrict content from Microsoft Copilot, Set-SPOSite
          -RestrictContentOrgWideSearch), the DLP sensitivity-label exclusion and connector allowed-user scope
        steps:
          - title: Pull sensitive sites out of Copilot
            body:
              - >-
                In the SharePoint admin center open Sites > Active sites > the site > Settings and turn on
                Restrict content from Microsoft Copilot, or run Set-SPOSite -Identity <site-url>
                -RestrictContentOrgWideSearch $true; report with Start-SPORestrictedContentDiscoverabilityReport.
            url: https://learn.microsoft.com/en-us/sharepoint/restricted-content-discovery
          - title: Exclude labelled content from grounding
            body:
              - >-
                Add a Content contains > Sensitivity labels rule to the Microsoft 365 Copilot and Copilot Chat DLP
                location with Prevent Copilot from processing content.
            url: https://learn.microsoft.com/en-us/purview/dlp-microsoft365-copilot-location-learn-about
          - title: Limit connectors to the groups that need them
            body:
              - >-
                Scope each Copilot connector at Copilot connectors > Your connections to specific Entra ID groups
                with Add staging.
            url: https://learn.microsoft.com/en-us/microsoft-365/copilot/connectors/federated-connectors-overview
        note: >-
          Native on the retrieval rule: retrieval runs with the requesting user's entitlements at the source, and
          the administrator can restrict which sites, labels and connectors are returned. Limits: Restricted
          Content Discovery changes no permissions, still lets users reach content they own or recently used,
          does not apply to OneDrive and takes time to propagate on large sites; Restricted SharePoint Search is
          retiring (no new enablement from 2026-07-31) and was never a security boundary; synced connectors are
          only as tight as the ACLs they map; what is already overshared is returned until permissions are fixed
          (see D3-DI).
        verified: "2026-09-25"
      - mitigation: D3-APA
        coverage: native
        mechanism: >-
          Group-based authorisation administered in the Microsoft 365 admin center (Copilot licence assignment,
          Agents > Settings > User access, per-agent publish and install audiences, connector allowed-user scope,
          AI Administrator role); consent paths documented: Review permissions > Grant admin consent when an agent
          is published or installed, and connector apps registered in the target system (for example ServiceNow
          System OAuth > Application Registry with Microsoft Entra ID OpenID Connect)
        steps:
          - title: Decide who gets Copilot and agents
            body:
              - >-
                At Agents > Settings > User access choose Specific users/groups, and publish or install each agent
                to named groups.
            url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/agent-settings?view=o365-worldwide
          - title: Grant admin consent deliberately
            body:
              - >-
                When installing or publishing an agent, read the Review permissions pane before selecting Grant
                admin consent and Accept.
            url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/agent-actions?view=o365-worldwide
          - title: Register the connector in the target system
            body:
              - >-
                For a synced connector, register the app in the target (ServiceNow: System OAuth > Application
                Registry, OIDC provider Microsoft Entra ID) and limit its scope there.
            url: https://learn.microsoft.com/en-us/microsoft-365/copilot/connectors/servicenow-knowledge-deployment
        note: >-
          Native on the authorisation rule: the console administers group-scoped authorisation over Copilot,
          agents and connectors, and Microsoft documents the consent path for agent permissions and per-connector
          target registration. The target tenant's consent (ServiceNow, Google, HubSpot) is that tenant's
          control; federated connectors authenticate each user into the third party, and whether its admin must
          approve the app is the third party's setting, not documented per connector by Microsoft. Policy
          administration is not the enforcement path: Entra and the source system enforce.
        verified: "2026-09-25"
      - mitigation: cap-agent-kill-switch
        coverage: partial
        mechanism: >-
          Block access to Copilot Chat for all users or groups; remove Microsoft 365 Copilot licences; Agents >
          All agents > Block per agent (Researcher and Analyst only tenant-wide); disable the agent type used by
          connectors or set a connector to No users (up to 10 minutes); drop users from Cowork spending policies;
          Revoke-MgUserSignInSession per user
        steps:
          - title: Block an agent for the whole organisation
            body:
              - >-
                At Agents > All agents select the agent, choose Block > Block agent and Save; delete it for a 30-day
                soft delete, or Permanently delete.
            url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/agent-actions?view=o365-worldwide
          - title: Block Copilot Chat
            body:
              - >-
                Block access to Copilot Chat for all users or selected groups, and set Custom link for blocked
                Microsoft Copilot app under Copilot > Settings to explain why.
            url: https://learn.microsoft.com/en-us/copilot/manage
          - title: Cut every connector
            body:
              - >-
                Disable the agent type used by Microsoft 365 Copilot connectors in Allowed agent types; each
                connector's allowed-user scope becomes No users within about ten minutes.
            url: https://learn.microsoft.com/en-us/microsoft-365/copilot/connectors/manage-federated-connectors
          - title: Revoke a user's sessions
            body:
              - >-
                Run Revoke-MgUserSignInSession for the user; access tokens already issued last up to an hour
                unless the app supports continuous access evaluation.
            url: https://learn.microsoft.com/en-us/entra/identity/users/users-revoke-access
        note: >-
          Partial on the kill-switch rule: the administrator can switch Copilot, agents and connectors off
          org-wide, but the docs do not say that work already running stops (Cowork automated tasks, a Researcher
          run, an agent mid-task), the delay for agent and Chat blocks is not documented (connector changes take
          up to 10 minutes), third-party OAuth grants are not revoked in bulk by any documented action, and
          blocking a SharePoint or Foundry agent affects only Copilot Chat. Session revocation leaves issued
          access tokens alive for up to an hour.
        verified: "2026-09-25"
