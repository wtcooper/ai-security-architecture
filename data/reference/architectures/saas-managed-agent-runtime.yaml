id: archManagedAgentRuntime
surface: surfaceSaas
rank: 3
title: API/SDK managed agent runtime
abbrev: API/SDK runtime

summary:
  - >
    A vendor's API-driven hosted agent service: the loop, the memory, the sandbox and the tool
    gateway supplied as published, separately billed products, driven through an SDK or API
    rather than a builder UI. The customer owns the front end, the agent definitions, the tools
    admitted, the identities and the audit export. The governance plane arrives built in, and
    the trade is that it is configured rather than designed.

description:
  - >
    Every provider converged on the same decomposition: a runtime, a memory service, a tool
    gateway, an identity service, a code interpreter and browser, observability, evaluation and
    policy. That convergence is itself the finding — the governance plane most self-built agent
    architectures never get is exactly what these services sell. This drawing still shows the
    provider as one block: the decomposition is documented and separately billed, but under
    the three-zone rule what they operate inside their boundary is assured rather than drawn,
    and their tool gateway, memory and sandbox appear as the block's items — zone-2 surfaces
    we configure, not tiers we run. The loop's execution behind them remains genuinely
    uninspectable. So is the model: the runtime calls its own vendor's inference inside that
    boundary, and nothing of ours is on the path — every control our AI gateway applies to
    inference elsewhere in the catalogue (model allowlist, prompt inspection, spend ceilings,
    the prompt-level record) does not see this traffic and has to be re-obtained as tenant
    configuration and audit export. Our gateway is on the tool path back into our systems, and
    only there.
  - >
    The consequential choice is between the managed harness and the escape hatches, of which
    there are two and they point in opposite directions. The first, offered by the hyperscaler
    runtimes, is bring-your-own-code: the provider supplies the sandbox and the identity but
    the loop is the customer's, and it inherits only the guardrails it explicitly calls. The
    second, offered by the first-party runtime, is the self-hosted sandbox: the provider keeps
    the loop, the model and the orchestration, and tool execution moves to a worker we run —
    code, filesystem and egress inside our perimeter, tool inputs and outputs still crossing
    back to a loop we cannot see. Teams routinely start declarative, hit a limitation, take
    one of the two, and do not notice which controls stopped applying.
  - >
    The path back into our systems is the tool path, and both first-party vendors now ship an
    outbound-only tunnel for it: software we run inside our network that dials out, so the MCP
    server stays private and no inbound rule is opened. The tunnel is transport only — it does
    not authenticate to the upstream, and the payloads still traverse the vendor's cloud — which
    is why it hands to our gateway rather than to the servers themselves. A second first-party
    vendor has pre-announced the same product class for late 2026; it joins the exemplars when
    it ships.
  - >
    Managed memory is the component most likely to be switched on without a decision. Its scope
    — per session, per user, or shared across users — is a configuration flag with a
    data-protection consequence, and cross-user scope means one user's content can shape
    another's turn.
  - >
    Identity on this surface is layered rather than singular, and the layers are what to
    inventory. Our application authenticates to the vendor as a workload — short-lived tokens
    from our own identity provider by federation, or a workspace API key where that is not
    set up. The agent authenticates to our systems on whatever the vault holds for the
    session: per-user OAuth credentials matched to the MCP server URL, injected by the
    vendor's proxy at egress so the sandbox never sees them. A self-hosted worker holds an
    environment key of its own. The first-party runtime mints no principal per agent; the
    hyperscaler runtimes do, and where that exists it is worth selecting for, because it is
    the one layer that makes "revoke this agent" a single operation. Without it, revoking an
    agent means finding every vault entry it was ever attached to. The costs either way are
    portability and opacity: the configuration moves to no other provider, and debugging a
    misbehaviour means reading traces rather than code.

distinguishedBy:
  - >
    Against building the agent tier: the same components with the provider supplying them. The
    work moves from designing an identity model, a policy engine and a sandbox to configuring
    three, and from having to build observability to having to export it.
  - >
    Against the UI/low-code managed agent runtime: same hosting model, different author. Here
    engineers define agents in code against an SDK or API, and the software-delivery pipeline —
    review, versioning, staged rollout — still applies to the definition even though the loop
    is the vendor's. The low-code sibling replaces that pipeline with a builder UI and a
    publish button, which moves the risk from the definition to the population.

exemplars:
  - name: Claude Managed Agents
    note: >
      The class-defining first-party runtime: agent, environment, session and events declared
      over an API; per-user vaults substituted at egress so the sandbox never holds a secret;
      MCP tunnels (research preview) and self-hosted sandboxes (beta) as the two ways back
      inside our perimeter. Inference and the loop stay on the vendor's side in every variant.
      Verify per feature: cloud sessions are not eligible for zero data retention or a HIPAA
      BAA, vault values sit outside customer-managed keys, and vaults are workspace-scoped.
    url: https://platform.claude.com/docs/en/managed-agents/overview
    asOf: "2026-09"
  - name: Amazon Bedrock AgentCore
    note: >
      The hyperscaler decomposition in full — runtime, memory, gateway, identity, browser and
      code interpreter as separately billed services, with Cedar default-deny policy enforced
      at the provider's tool gateway. Verify identity, retention, vault-scoping and
      customer-key behaviour per component before relying on any of them.
    url: https://aws.amazon.com/bedrock/agentcore/
    asOf: "2026-09"
  - name: Vertex AI Agent Engine
    note: >
      A managed runtime with admin-enforced guardrail floors (Model Armor) — the zone-2
      configuration surface this page pins, shipped as platform policy.
    url: https://cloud.google.com/vertex-ai/generative-ai/docs/agent-engine/overview
    asOf: "2026-09"

zones:
  - id: zoneUser
    owner: user
    note: The people the published agent serves, and the team that defined it.
  - id: zoneVendor
    owner: vendor
    note: >
      The provider's environment, and where the agent actually runs. Drawn before our own band
      because that is the direction of the work: a request reaches the vendor first, and the
      vendor reaches back into us second. What they operate inside it is assured, not drawn.
  - id: zoneCloud
    owner: cloud
    note: >
      What we still own on somebody else's platform: the definition that decides what the agent
      may do, the tunnel their runtime reaches us through, the gateway that admits it into our
      systems, and the systems themselves.
  - id: zoneExternal
    owner: external
    note: Where the agent's actions land outside both environments.
  - id: zoneGovernance
    owner: governance
    note: >
      On a platform we do not operate, this band is most of what "our controls" can mean — and
      the identity the agent runs as is not one of them by default.

blocks:
  - id: engineer
    kind: actor
    title: Developer
    icon: person
    zone: zoneUser
    col: 0
    row: 0
    note: >
      The engineer who writes the definition and the code — the author the delivery pipeline
      still applies to, which is this page's whole distinction from the low-code sibling.

  - id: endUser
    kind: actor
    title: End user
    icon: person
    zone: zoneUser
    col: 0
    row: 1
    note: The person a session runs for, and whose credentials it acts on if we set it up that way.

  - id: entry
    kind: service
    title: Application front end
    cosaiComponent: componentApplication
    zone: zoneCloud
    col: 2
    row: 2
    note: >
      The customer-owned surface an SDK-driven runtime is invoked from — our code, calling
      their API. User authentication and the delegated session context are bound here, before
      anything reaches the vendor. It is also the session client: it creates sessions, streams
      events, answers the approval prompts for tools configured to ask, and executes custom
      tools — the one path back into our systems that needs neither a tunnel nor a public
      endpoint, because the request and the result ride the session stream we already hold.
    items:
      - id: api
        label: App & API endpoint
        icon: globe
        note: The published surface our users actually touch.
      - id: authn
        label: Identity binding
        icon: shield
        note: Which of our people a session runs for, established before it starts.
      - id: handlers
        label: Tool handlers
        icon: code
        note: >
          Custom tools run here, in our code. The agent emits the call, the session idles,
          our handler executes it against our own systems and posts the result back. The
          vendor sees inputs and outputs, never the credential or the network behind them.

  - id: managedRuntime
    kind: provider
    title: Managed runtime
    cosaiComponent: componentReasoningCore
    zone: zoneVendor
    col: 1
    row: 1
    note: >
      The provider hosts the agent loop itself — tool-call decisions, error recovery, context
      compaction — along with session state and a sandbox per session. Defined declaratively
      over an API rather than shipped as a container, which makes the definition the whole of
      the behaviour contract.
      The adoption caveats are product-specific and belong in the exemplar assessment rather
      than here — retention and compliance eligibility of cloud sessions, vault scoping, and
      key-management exclusions all vary by provider and change by quarter; verify each per
      product before relying on it.
    items:
      - id: agentLoop
        label: Agent loop
        icon: agent
        note: Their harness running our definition, with the reasoning and the retries theirs to operate.
      - id: inference
        label: Model inference
        icon: model
        note: >
          Their model, called inside their boundary. It never crosses our AI gateway, so the
          inference controls we enforce there elsewhere in the catalogue do not apply here and
          have to be obtained as tenant configuration instead.
      - id: managedMemory
        label: Memory store
        icon: folder
        note: Session and long-term state they hold, whose scope is a configuration flag rather than an architecture.
      - id: vault
        label: Credential vault
        icon: key
        note: >
          Write-only secrets the vendor injects at egress: per-user OAuth for MCP servers,
          matched by server URL, and environment-variable values substituted into outbound
          requests to named hosts. The sandbox never holds a value. Workspace-scoped, so any
          key with workspace access can attach one; where no credential matches, the
          connection is attempted unauthenticated.
      - id: sandbox
        label: Sandboxed tools
        icon: shield
        note: >
          Provider-operated code execution and browsing, one container per session — with its
          own path to the open web that never touches anything we run. The self-hosted variant
          moves this execution onto a worker inside our perimeter while the loop stays here;
          recorded as a deviation rather than drawn.
      - id: hostedTools
        label: Remote MCP & connectors
        icon: plug
        note: >
          Hosted MCP servers and connectors the provider calls from its own side, the tool
          list fetched by them, the credential drawn from the vault. That path never touches
          our network, so the risk sits on this item and the control is per-tool enablement in
          the definition. The alternative for any third-party connector is to register it on
          our gateway instead and declare the gateway's tunnel hostname as the server: same
          connector, now scoped and recorded at our tier — the choice per connector is which
          of the two it is.

  - id: agentDef
    kind: service
    title: Agent definition & code
    cosaiComponent: componentAgentSystemInstruction
    zone: zoneCloud
    col: 2
    row: 0
    note: >
      Model, prompt, tools, MCP servers and skills, declared and pushed to the provider —
      and the environment those sessions run in. On a runtime we do not operate these
      artifacts are very nearly the whole of what we control about the agent, which makes
      reviewing them a release gate rather than a formality. The hyperscaler variant adds a
      third artifact, the customer's own loop code, recorded in the escape-hatch scenario.
    items:
      - id: declarative
        label: Declarative definition
        icon: doc
        note: >
          What the agent may do — model, prompt, tool enablement and approval policy, MCP
          servers, skills — versioned, so a session pins to one version and a rollback is a
          pointer flip.
      - id: environment
        label: Environment definition
        icon: gear
        note: >
          Where sessions run and what they may reach: the vendor's cloud sandbox or our own
          worker, and the sandbox's egress policy — unrestricted, or a host list that governs
          the sandbox's own network calls but not the vendor's web tools.

  - id: tunnel
    kind: service
    title: Tunnel connector
    cosaiComponent: componentAgentUserQuery
    zone: zoneCloud
    col: 2
    row: 1
    note: >
      Vendor-supplied software we run inside our own network so their runtime can reach an MCP
      endpoint that is not publicly exposed. Outbound-only: it dials the vendor and carries
      their requests in, so no inbound rule is opened and the endpoint stays on a private
      address. Two things it does not do, on both vendors' own architecture notes: it does not
      make the data path local — requests and responses still traverse their cloud — and it
      does not authenticate to the upstream, which we still do ourselves. The tunnel token and
      the TLS private key on this host are the load-bearing secrets. Each hostname routes to
      one upstream, and the upstream here is the gateway's aggregate MCP endpoint — one
      hostname fronts every server the gateway admits, and the vault holds the gateway's own
      credential for it.
    items:
      - id: tunnelClient
        label: Outbound connector
        icon: plug
        note: Dials out to the vendor's edge; opens nothing inbound.

  - id: aiGateway
    kind: service
    title: AI gateway
    zone: zoneCloud
    col: 3
    row: 1
    note: >
      The customer-operated crossing where a vendor-hosted agent is admitted into our systems.
      The tunnel hands here rather than to the servers themselves, because the tunnel is
      transport and this is policy: the one component on that path where the reach is scoped,
      credentialed and recorded on our terms rather than theirs.
    items:
      - id: gwTools
        label: MCP & API gateway
        icon: plug
        note: Which of our servers a hosted agent may reach, and on whose grants.

  - id: internalTools
    kind: service
    title: Tool services
    cosaiComponent: componentTools
    zone: zoneCloud
    col: 3
    row: 2
    pack: toolServicesRemote
    note: >
      Our own MCP servers and connectors — the repositories, ticketing and systems of record a
      hosted agent is adopted in order to reach.

  - id: orgData
    kind: external
    title: Enterprise data
    cosaiComponent: componentDataSources
    zone: zoneCloud
    col: 3
    row: 3
    pack: enterpriseData
    note: The systems of record behind those servers, reached on grants we scope per session.

  - id: extTools
    kind: service
    title: Tool services
    cosaiComponent: componentTools
    zone: zoneExternal
    col: 4
    row: 3
    pack: toolServicesRemote
    note: >
      Third-party servers and connectors our gateway brokers outward — the same component as
      the internal surface, out where nobody we contracted with operates it.

  - id: downstream
    kind: external
    title: Downstream services
    cosaiComponent: componentDataSources
    zone: zoneExternal
    col: 4
    row: 4
    pack: downstreamPublic
    note: Where an action lands outside both environments, and where untrusted content returns from.

  - id: govIdentity
    kind: governance
    title: Identity services
    icon: person
    zone: zoneGovernance
    col: 0
    row: 5
    capabilities: [capabilityIga, capabilityNhiManagement]
    note: >
      Three layers to govern: our workload's identity to the vendor (federated, short-lived,
      never a pasted key), the per-user credentials the vault holds for our own servers, and
      the worker's environment key where we self-host. Mapping each back to a person and an
      expiry is ours to maintain, because the runtime keeps no principal per agent.

  - id: govSecrets
    kind: governance
    title: Secrets & key management
    icon: key
    zone: zoneGovernance
    col: 1
    row: 5
    capabilities: [capabilitySecretsManagement, capabilityEncryptionKeyManagement]
    note: >
      Per-user credential vaults and customer-managed keys over the platform's data — with
      the product-specific caveats (vault scoping, key exclusions) verified per exemplar
      rather than assumed of the class.

  - id: govPolicy
    kind: governance
    title: Policy & authorization
    icon: scale
    zone: zoneGovernance
    col: 2
    row: 5
    capabilities: [capabilityToolPermissionScoping, capabilityHitlControls]
    note: >
      What the hosted agent may reach in our systems, decided at our gateway rather than in
      their console — and the per-tool approval their connector configuration defaults to,
      which is worth leaving on.

  - id: govSupplyChain
    kind: governance
    title: Supply-chain assurance
    icon: db
    zone: zoneGovernance
    col: 3
    row: 5
    capabilities: [capabilityAgentRegistry, capabilityModelEvals, capabilityStagedRollout, capabilityAiTprm, capabilityVendorAssurance]
    note: >
      Definition admission, the behavioural checks in front of every change, staged rollout of
      the definitions themselves, and the platform assessment behind adopting the runtime at
      all — the change half of governance, kept apart from the traces.

  - id: govObservability
    kind: governance
    title: Observability & response
    icon: eye
    zone: zoneGovernance
    col: 4
    row: 5
    capabilities: [capabilityAgentObservability, capabilityAuditLogging, capabilityKillSwitch]
    note: >
      Their session event log fused with our gateway's record. A trail that exists only in
      their console is one we cannot query during an incident.

edges:
  - from: engineer
    to: agentDef
    path: primary
    label: authored & reviewed
    note: >
      The definition arrives through the ordinary delivery pipeline — written, reviewed,
      versioned — which is the property this whole page's distinction rests on.
  - from: endUser
    to: entry
    path: primary
    bidir: true
    route: vh
    label: request / response
    note: >
      Our users touch our surface: the front end binds who a session runs for before anything
      reaches the vendor, and the response returns the same way.
  - from: entry
    to: managedRuntime
    path: external
    bidir: true
    route: hv
    label: session invoke
    note: >
      Our code invokes their runtime over the SDK, carrying the delegated user context the
      front end bound, and the session stream carries everything after: events out, approvals
      and custom tool results back. The vendor-direct variant — no customer tier at all — is
      real for one exemplar class and recorded as a deviation, not drawn as a second path.
  - from: agentDef
    to: managedRuntime
    path: external
    label: deploy
    note: >
      One direction: the definition is pushed into an environment we do not operate. What it
      declares is the behaviour contract, and reviewing it is the last point at which we
      decide anything about the agent itself.
  - from: managedRuntime
    to: tunnel
    path: external
    bidir: true
    label: outbound-only tunnel
    note: >
      Their runtime reaching back into us through software they publish and we run. Note the
      direction: our side dials out, so nothing is opened inbound and the endpoint stays
      private. The public-endpoint form — their cloud calling an internet-facing URL of ours,
      admitted by IP allowlist — is recorded as a deviation rather than drawn as a second path.
  - from: tunnel
    to: aiGateway
    path: primary
    bidir: true
    label: tool call / result
    note: >
      The crossing this architecture exists to govern. The tunnel hands to our gateway rather
      than reaching past it into the tool surface, so the grants are ours to scope and ours to
      revoke.
  - from: aiGateway
    to: internalTools
    path: primary
    bidir: true
    label: brokered tool calls
    note: Which of our servers a hosted agent may call, on short-lived grants we issue.
  - from: internalTools
    to: orgData
    path: primary
    bidir: true
    label: scoped reads & writes
    note: The repositories and records the agent was adopted to work on.
  - from: aiGateway
    to: extTools
    path: external
    bidir: true
    route: hv
    label: brokered external calls
    note: >
      Third-party servers and connectors, reached through the crossing that admitted them —
      egress and returned-content classification enforced at our boundary.
  - from: extTools
    to: downstream
    label: action / returned content
    path: external
    bidir: true
    note: Actions landing outside, and the content they return.
  - from: managedRuntime
    to: downstream
    path: external
    bidir: true
    route: vh
    label: sandbox browsing
    note: >
      The provider's hosted browser and code interpreter reach the open web from their
      environment — a path that never touches anything we run, and this archetype's dominant
      untrusted ingress.

pins:
  risks:
    - risk: riskAgenticDelegationConfusedDeputy
      at: tunnel
      note: >
        Their infrastructure exercising our authority. The grant is the only thing bounding it,
        and the grant is issued at our gateway — which is the entire argument for drawing one.
    - risk: riskCrossTenantCredentialPropagation
      at: tunnel
      note: >
        The tunnel token and the TLS private key on this host are the load-bearing secrets on
        the path — together they let an attacker impersonate our proxy and read tool payloads,
        propagating our authority through infrastructure nobody watches.
    - risk: riskSensitiveDataDisclosure
      at: managedRuntime
      note: >
        Requests, context and tool results all live on their side, under their retention terms
        — and managed memory's scope is a configuration flag: cross-user scope means one
        user's content shapes another's turn, switched on without anyone deciding it.
    - risk: riskStaleAgentIdentityBinding
      at: managedRuntime
      note: >
        The agent acts on our systems as whatever the vault holds. A per-user credential that
        outlives the person it belonged to keeps acting as them, and nothing in the platform
        ties a vault entry to that person's lifecycle — the vendor auto-refreshes the token
        for as long as the refresh token works.
    - risk: riskShadowAndUnknownAgents
      at: agentDef->managedRuntime
      note: >
        An agent is an API call away. Without a registry the population is unbounded and
        invisible, and the definition is the only artifact that ever existed for review.
    - risk: riskRogueActions
      at: internalTools->orgData
      note: Writes into systems of record from a loop running somewhere we cannot watch.
    - risk: riskPromptInjection
      at: aiGateway->extTools
      note: Content returning from a brokered outbound action re-enters a context we do not hold.
    - risk: riskPromptInjection
      at: managedRuntime->downstream
      note: >
        The hosted browser reads the open web straight into the loop, vendor-side — the
        dominant untrusted ingress of this archetype, on a path with no customer control
        anywhere.

    - risk: riskToolSourceProvenance
      at: managedRuntime
      note: >
        Tool descriptions fetched vendor-side enter the loop as instruction, from servers named
        in the definition and vetted by nobody on the path.
    - risk: riskAgenticDelegationConfusedDeputy
      at: entry->managedRuntime
      note: >
        The delegation boundary: a service credential substituted for the user's context here
        means every downstream grant is the service's, not the person's.
    - risk: riskPromptInjection
      at: internalTools->orgData
      note: >
        A record somebody else authored comes back as a tool result and enters their runtime as
        instruction — classified at our gateway on the way, which is the only reason it can be.
  capabilities:
    - capability: capabilityIga
      at: entry
      note: Which of our people a session runs for, established at our front end before it starts.
    - capability: capabilityNhiManagement
      at: managedRuntime
      note: >
        Every vault entry, environment key and federated workload identity inventoried as a
        non-human identity with an owner and an expiry — because the runtime mints no
        principal per agent, and "revoke this agent" otherwise means finding every credential
        it was ever attached to. Where a platform does mint one, select for it.
    - capability: capabilitySecretsManagement
      at: tunnel
      note: >
        Two secret stores, neither on the agent. On their side, per-user vaults substituted at
        egress so the sandbox never holds a value — and, where no credential matches, the
        connection is attempted unauthenticated. On ours, the tunnel token and TLS key on this
        host, which the tunnel carries traffic on but never uses to authenticate to our server.
    - capability: capabilityEncryptionKeyManagement
      at: managedRuntime
      note: >
        Customer-managed keys over their storage — with the exclusion recorded: vault credential
        values sit under their keys, not ours.
    - capability: capabilityAgentRegistry
      at: agentDef->managedRuntime
      note: >
        Every definition registered and reviewed before deploy; there is no other artifact to
        review. Change-gating on the data path, per the recorded deviation.
    - capability: capabilityStagedRollout
      at: agentDef->managedRuntime
      note: >
        Immutable versions, a canary alias, and rollback that is a pointer flip — the
        software-delivery half of this page's distinction, applied to the definition.
    - capability: capabilityToolPermissionScoping
      at: aiGateway->internalTools
      note: Which servers, which tools, whose grant — decided at our tier because theirs is not ours to configure.
    - capability: capabilityHitlControls
      at: aiGateway->internalTools
      note: >
        Our gateway owns the gate: a consequential write is refused unless it carries an
        approval bound to the exact action — surfaced to the approver through our front end,
        with the vendor's per-tool approval defaults as the second, configured layer.
    - capability: capabilityToolPermissionScoping
      at: aiGateway->extTools
      note: >
        The gateway's registry of external destinations for the tools we chose to front — the
        subset that crosses our gateway. Hosted tools the provider calls from its own side never
        meet this list.
    - capability: capabilityPromptInjectionDefense
      at: aiGateway
      note: >
        Returned tool and connector content is classified at our crossing before it goes back
        to a loop we cannot see — enterprise-data returns included, because many hands wrote
        those records too.
    - capability: capabilityAiTprm
      at: managedRuntime
      note: >
        Their isolation, retention and tenancy assured by assessment rather than drawn — the
        only representation a vendor-internal control gets.
    - capability: capabilityAgentObservability
      at: govObservability
      note: >
        Their session event log exported and fused with our own record, so an incident has one
        queryable trail — assembled here, off the data path.
    - capability: capabilityAuditLogging
      at: govObservability
      note: Retained on our side, because a trail only in their console is one we cannot search.
    - capability: capabilityModelGuardrails
      at: managedRuntime
      note: >
        Their runtime applies the model-side checks; ours is a zone-2 configuration choice on
        their surface rather than a tier we operate.
    - capability: capabilityMemoryProtection
      at: managedRuntime
      note: >
        Memory scope is a flag on their platform, and the default is wider than most adopters
        assume. Setting it deliberately is the whole control.
    - capability: capabilityModelEvals
      at: agentDef->managedRuntime
      note: Behavioural checks against the definition before it ships, since the definition is all we control.
    - capability: capabilityAiGovernancePlatform
      at: govObservability
      note: The population view across every agent somebody deployed with an API call.

    - capability: capabilityToolPermissionScoping
      at: managedRuntime
      note: >
        Default-deny policy at their tool gateway — the floor a builder cannot lower, set in the
        tenant rather than enforced by us.
    - capability: capabilityRateLimiting
      at: entry
      note: >
        Per-session and per-user ceilings before the vendor meters the loop — a hosted browser
        steered into an open-ended run bills by the minute.
    - capability: capabilityKillSwitch
      at: govObservability
      note: >
        Disable the app in the tenant and revoke every connector grant — the SaaS form of the
        stop, and the response the departed-author and shadow-account scenarios actually invoke.
    - capability: capabilityVendorAssurance
      at: managedRuntime
      note: >
        The platform's defaults drift as it ships — memory scope, guardrail coverage,
        tool-gateway policy — and are re-assessed on a clock, not once.
walkthrough:
  title: A user's request becomes a tool call on our systems
  moves: >-
    A request through our front end to a runtime somebody else operates, reaching back into
    our data, and the answer coming home.
  steps:
    - follow: endUser->entry
      label: request, session bound
      note: The request arrives at our surface, and the session is bound to one of our people.
    - follow: entry->managedRuntime
      label: invoke with user context
      note: Our code invokes their runtime, carrying the delegated user context.
    - follow: managedRuntime->tunnel
      label: through the tunnel
      note: >
        Their runtime reaches back through software they publish and we run — outbound-only,
        so nothing is opened inbound. The data path is not local, and the tunnel does not
        authenticate for us.
    - follow: tunnel->aiGateway
      label: to our gateway
      note: Handed to our gateway rather than reaching past it into the tool surface.
    - follow: aiGateway->internalTools
      label: per-user grant
      note: Admitted to a named server on a short-lived, per-user grant.
    - follow: internalTools->orgData
      label: read/write on our side
      note: The read or write happens on our side, which is the only reason it is bounded.
    - follow: orgData->internalTools
      label: record
      note: The record comes back.
    - follow: internalTools->aiGateway
      label: recorded
      note: Through the crossing, where the call is recorded against the per-user grant.
    - follow: aiGateway->extTools
      label: outbound action
      note: Outbound actions leave through the same crossing, against the named-destination list.
    - follow: extTools->downstream
      label: effect lands
      note: >
        The effect lands outside.
    - follow: downstream->extTools
      label: returned content
      note: What returns starts its way back.
    - follow: extTools->aiGateway
      label: classified
      note: And is classified at our gateway before the hosted loop reads it as instruction.
    - follow: aiGateway->tunnel
      label: into the tunnel
      note: Back into the connector, bound for their cloud.
    - follow: tunnel->managedRuntime
      label: tool results
      note: The tool results land in their runtime, which finishes the turn.
    - follow: managedRuntime->entry
      label: completion
      note: The completion returns to our front end.
    - follow: entry->endUser
      label: attributable reply
      note: And to the person the session ran for, attributable end to end.

scenarios:
  - title: A credential outlives its owner
    steps:
      - follow: agentDef->managedRuntime
        label: deploy with vault reference
        note: An agent is deployed on a platform whose identity is a vault reference, not a principal.
      - follow: managedRuntime->tunnel
        label: stale credential presented
        note: >
          Sessions keep presenting that credential after the person has gone, because nothing in
          the platform ties it to their lifecycle. The tunnel carries it without looking.
      - follow: tunnel->aiGateway
        label: reaches our gateway
        note: The first hop we govern.
      - follow: aiGateway->internalTools
        label: noticed & cut
        note: Our gateway is where that can be noticed and cut, since it is the only hop we watch.
  - title: The hosted browser reads the web
    steps:
      - follow: managedRuntime->downstream
        label: browse on vendor side
        note: >
          The sandbox browses on the vendor's side — no customer control sits anywhere on
          the path.
      - follow: downstream->managedRuntime
        label: untrusted content
        note: Untrusted content enters the loop as instruction.
      - follow: managedRuntime->tunnel
        label: steered tool request
        note: >
          A steered loop now asks for our tools. The tunnel carries the request in without
          judging it — transport, not policy.
      - follow: tunnel->aiGateway
        label: first tier we control
        note: >
          The first tier we control, and the reason its per-call policy cannot assume a
          well-behaved caller.
      - follow: aiGateway->internalTools
        label: scope, approval, record
        note: Scope, approval and the record are what stand between the steered plan and our data.
  - title: A custom tool runs in our own code
    steps:
      - follow: endUser->entry
        label: request
        note: A request that will need something only our systems can answer.
      - follow: entry->managedRuntime
        label: session invoke
        note: Our code starts the session; the loop decides it needs the custom tool.
      - follow: managedRuntime->entry
        label: custom tool call
        note: >
          The agent emits the call and the session idles. No tunnel, no public endpoint:
          the request arrives on the stream our own application already holds.
      - follow: entry->managedRuntime
        label: tool result
        note: >
          Our handler runs it on our side, on our credentials, and posts the result back.
          The vendor sees the inputs and the output, never the credential or the network.
  - title: The definition moves to custom code
    steps:
      - follow: agentDef->managedRuntime
        label: escape hatch shipped
        note: >
          On a hyperscaler runtime the team hits a limitation and ships the escape hatch:
          their sandbox, their identity, but the loop is now our code — and it inherits only
          the guardrails it explicitly calls.
      - follow: managedRuntime->tunnel
        label: same path in
        note: Calls still arrive the same way, through the connector we run.
      - follow: tunnel->aiGateway
        label: per-call policy floor
        note: >
          Which is why our per-call policy is the floor that survives the migration — the
          platform's automatic guardrails did not.

deviations:
  - subject: The vendor band is drawn before our cloud band
    reason: >
      Band order is left-to-right by convention; here the vendor sits first because that is
      the direction of the work — a session reaches the vendor's runtime and the vendor
      reaches back into us second. The same break, for the same reason, as the low-code
      sibling.
  - subject: Definition admission, evaluation and staged rollout are pinned on the deploy edge
    reason: >
      All three are management-class capabilities cited from the supply-chain call-out, but
      what they gate — the definition — genuinely flows through the deploy edge, the
      ontology's own change-gating exception. The chips sit where the gate closes.
  - subject: One exemplar class is vendor-direct and has no customer front end
    reason: >
      Hosted background coding agents take a task and a grant and are driven from the
      vendor's own surfaces; for that class the endUser reaches the provider directly and the
      front-end tier this drawing requires does not exist. Recorded rather than drawn as a
      second topology — its compensating posture is the narrow repository grant.
  - subject: The AI gateway carries tool and data traffic only
    reason: >
      The provider calls its own model inside its own runtime — drawn as the Model inference
      item on the Managed runtime block, with no Model provider block on this drawing — and
      nothing fetches skills through our crossing. The gateway is drawn with its one real
      traffic class rather than the registered aiGatewayTraffic pack, following the low-code
      builder's precedent: the honest signal that a gateway is not on the model path is its
      own contents.
  - subject: The tunnel absorbs secrets consumption
    reason: >
      capabilitySecretsManagement is embodied by the AI gateway, but the load-bearing secrets
      on this path are the tunnel token and TLS key on the tunnel host — the pin sits where the
      credentials live, the issuance and rotation story in the governance call-out. The same
      absorption, for the same reason, as the enterprise chat drawing.
  - subject: The public-endpoint return path is recorded, not drawn
    reason: >
      Both first-party vendors also reach a customer MCP endpoint the ordinary way — their
      cloud calling an internet-facing URL of ours, admitted by allowlisting their IP ranges.
      That is the same crossing with weaker admission: audience-bound tokens, per-user OAuth
      and rate limiting on a public listener instead of an outbound-only connector. It is the
      form to draw where a vendor's tunnel is unavailable (one vendor's tunnel is a research
      preview with no continuity commitment), and it is recorded here rather than drawn as a
      second edge into the same gateway.
  - subject: The self-hosted sandbox variant is recorded, not drawn
    reason: >
      One exemplar lets tool execution move onto a worker we run — code, filesystem and egress
      inside our perimeter — while the loop, the model and the orchestration stay with the
      provider. The worker polls the provider outbound-only, the same shape as the tunnel, and
      tool inputs and outputs still cross to the loop. It would add a Sandboxed execution block
      to our cloud band; it is recorded here until the organisation adopts it, because a
      drawing that shows both variants at once implies a choice nobody has made. Two facts to
      carry into that drawing when it comes: placeholder-substituted credentials are not
      supported there, so secrets fall back to the worker's own custom tools, and the worker
      can act as the MCP client itself, in which case the provider sees only tool outputs.

  - subject: Hosted tools are an item on the runtime, not an edge to the external band
    reason: >
      Hosted MCP servers and connectors are called from the provider's side and never touch
      our network — the low-code sibling draws that as a platform-to-tools edge. Here the
      runtime's external reach is drawn once already (the hosted browser), and a second
      vendor-side arrow would cross the front end. The item carries the provenance risk and
      the zone-2 policy control; nothing of ours sits on the path either way.

