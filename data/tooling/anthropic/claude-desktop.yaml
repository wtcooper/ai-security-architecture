              verified: 2026-09-10
            - capability: capabilityBrowserDetectionResponse
              coverage: external
              mechanism: claude.ai is a browser SaaS; paste and upload inspection is the organisation's browser-security
                tooling
              note: Anthropic offers no in-page inspection; pair the tenant-restriction header with browser D&R or SSE
                inline controls.
              steps:
                - title: Instrument the browser session
                  body:
                    - Apply your browser-security policy to claude.ai and *.claudeusercontent.com and use the
                      tenant-restriction header to keep sessions in the corporate tenant.
                  url: https://support.claude.com/en/articles/13198485-enforce-network-level-access-control-with-tenant-restrictions
              verified: 2026-09-10
      - mitigation: cap-input-guardrails
        coverage: partial
        mechanism: >-
          Anthropic's model-layer defenses against injected instructions (no administrator setting); Inference
          hooks (Enterprise) hand each governed request, including connector tool calls and the results
          they return, to the organisation's AI security server before the next inference step
        steps:
          - title: Put a screen on returned connector content (Enterprise)
            body:
              - >-
                At Organization settings > Data and privacy > Inference hooks register an AI security server
                that classifies tool results for injection, set Failure handling to Block the request and turn
                on Enforce verdicts.
            url: https://platform.claude.com/docs/en/manage-claude/inference-hooks-configuration
          - title: Know what the vendor screening covers
            body:
              - >-
                The connector verification page tells members to stay aware of prompt injection "even though
                Claude has built-in protections"; Verified and Community labels are not a security audit of what
                a connector returns.
            url: https://claude.com/docs/connectors/verification
        note: >-
          Partial on the rule applied to every vendor: vendor-internal defenses documented only in general terms
          (no setting, threshold, quarantine or event an administrator can see), plus an inline hook that is an
          attach point until the organisation's server does the classifying. The hook returns allow or deny (no
          strip or quarantine), never receives system prompts or tool definitions, so a poisoned connector
          description is not seen, and ignores images. Claude.ai has no action classifier to lean on; restricting
          write tools limits what an injection can do, which is AML.M0028, not screening.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityPromptInjectionDefense
          reviewRequired: false
          original:
            - capability: capabilityPromptInjectionDefense
              coverage: partial
              mechanism: >-
                Anthropic model-side safeguards and web-fetch isolation; connector tool restrictions;
                Inference hooks for inline policy
              steps:
                - title: Limit what an injected instruction can do
                  body:
                    - Restrict connectors to read-only tools and enable only vetted connectors; use Inference hooks to deny
                      prompts carrying policy-violating content.
                  url: >-
                    https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities
              note: No admin-configurable injection classifier is exposed for chat.
              verified: 2026-09-10
