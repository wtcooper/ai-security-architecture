      - mitigation: cap-agent-action-policy-enforcement
        coverage: native
        mechanism: >-
          approvals.deny glob rules and the code-shipped hardline blocklist run before --yolo or
          approvals.mode off; HERMES_WRITE_SAFE_ROOT hard-blocks writes; pre_tool_call shell and plugin hooks
          can block or escalate any tool call and fail closed
        steps: &a1
          - title: Declare commands that must never run
            body:
              - Add quoted fnmatch globs under approvals.deny in ~/.hermes/config.yaml (for example "git push --force*",
                "dd if=* of=/dev/*"); they are matched against normalised command variants on every backend,
                return a BLOCKED error to the model and take effect without a restart.
            url: >-
              https://hermes-agent.nousresearch.com/docs/user-guide/security#user-defined-deny-rules-approvalsdeny
          - title: Fence file writes to a safe root
            body:
              - Set HERMES_WRITE_SAFE_ROOT=/path/to/project:/home/you/.hermes in ~/.hermes/.env; write_file and patch
                outside those prefixes are hard-blocked with no approval prompt, and credential paths such as
                ~/.ssh and .env stay blocked even inside the root.
            url: https://hermes-agent.nousresearch.com/docs/user-guide/security#file-write-safety
          - title: Add a pre_tool_call policy hook
            body:
              - 'Declare hooks.pre_tool_call entries in config.yaml with a matcher regex, a command and fail_closed: true;
                the script reads the tool call as JSON on stdin and blocks it by returning {"action": "block",
                "message": ...} or exiting 2, and a timeout blocks rather than proceeds.'
            url: https://hermes-agent.nousresearch.com/docs/user-guide/features/hooks#shell-hooks
          - title: Keep the approval mode manual on a work machine
            body:
              - "Set approvals.mode: manual so every flagged command prompts you instead of the smart mode's auxiliary-LLM
                auto-approval, and leave approvals.timeout at 300 so an unanswered prompt is denied."
            url: https://hermes-agent.nousresearch.com/docs/guides/secure-hermes-on-a-work-machine
        note: >-
          Deny globs and the hardline blocklist are deterministic; pre_tool_call hooks are an integration
          point that must be set fail_closed. Delegated subagents inherit approvals; MCP tool calls pass the
          hooks, a server's own actions do not.
        verified: 2026-09-10
        migration:
          from:
            - capabilityAgentRuntimeEnforcement
          reviewRequired: false
          original:
