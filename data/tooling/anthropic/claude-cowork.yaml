# Claude Cowork — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# Local and cloud Cowork sessions share one admin console (Organization settings > Cowork), but
# the cloud sessions run on a different runtime with a different drawing, so since 2026-09-17
# they are a second entity (toolClaudeCoworkCloud, archHostedAgentSessions) below; the desktop
# entity keeps the device MDM keys that reach only local sessions.
vendor: anthropic
family: Claude Cowork
tools:
  - id: toolClaudeCowork
    name: Claude Cowork
    surfaceClasses:
      - desktopApp
      - cloudAgent
    variants:
      - name: Cowork in Claude Desktop (local session in the Cowork VM sandbox)
        class: desktopApp
        url: https://claude.com/docs/cowork/overview
      - name: Cowork in the cloud (web, mobile, Chrome side panel; sessions on Anthropic servers)
        class: cloudAgent
        url: >-
          https://support.claude.com/en/articles/15520349-use-claude-cowork-on-web-desktop-and-mobile
        note: >-
          Announced 7 July 2026 (beta, Max first). "Run Cowork in the cloud" is on by default on Team; on
          Enterprise it turns on by default starting 10 September 2026 unless an owner already turned it off.
          Device managed settings do not reach these sessions.
      - name: Dispatch (background tasks) and scheduled tasks
        class: cloudAgent
        url: https://claude.com/docs/cowork/guide/dispatch
    architecture: archCodingAgentThirdParty
    status: ga
    asOf: "2026-09"
    summary:
      - >-
        Cowork is Anthropic's agentic workspace for non-developers: the Claude Code architecture inside Claude
        Desktop, working on the user's own files, connectors, skills and plugins, with sub-agents, browser use
        (Claude in Chrome or a built-in browser) and computer use. Local sessions run shell and document tools
        in a hardened VM on the device with file access scoped to connected folders and web fetches to an
        egress allowlist; cloud sessions (web, mobile, Chrome side panel) run on Anthropic's servers, save
        sessions and files to the account, keep working with every device offline, and can only touch local
        folders while the desktop app is open. Inference is the Anthropic API on first-party plans, or the
        organisation's provider on Claude Desktop on 3P.
      - >-
        Modelled as a third-party coding and desktop agent: it is the Claude Code runtime inside a vendor
        desktop app, driven by a present user who connects folders and approves tool calls, and administered
        through the same two planes as Claude Code (the claude.ai console and device managed configuration).
        It is not the self-hosted autonomous personal-agent class; the cloud variant stretches towards a
        managed agent runtime and is noted on the variant. Admin control is in the claude.ai console at
        Organization settings > Cowork: "Enable for your organization", "Run Cowork in the cloud", the
        built-in browser toggle, "Allow 'Automatically approve' mode", "Allow 'Always allow' for connector
        tools", an OTLP collector for session events, and curated plugin marketplaces (Installed by default /
        Available / Required / Not available), with role-based access on Enterprise; on the device, Claude
        Desktop's managed configuration (com.anthropic.claudefordesktop, HKLM\SOFTWARE\Policies\Claude) adds
        allowedWorkspaceFolders, coworkEgressAllowedHosts, disabledBuiltinTools, disableBypassPermissionsMode
        and coworkTabEnabled. Cowork sessions never fetch Claude Code server-managed settings. No behavioural
        baseline or drift detection is offered; the OTLP event stream is the raw material if one is built.
    facts:
      - label: Plans
        value: >-
          Pro, Max, Team and Enterprise in Claude Desktop; web and mobile in beta for Pro, Max and Team and
          for Enterprise where admins enable it; Claude Desktop on 3P runs Cowork on Bedrock, Vertex, Foundry
          or a gateway.
        url: >-
          https://support.claude.com/en/articles/15520349-use-claude-cowork-on-web-desktop-and-mobile
      - label: Inference & routing
        value: >-
          Anthropic API (first-party) or the provider configured in Claude Desktop managed configuration
          (inferenceProvider gateway / bedrock / vertex / foundry / anthropic) on 3P deployments.
        url: https://claude.com/docs/third-party/claude-desktop/configuration
      - label: Data leaving the device
        value: >-
          Prompts, the contents of files in connected folders that Claude reads, tool outputs, browser page
          content and connector data go to the model provider; cloud sessions store sessions and files in the
          account; the OTLP exporter (inside the VM, subject to egress rules) sends events to the
          organisation's collector.
        url: https://claude.com/docs/cowork/monitoring
      - label: Retention & training
        value: >-
          Local conversation history stays on the device outside standard retention (Compliance API captures
          local sessions server-side for 6 years or the custom period); cloud sessions are saved to the
          account (remote transcripts 6 years unless deleted). Cowork is not covered by ZDR. Commercial terms:
          no training.
        url: https://platform.claude.com/docs/en/manage-claude/compliance-sessions
      - label: Usage limits & models
        value: >-
          Organisation, group and per-user usage limits (Organization settings > Usage) are shared across
          Cowork, Claude Code and chat, with no per-task budget; model access and effort caps under
          Organization settings > Models are enforced across most Claude products including Cowork.
        url: https://support.claude.com/en/articles/14782391-claude-enterprise-consumption-guide
      - label: Network path
        value: >-
          TLS to the provider; egressProxyUrl / egressProxyPacUrl in Claude Desktop managed configuration
          route app and agent traffic; HTTPS_PROXY, NODE_EXTRA_CA_CERTS and CLAUDE_CODE_CLIENT_CERT/KEY are
          read from managed and user settings only in app-managed sessions, never from repository settings.
        url: https://code.claude.com/docs/en/network-config
      - label: Docs index
        value: claude.com/docs/cowork plus the Help Center Cowork on Team and Enterprise article
        url: https://claude.com/docs/cowork/overview
    riskNotes:
      - risk: riskPromptInjection
        note: >-
          Cowork reads documents, web pages (via the built-in browser or Claude in Chrome) and connector
          results as instructions with "Automatically approve" on by default; the egress allowlist and
          connector tool approvals are the containment.
      - risk: riskRogueActions
        note: >-
          "Always allow" for connector tools is off by default because it removes the per-tool prompt; bypass
          permissions mode can be removed with disableBypassPermissionsMode in managed configuration.
      - risk: riskSensitiveDataDisclosure
        note: >-
          Users can attach home folders, Documents, AppData and whole drives (September 2026);
          allowedWorkspaceFolders in managed configuration is the fence. OTLP export carries only metadata by
          default; an admin can opt in to prompt, response and tool-argument content via otlpContentCapture on
          the Team/Enterprise console integration.
      - risk: riskShadowAndUnknownAgents
        note: >-
          Cloud sessions, Dispatch and scheduled tasks run unattended without a device; the Enterprise console
          can enable cloud capability per group, and the Compliance API lists remote Cowork sessions including
          agent-owned scheduled runs.
      - risk: riskToolSourceProvenance
        note: >-
          Users can add plugin marketplaces by URL and upload plugins; admins curate marketplaces (Installed
          by default, Available, Required, Not available) and can disable user marketplaces and uploads.
    controls:
      - mitigation: cap-input-guardrails
        coverage: partial
        mechanism: >-
          Auto-mode classifier ("Automatically approve"), browser safety classifiers, egress allowlist;
          Enterprise Inference hooks govern Cowork prompts
        steps: &a1
          - title: Keep tool approvals in the loop
            body:
              - Leave "Allow 'Always allow' for connector tools" off and consider turning off "Allow 'Automatically
                approve' mode" under Organization settings > Cowork > Permissions for sensitive teams.
            url: >-
              https://support.claude.com/en/articles/13455879-use-claude-cowork-on-team-and-enterprise-plans
          - title: Inspect prompts inline (Enterprise, beta)
            body:
              - Inference hooks send every governed Cowork prompt, including tool results, to your AI security server for
                an allow/deny verdict before inference.
            url: https://platform.claude.com/docs/en/manage-claude/inference-hooks
        note: >-
          The auto-mode and browser classifiers screen proposed actions; the egress allowlist contains.
          Document and connector content is not classified for injected instructions.
        verified: 2026-09-10
        migration:
          from:
