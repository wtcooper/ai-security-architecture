                  url: https://hermes-agent.nousresearch.com/docs/reference/cli-commands
                - title: Invalidate sandbox credentials
                  body:
                    - hermes egress setup --rotate-tokens mints fresh proxy tokens and hermes egress stop
                      kills the daemon so old tokens stop working; restart running sandboxes too.
                  url: https://hermes-agent.nousresearch.com/docs/reference/cli-commands
                - title: Undo file damage
                  body:
                    - "With checkpoints.enabled: true Hermes snapshots the project before destructive
                      operations into ~/.hermes/checkpoints/store/; /rollback diff <N> previews and /rollback
                      <N> restores."
                  url: https://hermes-agent.nousresearch.com/docs/user-guide/checkpoints-and-rollback
              note: >-
                Decommissioning means deleting the profile directory yourself and rotating every provider and
                platform token it held; quarantine from peers is only A2A_TRUSTED_PEERS on the other agents.
              verified: 2026-09-10
