      provider: https://docs.aws.amazon.com/bedrock/latest/userguide/what-is-bedrock.html
      internalTools: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-supported-targets.html
      openWeb: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-integrations.html
      registry: https://docs.aws.amazon.com/codeartifact/latest/ug/welcome.html
    differences:
      - at: harness->gateway
        text: "Strands calls Amazon Bedrock directly with the function's IAM role unless told otherwise. To send model calls through the gateway, add inference targets, point the model client at the gateway, and leave bedrock:InvokeModel out of the function's role."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-targets-inference.html
      - at: events->harness
        text: "Started from an SQS queue mapping, the whole run must finish within 15 minutes, so it cannot wait days for approval. Put a small ordinary Lambda between the queue and the workflow to start it asynchronously; EventBridge rules already start it that way."
        url: https://docs.aws.amazon.com/lambda/latest/dg/durable-invoking-esm.html
      - at: operator->events
        text: "Approvals do not return through EventBridge or SQS. The approval service calls Lambda's SendDurableExecutionCallbackSuccess API directly with the callback ID, so that IAM permission, not the trigger path, is what you must restrict."
        url: https://docs.aws.amazon.com/lambda/latest/dg/durable-security.html
      - at: subagents
        text: "All agents run in one function under one IAM role, so AWS itself cannot tell them apart. Separate identities exist only as per-agent OAuth clients whose tokens your code attaches; nothing on AWS stops one agent's code using another's token."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/creating-agent-identities.html
      - at: provider
        text: "Amazon Nova models can search the web themselves (Web Grounding) inside the Bedrock call, where no gateway policy sees it. It needs bedrock:InvokeTool on the nova_grounding system tool; leave that permission out of the agent's role."
        url: https://docs.aws.amazon.com/nova/latest/nova2-userguide/web-grounding.html
      - at: gateway->openWeb
        text: "AWS also has its own web search. As a gateway connector it stays behind the gateway, but the InvokeWebSearch API and AgentCore Browser are called directly with IAM and skip it. Do not grant those permissions to the agent's role."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/web-search-api.html
      - at: gateway->openWeb
        text: "The gateway is AWS-managed and reaches public targets itself; it enters your VPC only for targets given a private endpoint. Your Network Firewall therefore does not filter gateway calls. Control them through the target list, policies and who may create targets."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-vpc-egress.html
      - at: localTools->registry
        text: "Lambda code and its packages are fixed at deployment (zip, layer or container image), not installed at run time. Code Interpreter in Sandbox mode is documented as reaching only Amazon S3, so it cannot pull from CodeArtifact without VPC mode."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/code-interpreter-resource-management.html
    alsoNeeded:
      - service: "Amazon Cognito"
        role: identity
        why: "Issues the per-agent machine tokens that the gateway's JWT authorizer validates."
        url: https://docs.aws.amazon.com/cognito/latest/developerguide/what-is-amazon-cognito.html
      - service: "AgentCore Identity"
        role: identity
        why: "Workload identity for each agent and credential providers for outbound tokens."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/identity.html
      - service: "Intermediary AWS Lambda function"
        role: other
        why: "Needed between SQS and the durable function for any run longer than 15 minutes."
        url: https://docs.aws.amazon.com/lambda/latest/dg/durable-invoking-esm.html
      - service: "Operator notification and approval service (for example Amazon SNS plus your own app)"
        role: other
        why: "Something must notify the operator and send the callback; AWS's example leaves it to you."
        url: https://docs.aws.amazon.com/lambda/latest/dg/durable-examples.html
      - service: "Amazon SQS dead-letter queue"
        role: other
        why: "Durable functions support dead-letter queues, not Lambda destinations, for failed invocations."
        url: https://docs.aws.amazon.com/lambda/latest/dg/durable-invoking.html
      - service: "Amazon VPC with NAT gateway and AWS Network Firewall"
        role: network
        why: "Lambda in private subnets needs a NAT route; the firewall filters what leaves."
        url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-vpc.html
      - service: "AWS KMS"
        role: keys
        why: "Customer managed key for durable execution data, plus gateway, memory and token vault."
        url: https://docs.aws.amazon.com/lambda/latest/dg/durable-encryption.html
      - service: "AWS Secrets Manager"
        role: secrets
        why: "AgentCore Identity credential providers keep OAuth client secrets and API keys there."
        url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html
      - service: "Amazon ECR"
        role: registry
        why: "Holds the function's container image if Strands and its dependencies ship as an image."
        url: https://docs.aws.amazon.com/lambda/latest/dg/images-create.html
      - service: "AWS WAF on the gateway"
        role: ingress
        why: "Only if the gateway endpoint is reachable from outside; one web ACL per gateway."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-waf.html
      - service: "Amazon CloudWatch and AWS CloudTrail"
        role: logging
        why: "Transaction Search must be switched on once; data events are off by default."
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/observability-configure.html
