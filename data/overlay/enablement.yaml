# The Enable layers: what to put in place, in the order an organisation puts it in place.
#
#   1. foundations  enterprise controls every AI deployment needs, set up once
#   2. surfaces     what one deployment surface adds on top of the foundations
#   3. use case     derived, never authored: the capabilities an architecture pins that
#                   neither layer above already holds
#   4. tools        each product's own settings against every capability its architecture pins
#
# A foundation must apply on every surface, a baseline capability must apply on its surface,
# and no capability sits in two layers. The build fails otherwise.
foundations:
  - id: identity
    title: Identity & access
    blurb: >-
      Every person, agent and workload signs in, holds only the access it needs, and never
      carries a credential it could leak into a prompt.
    mitigations: [D3-MFA, D3-APA, D3-AA, D3-CH, D3-CTS]
  - id: gateway
    title: AI gateway & data protection
    blurb: >-
      One governed path to models and the outside world: screen what goes in, redact what
      should not leave, allow-list where agents may connect, and cap usage.
    mitigations: [cap-input-guardrails, cap-sensitive-data-redaction, cap-agent-egress-control, AML.M0004]
  - id: inventory
    title: Inventory & supplier review
    blurb: >-
      Know which AI is in use, sanctioned or not, which agents and tool servers are approved,
      and that each supplier has been assessed.
    mitigations: [cap-agent-tool-registry, cap-shadow-ai-discovery, cap-ai-vendor-assessment]
  - id: monitoring
    title: Monitoring & response
    blurb: >-
      Record what every agent did, end to end, and be able to stop one immediately.
    mitigations: [cap-agent-tracing, cap-agent-kill-switch]

surfaces:
  surfaceEndpoint:
    blurb: >-
      Agents running on managed devices act with the user's own files, shell and credentials,
      so the device has to contain what they run and watch what they do.
    mitigations: [D3-EI, D3-PA, D3-FA, cap-mcp-tool-integrity, cap-agent-action-policy-enforcement]
  surfaceCloud:
    blurb: >-
      Agents and models you operate need the workload controls any production service has,
      plus policy on every action, scoped retrieval and gated releases.
    mitigations: [D3-EI, D3-NI, cap-mcp-tool-integrity, cap-agent-action-policy-enforcement, cap-data-access-governance, AML.M0036, cap-staged-rollout-gate]
  surfaceSaas:
    blurb: >-
      With vendor-hosted AI the controls collapse to the edges: what its connectors may reach
      on the user's behalf, and how much it may run and spend.
    mitigations: [cap-data-access-governance, AML.M0036]
