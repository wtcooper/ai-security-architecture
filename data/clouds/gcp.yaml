        differences:
          - at: events->planner
            text: "Pub/Sub can push only to an HTTPS endpoint on the public web, so on a private cluster the agent pulls instead. No signed delivery names the caller: whoever holds Pub/Sub Publisher on the topic can start a run, so the topic's IAM policy is now the gate, and you build the subscriber that hands each message to the agent."
            url: https://docs.cloud.google.com/pubsub/docs/subscriber
          - at: planner
            text: "Nothing limits a Pod's outbound traffic until you configure it: by default every Pod can talk to every other Pod, GKE nodes have external IP addresses, and no network policy applies. The egress allowlist holds only with private nodes, network policy enforcement and the proxy route all in place."
            url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/hardening-your-cluster
          - at: planner->gateway
            text: "The agent's identity is its Kubernetes ServiceAccount only where Workload Identity Federation for GKE is on for the cluster and node pool (always on in Autopilot). Without it the node service account's credentials are exposed to workloads. adk deploy gke uses the default ServiceAccount in the default namespace, so give the agent its own."
            url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/workload-identity
          - at: localTools
            text: "Generated code still goes to Agent Platform Code Execution, outside the cluster, by choice: Google says the calling agent can run anywhere. Google's GKE guidance isolates untrusted code with GKE Sandbox instead, so running it in a Pod beside the agent needs a gVisor or microVM runtime (Agent Sandbox on GKE) and its own network policy."
            url: https://docs.cloud.google.com/architecture/choose-agentic-ai-architecture-components
          - at: gateway
            text: "Agent Gateway reaches GKE as a Preview you run yourself: a GKE Gateway for inbound traffic and Secure Web Proxy for outbound, on GKE 1.37.2 or later from the Rapid channel, in europe-west1 and us-central1 only. Apigee remains the gateway in this mapping."
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/gateways/gke-overview
        alsoNeeded:
