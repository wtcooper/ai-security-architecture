          organisation-level web settings apply to the Messages API only). auto is a model's judgement, not a
          deterministic decision point: it reads user.message content as intent, so relayed end-user input can
          get a call allowed. Any workspace key can loosen a policy for one session with agent_with_overrides,
          or for an idle running session with a tools update; agent updates reach only sessions created
          afterwards. Custom tools return to the application unevaluated.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityAgentRuntimeEnforcement
            - capabilityModelGuardrails
          reviewRequired: false
          original:
            - capability: capabilityAgentRuntimeEnforcement
              coverage: native
              mechanism: >-
                permission_policy per toolset and per tool (always_allow, always_ask, auto) evaluated by the
                server before a built-in or MCP tool runs; auto denials cannot be overridden by the client;
                evaluated_permission recorded on every tool event
              steps:
                - title: Gate the tools a person must see with always_ask
                  body:
                    - Set permission_policy always_ask on bash and on every MCP toolset (their default) so the session pauses
                      with requires_action until a user.tool_confirmation arrives; always_ask is the
                      deterministic gate, auto is the server's own reviewer.
                  url: https://platform.claude.com/docs/en/managed-agents/permission-policies
                - title: Keep the evaluation in your audit record
                  body:
                    - Store evaluated_permission and the evaluation object (policy type, reason_code) from each agent.tool_use
                      and agent.mcp_tool_use event; a call denied under auto carries reason_code high_risk and
                      cannot be re-allowed.
                  url: https://platform.claude.com/docs/en/managed-agents/permission-policies
              note: >-
                Custom tools are not governed: the runtime returns agent.custom_tool_use to your application
                unevaluated, so the same decision must exist there. Policy changes apply to sessions created
                afterwards, not running ones. Under auto, what you post in user.message counts as your intent
                — relayed end-user input can get a call allowed, so keep always_ask on anything that user must
                not run unreviewed.
              verified: 2026-09-15
            - capability: capabilityModelGuardrails
              coverage: partial
              mechanism: Anthropic's model safety systems (content blocks can be redacted by model policy); web tool domain
                lists; no organisation-level content filter applies to Managed Agents sessions
              steps:
                - title: Note what the Console settings do not cover
                  body:
                    - Organisation-level web search and fetch settings in the Console apply to the Messages
                      API only; configure allowed_domains / blocked_domains on the toolset instead.
                  url: https://platform.claude.com/docs/en/managed-agents/tools
              note: "Vendor-operated safeguard, not an organisation-configured policy: Anthropic's model safety systems act
                on every session, and the domain lists bound web tools, but no denied-topic, blocked-term or
                output filter is configurable. Rated partial on the same rule as Claude Code on the web,
                Copilot cloud and Codex cloud."
              verified: 2026-09-10
      - mitigation: D3-CTS
        coverage: native
        mechanism: >-
          Vault credentials substituted at egress: mcp_oauth and static_bearer keyed to an mcp_server_url
          (normalised exact match), environment_variable keyed by secret_name with networking.allowed_hosts
          and injection_location header / body; values are write-only and the sandbox holds an opaque
          placeholder; vault_ids chosen per session, one vault per end user
        steps:
          - title: Hold one user's credentials in one vault
            body:
              - >-
                Create a vault per end user, add mcp_oauth (with refresh) or static_bearer credentials keyed
                by mcp_server_url, and pass only that user's vault in vault_ids when you create the session.
            url: https://platform.claude.com/docs/en/managed-agents/vaults
          - title: Bind environment secrets to named hosts and headers
            body:
              - >-
                Create environment_variable credentials with networking type limited, the exact allowed_hosts,
                and injection_location {"header": true}, so the secret is substituted only into request
                headers to those hosts.
            url: https://platform.claude.com/docs/en/managed-agents/vaults
          - title: Run token exchanges outside the sandbox
            body:
              - >-
                Perform OAuth client-credentials and other exchange flows in your application and store the
                resulting token in the vault, because a token returned into the sandbox arrives unredacted.
            url: https://platform.claude.com/docs/en/managed-agents/vaults
        note: >-
          Native by the credential-scoping rule: credentials stay out of the sandbox and the model's context
          and are presented only to the destination they are keyed to, and per-user vaults are the documented
          model ("the collection of credentials associated with an end user"). Boundaries: vaults are
          workspace-scoped, so which user's vault a session gets is the application's binding — any key with
          workspace access can attach any vault; in a multiagent session the vaults apply to every thread
          whose definition declares the matching server; the first matching vault wins; with no match the
          connection is attempted unauthenticated; an environment_variable credential set to unrestricted is
          substituted for any host, and that type is not supported on self-hosted sandboxes. The tunnel
          carries traffic without authenticating to the upstream.
        verified: "2026-09-25"
        migration:
          from:
            - capabilityCredentialIsolation
          reviewRequired: false
          original:
            - capability: capabilityCredentialIsolation
              coverage: native
              mechanism: >-
                Vault credentials substituted at egress (the sandbox holds a placeholder; values are
                write-only); per-session secret for self-hosted workers; the environment service key scoped to
                one environment's work queue
              steps:
                - title: Attach credentials through vaults, never the environment
                  body:
                    - Register mcp_oauth, static_bearer or environment_variable credentials in a vault and
                      pass vault_ids at session creation; the agent sees only an opaque placeholder and the
                      proxy substitutes the value for matching hosts.
                  url: https://platform.claude.com/docs/en/managed-agents/vaults
                - title: Scope self-hosted credentials per session
                  body:
                    - Pass the per-session secret only into the sandbox serving that session, keep the
                      environment key in a secrets manager and out of images, and give each trust boundary its
                      own workspace and environment.
                  url: https://platform.claude.com/docs/en/managed-agents/self-hosted-sandboxes-security
              note: >-
                A vault credential is presented for every session the vault is attached to, so tenant- scoped
                delegation — one user's authority rather than a shared credential — is your arrangement
                through per-user vaults or per-user mcp_oauth, not the runtime's default. Where no credential
                matches a server, the connection is attempted unauthenticated.
              verified: 2026-09-15
