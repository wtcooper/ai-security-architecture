    verified: "2026-11-18"
  - id: attachmentSubnetFirewall
    name: "Cloud NGFW network firewall policy on the network attachment subnet"
    where: "VPC network › dedicated subnet (minimum /28) of the Private Service Connect network attachment › network firewall policy rules with that subnet as source"
    setVia: [apiCli, adminConsole]
    area: network
    recommended: "High-priority allow rules from the attachment subnet to your tool and proxy addresses only, with a low-priority rule that denies all other egress."
    value: "Allow tool and proxy addresses only; deny the rest"
    why: "Once agent traffic enters your VPC it can reach anything the VPC can route to. Rules on the attachment subnet are what narrow it."
