# Cursor — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# Excluded: Cursor Origin (git forge, early beta 2026-08-17) — a code-hosting service, not an agent
# runtime; recorded as facts on toolCursorCloudAgents (cloud-agents.yaml) and in README Exclusions.
vendor: cursor
family: Cursor
tools:
  - id: toolCursor
    name: Cursor
    surfaceClasses:
      - desktopApp
      - endpointCli
      - cloudAgent
    variants:
      - name: Cursor IDE
        class: desktopApp
        url: https://cursor.com/docs/enterprise/deployment-patterns
      - name: Cursor CLI (agent)
        class: endpointCli
        url: https://cursor.com/docs/cli/overview
      - name: Cursor for iOS / Web — Remote Control of a local agent
        class: cloudAgent
        url: https://cursor.com/docs/cloud-agent/mobile
    architecture: archCodingAgentThirdParty
    status: ga
    asOf: "2026-09"
    summary:
      - >-
        Cursor is a VS Code-derived IDE and a companion CLI (installed as `agent`) that run an
        agent on the developer's machine with the developer's own credentials. Inference is never
        local: prompts and code context go to Cursor's backend (api2/api5.cursor.sh) and on to the
        model providers Cursor routes to, most under zero-data-retention terms, with Privacy Mode
        on by default for Enterprise teams and enforceable so members cannot switch it off. The
        Remote Control variant (Cursor 3.9.8+, iOS / web) moves only the agent loop to Cursor's
        cloud; terminal, file and git tool calls still execute on the developer's computer.
      - >-
        Admin control has two channels. MDM device policies (AllowedTeamId, AllowedExtensions,
        WorkspaceTrustEnabled, UpdateMode, ExtensionGalleryServiceUrl) ship as a macOS
        .mobileconfig, Windows ADMX or ~/.cursor/policy.json on Linux, and MDM can also drop
        ~/.cursor/permissions.json and an enterprise hooks.json. The Enterprise team dashboard
        pushes Run Mode policy, Model Access Control, MCP Configuration, Team Rules, Team hooks
        (synced every thirty minutes), Repository Blocklist, Protected Git Scopes, Browser Controls
        and .cursor Directory Protection; dashboard and hard-coded sandbox rules cannot be weakened
        by user or project files.
      - >-
        Two things leadership should hold onto. First, the docs are candid that the Auto-review
        classifier "can make mistakes" and that .cursorignore "is not a security boundary" — the
        hard controls are the sandbox policy, permissions.json deny rules and hooks that fail
        closed. Second, the local sandbox has had a steady run of escapes in 2026 (git hooks,
        .claude hook files, working-directory and symlink canonicalisation, privileged Docker
        containers, tampered venvs), all fixed by 3.0–3.1.2, plus an unfixed Windows
        C:\ProgramData\Cursor\hooks.json trust issue (CVE-2026-35603). Anysphere became a SpaceX
        subsidiary on 2026-08-15, which changes the vendor-risk file.
    facts:
      - label: Plans
        value: >-
          Free, Pro, Pro+, Ultra, Teams and Enterprise. Nearly every admin control on this entity is
          labelled Enterprise: SCIM, MDM policies, Model Access Control, MCP Configuration, Run Mode
          policy, Repository Blocklist, .cursor Directory Protection, Browser Controls, audit log,
          SIEM streaming, OpenTelemetry export, Admin API and service accounts.
        url: https://cursor.com/docs/enterprise
      - label: Inference & routing
        value: >-
          Cloud-hosted only. The app talks to Cursor backends (*.cursor.sh, *.cursorapi.com,
          *.cursor-cdn.com, *.cursorvm.com; api2.cursor.sh for API, api5.cursor.sh for agent
          traffic) over TLS 1.2+ with certificate pinning, defaulting to HTTP/2 with an HTTP/1.1 SSE
          fallback; SSL inspection of these domains is documented as a cause of agent failures.
          Model Access Control (Team Settings → Models) fixes which providers and models a team may
          use and can block personal API keys (OpenAI, Anthropic, Azure, AWS Bedrock); Auto-review
          needs Claude 4.5 Haiku or GPT-5.4 Mini enabled for the team.
        url: https://cursor.com/docs/enterprise/network-configuration
      - label: Data leaving the device
        value: >-
          Prompts and code context for every LLM request; the codebase index; MCP traffic to whatever
          servers are configured (terminal and MCP tools cannot be stopped by .cursorignore). Cloud
          Agents are the only feature that stores code, temporarily while a run executes. With
          Privacy Mode on, code is never used for training by Cursor or providers; models that keep
          inputs for provider-side safety review (Claude Fable 5/5.1) are disabled until an admin
          approves them.
        url: https://cursor.com/docs/enterprise/privacy-and-data-governance
      - label: Data retention / training
        value: >-
          Privacy Mode is on by default for Enterprise teams and enforceable org-wide; most models run
          under zero-data-retention agreements, ZDR does not apply when members bring their own API
          keys, and Claude Fable models retain inputs and outputs for Anthropic harm-prevention review
          (not training). Sub-processors are listed on the trust portal.
        url: https://cursor.com/help/security-and-privacy/privacy
      - label: Docs index
        value: Enterprise documentation hub (identity, security hardening, LLM safety, models and integrations, compliance, network, OpenTelemetry, deployment patterns).
        url: https://cursor.com/docs/enterprise
      - label: Vendor ownership
        value: >-
          SpaceX closed its $60 billion all-stock acquisition of Anysphere (Cursor) on 2026-08-15;
          Cursor now operates as part of SpaceX and its Grok Bot product is co-branded with SpaceXAI.
          Reassess subprocessor, data-residency and contract terms accordingly.
        url: https://techcrunch.com/2026/08/15/spacex-officially-closes-its-cursor-acquisition/
      - label: Certifications
        value: SOC 2 Type II, ISO/IEC 27001:2022, ISO/IEC 42001:2023 and AIUC-1; annual third-party pen test; no infrastructure in China; vulnerability reports to security-reports@cursor.com.
        url: https://cursor.com/security
    items:
      - title: Identity and device management
        body:
          - SAML 2.0 SSO (password auth can be blocked), SCIM provisioning with group sync, and
            three dashboard roles. MDM policies for macOS and Windows cover Allowed Team IDs (blocks
            personal-account login on corporate devices), an Allowed Extensions allowlist (Cursor
            2.1+) and Workspace Trust enforcement.
        links:
          - title: Cursor enterprise identity and access management
            url: https://cursor.com/docs/enterprise/identity-and-access-management
      - title: Privacy, model and MCP control
        body:
          - Privacy Mode is default-on for Enterprise teams and admins can enforce it so members
            cannot disable it; model access is set per team and per organisation group, and BYOK API
            keys can be blocked. MCP servers are governed by a dashboard allowlist with wildcard
            matching, per-server tool restrictions and per-server network policies, distributable to
            endpoints as ~/.cursor/permissions.json via MDM — admin settings take precedence over
            the local file and editor settings.
        links:
          - title: Model and integration management
            url: https://cursor.com/docs/enterprise/model-and-integration-management
          - title: Privacy and data governance
            url: https://cursor.com/docs/enterprise/privacy-and-data-governance
      - title: Agent run-mode policies and audit
        body:
          - Enterprise Run Mode policies (Cursor 3.6+) set the terminal posture — Auto-review,
            Allowlist, or Run Everything — and the docs are candid that the allowlist is
            best-effort, not a security boundary; hooks can scan prompts, block commands and redact
            secrets, and .cursorignore is likewise documented as not a boundary. Enterprise audit
            logs record admin and account events (explicitly not agent responses or generated code),
            stream to SIEM, and the Admin API exposes members, usage, spend, repo blocklists and
            model access.
        links:
          - title: LLM safety and controls
            url: https://cursor.com/docs/enterprise/llm-safety-and-controls
          - title: Compliance and monitoring
            url: https://cursor.com/docs/enterprise/compliance-and-monitoring
    riskNotes:
      - risk: riskPromptInjection
        note: >-
          Cursor's own mitigation is an LLM classifier (Auto-review) that the docs say can allow a
          call you would have blocked; the deterministic layer is sandbox.json plus permissions.json
          deny rules and hooks. Rules files, AGENTS.md and .cursor/* are instruction surfaces an
          attacker can reach through a repository (Rules File Backdoor), which is what .cursor
          Directory Protection and enforced Team Rules are for.
      - risk: riskToolSourceProvenance
        note: >-
          MCPoison (CVE-2025-54136) showed trust bound to an MCP server's name rather than its
          command; since 1.3 any change to an MCP configuration re-prompts. The Enterprise MCP
          allowlist matches command and URL patterns, so a pinned pattern is the only provenance
          check the vendor ships — the org must curate the Team Marketplace itself.
      - risk: riskRogueActions
        note: >-
          Run Everything mode removes every gate; the Enterprise Run Mode policy is the switch that
          takes it away from members. Five sandbox-escape advisories in 2026 mean the sandbox is a
          blast-radius reducer, not a guarantee; keep the fleet on 3.1.2 or later.
      - risk: riskSensitiveDataDisclosure
        note: >-
          .cursorignore is a convenience filter that terminal and MCP tools bypass; beforeReadFile and
          beforeSubmitPrompt hooks (failClosed) and the sandbox's protected paths are the controls
          that hold. ZDR is lost the moment a member uses a personal API key, which Model Access
          Control can block.
      - risk: riskInsecureIntegratedComponent
        note: >-
          The extension marketplace is a second supply chain inside the IDE: AllowedExtensions,
          Install Cooldown and ExtensionGalleryServiceUrl decide what can be installed; the
          .claude/settings.local.json hook escape (CVE-2026-48124) shows sibling-tool config files
          in a workspace are also executable surface.
    controls:
      - capability: capabilityIga
        coverage: native
        mechanism: Enterprise dashboard SSO (SAML 2.0) and SCIM 2.0; MDM policy AllowedTeamId / cursorAuth.allowedTeamId
        steps:
          - title: Turn on SSO and SCIM
            body:
              - Configure SAML 2.0 SSO (Okta, Azure AD, Google Workspace, OneLogin) in the team dashboard and enable SCIM 2.0 provisioning with group sync; both require Enterprise and SCIM requires SSO.
            url: https://cursor.com/docs/enterprise/identity-and-access-management
          - title: Pin corporate devices to your team
            body:
              - Set the MDM policy AllowedTeamId to the comma-separated list of authorised team IDs so personal accounts cannot sign in on managed devices; deploy via the shipped .mobileconfig (bundle com.todesktop.230313mzl4w4u92), the ADMX templates or ~/.cursor/policy.json on Linux.
            url: https://cursor.com/docs/enterprise/deployment-patterns
        verified: "2026-09-10"
      - capability: capabilityAgentRuntimeEnforcement
        coverage: native
        mechanism: Enterprise Run Mode policy (Auto-review / Allowlist / Run Everything); ~/.cursor/permissions.json via MDM; hooks.json beforeShellExecution / beforeMCPExecution with permission deny; CLI permissions.deny
        steps:
          - title: Set the Run Mode policy
            body:
              - In the Enterprise team dashboard set the run mode to Auto-review (default) or Allowlist and remove Run Everything; team settings take precedence over individual and project configuration.
            url: https://cursor.com/docs/agent/security/run-modes
          - title: Distribute deterministic deny rules
            body:
              - Push ~/.cursor/permissions.json through MDM for terminal-command and MCP allow/deny lists; admin dashboard settings outrank the file, which outranks editor settings.
            url: https://cursor.com/docs/enterprise/deployment-patterns
          - title: Block at the hook boundary
            body:
              - Ship an enterprise hooks.json (/Library/Application Support/Cursor/hooks.json, /etc/cursor/hooks.json, C:\ProgramData\Cursor\hooks.json) with beforeShellExecution and beforeMCPExecution hooks returning permission deny; precedence is Enterprise → Team → Project → User and exit code 2 blocks.
            url: https://cursor.com/docs/hooks
          - title: Lock the CLI the same way
            body:
              - In ~/.cursor/cli-config.json set permissions.allow / permissions.deny with Shell(), Read(), Write(), WebFetch() and Mcp(server:tool) rules; deny wins over allow.
            url: https://cursor.com/docs/cli/reference/permissions
        note: The docs state the Auto-review classifier can allow a call you would have blocked; only the deny rules, hooks and sandbox are deterministic.
        verified: "2026-09-10"
      - capability: capabilityAiTprm
        coverage: external
        mechanism: Vendor evidence from cursor.com/security and trust.cursor.com consumed by the organisation's own TPRM platform
        steps:
          - title: Collect the vendor evidence
            body:
              - Pull SOC 2 Type II, ISO 27001/42001, AIUC-1, the pen-test report and the sub-processor list from the trust portal; note the 2026-08-15 change of ownership to SpaceX and re-run the assessment.
            url: https://trust.cursor.com
        note: Cursor publishes evidence; the assessment cadence and reassessment trigger on ownership change must come from your TPRM tooling.
        verified: "2026-09-10"
      - capability: capabilityAiDlp
        coverage: partial
        mechanism: hooks.json beforeSubmitPrompt and beforeReadFile (Enterprise-managed, failClosed); .cursorignore as a convenience filter only
        steps:
          - title: Scan prompts and reads with hooks
            body:
              - Add beforeSubmitPrompt and beforeReadFile hooks in the enterprise or team hooks.json to scan for sensitive data and block or redact before content reaches the model; set failClosed on critical hooks.
            url: https://cursor.com/docs/enterprise/llm-safety-and-controls
          - title: Do not rely on .cursorignore
            body:
              - Use .cursorignore for secrets and regulated trees, knowing terminal and MCP tools cannot be blocked by it and the docs call it a convenience feature, not a security boundary.
            url: https://cursor.com/docs/context/ignore-files
        note: No vendor-side content inspection or blocking policy exists; the docs point to endpoint DLP, hooks and third-party vendor APIs for centralised policy.
        verified: "2026-09-10"
      - capability: capabilityToolPermissionScoping
        coverage: native
        mechanism: Enterprise MCP Configuration (server:tool allowlist patterns, per-server tool lists); ~/.cursor/permissions.json via MDM; CLI Mcp(server:tool) rules
        steps:
          - title: Allowlist MCP servers and tools
            body:
              - In the dashboard's MCP Configuration add command patterns for stdio servers and URL patterns for remote servers, then restrict each server's Tools field; patterns are server:tool, server:*, *:tool or *:*.
            url: https://cursor.com/docs/enterprise/model-and-integration-management
          - title: Scope CLI tools per operation type
            body:
              - Use Shell(commandBase), Read(pathOrGlob), Write(pathOrGlob), WebFetch(domain) and Mcp(server:tool) entries in permissions.allow / permissions.deny; project-level .cursor/cli.json carries permissions only.
            url: https://cursor.com/docs/cli/reference/permissions
        verified: "2026-09-10"
      - capability: capabilityAgentSandboxing
        coverage: native
        mechanism: sandbox.json (type workspace_readwrite / workspace_readonly / insecure_none, additional paths, network policy); Run Mode sandboxing; team-admin policy layer cannot be weakened; CLI --sandbox and sandbox.mode
        steps:
          - title: Enable sandboxing in the Run Mode policy
            body:
              - Keep Auto-review or Allowlist with sandboxing enabled so non-allowlisted shell commands run in the sandbox that blocks protected files, writes outside approved paths and arbitrary network destinations.
            url: https://cursor.com/docs/agent/security/run-modes
          - title: Set the sandbox policy
            body:
              - Configure ~/.cursor/sandbox.json (and per-repo .cursor/sandbox.json) with type, additionalReadwritePaths, additionalReadonlyPaths, disableTmpWrite and a network policy; merge order is per-user < per-repo < team-admin < hard-coded rules and the upper layers cannot be weakened.
            url: https://cursor.com/docs/reference/sandbox
          - title: Sandbox the CLI
            body:
              - Set sandbox.mode and sandbox.networkAccess in ~/.cursor/cli-config.json or pass --sandbox <mode> in headless runs.
            url: https://cursor.com/docs/cli/reference/configuration
        note: Six sandbox-escape advisories were published Feb–Jul 2026 (git hooks, .claude hooks, working directory, symlinks, privileged Docker containers, tampered venvs); all fixed by 3.1.2. Treat the sandbox as blast-radius reduction.
        verified: "2026-09-10"
      - capability: capabilityCredentialIsolation
        coverage: none
        mechanism: Not offered for the local agent — it runs with the developer's own identity and credentials
        note: The local agent and CLI act as the signed-in user with whatever the shell can reach; Remote Control deliberately keeps credentials on the machine. Delegation controls (OIDC federation, Runtime Secrets, service accounts) exist only on Cloud Agents (toolCursorCloudAgents). Put scoped credentials in the developer's environment and use Runtime Secrets where the work can move to a Cloud Agent.
        verified: "2026-09-10"
      - capability: capabilityMemoryProtection
        coverage: partial
        mechanism: Enterprise .cursor Directory Protection; enforced Team Rules; Workspace Trust via MDM
        steps:
          - title: Protect the .cursor directory
            body:
              - Turn on .cursor Directory Protection in the team dashboard so agents cannot modify project settings (rules, MCP config, hooks) that persist across sessions.
            url: https://cursor.com/docs/enterprise/llm-safety-and-controls
          - title: Restrict untrusted folders
            body:
              - Set the MDM policy WorkspaceTrustEnabled so untrusted folders open in restricted mode with AI features limited.
            url: https://cursor.com/docs/enterprise/security-hardening
        note: Persistent state is project configuration rather than a memory store; there is no expiry, validation or rollback of agent memory.
        verified: "2026-09-10"
      - capability: capabilityPromptInjectionDefense
        coverage: partial
        mechanism: Auto-review LLM classifier on non-allowlisted commands; beforeSubmitPrompt hooks; Browser Controls domain allowlist
        steps:
          - title: Keep Auto-review on
            body:
              - Auto-review runs allowlisted calls immediately, sandboxes what it can and routes the rest through an LLM classifier; enforce it from the Enterprise Run Mode policy.
            url: https://cursor.com/docs/agent/security/run-modes
          - title: Limit what the browser tool can read
            body:
              - Define the Enterprise Browser Controls allowlist of approved domains so agents visiting other origins are blocked.
            url: https://cursor.com/docs/enterprise/llm-safety-and-controls
        note: There is no classifier on retrieved content or MCP tool output; the vendor's own language is that the classifier can make mistakes.
        verified: "2026-09-10"
      - capability: capabilitySecretsManagement
        coverage: partial
        mechanism: Team Settings → Models block on personal API keys; beforeReadFile hooks to redact secret files; Enterprise service-account keys (CURSOR_API_KEY) for the CLI
        steps:
          - title: Block personal model keys
            body:
              - In Team Settings → Models disable personal API keys so all usage routes through the team's included models and ZDR terms.
            url: https://cursor.com/docs/enterprise/model-and-integration-management
          - title: Use service accounts for headless CLI
            body:
              - Create an Enterprise service account (Dashboard → Settings → API Keys → Service Accounts), store its one-time key as CURSOR_API_KEY in CI, rotate or archive it to revoke.
            url: https://cursor.com/docs/account/enterprise/service-accounts
        note: No vault or just-in-time issuance for the secrets the local agent touches; .env files are ignored by default but not protected from terminal tools.
        verified: "2026-09-10"
      - capability: capabilityMcpToolSecurity
        coverage: partial
        mechanism: Enterprise MCP Configuration allowlist by command / URL pattern with per-server network modes; mandatory re-approval of any MCP config change (since 1.3); admin-curated Team Marketplaces
        steps:
          - title: Pin approved servers by pattern
            body:
              - Add each approved server's command or URL pattern to MCP Configuration and choose its network mode (Allow all, Allowlist, Deny all, No sandbox) for local servers.
            url: https://cursor.com/docs/mcp
          - title: Curate a Team Marketplace
            body:
              - Publish approved MCP servers and plugins through Dashboard → Plugins, set installation mode (Default Off / Default On / Required) and turn off Allow Members to Publish.
            url: https://cursor.com/docs/plugins
        note: No content-hash pinning of tool definitions or rug-pull detection; the 1.3 fix re-prompts on configuration change, not on a server's own tool-list change.
        verified: "2026-09-10"
      - capability: capabilityHitlControls
        coverage: native
        mechanism: Run Modes (Auto-review / Allowlist); MCP tools require approval by default; hooks can force ask/deny
        steps:
          - title: Remove Run Everything
            body:
              - Configure the Enterprise Run Mode policy so members cannot select Run Everything; Ask Every Time was deprecated in 3.5 in favour of Auto-review.
            url: https://cursor.com/docs/agent/security/run-modes
          - title: Keep MCP approval prompts
            body:
              - Leave MCP tools outside the allowlist so Cursor asks for approval and shows arguments before each call.
            url: https://cursor.com/docs/mcp
        verified: "2026-09-10"
      - capability: capabilityAgentRegistry
        coverage: partial
        mechanism: Team Marketplaces (Dashboard → Plugins) and the MCP Configuration allowlist as the approved list; Active Sessions in Members
        steps:
          - title: Make the marketplace the register
            body:
              - Restrict marketplace visibility to Organization Groups via SCIM, set Required for mandated plugins and only allow admins to add marketplaces (Enterprise).
            url: https://cursor.com/docs/plugins
        note: There is no inventory of what is actually installed on endpoints or reconciliation against the allowlist.
        verified: "2026-09-10"
      - capability: capabilityAuditLogging
        coverage: native
        mechanism: Enterprise Audit Log (dashboard audit-log) with SIEM streaming; Admin API /teams/audit-logs; Team Settings → OpenTelemetry Export
        steps:
          - title: Stream the audit log
            body:
              - Request streaming to Splunk, Sumo Logic, Datadog, a webhook, S3, Elasticsearch or CloudWatch via hi@cursor.com; logged events cover logins, membership, API keys, Privacy Mode, MCP authentication, team rules, hooks and Cloud Agent environments — not agent responses or generated code.
            url: https://cursor.com/docs/enterprise/compliance-and-monitoring
          - title: Pull it programmatically
            body:
              - Query /teams/audit-logs with an Admin API key (Basic auth, 20 requests per minute).
            url: https://cursor.com/docs/account/teams/admin-api
          - title: Export activity telemetry
            body:
              - In Team Settings → OpenTelemetry Export add an OTLP/HTTP destination for token, tool-call, hook and plugin events; no prompt content is exported.
            url: https://cursor.com/docs/enterprise/opentelemetry-export
        note: Tamper-evidence and the retention period are not stated on the pages fetched.
        verified: "2026-09-10"
      - capability: capabilityShadowAiDiscovery
        coverage: partial
        mechanism: MDM AllowedTeamId to block personal logins; Members → Active Sessions; documented backend domains for proxy detection
        steps:
          - title: Block personal accounts on managed devices
            body:
              - Deploy AllowedTeamId so only your team IDs can sign in, then watch Active Sessions in the dashboard.
            url: https://cursor.com/docs/enterprise/identity-and-access-management
          - title: Detect unmanaged installs at the proxy
            body:
              - Alert on traffic to *.cursor.sh, *.cursorapi.com, *.cursor-cdn.com and *.cursorvm.com from devices without the MDM policy.
            url: https://cursor.com/docs/enterprise/network-configuration
        note: Discovery of undeclared MCP servers or extensions on endpoints is not offered; AllowedExtensions and the MCP allowlist prevent rather than find.
        verified: "2026-09-10"
      - capability: capabilityKillSwitch
        coverage: partial
        mechanism: SCIM deprovisioning; Admin API /teams/remove-member; Model Access Control to disable a model; AllowedExtensions to remove an extension
        steps:
          - title: Cut a user or model
            body:
              - Deprovision through SCIM or call /teams/remove-member (Enterprise); disable a provider or model under Team Settings → Models and Cursor stops routing to it.
            url: https://cursor.com/docs/account/teams/admin-api
        note: There is no fleet-wide stop for running local agent sessions; Remote Control can be switched off for the team from Dashboard → Cloud Agents → Self-Hosted.
        verified: "2026-09-10"
      - capability: capabilityEdr
        coverage: external
        mechanism: Third-party EDR with the documented process exclusions; hooks (preToolUse, beforeShellExecution) as the pre-tool-call boundary EDR can consume
        steps:
          - title: Register the exclusions
            body:
              - Exclude Cursor.exe, rg.exe and inno_updater.exe (Windows) and Cursor.app (macOS) from scanning to avoid timeouts, then point EDR at the hook boundary.
            url: https://cursor.com/docs/enterprise/endpoint-security
          - title: Feed hook events to your endpoint tooling
            body:
              - Enterprise hooks.json runs at every tool boundary and can forward command and file events to an endpoint agent before execution.
            url: https://cursor.com/docs/hooks
        verified: "2026-09-10"
      - capability: capabilitySystemPromptManagement
        coverage: native
        mechanism: Team Rules from the dashboard with Enforce; precedence Team → Project → User; .cursor Directory Protection
        steps:
          - title: Enforce team rules
            body:
              - Create Team Rules in the dashboard and mark them enforced so members cannot disable them; Team Rules take precedence over project and user rules.
            url: https://cursor.com/docs/rules
          - title: Stop agents rewriting instructions
            body:
              - Turn on .cursor Directory Protection so the agent cannot modify .cursor/rules, mcp.json or hooks in the project.
            url: https://cursor.com/docs/enterprise/llm-safety-and-controls
        note: Rules files inside repositories remain untrusted input (Rules File Backdoor); the docs say AI guidance should not be your only security control.
        verified: "2026-09-10"
      - capability: capabilityAiBom
        coverage: none
        mechanism: Not offered
        note: No manifest or signature of the models, plugins and tools composing a session. Extension installs can require signature verification and an Install Cooldown (security hardening page), and the official marketplace is manually reviewed, but nothing is machine-readable or verified at load.
        verified: "2026-09-10"
      - capability: capabilityEgressControl
        coverage: native
        mechanism: sandbox.json network policy (default deny, allow/deny patterns, RFC 1918 and metadata blocked); per-server MCP network modes; Browser Controls domain allowlist
        steps:
          - title: Default-deny sandbox egress
            body:
              - Set network.default to deny and list allowed domains, wildcards or CIDRs; private ranges and cloud metadata endpoints are blocked regardless, and the team-admin layer cannot be weakened.
            url: https://cursor.com/docs/reference/sandbox
          - title: Constrain local MCP servers
            body:
              - Choose Allowlist or Deny all as the network mode for each stdio server in MCP Configuration.
            url: https://cursor.com/docs/enterprise/model-and-integration-management
        note: Applies to sandboxed commands only; commands that run outside the sandbox (Run Everything, No sandbox MCP servers) reach anything the device can.
        verified: "2026-09-10"
      - capability: capabilityModelScanning
        coverage: none
        mechanism: Not applicable — no model artifacts are loaded on the device
        note: All inference is on Cursor's hosted providers; which models may be used is governed by Model Access Control. Nothing to scan locally.
        verified: "2026-09-10"
    advisories:
      - title: "Rules File Backdoor — hidden Unicode in rules files steers Cursor and Copilot (Pillar Security)"
        url: https://www.pillar.security/blog/new-vulnerability-in-github-copilot-and-cursor-how-hackers-can-weaponize-code-agents
        date: "2025-03"
      - title: "CVE-2025-54135 CurXecute — prompt injection writes mcp.json and auto-starts a server (CVSS 8.5, fixed 1.3)"
        url: https://www.tenable.com/blog/faq-cve-2025-54135-cve-2025-54136-vulnerabilities-in-cursor-curxecute-mcpoison
        date: "2025-08"
      - title: "CVE-2025-54136 MCPoison — approved MCP config silently modified (CVSS 7.2, fixed 1.3)"
