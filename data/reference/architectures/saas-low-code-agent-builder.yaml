id: archLowCodeAgentBuilder
surface: surfaceSaas
rank: 2
title: UI/low-code managed agent runtime
abbrev: UI/low-code runtime

summary:
  - >
    A vendor platform where business and technical teams assemble agents from instructions,
    connectors and triggers. The reference governs who can build, publish and invoke them,
    which credentials they exercise, and how changes reach production.

description:
  - >
    A builder UI lowers the effort needed to publish an agent, but review and staged rollout
    remain necessary. Use the platform's inventory, environments and supported publication
    controls to assign an owner and approved scope to each deployed agent. Reconcile connector
    grants and triggers when ownership changes.
  - >
    Credential inheritance depends on the connector and execution mode. An agent may use a
    maker's connection, a service identity or the invoking user's authorization. Shared maker
    credentials can give callers access they do not otherwise have. Select the intended model
    explicitly and check permissions at the destination for each consequential operation.
  - >
    Instructions, knowledge sources and tool descriptions are untrusted-input paths regardless
    of the builder's technical background. Configure the vendor's supported runtime controls
    and publication gates, and enforce authorization at customer-operated tool services. Treat
    supplier safeguards and customer-enforced checks as separate evidence.

distinguishedBy:
  - >
    Against the API/SDK managed agent runtime: authoring and publication primarily use the vendor's
    builder UI. Both modes can support engineering review and deployment pipelines; this reference
    emphasizes governance across many makers and published agents.
  - >
    Against an internal AI platform you operate: the vendor operates the authoring and agent
    runtime services. Customers configure supported policies and govern their own connections,
    identities and destination systems.

exemplars:
  - name: Microsoft Copilot Studio
    note: >
      Graphical agent and workflow authoring with connectors, publishing and organization
      administration. Select the harness and credential mode explicitly; capabilities differ across them.
    url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/fundamentals-what-is-copilot-studio
    asOf: "2026-10"
  - name: Salesforce Agentforce
    note: >
      Salesforce's agent platform for business workflows and CRM actions. This example covers
      builder-authored agents; scope their actions and data access to the intended execution identity.
    url: https://www.salesforce.com/agentforce/
    asOf: "2026-10"
  - name: Gemini Enterprise Workflow Builder
    note: >
      Google's no-code workflow authoring within Gemini Enterprise. Govern published workflows,
      connected apps and user permissions separately from the employee chat experience.
    url: https://cloud.google.com/gemini-enterprise
    asOf: "2026-10"
  - name: Amazon Quick Automate
    note: >
      AWS visual authoring for agentic business automation. This example covers managed workflow
      execution and integrations, with publication, connection ownership and action permissions configured explicitly.
    url: https://aws.amazon.com/quick/automate/
    asOf: "2026-10"

zones:
  - id: zoneUser
    owner: user
    note: >
      Two populations, and the distinction is the archetype: the colleagues who build agents
      without being engineers, and the colleagues who then use what they published.
  - id: zoneVendor
    owner: vendor
    note: >
      The platform, and effectively the whole system. Authoring, the orchestrator, the model
      calls, the sandbox and the connector runtime all execute here — there is no
      customer-hosted agent runtime on offer — beside the SaaS we hold under agreement that its
      connectors reach. Drawn before our own band because a maker reaches the platform first
      and the platform reaches back into us second.
  - id: zoneCloud
    owner: cloud
    note: >
      The narrow strip that is still ours: the tunnel the platform reaches us through, the
      gateway a published agent is admitted at, and our own tool servers and data behind it.
  - id: zoneExternal
    owner: external
    note: The model the vendor calls on our behalf, and the open web its search reads.
  - id: zoneGovernance
    owner: governance
    note: >
      Governance covers the agent population and its changes. Where the platform offers
      deployment pipelines, publication review and environment policy, use them to keep maker
      access separate from production use; they are optional, so population controls remain
      the baseline.

blocks:
  - id: builder
    kind: actor
    title: Citizen builder
    icon: person
    zone: zoneUser
    col: 0
    row: 0
    note: >
      A business or technical maker configuring an agent. Require the review and publication
      controls appropriate to the data and actions the deployed agent can reach.

  - id: consumer
    kind: actor
    title: Agent consumers
    icon: people
    zone: zoneUser
    col: 0
    row: 1
    note: >
      Colleagues who run what a maker published, usually without knowing who built it or whose
      access it acts on.

  - id: platform
    kind: provider
    title: Agent builder platform
    cosaiComponent: componentApplication
    zone: zoneVendor
    col: 1
    row: 1
    note: >
      One block, because from our side it is one thing: the authoring surface, the orchestrator,
      the harness, the sandbox and the connector runtime all run in the vendor's cloud. The only
      part of it we operate is policy configuration, and that is the whole of our leverage.
    items:
      - id: authoring
        label: Authoring surface
        icon: code
        note: Where an agent is built and published, by someone who does not think of it as shipping.
      - id: agentRuntime
        label: Agent runtime
        icon: agent
        note: Their harness executing the maker's agent, with the model calls theirs to make.
      - id: connectorFramework
        label: Connector framework
        icon: plug
        note: >
          Hundreds of prebuilt connectors, executing in their cloud on credentials that are the
          crux of this page.

  - id: vendorTools
    kind: service
    title: Tool services
    cosaiComponent: componentTools
    zone: zoneVendor
    col: 2
    row: 2
    pack: toolServicesRemote
    note: >
      The SaaS we hold under agreement — our own Microsoft 365, Google Workspace or Salesforce
      tenant — reached through the platform's connectors on whichever credential the maker
      chose. A service outside any agreement is not connected: connector policy and the target
      tenant's admin consent decide what counts as approved.

  - id: aiGateway
    kind: service
    title: AI gateway
    zone: zoneCloud
    col: 4
    row: 1
    note: >
      Where a published agent is admitted into our systems, and the policy point on that path. It carries no inference here — the vendor calls its own model — so this is purely
      about tools and data, which is the useful distinction from every other gateway in the
      catalogue.
    items:
      - id: gwTools
        label: MCP & API gateway
        icon: plug
        note: Which of our servers a published agent may reach, and on whose grants.

  - id: internalTools
    kind: service
    title: Tool services
    cosaiComponent: componentTools
    zone: zoneCloud
    col: 4
    row: 2
    pack: toolServicesRemote
    note: >
      Our own APIs and MCP servers, reached only through our gateway and never exposed to the
      platform directly. The platform's data policies regulate its MCP tools the same way they
      regulate its connectors.

  - id: dataGateway
    kind: service
    title: Tunnel connector
    cosaiComponent: componentAgentUserQuery
    zone: zoneCloud
    col: 3
    row: 1
    note: >
      The platform's on-premises data gateway, or its private-network equivalent: vendor-supplied
      software on a host we run that dials out, so nothing is opened inbound, and relays the
      platform's connector calls to our gateway — the same chain as on every SaaS sibling. It
      does not run agents, and its payload limits make it a query path rather than a bulk one.
      It connects with the credentials stored for each connection, whoever invoked the agent,
      so the invoker's identity does not reach the far side — the confused-deputy path this
      archetype turns on. Those stored credentials sit on this host, which is why the secrets
      pin lands here.
    items:
      - id: outbound
        label: Outbound connector
        icon: plug
        note: Polls outward; no inbound firewall rule, and a small ceiling on what any one call may carry.

  - id: orgData
    kind: external
    title: Enterprise data
    cosaiComponent: componentDataSources
    zone: zoneCloud
    col: 4
    row: 3
    pack: enterpriseData
    note: >
      The systems of record a maker attached as grounding or as an action target — often
      without anyone asking whether the agent's audience should reach them.

  - id: provider
    kind: provider
    title: Model provider
    cosaiComponent: componentModelServing
    zone: zoneExternal
    col: 5
    row: 0
    pack: modelProvider
    note: >
      The model service the platform calls each turn, on the vendor's agreement with its
      provider rather than ours. We neither broker the call nor hold the key, which is why our
      own gateway carries no inference on this page.

  - id: openWeb
    kind: external
    title: Open web
    cosaiComponent: componentDataSources
    zone: zoneExternal
    col: 5
    row: 4
    note: >
      Search results and fetched pages, reached only through the platform's web search. Every
      page is authored by someone else, and its text enters the agent's turn as model input.
    items:
      - id: webSearch
        label: Web search
        icon: search
        note: The search tool's results — ranked by somebody else, and read as context.
      - id: pages
        label: Arbitrary pages
        icon: globe
        note: Visible and hidden text alike, served by whoever owns the page.

  - id: govIdentity
    kind: governance
    title: Identity services
    icon: person
    zone: zoneGovernance
    col: 0
    row: 5
    mitigations: [ D3-APA, D3-AA ]
    note: >
      Whose credentials a published agent runs on, which on these platforms is a configuration
      choice. Require end-user credentials; which mode is the default differs by platform and
      connector. Maker credentials are the ambient-authority case: every consumer of that agent
      transitively inherits the maker's access to the backend. Where the platform's inventory
      records which mode each connector uses, that field is the most useful thing an
      administrator can query here.

  - id: govSecrets
    kind: governance
    title: Secrets & key management
    icon: key
    zone: zoneGovernance
    col: 3
    row: 5
    mitigations: [ D3-CH ]
    note: >
      The tunnel host's cached connection credentials — issued, rotated and revoked from here,
      because they sit on a host we run and nowhere our gateway can see.

  - id: govPolicy
    kind: governance
    title: Policy & authorization
    icon: scale
    zone: zoneGovernance
    col: 4
    row: 5
    mitigations: [ AML.M0028, cap-data-access-governance ]
    note: >
      Data policies that classify every connector, forbid mixing groups across the boundary and
      block publication of a violating agent. Whether a platform enforces them by default, and
      which agents they exempt, differs by platform.

  - id: govSupplyChain
    kind: governance
    title: Supply-chain assurance
    icon: db
    zone: zoneGovernance
    col: 5
    row: 5
    mitigations: [ cap-agent-tool-registry, cap-staged-rollout-gate, cap-ai-vendor-assessment ]
    note: >
      The inventory and the publication gate. On a platform where anyone can build, an agent
      nobody registered is an agent nobody can revoke — and that is the normal case rather than
      the exception.

  - id: govObservability
    kind: governance
    title: Observability & response
    icon: eye
    zone: zoneGovernance
    col: 6
    row: 5
    mitigations: [ cap-agent-tracing, cap-agent-kill-switch ]
    note: >
      Run history, and the population view: which agents exist, who built them, which have
      outlived their author. The unit of observation here is the population, not a deployment.

edges:
  - from: builder
    to: platform
    path: external
    bidir: true
    label: authors & publishes
    note: >
      Built and shipped inside the vendor's surface. The platform's environments and deployment
      pipelines can put a review here, but they are optional and many makers publish straight
      from the builder.
  - from: consumer
    to: platform
    path: external
    bidir: true
    label: uses a published agent
    note: Colleagues run what a maker published, on whichever credential the maker configured.
  - from: platform
    to: provider
    path: external
    bidir: true
    route: vh
    label: their model
    note: >
      The vendor calls its own model provider. We are not on this path and hold no key for it,
      which is why our gateway carries tools and data only.
  - from: aiGateway
    to: internalTools
    path: primary
    bidir: true
    label: brokered tool calls
    note: Which of our servers a published agent may call, on grants we scope rather than the maker's standing access.
  - from: internalTools
    to: orgData
    path: primary
    bidir: true
    label: scoped reads & writes
    note: Grounding content and action targets, reached on our terms.
  - from: platform
    to: dataGateway
    path: external
    bidir: true
    label: outbound-only tunnel
    note: >
      Their cloud reaching back into us through software we run. Outbound-only, so nothing is
      opened inbound; the public-endpoint form most platforms default to is recorded as a
      deviation.
  - from: dataGateway
    to: aiGateway
    path: primary
    bidir: true
    label: connector calls into our systems
    note: >
      The tunnel hands to our gateway rather than to a server or the data. A vendor-hosted
      agent reaching our data crosses here or it does not reach it at all.
  - from: platform
    to: vendorTools
    path: external
    bidir: true
    route: vh
    label: approved SaaS connectors
    note: >
      Connectors reaching the SaaS we hold under agreement. This path never touches our
      network, so the connector policy in their tenant is the only control on it.
  - from: platform
    to: openWeb
    path: external
    outbound: true
    route: vh
    label: web search
    note: >
      The platform's web search, opened from their side. What returns rides back on it —
      content nobody vouches for, entering the agent's turn.

pins:
  risks:
    - risk: riskAgenticDelegationConfusedDeputy
      at: platform
      note: >
        The defining risk of the archetype, and it materializes in the platform's connection
        store: a maker attaches a connector on their own credentials and publishes to a team;
        every consumer then transitively holds the maker's access to that backend. Nobody
        granted it, nobody sees it in an access review — and most of it plays out on paths
        our gateway never touches.
    - risk: riskShadowAndUnknownAgents
      at: platform
      note: >
        An agent is a form away, and the unregistered population accumulates in the platform —
        not in any one builder. Without the inventory queried, the population is unbounded,
        and agents outlive the people who built them.
    - risk: riskRogueActions
      at: internalTools->orgData
      note: Writes into systems of record from an agent nobody reviewed.
    - risk: riskRetrievalVectorStorePoisoning
      at: orgData
      note: >
        A maker attaches a folder as grounding and the platform indexes it. Whoever can write
        to that folder can write to the index, and every agent grounded on it reads what they
        left — the poisoning is of the retrieval source, not of the model.
    - risk: riskPromptInjection
      at: platform->vendorTools
      note: >
        Grounding content and connector results re-enter the agent as instruction. A document
        dropped in a shared folder is an instruction channel on this platform.
    - risk: riskPromptInjection
      at: platform->openWeb
      note: >
        Search results and fetched pages return into the agent's turn — content somebody else
        authored, read with the same standing as the maker's instructions.
    - risk: riskSensitiveDataDisclosure
      at: dataGateway
      note: >
        The relay reads with each connection's stored credential whoever is asking, so an agent
        can answer with records the person invoking it could never open.
    - risk: riskExcessiveDataHandlingDuringInference
      at: platform->provider
      note: >
        Grounding content sent to a model we do not broker — more than the turn needs, or kept
        and used outside the terms the vendor agreed with its provider.

    - risk: riskSensitiveDataDisclosure
      at: consumer->platform
      note: >
        Publish to a public channel with authentication off and the audience is the internet:
        the agent's grounding and connectors answer anyone with the URL — found by the thousands
        by recon tooling.
    - risk: riskPromptInjection
      at: internalTools->orgData
      note: >
        A document in a grounding folder anyone can write to comes back as a tool result and
        enters their runtime as instruction — the path the shared-drive scenario walks.
    - risk: riskSensitiveDataDisclosure
      at: builder->platform
      note: >
        Knowledge a maker uploads is answered to everyone who can use the agent, whatever the
        source file's permissions — the agent discloses what its audience could never open.
  mitigations:
    - mitigation: D3-APA
      at: consumer->platform
      note: >-
        Whose credentials a published agent runs on, and who may run it at all: end-user credentials
        required, maker credentials as a deliberate, reviewed exception, and authentication on for every
        channel an agent is published to — an agent published with authentication off answers anyone with the
        URL.
    - mitigation: D3-AA
      at: platform
      note: >-
        Each published agent signs in as its own directory principal; the identity provider verifies that
        credential and conditional access can refuse it, per agent rather than for the whole population.
    - mitigation: cap-agent-tool-registry
      at: platform
      note: >-
        The platform's own inventory, queried rather than assumed — including which connectors use maker
        credentials, which is the field that finds the ambient-authority agents.
    - mitigation: cap-staged-rollout-gate
      at: platform
      note: >-
        Versioned agents promoted through the platform's environments or pipelines with a named approver, a
        limited first audience where offered, and rollback by re-activating or redeploying the previous
        version. Optional on these platforms and often unused by makers; unpublish alone is the weaker response.
    - mitigation: cap-ai-vendor-assessment
      at: platform
      note: >-
        Their runtime, their sandbox, their model — assured by assessment rather than drawn, because none of
        it is ours to inspect, and re-assessed on a clock: connector defaults, publication channels and
        authentication toggles drift as the vendor ships.
    - mitigation: AML.M0028
      at: platform->vendorTools
      note: >-
        Connector policy authored centrally in the tenant: every connector classified, a confidential source
        never paired with a path that sends data out, unclassified connectors blocked — enforced at
        publication where the platform supports it. The only control on a path that never touches our network.
    - mitigation: D3-CH
      at: dataGateway
      note: >-
        The cached connection credentials on the tunnel host — issued scoped and short-lived, rotated, and
        revocable without redeploying the host. Absorbed here per the recorded deviation, because this is
        where the secret actually sits.
    - mitigation: AML.M0028
      at: aiGateway->internalTools
      note: Which of our servers a published agent may reach, decided at our tier rather than by the maker.
    - mitigation: cap-input-guardrails
      at: aiGateway
      note: >-
        Grounding read through our gateway is classified before it goes back to their runtime — the one return
        leg we can inspect.
    - mitigation: cap-data-access-governance
      at: orgData
      note: >-
        What a maker may attach as grounding: sources with governed write access only, classified before they
        are attachable, and every read scoped to the invoker's entitlement and refused when no invoker comes
        with it. The default connector set is the real policy, and a permissive default is a decision nobody
        remembers making.
    - mitigation: cap-agent-tracing
      at: govObservability
      note: >-
        Each run's steps — tool and connector calls, retrieval and hand-offs — correlated by session and
        exported where we can query them. Platforms differ: some capture steps org-wide, others leave
        step-level capture to a per-agent maker setting.
    - mitigation: cap-agent-kill-switch
      at: govObservability
      note: >-
        Disable the app in the tenant and revoke every connector grant — the SaaS form of the stop, and the
        response the departed-author and public-link scenarios actually invoke.

walkthrough:
  title: An agent is built, published, and used
  moves: >-
    A colleague assembles an agent from prompts and connectors; another colleague runs it,
    and the answer comes back.
  steps:
    - follow: builder->platform
      label: build & publish
      note: >
        Built and published inside the vendor's surface, often straight from the builder:
        deployment pipelines exist but are optional and commonly unused, so population
        management rather than change review is the baseline.
    - follow: consumer->platform
      label: colleague runs it
      note: >
        A colleague runs what was published — on their own credentials if the maker chose
        end-user auth, and on the maker's if they did not.
    - follow: platform->provider
      label: vendor's model call
      note: >
        Now the model is called — on the vendor's key, for the running turn. We are not on
        this path, which is why our gateway carries tools and data only.
    - follow: provider->platform
      label: completion
      note: The completion comes back into their runtime as the turn's plan.
    - follow: platform->openWeb
      label: web search
      note: Where the plan calls for it, the platform searches the web from their side.
    - follow: openWeb->platform
      label: search results
      note: Results and fetched pages enter the turn, written by whoever owns the page.
    - follow: platform->dataGateway
      label: down the tunnel
      note: Their cloud reaches back into us through the connection our tunnel holds open.
    - follow: dataGateway->aiGateway
      label: reach into our data
      note: Handed to our gateway. A published agent reaching our data crosses here or not at all.
    - follow: aiGateway->internalTools
      label: scoped grant
      note: Scoped to grants we decided, rather than to the maker's standing access.
    - follow: internalTools->orgData
      label: records
      note: The records the agent was built to reach.
    - follow: orgData->internalTools
      label: records
      note: The records come back.
    - follow: internalTools->aiGateway
      label: recorded
      note: Through our crossing, where the call is recorded.
    - follow: aiGateway->dataGateway
      label: into the tunnel
      note: Classified at the gateway, then back into the connector.
    - follow: dataGateway->platform
      label: tool result
      note: And up the tunnel to their runtime as a tool result.
    - follow: platform->provider
      label: grounded model call
      note: The records go to the model with the turn, on the vendor's key.
    - follow: provider->platform
      label: grounded completion
      note: The answer is composed from what the records said.
    - follow: platform->consumer
      label: reply
      note: The reply returns to the colleague who ran it, grounded on everything the walk touched.

scenarios:
  - title: A maker attaches a connector on their own credentials
    steps:
      - follow: builder->platform
        label: publish with connectors
        note: Prompt written, connectors attached, agent published to a team.
      - follow: consumer->platform
        label: run; inherit maker's access
        note: >
          Colleagues run it — and inherit the maker's access to whatever it was attached to.
          The gap between who built an agent and whose access it uses is where this
          archetype's incidents live.
      - follow: platform->dataGateway
        label: back into us
        note: The agent reaches back into our systems through the tunnel.
      - follow: dataGateway->aiGateway
        label: reach bounded at our tier
        note: Which is only bounded at all because the reach into our systems crosses a tier we run.
  - title: A shared drive becomes an instruction channel
    steps:
      - follow: platform->dataGateway
        label: folder as grounding
        note: A running agent asks for a folder somebody uses as grounding.
      - follow: dataGateway->aiGateway
        label: to our gateway
        note: The request comes up the tunnel to our gateway.
      - follow: aiGateway->internalTools
        label: admitted read
        note: Admitted like any other read.
      - follow: internalTools->orgData
        label: folder read
        note: The folder is read.
      - follow: orgData->internalTools
        label: document with instruction
        note: A document written by anyone with access to that folder comes back with the rest.
      - follow: internalTools->aiGateway
        label: tool result
        note: It crosses back as an ordinary tool result.
      - follow: aiGateway->dataGateway
        label: into the tunnel
        note: Classified at the gateway, which cannot tell it apart from any other record.
      - follow: dataGateway->platform
        label: model input
        note: And enters their runtime as model input.
      - follow: platform->vendorTools
        label: acts with maker's authority
        note: >
          The agent acts on it with the maker's authority — on connectors that never touch
          our network, so nothing of ours can intervene past this point.
  - title: The author leaves
    steps:
      - follow: builder->platform
        label: agent outlives maker
        note: An agent outlives the person who built it, still holding their connector grants.
      - follow: platform->vendorTools
        label: SaaS grants keep flowing
        note: >
          The maker's connector grants to our SaaS tenants keep flowing — these never touch our
          network, so only the platform's connection-ownership transfer or revocation can cut
          them. That inventory operation is the primary response.
      - follow: platform->dataGateway
        label: grants into us
        note: The departed maker's grants into our systems still arrive through the tunnel.
      - follow: dataGateway->aiGateway
        label: our slice cut
        note: >
          Our gateway cuts the slice it issued — the grants into our own systems — which is
          real, and is not most of what the departed maker left behind.

  - title: Published to anyone with the link
    steps:
      - follow: consumer->platform
        label: stranger's question
        note: >
          A failure variant: a maker publishes to a public channel and leaves authentication
          off. The "consumer" is now anyone who finds the URL, and recon tooling finds them by
          the thousands.
      - follow: platform->dataGateway
        label: down the tunnel
        note: The stranger's question comes back into us through the tunnel.
      - follow: dataGateway->aiGateway
        label: agent's own grants
        note: It reaches our crossing on the agent's stored credential, with no invoker identity behind it.
      - follow: aiGateway->internalTools
        label: admitted like any run
        note: >
          Admitted like any run of this agent. With no invoker to check, the invoker-scoped read
          is bypassed rather than enforced.
      - follow: internalTools->orgData
        label: grounding for a stranger
        note: >
          The grounding answers a stranger. Authentication on every channel, and refusing reads
          that carry no invoker, are what would have stopped it.

deviations:
  - subject: The vendor band is drawn before our cloud band
    reason: >
      Band order is left-to-right by convention; here the vendor sits first because a maker
      reaches the platform first and the platform reaches back into us second. The same
      break, for the same reason, as the enterprise chat sibling; the API/SDK runtime, reached
      through our own front end, keeps the conventional order.
  - subject: The tunnel absorbs secrets
    reason: >
      Credential hardening (D3-CH) is embodied by the AI gateway, but the load-bearing secrets
      on this path are the connection credentials cached on the tunnel host — the pin sits
      where they live, and the issuance story in the governance call-out.
  - subject: The tunnel is drawn; the public endpoint and the direct data path are recorded
    reason: >
      The target state is the SaaS siblings': the platform reaches our gateway through an
      outbound-only tunnel on a host we run, so none of our endpoints faces the internet. Most
      platforms in this class default instead to calling an internet-facing endpoint of ours,
      admitted at our edge by their published IP ranges — the same crossing with a weaker
      admission — and some offer private networking in place of a relay. The on-premises data
      gateway can also carry the platform's standard data connectors straight to an
      on-premises source, bypassing our gateway; where that path is used, the connector's
      data-policy classification and the relay's scoped credentials are the only controls on
      it, and it is recorded here rather than drawn as a second chain.
  - subject: The AI gateway does not reach a model provider
    reason: >
      Everywhere else in the catalogue the gateway is the model path, and the registered
      pattern says so. Here it is not: the vendor calls its own model, on its own key, and our
      gateway exists only to admit a published agent to our tools and data. Drawing an
      inference leg out of our gateway would assert a broker we do not operate. The model edge
      is therefore vendor to provider; the SaaS siblings absorb the model into the vendor block
      instead, with the same gateway-without-inference result. The gateway is drawn with its
      own items rather than the registered aiGatewayTraffic pack for the same reason: no model
      proxy, because there is no model traffic to proxy.
  - subject: The vendor platform is a single block despite containing an orchestrator, a harness and a sandbox
    reason: >
      The three-zone responsibility rule forbids drawing vendor internals we cannot inspect. On
      a platform with no customer-hosted runtime option, everything but policy configuration is
      theirs, so the honest drawing is one block assured by assessment rather than four boxes
      implying visibility we do not have.

