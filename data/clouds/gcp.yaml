          - https://docs.cloud.google.com/architecture/choose-agentic-ai-architecture-components
        offers:
          - name: "Agent Development Kit (ADK) agent"
            what: "Full integration: features work across the framework, Agent Runtime and the wider Google Cloud ecosystem; Python deploys with the adk CLI and Go with the adkgo CLI."
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/use-an-adk-agent
          - name: "LangChain agent"
            what: "Agent Platform SDK integration: a managed LangchainAgent template in the SDK and documentation."
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/use-a-langchain-agent
          - name: "LangGraph agent"
            what: "Agent Platform SDK integration: a managed LanggraphAgent template in the SDK and documentation."
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/use-a-langgraph-agent
          - name: "AG2 agent"
            what: "Agent Platform SDK integration: a managed AG2Agent template in the SDK and documentation."
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/use-an-ag2-agent
          - name: "LlamaIndex Query Pipeline agent (Preview)"
            what: "Agent Platform SDK integration through a managed template for LlamaIndex Query Pipeline; the page carries a Preview label."
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/use-a-llamaindex-agent
          - name: "Agent2Agent (A2A) agent (Preview)"
            what: "An agent deployed as an A2aAgent instance that clients and other agents call over the Agent2Agent open protocol; the page carries a Preview label."
            url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/use-an-a2a-agent
          - name: "Custom agent (custom template)"
            what: "A Python class template that you adapt to your own framework and deploy as a pickled object; the support level Google lists for CrewAI and custom frameworks."
