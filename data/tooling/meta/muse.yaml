# Meta Muse — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# 2026-10-22: onboarded on archPersistentManagedAgents. Muse is a continuing, vendor-hosted agent on
# a dedicated cloud VM (Muse Secure VM) with its own browser, file system, retained memory, goals and
# scheduled work; the user does not host it (archPersonalAgent).
# Consumer rule: Muse has no organisation plan or administrator surface (Muse for Small Business adds
# business connectors to the same personal agent). A control the person can set is rated partial at
# most, and vendor-built safeguards nobody can configure are partial on the same rule as
# toolOpenaiDots and toolClaudeDuet.
# Exclusions: Muse Code (Meta's coding agent) is a different product and is not onboarded here. The
# Muse Confidential VM is announced for later in 2026 and is not credited. Third-party reports of a
# browser Stop control and of a VM file-export issue were not verified against Meta's pages.
# Fetch log: about.fb.com Muse and Muse for Small Business posts, introducing.muse.ai and both meta.com
# help articles 200; security.muse.ai redirects to the research.meta.ai safety post;
# meta.com/help/artificial-intelligence/2225571704857152 redirects to /help/superintelligence/;
# muse.ai redirects to a sign-in page (400 to automated fetch).
vendor: meta
family: Muse
tools:
  - id: toolMetaMuse
    name: Meta Muse
    surfaceClasses:
      - managedRuntime
      - chatIntegration
    variants:
      - name: Muse app (iOS and Android) and muse.ai
        class: managedRuntime
        url: https://introducing.muse.ai/
      - name: Muse in WhatsApp
        class: chatIntegration
        url: https://about.fb.com/news/2026/09/introducing-muse-personal-ai-agent/
        note: Message Muse like a contact; AI glasses are announced, not shipped.
      - name: Muse for Small Business
        class: managedRuntime
        url: https://about.fb.com/news/2026/09/introducing-muse-small-business/
        note: Business connectors (Facebook Pages, Instagram professional accounts, Meta ad accounts, Shopify, Stripe and others) on the same personal agent; no team or admin features described.
    architecture: archPersistentManagedAgents
    status: ga
    asOf: "2026-10"
    summary:
      - >-
        Meta's personal agent, running on a dedicated cloud VM per person (Muse Secure VM) with its own
        browser, file system and terminal. It keeps memory and goals across conversations, works on a
        schedule and on events after the app is closed, and messages the person when something changes or
        an approval is needed.
      - >-
        A separate host-side agent, Sentinel, is the sole permission authority for connector actions and all
        network egress; Muse proposes, Sentinel allows, denies or asks the person. Credentials live on the VM
        and the agent sees only surrogate tokens. It is a consumer product with no organisation plan.
    facts:
      - label: Plans
        value: >-
          Free for most use, with paid subscriptions for more. Rolling out in the US (the small-business post
          also names Canada) on iOS, Android, muse.ai and WhatsApp.
        url: https://about.fb.com/news/2026/09/introducing-muse-personal-ai-agent/
      - label: Inference & routing
        value: >-
          Meta operates the VM and runs Muse Spark. Security services (Sentinel, credential store, privilege
          separation) run outside the agent's container on the same VM.
        url: https://research.meta.ai/blog/security-and-safety-for-ai-agents-our-approach-with-muse
      - label: Data leaving the device
        value: >-
          Connector data, files, memory and credentials are held on the person's cloud VM. Device connectors
          such as Apple Health or Android SMS are granted in device settings.
        url: https://www.meta.com/help/superintelligence/1687253048996149/
      - label: Retention & training
        value: >-
          No retention period is stated; VM data is continuously backed up. Training is on by default and turned
          off with Help improve our AI models in Settings > Data controls. Not shared with Meta's ad systems.
        url: https://www.meta.com/help/superintelligence/2225571704857152/
      - label: Docs index
        value: Meta Help Center articles on Muse data and connectors; Meta's Muse safety post.
        url: https://www.meta.com/help/superintelligence/2225571704857152/
      - label: Bug bounty
        value: Public bounty up to $300,000, including prompt injection affecting one user.
        url: https://bugbounty.meta.com/
    items:
      - title: Decide whether work accounts may connect to it
        body:
          - Muse has no organisation plan, so the enterprise lever is at the services it connects to. Use the
            identity provider's or each SaaS admin console's third-party app consent controls to decide whether
            Muse may reach work mail, calendars and drives from a personal Meta account.
        links:
          - title: How Muse works with Connectors
            url: https://www.meta.com/help/superintelligence/1687253048996149/
      - title: Custom connectors are unreviewed code
        body:
          - Muse can write its own connector for any service with an API or CLI and store the credentials it
            needs. Meta does not review custom connectors, and their sandboxing is not described.
        links:
          - title: How Muse works with Connectors
            url: https://www.meta.com/help/superintelligence/1687253048996149/
    riskNotes:
      - risk: riskShadowAndUnknownAgents
        note: A personal Muse with standing access to a work mailbox or ad account is invisible to every admin console.
      - risk: riskPromptInjection
        note: Pages, mail and files it reads on schedule can steer later work; Sentinel's tainted-egress rule limits what leaves afterwards.
      - risk: riskInsecureIntegratedComponent
        note: Custom connectors that Muse writes itself are not reviewed by Meta.
      - risk: riskSensitiveDataDisclosure
        note: Disconnecting or deleting does not remove what Muse already learned; ask it to forget or reset.
    controls:
      - mitigation: D3-APA
        coverage: external
        mechanism: No organisation plan or admin switch; the connected services' third-party app consent controls decide what it can reach.
        evidence:
          - title: Muse announcement (consumer availability)
            url: https://about.fb.com/news/2026/09/introducing-muse-personal-ai-agent/
          - title: How Muse works with Connectors
            url: https://www.meta.com/help/superintelligence/1687253048996149/
        note: >-
          External: Muse is tied to a personal Meta account and no organisation can turn it on or off. Govern it
          at the destination — OAuth app approval in Google Workspace, Microsoft 365 and other SaaS — and in
          acceptable-use policy for personal AI agents.
        verified: "2026-10-22"
      - mitigation: AML.M0028
        coverage: partial
        mechanism: >-
          Settings > Connectors per connector; many connectors can be set to retrieve only; Sentinel applies the
          person's connector policy (allowed, denied or ask) with read and write separated where the service allows.
        steps:
          - title: Connect read-only where possible
            body:
              - In Settings > Connectors, connect only what Muse needs, choose retrieve-only access where offered,
                and disconnect anything unused.
            url: https://www.meta.com/help/superintelligence/1687253048996149/
        note: >-
          Partial on the consumer rule: the person sets it and no organisation can require it. Custom connectors
          Muse writes itself are unreviewed, and disconnecting does not remove what it already learned.
        verified: "2026-10-22"
      - mitigation: AML.M0029
        coverage: partial
        mechanism: >-
          Sentinel asks the person in a client approval dialog (not the chat) before consequential connector
          actions, data leaving the VM and each purchase; grants can be one-time, session, task, time-bounded
          or perpetual.
        steps:
          - title: Keep approvals narrow
            body:
              - In Settings, keep Muse asking before important actions, and grant approvals one-time or per task
                rather than perpetual.
            url: https://www.meta.com/help/superintelligence/1687253048996149/
        note: >-
          Partial on the consumer rule, though it is the strongest gate on this drawing: the dialog answers
          straight to Sentinel, out of the model's reach. Read-only, previously allowed and low-risk actions
          proceed unprompted, a perpetual grant removes the gate, and no organisation sets the policy.
        verified: "2026-10-22"
      - mitigation: D3-MFA
        coverage: none
        mechanism: Sign-in is the person's own Meta account; no organisation SSO or MFA policy applies.
        evidence:
          - title: Muse announcement (consumer availability)
            url: https://about.fb.com/news/2026/09/introducing-muse-personal-ai-agent/
        note: >-
          None for an organisation: Muse has no business tenancy, so no SSO, conditional access or MFA
          requirement reaches it. Any second factor is the person's own Meta account setting.
        verified: "2026-10-22"
      - mitigation: D3-CH
        coverage: partial
        mechanism: >-
          Credentials, OAuth tokens included, stay in a credential service on the VM outside the agent's
          container; the agent sees surrogate tokens, and browser logins go from the client straight to that store.
        evidence:
          - title: Credentials and tokens
            url: https://research.meta.ai/blog/security-and-safety-for-ai-agents-our-approach-with-muse
        note: >-
          Partial on the same rule as toolOpenaiDots and toolClaudeDuet: a vendor design nobody can configure or
          audit, and the signed-in browser session still carries the account's authority.
        verified: "2026-10-22"
      - mitigation: D3-CTS
        coverage: partial
        mechanism: >-
          Sentinel swaps real credentials in at the network boundary only after authorising the request to that
          destination; purchases use single-use cards bound to one merchant, amount and time window.
        evidence:
          - title: Surrogate tokens and single-use cards
            url: https://research.meta.ai/blog/security-and-safety-for-ai-agents-our-approach-with-muse
        note: >-
          Partial on the consumer rule: recipient binding is documented, which is more than the other products on
          this drawing show, but it is a vendor design with no setting or event an organisation can check.
        verified: "2026-10-22"
      - mitigation: AML.M0031
        coverage: partial
        mechanism: >-
          Memory.md, Soul.md and Identity.md are readable and editable; a forget skill; Reset Muse; VM data is
          continuously backed up.
        steps:
          - title: Review and edit its memory
            body:
              - Tap the Assistant icon > Identity > Memory and edit or delete entries in Memory.md; ask Muse to
                forget a topic, or use Settings > Data controls > Reset Muse to start clean.
            url: https://www.meta.com/help/superintelligence/2225571704857152/
        note: >-
          Partial on the consumer rule. Memory is inspectable, but nothing validates what Muse writes to it, and
          Meta says it may still remember information learned from items you delete.
        verified: "2026-10-22"
      - mitigation: AML.M0036
        coverage: unknown
        mechanism: Free and paid tiers are announced; their limits are not documented.
        evidence:
          - title: Muse announcement (pricing)
            url: https://about.fb.com/news/2026/09/introducing-muse-personal-ai-agent/
        note: >-
          Unknown: Meta documents no per-task time, spend or step limit and no tier limits. Payments are bounded
          per purchase by single-use cards, which is not a workload limit.
        verified: "2026-10-22"
      - mitigation: cap-agent-egress-control
        coverage: partial
        mechanism: >-
          Sentinel checks all egress at layers 4 and 7 (host, resolved and final IP, port, method, path), blocks
          SSRF to private addresses and known malicious sites, and removes auto-allow once a process has read
          user data.
        evidence:
          - title: Sentinel egress control
            url: https://research.meta.ai/blog/security-and-safety-for-ai-agents-our-approach-with-muse
        note: >-
          Partial: the enforcement point is real and covers the whole VM, but the policy is Meta's plus the
          person's approvals; there is no destination allowlist an organisation writes or sees.
        verified: "2026-10-22"
      - mitigation: cap-input-guardrails
        coverage: partial
        mechanism: >-
          An ensemble of classifiers screens files and tool outputs; external content is labelled untrusted; the
          browser agent reads an accessibility tree with JavaScript and DevTools disabled; the email connector
          filters one-time codes and reset links.
        evidence:
          - title: Prompt-injection defences
            url: https://research.meta.ai/blog/security-and-safety-for-ai-agents-our-approach-with-muse
        note: >-
          Partial on the rule applied to every vendor: documented in detail but vendor-internal, with no setting,
          threshold or detection event anyone can see.
        verified: "2026-10-22"
      - mitigation: cap-agent-tool-registry
        coverage: external
        mechanism: No organisation view of who runs Muse; discover it from OAuth grants in the connected services.
        evidence:
          - title: How Muse works with Connectors
            url: https://www.meta.com/help/superintelligence/1687253048996149/
        note: >-
          External: a SaaS-management or OAuth-grant review is the only way to find work accounts connected to a
          personal Muse. Custom connectors it writes appear in no registry at all.
        verified: "2026-10-22"
      - mitigation: cap-ai-vendor-assessment
        coverage: external
        mechanism: The organisation's third-party risk process consumes Meta's published security design.
        evidence:
          - title: How we built safety into Muse
            url: https://research.meta.ai/blog/security-and-safety-for-ai-agents-our-approach-with-muse
          - title: Muse privacy policy
            url: https://muse.ai/privacy
        note: >-
          External. Record that Muse is a consumer service with no business terms or DPA, that the VM is
          readable by Meta until the announced Confidential VM ships, and that training is on by default.
        verified: "2026-10-22"
      - mitigation: cap-agent-tracing
        coverage: partial
        mechanism: The avatar opens a full activity log of completed and planned actions and the permissions approved; data download from Data controls.
        steps:
          - title: Read the activity log
            body:
              - Tap the Muse avatar for its activity log and approved permissions; use Settings > Data controls >
                Download your Muse data for a copy.
            url: https://introducing.muse.ai/
        note: >-
          Partial on the consumer rule: a person-facing log with an export, but no organisation feed and no
          documented step-level detail of what the browser read.
        verified: "2026-10-22"
      - mitigation: cap-agent-kill-switch
        coverage: partial
        mechanism: Reset Muse erases chat history, files and active tasks; connectors can be disconnected in Settings > Connectors.
        steps:
          - title: Stop and wipe
            body:
              - Settings > Data controls > Reset Muse erases chat history, files and active tasks and cannot be
                undone; disconnect connectors in Settings > Connectors to cut future access.
            url: https://www.meta.com/help/superintelligence/2225571704857152/
        note: >-
          Partial: the only documented stop is destructive, its cessation delay is not stated, and no
          non-destructive pause appears in Meta's pages. No organisation can trigger it.
        verified: "2026-10-22"
    advisories: []
    sources:
      - title: "Introducing Muse: The World's First Personal AI Agent Built for Everyone"
        url: https://about.fb.com/news/2026/09/introducing-muse-personal-ai-agent/
      - title: How we built safety into Muse
        url: https://research.meta.ai/blog/security-and-safety-for-ai-agents-our-approach-with-muse
      - title: How we designed Muse
        url: https://introducing.muse.ai/
      - title: How to manage your Muse data
        url: https://www.meta.com/help/superintelligence/2225571704857152/
      - title: How Muse works with Connectors
        url: https://www.meta.com/help/superintelligence/1687253048996149/
      - title: "The Future Is for Everyone: Muse for Small Business"
        url: https://about.fb.com/news/2026/09/introducing-muse-small-business/
