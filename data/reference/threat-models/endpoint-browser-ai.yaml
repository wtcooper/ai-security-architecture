pattern: archAgenticBrowser
reviewed: "2026-11-24"
summary: >-
  A browser agent reads pages anyone can write and acts inside a profile already signed in to the
  user's mail, calendar and internal applications. A line of hidden text can become a send, a
  purchase or a copied record, made with the user's cookies and indistinguishable from the user.
  Extensions add a store supply chain with silent updates. Vendors say prompt injection is not
  solved and their classifiers are the last check inside the product, so harm is bounded by what
  the profile can reach, where the agent may act and which extensions may install.
concentrates: >-
  An everyday profile signed in to mail and internal apps, with saved passwords, no site limits and
  extensions anyone can install: one hostile page or one silent update then reaches everything the
  user can, on requests that look like the user's own.
scope: >-
  Staff use a built-in browser agent or a vendor's extension in their everyday profile, signed in
  to mail, calendar, workspace and internal apps, at vendor defaults: confirmations as shipped, no
  site limits, extensions installable by users, browser traffic not inspected.
lists: [owasp-llm-2026, owasp-agentic]
assets:
  - "The signed-in sessions in the profile: mail, calendar, workspace and internal apps"
  - "What those sessions show: messages, records, files and one-time codes"
  - "Saved passwords and payment methods the profile holds"
  - "Actions taken as the user: sends, purchases, sharing and permission changes"
  - "Pages, screenshots and memories sent to the vendor and kept there"
actors:
  - who: "Author of content the agent reads"
    access: "Writes a page, comment, email, invite or document the agent opens; needs no exploit"
    wants: "Data from signed-in sites, or actions taken as the user"
  - who: "Malicious or compromised extension publisher"
    access: "An extension the user installs from a store, replaced by whatever the next automatic update delivers"
    wants: "Control of the assistant and of every page it can read"
  - who: "The user, approving"
    access: "Answers the agent's confirmations, often while working in another tab"
    wants: "The task done; approves what they did not read"
  - who: "The agent itself, no adversary"
    access: "The profile's sessions and the browser's tools"
    wants: "None; misreads a goal, clicks past it or loops"
  - who: "The vendor and its sub-processors"
    access: "Receive the goal, extracted pages, screenshots and memories for inference and retention"
    wants: "Product operation; trusted but outside your control"
threats:
  - id: T1
    title: "A page the agent reads steers it to act on another signed-in site"
    rating: critical
    evidence: disclosed
    story: >-
      Hidden text in a page, comment, email or invite becomes the agent's next step. It opens the
      mail tab or an internal app in the same profile and acts with the user's cookies, and the
      site sees the user. Disclosed against several AI browsers in 2025 and 2026, with one
      vendor's first fix judged incomplete.
    at: [webInspection->openWeb, browser, webInspection->downstream]
    risks: [riskPromptInjection, riskAgenticDelegationConfusedDeputy]
    atlas: [AML.T0051.001, AML.T0068, AML.T0053]
    owasp: [LLM01:2026, ASI01, ASI03]
    controls: [D3-CTS, AML.M0028, cap-agent-action-policy-enforcement, cap-input-guardrails]
    refs:
      - { title: "Brave: prompt injection in Perplexity Comet", url: "https://brave.com/blog/comet-prompt-injection/" }
      - { title: "University of Washington: agentic browsers and the same-origin policy", url: "https://agent-security.cs.washington.edu/agentic_browsers_sop.html" }
  - id: T2
    title: "What the agent read on one site is typed or sent to the attacker's page"
    rating: high
    evidence: disclosed
    story: >-
      Once steered, the agent types mail, records or a one-time code into a form on a page the
      attacker owns, or encodes it into a link. The request looks like browsing, typing rarely
      triggers a confirmation, and encoding the data has evaded a vendor's exfiltration check.
    at: [toolPlane->browser, browser->webInspection, webInspection->openWeb]
    risks: [riskSensitiveDataDisclosure]
    atlas: [AML.T0086, AML.T0085.002]
    owasp: [LLM02:2026, ASI02]
    controls: [cap-agent-egress-control, cap-sensitive-data-redaction, D3-WSAA, D3-CTS]
    refs:
      - { title: "Embrace The Red: ChatGPT Operator prompt-injection exploits", url: "https://embracethered.com/blog/posts/2025/chatgpt-operator-prompt-injection-exploits/" }
      - { title: "LayerX via Akamai: CometJacking", url: "https://www.akamai.com/blog/security/2025/oct/cometjacking-how-one-click-can-turn-perplexitys-comet-ai-browser-against-you" }
  - id: T3
    title: "An extension, or a silent update to one, takes over the assistant"
    rating: high
    evidence: disclosed
    story: >-
      An extension from the store uses abilities any extension can request to get inside the pages
      the assistant trusts and hand it a whole prompt; no model is tricked. The assistant then
      reads files, takes screenshots and sends mail with the browser's privileges. One researcher
      showed this in five browsers in 2026.
    at: [openWeb->browser, browser, harness]
    risks: [riskToolSourceProvenance, riskInsecureIntegratedComponent]
    atlas: [AML.T0010.001, AML.T0011.001, AML.T0053]
    owasp: [LLM04:2026, ASI04]
    controls: [cap-agent-tool-registry, cap-shadow-ai-discovery, D3-CTS, cap-ai-vendor-assessment]
    incidents: [bragjack-browser-assistants]
  - id: T4
    title: "Consequential clicks go through without a real confirmation"
    rating: high
    evidence: research
    story: >-
      A purchase with the saved card, a send or a sharing change is one click. The actions a
      confirmation covers are fewer than users assume, users can often switch it off, and a person
      in another tab approves what they did not read. In tests an AI browser bought from a fake
      shop with saved card details.
    at: [user->harness, harness, webInspection->downstream]
    risks: [riskRogueActions, riskInsecureModelOutput]
    atlas: [AML.T0053, AML.T0048.000]
    owasp: [LLM03:2026, LLM10:2026, ASI09, ASI02]
    controls: [AML.M0029, D3-CTS, cap-agent-action-policy-enforcement]
    refs:
      - { title: "Guardio Labs: Scamlexity, agentic AI browsers put to the test", url: "https://guard.io/labs/scamlexity-we-put-agentic-ai-browsers-to-the-test-they-clicked-they-paid-they-failed" }
  - id: T5
    title: "A planted memory steers later tasks"
    rating: medium
    evidence: observed
    story: >-
      A page or a crafted 'summarise with AI' link writes an instruction or a false preference into
      the agent's memory, which later tasks read back as context, so one visit keeps steering.
      Links of this kind from 31 companies were found telling assistants to remember them as
      trusted sources.
    at: [toolPlane->memory, memory]
    risks: [riskPromptInjection]
    atlas: [AML.T0080.000, AML.T0131]
    owasp: [LLM01:2026, ASI06]
    controls: [AML.M0031, cap-input-guardrails]
    refs:
      - { title: "Microsoft Security: AI Recommendation Poisoning", url: "https://www.microsoft.com/en-us/security/blog/2026/02/10/ai-recommendation-poisoning/" }
  - id: T6
    title: "Whole pages, screenshots and every tab opened go to the vendor and stay"
    rating: medium
    evidence: observed
    story: >-
      The agent sends the pages and screenshots it read, more than the user pictured sharing, and
      most products sync memories to the vendor. Retention follows the vendor's terms
      and its sub-processors': in 2026 an inference provider kept a customer's AI chats despite a
      zero-retention commitment, and was breached.
    at: [harness->webInspection, webInspection->vendorService, vendorService->provider]
    risks: [riskExcessiveDataHandlingDuringInference, riskSensitiveDataDisclosure]
    atlas: [AML.T0085.002]
    owasp: [LLM02:2026]
    controls: [cap-sensitive-data-redaction, cap-ai-vendor-assessment, AML.M0031]
    refs:
      - { title: "Notion: security incident involving a third-party AI vendor", url: "https://notion.com/help/security-incident-involving-a-third-party-ai-vendor" }
  - id: T7
    title: "Assistants nobody enrolled run on personal accounts with no limits"
    rating: medium
    evidence: observed
    story: >-
      Assistant panels ship switched on and extensions are one click, so agents run in profiles
      nobody enrolled, often signed in to a personal vendor account outside the agreement, with no
      site limits, no audit and no way to switch them off. An unapproved AI tool's grant led to an
      account takeover in 2026.
    at: [harness, browser]
    risks: [riskShadowAndUnknownAgents]
    atlas: []
    owasp: [ASI03]
    controls: [cap-shadow-ai-discovery, D3-MFA, cap-agent-tool-registry, cap-agent-kill-switch, cap-agent-tracing]
    incidents: [identity-and-shadow-ai]
coverage:
  - { id: "LLM05:2026", why: "The agent trains nothing; memory poisoning is T5, and poisoning of the vendor's own model is the vendor's to answer in your assessment." }
  - { id: "LLM06:2026", why: "A looping agent repeats real requests on the vendor's meter; spend limits in the vendor console bound it, and no incident shows harm beyond the session." }
  - { id: "LLM07:2026", why: "A wrong summary matters less here than a wrong action, which T4 covers." }
  - { id: "LLM08:2026", why: "The vendor's own instructions give an attacker little; what is sensitive in context is the user's pages, covered by T2 and T6." }
  - { id: "LLM09:2026", why: "No retrieval index in this drawing; memories are read back whole as context, which T5 covers." }
  - { id: "ASI05", why: "The agent drives the browser's own tools, not a shell; code an extension runs is T3, and a download it is steered to start is T4." }
  - { id: "ASI07", why: "One agent per profile; its calls to the vendor are not messages between agents." }
  - { id: "ASI08", why: "A session is one user's; nothing here chains agents, and the vendor's spend limits bound a run that loops." }
  - { id: "ASI10", why: "No incident shows a browser agent pursuing a goal of its own; misreading a task and clicking past it is T4." }
questions:
  - "Which profile does the agent run in, which sites is it signed in to, and are saved passwords and payment methods within its reach?"
  - "Which sites may the agent act on, read only, or not touch at all, and is that set by policy the user cannot change?"
  - "Which extensions and AI browsers may install, by identifier, and how is each new version decided?"
  - "Which actions need confirmation, can users switch it off, and does an admin setting lock it on?"
  - "What does the vendor receive and keep (pages, screenshots, memories), for how long, and which sub-processors see it?"
  - "Would your records show the agent reading one site and then submitting a form on another?"
  - "Can you remove the extension, disable the agent and sign its profile out everywhere within the hour?"
