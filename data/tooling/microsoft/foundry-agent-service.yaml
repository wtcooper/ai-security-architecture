                <agent>); a Foundry User on the project can act on every user's sessions.
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/manage-hosted-sessions
          - title: Refuse new requests
            body:
              - >-
                POST to the agent's :disable action, or open the agent's Details tab and edit Status; the agent
                rejects requests while its configuration and versions stay intact.
            url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/manage-hosted-agent
          - title: Block the agent from the tenant
            body:
              - >-
                As AI Administrator, Global Administrator, owner or sponsor, choose Block in Agent 365 or Disable in
                this tenant in Microsoft Entra; the effective state can take up to 10 minutes to change.
            url: https://learn.microsoft.com/en-us/azure/foundry/control-plane/govern-agent-infrastructure-entra-admin
        note: >-
          Partial on the kill-switch rule (toolBedrockAgentcore is native on StopRuntimeSession): for hosted agents
          stop, block and revoke are each documented (stopping a session ends its container, and a turn that does
          not reach a checkpoint in the grace period is forcibly ended), but for prompt agents only a response
          created with background=true can be cancelled (POST /openai/v1/responses/{response_id}/cancel); a
          synchronous response has no documented interrupt, and what disable does to in-flight work is not
          stated (the agent "rejects requests"). An Entra block takes up to 10 minutes, and agents created before
          2026-10-23 16:00 UTC bypass Entra-state enforcement entirely, so only the Foundry-side disable stops
          them. Cancel is cooperative and works only on background responses; the Invocations cancel route does
          nothing unless the agent's code registers a handler; the .NET StopSession method in
          Azure.AI.Projects.Agents 2.1.0-beta.4 fails at runtime, so use REST. No policy or compliance change stops
