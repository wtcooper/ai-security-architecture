  - architecture: archRemoteMcpServer
    asOf: "2026-10"
    reference:
      - title: Guidance for Deploying Model Context Protocol Servers on AWS
        url: https://aws.amazon.com/solutions/guidance/deploying-model-context-protocol-servers-on-aws/
      - title: Tool-based agents for servers (AWS Prescriptive Guidance)
        url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-patterns/tool-based-agents-for-servers.html
      - title: Deploy MCP servers in AgentCore Runtime
        url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-mcp.html
    summary:
      - >-
        A stateless MCP server on AgentCore Runtime, published through AgentCore Gateway with AWS
        WAF, taking tokens from an Amazon Cognito user pool that federates to your identity provider.
        AWS's guidance fronts the servers with CloudFront, WAF and a load balancer and runs its own
        MCP auth service beside Cognito; the gateway here adds per-tool rate limits, interceptors and
        a static tool schema. Cognito's token endpoint takes authorization code, refresh and client
        credentials grants, so the enterprise-managed (ID-JAG) and token-exchange profiles are the
        part you add.
    bindings:
      - { block: idp, service: Your corporate identity provider, build: true, note: "IAM Identity Center or a third-party IdP, federated to the Cognito user pool. The identity-assertion grant (ID-JAG) is that IdP's feature, where it has one." }
      - { block: gateway, service: AgentCore Gateway with AWS WAF, note: "AWS's MCP guidance uses CloudFront, AWS WAF and an Application Load Balancer here." }
      - { block: authServer, service: Amazon Cognito and your MCP auth service, note: "Cognito issues and revokes the tokens; the auth service (on ECS in AWS's guidance) adds the grant profiles Cognito does not take." }
      - { block: service, service: Your MCP server on AgentCore Runtime, note: "Stateless streamable HTTP at /mcp. Amazon ECS or Lambda behind the load balancer is the guidance's alternative." }
      - { block: toolDefs, service: Versioned tool definitions in your repository, build: true, note: "Published as an approved MCP record in AWS Agent Registry." }
      - { block: orgData, service: Your systems of record, build: true, note: "Each reached on its own vaulted credential or an exchanged downstream token." }
