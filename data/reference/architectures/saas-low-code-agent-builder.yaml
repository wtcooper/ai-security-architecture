id: archLowCodeAgentBuilder
surface: surfaceSaas
rank: 2
title: UI/low-code managed agent runtime
abbrev: UI/low-code runtime

summary:
  - >
    A vendor platform where non-engineers assemble agents from prompts, connectors and triggers.
    The agents are real, the authors are not engineers, and there is no code review between an
    afternoon's work and something that acts on production data.

description:
  - >
    The builder is a self-service surface, and that is both the product and the problem. A
    business user can create an agent, grant it connectors, give it a trigger and publish it to
    colleagues without any of the checkpoints a software delivery pipeline would impose — no pull
    request, no staged rollout, no security sign-off unless the platform enforces one. The result
    is a population problem rather than an instance problem: individual agents are simple; the
    risk is four hundred of them, each with connector grants, each authored by someone who has
    left, and no way to list which reach customer data.
  - >
    Credential inheritance is the specific technical trap. A low-code agent typically runs on
    connections authorised by its author, so a published agent lends its author's access to every
    colleague who uses it. A user who could not read a table directly can often read it through an
    agent someone else built, and neither party intended that. Whether the platform supports
    per-invoker authorisation rather than author-credential execution is the single question worth
    asking during evaluation.
  - >
    The authoring surface is also an injection surface: instructions, knowledge sources and
    connector descriptions are assembled by someone who is not thinking about untrusted input, and
    a shared agent's knowledge source is frequently a folder anyone can write to. Because no
    sandbox or runtime enforcement can be inserted into a vendor's execution, every control drawn
    here is a population control — inventory, publication gating, connector policy, and audit that
    can retire what nobody uses.

distinguishedBy:
  - >
    Against the API/SDK managed agent runtime: same hosting model, different author. There
    engineers define agents in code and the delivery pipeline still applies; here the builder UI
    replaces that pipeline with a publish button, and the unit of concern moves from the
    definition of one agent to the governance of a population.
  - >
    Against an internal AI platform you operate: same intent — a paved road for many builders —
    with the paving done by a vendor. You inherit their guardrails and their environment model,
    and you cannot add a deployment gate they did not build.

exemplars:
  - name: Suite-embedded agent builders
    note: >
      Low-code agent authoring bundled with a productivity or CRM suite, available to any licensed
      user by default unless an administrator turns it off.
    asOf: "2026-08"
  - name: Standalone agent-building platforms
    note: >
      Vendor platforms whose product is the builder itself, with connector marketplaces and
      publication to internal or external audiences.
    asOf: "2026-08"

zones:
  - id: zoneUser
    owner: user
    note: >
      Two populations, and the distinction is the archetype: the colleagues who build agents
      without being engineers, and the colleagues who then use what they published.
  - id: zoneVendor
    owner: vendor
    note: >
      The platform, and effectively the whole system. Authoring, the orchestrator, the model
      calls, the sandbox and the connector runtime all execute here — there is no
      customer-hosted agent runtime on offer. Drawn before our own band because a maker reaches
      the platform first and the platform reaches back into us second.
  - id: zoneCloud
    owner: cloud
    note: >
      The narrow strip that is still ours: the gateway a published agent is admitted through,
      our own tool servers behind it, and the on-premises data gateway for the systems that
      never leave our network.
  - id: zoneExternal
    owner: external
    note: The model the vendor calls on our behalf, and the third-party services their connectors reach.
  - id: zoneGovernance
    owner: governance
    note: >
      On a self-service platform this band is population management rather than change review.
      There is no deployment pipeline to hook into — which is precisely why the platform's own
      policy engine matters more here than anywhere else in the catalogue.

blocks:
  - id: builder
    kind: actor
    title: Citizen builder
    icon: person
    zone: zoneUser
    col: 0
    row: 0
    note: >
      Someone who is not an engineer, shipping software. No pull request, no pipeline, no
      review — which is not a gap in their discipline but the product working as designed.

  - id: consumer
    kind: actor
    title: Agent consumers
    icon: people
    zone: zoneUser
    col: 0
    row: 1
    note: >
      Colleagues who run what a maker published, usually without knowing who built it or whose
      access it acts on.

  - id: platform
    kind: provider
    title: Agent builder platform
    cosaiComponent: componentApplication
    zone: zoneVendor
    col: 1
    row: 1
    note: >
      One block, because from our side it is one thing: the authoring surface, the orchestrator,
      the harness, the sandbox and the connector runtime all run in the vendor's cloud. The only
      part of it we operate is policy configuration, and that is the whole of our leverage.
    items:
      - id: authoring
        label: Authoring surface
        icon: code
        note: Where an agent is built and published, by someone who does not think of it as shipping.
      - id: agentRuntime
        label: Agent runtime
        icon: agent
        note: Their harness executing the maker's agent, with the model calls theirs to make.
      - id: connectorFramework
        label: Connector framework
        icon: plug
        note: >
          Hundreds of prebuilt connectors, executing in their cloud on credentials that are the
          crux of this page.

  - id: aiGateway
    kind: service
    title: AI gateway
    zone: zoneCloud
    col: 2
    row: 1
    note: >
      Where a published agent is admitted into our systems, and the one hop on that path we
      run. It carries no inference here — the vendor calls its own model — so this is purely
      about tools and data, which is the useful distinction from every other gateway in the
      catalogue.
    items:
      - id: gwTools
        label: MCP & tool broker
        icon: plug
        note: Which of our servers a published agent may reach, and on whose grants.
      - id: gwSkills
        label: Skills broker
        icon: gear
        note: Reusable instructions and connectors published for agents to draw on.

  - id: internalTools
    kind: service
    title: Tool services
    cosaiComponent: componentTools
    zone: zoneCloud
    col: 3
    row: 1
    pack: toolServicesRemote
    note: >
      Our own MCP servers and connectors. The platform's MCP path is not a policy bypass — the
      same data policies that regulate its connectors regulate its MCP tools — but reaching one
      of ours still needs a publicly resolvable endpoint.

  - id: dataGateway
    kind: service
    title: Tunnel connector
    cosaiComponent: componentAgentUserQuery
    zone: zoneCloud
    col: 3
    row: 2
    note: >
      The on-premises data gateway, and the only customer-operated component in the entire
      architecture. A service on our own host making outbound-only connections, so nothing is
      opened inbound. It relays data; it does not run agents, and it has hard payload limits
      that make it a query path rather than a bulk one.
    items:
      - id: outbound
        label: Outbound connector
        icon: plug
        note: Polls outward; no inbound firewall rule, and a small ceiling on what any one call may carry.

  - id: orgData
    kind: external
    title: Enterprise data
    cosaiComponent: componentDataSources
    zone: zoneCloud
    col: 4
    row: 1
    pack: enterpriseData
    note: >
      The systems of record a maker attached as grounding or as an action target — often
      without anyone asking whether the agent's audience should reach them.

  - id: provider
    kind: provider
    title: Model provider
    cosaiComponent: componentModelServing
    zone: zoneExternal
    col: 5
    row: 0
    pack: modelProvider
    note: >
      The vendor's model, called by the vendor. We neither broker it nor hold the key, which is
      why our own gateway carries no inference on this page.

  - id: extTools
    kind: service
    title: Tool services
    cosaiComponent: componentTools
    zone: zoneExternal
    col: 5
    row: 3
    pack: toolServicesRemote
    note: Third-party services the platform's connectors reach, on whichever credential the maker chose.

  - id: govIdentity
    kind: governance
    title: Identity services
    icon: person
    zone: zoneGovernance
    col: 1
    row: 5
    capabilities: [capabilityIga, capabilityNhiManagement]
    note: >
      Whose credentials a published agent runs on, which on this platform is a configuration
      choice with four answers. End-user credentials are the default and the safe one. Maker
      credentials are the ambient-authority case: every consumer of that agent transitively
      inherits the maker's access to the backend. The platform's own inventory records which
      mode each connector uses, and that field is the single most useful thing an administrator
      can query here.

  - id: govPolicy
    kind: governance
    title: Policy & authorization
    icon: scale
    zone: zoneGovernance
    col: 2
    row: 5
    capabilities: [capabilityToolPermissionScoping, capabilityHitlControls, capabilityDataAccessGovernance]
    note: >
      The platform's data policies classify every connector and forbid mixing groups across the
      boundary — and unusually for this catalogue, they have teeth: a violation greys out the
      publish button outright. Exemptions were removed, so every agent is subject to them.

  - id: govSupplyChain
    kind: governance
    title: Supply-chain assurance
    icon: db
    zone: zoneGovernance
    col: 3
    row: 5
    capabilities: [capabilityAgentRegistry, capabilityAiTprm, capabilityDspm]
    note: >
      The inventory and the publication gate. On a platform where anyone can build, an agent
      nobody registered is an agent nobody can revoke — and that is the normal case rather than
      the exception.

  - id: govObservability
    kind: governance
    title: Observability & response
    icon: eye
    zone: zoneGovernance
    col: 4
    row: 5
    capabilities: [capabilityAuditLogging, capabilityAiGovernancePlatform, capabilityPromptInjectionDefense]
    note: >
      Run history, and the population view: which agents exist, who built them, which have
      outlived their author. The unit of observation here is the population, not a deployment.

edges:
  - from: builder
    to: platform
    path: external
    bidir: true
    label: authors & publishes
    note: >
      Built and shipped inside the vendor's surface. No pipeline is involved, so there is no
      place to insert a review that the platform does not itself provide.
  - from: consumer
    to: platform
    path: external
    bidir: true
    label: uses a published agent
    note: Colleagues run what a maker published, on whichever credential the maker configured.
  - from: platform
    to: provider
    path: external
    bidir: true
    route: vh
    label: their model
    note: >
      The vendor calls its own model provider. We are not on this path and hold no key for it,
      which is why our gateway carries tools and data only.
  - from: platform
    to: aiGateway
    path: external
    bidir: true
    label: connector calls into our systems
    note: >
      The one hop we own. A vendor-hosted agent reaching our data crosses here or it does not
      reach it at all.
  - from: aiGateway
    to: internalTools
    path: primary
    bidir: true
    label: brokered tool calls
    note: Which of our servers a published agent may call, on grants we scope rather than the maker's standing access.
  - from: internalTools
    to: orgData
    path: primary
    bidir: true
    label: scoped reads & writes
    note: Grounding content and action targets, reached on our terms.
  - from: dataGateway
    to: orgData
    path: primary
    bidir: true
    route: hv
    label: on-prem query
    note: >
      For systems that never leave our network. The gateway relays rather than hosts, and its
      payload ceiling makes it a query path rather than a bulk one.
  - from: platform
    to: dataGateway
    path: external
    bidir: true
    route: vh
    label: outbound-only relay
    note: >
      Their cloud reaching an on-premises source through software we run. Outbound-only, so
      nothing is opened inbound.
  - from: platform
    to: extTools
    path: external
    bidir: true
    route: vh
    label: third-party connectors
    note: >
      Connectors reaching services outside both environments. This path never touches our
      network, so the connector policy in their tenant is the only control on it.

pins:
  risks:
    - risk: riskAgenticDelegationConfusedDeputy
      at: aiGateway
      note: >
        The defining risk of the archetype. A maker attaches a connector on their own
        credentials and publishes to a team; every consumer then transitively holds the maker's
        access to that backend. Nobody granted it and nobody sees it in an access review.
    - risk: riskShadowAndUnknownAgents
      at: builder
      note: >
        An agent is a form away, built by someone who does not think of themselves as shipping
        software. Without a registry the population is unbounded, and agents outlive the people
        who built them.
    - risk: riskRogueActions
      at: internalTools->orgData
      note: Writes into systems of record from an agent nobody reviewed.
    - risk: riskRetrievalVectorStorePoisoning
      at: orgData
      note: >
        A maker attaches a folder as grounding and the platform indexes it. Whoever can write
        to that folder can write to the index, and every agent grounded on it reads what they
        left — the poisoning is of the retrieval source, not of the model.
    - risk: riskPromptInjection
      at: platform->extTools
      note: >
        Grounding content and connector results re-enter the agent as instruction. A document
        dropped in a shared folder is an instruction channel on this platform.
    - risk: riskSensitiveDataDisclosure
      at: dataGateway->orgData
      note: >
        The on-premises path reaches systems that were never meant to be internet-adjacent, and
        the credentials it caches sit on a host somebody has to patch.
    - risk: riskExcessiveDataHandlingDuringInference
      at: platform->provider
      note: Grounding content leaves for a model we do not broker and hold no key for.

  capabilities:
    - capability: capabilityIga
      at: consumer->platform
      note: >
        Whose credentials the agent runs on — end user, maker, on-behalf-of, or a service
        principal. Default to end-user credentials; maker-provided is the ambient-authority
        case and should be a deliberate, reviewed exception.
    - capability: capabilityNhiManagement
      at: aiGateway
      note: Each connector grant is an identity with a lifecycle, not a setting somebody ticked once.
    - capability: capabilityAgentRegistry
      at: platform
      note: >
        The platform's own inventory, queried rather than assumed — including which connectors
        use maker credentials, which is the field that finds the ambient-authority agents.
    - capability: capabilityHitlControls
      at: platform
      note: >
        The publication gate, which on this platform actually blocks: a data-policy violation
        greys out publish, and exemptions no longer exist.
    - capability: capabilityToolPermissionScoping
      at: aiGateway->internalTools
      note: Which of our servers a published agent may reach, decided at our tier rather than by the maker.
    - capability: capabilityDataAccessGovernance
      at: internalTools->orgData
      note: >
        Classification of what a maker may attach as grounding. The default connector set is
        the real policy, and a permissive default is a decision nobody remembers making.
    - capability: capabilityDspm
      at: orgData
      note: Knowing what is behind a connector before it is attachable turns discovery into a decision.
    - capability: capabilityPromptInjectionDefense
      at: platform->extTools
      note: Treat grounding and connector output as untrusted on the way back into the agent.
    - capability: capabilityAiTprm
      at: platform
      note: >
        Their runtime, their sandbox, their model. Assured by assessment rather than drawn,
        because none of it is ours to inspect.
    - capability: capabilityEncryptionKeyManagement
      at: platform
      note: >
        Customer-managed keys over the platform's stored data — available on the managed tier
        only, not retroactive, and slow enough to enable that it is a planned change.
    - capability: capabilityAuditLogging
      at: govObservability
      note: Run history and maker activity, exported where we can query it rather than left in their console.
    - capability: capabilityAiGovernancePlatform
      at: govObservability
      note: The population view — every agent somebody built, and which of them still have an owner.

walkthrough:
  title: An agent is built, published, and used
  moves: >-
    A colleague assembles an agent from prompts and connectors; another colleague runs it.
  steps:
    - follow: builder->platform
      note: >
        Built and published inside the vendor's surface by someone who is not an engineer. No
        pipeline is involved, so the platform's own publish gate is the only review there is —
        and governance here is population management rather than change review.
    - follow: platform->provider
      note: >
        The vendor calls its own model, on its own key. We are not on this path — which is why
        our gateway carries tools and data only.
    - follow: consumer->platform
      note: >
        A colleague runs what was published — on their own credentials if the maker chose
        end-user auth, and on the maker's if they did not.
    - follow: platform->aiGateway
      note: The one hop we own. A published agent reaching our data crosses here or not at all.
    - follow: aiGateway->internalTools
      note: Scoped to grants we decided, rather than to the maker's standing access.
    - follow: internalTools->orgData
      note: The records the agent was built to reach.
    - follow: platform->dataGateway
      note: >
        For systems that never leave our network, their cloud reaches an on-premises source
        through a connector we operate.
    - follow: dataGateway->orgData
      note: A query path rather than a bulk one — the connector caps what any single call carries.

scenarios:
  - title: A maker attaches a connector on their own credentials
    steps:
      - follow: builder->platform
        note: Prompt written, connectors attached, agent published to a team.
      - follow: consumer->platform
        note: >
          Colleagues run it — and inherit the maker's access to whatever it was attached to.
          The gap between who built an agent and whose access it uses is where this
          archetype's incidents live.
      - follow: platform->aiGateway
        note: Which is only bounded at all because the reach into our systems crosses a tier we run.
  - title: A shared drive becomes an instruction channel
    steps:
      - follow: internalTools->orgData
        note: An agent reads a folder somebody uses as grounding.
      - follow: platform->extTools
        note: >
          A document written by anyone with access to that folder returns as model input, and
          the agent acts on it with the maker's authority.
  - title: The author leaves
    steps:
      - follow: builder->platform
        note: An agent outlives the person who built it, still holding their connector grants.
      - follow: platform->aiGateway
        note: >
          Our gateway is where that grant can be cut, since the agent itself is not ours to
          delete.

deviations:
  - subject: The AI gateway does not reach a model provider
    reason: >
      Everywhere else in the catalogue the gateway is the model path, and the registered
      pattern says so. Here it is not: the vendor calls its own model, on its own key, and our
      gateway exists only to admit a published agent to our tools and data. Drawing an
      inference leg out of our gateway would assert a broker we do not operate. The model edge
      is therefore vendor to provider — a property this drawing shares with its two SaaS
      siblings and the MCP publisher, each recording it the same way. It is drawn with its own items rather than the registered
      aiGatewayTraffic pack for the same reason: no model proxy, because there is no model
      traffic to proxy.
  - subject: The vendor platform is a single block despite containing an orchestrator, a harness and a sandbox
    reason: >
      The three-zone responsibility rule forbids drawing vendor internals we cannot inspect. On
      a platform with no customer-hosted runtime option, everything but policy configuration is
      theirs, so the honest drawing is one block assured by assessment rather than four boxes
      implying visibility we do not have.

