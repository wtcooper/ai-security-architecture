# Google Cloud: the first-party cloud architectures as built on Google Cloud (Gemini Enterprise
# Agent Platform, formerly Vertex AI), and the security-relevant settings that secure them. One
# settings library per cloud, so a setting used by several architectures is one row with one
# status in data/org/products.yaml; each implementation binds the drawing's blocks to services and lists
# the settings that apply to it.
#
# Every row follows data/tooling/BASELINE.md: the setting's name as Google's page gives it, a url
# that resolved on its verified date, the baseline value, and the controls on the drawing it
# delivers. setVia "code" marks a control no Google Cloud setting provides: the organisation builds
# it into its own agent. Product names follow the current docs: Vertex AI is now Gemini Enterprise
# Agent Platform, Vertex AI Agent Engine is Agent Runtime, and Vertex AI Search is Agent Search.
id: cloudGcp
name: Google Cloud
short: Google Cloud

settings:
  # --- Identity & access ---------------------------------------------------------------
  - id: iapCloudRun
    name: Require authentication — Identity-Aware Proxy (IAP)
    where: Cloud Run › (front-end service) › Security; access granted under Manage user or group access
    setVia: [cloudPolicy, apiCli]
    area: identity
    recommended: "On (--iap), access granted to the Google groups that use the app"
    why: Only signed-in members of the granted groups reach the app at all — on every ingress path, the run.app URL and the load balancer alike — and each session carries a Google identity.
    mitigations: [D3-APA]
    url: https://docs.cloud.google.com/run/docs/securing/identity-aware-proxy-cloud-run
    verified: "2026-10-30"
  - id: cloudRunServiceIdentity
    name: User-managed service account (service identity)
    where: Cloud Run › (agent service) › Security › Service account
    setVia: [cloudPolicy, apiCli]
    area: identity
    default: Compute Engine default service account
    recommended: "A user-managed service account, which Google recommends over the default, granted only the minimal permissions the service needs. One account per service is this mapping's choice, not Google's wording, so each agent or server is scoped and disabled on its own"
    why: The agent calls the gateway, the model and its stores on short-lived tokens the platform issues to its own identity — no key in its configuration to steal. Agent Identity (SPIFFE-based, Preview on Cloud Run) is the successor.
    mitigations: [D3-AA, D3-CH]
    url: https://docs.cloud.google.com/run/docs/securing/service-identity
    verified: "2026-11-18"
  - id: disableSaKeyCreation
    name: Disable service account key creation
    where: Organization Policy › iam.disableServiceAccountKeyCreation (or the managed iam.managed.disableServiceAccountKeyCreation)
    setVia: [cloudPolicy]
    area: identity
    default: Enforced on organisations created on or after 3 May 2024; not enforced on older ones
    recommended: Enforced at the organisation
    why: No long-lived key for an agent's service account can be minted, so there is no key to copy out of a config file or repository and replay elsewhere.
    mitigations: [D3-CH]
    url: https://docs.cloud.google.com/organization-policy/restrict-service-accounts
    verified: "2026-10-30"
  - id: apigeeVerifyIam
    name: VerifyIAM policy
    where: Apigee (Google-hosted, not Apigee hybrid) › API proxies (model and MCP proxies) › request PreFlow
    setVia: [cloudPolicy]
    area: identity
    default: No policy
    recommended: "On every model and MCP proxy in Google-hosted Apigee, checking the calling workload's Google identity against IAM. It is not available on Apigee hybrid, and it is not among the policies the Apigee Operator for Kubernetes can add to a GKE Gateway: on that path one Apigee proxy handles all traffic, so check callers there with VerifyAPIKey or OAuthV2, as Google's Inference Gateway guide does with API keys"
    why: The gateway verifies which workload is calling before any model or tool call passes, and an identity without the IAM grant is refused.
    mitigations: [D3-AA]
    requires: Apigee (not available on Apigee hybrid)
    url: https://docs.cloud.google.com/apigee/docs/api-platform/reference/policies/verify-iam-policy
    verified: "2026-11-18"
  - id: authManager3lo
    name: 3-legged OAuth auth provider (Agent Identity auth manager)
    where: Agent Identity auth manager › auth providers (3-legged OAuth); the agent's ADK tools request the credential from the vault per call. Google gives no console path
    setVia: [cloudPolicy, code]
    area: identity
    default: Not configured
    recommended: "Downstream OAuth tokens held in the auth manager's vault per user; the agent never stores them. Google's page describes the auth manager only with Agent Runtime. On Cloud Run, Agent Identity comes through Agent Platform features for Cloud Run (Preview, --identity-type=agent-identity), a new principal that does not inherit the service account's roles, so confirm the auth manager works for your Cloud Run agent or keep the tokens in a store you build"
    why: Calls to SaaS tools run on the signed-in user's own consented grant, brokered per call, so the agent cannot reuse one user's access for another.
    mitigations: [D3-CTS]
    url: https://docs.cloud.google.com/iam/docs/auth-manager-overview
    verified: "2026-11-18"

  - id: pubsubPushAuth
    name: Authentication for push subscriptions (Enable authentication)
    where: Pub/Sub › (trigger subscription) › Push › Enable authentication, with a service account and audience; agent service deployed --no-allow-unauthenticated
    setVia: [cloudPolicy, apiCli]
    area: identity
    default: Push requests sent without a token
    recommended: "On, with a dedicated service account per trigger granted Cloud Run Invoker on the agent alone"
    why: Only messages the subscription signs can start a run, and the token names the principal whose scope the run carries — a forged webhook or stray publisher starts nothing.
    mitigations: [D3-APA]
    url: https://docs.cloud.google.com/pubsub/docs/authenticate-push-subscriptions
    verified: "2026-10-30"

  - id: subagentShortLivedTokens
    name: Short-lived credentials for a service account (generateAccessToken)
    where: IAM Service Account Credentials API — the coordinator mints each subagent's token for that subagent's own service account
    setVia: [code, apiCli]
    area: identity
    default: Maximum token lifetime 1 hour
    recommended: One service account per subagent, granted only its own tools; a token minted per step with the shortest workable lifetime
    why: A specialist calls with its own narrow identity, never the supervisor's, so each step is attributable at the gateway and revocable on its own.
    mitigations: [D3-CTS, D3-AA]
    url: https://docs.cloud.google.com/iam/docs/create-short-lived-credentials-direct
    verified: "2026-10-30"

  - id: identityPlatformTenants
    name: Identity Platform multi-tenancy (tenant identity providers)
    where: Identity Platform › Tenants › (customer tenant) › Providers (SAML or OIDC)
    setVia: [identityProvider, apiCli]
    area: identity
    default: Multi-tenancy off; one shared pool of users
    recommended: One tenant per customer organisation, each with only its own SAML or OIDC provider enabled
    why: A caller signs in only through the IdP of the organisation it belongs to, so that organisation's groups, joiners, leavers and conditional access decide who gets a token at all.
    mitigations: [D3-APA]
    url: https://docs.cloud.google.com/identity-platform/docs/multi-tenancy
    verified: "2026-10-30"
  - id: apigeeVerifyAccessToken
    name: OAuthV2 policy — VerifyAccessToken
    where: Apigee › MCP proxy (your MCP server as the backend target) › ProxyEndpoint request PreFlow, straight after ParsePayload
    setVia: [cloudPolicy]
    area: identity
    default: No credential check — any caller can invoke a proxy that lacks one
    recommended: "In the request PreFlow of every MCP proxy: ParsePayload first, then VerifyAccessToken, then Quota. Apigee treats the check as optional, so nothing adds it for you"
    why: A token passes only if it is unexpired, unrevoked and was issued to an app whose API product includes this proxy. Apigee says ParsePayload must come before any authentication or quota policy for per-tool access, so the token check is the second step.
    mitigations: [D3-CTS]
    url: https://docs.cloud.google.com/apigee/docs/api-platform/apigee-mcp/manage-mcp-tool-access
    verified: "2026-11-18"
  - id: apigeeKeyApproval
    name: Key approval (manual)
    where: Apigee › API products › (MCP product) › Access › approval type
    setVia: [cloudPolicy, apiCli]
    area: identity
    default: Automatic — every key request is approved
    recommended: Manual approval for every client app that adds the MCP product
    why: A client gets credentials for the server only after an administrator approves its app, so no client can grant itself access by registering.
    mitigations: [AML.M0028]
    url: https://docs.cloud.google.com/apigee/docs/api-platform/publish/what-api-product
    verified: "2026-10-30"
  - id: noTokenPassthrough
    name: No token passthrough (a credential per hop)
    where: Your service code — every hop calls the next on the service's own identity or a token minted for that hop
    setVia: [code]
    area: identity
    default: Depends on your handlers
    recommended: The inbound token is never forwarded; each upstream call uses a credential minted or held for that upstream alone, logged as a delegation step
    why: The caller's token stops at this server, so it cannot be replayed against another API — the confused-deputy path the MCP security guidance names.
    mitigations: [D3-CTS]
    url: https://modelcontextprotocol.io/docs/2025-11-25/tutorials/security/security_best_practices
    verified: "2026-10-30"
  - id: secretManagerSecrets
    name: Secret Manager secrets for Cloud Run (pinned versions)
    where: Cloud Run › (MCP service) › Variables & secrets › reference a secret, pinned to a version
    setVia: [cloudPolicy, apiCli]
    area: identity
    default: Credentials wherever the team put them
    recommended: One secret per upstream, mounted from Secret Manager and pinned to a version; rotation publishes a new version
    why: Each upstream's credential lives in Secret Manager, readable only by the service's identity and rotated without a code change, never in the image or its config.
    mitigations: [D3-CH]
    url: https://docs.cloud.google.com/run/docs/configuring/services/secrets
    verified: "2026-10-30"
  - id: apigeeRevokeTokens
    name: Revoke OAuth 2.0 access tokens by end user ID, app ID, or both
    where: Apigee › RevokeOAuthV2 policy in a revocation proxy, by end user ID, app ID or both; the token endpoint's OAuthV2 policy sets AppEndUser
    setVia: [cloudPolicy, apiCli]
    area: identity
    default: Tokens valid until they expire, and issued without an end user ID
    recommended: One-hour access tokens issued with the end user ID (AppEndUser in the OAuthV2 policy); a RevokeOAuthV2 proxy wired to leaver and incident workflows
    why: A revoked user's or app's tokens stop passing the gateway without waiting for expiry. Apigee caches tokens for 180 seconds, so a revoked token can still succeed for up to three minutes.
    mitigations: [D3-CR]
    url: https://docs.cloud.google.com/apigee/docs/api-platform/security/oauth/enable-retrieval-and-revocation-oauth-20-access-tokens-end-user-id-app-id-or-both
    verified: "2026-11-18"

  - id: trainingServiceAccount
    name: Use a custom service account (custom training)
    where: Agent Platform › serverless training job or pipeline run › service account
    setVia: [cloudPolicy, apiCli]
    area: identity
    default: The project's Agent Platform Custom Code Service Agent
    recommended: A service account per training pipeline, reading only its approved dataset version and writing only its own candidates; never granted the signing key
    why: Each run is attributable and bounded to what its approved specification names, and the identity that trains can never be the one that promotes.
    mitigations: [D3-AA]
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/general/custom-service-account
    verified: "2026-10-30"

  - id: workloadIdentityGke
    name: Workload Identity Federation for GKE
    where: GKE cluster and node pools › Workload Identity; a Kubernetes ServiceAccount per workload (per run, for sandboxes), bound in IAM; for sandboxes, a network policy in the SandboxTemplate that allows the GKE metadata server
    setVia: [cloudPolicy, configFile]
    area: identity
    recommended: "On, with one Kubernetes ServiceAccount per workload, granted only the calls that workload needs. For sandbox runs that means one per run: all Pods in a SandboxWarmPool share one ServiceAccount, so keep a separate SandboxTemplate and warm pool per run, or create sandboxes on demand without a pool"
    why: A workload gets short-lived tokens for its own principal from the GKE metadata server, and the node's credentials stay out of reach. Agent Sandbox's default network policy blocks the metadata server, so for sandboxes this works only once the sandbox's own policy allows it.
    mitigations: [D3-AA]
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/workload-identity
    verified: "2026-11-18"
  - id: arReaderOnly
    name: Artifact Registry Reader (roles/artifactregistry.reader)
    where: Artifact Registry › (virtual repository) › Permissions, granted to rollout and job identities
    setVia: [cloudPolicy, apiCli]
    area: identity
    default: No access
    recommended: Rollouts and jobs hold Reader only; only CI pipelines hold Writer
    why: The mirror is read-only to anything a model drives, so it cannot become a message board between rollouts or take a package published back.
    mitigations: [AML.M0028]
    url: https://docs.cloud.google.com/artifact-registry/docs/access-control
    verified: "2026-10-30"

  - id: workspaceSamlAppAccess
    name: User access (custom SAML app)
    where: Google Admin console › Apps › Web and mobile apps › (peer platform's SAML app) › User access
    setVia: [identityProvider]
    area: identity
    recommended: Off for everyone; on only for the access groups whose identity may travel to that peer platform
    why: A user's identity is asserted to a vendor's platform only when an administrator has turned the federation on for a group they belong to — a relationship someone owns, reviewed like any access grant.
    mitigations: [D3-APA]
    url: https://knowledge.workspace.google.com/admin/apps/set-up-your-own-custom-saml-app
    verified: "2026-10-30"
  - id: serviceAccountIdTokens
    name: OpenID Connect (OIDC) ID tokens for a service account (generateIdToken)
    where: IAM Service Account Credentials API — the agent's service account mints an ID token for each peer's token endpoint, which trusts Google's issuer
    setVia: [code, cloudPolicy]
    area: identity
    default: Peers registered with a shared client secret
    recommended: A service account per peer relationship; the peer federates Google's issuer and audience instead of holding a secret for us
    why: Our agent proves who it is to each peer with a short-lived token Google signs, so there is no long-lived secret per registration to leak or rotate.
    mitigations: [D3-AA]
    url: https://docs.cloud.google.com/iam/docs/create-short-lived-credentials-direct
    verified: "2026-10-30"

  # --- Data & retention ----------------------------------------------------------------
  - id: firestoreTtl
    name: TTL policy
    where: Firestore › Time-to-live › (conversation collection group) › expiry timestamp field
    setVia: [cloudPolicy, apiCli]
    area: data
    default: No TTL policy (documents never expire)
    recommended: 30 days on the conversation collection group
    why: Conversation state is deleted after it expires — typically within 24 hours — instead of accumulating client material in the agent's memory indefinitely.
    mitigations: [AML.M0031]
    url: https://docs.cloud.google.com/firestore/native/docs/ttl
    verified: "2026-10-30"
  - id: sessionsTtl
    name: Session time to live (ttl)
    where: Agent Platform Sessions › session create or update (ttl or expire_time), through ADK's VertexAiSessionService
    setVia: [code, apiCli]
    area: data
    default: 365 days
    recommended: 30 days
    why: A workflow's event history — and every tool result journalled in it — is deleted with its session instead of staying readable for a year.
    mitigations: [AML.M0031]
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sessions/manage-with-api
    verified: "2026-10-30"
  - id: agentSearchAccessControl
    name: Data source access control
    where: Agent Search (formerly Vertex AI Search) › data store creation › access control with your identity provider (Preview)
    setVia: [adminConsole, apiCli]
    area: data
    default: "Off — and it can only be chosen when the data store is created"
    recommended: On for every data store that holds permissioned content
    why: Search returns only documents the asking user can already open in the source system, so the index cannot become a way round its permissions.
    mitigations: [cap-data-access-governance, cap-retrieval-grounding-checks]
    url: https://docs.cloud.google.com/generative-ai-app-builder/docs/data-source-access-control
    verified: "2026-10-30"
  - id: checkGrounding
    name: Check grounding API
    where: Agent Search check grounding API, called on answers drawn from retrieved documents
    setVia: [apiCli, code]
    area: data
    default: Not called
    recommended: On for answers built from retrieval, with low-support answers flagged
    why: An answer whose claims the retrieved facts do not support — or that was steered away from them — is caught, with citations, before the user acts on it.
    mitigations: [cap-retrieval-grounding-checks]
    url: https://docs.cloud.google.com/generative-ai-app-builder/docs/check-grounding
    verified: "2026-10-30"
  - id: sdpDeidentify
    name: De-identification (content.deidentify)
    where: Sensitive Data Protection API, called before a turn is written to memory
    setVia: [apiCli, code]
    area: data
    default: Not called
    recommended: De-identify before storing conversation turns
    why: Personal data a user pasted is masked before it stays in the thread for every later turn — and every later reader — to see.
    mitigations: [cap-sensitive-data-redaction]
    url: https://docs.cloud.google.com/sensitive-data-protection/docs/deidentify-sensitive-data
    verified: "2026-10-30"

  - id: tenantScoping
    name: Tenant isolation in every handler
    where: Your MCP service code — the tenant from the verified token (the caller's Identity Platform tenant) scopes every query
    setVia: [code]
    area: data
    default: The protocol has no tenants; nothing is isolated by default
    recommended: Every record access filtered to the caller's tenant and delegation; no data from one tenant served to another
    why: The tenant checked in the handler is the only thing keeping one customer's records from another customer's caller.
    mitigations: [cap-data-access-governance]
    url: https://cheatsheetseries.owasp.org/cheatsheets/Multi_Tenant_Security_Cheat_Sheet.html
    verified: "2026-10-30"

  - id: gcsUniformAccess
    name: Uniform bucket-level access
    where: Cloud Storage › (weights, checkpoint, corpus or candidate bucket) › Permissions; access granted in IAM only to the identities that need the bucket
    setVia: [cloudPolicy, apiCli]
    area: data
    recommended: "On. IAM grants write to the pipeline that produces the objects and read only to the workload that loads them: the serving identity for weights and checkpoints, each training pipeline's service account for its corpus version and its own candidates. Also enforce public access prevention, a separate bucket setting (or the storage.publicAccessPrevention organisation policy) that this page does not describe"
    why: Access control lists are disabled, so IAM on the bucket is the only access path and no per-object ACL can quietly open one checkpoint or dataset.
    mitigations: [AML.M0005]
    url: https://docs.cloud.google.com/storage/docs/uniform-bucket-level-access
    verified: "2026-11-18"

  - id: sdpInspectionJobs
    name: Inspection jobs (Sensitive Data Protection)
    where: Sensitive Data Protection › inspection jobs over the Cloud Storage and BigQuery sources, run in the curation pipeline
    setVia: [apiCli, code]
    area: data
    default: Not run
    recommended: Every new source inspected before curation; findings drive de-identification or exclusion of the examples
    why: Personal and client-confidential data is found and removed while it is still a deletion, not something the model has learned.
    mitigations: [AML.M0007]
    url: https://docs.cloud.google.com/sensitive-data-protection/docs/inspecting-storage
    verified: "2026-10-30"
  - id: mlMetadataLineage
    name: Track the lineage of pipeline artifacts (ML Metadata)
    where: Agent Platform Pipelines › ML Metadata store; every ingest, curation and training step records its input and output artifacts
    setVia: [code, apiCli]
    area: data
    default: Recorded only for steps that run as pipeline components
    recommended: Every source, dataset version, base checkpoint, run and candidate recorded as artifacts and executions
    why: Where each example came from and which data, base and run produced an artifact can be answered long after the run, because it was recorded when it happened.
    mitigations: [AML.M0025, AML.M0023]
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/ml-metadata/introduction
    verified: "2026-10-30"
  - id: agentPlatformCmek
    name: Customer-managed encryption keys (CMEK)
    where: Agent Platform training, pipelines and models (encryption_spec); the corpus and candidate buckets' default Cloud KMS key
    setVia: [cloudPolicy, apiCli]
    area: data
    default: Google-managed encryption
    recommended: CMEK from a Cloud KMS key the security team holds, on every training resource and bucket
    why: The corpus, checkpoints and candidates are encrypted under keys you control, so disabling the key makes them unreadable everywhere at once.
    mitigations: [AML.M0012]
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/general/cmek
    verified: "2026-10-30"

  # --- Tools & extensions --------------------------------------------------------------
  - id: apigeeSanitizeUserPrompt
    name: SanitizeUserPrompt policy
    where: Apigee › model proxies › request flow, pointing at a Model Armor template
    setVia: [cloudPolicy]
    area: tools
    default: No policy
    recommended: On every model proxy, keeping the default FunctionResponseSource so tool results are screened on function-calling turns
    why: Model Armor screens each prompt, and the tool results going back to the model, for prompt injection and jailbreaks at the gateway before the model reads them.
    mitigations: [cap-input-guardrails]
    url: https://docs.cloud.google.com/apigee/docs/api-platform/reference/policies/sanitize-user-prompt-policy
    verified: "2026-10-30"
  - id: modelArmorFloorSettings
    name: Model Armor floor settings (inline enforcement on Agent Platform)
    where: Security › Model Armor › Floor settings (project); the integrated service is named VERTEX_AI in gcloud (--add-integrated-services) and AI_PLATFORM in the REST API
    setVia: [cloudPolicy, apiCli]
    area: tools
    recommended: "Prompt injection and jailbreak detection on, and blocking on. The two interfaces name it differently: --vertex-ai-enforcement-type=INSPECT_AND_BLOCK in gcloud, inspectAndBlock true under aiPlatformFloorSetting in REST. The default is INSPECT_ONLY"
    why: Gemini generateContent calls in the project are screened even when a caller skips the gateway; Google's page covers that method only. Screening is skipped when Model Armor is unreachable and file uploads are not screened, which is why the gateway check stays.
    mitigations: [cap-input-guardrails]
    url: https://docs.cloud.google.com/model-armor/model-armor-vertex-integration
    verified: "2026-11-18"
  - id: apigeeLlmTokenQuota
    name: LLMTokenQuota policy
    where: Apigee › model proxies › request and response flow (with PromptTokenLimit for bursts)
    setVia: [cloudPolicy]
    area: tools
    default: No limit
    recommended: A token quota per agent app per hour, and a PromptTokenLimit rate per minute
    why: A looping turn hits a token ceiling at the gateway before it runs up cost or volume.
    mitigations: [AML.M0036]
    url: https://docs.cloud.google.com/apigee/docs/api-platform/reference/policies/llm-token-quota-policy
    verified: "2026-10-30"
  - id: apigeeMcpDiscoveryProxy
    name: MCP in Apigee (a proxy in front of your MCP server, or an MCP Discovery Proxy)
    where: Apigee › an API proxy with your own MCP server as the backend target; an MCP Discovery Proxy only where tools are generated from a REST API's OpenAPI specification and no MCP server runs
    setVia: [cloudPolicy]
    area: tools
    default: Agents call MCP servers directly
    recommended: Every MCP tool the agent calls exposed only through Apigee. Put an ordinary Apigee proxy in front of each MCP server you run; use the MCP Discovery Proxy only for REST APIs whose reviewed OpenAPI specification should become the tools
    why: Each tool call crosses one gateway that authenticates, meters and logs it. Only the Discovery Proxy takes tool definitions from the specification your API owners reviewed; behind an ordinary proxy the definitions are whatever your server advertises, so review and pin them in your own release process.
    mitigations: [cap-mcp-tool-integrity, cap-agent-action-policy-enforcement]
    url: https://docs.cloud.google.com/apigee/docs/api-platform/apigee-mcp/manage-mcp-tool-access
    verified: "2026-11-18"
  - id: apigeeMcpToolAccess
    name: API product MCP tool operations (payloadOperationGroup)
    where: Apigee › API products, with the ParsePayload policy on the MCP proxy
    setVia: [cloudPolicy, apiCli]
    area: tools
    default: Every tool on the proxy callable by any authenticated client
    recommended: One API product per agent, listing only the tools it may call, each with a quota
    why: tools/list shows the agent only the tools its product grants and tools/call refuses the rest — the decision is per tool, not per server.
    mitigations: [AML.M0028, cap-agent-action-policy-enforcement]
    url: https://docs.cloud.google.com/apigee/docs/api-platform/apigee-mcp/manage-mcp-tool-access
    verified: "2026-10-30"
  - id: agentRegistry
    name: Agent Registry
    where: Agent Platform › Agent Registry, in a central governance project
    setVia: [adminConsole, apiCli]
    area: tools
    default: Not registered
    recommended: Every MCP server, agent and endpoint an agent can call, registered with an owner
    why: The tools an agent may be given are a governed inventory, not whatever someone wired in — and Agent Gateway refuses destinations that are not in it.
    mitigations: [cap-agent-tool-registry]
    url: https://docs.cloud.google.com/agent-registry/overview
    verified: "2026-10-30"
  - id: adkToolConfirmation
    builtWith: Agent Development Kit (ADK)
    name: Tool Confirmation (require_confirmation)
    where: Your agent code — ADK FunctionTool(..., require_confirmation=True) on write tools
    setVia: [code]
    area: tools
    default: Tools run without confirmation
    recommended: Confirmation required on every tool that writes to a system of record. ADK lists DatabaseSessionService and VertexAiSessionService as not supported by this feature, so test that confirmation works with the custom Firestore session store before relying on it
    why: A person confirms each consequential action in the conversation before it happens. The feature is experimental in ADK TypeScript, Go and Kotlin.
    mitigations: [AML.M0029]
    url: https://adk.dev/tools-custom/confirmation/
    verified: "2026-11-18"
  - id: adkRemoteConfirmation
    builtWith: Agent Development Kit (ADK)
    name: Advanced confirmation with remote confirmation (request_confirmation)
    where: Your agent code, ADK tool_context.request_confirmation on high-value actions, answered with a FunctionResponse posted to the ADK server's /run or /run_sse endpoint
    setVia: [code]
    area: tools
    default: Tools run without confirmation
    recommended: Actions above the value or irreversibility threshold park for an operator's approval; never the requester's. ADK lists VertexAiSessionService and DatabaseSessionService as not supported, so do not keep the session in Agent Platform Sessions for runs that park, and test a custom store such as Firestore. With resume on, the reply must carry the invocation ID of the run that asked
    why: The step waits until an operator in a work queue approves that exact action and payload, so a run nobody watches cannot commit an irreversible change on its own. The feature is experimental in ADK TypeScript, Go and Kotlin.
    mitigations: [AML.M0029]
    url: https://adk.dev/tools-custom/confirmation/
    verified: "2026-11-18"
  - id: outputSanitisation
    name: Sanitise rendered model output
    where: Your front-end code
    setVia: [code]
    area: tools
    default: Depends on your renderer
    recommended: Render as text or sanitised markdown; strip HTML, block external images, set a Content Security Policy
    why: A model-written image link or script cannot carry the conversation to an attacker the moment it renders.
    mitigations: [cap-output-encoding]
    url: https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
    verified: "2026-10-30"
  - id: codeExecutionSandbox
    name: Code Execution sandbox
    where: Agent Platform › Agent Runtime › Code Execution, called from the agent wherever it runs; ttl set at sandbox creation
    setVia: [code, apiCli]
    area: tools
    default: Generated code runs wherever the agent chooses to run it
    recommended: All model-generated code runs in a Code Execution sandbox, ttl no longer than the session
    why: The sandbox has an isolated filesystem and no network access, so code the model writes cannot reach anything or touch the agent's own container.
    mitigations: [D3-EI, cap-agent-egress-control]
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sandbox/code-execution-overview
    verified: "2026-10-30"
  - id: cloudRunTrafficSplit
    name: Gradual rollouts (traffic splitting between revisions)
    where: Cloud Run › (agent service) › Revisions › Manage traffic
    setVia: [cloudPolicy, apiCli]
    area: tools
    default: All traffic to the latest revision
    recommended: New revisions deployed with --no-traffic, then given a small share after their evaluation passes
    why: A new agent, prompt or model revision that behaves badly reaches a few users and rolls back by moving traffic, not by redeploying.
    mitigations: [cap-staged-rollout-gate]
    url: https://docs.cloud.google.com/run/docs/rollouts-rollbacks-traffic-migration
    verified: "2026-10-30"
  - id: agentEvaluation
    name: Agent evaluation (Gemini Enterprise Agent Platform Evals, formerly Gen AI evaluation service)
    where: Agent Platform GenAI Evaluation SDK (client.evals.evaluate) or agents-cli eval, run from the release pipeline
    setVia: [code, apiCli]
    area: tools
    default: Not run
    recommended: Task-success and safety evaluation of the agent's traces on every agent, prompt, tool or model change, blocking the release on regression
    why: Each change is scored against the same eval cases before it reaches users, instead of being discovered in production. Google renamed the service; its agent evaluation page still uses the older name.
    mitigations: [cap-staged-rollout-gate]
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/optimize/evaluation/agent-evaluation
    verified: "2026-11-18"
  - id: arVirtualRepoPriority
    name: Virtual repository upstream priority
    where: Artifact Registry › virtual repository › upstream repositories, each with a priority value (your standard repository given a higher number than the PyPI or npm remote repository)
    setVia: [cloudPolicy, apiCli]
    area: tools
    default: Clients configured against public registries directly
    recommended: Package managers and other tools read from the virtual repository only, and it gives your standard repository a higher priority value than the remote one (the higher number wins)
    why: A public package cannot shadow an internal one, which is the dependency confusion attack Google's virtual repository page describes.
    mitigations: [D3-FA]
    url: https://docs.cloud.google.com/artifact-registry/docs/repositories/virtual-overview
    verified: "2026-11-18"
  - id: arPackageScanning
    name: Package scanning (Artifact Analysis)
    where: Artifact Registry › (Python or npm repository) › --allow-vulnerability-scanning
    setVia: [cloudPolicy, apiCli]
    area: tools
    default: Disabled for Java, Python and Node.js repositories
    recommended: Enabled on the Python and Node.js repositories behind the virtual repository (virtual repositories themselves are not scanned). Packages are scanned when they are pushed, and only if they have 100 or fewer files. Google's pages do not say that packages cached by a remote repository are scanned, so do not rely on this for the public mirror; check those packages at intake
    why: Pushed packages are scanned for vulnerabilities, malicious software and secrets, and their metadata is re-checked as new advisories arrive. Vulnerabilities and malicious software are detected only in publicly monitored packages.
    mitigations: [D3-FA]
    url: https://docs.cloud.google.com/artifact-analysis/docs/enable-automatic-scanning
    verified: "2026-11-18"

  - id: apigeeSpikeArrest
    name: SpikeArrest policy
    where: Apigee › API proxy (MCP or model) › PreFlow, Identifier set to the client app (and tenant); on a GKE Gateway, a SpikeArrest resource added through the Apigee Operator for Kubernetes
    setVia: [cloudPolicy]
    area: tools
    default: No rate limit
    recommended: Per-client and per-tenant rate, UseEffectiveCount true, alongside the API product's quotas. On a GKE Gateway the policy is a Kubernetes resource placed by an ApimTemplate and ApigeeGatewayPolicy on the one Apigee proxy that handles all traffic, not on a per-model proxy, and Quota is not among the policies the operator can add
    why: A client that retries, loops or fans out is throttled at the gateway before it exhausts finite capacity for every other tenant.
    mitigations: [AML.M0004]
    url: https://docs.cloud.google.com/apigee/docs/api-platform/reference/policies/spike-arrest-policy
    verified: "2026-11-18"
  - id: toolDefinitionPinning
    name: Pin tool definitions to a reviewed version
    where: Your MCP service code — the loader checks each definition's hash against the release record
    setVia: [code]
    area: tools
    default: Definitions served as loaded
    recommended: Refuse to serve any definition whose hash differs from the reviewed release; a wording change goes through the release gate
    why: A description edited outside the pipeline never reaches a caller's model, so the server cannot be turned into a tool-poisoning vector.
    mitigations: [cap-mcp-tool-integrity]
    url: https://owasp.org/projects/mcp-top-10
    verified: "2026-10-30"
  - id: appSecurityTesting
    name: Application security testing of the MCP handlers
    where: Your release pipeline — authenticated testing of every tool handler before release
    setVia: [code]
    area: tools
    default: Not tested beyond unit tests
    recommended: Every release tested against the OWASP Web Security Testing Guide, with findings blocking the release
    why: Behind the protocol this is a published application, and an injectable handler is reachable by every caller that holds a token.
    mitigations: [D3-SYSVA]
    url: https://owasp.org/projects/web-security-testing-guide
    verified: "2026-10-30"
  - id: containerScanning
    name: Automatic scanning (Container Scanning API)
    where: Artifact Analysis › Container Scanning API on the project that holds the images
    setVia: [cloudPolicy, apiCli]
    area: tools
    default: Images scanned on push once the API is enabled
    recommended: Enabled on every project that holds a serving image, findings routed to the image's owner
    why: Every image's OS and language packages are matched against vulnerability feeds on push and re-checked as advisories arrive, so an advisory maps to the images it affects.
    mitigations: [D3-AVE]
    url: https://docs.cloud.google.com/artifact-analysis/docs/enable-automatic-scanning
    verified: "2026-10-30"

  - id: modelArmorInferenceGateway
    name: AI security and safety checks (Model Armor on GKE Inference Gateway)
    where: GKE Inference Gateway › GCPTrafficExtension calling Model Armor, on prompts and responses
    setVia: [cloudPolicy, apiCli]
    area: tools
    default: No safety checks
    recommended: On for every InferencePool, with a template that screens prompts and responses and blocks on violation
    why: No provider applies content policy to a self-hosted model, so prompts and completions are classified at the gateway before they reach the model or the caller.
    mitigations: [cap-output-guardrails]
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/customize-gke-inference-gateway-configurations
    verified: "2026-10-30"
  - id: modelSignatureVerify
    name: Verify model signatures at load (OpenSSF Model Signing)
    where: Your serving pipeline — an init step verifies the Sigstore bundle, or the promotion record's digest, before vLLM opens the weights
    setVia: [code]
    area: tools
    default: Weights load as found in the bucket
    recommended: Refuse to load any artifact whose signature or approved digest does not verify
    why: Replacing a file and the digest beside it does not make it loadable; only an artifact the promotion gate signed or recorded serves.
    mitigations: [AML.M0014]
    url: https://openssf.org/projects/model-signing/
    verified: "2026-10-30"
  - id: modelFormatScan
    name: Model format allowlist and pickle scanning at promotion
    where: Your intake and promotion pipeline — safetensors only; pickle-based files refused or scanned before anything loads them
    setVia: [code]
    area: tools
    default: Any format the loader accepts
    recommended: Safetensors only for hub artifacts; anything else blocked at the gate
    why: Loading a pickle is code execution, so an artifact that would run code on load never reaches a node that would load it.
    mitigations: [D3-FA]
    url: https://huggingface.co/docs/hub/security-pickle
    verified: "2026-10-30"
  - id: modelVersionAliases
    name: Model version aliases
    where: Agent Platform Model Registry › (model) › versions › aliases and labels
    setVia: [adminConsole, apiCli]
    area: tools
    default: The first version gets the default alias
    recommended: The default alias names the approved version; labels record publisher, format and the scan that cleared it; rollback moves the alias. Only Agent Platform deployments fall back to the default alias. vLLM on GKE does not read it, so your rollout step must resolve the alias to that version's bucket path and point the deployment at it
    why: The question "what is serving" has one answer in the registry, and the previous approved version stays one alias move away.
    mitigations: [AML.M0023, cap-staged-rollout-gate]
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/model-registry/model-alias
    verified: "2026-11-18"
  - id: inferencePoolRollout
    name: Weighted traffic splitting between InferencePools
    where: GKE Inference Gateway › HTTPRoute backendRefs weight, old and new InferencePool side by side
    setVia: [cloudPolicy, apiCli]
    area: tools
    default: All traffic to the one InferencePool
    recommended: A new model version takes a 10% weight after its evaluation passes, then grows; the old pool stays until it is retired
    why: A model version that misbehaves serves a slice, not everyone, and rolls back by moving weight rather than redeploying.
    mitigations: [cap-staged-rollout-gate]
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/gke-inference-gateway-rollout-operations
    verified: "2026-10-30"
  - id: confidentialGpuNodes
    name: Confidential GKE Nodes with GPUs
    where: GKE › node pool per sensitivity tier › Confidential GKE Nodes (NVIDIA H100), tainted for that tier
    setVia: [cloudPolicy, apiCli]
    area: tools
    default: "Off"
    recommended: A dedicated confidential GPU node pool for each sensitivity tier that must not share hardware
    why: Workload memory is encrypted in use on the host and the accelerator, and one tier's pods never land on another tier's GPUs.
    mitigations: [D3-HBPI]
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/gpus-confidential-nodes
    verified: "2026-10-30"
  - id: vllmServingConfig
    builtWith: vLLM
    name: vLLM security settings (dev mode, runtime LoRA updating, cache_salt)
    where: Your vLLM deployment — VLLM_SERVER_DEV_MODE and VLLM_ALLOW_RUNTIME_LORA_UPDATING unset, cache_salt set per tenant by the gateway
    setVia: [configFile, code]
    area: tools
    default: --api-key optional; dev and runtime-update endpoints off unless enabled
    recommended: Dev mode and runtime adapter loading off; a per-tenant cache_salt on every request, overwriting any the caller sent; only the gateway can reach the server
    why: --api-key protects only part of vLLM's HTTP surface, so the control endpoints stay switched off and unreachable, and one tenant's prompts cannot be inferred from another's prefix-cache timing.
    mitigations: [D3-ACH]
    url: https://docs.vllm.ai/en/latest/usage/security/
    verified: "2026-10-30"

  - id: modelSigningAtPromotion
    name: Sign at promotion (OpenSSF Model Signing)
    where: Your promotion step — signs the evaluated candidate with a Cloud KMS asymmetric key or Sigstore identity held only by the promotion service account
    setVia: [code, cloudPolicy]
    area: tools
    default: Candidates are unsigned
    recommended: Sign only after the evaluation gate passes and a person approves, with a key the training job's identity cannot use
    why: A signature proves the gate was passed, not merely that a job finished — a run that wrote its own candidate cannot make it loadable.
    mitigations: [AML.M0013]
    url: https://openssf.org/projects/model-signing/
    verified: "2026-10-30"
  - id: modelEvaluationGate
    name: Evaluation gate before promotion (Gen AI evaluation service, renamed Gemini Enterprise Agent Platform Evals)
    where: Agent Platform Pipelines › a step in front of promotion that runs the Gen AI evaluation SDK against the candidate
    setVia: [code, apiCli]
    area: tools
    default: Not run
    recommended: Capability and safety evaluation on every candidate with rubric-based and computation-based metrics, blocking promotion on regression; benchmarks in a bucket the training identity cannot write. The service lists no memorisation test and no red-teaming feature, so supply your own tooling for both
    why: How the candidate behaves is examined before it can be promoted, against an answer key its authors cannot edit. Agent Platform's model evaluation page covers only predictive image and tabular models, so a language model is scored with the Gen AI evaluation service.
    mitigations: [AML.M0008]
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/evaluation-overview
    verified: "2026-11-18"
  - id: modelLabelsCard
    name: Apply model labels (approval state and model card)
    where: Agent Platform Model Registry › (model version) › labels, with the model card stored beside the artifact
    setVia: [apiCli, code]
    area: tools
    default: No labels
    recommended: Every promoted version labelled with its approval state and a link to its model card; promotion refuses a version without both
    why: What the artifact is and what it was trained on travel with it, so a reader of the registry never meets an undocumented model.
    mitigations: [cap-model-documentation]
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/model-registry/model-labels
    verified: "2026-10-30"
  - id: gkeSandbox
    name: GKE Sandbox (gVisor and microVMs)
    where: GKE › node pools with a sandbox type; Pods request the gvisor or microvm RuntimeClass
    setVia: [cloudPolicy, configFile]
    area: tools
    default: Pods share the node's kernel
    recommended: Every rollout and agent task in a sandbox — gVisor by default, a microVM where a task needs a full guest kernel (microVMs support no GPUs)
    why: Code the model writes runs against its own guest kernel or a userspace kernel, never the node's, so an escape still has a wall to cross.
    mitigations: [D3-EI]
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/sandbox-pods
    verified: "2026-10-30"

  - id: agentSandboxPolicy
    name: Recommended security policy (secure-sandbox-policy)
    where: Agent Sandbox on GKE › ValidatingAdmissionPolicy and its binding, all non-system namespaces
    setVia: [configFile]
    area: tools
    default: Not applied. The policy is optional, and Agent Sandbox doesn't restrict the Pods that run sandboxes
    recommended: Applied, with the binding enforcing it in every namespace that runs sandboxes. As published it requires runtimeClassName gvisor and the gVisor node selector and toleration, so it rejects microVM sandboxes; you own the policy, so edit it to admit the microVM runtime where you use one
    why: A sandbox that isn't gVisor, mounts a service-account token, runs as root, keeps Linux capabilities or lacks resource limits is rejected at admission. For sandboxes made through claims or warm pools the rejection shows only in the controller logs, so watch them.
    mitigations: [D3-EI]
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/how-install-agent-sandbox
    verified: "2026-11-18"
  - id: workloadSeparation
    name: Workload separation (taints and tolerations)
    where: GKE › a node pool per trust group, tainted; each run's sandboxes tolerate only their group's taint
    setVia: [cloudPolicy, configFile]
    area: tools
    default: Pods schedule on any node with room
    recommended: A node pool per trust group as an extra layer under GKE Sandbox, so rollouts that must not communicate do not share a node. Never rely on it as the wall that keeps rollouts apart
    why: Rollouts from different trust groups do not share a host, its cores or its cache, which narrows co-residency side channels. Google says workload separation should never be used as a primary security boundary and is not a method of isolating untrusted workloads, so the sandbox stays the boundary.
    mitigations: [D3-HBPI]
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/workload-separation
    verified: "2026-11-18"
  - id: runAutoStop
    name: Automatic run stop in the orchestrator
    where: Your run orchestrator, which on a serious-risk alert deletes the run's Sandbox and SandboxClaim resources and removes the IAM bindings of the run's Kubernetes ServiceAccounts (or deletes them)
    setVia: [code]
    area: tools
    default: Runs continue until they finish
    recommended: Automatic, triggered from monitors outside every sandbox; restarting or widening the run is a person's decision. A run whose identity is a Kubernetes ServiceAccount granted roles directly has no IAM service account to disable, so the stop removes the binding; disable the service account only where a run uses one
    why: The stop is enforced from outside the rollouts, so an agent that has disabled what it could reach cannot keep its run alive.
    mitigations: [cap-agent-kill-switch]
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/agent-sandbox
    verified: "2026-11-18"
  - id: containmentRedTeam
    name: Containment red teaming against the hardened cluster
    where: Your run-approval process — agents attack the sandbox, the node network and the platform services before a run
    setVia: [code]
    area: tools
    default: Not done
    recommended: Before every new environment or widening, against a cluster built to Google's hardening guidance; findings block the run
    why: Escape paths are tested rather than assumed, by the same kind of agent the run will train.
    mitigations: [D3-SYSVA]
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/hardening-your-cluster
    verified: "2026-10-30"

  - id: modelArmorSanitizeApi
    name: Sanitize prompts and responses (Model Armor API)
    where: Apigee A2A proxy or the agent's ADK callbacks, calling sanitizeUserPrompt on every inbound artifact and sanitizeModelResponse on every outbound payload, with a template that has Sensitive Data Protection inspect and de-identify templates
    setVia: [apiCli, code]
    area: tools
    default: Not called
    recommended: Every inbound artifact, status message and card description screened; every outbound task payload and returned artifact replaced by the de-identified text Model Armor returns in deidentifyResult.data.text, a substitution your code makes. Streamed artifacts and files are not de-identified, so send them unstreamed as text, mask them with Sensitive Data Protection yourself, or block them
    why: A peer's text is classified for injection before the harness reads it, and client data leaving for another organisation is masked at the boundary. Model Armor returns the masked text in a result field and does not rewrite the payload, and its streaming methods and file-based prompts do not support de-identification.
    mitigations: [cap-input-guardrails, cap-sensitive-data-redaction]
    url: https://docs.cloud.google.com/model-armor/sanitize-prompts-responses
    verified: "2026-11-18"
  - id: a2aSkillAuthorization
    name: Per-skill authorization on A2A requests
    where: Apigee A2A proxy — the skill named in the message metadata checked against the peer app's allowed skills before dispatch
    setVia: [cloudPolicy, code]
    area: tools
    default: The protocol leaves authorization to the implementation
    recommended: Each peer may invoke only the skills its registration lists, and our agent may call a peer's skill only for the users that skill is approved for
    why: Authorization is enforced at the crossing in both directions, so a peer that can reach our agent still cannot reach a skill nobody granted it.
    mitigations: [cap-agent-action-policy-enforcement]
    url: https://a2a-protocol.org/latest/topics/enterprise-ready/
    verified: "2026-10-30"
  - id: apigeeQuota
    name: Quota policy
    where: Apigee A2A proxy › per peer app, with stream duration and payload size limits beside it
    setVia: [cloudPolicy]
    area: tools
    default: No quota
    recommended: Per peer and per task — tasks per hour, retries and fan-out — sized to the agreement
    why: A partner's agent that loops, retries or fans out hits a ceiling at our gateway before it runs up our cost.
    mitigations: [AML.M0036]
    url: https://docs.cloud.google.com/apigee/docs/api-platform/reference/policies/quota-policy
    verified: "2026-10-30"
  - id: agentCardSignatures
    name: Verify signed Agent Cards (AgentCardSignature)
    where: Your gateway or agent code — each peer's card verified against the key pinned at admission, and its hash compared, on every task
    setVia: [code]
    area: tools
    default: Cards fetched and trusted as served
    recommended: A peer's card is accepted only with a valid JWS signature from its pinned key and the hash recorded at admission; a change is re-reviewed
    why: A peer cannot silently rewrite its skills or descriptions after we admitted it — the card is a dependency, and a change is a decision.
    mitigations: [cap-mcp-tool-integrity]
    url: https://a2a-protocol.org/latest/specification/
    verified: "2026-10-30"
  - id: peerVendorAssessment
    name: Peer platform assessment before federation
    where: Your third-party risk process — before a federation or agent registration is turned on
    setVia: [code]
    area: sharing
    default: Not assessed
    recommended: Assessment of how the platform handles our users' assertions, its tenant isolation, card signing and audit export, written into the agreement
    why: The questions A2A leaves to implementations — authorization, data handling, tracing — are answered by the vendor before our users' identity travels there.
    mitigations: [cap-ai-vendor-assessment]
    url: https://a2a-protocol.org/latest/topics/enterprise-ready/
    verified: "2026-10-30"

  # --- Network -------------------------------------------------------------------------
  - id: swpEgress
    name: Secure Web Proxy gateway security policy with a URL list (Cloud Run Direct VPC egress, all traffic)
    where: Cloud Run › (service) › Networking › Connect to a VPC for outbound traffic › Send traffic directly to a VPC › Route all traffic to the VPC (--vpc-egress=all-traffic); in that VPC, a route to Secure Web Proxy in next hop mode, whose gateway security policy rule matches a URL list (inUrlList)
    setVia: [cloudPolicy]
    area: network
    default: Outbound internet direct from Cloud Run
    recommended: All outbound traffic from the workload sent into the VPC and on through Secure Web Proxy, allowing only a URL list you maintain. Google documents Direct VPC egress, next hop routing and URL lists on separate pages and has no guide that joins them for Cloud Run, so test that the service's traffic reaches the proxy; its documented Cloud Run route is the Agent Gateway deployment (Preview), which uses explicit routing mode and authorization policies that do not support URL lists
    why: A gateway security policy blocks every HTTP and HTTPS request until a rule allows it, so the workload reaches only the hosts you list. Matching a full URL path rather than a host needs TLS inspection, and a VPC network can have only one next-hop proxy per region.
    mitigations: [cap-agent-egress-control, D3-OTF]
    url: https://docs.cloud.google.com/secure-web-proxy/docs/policies-and-rules-overview
    verified: "2026-11-18"
  - id: vpcServiceControls
    name: VPC Service Controls service perimeter
    where: Security › VPC Service Controls, around the projects that hold the workload's Google services (for an agent, Agent Platform and its data stores; for self-hosted serving, the GKE, Cloud Storage and Artifact Registry projects)
    setVia: [cloudPolicy]
    area: network
    default: No perimeter
    recommended: One enforced perimeter that restricts every supported service the workload uses, reached from the VPC over the restricted VIP with Private Google Access or Private Service Connect for Google APIs. Check each service against Google's supported products list, because support and limits differ by product
    why: The protected APIs answer only inside the perimeter, so a stolen token used from an unauthorised network, or a copy to a resource outside the perimeter, is refused.
    mitigations: []
    url: https://docs.cloud.google.com/vpc-service-controls/docs/overview
    verified: "2026-11-18"
  - id: cloudRunIngress
    name: Ingress — Internal and Cloud Load Balancers, with the default URL disabled
    where: Cloud Run › (front-end service) › Networking; --ingress=internal-and-cloud-load-balancing --no-default-url
    setVia: [cloudPolicy, apiCli]
    area: network
    default: All ingress allowed, run.app URL on
    recommended: internal-and-cloud-load-balancing, default URL disabled
    why: Users reach the front end only through the load balancer, so Cloud Armor's rules and rate limits cannot be bypassed through run.app.
    mitigations: [AML.M0004]
    url: https://docs.cloud.google.com/run/docs/securing/ingress
    verified: "2026-10-30"
  - id: cloudArmorRateLimit
    name: Cloud Armor rate limiting (throttle)
    where: Cloud Armor security policy on the front end's Application Load Balancer › rate-based rule
    setVia: [cloudPolicy]
    area: network
    default: No rate limit
    recommended: Per-client throttle on the chat endpoint
    why: A runaway client or scripted abuse is throttled at the edge, before it spends tokens or triggers actions.
    mitigations: [AML.M0004]
    url: https://docs.cloud.google.com/armor/docs/rate-limiting-overview
    verified: "2026-10-30"

  - id: gkeNetworkPolicy
    name: Network policy enforcement (GKE Dataplane V2)
    where: GKE cluster › network policy enforcement on; Kubernetes NetworkPolicy per namespace, and for sandboxes the network policy defined in each SandboxTemplate
    setVia: [cloudPolicy, configFile]
    area: network
    default: All pods can reach each other; Agent Sandbox adds a policy per SandboxTemplate that still allows egress to the public internet
    recommended: Default-deny in every workload namespace, allowing only the named peers. For an agent, that is the gateway and the stores it uses. For serving, that is the gateway and endpoint picker to the vLLM API and serving nodes to each other. For sandboxes, define your own policy in the SandboxTemplate that denies everything except named peers, because a namespace default-deny does not remove the internet egress the default template policy allows
    why: A pod reaches only the peers its policies name, so an agent's pods, vLLM's unauthenticated inter-node channels and one sandbox's neighbours are off limits to everything else. Network policies only add allowances, so the sandbox template's default policy must be replaced, not merely surrounded.
    mitigations: [D3-NI]
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/network-policy
    verified: "2026-11-18"

  - id: trainingPerimeterEgress
    name: VPC Service Controls with PSC interface (custom training)
    where: Training projects inside the service perimeter; serverless training attached through a Private Service Connect interface, no egress proxy
    setVia: [cloudPolicy]
    area: network
    default: Without a perimeter, the Google-managed training environment keeps default internet access
    recommended: Training inside the perimeter, with no internet egress path configured; the job reaches only the mirror and the buckets
    why: Inside a perimeter the training environment's internet access is blocked, so a job holding the corpus and its credentials cannot send them anywhere.
    mitigations: [D3-NI]
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/general/vpc-service-controls
    verified: "2026-10-30"

  - id: fqdnNetworkPolicy
    name: FQDN network policies (FQDNNetworkPolicy)
    where: GKE Dataplane V2 › FQDNNetworkPolicy (networking.gke.io/v1alpha1) per workload namespace (per run namespace, for sandboxes) for names outside the cluster, with label-based Kubernetes NetworkPolicy beside it for in-cluster Services
    setVia: [configFile]
    area: network
    default: Pods reach any destination
    recommended: Each workload allowed only the external names it needs, such as the package mirror for a sandbox rollout. FQDN policies cannot allow egress to ClusterIP or headless Services, so allow in-cluster services (for sandboxes, the offline web and the vLLM API) with label-based NetworkPolicy instead
    why: A policy that selects a workload's pods denies every endpoint it does not name, so the egress list is enforced on the pod rather than asked of the agent. Allowing a name on shared addresses such as Google APIs allows every other name there, and DNS lookups are not blocked, so add VPC Service Controls behind it.
    mitigations: [cap-agent-egress-control]
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/fqdn-network-policies
    verified: "2026-11-18"

  # --- Audit & monitoring --------------------------------------------------------------
  - id: adkCloudTrace
    builtWith: Agent Development Kit (ADK)
    name: Google Cloud Trace observability for ADK
    where: Agent code — ADK google_cloud telemetry exporters (enable_cloud_tracing), with ADK_CAPTURE_MESSAGE_CONTENT_IN_SPANS=false
    setVia: [code]
    area: audit
    default: Not exported; on Cloud Run, message capture in spans follows the variable you set
    recommended: On, tracing every agent turn, model call and tool call, with message content redacted from spans
    why: Each tool call and its result is traceable per session and agent when something goes wrong, without copying prompts into every span.
    mitigations: [cap-agent-tracing]
    url: https://adk.dev/integrations/cloud-trace/
    verified: "2026-10-30"
  - id: dataAccessAuditLogs
    name: Data Access audit logs
    where: IAM & Admin › Audit logs › Agent Platform and Apigee APIs; a log sink to your SIEM
    setVia: [cloudPolicy]
    area: audit
    default: Disabled for most services
    recommended: DATA_READ and DATA_WRITE on for Agent Platform, exported by a log sink to the SIEM
    why: Every model and agent API call is recorded by identity, off the agent's write path, where the security team can query it.
    mitigations: [cap-agent-tracing]
    url: https://docs.cloud.google.com/logging/docs/audit/configure-data-access
    verified: "2026-10-30"
  - id: apigeeMessageLogging
    name: MessageLogging policy (HTTP access logging on GKE Inference Gateway)
    where: Apigee › API proxy (MCP or model) › PostClientFlow, to Cloud Logging; behind GKE Inference Gateway, a GCPBackendPolicy with logging enabled on each InferencePool
    setVia: [cloudPolicy]
    area: audit
    default: No message logging
    recommended: Every call logged with the tool or model, client app, end user and tenant; personal data in payloads redacted. MessageLogging is not supported when Apigee is reached through the Extension Processor, so on GKE Inference Gateway turn on the load balancer's HTTP access logging to Cloud Logging instead, with sampleRate 1000000 so every request is logged
    why: Each invocation is attributable to a tenant and a delegation where an incident can query it, recorded at the gateway rather than volunteered by the backend.
    mitigations: [AML.M0024]
    url: https://docs.cloud.google.com/apigee/docs/api-platform/reference/policies/message-logging-policy
    verified: "2026-11-18"
  - id: agentPlatformDataAccessLogs
    name: Data Access audit logs (aiplatform.googleapis.com)
    where: Project or organisation IAM policy › auditConfigs for aiplatform.googleapis.com
    setVia: [cloudPolicy]
    area: audit
    default: Disabled (Admin Activity audit logs are always on; Data Access logs are not written unless enabled)
    recommended: ADMIN_READ and DATA_READ enabled for the training project, routed to the central log bucket
    why: Admin Activity already records each training job created or cancelled; Data Access adds who read which job, dataset and model, so the record covers reads as well as changes.
    mitigations: [AML.M0024]
    url: https://docs.cloud.google.com/vertex-ai/docs/general/audit-logging
    verified: "2026-11-15"
  - id: lockedLogBucket
    name: Lock a log bucket (locked retention)
    where: Cloud Logging › log bucket in a project no rollout identity can reach; sinks route GKE, host and trajectory logs there
    setVia: [cloudPolicy, apiCli]
    area: audit
    default: Unlocked; retention can be shortened and the bucket deleted
    recommended: Trajectory and host logs in a locked bucket with a 400-day retention
    why: A locked bucket's logs cannot be deleted before their retention ends, so an agent that wants its trail gone has nothing it can reach.
    mitigations: [cap-agent-tracing]
    url: https://docs.cloud.google.com/logging/docs/buckets
    verified: "2026-10-30"
  - id: apigeeRevokeApp
    name: Approve or revoke an app
    where: Apigee › Distribution › Apps › (peer's app) › Revoke
    setVia: [adminConsole, apiCli]
    area: audit
    default: Approved
    recommended: Approved, with revoke as the first step of the peer-incident runbook, followed by removing its Agent Registry entry and cancelling its delegated tasks
    why: Revoking the peer's app cuts every credential it holds at our gateway in one action, without a deploy.
    mitigations: [cap-agent-kill-switch]
    url: https://docs.cloud.google.com/apigee/docs/api-platform/publish/creating-apps-surface-your-api
    verified: "2026-10-30"
  - id: disableServiceAccount
    name: Disable a service account
    where: IAM & Admin › Service accounts › (agent's service account) › Disable; gcloud iam service-accounts disable
    setVia: [adminConsole, apiCli]
    area: audit
    default: Enabled
    recommended: Enabled, with disable as the first step of your incident runbook. This covers IAM service accounts only. Where a workload's identity is a Kubernetes ServiceAccount granted roles directly through Workload Identity Federation for GKE there is no account to disable, so the runbook removes its IAM binding or deletes the ServiceAccount
    why: Once the account is disabled, applications no longer reach Google Cloud resources through it, so the agent loses the gateway, the model and its stores without a deploy, and re-enabling restores it.
    mitigations: [cap-agent-kill-switch]
    url: https://docs.cloud.google.com/iam/docs/service-accounts-disable-enable
    verified: "2026-11-18"
  - id: gkeGoogleGroupsRbac
    name: "Google Groups for RBAC"
    where: "GKE › (cluster) › Details › Security › Google Groups for RBAC; gcloud container clusters update --security-group; a RoleBinding with a Group subject in the run namespace"
    setVia: [apiCli, adminConsole, configFile, identityProvider]
    area: identity
    recommended: "On, with Security Group set to gke-security-groups@DOMAIN. Nest each research group in it and bind it, by exact address, to a Role in its run namespace for run objects. In IAM give members only Kubernetes Engine Cluster Viewer; bind no individual users."
    why: "Kubernetes RBAC then follows group membership kept in your directory. GKE also allows whatever project-level IAM roles permit, so keep those minimal; removal from a group can take about an hour to apply."
    mitigations: [D3-APA]
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/google-groups-rbac
    verified: "2026-11-18"
  # >>> hosting rows (settings used only by a hosting variant)
  - id: pubsubPullAccess
    name: "Pull subscription with resource-level access control (Pub/Sub Subscriber and Publisher roles)"
    where: "Pub/Sub › (trigger subscription, delivery type Pull) › Permissions, and (trigger topic) › Permissions; gcloud pubsub subscriptions set-iam-policy and gcloud pubsub topics set-iam-policy"
    setVia: [cloudPolicy, apiCli]
    area: identity
    recommended: "A pull subscription per agent. Grant Pub/Sub Subscriber on that subscription only to the agent's Kubernetes ServiceAccount principal, and Pub/Sub Publisher on the topic only to the identities of its trigger sources. Grant neither role at project level."
    why: "The agent opens no inbound endpoint, so a run starts only from a message on its topic. The topic's publishers are then the only principals that can start a run, and only the agent can take the message."
    mitigations: [D3-APA]
    url: https://docs.cloud.google.com/pubsub/docs/access-control
    verified: "2026-11-18"
  - id: gkeNodeServiceAccount
    name: "Least-privilege IAM node service account"
    where: "GKE › cluster and node pools › service account; Organization Policy › constraints/container.managed.disallowDefaultComputeServiceAccount"
    setVia: [cloudPolicy, apiCli]
    area: identity
    default: "Nodes use the Compute Engine default service account"
    recommended: "A custom node service account holding the Kubernetes Engine Default Node Service Account role (roles/container.defaultNodeServiceAccount) and little else, with the managed constraint enforced. Workloads get their identity from Workload Identity Federation for GKE, never from the node."
    why: "On GKE a second credential sits beside the agent: the node's. The default account can hold more permissions than GKE needs, so a minimal one leaves a compromised agent nothing on the node worth taking."
    mitigations: [D3-CH]
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/hardening-your-cluster
    verified: "2026-11-18"
  - id: gkeSwpExplicitProxy
    name: "Secure Web Proxy as an explicit proxy with a URL list, behind private nodes (GKE)"
    where: "GKE › cluster or node pool › private nodes (--enable-private-nodes), with no Cloud NAT gateway of your own; Secure Web Proxy in the cluster's VPC in explicit routing mode, its gateway security policy rule matching a URL list; the agent's HTTP client pointed at the proxy address"
    setVia: [cloudPolicy, configFile]
    area: network
    default: "Nodes have external IP addresses and Pods reach any destination"
    recommended: "Private nodes and no NAT of your own, so the proxy is the agent's only path to the internet, with a policy that allows only a URL list you maintain. Google has no guide joining these for GKE, so test it. Its documented GKE route, ambient egress to the proxy, is in Preview."
    why: "A gateway security policy blocks every HTTP and HTTPS request until a rule allows it, and workloads on nodes without external addresses cannot reach the internet unless NAT is enabled, so the agent reaches only the hosts you list."
    mitigations: [cap-agent-egress-control, D3-OTF]
    url: https://docs.cloud.google.com/secure-web-proxy/docs/quickstart
    verified: "2026-11-18"
  - id: cloudDeployCanaryGke
    name: "Canary deployment strategy (Cloud Deploy, GKE target)"
    where: "Cloud Deploy › delivery pipeline › stage › strategy.canary.runtimeConfig.kubernetes: serviceNetworking (Service and Deployment) or gatewayServiceMesh (HTTPRoute, Service and Deployment); canaryDeployment.percentages"
    setVia: [configFile, apiCli]
    area: tools
    recommended: "Each new agent image released through canary phases at small percentages, advanced after its evaluation passes. Use gatewayServiceMesh where calls arrive through a Gateway, which splits by request; serviceNetworking splits by Pod count and suits an agent that pulls its work."
    why: "A new agent, prompt or model revision that behaves badly reaches a small share of runs first. With pod overprovisioning left on, the original Deployment is not modified until the stable phase, so a cancelled rollout leaves it serving."
    mitigations: [cap-staged-rollout-gate]
    url: https://docs.cloud.google.com/deploy/docs/deployment-strategies/canary
    verified: "2026-11-18"
  - id: gkeGatewayIap
    name: "Identity-Aware Proxy on a GKE Gateway (GCPBackendPolicy)"
    where: "GKE › GCPBackendPolicy (networking.gke.io/v1) › spec.default.iap, targetRef the agent's Service, on the internal Gateway (GatewayClass gke-l7-rilb) in front of the agent"
    setVia: [configFile, cloudPolicy]
    area: identity
    default: "No IAP is applied to a Gateway's backend services"
    recommended: "Enabled on the agent's Service, with the IAP-secured Web App User role granted only to the service accounts of the front end and the gateway. Each caller presents an OIDC token whose audience is the IAP OAuth client ID."
    why: "Cloud Run checked the caller's IAM permission on every request to the agent. Behind a Gateway nothing does until IAP is on, so without it any workload that can route to the load balancer can drive the agent."
    mitigations: [D3-APA]
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/configure-gateway-resources
    verified: "2026-11-18"
  # <<< hosting rows
  # >>> more hosting rows (settings used only by a hosting variant of the server, inference, training and sandbox patterns)
  - id: cloudRunDirectVpcFirewall
    name: "Direct VPC egress with network tags and VPC firewall rules"
    where: "Cloud Run › service or job › Networking › --network, --subnet, --network-tags, --vpc-egress=all-traffic; VPC firewall rules that target the tags"
    setVia: [apiCli, adminConsole]
    area: network
    default: "Off; outbound traffic leaves through Google's shared internet egress"
    recommended: "Send all traffic to the VPC, give each workload its own network tag, and write egress firewall rules that allow only its named destinations and deny everything else. Add Cloud NAT only if a destination needs it."
    why: "Without it a service or job can reach the internet directly. Network tags let firewall rules tell one workload from another."
    mitigations: [D3-NI]
    url: https://docs.cloud.google.com/run/docs/configuring/vpc-direct-vpc
    verified: "2026-11-18"
  - id: cloudRunGen2Isolation
    name: "Second generation execution environment, one instance per trust group"
    where: "Cloud Run › service › --execution-environment gen2 (jobs and worker pools always use it); a separate service, or a separate job task, for each trust group"
    setVia: [apiCli, adminConsole]
    area: data
    recommended: "Use the second generation environment and never mix trust groups in one instance: a separate service for each sensitivity tier when serving models, and a separate job task for each rollout when running sandboxes."
    why: "Each instance sits behind a boundary enforced by a virtual machine monitor, which Google describes as stronger than the boundary between containers inside it."
    mitigations: [D3-HBPI]
    url: https://docs.cloud.google.com/run/docs/securing/security
    verified: "2026-11-18"
  - id: cloudRunSandboxLauncher
    name: "Cloud Run sandboxes (sandbox launcher)"
    where: "Cloud Run › job, service or worker pool › --sandbox-launcher (sandboxLauncher: true); the host code starts each sandbox with /usr/local/gcp/bin/sandbox"
    setVia: [apiCli, configFile, code]
    area: tools
    default: "Off"
    requires: "Preview; second generation execution environment"
    recommended: "Enable the launcher and run every model action through sandbox do or sandbox run. Do not pass --allow-egress, secrets in --env or writable --mount; mount shared directories readonly and move files in and out as tar archives."
    why: "A sandbox has a read-only root, no host environment variables, secrets or metadata server credentials and no outbound network, unless these flags relax it."
    mitigations: [D3-EI]
    url: https://docs.cloud.google.com/run/docs/code-execution
    verified: "2026-11-18"
  - id: cloudRunJobsIam
    name: "Cloud Run Jobs Executor (roles/run.jobsExecutor)"
    where: "Cloud Run › Jobs › (rollout job) › Permissions; gcloud run jobs add-iam-policy-binding"
    setVia: [adminConsole, apiCli]
    area: identity
    recommended: "Grant Cloud Run Jobs Executor on the rollout job only to the orchestrator's service account and the researchers' group. Keep Cloud Run Admin and Cloud Run Developer for the platform team."
    why: "Decides who can start and cancel rollouts, in place of the Kubernetes RoleBinding in the run namespace."
    mitigations: [D3-APA]
    url: https://docs.cloud.google.com/run/docs/reference/iam/roles
    verified: "2026-11-18"
  - id: cloudRunCancelExecution
    name: "Cancel job execution"
    where: "Cloud Run › Jobs › (job) › execution › Actions › Cancel; also the gcloud CLI, client libraries and REST API; needs the run.executions.cancel permission"
    setVia: [apiCli, adminConsole, code]
    area: tools
    recommended: "Have the orchestrator cancel every running execution of a run on a serious-risk alert and then disable the run's service account. Cancel executions, do not delete them, so their logs stay."
    why: "Cancelling stops the tasks, and the sandboxes inside them, while the execution's configuration, logs and monitoring data remain viewable."
    mitigations: [cap-agent-kill-switch]
    url: https://docs.cloud.google.com/run/docs/execute/jobs
    verified: "2026-11-18"
  - id: gkeSecretManagerAddOn
    name: "Secret Manager add-on for GKE"
    where: "GKE › cluster › --enable-secret-manager (with --enable-secret-manager-rotation); a SecretProviderClass per workload, mounted as a volume in the Pod"
    setVia: [apiCli, clusterPolicy]
    area: identity
    default: "Off"
    requires: "Workload Identity Federation for GKE on the cluster"
    recommended: "Enable the add-on with rotation. Mount each upstream credential from Secret Manager through a SecretProviderClass, and grant Secret Manager Secret Accessor only to that workload's Kubernetes ServiceAccount. Keep no credential in the image."
    why: "Upstream credentials stay in Secret Manager under IAM and reach only the Pod that needs them, as the Cloud Run secret reference did."
    mitigations: [D3-CH]
    url: https://docs.cloud.google.com/secret-manager/docs/secret-manager-managed-csi-component
    verified: "2026-11-18"
  - id: apigeeSanitizeModelResponse
    name: "SanitizeModelResponse policy"
    where: "Apigee › model proxy › response flow, pointing at a Model Armor template; used with the SanitizeUserPrompt policy on the request flow"
    setVia: [configFile, apiCli]
    area: data
    default: "Not attached"
    requires: "A Model Armor template; the Model Armor User and Model Armor Viewer roles on the service account that deploys the proxy; an Extensible policy, so Apigee licence terms apply"
    recommended: "Attach SanitizeUserPrompt to the request flow and SanitizeModelResponse to the response flow of the model proxy, both naming the Model Armor template for this tier, and return an error to the caller when a response is flagged."
    why: "Model Armor's built-in integration screens only Gemini generateContent calls, so a self-deployed model's prompts and responses are screened at the gateway."
    mitigations: [cap-output-guardrails]
    url: https://docs.cloud.google.com/apigee/docs/api-platform/reference/policies/sanitize-llm-response-policy
    verified: "2026-11-18"
  - id: endpointPscPrivate
    name: "Dedicated private endpoint (Private Service Connect)"
    where: "Agent Platform › Endpoints › create › privateServiceConnectConfig (enablePrivateServiceConnect, projectAllowlist); a forwarding rule in the consuming VPC"
    setVia: [apiCli, adminConsole]
    area: network
    default: "Off (the endpoint is public)"
    requires: "The projectAllowlist cannot be changed after the endpoint is created"
    recommended: "Create the endpoint with Private Service Connect enabled and a projectAllowlist that names only the gateway's project. Connect from that VPC with a forwarding rule and use port 443, the TLS port."
    why: "Requests stay on private addresses and only listed projects can connect. Dedicated public endpoints do not support VPC Service Controls."
    mitigations: [D3-NI]
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/predictions/private-service-connect
    verified: "2026-11-18"
  - id: endpointTrafficSplit
    name: "Traffic split between deployed models"
    where: "Agent Platform › Endpoints › (endpoint) › deployed models › traffic split (gcloud ai endpoints deploy-model --traffic-split)"
    setVia: [apiCli, adminConsole]
    area: tools
    recommended: "Deploy the new model version to the same endpoint with a small share of traffic, raise the share in steps while watching errors and latency, and return the share to the previous deployed model to roll back."
    why: "Replaces the weighted HTTPRoute between InferencePools: the endpoint itself moves traffic gradually between model versions."
    mitigations: [cap-staged-rollout-gate]
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/general/deployment
    verified: "2026-11-18"
  - id: endpointDedicatedResources
    name: "Dedicated resources per deployed model (dedicatedResources.machineSpec)"
    where: "Agent Platform › Endpoints › deploy model › machine type, accelerator and replica counts (dedicatedResources)"
    setVia: [apiCli, adminConsole]
    area: data
    recommended: "Give each sensitivity tier its own endpoint and deployed model, so tiers never share serving nodes. The inference pages describe no Confidential Computing option; where memory encryption is required, serve that tier on Confidential GKE Nodes."
    why: "Compute belongs to the deployed model, not the endpoint, so separate deployments keep tiers on separate machines. This is weaker than the confidential nodes of the GKE mapping."
    mitigations: [D3-HBPI]
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/predictions/configure-compute
    verified: "2026-11-18"
  - id: endpointServiceAccount
    name: "Use a custom service account (deployed model)"
    where: "Agent Platform › Endpoints › deploy model › service account (gcloud ai endpoints deploy-model --service-account)"
    setVia: [apiCli, adminConsole]
    area: identity
    default: "A service account managed by Agent Platform that can only read the model artefacts"
    recommended: "Keep the default where the container needs nothing but its artefacts. If it must call other services, attach a dedicated service account that holds only those roles; never reuse a shared one."
    why: "The serving container's identity decides what a compromised model server can reach."
    mitigations: [D3-AA, D3-CH]
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/general/custom-service-account
    verified: "2026-11-18"
  - id: endpointAccessLogging
    name: "Access logging and request-response logging (online inference)"
    where: "Agent Platform › Endpoints › deploy model › --enable-access-logging; request-response logging set on the endpoint, written to BigQuery"
    setVia: [apiCli, adminConsole]
    area: audit
    default: "Access logging is off; container logging is on for the v1 API"
    recommended: "Enable access logging when deploying the model and keep container logging on. Enable request-response logging to BigQuery only where content may be retained; on dedicated endpoints it covers only predict and rawPredict calls with payloads under 10 MB."
    why: "Gives a per-request record from the serving side, beside the gateway's own log. Access logging can only be changed by redeploying the model."
    mitigations: [AML.M0024]
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/predictions/online-prediction-logging
    verified: "2026-11-18"
  - id: gkeAuditLogs
    name: "Data Access audit logs (Kubernetes Engine API and k8s.io)"
    where: "IAM & Admin › Audit Logs › Kubernetes Engine API; Kubernetes audit log entries use the service name k8s.io"
    setVia: [adminConsole, apiCli]
    area: audit
    default: "Admin Activity audit logs are always on; Data Access audit logs are off"
    recommended: "Enable Data Access audit logs for the training cluster's project and route the k8s.io entries for the training namespaces to the log bucket, so that who created, changed or read training workloads is recorded."
    why: "The job no longer runs through the Agent Platform API, so its audit trail moves to GKE's audit logs."
    mitigations: [AML.M0024]
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/audit-logging
    verified: "2026-11-18"
  # <<< more hosting rows

implementations:
  - architecture: archChatAgent
    asOf: "2026-10"
    # >>> checked against the vendor's documentation
    verified: "2026-11-18"
    sources:
      entry: https://docs.cloud.google.com/armor/docs/security-policy-overview
      events: https://docs.cloud.google.com/scheduler/docs/overview
      agent: https://docs.cloud.google.com/architecture/single-agent-ai-system-adk-cloud-run
      localTools: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sandbox/code-execution-overview
      memory: https://docs.cloud.google.com/run/docs/ai-agents
      gateway: https://docs.cloud.google.com/apigee/docs/api-platform/get-started/ai-capabilities
      provider: https://docs.cloud.google.com/gemini-enterprise-agent-platform/overview
      internalTools: https://docs.cloud.google.com/apigee/docs/api-platform/apigee-mcp/manage-mcp-tool-access
      openWeb: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/grounding/grounding-with-google-search
      registry: https://docs.cloud.google.com/artifact-registry/docs/repositories/remote-overview
    differences:
      - at: agent->gateway
        text: "ADK sends model calls straight to Gemini with the agent's own service account unless you wrap the model in ApigeeLlm. To force the gateway, point model and MCP addresses at Apigee and remove direct model permission from the agent's account."
        url: https://adk.dev/agents/models/apigee/
      - at: gateway->provider
        text: "Google's reference sends the model call from the agent through Model Armor to Gemini, with no Apigee. Here Apigee calls the model with its own service account, so also turn on Model Armor floor settings to catch calls that bypass Apigee."
        url: https://docs.cloud.google.com/architecture/single-agent-ai-system-adk-cloud-run
      - at: gateway->internalTools
        text: "Google's reference has the agent call MCP servers on Cloud Run directly, protected by IAP and IAM, or through Agent Gateway. To make Apigee the only door, allow only Apigee's service account to invoke the tool services."
        url: https://docs.cloud.google.com/architecture/single-agent-ai-system-adk-cloud-run
      - at: gateway->openWeb
        text: "Grounding with Google Search is a switch inside the model request: Google runs the search, and Apigee never sees or filters the pages. Google's page also says search cannot share one request with function calling, so they need separate model calls."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/grounding/grounding-with-google-search
      - at: localTools
        text: "Code Execution is a separate Agent Platform service with no network, called by API. ADK says the agent's service account needs roles/aiplatform.user for it, the same role that permits direct model calls, which weakens the gateway-only rule unless narrowed."
        url: https://adk.dev/integrations/code-exec-agent-runtime/
      - at: agent
        text: "Apigee is not the network exit. Cloud Run reaches the internet freely unless you send all outbound traffic into the VPC and through Secure Web Proxy with an allow list. Agent Gateway for Cloud Run uses that same proxy and is Limited Preview."
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/gateways/agent-gateway-overview
      - at: memory
