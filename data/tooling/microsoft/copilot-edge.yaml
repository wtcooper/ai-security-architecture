# Microsoft Copilot in Edge — one entity per product × reference architecture. Facts are dated (asOf) and
# cite the vendor's own documentation; re-verify before enforcing. Schema: data/tooling/README.md.
# Scope: Copilot in Microsoft Edge for Business on profiles signed in with a Microsoft Entra account
# (Microsoft 365 Copilot Chat in the side pane, browsing with Copilot, Cowork actions in Edge and the Copilot
# Mode features configured on the Edge management service's Copilot tab). Exclusions: Copilot on personal
# Microsoft account (MSA) profiles is a consumer product the page-context and Cowork policies do not reach;
# it is recorded as a riskNote, not a variant. Microsoft 365 Copilot itself (agents, connectors, Purview,
# memory) is toolM365Copilot; rows here cite it where the Edge surface inherits a control from it. Rewrite
# (ComposeInlineEnabled) is temporarily unavailable and its policy removed, so it is not a variant.
# 2026-10-30: onboarded against the MITRE capability rules. Policy pages under
# learn.microsoft.com/deployedge/microsoft-edge-browser-policies/<name> redirect (200) to
# deployedge/microsoft-edge-policies/<Name>, the URL written here; go.microsoft.com/fwlink/?LinkId=2341535 ->
# DeployEdge/microsoft-edge-management-browsing-with-copilot; fwlink 2288056 -> legal/microsoft-edge/privacy.
# The exemplar URL explore.microsoft.com/en-us/edge/copilot (200) is consumer marketing and documents no
# administrator control. Microsoft identity, Purview audit and Service Trust Portal facts shared with
# toolM365Copilot.
vendor: microsoft
family: Microsoft Copilot in Edge
tools:
  - id: toolCopilotEdge
    name: Microsoft Copilot in Edge (Microsoft 365 Copilot Chat in the Edge for Business side pane, browsing with Copilot)
    surfaceClasses:
      - agenticBrowser
    variants:
      - name: Microsoft 365 Copilot Chat in the Edge side pane (Entra profile)
        class: agenticBrowser
        url: https://learn.microsoft.com/en-us/copilot/edge
        note: >-
          Chat with enterprise data protection that can read the current page, browsing history and video
          transcript when EdgeEntraCopilotPageContext allows it; summarised page content may be retained under
          enterprise data protection.
      - name: Browsing with Copilot (preview; Microsoft 365 Copilot licence; tenants outside the EEA)
        class: agenticBrowser
        url: https://learn.microsoft.com/en-us/DeployEdge/microsoft-edge-management-browsing-with-copilot
        note: >-
          Copilot browses sites on the user's behalf to complete multi-step workflows, only on domains in
          BrowsingWithCopilotAllowList and never on BrowsingWithCopilotBlockList; it asks the user for
          authentication steps and final saving and submitting actions.
      - name: Cowork actions in Edge (Edge 152 and later)
        class: agenticBrowser
        url: https://learn.microsoft.com/en-us/deployedge/microsoft-edge-policies/CopilotCoworkToolActionsEnabled
        note: >-
          Lets Microsoft 365 Copilot Cowork take actions on the user's behalf in Edge; governed by
          CopilotCoworkToolActionsEnabled, which does not apply to Microsoft account profiles.
    architecture: archAgenticBrowser
    status: ga
    asOf: "2026-10"
    summary:
      - >-
        Copilot built into Microsoft Edge for Business: on a profile signed in with a Microsoft Entra account the
        side pane is Microsoft 365 Copilot Chat with enterprise data protection, which can use the open page,
        browsing history and video transcripts as context, and with a Microsoft 365 Copilot licence it can
        browse sites for the user (browsing with Copilot, preview) and let Cowork act in the browser. Inference
        runs in Microsoft's cloud under Microsoft 365 Copilot; Edge decides what browsing context to send based
        on the query and the policy, and Copilot acts inside the user's own signed-in browser session.
      - >-
        The administrator is the Microsoft 365 or Intune administrator: Edge policies delivered by Group Policy,
        Intune or the Edge management service (Microsoft 365 admin center › Settings › Microsoft Edge ›
        Configuration policies › Copilot tab) switch Copilot off (EdgeCopilotEnabled), control page access
        (EdgeEntraCopilotPageContext, CopilotPageContext, CopilotOnSensitiveContentEnabled), allow and block the
        sites Copilot may browse (AllowBrowsingWithCopilot, BrowsingWithCopilotAllowList and BlockList) and
        Cowork actions (CopilotCoworkToolActionsEnabled). Interactions are audited in Microsoft Purview as
        CopilotInteraction with AppHost Edge; Purview DLP and Defender for Cloud Apps act in the Edge for
        Business work profile.
    facts:
      - label: Plans
        value: >-
          Microsoft 365 Copilot Chat in Edge for any Entra user; browsing with Copilot needs a Microsoft 365
          Copilot licence and is a preview open to tenants outside the European Economic Area; Commercial
          Journeys (Get things done) needs Microsoft 365 Copilot Premium or higher.
        url: https://learn.microsoft.com/en-us/DeployEdge/microsoft-edge-management-browsing-with-copilot
      - label: Inference & routing
        value: >-
          Microsoft 365 Copilot Chat under enterprise data protection when signed in with an Entra account; the
          side pane is hosted on edge://commercial-copilot-chat and cr.m365copilotapp.svc.cloud.microsoft, which
          Microsoft says to govern by policy rather than block. Edge can also download a local foundational model
          for on-device inference (GenAILocalFoundationalModelSettings).
        url: https://learn.microsoft.com/en-us/deployedge/microsoft-edge-security-endpoints
      - label: Data leaving the device
        value: >-
          For queries that need no browsing context Edge sends the URL, page title, query and conversation
          history; with permission to use page information it sends the browsing context of the session.
          Pages protected by DLP policies are not read unless CopilotOnSensitiveContentEnabled opens a protected
          session. Browsing history of tenant-approved work sites is shared with Microsoft 365 Copilot Search
          unless ShareBrowsingHistoryWithCopilotSearchAllowed is disabled.
        url: https://learn.microsoft.com/en-us/copilot/edge
      - label: Retention & training
        value: >-
          Enterprise data protection applies to prompts and responses on an Entra profile; summarised page
          content (not the full page) may be retained and processed under it. Copilot memory follows Microsoft
          365 Copilot (Enhanced personalization on by default; Purview retention does not apply to memories).
        url: https://learn.microsoft.com/en-us/copilot/edge
      - label: Docs index
        value: >-
          Microsoft Edge Browser Policy Documentation (Copilot and Generative AI sections) and Copilot Chat in
          Edge (learn.microsoft.com/copilot/edge)
        url: https://learn.microsoft.com/en-us/deployedge/microsoft-edge-policies
      - label: Admin planes
        value: >-
          Edge policies by Group Policy (ADMX), Intune or macOS preferences; the Edge management service Copilot
          tab (Access to browser context, Copilot icon in the toolbar, Copilot search box, AI-generated text and
          editing, Copilot new tab page, Browsing with Copilot), assigned to all users or Entra groups and
          downloaded within up to 90 minutes; Microsoft Purview (Audit, DLP); Defender for Cloud Apps.
        url: https://learn.microsoft.com/en-us/deployedge/microsoft-edge-management-service-copilot-features
    items:
      - title: Where each control lives
        body:
          - >-
            Edge policies (Administrative Templates/Microsoft Edge, or the Edge management service Copilot tab):
            EdgeCopilotEnabled, Microsoft365CopilotChatIconEnabled, EdgeEntraCopilotPageContext,
            CopilotPageContext, CopilotOnSensitiveContentEnabled, AllowBrowsingWithCopilot,
            BrowsingWithCopilotAllowList, BrowsingWithCopilotBlockList, CopilotCoworkToolActionsEnabled,
            ShareBrowsingHistoryWithCopilotSearchAllowed, BrowserSignin, RestrictSigninToPattern. Microsoft
            Purview: Audit (CopilotInteraction, AppHost Edge), DLP. Microsoft 365 admin center: Enhanced
            personalization for Copilot memory, Copilot usage report.
        links:
          - title: Microsoft Edge Browser Policy Documentation
            url: https://learn.microsoft.com/en-us/deployedge/microsoft-edge-policies
          - title: Enable browsing with Copilot in the Edge management service
            url: https://learn.microsoft.com/en-us/DeployEdge/microsoft-edge-management-browsing-with-copilot
      - title: Policies apply only to Entra profiles
        body:
          - >-
            The page-context, browsing and Cowork policies state that they apply to profiles signed in with a
            Microsoft Entra account and not to Microsoft account profiles. Pair them with BrowserSignin and
            RestrictSigninToPattern so managed devices run Copilot only in the work profile.
        links:
          - title: RestrictSigninToPattern
            url: https://learn.microsoft.com/en-us/deployedge/microsoft-edge-policies/RestrictSigninToPattern
    riskNotes:
      - risk: riskPromptInjection
        note: >-
          Browsing with Copilot and page summarisation read web pages into the model; Microsoft 365 Copilot's
          cross-prompt-injection classifier is vendor-run and surfaces only as XPIADetected in the audit record,
          and the allow list bounds which sites the agent acts on, not what an allowed page says.
      - risk: riskAgenticDelegationConfusedDeputy
        note: >-
          Copilot acts inside the user's own signed-in Edge session with no identity of its own, so an allowed
          site sees the user; Copilot asks the user for authentication steps rather than handling credentials.
      - risk: riskShadowAndUnknownAgents
        note: >-
          Copilot on a personal Microsoft account profile is outside every Entra-profile policy; without
          RestrictSigninToPattern a user can sign a managed Edge into a personal account and use consumer
          Copilot Mode beside the work profile.
      - risk: riskSensitiveDataDisclosure
        note: >-
          Page access is on by default outside the EU (EdgeEntraCopilotPageContext unset), and browsing history
          of tenant-approved sites is shared with Microsoft 365 Copilot Search by default.
      - risk: riskRogueActions
        note: >-
          Browsing with Copilot confirms authentication and final saving or submitting with the user, but which
          steps count is Microsoft's choice; Cowork actions in Edge are a user setting unless the policy pins
          them.
    controls:
      - mitigation: AML.M0029
        coverage: partial
        mechanism: >-
          Browsing with Copilot requests user input for steps requiring authentication and for final saving and
          submitting actions (vendor-defined); CopilotCoworkToolActionsEnabled decides whether Cowork may take
          actions on the user's behalf in Edge; AllowBrowsingWithCopilot can pin browsing on or off
        steps:
          - title: Keep Cowork actions behind a decision
            body:
              - >-
                Set CopilotCoworkToolActionsEnabled to Disabled for everyone outside a pilot group so Cowork cannot
                act in the browser and users cannot turn it on in Settings.
            url: https://learn.microsoft.com/en-us/deployedge/microsoft-edge-policies/CopilotCoworkToolActionsEnabled
          - title: Pilot browsing with Copilot to a group
            body:
              - >-
                Assign the Browse with Copilot configuration to an Entra group in the Edge management service rather
                than to All users.
            url: https://learn.microsoft.com/en-us/DeployEdge/microsoft-edge-management-browsing-with-copilot
        note: >-
          Partial on the rule applied to Claude in Chrome: a present user confirms named consequential classes
          (authentication, final save and submit), but the set is vendor-chosen and no administrator setting adds
          a class or requires per-action approval; the docs do not say how a send or a purchase that is not a
          "final submit" is treated. Cowork actions are all-or-nothing per policy.
        verified: "2026-10-30"
      - mitigation: AML.M0028
        coverage: partial
        mechanism: >-
          BrowsingWithCopilotAllowList and BrowsingWithCopilotBlockList (origins; block wins; users cannot modify);
          EdgeEntraCopilotPageContext and CopilotPageContext for read access to page content, browsing history and
          video transcripts; CopilotCoworkToolActionsEnabled for Cowork actions
        steps:
          - title: List the sites Copilot may browse
            body:
              - >-
                Set BrowsingWithCopilotAllowList to the work sites the pilot needs (or use the curated commonly used
                sites toggle) and BrowsingWithCopilotBlockList to client portals, banking and HR systems.
            url: https://learn.microsoft.com/en-us/deployedge/microsoft-edge-policies/BrowsingWithCopilotAllowList
          - title: Decide page access explicitly
            body:
              - >-
                Set EdgeEntraCopilotPageContext to Enabled or Disabled rather than leaving the regional default.
            url: https://learn.microsoft.com/en-us/deployedge/microsoft-edge-policies/EdgeEntraCopilotPageContext
        note: >-
          Partial on the rule applied to Claude in Chrome: per-origin allow and block lists the user cannot
          override, but no read-only tier on an allowed site and no per-operation scope; page context is a single
          switch for page content, history and transcripts. Paths are ignored in the patterns, so a site is
          allowed or blocked whole.
        verified: "2026-10-30"
      - mitigation: D3-CTS
        coverage: partial
        mechanism: >-
          Copilot acts in the user's Entra profile session; browsing with Copilot asks the user for steps
          requiring authentication; the allow list bounds the signed-in origins it can act on
        steps:
          - title: Bound the sessions Copilot can use
            body:
              - >-
                Keep BrowsingWithCopilotAllowList to named work sites so Copilot acts only in those sessions.
            url: https://learn.microsoft.com/en-us/deployedge/microsoft-edge-policies/BrowsingWithCopilotAllowList
        note: >-
          Partial on the rule applied to Claude in Chrome: the allow list denies the agent the sessions of
          unlisted origins and authentication is handed back to the user, but on an allowed origin Copilot acts
          with the user's full session and cookies; there is no agent identity or on-behalf-of exchange, and
          nothing documented keeps Edge's saved passwords from a page Copilot fills.
        verified: "2026-10-30"
      - mitigation: cap-input-guardrails
        coverage: partial
        mechanism: >-
          Microsoft 365 Copilot's jailbreak and cross-prompt-injection (XPIA) classifiers, vendor-run, recorded as
          JailbreakDetected and XPIADetected on the CopilotInteraction audit record (AppHost Edge)
        steps:
          - title: Alert on detected injection
            body:
              - >-
                Stream CopilotInteraction records with AppHost Edge to the SIEM and alert on XPIADetected and
                JailbreakDetected.
            url: https://learn.microsoft.com/en-us/purview/audit-copilot
        note: >-
          Partial on the rule applied to every vendor: the screening is vendor-internal and not admin-tunable,
          and its verdict reaches the organisation only after the fact through audit. The Edge pages do not say
          whether pages read during browsing with Copilot are screened before the agent acts on them.
        verified: "2026-10-30"
      - mitigation: AML.M0031
        coverage: partial
        mechanism: >-
          Copilot memory of Microsoft 365 Copilot Chat governed by Enhanced personalization (admin, disable-only;
          on by default); eDiscovery search and Graph deletion of memories
        steps:
          - title: Decide whether memory is on
            body:
              - >-
                Leave Enhanced personalization on for the firm or turn it off for groups that handle client data
                that must not persist between chats.
            url: https://learn.microsoft.com/en-us/microsoft-365/copilot/copilot-personalization-memory
        note: >-
          Partial on the disable-only rule applied to Claude in Chrome: memory can be switched off and searched
          or deleted by an administrator, but administrators cannot restrict what is added to memory, Purview
          retention does not apply to it, and nothing treats remembered page content as untrusted. The memory
          page does not name Edge; the side pane is Microsoft 365 Copilot Chat, so the control is inherited.
        verified: "2026-10-30"
      - mitigation: D3-WSAA
        coverage: external
        mechanism: >-
          Microsoft Defender for Cloud Apps session policies and Purview DLP enforced in the Edge for Business work
          profile (in-browser protection) observe the user's session, in which Copilot's browsing runs
        evidence:
          - title: In-browser protection with Microsoft Edge for Business (Defender for Cloud Apps)
            url: https://learn.microsoft.com/en-us/defender-cloud-apps/in-browser-protection
          - title: Enable browsing with Copilot (no activity log of browsing steps documented)
            url: https://learn.microsoft.com/en-us/DeployEdge/microsoft-edge-management-browsing-with-copilot
        note: >-
          External: session analysis is a CASB/SSE product's (Defender for Cloud Apps, separately licensed), and the
          integration point is the Edge for Business work profile, where in-browser protection applies its session
          policies without a proxy. Edge documents no log of the pages browsing with Copilot visited or the
          actions it took, so the agent's activity is seen only as the user's session.
        verified: "2026-10-30"
      - mitigation: cap-agent-tool-registry
        coverage: external
        mechanism: >-
          Copilot is part of the browser, not an extension; the browser estate and its policy state are reported by
          device management (Intune, edge://policy), and agents reachable from the side pane are registered in the
          Microsoft 365 admin center (toolM365Copilot)
        evidence:
          - title: Configure Microsoft Copilot settings in the Microsoft 365 admin center (Copilot in Edge links to Edge configuration policies)
            url: https://learn.microsoft.com/en-us/microsoft-365/copilot/configure-copilot-admin-center
          - title: Microsoft Edge management service Copilot features
            url: https://learn.microsoft.com/en-us/deployedge/microsoft-edge-management-service-copilot-features
        note: >-
          External by the rule applied to Claude in Chrome: inventory of where the capability is enabled is the
          device-management product's, keyed on the configuration policy assignment; there is nothing to admit by
          id because Copilot ships in the browser. The agents and connectors Copilot Chat can call are the Microsoft
          365 admin center's registry, assessed on toolM365Copilot.
        verified: "2026-10-30"
      - mitigation: cap-shadow-ai-discovery
        coverage: partial
        mechanism: >-
          BrowserSignin (Force) and RestrictSigninToPattern keep managed Edge profiles on work accounts, which the
          Copilot policies govern; the Microsoft 365 Copilot usage report lists Copilot use in Microsoft Edge per
          user; Purview DLP in Edge for Business acts on unmanaged AI apps
        steps:
          - title: Keep managed browsers on work accounts
            body:
              - >-
                Set BrowserSignin to Force and RestrictSigninToPattern to the firm's domains so personal Microsoft
                accounts cannot be signed in.
            url: https://learn.microsoft.com/en-us/deployedge/microsoft-edge-policies/RestrictSigninToPattern
          - title: Read Copilot use in Edge
            body:
              - >-
                Review the Microsoft 365 Copilot usage report's Microsoft Edge entries for who uses Copilot in the
                browser.
            url: https://learn.microsoft.com/en-us/microsoft-365/admin/activity-reports/microsoft-365-copilot-usage
        note: >-
          Partial: the vendor lists governed use and the browser can be held to work accounts, but consumer Copilot
          on a personal profile or an unmanaged device is invisible to these reports; discovering other AI tools
          used through Edge is Purview's and Defender for Cloud Apps' (external).
        verified: "2026-10-30"
      - mitigation: cap-agent-tracing
        coverage: partial
        mechanism: >-
          Microsoft Purview Audit CopilotInteraction records for Microsoft 365 Copilot Chat in the Edge sidebar
          (AppHost Edge), with the resources accessed and classifier verdicts
        steps:
          - title: Stream Edge Copilot interactions
            body:
              - >-
                In Purview Audit filter CopilotInteraction on AppHost Edge and collect the records for the SIEM.
            url: https://learn.microsoft.com/en-us/purview/audit-copilot
        note: >-
          Partial on the tracing rule: chat interactions in the side pane land in the organisation's audit log,
          but the Edge pages document no record of the steps browsing with Copilot or Cowork took in the browser
          (pages visited, clicks, form entries), so the action trail is the target sites' own logs.
        verified: "2026-10-30"
      - mitigation: cap-sensitive-data-redaction
        coverage: partial
        mechanism: >-
          Copilot cannot read page content on pages protected by DLP policies; CopilotOnSensitiveContentEnabled
          opens a protected session (not saved to history, no copy or download) for such pages; Purview DLP on the
          Microsoft 365 Copilot and Copilot Chat location; EdgeEntraCopilotPageContext to stop page access
        steps:
          - title: Keep DLP-protected pages out of Copilot
            body:
              - >-
                Leave CopilotOnSensitiveContentEnabled unconfigured or disabled so Edge keeps Copilot away from
                content your DLP policies protect.
            url: https://learn.microsoft.com/en-us/deployedge/microsoft-edge-policies/CopilotOnSensitiveContentEnabled
          - title: Refuse prompts carrying sensitive data
            body:
              - >-
                Create a Purview DLP policy on the Microsoft 365 Copilot and Copilot Chat location with Content
                contains > Sensitive information types and Restrict Copilot from processing content.
            url: https://learn.microsoft.com/en-us/purview/dlp-microsoft365-copilot-location-learn-about
        note: >-
          Partial: DLP keeps protected pages and prompts carrying sensitive types away from Copilot, but nothing
          masks a value in place; an unprotected page containing client data is sent whole once page access is on.
        verified: "2026-10-30"
      - mitigation: cap-agent-egress-control
        coverage: native
        mechanism: >-
          BrowsingWithCopilotAllowList and BrowsingWithCopilotBlockList restrict the origins browsing with Copilot
          can act on, enforced by Edge for the agent and separable from the user's own browsing; with no allow list
          the feature is unavailable
        steps:
          - title: Allow only listed sites
            body:
              - >-
                Configure BrowsingWithCopilotAllowList with the approved origins and BrowsingWithCopilotBlockList
                for exceptions; leaving the allow list empty disables browsing with Copilot.
            url: https://learn.microsoft.com/en-us/deployedge/microsoft-edge-policies/BrowsingWithCopilotAllowList
        note: >-
          Native by the rule applied to Claude in Chrome: an administrator-set list of sites the agent may work
          on, enforced by the browser and not changeable by the user. Boundaries: only HTTP and HTTPS origins,
          paths ignored; whether a navigation from an allowed page to an unlisted one is stopped before the request
          leaves is not documented; the side pane's web search and Cowork actions are not documented to follow
          these lists.
        verified: "2026-10-30"
      - mitigation: D3-MFA
        coverage: partial
        mechanism: >-
          Copilot Chat with enterprise data protection requires an Entra sign-in to the Edge profile, whose MFA is
          Microsoft Entra Conditional Access; BrowserSignin and RestrictSigninToPattern hold the browser to work
          accounts
        steps:
          - title: Force a work sign-in
            body:
              - >-
                Set BrowserSignin to Force (2) and RestrictSigninToPattern to the firm's account pattern; enforce MFA
                for the Microsoft 365 apps in Conditional Access.
            url: https://learn.microsoft.com/en-us/deployedge/microsoft-edge-policies/BrowserSignin
        note: >-
          Partial on the MFA rule applied to every vendor: Edge documents no second factor of its own, so the
          factor is whatever Entra enforces, and the tenant binding keeps Copilot off personal accounts.
        verified: "2026-10-30"
      - mitigation: cap-agent-action-policy-enforcement
        coverage: partial
        mechanism: >-
          Administrator-delivered allow and block lists the user cannot modify; vendor-fixed confirmation of
          authentication and final save or submit; Cowork actions on or off by policy
        steps:
          - title: Block sites where an action would be consequential
            body:
              - >-
                Add banking, HR, payment and client-portal origins to BrowsingWithCopilotBlockList, which takes
                precedence over the allow list.
            url: https://learn.microsoft.com/en-us/deployedge/microsoft-edge-policies/BrowsingWithCopilotBlockList
        note: >-
          Partial by the rule applied to Claude in Chrome: the site lists are admin-delivered and non-overridable,
          but no administrator can add an action class or a rule over what Copilot types or submits.
        verified: "2026-10-30"
      - mitigation: cap-ai-vendor-assessment
        coverage: external
        mechanism: >-
          Microsoft 365 Copilot compliance offerings and the Service Trust Portal feed the organisation's TPRM
          platform; the Edge privacy statement describes what Edge sends to Copilot
        evidence:
          - title: Microsoft Edge privacy — data and consent used by Copilot in Microsoft Edge
            url: https://learn.microsoft.com/en-us/legal/microsoft-edge/privacy
          - title: Get started with the Microsoft Service Trust Portal
            url: https://learn.microsoft.com/en-us/compliance/assurance/stp-get-started
        note: >-
          External: the assessment, evidence expiry and reassessment trigger live in the TPRM platform, as for
          every vendor; Copilot in Edge runs on Microsoft 365 Copilot, assessed with toolM365Copilot. Reassess when
          browsing with Copilot leaves preview and when Cowork actions are enabled.
        verified: "2026-10-30"
      - mitigation: cap-agent-kill-switch
        coverage: partial
        mechanism: >-
          EdgeCopilotEnabled disabled (users cannot use Copilot in Edge); AllowBrowsingWithCopilot disabled;
          CopilotCoworkToolActionsEnabled disabled; all support dynamic policy refresh; Edge management service
          changes download within up to 90 minutes
        steps:
          - title: Turn browsing off
            body:
              - >-
                Set AllowBrowsingWithCopilot to Disabled for the affected group; Edge applies it on policy refresh
                without a restart.
            url: https://learn.microsoft.com/en-us/deployedge/microsoft-edge-policies/AllowBrowsingWithCopilot
          - title: Turn Copilot off
            body:
              - >-
                Set EdgeCopilotEnabled to Disabled; users cannot use Copilot in Microsoft Edge.
            url: https://learn.microsoft.com/en-us/deployedge/microsoft-edge-policies/EdgeCopilotEnabled
        note: >-
          Partial on the kill-switch rule: the switches reach every managed browser without the user, but delivery
          through the Edge management service can take up to 90 minutes and the docs do not say that a browsing
          task already running stops when the policy refreshes.
        verified: "2026-10-30"
    # The security-relevant settings, each with the baseline value (data/tooling/BASELINE.md).
    # Every row is an Edge policy (Group Policy, Intune or the Edge management service Copilot tab) or a
    # Microsoft 365 control the side pane inherits; the Edge policies apply only to Entra profiles. Verified 2026-10-30.
    settings:
      - id: browserSignin
        name: BrowserSignin
        where: Edge policy › BrowserSignin
        setVia: [mdm]
        area: identity
        default: Users decide whether to sign in
        recommended: Force users to sign-in to use the browser (2)
        why: Every managed Edge runs on a signed-in profile, so Copilot is always the governed Entra-profile version.
        mitigations: [D3-MFA, cap-shadow-ai-discovery]
        url: https://learn.microsoft.com/en-us/deployedge/microsoft-edge-policies/BrowserSignin
        verified: "2026-10-30"
      - id: restrictSigninToPattern
        name: RestrictSigninToPattern
        where: Edge policy › RestrictSigninToPattern
        setVia: [mdm]
        area: identity
        default: Any account
        recommended: The firm's account pattern (for example .*@firm\.com)
        why: A personal Microsoft account cannot be signed in to a managed Edge, which would bring consumer Copilot outside every policy.
        mitigations: [D3-MFA, cap-shadow-ai-discovery]
        url: https://learn.microsoft.com/en-us/deployedge/microsoft-edge-policies/RestrictSigninToPattern
        verified: "2026-10-30"
      - id: edgeCopilotEnabled
        name: EdgeCopilotEnabled
        where: Edge policy › EdgeCopilotEnabled
        setVia: [mdm, adminConsole]
        area: tools
        default: Eligible users can use Copilot and turn it off
        recommended: Not configured; Disabled is the incident switch
        why: Copilot stays available, and one policy removes it from every managed browser on refresh when something goes wrong.
        mitigations: [cap-agent-kill-switch]
        url: https://learn.microsoft.com/en-us/deployedge/microsoft-edge-policies/EdgeCopilotEnabled
        verified: "2026-10-30"
      - id: copilotChatIcon
        name: Microsoft365CopilotChatIconEnabled
        where: Edge policy, or Edge management service › Copilot tab › Copilot icon in the toolbar
        setVia: [mdm, adminConsole]
        area: tools
        default: Shown; users can hide it
        recommended: Enabled
        why: Staff use the governed Microsoft 365 Copilot Chat in the side pane rather than a consumer AI site; browsing with Copilot also requires it.
        mitigations: [cap-shadow-ai-discovery]
        url: https://learn.microsoft.com/en-us/deployedge/microsoft-edge-policies/Microsoft365CopilotChatIconEnabled
        verified: "2026-10-30"
      - id: pageContext
        name: EdgeEntraCopilotPageContext
        where: Edge policy, or Edge management service › Copilot tab › Access to browser context
        setVia: [mdm, adminConsole]
        area: data
        default: Enabled outside the EU, disabled in the EU; users can change it
        recommended: Enabled, set explicitly so users cannot switch it
        why: Page summarisation is much of the value and stays under enterprise data protection; DLP-protected pages remain excluded, and regulated teams disable it by group.
        mitigations: [cap-sensitive-data-redaction, AML.M0028]
        url: https://learn.microsoft.com/en-us/deployedge/microsoft-edge-policies/EdgeEntraCopilotPageContext
        verified: "2026-10-30"
      - id: pageContextNonEdp
        name: CopilotPageContext
        where: Edge policy › CopilotPageContext
        setVia: [mdm]
        area: data
        default: Enabled outside the EU, disabled in the EU; users can change it
        recommended: Disabled
        why: The side-pane Copilot this policy covers (not Copilot with enterprise data protection, which EdgeEntraCopilotPageContext governs) cannot read work pages.
        mitigations: [cap-sensitive-data-redaction]
        url: https://learn.microsoft.com/en-us/deployedge/microsoft-edge-policies/CopilotPageContext
        verified: "2026-10-30"
      - id: sensitiveContent
        name: CopilotOnSensitiveContentEnabled
        where: Edge policy › CopilotOnSensitiveContentEnabled
        setVia: [mdm]
        area: data
        default: Not configured (Edge decides)
        recommended: Disabled
        why: Copilot is kept away from page content the firm's DLP policies protect, rather than reasoning over it in a protected session.
        mitigations: [cap-sensitive-data-redaction]
        url: https://learn.microsoft.com/en-us/deployedge/microsoft-edge-policies/CopilotOnSensitiveContentEnabled
        verified: "2026-10-30"
      - id: shareBrowsingHistory
        name: ShareBrowsingHistoryWithCopilotSearchAllowed
        where: Edge policy › ShareBrowsingHistoryWithCopilotSearchAllowed
        setVia: [mdm]
        area: data
        default: Shared; users can turn it off
        recommended: Enabled
        why: Only tenant-approved work sites are shared to improve Microsoft 365 Copilot Search; regulated teams disable it so browsing history stays on the device.
        mitigations: []
        requires: Microsoft 365 Copilot licence
        url: https://learn.microsoft.com/en-us/deployedge/microsoft-edge-policies/ShareBrowsingHistoryWithCopilotSearchAllowed
        verified: "2026-10-30"
      - id: allowBrowsingWithCopilot
        name: AllowBrowsingWithCopilot
        where: Edge policy, or Edge management service › Copilot tab › Browse with Copilot
        setVia: [mdm, adminConsole]
        area: tools
        default: "Off; users can turn it on"
        recommended: Enabled for a pilot group only; Disabled for everyone else
        why: Copilot acting on sites in users' own sessions reaches only the people the firm is piloting it with, and the policy is the off switch.
        mitigations: [AML.M0029, cap-agent-kill-switch]
        requires: Microsoft 365 Copilot licence; preview outside the EEA
        url: https://learn.microsoft.com/en-us/deployedge/microsoft-edge-policies/AllowBrowsingWithCopilot
        verified: "2026-10-30"
      - id: browsingAllowList
        name: BrowsingWithCopilotAllowList
        where: Edge policy, or Edge management service › Browse with Copilot › Allowed sites
        setVia: [mdm, adminConsole]
        area: network
        default: Empty (browsing with Copilot unavailable)
        recommended: The work sites the pilot needs; the curated commonly used sites list only after review
        why: Copilot can browse and act only on origins the firm listed, and users cannot add any.
        mitigations: [cap-agent-egress-control, AML.M0028, D3-CTS, cap-agent-action-policy-enforcement]
        url: https://learn.microsoft.com/en-us/deployedge/microsoft-edge-policies/BrowsingWithCopilotAllowList
        verified: "2026-10-30"
      - id: browsingBlockList
        name: BrowsingWithCopilotBlockList
        where: Edge policy, or Edge management service › Browse with Copilot › Blocked sites
        setVia: [mdm, adminConsole]
        area: network
        default: No exceptions
        recommended: Banking, payment, HR and client-portal origins
        why: Sites where an agent action would move money or client data are excluded even if a broad allow list covers them.
        mitigations: [cap-agent-egress-control, cap-agent-action-policy-enforcement]
        url: https://learn.microsoft.com/en-us/deployedge/microsoft-edge-policies/BrowsingWithCopilotBlockList
        verified: "2026-10-30"
      - id: coworkToolActions
        name: CopilotCoworkToolActionsEnabled
        where: Edge policy › CopilotCoworkToolActionsEnabled
        setVia: [mdm]
        area: tools
        default: Users choose in Settings
        recommended: Disabled outside the Cowork pilot group
        why: Cowork cannot take actions in the browser for people who have not been through the pilot, and users cannot switch it on themselves.
        mitigations: [AML.M0029, AML.M0028, cap-agent-kill-switch]
        url: https://learn.microsoft.com/en-us/deployedge/microsoft-edge-policies/CopilotCoworkToolActionsEnabled
        verified: "2026-10-30"
      - id: builtInAiApis
        name: BuiltInAIAPIsEnabled
        where: Edge policy › BuiltInAIAPIsEnabled
        setVia: [mdm]
        area: tools
        default: Allowed
        recommended: Allowed
        why: Websites can use the browser's on-device language model APIs; nothing leaves the device through them, so regulated teams disable them only to remove the surface.
        mitigations: []
        url: https://learn.microsoft.com/en-us/deployedge/microsoft-edge-policies/BuiltInAIAPIsEnabled
        verified: "2026-10-30"
      - id: memoryPersonalization
        name: Enhanced personalization
        where: Microsoft Copilot enhanced personalization control (tenant or per user), or Microsoft Graph enhancedPersonalizationSetting
        setVia: [adminConsole, apiCli]
        area: data
        default: "On"
        recommended: "On; off for groups whose client data must not persist between chats"
        why: Copilot memory follows the firm's choice per group; administrators can search and delete memories but cannot restrict what is remembered.
        mitigations: [AML.M0031]
        url: https://learn.microsoft.com/en-us/microsoft-365/copilot/copilot-personalization-memory
        verified: "2026-10-30"
      - id: dlpCopilotPrompts
        name: DLP for Microsoft 365 Copilot — Restrict Copilot from processing content › Processing prompts
        where: Microsoft Purview › Data loss prevention › Policies › location "Microsoft 365 Copilot and Copilot Chat"
        setVia: [adminConsole]
        area: data
        default: No policy
        recommended: On, for the firm's sensitive information types (credentials, national IDs, client account numbers)
        why: A prompt in the Edge side pane carrying a sensitive type is refused before Copilot processes it.
        mitigations: [cap-sensitive-data-redaction]
        requires: Microsoft 365 E5 or Purview add-on
        url: https://learn.microsoft.com/en-us/purview/dlp-microsoft365-copilot-location-learn-about
        verified: "2026-10-30"
      - id: auditCopilotEdge
        name: Audit — CopilotInteraction (AppHost Edge)
        where: Microsoft Purview › Audit › CopilotInteraction, filtered on AppHost Edge
        setVia: [adminConsole, apiCli]
        area: audit
        recommended: On, streamed to the SIEM; alert on XPIADetected and JailbreakDetected
        why: Side-pane interactions, the resources they touched and the injection verdicts are searchable and alertable outside the browser.
        mitigations: [cap-agent-tracing, cap-input-guardrails]
        url: https://learn.microsoft.com/en-us/purview/audit-copilot
        verified: "2026-10-30"
      - id: inBrowserProtection
        name: In-browser protection (session policies)
        where: Defender for Cloud Apps session policies, enforced in the Edge for Business work profile
        setVia: [adminConsole]
        area: audit
        recommended: On for the firm's sanctioned cloud apps, monitoring upload, download and copy-paste
        why: The sessions Copilot acts in are monitored and constrained in the browser itself, which is where the agent's actions happen.
        mitigations: [D3-WSAA]
        requires: Microsoft Defender for Cloud Apps
        url: https://learn.microsoft.com/en-us/defender-cloud-apps/in-browser-protection
        verified: "2026-10-30"
